[project.optional-dependencies]
# Local AI support - for users who want to run LLMs locally
local-ai = [
    "llama-cpp-python==0.3.16",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    # Local RAG (shikari/ai/rag): embeddings and the vector index
    "faiss-cpu==1.15.1",
    "sentence-transformers==6.1.0",
]

# Desktop app window (shikari app). Linux also needs GTK (python3-gi, gir1.2-webkit2-4.1) or Qt
desktop = [
    "pywebview>=5.0",
    # Checks an organisation's server against the OS certificate store, as the window does
    "truststore>=0.9",
]

# Running the team server as a first-class Windows service (shikari.win_service); Windows only.
# Installed by deploy/packaging/build_server_pkg_windows.ps1 into the bundled interpreter.
service = [
    "pywin32==306; sys_platform == 'win32'",
]

# Data analysis and visualization tools
analysis = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=8.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

# Interactive visualizations
viz = [
    "bokeh==3.8.0",
    "panel==1.8.1",
    "folium==0.20.0",
    "branca==0.8.1",
]

# Geographic enrichment
geo = [
    "geoip2==5.1.0",
    "maxminddb==2.8.2",
]

# Development tools
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "autoflake>=2.2.0",
    "isort>=5.13.0",
]

# All optional dependencies
all = [
    "shikari[local-ai]",
    "shikari[analysis]",
    "shikari[viz]",
    "shikari[geo]",
    "shikari[dev]",
]

[project.urls]
Homepage = "https://github.com/yourusername/shikari"
Documentation = "https://github.com/yourusername/shikari/blob/main/README.md"
Repository = "https://github.com/yourusername/shikari"
Issues = "https://github.com/yourusername/shikari/issues"

[project.scripts]
shikari = "shikari.service:main"

[tool.setuptools]
packages = ["shikari"]

[tool.setuptools.package-data]
shikari = [
    "data/**/*",
    "static/**/*",
    "templates/**/*",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
  | \.eggs
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
