<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shikari — lab console</title>
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<style>
  :root{ --navy:#0D1B2A; --teal:#00D4AA; --amber:#F59E0B; --red:#EF4444;
         --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,'Courier New',monospace; }
  html,body{margin:0;height:100%;background:var(--navy);color:#cfe;font-family:var(--mono)}
  #bar{display:flex;align-items:center;gap:12px;padding:8px 14px;font-size:12px;
       border-bottom:1px solid rgba(0,212,170,.3);background:#0a1620}
  #bar .name{color:var(--teal);font-weight:700}
  #bar button{font-family:var(--mono);font-size:11px;background:transparent;color:var(--teal);
              border:1px solid rgba(0,212,170,.5);border-radius:3px;padding:2px 8px;cursor:pointer}
  #bar .ro{color:var(--amber);border:1px solid rgba(245,158,11,.5);padding:2px 8px;border-radius:3px;font-size:11px}
  #bar .state{margin-left:auto;padding:2px 8px;border-radius:3px;font-size:11px}
  .s-conn{color:var(--amber);border:1px solid rgba(245,158,11,.5)}
  .s-open{color:var(--teal);border:1px solid rgba(0,212,170,.5)}
  .s-shut{color:var(--red);border:1px solid rgba(239,68,68,.5)}
  #term{position:absolute;top:39px;left:0;right:0;bottom:0;padding:6px 8px}
</style>
</head>
<body>
<div id="bar">
  <span>Shikari lab console</span>
  <span class="name" id="who">—</span>
  <span class="ro" id="ro" hidden>VIEW-ONLY</span>
  <button id="share" hidden title="Copy a read-only link others can watch this session with">Copy read-only link</button>
  <span class="state s-conn" id="state">connecting…</span>
</div>
<div id="term"></div>
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/xterm-addon-fit.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var engine = q.get('engine') || '', name = q.get('name') || '', sid = q.get('sid') || '';
  var view = ['1','true','yes'].indexOf(q.get('view') || '') !== -1;   // read-only viewer
  document.getElementById('who').textContent = name ? (engine + ' · ' + name) : '(no machine)';
  document.title = (view ? 'Shikari console (view) — ' : 'Shikari console — ') + (name || '');
  if (view) document.getElementById('ro').hidden = false;

  var stateEl = document.getElementById('state');
  function setState(cls, text){ stateEl.className = 'state ' + cls; stateEl.textContent = text; }

  var term = new Terminal({ fontFamily: "'JetBrains Mono', ui-monospace, monospace", fontSize: 13,
                            disableStdin: view, cursorBlink: !view,
                            theme: { background: '#0D1B2A', foreground: '#cfe' } });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  fit.fit();

  if (!engine || !name){ term.write('\r\nNo engine/name in the URL. Open as ?engine=docker&name=<machine>\r\n'); setState('s-shut','no machine'); return; }

  var ws = null, attempts = 0, maxAttempts = 10, ended = false;

  function wsUrl(){
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    var u = proto + '://' + location.host + '/api/lab/console?engine=' +
            encodeURIComponent(engine) + '&name=' + encodeURIComponent(name);
    if (sid) u += '&sid=' + encodeURIComponent(sid);
    if (view) u += '&view=1';
    return u;
  }

  function sendResize(){
    fit.fit();
    if (view) return;   // a viewer never resizes the shared PTY
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type:'resize', rows: term.rows, cols: term.cols }));
  }

  // Once we have a session id (read-write owner only), offer a read-only link to share.
  function offerShare(){
    if (view || !sid) return;
    var btn = document.getElementById('share');
    btn.hidden = false;
    btn.onclick = function(){
      var nu = new URL(location); nu.searchParams.set('sid', sid); nu.searchParams.set('view', '1');
      navigator.clipboard.writeText(nu.toString()).then(function(){
        var t = btn.textContent; btn.textContent = 'Copied'; setTimeout(function(){ btn.textContent = t; }, 1500);
      }, function(){ prompt('Read-only link:', nu.toString()); });
    };
  }

  function connect(){
    setState('s-conn', attempts ? ('reconnecting… (' + attempts + ')') : 'connecting…');
    ws = new WebSocket(wsUrl());
    ws.binaryType = 'arraybuffer';

    ws.onopen = function(){ attempts = 0; setState('s-open','connected'); term.focus(); sendResize(); };

    ws.onmessage = function(ev){
      if (typeof ev.data === 'string'){
        var m = null; try { m = JSON.parse(ev.data); } catch(e){}
        if (m && m.type === 'session'){                 // remember the id so a reconnect reattaches
          sid = m.sid;
          var nu = new URL(location); nu.searchParams.set('sid', sid); history.replaceState(null, '', nu);
          offerShare();
          return;
        }
        if (m && m.type === 'exit'){ ended = true; return; }   // the shell itself closed
        term.write(ev.data);                            // plain text (e.g. a console-failed line)
        return;
      }
      term.write(new Uint8Array(ev.data));
    };

    ws.onclose = function(ev){
      if (ev.code === 4401){ setState('s-shut','closed (please log in)'); return; }
      if (ev.code === 4403){ setState('s-shut','closed (not your machine)'); return; }
      if (ended){ setState('s-shut','session ended'); term.write('\r\n\x1b[2m[session closed]\x1b[0m\r\n'); return; }
      if (attempts < maxAttempts){ attempts++; setState('s-conn','reconnecting… (' + attempts + ')'); setTimeout(connect, Math.min(1000 * attempts, 5000)); }
      else { setState('s-shut','disconnected'); term.write('\r\n\x1b[2m[disconnected — reload to retry]\x1b[0m\r\n'); }
    };

    ws.onerror = function(){ /* onclose handles the retry */ };
  }

  term.onData(function(d){ if (!view && ws && ws.readyState === 1) ws.send(d); });
  window.addEventListener('resize', sendResize);
  connect();
})();
</script>
</body>
</html>
