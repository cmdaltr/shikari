<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Archer machine</title>
<style>
  :root{
    --navy:#0D1B2A; --navy2:#081019; --teal:#00D4AA; --amber:#F59E0B; --red:#EF4444;
    --ink:#E6EEF2; --muted:#8aa0b0;
    --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 800px at 55% 25%, #163049 0%, #0d2036 50%, var(--navy2) 100%);
    color:var(--ink);font-family:var(--mono);overflow:hidden}
  #scene{position:fixed;inset:0}
  canvas{display:block}

  .label{font-family:var(--mono);font-size:11px;color:var(--ink);pointer-events:none;
    text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;letter-spacing:.3px;transition:opacity .3s}
  .label .s{display:block;font-size:9px;color:var(--teal);letter-spacing:.6px}
  .label.dim{opacity:.28}
  .nhead{display:inline-flex;align-items:center;gap:5px}
  .nico{width:13px;height:13px;flex:none}
  .nlogo{width:14px;height:14px;flex:none}

  header{position:fixed;top:0;left:0;right:0;padding:16px 20px;z-index:5;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;pointer-events:none}
  h1{font-size:18px;margin:0;letter-spacing:.5px}
  h1 .a{color:var(--teal)}
  .fig{font-size:11px;color:var(--muted);border:1px solid rgba(0,212,170,.3);padding:2px 8px;border-radius:3px}
  .hint{font-size:11px;color:var(--muted);margin-left:auto}

  /* narration banner */
  #story{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:6;
    width:min(680px,calc(100vw - 32px));text-align:center;pointer-events:none}
  #story .camp{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
  #story .step{font-size:13.5px;color:var(--ink);margin-top:5px;line-height:1.5;
    text-shadow:0 2px 8px rgba(0,0,0,.9)}

  /* controls */
  #ctl{position:fixed;left:0;right:0;bottom:16px;z-index:7;display:flex;gap:8px;
    justify-content:center;flex-wrap:wrap;padding:0 16px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--ink);cursor:pointer;
    background:rgba(10,21,33,.78);border:1px solid rgba(0,212,170,.3);border-radius:4px;
    padding:6px 11px;letter-spacing:.4px;backdrop-filter:blur(6px);transition:all .15s;user-select:none;
    display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--teal)}
  .chip.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
  .chip svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .chip.sep{background:none;border:none;cursor:default;color:var(--muted);padding:6px 2px}

  /* info panel */
  #info{position:fixed;top:60px;right:16px;width:290px;max-width:calc(100vw - 32px);z-index:8;
    background:rgba(8,17,26,.92);border:1px solid rgba(0,212,170,.35);border-radius:8px;
    padding:15px 17px;backdrop-filter:blur(10px);transform:translateX(130%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 18px 40px rgba(0,0,0,.5)}
  #info.show{transform:translateX(0)}
  #info .cat{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
  #info h2{font-size:15px;margin:3px 0 1px}
  #info .port{font-size:10.5px;color:var(--teal);margin:0 0 9px}
  #info p{font-size:12px;color:var(--ink);line-height:1.5;margin:0;opacity:.9}
  #info .x{position:absolute;top:9px;right:12px;cursor:pointer;color:var(--muted);font-size:16px}
  #info .x:hover{color:var(--ink)}
  @media (max-width:560px){.hint{display:none}}
</style>
</head>
<body>
<div id="scene"></div>

<header>
  <h1><span class="a">The Archer</span> machine</h1>
  <span class="fig">Fig &middot; Archer realm</span>
  <span class="hint">drag to orbit &middot; scroll to zoom &middot; click a landmark &middot; watch one campaign ride through at a time</span>
</header>

<div id="info">
  <span class="x" id="infoX">&times;</span>
  <div class="cat" id="iCat"></div>
  <h2 id="iName"></h2>
  <p class="port" id="iPort"></p>
  <p id="iDesc"></p>
</div>

<div id="story">
  <div class="camp" id="sCamp"></div>
  <div class="step" id="sStep"></div>
</div>

<div id="ctl">
  <span class="chip sep">Campaign:</span>
  <span class="chip jchip on" data-journey="group">Group hunt</span>
  <span class="chip jchip" data-journey="cve">CVE</span>
  <span class="chip jchip" data-journey="report">Report</span>
  <span class="chip sep">&middot;</span>
  <span class="chip" id="playBtn"><svg id="playIco"><rect x="6" y="5" width="3" height="14"/><rect x="15" y="5" width="3" height="14"/></svg><span id="playTxt">Pause</span></span>
  <span class="chip" id="nextBtn"><svg><path d="M5 5l9 7-9 7z"/><line x1="18" y1="5" x2="18" y2="19"/></svg>Next</span>
  <span class="chip" id="orbitBtn"><svg><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 3l3 3-3 3"/></svg>Orbit</span>
</div>

<script type="importmap">

}}
</script>

const mat = (c,o={}) => new THREE.MeshStandardMaterial({ color:c, metalness:o.m??0.15,
  roughness:o.r??0.8, emissive:o.e??0x000000, emissiveIntensity:o.ei??0, flatShading:o.flat??true,
  transparent:o.t??false, opacity:o.o??1 });

(function terrain(){
  const g = new THREE.PlaneGeometry(90,90,54,54);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i);
    const h = Math.sin(x*0.18)*Math.cos(y*0.16)*0.9 + Math.sin(x*0.05+y*0.07)*0.6;
    p.setZ(i, h - Math.max(0,(x*0.0)) );
  }
  g.computeVertexNormals();
  const ground = new THREE.Mesh(g, mat(C.grassDk,{r:1,flat:true}));
  ground.rotation.x = -Math.PI/2; ground.position.y = -0.4; scene.add(ground);
  // faint contour overlay
  const wire = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color:C.teal,wireframe:true,transparent:true,opacity:0.05}));
  wire.rotation.x = -Math.PI/2; wire.position.y = -0.38; scene.add(wire);
  // water to the west (where the longboat lands)
  const water = new THREE.Mesh(new THREE.PlaneGeometry(26,90),
    new THREE.MeshStandardMaterial({color:C.water,metalness:0.5,roughness:0.3,transparent:true,opacity:0.92}));
  water.rotation.x = -Math.PI/2; water.position.set(-30,-0.55,0); scene.add(water);
})();

const CYL=(rt,rb,h,s=8)=>new THREE.CylinderGeometry(rt,rb,h,s);
const BOX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const CONE=(r,h,s=6)=>new THREE.ConeGeometry(r,h,s);

function flag(col,h=2.6){
  const g=new THREE.Group();
  const pole=new THREE.Mesh(CYL(0.04,0.04,h,5),mat(0x3a4a57)); pole.position.y=h/2; g.add(pole);
  const b=new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.45),mat(col,{e:col,ei:0.25}));
  b.position.set(0.42,h-0.3,0); b.material.side=THREE.DoubleSide; g.add(b);
  return g;
}
function build(kind,col){

    const f=flag(col,2.2); f.position.y=1.7; g.add(f);
  } else if(kind==='labtent'){
    const t=new THREE.Mesh(CONE(1.1,1.6,6),mat(0x2a4a5a,{r:0.8})); t.position.y=0.8; g.add(t);
    const ch=new THREE.Mesh(CYL(0.16,0.2,0.8,6),mat(C.stoneDk)); ch.position.set(0.5,1.5,0); g.add(ch);
    const em=new THREE.Mesh(new THREE.SphereGeometry(0.14,10,10),mat(C.amber,{e:C.amber,ei:1.4})); em.position.set(0.5,2.0,0); g.add(em);
    g.add(flagless(col));
  } else if(kind==='keep'){
    const b=new THREE.Mesh(BOX(2.2,2.6,2.2),mat(C.stone,{r:0.9})); b.position.y=1.3; g.add(b);
    for(const sx of [-0.85,0.85]) for(const sz of [-0.85,0.85]){

    }

    const f=flag(C.teal,2.4); f.position.y=2.6; g.add(f);
  } else if(kind==='tower'||kind==='beacon'||kind==='oracle'){
    const h = kind==='oracle'?3.6:2.8;
    const body=new THREE.Mesh(CYL(0.62,0.72,h,8),mat(kind==='oracle'?0x24404f:C.stone,{r:0.85})); body.position.y=h/2; g.add(body);
    const roof=new THREE.Mesh(CONE(0.92,0.95,8),mat(kind==='oracle'?C.teal:col,{e:col,ei:0.35})); roof.position.y=h+0.45; g.add(roof);
    if(kind==='beacon'){
      const fire=new THREE.Mesh(new THREE.SphereGeometry(0.28,12,12),mat(C.amber,{e:C.amber,ei:1.6})); fire.position.y=h+0.45; g.add(fire);
      const pl=new THREE.PointLight(C.amber,0.8,10); pl.position.y=h+0.45; g.add(pl);

      const orb=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,16),mat(C.teal,{e:C.teal,ei:1.5})); orb.position.y=h+0.45; g.add(orb);

    const hut=new THREE.Mesh(BOX(1.9,1.2,1.5),mat(C.woodDk,{r:0.95})); hut.position.y=0.6; g.add(hut);
    const roof=new THREE.Mesh(CONE(1.5,0.8,4),mat(C.wood)); roof.position.y=1.55; roof.rotation.y=Math.PI/4; g.add(roof);
    const ch=new THREE.Mesh(CYL(0.16,0.2,0.7,6),mat(C.stoneDk)); ch.position.set(0.6,1.9,0); g.add(ch);
    const em=new THREE.Mesh(new THREE.SphereGeometry(0.18,12,12),mat(C.amber,{e:C.amber,ei:1.8})); em.position.set(0.6,2.35,0); g.add(em);
    const pl=new THREE.PointLight(C.amber,0.9,9); pl.position.set(0.6,2.2,0); g.add(pl);
    // arrow rack
    for(let i=0;i<3;i++){ const a=new THREE.Mesh(CYL(0.03,0.03,1.1,5),mat(C.teal,{e:C.teal,ei:0.3})); a.position.set(-0.9,0.9,-0.4+i*0.3); a.rotation.z=0.25; g.add(a); }
  } else if(kind==='vault'||kind==='armoury'){
    const base=new THREE.Mesh(BOX(1.5,0.8,1.1),mat(C.stoneDk,{r:0.9})); base.position.y=0.4; g.add(base);
    const lid=new THREE.Mesh(BOX(1.6,0.3,1.2),mat(col,{e:col,ei:0.25})); lid.position.y=0.95; g.add(lid);
    if(kind==='armoury'){ for(let i=0;i<5;i++){ const a=new THREE.Mesh(CYL(0.03,0.03,1.3,5),mat(C.teal,{e:C.teal,ei:0.4}));
      a.position.set(-0.5+i*0.25,1.3,0); a.rotation.z=(i-2)*0.12; const hd=new THREE.Mesh(CONE(0.08,0.2,5),mat(C.teal,{e:C.teal,ei:0.5})); hd.position.y=0.75; a.add(hd); g.add(a);} }

    for(let i=0;i<3;i++){ const f=flag([C.teal,C.amber,C.red][i],0.7); f.position.set(Math.cos(i*2.1)*0.5,0.5,Math.sin(i*2.1)*0.5); g.add(f); }
  } else if(kind==='target'){

    for(const a of [-0.5,0.5]){ const l=new THREE.Mesh(CYL(0.05,0.05,2.0,5),mat(C.woodDk)); l.position.set(a,0.9,0.2); l.rotation.x=0.2; legs.add(l);} g.add(legs);
    const face=new THREE.Group(); face.position.set(0,1.5,0); face.rotation.x=-0.25;

    const stripe=new THREE.Mesh(new THREE.PlaneGeometry(1.3,0.3),mat(C.red,{e:C.red,ei:0.2})); stripe.material.side=THREE.DoubleSide; stripe.position.set(0,1.3,0.01); g.add(stripe);
    for(let i=0;i<3;i++){ const sh=new THREE.Mesh(new THREE.CircleGeometry(0.2,12),mat([C.teal,C.amber,C.gold][i],{e:0x111,ei:0})); sh.position.set(-0.7+i*0.7,0.35,0.46); g.add(sh);}

    const base=new THREE.Mesh(CYL(1.6,1.9,0.6,6),mat(0x2a1414,{r:0.95})); base.position.y=0.3; g.add(base);
    const keep=new THREE.Mesh(CONE(1.0,2.4,5),mat(0x3a1a1a,{e:C.red,ei:0.15})); keep.position.y=1.7; g.add(keep);
    for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const sp=new THREE.Mesh(CONE(0.22,1.1,4),mat(0x241018)); sp.position.set(Math.cos(a)*1.4,0.8,Math.sin(a)*1.4); g.add(sp);
      const bn=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.5),mat(C.red,{e:C.red,ei:0.35})); bn.material.side=THREE.DoubleSide; bn.position.set(Math.cos(a)*1.4+0.18,1.2,Math.sin(a)*1.4); g.add(bn); }
    const fire=new THREE.Mesh(new THREE.SphereGeometry(0.3,12,12),mat(C.red,{e:C.red,ei:1.8})); fire.position.y=0.7; g.add(fire);
    const pl=new THREE.PointLight(C.red,1.0,12); pl.position.y=1.0; g.add(pl); g._fire=fire;

const pickMeshes=[];
const labelY={tent:2.6,labtent:2.2,boat:2.4,keep:3.4,tower:4.0,beacon:4.0,oracle:4.6,

  g.traverse(o=>{ if(o.isMesh) pickMeshes.push(o); });
});

function nodeTop(n){ return new THREE.Vector3(n.pos[0], 1.1, n.pos[1]); }
function makeHop(){
  const s=JOURNEYS[jkeys[ji]].steps;
  const a=nodeTop(NODE[s[hop][0]]), b=nodeTop(NODE[s[hop+1][0]]);
  const mid=a.clone().add(b).multiplyScalar(0.5); mid.y += 2.2 + a.distanceTo(b)*0.12;
  curve=new THREE.QuadraticBezierCurve3(a,mid,b);
}
function highlightJourney(){
  const s=JOURNEYS[jkeys[ji]].steps; const set=new Set(s.map(x=>x[0]));
  NODES.forEach(n=>{ n._el.classList.toggle('dim', !set.has(n.id)); n._onPath=set.has(n.id); });
}
function story(camp,txt){ document.getElementById('sCamp').textContent=camp; document.getElementById('sStep').textContent=txt; }
function startJourney(k){
  ji=jkeys.indexOf(k); hop=0; segT=0; phase='travel'; pauseT=0;
  document.querySelectorAll('.jchip').forEach(c=>c.classList.toggle('on',c.dataset.journey===k));
  highlightJourney(); makeHop();
  const s=JOURNEYS[k];
  story(s.label, s.steps[0][1]);
  NODE[s.steps[0][0]]._pulse=1;
}

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); const info=document.getElementById('info');
renderer.domElement.addEventListener('click', ev=>{
  const r=renderer.domElement.getBoundingClientRect();
  ptr.x=((ev.clientX-r.left)/r.width)*2-1; ptr.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickMeshes,false)[0];
  if(hit&&hit.object.userData.node){ const n=hit.object.userData.node;
    document.getElementById('iCat').textContent=n.port;
    document.getElementById('iName').textContent=n.name;
    document.getElementById('iPort').textContent=n.port;
    document.getElementById('iDesc').textContent=n.desc; info.classList.add('show');
  }
});

playBtn.onclick=()=>{ playing=!playing; setPlay(); };
document.getElementById('nextBtn').onclick=()=>{ advance(true); };
let orbit=false; const orbitBtn=document.getElementById('orbitBtn');
orbitBtn.onclick=()=>{ orbit=!orbit; controls.autoRotate=orbit; controls.autoRotateSpeed=0.6; orbitBtn.classList.toggle('on',orbit); };

function advance(manual){
  const s=JOURNEYS[jkeys[ji]].steps;
  if(hop < s.length-2){ hop++; segT=0; phase='travel'; makeHop(); }
  else { ji=(ji+1)%jkeys.length; startJourney(jkeys[ji]); }
}

// ---- resize / loop -------------------------------------------------------
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });

const clock=new THREE.Clock(); const tmp=new THREE.Vector3(), tmp2=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), tsec=clock.elapsedTime;
  const s=JOURNEYS[jkeys[ji]].steps;

  if(playing && curve){
    if(phase==='travel'){
      segT += dt*0.55;
      if(segT>=1){ segT=1; phase='pause'; pauseT=0;
        const arr=NODE[s[hop+1][0]]; arr._pulse=1; ping(arr); story(JOURNEYS[jkeys[ji]].label, s[hop+1][1]); }
      curve.getPointAt(Math.min(segT,1),tmp); messenger.position.copy(tmp);
      curve.getPointAt(Math.min(segT+0.02,1),tmp2); messenger.lookAt(tmp2);
      messenger.visible=true;
    } else {
      pauseT+=dt; messenger.visible=false;
      if(pauseT>1.1) advance(false);
    }
  }

  // node rings: on-path glow + arrival pulse
  NODES.forEach(n=>{
    const base = n._onPath ? 0.4 : 0.0;
    const op = Math.min(1, base + n._pulse*0.9);
    n._ring.material.opacity = op*(0.6+0.25*Math.sin(tsec*3));
    n._ring.scale.setScalar(1 + n._pulse*0.5);
    n._ring.material.color.setHex(n.id==='emulate'?0xEF4444:0x00D4AA);
    n._pulse*=0.94;
    if(n._g._fire) n._g._fire.scale.setScalar(0.9+0.25*Math.sin(tsec*6));
    if(n._g._ring) n._g._ring.rotation.z+=dt*0.8;
  });
  // pings expand & fade
  for(let i=pings.length-1;i>=0;i--){ const p=pings[i]; p.t+=dt*1.6;
    p.m.scale.setScalar(1+p.t*3); p.m.material.opacity=Math.max(0,0.9-p.t*0.9);
    if(p.t>=1){ scene.remove(p.m); pings.splice(i,1);} }
  if(messenger.visible){ messenger.children.forEach(c=>{}); }

  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
setPlay(); animate();
</script>
</body>
</html>
