<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Archer machine</title>
<style>
  :root{
    --navy:#0D1B2A; --navy2:#0a1521; --teal:#00D4AA; --amber:#F59E0B; --red:#EF4444;
    --ink:#E6EEF2; --muted:#7f93a3;
    --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
      radial-gradient(1200px 700px at 60% 30%, #12263a 0%, var(--navy) 55%, var(--navy2) 100%);
    color:var(--ink);font-family:var(--mono);overflow:hidden}
  #scene{position:fixed;inset:0}
  canvas{display:block}

  .label{font-family:var(--mono);font-size:11px;color:var(--ink);pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;letter-spacing:.3px;
    transition:opacity .25s}
  .label .s{display:block;font-size:9px;color:var(--teal);letter-spacing:1px}
  .label.dim{opacity:.18}
  .nhead{display:inline-flex;align-items:center;gap:5px}
  .nico{width:13px;height:13px;fill:none;stroke:var(--teal);stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .nlogo{width:14px;height:14px;stroke:none;flex:none}
  .chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:6px}

  header{position:fixed;top:0;left:0;right:0;padding:16px 20px;z-index:5;
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;pointer-events:none}
  h1{font-size:18px;margin:0;letter-spacing:.5px}
  h1 .a{color:var(--teal)}
  .fig{font-size:11px;color:var(--muted);border:1px solid rgba(0,212,170,.3);
    padding:2px 8px;border-radius:3px}
  .hint{font-size:11px;color:var(--muted);margin-left:auto}

  /* toolbar chips */
  #chips{position:fixed;left:0;right:0;bottom:16px;z-index:5;display:flex;gap:8px;
    justify-content:center;flex-wrap:wrap;padding:0 16px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--ink);cursor:pointer;
    background:rgba(13,27,42,.72);border:1px solid rgba(0,212,170,.3);border-radius:4px;
    padding:6px 11px;letter-spacing:.4px;backdrop-filter:blur(6px);transition:all .15s;user-select:none}
  .chip:hover{border-color:var(--teal)}
  .chip.on{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:700}
  .chip.tour.on{background:var(--amber);border-color:var(--amber)}

  /* info panel */
  #info{position:fixed;top:64px;right:16px;width:300px;max-width:calc(100vw - 32px);z-index:6;
    background:rgba(10,21,33,.9);border:1px solid rgba(0,212,170,.35);border-radius:8px;
    padding:16px 18px;backdrop-filter:blur(10px);transform:translateX(120%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 18px 40px rgba(0,0,0,.45)}
  #info.show{transform:translateX(0)}
  #info .cat{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--teal)}
  #info h2{font-size:15px;margin:4px 0 2px}
  #info .port{font-size:10.5px;color:var(--amber);margin:0 0 10px}
  #info p{font-size:12px;color:var(--ink);line-height:1.5;margin:0 0 10px;opacity:.9}
  #info .edges{font-size:10.5px;color:var(--muted);border-top:1px solid rgba(255,255,255,.08);
    padding-top:9px;line-height:1.6}
  #info .edges b{color:var(--teal);font-weight:400}
  #info .x{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:16px}
  #info .x:hover{color:var(--ink)}
  @media (max-width:560px){.hint{display:none}}
</style>
</head>
<body>
<div id="scene"></div>

<header>
  <h1><span class="a">The Archer</span> machine</h1>
  <span class="fig">Fig · Archer runtime</span>
  <span class="hint">drag to orbit · scroll to zoom · click a part · follow the flow of data along the links</span>
</header>

<div id="info">
  <span class="x" id="infoX">×</span>
  <div class="cat" id="iCat"></div>
  <h2 id="iName"></h2>
  <p class="port" id="iPort"></p>
  <p id="iDesc"></p>
  <div class="edges" id="iEdges"></div>
</div>

<div id="chips">
  <span class="chip" data-cat="store"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3 3 7 3s7-1.3 7-3V5"/><path d="M5 12c0 1.7 3 3 7 3s7-1.3 7-3"/></svg>Detection store</span>

  <span class="chip" data-cat="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Ollama / LLM</span>
  <span class="chip" data-cat="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 8a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-8V3"/></svg>Lab</span>
  <span class="chip" data-cat="assess"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>VECTR</span>
  <span class="chip tour" data-tour="1"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>Tour</span>
</div>

.958.958 0 0 1-.148.078c-.008 0-.015-.03-.015-.066a6.71 6.71 0 0 0-.097-.725C8.997 1.392 8.337.319 7.46.048a2.096 2.096 0 0 0-.585-.041Zm.293 1.402c.248.197.523.759.682 1.388.03.113.06.244.069.292.007.047.026.152.041.233.067.365.098.76.102 1.24l.002.475-.12.175-.118.178h-.278c-.324 0-.646.041-.954.124l-.238.06c-.033.007-.038-.003-.057-.144a8.438 8.438 0 0 1 .016-2.323c.124-.788.413-1.501.696-1.711.067-.05.079-.049.157.013zm9.825-.012c.17.126.358.46.498.888.28.854.36 2.028.212 3.145-.019.14-.024.151-.057.144l-.238-.06a3.693 3.693 0 0 0-.954-.124h-.278l-.119-.178-.119-.175.002-.474c.004-.669.066-1.19.214-1.772.157-.623.434-1.185.68-1.382.078-.062.09-.063.159-.012z', c:'#E6EEF2' },
};


// monoline icons per node (inner SVG, 24x24 viewBox)
const ICONS = {
  cli:'<path d="M4 6l5 5-5 5"/><path d="M12 16h8"/>',
  api:'<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  saw:'<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 8v8M6 12h7a3 3 0 0 0 3-3"/>',
  cat:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  lab:'<path d="M9 3h6M10 3v6l-5 8a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-8V3"/>',
  gen:'<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3"/>',
  llm:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  yaml:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  corr:'<path d="M9 13a4 4 0 0 0 6 .5l2-2a4 4 0 0 0-6-6l-1 1"/><path d="M15 11a4 4 0 0 0-6-.5l-2 2a4 4 0 0 0 6 6l1-1"/>',
  db:'<ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v14c0 1.7 3 3 7 3s7-1.3 7-3V5"/><path d="M5 12c0 1.7 3 3 7 3s7-1.3 7-3"/>',
  secops:'<path d="M12 3l7 3v5c0 4.5-3 7-7 9-4-2-7-4.5-7-9V6z"/>',
  mde:'<path d="M12 3l7 3v5c0 4.5-3 7-7 9-4-2-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
  splunk:'<path d="M6 7l6 5-6 5"/><path d="M13 7l5 5-5 5"/>',
  elastic:'<path d="M5 6h14"/><path d="M5 12h9"/><path d="M5 18h12"/>',
  vectr:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
};

// --- renderer / scene ------------------------------------------------------
const host = document.getElementById('scene');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0D1B2A, 26, 52);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(16, 15, 20);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
host.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none';
host.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(1, 0, 1.5);
controls.minDistance = 8;
controls.maxDistance = 46;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.AmbientLight(0x9fd7ca, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(8, 16, 10); scene.add(key);
const fill = new THREE.PointLight(0x00D4AA, 0.6, 60); fill.position.set(-8, 6, -8); scene.add(fill);

// grid floor
const grid = new THREE.GridHelper(44, 44, 0x1f3a52, 0x16293c);
grid.position.y = -2.4; scene.add(grid);

// --- build nodes -----------------------------------------------------------
const meshes = [];

NODES.forEach(n => {
  const s = n.size, w = 1.9*s, h = 1.0*s, d = 1.9*s;
  const geo = new THREE.BoxGeometry(w, h, d);
  const base = new THREE.Color(CAT_COLOR[n.cat]);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x12273b, emissive: base, emissiveIntensity: 0.12,
    metalness: 0.3, roughness: 0.55 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(n.pos[0], n.pos[1], n.pos[2]);
  mesh.userData = n;

  // teal wire edges
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: base }));
  edges.material.transparent = true; edges.material.opacity = 0.85;
  mesh.add(edges);

  // leg to the floor (a glowing drop line)
  const legY = n.pos[1] - h/2;
  const leg = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([ new THREE.Vector3(0,-h/2,0), new THREE.Vector3(0, -2.4 - n.pos[1], 0) ]),
    new THREE.LineBasicMaterial({ color: base, transparent:true, opacity:0.25 }));
  mesh.add(leg);

  // label
  const el = document.createElement('div');
  el.className = 'label';
  const mark = LOGOS[n.id]
    ? `<svg class="nlogo" viewBox="0 0 24 24" style="fill:${LOGOS[n.id].c}"><path d="${LOGOS[n.id].d}"/></svg>`
    : `<svg class="nico" viewBox="0 0 24 24">${ICONS[n.id]||''}</svg>`;
  el.innerHTML = `<span class="nhead">${mark}${n.name}</span><span class="s">${n.port}</span>`;
  n._lit = true; n._pulse = 0;
  const lbl = new CSS2DObject(el);
  lbl.position.set(0, h/2 + 0.5, 0);
  mesh.add(lbl);
  n._el = el;

  scene.add(mesh);
  meshes.push(mesh);
  n._mesh = mesh; n._mat = mat; n._edges = edges.material; n._base = base;
});

// --- edges + animated data-flow particles ----------------------------------
// Each link carries glowing packets from source to target: the direction *is*
// the pipeline, so you can watch a request move cli → api → saw/gen → SIEM.
const flows = [];
const pGeo = new THREE.SphereGeometry(0.13, 10, 10);
NODES.forEach(n => {
  (n.to||[]).forEach(tid => {
    const t = NODE[tid]; if (!t) return;
    const a = new THREE.Vector3(...n.pos), b = new THREE.Vector3(...t.pos);
    const mid = a.clone().add(b).multiplyScalar(0.5); mid.y += 1.6;
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(curve.getPoints(30)),
      new THREE.LineBasicMaterial({ color:0x00D4AA, transparent:true, opacity:0.20 }));
    line.userData.pair = [n.id, tid];
    scene.add(line);

    let col = CAT_COLOR[n.cat]; if (col === 0x8aa0b4) col = COL.teal;
    const parts = [];
    const count = 2;
    for (let k=0;k<count;k++){
      const pm = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({
        color: col, transparent:true, opacity:0.95,
        blending: THREE.AdditiveBlending, depthWrite:false }));
      scene.add(pm);
      parts.push({ mesh: pm, t: k/count });
    }
    const len = Math.max(a.distanceTo(b), 1);
    flows.push({ curve, parts, speed: 0.10 + 0.9/len/len, from:n, to:t, line });
  });
});

// --- 01–07 pipeline spine with a travelling pulse --------------------------
const spinePts = [[-7,2.2,-7],[-4,2.6,-6],[-1,2.9,-4.5],[1.5,3,-2.5],[4,3,0],[6.5,2.8,2.5],[8.5,2.4,5]];
const spineCurve = new THREE.CatmullRomCurve3(spinePts.map(p=>new THREE.Vector3(...p)));
scene.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(spineCurve.getPoints(80)),
  new THREE.LineBasicMaterial({ color: COL.amber, transparent:true, opacity:0.28 })));
spinePts.forEach((p,i)=>{
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.15,14,14),
    new THREE.MeshBasicMaterial({ color: COL.amber }));
  m.position.set(...p); scene.add(m);
  const el = document.createElement('div'); el.className='label'; el.style.opacity='.55';
  el.innerHTML = `<span class="s">${String(i+1).padStart(2,'0')}</span>`;
  const l = new CSS2DObject(el); l.position.set(...p); m.add(l);
});
const spineDot = new THREE.Mesh(new THREE.SphereGeometry(0.22,16,16),
  new THREE.MeshBasicMaterial({ color: COL.amber, transparent:true,
    blending: THREE.AdditiveBlending, depthWrite:false }));
scene.add(spineDot);
let spineT = 0;

// --- interaction ------------------------------------------------------------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let selected = null;
const info = document.getElementById('info');

function pick(ev){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.x = ((ev.clientX - r.left)/r.width)*2 - 1;
  ptr.y = -((ev.clientY - r.top)/r.height)*2 + 1;
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(meshes, false)[0];
  if (hit) select(hit.object.userData);
}
renderer.domElement.addEventListener('click', pick);

function select(n){
  selected = n;
  document.getElementById('iCat').textContent = n.cat;
  document.getElementById('iName').textContent = n.name;
  document.getElementById('iPort').textContent = n.port;
  document.getElementById('iDesc').textContent = n.desc;
  const outs = (n.to||[]).map(t=>NODE[t]?.name).filter(Boolean);
  const ins = NODES.filter(x=>(x.to||[]).includes(n.id)).map(x=>x.name);
  document.getElementById('iEdges').innerHTML =
    (ins.length? `<b>in ◂</b> ${ins.join(', ')}<br>`:'') +
    (outs.length? `<b>out ▸</b> ${outs.join(', ')}`:'');
  info.classList.add('show');
  focusOn(n);
}
document.getElementById('infoX').onclick = ()=>{
  info.classList.remove('show');
  selected = null;
};

// smooth camera focus
let focusTarget = null;
function focusOn(n){
  focusTarget = new THREE.Vector3(...n.pos);
}

// --- chips (category highlight + tour) -------------------------------------
let activeCat = null;
document.querySelectorAll('.chip[data-cat]').forEach(ch=>{
  ch.onclick = ()=>{
    const cat = ch.dataset.cat;
    const on = activeCat === cat;
    document.querySelectorAll('.chip[data-cat]').forEach(c=>c.classList.remove('on'));
    activeCat = on ? null : cat;
    if (!on) ch.classList.add('on');
    applyFilter();
  };
});
function applyFilter(){
  NODES.forEach(n=>{
    const lit = !activeCat || n.cat === activeCat;
    n._lit = lit;
    n._mat.opacity = lit ? 1 : 0.35; n._mat.transparent = !lit;
    n._edges.opacity = lit ? 0.85 : 0.12;
    n._el.classList.toggle('dim', !lit);
  });
}

// tour: orbit slowly through the nodes
let tour = false, tourI = 0, tourClock = 0;
const tourChip = document.querySelector('.chip.tour');
tourChip.onclick = ()=>{
  tour = !tour; tourChip.classList.toggle('on', tour);
  controls.autoRotate = tour; controls.autoRotateSpeed = 0.8;
  if (tour){ tourClock = 0; tourI = 0; select(NODES[0]); }
};

// --- resize / loop ----------------------------------------------------------
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (tour){
    tourClock += dt;
    if (tourClock > 2.6){ tourClock = 0; tourI = (tourI+1)%NODES.length; select(NODES[tourI]); }
  }
  if (focusTarget){
    controls.target.lerp(focusTarget, 0.06);
    if (controls.target.distanceTo(focusTarget) < 0.05) focusTarget = null;
  }

  const tsec = clock.elapsedTime;
  // node glow = base state + a decaying pulse when data arrives
  NODES.forEach(n=>{
    const base = (n===selected) ? 0.65 : (n._lit===false ? 0.03 : 0.12);
    n._mat.emissiveIntensity = base + n._pulse*0.6;
    n._pulse *= 0.90;
  });
  // flow packets travel source → target along each link
  flows.forEach(f=>{
    const dim = (f.from._lit===false || f.to._lit===false);
    f.line.material.opacity = dim ? 0.05 : 0.20;
    f.parts.forEach(p=>{
      p.t += f.speed*dt;
      if (p.t >= 1){ p.t -= 1; if (!dim) f.to._pulse = Math.min(1, f.to._pulse + 0.8); }
      f.curve.getPointAt(Math.min(p.t, 0.999), p.mesh.position);
      p.mesh.scale.setScalar(dim ? 0.3 : (0.8 + 0.4*Math.sin(tsec*6 + p.t*10)));
      p.mesh.material.opacity = dim ? 0.12 : 0.95;
    });
  });
  // amber pulse running the 01–07 pipeline spine
  spineT = (spineT + 0.08*dt) % 1;
  spineCurve.getPointAt(spineT, spineDot.position);
  spineDot.scale.setScalar(0.9 + 0.3*Math.sin(tsec*5));

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
