<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shikari hunt</title>
<style>
  :root{--navy:#0D1B2A;--navy2:#081019;--teal:#00D4AA;--amber:#F59E0B;--red:#EF4444;
    --gold:#C9A227;--gold2:#A8851F;
    --ink:#E6EEF2;--muted:#8aa0b0;--mono:'JetBrains Mono','SFMono-Regular',ui-monospace,'Courier New',monospace;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:radial-gradient(1300px 900px at 52% 18%, #2a3f4f 0%, #15283a 45%, var(--navy2) 100%);
    color:var(--ink);font-family:var(--mono);overflow:hidden}
  #scene{position:fixed;inset:0} canvas{display:block}
  .label{font-family:var(--mono);font-size:11px;color:var(--ink);pointer-events:none;
    text-shadow:0 1px 5px rgba(0,0,0,.95);white-space:nowrap;letter-spacing:.3px;transition:opacity .3s}
  .label .s{display:block;font-size:9px;color:var(--gold);letter-spacing:.6px}
  .label.dim{opacity:.32}
  header{position:fixed;top:0;left:0;right:0;padding:12px 20px;z-index:5;display:flex;
    align-items:center;gap:14px;flex-wrap:wrap;pointer-events:none}
  h1{font-size:18px;margin:0;letter-spacing:.5px;display:flex;align-items:center;gap:12px;font-weight:700}
  h1 img{height:40px;width:auto;display:block}
  h1 .t{color:var(--ink)} h1 .t b{color:var(--gold)}
  .fig{font-size:11px;color:var(--muted);border:1px solid rgba(201,162,39,.4);padding:2px 8px;border-radius:3px}
  .hint{font-size:11px;color:var(--muted);margin-left:auto}
  .tm{position:fixed;left:12px;bottom:12px;z-index:5;font-size:9.5px;color:var(--muted);pointer-events:none}
  #track{position:fixed;left:50%;bottom:142px;transform:translateX(-50%);z-index:6;
    width:min(940px,calc(100vw - 24px));display:flex;flex-wrap:wrap;gap:4px 5px;justify-content:center;pointer-events:none}
  .tk{font-size:10px;color:var(--muted);border:1px solid rgba(255,255,255,.14);border-radius:11px;
    padding:2px 8px;background:rgba(10,21,33,.55);transition:all .3s}
  .tk.done{color:var(--teal);border-color:rgba(0,212,170,.5)}
  .tk.cur{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
  .tk.opt{border-style:dashed}
  .tk.opt.done{color:var(--amber);border-color:rgba(245,158,11,.6)}
  .tk.opt.cur{background:var(--amber);border-color:var(--amber);color:var(--navy)}
  .tkar{color:var(--muted);font-size:10px;opacity:.45;align-self:center}
  #story{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:6;
    width:min(700px,calc(100vw - 32px));text-align:center;pointer-events:none}
  #story .camp{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  #story .step{font-size:13.5px;color:var(--ink);margin-top:5px;line-height:1.5;text-shadow:0 2px 8px rgba(0,0,0,.95)}
  #story .step.opt{color:var(--amber)}
  #ctl{position:fixed;left:0;right:0;bottom:16px;z-index:7;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--ink);cursor:pointer;background:rgba(10,21,33,.78);
    border:1px solid rgba(201,162,39,.35);border-radius:4px;padding:6px 11px;letter-spacing:.4px;
    backdrop-filter:blur(6px);transition:all .15s;user-select:none;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
  .chip.on:hover{background:var(--gold2);border-color:var(--gold2)}
  .chip svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .chip.sep{background:none;border:none;cursor:default;color:var(--muted);padding:6px 2px}
  #info{position:fixed;top:70px;right:16px;width:300px;max-width:calc(100vw - 32px);z-index:8;
    background:rgba(8,17,26,.92);border:1px solid rgba(201,162,39,.45);border-radius:8px;padding:15px 17px;
    backdrop-filter:blur(10px);transform:translateX(130%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 18px 40px rgba(0,0,0,.5)}
  #info.show{transform:translateX(0)}
  #info .cat{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  #info h2{font-size:15px;margin:3px 0 1px} #info .port{font-size:10.5px;color:var(--teal);margin:0 0 9px}
  #info p{font-size:12px;color:var(--ink);line-height:1.5;margin:0;opacity:.9}
  #info .x{position:absolute;top:9px;right:12px;cursor:pointer;color:var(--muted);font-size:16px}
  #info .x:hover{color:var(--ink)}
</style>
</head>

(function terrain(){
  const g=new THREE.PlaneGeometry(100,100,96,96); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);
    const h=Math.sin(x*0.13)*Math.cos(y*0.11)*0.8+Math.sin(x*0.045+y*0.06)*0.7+Math.cos(x*0.3)*0.12; p.setZ(i,h);}
  g.computeVertexNormals();
  const ground=new THREE.Mesh(g,mat(C.grassDk,{r:0.95})); ground.rotation.x=-Math.PI/2; ground.position.y=-0.45; ground.receiveShadow=true; scene.add(ground);
  const water=new THREE.Mesh(new THREE.PlaneGeometry(34,100),new THREE.MeshStandardMaterial({color:C.water,metalness:0.55,roughness:0.15,transparent:true,opacity:0.92}));
  water.rotation.x=-Math.PI/2; water.position.set(-34,-0.6,0); scene.add(water);
})();
const groundY=(wx,wz)=>-0.45+Math.sin(wx*0.13)*Math.cos(wz*0.11)*0.8+Math.sin(wx*0.045-wz*0.06)*0.7+Math.cos(wx*0.3)*0.12;

function mountain(x,z,r,h,snow=true){
  const g=new THREE.Group(); const gy=groundY(x,z);
  const m=new THREE.Mesh(CONE(r,h,7),mat(C.rock,{r:0.95,flat:true})); m.position.y=h/2; m.rotation.y=rnd()*6; g.add(m);
  if(snow){const sh=h*0.32,sr=r*(sh/h); const cap=new THREE.Mesh(CONE(sr*1.02,sh,7),mat(C.snow,{r:0.6,flat:true})); cap.position.y=h-sh/2+0.01; cap.rotation.y=m.rotation.y; g.add(cap);}
  g.position.set(x,gy-0.3,z); scene.add(shadowed(g)); return g;
}

(function pines(){
  const avoid=[[-15,-4.5],[-15,-0.5],[-21,12],[-9,0],[-17,7],[-10,6],[-9.5,-8],[-2,0],[-3,-7],[-5,4],[3,5],[4,-2],[11,-6],[12,-1],[12,4],[11,9],[6,9],[17,1]];
  let placed=0,tries=0;
  while(placed<46&&tries<900){tries++;
    const x=-16+rnd()*48,z=-22+rnd()*42;
    if(avoid.some(([ax,az])=>Math.hypot(ax-x,az-z)<4.2))continue;
    if(x>18&&Math.abs(z)<8)continue;
    const s=0.7+rnd()*0.7,g=new THREE.Group();
    const tr=new THREE.Mesh(CYL(0.08*s,0.11*s,0.6*s,6),mat(C.woodDk)); tr.position.y=0.3*s; g.add(tr);
    for(let i=0;i<3;i++){const c=new THREE.Mesh(CONE((0.75-i*0.18)*s,(1.0-i*0.12)*s,7),mat(C.pine,{flat:true,r:0.9})); c.position.y=(0.75+i*0.45)*s; g.add(c);}
    g.position.set(x,groundY(x,z),z); scene.add(shadowed(g)); placed++;}
})();

      const main=new THREE.Mesh(CYL(r*0.05,r*0.08,r*2.2,6),horn); main.position.y=r*1.1; beam.add(main);
      [[0.5,0.9],[1.1,-0.8],[1.7,0.7],[2.1,-0.5]].forEach(([y,a])=>{const t=new THREE.Mesh(CYL(r*0.03,r*0.05,r*0.75,5),horn); t.position.set(Math.sin(a)*r*0.32,r*y+r*0.3,0); t.rotation.z=-a; beam.add(t);});}}
  if(o.horns==='ibex'){for(const s of [-1,1]){const h=new THREE.Mesh(new THREE.TorusGeometry(r*1.05,r*0.11,6,16,Math.PI*0.95),horn); h.position.set(-r*0.95,r*0.3,s*r*0.2); h.rotation.set(0,0,-0.2); h.scale.set(1,1.15,1); head.add(h);}}
  if(o.horns==='goat'){for(const s of [-1,1]){const h=new THREE.Mesh(new THREE.TorusGeometry(r*0.5,r*0.08,6,12,Math.PI*0.75),horn); h.position.set(-r*0.45,r*0.3,s*r*0.2); h.rotation.set(0,0,0.15); head.add(h);}

function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function hex(c){return '#'+('000000'+c.toString(16)).slice(-6);}
function iconTexture(inner,col){
  const S=160,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  x.fillStyle='rgba(10,21,33,0.92)';roundRect(x,6,6,S-12,S-12,22);x.fill();
  x.strokeStyle='rgba(201,162,39,0.45)';x.lineWidth=3;x.stroke();
  const ds=[...inner.matchAll(/d="([^"]+)"/g)].map(m=>m[1]);
  const rects=[...inner.matchAll(/<rect[^>]*x="([\d.]+)"[^>]*y="([\d.]+)"[^>]*width="([\d.]+)"[^>]*height="([\d.]+)"[^>]*rx="([\d.]+)"/g)];
  const circles=[...inner.matchAll(/<circle[^>]*cx="([\d.]+)"[^>]*cy="([\d.]+)"[^>]*r="([\d.]+)"/g)];
  const ell=[...inner.matchAll(/<ellipse[^>]*cx="([\d.]+)"[^>]*cy="([\d.]+)"[^>]*rx="([\d.]+)"[^>]*ry="([\d.]+)"/g)];
  const scl=(S-56)/24;x.save();x.translate(28,28);x.scale(scl,scl);
  x.strokeStyle=hex(col);x.lineWidth=2;x.lineCap='round';x.lineJoin='round';
  ds.forEach(d=>{try{x.stroke(new Path2D(d));}catch(e){}});
  rects.forEach(m=>{const X=+m[1],Y=+m[2],W=+m[3],H=+m[4];x.beginPath();x.rect(X,Y,W,H);x.stroke();});
  circles.forEach(m=>{x.beginPath();x.arc(+m[1],+m[2],+m[3],0,7);x.stroke();});
  ell.forEach(m=>{x.beginPath();x.ellipse(+m[1],+m[2],+m[3],+m[4],0,0,7);x.stroke();});
  x.restore();const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
function logoTexture(url){
  const S=160,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  x.fillStyle='rgba(238,242,246,0.96)';roundRect(x,6,6,S-12,S-12,22);x.fill();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{const s=Math.min((S-40)/img.width,(S-40)/img.height),w=img.width*s,h=img.height*s;
    x.drawImage(img,(S-w)/2,(S-h)/2,w,h);t.needsUpdate=true;};img.src=url;return t;
}

function addFlag(n,H){
  const g=new THREE.Group(); g.position.set(n.pos[0],groundY(n.pos[0],n.pos[1]),n.pos[1]);
  const pole=new THREE.Mesh(CYL(0.035,0.045,H,8),mat(0x3a4a57,{m:0.4,r:0.5})); pole.position.y=H/2; pole.castShadow=true; g.add(pole);
  const knob=new THREE.Mesh(SPH(0.09),mat(C.gold,{m:0.5,r:0.4,e:C.gold,ei:0.25})); knob.position.y=H; g.add(knob);
  const pivot=new THREE.Group(); pivot.position.y=H-0.42; g.add(pivot);
  const tex=LOGO_IMG[n.id]?logoTexture(LOGO_IMG[n.id]):iconTexture(ICONS[n.id]||'',n.id==='emulate'?C.red:(n.opt?C.amber:C.teal));
  const banner=new THREE.Mesh(new THREE.PlaneGeometry(0.82,0.82),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));
  banner.position.set(0.5,0,0); pivot.add(banner); scene.add(g); banners.push(pivot); n._flag=g; return g;
}

const pickMeshes=[];
const topY={falconer:2.8,tent:2.7,horse:2.6,keep:4.6,peak:5.4,waterhole:1.8,furnace:3.4,mews:2.5,cairn:2.4,larder:2.2,cache:2.3,net:2.6,stag:3.0,ibex:2.8,roe:2.4,goat:2.5,lure:3.0,lair:3.6};
NODES.forEach(n=>{
  const gy=groundY(n.pos[0],n.pos[1]); n._gy=gy;
  const g=build(n); g.position.set(n.pos[0],gy,n.pos[1]); g.traverse(o=>{if(o.isMesh)o.userData.node=n;}); scene.add(g); n._g=g;
  const H=topY[n.kind]||2.6; n._H=H; addFlag(n,H);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.4,0.07,10,40),new THREE.MeshBasicMaterial({color:C.teal,transparent:true,opacity:0}));
  ring.rotation.x=-Math.PI/2; ring.position.set(n.pos[0],gy+0.03,n.pos[1]); scene.add(ring); n._ring=ring;
  const el=document.createElement('div'); el.className='label'; el.innerHTML=`${n.name}<span class="s">${n.port}</span>`;
  const lbl=new CSS2DObject(el); lbl.position.set(n.pos[0],gy+H+0.7,n.pos[1]); scene.add(lbl); n._el=el;
  g.traverse(o=>{if(o.isMesh)pickMeshes.push(o);});
});

const JOURNEYS={
 group:{label:'Group hunt',steps:[
  ['cli','You call a hunt on a named group. The falconer slips the jesses and the eagle leaves the glove.'],
  ['api','The eagle climbs over the hunting lodge, where the FastAPI app takes the request.'],
  ['saw','At the STIX forge, MITRESaw reads the group’s spoor: procedures and indicators out of ATT&CK STIX.'],
  ['gen','In the mews each technique is fitted out as a vendor-native query.'],
  ['yaml','Finished detections go into the kit store (data/groups).'],
  ['corr','The tracker ties single tracks into one trail: single- and cross-vendor playbooks.'],
  ['secops','The eagle stoops on the stag: YARA-L over UDM in Google SecOps.'],
  ['emulate','Optional: test the kill against the big game you emulate.',true]]},
 cve:{label:'CVE',steps:[
  ['webui','You raise a CVE at the hunt camp (web UI).'],
  ['api','The lodge resolves it to the techniques it opens up.'],
  ['saw','The STIX forge reads the exploitation behaviour from STIX.'],
  ['gen','The mews fits a detection query to each technique.'],
  ['yaml','Detections go into the kit store.'],
  ['mde','The eagle stoops on the ibex: KQL in Defender XDR.'],
  ['emulate','Optional: test the kill against the big game.',true]]},
 report:{label:'Report',steps:[
  ['report','A rider comes up from the river with a threat report.'],
  ['cat','From the lookout peak (Catalogue · Exposure), OSINT shows who is watching your ground.'],
  ['api','The lodge pulls techniques and IOCs from the report.'],
  ['gen','The mews fits queries to the evidence.'],
  ['yaml','Detections go into the kit store.'],
  ['elastic','The eagle stoops on the mountain goat: ES|QL in Elastic.'],
  ['emulate','Optional: test the kill against the big game.',true]]},
};
const jkeys=['group','cve','report'];

// the hunting bird is the request travelling through the system
const eagle=bateleur(); eagle.scale.setScalar(1.15); eagle.add(new THREE.PointLight(C.gold,0.6,6)); shadowed(eagle); scene.add(eagle);

let ji=0,atNode=0,segT=0,phase='travel',pauseT=0,playing=true,endWait=0;
let pathCurves=[],pathLines=[];
const nodeTop=n=>new THREE.Vector3(n.pos[0],(n._gy??groundY(n.pos[0],n.pos[1]))+1.6,n.pos[1]);
function buildPath(){
  pathLines.forEach(o=>scene.remove(o.line)); pathLines=[]; pathCurves=[];
  const s=JOURNEYS[jkeys[ji]].steps;
  for(let i=0;i<s.length-1;i++){
    const a=nodeTop(NODE[s[i][0]]),b=nodeTop(NODE[s[i+1][0]]);
    const mid=a.clone().add(b).multiplyScalar(0.5); mid.y+=3.0+a.distanceTo(b)*0.14;
    const cv=new THREE.QuadraticBezierCurve3(a,mid,b); pathCurves.push(cv);
    const opt=!!s[i+1][2];
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(cv.getPoints(30)),
      new THREE.LineBasicMaterial({color:opt?0xF59E0B:0x00D4AA,transparent:true,opacity:0.1}));
    scene.add(line); pathLines.push({line,opt});
  }
}
function buildTracker(){
  const s=JOURNEYS[jkeys[ji]].steps;
  document.getElementById('track').innerHTML=s.map((st,i)=>
    `<span class="tk${st[2]?' opt':''}" data-i="${i}">${SHORT[st[0]]}</span>`+(i<s.length-1?'<span class="tkar">→</span>':'')).join('');
}
function updateTracker(idx){document.querySelectorAll('#track .tk').forEach(c=>{const i=+c.dataset.i;
  c.classList.toggle('done',i<=idx);c.classList.toggle('cur',i===idx);});}
function highlightJourney(){const set=new Set(JOURNEYS[jkeys[ji]].steps.map(x=>x[0]));
  NODES.forEach(n=>{n._el.classList.toggle('dim',!set.has(n.id));n._onPath=set.has(n.id);n._visited=false;});}
function story(c,t,opt){document.getElementById('sCamp').textContent=c;const el=document.getElementById('sStep');el.textContent=t;el.classList.toggle('opt',!!opt);}
function arriveAt(idx){const s=JOURNEYS[jkeys[ji]].steps,n=NODE[s[idx][0]];
  n._pulse=1;n._visited=true;if(idx>0)pathLines[idx-1].line.material.opacity=0.9;
  ping(n,s[idx][2]);story(JOURNEYS[jkeys[ji]].label,s[idx][1],s[idx][2]);updateTracker(idx);atNode=idx;}
function startJourney(k){ji=jkeys.indexOf(k);atNode=0;segT=0;phase='travel';pauseT=0;endWait=0;
  document.querySelectorAll('.jchip').forEach(c=>c.classList.toggle('on',c.dataset.journey===k));
  highlightJourney();buildPath();buildTracker();updateTracker(0);
  const s=JOURNEYS[k];story(s.label,s.steps[0][1],s.steps[0][2]);const a=NODE[s.steps[0][0]];a._pulse=1;a._visited=true;}
const pings=[];
function ping(n,opt){const m=new THREE.Mesh(new THREE.TorusGeometry(0.4,0.06,10,32),new THREE.MeshBasicMaterial({color:opt?0xF59E0B:0xC9A227,transparent:true,opacity:0.9}));
  m.rotation.x=-Math.PI/2;m.position.set(n.pos[0],(n._gy??groundY(n.pos[0],n.pos[1]))+0.12,n.pos[1]);scene.add(m);pings.push({m,t:0});}
NODES.forEach(n=>{n._pulse=0;n._onPath=false;n._visited=false;});
startJourney('group');

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();const info=document.getElementById('info');
renderer.domElement.addEventListener('click',ev=>{const r=renderer.domElement.getBoundingClientRect();
  ptr.x=((ev.clientX-r.left)/r.width)*2-1;ptr.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickMeshes,false)[0];
  if(hit&&hit.object.userData.node){const n=hit.object.userData.node;
    document.getElementById('iCat').textContent=n.port;document.getElementById('iName').textContent=n.name;
    document.getElementById('iPort').textContent=SHORT[n.id]+(n.opt?' · optional':'');document.getElementById('iDesc').textContent=n.desc;info.classList.add('show');}});
document.getElementById('infoX').onclick=()=>info.classList.remove('show');
document.querySelectorAll('.jchip').forEach(c=>c.onclick=()=>{playing=true;setPlay();startJourney(c.dataset.journey);});
function setPlay(){document.getElementById('playTxt').textContent=playing?'Pause':'Play';
  document.getElementById('playIco').innerHTML=playing?'<rect x="6" y="5" width="3" height="14"></rect><rect x="15" y="5" width="3" height="14"></rect>':'<path d="M6 4l14 8-14 8z"></path>';}
document.getElementById('playBtn').onclick=()=>{playing=!playing;setPlay();};
document.getElementById('nextBtn').onclick=()=>nextStep();
let orbit=false;const orbitBtn=document.getElementById('orbitBtn');
orbitBtn.onclick=()=>{orbit=!orbit;controls.autoRotate=orbit;controls.autoRotateSpeed=0.6;orbitBtn.classList.toggle('on',orbit);};
function nextStep(){const s=JOURNEYS[jkeys[ji]].steps;if(atNode<s.length-1){arriveAt(atNode+1);segT=0;phase='travel';pauseT=0;}else{ji=(ji+1)%jkeys.length;startJourney(jkeys[ji]);}}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock(),tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
function flap(ts,amp,base){eagle._wings.forEach(w=>{const a=Math.sin(ts*9)*amp;w.pv.rotation.z=w.s*(base+a);w.tip.rotation.z=w.s*(a*0.6);});}
function perchEagle(n,ts){
  // between flights the eagle settles on the current landmark's flag
  tmp.set(n.pos[0],(n._gy??0)+n._H+0.35,n.pos[1]); eagle.position.lerp(tmp,0.15);
  eagle.rotation.set(0,Math.atan2(camera.position.x-tmp.x,camera.position.z-tmp.z)+Math.PI/2,0);
  flap(ts,0.05,-0.35);
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05),ts=clock.elapsedTime;
  const s=JOURNEYS[jkeys[ji]].steps;
  if(playing){
    if(atNode<s.length-1){
      const curve=pathCurves[atNode];
      if(phase==='travel'){segT+=dt*0.38;
        const u=Math.min(segT,1);curve.getPointAt(u,tmp);eagle.position.copy(tmp);
        curve.getPointAt(Math.min(u+0.02,1),tmp2);if(tmp2.distanceToSquared(tmp)>1e-6)eagle.lookAt(tmp2);
        // climb with strong beats, glide over the top, then fold into the stoop
        if(u<0.4)flap(ts,0.55,0.1); else if(u<0.72)flap(ts,0.12,0.05); else flap(ts,0.05,-0.45);
        if(segT>=1){arriveAt(atNode+1);phase='pause';pauseT=0;}}
      else{pauseT+=dt;perchEagle(NODE[s[atNode][0]],ts);if(pauseT>1.4){segT=0;phase='travel';}}
    } else {endWait+=dt;perchEagle(NODE[s[atNode][0]],ts);if(endWait>2.6){ji=(ji+1)%jkeys.length;startJourney(jkeys[ji]);}}
  } else if(phase==='pause'||atNode>=s.length-1){perchEagle(NODE[s[atNode][0]],ts);}
  NODES.forEach(n=>{const base=n._visited?0.42:(n._onPath?0.12:0);const op=Math.min(1,base+n._pulse*0.8);
    const oc=(n.id==='emulate'||n.opt)?0xF59E0B:0x00D4AA;
    n._ring.material.opacity=op*(0.65+0.2*Math.sin(ts*3));n._ring.scale.setScalar(1+n._pulse*0.5);
    n._ring.material.color.setHex(n.id==='emulate'?0xEF4444:(n._pulse>0.25?0xC9A227:oc));n._pulse*=0.945;
    if(n._g._fire)n._g._fire.scale.setScalar(0.9+0.25*Math.sin(ts*6));
    if(n._g._ring)n._g._ring.rotation.z+=dt*0.8;
    if(n._g._swing){n._g._swing.rotation.z=Math.sin(ts*2.3)*0.85;n._g._swing.rotation.x=Math.cos(ts*2.3)*0.35;}});
  banners.forEach(b=>{b.getWorldPosition(tmp);b.rotation.y=Math.atan2(camera.position.x-tmp.x,camera.position.z-tmp.z);});
  for(let i=pings.length-1;i>=0;i--){const p=pings[i];p.t+=dt*1.6;p.m.scale.setScalar(1+p.t*3);
    p.m.material.opacity=Math.max(0,0.9-p.t*0.9);if(p.t>=1){scene.remove(p.m);pings.splice(i,1);}}
  controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera);}
setPlay();animate();
</script>
</body>
</html>
