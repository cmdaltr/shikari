[pytest]
# Pytest configuration for Archer tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    ui: UI tests using Playwright (slow)
    api: API endpoint tests (fast)
    integration: Integration tests
    unit: Unit tests
    web: Web API integration tests
    slow: Tests that take a long time to run
    network: Tests that require network access
    feature: End-to-end feature tests
    requires_atomic: Tests that require Atomic Red Team
    requires_vectr: Tests that require VECTR
    requires_openai: Tests that require OpenAI API key

# Playwright specific options
playwright_timeout = 30000

# Coverage options (if using pytest-cov)
[coverage:run]
source = archer
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
