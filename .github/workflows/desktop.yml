# The installable desktop app (desktop/README.md): a .dmg and a Windows .msi per architecture, and a
# Linux .deb, built from a clean checkout so nothing gitignored (bespoke/, data/shikari.db) can
# reach them. A v* tag attaches them to a GitHub Release; a manual run leaves them in the Actions
# cache (keyed by run id). Packages pass between jobs through the cache, not Actions-artifact storage,
# whose 500 MB free quota a busy sibling repo can fill and block every upload here.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build on a manual run (a v* tag always builds all)"
        type: choice
        default: linux
        options: [linux, macos, windows, windows-arm64, all]
      procedures:
        description: "Bundle MITRESaw's procedures CSV (up to ~90 min when ATT&CK changed and it isn't cached)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHON: "3.11"
  BRIEFCASE: "0.4.7"

jobs:
  setup:
    # Pick the build/smoke matrix from the manual input; a tag always builds every platform. This keeps
    # an iteration run from spinning up all six runners (macOS bills at 10x, Windows 2x) when you only
    # need one. Default is linux-only (1x).
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.m.outputs.build }}
      smoke: ${{ steps.m.outputs.smoke }}
    steps:
      - id: m
        env:
          SEL: ${{ github.event_name == 'push' && 'all' || inputs.platforms }}
        run: |
          build_all='[
            {"os":"macos-15","target":"macOS","sign":"--adhoc-sign","suffix":"macos-arm64"},
            {"os":"macos-15-intel","target":"macOS","sign":"--adhoc-sign","suffix":"macos-x86_64"},
            {"os":"windows-latest","target":"windows","sign":"--adhoc-sign","suffix":"windows-x64"},
            {"os":"windows-11-arm","target":"windows","sign":"--adhoc-sign","suffix":"windows-arm64","experimental":true},
            {"os":"ubuntu-22.04","target":"linux","sign":"","suffix":"linux-amd64"},
            {"os":"ubuntu-22.04-arm","target":"linux","sign":"","suffix":"linux-arm64"}]'
          smoke_all='[
            {"os":"macos-15","suffix":"macos-arm64"},
            {"os":"windows-latest","suffix":"windows-x64"},
            {"os":"windows-11-arm","suffix":"windows-arm64","experimental":true},
            {"os":"ubuntu-24.04","suffix":"linux-amd64"},
            {"os":"ubuntu-24.04-arm","suffix":"linux-arm64"}]'
          case "$SEL" in
            all)           sel="macos-arm64 macos-x86_64 windows-x64 windows-arm64 linux-amd64 linux-arm64" ;;
            macos)         sel="macos-arm64 macos-x86_64" ;;
            windows)       sel="windows-x64" ;;
            windows-arm64) sel="windows-arm64" ;;
            *)             sel="linux-amd64 linux-arm64" ;;   # linux (and the default)
          esac
          keep=$(jq -cn --arg s "$sel" '$s | split(" ")')
          echo "build=$(jq -c --argjson k "$keep" 'map(select(.suffix as $x | $k|index($x)))' <<<"$build_all")" >> "$GITHUB_OUTPUT"
          echo "smoke=$(jq -c --argjson k "$keep" 'map(select(.suffix as $x | $k|index($x)))' <<<"$smoke_all")" >> "$GITHUB_OUTPUT"

  seed:
    # The reference data every build bundles: the ATT&CK bundle and the procedures CSV built from it
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MITRESAW_DIR: ${{ github.workspace }}/MITRESaw
    steps:
      # The runner context isn't available to job-level env
      - run: |
          echo "SHIKARI_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "MITRESAW_PYTHON=$RUNNER_TEMP/mitresaw/bin/python" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cmdaltr/MITRESaw
          path: MITRESaw
      - uses: actions/setup-python@v5
        with:
          # MITRESaw's pins need 3.12 (ipython 9.11); the last listed is the default
          python-version: |
            3.12
            ${{ env.PYTHON }}

      - name: Download ATT&CK
        id: attack
        run: |
          cache="$SHIKARI_HOME/shikari/data/cache"
          mkdir -p "$cache" "$SHIKARI_HOME/data"
          curl -fsSL -o "$cache/enterprise-attack.json" \
            https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
          version=$(python -c "import re,sys; t=open(sys.argv[1]).read(); m=re.search(r'\"type\":\s*\"x-mitre-collection\".*?\"x_mitre_version\":\s*\"([^\"]+)\"', t, re.S); print(m.group(1) if m else 'unknown')" "$cache/enterprise-attack.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mitresaw=$(git -C MITRESaw rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ATT&CK v$version"

      - name: Restore the procedures CSV
        id: cache
        if: github.event_name == 'push' || inputs.procedures
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/home/data/mitre_procedures.*
          key: procedures-attack${{ steps.attack.outputs.version }}-mitresaw${{ steps.attack.outputs.mitresaw }}-${{ hashFiles('shikari/mitre/procedures.py') }}

      - name: Build the procedures CSV (MITRESaw)
        if: (github.event_name == 'push' || inputs.procedures) && steps.cache.outputs.cache-hit != 'true'
        env:
          # The CUDA torch wheels (several GB, twice over) filled the runner's disk; nothing here needs a GPU
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_NO_CACHE_DIR: "1"
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          pip install -r requirements.txt
          # MITRESaw pins its own pandas/stix2, so it gets its own environment (shikari.mitre.procedures)
          python3.12 -m venv "${{ runner.temp }}/mitresaw"
          "$MITRESAW_PYTHON" -m pip install -r MITRESaw/requirements.txt
          python -m shikari.mitre.procedures --full

      - name: Collect
        run: |
          mkdir seed
          cp "$SHIKARI_HOME/shikari/data/cache/enterprise-attack.json" seed/
          cp "$SHIKARI_HOME"/data/mitre_procedures.* seed/ 2>/dev/null || echo "No procedures CSV: the app works without it, minus threat briefings"
          ls -la seed
      # Hand the seed to the build jobs through the Actions cache, not an artifact: cache has its own
      # 10 GB quota, separate from the 500 MB Actions-artifact storage a busy sibling repo can fill.
      - uses: actions/cache/save@v4
        with:
          path: seed
          key: seed-${{ github.run_id }}
          # Windows caches are partitioned from Unix ones; the build matrix spans both
          enableCrossOsArchive: true

  build:
    needs: [setup, seed]
    # Legs chosen by the setup job. Build on the oldest Ubuntu it supports (the compiled GTK bindings
    # link against its libraries) and smoke-test on the newest; Briefcase builds for the machine it runs
    # on, so Windows ARM64 needs its own ARM64 runner.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.build) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
      - uses: actions/cache/restore@v4
        with:
          path: seed
          key: seed-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # desktop/stage.py compiles the dependencies with no Windows ARM64 wheel; two are Rust
      - name: Rust (Windows ARM64)
        if: matrix.suffix == 'windows-arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Stage
        run: |
          procedures=$(ls seed/mitre_procedures.csv seed/mitre_procedures.meta.json 2>/dev/null || true)
          python desktop/stage.py --out "$RUNNER_TEMP/desktop" --attack seed/enterprise-attack.json \
            ${procedures:+--procedures $procedures}

      - name: Package
        working-directory: ${{ runner.temp }}/desktop
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # Not Briefcase: its system package runs on the distro's Python. desktop/build_deb.py bundles
            # one; PyGObject and pycairo compile against the distro's GTK headers
            # GitHub's apt mirror resolves intermittently; retry before giving up
            ok=
            for i in 1 2 3; do
              sudo apt-get update -qq \
                && sudo apt-get install -y -qq libcairo2-dev libgirepository1.0-dev pkg-config \
                && { ok=1; break; }
              echo "apt failed (attempt $i/3), retrying in 15s"; sleep 15
            done
            [ -n "$ok" ] || { echo "apt-get failed after 3 attempts"; exit 1; }
            python "$GITHUB_WORKSPACE/desktop/build_deb.py" --stage . --out dist
            exit 0
          fi
          python -m pip install "briefcase==$BRIEFCASE"
          briefcase package ${{ matrix.target }} ${{ matrix.sign }} --no-input

      - name: Name by platform
        working-directory: ${{ runner.temp }}/desktop
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in dist/*; do
            # A .deb's name already says its architecture
            base=$(basename "$f"); [[ $base == *.deb ]] && { mv "$f" "$GITHUB_WORKSPACE/out/"; continue; }
            mv "$f" "$GITHUB_WORKSPACE/out/${base%.*}-${{ matrix.suffix }}.${base##*.}"
          done
          ls -la "$GITHUB_WORKSPACE/out"
      # Pass the built package to smoke and release through the cache, same reason as the seed.
      - uses: actions/cache/save@v4
        with:
          path: out
          key: pkg-${{ github.run_id }}-${{ matrix.suffix }}
          enableCrossOsArchive: true

  smoke:
    # Install each package on a clean runner and check it serves Shikari in local mode. One platform's
    # failed build shouldn't hide whether the others work; the release still needs every build
    needs: [setup, build]
    if: ${{ !cancelled() }}
    # Experimental legs (Windows ARM64) stay best-effort — pythonnet's .NET Framework loader has no ARM64 build.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.smoke) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SHIKARI_SERVER: local
      PYWEBVIEW_LOG: debug
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: pkg-${{ github.run_id }}-${{ matrix.suffix }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # Only the install scripts, which install the package as a user would
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
          path: src

      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          sh src/desktop/install.sh --file out/*.dmg
          echo "APP=/Applications/Shikari.app/Contents/MacOS/Shikari" >> "$GITHUB_ENV"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          # msiexec started from Git Bash never returns, so the script runs from PowerShell, as a user's would
          powershell -NoProfile -ExecutionPolicy Bypass -File src\desktop\install.ps1 -File (Get-ChildItem out\*.msi).FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Per-user install; don't recurse all of Program Files (minutes on ARM64)
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 4 -Filter Shikari.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { exit 1 }
          "APP=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Bundled git (Windows)
        if: runner.os == 'Windows'
        run: |
          # The runner has its own git, so check the installer's copy by path
          git_exe=$(dirname "$APP")/app/mingit/cmd/git.exe
          "$git_exe" --version

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          ok=
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb && { ok=1; break; }
            echo "apt failed (attempt $i/3), retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "apt-get failed after 3 attempts"; exit 1; }
          sh src/desktop/install.sh --file out/*.deb
          echo "APP=shikari" >> "$GITHUB_ENV"

      - name: Launch in local mode
        timeout-minutes: 12
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" shikari > app.out 2>&1 &
          else
            "$APP" > app.out 2>&1 &
          fi
          # The first launch seeds the data folder and builds caches before the server answers
          for _ in $(seq 1 120); do
            body=$(curl -sf http://127.0.0.1:32453/health) && break
            sleep 5
          done
          echo "$body"
          [[ $body == *'"app":"shikari"'* ]] || { cat app.out; exit 1; }

      - name: Logs
        if: always()
        run: |
          case "$RUNNER_OS" in
            macOS) home="$HOME/Library/Application Support/Shikari/home" ;;
            Windows) home="$LOCALAPPDATA/Shikari/home" ;;
            Linux) home="$HOME/.local/share/shikari/home" ;;
          esac
          grep -E "pywebview|Shikari starting|\.NET|Edge|Traceback|Error|failed" "$home/logs/shikari.log" | head -60 || true
          tail -40 "$home/logs/shikari.log" || true
          cat app.out 2>/dev/null | tail -40 || true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Gather every released leg's package from its per-run cache (windows-arm64 is experimental,
      # not released, so it isn't restored). Each leg saved only its own file under path out/, so the
      # restores accumulate into one out/ directory. A leg that failed to build simply misses.
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: pkg-${{ github.run_id }}-macos-arm64
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: pkg-${{ github.run_id }}-macos-x86_64
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: pkg-${{ github.run_id }}-windows-x64
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: pkg-${{ github.run_id }}-linux-amd64
          enableCrossOsArchive: true
      - uses: actions/cache/restore@v4
        with:
          path: out
          key: pkg-${{ github.run_id }}-linux-arm64
          enableCrossOsArchive: true
      # What desktop/install.sh and install.ps1 check a download against
      - run: cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          # Land assets on a draft release; publishing is a deliberate manual step, never automatic
          # on a tag push (so re-pointing a tag to rebuild can't put a release live by itself).
          draft: true
