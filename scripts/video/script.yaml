# The Shikari walkthrough video: narration and what happens on screen, scene by scene.
# scripts/video/make_video.py speaks each scene's narration with Piper, records the actions in a browser
# spread across that time, and joins the scenes into one video with subtitles.
#
# chapter: the scene's YouTube chapter title. Actions: goto <path> · click <selector> · type [<selector>, <text>] · show <selector> (scroll to it and
# pulse a highlight round it) · scroll <pixels> · guide (open the in-app guide) · key <key>
# at: <0..1> on an action fires it at that fraction of the scene's narration, so a highlight lands on the
# beat the words describe it (without it, actions are spread evenly across the scene). The leading goto
# stays unpinned and fires at 0; pin the show/type/click beats where their subject is spoken.
# Record against a throwaway instance with sample data (see scripts/guide/capture.py), never a real one.
#
# Fades: a scene normally fades in from black and out to black, so it's a self-contained section — start
# it on its own page with a `goto`. `continues: true` instead joins a scene to the one before it with NO
# black between them: a pause and a scroll down the SAME page, not a cut. Use it for consecutive beats on
# one page (scrolling a form, or a results page) and drop the leading `goto` so the page isn't reloaded.
# A run of continuing scenes fades in on the first and out on the last; everything inside is one shot.

# How the voice should say what the subtitles spell
say:
  Shikari: shih-car-ee
  APT29: eigh P T twenty-nine
  ATT&CK: Attack
  MITRE: Miter
  MITRESaw: Miter Saw
  SIEMs: sims
  SIEM: sim
  SecOps: Sec Ops
  KQL: K Q L
  SPL: S P L
  YARA-L: Yara L
  CVEs: C V Es
  CVE: C V E
  IOCs: I O Cs
  IOC: I O C
  OSINT: oh-sint
  STIX: sticks
  TAXII: taxi
  MISP: misp
  XDR: X D R
  EDR: E D R
  LOLBAS: lol bass
  LOLDrivers: lol drivers
  LOLRMM: lol R M M
  KEV: kev
  NVD: N V D
  DFIR: D F I R
  CSV: C S V
  MDM: M D M
  e.g.: for example

scenes:

  - id: intro
    chapter: What Shikari is
    narration: >
      This is Shikari. Most detection work starts from very little: a threat group named in a report, a
      CVE that's suddenly everywhere, a blog post a colleague forwards, or the domain of the organisation
      you defend. Give Shikari one of those and it does two jobs. It works out what the input means: the
      techniques in play, how the actor operates, and where your exposure sits. Then it turns that into
      detections for the SIEMs you run, whether that's Google SecOps, Microsoft Defender, Splunk or
      Elastic, and shows you the coverage gaps you didn't know you had. Every result is grounded in MITRE
      ATT&CK and tied back to its evidence, so you can see why it's there. Most of it runs with no AI at
      all. The analysis is deterministic, and the AI is there when you want a second opinion. Let's take
      a look.
    actions:
      - goto: /
      - scroll: 300
        at: 0.55

  - id: overview
    chapter: The sections at the top
    narration: >
      It all runs from the tabs along the top, one per starting point. Hunt turns a threat group or a CVE
      into detections — a named adversary covered in minutes. Analyse does the same from a threat report —
      a new write-up becomes queries, not a reading task. Profile starts from a company rather than a
      threat, and tells you who's most likely to come for it. And Research finds the groups that hit a
      given sector and region, and the techniques they have in common — so your effort lands where it
      covers the most.
    actions:
      - goto: /
      - show: 'button.tab-button[data-tab="generate"]'
        at: 0.12
      - show: 'button.tab-button[data-tab="upload"]'
        at: 0.42
      - show: 'button.tab-button[data-tab="profile"]'
        at: 0.64
      - show: 'button.tab-button[data-tab="research"]'
        at: 0.84

  - id: hunt
    chapter: Hunting a threat group
    narration: >
      Hunt is where most work starts. Name a threat group by any alias you like — APT29, Cozy Bear and
      Midnight Blizzard all resolve to the one group. Shikari gathers every technique that group uses —
      directly, through its campaigns, and through the software it runs — and writes a detection for each.
    actions:
      - goto: /
      - click: 'button.tab-button[data-tab="generate"]'
        at: 0.03
      - show: '#generate-form .hp-primary'
        at: 0.06
      - type: ['#group_name_input', 'Midnight Blizzard']
        at: 0.28

  - id: hunt-cves
    chapter: CVEs and techniques
    continues: true
    narration: >
      Or start from a CVE. Shikari reads its NVD record, the advisories and any public proof-of-concept,
      then writes detections for the exploit attempt and for the activity that follows a successful one.
      Browse lists the last thirty days of new CVEs, with CISA's known-exploited ones marked. And you can
      hunt a list of ATT&CK techniques straight across every group that uses them.
    actions:
      # Clear the group box the previous (continuing) scene typed into: group and CVE are mutually
      # exclusive, so the CVE field and its Browse button stay disabled until the group box is empty.
      - clear: '#group_name_input'
        at: 0.04
      - click: '#cve_input'
        at: 0.1
      - show: '#generate-form .hp-secondary'
        at: 0.16
      - click: '#cve-browse'
        at: 0.58
      - key: Escape
        at: 0.82

  - id: options
    chapter: Enrichment options
    continues: true
    narration: >
      The options add enrichment. The LOL datasets drop in the real command lines, hashes and paths of the
      living-off-the-land binaries, drivers and remote tools a group reaches for. OSINT Enhancement folds
      in indicators and known false positives from public detection rules. OSINT Comparison scores your
      detections against those public rules — and writes fresh ones for the techniques no public rule
      covers, over three hundred of them.
    actions:
      - show: '#tab-generate details.options-section'
        at: 0.08

  - id: results
    chapter: Results and the threat briefing
    narration: >
      Every run lands on a Results page. The threat briefing comes first — how much of the group you
      actually detect, its weakest stage, and the gaps worth closing first, ranked by how early they sit
      in the attack. Below that, the anatomy of the attack in plain words, then the detections themselves
      — one card each, grouped by SIEM.
    actions:
      - goto: /results?group_name=APT29
      - click: '#briefing h2'
        at: 0.05
      - show: '#briefing'
        at: 0.12
      - show: '.detection-section:has(h2:text-is("Detections"))'
        at: 0.82

  - id: correlations
    chapter: Correlations and attack flows
    continues: true
    narration: >
      Correlations chain detections into a single query that fires only when several steps of an attack
      land on the same host or account inside a time window — three techniques together fire far less
      often than any one alone, so you can treat a hit as a high-confidence lead. The attack flow lays the
      group's techniques out by tactic, each marked with the SIEMs that catch it, or with nothing. And
      before you deploy a thing, work the validation checklist: generated queries are a starting point,
      not production rules.
    actions:
      - show: '#correlations'
        at: 0.04
      - show: '#attack-flow'
        at: 0.48
      - show: '#validation-checklist'
        at: 0.76

  - id: analyse
    chapter: Analysing a report
    narration: >
      Analyse builds detections from a threat report. Paste a URL or drop in a PDF, and Shikari pulls out
      the techniques, the commands and the indicators — defanged ones included — and shows you every one
      before it writes anything. Untick the vendor's own domains, and anything mentioned only in passing.
    actions:
      - goto: /
      - click: 'button.tab-button[data-tab="upload"]'
        at: 0.03
      - show: '#upload-form .hp-primary'
        at: 0.08
      - show: '#upload-form .hp-secondary'
        at: 0.62

  - id: profile-company
    chapter: Profiling a company
    narration: >
      Profile starts from a company rather than a threat. Enter a domain and Shikari works out the sector,
      geography and hosting from public sources, then names the groups most likely to target it. The review
      opens on an exposure map — what an attacker sees before they move: whether the domain can be spoofed,
      the services it exposes, and its breach history.
    actions:
      - goto: /
      - click: 'button.tab-button[data-tab="profile"]'
        at: 0.03
      - show: '#profile-form .hp-primary'
        at: 0.08
      - goto: /review?domain=sample-corp.example
        at: 0.48
      - show: '#exposure'
        at: 0.58
      - show: section.rv-groups
        at: 0.82

  - id: research
    chapter: Researching groups
    narration: >
      Research answers a different question — who targets finance in Europe? Give it a few keywords and
      Shikari finds the matching groups, then builds a table of the techniques they share. A technique
      several of your groups use is the best value a single detection can buy.
    actions:
      - goto: /
      - click: 'button.tab-button[data-tab="research"]'
        at: 0.03
      - show: '#actor-consolidation-section .hp-primary'
        at: 0.12
      - show: '#actor-consolidation-section .hp-actions'
        at: 0.6

  - id: environment
    chapter: Your environment
    narration: >
      You can narrow all of this to your own estate. Under Profile, Environment, tick the SIEMs you run,
      the industries you care about, and the products you have. From then on every hunt generates only for
      those SIEMs, and quietly drops the techniques that can't happen on your stack. The Threat Feed
      honours it too.
    actions:
      - goto: /profile
      - click: 'button.tab-button[data-tab="environment"]'
        at: 0.05
      - show: '#siems'
        at: 0.3
      - show: '#industries'
        at: 0.52
      - show: '#tech-stack'
        at: 0.74

  - id: library
    chapter: Library and coverage
    narration: >
      Save a run and it lands in your Library — your working set of detections and correlations. Search
      it, filter it, tag detections in bulk, export them. Coverage then shows which ATT&CK techniques
      you've got queries for — by tactic, across the whole matrix, and where one SIEM picks up what
      another misses.
    actions:
      - goto: /library
      - click: 'h2:text-is("Metrics")'
        at: 0.05
      - show: '.ui-card:has(h2:text-is("Metrics"))'
        at: 0.1
      - goto: /coverage
        at: 0.5
      - show: .summary-cards
        at: 0.6

  - id: flows
    chapter: Flows and anatomy
    narration: >
      Flows and Anatomy are for the people who don't read queries. A flow lays out every technique in an
      attack by tactic, with what you detect and what you don't. Anatomy tells the same story the way the
      DFIR Report draws it — how they get in, what they run, what they do, and where they go next.
    actions:
      - goto: /flows
      - show: '#af-canvas'
        at: 0.3
      - goto: /anatomy
        at: 0.58
      - show: '#an-svg'
        at: 0.68

  - id: detections-code
    chapter: Detections as code
    narration: >
      Detections as code commits a run to git — one stable file per detection — so when you regenerate
      after a new ATT&CK release, you can see exactly which queries moved.
    actions:
      - goto: /detections/code
      - show: 'section.ms-card:has(h2:has-text("History"))'
        at: 0.2

  - id: feed
    chapter: The Threat Feed
    narration: >
      The Threat Feed is the last seven days of technical research from vendors and governments, tagged
      with the industries, nations and products in play. By default it keeps what's relevant to your
      industries and your stack. Save a watchlist and Shikari checks every six hours, flagging anything
      new — and Analyse turns any post straight into detections.
    actions:
      - goto: /feed
      - show: section.fd-intro
        at: 0.05
      - show: '#fd-watch'
        at: 0.58
      - show: '#fd-wall'
        at: 0.85

  - id: intel
    chapter: Cyber Powers, STIX and MITRESaw
    narration: >
      Cyber Powers puts national capability on a map — from the IISS tiers, and from how firmly ATT&CK
      pins groups to each country. STIX, TAXII and MISP take intelligence from your sharing communities in
      as a hunt input, and send a finished run back out. And MITRESaw is the procedure data under all of
      it — the evidence behind every link between a group and a technique.
    actions:
      - goto: /cyber-powers
      - show: '#cp-map'
        at: 0.05
      - goto: /intel/stix
        at: 0.38
      - show: 'section.ms-card:has(h2:has-text("Import"))'
        at: 0.46
      - goto: /mitresaw
        at: 0.70
      - show: 'section.ms-card:has(h2:text-is("Procedures"))'
        at: 0.78

  - id: emulate
    chapter: Emulation and assessments
    narration: >
      Emulate shows which logs record each technique — drawn from real attacks captured in public labs —
      and checks your detections' indicators against those recordings. Plan an emulation for a group or a
      CVE and export it for MACAT. In the Lab, run a CALDERA operation against a group of agents — each
      step's facts feed the next, and the sandcat agent behaves like a real implant — then test your
      detections and correlations against what actually ran, capturing each step's endpoint logs over the
      agent's own C2. Assessments record what each test did and what the defence saw, and export an ATT&CK
      Navigator layer.
    actions:
      - goto: /emulate
      - show: '#emulate-planner'
        at: 0.04
      - show: '#em-telemetry'
        at: 0.18
      - show: '#lab'
        at: 0.42
      - goto: /assessments
        at: 0.80
      - show: 'section.ms-card:has(h2:has-text("Campaigns"))'
        at: 0.88

  - id: build
    chapter: Manual, Regex and Agents
    narration: >
      Manual writes detections from your own intelligence, one technique at a time. Regex tests a pattern
      in the engine your SIEM actually uses, and catches the mistakes that only ever surface there. And
      Agents put a model to work with Shikari's own tools — repairing queries that fail the checks,
      triaging reports, sweeping coverage gaps — every step shown, every change waiting on your say-so.
    actions:
      - goto: /manual
      - show: section.mn-entry
        at: 0.05
      - goto: /regex
        at: 0.28
      - show: 'section.rx-card:has(h2:has-text("Checks"))'
        at: 0.38
      - goto: /agents
        at: 0.58
      - show: section.ag-intro
        at: 0.68

  - id: guide
    chapter: The guide and tips
    narration: >
      You don't have to remember any of this. The Help menu carries a guide to every page — each part
      highlighted with what it's for, who uses it, and when it earns its keep — plus tips for the things
      that are easy to miss. Shikari runs in the browser from one central server for the whole team, or as
      an app on your own machine. It's on GitHub. Happy hunting.
    actions:
      - goto: /library
      - guide: results
        at: 0.2
      - key: ArrowRight
        at: 0.45
      - key: ArrowRight
        at: 0.62
