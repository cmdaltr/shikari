# The Archer walkthrough video: narration and what happens on screen, scene by scene.
# scripts/video/make_video.py speaks each scene's narration with Piper, records the actions in a browser
# spread across that time, and joins the scenes into one video with subtitles.
#
# chapter: the scene's YouTube chapter title. Actions: goto <path> · click <selector> · type [<selector>, <text>] · show <selector> (scroll to it and
# pulse a highlight round it) · scroll <pixels> · guide (open the in-app guide) · key <key>
# Record against a throwaway instance with sample data (see scripts/guide/capture.py), never a real one.

# How the voice should say what the subtitles spell
say:
  ATT&CK: Attack
  MITRE: Miter
  MITRESaw: Miter Saw
  SIEMs: sims
  SIEM: sim
  SecOps: Sec Ops
  KQL: K Q L
  SPL: S P L
  YARA-L: Yara L
  CVEs: C V Es
  CVE: C V E
  IOCs: I O Cs
  IOC: I O C
  OSINT: oh-sint
  STIX: sticks
  TAXII: taxi
  MISP: misp
  XDR: X D R
  EDR: E D R
  LOLBAS: lol bass
  LOLDrivers: lol drivers
  LOLRMM: lol R M M
  KEV: kev
  NVD: N V D
  APT29: A P T 29
  DFIR: D F I R
  CSV: C S V
  MDM: M D M
  AI: A I
  e.g.: for example

scenes:

  - id: intro
    chapter: What Archer is
    narration: >
      This is Archer. It turns MITRE ATT&CK into detections for Google SecOps, Defender XDR, Splunk and
      Elastic. Give it a threat group, a CVE, a threat report or a company, and it builds the queries,
      chains them into correlations, and shows you where you're blind. Almost all of it works without AI.
      Over the next few minutes we'll go through every part of it, and who each part is for.
    actions:
      - goto: /
      - show: .header
      - show: .home-tabs .tabs-header

  - id: environment
    chapter: Your environment
    narration: >
      Start with your environment. Under Profile, Environment, tick the SIEMs you run, the industries
      you care about, and the products in your estate. Every hunt then generates only for your SIEMs,
      and leaves out techniques that can't happen in your technology stack. The Threat Feed uses it too.
    actions:
      - goto: /profile
      - click: 'button.tab-button[data-tab="environment"]'
      - show: '#tab-environment'
      - scroll: 500

  - id: hunt
    chapter: Hunting a threat group
    narration: >
      Hunt is where most work starts. Type a threat group by any of its names. APT29, Cozy Bear and
      Midnight Blizzard all find the same group. Archer collects every technique the group uses,
      directly, through its campaigns, and through the software it uses, and builds a detection for each.
    actions:
      - goto: /
      - click: 'button.tab-button[data-tab="generate"]'
      - show: '#generate-form .hp-primary'
      - type: ['#group_name_input', 'Midnight Blizzard']

  - id: hunt-cves
    chapter: CVEs and techniques
    narration: >
      Or enter CVEs. Archer reads the NVD record, the advisories and public proof-of-concept exploits,
      and builds four kinds of query: the exploit request in your HTTP logs, the behaviour of
      exploitation, the shell an exploited server starts, and a sweep for the published indicators.
      Browse the last 30 days lists new CVEs, with CISA's known exploited ones marked. You can also
      hunt a list of ATT&CK techniques across every group that uses them.
    actions:
      - goto: /
      - show: '#generate-form .hp-secondary'
      - click: '#cve-browse'
      - key: Escape

  - id: options
    chapter: Enrichment options
    narration: >
      The options add enrichment. LOL datasets add the real command lines, hashes and paths of the
      living-off-the-land binaries, drivers and remote tools a group uses. OSINT Enhancement merges
      indicators and known false positives from public detection rules. OSINT Comparison scores your
      detections against those rules, and builds detections from them where ATT&CK gives a technique
      no indicators at all, which is more than three hundred techniques.
    actions:
      - show: '#tab-generate details.options-section'

  - id: results
    chapter: Results and the threat briefing
    narration: >
      Every run ends on a Results page. The threat briefing comes first: how much of the group you
      detect, its weakest stage, and the gaps to close first, ranked by how early they come in the
      attack. It's worked out without AI. Below it, the anatomy of the attack in plain words, then the
      detections themselves, one card per detection, grouped by SIEM.
    actions:
      - goto: /results?group_name=APT29
      - click: '#briefing h2'
      - show: '#briefing'
      - show: '.detection-section:has(h2:text-is("Detections"))'

  - id: correlations
    chapter: Correlations and attack flows
    narration: >
      Correlations chain detections into one query that fires when several steps of an attack happen
      on the same host or account within a time window. A chain of three techniques fires far less
      often than a single detection, so treat it as a high-confidence lead. The attack flow lays the
      group's techniques out by tactic, marked with the SIEMs that detect each one, or no detection.
      Before you deploy anything, work through the validation checklist. Generated queries are a
      starting point, not production rules.
    actions:
      - show: '#correlations'
      - show: '#attack-flow'
      - show: '#validation-checklist'

  - id: analyse
    chapter: Analysing a report
    narration: >
      Analyse builds detections from a threat report. Paste a URL or upload a PDF. Archer pulls out the
      techniques, the commands and the indicators, defanged ones included, and shows you every one
      before it generates anything. Untick the vendor's own domains and anything mentioned only in
      passing.
    actions:
      - goto: /
      - click: 'button.tab-button[data-tab="upload"]'
      - show: '#upload-form .hp-primary'
      - show: '#upload-form .hp-secondary'

  - id: profile-company
    chapter: Profiling a company
    narration: >
      Profile starts from a company instead of a threat. Enter a domain and Archer works out the sector,
      geography and hosting from public sources, then recommends the groups most likely to target it.
      The review shows an exposure map: what an attacker can see before they act, including whether
      the domain can be spoofed, its exposed services and its breach history.
    actions:
      - click: 'button.tab-button[data-tab="profile"]'
      - show: '#profile-form .hp-primary'
      - goto: /review?domain=sample-corp.example
      - show: '#exposure'
      - show: section.rv-groups

  - id: research
    chapter: Researching groups
    narration: >
      Research answers a different question: who targets finance in Europe? Enter keywords, and
      Archer finds the matching groups and builds a table of the techniques they share. A technique
      several of your groups use is the best value for a detection.
    actions:
      - goto: /
      - click: 'button.tab-button[data-tab="research"]'
      - show: '#actor-consolidation-section .hp-primary'
      - show: '#actor-consolidation-section .hp-actions'

  - id: library
    chapter: Library and coverage
    narration: >
      Save a run and it goes into your Library: your working set of detections and correlations. Search
      it, filter it, tag detections in bulk and export them. Coverage shows which ATT&CK techniques you
      have queries for, by tactic and on the full matrix, and where one SIEM covers what another
      doesn't.
    actions:
      - goto: /library
      - click: 'h2:text-is("Metrics")'
      - show: '.ui-card:has(h2:text-is("Metrics"))'
      - goto: /coverage
      - show: .summary-cards

  - id: flows
    chapter: Flows and anatomy
    narration: >
      Flows and Anatomy are for people who don't read queries. A flow shows every technique of an
      attack by tactic, with what you detect and what you don't. Anatomy tells the same story the way
      the DFIR Report draws it: how they get in, what they run, what they do, and where they go.
    actions:
      - goto: /flows
      - show: '#af-canvas'
      - goto: /anatomy
      - show: '#an-svg'

  - id: detections-code
    chapter: Detections as code
    narration: >
      Detections as code commits a run to git, one stable file per detection, so a regenerate after a
      new ATT&CK release shows exactly which queries moved.
    actions:
      - goto: /detections/code
      - show: 'section.ms-card:has(h2:has-text("History"))'

  - id: feed
    chapter: The Threat Feed
    narration: >
      The Threat Feed is the last seven days of technical research from vendors and governments,
      tagged with the industries, nations and products involved. By default it keeps what's relevant
      to your industries and your stack. Save a watchlist, and Archer collects every six hours and
      flags anything new. Analyse in Archer turns a post into detections.
    actions:
      - goto: /feed
      - show: section.fd-intro
      - show: '#fd-watch'
      - show: '#fd-wall'

  - id: intel
    chapter: Cyber Powers, STIX and MITRESaw
    narration: >
      Cyber Powers puts national capability on a map, from the IISS tiers and from how firmly ATT&CK
      attributes groups to each country. STIX, TAXII and MISP take intelligence from your sharing
      communities as a hunt input, and export a finished run back. MITRESaw is the procedure data
      underneath it all, with the evidence for every link between a group and a technique.
    actions:
      - goto: /cyber-powers
      - show: '#cp-map'
      - goto: /intel/stix
      - show: 'section.ms-card:has(h2:has-text("Import"))'
      - goto: /mitresaw
      - show: 'section.ms-card:has(h2:text-is("Procedures"))'

  - id: emulate
    chapter: Emulation and assessments
    narration: >
      Emulate shows which logs record each technique, from attacks recorded in public labs, and checks
      your detections' indicators against those recordings. Plan an emulation for a group or CVE and
      export it for MACAT. Assessments record what each test did and what the defence saw, and export
      an ATT&CK Navigator layer.
    actions:
      - goto: /emulate
      - show: '#emulate-planner'
      - show: '#em-telemetry'
      - goto: /assessments
      - show: 'section.ms-card:has(h2:has-text("Campaigns"))'

  - id: build
    chapter: Manual, Regex and Agents
    narration: >
      Manual writes detections from your own intelligence, one technique at a time. Regex tests a
      pattern in the engine your SIEM actually uses, and catches the mistakes that only show up there.
      And Agents put a model to work with Archer's tools, repairing queries that fail the checks,
      triaging reports and sweeping coverage gaps, with every step shown and every change waiting for
      your approval.
    actions:
      - goto: /manual
      - show: section.mn-entry
      - goto: /regex
      - show: 'section.rx-card:has(h2:has-text("Checks"))'
      - goto: /agents
      - show: section.ag-intro

  - id: guide
    chapter: The guide and tips
    narration: >
      You don't need to remember all of this. The Help menu has a guide to every page, each part
      highlighted with what it's for, who uses it, and when it helps most, and tips for the things
      that are easy to miss. Archer runs in a browser from a central server for the whole team, or as
      an app on your own machine. It's on GitHub. Happy hunting.
    actions:
      - goto: /library
      - guide: results
      - key: ArrowRight
      - key: ArrowRight
