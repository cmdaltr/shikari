<!DOCTYPE html>
<html data-theme="light">
<head>
    <script>
      // Apply the saved theme before first paint. Without this the page renders
      // the hardcoded light theme until common.js runs on DOMContentLoaded, and
      // on pages without the dark-mode toggle common.js returns early and never
      // applies it at all — so a reload (e.g. relaunching the desktop app from
      // the Dock) drops a dark-mode user back to a light background. No explicit
      // choice follows the OS, matching the loading splash.
      try {
        var t = localStorage.getItem('theme')
          || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>{% block title %}Archer{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='apple-touch-icon.png') }}">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="{{ url_for('static', path='apple-touch-icon-precomposed.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v={{ request.app.state.asset_version }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/common.css') }}?v={{ request.app.state.asset_version }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/dark-mode.css') }}?v={{ request.app.state.asset_version }}">
    <style>
        /* Ensure consistent positioning across all browsers */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            overflow-y: scroll !important; /* Always show scrollbar gutter for consistent positioning */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #main-content {
            flex: 1;
        }

        /* Dark mode CSS variables */
        :root[data-theme="light"] {
            --bg-primary: #f7fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --border-color: #e2e8f0;
            --shadow: rgba(0,0,0,0.08);
            --accent: #C53030;
        }

        :root[data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #808080;
            --border-color: #404040;
            --shadow: rgba(0,0,0,0.3);
            --accent: #ff6b6b;
        }

    </style>
    {% block head %}{% endblock %}
    <!-- Shared components, after every page's own styles -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/ui.css') }}?v={{ request.app.state.asset_version }}">
</head>
<body>
    {% include "partials/nav_controls.html" %}

    <div id="container">
        <div id="main-content" class="{% block main_class %}centered{% endblock %}">
          {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Local LLM Detection Modal -->
    {% include "partials/llm_modal.html" %}

    <script src="{{ url_for('static', path='js/common.js') }}?v={{ request.app.state.asset_version }}"></script>
    <script src="{{ url_for('static', path='js/card_collapse.js') }}?v={{ request.app.state.asset_version }}"></script>
</body>
</html>
