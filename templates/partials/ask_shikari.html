{# Ask Shikari: the floating chat, bottom right on every page, clear of the footer. Locked for guests. #}
<style>
  #ask-shikari-btn {
    position: fixed;
    bottom: 64px;
    right: 24px;
    z-index: 9000;
    border-radius: 45px;
    background: #6366f1;
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(99,102,241,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px 8px 8px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    white-space: nowrap;
    transition: background .2s, transform .15s;
  }
  #ask-shikari-btn:hover { background: #4f46e5; transform: scale(1.04); }
  #ask-shikari-btn.is-locked { background: #9ca3af; box-shadow: none; cursor: not-allowed; opacity: .72; }
  #ask-shikari-btn.is-locked:hover { background: #9ca3af; transform: none; }
  #ask-shikari-btn .asb-ico { width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
    background: rgba(255,255,255,.18); flex-shrink: 0; }

  #ask-shikari-panel {
    position: fixed;
    bottom: 116px;
    right: 24px;
    z-index: 8999;
    width: 638px;
    height: 480px;
    background: #1e1e2e;
    border: 1px solid #3d3d5c;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px) scale(.97);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  #ask-shikari-panel.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: all;
  }
  #ask-shikari-panel.expanded { height: calc(90vh - 116px); }
  .aap-header {
    padding: 12px 16px;
    background: #181825;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #3d3d5c;
    flex-shrink: 0;
  }
  .aap-title { font-size: 1.14em; font-weight: 600; color: #cdd6f4; flex: 1; }
  .aap-subtitle { font-size: .864em; color: #6c7086; }
  #aap-close { background: none; border: none; color: #6c7086; cursor: pointer; padding: 2px; line-height: 1; font-size: 1.2em; }
  #aap-close:hover { color: #cdd6f4; }
  .aap-messages { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
  .aap-msg { max-width: 92%; padding: 9px 13px; border-radius: 10px; font-size: 1em; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .aap-msg.user { align-self: flex-end; background: #6366f1; color: #fff; border-bottom-right-radius: 3px; }
  .aap-msg.shikari { align-self: flex-start; background: #313244; color: #cdd6f4; border-bottom-left-radius: 3px; }
  .aap-msg.error { align-self: flex-start; background: #3d1a1a; color: #f38ba8; border-bottom-left-radius: 3px; }
  .aap-typing { align-self: flex-start; color: #6c7086; font-size: .936em; padding: 4px 8px; }
  .aap-input-row { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid #3d3d5c; flex-shrink: 0; background: #181825; }
  #aap-input { flex: 1; background: #313244; border: 1px solid #45475a; border-radius: 8px; color: #cdd6f4; font-size: 1.008em; padding: 8px 11px; resize: none; height: 38px; line-height: 1.4; font-family: inherit; outline: none; transition: border-color .15s; }
  #aap-input:focus { border-color: #6366f1; }
  #aap-input::placeholder { color: #6c7086; }
  #aap-send { background: #6366f1; border: none; border-radius: 8px; color: #fff; cursor: pointer; padding: 0 14px; font-size: 1.008em; font-weight: 600; transition: background .15s; flex-shrink: 0; }
  #aap-send:hover { background: #4f46e5; }
  #aap-send:disabled { background: #45475a; cursor: not-allowed; }
  .aap-provider { font-size: .68em; color: #6c7086; padding: 0 14px 8px; background: #181825; text-align: right; flex-shrink: 0; }
</style>

<button id="ask-shikari-btn"
        {% if user %}title="Ask Shikari" aria-label="Ask Shikari"{% else %}class="is-locked" disabled aria-disabled="true" title="Log in to use Ask Shikari" aria-label="Ask Shikari (log in to use)"{% endif %}>
  <img class="asb-ico" src="{{ url_for('static', path='images/bateleur/bateleur-sixview1.png') }}" alt="" aria-hidden="true">
  <span>Ask Shikari</span>
</button>

<div id="ask-shikari-panel" role="dialog" aria-label="Ask Shikari">
  <div class="aap-header">
    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <div style="flex:1;">
      <div class="aap-title">Ask Shikari</div>
      <div class="aap-subtitle">ATT&amp;CK, queries, threat groups</div>
    </div>
    <button id="aap-expand" aria-label="Expand" title="Expand" style="background:none;border:none;color:#6c7086;cursor:pointer;font-size:14px;padding:4px 6px;margin-right:2px;line-height:1;">&#x26F6;</button>
    <button id="aap-close" aria-label="Close">&#10005;</button>
  </div>
  <div class="aap-messages" id="aap-messages">
    <div class="aap-msg shikari">Greetings. Ask me anything about threat detection — techniques, SIEM queries, threat groups, or anything in your generated detections.</div>
  </div>
  <div class="aap-provider" id="aap-provider"></div>
  <div class="aap-input-row">
    <textarea id="aap-input" placeholder="e.g. Give me a Splunk query for Scattered Spider…" rows="1"></textarea>
    <button id="aap-send">Send</button>
  </div>
</div>

<script>
(function () {
  const btn    = document.getElementById('ask-shikari-btn');
  const panel  = document.getElementById('ask-shikari-panel');
  const close  = document.getElementById('aap-close');
  const expand = document.getElementById('aap-expand');
  const msgs   = document.getElementById('aap-messages');
  const input  = document.getElementById('aap-input');
  const send   = document.getElementById('aap-send');
  const provEl = document.getElementById('aap-provider');

  // Ask Shikari is for authenticated users only — leave the locked button inert.
  if (!btn || btn.classList.contains('is-locked')) { if (panel) panel.style.display = 'none'; return; }

  function setOpen(open) {
    panel.classList.toggle('open', open);
    if (open) input.focus();
    try { localStorage.setItem('shikariChatOpen', open ? '1' : '0'); } catch(e) {}
  }
  try { if (localStorage.getItem('shikariChatOpen') === '1') setOpen(true); } catch(e) {}

  btn.addEventListener('click', () => setOpen(!panel.classList.contains('open')));
  close.addEventListener('click', () => setOpen(false));
  expand.addEventListener('click', () => {
    const x = panel.classList.toggle('expanded');
    expand.title = x ? 'Collapse' : 'Expand';
    expand.innerHTML = x ? '&#x2922;' : '&#x26F6;';
  });

  function addMsg(text, role) {
    const d = document.createElement('div');
    d.className = 'aap-msg ' + role;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  async function doAsk() {
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    input.style.height = '38px';
    send.disabled = true;
    addMsg(q, 'user');
    const typing = document.createElement('div');
    typing.className = 'aap-typing';
    typing.textContent = 'Shikari is thinking…';
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;
    const groupInput = document.getElementById('group_name') || document.querySelector('[name="group_name"]');
    const context = groupInput && groupInput.value ? { group: groupInput.value } : {};
    try {
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, context }),
      });
      msgs.removeChild(typing);
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        addMsg('Error: ' + (err.detail || res.statusText), 'error');
      } else {
        const data = await res.json();
        addMsg(data.answer, 'shikari');
        if (data.provider) provEl.textContent = 'Powered by ' + data.provider;
      }
    } catch (e) {
      msgs.removeChild(typing);
      addMsg('Network error: ' + e.message, 'error');
    }
    send.disabled = false;
    input.focus();
  }

  send.addEventListener('click', doAsk);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doAsk(); }
  });
  input.addEventListener('input', () => {
    input.style.height = '38px';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });
})();
</script>
