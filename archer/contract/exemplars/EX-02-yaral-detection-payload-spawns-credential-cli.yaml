archer_output:
  contract_version: "1.0"
  kind: rule
  request_ref: REQ-2026-10-10-002
  rule:
    rule_id: da50a2d5-62cf-4535-9136-0325b332215d
    name: credential_access_t1528_udm_process_hook_payload_spawns_credential_cli
    author: Archer Detection Engineering
    created: "2026-10-10"
    modified: "2026-10-10"
    version: "1.0.0"
    status: draft
    detection_type: scheduled_detection
    siem: yara_l
    target_os:
      - macos
      - linux
      - windows
    log_sources:
      - id: LS1
        siem_source: PROCESS_LAUNCH
        product: Microsoft Defender for Endpoint
        udm_log_type: WINDOWS_DEFENDER_ATP
        ingestion:
          status: unverified
          profile_ref: ENVPROFILE-A-secops-full-mde
        fields:
          - path: metadata.event_type
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: target.process.file.full_path
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: target.process.command_line
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: principal.process.file.full_path
            population: known_populated
            os:
              - macos
              - linux
              - windows
            note: On macOS fork+exec children this is the fork copy of the parent; its image path and command line equal the parent's, which is why the identity re-check works where a PID join does not.
          - path: principal.process.command_line
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: principal.asset_id
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: principal.hostname
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: principal.user.userid
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: metadata.event_timestamp.seconds
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: metadata.id
            population: known_populated
            os:
              - macos
              - linux
              - windows
        coverage_gaps:
          - Valid only under a profile that streams MDE DeviceProcessEvents; the tenant observed on 2026-10-09 (ENVPROFILE-B) does not.
          - Branch B of the source search (payload contacts IMDS or a secrets service over the network) is split into a sibling rule because it depends on NETWORK_CONNECTION, which is untested and intermittently recorded on macOS MDE.
    attack:
      attack_version: "19.2"
      bundle_ref: null
      tactics:
        - credential_access
      technique_ids:
        - T1528
        - T1555.006
      mapping_rationale: The child command retrieves an application access token (gh auth token, az account get-access-token, gcloud print-access-token) which is T1528, or reads a cloud secrets store (aws secretsmanager, ssm --with-decryption, vault, kubectl get secret) which is T1555.006. T1528 has no sub-techniques; T1555 does and the sub-technique is stated. Both describe the child's observed command, not the campaign goal.
    lookback: 4h
    schedule:
      mode: live
    confidence:
      rating: High
      rationale: Two correlated stages with a strict identity re-check; the evidence event's initiating image and command line must themselves match the campaign payload regexes, and the child must be one of ten enumerated credential-retrieval CLIs with anchored syntax. Positive control at source showed both gh auth token children carrying the payload as initiator and the gh re-exec correctly excluded.
    severity:
      rating: Critical
      rationale: A hit means the payload has obtained a live token or secret (GitHub, Azure, GCP, AWS, Vault, npm, Docker, Kubernetes) on a developer host; this is credential theft completed, one step from exfiltration and propagation, and tiers above the execution-only rule.
    false_positives:
      - id: FP1
        scenario: A developer runs gh auth token or aws secretsmanager get-secret-value by hand in a terminal or from an npm script.
        population: All developers using cloud and GitHub CLIs
        distinguishing_fields:
          - field: principal.process.file.full_path
            benign_pattern: shell or terminal image (zsh, bash, Terminal, node without a .claude or .vscode hook path on its command line)
        handled_by: structural
        suppression_id: null
      - id: FP2
        scenario: A repository's own .vscode/setup.mjs integration test exercises the AWS CLI against a LocalStack or moto endpoint with dummy credentials.
        population: Developers on projects that use LocalStack or moto for AWS emulation
        distinguishing_fields:
          - field: target.process.command_line
            benign_pattern: contains localhost:4566, 127.0.0.1:4566, localstack, moto_server, or AWS_ACCESS_KEY_ID=test|dummy
        handled_by: suppression
        suppression_id: S2
      - id: FP3
        scenario: A developer syntax-checks or inspects the hook script (node --check, git show) and the same shell then runs a credential CLI.
        population: Developers on repositories containing .vscode/setup.mjs
        distinguishing_fields:
          - field: target.process.command_line
            benign_pattern: payload event excluded by S1; the credential CLI's initiator is then the shell, not node, so the re-check fails
        handled_by: suppression
        suppression_id: S1
    tuning_notes:
      baseline:
        window_days: 7
        before_tuning: null
        after_tuning: null
        alerts_per_day_after_aggregation: null
        measured_on: null
        measurement_procedure: Run the KQL port of the payload and child conditions over the full estate for 7 days in Defender Advanced Hunting, join child to payload on DeviceId and InitiatingProcessCommandLine within 4 hours, count distinct DeviceId per day.
      suppressions:
        - id: S1
          logic_ref: "// S1:"
          reason: Syntax checks, git object reads, checksum tools and xcodebuild reference the payload path without executing it; removes the payload anchor for those events.
          depends_on_enrichment: false
          fails_closed_how: Literal regex on the detecting event's own command line; no external data.
        - id: S2
          logic_ref: "// S2:"
          reason: LocalStack and moto emulation endpoints and dummy AWS credentials indicate a local test harness, not a real secret store.
          depends_on_enrichment: false
          fails_closed_how: Literal regex on the child's own command line; absent markers mean no suppression.
      dependencies: []
      first_parameter_to_adjust: The credential CLI alternation (RX6, RX7). Remove a CLI from the list if a legitimate hook script in the estate is found to call it; do not widen the match window beyond 4h.
      known_limitations:
        - Device-level correlation; repeated payload runs on one host within 4 hours collapse into one detection.
        - Only explicit CLI invocations are covered; in-process SDK calls that read credential files produce no child process and are covered by the sibling network rule and the file-access hunt.
        - kubectl get secrets with --all-namespaces or -A is matched only when an output format flag follows the name token.
      split_from:
        - rule_id: 8d13f6a0-0401-4463-b5c1-bd8d94c8bce3
          relationship: independent
    references:
      - id: REF1
        title: Mini Shai-Hulud analyst notes and Google SecOps YARA-L search Q5 revision 3 (workbook row Q054)
        locator: archer fable fidelity workbook (populated).xlsx, Queries tab, Q054, Query Text and Notes
        accessed: "2026-10-10"
        used_for:
          - payload identity regexes
          - credential CLI alternation
          - LocalStack exclusion
          - macOS parent-PID finding and revision 3 join design
    indicators: []
    reference_lists: []
    entity_output:
      timestamp_first: $first_payload_time
      timestamp_last: $last_evidence_time
      device: $hostnames
      account: $accounts
      process: $child_processes, $child_commands
      parent_command_line: $payload_commands
      evidence_value: $child_commands
      source_table: null
    correlation:
      events:
        - var: payload
          source_id: LS1
          role: anchor
        - var: cli
          source_id: LS1
          role: evidence
      join_keys:
        - key: principal.asset_id
          holds_on:
            - macos
            - linux
            - windows
          mitigation: null
        - key: cli.principal.process (image path and command line re-checked against the payload regexes)
          holds_on:
            - macos
            - linux
            - windows
          mitigation: Replaces the PID join of revision 2, which cannot match on macOS (initiator is the fork copy) and cannot be fixed with parent_process.pid (empty in UDM for MDE).
      ordering: payload.metadata.event_timestamp.seconds <= cli.metadata.event_timestamp.seconds
      window: 4h
    regexes:
      - id: RX1
        field: target.process.file.full_path, principal.process.file.full_path
        pattern: |-
          (^|[\\/])node(\.exe)?$
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - '/usr/local/bin/node'
        must_not_match:
          - '/usr/local/bin/nodemon'
      - id: RX2
        field: target.process.command_line, principal.process.command_line
        pattern: |-
          (^|[\s"'])([^"'\s]*[\\/])?(\.claude|\.vscode)[\\/]setup\.mjs([\s"']|$)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'node .vscode/setup.mjs'
        must_not_match:
          - 'node setup.mjs'
      - id: RX3
        field: target.process.command_line
        pattern: |-
          (--check|\bgit\s+(log|show|diff|grep|status|ls-tree|cat-file)\b|\bgh\s+search\s+code\b|\b(shasum|sha1sum|sha256sum|md5|md5sum|xcodebuild)\b)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'node --check .vscode/setup.mjs'
        must_not_match:
          - 'node .vscode/setup.mjs'
      - id: RX4
        field: target.process.file.full_path, principal.process.file.full_path
        pattern: |-
          (^|[\\/])bun(\.exe)?$
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - '/opt/homebrew/bin/bun'
        must_not_match:
          - '/usr/bin/bundle'
      - id: RX5
        field: target.process.command_line, principal.process.command_line
        pattern: |-
          (^|[\s"'])(run\s+)?([^"'\s]*[\\/])?(math_init|math_symbol)\.js([\s"']|$)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'bun run .vscode/math_init.js'
        must_not_match:
          - 'bun test'
      - id: RX6
        field: target.process.command_line
        pattern: |-
          (^|[\s"';&|])(gh(\.exe)?\s+auth\s+token|az(\.cmd|\.exe)?\s+account\s+get-access-token|azd(\.cmd|\.exe)?\s+auth\s+token|gcloud(\.cmd|\.exe)?\s+auth\s+(application-default\s+)?print-(access|identity)-token)([\s"';&|]|$)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'gh auth token'
          - "sh -c 'gh auth token'"
          - 'az account get-access-token --resource https://management.azure.com'
          - 'gcloud auth application-default print-access-token'
        must_not_match:
          - 'gh auth status'
          - 'gcloud auth list'
      - id: RX7
        field: target.process.command_line
        pattern: |-
          (^|[\s"';&|])(aws(\.exe)?\s+secretsmanager\s+get-secret-value|aws(\.exe)?\s+ssm\s+get-parameters?\s[^\n]*--with-decryption|vault(\.exe)?\s+(read|kv\s+get|token\s+lookup)|docker-credential-[A-Za-z0-9_-]+(\.exe)?\s+get|(npm|pnpm|yarn)(\.cmd|\.exe)?\s+config\s+get\s+([^"';&|\s]+:)?(_authToken|npmAuthToken|NODE_AUTH_TOKEN|NPM_TOKEN)|kubectl(\.exe)?\s+get\s+secrets?\s+[A-Za-z0-9._-]+\s[^\n]*(-o|--output)(=|\s+)(json|yaml|jsonpath))([\s"';&|]|$)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'aws secretsmanager get-secret-value --secret-id prod/db'
          - 'aws ssm get-parameter --name /prod/key --with-decryption'
          - 'npm config get //registry.npmjs.org/:_authToken'
          - 'kubectl get secret db-creds -o json'
          - 'docker-credential-osxkeychain get'
        must_not_match:
          - 'aws ssm get-parameter --name /prod/key'
          - 'kubectl get secrets -A'
          - 'vault status'
      - id: RX8
        field: target.process.command_line
        pattern: |-
          (localhost:4566|127\.0\.0\.1:4566|\blocalstack\b|\bmoto_server\b|AWS_ACCESS_KEY_ID=(test|dummy)|AWS_SECRET_ACCESS_KEY=(test|dummy))
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'aws --endpoint-url http://localhost:4566 secretsmanager get-secret-value --secret-id x'
        must_not_match:
          - 'aws secretsmanager get-secret-value --secret-id prod/db'
    complexity:
      lines: 78
      event_variables_or_joins: 2
      union_branches: 0
      nesting_depth: 0
    validation:
      fidelity_basis: logic_review
      compile:
        status: not_run
      field_existence:
        schema_ref: Google SecOps UDM field list, 2026-10
        status: checked
      field_population:
        status: known_populated
        evidence: MDE PROCESS_LAUNCH in SecOps populates principal.process.pid, file.full_path and command_line on 2,619 of 2,619 sampled events; principal.process.parent_process.pid on 0, which is why no parent-PID join is used (workbook Q054 Notes).
      ingestion:
        status: unverified
        profile_ref: ENVPROFILE-A-secops-full-mde
      join_portability:
        status: pass
        notes: Device join plus identity re-check on the evidence event's principal.process; validated at source in Defender on macOS for the gh auth token child (REF1). No PID or parent-PID join.
      regex_checks:
        status: not_run
      positive_control:
        status: not_run
        procedure: On a macOS test host run node .vscode/setup.mjs where setup.mjs spawns gh auth token; confirm one detection whose child_commands contains gh auth token and whose payload_commands contains the setup.mjs command line, and confirm that gh auth token run directly from the shell does not alert. The KQL port passed on 2026-10-09 (REF1); the YARA-L form has not been executed in a tenant that ingests PROCESS_LAUNCH.
        evidence_ref: REF1
        date: null
    query: |
      rule credential_access_t1528_udm_process_hook_payload_spawns_credential_cli {
        meta:
          author = "Archer Detection Engineering"
          description = "A Mini Shai-Hulud hook payload (node setup.mjs or bun math_init.js) spawns an explicit credential-retrieval CLI on the same device within 4 hours; the child's initiating process is re-checked against the payload identity."
          rule_id = "da50a2d5-62cf-4535-9136-0325b332215d"
          version = "1.0.0"
          status = "draft"
          detection_type = "scheduled_detection"
          attack_version = "19.2"
          tactic = "credential_access"
          technique_ids = "T1528, T1555.006"
          severity = "CRITICAL"
          priority = "HIGH"
          confidence = "High"
          reference = "REF1"

        events:
          // Anchor: the payload process launch
          $payload.metadata.event_type = "PROCESS_LAUNCH"
          $payload.target.process.command_line != ""
          (
            (
              re.regex($payload.target.process.file.full_path, `(^|[\\/])node(\.exe)?$`) nocase
              and re.regex($payload.target.process.command_line, `(^|[\s"'])([^"'\s]*[\\/])?(\.claude|\.vscode)[\\/]setup\.mjs([\s"']|$)`) nocase
            )
            or
            (
              re.regex($payload.target.process.file.full_path, `(^|[\\/])bun(\.exe)?$`) nocase
              and re.regex($payload.target.process.command_line, `(^|[\s"'])(run\s+)?([^"'\s]*[\\/])?(math_init|math_symbol)\.js([\s"']|$)`) nocase
            )
          )
          // S1: syntax checks, git object reads and checksum tools reference the path without executing it
          not re.regex($payload.target.process.command_line, `(--check|\bgit\s+(log|show|diff|grep|status|ls-tree|cat-file)\b|\bgh\s+search\s+code\b|\b(shasum|sha1sum|sha256sum|md5|md5sum|xcodebuild)\b)`) nocase

          // Evidence: a credential-retrieval CLI whose initiating process is the payload.
          // No PID join: on macOS MDE the initiator of a fork+exec child is the pre-exec fork
          // copy carrying the child's own PID, and UDM leaves the parent PID empty for this source.
          $cli.metadata.event_type = "PROCESS_LAUNCH"
          $cli.target.process.command_line != ""
          (
            (
              re.regex($cli.principal.process.file.full_path, `(^|[\\/])node(\.exe)?$`) nocase
              and re.regex($cli.principal.process.command_line, `(^|[\s"'])([^"'\s]*[\\/])?(\.claude|\.vscode)[\\/]setup\.mjs([\s"']|$)`) nocase
            )
            or
            (
              re.regex($cli.principal.process.file.full_path, `(^|[\\/])bun(\.exe)?$`) nocase
              and re.regex($cli.principal.process.command_line, `(^|[\s"'])(run\s+)?([^"'\s]*[\\/])?(math_init|math_symbol)\.js([\s"']|$)`) nocase
            )
          )
          (
            // Token retrieval (T1528)
            re.regex($cli.target.process.command_line, `(^|[\s"';&|])(gh(\.exe)?\s+auth\s+token|az(\.cmd|\.exe)?\s+account\s+get-access-token|azd(\.cmd|\.exe)?\s+auth\s+token|gcloud(\.cmd|\.exe)?\s+auth\s+(application-default\s+)?print-(access|identity)-token)([\s"';&|]|$)`) nocase
            or
            // Secrets-store reads (T1555.006)
            re.regex($cli.target.process.command_line, `(^|[\s"';&|])(aws(\.exe)?\s+secretsmanager\s+get-secret-value|aws(\.exe)?\s+ssm\s+get-parameters?\s[^\n]*--with-decryption|vault(\.exe)?\s+(read|kv\s+get|token\s+lookup)|docker-credential-[A-Za-z0-9_-]+(\.exe)?\s+get|(npm|pnpm|yarn)(\.cmd|\.exe)?\s+config\s+get\s+([^"';&|\s]+:)?(_authToken|npmAuthToken|NODE_AUTH_TOKEN|NPM_TOKEN)|kubectl(\.exe)?\s+get\s+secrets?\s+[A-Za-z0-9._-]+\s[^\n]*(-o|--output)(=|\s+)(json|yaml|jsonpath))([\s"';&|]|$)`) nocase
          )
          // S2: LocalStack and moto emulation with dummy credentials is a local test harness
          not re.regex($cli.target.process.command_line, `(localhost:4566|127\.0\.0\.1:4566|\blocalstack\b|\bmoto_server\b|AWS_ACCESS_KEY_ID=(test|dummy)|AWS_SECRET_ACCESS_KEY=(test|dummy))`) nocase

          // Same device, payload before child
          $payload.principal.asset_id = $device
          $cli.principal.asset_id = $device
          $device != ""
          $payload.metadata.event_timestamp.seconds <= $cli.metadata.event_timestamp.seconds

        match:
          $device over 4h

        outcome:
          $risk_score = max(if($cli.target.process.command_line != "", 95, 0))
          $first_payload_time = min($payload.metadata.event_timestamp.seconds)
          $last_evidence_time = max($cli.metadata.event_timestamp.seconds)
          $hostnames = array_distinct($payload.principal.hostname)
          $accounts = array_distinct($cli.principal.user.userid)
          $payload_commands = array_distinct($payload.target.process.command_line)
          $child_processes = array_distinct($cli.target.process.file.full_path)
          $child_commands = array_distinct($cli.target.process.command_line)
          $payload_event_count = count_distinct($payload.metadata.id)
          $evidence_event_count = count_distinct($cli.metadata.id)

        condition:
          $payload and $cli
      }
