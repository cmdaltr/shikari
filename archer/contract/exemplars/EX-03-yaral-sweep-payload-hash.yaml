          - macOS MDE did not record DeviceFileEvents for setup.mjs or math_init.js in the 2026-10-09 positive control; the sweep cannot see those writes on macOS. Windows and Linux file-event coverage is assumed, not tested.
    attack:
      attack_version: "19.2"
      bundle_ref: null
      tactics:
        - initial_access
      technique_ids:
        - T1195.002
      mapping_rationale: Presence of the known setup.mjs, math_init.js or Math_Symbol.js file hash on disk evidences delivery of the compromised npm package (software supply chain). The sweep observes the file, not its execution, so the delivery technique is the correct mapping; execution is covered by the sibling process rules. T1195 has sub-techniques and the sub-technique is stated.
    lookback: 30d
    schedule: null
    confidence:
      rating: High
      rationale: Exact SHA256 match on three campaign-attributed payload files with provenance; a file-hash indicator is the most specific indicator type and has no benign collision.
    severity:
      rating: High
      rationale: The payload is a credential harvester; its presence on a developer host means the compromised package was installed, and the host and its tokens must be treated as exposed until execution is ruled out.
    false_positives:
      - id: FP1
        scenario: A security analyst or developer downloads the payload sample for analysis, or an AV engine quarantines or deletes it.
        population: Security team hosts and malware-analysis sandboxes
        distinguishing_fields:
          - field: principal.process.file.full_path
            benign_pattern: browser, curl, wget, an analysis tool, or the AV engine image (MsMpEng) as the writing or deleting process
        handled_by: triage
        suppression_id: null
    tuning_notes:
      baseline:
        window_days: 30
        before_tuning: 0
        after_tuning: 0
        alerts_per_day_after_aggregation: null
        measured_on: "2026-10-09"
        measurement_procedure: Run the rule as a retrohunt over the lookback and count distinct devices; revision 2 returned 0 results over the tenant on 2026-10-09 with file events ingested (FILE_CREATION on ~54k of ~82k devices).
      suppressions: []
      dependencies:
        - type: reference_list
          name: shai_hulud_payload_sha256
          declared_in: reference_lists
          definition_ref: REF1, indicators IOC1-IOC3
      first_parameter_to_adjust: The reference list contents. Add hashes as the campaign evolves; never add filename-only indicators to this list.
      known_limitations:
        - FILE_DELETION is included so that AV clean-up of the payload still surfaces the host; triage must read $event_types.
        - UDM principal.process.parent_process.command_line is not asserted as populated for file events; the writer's own command line is projected instead.
      split_from: []
    references:
      - id: REF1
        title: Mini Shai-Hulud campaign payload hashes (setup.mjs, math_init.js, Math_Symbol.js), analyst notes 2026-10-09
        locator: archer fable fidelity workbook (populated).xlsx, Queries tab, Q050 Query Text and Notes; Q023 KnownMaliciousHashes
        accessed: "2026-10-10"
        used_for:
