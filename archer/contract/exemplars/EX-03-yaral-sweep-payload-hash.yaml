      field_existence:
        schema_ref: Google SecOps UDM field list, 2026-10
        status: checked
      field_population:
        status: known_populated
        evidence: FILE_CREATION from MDE observed on ~54k of ~82k devices in the tenant on 2026-10-09 (workbook Q050 Notes); target.file.sha256 is the standard hash field for DeviceFileEvents-derived events.
      ingestion:
        status: confirmed
        profile_ref: ENVPROFILE-B-secops-observed-2026-10-09
      join_portability:
        status: not_applicable
        notes: Single event variable; match on principal.asset_id only.
      regex_checks:
        status: not_run
      positive_control:
        status: failed_to_observe
        procedure: Write setup.mjs with hash IOC1 to a repository path on a test host and confirm one result for that device with the hash in $matched_hashes. On macOS (2026-10-09) MDE recorded no file event for the write; repeat on a Windows or Linux host before relying on the sweep for those platforms.
        evidence_ref: REF1
        date: "2026-10-09"
    query: |
      rule initial_access_t1195_002_udm_file_shai_hulud_payload_hash_sweep {
        meta:
          author = "Archer Detection Engineering"
          description = "Known Mini Shai-Hulud payload SHA256 observed on any file create, modify, move or delete event. Retrospective IOC sweep; aggregated per device over 1 hour."
          rule_id = "8d13f6a0-0401-4463-b5c1-bd8d94c8bce3"
          version = "1.0.0"
          status = "draft"
          detection_type = "ioc_sweep"
          attack_version = "19.2"
          tactic = "initial_access"
          technique_ids = "T1195.002"
          severity = "HIGH"
          priority = "HIGH"
          confidence = "High"
          reference = "REF1"

        events:
          (
            $f.metadata.event_type = "FILE_CREATION"
            or $f.metadata.event_type = "FILE_MODIFICATION"
            or $f.metadata.event_type = "FILE_MOVE"
            or $f.metadata.event_type = "FILE_DELETION"
          )
          $f.target.file.sha256 in %shai_hulud_payload_sha256
          $f.principal.asset_id = $device
          $device != ""

        match:
          $device over 1h

        outcome:
          $first_seen = min($f.metadata.event_timestamp.seconds)
          $last_seen = max($f.metadata.event_timestamp.seconds)
          $event_count = count_distinct($f.metadata.id)
          $event_types = array_distinct($f.metadata.event_type)
          $hostnames = array_distinct($f.principal.hostname)
          $accounts = array_distinct($f.principal.user.userid)
          $matched_hashes = array_distinct($f.target.file.sha256)
          $file_paths = array_distinct($f.target.file.full_path)
          $writer_processes = array_distinct($f.principal.process.file.full_path)
          $writer_commands = array_distinct($f.principal.process.command_line)

        condition:
          $f
      }
