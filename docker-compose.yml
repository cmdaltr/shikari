version: "3.8"

services:
  archer:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./archer:/app/archer
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - PYTHONUNBUFFERED=1

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: supersecret
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: