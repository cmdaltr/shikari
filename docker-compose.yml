# ============================================================================
# Shikari Docker Compose
#
# Usage:
#   docker-compose up -d                                    # Just Shikari
#   docker-compose --profile secops up -d                   # Shikari + Google SecOps
#   docker-compose --profile mde up -d                      # Shikari + MDE
#   docker-compose --profile secops --profile mde up -d     # Shikari + SecOps + MDE
#   docker-compose --profile splunk --profile elastic up -d # Shikari + Splunk + Elastic
#   docker-compose --profile validation up -d               # Shikari + ALL SIEMs
# ============================================================================

services:
  # Main Shikari application
  shikari:
    build:
      context: .
      dockerfile: shikari/Dockerfile
    # Published on this machine only; SHIKARI_BIND=0.0.0.0 to serve the network directly (homelab
    # rebinds every port itself)
    ports:
      - "${SHIKARI_BIND:-127.0.0.1}:32453:32453"
    volumes:
      - ./shikari:/app/shikari
      - ./templates:/app/templates
      - ./static:/app/static
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Behind an HTTPS proxy (the homelab's Caddy) the proxy reaches the container from the Docker
      # bridge, not 127.0.0.1, and uvicorn ignores X-Forwarded-Proto from anywhere it doesn't trust:
      # pages then link their CSS and JS over http and browsers block it as mixed content
      - FORWARDED_ALLOW_IPS=127.0.0.1,::1,172.16.0.0/12
    restart: unless-stopped
    networks:
      - shikari-network

  # ============================================================================
  # Detection Validation SIEM Services (all optional)
  # Use --profile to start the ones you need
  # ============================================================================

  # Splunk Enterprise for SPL query validation (~2GB RAM)
  splunk:
    image: splunk/splunk:latest
    container_name: shikari-splunk
    ports:
      - "127.0.0.1:8001:8000"   # Web UI (offset to avoid conflict with Shikari)
      - "127.0.0.1:8089:8089"   # REST API
      - "127.0.0.1:8088:8088"   # HEC
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=Validation123!
      - SPLUNK_HEC_TOKEN=validation-hec-token
    mem_limit: 2g
    profiles:
      - validation
      - splunk
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8089/services/server/health/splunkd", "-u", "admin:Validation123!"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - shikari-network

  # Elasticsearch for ES|QL validation (~1.5GB RAM). ES|QL is GA from 8.14. Security on, HTTP
  # without TLS: user elastic, the password below
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    container_name: shikari-elastic
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=Validation123!
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    mem_limit: 2g
    profiles:
      - validation
      - elastic
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "elastic:Validation123!", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - shikari-network

  # Google SecOps Simulator for YARA-L validation (~512MB RAM)
  secops-simulator:
    build:
      context: ./shikari/siem/secops
      dockerfile: Dockerfile
    image: shikari-secops-simulator:latest
    container_name: shikari-secops
    ports:
      - "127.0.0.1:8081:8080"
    mem_limit: 512m
    profiles:
      - validation
      - secops
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shikari-network

  # MDE Simulator for KQL validation (~512MB RAM)
  mde-simulator:
    build:
      context: ./shikari/siem/mde
      dockerfile: Dockerfile
    image: shikari-mde-simulator:latest
    container_name: shikari-mde
    ports:
      - "127.0.0.1:8082:8080"
    mem_limit: 512m
    profiles:
      - validation
      - mde
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shikari-network

networks:
  shikari-network:
    driver: bridge
    name: shikari-network
