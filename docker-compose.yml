version: "3.8"

services:
  archer:
    build:
      context: .
      dockerfile: archer/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./archer:/app/archer
      - ./templates:/app/templates
      - ./static:/app/static
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped