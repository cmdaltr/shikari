version: "3.8"

services:
  archer:
    build:
      context: .
      dockerfile: gorgon/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./gorgon:/app/gorgon
      - ./templates:/app/templates
      - ./static:/app/static
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: supersecret
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data: