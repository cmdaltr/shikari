version: "3.8"

services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "supersecret"
    volumes:
      - n8n_data:/home/node/.n8n

  archer:
    build: ./archer
    ports:
      - "8000:8000"
    environment:
      # Optional: environment variables for your FastAPI app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./archer:/app

volumes:
  n8n_data: