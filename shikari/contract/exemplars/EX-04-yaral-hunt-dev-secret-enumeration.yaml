shikari_output:
  contract_version: "1.0"
  kind: rule
  request_ref: REQ-2026-10-10-004
  rule:
    rule_id: 34bca16f-5ae0-4eee-b543-41a54e262744
    name: credential_access_t1552_001_udm_process_dev_secret_mass_enumeration_hunt
    author: Shikari Detection Engineering
    created: "2026-10-10"
    modified: "2026-10-10"
    version: "1.0.0"
    status: draft
    detection_type: hunt
    siem: yara_l
    target_os:
      - macos
      - linux
      - windows
    log_sources:
      - id: LS1
        siem_source: PROCESS_LAUNCH
        product: Microsoft Defender for Endpoint
        udm_log_type: WINDOWS_DEFENDER_ATP
        ingestion:
          status: unverified
          profile_ref: ENVPROFILE-A-secops-full-mde
        fields:
          - path: metadata.event_type
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: target.process.file.full_path
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: target.process.command_line
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: principal.process.command_line
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: principal.asset_id
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: principal.hostname
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: principal.user.userid
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: metadata.event_timestamp.seconds
            population: known_populated
            os:
              - macos
              - linux
              - windows
          - path: metadata.id
            population: known_populated
            os:
              - macos
              - linux
              - windows
        coverage_gaps:
          - Valid only under a profile that streams MDE DeviceProcessEvents (ENVPROFILE-A). Not fireable under ENVPROFILE-B.
          - Secret reads performed in-process by a script (fs.readFile) produce no command line and are not visible here.
    attack:
      attack_version: "19.2"
      bundle_ref: null
      tactics:
        - credential_access
      technique_ids:
        - T1552.001
        - T1552.004
      mapping_rationale: A single command line from a search, shell or scripting client that names three or more distinct categories of developer-secret file (.npmrc, gh hosts.yml or GITHUB_TOKEN, SSH private keys, cloud credential files, Docker or kube config, .env or .tfvars, keystores) is unsecured-credential file access (T1552.001); the SSH and certificate key categories are T1552.004. Mapping names the observed command-line values, not the campaign.
    lookback: 30d
    schedule: null
    confidence:
      rating: Medium
      rationale: Single-stage logic with no campaign-specific anchor; precision comes from requiring at least three secret categories in one command line from a search or scripting client, which excludes ordinary single-file reads. Baseline for the KQL equivalent was 912 raw rows before the category threshold and 1 after (workbook Q025).
    severity:
      rating: High
      rationale: A true positive is enumeration of multiple credential stores on a developer host, the collection stage immediately before token theft; exposure spans npm, GitHub, cloud and SSH.
    false_positives:
      - id: FP1
        scenario: Dotfile backup, sync or migration scripts (chezmoi, rsync of the home directory, onboarding scripts) that list several credential files in one command.
        population: Developers using dotfile managers; IT onboarding scripts
        distinguishing_fields:
          - field: target.process.command_line
            benign_pattern: rsync, chezmoi, stow, or a backup destination path alongside the secret paths; parent is a scheduled job or the dotfile manager
        handled_by: triage
        suppression_id: null
      - id: FP2
        scenario: Key and certificate tooling that names .pem, .p12 or id_rsa as inputs (ssh-keygen, openssl, terraform, keytool, certutil) or checksum tools run over a config directory.
        population: All developers and platform engineers
        distinguishing_fields:
          - field: target.process.command_line
            benign_pattern: contains ssh-keygen, terraform, openssl, keytool, certutil, shasum, md5sum or sha256sum
        handled_by: suppression
        suppression_id: S1
      - id: FP3
        scenario: Git object reads (git show, git log -p) that print paths of secret files tracked in a repository.
        population: Developers on repositories that commit example .env or key files
        distinguishing_fields:
          - field: target.process.command_line
            benign_pattern: git log|show|cat-file|diff|grep|status|ls-tree
        handled_by: suppression
        suppression_id: S2
    tuning_notes:
      baseline:
        window_days: 10
        before_tuning: 912
        after_tuning: 1
        alerts_per_day_after_aggregation: null
        measured_on: "2026-10-09"
        measurement_procedure: The KQL equivalent (workbook Q025) returned 912 rows over 10 days before requiring payload context or a category count, and 1 row after; the single row was triaged benign. Re-measure this YARA-L form over 30 days in a tenant that ingests PROCESS_LAUNCH and record distinct device-user pairs.
      suppressions:
        - id: S1
          logic_ref: "// S1:"
          reason: Key, certificate, infrastructure and checksum tools name secret files as legitimate inputs.
          depends_on_enrichment: false
          fails_closed_how: Literal regex on the event's own command line.
        - id: S2
          logic_ref: "// S2:"
          reason: Git object reads print tracked file paths without reading the files from the working tree.
          depends_on_enrichment: false
          fails_closed_how: Literal regex on the event's own command line.
      dependencies: []
      first_parameter_to_adjust: The category threshold in the condition ($secret_categories >= 3). Raise to 4 if dotfile managers dominate results; do not lower below 3.
      known_limitations:
        - Categories are counted within one command line, so an enumeration split across several commands by the same actor is under-counted; $event_count and $commands in the output let the analyst see the sequence.
        - Hunt output; not FP-ceiling bound and must not be scheduled as an alerting rule.
      split_from: []
    references:
      - id: REF1
        title: Shai-Hulud H05-MDE developer-secret collection hunt (workbook row Q025) and its tuning history
        locator: shikari fable fidelity workbook (populated).xlsx, Queries tab, Q025 Query Text and Notes
        accessed: "2026-10-10"
        used_for:
          - secret category definitions
          - exclusion lists S1 and S2
          - baseline numbers
    indicators: []
    reference_lists: []
    entity_output:
      timestamp_first: $first_seen
      timestamp_last: $last_seen
      device: $hostnames
      account: $user
      process: $processes, $commands
      parent_command_line: $parent_commands
      evidence_value: $commands, $secret_categories
      source_table: null
    correlation:
      events:
        - var: p
          source_id: LS1
          role: single
      join_keys: []
      ordering: null
      window: 30m
    regexes:
      - id: RX1
        field: target.process.file.full_path
        pattern: |-
          (^|[\\/])(find|grep|rg|ripgrep|cat|python3?|bash|sh|zsh|node|bun)(\.exe)?$
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - '/usr/bin/find'
          - '/bin/zsh'
        must_not_match:
          - '/usr/bin/findmnt'
          - '/usr/local/bin/catalina'
      - id: RX2
        field: target.process.command_line
        pattern: |-
          \b(ssh-keygen|terraform|openssl|keytool|certutil|shasum|md5sum|sha256sum)\b
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'openssl pkcs12 -in client.p12 -out client.pem'
        must_not_match:
          - 'cat ~/.npmrc ~/.ssh/id_rsa ~/.aws/credentials'
      - id: RX3
        field: target.process.command_line
        pattern: |-
          \bgit\s+(log|show|cat-file|diff|grep|status|ls-tree)\b
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'git show HEAD:.env'
        must_not_match:
          - 'cat .env'
      - id: RX4
        field: target.process.command_line
        pattern: |-
          (^|[\s/\\"'])\.npmrc([\s"']|$)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'cat ~/.npmrc'
        must_not_match:
          - 'cat npmrc_backup'
      - id: RX5
        field: target.process.command_line
        pattern: |-
          (\.config[/\\]gh[/\\]hosts\.yml|\bGITHUB_TOKEN\b|\bACTIONS_RUNTIME_TOKEN\b)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'cat ~/.config/gh/hosts.yml'
        must_not_match:
          - 'git status'
      - id: RX6
        field: target.process.command_line
        pattern: |-
          (^|[\s/\\"'])(id_rsa|id_ed25519|id_ecdsa)([\s"']|$)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'cat /Users/dev/.ssh/id_ed25519'
        must_not_match:
          - 'ssh-copy-id -i id_ed25519.pub host'
      - id: RX7
        field: target.process.command_line
        pattern: |-
          (\.aws[/\\]credentials|\.azure[/\\](accessTokens|msal_token_cache)|\.config[/\\]gcloud[/\\](credentials\.db|access_tokens\.db|application_default_credentials\.json))
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'cat ~/.aws/credentials'
        must_not_match:
          - 'aws s3 ls'
      - id: RX8
        field: target.process.command_line
        pattern: |-
          (\.docker[/\\]config\.json|\.kube[/\\]config)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'cat ~/.docker/config.json'
        must_not_match:
          - 'docker ps'
      - id: RX9
        field: target.process.command_line
        pattern: |-
          (^|[\s/\\"'])(\.env([._-][A-Za-z0-9_-]+)?|[A-Za-z0-9_-]+\.tfvars)([\s"']|$)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'cat .env.production'
          - 'grep -r password terraform.tfvars'
        must_not_match:
          - 'source venv/bin/activate'
      - id: RX10
        field: target.process.command_line
        pattern: |-
          \.(kdbx|ovpn|pem|p12|pfx|jks)([\s"']|$)
        engine: re2
        literal_encoding: yara_l_backtick
        must_match:
          - 'find / -name *.pem'
        must_not_match:
          - 'openssl x509 -in cert.pem.bak'
    complexity:
      lines: 50
      event_variables_or_joins: 1
      union_branches: 0
      nesting_depth: 0
    validation:
      fidelity_basis: logic_review
      compile:
        status: not_run
      field_existence:
        schema_ref: Google SecOps UDM field list, 2026-10
        status: checked
      field_population:
        status: known_populated
        evidence: MDE PROCESS_LAUNCH in SecOps populates target.process and principal.process fields on 2,619 of 2,619 sampled events (workbook Q054 Notes).
      ingestion:
        status: unverified
        profile_ref: ENVPROFILE-A-secops-full-mde
      join_portability:
        status: not_applicable
        notes: Single event variable; match on device and user placeholders.
      regex_checks:
        status: not_run
      positive_control:
        status: not_run
        procedure: On a test host run a single command naming three categories, for example cat ~/.npmrc ~/.ssh/id_rsa ~/.aws/credentials, and confirm one hunt result for that device and user with secret_categories = 3; then run cat ~/.npmrc alone and confirm no result. The outcome arithmetic (sum of if() terms inside max) must also be confirmed to compile in the tenant.
        evidence_ref: null
        date: null
    query: |
      rule credential_access_t1552_001_udm_process_dev_secret_mass_enumeration_hunt {
        meta:
          author = "Shikari Detection Engineering"
          description = "A search, shell or scripting client names three or more distinct categories of developer-secret file in one command line. Hunt: analyst-reviewed, 30-day lookback, aggregated per device and user over 30 minutes."
          rule_id = "34bca16f-5ae0-4eee-b543-41a54e262744"
          version = "1.0.0"
          status = "draft"
          detection_type = "hunt"
          attack_version = "19.2"
          tactic = "credential_access"
          technique_ids = "T1552.001, T1552.004"
          severity = "HIGH"
          priority = "MEDIUM"
          confidence = "Medium"
          reference = "REF1"

        events:
          $p.metadata.event_type = "PROCESS_LAUNCH"
          $p.target.process.command_line != ""
          re.regex($p.target.process.file.full_path, `(^|[\\/])(find|grep|rg|ripgrep|cat|python3?|bash|sh|zsh|node|bun)(\.exe)?$`) nocase
          // S1: key, certificate, infrastructure and checksum tools name secret files as inputs
          not re.regex($p.target.process.command_line, `\b(ssh-keygen|terraform|openssl|keytool|certutil|shasum|md5sum|sha256sum)\b`) nocase
          // S2: git object reads print tracked paths without reading the working tree
          not re.regex($p.target.process.command_line, `\bgit\s+(log|show|cat-file|diff|grep|status|ls-tree)\b`) nocase
          $p.principal.asset_id = $device
          $device != ""
          $p.principal.user.userid = $user
          $user != ""

        match:
          $device, $user over 30m

        outcome:
          // One point per secret category named in a single command line; max across the window
          $secret_categories = max(
            if(re.regex($p.target.process.command_line, `(^|[\s/\\"'])\.npmrc([\s"']|$)`) nocase, 1, 0)
            + if(re.regex($p.target.process.command_line, `(\.config[/\\]gh[/\\]hosts\.yml|\bGITHUB_TOKEN\b|\bACTIONS_RUNTIME_TOKEN\b)`) nocase, 1, 0)
            + if(re.regex($p.target.process.command_line, `(^|[\s/\\"'])(id_rsa|id_ed25519|id_ecdsa)([\s"']|$)`) nocase, 1, 0)
            + if(re.regex($p.target.process.command_line, `(\.aws[/\\]credentials|\.azure[/\\](accessTokens|msal_token_cache)|\.config[/\\]gcloud[/\\](credentials\.db|access_tokens\.db|application_default_credentials\.json))`) nocase, 1, 0)
            + if(re.regex($p.target.process.command_line, `(\.docker[/\\]config\.json|\.kube[/\\]config)`) nocase, 1, 0)
            + if(re.regex($p.target.process.command_line, `(^|[\s/\\"'])(\.env([._-][A-Za-z0-9_-]+)?|[A-Za-z0-9_-]+\.tfvars)([\s"']|$)`) nocase, 1, 0)
            + if(re.regex($p.target.process.command_line, `\.(kdbx|ovpn|pem|p12|pfx|jks)([\s"']|$)`) nocase, 1, 0)
          )
          $first_seen = min($p.metadata.event_timestamp.seconds)
          $last_seen = max($p.metadata.event_timestamp.seconds)
          $event_count = count_distinct($p.metadata.id)
          $hostnames = array_distinct($p.principal.hostname)
          $processes = array_distinct($p.target.process.file.full_path)
          $commands = array_distinct($p.target.process.command_line)
          $parent_commands = array_distinct($p.principal.process.command_line)

        condition:
          $p and $secret_categories >= 3
      }
