# tier: 1 vendor threat research · 2 CERT / government · 3 reputable news & community
#       4 structured / aggregator
#
# The first 26 are the proven-working feeds Shikari's Threat Feed already uses
# (shikari.intelligence.feed.SOURCES). The rest are curated and should be verified over time; a
# feed that fails to fetch or parse is simply skipped, so a wrong URL never breaks a search.
# Admins can add installation-specific feeds via the Threat Feed page (shared) without editing this.

