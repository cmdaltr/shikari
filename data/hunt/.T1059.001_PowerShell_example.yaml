id: hunt-t1059-001-powershell-01
name: Hunt - PowerShell Execution with Suspicious Parameters
description: |
  Hunts for PowerShell execution with commonly abused parameters that may indicate
  malicious activity. This detection focuses on MITRE ATT&CK technique T1059.001
  (Command and Scripting Interpreter: PowerShell).
mitre_attack:
  technique_id: T1059.001
  technique_name: Command and Scripting Interpreter - PowerShell
  tactic: Execution
severity: Medium
platform: mde
query: |
  DeviceProcessEvents
  | where Timestamp > ago(30d)
  | where FileName in~ ("powershell.exe", "pwsh.exe")
  | where ProcessCommandLine has_any (
      "-encodedcommand", "-enc",
      "-windowstyle hidden", "-w hidden",
      "-noprofile", "-nop",
      "-executionpolicy bypass", "-ep bypass",
      "downloadstring", "downloadfile",
      "invoke-expression", "iex",
      "bitstransfer"
  )
  | extend CommandLength = strlen(ProcessCommandLine)
  | where CommandLength > 100
  | summarize
      FirstSeen = min(Timestamp),
      LastSeen = max(Timestamp),
      ExecutionCount = count(),
      UniqueDevices = dcount(DeviceName),
      SampleCommands = make_set(ProcessCommandLine, 3)
      by AccountName, FileName, InitiatingProcessFileName
  | where ExecutionCount >= 2 or UniqueDevices >= 2
  | project-reorder FirstSeen, LastSeen, AccountName, FileName, ExecutionCount, UniqueDevices
  | order by ExecutionCount desc
hunt_metadata:
  created: 2024-01-15
  last_updated: 2024-01-15
  author: Shikari Threat Hunting Platform
  confidence: High
  false_positive_rate: Low
  hunt_type: proactive
  data_sources:
    - Process Creation
    - Command Line
  references:
    - https://attack.mitre.org/techniques/T1059/001/
tags:
  - PowerShell
  - CommandLine
  - Execution
  - T1059.001
