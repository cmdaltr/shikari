id: a3b8e9f1-4c2d-4e6f-8a9b-1c2d3e4f5a6b
name: PowerShell Encoded Command Execution
description: |
  Detects execution of encoded PowerShell commands commonly used by threat actors for
  initial access and execution. This technique allows adversaries to obfuscate
  malicious commands and evade detection.
severity: High
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceProcessEvents
tactics:
  - Execution
  - Defense Evasion
tags:
  - APT29 (Group)
  - PowerShell
  - Obfuscation
relevantTechniques:
  - T1059.001
  - T1027
query: |
  DeviceProcessEvents
  | where Timestamp > ago(7d)
  | where FileName =~ "powershell.exe" or FileName =~ "pwsh.exe"
  | where ProcessCommandLine has_any ("-enc", "-encodedcommand", "frombase64string")
  | where ProcessCommandLine !contains "Microsoft" // Reduce false positives
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName
  | summarize by Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessFileName
