technique_id: T1053.005
technique_name: Remote Scheduled Task Creation
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.95
validated: true
query: "/* Task Scheduler service incoming connection followed by TaskCache registry\
  \ modification  */\n\nsequence by host.id, process.entity_id with maxspan = 1m\n\
  \   [network where host.os.type == \"windows\" and process.name : \"svchost.exe\"\
  \ and\n   network.direction : (\"incoming\", \"ingress\") and source.port >= 49152\
  \ and destination.port >= 49152 and\n   source.ip != \"127.0.0.1\" and source.ip\
  \ != \"::1\"\n   ]\n   [registry where host.os.type == \"windows\" and event.type\
  \ == \"change\" and registry.value : \"Actions\" and\n    registry.path : \"*\\\\\
  SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Schedule\\\\TaskCache\\\
  \\Tasks\\\\*\\\\Actions\"]"
explanation: Identifies remote scheduled task creations on a target host. This could
  be indicative of adversary lateral movement.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/954ee7c8-5437-49ae-b2d6-2960883898e9.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - There is a high possibility of benign activity tied to the creation of remote
    scheduled tasks as it is a general feature within Windows and used for legitimate
    purposes for a wide range of activity. Any kind of context should be found to
    further understand the source of the activity and determine the intent based on
    the scheduled task''s contents.


