false_positives:
- description: 'False positive analysis


    - Administrative tasks using hidden shares can trigger alerts. Regularly review
    and document legitimate administrative activities that involve file transfers
    to hidden shares.

    - Backup operations often use hidden shares for data storage. Identify and exclude
    backup processes by specifying known backup software and their typical command-line
    arguments.

    - Software deployment tools may utilize hidden shares for distributing updates.
    Create exceptions for recognized deployme'
  mitigation: Review investigation guide for details
