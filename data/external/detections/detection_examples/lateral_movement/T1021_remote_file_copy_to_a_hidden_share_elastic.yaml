technique_id: T1021
technique_name: Remote File Copy to a Hidden Share
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : (\"cmd.exe\", \"powershell.exe\", \"xcopy.exe\", \"pwsh.exe\"\
  , \"powershell_ise.exe\") and \n  process.command_line : \"*\\\\\\\\*\\\\*$*\" and\
  \ process.command_line : (\"*copy*\", \"*move*\", \"* cp *\", \"* mv *\")"
explanation: 'Identifies a remote file copy attempt to a hidden network share. This
  may indicate lateral movement or data staging

  activity.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/fa01341d-6662-426b-9d0c-6d81e33c8a9d.toml
query_type: eql
query_language: eql
