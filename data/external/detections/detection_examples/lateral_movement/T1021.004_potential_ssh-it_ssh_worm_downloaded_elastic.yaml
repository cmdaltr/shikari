technique_id: T1021.004
technique_name: Potential SSH-IT SSH Worm Downloaded
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \ event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\", \"executed\"\
  , \"process_started\") and\n process.name in (\"curl\", \"wget\") and process.args\
  \ : (\n  \"https://thc.org/ssh-it/x\", \"http://nossl.segfault.net/ssh-it-deploy.sh\"\
  , \"https://gsocket.io/x\",\n  \"https://thc.org/ssh-it/bs\", \"http://nossl.segfault.net/bs\"\
  \n)"
explanation: 'Identifies processes that are capable of downloading files with command
  line arguments containing URLs to SSH-IT''s

  autonomous SSH worm. This worm intercepts outgoing SSH connections every time a
  user uses ssh.'
