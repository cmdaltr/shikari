technique_id: T1210
technique_name: Potential WSUS Abuse for Lateral Movement
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\
  \ process.parent.name : \"wuauclt.exe\" and\nprocess.executable : (\n    \"?:\\\\\
  Windows\\\\SoftwareDistribution\\\\Download\\\\Install\\\\*\",\n    \"\\\\Device\\\
  \\HarddiskVolume?\\\\Windows\\\\SoftwareDistribution\\\\Download\\\\Install\\\\\
  *\"\n) and\n(process.name : \"psexec64.exe\" or ?process.pe.original_file_name :\
  \ \"psexec.c\")"
explanation: 'Identifies a potential Windows Server Update Services (WSUS) abuse to
  execute psexec to enable for lateral movement.

  WSUS is limited to executing Microsoft signed binaries, which limits the executables
  that can be used to tools published

  by Microsoft.'
