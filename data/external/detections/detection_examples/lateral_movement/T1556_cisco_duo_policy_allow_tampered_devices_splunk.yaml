explanation: "The following analytic detects when a Duo policy is created or updated\
  \ to allow tampered or rooted devices, such as jailbroken smartphones, \nto access\
  \ protected resources. It identifies this behavior by searching Duo administrator\
  \ activity logs for policy changes where the allow_rooted_devices \nsetting is enabled.\
  \ This is accomplished by filtering for policy creation or update actions and parsing\
  \ the policy description for the relevant configuration. \nAllowing tampered devices\
  \ poses a significant security risk, as these devices may bypass built-in security\
  \ controls, run unauthorized software, or be more \nsusceptible to compromise. For\
  \ a Security Operations Center (SOC), identifying such policy changes is critical\
  \ because it may indicate either a \nmisconfiguration or a malicious attempt to\
  \ weaken authentication requirements, potentially enabling attackers to access sensitive\
  \ systems with \ncompromised devices. The impact of this attack can include unauthorized\
  \ access, data breaches, and lateral movement within the environment, \nmaking prompt\
  \ detection and response essential to maintaining organizational security."
