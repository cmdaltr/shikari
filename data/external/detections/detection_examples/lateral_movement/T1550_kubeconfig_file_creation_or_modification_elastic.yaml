technique_id: T1550
technique_name: Kubeconfig File Creation or Modification
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"linux\" and event.type != \"deletion\" and file.path\
  \ like (\n  \"/root/.kube/config\",\n  \"/home/*/.kube/config\",\n  \"/etc/kubernetes/admin.conf\"\
  ,\n  \"/etc/kubernetes/super-admin.conf\",\n  \"/etc/kubernetes/kubelet.conf\",\n\
  \  \"/etc/kubernetes/controller-manager.conf\",\n  \"/etc/kubernetes/scheduler.conf\"\
  ,\n  \"/var/lib/*/kubeconfig\"\n) and not (\n  process.name in (\"kubeadm\", \"\
  kubelet\", \"vcluster\", \"minikube\") or\n  (process.name == \"sed\" and file.Ext.original.name\
  \ like \"sed*\")\n)"
explanation: 'The kubeconfig file is a critical component in Kubernetes environments,
  containing configuration

  details for accessing and managing Kubernetes clusters. Attackers may attempt to
  get access to,

  create or modify kubeconfig files to gain unauthorized initial access to Kubernetes
  clusters or

  move laterally within the cluster.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b11116fd-023c-4718-aeb8-fa9d283fc53b.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tools like kubeadm, kubelet, vcluster, and minikube
    may create or modify kubeconfig files as part of normal operations. Ensure these
    processes are excluded from triggering alerts by maintaining the exclusion list
    in the detection rule.

    - Automated scripts or configuration management tools that use sed to modify kubeconfig
    files might be flagged. Consider adding specific script names or paths to the
    exclusion list if they are verified as non-th'
  mitigation: Review investigation guide for details
references:
- https://kubernetes-threat-matrix.redguard.ch/initial-access/kubeconfig-file/
- https://kubenomicon.com/Initial_access/Kubeconfig_file.html
has_investigation_guide: true
risk_score: 47
