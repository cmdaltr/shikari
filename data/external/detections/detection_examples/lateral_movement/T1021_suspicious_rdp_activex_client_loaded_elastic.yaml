  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tools or scripts that load mstscax.dll from non-standard
    paths may trigger false positives. To mitigate this, identify and document these
    tools, then add their paths to the exclusion list in the detection rule.

    - Software updates or installations that temporarily load mstscax.dll from unusual
    locations can cause false alerts. Monitor and log these activities, and consider
    excluding these paths if they are consistently flagged during known upda'
  mitigation: Review investigation guide for details
