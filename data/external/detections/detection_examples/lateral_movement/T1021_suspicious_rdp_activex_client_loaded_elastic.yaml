technique_id: T1021
technique_name: Suspicious RDP ActiveX Client Loaded
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.95
validated: true
query: "any where host.os.type == \"windows\" and\n (event.category : (\"library\"\
  , \"driver\") or (event.category == \"process\" and event.action : \"Image loaded*\"\
  )) and\n (?dll.name : \"mstscax.dll\" or file.name : \"mstscax.dll\") and\n   /*\
  \ depending on noise in your env add here extra paths  */\n  process.executable\
  \ : (\n    \"C:\\\\Windows\\\\*\",\n    \"C:\\\\Users\\\\Public\\\\*\",\n    \"\
  C:\\\\Users\\\\Default\\\\*\",\n    \"C:\\\\Intel\\\\*\",\n    \"C:\\\\PerfLogs\\\
  \\*\",\n    \"C:\\\\ProgramData\\\\*\",\n    \"\\\\Device\\\\Mup\\\\*\",\n    \"\
  \\\\\\\\*\"\n  ) and\n  /* add here FPs */\n  not process.executable : (\n    \"\
  ?:\\\\Windows\\\\System32\\\\mstsc.exe\",\n    \"?:\\\\Windows\\\\SysWOW64\\\\mstsc.exe\"\
  ,\n    \"?:\\\\Windows\\\\System32\\\\vmconnect.exe\",\n    \"?:\\\\Windows\\\\\
  System32\\\\WindowsSandboxClient.exe\",\n    \"?:\\\\Windows\\\\System32\\\\hvsirdpclient.exe\"\
  \n  )"
explanation: 'Identifies suspicious Image Loading of the Remote Desktop Services ActiveX
  Client (mstscax), this may indicate the

  presence of RDP lateral movement capability.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/71c5cb27-eca5-4151-bb47-64bc3f883270.toml
query_type: eql
query_language: eql
indicators:
