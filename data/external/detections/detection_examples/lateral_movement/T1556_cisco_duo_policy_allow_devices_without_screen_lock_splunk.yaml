query: '`cisco_duo_administrator` action=policy_update OR action=policy_create | spath
  input=description | search require_lock=false | rename object as user | stats count
  min(_time) as firstTime max(_time) as lastTime by action actionlabel description
  user admin_email | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `cisco_duo_policy_allow_devices_without_screen_lock_filter`'
explanation: "The following analytic detects when a Duo policy is created or updated\
  \ to allow devices without a screen lock requirement. It identifies this behavior\
  \ \nby searching Duo administrator activity logs for policy creation or update events\
  \ where the 'require_lock' setting is set to false. This action may indicate \n\
  a weakening of device security controls, potentially exposing the organization to\
  \ unauthorized access if devices are lost or stolen. For a Security Operations \n\
  Center (SOC), identifying such policy changes is critical, as attackers or malicious\
  \ insiders may attempt to lower authentication standards to facilitate \nunauthorized\
  \ access. The impact of this attack could include increased risk of credential compromise,\
  \ data breaches, or lateral movement within the \nenvironment due to reduced device\
  \ security requirements."
