technique_id: T1021.004
technique_name: AWS EC2 Instance Connect SSH Public Key Uploaded
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset: aws.cloudtrail\n    and event.provider: ec2-instance-connect.amazonaws.com\n\
  \    and event.action: (SendSSHPublicKey or SendSerialConsoleSSHPublicKey)\n   \
  \ and event.outcome: success"
explanation: 'Identifies when a new SSH public key is uploaded to an AWS EC2 instance
  using the EC2 Instance Connect service. This

  action could indicate an adversary attempting to maintain access to the instance.
  The rule detects the

  SendSerialConsoleSSHPublicKey or SendSSHPublicKey API actions, which are logged
  when manually uploading an SSH key

  to an EC2 instance or serial connection. It is important to know that this API call
  happens automatically by the EC2

  Instance Connect service when a user connects to an EC2 instance using the EC2 Instance
  Connect service via the CLI or

  AWS Management Console.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/873b5452-074e-11ef-852e-f661ea17fbcc.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS EC2
  confidence: high
false_positives:
- description: 'False Positive Analysis:


    - **Legitimate Administrative Actions**: Confirm if the SSH public key upload
    aligns with scheduled updates, development activities, or legitimate administrative
    tasks documented in change management systems.

    - **Consistency Check**: Compare the action against historical data of similar
    actions performed by the user or within the organization. If the action is consistent
    with past legitimate activities, it might indicate a false alarm.



    ### Response and Remediation:


    -'
