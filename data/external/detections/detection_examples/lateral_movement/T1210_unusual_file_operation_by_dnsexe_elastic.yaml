technique_id: T1210
technique_name: Unusual File Operation by dns.exe
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.category : \"file\" and host.os.type : \"windows\" and\n  event.type\
  \ : (\"creation\" or \"deletion\" or \"change\") and process.name : \"dns.exe\"\
  \ and\n  not file.extension : (\"old\" or \"temp\" or \"bak\" or \"dns\" or \"arpa\"\
  \ or \"log\")"
explanation: 'Identifies an unexpected file being modified by dns.exe, the process
  responsible for Windows DNS Server services, which

  may indicate activity related to remote code execution or other forms of exploitation.'
