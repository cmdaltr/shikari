false_positives:
- description: 'False positive analysis


    - DNS debug logging configured to write to a file with a non-.log extension (e.g.,
    .txt) causes dns.exe to legitimately create or rotate that file during troubleshooting.

    - An administrator exports a zone to a custom-named file with a nonstandard extension
    (e.g., .txt or .xml), leading dns.exe to create or modify that file as part of
    routine maintenance.


    ### Response and remediation


    - Isolate the host by removing it from DNS rotation and restricting network access
