false_positives:
- description: 'False positive analysis


    - Legitimate administrative activities may trigger alerts when IT staff use RDP
    Shadowing for support. To manage this, create exceptions for known IT administrator
    accounts or specific IP addresses.

    - Scheduled maintenance or automated scripts that modify RDP Shadow registry settings
    can be mistaken for malicious activity. Identify and exclude these processes or
    scripts from the detection rule.

    - Security software or monitoring tools that interact with RDP sessions might'
  mitigation: Review investigation guide for details
