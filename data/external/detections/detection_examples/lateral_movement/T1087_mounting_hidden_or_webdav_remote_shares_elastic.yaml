false_positives:
- description: 'False positive analysis


    - Legitimate use of net.exe for mounting network drives in enterprise environments
    can trigger false positives. Users can create exceptions for known internal IP
    addresses or specific user accounts frequently performing these actions.

    - Automated scripts or system processes that use net.exe to connect to WebDav
    or hidden shares for legitimate purposes may be flagged. Identify these scripts
    and processes, and exclude them by their process hash or command line patterns.

    -'
  mitigation: Review investigation guide for details
has_investigation_guide: true
