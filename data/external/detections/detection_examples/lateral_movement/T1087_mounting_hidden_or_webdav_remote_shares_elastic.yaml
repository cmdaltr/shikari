technique_id: T1087
technique_name: Mounting Hidden or WebDav Remote Shares
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ ((process.name : \"net.exe\" or ?process.pe.original_file_name == \"net.exe\"\
  ) or ((process.name : \"net1.exe\" or ?process.pe.original_file_name == \"net1.exe\"\
  ) and\n not process.parent.name : \"net.exe\")) and\n process.args : \"use\" and\n\
  \ /* including hidden and webdav based online shares such as onedrive  */\n process.args\
  \ : (\"\\\\\\\\*\\\\*$*\", \"\\\\\\\\*@SSL\\\\*\", \"http*\") and\n /* excluding\
  \ shares deletion operation */\n not process.args : \"/d*\""
explanation: 'Identifies the use of net.exe to mount a WebDav or hidden remote share.
  This may indicate lateral movement or

  preparation for data exfiltration.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c4210e1c-64f2-4f48-b67e-b5a8ffe3aa14.toml
query_type: eql
query_language: eql
