technique_id: T1556.006
technique_name: Azure AD Multi-Factor Authentication Disabled
tactic: lateral_movement
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` category=AuditLogs operationName="Disable Strong Authentication"
  | rename properties.* as * | rename targetResources{}.type as type | rename initiatedBy.user.userPrincipalName
  as initiatedBy | rename userAgent as user_agent | fillnull | stats count min(_time)
  as firstTime max(_time) as lastTime by dest user src vendor_account vendor_product
  user_agent initiatedBy signature | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `azure_ad_multi_factor_authentication_disabled_filter`'
explanation: The following analytic detects attempts to disable multi-factor authentication
  (MFA) for an Azure AD user. It leverages Azure Active Directory AuditLogs to identify
  the "Disable Strong Authentication" operation. This activity is significant because
  disabling MFA can allow adversaries to maintain persistence using compromised accounts
  without raising suspicion. If confirmed malicious, this action could enable attackers
  to bypass an essential security control, potentially leading to unauthorized access
  and prolonged undetected presence in the environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/482dd42a-acfa-486b-a0bb-d6fcda27318e/
indicators:
- type: data_source
  value: Azure Active Directory Disable Strong Authentication
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate use case may require for users to disable MFA. Filter as
    needed.
  mitigation: Review context and user activity
