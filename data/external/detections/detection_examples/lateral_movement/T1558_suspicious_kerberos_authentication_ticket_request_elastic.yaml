technique_id: T1558
technique_name: Suspicious Kerberos Authentication Ticket Request
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by source.port, source.ip with maxspan=3s\n [network where host.os.type\
  \ == \"windows\" and destination.port == 88 and\n  process.executable != null and\n\
  \  not process.executable : (\"?:\\\\Windows\\\\system32\\\\lsass.exe\", \"\\\\\
  device\\\\harddiskvolume*\\\\windows\\\\system32\\\\lsass.exe\") and\n  source.ip\
  \ != \"127.0.0.1\" and destination.ip != \"::1\" and destination.ip != \"127.0.0.1\"\
  ]\n [authentication where host.os.type == \"windows\" and event.code in (\"4768\"\
  , \"4769\")]"
explanation: 'Correlates network connections to the standard Kerberos port by an unusual
  process from the source machine with a Kerberos

  authentication ticket request from the target domain controller.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c6b40f4c-c6a9-434e-adb8-989b0d06d005.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Active Directory audit tools.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - Investigate credential exposure on systems compromised or used by the attacker
    to ensure all compromised accounts are identified. Reset passwords for these accounts
    and other potentially compromised credentials, such as email, business systems,
    and web service'
  mitigation: Review investigation guide for details
references:
- https://github.com/its-a-feature/bifrost
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768
