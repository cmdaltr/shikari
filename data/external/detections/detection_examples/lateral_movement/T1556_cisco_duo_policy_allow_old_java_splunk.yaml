technique_id: T1556
technique_name: Cisco Duo Policy Allow Old Java
tactic: lateral_movement
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '`cisco_duo_administrator` action=policy_update OR action=policy_create | spath
  input=description | search java_remediation="no remediation" | rename object as
  user | stats count min(_time) as firstTime max(_time) as lastTime by action actionlabel
  description user admin_email | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `cisco_duo_policy_allow_old_java_filter`'
explanation: "The following analytic detects when a Duo policy is created or updated\
  \ to allow the use of outdated Java versions, which can introduce significant \n\
  security risks. It works by searching Duo administrator activity logs for policy\
  \ creation or update actions where the policy explicitly sets \n'java_remediation'\
  \ to 'no remediation', indicating that no restrictions are enforced against old\
  \ Java. The analytic aggregates relevant details \nsuch as the user, admin email,\
  \ and action context for further investigation. Identifying this behavior is critical\
  \ for a Security Operations Center \n(SOC) because allowing outdated Java can expose\
  \ an organization to known vulnerabilities, malware, and exploitation techniques.\
  \ Attackers or malicious \ninsiders may attempt to weaken security controls by modifying\
  \ policies to permit insecure software, increasing the risk of compromise. Prompt\
  \ detection \nenables SOC analysts to respond quickly, revert risky changes, and\
  \ mitigate potential threats before they are exploited."
