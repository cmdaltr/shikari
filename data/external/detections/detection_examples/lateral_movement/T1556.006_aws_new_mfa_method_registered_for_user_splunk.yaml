technique_id: T1556.006
technique_name: AWS New MFA Method Registered For User
tactic: lateral_movement
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName=CreateVirtualMFADevice | rename userName as user |
  stats count min(_time) as firstTime max(_time) as lastTime by signature dest user
  user_agent src vendor_account vendor_region vendor_product | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_new_mfa_method_registered_for_user_filter`'
explanation: The following analytic detects the registration of a new Multi-Factor
  Authentication (MFA) method for an AWS account. It leverages AWS CloudTrail logs
  to identify the `CreateVirtualMFADevice` event. This activity is significant because
  adversaries who gain unauthorized access to an AWS account may register a new MFA
  method to maintain persistence. If confirmed malicious, this could allow attackers
  to secure their access, making it difficult to detect and remove their presence,
  potentially leading to further unauthorized activities and data breaches.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/4e3c26f2-4fb9-4bd7-ab46-1b76ffa2a23b/
indicators:
- type: data_source
  value: AWS CloudTrail CreateVirtualMFADevice
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Newly onboarded users who are registering an MFA method for the first
    time will also trigger this detection.
  mitigation: Review context and user activity
references:
- https://aws.amazon.com/blogs/security/you-can-now-assign-multiple-mfa-devices-in-iam/
- https://attack.mitre.org/techniques/T1556/
- https://attack.mitre.org/techniques/T1556/006/
- https://twitter.com/jhencinski/status/1618660062352007174
validation:
