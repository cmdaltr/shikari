technique_id: T1021.001
technique_name: Execution via TSClient Mountpoint
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'process where host.os.type == "windows" and event.type == "start" and process.executable
  : "\\Device\\Mup\\tsclient\\*.exe"'
explanation: 'Identifies execution from the Remote Desktop Protocol (RDP) shared mountpoint
  tsclient on the target host. This may

  indicate a lateral movement attempt.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/4fe9d835-40e1-452d-8230-17c147cafad8.toml
query_type: eql
query_language: eql
