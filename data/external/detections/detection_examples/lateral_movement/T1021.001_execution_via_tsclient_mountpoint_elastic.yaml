false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may trigger the rule if they are
    executed from a local drive mapped through TSClient. To manage this, create exceptions
    for known update processes or installation paths that are frequently used in your
    environment.

    - IT administrative tasks performed via RDP sessions can also cause false positives.
    Identify and exclude specific administrative tools or scripts that are regularly
    executed from TSClient paths by trusted personn'
  mitigation: Review investigation guide for details
