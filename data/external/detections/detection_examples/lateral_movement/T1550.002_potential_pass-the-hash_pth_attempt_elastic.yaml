technique_id: T1550.002
technique_name: Potential Pass-the-Hash (PtH) Attempt
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: 'host.os.type:"windows" and

  event.category : "authentication" and event.action : "logged-in" and

  winlog.logon.type : "NewCredentials" and event.outcome : "success" and

  user.id : (S-1-5-21-* or S-1-12-1-*) and winlog.event_data.LogonProcessName : "seclogo"'
explanation: 'Adversaries may pass the hash using stolen password hashes to move laterally
  within an environment, bypassing normal

  system access controls. Pass the hash (PtH) is a method of authenticating as a user
  without having access to the user''s

  cleartext password.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/daafdf96-e7b1-4f14-b494-27e0d24b11f6.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tools or scripts that use the "NewCredentials" logon
    type for automation or scheduled tasks can trigger false positives. Review and
    whitelist known benign processes or scripts that are part of regular operations.

    - Security software or monitoring tools that perform regular checks using the
    "seclogo" logon process may be misidentified. Identify and exclude these tools
    from the detection rule to prevent unnecessary alerts.

