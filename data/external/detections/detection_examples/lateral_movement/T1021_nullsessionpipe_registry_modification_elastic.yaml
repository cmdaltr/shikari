technique_id: T1021
technique_name: NullSessionPipe Registry Modification
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.9
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : \"NullSessionPipes\" and\n  length(registry.data.strings) >\
  \ 0 and\n  not registry.data.strings : \"(empty)\""
explanation: 'Identifies NullSessionPipe registry modifications that specify which
  pipes can be accessed anonymously. This could be

  indicative of adversary lateral movement preparation by making the added pipe available
  to everyone.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ddab1f5f-7089-44f5-9fda-de5b11322e77.toml
