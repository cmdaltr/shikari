false_positives:
- description: 'False positive analysis


    - Legitimate administrative tools or scripts may modify the NullSessionPipe registry
    setting as part of routine network management. Review the source of the change
    and verify if it aligns with known administrative activities.

    - Some network services or applications might require anonymous access to specific
    pipes for functionality. Identify these services and document them to differentiate
    between expected and unexpected modifications.

    - Scheduled tasks or automated depl'
  mitigation: Review investigation guide for details
