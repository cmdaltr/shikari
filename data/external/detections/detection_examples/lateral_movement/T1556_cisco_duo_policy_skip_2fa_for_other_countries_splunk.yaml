technique_id: T1556
technique_name: Cisco Duo Policy Skip 2FA for Other Countries
tactic: lateral_movement
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '`cisco_duo_administrator` action=policy_update OR action=policy_create | spath
  input=description | search user_locations_default_action="Allow access without 2FA"
  | rename object as user | stats count min(_time) as firstTime max(_time) as lastTime
  by action actionlabel description user admin_email | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `cisco_duo_policy_skip_2fa_for_other_countries_filter`'
explanation: "The following analytic detects when a Duo policy is created or updated\
  \ to allow access without two-factor authentication (2FA) \nfor users in countries\
  \ other than the default. It identifies this behavior by searching Duo administrator\
  \ activity logs for policy \ncreation or update actions where the policy description\
  \ indicates that access is permitted without 2FA for certain user locations. \n\
  This is achieved by parsing the relevant fields in the logs and filtering for the\
  \ specific condition of 'Allow access without 2FA.'\nThis behavior is significant\
  \ for a Security Operations Center (SOC) because bypassing 2FA for any user group\
  \ or location weakens \nthe organization's security posture and increases the risk\
  \ of unauthorized access. Attackers or malicious insiders may exploit \nsuch policy\
  \ changes to circumvent strong authentication controls, potentially leading to account\
  \ compromise, data breaches, or \nlateral movement within the environment. Early\
  \ detection of these policy modifications enables the SOC to investigate and respond\
  \ \nbefore attackers can leverage the weakened controls, thereby reducing the risk\
  \ and impact of a successful attack."
