technique_id: T1021.003
technique_name: Incoming DCOM Lateral Movement with ShellBrowserWindow or ShellWindows
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id with maxspan=5s\n [network where host.os.type == \"windows\"\
  \ and event.type == \"start\" and process.name : \"explorer.exe\" and\n  network.direction\
  \ : (\"incoming\", \"ingress\") and network.transport == \"tcp\" and\n  source.port\
  \ > 49151 and destination.port > 49151 and source.ip != \"127.0.0.1\" and source.ip\
  \ != \"::1\"\n ] by process.entity_id\n [process where host.os.type == \"windows\"\
  \ and event.type == \"start\" and\n  process.parent.name : \"explorer.exe\"\n ]\
  \ by process.parent.entity_id"
explanation: 'Identifies use of Distributed Component Object Model (DCOM) to run commands
  from a remote host, which are launched via

  the ShellBrowserWindow or ShellWindows Application COM Object. This behavior may
  indicate an attacker abusing a DCOM

  application to stealthily move laterally.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8f919d4b-a5af-47ca-a594-6be59cd924a4.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may trigger the rule due to the
    use of DCOM for remote management tasks. Users can create exceptions for known
    update processes by identifying their specific network and process patterns.

    - Internal IT management tools that utilize DCOM for remote administration might
    cause false positives. Review and whitelist these tools by confirming their source
    IP addresses and process behaviors.

    - Automated scripts or scheduled tasks t'
  mitigation: Review investigation guide for details
references:
- https://enigma0x3.net/2017/01/23/lateral-movement-via-dcom-round-2/
has_investigation_guide: true
risk_score: 47
