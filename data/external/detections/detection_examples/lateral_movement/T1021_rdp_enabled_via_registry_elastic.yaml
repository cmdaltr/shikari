technique_id: T1021
technique_name: RDP Enabled via Registry
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : \"fDenyTSConnections\" and\n  registry.data.strings : (\"0\"\
  , \"0x00000000\") and\n  not process.executable : (\n        \"?:\\\\Windows\\\\\
  System32\\\\SystemPropertiesRemote.exe\",\n        \"?:\\\\Windows\\\\System32\\\
  \\SystemPropertiesComputerName.exe\",\n        \"?:\\\\Windows\\\\System32\\\\SystemPropertiesAdvanced.exe\"\
  ,\n        \"?:\\\\Windows\\\\System32\\\\SystemSettingsAdminFlows.exe\",\n    \
  \    \"?:\\\\Windows\\\\WinSxS\\\\*\\\\TiWorker.exe\",\n        \"?:\\\\Windows\\\
  \\system32\\\\svchost.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\
  \\System32\\\\SystemPropertiesRemote.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\System32\\\\SystemPropertiesComputerName.exe\",\n        \"\\\\Device\\\
  \\HarddiskVolume*\\\\Windows\\\\System32\\\\SystemPropertiesAdvanced.exe\",\n  \
  \      \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\SystemSettingsAdminFlows.exe\"\
  ,\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\WinSxS\\\\*\\\\TiWorker.exe\"\
  ,\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\system32\\\\svchost.exe\"\
  \n  )"
explanation: 'Identifies registry write modifications to enable Remote Desktop Protocol
  (RDP) access. This could be indicative of

  adversary lateral movement preparation.'
source: Elastic Detection Rules
