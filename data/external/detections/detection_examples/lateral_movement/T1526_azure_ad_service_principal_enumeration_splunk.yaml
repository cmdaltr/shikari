technique_id: T1526
technique_name: Azure AD Service Principal Enumeration
tactic: lateral_movement
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` category IN (MicrosoftGraphActivityLogs) TERM(servicePrincipals)
  | fillnull | rex field="properties.requestUri" "https\:\/\/graph.microsoft.com\/beta\/servicePrincipals\/(?P<servicePrincipalb>.*?)\/"
  | rex field="properties.requestUri" "https\:\/\/graph.microsoft.com\/v1.0\/servicePrincipals\/(?P<servicePrincipalv1>.*?)\/"
  | eval spn=coalesce(servicePrincipalb,servicePrincipalv1) | fillnull | stats count
  min(_time) as _time dc(spn) as spn_count values(user_id) as user_id by dest user
  src vendor_account vendor_product signature | where spn_count>9 | `azure_ad_service_principal_enumeration_filter`'
explanation: This detection leverages azure graph activity logs to identify when graph
  APIs have been used to identify 10 or more service principals. This type of behaviour
  is associated with tools such as Azure enumberation tools such as AzureHound or
  ROADtools.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/3f0647ce-add5-4436-8039-cbd1abe74563/
indicators:
- type: data_source
  value: Azure Active Directory MicrosoftGraphActivityLogs
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Unknown
  mitigation: Review context and user activity
references:
- https://github.com/SpecterOps/AzureHound
- https://github.com/dirkjanm/ROADtools
- https://splunkbase.splunk.com/app/3110
- https://splunk.github.io/splunk-add-on-for-microsoft-cloud-services/Install/
