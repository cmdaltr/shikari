technique_id: T1556
technique_name: Cisco Duo Policy Allow Network Bypass 2FA
tactic: lateral_movement
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '`cisco_duo_administrator` action=policy_update OR action=policy_create | spath
  input=description | search networks_allow=* | rename object as user | stats count
  min(_time) as firstTime max(_time) as lastTime by action actionlabel description
  user admin_email networks_allow | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `cisco_duo_policy_allow_network_bypass_2fa_filter`'
explanation: "The following analytic detects when a Duo policy is created or updated\
  \ to allow network-based bypass of two-factor authentication (2FA). \nIt identifies\
  \ this behavior by searching Duo administrator logs for policy creation or update\
  \ actions where the networks_allow field is present, \nindicating that specific\
  \ networks have been permitted to bypass 2FA requirements. This is achieved by parsing\
  \ the event description and \nfiltering for relevant policy changes, then aggregating\
  \ the results by user and administrator details. Detecting this behavior is critical\
  \ \nfor a Security Operations Center (SOC) because allowing network-based 2FA bypass\
  \ can significantly weaken authentication controls, potentially \nenabling unauthorized\
  \ access if a trusted network is compromised or misconfigured. Attackers or malicious\
  \ insiders may exploit this policy \nchange to circumvent 2FA protections, increasing\
  \ the risk of account takeover and lateral movement within the environment. Prompt\
  \ detection \nenables SOC analysts to investigate and respond to potentially risky\
  \ policy modifications before they can be leveraged for malicious purposes."
