technique_id: T1210
technique_name: Abnormally Large DNS Response
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.93
validated: true
query: "(event.dataset: network_traffic.dns or (event.category: (network or network_traffic)\
  \ and destination.port: 53)) and\n  (event.dataset:zeek.dns or type:dns or event.type:connection)\
  \ and network.bytes > 60000"
explanation: 'Specially crafted DNS requests can manipulate a known overflow vulnerability
  in some Windows DNS servers, resulting in

  Remote Code Execution (RCE) or a Denial of Service (DoS) from crashing the service.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/11013227-0301-4a8c-b150-4db924484475.toml
query_type: query
query_language: kuery
false_positives:
- description: 'False positive analysis


    - Based on this rule, which looks for a threshold of 60k bytes, it is possible
    for activity to be generated under 65k bytes and related to legitimate behavior.
    In packet capture files received by the [SANS Internet Storm Center](https://isc.sans.edu/forums/diary/PATCH+NOW+SIGRed+CVE20201350+Microsoft+DNS+Server+Vulnerability/26356/),
    byte responses were all observed as greater than 65k bytes.

    - This activity can be triggered by compliance/vulnerability scanning or compro'
  mitigation: Review investigation guide for details
references:
- https://research.checkpoint.com/2020/resolving-your-way-into-domain-admin-exploiting-a-17-year-old-bug-in-windows-dns-servers/
- https://msrc-blog.microsoft.com/2020/07/14/july-2020-security-update-cve-2020-1350-vulnerability-in-windows-domain-name-system-dns-server/
- https://github.com/maxpl0it/CVE-2020-1350-DoS
- https://www.elastic.co/security-labs/detection-rules-for-sigred-vulnerability
has_investigation_guide: true
risk_score: 47
