false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may create files in the Startup
    folder, triggering the rule. Users can manage this by maintaining a list of known
    software that typically modifies the Startup folder and creating exceptions for
    these processes.

    - System administrators using remote desktop tools like mstsc.exe for legitimate
    purposes might inadvertently trigger the rule. To handle this, users can exclude
    specific administrator accounts or known IP addresses f'
  mitigation: Review investigation guide for details
