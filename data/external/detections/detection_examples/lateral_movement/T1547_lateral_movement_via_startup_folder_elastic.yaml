technique_id: T1547
technique_name: Lateral Movement via Startup Folder
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.type in (\"creation\", \"\
  change\") and\n\n /* via RDP TSClient mounted share or SMB */\n  (process.name :\
  \ \"mstsc.exe\" or process.pid == 4) and\n\n   file.path : (\"?:\\\\Users\\\\*\\\
  \\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\
  \\*\",\n                \"?:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Start Menu\\\
  \\Programs\\\\Startup\\\\*\")"
explanation: 'Identifies suspicious file creations in the startup folder of a remote
  system. An adversary could abuse this to move

  laterally by dropping a malicious script or executable that will be executed after
  a reboot or user logon.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/25224a80-5a4a-4b8a-991e-6ab390465c4f.toml
query_type: eql
query_language: eql
