technique_id: T1021.006
technique_name: Incoming Execution via WinRM Remote Shell
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.91
validated: true
query: "sequence by host.id with maxspan=30s\n   [network where host.os.type == \"\
  windows\" and process.pid == 4 and network.direction : (\"incoming\", \"ingress\"\
  ) and\n    destination.port in (5985, 5986) and source.ip != \"127.0.0.1\" and source.ip\
  \ != \"::1\"]\n   [process where host.os.type == \"windows\" and\n    event.type\
  \ == \"start\" and process.parent.name : \"winrshost.exe\" and not process.executable\
  \ : \"?:\\\\Windows\\\\System32\\\\conhost.exe\"]"
explanation: 'Identifies remote execution via Windows Remote Management (WinRM) remote
  shell on a target host. This could be an

  indication of lateral movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1cd01db9-be24-4bef-8e7c-e923f0ff78ab.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tasks using WinRM can trigger alerts. Regularly review
    and whitelist known administrative IP addresses or users to reduce false positives.

    - Automated scripts or management tools that use WinRM for routine tasks may be
    flagged. Identify these scripts and create exceptions for their specific process
    names or execution paths.

    - Monitoring tools that check system health via WinRM might be misidentified as
    threats. Exclude these tools by specifyin'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
