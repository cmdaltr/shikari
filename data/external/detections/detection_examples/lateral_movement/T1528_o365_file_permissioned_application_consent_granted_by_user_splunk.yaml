technique_id: T1528
technique_name: O365 File Permissioned Application Consent Granted by User
tactic: lateral_movement
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=AzureActiveDirectory Operation="Consent
  to application." ResultStatus=Success | eval admin_consent =mvindex(''ModifiedProperties{}.NewValue'',0)
  | search admin_consent=False | eval permissions =mvindex(''ModifiedProperties{}.NewValue'',4)
  | rex field=permissions "Scope:(?<Scope>[^,]+)" | makemv delim=" " Scope | search
  Scope IN ("Files.Read", "Files.Read.All", "Files.ReadWrite", "Files.ReadWrite.All",
  "Files.ReadWrite.AppFolder") | fillnull | stats count min(_time) as firstTime max(_time)
  as lastTime values(Scope) as Scope by signature dest user src vendor_account vendor_product
  object ObjectId | `security_content_ctime(lastTime)` | `o365_file_permissioned_application_consent_granted_by_user_filter`'
explanation: The following analytic identifies instances where a user in the Office
  365 environment grants consent to an application requesting file permissions for
  OneDrive or SharePoint. It leverages O365 audit logs, focusing on OAuth application
  consent events. This activity is significant because granting such permissions can
  allow applications to access, modify, or delete files, posing a risk if the application
  is malicious or overly permissive. If confirmed malicious, this could lead to data
  breaches, data loss, or unauthorized data manipulation, necessitating immediate
  investigation to validate the application's legitimacy and assess potential risks.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/6c382336-22b8-4023-9b80-1689e799f21f/
indicators:
- type: data_source
  value: O365 Consent to application.
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: OAuth applications that require file permissions may be legitimate,
    investigate and filter as needed.
  mitigation: Review context and user activity
references:
