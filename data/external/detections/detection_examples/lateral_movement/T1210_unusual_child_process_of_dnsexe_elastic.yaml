technique_id: T1210
technique_name: Unusual Child Process of dns.exe
tactic: lateral_movement
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : \"dns.exe\" and\n  not process.executable : (\n    \"?:\\\
  \\Windows\\\\System32\\\\conhost.exe\",\n\n    /* Crowdstrike specific exclusion\
  \ as it uses NT Object paths */\n    \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\
  \\System32\\\\conhost.exe\",\n    \"\\\\Device\\\\HarddiskVolume*\\\\Program Files\\\
  \\ReasonLabs\\\\*\"\n  ) and\n  not ?process.parent.executable : \"?:\\\\Program\
  \ Files\\\\ReasonLabs\\\\DNS\\\\ui\\\\DNS.exe\""
explanation: 'Identifies an unexpected process spawning from dns.exe, the process
  responsible for Windows DNS server services, which

  may indicate activity related to remote code execution or other forms of exploitation.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8c37dc0e-e3ac-4c97-8aa0-cf6a9122de45.toml
query_type: eql
query_language: eql
