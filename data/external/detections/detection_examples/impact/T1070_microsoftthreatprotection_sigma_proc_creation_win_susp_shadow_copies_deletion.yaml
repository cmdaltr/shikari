technique_id: T1070
technique_name: Shadow Copies Deletion Using Operating Systems Utilities
tactic: impact
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.89
validated: true
source: sigma
sigma_id: c947b146-0abc-4c87-9c64-b17e9d7274a2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (all of selection1*)\
  \ or (all of selection2*) or (all of selection3*)\nselection1_cli:\n  CommandLine|contains|all:\n\
  \  - shadow\n  - delete\nselection1_img:\n- Image|endswith:\n  - \\powershell.exe\n\
  \  - \\pwsh.exe\n  - \\wmic.exe\n  - \\vssadmin.exe\n  - \\diskshadow.exe\n- OriginalFileName:\n\
  \  - PowerShell.EXE\n  - pwsh.dll\n  - wmic.exe\n  - VSSADMIN.EXE\n  - diskshadow.exe\n\
  selection2_cli:\n  CommandLine|contains|all:\n  - delete\n  - catalog\n  - quiet\n\
  selection2_img:\n- Image|endswith: \\wbadmin.exe\n- OriginalFileName: WBADMIN.EXE\n\
  selection3_cli:\n  CommandLine|contains:\n  - unbounded\n  - /MaxSize=\n  CommandLine|contains|all:\n\
  \  - resize\n  - shadowstorage\nselection3_img:\n- Image|endswith: \\vssadmin.exe\n\
  - OriginalFileName: VSSADMIN.EXE\n"
explanation: Shadow Copies deletion using operating systems utilities
false_positives:
- Legitimate Administrator deletes Shadow Copies using operating systems utilities
  for legitimate reason
- LANDesk LDClient Ivanti-PSModule (PS EncodedCommand)
