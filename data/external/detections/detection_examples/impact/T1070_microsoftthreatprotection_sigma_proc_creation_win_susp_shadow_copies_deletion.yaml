logsource:
  category: process_creation
  product: windows
detection:
  selection1_img:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \wmic.exe
    - \vssadmin.exe
    - \diskshadow.exe
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
    - wmic.exe
    - VSSADMIN.EXE
    - diskshadow.exe
  selection1_cli:
    CommandLine|contains|all:
    - shadow
    - delete
  selection2_img:
  - Image|endswith: \wbadmin.exe
  - OriginalFileName: WBADMIN.EXE
  selection2_cli:
    CommandLine|contains|all:
    - delete
    - catalog
    - quiet
  selection3_img:
  - Image|endswith: \vssadmin.exe
  - OriginalFileName: VSSADMIN.EXE
  selection3_cli:
    CommandLine|contains|all:
    - resize
    - shadowstorage
    CommandLine|contains:
    - unbounded
    - /MaxSize=
  condition: (all of selection1*) or (all of selection2*) or (all of selection3*)
