technique_id: T1490
technique_name: All Backups Deleted Via Wbadmin.EXE
tactic: impact
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 639c9081-f482-47d3-a0bd-ddee3d4ecd76
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains: keepVersions:0\n  CommandLine|contains|all:\n\
  \  - delete\n  - backup\nselection_img:\n- Image|endswith: \\wbadmin.exe\n- OriginalFileName:\
  \ WBADMIN.EXE\n"
explanation: 'Detects the deletion of all backups or system state backups via "wbadmin.exe".

  This technique is used by numerous ransomware families and actors.

  This may only be successful on server platforms that have Windows Backup enabled.

  '
false_positives:
- Unknown
references:
