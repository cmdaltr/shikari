fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_* and not 1 of filter_optional_*\nfilter_main_null_image:\n  Image:\
  \ null\nfilter_main_program_files:\n  Image|startswith:\n  - C:\\Program Files\\\
  \n  - C:\\Program Files (x86)\\\nfilter_main_windows:\n- Image:\n  - C:\\Windows\\\
  explorer.exe\n  - C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe\n- Image|startswith:\n\
  \  - C:\\Windows\\System32\\\n  - C:\\Windows\\SysWOW64\\\n  - C:\\Windows\\Temp\\\
  {\n  - C:\\Windows\\WinSxS\\\nfilter_optional_avira:\n  Image|contains|all:\n  -\
  \ \\temp\\is-\n  - \\avira_system_speedup.tmp\nfilter_optional_programdata_packagecache:\n\
  \  Image|startswith: C:\\ProgramData\\Package Cache\\\nselection:\n  ImageLoaded|endswith:\
  \ \\vssapi.dll\n"
explanation: Detects the image load of VSS DLL by uncommon executables
false_positives:
- Unknown
references:
- https://github.com/ORCx41/DeleteShadowCopies
tags:
- attack.defense-evasion
- attack.impact
- attack.t1490
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith: \vssapi.dll
  filter_main_windows:
  - Image:
    - C:\Windows\explorer.exe
    - C:\Windows\ImmersiveControlPanel\SystemSettings.exe
  - Image|startswith:
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
    - C:\Windows\Temp\{
    - C:\Windows\WinSxS\
  filter_main_program_files:
    Image|startswith:
    - C:\Program Files\
    - C:\Program Files (x86)\
  filter_main_null_image:
    Image: null
  filter_optional_programdata_packagecache:
    Image|startswith: C:\ProgramData\Package Cache\
  filter_optional_avira:
    Image|contains|all:
    - \temp\is-
    - \avira_system_speedup.tmp
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
