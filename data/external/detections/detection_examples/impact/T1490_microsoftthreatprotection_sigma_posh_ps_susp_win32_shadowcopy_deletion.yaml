fidelity_score: 0.88
validated: true
source: sigma
sigma_id: c1337eb8-921a-4b59-855b-4ba188ddcc42
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_delete:\n\
  \  ScriptBlockText|contains:\n  - .Delete()\n  - Remove-WmiObject\n  - rwmi\n  -\
  \ Remove-CimInstance\n  - rcim\nselection_get:\n  ScriptBlockText|contains:\n  -\
  \ Get-WmiObject\n  - gwmi\n  - Get-CimInstance\n  - gcim\nselection_shadowcopy:\n\
  \  ScriptBlockText|contains: Win32_ShadowCopy\n"
explanation: Detects deletion of Windows Volume Shadow Copies with PowerShell code
  and Get-WMIObject. This technique is used by numerous ransomware families such as
  Sodinokibi/REvil
false_positives:
- Unknown
