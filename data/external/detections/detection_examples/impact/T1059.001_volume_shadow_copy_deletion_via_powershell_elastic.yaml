technique_id: T1059.001
technique_name: Volume Shadow Copy Deletion via PowerShell
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\") and\n\
  \  process.args : (\"*Get-WmiObject*\", \"*gwmi*\", \"*Get-CimInstance*\", \"*gcim*\"\
  ) and\n  process.args : (\"*Win32_ShadowCopy*\") and\n  process.args : (\"*.Delete()*\"\
  , \"*Remove-WmiObject*\", \"*rwmi*\", \"*Remove-CimInstance*\", \"*rcim*\")"
explanation: 'Identifies the use of the Win32_ShadowCopy class and related cmdlets
  to achieve shadow copy deletion. This commonly

  occurs in tandem with ransomware or other destructive attacks.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d99a037b-c8e2-47a5-97b9-170d076827c4.toml
