technique_id: T1489
technique_name: High Number of Process Terminations
tactic: impact
platform: Elastic
fidelity_score: 0.88
validated: true
query: event.category:process and host.os.type:linux and event.type:start and process.name:"pkill"
  and process.args:"-f"
explanation: This rule identifies a high number (10) of process terminations via pkill
  from the same host within a short time period.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/67f8443a-4ff3-4a70-916d-3cfa3ae9f02b.toml
