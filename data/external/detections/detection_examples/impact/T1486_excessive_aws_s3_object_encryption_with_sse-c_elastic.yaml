technique_id: T1486
technique_name: Excessive AWS S3 Object Encryption with SSE-C
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset: \"aws.cloudtrail\"\n    and event.provider: \"s3.amazonaws.com\"\
  \n    and event.action: \"PutObject\"\n    and event.outcome: \"success\"\n    and\
  \ aws.cloudtrail.flattened.request_parameters.x-amz-server-side-encryption-customer-algorithm:\
  \ \"AES256\""
explanation: Identifies a high-volume of AWS S3 objects stored in a bucket using using
  Server-Side Encryption with Customer-Provided Keys (SSE-C). Adversaries with compromised
  AWS credentials can encrypt objects in an S3 bucket using their own encryption keys,
  rendering the objects unreadable or recoverable without the key. This can be used
  as a form of ransomware to extort the bucket owner for the decryption key. This
  is a Threshold rule that triggers when this behavior is observed multiple times
  for a specific bucket in a short time-window.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/909bf7c8-d371-11ef-bcc3-f661ea17fbcd.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS S3
  confidence: high
false_positives:
- description: "False Positive Analysis\n\n- **Legitimate Use Cases**:\n  - Confirm\
    \ if SSE-C encryption is part of regular operations for compliance or data protection.\n\
    \  - Cross-reference known processes or users authorized for SSE-C encryption\
    \ in the affected bucket.\n\n### Response and Remediation\n\n1. **Immediate Actions**:\n\
    \   - Disable access keys or permissions for the user if unauthorized behavior\
    \ is confirmed.\n   - Rotate the bucket's encryption configuration to mitigate\
    \ further misuse.\n\n2. **Data Recovery**:"
  mitigation: Review investigation guide for details
references:
- https://www.halcyon.ai/blog/abusing-aws-native-services-ransomware-encrypting-s3-buckets-with-sse-c
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerSideEncryptionCustomerKeys.html
has_investigation_guide: true
risk_score: 73
