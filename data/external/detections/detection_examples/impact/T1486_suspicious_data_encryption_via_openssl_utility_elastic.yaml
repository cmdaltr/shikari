technique_id: T1486
technique_name: Suspicious Data Encryption via OpenSSL Utility
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id, user.name, process.parent.entity_id with maxspan=5s\n\
  \  [ process where host.os.type == \"linux\" and event.action == \"exec\" and\n\
  \    process.name == \"openssl\" and process.parent.name : (\"bash\", \"dash\",\
  \ \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\", \"perl*\", \"php*\", \"\
  python*\", \"xargs\") and\n    process.args == \"-in\" and process.args == \"-out\"\
  \ and\n    process.args in (\"-k\", \"-K\", \"-kfile\", \"-pass\", \"-iv\", \"-md\"\
  ) and\n    /* excluding base64 encoding options and including encryption password\
  \ or key params */\n    not process.args in (\"-d\", \"-a\", \"-A\", \"-base64\"\
  , \"-none\", \"-nosalt\") ] with runs=10"
explanation: 'Identifies when the openssl command-line utility is used to encrypt
  multiple files on a host within a short time window.

  Adversaries may encrypt data on a single or multiple systems in order to disrupt
  the availability of their target''s data

  and may attempt to hold the organization''s data to ransom for the purposes of extortion.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f530ca17-153b-4a7a-8cd3-98dd4b4ddf73.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate batch encryption operations by system administrators or automated
    scripts may trigger the rule. To handle this, identify and whitelist specific
    scripts or user accounts that perform regular encryption tasks.

    - Backup processes that use OpenSSL for encrypting data before storage can be
    mistaken for malicious activity. Exclude known backup processes by specifying
    their parent process names or paths.

    - Developers or security teams testing encryption functionali'
  mitigation: Review investigation guide for details
references:
- https://www.welivesecurity.com/2017/06/30/telebots-back-supply-chain-attacks-against-ukraine/
- https://www.trendmicro.com/en_us/research/21/f/bash-ransomware-darkradiation-targets-red-hat--and-debian-based-linux-distributions.html
has_investigation_guide: true
risk_score: 47
