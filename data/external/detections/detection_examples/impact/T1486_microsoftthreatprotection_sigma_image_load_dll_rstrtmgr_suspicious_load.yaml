logsource:
  category: image_load
  product: windows
detection:
  selection_img:
  - ImageLoaded|endswith: \RstrtMgr.dll
  - OriginalFileName: RstrtMgr.dll
  selection_folders_1:
    Image|contains:
    - :\Perflogs\
    - :\Users\Public\
    - \Temporary Internet
  selection_folders_2:
  - Image|contains|all:
    - :\Users\
    - \Favorites\
  - Image|contains|all:
    - :\Users\
    - \Favourites\
  - Image|contains|all:
    - :\Users\
    - \Contacts\
  condition: selection_img and 1 of selection_folders_*
