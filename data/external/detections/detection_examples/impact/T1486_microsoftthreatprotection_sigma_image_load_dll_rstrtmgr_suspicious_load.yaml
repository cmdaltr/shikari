technique_id: T1486
technique_name: Load Of RstrtMgr.DLL By A Suspicious Process
tactic: impact
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: b48492dc-c5ef-4572-8dff-32bc241c15c8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img and 1 of\
  \ selection_folders_*\nselection_folders_1:\n  Image|contains:\n  - :\\Perflogs\\\
  \n  - :\\Users\\Public\\\n  - \\Temporary Internet\nselection_folders_2:\n- Image|contains|all:\n\
  \  - :\\Users\\\n  - \\Favorites\\\n- Image|contains|all:\n  - :\\Users\\\n  - \\\
  Favourites\\\n- Image|contains|all:\n  - :\\Users\\\n  - \\Contacts\\\nselection_img:\n\
  - ImageLoaded|endswith: \\RstrtMgr.dll\n- OriginalFileName: RstrtMgr.dll\n"
explanation: 'Detects the load of RstrtMgr DLL (Restart Manager) by a suspicious process.

  This library has been used during ransomware campaigns to kill processes that would
  prevent file encryption by locking them (e.g. Conti ransomware, Cactus ransomware).
  It has also recently been seen used by the BiBi wiper for Windows.

  It could also be used for anti-analysis purposes by shut downing specific processes.

  '
false_positives:
- Processes related to software installation
references:
- https://www.crowdstrike.com/blog/windows-restart-manager-part-1/
- https://www.crowdstrike.com/blog/windows-restart-manager-part-2/
