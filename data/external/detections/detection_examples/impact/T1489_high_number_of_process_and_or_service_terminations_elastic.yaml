technique_id: T1489
technique_name: High Number of Process and/or Service Terminations
tactic: impact
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.category:process and host.os.type:windows and event.type:start and process.name:(net.exe\
  \ or sc.exe or taskkill.exe) and\n process.args:(stop or pause or delete or \"/PID\"\
  \ or \"/IM\" or \"/T\" or \"/F\" or \"/t\" or \"/f\" or \"/im\" or \"/pid\") and\n\
  \ not process.parent.name:(osquerybeat.exe or agentbeat.exe)"
explanation: 'This rule identifies a high number (10) of process terminations (stop,
  delete, or suspend) from the same host within a

  short time period.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/035889c4-2686-4583-a7df-67f89c292f2c.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This activity is unlikely to happen legitimately. Benign true positives (B-TPs)
    can be added as exceptions if necessary.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further destructive behavior, which is
    commonly associated with this activity.

    - Investigate credential exposure on systems compromised or used by the attacker
    to ensure all compromised accounts are identi'
  mitigation: Review investigation guide for details
references:
