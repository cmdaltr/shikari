technique_id: T1490
technique_name: Potential System Tampering via File Modification
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.type in (\"change\", \"deletion\"\
  ) and\n file.name : (\"winload.exe\", \"winlod.efi\", \"ntoskrnl.exe\", \"bootmgr\"\
  ) and\n file.path : (\"?:\\\\Windows\\\\*\", \"\\\\Device\\\\HarddiskVolume*\\\\\
  Windows\\\\*\") and\n not process.executable : (\"?:\\\\Windows\\\\System32\\\\\
  poqexec.exe\", \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\poqexec.exe\"\
  )"
explanation: 'Identifies attempts to delete or modify critical files used during the
  boot process to prevent the system from booting.

  This may indicate a destructive attack behavior.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1a3f2a4c-12d0-4b88-961a-2711ee295637.toml
