technique_id: T1491.001
technique_name: Potential Ransomware Activity Using LegalNotice Message
tactic: impact
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 8b9606c9-28be-4a38-b146-0e313cc232c1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details|contains:\n  - encrypted\n  - Unlock-Password\n  - paying\n  TargetObject|contains:\n\
  \  - \\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\LegalNoticeCaption\n\
  \  - \\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\LegalNoticeText\n"
explanation: Detect changes to the "LegalNoticeCaption" or "LegalNoticeText" registry
  values where the message set contains keywords often used in ransomware ransom messages
false_positives:
- Unknown
references:
- https://github.com/redcanaryco/atomic-red-team/blob/5c1e6f1b4fafd01c8d1ece85f510160fc1275fbf/atomics/T1491.001/T1491.001.md
