technique_id: T1486
technique_name: Ransomware - Detected - Elastic Defend
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'event.kind : alert and event.code : ransomware and (event.type : allowed or
  (event.type: denied and event.outcome: failure))'
explanation: 'Generates a detection alert each time an Elastic Defend alert for ransomware
  are received. Enabling this rule allows you

  to immediately begin investigating your Endpoint ransomware alerts. This rule identifies
  Elastic Defend ransomware

  detections only, and does not include prevention alerts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0c74cd7e-ea35-11ee-a417-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
false_positives:
- description: false positives rates. We understand how alarming and disruptive ransomware
    false positives can be which has factored into its design goals. More likely than
    not, if this protection fires, it is a true positive. However, certain categories
    of software do behave similarly to ransomware from the perspective of this protection.
    That includes installers and backup software, which can make a large number of
    modifications to documents (especially during a restore operation). Further, encryption
    or sys
  mitigation: Review investigation guide for details
references:
- https://github.com/elastic/protections-artifacts/tree/main/ransomware
- https://docs.elastic.co/en/integrations/endpoint
