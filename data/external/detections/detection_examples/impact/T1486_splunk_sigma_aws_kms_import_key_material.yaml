validated: true
source: sigma
sigma_id: 1279262f-1464-422f-ac0d-5b545320c526
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  eventName:\n  - ImportKeyMaterial\n  - DeleteImportedKeyMaterial\n  eventSource:\
  \ kms.amazonaws.com\n"
explanation: 'Detects the import or deletion of key material in AWS KMS, which can
  be used as part of ransomware attacks. This activity is uncommon and provides a
  high certainty signal.

  '
false_positives:
- Legitimate use cases for imported key material are rare, but may include, Organizations
  with hybrid cloud architectures that import external key material for compliance
  requirements.
- Development or testing environments that simulate external key management scenarios.
  Even in these cases, such activity is typically infrequent and should not add significant
  noise.
references:
- https://www.chrisfarris.com/post/effective-aws-ransomware/
