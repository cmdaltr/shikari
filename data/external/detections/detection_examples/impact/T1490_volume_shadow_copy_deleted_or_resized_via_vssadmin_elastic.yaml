technique_id: T1490
technique_name: Volume Shadow Copy Deleted or Resized via VssAdmin
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (process.name : \"vssadmin.exe\" or ?process.pe.original_file_name == \"VSSADMIN.EXE\"\
  ) and\n  process.args : (\"delete\", \"resize\") and process.args : \"shadows*\""
explanation: 'Identifies use of vssadmin.exe for shadow copy deletion or resizing
  on endpoints. This commonly occurs in tandem with

  ransomware or other destructive attacks.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b5ea4bfe-a1b2-421f-9d47-22a75a6f2921.toml
