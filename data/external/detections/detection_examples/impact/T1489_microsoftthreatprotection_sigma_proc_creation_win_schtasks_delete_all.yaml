technique_id: T1489
technique_name: Delete All Scheduled Tasks
tactic: impact
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 220457c1-1c9f-4c2e-afe6-9598926222c1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - ' /delete '\n  - /tn \\*\n  - ' /f'\n  Image|endswith:\
  \ \\schtasks.exe\n"
explanation: Detects the usage of schtasks with the delete flag and the asterisk symbol
  to delete all tasks from the schedule of the local computer, including tasks scheduled
  by other users.
false_positives:
- Unlikely
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-delete
tags:
- attack.impact
- attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \schtasks.exe
    CommandLine|contains|all:
    - ' /delete '
    - /tn \*
    - ' /f'
  condition: selection
