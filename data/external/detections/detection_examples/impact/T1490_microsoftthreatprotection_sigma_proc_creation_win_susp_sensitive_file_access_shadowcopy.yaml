technique_id: T1490
technique_name: Sensitive File Access Via Volume Shadow Copy Backup
tactic: impact
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: f57f8d16-1f39-4dcb-a604-6c73d9b54b3d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_1:\n  CommandLine|contains: \\\\\\\\\\?\\\\GLOBALROOT\\\\Device\\\\HarddiskVolumeShadowCopy\n\
  selection_2:\n  CommandLine|contains:\n  - \\\\NTDS.dit\n  - \\\\SYSTEM\n  - \\\\\
  SECURITY\n"
explanation: 'Detects a command that accesses the VolumeShadowCopy in order to extract
  sensitive files such as the Security or SAM registry hives or the AD database (ntds.dit)

  '
false_positives:
- Unlikely
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
- https://www.virustotal.com/gui/file/03e9b8c2e86d6db450e5eceec057d7e369ee2389b9daecaf06331a95410aa5f8/detection
- https://pentestlab.blog/2018/07/04/dumping-domain-password-hashes/
tags:
