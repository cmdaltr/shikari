technique_id: T1490
technique_name: Third-party Backup Files Deleted via Unexpected Process
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.type == \"deletion\" and\n\
  \  (\n    /* Veeam Related Backup Files */\n    (\n      file.extension : (\"VBK\"\
  , \"VIB\", \"VBM\") and\n      not (\n        process.executable : (\"?:\\\\Windows\\\
  \\*\", \"?:\\\\Program Files\\\\*\", \"?:\\\\Program Files (x86)\\\\*\") and\n \
  \       (process.code_signature.trusted == true and process.code_signature.subject_name\
  \ : (\"Veeam Software Group GmbH\", \"Veeam Software AG\"))\n      )\n    ) or\n\
  \    /* Veritas Backup Exec Related Backup File */\n    (\n      file.extension\
  \ : \"BKF\" and\n        not process.executable : (\n          \"?:\\\\Program Files\\\
  \\Veritas\\\\Backup Exec\\\\*\",\n          \"?:\\\\Program Files (x86)\\\\Veritas\\\
  \\Backup Exec\\\\*\"\n        )\n    )\n  ) and\n  not (\n    process.name : (\"\
  MSExchangeMailboxAssistants.exe\", \"Microsoft.PowerBI.EnterpriseGateway.exe\")\
  \ and\n      (process.code_signature.subject_name : \"Microsoft Corporation\" and\
  \ process.code_signature.trusted == true)\n  ) and\n  not file.path : (\n    \"\
  ?:\\\\ProgramData\\\\Trend Micro\\\\*\",\n    \"?:\\\\Program Files (x86)\\\\Trend\
  \ Micro\\\\*\",\n    \"?:\\\\$RECYCLE.BIN\\\\*\"\n  )"
explanation: 'Identifies the deletion of backup files, saved using third-party software,
  by a process outside of the backup suite.

  Adversaries may delete Backup files to ensure that recovery from a ransomware attack
  is less likely.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/11ea6bec-ebde-4d71-a8e9-784948f8e3e9.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This rule can be triggered by the manual removal of backup files and by removal
    using other third-party tools that are not from the backup suite. Exceptions can
    be added for specific accounts and executables, preferably tied together.


    ### Related rules


    - Deleting Backup Catalogs with Wbadmin - 581add16-df76-42bb-af8e-c979bfb39a59

    - Volume Shadow Copy Deleted or Resized via VssAdmin - b5ea4bfe-a1b2-421f-9d47-22a75a6f2921

    - Volume Shadow Copy Deletion via PowerShell -'
  mitigation: Review investigation guide for details
references:
- https://www.advintel.io/post/backup-removal-solutions-from-conti-ransomware-with-love
has_investigation_guide: true
risk_score: 47
