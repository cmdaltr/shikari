technique_id: T1485
technique_name: AWS Deletion of RDS Instance or Cluster
tactic: impact
platform: Elastic
fidelity_score: 0.9
validated: true
query: 'event.dataset:aws.cloudtrail and event.provider:rds.amazonaws.com and event.action:(DeleteDBCluster
  or DeleteGlobalCluster or DeleteDBInstance)

  and event.outcome:success'
explanation: 'Identifies the deletion of an Amazon Relational Database Service (RDS)
  Aurora database cluster, global database cluster,

  or database instance.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9055ece6-2689-4224-a0e0-b04881e1f8ad.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS RDS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance activities by database administrators can trigger alerts
    when they intentionally delete RDS instances or clusters. To manage this, create
    exceptions for known maintenance windows or specific administrator actions.

    - Automated scripts or tools used for testing and development purposes might delete
    RDS resources as part of their normal operation. Identify these scripts and exclude
    their actions from triggering alerts by using specific user or role ide'
  mitigation: Review investigation guide for details
references:
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/rds/delete-db-cluster.html
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DeleteDBCluster.html
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/rds/delete-global-cluster.html
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DeleteGlobalCluster.html
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/rds/delete-db-instance.html
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_DeleteDBInstance.html
has_investigation_guide: true
risk_score: 47
