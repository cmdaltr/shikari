technique_id: T1490
technique_name: AWS S3 Object Versioning Suspended
tactic: impact
platform: Elastic
fidelity_score: 0.93
validated: true
query: "info where event.dataset == \"aws.cloudtrail\"\n   and event.provider == \"\
  s3.amazonaws.com\"\n   and event.action == \"PutBucketVersioning\"\n   and event.outcome\
  \ == \"success\"\n   and stringContains(aws.cloudtrail.request_parameters, \"Status=Suspended\"\
  )"
explanation: Identifies when object versioning is suspended for an Amazon S3 bucket.
  Object versioning allows for multiple versions of an object to exist in the same
  bucket. This allows for easy recovery of deleted or overwritten objects. When object
  versioning is suspended for a bucket, it could indicate an adversary's attempt to
  inhibit system recovery following malicious activity. Additionally, when versioning
  is suspended, buckets can then be deleted.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/30b5bb96-c7db-492c-80e9-1eab00db580b.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS S3
  confidence: high
false_positives:
- description: "False positive analysis\n\n- **Legitimate Administrative Actions**\
    \  \n  - Administrators or infrastructure automation tools may suspend versioning\
    \ during migrations or lifecycle testing. Confirm through change management documentation.\
    \  \n- **Automation and Pipelines**  \n  - Verify whether Infrastructure-as-Code\
    \ tools (e.g., Terraform, CloudFormation) or backup lifecycle scripts routinely\
    \ modify versioning states.  \n  - Exclude predictable automation identities where\
    \ justified, while ensuring strong"
  mitigation: Review investigation guide for details
