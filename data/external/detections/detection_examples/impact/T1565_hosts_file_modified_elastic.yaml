technique_id: T1565
technique_name: Hosts File Modified
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "any where\n\n  /* file events for creation; file change events are not captured\
  \ by some of the included sources for linux and so may\n     miss this, which is\
  \ the purpose of the process + command line args logic below */\n  (\n   event.category\
  \ == \"file\" and event.type in (\"change\", \"creation\") and\n     file.path :\
  \ (\"/private/etc/hosts\", \"/etc/hosts\", \"?:\\\\Windows\\\\System32\\\\drivers\\\
  \\etc\\\\hosts\") and \n     not process.name in (\"dockerd\", \"rootlesskit\",\
  \ \"podman\", \"crio\")\n  )\n  or\n\n  /* process events for change targeting linux\
  \ only */\n  (\n   event.category == \"process\" and event.type in (\"start\") and\n\
  \     process.name in (\"nano\", \"vim\", \"vi\", \"emacs\", \"echo\", \"sed\")\
  \ and\n     process.args : (\"/etc/hosts\") and \n     not process.parent.name in\
  \ (\"dhclient-script\", \"google_set_hostname\")\n  )"
explanation: 'The hosts file on endpoints is used to control manual IP address to
  hostname resolutions. The hosts file is the first

  point of lookup for DNS hostname resolution so if adversaries can modify the endpoint
  hosts file, they can route traffic

  to malicious infrastructure. This rule detects modifications to the hosts file on
  Microsoft Windows, Linux (Ubuntu or

  RHEL) and macOS systems.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9c260313-c811-4ec8-ab89-8f6530e0246c.toml
query_type: eql
query_language: eql
