    or specific user accounts responsible for these tasks.

    - Automated scaling operations might delete pods as part of normal scaling activities.
    Identify and exclude these operations by correlating with scaling events or using
    tags that indicate automated processes.

    - Development and testing environments often experie'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations#microsoftkubernetes
