technique_id: T1529
technique_name: Azure Kubernetes Pods Deleted
tactic: impact
platform: Elastic
fidelity_score: 0.9
validated: true
query: 'event.dataset:azure.activitylogs and azure.activitylogs.operation_name:"MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/PODS/DELETE"
  and

  event.outcome:(Success or success)'
explanation: 'Identifies the deletion of Azure Kubernetes Pods. Adversaries may delete
  a Kubernetes pod to disrupt the normal behavior

  of the environment.'
