query: event.dataset:google_workspace.admin and event.provider:admin and event.category:iam
  and event.action:DELETE_ROLE
explanation: 'Detects when a custom admin role is deleted. An adversary may delete
  a custom admin role in order to impact the

  permissions or capabilities of system administrators.'
