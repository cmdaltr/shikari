technique_id: T1490
technique_name: Suspicious File Renamed via SMB
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id with maxspan=1s\n [network where host.os.type == \"windows\"\
  \ and\n  event.action == \"connection_accepted\" and destination.port == 445 and\
  \ source.port >= 49152 and process.pid == 4 and\n  source.ip != \"127.0.0.1\" and\
  \ source.ip != \"::1\" and\n  network.type == \"ipv4\" and not endswith(source.address,\
  \ destination.address)]\n [file where host.os.type == \"windows\" and\n  event.action\
  \ == \"rename\" and process.pid == 4 and user.id : (\"S-1-5-21*\", \"S-1-12-*\"\
  ) and\n  file.extension != null and file.Ext.entropy >= 6 and file.path : \"C:\\\
  \\Users\\\\*\" and\n  file.Ext.original.name : (\"*.jpg\", \"*.bmp\", \"*.png\"\
  , \"*.pdf\", \"*.doc\", \"*.docx\", \"*.xls\", \"*.xlsx\", \"*.ppt\", \"*.pptx\"\
  , \"*.lnk\") and\n  not file.extension : (\"jpg\", \"bmp\", \"png\", \"pdf\", \"\
  doc\", \"docx\", \"xls\", \"xlsx\", \"ppt\", \"pptx\", \"*.lnk\")] with runs=3"
explanation: 'Identifies an incoming SMB connection followed by a suspicious file
  rename operation. This may indicate a remote

  ransomware attack via the SMB protocol.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/78e9b5d5-7c07-40a7-a591-3dbbf464c386.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


