technique_id: T1485
technique_name: Potential Ransomware Note File Dropped via SMB
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id with maxspan=1s\n [network where host.os.type == \"windows\"\
  \ and\n  event.action == \"connection_accepted\" and destination.port == 445 and\
  \ source.port >= 49152 and process.pid == 4 and\n  source.ip != \"127.0.0.1\" and\
  \ source.ip != \"::1\" and\n  network.type == \"ipv4\" and not endswith(source.address,\
  \ destination.address)]\n [file where host.os.type == \"windows\" and event.action\
  \ == \"creation\" and\n  process.pid == 4 and user.id : (\"S-1-5-21*\", \"S-1-12-*\"\
  ) and file.extension : (\"hta\", \"txt\", \"readme\", \"htm*\") and\n  file.path\
  \ : \"C:\\\\Users\\\\*\" and\n   /* ransom file name keywords */\n    file.name\
  \ : (\"*read*me*\", \"*lock*\", \"*@*\", \"*RECOVER*\", \"*decrypt*\", \"*restore*file*\"\
  , \"*FILES_BACK*\", \"*how*to*\")] with runs=3"
explanation: 'Identifies an incoming SMB connection followed by the creation of a
  file with a name similar to ransomware note files.

  This may indicate a remote ransomware attack via the SMB protocol.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/02bab13d-fb14-4d7c-b6fe-4a28874d37c5.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Remote file creation with similar file naming convention via SMB.



    ### Related rules


    - Third-party Backup Files Deleted via Unexpected Process - 11ea6bec-ebde-4d71-a8e9-784948f8e3e9

    - Volume Shadow Copy Deleted or Resized via VssAdmin - b5ea4bfe-a1b2-421f-9d47-22a75a6f2921

    - Volume Shadow Copy Deletion via PowerShell - d99a037b-c8e2-47a5-97b9-170d076827c4

    - Volume Shadow Copy Deletion via WMIC - dc9c1f74-dac3-48e3-b47f-eb79db358f57

    - Suspicious File Renamed via SMB -'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
