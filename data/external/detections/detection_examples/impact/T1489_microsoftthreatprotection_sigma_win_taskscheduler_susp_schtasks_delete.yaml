level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  UserName|contains:\n  - AUTHORI\n  - AUTORI\nselection:\n  EventID: 141\n\
  \  TaskName|contains:\n  - \\Windows\\SystemRestore\\SR\n  - \\Windows\\Windows\
  \ Defender\\\n  - \\Windows\\BitLocker\n  - \\Windows\\WindowsBackup\\\n  - \\Windows\\\
  WindowsUpdate\\\n  - \\Windows\\UpdateOrchestrator\\\n  - \\Windows\\ExploitGuard\n"
explanation: 'Detects when adversaries try to stop system services or processes by
  deleting their respective scheduled tasks in order to conduct data destructive activities

  '
false_positives:
- Unknown
references:
- https://www.socinvestigation.com/most-common-windows-event-ids-to-hunt-mind-map/
tags:
