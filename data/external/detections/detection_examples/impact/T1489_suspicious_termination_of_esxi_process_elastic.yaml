technique_id: T1489
technique_name: Suspicious Termination of ESXI Process
tactic: impact
platform: Elastic
fidelity_score: 0.9
validated: true
query: 'process where host.os.type == "linux" and event.type == "end" and process.name
  in ("vmware-vmx", "vmx")

  and process.parent.name == "kill"'
explanation: 'Identifies instances where VMware processes, such as "vmware-vmx" or
  "vmx," are terminated on a Linux system by a "kill"

  command. The rule monitors for the "end" event type, which signifies the termination
  of a process. The presence of a

  "kill" command as the parent process for terminating VMware processes may indicate
  that a threat actor is attempting to

  interfere with the virtualized environment on the targeted system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/6641a5af-fb7e-487a-adc4-9e6503365318.toml
query_type: eql
query_language: eql
