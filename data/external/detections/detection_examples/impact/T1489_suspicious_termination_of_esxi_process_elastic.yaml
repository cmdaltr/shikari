  confidence: high
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Crowdstrike
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance or administrative tasks may involve terminating VMware processes
    using the kill command. To manage this, create exceptions for known maintenance
    scripts or administrative user accounts that regularly perform these actions.

    - Automated scripts or monitoring tools might inadvertently terminate VMware processes
    as part of their operations. Identify and exclude these tools from the detection
    rule by specifying their process names or user accounts.

    - Sys'
