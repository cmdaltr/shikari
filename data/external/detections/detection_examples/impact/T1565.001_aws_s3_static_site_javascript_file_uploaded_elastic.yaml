technique_id: T1565.001
technique_name: AWS S3 Static Site JavaScript File Uploaded
tactic: impact
platform: Elastic
fidelity_score: 0.95
validated: true
query: "from logs-aws.cloudtrail* metadata _id, _version, _index\n\n| where\n    //\
  \ S3 object write activity\n    event.dataset == \"aws.cloudtrail\"\n    and event.provider\
  \ == \"s3.amazonaws.com\"\n    and event.action == \"PutObject\"\n    and event.outcome\
  \ == \"success\"\n\n    // IAM users or assumed roles only\n    and aws.cloudtrail.user_identity.type\
  \ in (\"IAMUser\", \"AssumedRole\")\n\n    // Requests for static site bundles\n\
  \    and aws.cloudtrail.request_parameters like \"*static/js/*.js*\"\n\n    // Exclude\
  \ IaC and automation tools\n    and not (\n        user_agent.original like \"*Terraform*\"\
  \n        or user_agent.original like \"*Ansible*\"\n        or user_agent.original\
  \ like \"*Pulumi*\"\n    )\n\n// Extract fields from request parameters\n| dissect\
  \ aws.cloudtrail.request_parameters\n    \"%{{?bucket.name.key}=%{Esql.aws_cloudtrail_request_parameters_bucket_name},\
  \ %{?host.key}=%{Esql_priv.aws_cloudtrail_request_parameters_host}, %{?bucket.object.location.key}=%{Esql.aws_cloudtrail_request_parameters_bucket_object_location}}\"\
  \n\n// Extract file name portion from full object path\n| dissect Esql.aws_cloudtrail_request_parameters_bucket_object_location\
  \ \"%{}static/js/%{Esql.aws_cloudtrail_request_parameters_object_key}\"\n\n// Match\
  \ on JavaScript files\n| where ends_with(Esql.aws_cloudtrail_request_parameters_object_key,\
  \ \".js\")\n\n// Retain relevant ECS and dissected fields\n| keep\n    aws.cloudtrail.user_identity.arn,\n\
  \    aws.cloudtrail.user_identity.access_key_id,\n    aws.cloudtrail.user_identity.type,\n\
  \    aws.cloudtrail.request_parameters,\n    Esql.aws_cloudtrail_request_parameters_bucket_name,\n\
  \    Esql.aws_cloudtrail_request_parameters_object_key,\n    user_agent.original,\n\
  \    source.ip,\n    event.action,\n    @timestamp"
explanation: 'This rule detects when a JavaScript file is uploaded in an S3 static
  site directory (`static/js/`) by an IAM

  user or assumed role. This can indicate suspicious modification of web content hosted
  on S3, such as injecting malicious

  scripts into a static website frontend.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/16acac42-b2f9-4802-9290-d6c30914db6e.toml
query_type: esql
query_language: esql
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS S3
  confidence: high
false_positives:
- description: "False Positive Analysis\n\n- This behavior may be expected during\
    \ app deployments. Look at:\n  - The `user_agent.original` to detect legitimate\
    \ CI tools (like Terraform or GitHub Actions).\n  - Timing patterns—does this\
    \ match a regular release window?\n  - The origin IP and device identity.\n\n\
    ### Response and Remediation\n\n- **Revert Malicious Code**: Replace the uploaded\
    \ JS file with a clean version and invalidate CloudFront cache if applicable.\n\
    - **Revoke Access**: If compromise is confirmed, revoke"
  mitigation: Review investigation guide for details
references:
- https://www.sygnia.co/blog/sygnia-investigation-bybit-hack/
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html
- https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObject.html
has_investigation_guide: true
risk_score: 47
