technique_id: T1531
technique_name: GCP Service Account Disabled
tactic: impact
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:gcp.audit and event.action:google.iam.admin.v*.DisableServiceAccount
  and event.outcome:success
explanation: 'Identifies when a service account is disabled in Google Cloud Platform
  (GCP). A service account is a special type of

  account used by an application or a virtual machine (VM) instance, not a person.
  Applications use service accounts to

  make authorized API calls, authorized as either the service account itself, or as
  G Suite or Cloud Identity users

  through domain-wide delegation. An adversary may disable a service account in order
  to disrupt to disrupt their target''s

  business operations.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/bca7d28e-4a48-47b1-adb7-5074310e9a61.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: GCP
  confidence: high
- type: data_source
  value: Google Cloud Platform
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance activities by administrators may involve disabling service
    accounts temporarily. To manage this, create exceptions for known maintenance
    periods or specific administrator actions.

    - Automated scripts or tools used for testing or deployment might disable service
    accounts as part of their process. Identify these scripts and exclude their actions
    from triggering alerts by using specific identifiers or tags.

    - Organizational policy changes or restructur'
  mitigation: Review investigation guide for details
references:
- https://cloud.google.com/iam/docs/service-accounts
has_investigation_guide: true
risk_score: 47
