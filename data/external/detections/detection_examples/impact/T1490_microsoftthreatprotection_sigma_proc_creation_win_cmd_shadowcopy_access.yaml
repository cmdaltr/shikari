technique_id: T1490
technique_name: Copy From VolumeShadowCopy Via Cmd.EXE
tactic: impact
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: c73124a7-3e89-44a3-bdc1-25fe4df754b1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - 'copy '\n  - \\\\\\\\\\?\\\\GLOBALROOT\\\\Device\\\
  \\HarddiskVolumeShadowCopy\n"
explanation: Detects the execution of the builtin "copy" command that targets a shadow
  copy (sometimes used to copy registry hives that are in use)
false_positives:
- Backup scenarios using the commandline
references:
- https://twitter.com/vxunderground/status/1423336151860002816?s=20
