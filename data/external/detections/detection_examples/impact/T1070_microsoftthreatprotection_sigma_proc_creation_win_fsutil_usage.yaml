technique_id: T1070
technique_name: Fsutil Suspicious Invocation
tactic: impact
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.83
validated: true
source: sigma
sigma_id: add64136-62e5-48ea-807e-88638d02df1e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - deletejournal\n  - createjournal\n\
  \  - setZeroData\nselection_img:\n- Image|endswith: \\fsutil.exe\n- OriginalFileName:\
  \ fsutil.exe\n"
explanation: 'Detects suspicious parameters of fsutil (deleting USN journal, configuring
  it with small size, etc).

  Might be used by ransomwares during the attack (seen by NotPetya and others).

  '
false_positives:
- Admin activity
- Scripts and administrative tools used in the monitored environment
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/fsutil-usn
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070/T1070.md
- https://eqllib.readthedocs.io/en/latest/analytics/c91f422a-5214-4b17-8664-c5fcf115c0a2.html
- https://github.com/albertzsigovits/malware-notes/blob/558898932c1579ff589290092a2c8febefc3a4c9/Ransomware/Lockbit.md
- https://blog.cluster25.duskrise.com/2023/05/22/back-in-black-blackbyte-nt
tags:
- attack.defense-evasion
- attack.impact
- attack.t1070
- attack.t1485
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \fsutil.exe
  - OriginalFileName: fsutil.exe
  selection_cli:
    CommandLine|contains:
    - deletejournal
    - createjournal
    - setZeroData
  condition: all of selection_*
