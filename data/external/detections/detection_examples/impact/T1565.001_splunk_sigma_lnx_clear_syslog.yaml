query: '# Sigma Detection Logic

  # Convert to platform-specific query using Sigma tools:

  # https://github.com/SigmaHQ/sigma


  condition: selection and not falsepositives

  falsepositives:

  - /syslog.

  selection:

  - rm /var/log/syslog

  - rm -r /var/log/syslog

  - rm -f /var/log/syslog

  - rm -rf /var/log/syslog

  - mv /var/log/syslog

  - '' >/var/log/syslog''

  - '' > /var/log/syslog''

  '
explanation: Detects specific commands commonly used to remove or empty the syslog
false_positives:
- Log rotation
