technique_id: T1531
technique_name: GCP Service Account Deletion
tactic: impact
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:gcp.audit and event.action:google.iam.admin.v*.DeleteServiceAccount
  and event.outcome:success
explanation: 'Identifies when a service account is deleted in Google Cloud Platform
  (GCP). A service account is a special type of

  account used by an application or a virtual machine (VM) instance, not a person.
  Applications use service accounts to

  make authorized API calls, authorized as either the service account itself, or as
  G Suite or Cloud Identity users

  through domain-wide delegation. An adversary may delete a service account in order
  to disrupt their target''s business

  operations.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8fb75dda-c47a-4e34-8ecd-34facf7aad13.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: GCP
  confidence: high
- type: data_source
  value: Google Cloud Platform
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance or updates may involve the deletion and recreation of service
    accounts. To manage this, create exceptions for known maintenance activities by
    excluding specific service account names or associated project IDs during these
    periods.

    - Automated scripts or deployment tools might delete and recreate service accounts
    as part of their normal operation. Identify these scripts and exclude their actions
    from triggering alerts by filtering based on the user o'
  mitigation: Review investigation guide for details
references:
- https://cloud.google.com/iam/docs/service-accounts
has_investigation_guide: true
risk_score: 47
