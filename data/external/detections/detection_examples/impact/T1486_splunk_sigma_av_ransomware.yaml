query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Signature|contains:\n  - BlackWorm\n  - Chaos\n  - Cobra\n  - ContiCrypt\n  -\
  \ Crypter\n  - CRYPTES\n  - Cryptor\n  - CylanCrypt\n  - DelShad\n  - Destructor\n\
  \  - Filecoder\n  - GandCrab\n  - GrandCrab\n  - Haperlock\n  - Hiddentear\n  -\
  \ HydraCrypt\n  - Krypt\n  - Lockbit\n  - Locker\n  - Mallox\n  - Phobos\n  - Ransom\n\
  \  - Ryuk\n  - Ryzerlo\n  - Stopcrypt\n  - Tescrypt\n  - TeslaCrypt\n  - WannaCry\n\
  \  - Xorist\n"
explanation: 'Detects a highly relevant Antivirus alert that reports ransomware.

  This event must not be ignored just because the AV has blocked the malware but investigate,
  how it came there in the first place.

  '
