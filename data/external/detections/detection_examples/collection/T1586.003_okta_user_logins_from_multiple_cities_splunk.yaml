technique_id: T1586.003
technique_name: Okta User Logins from Multiple Cities
tactic: collection
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats  `security_content_summariesonly` values(Authentication.app) as app
  values(Authentication.action) as action values(Authentication.user) as user values(Authentication.reason)
  as reason values(Authentication.dest) as dest values(Authentication.signature) as
  signature  values(Authentication.method) as method  from datamodel=Authentication
  where  Authentication.signature=user.session.start by _time Authentication.src |
  `drop_dm_object_name("Authentication")` | `security_content_ctime(firstTime)` |
  `security_content_ctime(lastTime)` | iplocation src | stats count min(_time) as
  firstTime max(_time) as lastTime dc(src) as distinct_src dc(City) as distinct_city
  values(src) as src values(City) as City values(Country) as Country values(action)
  as action by user | where distinct_city > 1 | `okta_user_logins_from_multiple_cities_filter`'
explanation: The following analytic identifies instances where the same Okta user
  logs in from different cities within a 24-hour period. This detection leverages
  Okta Identity Management logs, analyzing login events and their geographic locations.
  Such behavior is significant as it may indicate a compromised account, with an attacker
  attempting unauthorized access from multiple locations. If confirmed malicious,
  this activity could lead to account takeovers and data breaches, allowing attackers
  to access sensitive information and potentially escalate their privileges within
  the environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a3d1df37-c2a9-41d0-aa8f-59f82d6192a8/
indicators:
- type: data_source
  value: Okta
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: It is uncommon for a user to log in from multiple cities simultaneously,
    which may indicate a false positive.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1110/003/
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1586.003/okta_multiple_city/okta_multiple_city_im2.log
