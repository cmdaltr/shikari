technique_id: T1115
technique_name: PowerShell Suspicious Script with Clipboard Retrieval Capabilities
tactic: collection
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and\n  (powershell.file.script_block_text\
  \ : (\n    \"Windows.Clipboard\" or\n    \"Windows.Forms.Clipboard\" or\n    \"\
  Windows.Forms.TextBox\"\n   ) and\n   powershell.file.script_block_text : (\n  \
  \  \"]::GetText\" or\n    \".Paste()\"\n  )) or powershell.file.script_block_text\
  \ : \"Get-Clipboard\" and\n  not powershell.file.script_block_text : (\n    \"sentinelbreakpoints\"\
  \ and \"Set-PSBreakpoint\" and \"PowerSploitIndicators\"\n  ) and\n  not user.id\
  \ : \"S-1-5-18\" and\n  not (\n    file.path : *WindowsPowerShell\\\\Modules\\\\\
  *.ps1 and\n    file.name : (\"Convert-ExcelRangeToImage.ps1\" or \"Read-Clipboard.ps1\"\
  )\n  )"
explanation: 'Detects PowerShell scripts that can get the contents of the clipboard,
  which attackers can abuse to retrieve sensitive

  information like credentials, messages, etc.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/92984446-aefb-4d5e-ad12-598042ca80ba.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Regular users are unlikely to use scripting utilities to capture contents of
    the clipboard, making false positives unlikely. In the case of authorized benign
    true positives (B-TPs), exceptions can be added.


    ### Related rules


    - PowerShell Keylogging Script - bd2c86a0-8b61-4457-ab38-96943984e889


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved hosts to prevent further post-compromise beha'
  mitigation: Review investigation guide for details
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/get-clipboard
- https://github.com/EmpireProject/Empire/blob/master/data/module_source/collection/Get-ClipboardContents.ps1
has_investigation_guide: true
risk_score: 47
