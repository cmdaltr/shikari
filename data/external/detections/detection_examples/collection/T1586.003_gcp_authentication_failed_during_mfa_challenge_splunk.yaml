technique_id: T1586.003
technique_name: GCP Authentication Failed During MFA Challenge
tactic: collection
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`gws_reports_login` event.name=login_failure `gws_login_mfa_methods` | stats
  count min(_time) as firstTime max(_time) as lastTime by user, src_ip, login_challenge_method
  | `gcp_authentication_failed_during_mfa_challenge_filter`'
explanation: The following analytic detects failed authentication attempts during
  the Multi-Factor Authentication (MFA) challenge on a Google Cloud Platform (GCP)
  tenant. It uses Google Workspace login failure events to identify instances where
  MFA methods were challenged but not successfully completed. This activity is significant
  as it may indicate an adversary attempting to access an account with compromised
  credentials despite MFA protection. If confirmed malicious, this could lead to unauthorized
  access attempts, potentially compromising sensitive data and resources within the
  GCP environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/345f7e1d-a3fe-4158-abd8-e630f9878323/
indicators:
- type: data_source
  value: Google Workspace login_failure
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate users may miss to reply the MFA challenge within the time
    window or deny it by mistake.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1621/
- https://attack.mitre.org/techniques/T1078/004/
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1621/gcp_failed_mfa/gws_login.log
