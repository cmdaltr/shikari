technique_id: T1557.001
technique_name: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN
  Spoofing
tactic: collection
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  QueryName|contains|all:\n  - UWhRCA\n  - BAAAA\n"
explanation: 'Detects DNS queries containing patterns associated with Kerberos coercion
  attacks via DNS object spoofing.

  The pattern "1UWhRCAAAAA..BAAAA" is a base64-encoded signature that corresponds
  to a marshaled CREDENTIAL_TARGET_INFORMATION structure.

  Attackers can use this technique to coerce authentication from victim systems to
  attacker-controlled hosts.

  It is one of the strong indicators of a Kerberos coercion attack, where adversaries
  manipulate DNS records

  to spoof Service Principal Names (SPNs) and redirect authentication requests like
  CVE-2025-33073.

  '
false_positives:
- Unknown
