technique_id: T1619
technique_name: AWS S3 Unauthenticated Bucket Access by Rare Source
tactic: collection
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset: \"aws.cloudtrail\"\n    and event.provider: \"s3.amazonaws.com\"\
  \n    and event.action: (\n        \"GetObject\" or\n        \"PutObject\" or\n\
  \        \"ListObjects\" or\n        \"DeleteObject\" or\n        \"ListBucket\"\
  )\n    and event.outcome: \"success\"\n    and aws.cloudtrail.user_identity.type:\
  \ (\"AWSAccount\" or \"Unknown\")\n    and cloud.account.id: \"anonymous\""
explanation: 'Identifies AWS CloudTrail events where an unauthenticated source is
  attempting to access an S3 bucket. This activity may

  indicate a misconfigured S3 bucket policy that allows public access to the bucket,
  potentially exposing sensitive data

  to unauthorized users. Adversaries can specify --no-sign-request in the AWS CLI
  to retrieve objects from an S3 bucket

  without authentication. This is a New Terms rule, which means it will trigger for
  each unique combination of the source.address and targeted bucket name that has
  not been seen making this API request.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/59bf26c2-bcbe-11ef-a215-f661ea17fbce.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: Amazon S3
  confidence: high
false_positives:
- description: "False Positive Analysis\n\n- **Public Buckets by Design**: Some S3\
    \ buckets may intentionally allow public access. Verify with the bucket owner\
    \ if the access was expected.\n- **Automated Tools**: Security scanners or legitimate\
    \ services may generate `GetObject` events to validate bucket configurations.\n\
    \n### Response and Remediation\n\n1. **Immediate Action**:\n    - Restrict or\
    \ remove public access to the affected S3 bucket.\n    - Update the bucket policy\
    \ to ensure access is restricted to trusted princ"
  mitigation: Review investigation guide for details
references:
- https://hackingthe.cloud/aws/exploitation/Misconfigured_Resource-Based_Policies/exploting_public_resources_attack_playbook/
has_investigation_guide: true
risk_score: 47
