technique_id: T1114.003
technique_name: Microsoft 365 Inbox Forwarding Rule Created
tactic: collection
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:o365.audit and event.provider:Exchange and\nevent.category:web\
  \ and event.action:(\"New-InboxRule\" or \"Set-InboxRule\") and\n    (\n       \
  \ o365.audit.Parameters.ForwardTo:* or\n        o365.audit.Parameters.ForwardAsAttachmentTo:*\
  \ or\n        o365.audit.Parameters.RedirectTo:*\n    )\n    and event.outcome:success"
explanation: 'Identifies when a new Inbox forwarding rule is created in Microsoft
  365. Inbox rules process messages in the Inbox based

  on conditions and take actions. In this case, the rules will forward the emails
  to a defined address. Attackers can

  abuse Inbox Rules to intercept and exfiltrate email data without making organization-wide
  configuration changes or

  having the corresponding privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ec8efb0c-604d-42fa-ac46-ed1cfbc38f78.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Microsoft 365
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate forwarding rules set by users for convenience or workflow purposes
    may trigger alerts. Review the context of the rule creation, such as the user
    and the destination address, to determine if it aligns with normal business operations.

    - Automated systems or third-party applications that integrate with Microsoft
    365 might create forwarding rules as part of their functionality. Identify these
    systems and consider excluding their associated accounts from the rule'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/microsoft-365/security/office-365-security/responding-to-a-compromised-email-account?view=o365-worldwide
- https://docs.microsoft.com/en-us/powershell/module/exchange/new-inboxrule?view=exchange-ps
- https://docs.microsoft.com/en-us/microsoft-365/security/office-365-security/detect-and-remediate-outlook-rules-forms-attack?view=o365-worldwide
- https://raw.githubusercontent.com/PwC-IR/Business-Email-Compromise-Guide/main/Extractor%20Cheat%20Sheet.pdf
has_investigation_guide: true
risk_score: 47
