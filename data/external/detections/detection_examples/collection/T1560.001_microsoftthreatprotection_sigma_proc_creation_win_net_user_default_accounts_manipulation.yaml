query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not filter\nfilter:\n  CommandLine|contains|all:\n  - guest\n  - /active no\n\
  selection_img:\n- Image|endswith:\n  - \\net.exe\n  - \\net1.exe\n- OriginalFileName:\n\
  \  - net.exe\n  - net1.exe\nselection_user_option:\n  CommandLine|contains: ' user\
  \ '\nselection_username:\n  CommandLine|contains:\n  - \" J\\xE4rjestelm\\xE4nvalvoja\
  \ \"\n  - ' Rendszergazda '\n  - \" \\u0410\\u0434\\u043C\\u0438\\u043D\\u0438\\\
  u0441\\u0442\\u0440\\u0430\\u0442\\u043E\\u0440\\\n    \\ \"\n  - ' Administrateur\
  \ '\n  - ' Administrador '\n  - \" Administrat\\xF6r \"\n  - ' Administrator '\n\
  \  - ' guest '\n  - ' DefaultAccount '\n  - \" \\\"J\\xE4rjestelm\\xE4nvalvoja\\\
  \" \"\n  - ' \"Rendszergazda\" '\n  - \" \\\"\\u0410\\u0434\\u043C\\u0438\\u043D\\\
  u0438\\u0441\\u0442\\u0440\\u0430\\u0442\\u043E\\u0440\\\n    \\\" \"\n  - ' \"\
  Administrateur\" '\n  - ' \"Administrador\" '\n  - \" \\\"Administrat\\xF6r\\\"\
  \ \"\n  - ' \"Administrator\" '\n  - ' \"guest\" '\n  - ' \"DefaultAccount\" '\n\
  \  - \" 'J\\xE4rjestelm\\xE4nvalvoja' \"\n  - ' ''Rendszergazda'' '\n  - \" '\\\
  u0410\\u0434\\u043C\\u0438\\u043D\\u0438\\u0441\\u0442\\u0440\\u0430\\u0442\\u043E\\\
  u0440\\\n    ' \"\n  - ' ''Administrateur'' '\n  - ' ''Administrador'' '\n  - \"\
  \ 'Administrat\\xF6r' \"\n  - ' ''Administrator'' '\n  - ' ''guest'' '\n  - ' ''DefaultAccount''\
  \ '\n"
explanation: Detects suspicious manipulations of default accounts such as 'administrator'
  and 'guest'. For example 'enable' or 'disable' accounts or change the password...etc
false_positives:
- Some false positives could occur with the admin or guest account. It depends on
  the scripts being used by the admins in your env. If you experience a lot of FP
  you could reduce the level to medium
