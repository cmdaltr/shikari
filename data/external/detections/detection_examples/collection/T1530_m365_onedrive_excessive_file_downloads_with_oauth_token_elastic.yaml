technique_id: T1530
technique_name: M365 OneDrive Excessive File Downloads with OAuth Token
tactic: collection
platform: Elastic
fidelity_score: 0.95
validated: true
query: "from logs-o365.audit-*\n| where\n    @timestamp > now() - 14d and\n    event.dataset\
  \ == \"o365.audit\" and\n    event.provider == \"OneDrive\" and\n    event.action\
  \ == \"FileDownloaded\" and\n    o365.audit.AuthenticationType == \"OAuth\" and\n\
  \    event.outcome == \"success\"\n| eval\n    Esql.time_window_date_trunc = date_trunc(1\
  \ minutes, @timestamp)\n| keep\n    Esql.time_window_date_trunc,\n    o365.audit.UserId,\n\
  \    file.name,\n    source.ip\n| stats\n    Esql.file_name_count_distinct = count_distinct(file.name),\n\
  \    Esql.event_count = count(*)\n  by\n    Esql.time_window_date_trunc,\n    o365.audit.UserId,\n\
  \    source.ip\n| where\n    Esql.file_name_count_distinct >= 25"
explanation: 'Identifies when an excessive number of files are downloaded from OneDrive
  using OAuth authentication. Adversaries may

  conduct phishing campaigns to steal OAuth tokens and impersonate users. These access
  tokens can then be used to download

  files from OneDrive.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0e524fa6-eed3-11ef-82b4-f661ea17fbce.toml
query_type: esql
query_language: esql
indicators:
- type: data_source
  value: Microsoft 365
  confidence: high
- type: data_source
  value: SharePoint
  confidence: high
- type: data_source
  value: OneDrive
  confidence: high
false_positives:
- description: 'False Positive Analysis


    - Verify if the user regularly downloads large batches of files as part of their
    job function.

    - Determine if the downloads were triggered by an authorized automated process,
    such as a data backup or synchronization tool.

    - Confirm if the detected OAuth application is approved for enterprise use and
    aligns with expected usage patterns.


    ### Response and Remediation


    - If unauthorized activity is confirmed, revoke the OAuth token used and terminate
    active OneDrive session'
  mitigation: Review investigation guide for details
references:
- https://www.volexity.com/blog/2025/02/13/multiple-russian-threat-actors-targeting-microsoft-device-code-authentication/
has_investigation_guide: true
risk_score: 47
