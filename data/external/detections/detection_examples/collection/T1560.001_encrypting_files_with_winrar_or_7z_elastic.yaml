  value: Sysmon
  confidence: high
- type: data_source
  value: Microsoft Defender for Endpoint
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Backup software can use these utilities. Check the `process.parent.executable`
    and `process.parent.command_line` fields to determine what triggered the encryption.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Prioritize cases that involve personally identifiable information (PII) or other
    classified data.

    - Isolate the involved hosts to prevent further post-compromise behavior.

    - Investigate credential ex'
  mitigation: Review investigation guide for details
references:
- https://www.welivesecurity.com/2020/12/02/turla-crutch-keeping-back-door-open/
- https://www.elastic.co/security-labs/siestagraph-new-implant-uncovered-in-asean-member-foreign-ministry
