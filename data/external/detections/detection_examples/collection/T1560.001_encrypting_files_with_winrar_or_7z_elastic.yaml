technique_id: T1560.001
technique_name: Encrypting Files with WinRar or 7z
tactic: collection
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  (\n  (\n    (\n      process.name : (\"rar.exe\", \"WinRAR.exe\") or ?process.code_signature.subject_name\
  \ == \"win.rar GmbH\" or\n      ?process.pe.original_file_name == \"WinRAR.exe\"\
  \n    ) and\n    process.args == \"a\" and process.args : (\"-hp*\", \"-p*\", \"\
  /hp*\", \"/p*\")\n  ) or\n  (\n    (process.name : (\"7z.exe\", \"7za.exe\") or\
  \ ?process.pe.original_file_name in (\"7z.exe\", \"7za.exe\")) and\n    process.args\
  \ == \"a\" and process.args : \"-p*\"\n  )\n) and\n  not process.parent.executable\
  \ : (\n        \"C:\\\\Program Files\\\\*.exe\",\n        \"C:\\\\Program Files\
  \ (x86)\\\\*.exe\",\n        \"?:\\\\ManageEngine\\\\*\\\\jre\\\\bin\\\\java.exe\"\
  ,\n        \"?:\\\\Nox\\\\bin\\\\Nox.exe\",\n        \"\\\\Device\\\\HarddiskVolume?\\\
  \\Program Files\\\\*.exe\",\n        \"\\\\Device\\\\HarddiskVolume?\\\\Program\
  \ Files (x86)\\\\*.exe\",\n        \"\\\\Device\\\\HarddiskVolume?\\\\ManageEngine\\\
  \\*\\\\jre\\\\bin\\\\java.exe\",\n        \"\\\\Device\\\\HarddiskVolume?\\\\Nox\\\
  \\bin\\\\Nox.exe\"\n      )"
explanation: 'Identifies use of WinRar or 7z to create an encrypted files. Adversaries
  will often compress and encrypt data in

  preparation for exfiltration.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/45d273fb-1dca-457d-9855-bcb302180c21.toml
query_type: eql
query_language: eql
