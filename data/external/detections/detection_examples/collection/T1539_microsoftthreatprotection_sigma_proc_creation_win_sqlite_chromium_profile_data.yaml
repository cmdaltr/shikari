technique_id: T1539
technique_name: SQLite Chromium Profile Data DB Access
tactic: collection
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 24c77512-782b-448a-8950-eddb0785fc71
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_chromium:\n  CommandLine|contains:\n  - \\User Data\\\n  - \\Opera Software\\\
  \n  - \\ChromiumViewer\\\nselection_data:\n  CommandLine|contains:\n  - Login Data\n\
  \  - Cookies\n  - Web Data\n  - History\n  - Bookmarks\nselection_sql:\n- Product:\
  \ SQLite\n- Image|endswith:\n  - \\sqlite.exe\n  - \\sqlite3.exe\n"
explanation: Detect usage of the "sqlite" binary to query databases in Chromium-based
  browsers for potential data stealing.
false_positives:
- Unknown
references:
- https://github.com/redcanaryco/atomic-red-team/blob/84d9edaaaa2c5511144521b0e4af726d1c7276ce/atomics/T1539/T1539.md#atomic-test-2---steal-chrome-cookies-windows
- https://blog.cyble.com/2022/04/21/prynt-stealer-a-new-info-stealer-performing-clipper-and-keylogger-activities/
tags:
