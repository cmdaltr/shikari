query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - Image|contains:\n  - \\goldenPac\n  - \\karmaSMB\n  - \\kintercept\n  - \\ntlmrelayx\n\
  \  - \\rpcdump\n  - \\samrdump\n  - \\secretsdump\n  - \\smbexec\n  - \\smbrelayx\n\
  \  - \\wmiexec\n  - \\wmipersist\n- Image|endswith:\n  - \\atexec_windows.exe\n\
  \  - \\dcomexec_windows.exe\n  - \\dpapi_windows.exe\n  - \\findDelegation_windows.exe\n\
  \  - \\GetADUsers_windows.exe\n  - \\GetNPUsers_windows.exe\n  - \\getPac_windows.exe\n\
  \  - \\getST_windows.exe\n  - \\getTGT_windows.exe\n  - \\GetUserSPNs_windows.exe\n\
  \  - \\ifmap_windows.exe\n  - \\mimikatz_windows.exe\n  - \\netview_windows.exe\n\
  \  - \\nmapAnswerMachine_windows.exe\n  - \\opdump_windows.exe\n  - \\psexec_windows.exe\n\
  \  - \\rdp_check_windows.exe\n  - \\sambaPipe_windows.exe\n  - \\smbclient_windows.exe\n\
  \  - \\smbserver_windows.exe\n  - \\sniff_windows.exe\n  - \\sniffer_windows.exe\n\
  \  - \\split_windows.exe\n  - \\ticketer_windows.exe\n"
explanation: Detects the execution of different compiled Windows binaries of the impacket
  toolset (based on names or part of their names - could lead to false positives)
false_positives:
- Legitimate use of the impacket tools
references:
- https://github.com/ropnop/impacket_static_binaries/releases/tag/0.9.21-dev-binaries
