technique_id: T1213
technique_name: Microsoft Entra ID SharePoint Access for User Principal via Auth Broker
tactic: collection
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset: \"azure.signinlogs\"\n    and azure.signinlogs.properties.app_id:\
  \ \"29d9ed98-a469-4536-ade2-f981bc1d605e\"\n    and azure.signinlogs.properties.resource_id:\
  \ \"00000003-0000-0ff1-ce00-000000000000\"\n    and azure.signinlogs.identity: *\n\
  \    and azure.signinlogs.properties.user_principal_name: *\n    and azure.signinlogs.properties.incoming_token_type:\
  \ (\"refreshToken\" or \"primaryRefreshToken\")\n    and azure.signinlogs.properties.is_interactive:\
  \ false"
explanation: 'This rule detects non-interactive authentication activity against SharePoint
  Online (`Office 365 SharePoint Online`) by

  a user principal via the `Microsoft Authentication Broker` application. The session
  leverages a refresh token or Primary

  Refresh Token (PRT) without interactive sign-in, often used in OAuth phishing or
  token replay scenarios.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a3cc60d8-2701-11f0-accf-f661ea17fbcd.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Microsoft Entra ID
  confidence: high
- type: data_source
  value: Microsoft Entra ID Sign-in Logs
  confidence: high
false_positives:
- description: "False Positive Analysis\n\n- Certain MDM or mobile app scenarios may\
    \ use refresh tokens legitimately via brokered apps.\n- Automated processes using\
    \ authorized, scripted clients could trigger this activity, especially in developer\
    \ or operations environments.\n- If Conditional Access policies are configured\
    \ in “report-only” mode or exempted for trusted apps, activity may appear unusual\
    \ but be authorized.\n\n### Response and Remediation\n\n- If activity appears\
    \ unauthorized:\n  - Investigate and revoke act"
  mitigation: Review investigation guide for details
references:
- https://www.volexity.com/blog/2025/04/22/phishing-for-codes-russian-threat-actors-target-microsoft-365-oauth-workflows/
- https://github.com/dirkjanm/ROADtools
- https://dirkjanm.io/phishing-for-microsoft-entra-primary-refresh-tokens/
has_investigation_guide: true
risk_score: 73
