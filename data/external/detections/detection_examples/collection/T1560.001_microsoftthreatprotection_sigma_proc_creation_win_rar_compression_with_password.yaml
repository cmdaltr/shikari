technique_id: T1560.001
technique_name: Rar Usage with Password and Compression Level
tactic: collection
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.83
validated: true
source: sigma
sigma_id: faa48cae-6b25-4f00-a094-08947fef582f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_password and\
  \ selection_other\nselection_other:\n  CommandLine|contains:\n  - ' -m'\n  - ' a\
  \ '\nselection_password:\n  CommandLine|contains: ' -hp'\n"
explanation: Detects the use of rar.exe, on the command line, to create an archive
  with password protection or with a specific compression level. This is pretty indicative
  of malicious actions.
false_positives:
- Legitimate use of Winrar command line version
- Other command line tools, that use these flags
references:
- https://labs.sentinelone.com/the-anatomy-of-an-apt-attack-and-cobaltstrike-beacons-encoded-configuration/
- https://ss64.com/bash/rar.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1560.001/T1560.001.md
tags:
- attack.collection
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_password:
    CommandLine|contains: ' -hp'
  selection_other:
    CommandLine|contains:
    - ' -m'
    - ' a '
  condition: selection_password and selection_other
