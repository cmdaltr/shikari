technique_id: T1557.003
technique_name: Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation
tactic: collection
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_directory_service_access:\n\
  \  AdditionalInfo|contains|all:\n  - UWhRCA\n  - BAAAA\n  - CN=MicrosoftDNS\n  EventID:\
  \ 4662\nselection_directory_service_changes:\n  EventID:\n  - 5136\n  - 5137\n \
  \ ObjectClass: dnsNode\n  ObjectDN|contains|all:\n  - UWhRCA\n  - BAAAA\n  - CN=MicrosoftDNS\n"
explanation: 'Detects modifications to DNS records in Active Directory where the Distinguished
  Name (DN) contains a base64-encoded blob

  matching the pattern "1UWhRCAAAAA...BAAAA". This pattern corresponds to a marshaled
  CREDENTIAL_TARGET_INFORMATION structure,

  commonly used in Kerberos coercion attacks. Adversaries may exploit this to coerce
  victim systems into authenticating to

  attacker-controlled hosts by spoofing SPNs via DNS. It is one of the strong indicators
  of a Kerberos coercion attack,.

  where adversaries manipulate DNS records to spoof Service Principal Names (SPNs)
  and redirect authentication requests like CVE-2025-33073.

  Please investigate the user account that made the changes, as it is likely a low-privileged
  account that has been compromised.

  '
false_positives:
- Unknown
references:
- https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html
- https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025
tags:
- attack.collection
- attack.credential-access
- attack.t1557.003
- attack.persistence
- attack.privilege-escalation
logsource:
  product: windows
  service: security
  definition: 'By default these events are not logged by default for MicrosoftDNS
    objects in Active Directory.

    To enable detection, configure an AuditRule on the DNS object container with the
    "CreateChild" permission for the "Everyone" principal.

    This can be accomplished using tools such as Set-AuditRule (see https://github.com/OTRF/Set-AuditRule).

    '
detection:
  selection_directory_service_changes:
    EventID:
    - 5136
    - 5137
    ObjectClass: dnsNode
    ObjectDN|contains|all:
    - UWhRCA
    - BAAAA
    - CN=MicrosoftDNS
  selection_directory_service_access:
    EventID: 4662
    AdditionalInfo|contains|all:
    - UWhRCA
    - BAAAA
    - CN=MicrosoftDNS
  condition: 1 of selection_*
