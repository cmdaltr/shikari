technique_id: T1557.001
technique_name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
tactic: collection
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 0ed99dda-6a35-11ef-8c99-0242ac120002
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - UWhRCA\n  - BAAAA\n"
explanation: 'Detects the presence of "UWhRC....AAYBAAAA" pattern in command line.

  The pattern "1UWhRCAAAAA..BAAAA" is a base64-encoded signature that corresponds
  to a marshaled CREDENTIAL_TARGET_INFORMATION structure.

  Attackers can use this technique to coerce authentication from victim systems to
  attacker-controlled hosts.

  It is one of the strong indicators of a Kerberos coercion attack, where adversaries
  manipulate DNS records

  to spoof Service Principal Names (SPNs) and redirect authentication requests like
  in CVE-2025-33073.

  If you see this pattern in the command line, it is likely an attempt to add spoofed
  Service Principal Names (SPNs) to DNS records,

  or checking for the presence of such records through the `nslookup` command.

  '
false_positives:
- Unknown
