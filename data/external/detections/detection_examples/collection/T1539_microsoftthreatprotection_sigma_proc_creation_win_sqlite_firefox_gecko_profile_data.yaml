technique_id: T1539
technique_name: SQLite Firefox Profile Data DB Access
tactic: collection
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 4833155a-4053-4c9c-a997-777fcea0baa7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_firefox:\n  CommandLine|contains:\n  - cookies.sqlite\n  - places.sqlite\n\
  selection_sql:\n- Product: SQLite\n- Image|endswith:\n  - \\sqlite.exe\n  - \\sqlite3.exe\n"
explanation: Detect usage of the "sqlite" binary to query databases in Firefox and
  other Gecko-based browsers for potential data stealing.
false_positives:
- Unknown
