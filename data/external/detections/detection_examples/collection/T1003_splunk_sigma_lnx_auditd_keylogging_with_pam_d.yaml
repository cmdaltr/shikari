query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_path_events:\n\
  \  name:\n  - /etc/pam.d/system-auth\n  - /etc/pam.d/password-auth\n  type: PATH\n\
  selection_tty_events:\n  type:\n  - TTY\n  - USER_TTY\n"
explanation: Detect attempt to enable auditing of TTY input
false_positives:
- Administrative work
