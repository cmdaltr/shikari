  category: registry_event
  product: windows
detection:
  selection_1:
    TargetObject|contains|all:
    - \Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\
    - \NonPackaged
  selection_2:
    TargetObject|contains:
    - microphone
    - webcam
  selection_3:
    TargetObject|contains:
    - :#Windows#Temp#
    - :#$Recycle.bin#
    - :#Temp#
    - :#Users#Public#
    - :#Users#Default#
    - :#Users#Desktop#
  condition: all of selection_*
