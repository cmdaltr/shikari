technique_id: T1125
technique_name: Suspicious Camera and Microphone Access
tactic: collection
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 62120148-6b7a-42be-8b91-271c04e281a3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_1:\n  TargetObject|contains|all:\n  - \\Software\\Microsoft\\Windows\\\
  CurrentVersion\\CapabilityAccessManager\\ConsentStore\\\n  - \\NonPackaged\nselection_2:\n\
  \  TargetObject|contains:\n  - microphone\n  - webcam\nselection_3:\n  TargetObject|contains:\n\
  \  - :#Windows#Temp#\n  - :#$Recycle.bin#\n  - :#Temp#\n  - :#Users#Public#\n  -\
  \ :#Users#Default#\n  - :#Users#Desktop#\n"
explanation: Detects Processes accessing the camera and microphone from suspicious
  folder
false_positives:
- Unlikely, there could be conferencing software running from a Temp folder accessing
  the devices
references:
- https://medium.com/@7a616368/can-you-track-processes-accessing-the-camera-and-microphone-7e6885b37072
tags:
