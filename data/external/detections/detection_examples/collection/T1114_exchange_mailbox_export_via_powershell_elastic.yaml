technique_id: T1114
technique_name: Exchange Mailbox Export via PowerShell
tactic: collection
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : \"New-MailboxExportRequest\""
explanation: 'Identifies the use of the Exchange PowerShell cmdlet, New-MailBoxExportRequest,
  to export the contents of a primary

  mailbox or archive to a .pst file. Adversaries may target user email to collect
  sensitive information.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/54a81f68-5f2a-421e-8eed-f888278bb712.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This mechanism can be used legitimately. Analysts can dismiss the alert if the
    administrator is aware of the activity and it is done with proper approval.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - If the involved host is not the Exchange server, isolate the host to prevent
    further post-compromise behavior.

    - Use the `Remove-MailboxExportRequest` cmdlet to remove fully or partially completed
    export requ'
  mitigation: Review investigation guide for details
references:
