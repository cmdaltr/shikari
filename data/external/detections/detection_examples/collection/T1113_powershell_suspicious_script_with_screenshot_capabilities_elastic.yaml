technique_id: T1113
technique_name: PowerShell Suspicious Script with Screenshot Capabilities
tactic: collection
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    CopyFromScreen and\n    (\"System.Drawing.Bitmap\" or \"Drawing.Bitmap\"\
  )\n  ) and not user.id : \"S-1-5-18\""
explanation: 'Detects PowerShell scripts that can take screenshots, which is a common
  feature in post-exploitation kits and remote

  access tools (RATs).'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/959a7353-1129-4aa7-9084-30746b256a70.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Regular users do not have a business justification for using scripting utilities
    to take screenshots, which makes false positives unlikely. In the case of authorized
    benign true positives (B-TPs), exceptions can be added.


    ### Related rules


    - PowerShell Keylogging Script - bd2c86a0-8b61-4457-ab38-96943984e889


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved hosts to prevent further post-'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/dotnet/api/system.drawing.graphics.copyfromscreen
has_investigation_guide: true
risk_score: 47
