technique_id: T1559
technique_name: Suspicious Inter-Process Communication via Outlook
tactic: collection
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence with maxspan=1m\n[process where host.os.type == \"windows\" and event.action\
  \ == \"start\" and\n  (\n    process.name : (\n      \"rundll32.exe\", \"mshta.exe\"\
  , \"powershell.exe\", \"pwsh.exe\",\n      \"cmd.exe\", \"regsvr32.exe\", \"cscript.exe\"\
  , \"wscript.exe\"\n    ) or\n    (\n      (process.code_signature.trusted == false\
  \ or process.code_signature.exists == false) and\n      (process.Ext.relative_file_creation_time\
  \ <= 500 or process.Ext.relative_file_name_modify_time <= 500)\n    )\n  )\n] by\
  \ process.entity_id\n[process where host.os.type == \"windows\" and event.action\
  \ == \"start\" and process.name : \"OUTLOOK.EXE\" and\n  process.Ext.effective_parent.name\
  \ != null] by process.Ext.effective_parent.entity_id"
explanation: 'Detects Inter-Process Communication with Outlook via Component Object
  Model from an unusual process. Adversaries may

  target user email to collect sensitive information or send email on their behalf
  via API.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1dee0500-4aeb-44ca-b24b-4a285d7b6ba1.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts or tools may trigger the rule if they use
    processes like PowerShell or cmd.exe to automate tasks involving Outlook. To manage
    this, identify and whitelist these scripts or tools by their specific file paths
    or hashes.

    - Software updates or installations might cause processes to appear as recently
    modified, leading to false positives. Regularly update the list of trusted software
    and exclude these known update processes from triggering'
  mitigation: Review investigation guide for details
references:
- https://github.com/center-for-threat-informed-defense/adversary_emulation_library/blob/master/apt29/Archive/CALDERA_DIY/evals/payloads/stepSeventeen_email.ps1
has_investigation_guide: true
risk_score: 47
