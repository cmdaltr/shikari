technique_id: T1059
technique_name: PowerShell Suspicious Script with Audio Capture Capabilities
tactic: collection
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    \"Get-MicrophoneAudio\" or\n    \"WindowsAudioDevice-Powershell-Cmdlet\"\
  \ or\n    (waveInGetNumDevs and mciSendStringA)\n  )\n  and not powershell.file.script_block_text\
  \ : (\n    \"sentinelbreakpoints\" and \"Set-PSBreakpoint\" and \"PowerSploitIndicators\"\
  \n  )\n  and not user.id : \"S-1-5-18\""
explanation: Detects PowerShell scripts that can record audio, a common feature in
  popular post-exploitation tooling.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2f2f4939-0b34-40c2-a0a3-844eb7889f43.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Regular users should not need scripts to capture audio, which makes false positives
    unlikely. In the case of authorized benign true positives (B-TPs), exceptions
    can be added.


    ### Related rules


    - PowerShell PSReflect Script - 56f2e9b5-4803-4e44-a0a4-a52dc79d57fe

    - Potential Process Injection via PowerShell - 2e29e96a-b67c-455a-afe4-de6183431d0d


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the in'
  mitigation: Review investigation guide for details
references:
- https://github.com/PowerShellMafia/PowerSploit/blob/master/Exfiltration/Get-MicrophoneAudio.ps1
has_investigation_guide: true
risk_score: 73
