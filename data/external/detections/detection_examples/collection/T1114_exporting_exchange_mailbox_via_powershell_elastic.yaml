false_positives:
- description: 'False positive analysis


    - This mechanism can be used legitimately. Analysts can dismiss the alert if the
    administrator is aware of the activity and it is done with proper approval.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - If the involved host is not the Exchange server, isolate the host to prevent
    further post-compromise behavior.

    - Use the `Remove-MailboxExportRequest` cmdlet to remove fully or partially completed
    export requ'
