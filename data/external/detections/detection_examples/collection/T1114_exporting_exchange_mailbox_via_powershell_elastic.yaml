technique_id: T1114
technique_name: Exporting Exchange Mailbox via PowerShell
tactic: collection
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name: (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\") and\n\
  \  process.command_line : (\"*MailboxExportRequest*\", \"*-Mailbox*-ContentFilter*\"\
  )"
explanation: 'Identifies the use of the Exchange PowerShell cmdlet, New-MailBoxExportRequest,
  to export the contents of a primary

  mailbox or archive to a .pst file. Adversaries may target user email to collect
  sensitive information.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/6aace640-e631-4870-ba8e-5fdda09325db.toml
