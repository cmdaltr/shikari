  confidence: high
- type: data_source
  value: AWS Sign-In
  confidence: high
false_positives:
- description: 'False positive analysis

    - Organizations using SSO for console access will routinely see federated `ConsoleLogin`
    where CloudTrail shows `MFAUsed: "No"` — this is expected due to IdP-side MFA.

    - Internal tools/automation that create federation links (`GetSigninToken`) for
    operators.

    - Maintain allow-lists for corp/VPN CIDRs, approved ASNs, and known automation
    user-agents.


    ### Response and remediation

    - If IdP confirms MFA and the source context is expected: document and close.

    - If IdP shows no'
