  \ or\n        \"9ba1a5c7-f17a-4de9-a1f1-6178c8d51223\" or\n        \"cab96880-db5b-4e15-90a7-f3f1d62ffe39\"\
  \ or\n        \"3a4d129e-7f50-4e0d-a7fd-033add0a29f4\"\n    )"
explanation: 'Identifies rare Azure Entra ID apps IDs requesting authentication on-behalf-of
  a principal user. An adversary with stolen

  credentials may specify an Azure-managed app ID to authenticate on-behalf-of a user.
  This is a rare event and may

  indicate an attempt to bypass conditional access policies (CAP) and multi-factor
  authentication (MFA) requirements. The

  app ID specified may not be commonly used by the user based on their historical
  sign-in activity.'
