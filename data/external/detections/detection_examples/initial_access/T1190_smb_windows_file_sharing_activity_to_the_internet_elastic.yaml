technique_id: T1190
technique_name: SMB (Windows File Sharing) Activity to the Internet
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "(event.dataset: network_traffic.flow or (event.category: (network or network_traffic)))\
  \ and\n  network.transport:tcp and (destination.port:(139 or 445) or event.dataset:zeek.smb)\
  \ and\n  source.ip:(\n    10.0.0.0/8 or\n    172.16.0.0/12 or\n    192.168.0.0/16\n\
  \  ) and\n  not destination.ip:(\n    10.0.0.0/8 or\n    127.0.0.0/8 or\n    169.254.0.0/16\
  \ or\n    172.16.0.0/12 or\n    192.0.0.0/24 or\n    192.0.0.0/29 or\n    192.0.0.8/32\
  \ or\n    192.0.0.9/32 or\n    192.0.0.10/32 or\n    192.0.0.170/32 or\n    192.0.0.171/32\
  \ or\n    192.0.2.0/24 or\n    192.31.196.0/24 or\n    192.52.193.0/24 or\n    192.168.0.0/16\
  \ or\n    192.88.99.0/24 or\n    224.0.0.0/4 or\n    100.64.0.0/10 or\n    192.175.48.0/24\
  \ or\n    198.18.0.0/15 or\n    198.51.100.0/24 or\n    203.0.113.0/24 or\n    240.0.0.0/4\
  \ or\n    \"::1\" or\n    \"FE80::/10\" or\n    \"FF00::/8\"\n  )"
explanation: 'This rule detects network events that may indicate the use of Windows
  file sharing (also called SMB or CIFS) traffic to

  the Internet. SMB is commonly used within networks to share files, printers, and
  other system resources amongst trusted

  systems. It should almost never be directly exposed to the Internet, as it is frequently
  targeted and exploited by

  threat actors as an initial access or backdoor vector or for data exfiltration.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c82b2bd8-d701-420c-ba43-f11a155b681a.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PAN-OS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Internal testing environments may generate SMB traffic to external IPs for legitimate
    reasons. Identify and whitelist these IPs to prevent false positives.

    - Cloud services or remote backup solutions might use SMB for data transfer. Verify
    these services and add their IP ranges to the exception list if they are trusted.

    - VPN connections can sometimes appear as external traffic. Ensure that VPN IP
    ranges are included in the list of known safe IPs to avoid misclassifica'
  mitigation: Review investigation guide for details
references:
- https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry.xhtml
has_investigation_guide: true
risk_score: 73
