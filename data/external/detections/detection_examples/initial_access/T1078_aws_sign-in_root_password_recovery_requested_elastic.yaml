technique_id: T1078
technique_name: AWS Sign-In Root Password Recovery Requested
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset:aws.cloudtrail and\nevent.provider:signin.amazonaws.com and\
  \ \nevent.action:PasswordRecoveryRequested and \nevent.outcome:success"
explanation: "Identifies a password recovery request for the AWS account root user.\n\
  In AWS, the PasswordRecoveryRequested event from signin.amazonaws.com applies to\
  \ the root user’s “Forgot your password?” flow. Other identity types, like IAM and\
  \ federated users, do not generate this event. \nThis alert indicates that someone\
  \ initiated the root password reset workflow for this account. Verify whether this\
  \ was an expected action and review identity provider notifications/email to confirm\
  \ legitimacy."
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/69c420e8-6c9e-4d28-86c0-8a2be2d1e78c.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS Sign-In
  confidence: high
false_positives:
