technique_id: T1114.002
technique_name: O365 Mailbox Read Access Granted to Application
tactic: initial_access
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Operation="Update application." | eval json_data=mvindex(''ModifiedProperties{}.NewValue'',0)
  | eval json_data=replace(json_data,"^\[\s*","") | eval json_data=replace(json_data,"\s*\]$","")
  | spath input=json_data path=RequiredAppPermissions{}.EntitlementId output=EntitlementIds
  | eval match_found=mvfind(EntitlementIds, "810c84a8-4a9e-49e6-bf7d-12d183f40d01")
  | where isnotnull(match_found) | fillnull | stats count earliest(_time) as firstTime
  max(_time) as lastTime values(EntitlementIds) as EntitlementIds by signature, user,
  dest, vendor_account, vendor_product, object, src | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `o365_mailbox_read_access_granted_to_application_filter`'
explanation: The following analytic identifies instances where the Mail.Read Graph
  API permissions are granted to an application registration within an Office 365
  tenant. It leverages O365 audit logs, specifically events related to changes in
  application permissions within the AzureActiveDirectory workload. This activity
  is significant because the Mail.Read permission allows applications to access and
  read all emails within a user's mailbox, which often contain sensitive or confidential
  information. If confirmed malicious, this could lead to data exfiltration, spear-phishing
  attacks, or further compromise based on the information gathered from the emails.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/27ab61c5-f08a-438a-b4d3-325e666490b3/
indicators:
- type: data_source
  value: O365 Update application.
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: There are legitimate scenarios in wich an Application registrations
    requires Mailbox read access. Filter as needed.
  mitigation: Review context and user activity
