technique_id: T1078
technique_name: Successful Application SSO from Rare Unknown Client Device
tactic: initial_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset: \"okta.system\"\n    and event.action: \"user.authentication.sso\"\
  \n    and event.outcome: \"success\"\n    and okta.client.device: (\"Unknown\" or\
  \ \"unknown\")"
explanation: 'Detects successful single sign-on (SSO) events to Okta applications
  from an unrecognized or "unknown" client device, as

  identified by the user-agent string. This activity may be indicative of exploitation
  of a vulnerability in Okta''s

  Classic Engine, which could allow an attacker to bypass application-specific sign-on
  policies, such as device or network

  restrictions. The vulnerability potentially enables unauthorized access to applications
  using only valid, stolen

  credentials, without requiring additional authentication factors.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1502a836-84b2-11ef-b026-f661ea17fbcc.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis


    - Employees using new or updated devices may trigger false positives. Regularly
    update the list of recognized devices to include these changes.

    - Legitimate users accessing applications from different locations or networks,
    such as while traveling, can appear as unknown devices. Implement geolocation
    checks and allow exceptions for known travel patterns.

    - Software updates or changes in user-agent strings can cause devices to be misidentified.
    Monitor for consistent patt'
  mitigation: Review investigation guide for details
references:
- https://trust.okta.com/security-advisories/okta-classic-application-sign-on-policy-bypass-2024/
has_investigation_guide: true
risk_score: 47
