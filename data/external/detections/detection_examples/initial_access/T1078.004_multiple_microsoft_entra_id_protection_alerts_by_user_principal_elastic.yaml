technique_id: T1078.004
technique_name: Multiple Microsoft Entra ID Protection Alerts by User Principal
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'sequence by azure.identityprotection.properties.user_principal_name with maxspan=10m

  [any where event.module == "azure" and event.dataset == "azure.identity_protection"]
  with runs=2'
explanation: 'Identifies more than two Microsoft Entra ID Protection alerts associated
  to the user principal in a short time period.

  Microsoft Entra ID Protection alerts are triggered by suspicious sign-in activity,
  such as anomalous IP addresses, risky

  sign-ins, or other risk detections. Multiple alerts in a short time frame may indicate
  an ongoing attack or compromised

  account.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/bcf0e362-0a2f-4f5e-9dd8-0d34f901781f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Microsoft Entra ID
  confidence: high
- type: data_source
  value: Microsoft Entra ID Protection Logs
  confidence: high
