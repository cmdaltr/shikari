false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may trigger the rule when they
    use scripts or executables like PowerShell or cmd.exe. Users can create exceptions
    for known software update processes by identifying their specific command-line
    arguments or parent process details.

    - System administrators often use scripts for maintenance tasks that might be
    flagged by this rule. To prevent false positives, administrators should document
    and exclude these routine scripts by sp'
  mitigation: Review investigation guide for details
