technique_id: T1566.002
technique_name: Suspicious Explorer Child Process
tactic: initial_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n   process.name : (\"cscript.exe\", \"wscript.exe\", \"powershell.exe\", \"\
  rundll32.exe\", \"cmd.exe\", \"mshta.exe\", \"regsvr32.exe\") or\n   ?process.pe.original_file_name\
  \ in (\"cscript.exe\", \"wscript.exe\", \"PowerShell.EXE\", \"RUNDLL32.EXE\", \"\
  Cmd.Exe\", \"MSHTA.EXE\", \"REGSVR32.EXE\")\n  ) and\n  /* Explorer started via\
  \ DCOM */\n  process.parent.name : \"explorer.exe\" and process.parent.args : \"\
  -Embedding\" and\n  not process.parent.args:\n          (\n            /* Noisy\
  \ CLSID_SeparateSingleProcessExplorerHost Explorer COM Class IDs   */\n        \
  \    \"/factory,{5BD95610-9434-43C2-886C-57852CC8A120}\",\n            \"/factory,{ceff45ee-c862-41de-aee2-a022c81eda92}\"\
  \n          )"
explanation: 'Identifies a suspicious Windows explorer child process. Explorer.exe
  can be abused to launch malicious scripts or

  executables from a trusted parent process.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9a5b4e31-6cde-4295-9ff7-6be1b8567e1b.toml
query_type: eql
query_language: eql
