technique_id: T1078
technique_name: Entra ID Device Code Auth with Broker Client
tactic: initial_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:(azure.activitylogs or azure.signinlogs)\n    and azure.signinlogs.properties.authentication_protocol:deviceCode\n\
  \    and azure.signinlogs.properties.conditional_access_audiences.application_id:29d9ed98-a469-4536-ade2-f981bc1d605e\n\
  \    and event.outcome:success or (\n        azure.activitylogs.properties.appId:29d9ed98-a469-4536-ade2-f981bc1d605e\n\
  \        and azure.activitylogs.properties.authentication_protocol:deviceCode)"
explanation: Identifies device code authentication with an Azure broker client for
  Entra ID. Adversaries abuse Primary Refresh Tokens (PRTs) to bypass multi-factor
  authentication (MFA) and gain unauthorized access to Azure resources. PRTs are used
  in Conditional Access policies to enforce device-based controls. Compromising PRTs
  allows attackers to bypass these policies and gain unauthorized access. This rule
  detects successful sign-ins using device code authentication with the Entra ID broker
  client application ID (29d9ed98-a469-4536-ade2-f981bc1d605e).
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a83b3dac-325a-11ef-b3e6-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Microsoft Entra ID
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate device code authentication by trusted applications or users may trigger
    the rule. Review the application ID and user context to confirm legitimacy.

    - Frequent access by automated scripts or services using device code authentication
    can be mistaken for unauthorized access. Identify and document these services,
    then create exceptions for known application IDs.

    - Shared devices in environments with multiple users may cause false positives
    if device code authent'
  mitigation: Review investigation guide for details
references:
- https://dirkjanm.io/assets/raw/Phishing%20the%20Phishing%20Resistant.pdf
- https://learn.microsoft.com/en-us/troubleshoot/azure/entra/entra-id/governance/verify-first-party-apps-sign-in
- https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/signinlogs
has_investigation_guide: true
risk_score: 47
