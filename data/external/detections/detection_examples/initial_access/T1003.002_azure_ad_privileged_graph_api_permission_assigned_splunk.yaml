technique_id: T1003.002
technique_name: Azure AD Privileged Graph API Permission Assigned
tactic: initial_access
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` category=AuditLogs operationName="Update application"
  | eval newvalue = mvindex(''properties.targetResources{}.modifiedProperties{}.newValue'',0)
  | spath input=newvalue | search "{}.RequiredAppPermissions{}.EntitlementId"=" 1bfefb4e-e0b5-418b-a88f-73c46d2cc8e9"
  OR "{}.RequiredAppPermissions{}.EntitlementId" ="06b708a9-e830-4db3-a914-8e69da51d44f"
  OR "{}.RequiredAppPermissions{}.EntitlementId" ="9e3f62cf-ca93-4989-b6ce-bf83c28f9fe8"
  | eval Permissions = ''{}.RequiredAppPermissions{}.EntitlementId'' | fillnull |
  stats count min(_time) as firstTime max(_time) as lastTime by dest user src vendor_account
  vendor_product Permissions signature | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `azure_ad_privileged_graph_api_permission_assigned_filter`'
explanation: The following analytic detects the assignment of high-risk Graph API
  permissions in Azure AD, specifically Application.ReadWrite.All, AppRoleAssignment.ReadWrite.All,
  and RoleManagement.ReadWrite.Directory. It uses azure_monitor_aad data to scan AuditLogs
  for 'Update application' operations, identifying when these permissions are assigned.
  This activity is significant as it grants broad control over Azure AD, including
  application and directory settings. If confirmed malicious, it could lead to unauthorized
  modifications and potential security breaches, compromising the integrity and security
  of the Azure AD environment. Immediate investigation is required.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/5521f8c5-1aa3-473c-9eb7-853701924a06/
indicators:
- type: data_source
  value: Azure Active Directory Update application
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Privileged Graph API permissions may be assigned for legitimate purposes.
    Filter as needed.
  mitigation: Review context and user activity
