false_positives:
- description: 'False positive analysis


    - Legitimate UM service updates or patches may trigger the rule. Regularly update
    the list of known legitimate executables to include new or updated UM service
    files.

    - Custom scripts or monitoring tools that interact with UM services might be flagged.
    Identify these scripts and add their executables to the exclusion list if they
    are verified as safe.

    - Non-standard installation paths for Exchange Server can cause false positives.
    Ensure that all legitimate installation'
  mitigation: Review investigation guide for details
