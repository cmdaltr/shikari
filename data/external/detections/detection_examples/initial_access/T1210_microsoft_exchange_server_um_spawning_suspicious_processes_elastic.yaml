technique_id: T1210
technique_name: Microsoft Exchange Server UM Spawning Suspicious Processes
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : (\"UMService.exe\", \"UMWorkerProcess.exe\") and\n    not\
  \ process.executable : (\n          \"?:\\\\Windows\\\\System32\\\\werfault.exe\"\
  ,\n          \"?:\\\\Windows\\\\System32\\\\wermgr.exe\",\n          \"?:\\\\Program\
  \ Files\\\\Microsoft\\\\Exchange Server\\\\V??\\\\Bin\\\\UMWorkerProcess.exe\",\n\
  \          \"?:\\\\Program Files\\\\Microsoft\\\\Exchange Server\\\\Bin\\\\UMWorkerProcess.exe\"\
  ,\n          \"D:\\\\Exchange 2016\\\\Bin\\\\UMWorkerProcess.exe\",\n          \"\
  E:\\\\ExchangeServer\\\\Bin\\\\UMWorkerProcess.exe\",\n          \"D:\\\\Exchange\\\
  \\Bin\\\\UMWorkerProcess.exe\",\n          \"D:\\\\Exchange Server\\\\Bin\\\\UMWorkerProcess.exe\"\
  ,\n          \"E:\\\\Exchange Server\\\\V15\\\\Bin\\\\UMWorkerProcess.exe\",\n\n\
  \          /* Crowdstrike specific exclusion as it uses NT Object paths */\n   \
  \       \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\werfault.exe\"\
  ,\n          \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\wermgr.exe\"\
  ,\n          \"\\\\Device\\\\HarddiskVolume*\\\\Program Files\\\\Microsoft\\\\Exchange\
  \ Server\\\\V??\\\\Bin\\\\UMWorkerProcess.exe\",\n          \"\\\\Device\\\\HarddiskVolume*\\\
  \\Program Files\\\\Microsoft\\\\Exchange Server\\\\Bin\\\\UMWorkerProcess.exe\"\
  ,\n          \"\\\\Device\\\\HarddiskVolume*\\\\Exchange 2016\\\\Bin\\\\UMWorkerProcess.exe\"\
  ,\n          \"\\\\Device\\\\HarddiskVolume*\\\\ExchangeServer\\\\Bin\\\\UMWorkerProcess.exe\"\
  ,\n          \"\\\\Device\\\\HarddiskVolume*\\\\Exchange\\\\Bin\\\\UMWorkerProcess.exe\"\
  ,\n          \"\\\\Device\\\\HarddiskVolume*\\\\Exchange Server\\\\Bin\\\\UMWorkerProcess.exe\"\
  ,\n          \"\\\\Device\\\\HarddiskVolume*\\\\Exchange Server\\\\V15\\\\Bin\\\\\
  UMWorkerProcess.exe\"\n    )"
explanation: 'Identifies suspicious processes being spawned by the Microsoft Exchange
  Server Unified Messaging (UM) service. This

  activity has been observed exploiting CVE-2021-26857.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/483c4daf-b0c6-49e0-adf3-0bfa93231d6b.toml
query_type: eql
query_language: eql
