false_positives:
- description: 'False positive analysis


    - Users frequently download legitimate RDP files from trusted sources like corporate
    emails or internal portals. To manage this, create exceptions for known safe domains
    or email addresses in your security tools.

    - Temporary directories often store RDP files during legitimate software installations
    or updates. Monitor these activities and whitelist specific processes or software
    that are known to use RDP files during their operations.

    - Employees working remotely may use'
  mitigation: Review investigation guide for details
references:
- https://www.microsoft.com/en-us/security/blog/2024/10/29/midnight-blizzard-conducts-large-scale-spear-phishing-campaign-using-rdp-files/
