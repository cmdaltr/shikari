technique_id: T1136.001
technique_name: Detect New Local Admin account
tactic: initial_access
platform: Splunk
fidelity_score: 0.95
validated: true
query: "`wineventlog_security`\n(\n  EventCode=4720 \n  OR\n  (\n    EventCode=4732\n\
  \    AND\n    (\n      Group_Name=Administrators\n      OR\n      TargetUserName=Administrators\n\
  \    )\n  )\n)\n| transaction user dest connected=false maxspan=180m\n| stats count\
  \ min(_time) as firstTime \n              max(_time) as lastTime \n            \
  \  dc(EventCode) as distinct_eventcodes \n  by src_user user dest\n| where distinct_eventcodes\
  \ > 1\n| `security_content_ctime(firstTime)`\n| `security_content_ctime(lastTime)`\n\
  | `detect_new_local_admin_account_filter`"
explanation: The following analytic detects the creation of new accounts elevated
  to local administrators. It uses Windows event logs, specifically EventCode 4720
  (user account creation) and EventCode 4732 (user added to Administrators group).
  This activity is significant as it indicates potential unauthorized privilege escalation,
  which is critical for SOC monitoring. If confirmed malicious, this could allow attackers
  to gain administrative access, leading to unauthorized data access, system modifications,
  and disruption of services. Immediate investigation is required to mitigate risks
  and prevent further unauthorized actions.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/b25f6f62-0712-43c1-b203-083231ffd97d/
indicators:
- type: data_source
  value: Windows Event Log Security 4732
  confidence: high
- type: data_source
  value: Windows Event Log Security 4720
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: The activity may be legitimate. For this reason, it's best to verify
    the account with an administrator and ask whether there was a valid service request
    for the account creation. If your local administrator group name is not "Administrators",
    this search may generate an excessive number of false positives
  mitigation: Review context and user activity
