technique_id: T1190
technique_name: RPC (Remote Procedure Call) to the Internet
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "(event.dataset: network_traffic.flow or (event.category: (network or network_traffic)))\
  \ and\n  network.transport:tcp and (destination.port:135 or event.dataset:zeek.dce_rpc)\
  \ and\n  source.ip:(\n    10.0.0.0/8 or\n    172.16.0.0/12 or\n    192.168.0.0/16\n\
  \  ) and\n  not destination.ip:(\n    10.0.0.0/8 or\n    127.0.0.0/8 or\n    169.254.0.0/16\
  \ or\n    172.16.0.0/12 or\n    192.0.0.0/24 or\n    192.0.0.0/29 or\n    192.0.0.8/32\
  \ or\n    192.0.0.9/32 or\n    192.0.0.10/32 or\n    192.0.0.170/32 or\n    192.0.0.171/32\
  \ or\n    192.0.2.0/24 or\n    192.31.196.0/24 or\n    192.52.193.0/24 or\n    192.168.0.0/16\
  \ or\n    192.88.99.0/24 or\n    224.0.0.0/4 or\n    100.64.0.0/10 or\n    192.175.48.0/24\
  \ or\n    198.18.0.0/15 or\n    198.51.100.0/24 or\n    203.0.113.0/24 or\n    240.0.0.0/4\
  \ or\n    \"::1\" or\n    \"FE80::/10\" or\n    \"FF00::/8\"\n  )"
explanation: 'This rule detects network events that may indicate the use of RPC traffic
  to the Internet. RPC is commonly used by

  system administrators to remotely control a system for maintenance or to use shared
  resources. It should almost never be

  directly exposed to the Internet, as it is frequently targeted and exploited by
  threat actors as an initial access or

  backdoor vector.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/32923416-763a-4531-bb35-f33b9232ecdb.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PAN-OS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Internal testing environments may generate RPC traffic to external IPs for legitimate
    purposes. Identify and document these environments, then create exceptions in
    the detection rule to prevent unnecessary alerts.

    - Cloud-based services or applications that require RPC communication for integration
    or management might trigger false positives. Review these services and whitelist
    their IP addresses if they are verified as non-threatening.

    - VPN or remote access solutions'
  mitigation: Review investigation guide for details
references:
- https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry.xhtml
has_investigation_guide: true
risk_score: 73
