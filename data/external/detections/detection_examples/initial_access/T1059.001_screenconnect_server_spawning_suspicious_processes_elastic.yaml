false_positives:
- description: 'False positive analysis


    - Legitimate administrative tasks using command shells or scripting tools like
    cmd.exe or powershell.exe may trigger the rule. To manage this, create exceptions
    for known administrative scripts or tasks that are regularly executed by trusted
    users.

    - Automated maintenance scripts that utilize ScreenConnect for legitimate purposes
    can be mistaken for suspicious activity. Identify these scripts and whitelist
    their execution paths or specific process names to prevent false'
  mitigation: Review investigation guide for details
references:
- https://blackpointcyber.com/resources/blog/breaking-through-the-screen/
has_investigation_guide: true
risk_score: 73
