technique_id: T1059.001
technique_name: ScreenConnect Server Spawning Suspicious Processes
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : \"ScreenConnect.Service.exe\" and\n  (process.name : (\"\
  cmd.exe\", \"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\", \"csc.exe\"\
  ) or\n  ?process.pe.original_file_name in (\"Cmd.Exe\", \"PowerShell.EXE\", \"pwsh.dll\"\
  , \"powershell_ise.EXE\"))"
explanation: 'Identifies suspicious processes being spawned by the ScreenConnect server
  process (ScreenConnect.Service.exe). This

  activity may indicate exploitation activity or access to an existing web shell backdoor.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3d00feab-e203-4acc-a463-c3e15b7e9a73.toml
query_type: eql
query_language: eql
