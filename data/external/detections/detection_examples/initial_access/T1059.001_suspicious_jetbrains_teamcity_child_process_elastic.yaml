false_positives:
- description: 'False positive analysis


    - Legitimate build scripts may invoke command-line utilities like cmd.exe or powershell.exe.
    To handle these, create exceptions for specific scripts by matching known safe
    arguments or paths.

    - Automated tasks or maintenance scripts might use network utilities such as ping.exe
    or netstat.exe. Exclude these by identifying and allowing specific scheduled tasks
    or maintenance windows.

    - System monitoring tools could trigger processes like tasklist.exe or systeminfo.exe.
    Whi'
