technique_id: T1059.001
technique_name: Suspicious JetBrains TeamCity Child Process
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.executable :\n                 (\"?:\\\\TeamCity\\\\jre\\\\bin\\\
  \\java.exe\",\n                  \"?:\\\\Program Files\\\\TeamCity\\\\jre\\\\bin\\\
  \\java.exe\",\n                  \"?:\\\\Program Files (x86)\\\\TeamCity\\\\jre\\\
  \\bin\\\\java.exe\",\n                  \"?:\\\\TeamCity\\\\BuildAgent\\\\jre\\\\\
  bin\\\\java.exe\") and\n  process.name : (\"cmd.exe\", \"powershell.exe\", \"msiexec.exe\"\
  , \"certutil.exe\", \"bitsadmin.exe\", \"wmic.exe\", \"curl.exe\", \"ssh.exe\",\n\
  \                   \"rundll32.exe\", \"regsvr32.exe\", \"mshta.exe\", \"certreq.exe\"\
  , \"net.exe\", \"nltest.exe\", \"whoami.exe\", \"hostname.exe\",\n             \
  \      \"tasklist.exe\", \"arp.exe\", \"nbtstat.exe\", \"netstat.exe\", \"reg.exe\"\
  , \"tasklist.exe\", \"Microsoft.Workflow.Compiler.exe\",\n                   \"\
  arp.exe\", \"atbroker.exe\", \"bginfo.exe\", \"bitsadmin.exe\", \"cdb.exe\", \"\
  cmstp.exe\", \"control.exe\", \"cscript.exe\", \"csi.exe\",\n                  \
  \ \"dnx.exe\", \"dsget.exe\", \"dsquery.exe\", \"forfiles.exe\", \"fsi.exe\", \"\
  ftp.exe\", \"gpresult.exe\", \"ieexec.exe\", \"iexpress.exe\",\n               \
  \    \"installutil.exe\", \"ipconfig.exe\",\"msxsl.exe\", \"netsh.exe\", \"odbcconf.exe\"\
  , \"ping.exe\", \"pwsh.exe\", \"qprocess.exe\",\n                   \"quser.exe\"\
  , \"qwinsta.exe\", \"rcsi.exe\", \"regasm.exe\", \"regsvcs.exe\", \"regsvr32.exe\"\
  , \"sc.exe\", \"schtasks.exe\",\n                   \"systeminfo.exe\", \"tracert.exe\"\
  , \"wmic.exe\", \"wscript.exe\",\"xwizard.exe\", \"explorer.exe\", \"msdt.exe\"\
  ) and\n not (process.name : \"powershell.exe\" and process.args : \"-ExecutionPolicy\"\
  \ and process.args : \"?:\\\\TeamCity\\\\buildAgent\\\\work\\\\*.ps1\") and\n not\
  \ (process.name : \"cmd.exe\" and process.args : \"dir\" and process.args : \"/-c\"\
  )"
explanation: 'Identifies suspicious processes being spawned by the JetBrain TeamCity
  process. This activity could be related to

  JetBrains remote code execution vulnerabilities.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/730ed57d-ae0f-444f-af50-78708b57edd5.toml
