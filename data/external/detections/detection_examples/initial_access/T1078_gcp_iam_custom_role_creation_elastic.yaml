technique_id: T1078
technique_name: GCP IAM Custom Role Creation
tactic: initial_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:gcp.audit and event.action:google.iam.admin.v*.CreateRole and
  event.outcome:success
explanation: 'Identifies an Identity and Access Management (IAM) custom role creation
  in Google Cloud Platform (GCP). Custom roles are

  user-defined, and allow for the bundling of one or more supported permissions to
  meet specific needs. Custom roles will

  not be updated automatically and could lead to privilege creep if not carefully
  scrutinized.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/aa8007f0-d1df-49ef-8520-407857594827.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: GCP
  confidence: high
- type: data_source
  value: Google Cloud Platform
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative actions by authorized personnel can trigger alerts. Regularly
    review and document legitimate role creation activities to establish a baseline
    of expected behavior.

    - Automated processes or scripts that create roles as part of deployment pipelines
    may cause false positives. Identify and whitelist these processes to prevent unnecessary
    alerts.

    - Temporary roles created for short-term projects or testing purposes might be
    flagged. Implement a naming'
  mitigation: Review investigation guide for details
references:
- https://cloud.google.com/iam/docs/understanding-custom-roles
has_investigation_guide: true
risk_score: 47
