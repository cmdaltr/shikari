technique_id: T1078
technique_name: Microsoft Entra ID User Reported Suspicious Activity
tactic: initial_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset: \"azure.auditlogs\"\n    and azure.auditlogs.operation_name:\
  \ \"Suspicious activity reported\"\n    and azure.auditlogs.properties.additional_details.key:\
  \ \"AuthenticationMethod\"\n    and azure.auditlogs.properties.target_resources.*.type:\
  \ \"User\"\n    and event.outcome: \"success\""
explanation: Identifies suspicious activity reported by users in Microsoft Entra ID
  where users have reported suspicious activity related to their accounts, which may
  indicate potential compromise or unauthorized access attempts. Reported suspicious
  activity typically occurs during the authentication process and may involve various
  authentication methods, such as password resets, account recovery, or multi-factor
  authentication challenges. Adversaries may attempt to exploit user accounts by leveraging
  social engineering techniques or other methods to gain unauthorized access to sensitive
  information or resources.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/caaa8b78-367c-11f0-beb8-f661ea17fbcd.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Microsoft Entra ID
  confidence: high
- type: data_source
  value: Microsoft Entra ID Audit Logs
  confidence: high
false_positives:
- description: 'False positive analysis


    - Users unfamiliar with MFA push notifications may mistakenly report legitimate
    sign-in attempts.

    - Shared accounts or device switching can also trigger unintended notifications.

    - Legitimate travel or network changes might confuse users into thinking activity
    was malicious.


    ### Response and remediation


    - Contact the user to validate the suspicious activity report and assess whether
    they were targeted or tricked by a malicious actor.

    - If the report is confirmed to be'
  mitigation: Review investigation guide for details
references:
- https://chris-brumm.medium.com/microsoft-entra-mfa-fraud-deep-dive-7764fd8f76ad
- https://janbakker.tech/report-suspicious-activity-fraud-alert-for-azure-mfa/
has_investigation_guide: true
risk_score: 47
