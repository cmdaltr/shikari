technique_id: T1566.002
technique_name: Suspicious HTML File Creation
tactic: initial_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by user.id with maxspan=2m\n\n [file where host.os.type == \"windows\"\
  \ and event.action in (\"creation\", \"rename\") and\n\n  /* Check for HTML files\
  \ with high entropy and size */\n  file.extension : (\"htm\", \"html\") and ((file.Ext.entropy\
  \ >= 5 and file.size >= 150000) or file.size >= 1000000) and\n\n  /* Check for file\
  \ paths in common download and temporary directories */\n  file.path : (\n    \"\
  ?:\\\\Users\\\\*\\\\Downloads\\\\*\",\n    \"?:\\\\Users\\\\*\\\\Content.Outlook\\\
  \\*\",\n    \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\Temp?_*\",\n    \"\
  ?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\7z*\",\n    \"?:\\\\Users\\\\*\\\
  \\AppData\\\\Local\\\\Temp\\\\Rar$*\")]\n [process where host.os.type == \"windows\"\
  \ and event.action == \"start\" and\n  (\n   /* Check for browser processes opening\
  \ HTML files with single argument */\n   (process.name in (\"chrome.exe\", \"msedge.exe\"\
  , \"brave.exe\", \"whale.exe\", \"browser.exe\", \"dragon.exe\", \"vivaldi.exe\"\
  , \"opera.exe\")\n    and process.args == \"--single-argument\") or\n\n   /* Optionally,\
  \ check for browser processes opening HTML files with two arguments */\n   (process.name\
  \ == \"iexplore.exe\" and process.args_count == 2) or\n\n   /* Optionally, check\
  \ for browser processes opening HTML files with URL argument */\n   (process.name\
  \ in (\"firefox.exe\", \"waterfox.exe\") and process.args == \"-url\")\n  )\n  /*\
  \ Check for file paths in common download and temporary directories targeted in\
  \ the process arguments */\n  and process.args : (\"?:\\\\Users\\\\*\\\\Downloads\\\
  \\*.htm*\",\n                      \"?:\\\\Users\\\\*\\\\Content.Outlook\\\\*.htm*\"\
  ,\n                      \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\Temp?_*.htm*\"\
  ,\n                      \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\7z*.htm*\"\
  ,\n                      \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\Rar$*.htm*\"\
  )]"
explanation: 'Identifies the execution of a browser process to open an HTML file with
  high entropy and size. Adversaries may smuggle

  data and files past content filters by hiding malicious payloads inside of seemingly
  benign HTML files.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f0493cb4-9b15-43a9-9359-68c23a7f2cf3.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate large HTML files downloaded from trusted sources may trigger the
    rule. Users can create exceptions for specific trusted domains or file hashes
    to prevent these from being flagged.

    - HTML files generated by certain applications or services, such as email clients
    or document converters, might have high entropy due to embedded data. Identify
    these applications and exclude their file creation paths from monitoring.

    - Temporary HTML files created during software'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
