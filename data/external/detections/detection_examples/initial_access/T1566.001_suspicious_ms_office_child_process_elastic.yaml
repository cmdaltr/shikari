technique_id: T1566.001
technique_name: Suspicious MS Office Child Process
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : (\n      \"eqnedt32.exe\", \"excel.exe\", \"fltldr.exe\"\
  , \"msaccess.exe\",\n      \"mspub.exe\", \"powerpnt.exe\", \"winword.exe\", \"\
  outlook.exe\"\n  ) and\n  process.name : (\n      \"Microsoft.Workflow.Compiler.exe\"\
  , \"arp.exe\", \"atbroker.exe\", \"bginfo.exe\", \"bitsadmin.exe\", \"cdb.exe\"\
  ,\n      \"certutil.exe\", \"cmd.exe\", \"cmstp.exe\", \"control.exe\", \"cscript.exe\"\
  , \"csi.exe\", \"dnx.exe\", \"dsget.exe\",\n      \"dsquery.exe\", \"forfiles.exe\"\
  , \"fsi.exe\", \"ftp.exe\", \"gpresult.exe\", \"hostname.exe\", \"ieexec.exe\",\
  \ \"iexpress.exe\",\n      \"installutil.exe\", \"ipconfig.exe\", \"mshta.exe\"\
  , \"msxsl.exe\", \"nbtstat.exe\", \"net.exe\", \"net1.exe\", \"netsh.exe\",\n  \
  \    \"netstat.exe\", \"nltest.exe\", \"odbcconf.exe\", \"ping.exe\", \"powershell.exe\"\
  , \"pwsh.exe\", \"qprocess.exe\",\n      \"quser.exe\", \"qwinsta.exe\", \"rcsi.exe\"\
  , \"reg.exe\", \"regasm.exe\", \"regsvcs.exe\", \"regsvr32.exe\", \"sc.exe\",\n\
  \      \"schtasks.exe\", \"systeminfo.exe\", \"tasklist.exe\", \"tracert.exe\",\
  \ \"whoami.exe\", \"wmic.exe\", \"wscript.exe\",\n      \"xwizard.exe\", \"explorer.exe\"\
  , \"rundll32.exe\", \"hh.exe\", \"msdt.exe\"\n  ) and\n  not (\n    process.parent.name\
  \ : \"outlook.exe\" and\n    process.name : \"rundll32.exe\" and\n    process.args\
  \ : \"shell32.dll,Control_RunDLL\" and\n    process.args : \"srchadmin.dll\"\n \
  \ )"
explanation: 'Identifies suspicious child processes of frequently targeted Microsoft
  Office applications (Word, PowerPoint, Excel).

  These child processes are often launched during exploitation of Office applications
  or from documents with malicious

  macros.'
source: Elastic Detection Rules
