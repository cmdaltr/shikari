technique_id: T1190
technique_name: Zoom Meeting with no Passcode
tactic: initial_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.type:creation and event.module:zoom and event.dataset:zoom.webhook and\n\
  \  event.action:meeting.created and not zoom.meeting.password:*"
explanation: 'This rule identifies Zoom meetings that are created without a passcode.
  Meetings without a passcode are susceptible to

  Zoombombing. Zoombombing is carried out by taking advantage of Zoom sessions that
  are not protected with a passcode.

  Zoombombing refers to the unwanted, disruptive intrusion, generally by Internet
  trolls and hackers, into a video

  conference call. In a typical Zoombombing incident, a teleconferencing session is
  hijacked by the insertion of material

  that is lewd, obscene, racist, or antisemitic in nature, typically resulting of
  the shutdown of the session.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/58ac2aa5-6718-427c-a845-5f3ac5af00ba.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Zoom
  confidence: high
false_positives:
- description: 'False positive analysis


    - Internal team meetings may be scheduled without a passcode for convenience,
    especially if all participants are within a secure network. To handle this, create
    exceptions for meetings initiated by trusted internal users or within specific
    IP ranges.

    - Recurring meetings with a consistent group of participants might not use passcodes
    to simplify access. Consider excluding these meetings by identifying and whitelisting
    their unique meeting IDs.

    - Training sessions or webi'
  mitigation: Review investigation guide for details
references:
- https://blog.zoom.us/a-message-to-our-users/
- https://www.fbi.gov/contact-us/field-offices/boston/news/press-releases/fbi-warns-of-teleconferencing-and-online-classroom-hijacking-during-covid-19-pandemic
has_investigation_guide: true
risk_score: 47
