technique_id: T1078
technique_name: AWS Management Console Root Login
tactic: initial_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset:aws.cloudtrail and\nevent.provider:signin.amazonaws.com and\
  \ \nevent.action:ConsoleLogin and \naws.cloudtrail.user_identity.type:Root and \n\
  event.outcome:success"
explanation: Identifies a successful login to the AWS Management Console by the Root
  user.
source: Elastic Detection Rules
