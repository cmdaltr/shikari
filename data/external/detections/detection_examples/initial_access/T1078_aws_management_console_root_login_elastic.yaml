  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS Sign-In
  confidence: high
false_positives:
- description: "False positive analysis\n\n- **Planned administrative actions.** \
    \ \n  Some rare maintenance tasks require root credentials (for example, payment\
    \ method updates). If the login aligns with documented change control and was\
    \ performed using MFA by the approved owner, the alert can be closed as benign.\n\
    - **Third-party managed account scenarios.**  \n  Managed service providers may\
    \ log in as root during onboarding or support activities. Confirm via ticketing\
    \ or contractual documentation.\n\n### Response and"
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
