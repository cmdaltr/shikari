technique_id: T1190
technique_name: Potential VIEWSTATE RCE Attempt on SharePoint/IIS
tactic: initial_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: "data_stream.dataset : \"network_traffic.http\" and\n    network.direction:\
  \ \"ingress\" and\n    http.request.method: \"POST\" and\n    http.request.referrer:\
  \ *SignOut.aspx and\n    http.request.body.content: *__VIEWSTATE=* and\n    http.request.body.bytes\
  \ >= 500 and\n    http.response.headers.server: Microsoft-IIS*"
explanation: 'Detects potential remote code execution (RCE) attempts targeting IIS
  web servers running SharePoint via malicious

  VIEWSTATE payloads in HTTP POST requests. Attackers may exploit insecure deserialization
  in the VIEWSTATE parameter to

  execute arbitrary code. This rule identifies suspicious requests containing VIEWSTATE
  data and other indicators of

  exploitation, specifically those associated with the Toolshell exploit chain. Toolshell
  leverages vulnerabilities

  (CVE-2025-53770 and CVE-2025-53771) for initial access, enabling adversaries to
  deploy a webshell, steal machine keys,

  sign VIEWSTATE payloads offline, and subsequently send signed payloads to the server
  to achieve code execution.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/99c9af5a-67cf-11f0-b69e-f661ea17fbcd.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Network Traffic
  confidence: high
- type: data_source
  value: Network Traffic HTTP Logs
  confidence: high
references:
- https://research.eye.security/sharepoint-under-siege/
