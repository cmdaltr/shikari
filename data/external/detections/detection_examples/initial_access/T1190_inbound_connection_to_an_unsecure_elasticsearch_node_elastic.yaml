technique_id: T1190
technique_name: Inbound Connection to an Unsecure Elasticsearch Node
tactic: initial_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "(event.dataset: network_traffic.http OR (event.category: network_traffic AND\
  \ network.protocol: http)) AND\n    status:OK AND destination.port:9200 AND network.direction:inbound\
  \ AND NOT http.response.headers.content-type:\"image/x-icon\" AND NOT\n    _exists_:http.request.headers.authorization"
explanation: 'Identifies Elasticsearch nodes that do not have Transport Layer Security
  (TLS), and/or lack authentication, and are

  accepting inbound network connections over the default Elasticsearch port.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/31295df3-277b-4c56-a1fb-84e31b4222a9.toml
query_type: query
query_language: lucene
false_positives:
- description: 'False positive analysis


    - Internal monitoring tools or scripts that regularly check Elasticsearch node
    status without authentication can trigger false positives. Exclude these specific
    IP addresses or user agents from the rule to reduce noise.

    - Automated backup systems that interact with Elasticsearch nodes without using
    authentication headers might be flagged. Identify these systems and create exceptions
    based on their IP addresses or network segments.

    - Development or testing environments wh'
  mitigation: Review investigation guide for details
references:
- https://www.elastic.co/guide/en/elasticsearch/reference/current/configuring-security.html
- https://www.elastic.co/guide/en/beats/packetbeat/current/packetbeat-http-options.html#_send_all_headers
has_investigation_guide: true
risk_score: 47
