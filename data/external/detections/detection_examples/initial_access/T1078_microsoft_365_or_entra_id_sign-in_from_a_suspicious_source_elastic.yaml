technique_id: T1078
technique_name: Microsoft 365 or Entra ID Sign-in from a Suspicious Source
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "from logs-o365.audit-*, logs-azure.signinlogs-*, .alerts-security.*\n// query\
  \ runs every 1 hour looking for activities occurred during last 8 hours to match\
  \ on disparate events\n| where @timestamp > now() - 8 hours\n// filter for azure\
  \ or m365 sign-in and external alerts with source.ip not null\n| where to_ip(source.ip)\
  \ is not null\n  and (event.dataset in (\"o365.audit\", \"azure.signinlogs\") or\
  \ kibana.alert.rule.name == \"External Alerts\")\n  and not cidr_match(\n    to_ip(source.ip),\n\
  \    \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \"\
  192.0.0.0/24\", \"192.0.0.0/29\",\n    \"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\"\
  , \"192.0.0.170/32\", \"192.0.0.171/32\", \"192.0.2.0/24\",\n    \"192.31.196.0/24\"\
  , \"192.52.193.0/24\", \"192.168.0.0/16\", \"192.88.99.0/24\", \"224.0.0.0/4\",\n\
  \    \"100.64.0.0/10\", \"192.175.48.0/24\", \"198.18.0.0/15\", \"198.51.100.0/24\"\
  , \"203.0.113.0/24\",\n    \"240.0.0.0/4\", \"::1\", \"FE80::/10\", \"FF00::/8\"\
  \n  )\n\n// capture relevant raw fields\n| keep source.ip, event.action, event.outcome,\
  \ event.dataset, kibana.alert.rule.name, event.category\n\n// classify each source\
  \ ip based on alert type\n| eval\n  Esql.source_ip_mail_access_case = case(event.dataset\
  \ == \"o365.audit\" and event.action == \"MailItemsAccessed\" and event.outcome\
  \ == \"success\", to_ip(source.ip), null),\n  Esql.source_ip_azure_signin_case =\
  \ case(event.dataset == \"azure.signinlogs\" and event.outcome == \"success\", to_ip(source.ip),\
  \ null),\n  Esql.source_ip_network_alert_case = case(kibana.alert.rule.name == \"\
  external alerts\" and not event.dataset in (\"o365.audit\", \"azure.signinlogs\"\
  ), to_ip(source.ip), null)\n\n// aggregate by source ip\n| stats\n    Esql.event_count\
  \ = count(*),\n    Esql.source_ip_mail_access_case_count_distinct = count_distinct(Esql.source_ip_mail_access_case),\n\
  \    Esql.source_ip_azure_signin_case_count_distinct = count_distinct(Esql.source_ip_azure_signin_case),\n\
  \    Esql.source_ip_network_alert_case_count_distinct = count_distinct(Esql.source_ip_network_alert_case),\n\
  \    Esql.event_dataset_count_distinct = count_distinct(event.dataset),\n    Esql.event_dataset_values\
  \ = values(event.dataset),\n    Esql.kibana_alert_rule_name_values = values(kibana.alert.rule.name),\n\
  \    Esql.event_category_values = values(event.category)\n  by Esql.source_ip =\
  \ to_ip(source.ip)\n\n// correlation condition\n| where\n  Esql.source_ip_network_alert_case_count_distinct\
  \ > 0\n  and Esql.event_dataset_count_distinct >= 2\n  and (Esql.source_ip_mail_access_case_count_distinct\
  \ > 0 or Esql.source_ip_azure_signin_case_count_distinct > 0)\n  and Esql.event_count\
  \ <= 100"
explanation: 'This rule correlate Azure or Office 356 mail successful sign-in events
  with network security alerts by source.ip.

  Adversaries may trigger some network security alerts such as reputation or other
  anomalies before accessing cloud

  resources.'
