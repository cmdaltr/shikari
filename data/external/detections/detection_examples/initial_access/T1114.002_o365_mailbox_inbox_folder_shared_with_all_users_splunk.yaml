technique_id: T1114.002
technique_name: O365 Mailbox Inbox Folder Shared with All Users
tactic: initial_access
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Operation=ModifyFolderPermissions Workload=Exchange
  object=Inbox Item.ParentFolder.MemberUpn=Everyone | eval isReadRole=if(match(''Item.ParentFolder.MemberRights'',"(ReadAny)"),
  "true", "false") | search isReadRole = "true" | rename UserId as user | fillnull
  | stats count earliest(_time) as firstTime latest(_time) as lastTime by signature,
  user, dest, vendor_account, vendor_product, object, MailboxOwnerUPN, Item.ParentFolder.MemberUpn,
  Item.ParentFolder.MemberRights, src | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `o365_mailbox_inbox_folder_shared_with_all_users_filter`'
explanation: The following analytic detects instances where the inbox folder of an
  Office 365 mailbox is shared with all users within the tenant. It leverages Office
  365 management activity events to identify when the 'Inbox' folder permissions are
  modified to include 'Everyone' with read rights. This activity is significant as
  it represents a potential security risk, allowing unauthorized access to sensitive
  emails. If confirmed malicious, this could lead to data breaches, exfiltration of
  confidential information, and further compromise through spear-phishing or other
  malicious activities based on the accessed email content.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/21421896-a692-4594-9888-5faeb8a53106/
indicators:
- type: data_source
  value: O365 ModifyFolderPermissions
  confidence: high
- type: risk_user
  value: MailboxOwnerUPN
  confidence: high
false_positives:
- description: Administrators might temporarily share a mailbox with all users for
    legitimate reasons, such as troubleshooting, migrations, or other administrative
    tasks. Some organizations use shared mailboxes for teams or departments where
    multiple users need access to the same mailbox. Filter as needed.
  mitigation: Review context and user activity
