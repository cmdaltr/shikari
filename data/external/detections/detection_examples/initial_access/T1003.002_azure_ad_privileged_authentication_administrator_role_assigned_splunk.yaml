- type: data_source
  value: Azure Active Directory Add member to role
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_user
  value: initiatedBy
  confidence: high
false_positives:
- description: Administrators may legitimately assign the Privileged Authentication
    Administrator role as part of administrative tasks. Filter as needed.
  mitigation: Review context and user activity
