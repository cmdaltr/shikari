technique_id: T1078.004
technique_name: Microsoft Entra ID Suspicious Session Reuse to Graph Access
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "from logs-azure.signinlogs-*, logs-azure.graphactivitylogs-* metadata _id,\
  \ _version, _index\n| where\n    (event.dataset == \"azure.signinlogs\"\n     and\
  \ source.`as`.organization.name != \"MICROSOFT-CORP-MSN-AS-BLOCK\"\n     and azure.signinlogs.properties.session_id\
  \ is not null)\n    or\n    (event.dataset == \"azure.graphactivitylogs\"\n    \
  \ and source.`as`.organization.name != \"MICROSOFT-CORP-MSN-AS-BLOCK\"\n     and\
  \ azure.graphactivitylogs.properties.c_sid is not null)\n\n| eval\n    Esql.azure_signinlogs_properties_session_id_coalesce\
  \ = coalesce(azure.signinlogs.properties.session_id, azure.graphactivitylogs.properties.c_sid),\n\
  \    Esql.azure_signinlogs_properties_user_id_coalesce = coalesce(azure.signinlogs.properties.user_id,\
  \ azure.graphactivitylogs.properties.user_principal_object_id),\n    Esql.azure_signinlogs_properties_app_id_coalesce\
  \ = coalesce(azure.signinlogs.properties.app_id, azure.graphactivitylogs.properties.app_id),\n\
  \    Esql.source_ip = source.ip,\n    Esql.@timestamp = @timestamp,\n    Esql.event_type_case\
  \ = case(\n        event.dataset == \"azure.signinlogs\", \"signin\",\n        event.dataset\
  \ == \"azure.graphactivitylogs\", \"graph\",\n        \"other\"\n    )\n\n| where\
  \ Esql.azure_signinlogs_properties_app_id_coalesce not in (\n    \"4354e225-50c9-4423-9ece-2d5afd904870\"\
  ,  // Augmentation Loop\n    \"cc15fd57-2c6c-4117-a88c-83b1d56b4bbe\",  // Microsoft\
  \ Teams Services\n    \"ecd6b820-32c2-49b6-98a6-444530e5a77a\",  // Microsoft Edge\
  \ [Community Contributed]\n    \"e8be65d6-d430-4289-a665-51bf2a194bda\",  // Microsoft\
  \ 365 App Catalog Services\n    \"ab9b8c07-8f02-4f72-87fa-80105867a763\",  // OneDrive\
  \ SyncEngine\n    \"394866fc-eedb-4f01-8536-3ff84b16be2a\",  // Microsoft People\
  \ Cards Service\n    \"66a88757-258c-4c72-893c-3e8bed4d6899\",  // Office 365 Search\
  \ Service\n    \"9ea1ad79-fdb6-4f9a-8bc3-2b70f96e34c7\",  // Bing\n    \"d7b530a4-7680-4c23-a8bf-c52c121d2e87\"\
  ,  // Microsoft Edge Enterprise New Tab Page [Community Contributed]\n    \"6f7e0f60-9401-4f5b-98e2-cf15bd5fd5e3\"\
  ,  // Microsoft Application Command Service [Community Contributed]\n    \"52c2e0b5-c7b6-4d11-a89c-21e42bcec444\"\
  ,  // Graph Files Manager\n    \"27922004-5251-4030-b22d-91ecd9a37ea4\",  // Outlook\
  \ Mobile\n    \"bb893c22-978d-4cd4-a6f7-bb6cc0d6e6ce\",  // Olympus [Community Contributed]\n\
  \    \"26a7ee05-5602-4d76-a7ba-eae8b7b67941\",  // Windows Search\n    \"66a88757-258c-4c72-893c-3e8bed4d6899\"\
  ,  // Office 365 Search Service\n    \"9ea1ad79-fdb6-4f9a-8bc3-2b70f96e34c7\", \
  \ // Bing\n    \"d7b530a4-7680-4c23-a8bf-c52c121d2e87\",  // Microsoft Edge Enterprise\
  \ New Tab Page [Community Contributed]\n    \"00000007-0000-0000-c000-000000000000\"\
  ,  // Dataverse\n    \"6bc3b958-689b-49f5-9006-36d165f30e00\",  // Teams CMD Services\
  \ Artifacts\n    \"0ec893e0-5785-4de6-99da-4ed124e5296c\",  // Office UWP PWA [Community\
  \ Contributed]\n    \"fc108d3f-543d-4374-bbff-c7c51f651fe5\",  // Zoom\n    \"01fc33a7-78ba-4d2f-a4b7-768e336e890e\"\
  \   // MS PIM\n    )\n\n| keep\n    Esql.azure_signinlogs_properties_session_id_coalesce,\n\
  \    Esql.source_ip,\n    Esql.@timestamp,\n    Esql.event_type_case,\n    Esql.azure_signinlogs_properties_user_id_coalesce,\n\
  \    Esql.azure_signinlogs_properties_app_id_coalesce,\n    source.`as`.organization.name,\n\
  \    user_agent.original,\n    url.original,\n    azure.graphactivitylogs.properties.scopes,\n\
  \    azure.signinlogs.properties.user_principal_name\n\n| stats\n    Esql.azure_signinlogs_properties_user_id_coalesce_values\
  \ = values(Esql.azure_signinlogs_properties_user_id_coalesce),\n    Esql.azure_signinlogs_properties_session_id_coalesce_values\
  \ = values(Esql.azure_signinlogs_properties_session_id_coalesce),\n    Esql_priv.azure_signinlogs_properties_user_principal_name_values\
  \ = values(azure.signinlogs.properties.user_principal_name),\n    Esql.source_ip_values\
  \ = values(Esql.source_ip),\n    Esql.source_ip_count_distinct = count_distinct(Esql.source_ip),\n\
  \    Esql.source_as_organization_name_values = values(source.`as`.organization.name),\n\
  \    Esql.user_agent_original_values = values(user_agent.original),\n    Esql.azure_signinlogs_properties_app_id_coalesce_values\
  \ = values(Esql.azure_signinlogs_properties_app_id_coalesce),\n    Esql.azure_signinlogs_properties_app_id_coalesce_count_distinct\
  \ = count_distinct(Esql.azure_signinlogs_properties_app_id_coalesce),\n    Esql.event_type_case_values\
  \ = values(Esql.event_type_case),\n    Esql.event_type_case_count_distinct = count_distinct(Esql.event_type_case),\n\
  \    Esql.signin_time_min = min(case(Esql.event_type_case == \"signin\", Esql.@timestamp,\
  \ null)),\n    Esql.graph_time_min = min(case(Esql.event_type_case == \"graph\"\
  , Esql.@timestamp, null)),\n    Esql.url_original_values = values(url.original),\n\
  \    Esql.azure_graphactivitylogs_properties_scopes_values = values(azure.graphactivitylogs.properties.scopes),\n\
  \    Esql.event_count = count()\n  by\n    Esql.azure_signinlogs_properties_session_id_coalesce,\n\
  \    Esql.azure_signinlogs_properties_app_id_coalesce,\n    Esql.azure_signinlogs_properties_user_id_coalesce\n\
  \n| eval\n    Esql.event_signin_to_graph_delay_minutes_date_diff = date_diff(\"\
  minutes\", Esql.signin_time_min, Esql.graph_time_min),\n    Esql.event_signin_to_graph_delay_days_date_diff\
  \ = date_diff(\"days\", Esql.signin_time_min, Esql.graph_time_min)\n\n| where\n\
  \    Esql.event_type_case_count_distinct > 1 and\n    Esql.source_ip_count_distinct\
  \ > 1 and\n    Esql.azure_signinlogs_properties_app_id_coalesce_count_distinct ==\
  \ 1 and\n    Esql.signin_time_min is not null and\n    Esql.graph_time_min is not\
  \ null and\n    Esql.event_signin_to_graph_delay_minutes_date_diff >= 0 and\n  \
  \  Esql.event_signin_to_graph_delay_days_date_diff == 0"
explanation: 'Identifies potential session hijacking or token replay in Microsoft
  Entra ID. This rule detects cases where a user signs

  in and subsequently accesses Microsoft Graph from a different IP address using the
  same session ID. This may indicate a

  successful OAuth phishing attack, session hijacking, or token replay attack, where
  an adversary has stolen a session

  cookie or refresh/access token and is impersonating the user from an alternate host
  or location.'
source: Elastic Detection Rules
