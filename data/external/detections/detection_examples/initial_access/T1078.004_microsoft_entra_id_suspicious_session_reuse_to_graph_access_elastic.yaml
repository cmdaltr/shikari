false_positives:
- description: 'False positive analysis

    - This pattern may occur during legitimate device switching or roaming between
    networks (e.g., corporate to mobile).

    - Developers or power users leveraging multiple environments may also trigger
    this detection if session persistence spans IP ranges. Still, this behavior is
    rare and warrants investigation when rapid IP switching and Graph access are involved.


    ### Response and remediation


    - If confirmed malicious, revoke all refresh/access tokens for the user principal.

    -'
