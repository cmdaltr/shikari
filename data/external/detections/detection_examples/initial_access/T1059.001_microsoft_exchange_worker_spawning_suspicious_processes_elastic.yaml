  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks may trigger the rule if administrators use command-line
    tools like cmd.exe or powershell.exe for legitimate maintenance. To manage this,
    create exceptions for known administrative accounts or specific IP addresses that
    regularly perform these tasks.

    - Scheduled tasks or scripts that run under the MSExchangeAppPool context might
    spawn command-line interpreters as part of their normal operation. Identify these
    tasks and exclude them by specif'
  mitigation: Review investigation guide for details
references:
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers
- https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities
- https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289
has_investigation_guide: true
