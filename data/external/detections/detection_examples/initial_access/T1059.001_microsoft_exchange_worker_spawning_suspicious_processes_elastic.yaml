technique_id: T1059.001
technique_name: Microsoft Exchange Worker Spawning Suspicious Processes
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : \"w3wp.exe\" and process.parent.args : \"MSExchange*AppPool\"\
  \ and\n  (\n    (process.name : (\"cmd.exe\", \"powershell.exe\", \"pwsh.exe\",\
  \ \"powershell_ise.exe\") or\n    ?process.pe.original_file_name in (\"Cmd.Exe\"\
  , \"PowerShell.EXE\", \"pwsh.dll\", \"powershell_ise.EXE\"))\n  )"
explanation: 'Identifies suspicious processes being spawned by the Microsoft Exchange
  Server worker process (w3wp). This activity may

  indicate exploitation activity or access to an existing web shell backdoor.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f81ee52c-297e-46d9-9205-07e66931df26.toml
query_type: eql
query_language: eql
