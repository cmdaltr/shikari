technique_id: T1105
technique_name: Suspicious Execution from INET Cache
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : (\"explorer.exe\", \"winrar.exe\", \"7zFM.exe\", \"Bandizip.exe\"\
  ) and\n  (\n    process.args : \"*\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\
  \\INetCache\\\\IE\\\\*\" or\n    process.executable : (\n      \"?:\\\\Users\\\\\
  *\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\\INetCache\\\\IE\\\\*\",\n\n   \
  \   /* Crowdstrike specific condition as it uses NT Object paths */\n      \"\\\\\
  Device\\\\HarddiskVolume*\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\
  \\INetCache\\\\IE\\\\*\"\n    )\n  ) and\n  not process.executable : (\n       \
  \ \"?:\\\\Program Files\\\\*.exe\",\n        \"?:\\\\Program Files (x86)\\\\*.exe\"\
  ,\n        \"?:\\\\Windows\\\\System32\\\\mspaint.exe\",\n        \"?:\\\\Windows\\\
  \\System32\\\\notepad.exe\",\n\n        /* Crowdstrike specific exclusion as it\
  \ uses NT Object paths */\n        \"\\\\Device\\\\HarddiskVolume*\\\\Program Files\\\
  \\*.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\Program Files (x86)\\\\*.exe\"\
  ,\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\mspaint.exe\"\
  ,\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\notepad.exe\"\
  \n  )"
explanation: 'Identifies the execution of a process with arguments pointing to the
  INetCache Folder. Adversaries may deliver malicious

  content via WININET during initial access.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/dca6b4b0-ae70-44eb-bb7a-ce6db502ee78.toml
