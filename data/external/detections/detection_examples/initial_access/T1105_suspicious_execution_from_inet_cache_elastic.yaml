false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may temporarily use the INetCache
    folder for storing executable files. Users can create exceptions for known update
    processes by identifying their specific executable paths and excluding them from
    the rule.

    - Some browser extensions or plugins might cache executable files in the INetCache
    folder during normal operations. Users should monitor and whitelist these extensions
    if they are verified as safe and frequently trigger a'
  mitigation: Review investigation guide for details
