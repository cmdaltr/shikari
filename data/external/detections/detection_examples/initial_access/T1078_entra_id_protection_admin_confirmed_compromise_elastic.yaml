technique_id: T1078
technique_name: Entra ID Protection Admin Confirmed Compromise
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset: azure.identity_protection and\n    azure.identityprotection.properties.risk_detail:\
  \ (\n        \"adminConfirmedSigninCompromised\" or\n        \"adminConfirmedUserCompromised\"\
  \n    )"
explanation: 'Identifies when an administrator has manually confirmed a user or sign-in
  as compromised in Microsoft Entra ID

  Protection. This indicates that an administrator has reviewed the risk detection
  and determined that the user account or

  sign-in activity is definitively compromised. This is a high-confidence indicator
  of account compromise and should be

  investigated immediately.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a1b2c3d4-e5f6-7890-a1b2-c3d4e5f67890.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Entra ID
  confidence: high
- type: data_source
  value: Entra ID Protection Logs
  confidence: high
false_positives:
- description: 'False positive analysis


    - Security testing or penetration testing exercises may result in administrators
    confirming test accounts as compromised. If this is expected behavior, consider
    excluding specific test accounts or implementing a testing account naming convention
    to filter.

    - Incident response drills or tabletop exercises may involve marking accounts
    as compromised for training purposes. Coordinate with security teams to identify
    planned exercises.


    ### Response and remediation


    - Immedia'
  mitigation: Review investigation guide for details
references:
- https://learn.microsoft.com/en-us/entra/id-protection/howto-identity-protection-investigate-risk
- https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-risks
- https://learn.microsoft.com/en-us/graph/api/resources/riskdetection
has_investigation_guide: true
risk_score: 99
