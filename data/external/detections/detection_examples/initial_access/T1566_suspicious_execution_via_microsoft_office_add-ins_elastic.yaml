technique_id: T1566
technique_name: Suspicious Execution via Microsoft Office Add-Ins
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where\n\n    host.os.type == \"windows\" and event.type == \"start\"\
  \ and\n\n    process.name : (\"WINWORD.EXE\", \"EXCEL.EXE\", \"POWERPNT.EXE\", \"\
  MSACCESS.EXE\", \"VSTOInstaller.exe\") and\n\n    process.args regex~ \"\"\".+\\\
  .(wll|xll|ppa|ppam|xla|xlam|vsto)\"\"\" and\n\n    /* Office Add-In from suspicious\
  \ paths */\n    (process.args :\n             (\"?:\\\\Users\\\\*\\\\Temp\\\\7z*\"\
  ,\n              \"?:\\\\Users\\\\*\\\\Temp\\\\Rar$*\",\n              \"?:\\\\\
  Users\\\\*\\\\Temp\\\\Temp?_*\",\n              \"?:\\\\Users\\\\*\\\\Temp\\\\BNZ.*\"\
  ,\n              \"?:\\\\Users\\\\*\\\\Downloads\\\\*\",\n              \"?:\\\\\
  Users\\\\*\\\\AppData\\\\Roaming\\\\*\",\n              \"?:\\\\Users\\\\Public\\\
  \\*\",\n              \"?:\\\\ProgramData\\\\*\",\n              \"?:\\\\Windows\\\
  \\Temp\\\\*\",\n              \"\\\\Device\\\\*\",\n              \"http*\") or\n\
  \n    process.parent.name : (\"explorer.exe\", \"OpenWith.exe\") or\n\n    /* Office\
  \ Add-In from suspicious parent */\n    process.parent.name : (\"cmd.exe\", \"powershell.exe\"\
  )) and\n\n    /* False Positives */\n    not (process.args : \"*.vsto\" and\n  \
  \       process.parent.executable :\n                   (\"?:\\\\Program Files\\\
  \\Logitech\\\\LogiOptions\\\\PlugInInstallerUtility*.exe\",\n                  \
  \  \"?:\\\\ProgramData\\\\Logishrd\\\\LogiOptions\\\\Plugins\\\\VSTO\\\\*\\\\VSTOInstaller.exe\"\
  ,\n                    \"?:\\\\Program Files\\\\Logitech\\\\LogiOptions\\\\PlugInInstallerUtility.exe\"\
  ,\n                    \"?:\\\\Program Files\\\\LogiOptionsPlus\\\\PlugInInstallerUtility*.exe\"\
  ,\n                    \"?:\\\\ProgramData\\\\Logishrd\\\\LogiOptionsPlus\\\\Plugins\\\
  \\VSTO\\\\*\\\\VSTOInstaller.exe\",\n                    \"?:\\\\Program Files\\\
  \\Common Files\\\\microsoft shared\\\\VSTO\\\\*\\\\VSTOInstaller.exe\")) and\n \
  \   not (process.args : \"/Uninstall\" and process.name : \"VSTOInstaller.exe\"\
  ) and\n    not (process.parent.name : \"rundll32.exe\" and\n         process.parent.args\
  \ : \"?:\\\\WINDOWS\\\\Installer\\\\MSI*.tmp,zzzzInvokeManagedCustomActionOutOfProc\"\
  ) and\n    not (process.name : \"VSTOInstaller.exe\" and process.args : \"https://dl.getsidekick.com/outlook/vsto/Sidekick.vsto\"\
  )"
explanation: 'Identifies execution of common Microsoft Office applications to launch
  an Office Add-In from a suspicious path or with

  an unusual parent process. This may indicate an attempt to get initial access via
  a malicious phishing MS Office Add-In.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ae8a142c-6a1d-4918-bea7-0b617e99ecfa.toml
query_type: eql
query_language: eql
