  value: Windows
  confidence: high
false_positives:
- description: 'false positives, focusing on genuine anomalies indicative of malicious
    intent.


    ### Possible investigation steps


    - Review the process name and arguments to confirm if the execution involves a
    Microsoft Office application launching an add-in from a suspicious path, as indicated
    by the process.name and process.args fields.

    - Check the parent process name to determine if the Office application was launched
    by an unusual or potentially malicious parent process, such as cmd.exe or powershell.exe,
    us'
  mitigation: Review investigation guide for details
