technique_id: T1078
technique_name: PingID Multiple Failed MFA Requests For User
tactic: initial_access
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`pingid` "result.status" IN ("FAILURE,authFail","UNSUCCESSFUL_ATTEMPT") |
  eval time = _time, src = coalesce(''resources{}.ipaddress'',''resources{}.devicemodel''),
  user = upper(''actors{}.name''), object = ''resources{}.devicemodel'', reason =
  ''result.message''| bucket span=10m _time | stats dc(_raw) AS mfa_prompts min(time)
  as firstTime, max(time) as lastTime values(src) as src by user, reason, _time |
  `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)` | where
  mfa_prompts >= 10 | `pingid_multiple_failed_mfa_requests_for_user_filter`'
explanation: The following analytic identifies multiple failed multi-factor authentication
  (MFA) requests for a single user within a PingID environment. It triggers when 10
  or more MFA prompts fail within 10 minutes, using JSON logs from PingID. This activity
  is significant as it may indicate an adversary attempting to bypass MFA by bombarding
  the user with repeated authentication requests. If confirmed malicious, this could
  lead to unauthorized access, as the user might eventually accept the fraudulent
  request, compromising the security of the account and potentially the entire network.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/c1bc706a-0025-4814-ad30-288f38865036/
indicators:
- type: data_source
  value: PingID
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: False positives may be generated by normal provisioning workflows for
    user device registration.
  mitigation: Review context and user activity
