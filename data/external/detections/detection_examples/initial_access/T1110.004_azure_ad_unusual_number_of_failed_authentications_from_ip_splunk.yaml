technique_id: T1110.004
technique_name: Azure AD Unusual Number of Failed Authentications From Ip
tactic: initial_access
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`azure_monitor_aad` category=SignInLogs properties.status.errorCode=50126
  properties.authenticationDetails{}.succeeded=false | rename properties.* as * |
  bucket span=5m _time | stats dc(userPrincipalName) AS unique_accounts values(userPrincipalName)
  as userPrincipalName values(dest) as dest  values(user) as user by _time, src, vendor_account,
  vendor_product | eventstats avg(unique_accounts) as ip_avg, stdev(unique_accounts)
  as ip_std by src | eval upperBound=(ip_avg+ip_std*3) | eval isOutlier=if(unique_accounts
  > 10 and unique_accounts >= upperBound, 1,0) | where isOutlier = 1 | `azure_ad_unusual_number_of_failed_authentications_from_ip_filter`'
explanation: The following analytic identifies a single source IP failing to authenticate
  with multiple valid users, potentially indicating a Password Spraying attack against
  an Azure Active Directory tenant. It uses Azure SignInLogs data and calculates the
  standard deviation for source IPs, applying the 3-sigma rule to detect unusual numbers
  of failed authentication attempts. This activity is significant as it may signal
  an adversary attempting to gain initial access or elevate privileges. If confirmed
  malicious, this could lead to unauthorized access, privilege escalation, and potential
  compromise of sensitive information.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/3d8d3a36-93b8-42d7-8d91-c5f24cec223d/
indicators:
- type: data_source
  value: Azure Active Directory
  confidence: high
- type: risk_user
  value: userPrincipalName
  confidence: high
false_positives:
- description: A source Ip failing to authenticate with multiple users is not a common
    for legitimate behavior.
  mitigation: Review context and user activity
