technique_id: T1556
technique_name: Okta Phishing Detection with FastPass Origin Check
tactic: initial_access
platform: Splunk
fidelity_score: 0.95
validated: false
query: '`okta` eventType="user.authentication.auth_via_mfa" AND result="FAILURE" AND
  outcome.reason="FastPass declined phishing attempt" | stats count min(_time) as
  firstTime max(_time) as lastTime values(displayMessage) by user eventType client.userAgent.rawUserAgent
  client.userAgent.browser outcome.reason | `security_content_ctime(firstTime)` |
  `security_content_ctime(lastTime)` | `okta_phishing_detection_with_fastpass_origin_check_filter`'
explanation: The following analytic identifies failed user authentication attempts
  in Okta due to FastPass declining a phishing attempt. It leverages Okta logs, specifically
  looking for events where multi-factor authentication (MFA) fails with the reason
  "FastPass declined phishing attempt." This activity is significant as it indicates
  that attackers are targeting users with real-time phishing proxies, attempting to
  capture credentials. If confirmed malicious, this could lead to unauthorized access
  to user accounts, potentially compromising sensitive information and furthering
  lateral movement within the organization.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/f4ca0057-cbf3-44f8-82ea-4e330ee901d3/
indicators:
- type: data_source
  value: Okta
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Fidelity of this is high as Okta is specifying malicious infrastructure.
    Filter and modify as needed.
  mitigation: Review context and user activity
references:
