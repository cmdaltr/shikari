technique_id: T1199
technique_name: Okta Sign-In Events via Third-Party IdP
tactic: initial_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset:okta.system and okta.debug_context.debug_data.request_uri:/oauth2/v1/authorize/callback\
  \ and\n    (not okta.authentication_context.issuer.id:Okta and event.action:(user.authentication.auth_via_IDP\n\
  \        or user.authentication.auth_via_inbound_SAML\n        or user.authentication.auth_via_mfa\n\
  \        or user.authentication.auth_via_social)\n        or event.action:user.session.start)\
  \ or\n    (event.action:user.authentication.auth_via_IDP and okta.outcome.result:FAILURE\n\
  \        and okta.outcome.reason:(\"A SAML assert with the same ID has already been\
  \ processed by Okta for a previous request\"\n            or \"Unable to match transformed\
  \ username\"\n            or \"Unable to resolve IdP endpoint\"\n            or\
  \ \"Unable to validate SAML Response\"\n            or \"Unable to validate incoming\
  \ SAML Assertion\"))"
explanation: Detects sign-in events where authentication is carried out via a third-party
  Identity Provider (IdP).
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1ceb05c4-7d25-11ee-9562-f661ea17fbcd.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis:

    - It might be a false positive if this IdP is authorized to be used by the tenant.

    - This may be a false positive if an authorized third-party IdP is used to sign
    in to the tenant but failures occurred due to an incorrect configuration.


    ### Response and remediation:

    - If the IdP is unauthorized, deactivate it immediately via the Okta console.

    - Reset the effected user''s password and enforce MFA re-enrollment, if applicable.

    - Mobile device forensics may be required to d'
  mitigation: Review investigation guide for details
references:
- https://blog.cloudflare.com/cloudflare-investigation-of-the-january-2022-okta-compromise/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://sec.okta.com/articles/2023/08/cross-tenant-impersonation-prevention-and-detection
- https://unit42.paloaltonetworks.com/muddled-libra/
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 47
