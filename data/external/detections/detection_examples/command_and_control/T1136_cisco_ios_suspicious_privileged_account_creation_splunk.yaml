technique_id: T1136
technique_name: Cisco IOS Suspicious Privileged Account Creation
tactic: command_and_control
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats `security_content_summariesonly` count values(All_Changes.command)
  as command min(_time) as firstTime max(_time) as lastTime from datamodel=Change.All_Changes
  where ( (All_Changes.command="*username * privilege 15*") OR (All_Changes.command="*username
  * password*" AND All_Changes.command="*USER TABLE MODIFIED*") OR (All_Changes.command="*USER_PRIVILEGE_UPDATE*priv-15*")
  ) by All_Changes.dvc All_Changes.user | `drop_dm_object_name("All_Changes")` | rename
  dvc as dest | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `cisco_ios_suspicious_privileged_account_creation_filter`'
explanation: This analytic detects the creation of privileged user accounts on Cisco
  IOS devices, which could indicate an attacker establishing backdoor access. The
  detection focuses on identifying when user accounts are created with privilege level
  15 (the highest administrative privilege level in Cisco IOS) or when existing accounts
  have their privileges elevated. This type of activity is particularly concerning
  when performed by unauthorized users or during unusual hours, as it may represent
  a key step in establishing persistence following the exploitation of vulnerabilities
  like CVE-2018-0171 in Cisco Smart Install. Threat actors like Static Tundra have
  been observed creating privileged accounts as part of their attack chain after gaining
  initial access to network devices.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/63e3aff9-45d7-4d41-bcdb-9da561fb4533/
indicators:
- type: data_source
  value: Cisco IOS Logs
  confidence: high
- type: risk_system
  value: dest
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate account creation and privilege elevation activities by authorized
    administrators will generate alerts with this detection. To reduce false positives,
    consider implementing a baseline of expected administrative activities, including
    approved administrative usernames, typical times for account management, and authorized
    administrators who regularly perform these actions. You may also want to create
    a lookup table of approved administrative accounts and filter out alerts for these
    accounts. Additionally, scheduled maintenance windows should be taken into account
    when evaluating alerts.
  mitigation: Review context and user activity
references:
- https://blog.talosintelligence.com/static-tundra/
- https://tools.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-20180328-smi2
