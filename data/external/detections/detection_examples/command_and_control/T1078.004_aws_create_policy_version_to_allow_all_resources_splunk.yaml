technique_id: T1078.004
technique_name: AWS Create Policy Version to allow all resources
tactic: command_and_control
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName=CreatePolicyVersion eventSource = iam.amazonaws.com
  errorCode = success | spath input=requestParameters.policyDocument output=key_policy_statements
  path=Statement{} | mvexpand key_policy_statements | spath input=key_policy_statements
  output=key_policy_action_1 path=Action | where key_policy_action_1 = "*" | rename
  user_name as user | stats count min(_time) as firstTime max(_time) as lastTime values(key_policy_statements)
  as policy_added by signature dest user user_agent src vendor_account vendor_region
  vendor_product | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  |`aws_create_policy_version_to_allow_all_resources_filter`'
explanation: The following analytic identifies the creation of a new AWS IAM policy
  version that allows access to all resources. It detects this activity by analyzing
  AWS CloudTrail logs for the CreatePolicyVersion event with a policy document that
  grants broad permissions. This behavior is significant because it violates the principle
  of least privilege, potentially exposing the environment to misuse or abuse. If
  confirmed malicious, an attacker could gain extensive access to AWS resources, leading
  to unauthorized actions, data exfiltration, or further compromise of the AWS environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/2a9b80d3-6340-4345-b5ad-212bf3d0dac4/
indicators:
- type: data_source
  value: AWS CloudTrail CreatePolicyVersion
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: While this search has no known false positives, it is possible that
    an AWS admin has legitimately created a policy to allow a user to access all resources.
    That said, AWS strongly advises against granting full control to all AWS resources
    and you must verify this activity.
  mitigation: Review context and user activity
references:
- https://bishopfox.com/blog/privilege-escalation-in-aws
- https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation-part-2/
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1078/aws_create_policy_version/aws_cloudtrail_events.json
