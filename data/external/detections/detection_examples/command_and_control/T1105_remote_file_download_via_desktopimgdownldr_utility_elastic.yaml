technique_id: T1105
technique_name: Remote File Download via Desktopimgdownldr Utility
tactic: command_and_control
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (process.name : \"desktopimgdownldr.exe\" or ?process.pe.original_file_name ==\
  \ \"desktopimgdownldr.exe\") and\n  process.args : \"/lockscreenurl:http*\""
explanation: 'Identifies the desktopimgdownldr utility being used to download a remote
  file. An adversary may use desktopimgdownldr to

  download arbitrary files as an alternative to certutil.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/15c0b7a7-9c34-4869-b25b-fa6518414899.toml
