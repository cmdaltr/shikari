technique_id: T1219
technique_name: Potential REMCOS Trojan Execution
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "any where host.os.type == \"windows\" and\n(\n (event.category == \"file\"\
  \ and event.type == \"deletion\" and file.path like \"C:\\\\Users\\\\*\\\\AppData\\\
  \\Local\\\\Temp\\\\TH????.tmp\") or\n\n (event.category == \"file\" and file.path\
  \ : \"?:\\\\Users\\\\*\\\\AppData\\\\Roaming\\\\remcos\\\\logs.dat\") or\n\n (event.category\
  \ == \"registry\" and\n  registry.value : (\"Remcos\", \"Rmc-??????\", \"licence\"\
  ) and\n  registry.path : (\n      \"*\\\\Windows\\\\CurrentVersion\\\\Run\\\\Remcos\"\
  ,\n      \"*\\\\Windows\\\\CurrentVersion\\\\Run\\\\Rmc-??????\",\n      \"*\\\\\
  SOFTWARE\\\\Remcos-*\\\\licence\",\n      \"*\\\\Software\\\\Rmc-??????\\\\licence\"\
  \n  )\n )\n)"
explanation: Identifies known execution traces of the REMCOS Remote Access Trojan.
  Remcos RAT is used by attackers to perform actions on infected machines remotely.
source: Elastic Detection Rules
