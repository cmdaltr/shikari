technique_id: T1219
technique_name: Suspicious ScreenConnect Client Child Process
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name :\n                (\"ScreenConnect.ClientService.exe\",\n\
  \                 \"ScreenConnect.WindowsClient.exe\",\n                 \"ScreenConnect.WindowsBackstageShell.exe\"\
  ,\n                 \"ScreenConnect.WindowsFileManager.exe\") and\n  (\n   (process.name\
  \ : \"powershell.exe\" and\n    process.args : (\"-enc\", \"-ec\", \"-e\", \"*downloadstring*\"\
  , \"*Reflection.Assembly*\", \"*http*\")) or\n   (process.name : \"cmd.exe\" and\
  \ process.args : \"/c\") or\n   (process.name : \"net.exe\" and process.args : \"\
  /add\") or\n   (process.name : \"schtasks.exe\" and process.args : (\"/create\"\
  , \"-create\")) or\n   (process.name : \"sc.exe\" and process.args : \"create\"\
  ) or\n   (process.name : \"rundll32.exe\" and not process.args : \"url.dll,FileProtocolHandler\"\
  ) or\n   (process.name : \"msiexec.exe\" and process.args : (\"/i\", \"-i\") and\n\
  \    process.args : (\"/q\", \"/quiet\", \"/qn\", \"-q\", \"-quiet\", \"-qn\", \"\
  -Q+\")) or\n   process.name : (\"mshta.exe\", \"certutil.exe\", \"bistadmin.exe\"\
  , \"certreq.exe\", \"wscript.exe\", \"cscript.exe\", \"curl.exe\",\n           \
  \        \"ssh.exe\", \"scp.exe\", \"wevtutil.exe\", \"wget.exe\", \"wmic.exe\"\
  )\n   )"
explanation: 'Identifies suspicious processes being spawned by the ScreenConnect client
  processes. This activity may indicate

  execution abusing unauthorized access to the ScreenConnect remote access software.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/78de1aeb-5225-4067-b8cc-f4a1de8a8546.toml
