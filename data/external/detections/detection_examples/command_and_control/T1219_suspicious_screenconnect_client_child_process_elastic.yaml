false_positives:
- description: 'False positive analysis


    - Legitimate IT support activities using ScreenConnect may trigger the rule when
    executing scripts or commands for maintenance. To manage this, identify and whitelist
    specific IT support accounts or IP addresses that regularly perform these actions.

    - Automated scripts or scheduled tasks that use ScreenConnect for routine operations
    might be flagged. Review and document these scripts, then create exceptions for
    known benign processes and arguments.

    - Software updates or'
  mitigation: Review investigation guide for details
