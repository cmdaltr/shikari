technique_id: T1071.001
technique_name: HTTP Rapid POST with Mixed Status Codes
tactic: command_and_control
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`nginx_access_logs` http_method="POST"| bin _time span=5s | rename dest_ip
  as dest | stats count, values(status) as status_codes, values(bytes_out) as bytes_out,
  values(uri_path) as uris by _time, src_ip, dest, http_user_agent | where count>20
  | table _time, dest, src_ip, count, status_codes, bytes_out, http_user_agent | `http_rapid_post_with_mixed_status_codes_filter`'
explanation: This detection identifies rapid-fire POST request attacks where an attacker
  sends more than 20 POST requests within a 5-second window, potentially attempting
  to exploit race conditions or overwhelm request handling. The pattern is particularly
  suspicious when responses vary in size or status codes, indicating successful exploitation
  attempts or probing for vulnerable endpoints.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/c8c987d6-3a1a-4555-9a52-eea0741b6113/
indicators:
- type: data_source
  value: Nginx Access
  confidence: high
- type: risk_system
  value: dest
  confidence: high
