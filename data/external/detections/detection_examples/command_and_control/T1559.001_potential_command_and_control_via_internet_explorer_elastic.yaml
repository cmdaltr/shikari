technique_id: T1559.001
technique_name: Potential Command and Control via Internet Explorer
tactic: command_and_control
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id, user.name with maxspan = 5s\n  [library where host.os.type\
  \ == \"windows\" and dll.name : \"IEProxy.dll\" and process.name : (\"rundll32.exe\"\
  , \"regsvr32.exe\")]\n  [process where host.os.type == \"windows\" and event.type\
  \ == \"start\" and process.parent.name : \"iexplore.exe\" and process.parent.args\
  \ : \"-Embedding\"]\n  /* IE started via COM in normal conditions makes few connections,\
  \ mainly to Microsoft and OCSP related domains, add FPs here */\n  [network where\
  \ host.os.type == \"windows\" and network.protocol == \"dns\" and process.name :\
  \ \"iexplore.exe\" and\n   not dns.question.name :\n   (\n    \"*.microsoft.com\"\
  ,\n    \"*.digicert.com\",\n    \"*.msocsp.com\",\n    \"*.windowsupdate.com\",\n\
  \    \"*.bing.com\",\n    \"*.identrust.com\",\n    \"*.sharepoint.com\",\n    \"\
  *.office365.com\",\n    \"*.office.com\"\n    )\n  ] /* with runs=5 */"
explanation: 'Identifies instances of Internet Explorer (iexplore.exe) being started
  via the Component Object Model (COM) making

  unusual network connections. Adversaries could abuse Internet Explorer via COM to
  avoid suspicious processes making

  network connections and bypass host-based firewall restrictions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/acd611f3-2b93-47b3-a0a3-7723bcc46f6d.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Internet Explorer may make legitimate DNS queries to domains not listed in the
    exclusion list, such as those related to third-party services or internal company
    resources. Users should monitor and identify these domains and consider adding
    them to the exclusion list if they are verified as non-threatening.

    - Some enterprise environments may use custom applications that leverage Internet
    Explorer via COM for legitimate purposes. In such cases, users should identify
    thes'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
