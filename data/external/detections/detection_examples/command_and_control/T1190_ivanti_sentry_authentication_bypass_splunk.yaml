false_positives:
- description: It is important to note that false positives may occur if the search
    criteria are expanded beyond the HTTP status code 200. In other words, if the
    search includes other HTTP status codes, the likelihood of encountering false
    positives increases. This is due to the fact that HTTP status codes other than
    200 may not necessarily indicate a successful exploitation attempt.
  mitigation: Review context and user activity
