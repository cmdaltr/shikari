technique_id: T1567
technique_name: Potential File Transfer via Certreq
tactic: command_and_control
platform: Elastic
fidelity_score: 0.9
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (process.name : \"CertReq.exe\" or ?process.pe.original_file_name == \"CertReq.exe\"\
  ) and process.args : \"-Post\""
explanation: 'Identifies Certreq making an HTTP Post request. Adversaries could abuse
  Certreq to download files or upload data to a

  remote URL.'
