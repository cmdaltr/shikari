technique_id: T1105
technique_name: Remote File Download via MpCmdRun
tactic: command_and_control
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (process.name : \"MpCmdRun.exe\" or ?process.pe.original_file_name == \"MpCmdRun.exe\"\
  ) and\n   process.args : \"-DownloadFile\" and process.args : \"-url\" and process.args\
  \ : \"-path\""
explanation: Identifies the Windows Defender configuration utility (MpCmdRun.exe)
  being used to download a remote file.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c6453e73-90eb-4fe7-a98c-cde7bbfc504a.toml
