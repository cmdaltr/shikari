query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \ process.args : \"-s\" and process.args : \"-d\" and process.args : \"rssocks\""
explanation: 'Identifies the execution of the EarthWorm tunneler. Adversaries may
  tunnel network communications to and from a victim

  system within a separate protocol to avoid detection and network filtering, or to
  enable access to otherwise unreachable

  systems.'
