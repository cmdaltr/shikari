technique_id: T1219
technique_name: Attempt to Establish VScode Remote Tunnel
tactic: command_and_control
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.args : \"tunnel\" and (process.args : \"--accept-server-license-terms\"\
  \ or process.name : \"code*.exe\") and\n  not (process.name == \"code-tunnel.exe\"\
  \ and process.args == \"status\" and process.parent.name == \"Code.exe\")"
explanation: 'Detects the execution of the VScode portable binary with the tunnel
  command line option indicating an attempt to

  establish a remote tunnel session to Github or a remote VScode instance.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0b96dfd8-5b8c-4485-9a1c-69ff7839786a.toml
query_type: eql
query_language: eql
