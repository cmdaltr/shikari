false_positives:
- description: 'False positive analysis


    - Legitimate remote development activities using VScode''s tunnel feature may
    trigger the rule. Users can create exceptions for known developer machines or
    specific user accounts frequently using this feature for authorized purposes.

    - Automated scripts or deployment tools that utilize VScode''s remote tunnel for
    legitimate operations might be flagged. Consider excluding these processes by
    identifying their unique command-line arguments or parent processes.

    - Scheduled tas'
  mitigation: Review investigation guide for details
