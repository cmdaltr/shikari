technique_id: T1190
technique_name: Accepted Default Telnet Port Connection
tactic: command_and_control
platform: Elastic
fidelity_score: 0.91
validated: true
query: "(event.dataset:network_traffic.flow or event.category:(network or network_traffic))\n\
  \    and event.type:connection and not event.action:(\n        flow_dropped or flow_denied\
  \ or denied or deny or\n        flow_terminated or timeout or Reject or network_flow)\n\
  \    and destination.port:23"
explanation: 'This rule detects network events that may indicate the use of Telnet
  traffic. Telnet is commonly used by system

  administrators to remotely control older or embedded systems using the command line
  shell. It should almost never be

  directly exposed to the Internet, as it is frequently targeted and exploited by
  threat actors as an initial access or

  backdoor vector. As a plain-text protocol, it may also expose usernames and passwords
  to anyone capable of observing the

  traffic.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/34fde489-94b0-4500-a76f-b8a157cf9269.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PAN-OS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legacy systems or devices that require Telnet for management may trigger alerts.
    To manage this, create exceptions for specific IP addresses or subnets known to
    host these systems.

    - Internal network monitoring tools that use Telnet for legitimate purposes might
    be flagged. Identify these tools and exclude their traffic from the rule to prevent
    unnecessary alerts.

    - Lab environments or test networks where Telnet is used for educational or testing
    purposes can cause fal'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
