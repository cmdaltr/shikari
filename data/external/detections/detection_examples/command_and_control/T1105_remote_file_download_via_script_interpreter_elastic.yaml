technique_id: T1105
technique_name: Remote File Download via Script Interpreter
tactic: command_and_control
platform: Elastic
fidelity_score: 0.91
validated: true
query: "sequence by host.id, process.entity_id\n  [network where host.os.type == \"\
  windows\" and process.name : (\"wscript.exe\", \"cscript.exe\") and network.protocol\
  \ != \"dns\" and\n   network.direction : (\"outgoing\", \"egress\") and network.type\
  \ == \"ipv4\" and destination.ip != \"127.0.0.1\"\n  ]\n  [file where host.os.type\
  \ == \"windows\" and event.type == \"creation\" and file.extension : (\"exe\", \"\
  dll\")]"
explanation: 'Identifies built-in Windows script interpreters (cscript.exe or wscript.exe)
  being used to download an executable file

  from a remote destination.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1d276579-3380-4095-ad38-e596a01bc64f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: "False positive analysis\n\n- The usage of these script engines by\
