    \ response process based on the outcome of the triage.\n- Isolate the involved\
    \ host to prevent further post-compromise behavior.\n- If the triage identified\
    \ malware, search the environment for additional compromised hosts.\n  - Implement\
    \ temporary network rules, procedures, an"
  mitigation: Review investigation guide for details
has_investigation_guide: true
