technique_id: T1071
technique_name: Halfbaked Command and Control Beacon
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "(event.dataset: (network_traffic.tls OR network_traffic.http) OR\n  (event.category:\
  \ (network OR network_traffic) AND network.protocol: http)) AND\n  network.transport:tcp\
  \ AND url.full:/http:\\/\\/[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}.[0-9]{1,3}\\/cd/ AND\n\
  \  destination.port:(53 OR 80 OR 8080 OR 443)"
explanation: 'Halfbaked is a malware family used to establish persistence in a contested
  network. This rule detects a network activity

  algorithm leveraged by Halfbaked implant beacons for command and control.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2e580225-2a58-48ef-938b-572933be06fe.toml
query_type: query
query_language: lucene
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or patch management systems may use similar URL
    structures and ports, leading to false positives. Users can create exceptions
    for known update servers by whitelisting their IP addresses or domain names.

    - Internal web applications or services that use non-standard ports like 8080
    for HTTP traffic might trigger the rule. Identify these applications and exclude
    their traffic from the rule by specifying their IP addresses or domain names.

    - Net'
  mitigation: Review investigation guide for details
references:
- https://www.fireeye.com/blog/threat-research/2017/04/fin7-phishing-lnk.html
- https://attack.mitre.org/software/S0151/
has_investigation_guide: true
risk_score: 73
