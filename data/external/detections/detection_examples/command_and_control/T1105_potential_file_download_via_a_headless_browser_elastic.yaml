technique_id: T1105
technique_name: Potential File Download via a Headless Browser
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : (\"chrome.exe\", \"msedge.exe\", \"brave.exe\", \"browser.exe\"\
  , \"dragon.exe\", \"vivaldi.exe\") and\n  process.args : \"--headless*\" and\n \
  \ process.args : (\"--disable-gpu\", \"--dump-dom\", \"*http*\", \"data:text/html;base64,*\"\
  ) and\n  process.parent.name :\n     (\"cmd.exe\", \"powershell.exe\", \"wscript.exe\"\
  , \"cscript.exe\", \"mshta.exe\", \"conhost.exe\", \"msiexec.exe\",\n      \"explorer.exe\"\
  , \"rundll32.exe\", \"winword.exe\", \"excel.exe\", \"onenote.exe\", \"hh.exe\"\
  , \"powerpnt.exe\", \"forfiles.exe\",\n      \"pcalua.exe\", \"wmiprvse.exe\") and\n\
  \  not process.executable : (\n        \"?:\\\\inetpub\\\\wwwroot\\\\*\\\\ext\\\\\
  modules\\\\html2pdf\\\\bin\\\\chrome\\\\*\\\\chrome-win64\\\\chrome.exe\",\n   \
  \     \"\\\\Device\\\\HarddiskVolume*\\\\inetpub\\\\wwwroot\\\\*\\\\ext\\\\modules\\\
  \\html2pdf\\\\bin\\\\chrome\\\\*\\\\chrome-win64\\\\chrome.exe\"\n  )"
explanation: 'Identifies the use of a browser to download a file from a remote URL
  and from a suspicious parent process. Adversaries

  may use browsers to avoid ingress tool transfer restrictions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5f2f463e-6997-478c-8405-fb41cc283281.toml
