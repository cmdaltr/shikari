technique_id: T1021
technique_name: RDP (Remote Desktop Protocol) from the Internet
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "(event.dataset: network_traffic.flow or (event.category: (network or network_traffic)))\
  \ and\n  network.transport:tcp and (destination.port:3389 or event.dataset:zeek.rdp)\
  \ and\n  not source.ip:(\n    10.0.0.0/8 or\n    127.0.0.0/8 or\n    169.254.0.0/16\
  \ or\n    172.16.0.0/12 or\n    192.0.0.0/24 or\n    192.0.0.0/29 or\n    192.0.0.8/32\
  \ or\n    192.0.0.9/32 or\n    192.0.0.10/32 or\n    192.0.0.170/32 or\n    192.0.0.171/32\
  \ or\n    192.0.2.0/24 or\n    192.31.196.0/24 or\n    192.52.193.0/24 or\n    192.168.0.0/16\
  \ or\n    192.88.99.0/24 or\n    224.0.0.0/4 or\n    100.64.0.0/10 or\n    192.175.48.0/24\
  \ or\n    198.18.0.0/15 or\n    198.51.100.0/24 or\n    203.0.113.0/24 or\n    240.0.0.0/4\
  \ or\n    \"::1\" or\n    \"FE80::/10\" or\n    \"FF00::/8\"\n  ) and\n  destination.ip:(\n\
  \    10.0.0.0/8 or\n    172.16.0.0/12 or\n    192.168.0.0/16\n  )"
explanation: 'This rule detects network events that may indicate the use of RDP traffic
  from the Internet. RDP is commonly used by

  system administrators to remotely control a system for maintenance or to use shared
  resources. It should almost never be

  directly exposed to the Internet, as it is frequently targeted and exploited by
  threat actors as an initial access or

  backdoor vector.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8c1bdde8-4204-45c0-9e0c-c85ca3902488.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PAN-OS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Internal testing or maintenance activities may trigger the rule if RDP is temporarily
    exposed to the internet. To manage this, create exceptions for known internal
    IP addresses or scheduled maintenance windows.

    - Legitimate third-party vendors or partners accessing systems via RDP for support
    purposes can be mistaken for threats. Establish a list of trusted external IP
    addresses and exclude them from the rule.

    - Misconfigured network devices or security tools might ina'
  mitigation: Review investigation guide for details
references:
- https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry.xhtml
has_investigation_guide: true
risk_score: 47
