technique_id: T1078.004
technique_name: ASL AWS Create Policy Version to allow all resources
tactic: command_and_control
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`amazon_security_lake` api.operation=CreatePolicy | spath input=api.request.data
  | spath input=policyDocument | regex Statement{}.Action="\*" | regex Statement{}.Resource="\*"
  | fillnull | stats count min(_time) as firstTime max(_time) as lastTime by actor.user.uid
  api.operation api.service.name http_request.user_agent src_endpoint.ip actor.user.account.uid
  cloud.provider cloud.region api.request.data | rename actor.user.uid as user api.operation
  as action api.service.name as dest http_request.user_agent as user_agent src_endpoint.ip
  as src actor.user.account.uid as vendor_account cloud.provider as vendor_product
  cloud.region as vendor_region | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  |`asl_aws_create_policy_version_to_allow_all_resources_filter`'
explanation: The following analytic identifies the creation of a new AWS IAM policy
  version that allows access to all resources. It detects this activity by analyzing
  AWS CloudTrail logs for the CreatePolicyVersion event with a policy document that
  grants broad permissions. This behavior is significant because it violates the principle
  of least privilege, potentially exposing the environment to misuse or abuse. If
  confirmed malicious, an attacker could gain extensive access to AWS resources, leading
  to unauthorized actions, data exfiltration, or further compromise of the AWS environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/22cc7a62-3884-48c4-82da-592b8199b72f/
indicators:
- type: data_source
  value: ASL AWS CloudTrail
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: While this search has no known false positives, it is possible that
    an AWS admin has legitimately created a policy to allow a user to access all resources.
    That said, AWS strongly advises against granting full control to all AWS resources
    and you must verify this activity.
  mitigation: Review context and user activity
references:
- https://bishopfox.com/blog/privilege-escalation-in-aws
- https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation-part-2/
validation:
