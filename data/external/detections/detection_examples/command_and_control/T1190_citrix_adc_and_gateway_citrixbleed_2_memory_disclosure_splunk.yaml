technique_id: T1190
technique_name: Citrix ADC and Gateway CitrixBleed 2 Memory Disclosure
tactic: command_and_control
platform: Splunk
fidelity_score: 0.95
validated: true
query: "| tstats count min(_time) as firstTime max(_time) as lastTime from datamodel=Web\
  \ where\nWeb.url IN (\"*/p/u/doAuthentication.do*\")\nWeb.http_method=\"POST\"\n\
  Web.status=200\nby Web.http_user_agent, Web.status, Web.http_method,\n   Web.url,\
  \ Web.url_length, Web.src, Web.dest, sourcetype\n| `drop_dm_object_name(\"Web\"\
  )`\n| `security_content_ctime(firstTime)`\n| `security_content_ctime(lastTime)`\n\
  | `citrix_adc_and_gateway_citrixbleed_2_memory_disclosure_filter`"
explanation: 'This detection identifies potential exploitation attempts of CVE-2025-5777
  (CitrixBleed 2), a memory disclosure vulnerability in Citrix NetScaler ADC and Gateway.

  The vulnerability is triggered by sending POST requests with incomplete form data
  to the /p/u/doAuthentication.do endpoint, causing the device to leak memory contents
  including session tokens and authentication materials.

  This search looks for POST requests to the vulnerable endpoint that may indicate
  scanning or exploitation attempts.'
source: Splunk Security Content
source_url: https://research.splunk.com/detections/bef92f3f-7dc8-413a-8989-50581039e250/
indicators:
- type: data_source
  value: Suricata
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: "Legitimate authentication flows will trigger this detection as they\
    \ access the doAuthentication.do endpoint. However, repeated automated requests,\
    \ especially from HeadlessChrome user agents or with incomplete form data, should\
    \ be investigated. \nFocus on unusual patterns like multiple rapid requests or\
    \ non-standard user agents."
  mitigation: Review context and user activity
