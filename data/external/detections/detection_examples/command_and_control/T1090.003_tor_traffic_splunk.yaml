technique_id: T1090.003
technique_name: TOR Traffic
tactic: command_and_control
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Network_Traffic where All_Traffic.app=tor AND All_Traffic.action
  IN ("allowed", "allow") by All_Traffic.action All_Traffic.app All_Traffic.bytes
  All_Traffic.bytes_in All_Traffic.bytes_out All_Traffic.dest All_Traffic.dest_ip
  All_Traffic.dest_port All_Traffic.dvc All_Traffic.protocol All_Traffic.protocol_version
  All_Traffic.src All_Traffic.src_ip All_Traffic.src_port All_Traffic.transport All_Traffic.user
  All_Traffic.vendor_product All_Traffic.rule | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `drop_dm_object_name("All_Traffic")` | `tor_traffic_filter`'
explanation: The following analytic identifies allowed network traffic to The Onion
  Router (TOR), an anonymity network often exploited for malicious activities. It
  leverages data from Next Generation Firewalls, using the Network_Traffic data model
  to detect traffic where the application is TOR and the action is allowed. This activity
  is significant as TOR can be used to bypass conventional monitoring, facilitating
  hacking, data breaches, and illicit content dissemination. If confirmed malicious,
  this could lead to unauthorized access, data exfiltration, and severe compliance
  violations, compromising the integrity and security of the network.
