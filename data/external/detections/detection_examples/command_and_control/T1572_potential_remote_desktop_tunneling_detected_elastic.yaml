technique_id: T1572
technique_name: Potential Remote Desktop Tunneling Detected
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  /* RDP port and usual SSH tunneling related switches in command line */\n  process.args\
  \ : \"*:3389\" and\n  process.args : (\"-L\", \"-P\", \"-R\", \"-pw\", \"-ssh\")"
explanation: 'Identifies potential use of an SSH utility to establish RDP over a reverse
  SSH Tunnel. This can be used by attackers to

  enable routing of network packets that would otherwise not reach their intended
  destination.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/76fd43b7-3480-4dd9-8ad7-8bd36bfad92f.toml
query_type: eql
query_language: eql
