explanation: 'Adversaries may install legitimate remote access tools (RAT) to compromised
  endpoints for further command-and-control

  (C2). Adversaries can rely on installed RATs for persistence, execution of native
  commands and more. This rule detects

  when a process is started whose name or code signature resembles commonly abused
  RATs. This is a New Terms rule type

  indicating the host has not seen this RAT process started before within the last
  30 days.'
