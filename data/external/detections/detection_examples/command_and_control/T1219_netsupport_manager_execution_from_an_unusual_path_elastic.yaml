technique_id: T1219
technique_name: NetSupport Manager Execution from an Unusual Path
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (process.name : \"client32.exe\" or ?process.pe.original_file_name == \"client32.exe\"\
  \ or process.parent.name : \"client32.exe\") and\n (\n  process.executable :\n \
  \              (\"?:\\\\Users\\\\*.exe\",\n                \"?:\\\\ProgramData\\\
  \\*.exe\",\n                \"\\\\Device\\\\HarddiskVolume?\\\\Users\\\\*.exe\"\
  ,\n                \"\\\\Device\\\\HarddiskVolume?\\\\ProgramData\\\\*.exe\") or\n\
  \  ?process.parent.executable : (\"?:\\\\Users\\\\*\\\\client32.exe\", \"?:\\\\\
  ProgramData\\\\*\\\\client32.exe\")\n  )"
explanation: 'Identifies execution of the NetSupport remote access software from non-default
  paths. Adversaries may abuse NetSupport

  Manager to control a target victim machine.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5f73aef2-7abc-4fd9-ac0d-ab8ec3e13891.toml
