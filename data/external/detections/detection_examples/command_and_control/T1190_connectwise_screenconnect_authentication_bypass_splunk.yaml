technique_id: T1190
technique_name: ConnectWise ScreenConnect Authentication Bypass
tactic: command_and_control
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats count min(_time) as firstTime max(_time) as lastTime from datamodel=Web
  where Web.url IN ("*/SetupWizard.aspx/*","*/SetupWizard/") Web.status=200 Web.http_method=POST
  by Web.src, Web.dest, Web.http_user_agent, Web.url, Web.status, Web.http_method,
  sourcetype, source | rex field=Web.url "/SetupWizard.aspx/(?<randomPath>.+)" | `drop_dm_object_name("Web")`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `connectwise_screenconnect_authentication_bypass_filter`'
explanation: The following analytic detects attempts to exploit the ConnectWise ScreenConnect
  CVE-2024-1709 vulnerability, which allows attackers to bypass authentication via
  an alternate path or channel. It leverages web request logs to identify access to
  the SetupWizard.aspx page, indicating potential exploitation. This activity is significant
  as it can lead to unauthorized administrative access and remote code execution.
  If confirmed malicious, attackers could create administrative users and gain full
  control over the affected system, posing severe security risks. Immediate remediation
  by updating to version 23.9.8 or above is recommended.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/d3f7a803-e802-448b-8eb2-e796b223bfff/
indicators:
- type: data_source
  value: Suricata
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: False positives are not expected, as the detection is based on the
    presence of web requests to the SetupWizard.aspx page, which is not a common page
    to be accessed by legitimate users. Note that the analytic is limited to HTTP
    POST and a status of 200 to reduce false positives. Modify the query as needed
    to reduce false positives or hunt for additional indicators of compromise.
  mitigation: Review context and user activity
