  value: Nginx Access
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: False positives may occur depending on the web server's configuration.
    If the web server is intentionally configured to utilize the Remote ShellServlet,
    then the detections by this analytic would not be considered true positives.
  mitigation: Review context and user activity
