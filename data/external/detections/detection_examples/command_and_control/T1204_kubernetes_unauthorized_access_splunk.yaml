technique_id: T1204
technique_name: Kubernetes Unauthorized Access
tactic: command_and_control
platform: Splunk
fidelity_score: 0.85
validated: true
query: '`kube_audit` verb=create responseStatus.reason=Forbidden | fillnull | stats
  count by objectRef.namespace objectRef.resource requestReceivedTimestamp requestURI
  responseStatus.code responseStatus.message sourceIPs{} stage user.groups{} user.uid
  user.username userAgent verb | rename sourceIPs{} as src_ip, user.username as user
  | `kubernetes_unauthorized_access_filter`'
explanation: The following analytic detects unauthorized access attempts to Kubernetes
  by analyzing Kubernetes audit logs. It identifies anomalies in access patterns by
  examining the source of requests and their response statuses. This activity is significant
  for a SOC as it may indicate an attacker attempting to infiltrate the Kubernetes
  environment. If confirmed malicious, such access could lead to unauthorized control
  over Kubernetes resources, potentially compromising sensitive systems or data within
  the cluster.
