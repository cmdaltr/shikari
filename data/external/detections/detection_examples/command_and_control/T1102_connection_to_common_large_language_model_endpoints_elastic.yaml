technique_id: T1102
technique_name: Connection to Common Large Language Model Endpoints
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "network where host.os.type == \"windows\" and dns.question.name != null and\n\
  (\n  process.name : (\"MSBuild.exe\", \"mshta.exe\", \"wscript.exe\", \"powershell.exe\"\
  , \"pwsh.exe\", \"msiexec.exe\", \"rundll32.exe\",\n  \"bitsadmin.exe\", \"InstallUtil.exe\"\
  , \"RegAsm.exe\", \"vbc.exe\", \"RegSvcs.exe\", \"python.exe\", \"regsvr32.exe\"\
  , \"dllhost.exe\",\n  \"node.exe\", \"javaw.exe\", \"java.exe\", \"*.pif\", \"*.com\"\
  ) or\n\n  ?process.code_signature.subject_name : (\"AutoIt Consulting Ltd\", \"\
  OpenJS Foundation\", \"Python Software Foundation\") or\n\n  (\n    process.executable\
  \ : (\"?:\\\\Users\\\\*.exe\", \"?:\\\\ProgramData\\\\*.exe\") and\n    (?process.code_signature.trusted\
  \ == false or ?process.code_signature.exists == false)\n  )\n ) and\n    dns.question.name\
  \ : (\n    // Major LLM APIs\n    \"api.openai.com\",\n    \"*.openai.azure.com\"\
  ,\n    \"api.anthropic.com\",\n    \"api.mistral.ai\",\n    \"api.cohere.ai\",\n\
  \    \"api.ai21.com\",\n    \"api.groq.com\",\n    \"api.perplexity.ai\",\n    \"\
  api.x.ai\",\n    \"api.deepseek.com\",\n    \"api.gemini.google.com\",\n    \"generativelanguage.googleapis.com\"\
  ,\n    \"api.azure.com\",\n    \"api.bedrock.aws\",\n    \"bedrock-runtime.amazonaws.com\"\
  ,\n\n    // Hugging Face & other ML infra\n    \"api-inference.huggingface.co\"\
  ,\n    \"inference-endpoint.huggingface.cloud\",\n    \"*.hf.space\",\n    \"*.replicate.com\"\
  ,\n    \"api.replicate.com\",\n    \"api.runpod.ai\",\n    \"*.runpod.io\",\n  \
  \  \"api.modal.com\",\n    \"*.forefront.ai\",\n\n    // Consumer-facing AI chat\
  \ portals\n    \"chat.openai.com\",\n    \"chatgpt.com\",\n    \"copilot.microsoft.com\"\
  ,\n    \"bard.google.com\",\n    \"gemini.google.com\",\n    \"claude.ai\",\n  \
  \  \"perplexity.ai\",\n    \"poe.com\",\n    \"chat.forefront.ai\",\n    \"chat.deepseek.com\"\
  \n  ) and\n\n  not process.executable : (\n          \"?:\\\\Program Files\\\\*.exe\"\
  ,\n          \"?:\\\\Program Files (x86)\\\\*.exe\",\n          \"?:\\\\Windows\\\
  \\System32\\\\svchost.exe\",\n          \"?:\\\\Windows\\\\SystemApps\\\\Microsoft.LockApp_*\\\
  \\LockApp.exe\",\n          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Google\\\\\
  Chrome\\\\Application\\\\chrome.exe\",\n          \"?:\\\\Users\\\\*\\\\AppData\\\
  \\Local\\\\BraveSoftware\\\\*\\\\Application\\\\brave.exe\",\n          \"?:\\\\\
  Users\\\\*\\\\AppData\\\\Local\\\\Vivaldi\\\\Application\\\\vivaldi.exe\",\n   \
  \       \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Programs\\\\Opera*\\\\opera.exe\"\
  ,\n          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Programs\\\\Fiddler\\\\Fiddler.exe\"\
  \n        ) and\n    not (?process.code_signature.trusted == true and\n        \
  \ ?process.code_signature.subject_name : (\"Anthropic, PBC\", \"Google LLC\", \"\
  Mozilla Corporation\", \"Brave Software, Inc.\", \"Island Technology Inc.\", \"\
  Opera Norway AS\"))"
explanation: 'Identifies DNS queries to known Large Language Model domains by unsigned
  binaries or common Windows scripting utilities.

  Malwares may leverage the capabilities of LLM to perform actions in the affected
  system in a dynamic way.'
