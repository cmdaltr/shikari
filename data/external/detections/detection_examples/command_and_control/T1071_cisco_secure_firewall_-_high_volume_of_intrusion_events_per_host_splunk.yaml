false_positives:
- description: False positives can occur in environments where vulnerability scanners
    or malware sandboxes are actively generating simulated attacks. Additionally,
    noisy or overly aggressive Snort rules may produce bursts of alerts from legitimate
    applications. Review host context before escalating.
  mitigation: Review context and user activity
