technique_id: T1137
technique_name: Outlook Home Page Registry Modification
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.action != \"deletion\"\
  \ and registry.value : \"URL\" and\n    registry.path : (\n        \"*\\\\SOFTWARE\\\
  \\Microsoft\\\\Office\\\\*\\\\Outlook\\\\Webview\\\\*\",\n        \"*\\\\SOFTWARE\\\
  \\Microsoft\\\\Office\\\\*\\\\Outlook\\\\Today\\\\*\"\n    ) and registry.data.strings\
  \ : (\"*://*\", \"*:\\\\*\")"
explanation: 'Identifies modifications in registry keys associated with abuse of the
  Outlook Home Page functionality for command and

  control or persistence.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ac5a2759-5c34-440a-b0c4-51fe674611d6.toml
