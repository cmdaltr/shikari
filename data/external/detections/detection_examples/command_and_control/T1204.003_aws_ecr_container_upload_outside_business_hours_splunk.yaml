technique_id: T1204.003
technique_name: AWS ECR Container Upload Outside Business Hours
tactic: command_and_control
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`cloudtrail` eventSource=ecr.amazonaws.com eventName=PutImage date_hour>=20
  OR date_hour<8 OR date_wday=saturday OR date_wday=sunday | rename requestParameters.*
  as * | rename repositoryName AS repository | rename user_name as user | stats count
  min(_time) as firstTime max(_time) as lastTime by signature user user_agent src
  vendor_account vendor_region vendor_product repository | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_ecr_container_upload_outside_business_hours_filter`'
explanation: The following analytic detects the upload of a new container image to
  AWS Elastic Container Registry (ECR) outside of standard business hours. It leverages
  AWS CloudTrail logs to identify `PutImage` events occurring between 8 PM and 8 AM
  or on weekends. This activity is significant because container uploads outside business
  hours can indicate unauthorized or suspicious activity, potentially pointing to
  a compromised account or insider threat. If confirmed malicious, this could allow
  an attacker to deploy unauthorized or malicious containers, leading to potential
  data breaches or service disruptions.
source: Splunk Security Content
