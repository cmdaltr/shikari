technique_id: T1071
technique_name: Potential DNS Tunneling via NsLookup
tactic: command_and_control
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id with maxspan=5m\n[process where host.os.type == \"windows\"\
  \ and event.type == \"start\" and\n  process.name : \"nslookup.exe\" and process.args:(\"\
  -querytype=*\", \"-qt=*\", \"-q=*\", \"-type=*\")] with runs = 10"
explanation: 'This rule identifies a large number (15) of nslookup.exe executions
  with an explicit query type from the same host. This

  may indicate command and control activity utilizing the DNS protocol.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3a59fc81-99d3-47ea-8cd6-d48d561fca20.toml
query_type: eql
query_language: eql
