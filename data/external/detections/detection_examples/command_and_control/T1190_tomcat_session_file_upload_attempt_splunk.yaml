technique_id: T1190
technique_name: Tomcat Session File Upload Attempt
tactic: command_and_control
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats count min(_time) as firstTime max(_time) as lastTime from datamodel=Web
  where Web.http_method=PUT AND Web.uri_path="*.session" AND (Web.status=201 OR Web.status=409)
  by Web.src, Web.dest, Web.http_user_agent, Web.uri_path, Web.status | `drop_dm_object_name("Web")`
  | rex field=uri_path "/(?<filename>[^/]+)\.session$" | eval severity="High" | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `tomcat_session_file_upload_attempt_filter`'
explanation: This detection identifies potential exploitation of CVE-2025-24813 in
  Apache Tomcat through the initial stage of the attack. This first phase occurs when
  an attacker attempts to upload a malicious serialized Java object with a .session
  file extension via an HTTP PUT request. When successful, these uploads typically
  result in HTTP status codes 201 (Created) or 409 (Conflict) and create the foundation
  for subsequent deserialization attacks by placing malicious content in a location
  where Tomcat's session management can access it.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a1d8f5c3-9b7e-4f2d-8c51-3bca5e672410/
indicators:
- type: data_source
  value: Nginx Access
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Some legitimate applications might use PUT requests to create .session
    files, especially in custom implementations that leverage Tomcat's session persistence
    mechanism. Verify if the detected activity is part of a normal application flow
    or if it correlates with other suspicious behavior, such as subsequent GET requests
    with manipulated JSESSIONID cookies.
  mitigation: Review context and user activity
