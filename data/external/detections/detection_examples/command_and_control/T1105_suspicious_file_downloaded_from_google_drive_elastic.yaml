    data processing tasks might be flagged. Identify these scripts and whitelist their
    associated processes or command lines to prevent unnec'
  mitigation: Review investigation guide for details
references:
- https://intelligence.abnormalsecurity.com/blog/google-drive-matanbuchus-malware
