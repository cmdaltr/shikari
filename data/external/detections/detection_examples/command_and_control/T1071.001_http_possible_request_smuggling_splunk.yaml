technique_id: T1071.001
technique_name: HTTP Possible Request Smuggling
tactic: command_and_control
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`suricata` (http.request_headers{}.name="*Content-Length*" http.request_headers{}.name="*Transfer-Encoding*")
  OR (http.request_headers{}.name="*Content-Length*" http.request_headers{}.value="*Transfer-Encoding*")
  OR (http.request_headers{}.value="*Content-Length*" http.request_headers{}.name="*Transfer-Encoding*")
  OR (http.request_headers{}.name="*Content-Length*" http.request_headers{}.value="0")
  | rename dest_ip as dest | rex field=_raw "request_headers.:\[(?<headers>.*)\]"
  | stats count min(_time) as firstTime max(_time) as lastTime by dest, dest_port,
  src_ip, http.url, http.http_method, http.http_user_agent, http.protocol, http.status,
  headers | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `http_possible_request_smuggling_filter`'
explanation: HTTP request smuggling is a technique for interfering with the way a
  web site processes sequences of HTTP requests that are received from one or more
  users. Request smuggling vulnerabilities are often critical in nature, allowing
  an attacker to bypass security controls, gain unauthorized access to sensitive data,
  and directly compromise other application users. This detection identifies a common
  request smuggling technique of using both Content-Length and Transfer-Encoding headers
  to cause a parsing confusion between the frontend and backend.
source: Splunk Security Content
