technique_id: T1204.003
technique_name: AWS ECR Container Upload Unknown User
tactic: command_and_control
platform: Splunk
fidelity_score: 0.85
validated: true
query: '`cloudtrail` eventSource=ecr.amazonaws.com eventName=PutImage NOT `aws_ecr_users`
  | rename requestParameters.* as * | rename repositoryName AS image | rename user_name
  as user | stats count min(_time) as firstTime max(_time) as lastTime by signature
  user user_agent src vendor_account vendor_region vendor_product image | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_ecr_container_upload_unknown_user_filter`'
explanation: The following analytic detects the upload of a new container image to
  AWS Elastic Container Registry (ECR) by an unknown user. It leverages AWS CloudTrail
  logs to identify `PutImage` events from the ECR service, filtering out known users.
  This activity is significant because container uploads should typically be performed
  by a limited set of authorized users. If confirmed malicious, this could indicate
  unauthorized access, potentially leading to the deployment of malicious containers,
  data exfiltration, or further compromise of the AWS environment.
