technique_id: T1195.002
technique_name: SUNBURST Command and Control Activity
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "network where host.os.type == \"windows\" and event.type == \"protocol\" and\
  \ network.protocol == \"http\" and\n  process.name : (\"ConfigurationWizard.exe\"\
  ,\n                  \"NetFlowService.exe\",\n                  \"NetflowDatabaseMaintenance.exe\"\
  ,\n                  \"SolarWinds.Administration.exe\",\n                  \"SolarWinds.BusinessLayerHost.exe\"\
  ,\n                  \"SolarWinds.BusinessLayerHostx64.exe\",\n                \
  \  \"SolarWinds.Collector.Service.exe\",\n                  \"SolarwindsDiagnostics.exe\"\
  ) and\n  (\n    (\n      (http.request.body.content : \"*/swip/Upload.ashx*\" and\
  \ http.request.body.content : (\"POST*\", \"PUT*\")) or\n      (http.request.body.content\
  \ : (\"*/swip/SystemDescription*\", \"*/swip/Events*\") and http.request.body.content\
  \ : (\"GET*\", \"HEAD*\"))\n    ) and\n    not http.request.body.content : \"*solarwinds.com*\"\
  \n  )"
explanation: 'The malware known as SUNBURST targets the SolarWind''s Orion business
  software for command and control. This rule detects

  post-exploitation command and control activity of the SUNBURST backdoor.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/22599847-5d13-48cb-8872-5796fee8692b.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: "False positive analysis\n\n- This activity should not happen legitimately.\
    \ The security team should address any potential benign true positive (B-TP),\
    \ as this configuration can put the environment at risk.\n\n### Response and remediation\n\
    \n- Initiate the incident response process based on the outcome of the triage.\n\
    - Isolate the involved host to prevent further post-compromise behavior.\n- If\
    \ the triage identified malware, search the environment for additional compromised\
    \ hosts.\n  - Implement temporar"
  mitigation: Review investigation guide for details
references:
- https://www.fireeye.com/blog/threat-research/2020/12/evasive-attacker-leverages-solarwinds-supply-chain-compromises-with-sunburst-backdoor.html
has_investigation_guide: true
