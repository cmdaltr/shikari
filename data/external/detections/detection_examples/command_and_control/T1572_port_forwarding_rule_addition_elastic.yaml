technique_id: T1572
technique_name: Port Forwarding Rule Addition
tactic: command_and_control
platform: Elastic
fidelity_score: 0.9
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.path : \"*\\\\SYSTEM\\\\*ControlSet*\\\\Services\\\\PortProxy\\\\v4tov4\\\
  \\*\" and registry.data.strings != null"
explanation: 'Identifies the creation of a new port forwarding rule. An adversary
  may abuse this technique to bypass network

  segmentation restrictions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3535c8bb-3bd5-40f4-ae32-b7cd589d5372.toml
