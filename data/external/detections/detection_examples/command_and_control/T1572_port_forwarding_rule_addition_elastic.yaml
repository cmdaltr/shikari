false_positives:
- description: 'False positive analysis


    - This mechanism can be used legitimately. Analysts can dismiss the alert if the
    Administrator is aware of the activity and there are justifications for this configuration.

    - If this rule is noisy in your environment due to expected activity, consider
    adding exceptions — preferably with a combination of user and command line conditions.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Delete the port forwarding'
  mitigation: Review investigation guide for details
