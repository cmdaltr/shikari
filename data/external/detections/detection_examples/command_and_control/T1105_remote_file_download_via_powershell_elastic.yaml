technique_id: T1105
technique_name: Remote File Download via PowerShell
tactic: command_and_control
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by process.entity_id with maxspan=30s\n[network where host.os.type\
  \ == \"windows\" and \n  process.name : (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\"\
  ) and\n  network.protocol == \"dns\" and\n  not dns.question.name : (\n        \"\
  *.microsoft.com\", \"*.azureedge.net\", \"*.powershellgallery.com\", \"*.windowsupdate.com\"\
  ,\n        \"metadata.google.internal\", \"dist.nuget.org\", \"artifacts.elastic.co\"\
  , \"*.digicert.com\",\n        \"*.chocolatey.org\", \"outlook.office365.com\",\
  \ \"cdn.oneget.org\", \"ci.dot.net\",\n        \"packages.icinga.com\", \"login.microsoftonline.com\"\
  , \"*.gov\", \"*.azure.com\", \"*.python.org\",\n        \"dl.google.com\", \"sensor.cloud.tenable.com\"\
  , \"*.azurefd.net\", \"*.office.net\", \"*.anac*\",\n        \"aka.ms\", \"dot.net\"\
  , \"*.visualstudio.com\", \"*.local\") and\n  not user.id == \"S-1-5-18\" and\n\
  \  /* Filter out NetBIOS/LLMNR-style names (e.g. host, localhost, etc.) */\n  dns.question.name\
  \ regex \"\"\".*\\.[a-zA-Z]{2,5}\"\"\"]\n[file where host.os.type == \"windows\"\
  \ and event.type == \"creation\" and\n  process.name : \"powershell.exe\" and \n\
  \  (file.extension : (\"exe\", \"dll\", \"ps1\", \"bat\") or file.Ext.header_bytes\
  \ : \"4d5a*\") and\n  not file.name : \"__PSScriptPolicy*.ps1\" and\n  not file.path\
  \ : (\n        \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\????????.dll\"\
  ,\n        \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\*\\\\????????.dll\"\
  ,\n        \"?:\\\\Windows\\\\TEMP\\\\ansible-tmp-*\\\\AnsiballZ*.ps1\"\n  ) and\n\
  \  not user.id == \"S-1-5-18\"]"
explanation: Identifies powershell.exe being used to download an executable file from
  an untrusted remote destination.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/33f306e8-417c-411b-965c-c2812d6d3f4d.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Administrators can use PowerShell legitimately to download executable and script
    files. Analysts can dismiss the alert if the Administrator is aware of the activity
    and the triage has not identified suspicious or malicious files.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - If the triage identified malware, search the environment for'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
