technique_id: T1105
technique_name: Remote File Copy via TeamViewer
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.type == \"creation\" and\
  \ process.name : \"TeamViewer.exe\" and\n  file.extension : (\"exe\", \"dll\", \"\
  scr\", \"com\", \"bat\", \"ps1\", \"vbs\", \"vbe\", \"js\", \"wsh\", \"hta\") and\n\
  \  not \n  (\n    file.path : (\n      \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\\
  Microsoft\\\\Windows\\\\INetCache\\\\*.js\",\n      \"?:\\\\Users\\\\*\\\\AppData\\\
  \\Local\\\\Temp\\\\TeamViewer\\\\update.exe\",\n      \"?:\\\\Users\\\\*\\\\AppData\\\
  \\Local\\\\Temp\\\\?\\\\TeamViewer\\\\update.exe\",\n      \"?:\\\\Users\\\\*\\\\\
  AppData\\\\Local\\\\TeamViewer\\\\CustomConfigs\\\\???????\\\\TeamViewer_Resource_??.dll\"\
  ,\n      \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\TeamViewer\\\\CustomConfigs\\\
  \\???????\\\\TeamViewer*.exe\"\n    ) and process.code_signature.trusted == true\n\
  \  )"
explanation: Identifies an executable or script file remotely downloaded via a TeamViewer
  transfer session.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b25a7df2-120a-4db2-bd3f-3e4b86b24bee.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This mechanism can be used legitimately. Analysts can dismiss the alert if the
    company relies on TeamViewer to conduct remote access and the triage has not identified
    suspicious or malicious files.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - If the triage identified malware, search the environment for additional compromised
    hosts.'
  mitigation: Review investigation guide for details
references:
- http://web.archive.org/web/20230329160957/https://blog.menasec.net/2019/11/hunting-for-suspicious-use-of.html
has_investigation_guide: true
risk_score: 47
