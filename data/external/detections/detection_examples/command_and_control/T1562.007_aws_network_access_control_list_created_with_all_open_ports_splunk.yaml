technique_id: T1562.007
technique_name: AWS Network Access Control List Created with All Open Ports
tactic: command_and_control
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName=CreateNetworkAclEntry OR eventName=ReplaceNetworkAclEntry
  requestParameters.ruleAction=allow requestParameters.egress=false requestParameters.aclProtocol=-1
  | append [search `cloudtrail` eventName=CreateNetworkAclEntry OR eventName=ReplaceNetworkAclEntry
  requestParameters.ruleAction=allow requestParameters.egress=false requestParameters.aclProtocol!=-1
  | eval port_range=''requestParameters.portRange.to'' - ''requestParameters.portRange.from''
  | where port_range>1024] | fillnull | rename user_name as user | stats count min(_time)
  as firstTime max(_time) as lastTime by signature dest user user_agent src vendor_account
  vendor_region vendor_product requestParameters.ruleAction requestParameters.egress
  requestParameters.aclProtocol requestParameters.portRange.to requestParameters.portRange.from
  requestParameters.cidrBlock | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`
  | `aws_network_access_control_list_created_with_all_open_ports_filter`'
explanation: The following analytic detects the creation of AWS Network Access Control
  Lists (ACLs) with all ports open to a specified CIDR. It leverages AWS CloudTrail
  events, specifically monitoring for `CreateNetworkAclEntry` or `ReplaceNetworkAclEntry`
  actions with rules allowing all traffic. This activity is significant because it
  can expose the network to unauthorized access, increasing the risk of data breaches
  and other malicious activities. If confirmed malicious, an attacker could exploit
  this misconfiguration to gain unrestricted access to the network, potentially leading
  to data exfiltration, service disruption, or further compromise of the AWS environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/ada0f478-84a8-4641-a3f1-d82362d6bd75/
indicators:
- type: data_source
  value: AWS CloudTrail CreateNetworkAclEntry
  confidence: high
- type: data_source
  value: AWS CloudTrail ReplaceNetworkAclEntry
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: It's possible that an admin has created this ACL with all ports open
    for some legitimate purpose however, this should be scoped and not allowed in
    production environment.
  mitigation: Review context and user activity
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.007/aws_create_acl/aws_cloudtrail_events.json
