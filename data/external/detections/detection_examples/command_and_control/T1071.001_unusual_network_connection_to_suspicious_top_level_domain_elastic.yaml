technique_id: T1071.001
technique_name: Unusual Network Connection to Suspicious Top Level Domain
tactic: command_and_control
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.category : \"network\" and host.os.type : \"macos\" and event.type :\
  \ \"start\" and\ndestination.domain : (*.team or *.lol or *.kr or *.ke or *.nu or\
  \ *.space or \n                          *.capital or *.in or *.cfd or *.online\
  \ or *.ru or \n                          *.info or *.top or *.buzz or *.xyz or *.rest\
  \ or \n                          *.ml or *.cf or *.gq or *.ga or *.onion or \n \
  \                         *.network or *.monster or *.marketing or *.cyou or \n\
  \                          *.quest or *.cc or *.bar or *.click or *.cam or \n  \
  \                        *.surf or *.tk or *.shop or *.club or *.icu or \n     \
  \                     *.pw or *.ws or *.hair or *.mom or \n                    \
  \      *.beauty or *.boats or *.fun or *.life or \n                          *.store)"
explanation: This rule monitors for the unusual occurrence of outbound network connections
  to suspicious top level domains.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ffa676dc-09b0-11f0-94ba-b66272739ecb.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate business domains may use TLDs like .online or .store for marketing
    purposes. Review the domain''s reputation and business context before marking
    it as a threat.

    - Personal or small business websites might use TLDs such as .fun or .life. Verify
    the domain ownership and usage to determine if it is a false positive.

    - Some educational or community projects might use TLDs like .club or .space.
    Check the domain''s content and purpose to assess its legitimacy.

    - Exc'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
