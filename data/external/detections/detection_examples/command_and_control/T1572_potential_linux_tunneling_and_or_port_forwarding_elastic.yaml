technique_id: T1572
technique_name: Potential Linux Tunneling and/or Port Forwarding
tactic: command_and_control
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\") and (\n  (\n    //\
  \ gost & pivotnacci - spawned without process.parent.name\n    (process.name ==\
  \ \"gost\" and process.args : (\"-L*\", \"-C*\", \"-R*\")) or (process.name == \"\
  pivotnacci\")) or (\n    // ssh\n    (process.name == \"ssh\" and (process.args\
  \ in (\"-R\", \"-L\", \"-D\", \"-w\") and process.args_count >= 4 and \n     not\
  \ process.args : \"chmod\")) or\n    // sshuttle\n    (process.name == \"sshuttle\"\
  \ and process.args in (\"-r\", \"--remote\", \"-l\", \"--listen\") and process.args_count\
  \ >= 4) or\n    // socat\n    (process.name == \"socat\" and process.args : (\"\
  TCP4-LISTEN:*\", \"SOCKS*\") and process.args_count >= 3) or\n    // chisel\n  \
  \  (process.name : \"chisel*\" and process.args in (\"client\", \"server\")) or\n\
  \    // iodine(d), dnscat, hans, ptunnel-ng, ssf, 3proxy & ngrok \n    (process.name\
  \ in (\"iodine\", \"iodined\", \"dnscat\", \"hans\", \"hans-ubuntu\", \"ptunnel-ng\"\
  , \"ssf\", \"3proxy\", \"ngrok\"))\n  ) and process.parent.name in (\"bash\", \"\
  dash\", \"ash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\")\n)"
explanation: 'This rule monitors for a set of Linux utilities that can be used for
  tunneling and port forwarding. Attackers can

  leverage tunneling and port forwarding techniques to bypass network defenses, establish
  hidden communication channels,

  and gain unauthorized access to internal resources, facilitating data exfiltration,
  lateral movement, and remote

  control.'
