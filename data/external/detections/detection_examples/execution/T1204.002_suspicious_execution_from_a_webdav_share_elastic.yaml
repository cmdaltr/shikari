technique_id: T1204.002
technique_name: Suspicious Execution from a WebDav Share
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.name : (\"cmd.exe\", \"powershell.exe\", \"conhost.exe\", \"wscript.exe\"\
  , \"mshta.exe\", \"curl.exe\", \"msiexec.exe\", \"bitsadmin.exe\", \"net.exe\")\
  \ and\n process.command_line : (\"*trycloudflare.com*\", \"*@SSL\\\\*\", \"*\\\\\
  webdav\\\\*\", \"*\\\\DavWWWRoot\\\\*\", \"*\\\\\\\\*.*@8080\\\\*\", \"*\\\\\\\\\
  *.*@80\\\\*\", \"*\\\\\\\\*.*@8443\\\\*\", \"*\\\\\\\\*.*@443\\\\*\") and\n not\
  \ (process.name : \"cmd.exe\" and process.args : \"\\\\\\\\?\\\\UNC\\\\*.sharepoint.com@SSL\\\
  \\DavWWWRoot\\\\*\")"
explanation: 'Identifies attempt to execute Windows scripts from a remote WebDav Share.
  Adversaries may abuse this method to evade

  dropping malicious files to victim file system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ee7726cc-babc-4885-988c-f915173ac0c0.toml
