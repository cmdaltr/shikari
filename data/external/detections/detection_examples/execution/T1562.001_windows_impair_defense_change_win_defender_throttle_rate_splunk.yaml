technique_id: T1562.001
technique_name: Windows Impair Defense Change Win Defender Throttle Rate
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime FROM datamodel=Endpoint.Registry where Registry.registry_path= "*\\Windows
  Defender\\NIS\\Consumers\\IPS\\ThrottleDetectionEventsRate" by Registry.action Registry.dest
  Registry.process_guid Registry.process_id Registry.registry_hive Registry.registry_path
  Registry.registry_key_name Registry.registry_value_data Registry.registry_value_name
  Registry.registry_value_type Registry.status Registry.user Registry.vendor_product
  | `drop_dm_object_name(Registry)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_impair_defense_change_win_defender_throttle_rate_filter`'
explanation: The following analytic detects modifications to the ThrottleDetectionEventsRate
  registry setting in Windows Defender. It leverages data from the Endpoint.Registry
  datamodel to identify changes in the registry path related to Windows Defender's
  event logging rate. This activity is significant because altering the ThrottleDetectionEventsRate
  can reduce the frequency of logged detection events, potentially masking malicious
  activities. If confirmed malicious, this could allow an attacker to evade detection
  by decreasing the visibility of security events, thereby hindering incident response
  and forensic investigations.
