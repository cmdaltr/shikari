false_positives:
- description: Legitimate PowerShell commands that use hidden windows for automation
    tasks may trigger this detection. The search specifically looks for patterns typical
    of FakeCAPTCHA campaigns. You may need to add additional exclusions for legitimate
    administrative activities in your environment by modifying the filter macro.
  mitigation: Review context and user activity
