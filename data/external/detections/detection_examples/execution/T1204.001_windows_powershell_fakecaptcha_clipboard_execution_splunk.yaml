technique_id: T1204.001
technique_name: Windows PowerShell FakeCAPTCHA Clipboard Execution
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime FROM datamodel=Endpoint.Processes where `process_powershell` AND Processes.process="*-w*h*"
  AND ( (Processes.process IN ("*robot*", "*captcha*", "*verify*", "*security check*",
  "*complete verification*")) OR ( (Processes.process IN ("*iwr *", "*Invoke-WebRequest*",
  "*wget *", "*curl *", "*Net.WebClient*", "*DownloadString*", "*[Convert]::FromBase64String*"))
  AND (Processes.process IN ("*iex*", "*Invoke-Expression*")) AND (Processes.process
  IN ("*click*", "*verify*", "*check*", "*human*", "*bot*", "*token*", "*challenge*"))
  ) OR ( Processes.process="*clipboard*" AND Processes.process="*iex*" AND (Processes.process="*FromBase64String*"
  OR Processes.process="*decode*") ) ) by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_powershell_fakecaptcha_clipboard_execution_filter`'
explanation: This detection identifies potential FakeCAPTCHA/ClickFix clipboard hijacking
  campaigns by looking for PowerShell execution with hidden window parameters and
  distinctive strings related to fake CAPTCHA verification. These campaigns use social
  engineering to trick users into pasting malicious PowerShell commands from their
  clipboard, typically delivering information stealers or remote access trojans.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/d81d4d3d-76b5-4f21-ab51-b17d5164c106/
