  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Corporate applications that generate .url files for legitimate purposes may
    trigger alerts. Identify these applications and create exceptions for their processes
    to prevent unnecessary alerts.

    - Automated scripts or system management tools that download .url files as part
    of routine operations can be mistaken for threats. Review these tools and whitelist
    their activities if they are verified as safe.

    - User-initiated downloads from trusted internal web portals might be'
  mitigation: Review investigation guide for details
