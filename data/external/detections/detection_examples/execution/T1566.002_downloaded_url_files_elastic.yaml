technique_id: T1566.002
technique_name: Downloaded URL Files
tactic: execution
platform: Elastic
fidelity_score: 0.88
validated: true
query: "file where host.os.type == \"windows\" and event.type == \"creation\" and\
  \ file.extension == \"url\"\n   and file.Ext.windows.zone_identifier == 3"
explanation: 'Identifies .url shortcut files downloaded from outside the local network.
  These shortcut files are commonly used in

  phishing campaigns.'
source: Elastic Detection Rules
