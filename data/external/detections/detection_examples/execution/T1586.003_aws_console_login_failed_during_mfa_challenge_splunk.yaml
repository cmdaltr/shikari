technique_id: T1586.003
technique_name: AWS Console Login Failed During MFA Challenge
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName= ConsoleLogin errorMessage="Failed authentication"
  additionalEventData.MFAUsed = "Yes" | rename user_name as user | stats count min(_time)
  as firstTime max(_time) as lastTime by signature dest user user_agent src vendor_account
  vendor_region vendor_product additionalEventData.MFAUsed errorMessage | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_console_login_failed_during_mfa_challenge_filter`'
explanation: The following analytic identifies failed authentication attempts to the
  AWS Console during the Multi-Factor Authentication (MFA) challenge. It leverages
  AWS CloudTrail logs, specifically the `additionalEventData` field, to detect when
  MFA was used but the login attempt still failed. This activity is significant as
  it may indicate an adversary attempting to access an account with compromised credentials
  but being thwarted by MFA. If confirmed malicious, this could suggest an ongoing
  attempt to breach the account, potentially leading to unauthorized access and further
  attacks if MFA is bypassed.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/55349868-5583-466f-98ab-d3beb321961e/
indicators:
- type: data_source
  value: AWS CloudTrail ConsoleLogin
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate users may miss to reply the MFA challenge within the time
    window or deny it by mistake.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1621/
- https://aws.amazon.com/what-is/mfa/
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1621/aws_failed_mfa/cloudtrail.json
