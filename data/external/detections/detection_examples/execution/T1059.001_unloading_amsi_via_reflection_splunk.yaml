  value: Powershell Script Block Logging 4104
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Potential for some third party applications to disable AMSI upon invocation.
    Filter as needed.
  mitigation: Review context and user activity
