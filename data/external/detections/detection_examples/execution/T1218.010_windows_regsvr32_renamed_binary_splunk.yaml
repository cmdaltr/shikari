technique_id: T1218.010
technique_name: Windows Regsvr32 Renamed Binary
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name != regsvr32.exe
  AND Processes.original_file_name=regsvr32.exe by Processes.action Processes.dest
  Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_regsvr32_renamed_binary_filter`'
explanation: The following analytic identifies instances where the regsvr32.exe binary
  has been renamed and executed. This detection leverages Endpoint Detection and Response
  (EDR) data, specifically focusing on the original filename metadata. Renaming regsvr32.exe
  is significant as it can be an evasion technique used by attackers to bypass security
  controls. If confirmed malicious, this activity could allow an attacker to execute
  arbitrary DLLs, potentially leading to code execution, privilege escalation, or
  persistence within the environment.
