technique_id: T1586.003
technique_name: AWS Credential Access Failed Login
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName = ConsoleLogin errorMessage="Failed authentication"
  | rename user_name as user | stats count min(_time) as firstTime max(_time) as lastTime
  by signature dest user user_agent src vendor_account vendor_region vendor_product
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `aws_credential_access_failed_login_filter`'
explanation: The following analytic identifies unsuccessful login attempts to the
  AWS Management Console using a specific user identity. It leverages AWS CloudTrail
  logs to detect failed authentication events associated with the AWS ConsoleLogin
  action. This activity is significant for a SOC because repeated failed login attempts
  may indicate a brute force attack or unauthorized access attempts. If confirmed
  malicious, an attacker could potentially gain access to AWS account services and
  resources, leading to data breaches, resource manipulation, or further exploitation
  within the AWS environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a19b354d-0d7f-47f3-8ea6-1a7c36434968/
indicators:
- type: data_source
  value: AWS CloudTrail ConsoleLogin
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Users may genuinely mistype or forget the password.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1110/001/
validation:
