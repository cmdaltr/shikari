technique_id: T1041
technique_name: Windows Exfiltration Over C2 Via Invoke RestMethod
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`powershell` EventCode=4104 ScriptBlockText = "*Invoke-RestMethod *" AND ScriptBlockText
  = "* -Uri *" AND ScriptBlockText = "* -Method *" AND ScriptBlockText = "* Post *"
  AND ScriptBlockText = "* -InFile *" | fillnull | stats count min(_time) as firstTime
  max(_time) as lastTime by dest signature signature_id user_id vendor_product EventID
  Guid Opcode Name Path ProcessID ScriptBlockId ScriptBlockText | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `windows_exfiltration_over_c2_via_invoke_restmethod_filter`'
explanation: The following analytic detects potential data exfiltration using PowerShell's
  Invoke-RestMethod. It leverages PowerShell Script Block Logging to identify scripts
  that attempt to upload files via HTTP POST requests. This activity is significant
  as it may indicate an attacker is exfiltrating sensitive data, such as desktop screenshots
  or files, to an external command and control (C2) server. If confirmed malicious,
  this could lead to data breaches, loss of sensitive information, and further compromise
  of the affected systems. Immediate investigation is recommended to determine the
  intent and scope of the activity.
