technique_id: T1059
technique_name: Installation of WSL Kali-Linux
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: eca8ae39-5c3c-4321-b538-9e64fe25822e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_wsl_*\n\
  selection_wsl_img:\n- Image|endswith: \\wsl.exe\n- OriginalFileName: wsl\nselection_wsl_install:\n\
  \  CommandLine|contains:\n  - ' --install '\n  - ' -i '\nselection_wsl_kali:\n \
  \ CommandLine|contains: kali\n"
explanation: 'Detects installation of Kali Linux distribution through Windows Subsystem
  for Linux (WSL).

  Attackers may use Kali Linux WSL to leverage its penetration testing tools and capabilities
  for malicious purposes.

  '
false_positives:
- Legitimate installation or usage of Kali Linux WSL by administrators or security
  teams
references:
- https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
- https://learn.microsoft.com/en-us/windows/wsl/install
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_wsl_img:
  - Image|endswith: \wsl.exe
  - OriginalFileName: wsl
  selection_wsl_install:
    CommandLine|contains:
    - ' --install '
    - ' -i '
  selection_wsl_kali:
    CommandLine|contains: kali
  condition: all of selection_wsl_*
