  value: CrowdStrike ProcessRollup2
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Legitimate applications installed via the Microsoft Store or MSIX packages
    may execute PowerShell scripts from the WindowsApps directory as part of their
    normal operation. Verify if the MSIX package is from a trusted source and signed
    by a trusted publisher before taking action. Look for additional suspicious activities
    like network connections to unknown domains or execution of known malicious payloads.
  mitigation: Review context and user activity
