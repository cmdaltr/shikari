technique_id: T1059
technique_name: Potential Netcat Reverse Shell Execution
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 7f734ed0-4f47-46c0-837f-6ee62505abd9
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_flags:\n  CommandLine|contains:\n  - ' -c '\n  - ' -e '\nselection_nc:\n\
  \  Image|endswith:\n  - /nc\n  - /ncat\nselection_shell:\n  CommandLine|contains:\n\
  \  - ' ash'\n  - ' bash'\n  - ' bsh'\n  - ' csh'\n  - ' ksh'\n  - ' pdksh'\n  -\
  \ ' sh'\n  - ' tcsh'\n  - /bin/ash\n  - /bin/bash\n  - /bin/bsh\n  - /bin/csh\n\
  \  - /bin/ksh\n  - /bin/pdksh\n  - /bin/sh\n  - /bin/tcsh\n  - /bin/zsh\n  - $IFSash\n\
  \  - $IFSbash\n  - $IFSbsh\n  - $IFScsh\n  - $IFSksh\n  - $IFSpdksh\n  - $IFSsh\n\
  \  - $IFStcsh\n  - $IFSzsh\n"
explanation: Detects execution of netcat with the "-e" flag followed by common shells.
  This could be a sign of a potential reverse shell setup.
false_positives:
- Unlikely
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
