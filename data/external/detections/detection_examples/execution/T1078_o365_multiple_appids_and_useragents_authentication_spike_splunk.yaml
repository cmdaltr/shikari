technique_id: T1078
technique_name: O365 Multiple AppIDs and UserAgents Authentication Spike
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`o365_management_activity` Workload=AzureActiveDirectory (Operation=UserLoggedIn
  OR Operation=UserLoginFailed) | bucket span=5m _time | stats dc(_raw) as failed_attempts
  dc(ApplicationId) as unique_app_ids dc(UserAgent) as unique_user_agents values(ApplicationId)
  values(OS) values(signature) as signature by _time user src vendor_account vendor_product
  dest | where failed_attempts > 5 and unique_user_agents > 5 and unique_app_ids >
  2 | `o365_multiple_appids_and_useragents_authentication_spike_filter`'
explanation: The following analytic identifies unusual authentication activity in
  an O365 environment, where a single user account experiences more than 8 authentication
  attempts using 3 or more unique application IDs and over 5 unique user agents within
  a short timeframe. It leverages O365 audit logs, focusing on authentication events
  and applying statistical thresholds. This behavior is significant as it may indicate
  an adversary probing for multi-factor authentication weaknesses. If confirmed malicious,
  it suggests a compromised account, potentially leading to unauthorized access, privilege
  escalation, and data exfiltration. Early detection is crucial to prevent further
  exploitation.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/66adc486-224d-45c1-8e4d-9e7eeaba988f/
indicators:
- type: data_source
  value: O365 UserLoggedIn
  confidence: high
- type: data_source
  value: O365 UserLoginFailed
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Rapid authentication from the same user using more than 5 different
    user agents and 3 application IDs is highly unlikely under normal circumstances.
    However, there are potential scenarios that could lead to false positives.
  mitigation: Review context and user activity
