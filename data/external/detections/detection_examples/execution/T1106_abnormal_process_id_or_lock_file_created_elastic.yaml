technique_id: T1106
technique_name: Abnormal Process ID or Lock File Created
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "host.os.type:linux and event.category:file and event.action:(creation or file_create_event)\
  \ and\nfile.extension:(pid or lock or reboot) and file.path:(/var/run/* or /run/*)\
  \ and (\n  (process.name : (\n    bash or dash or sh or tcsh or csh or zsh or ksh\
  \ or fish or ash or touch or nano or vim or vi or editor or mv or cp)\n  ) or (\n\
  \  process.executable : (\n    ./* or /tmp/* or /var/tmp/* or /dev/shm/* or /var/run/*\
  \ or /boot/* or /srv/* or /run/*\n  ))\n) and not (\n  process.executable : (\n\
  \  /tmp/newroot/* or /run/containerd/* or /run/k3s/containerd/* or /run/k0s/container*\
  \ or /snap/* or /vz/* or\n  /var/lib/docker/* or /etc/*/universal-hooks/pkgs/mysql-community-server/*\
  \ or /var/lib/snapd/* or /etc/rubrik/* or\n  /run/udev/data/*\n  ) or\n  process.name\
  \ : (\n    go or git or containerd* or snap-confine or cron or crond or sshd or\
  \ unattended-upgrade or vzctl or ifup or\n    rpcbind or runc or gitlab-runner-helper\
  \ or elastic-agent or metricbeat or redis-server or libvirt_leaseshelper or\n  \
  \  s6-ipcserver-socketbinder or xinetd or libvirtd or veeamdeploymentsvc  or dnsmasq\
  \ or virtlogd or lynis or\n    veeamtransport\n  ) or\n  file.name : (\n    jem.*.pid\
  \ or lynis.pid or redis.pid or yum.pid or MFS.pid or jenkins.pid or nvmupdate.pid\
  \ or openlitespeed.pid or\n    rhnsd.pid\n  ) or\n  file.path : (/run/containerd/*\
  \ or /var/run/docker/containerd/* or /var/run/jem*.pid)\n)"
explanation: 'Identifies the creation of a Process ID (PID), lock or reboot file created
  in temporary file storage paradigm (tmpfs)

  directory /var/run. On Linux, the PID files typically hold the process ID to track
  previous copies running and manage

  other tasks. Certain Linux malware use the /var/run directory for holding data,
  executables and other tasks, disguising

  itself or these files as legitimate PID files.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/cac91072-d165-11ec-a764-f661ea17fbce.toml
