false_positives:
- description: 'False positive analysis


    - False positives can appear if the PID file is legitimate and holding a process
    ID as intended. If the PID file is an executable or has a file size that''s larger
    than 10 bytes, it should be ruled suspicious.

    - If this activity is expected and noisy in your environment, consider adding
    exceptions — preferably with a combination of file name and process executable
    conditions.


    ### Response and remediation


