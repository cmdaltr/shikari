technique_id: T1059
technique_name: Shell Execution via Apple Scripting
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id with maxspan=10s\n [process where host.os.type == \"macos\"\
  \ and event.type in (\"start\", \"process_started\") and event.action == \"exec\"\
  \ and process.name == \"osascript\" and process.args == \"-e\"] by process.entity_id\n\
  \ [process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and process.name in (\"sh\", \"bash\", \"zsh\") and process.args == \"-c\" and\
  \ process.command_line : (\"*curl*\", \"*pbpaste*\", \"*http*\", \"*chmod*\", \"\
  *nscurl*\")] by process.parent.entity_id"
explanation: 'Identifies the execution of the shell process (sh) via scripting (JXA
  or AppleScript). Adversaries may use the

  doShellScript functionality in JXA or do shell script in AppleScript to execute
  system commands.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d461fac0-43e8-49e2-85ea-3a58fe120b4f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative scripts may trigger the rule if they use AppleScript
    or JXA to automate tasks involving shell commands. To manage this, identify and
    whitelist these scripts by their specific command patterns or execution context.

    - Software updates or legitimate application installations might execute shell
    commands through AppleScript, appearing suspicious. Monitor and document these
    activities, and create exceptions for known update processes.

    - Development to'
  mitigation: Review investigation guide for details
references:
- https://developer.apple.com/library/archive/technotes/tn2065/_index.html
- https://objectivebythesea.com/v2/talks/OBTS_v2_Thomas.pdf
has_investigation_guide: true
risk_score: 47
