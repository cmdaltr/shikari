technique_id: T1185
technique_name: O365 Concurrent Sessions From Different Ips
tactic: execution
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '`o365_management_activity` Workload=AzureActiveDirectory Operation=UserLoggedIn
  | fillnull | stats count min(_time) as firstTime max(_time) as lastTime values(src)
  as src by signature dest user vendor_account vendor_product SessionId | where mvcount(src)
  > 1 | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` |
  `o365_concurrent_sessions_from_different_ips_filter`'
explanation: The following analytic identifies user sessions in Office 365 accessed
  from multiple IP addresses, indicating potential adversary-in-the-middle (AiTM)
  phishing attacks. It detects this activity by analyzing Azure Active Directory logs
  for 'UserLoggedIn' operations and flags sessions with more than one associated IP
  address. This behavior is significant as it suggests unauthorized concurrent access,
  which is uncommon in normal usage. If confirmed malicious, the impact could include
  data theft, account takeover, and the launching of internal phishing campaigns,
  posing severe risks to organizational security.
source: Splunk Security Content
