technique_id: T1053.005
technique_name: Persistence and Execution at Scale via GPO Scheduled Task
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: a8f29a7b-b137-4446-80a0-b804272f3da2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_5136:\n\
  \  AttributeLDAPDisplayName:\n  - gPCMachineExtensionNames\n  - gPCUserExtensionNames\n\
  \  AttributeValue|contains:\n  - CAB54552-DEEA-4691-817E-ED4A4D1AFC72\n  - AADCED64-746C-4633-A97C-D61349046527\n\
  \  EventID: 5136\nselection_5145:\n  AccessList|contains:\n  - WriteData\n  - '%%4417'\n\
  \  EventID: 5145\n  RelativeTargetName|endswith: ScheduledTasks.xml\n  ShareName|endswith:\
  \ \\SYSVOL\n"
explanation: Detect lateral movement using GPO scheduled task, usually used to deploy
  ransomware at scale
false_positives:
- If the source IP is not localhost then it's super suspicious, better to monitor
  both local and remote changes to GPO scheduled tasks.
references:
- https://twitter.com/menasec1/status/1106899890377052160
- https://www.secureworks.com/blog/ransomware-as-a-distraction
- https://www.elastic.co/guide/en/security/7.17/prebuilt-rule-0-16-1-scheduled-task-execution-at-scale-via-gpo.html
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.lateral-movement
- attack.t1053.005
logsource:
  product: windows
  service: security
  definition: The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure
detection:
  selection_5136:
    EventID: 5136
    AttributeLDAPDisplayName:
    - gPCMachineExtensionNames
    - gPCUserExtensionNames
    AttributeValue|contains:
    - CAB54552-DEEA-4691-817E-ED4A4D1AFC72
    - AADCED64-746C-4633-A97C-D61349046527
  selection_5145:
    EventID: 5145
    ShareName|endswith: \SYSVOL
    RelativeTargetName|endswith: ScheduledTasks.xml
    AccessList|contains:
    - WriteData
    - '%%4417'
  condition: 1 of selection_*
