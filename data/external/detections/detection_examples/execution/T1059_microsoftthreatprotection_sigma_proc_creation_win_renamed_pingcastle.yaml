technique_id: T1059
technique_name: Renamed PingCastle Binary Execution
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 2433a154-bb3d-42e4-86c3-a26bdac91c45
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_img:\n  Image|endswith:\n  - \\PingCastleReporting.exe\n\
  \  - \\PingCastleCloud.exe\n  - \\PingCastle.exe\nselection:\n- OriginalFileName:\n\
  \  - PingCastleReporting.exe\n  - PingCastleCloud.exe\n  - PingCastle.exe\n- CommandLine|contains:\n\
  \  - --scanner aclcheck\n  - --scanner antivirus\n  - --scanner computerversion\n\
  \  - --scanner foreignusers\n  - --scanner laps_bitlocker\n  - --scanner localadmin\n\
  \  - --scanner nullsession\n  - --scanner nullsession-trust\n  - --scanner oxidbindings\n\
  \  - --scanner remote\n  - --scanner share\n  - --scanner smb\n  - --scanner smb3querynetwork\n\
  \  - --scanner spooler\n  - --scanner startup\n  - --scanner zerologon\n- CommandLine|contains:\
  \ --no-enum-limit\n- CommandLine|contains|all:\n  - --healthcheck\n  - --level Full\n\
  - CommandLine|contains|all:\n  - --healthcheck\n  - '--server '\n"
explanation: Detects the execution of a renamed "PingCastle" binary based on the PE
  metadata fields.
false_positives:
- Unknown
references:
- https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
- https://www.pingcastle.com/documentation/scanner/
tags:
- attack.execution
- attack.t1059
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - OriginalFileName:
    - PingCastleReporting.exe
    - PingCastleCloud.exe
    - PingCastle.exe
  - CommandLine|contains:
    - --scanner aclcheck
    - --scanner antivirus
    - --scanner computerversion
    - --scanner foreignusers
    - --scanner laps_bitlocker
    - --scanner localadmin
    - --scanner nullsession
    - --scanner nullsession-trust
    - --scanner oxidbindings
    - --scanner remote
    - --scanner share
    - --scanner smb
    - --scanner smb3querynetwork
    - --scanner spooler
    - --scanner startup
    - --scanner zerologon
  - CommandLine|contains: --no-enum-limit
  - CommandLine|contains|all:
    - --healthcheck
    - --level Full
  - CommandLine|contains|all:
    - --healthcheck
    - '--server '
  filter_main_img:
    Image|endswith:
    - \PingCastleReporting.exe
    - \PingCastleCloud.exe
    - \PingCastle.exe
  condition: selection and not 1 of filter_main_*
