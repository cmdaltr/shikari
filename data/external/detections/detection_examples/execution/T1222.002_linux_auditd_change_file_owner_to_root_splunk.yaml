technique_id: T1222.002
technique_name: Linux Auditd Change File Owner To Root
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`linux_auditd` proctitle = "*chown *root*" | rename host as dest | stats count
  min(_time) as firstTime max(_time) as lastTime by proctitle dest | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `linux_auditd_change_file_owner_to_root_filter`'
explanation: The following analytic detects the use of the 'chown' command to change
  a file owner to 'root' on a Linux system. It leverages Linux Auditd telemetry, specifically
  monitoring command-line executions and process details. This activity is significant
  as it may indicate an attempt to escalate privileges by adversaries, malware, or
  red teamers. If confirmed malicious, this action could allow an attacker to gain
  root-level access, leading to full control over the compromised host and potential
  persistence within the environment.
source: Splunk Security Content
