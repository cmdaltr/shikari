technique_id: T1586.003
technique_name: ASL AWS Credential Access RDS Password reset
tactic: execution
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '`amazon_security_lake` api.operation=ModifyDBInstance OR api.operation=ModifyDBCluster
  | spath input=api.request.data | search masterUserPassword=* | fillnull | stats
  count min(_time) as firstTime max(_time) as lastTime by actor.user.uid api.operation
  api.service.name http_request.user_agent src_endpoint.ip actor.user.account.uid
  cloud.provider cloud.region api.request.data | rename actor.user.uid as user api.operation
  as action api.service.name as dest http_request.user_agent as user_agent src_endpoint.ip
  as src actor.user.account.uid as vendor_account cloud.provider as vendor_product
  cloud.region as vendor_region | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  |`asl_aws_credential_access_rds_password_reset_filter`'
explanation: The following analytic detects the resetting of the master user password
  for an Amazon RDS DB instance. It leverages AWS CloudTrail logs from Amazon Security
  Lake to identify events where the `ModifyDBInstance` API call includes a new `masterUserPassword`
  parameter. This activity is significant because unauthorized password resets can
  grant attackers access to sensitive data stored in production databases, such as
  credit card information, PII, and healthcare data. If confirmed malicious, this
  could lead to data breaches, regulatory non-compliance, and significant reputational
  damage. Immediate investigation is required to determine the legitimacy of the password
  reset.
source: Splunk Security Content
