technique_id: T1098
technique_name: Windows AD DSRM Password Reset
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` min(_time) as _time from datamodel=Change
  where All_Changes.result_id="4794" AND All_Changes.result="set the Directory Services
  Restore Mode administrator password" by All_Changes.action, All_Changes.dest, All_Changes.src,
  All_Changes.user | `drop_dm_object_name(All_Changes)` | `windows_ad_dsrm_password_reset_filter`'
explanation: The following analytic detects attempts to reset the Directory Services
  Restore Mode (DSRM) administrator password on a Domain Controller. It leverages
  event code 4794 from the Windows Security Event Log, specifically looking for events
  where the DSRM password reset is attempted. This activity is significant because
  the DSRM account can be used similarly to a local administrator account, providing
  potential persistence for an attacker. If confirmed malicious, this could allow
  an attacker to maintain administrative access to the Domain Controller, posing a
  severe risk to the domain's security.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/d1ab841c-36a6-46cf-b50f-b2b04b31182a/
indicators:
- type: data_source
  value: Windows Event Log Security 4794
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Resetting the DSRM password for legitamate reasons, i.e. forgot the
    password. Disaster recovery. Deploying AD backdoor deliberately.
  mitigation: Review context and user activity
references:
