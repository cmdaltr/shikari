technique_id: T1505
technique_name: Windows Shell Process from CrushFTP
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count values(Processes.process_name)
  as process_name values(Processes.process) as process min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.parent_process_name=crushftpservice.exe
  AND `process_cmd` OR `process_powershell` by Processes.dest Processes.parent_process
  Processes.original_file_name Processes.user Processes.action Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_path
  Processes.process_exec Processes.process_guid Processes.process_hash Processes.process_id
  Processes.process_integrity_level Processes.process_path Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`|
  `windows_shell_process_from_crushftp_filter`'
explanation: The following analytic identifies instances where CrushFTP's service
  process (crushftpservice.exe) spawns shell processes like cmd.exe or powershell.exe.
  This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process creation events. This activity is significant because CrushFTP
  should not normally spawn interactive shell processes during regular operations.
  If confirmed malicious, this behavior could indicate successful exploitation of
  vulnerabilities like CVE-2025-31161, potentially allowing attackers to execute arbitrary
  commands with the privileges of the CrushFTP service.
