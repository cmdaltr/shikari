technique_id: T1098.002
technique_name: O365 Mailbox Folder Read Permission Assigned
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=Exchange (Operation=ModifyFolderPermissions
  OR Operation=AddFolderPermissions) Workload=Exchange object!=Calendar object!=Contacts
  object!=PersonMetadata | eval isReadRole=if(match(''Item.ParentFolder.MemberRights'',"(ReadAny)"),
  "true", "false") | rename UserId as user | stats count earliest(_time) as firstTime
  latest(_time) as lastTime by signature user object dest Item.ParentFolder.MemberUpn
  Item.ParentFolder.MemberRights src vendor_account vendor_product | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `o365_mailbox_folder_read_permission_assigned_filter`'
explanation: The following analytic identifies instances where read permissions are
  assigned to mailbox folders within an Office 365 environment. It leverages the `o365_management_activity`
  data source, specifically monitoring the `ModifyFolderPermissions` and `AddFolderPermissions`
  operations, while excluding Calendar, Contacts, and PersonMetadata objects. This
  activity is significant as unauthorized read permissions can lead to data exposure
  and potential information leakage. If confirmed malicious, an attacker could gain
  unauthorized access to sensitive emails, leading to data breaches and compromising
  the confidentiality of organizational communications.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/1435475e-2128-4417-a34f-59770733b0d5/
indicators:
- type: data_source
  value: O365 ModifyFolderPermissions
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Mailbox folder permissions may be configured for legitimate purposes,
    filter as needed.
  mitigation: Review context and user activity
