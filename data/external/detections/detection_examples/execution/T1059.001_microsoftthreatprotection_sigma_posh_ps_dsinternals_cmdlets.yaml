  \  - Get-ADSIAccount\n  - Get-AzureADUserEx\n  - Get-BootKey\n  - Get-KeyCredential\n\
  \  - Get-LsaBackupKey\n  - Get-LsaPolicy\n  - Get-SamPasswordPolicy\n  - Get-SysKey\n\
  \  - Get-SystemKey\n  - New-ADDBRestoreFromMediaScript\n  - New-ADKeyCredential\n\
  \  - New-ADNgcKey\n  - New-NTHashSet\n  - Remove-ADDBObject\n  - Save-DPAPIBlob\n\
  \  - Set-ADAccountPasswordHash\n  - Set-ADDBAccountPassword\n  - Set-ADDBBootKey\n\
  \  - Set-ADDBDomainController\n  - Set-ADDBPrimaryGroup\n  - Set-ADDBSysKey\n  -\
  \ Set-AzureADUserEx\n  - Set-LsaPolicy\n  - Set-SamAccountPasswordHash\n  - Set-WinUserPasswordHash\n\
  \  - Test-ADDBPasswordQuality\n  - Test-ADPasswordQuality\n  - Test-ADReplPasswordQuality\n\
  \  - Test-PasswordQuality\n  - Unlock-ADDBAccount\n  - Write-ADNgcKey\n  - Write-ADReplNgcKey\n"
explanation: 'Detects execution and usage of the DSInternals PowerShell module. Which
  can be used to perform what might be considered as suspicious activity such as dumping
  DPAPI backup keys or manipulating NTDS.DIT files.

  The DSInternals PowerShell Module exposes several internal features of Active Directory
  and Azure Active Directory. These include FIDO2 and NGC key auditing, offline ntds.dit
  file manipulation, password auditing, DC recovery from IFM backups and password
  hash calculation.

  '
false_positives:
- Legitimate usage of DSInternals for administration or audit purpose.
