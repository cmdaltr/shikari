technique_id: T1068
technique_name: OMIGOD SCX RunAsProvider ExecuteShellCommand
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 21541900-27a9-4454-9c4c-3f0a4240344a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains: /bin/sh\n  CurrentDirectory: /var/opt/microsoft/scx/tmp\n\
  \  LogonId: 0\n  User: root\n"
explanation: 'Rule to detect the use of the SCX RunAsProvider Invoke_ExecuteShellCommand
  to execute any UNIX/Linux command using the /bin/sh shell.

  SCXcore, started as the Microsoft Operations Manager UNIX/Linux Agent, is now used
  in a host of products including

  Microsoft Operations Manager, Microsoft Azure, and Microsoft Operations Management
  Suite.

  '
false_positives:
- Legitimate use of SCX RunAsProvider Invoke_ExecuteShellCommand.
references:
- https://www.wiz.io/blog/omigod-critical-vulnerabilities-in-omi-azure
- https://github.com/Azure/Azure-Sentinel/pull/3059
