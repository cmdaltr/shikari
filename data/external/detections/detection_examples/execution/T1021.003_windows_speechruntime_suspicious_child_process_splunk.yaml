technique_id: T1021.003
technique_name: Windows SpeechRuntime Suspicious Child Process
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where (Processes.parent_process_name="*SpeechRuntime.exe*")
  Processes.process IN ("*cmd.exe*","*powershell.exe*","*rundll32.exe*","*bitsadmin.exe*","*wmic.exe*","*cscript.exe*")
  by Processes.dest Processes.user Processes.original_file_name Processes.parent_process
  Processes.process_name Processes.process Processes.process_id Processes.parent_process_id
  Processes.parent_process_name action parent_process_exec parent_process_guid parent_process_path
  process_exec process_guid process_hash process_integrity_level process_path user_id
  vendor_product | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)`| `windows_speechruntime_suspicious_child_process_filter`'
explanation: SpeechRuntime is vulnerable to an attack that allows a user to run code
  on another user's session remotely and stealthily by exploiting a Windows COM class.
  When this class is invoked, it launches SpeechRuntime.exe in the context of the
  currently logged-on user. Because this COM class is susceptible to COM Hijacking,
  the attacker can alter the registry remotely to point to a malicious DLL. By dropping
  that DLL on the target system (e.g., via SMB) and triggering the COM object, the
  attacker causes the malicious DLL to load into SpeechRuntime.exe and executing under
  the user's context. This detection identifies suspicious child processes of SpeechRuntime.exe
  that could indicate abuse of this vulnerability.
