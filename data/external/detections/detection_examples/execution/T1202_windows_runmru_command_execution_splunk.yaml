  confidence: high
false_positives:
- description: This detection may generate a few false positives, such as legitimate
    software updates or legitimate system maintenance activities that modify the RunMRU
    key. However, the exclusion of MRUList value changes helps reduce the number of
    false positives by focusing only on actual command entries. Add any specific false
    positives to the built in filter to reduce findings as needed.
  mitigation: Review context and user activity
