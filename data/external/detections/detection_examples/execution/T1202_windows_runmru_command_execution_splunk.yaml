technique_id: T1202
technique_name: Windows RunMRU Command Execution
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Registry where Registry.registry_path="*\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU*"
  NOT Registry.registry_value_name="MRUList" NOT Registry.registry_value_data="unknown"
  by Registry.dest Registry.registry_value_data Registry.action Registry.process_guid
  Registry.process_id Registry.registry_key_name Registry.user Registry.registry_path
  Registry.registry_hive Registry.registry_value_name Registry.status Registry.vendor_product
  | `drop_dm_object_name(Registry)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_runmru_command_execution_filter`'
explanation: The following analytic detects modifications to the Windows RunMRU registry
  key, which stores a history of commands executed through the Run dialog box (Windows+R).
  It leverages Endpoint Detection and Response (EDR) telemetry to monitor registry
  events targeting this key. This activity is significant as malware often uses the
  Run dialog to execute malicious commands while attempting to appear legitimate.
  If confirmed malicious, this could indicate an attacker using indirect command execution
  techniques for defense evasion or persistence. The detection excludes MRUList value
  changes to focus on actual command entries.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a15aa1ab-2b79-467f-8201-65e0f32d5b1a/
indicators:
