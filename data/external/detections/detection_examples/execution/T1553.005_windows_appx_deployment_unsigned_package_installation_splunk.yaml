technique_id: T1553.005
technique_name: Windows AppX Deployment Unsigned Package Installation
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`wineventlog_appxdeploymentserver` EventCode=603 Flags="8388608" | stats count
  min(_time) as firstTime max(_time) as lastTime values(Path) as file_name values(CallingProcess)
  as CallingProcess by dvc EventCode Flags user_id | rename dvc as dest | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `windows_appx_deployment_unsigned_package_installation_filter`'
explanation: The following analytic detects attempts to install unsigned MSIX/AppX
  packages using the -AllowUnsigned parameter. This detection leverages Windows event
  logs from the AppXDeployment-Server, specifically focusing on EventID 603 which
  indicates the start of a deployment operation with specific deployment flags. The
  flag value 8388608 corresponds to the -AllowUnsigned option in PowerShell's Add-AppxPackage
  cmdlet. This activity is significant as adversaries have been observed leveraging
  unsigned MSIX packages to deliver malware, bypassing signature verification that
  would normally protect users from malicious packages. If confirmed malicious, this
  could allow attackers to execute arbitrary code, establish persistence, or deliver
  malware while evading traditional detection mechanisms.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/9b5e7c14-f8d2-4a3b-b1a7-e5c9f2a8d123/
indicators:
- type: data_source
  value: Windows Event Log AppXDeployment-Server 855
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Legitimate software development and testing activities may trigger
    this detection. Internal application development teams testing MSIX packages before
    signing or system administrators installing custom unsigned applications for business
    purposes may use the -AllowUnsigned parameter. Note that the -AllowUnsigned flag
    is only available on Windows 11 and later versions. Verify if the package installation
    is expected in your environment and if the calling process and user are authorized
    to install unsigned packages.
  mitigation: Review context and user activity
references:
- https://learn.microsoft.com/en-us/powershell/module/appx/add-appxpackage
