technique_id: T1059.001
technique_name: Windows PowerShell Script Block With Malicious String
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`powershell` ScriptBlockText=* EventCode=4104 | stats count min(_time) as
  firstTime max(_time) as lastTime list(ScriptBlockText) as command values(Guid) as
  Guid values(Opcode) as Opcode values(Name) as Name values(Path) as Path values(ProcessID)
  as ProcessID values(ScriptBlockId) as ScriptBlockId values(ScriptBlockText) as ScriptBlockText
  by dest signature signature_id user_id vendor_product | eval command = mvjoin(command,"\n")
  | lookup malicious_powershell_strings command | where isnotnull(match) | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `windows_powershell_script_block_with_malicious_string_filter`'
explanation: The following analytic detects the execution of multiple offensive toolkits
  and commands by leveraging PowerShell Script Block Logging (EventCode=4104). This
  method captures and logs the full command sent to PowerShell, allowing for the identification
  of suspicious activities including several well-known tools used for credential
  theft, lateral movement, and persistence. If confirmed malicious, this could lead
  to unauthorized access, privilege escalation, and potential compromise of sensitive
  information within the environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/0f09cedd-10f1-4b9f-bdea-7a8b06ea575d/
indicators:
