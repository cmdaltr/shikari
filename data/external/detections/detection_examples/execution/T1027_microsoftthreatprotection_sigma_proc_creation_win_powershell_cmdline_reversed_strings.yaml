technique_id: T1027
technique_name: Potential PowerShell Obfuscation Via Reversed Commands
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_encoded_keyword:\n  CommandLine|contains:\n\
  \  - ' -EncodedCommand '\n  - ' -enc '\nselection_cli:\n  CommandLine|contains:\n\
  \  - hctac\n  - kaerb\n  - dnammoc\n  - ekovn\n  - eliFd\n  - rahc\n  - etirw\n\
  \  - golon\n  - tninon\n  - eddih\n  - tpircS\n  - ssecorp\n  - llehsrewop\n  -\
  \ esnopser\n  - daolnwod\n  - tneilCbeW\n  - tneilc\n  - ptth\n  - elifotevas\n\
  \  - 46esab\n  - htaPpmeTteG\n  - tcejbO\n  - maerts\n  - hcaerof\n  - retupmoc\n\
  selection_img:\n- Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\n- OriginalFileName:\n\
  \  - PowerShell.EXE\n  - pwsh.dll\n"
explanation: Detects the presence of reversed PowerShell commands in the CommandLine.
  This is often used as a method of obfuscation by attackers
false_positives:
- Unlikely
references:
- https://2019.offzone.moscow/ru/report/hunting-for-powershell-abuses/
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=66
tags:
- attack.defense-evasion
- attack.t1027
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  selection_cli:
    CommandLine|contains:
    - hctac
    - kaerb
    - dnammoc
    - ekovn
    - eliFd
    - rahc
    - etirw
    - golon
    - tninon
    - eddih
    - tpircS
    - ssecorp
    - llehsrewop
    - esnopser
    - daolnwod
    - tneilCbeW
    - tneilc
    - ptth
    - elifotevas
    - 46esab
    - htaPpmeTteG
    - tcejbO
    - maerts
    - hcaerof
    - retupmoc
  filter_main_encoded_keyword:
    CommandLine|contains:
    - ' -EncodedCommand '
    - ' -enc '
  condition: all of selection_* and not 1 of filter_main_*
