query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - /bin/bash\n  - /bin/dash\n  - /bin/fish\n\
  \  - /bin/sh\n  - /bin/zsh\n  CommandLine|contains|all:\n  - ' -c '\n  - os.system(\n\
  selection_img:\n- Image|endswith:\n  - /python\n  - /python2\n  - /python3\n- Image|contains:\n\
  \  - /python2.\n  - /python3.\n"
explanation: 'Detects execution of inline Python code via the "-c" in order to call
  the "system" function from the "os" library, and spawn a shell.

  '
