technique_id: T1136.002
technique_name: Windows ESX Admins Group Creation via PowerShell
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`powershell` EventCode=4104 (ScriptBlockText="*New-ADGroup*" OR ScriptBlockText="*New-LocalGroup*")
  ScriptBlockText="*ESX Admins*" | fillnull | stats count min(_time) as firstTime
  max(_time) as lastTime by dest signature signature_id user_id vendor_product EventID
  Guid Opcode Name Path ProcessID ScriptBlockId ScriptBlockText | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `windows_esx_admins_group_creation_via_powershell_filter`'
explanation: This analytic detects attempts to create an "ESX Admins" group using
  PowerShell commands. This activity may indicate an attempt to exploit the VMware
  ESXi Active Directory Integration Authentication Bypass vulnerability (CVE-2024-37085).
  Attackers can use this method to gain unauthorized access to ESXi hosts by recreating
  the 'ESX Admins' group after its deletion from Active Directory.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/f48a5557-be06-4b96-b8e8-be563e387620/
indicators:
- type: data_source
  value: Powershell Script Block Logging 4104
  confidence: high
- type: risk_user
  value: user_id
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Legitimate administrators might create an "ESX Admins" group for valid
    reasons. Verify that the group creation is authorized and part of normal administrative
    tasks. Consider the context of the action, such as the user performing it and
    any related activities.
  mitigation: Review context and user activity
