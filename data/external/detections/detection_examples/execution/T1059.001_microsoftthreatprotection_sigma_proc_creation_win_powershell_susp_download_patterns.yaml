technique_id: T1059.001
technique_name: Suspicious PowerShell Download and Execute Pattern
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: e6c54d94-498c-4562-a37c-b469d8e9a275
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - IEX ((New-Object Net.WebClient).DownloadString\n \
  \ - IEX (New-Object Net.WebClient).DownloadString\n  - IEX((New-Object Net.WebClient).DownloadString\n\
  \  - IEX(New-Object Net.WebClient).DownloadString\n  - ' -command (New-Object System.Net.WebClient).DownloadFile('\n\
  \  - ' -c (New-Object System.Net.WebClient).DownloadFile('\n"
explanation: Detects suspicious PowerShell download patterns that are often used in
  malicious scripts, stagers or downloaders (make sure that your backend applies the
  strings case-insensitive)
false_positives:
- Software installers that pull packages from remote systems and execute them
references:
- https://gist.github.com/jivoi/c354eaaf3019352ce32522f916c03d70
- https://www.trendmicro.com/en_us/research/22/j/lv-ransomware-exploits-proxyshell-in-attack.html
tags:
