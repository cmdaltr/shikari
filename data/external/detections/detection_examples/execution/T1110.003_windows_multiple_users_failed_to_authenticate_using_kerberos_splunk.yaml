technique_id: T1110.003
technique_name: Windows Multiple Users Failed To Authenticate Using Kerberos
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`wineventlog_security` EventCode=4771 TargetUserName!="*$" Status=0x18 | bucket
  span=5m _time | stats dc(TargetUserName) AS unique_accounts values(TargetUserName)
  as user values(dest) as dest by _time, IpAddress | where unique_accounts > 30 |
  `windows_multiple_users_failed_to_authenticate_using_kerberos_filter`'
explanation: The following analytic identifies a single source endpoint failing to
  authenticate with 30 unique users using the Kerberos protocol. It leverages EventCode
  4771 with Status 0x18, indicating wrong password attempts, and aggregates these
  events over a 5-minute window. This behavior is significant as it may indicate a
  Password Spraying attack, where an adversary attempts to gain initial access or
  elevate privileges in an Active Directory environment. If confirmed malicious, this
  activity could lead to unauthorized access, privilege escalation, and potential
  compromise of sensitive information.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/3a91a212-98a9-11eb-b86a-acde48001122/
indicators:
- type: data_source
  value: Windows Event Log Security 4771
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: A host failing to authenticate with multiple valid domain users is
    not a common behavior for legitimate systems. Possible false positive scenarios
    include but are not limited to vulnerability scanners, missconfigured systems
    and multi-user systems like Citrix farms.
  mitigation: Review context and user activity
