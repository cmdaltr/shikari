technique_id: T1572
technique_name: Linux Ngrok Reverse Proxy Usage
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name=ngrok
  Processes.process IN ("*start*", "*--config*","*http*","*authtoken*", "*http*",
  "*tcp*") by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `linux_ngrok_reverse_proxy_usage_filter`'
explanation: The following analytic detects the use of Ngrok on a Linux operating
  system. It leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on process names and command-line arguments associated with Ngrok. This activity
  is significant because Ngrok can be used by adversaries to establish reverse proxies,
  potentially bypassing network defenses. If confirmed malicious, this could allow
  attackers to create persistent, unauthorized access channels, facilitating data
  exfiltration or further exploitation of the compromised system.
source: Splunk Security Content
