technique_id: T1485
technique_name: AWS Bedrock Delete Knowledge Base
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventSource=bedrock.amazonaws.com eventName=DeleteKnowledgeBase  |
  rename user_name as user  | stats count min(_time) as firstTime max(_time) as lastTime
  values(requestParameters.knowledgeBaseId) as knowledgeBaseIds by src user user_agent
  vendor_account vendor_product dest signature vendor_region  | `security_content_ctime(firstTime)`  |
  `security_content_ctime(lastTime)` | `aws_bedrock_delete_knowledge_base_filter`'
explanation: The following analytic identifies attempts to delete AWS Bedrock Knowledge
  Bases, which are resources that store and manage domain-specific information for
  AI models. It monitors AWS CloudTrail logs for DeleteKnowledgeBase API calls. This
  activity could indicate an adversary attempting to remove knowledge bases after
  compromising credentials, potentially to disrupt business operations or remove traces
  of data access. Deleting knowledge bases could impact model performance, remove
  critical business context, or be part of a larger attack to degrade AI capabilities.
  If confirmed malicious, this could represent a deliberate attempt to cause service
  disruption or data loss.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/8b4e3d62-f743-11ee-9f6e-acde48001123/
indicators:
- type: data_source
  value: AWS CloudTrail DeleteKnowledgeBase
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate administrators may delete Knowledge Bases as part of normal
    operations, such as when replacing outdated knowledge bases, removing test resources,
    or consolidating information. Consider implementing an allowlist for expected
    administrators who regularly manage Knowledge Base configurations.
  mitigation: Review context and user activity
references:
