logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \adplus.exe
  - OriginalFileName: Adplus.exe
  selection_cli:
    CommandLine|contains:
    - ' -hang '
    - ' -pn '
    - ' -pmn '
    - ' -p '
    - ' -po '
    - ' -c '
    - ' -sc '
  condition: all of selection_*
