technique_id: T1003.001
technique_name: Potential Adplus.EXE Abuse
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 2f869d59-7f6a-4931-992c-cce556ff2d53
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - ' -hang '\n  - ' -pn '\n  - ' -pmn\
  \ '\n  - ' -p '\n  - ' -po '\n  - ' -c '\n  - ' -sc '\nselection_img:\n- Image|endswith:\
  \ \\adplus.exe\n- OriginalFileName: Adplus.exe\n"
explanation: Detects execution of "AdPlus.exe", a binary that is part of the Windows
  SDK that can be used as a LOLBIN in order to dump process memory and execute arbitrary
  commands.
false_positives:
- Legitimate usage of Adplus for debugging purposes
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Adplus/
- https://twitter.com/nas_bench/status/1534916659676422152
- https://twitter.com/nas_bench/status/1534915321856917506
tags:
