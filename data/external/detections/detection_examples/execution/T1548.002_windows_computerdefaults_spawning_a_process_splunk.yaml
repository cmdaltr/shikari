technique_id: T1548.002
technique_name: Windows ComputerDefaults Spawning a Process
tactic: execution
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.parent_process_name=ComputerDefaults.exe
  by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_computerdefaults_spawning_a_process_filter`'
explanation: The following analytic detects the spawning of ComputerDefaults.exe,
  a Windows system process used to manage default application associations. While
  normally legitimate, this process can be exploited by attackers to bypass User Account
  Control (UAC) and execute unauthorized code with elevated privileges. Detection
  focuses on abnormal execution patterns, unusual parent-child process relationships,
  or deviations from standard paths. Such behavior may indicate attempts to modify
  system defaults or run malicious scripts undetected. Monitoring ComputerDefaults.exe
  is critical to identify potential security threats, prevent privilege escalation,
  and maintain system integrity by distinguishing normal operations from suspicious
  activity.
