query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli_enc:\n  CommandLine|contains: ' -e'\nselection_cli_invoke:\n  CommandLine|contains:\n\
  \  - SQBuAHYAbwBrAGUALQ\n  - kAbgB2AG8AawBlAC0A\n  - JAG4AdgBvAGsAZQAtA\n  - SW52b2tlL\n\
  \  - ludm9rZS\n  - JbnZva2Ut\nselection_img:\n- Image|endswith:\n  - \\powershell.exe\n\
  \  - \\pwsh.exe\n- OriginalFileName:\n  - PowerShell.EXE\n  - pwsh.dll\n"
explanation: Detects UTF-8 and UTF-16 Base64 encoded powershell 'Invoke-' calls
false_positives:
