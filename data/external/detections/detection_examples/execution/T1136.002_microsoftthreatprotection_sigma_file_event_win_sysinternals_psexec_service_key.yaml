source: sigma
sigma_id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetFilename|endswith: .key\n  TargetFilename|startswith: C:\\Windows\\PSEXEC-\n"
explanation: Detects creation of the PSEXEC key file. Which is created anytime a PsExec
  command is executed. It gets written to the file system and will be recorded in
  the USN Journal on the target system
false_positives:
- Unlikely
