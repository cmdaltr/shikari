technique_id: T1059
technique_name: Windows Script Execution from Archive
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\
  \ process.name : \"wscript.exe\" and\n process.parent.name : (\"explorer.exe\",\
  \ \"winrar.exe\", \"7zFM.exe\") and\n process.args :\n        (\"?:\\\\Users\\\\\
  *\\\\AppData\\\\Local\\\\Temp\\\\7z*\\\\*\",\n         \"?:\\\\Users\\\\*\\\\AppData\\\
  \\Local\\\\Temp\\\\*.zip.*\\\\*\",\n         \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\
  \\Temp\\\\Rar$*\\\\*\",\n         \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\
  \\Temp?_*\\\\*\",\n         \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\BNZ.*\"\
  )"
explanation: 'Identifies attempts to execute Jscript/Vbscript files from an archive
  file. The use of archives is a common delivery method

  of malicious scripts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/30f9d940-7d55-4fff-a8b9-4715d20eb204.toml
query_type: eql
query_language: eql
