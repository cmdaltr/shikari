technique_id: T1059.001
technique_name: Potential Data Exfiltration Activity Via CommandLine Tools
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 7d1aaf3d-4304-425c-b7c3-162055e0b3ab
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (selection_iwr or all\
  \ of selection_curl* or selection_wget) and payloads\npayloads:\n- CommandLine|re:\n\
  \  - net\\s+view\n  - sc\\s+query\n- CommandLine|contains:\n  - Get-Content\n  -\
  \ GetBytes\n  - hostname\n  - ifconfig\n  - ipconfig\n  - netstat\n  - nltest\n\
  \  - qprocess\n  - systeminfo\n  - tasklist\n  - ToBase64String\n  - whoami\n- CommandLine|contains|all:\n\
  \  - 'type '\n  - ' > '\n  - ' C:\\'\nselection_curl:\n  CommandLine|contains: --ur\n\
  \  Image|endswith: \\curl.exe\nselection_curl_data:\n  CommandLine|contains:\n \
  \ - ' -d '\n  - ' --data '\nselection_iwr:\n  CommandLine|contains:\n  - 'curl '\n\
  \  - Invoke-RestMethod\n  - Invoke-WebRequest\n  - 'irm '\n  - 'iwr '\n  - 'wget\
  \ '\n  CommandLine|contains|all:\n  - ' -ur'\n  - ' -me'\n  - ' -b'\n  - ' POST\
  \ '\n  Image|endswith:\n  - \\powershell_ise.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n\
  \  - \\cmd.exe\nselection_wget:\n  CommandLine|contains:\n  - --post-data\n  - --post-file\n\
  \  Image|endswith: \\wget.exe\n"
explanation: Detects the use of various CLI utilities exfiltrating data via web requests
false_positives:
- Unlikely
references:
- https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool/
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_iwr:
    Image|endswith:
    - \powershell_ise.exe
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
    CommandLine|contains:
    - 'curl '
    - Invoke-RestMethod
    - Invoke-WebRequest
    - 'irm '
    - 'iwr '
    - 'wget '
    CommandLine|contains|all:
    - ' -ur'
    - ' -me'
    - ' -b'
    - ' POST '
  selection_curl:
    Image|endswith: \curl.exe
    CommandLine|contains: --ur
  selection_curl_data:
    CommandLine|contains:
    - ' -d '
    - ' --data '
  selection_wget:
    Image|endswith: \wget.exe
    CommandLine|contains:
    - --post-data
    - --post-file
  payloads:
  - CommandLine|re:
    - net\s+view
    - sc\s+query
  - CommandLine|contains:
    - Get-Content
    - GetBytes
    - hostname
    - ifconfig
    - ipconfig
    - netstat
    - nltest
    - qprocess
    - systeminfo
    - tasklist
    - ToBase64String
    - whoami
  - CommandLine|contains|all:
    - 'type '
    - ' > '
    - ' C:\'
  condition: (selection_iwr or all of selection_curl* or selection_wget) and payloads
metadata:
  created_date: 2022-08-02
  modified_date: 2025-10-19
  author: Nasreddine Bencherchali (Nextron Systems)
