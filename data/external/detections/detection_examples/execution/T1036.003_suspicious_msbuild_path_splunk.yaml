technique_id: T1036.003
technique_name: Suspicious msbuild path
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count values(Processes.process_name)
  as process_name values(Processes.process) as process min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_msbuild` AND (Processes.process_path!=*\\framework*\\v*\\*)
  by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`|
  `suspicious_msbuild_path_filter`'
explanation: The following analytic detects the execution of msbuild.exe from a non-standard
  path. It leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on process execution logs that deviate from typical msbuild.exe locations. This
  activity is significant because msbuild.exe is commonly abused by attackers to execute
  malicious code, and running it from an unusual path can indicate an attempt to evade
  detection. If confirmed malicious, this behavior could allow an attacker to execute
  arbitrary code, potentially leading to system compromise and further malicious activities.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/f5198224-551c-11eb-ae93-0242ac130002/
indicators:
- type: data_source
  value: Sysmon EventID 1
  confidence: high
- type: data_source
  value: Windows Event Log Security 4688
  confidence: high
- type: data_source
  value: CrowdStrike ProcessRollup2
  confidence: high
- type: risk_system
  value: dest
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Some legitimate applications may use a moved copy of msbuild.exe, triggering
    a false positive. Baselining of MSBuild.exe usage is recommended to better understand
    it's path usage. Visual Studio runs an instance out of a path that will need to
    be filtered on.
  mitigation: Review context and user activity
references:
