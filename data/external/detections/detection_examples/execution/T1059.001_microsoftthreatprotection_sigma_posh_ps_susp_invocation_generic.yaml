technique_id: T1059.001
technique_name: Suspicious PowerShell Invocations - Generic
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: ed965133-513f-41d9-a441-e38076a0798f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_encoded:\n\
  \  ScriptBlockText|contains:\n  - ' -enc '\n  - ' -EncodedCommand '\n  - ' -ec '\n\
  selection_hidden:\n  ScriptBlockText|contains:\n  - ' -w hidden '\n  - ' -window\
  \ hidden '\n  - ' -windowstyle hidden '\n  - ' -w 1 '\nselection_noninteractive:\n\
  \  ScriptBlockText|contains:\n  - ' -noni '\n  - ' -noninteractive '\n"
explanation: Detects suspicious PowerShell invocation command parameters
false_positives:
- Very special / sneaky PowerShell scripts
references:
- Internal Research
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_encoded:
    ScriptBlockText|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -ec '
  selection_hidden:
    ScriptBlockText|contains:
    - ' -w hidden '
    - ' -window hidden '
    - ' -windowstyle hidden '
    - ' -w 1 '
  selection_noninteractive:
    ScriptBlockText|contains:
    - ' -noni '
    - ' -noninteractive '
  condition: all of selection*
