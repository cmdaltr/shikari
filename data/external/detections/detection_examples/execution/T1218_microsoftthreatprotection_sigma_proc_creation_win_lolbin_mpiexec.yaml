source: sigma
sigma_id: 729ce0ea-5d8f-4769-9762-e35de441586d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_binary:\n\
  - Image|endswith: \\mpiexec.exe\n- Hashes|contains: IMPHASH=d8b52ef6aaa3a81501bdfff9dbb96217\n\
  selection_flags:\n  CommandLine|contains:\n  - ' /n 1 '\n  - ' -n 1 '\n"
explanation: Detects a certain command line flag combination used by mpiexec.exe LOLBIN
  from HPC pack that can be used to execute any other binary
false_positives:
- Unknown
references:
- https://twitter.com/mrd0x/status/1465058133303246867
- https://learn.microsoft.com/en-us/powershell/high-performance-computing/mpiexec?view=hpc19-ps
tags:
