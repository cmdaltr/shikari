query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_domain_controller:\n  Details:\n  - '%%systemroot%%\\system32\\\
  ntdsa.dll'\n  - '%%systemroot%%\\system32\\lsadb.dll'\n  Image: C:\\Windows\\system32\\\
  lsass.exe\nselection:\n  TargetObject|contains:\n  - \\CurrentControlSet\\Services\\\
  NTDS\\DirectoryServiceExtPt\n  - \\CurrentControlSet\\Services\\NTDS\\LsaDbExtPt\n"
explanation: Detects a method to load DLL via LSASS process using an undocumented
  Registry key
