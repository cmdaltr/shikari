technique_id: T1222
technique_name: ICACLS Grant Command
tactic: execution
platform: Splunk
fidelity_score: 0.85
validated: true
query: "| tstats `security_content_summariesonly` min(_time) as firstTime max(_time)\n\
  as lastTime from datamodel=Endpoint.Processes where \nProcesses.process_name IN\
  \ ( \"icacls.exe\", \"cacls.exe\", \"xcacls.exe\") AND \nProcesses.process IN (\"\
  */grant*\", \"*/g:*\", \"*/g *\") \nby Processes.action Processes.dest Processes.original_file_name\
  \ Processes.parent_process \nProcesses.parent_process_exec Processes.parent_process_guid\
  \ Processes.parent_process_id \nProcesses.parent_process_name Processes.parent_process_path\
  \ Processes.process Processes.process_exec \nProcesses.process_guid Processes.process_hash\
  \ Processes.process_id Processes.process_integrity_level \nProcesses.process_name\
  \ Processes.process_path Processes.user Processes.user_id Processes.vendor_product\n\
  | `drop_dm_object_name(Processes)` \n| `security_content_ctime(firstTime)` \n| `security_content_ctime(lastTime)`\n\
  | `icacls_grant_command_filter`"
explanation: 'The following analytic detects the use of the ICACLS command to grant

  additional access permissions to files or directories. It leverages data from Endpoint

  Detection and Response (EDR) agents, focusing on specific process names and command-line

  arguments. This activity is significant because it is commonly used by Advanced

  Persistent Threats (APTs) and coinminer scripts to evade detection and maintain

  control over compromised systems. If confirmed malicious, this behavior could allow

  attackers to manipulate file permissions, potentially leading to unauthorized access,

  data exfiltration, or further system compromise.'
