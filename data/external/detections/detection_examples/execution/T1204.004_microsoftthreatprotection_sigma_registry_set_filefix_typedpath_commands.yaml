technique_id: T1204.004
technique_name: FileFix - Command Evidence in TypedPaths from Browser File Upload
  Abuse
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 4fee3d51-8069-4a4c-a0f7-924fcaff2c70
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_base:\n  Details|contains: '#'\n  Image|endswith:\n  - \\brave.exe\n \
  \ - \\chrome.exe\n  - \\firefox.exe\n  - \\msedge.exe\n  TargetObject|endswith:\
  \ \\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\TypedPaths\\url1\nselection_cmd:\n\
  \  Details|contains:\n  - cmd\n  - curl\n  - powershell\n  - bitsadmin\n  - certutil\n\
  \  - mshta\n  - regsvr32\n"
explanation: Detects commonly-used chained commands and strings in the most recent
  'url' value of the 'TypedPaths' key, which could be indicative of a user being targeted
  by the FileFix technique.
false_positives:
- Unknown
references:
- https://x.com/russianpanda9xx/status/1940831134759506029
- https://mrd0x.com/filefix-clickfix-alternative/
tags:
- attack.execution
- attack.t1204.004
logsource:
  category: registry_set
  product: windows
detection:
  selection_base:
    TargetObject|endswith: \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\url1
    Details|contains: '#'
    Image|endswith:
    - \brave.exe
    - \chrome.exe
    - \firefox.exe
    - \msedge.exe
  selection_cmd:
    Details|contains:
    - cmd
    - curl
    - powershell
    - bitsadmin
    - certutil
    - mshta
    - regsvr32
  condition: all of selection_*
