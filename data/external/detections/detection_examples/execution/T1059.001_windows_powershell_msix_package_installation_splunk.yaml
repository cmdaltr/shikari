technique_id: T1059.001
technique_name: Windows PowerShell MSIX Package Installation
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`powershell` EventCode=4104 ScriptBlockText IN("*Add-AppPackage *", "*Add-AppxPackage
  *") AND ScriptBlockText IN ("* -AllowUnsigned*") | fillnull | stats count min(_time)
  as firstTime max(_time) as lastTime by dest signature signature_id user_id vendor_product
  EventID Guid Opcode Name Path ProcessID ScriptBlockId ScriptBlockText | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `windows_powershell_msix_package_installation_filter`
  | `windows_powershell_msix_package_installation_filter`'
explanation: The following analytic detects the execution of PowerShell commands to
  install unsigned AppX packages using Add-AppxPackage or Add-AppPackage cmdlets with
  the -AllowUnsigned flag. This detection leverages PowerShell Script Block Logging
  (EventCode=4104) to capture the full command content. This activity is significant
  as adversaries may use unsigned AppX packages to install malicious applications,
  bypass security controls, or establish persistence. If confirmed malicious, this
  could allow attackers to install unauthorized applications that may contain malware,
  backdoors, or other malicious components.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/d2f77901-dbfa-42d9-8af7-dcd0f1a50a2f/
indicators:
- type: data_source
  value: Powershell Script Block Logging 4104
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: 'Installation of unsigned packages for testing purposes by developers
    or system administrators.

    Legitimate software development and testing activities may trigger this detection.

    Internal application development teams testing MSIX packages before signing.

    System administrators installing custom unsigned applications for business purposes.

    Note: The -AllowUnsigned flag is only available on Windows 11 and later versions.'
  mitigation: Review context and user activity
