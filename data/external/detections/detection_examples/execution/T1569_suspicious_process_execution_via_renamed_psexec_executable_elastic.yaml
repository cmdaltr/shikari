technique_id: T1569
technique_name: Suspicious Process Execution via Renamed PsExec Executable
tactic: execution
platform: Elastic
fidelity_score: 0.88
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.pe.original_file_name : \"psexesvc.exe\" and not process.name : \"PSEXESVC.exe\""
explanation: 'Identifies suspicious psexec activity which is executing from the psexec
  service that has been renamed, possibly to

  evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e2f9fdf5-8076-45ad-9427-41e0e03dc9c2.toml
