technique_id: T1114.003
technique_name: O365 Email Suspicious Behavior Alert
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=SecurityComplianceCenter Operation=AlertEntityGenerated
  Name IN ("Suspicious email sending patterns detected","User restricted from sending
  email","Suspicious Email Forwarding Activity","Email sending limit exceeded") |
  fromjson Data | rename Name as signature, AlertId as signature_id, ObjectId as user
  | fillnull | stats count min(_time) as firstTime max(_time) as lastTime by dest
  user src vendor_account vendor_product signature signature_id | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `o365_email_suspicious_behavior_alert_filter`'
explanation: The following analytic identifies when one of O365 the built-in security
  detections for suspicious email behaviors are triggered.  These alerts often indicate
  that an attacker may have compromised a mailbox within the environment. Any detections
  from built-in Office 365 capabilities should be monitored and responded to appropriately.
  Certain premium Office 365 capabilities further enhance these detection and response
  functions.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/85c7555a-05af-4322-81aa-76b4ddf52baa/
indicators:
- type: data_source
  value: Office 365 Universal Audit Log
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Users emailing for legitimate business purposes that appear suspicious.
  mitigation: Review context and user activity
references:
- https://learn.microsoft.com/en-us/purview/alert-policies
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566/o365_various_alerts/o365_various_alerts.log
