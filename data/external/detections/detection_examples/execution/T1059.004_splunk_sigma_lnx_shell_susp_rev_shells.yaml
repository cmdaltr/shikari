source: sigma
sigma_id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: keywords\nkeywords:\n\
  - BEGIN {s = \"/inet/tcp/0/\n- bash -i >& /dev/tcp/\n- bash -i >& /dev/udp/\n- sh\
  \ -i >$ /dev/udp/\n- sh -i >$ /dev/tcp/\n- '&& while read line 0<&5; do'\n- /bin/bash\
  \ -c exec 5<>/dev/tcp/\n- /bin/bash -c exec 5<>/dev/udp/\n- 'nc -e /bin/sh '\n-\
  \ /bin/sh | nc\n- 'rm -f backpipe; mknod /tmp/backpipe p && nc '\n- ;socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"\
  tcp\"));if(connect(S,sockaddr_in($p,inet_aton($i))))\n- ;STDIN->fdopen($c,r);$~->fdopen($c,w);system$_\
  \ while<>;\n- /bin/sh -i <&3 >&3 2>&3\n- uname -a; w; id; /bin/bash -i\n- $sendbyte\
  \ = ([text.encoding]::ASCII).GetBytes($sendback2); $stream.Write($sendbyte,0,$sendbyte.Length);\n\
  \  $stream.Flush()};\n- ;os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);os.putenv('HISTFILE','/dev/null');\n\
  - .to_i;exec sprintf(\"/bin/sh -i <&%d >&%d 2>&%d\",f,f,f)\n- ;while(cmd=c.gets);IO.popen(cmd,\"\
  r\"){|io|c.print\n- 'socat exec:''bash -li'',pty,stderr,setsid,sigint,sane tcp:'\n\
  - rm -f /tmp/p; mknod /tmp/p p &&\n- ' | /bin/bash | telnet '\n- ',echo=0,raw tcp-listen:'\n\
  - 'nc -lvvp '\n- xterm -display 1\n"
explanation: Detects suspicious shell commands or program code that may be executed
  or used in command line to establish a reverse shell
false_positives:
- Unknown
references:
- https://alamot.github.io/reverse_shells/
