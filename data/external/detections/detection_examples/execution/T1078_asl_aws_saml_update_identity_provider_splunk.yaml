technique_id: T1078
technique_name: ASL AWS SAML Update identity provider
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`amazon_security_lake` api.operation=UpdateSAMLProvider | fillnull | stats
  count min(_time) as firstTime max(_time) as lastTime by actor.user.uid api.operation
  api.service.name http_request.user_agent src_endpoint.ip actor.user.account.uid
  cloud.provider cloud.region | rename actor.user.uid as user api.operation as action
  api.service.name as dest http_request.user_agent as user_agent src_endpoint.ip as
  src actor.user.account.uid as vendor_account cloud.provider as vendor_product cloud.region
  as vendor_region | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`
  | `asl_aws_saml_update_identity_provider_filter`'
explanation: The following analytic detects updates to the SAML provider in AWS. It
  leverages AWS CloudTrail logs to identify the `UpdateSAMLProvider` event, analyzing
  fields such as `sAMLProviderArn`, `sourceIPAddress`, and `userIdentity` details.
  Monitoring updates to the SAML provider is crucial as it may indicate a perimeter
  compromise of federated credentials or unauthorized backdoor access set by an attacker.
  If confirmed malicious, this activity could allow attackers to manipulate identity
  federation, potentially leading to unauthorized access to cloud resources and sensitive
  data.
source: Splunk Security Content
