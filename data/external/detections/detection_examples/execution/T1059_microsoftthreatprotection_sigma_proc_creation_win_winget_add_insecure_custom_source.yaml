technique_id: T1059
technique_name: Add Insecure Download Source To Winget
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 81a0ecb5-0a41-4ba1-b2ba-c944eb92bfa2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - 'source '\n  - 'add '\n  - http://\n\
  selection_img:\n- Image|endswith: \\winget.exe\n- OriginalFileName: winget.exe\n"
explanation: 'Detects usage of winget to add a new insecure (http) download source.

  Winget will not allow the addition of insecure sources, hence this could indicate
  potential suspicious activity (or typos)

  '
false_positives:
- False positives might occur if the users are unaware of such control checks
references:
- https://learn.microsoft.com/en-us/windows/package-manager/winget/source
- https://github.com/nasbench/Misc-Research/tree/b9596e8109dcdb16ec353f316678927e507a5b8d/LOLBINs/Winget
tags:
- attack.defense-evasion
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \winget.exe
  - OriginalFileName: winget.exe
  selection_cli:
    CommandLine|contains|all:
    - 'source '
    - 'add '
    - http://
  condition: all of selection_*
