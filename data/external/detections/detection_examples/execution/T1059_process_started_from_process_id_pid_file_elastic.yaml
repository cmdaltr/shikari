technique_id: T1059
technique_name: Process Started from Process ID (PID) File
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and user.id\
  \ == \"0\" and\n  process.executable regex~ \"\"\"/var/run/\\w+\\.(pid|lock|reboot)\
  \ \"\"\""
explanation: 'Identifies a new process starting from a process ID (PID), lock or reboot
  file within the temporary file storage

  paradigm (tmpfs) directory /var/run directory. On Linux, the PID files typically
  hold the process ID to track previous

  copies running and manage other tasks. Certain Linux malware use the /var/run directory
  for holding data, executables

  and other tasks, disguising itself or these files as legitimate PID files.'
source: Elastic Detection Rules
