  u2004\\u2004\\u2004\\u2004\\u2004\\u2004\\u2004\\u2004\\u2004\\u2004\"\n  - \"\\\
  u2005\\u2005\\u2005\\u2005\\u2005\\u2005\\u2005\\u2005\\u2005\\u2005\\u2005\\u2005\"\
  \n  - \"\\u2006\\u2006\\u2006\\u2006\\u2006\\u2006\\u2006\\u2006\\u2006\\u2006\\\
  u2006\\u2006\"\n  - \"\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\\
  u2007\\u2007\\u2007\\u2007\"\n  - \"\\u2008\\u2008\\u2008\\u2008\\u2008\\u2008\\\
  u2008\\u2008\\u2008\\u2008\\u2008\\u2008\"\n  - \"\\u2009\\u2009\\u2009\\u2009\\\
  u2009\\u2009\\u2009\\u2009\\u2009\\u2009\\u2009\\u2009\"\n  - \"\\u200A\\u200A\\\
  u200A\\u200A\\u200A\\u200A\\u200A\\u200A\\u200A\\u200A\\u200A\\u200A\"\n  - \"\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\"\n  - '            '\n"
explanation: 'Detects the occurrence of numerous space characters in RunMRU registry
  paths, which may indicate execution via phishing lures using clickfix techniques
  to hide malicious commands in the Windows Run dialog box from naked eyes.

  '
