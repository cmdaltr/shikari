query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_key:\n  Details|contains: '#'\n  TargetObject|contains: \\Software\\Microsoft\\\
  Windows\\CurrentVersion\\Explorer\\RunMRU\\\nselection_space_variation:\n  Details|contains:\n\
  \  - \"\\u2000\\u2000\\u2000\\u2000\\u2000\\u2000\\u2000\\u2000\\u2000\\u2000\\\
  u2000\\u2000\"\n  - \"\\u2001\\u2001\\u2001\\u2001\\u2001\\u2001\\u2001\\u2001\\\
  u2001\\u2001\\u2001\\u2001\"\n  - \"\\u2002\\u2002\\u2002\\u2002\\u2002\\u2002\\\
  u2002\\u2002\\u2002\\u2002\\u2002\\u2002\"\n  - \"\\u2003\\u2003\\u2003\\u2003\\\
