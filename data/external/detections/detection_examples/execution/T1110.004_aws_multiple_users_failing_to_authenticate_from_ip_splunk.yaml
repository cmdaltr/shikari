technique_id: T1110.004
technique_name: AWS Multiple Users Failing To Authenticate From Ip
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`cloudtrail` eventName=ConsoleLogin action=failure | bucket span=10m _time
  | rename user_name as user | stats  dc(user) AS unique_accounts values(user) as
  user values(user_agent) as user_agent by _time, src, signature, dest, vendor_account,
  vendor_region, vendor_product | where unique_accounts>30 | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_multiple_users_failing_to_authenticate_from_ip_filter`'
explanation: The following analytic identifies a single source IP failing to authenticate
  into the AWS Console with 30 unique valid users within 10 minutes. It leverages
  CloudTrail logs to detect multiple failed login attempts from the same IP address.
  This behavior is significant as it may indicate a Password Spraying attack, where
  an adversary attempts to gain unauthorized access or elevate privileges by trying
  common passwords across many accounts. If confirmed malicious, this activity could
  lead to unauthorized access, data breaches, or further exploitation within the AWS
  environment.
source: Splunk Security Content
