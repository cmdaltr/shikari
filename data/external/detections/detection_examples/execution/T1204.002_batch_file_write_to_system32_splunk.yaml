technique_id: T1204.002
technique_name: Batch File Write to System32
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime FROM datamodel=Endpoint.Filesystem where Filesystem.file_path IN ("*\\system32\\*","*\\syswow64\\*")
  Filesystem.file_name="*.bat" by Filesystem.action Filesystem.dest Filesystem.file_access_time
  Filesystem.file_create_time Filesystem.file_hash Filesystem.file_modify_time Filesystem.file_name
  Filesystem.file_path Filesystem.file_acl Filesystem.file_size Filesystem.process_guid
  Filesystem.process_id Filesystem.user Filesystem.vendor_product | `drop_dm_object_name(Filesystem)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `batch_file_write_to_system32_filter`'
explanation: The following analytic detects the creation of a batch file (.bat) within
  the Windows system directory tree, specifically in the System32 or SysWOW64 folders.
  It leverages data from the Endpoint datamodel, focusing on process and filesystem
  events to identify this behavior. This activity is significant because writing batch
  files to system directories can be indicative of malicious intent, such as persistence
  mechanisms or system manipulation. If confirmed malicious, this could allow an attacker
  to execute arbitrary commands with elevated privileges, potentially compromising
  the entire system.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/503d17cb-9eab-4cf8-a20e-01d5c6987ae3/
indicators:
- type: data_source
  value: Sysmon EventID 11
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: It is possible for this search to generate a finding event for a batch
    file write to a path that includes the string "system32", but is not the actual
    Windows system directory. As such, you should confirm the path of the batch file
    identified by the search. In addition, a false positive may be generated by an
    administrator copying a legitimate batch file in this directory tree. You should
    confirm that the activity is legitimate and modify the search to add exclusions,
    as necessary.
  mitigation: Review context and user activity
validation:
