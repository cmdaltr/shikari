technique_id: T1556
technique_name: Disabling Windows Local Security Authority Defences via Registry
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` min(_time) as _time from datamodel=Endpoint.Registry
  where Registry.registry_path IN ("*\\Lsa\\LsaCfgFlags", "*\\Lsa\\RunAsPPL", "*\\SOFTWARE\\Policies\\Microsoft\\Windows\\DeviceGuard\\*")
  AND ((Registry.action = deleted) OR (Registry.action = modified AND Registry.registry_value_data
  IN(0x00000000, 0))) by Registry.action Registry.dest Registry.process_guid Registry.process_id
  Registry.registry_hive Registry.registry_path Registry.registry_key_name Registry.registry_value_data
  Registry.registry_value_name Registry.registry_value_type Registry.status Registry.user
  Registry.vendor_product | `drop_dm_object_name(Registry)` | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `disabling_windows_local_security_authority_defences_via_registry_filter`'
explanation: The following analytic identifies the deletion of registry keys that
  disable Local Security Authority (LSA) protection and Microsoft Defender Device
  Guard. It leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on registry actions and paths associated with LSA and Device Guard settings. This
  activity is significant because disabling these defenses can leave a system vulnerable
  to various attacks, including credential theft and unauthorized code execution.
  If confirmed malicious, this action could allow attackers to bypass critical security
  mechanisms, leading to potential system compromise and persistent access.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/45cd08f8-a2c9-4f4e-baab-e1a0c624b0ab/
indicators:
- type: data_source
  value: Sysmon EventID 13
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Potential to be triggered by an administrator disabling protections
    for troubleshooting purposes.
  mitigation: Review context and user activity
