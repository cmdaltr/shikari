technique_id: T1547.006
technique_name: Linux Auditd Unload Module Via Modprobe
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`linux_auditd` execve_command = "*modprobe*" AND execve_command = "*-r *"
  | rename host as dest | rename comm as process_name | rename exe as process | stats
  count min(_time) as firstTime max(_time) as lastTime by argc execve_command dest
  | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)` | `linux_auditd_unload_module_via_modprobe_filter`'
explanation: The following analytic detects suspicious use of the `modprobe` command
  to unload kernel modules, which may indicate an attempt to disable critical system
  components or evade detection. The `modprobe` utility manages kernel modules, and
  unauthorized unloading of modules can disrupt system security features, remove logging
  capabilities, or conceal malicious activities. By monitoring for unusual or unauthorized
  `modprobe` operations involving module unloading, this analytic helps identify potential
  tampering with kernel functionality, enabling security teams to investigate and
  address possible threats to system integrity.
