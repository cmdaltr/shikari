technique_id: T1059
technique_name: Suspicious Invocation of Shell via AWK - Linux
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 8c1a5675-cb85-452f-a298-b01b22a51856
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - /bin/bash\n  - /bin/dash\n  - /bin/fish\n\
  \  - /bin/sh\n  - /bin/zsh\nselection_img:\n  CommandLine|contains: BEGIN {system\n\
  \  Image|endswith:\n  - /awk\n  - /gawk\n  - /mawk\n  - /nawk\n"
explanation: 'Detects the execution of "awk" or it''s sibling commands, to invoke
  a shell using the system() function.

  This behavior is commonly associated with attempts to execute arbitrary commands
  or escalate privileges, potentially leading to unauthorized access or further exploitation.

  '
false_positives:
