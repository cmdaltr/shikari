technique_id: T1055
technique_name: Conhost Spawned By Suspicious Parent Process
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"conhost.exe\" and\n  process.parent.name : (\"lsass.exe\", \"\
  services.exe\", \"smss.exe\", \"winlogon.exe\", \"explorer.exe\", \"dllhost.exe\"\
  , \"rundll32.exe\",\n                         \"regsvr32.exe\", \"userinit.exe\"\
  , \"wininit.exe\", \"spoolsv.exe\", \"ctfmon.exe\") and\n  not (process.parent.name\
  \ : \"rundll32.exe\" and\n       process.parent.args : (\"?:\\\\Windows\\\\Installer\\\
  \\MSI*.tmp,zzzzInvokeManagedCustomActionOutOfProc\",\n                         \
  \     \"?:\\\\WINDOWS\\\\system32\\\\PcaSvc.dll,PcaPatchSdbTask\",\n           \
  \                   \"?:\\\\WINDOWS\\\\system32\\\\davclnt.dll,DavSetCookie\"))"
explanation: 'Detects when the Console Window Host (conhost.exe) process is spawned
  by a suspicious parent process, which could be

  indicative of code injection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/05b358de-aa6d-4f6c-89e6-78f74018b43b.toml
