technique_id: T1059.005
technique_name: Windows Outlook Macro Created by Suspicious Process
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime values(Filesystem.file_create_time) as file_create_time from datamodel=Endpoint.Filesystem
  where Filesystem.file_path="*Appdata\\Roaming\\Microsoft\\Outlook\\VbaProject.OTM"
  by Filesystem.action Filesystem.dest Filesystem.file_access_time Filesystem.file_create_time
  Filesystem.file_hash Filesystem.file_modify_time Filesystem.file_name Filesystem.file_path
  Filesystem.file_acl Filesystem.file_size Filesystem.process_guid Filesystem.process_id
  Filesystem.user Filesystem.vendor_product | `drop_dm_object_name(Filesystem)` |
  `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_outlook_macro_created_by_suspicious_process_filter`'
explanation: The following analytic detects the creation of an Outlook Macro (VbaProject.OTM)
  by a suspicious process. This file is normally created when you create a macro from
  within Outlook. If this file is created by a process other than Outlook.exe it may
  be maliciously created. This detection leverages data from the Filesystem datamodel,
  specifically looking for the file creation event for VbaProject.OTM. This activity
  is significant as it is commonly associated with some malware infections, indicating
  potential malicious intent to harvest email information.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/3ec347e3-a94a-4a8b-a918-8306ea403182/
indicators:
- type: data_source
  value: Sysmon EventID 11
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Because this file are always created by Outlook in normal operations,
    you should investigate all results.
  mitigation: Review context and user activity
