technique_id: T1649
technique_name: Windows Steal Authentication Certificates CS Backup
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`wineventlog_security` EventCode=4876| stats count min(_time) as firstTime
  max(_time) as lastTime by dest, name, action, Caller_Domain ,Caller_User_Name |
  `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_steal_authentication_certificates_cs_backup_filter`'
explanation: The following analytic identifies the backup of the Active Directory
  Certificate Services (AD CS) store, detected via Event ID 4876. This event is logged
  when a backup is performed using the CertSrv.msc UI or the CertUtil.exe -BackupDB
  command. Monitoring this activity is crucial as unauthorized backups can indicate
  an attempt to steal authentication certificates, which are critical for secure communications.
  If confirmed malicious, this activity could allow an attacker to impersonate users,
  escalate privileges, or access sensitive information, severely compromising the
  security of the environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a2f4cc7f-6503-4078-b206-f83a29f408a7/
indicators:
- type: data_source
  value: Windows Event Log Security 4876
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: False positives will be generated based on normal certificate store
    backups. Leave enabled to generate Risk, as this is meant to be an anomaly analytic.
    If CS backups are not normal, enable as TTP.
  mitigation: Review context and user activity
references:
- https://specterops.io/wp-content/uploads/sites/3/2022/06/Certified_Pre-Owned.pdf
validation:
