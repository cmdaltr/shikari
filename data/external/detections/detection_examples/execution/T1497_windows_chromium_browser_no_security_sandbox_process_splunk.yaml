technique_id: T1497
technique_name: Windows Chromium Browser No Security Sandbox Process
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "| tstats `security_content_summariesonly` min(_time) as firstTime max(_time)\n\
  as lastTime from datamodel=Endpoint.Processes where \nProcesses.process_name IN\
  \ (\"Chrome.exe\",\"Brave.exe\", \"Opera.exe\", \"Vivaldi.exe\", \"msedge.exe\"\
  )\nProcesses.process = \"*--no-sandbox*\" \nby Processes.action Processes.dest Processes.original_file_name\
  \ Processes.parent_process\nProcesses.parent_process_exec Processes.parent_process_guid\
  \ Processes.parent_process_id\nProcesses.parent_process_name Processes.parent_process_path\
  \ Processes.process Processes.process_exec\nProcesses.process_guid Processes.process_hash\
  \ Processes.process_id Processes.process_integrity_level\nProcesses.process_name\
  \ Processes.process_path Processes.user Processes.user_id Processes.vendor_product\n\
  | `drop_dm_object_name(Processes)` \n| `security_content_ctime(firstTime)` \n| `security_content_ctime(lastTime)`\n\
  | `windows_chromium_browser_no_security_sandbox_process_filter`"
explanation: The following analytic detects instances where a Chrome or Chromium-based
  browser is launched with the --no-sandbox flag, a known indicator of potentially
  malicious or suspicious behavior. While this flag is occasionally used during software
  development or testing, it is rarely seen in normal user activity. Threat actors
  often abuse this setting to disable Chrome's built-in security sandbox, making it
  easier to execute malicious code or escape browser isolation. This behavior is commonly
  observed in malware droppers or loaders that embed Chromium components for command
  and control, credential theft, or UI spoofing. Analysts should investigate such
  events, especially if they originate from unusual parent processes (e.g., powershell.exe,
  cmd.exe, or unknown binaries), or if accompanied by other indicators such as file
  drops, process injection, or outbound network activity. Filtering by command-line
  arguments and process ancestry can help reduce false positives and surface high-fidelity
  detections.
