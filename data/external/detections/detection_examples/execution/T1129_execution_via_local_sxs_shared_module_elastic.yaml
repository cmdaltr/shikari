technique_id: T1129
technique_name: Execution via local SxS Shared Module
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"windows\" and file.extension : \"dll\" and\n\
  \  file.path : (\n    \"C:\\\\*\\\\*.exe.local\\\\*.dll\",\n    /* Crowdstrike specific\
  \ condition as it uses NT Object paths */\n    \"\\\\Device\\\\HarddiskVolume*\\\
  \\*\\\\*.exe.local\\\\*.dll\"\n  )"
explanation: 'Identifies the creation, change, or deletion of a DLL module within
  a Windows SxS local folder. Adversaries may abuse

  shared modules to execute malicious payloads by instructing the Windows module loader
  to load DLLs from arbitrary local

  paths.'
