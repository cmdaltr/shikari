technique_id: T1562.001
technique_name: Process Kill Base On File Path
tactic: execution
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '| tstats `security_content_summariesonly` values(Processes.process) as process
  values(Processes.process_id) as process_id count min(_time) as firstTime max(_time)
  as lastTime  from datamodel=Endpoint.Processes where `process_wmic` AND Processes.process="*process*"
  AND Processes.process="*executablepath*" AND Processes.process="*delete*" by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `process_kill_base_on_file_path_filter`'
explanation: The following analytic detects the use of `wmic.exe` with the `delete`
  command to remove an executable path. This detection leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on process names, parent processes,
  and command-line executions. This activity is significant because it often indicates
  the initial stages of an adversary setting up malicious activities, such as cryptocurrency
  mining, on an endpoint. If confirmed malicious, this behavior could allow an attacker
  to disable security tools or other critical processes, facilitating further compromise
  and persistence within the environment.
