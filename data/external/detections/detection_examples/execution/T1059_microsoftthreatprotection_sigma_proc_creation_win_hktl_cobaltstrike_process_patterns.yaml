technique_id: T1059
technique_name: Potential CobaltStrike Process Patterns
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: f35c5d71-b489-4e22-a115-f003df287317
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_conhost_1:\n\
  \  CommandLine|endswith: conhost.exe 0xffffffff -ForceV1\n  ParentCommandLine|contains|all:\n\
  \  - cmd.exe /C echo\n  - ' > \\\\\\\\.\\\\pipe'\nselection_conhost_2:\n  CommandLine|endswith:\
  \ conhost.exe 0xffffffff -ForceV1\n  ParentCommandLine|endswith: /C whoami\nselection_generic_1:\n\
  \  CommandLine|endswith: cmd.exe /C whoami\n  ParentImage|startswith: C:\\Temp\\\
  \nselection_generic_2:\n  CommandLine|contains|all:\n  - cmd.exe /c echo\n  - '>\
  \ \\\\\\\\.\\\\pipe'\n  ParentImage|endswith:\n  - \\runonce.exe\n  - \\dllhost.exe\n"
explanation: Detects potential process patterns related to Cobalt Strike beacon activity
false_positives:
- Unknown
references:
- https://hausec.com/2021/07/26/cobalt-strike-and-tradecraft/
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_generic_1:
    CommandLine|endswith: cmd.exe /C whoami
    ParentImage|startswith: C:\Temp\
  selection_generic_2:
    ParentImage|endswith:
    - \runonce.exe
    - \dllhost.exe
    CommandLine|contains|all:
    - cmd.exe /c echo
    - '> \\\\.\\pipe'
  selection_conhost_1:
    ParentCommandLine|contains|all:
    - cmd.exe /C echo
    - ' > \\\\.\\pipe'
    CommandLine|endswith: conhost.exe 0xffffffff -ForceV1
  selection_conhost_2:
    ParentCommandLine|endswith: /C whoami
    CommandLine|endswith: conhost.exe 0xffffffff -ForceV1
  condition: 1 of selection_*
