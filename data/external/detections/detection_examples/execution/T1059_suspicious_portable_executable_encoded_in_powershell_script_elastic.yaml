technique_id: T1059
technique_name: Suspicious Portable Executable Encoded in Powershell Script
tactic: execution
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    TVqQAAMAAAAEAAAA\n  ) and not user.id : \"S-1-5-18\""
explanation: 'Detects the presence of a portable executable (PE) in a PowerShell script
  by looking for its encoded header. Attackers

  embed PEs into PowerShell scripts to inject them into memory, avoiding defences
  by not writing to disk.'
