technique_id: T1098.003
technique_name: O365 Privileged Role Assigned
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=AzureActiveDirectory Operation IN ("Add
  member to role.","Add eligible member to role.") | eval user = ObjectId, src_user
  = case(match(mvindex(''Actor{}.ID'',-1),"User"),mvindex(''Actor{}.ID'',0),match(mvindex(''Actor{}.ID'',-1),"ServicePrincipal"),mvindex(''Actor{}.ID'',3),true(),mvindex(''Actor{}.ID'',0)),
  object_name = mvindex(''ModifiedProperties{}.NewValue'', mvfind(''ModifiedProperties{}.Name'',"Role\.DisplayName")),
  object_id = mvindex(''ModifiedProperties{}.NewValue'', mvfind(''ModifiedProperties{}.Name'',"Role\.TemplateId")),
  signature = Operation, result = ResultStatus, category = mvindex(''Target{}.ID'',2)
  | fillnull | stats count, min(_time) as firstTime, max(_time) as lastTime by src_user,
  src, user, category, result, object_name, object_id, signature, vendor_account,
  vendor_product, dest | lookup privileged_azure_ad_roles azuretemplateid as object_id
  OUTPUT isprvilegedadrole | search isprvilegedadrole="TRUE" category="User" | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `o365_privileged_role_assigned_filter`'
explanation: The following analytic identifies the assignment of sensitive and privileged
  Azure Active Directory roles to an Azure AD user. Adversaries and red teams alike
  may assign these roles to a compromised account to establish Persistence in an Azure
  AD environment. This detection leverages the O365 Universal Audit Log data source.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/db435700-4ddc-4c23-892e-49e7525d7d39/
indicators:
- type: data_source
  value: Office 365 Universal Audit Log
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_user
  value: src_user
  confidence: high
false_positives:
- description: Administrators will legitimately assign the privileged roles users
    as part of administrative tasks. Microsoft Privileged Identity Management (PIM)
    may cause false positives / less accurate alerting.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1098/003/
- https://learn.microsoft.com/en-us/azure/active-directory/roles/permissions-reference
- https://learn.microsoft.com/en-us/microsoft-365/admin/add-users/about-exchange-online-admin-role?view=o365-worldwide
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098/o365_azure_workload_events/o365_azure_workload_events.log
