technique_id: T1037.001
technique_name: Logon Script Event Trigger Execution
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count  min(_time) as firstTime max(_time)
  as lastTime FROM datamodel=Endpoint.Registry where Registry.registry_path IN ("*\\Environment\\UserInitMprLogonScript")
  by Registry.action Registry.dest Registry.process_guid Registry.process_id Registry.registry_hive
  Registry.registry_path Registry.registry_key_name Registry.registry_value_data Registry.registry_value_name
  Registry.registry_value_type Registry.status Registry.user Registry.vendor_product
  | `security_content_ctime(lastTime)` | `security_content_ctime(firstTime)` | `drop_dm_object_name(Registry)`
  | `logon_script_event_trigger_execution_filter`'
explanation: The following analytic detects the modification of the UserInitMprLogonScript
  registry entry, which is often used by attackers to establish persistence and gain
  privilege escalation upon system boot. It leverages data from the Endpoint.Registry
  data model, focusing on changes to the specified registry path. This activity is
  significant because it is a common technique used by APT groups and malware to ensure
  their payloads execute automatically when the system starts. If confirmed malicious,
  this could allow attackers to maintain persistent access and potentially escalate
  their privileges on the compromised host.
