technique_id: T1489
technique_name: Windows Set Account Password Policy To Unlimited Via Net
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` values(Processes.process) as process
  min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes
  where `process_net` AND Processes.process="* accounts *" AND (Processes.process="*
  /maxpwage:unlimited" OR Processes.process="/maxpwage:49710") by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_set_account_password_policy_to_unlimited_via_net_filter`'
explanation: The following analytic detects the use of net.exe to update user account
  policies to set passwords as non-expiring. It leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on command-line executions involving "/maxpwage:unlimited"
  or "/maxpwage:49710", which achieve a similar outcome theoretically. This activity
  is significant as it can indicate an attempt to maintain persistence, escalate privileges,
  evade defenses, or facilitate lateral movement. If confirmed malicious, this behavior
  could allow an attacker to maintain long-term access to compromised accounts, potentially
  leading to further exploitation and unauthorized access to sensitive information.
