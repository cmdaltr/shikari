fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 90217a70-13fc-48e4-b3db-0d836c5824ac
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ImageLoaded|startswith: C:\\Windows\\Microsoft.NET\\assembly\\GAC_MSIL\n  Image|endswith:\n\
  \  - \\excel.exe\n  - \\mspub.exe\n  - \\onenote.exe\n  - \\onenoteim.exe\n  - \\\
  outlook.exe\n  - \\powerpnt.exe\n  - \\winword.exe\n"
explanation: Detects any GAC DLL being loaded by an Office Product
false_positives:
- Legitimate macro usage. Add the appropriate filter according to your environment
references:
- https://medium.com/threatpunter/detecting-adversary-tradecraft-with-image-load-event-logging-and-eql-8de93338c16
