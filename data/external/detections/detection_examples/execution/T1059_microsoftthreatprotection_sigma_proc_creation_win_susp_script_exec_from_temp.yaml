technique_id: T1059
technique_name: Suspicious Script Execution From Temp Folder
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: a6a39bdb-935c-4f0a-ab77-35f4bbf44d33
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  CommandLine|contains:\n  - ' >'\n  - Out-File\n  - ConvertTo-Json\n \
  \ - -WindowStyle hidden -Verb runAs\n  - \\Windows\\system32\\config\\systemprofile\\\
  AppData\\Local\\Temp\\Amazon\\EC2-Windows\\\nselection:\n  CommandLine|contains:\n\
  \  - \\Windows\\Temp\n  - \\Temporary Internet\n  - \\AppData\\Local\\Temp\n  -\
  \ \\AppData\\Roaming\\Temp\n  - '%TEMP%'\n  - '%TMP%'\n  - '%LocalAppData%\\Temp'\n\
  \  Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\mshta.exe\n  - \\\
  wscript.exe\n  - \\cscript.exe\n"
explanation: Detects a suspicious script executions from temporary folder
false_positives:
- Administrative scripts
references:
- https://www.microsoft.com/security/blog/2021/07/13/microsoft-discovers-threat-actor-targeting-solarwinds-serv-u-software-with-0-day-exploit/
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \mshta.exe
    - \wscript.exe
    - \cscript.exe
    CommandLine|contains:
    - \Windows\Temp
    - \Temporary Internet
    - \AppData\Local\Temp
    - \AppData\Roaming\Temp
    - '%TEMP%'
    - '%TMP%'
    - '%LocalAppData%\Temp'
  filter:
    CommandLine|contains:
    - ' >'
    - Out-File
    - ConvertTo-Json
    - -WindowStyle hidden -Verb runAs
    - \Windows\system32\config\systemprofile\AppData\Local\Temp\Amazon\EC2-Windows\
  condition: selection and not filter
metadata:
  created_date: 2021-07-14
  modified_date: 2022-10-05
