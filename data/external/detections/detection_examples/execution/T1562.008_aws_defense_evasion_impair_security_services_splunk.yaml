false_positives:
- description: Legitimate administrators may occasionally delete GuardDuty detectors,
    WAF rule groups, or CloudWatch alarms during environment reconfiguration, migration,
    or decommissioning activities. In such cases, these events are expected and benign.
    These should be validated against approved change tickets or deployment pipelines
    to differentiate malicious activity from normal operations. Please consider filtering
    out these noisy events using userAgent, user_arn field names.
  mitigation: Review context and user activity
