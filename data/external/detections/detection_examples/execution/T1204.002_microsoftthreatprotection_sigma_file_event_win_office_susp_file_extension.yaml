technique_id: T1204.002
technique_name: File With Uncommon Extension Created By An Office Application
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection* and\
  \ not 1 of filter_main_* and not 1 of filter_optional_*\nfilter_main_localassembly:\n\
  \  TargetFilename|contains: \\AppData\\Local\\assembly\\tmp\\\n  TargetFilename|endswith:\
  \ .dll\nfilter_optional_backstageinappnavcache:\n  TargetFilename|contains|all:\n\
  \  - C:\\Users\\\n  - \\AppData\\Local\\Microsoft\\Office\\\n  - \\BackstageInAppNavCache\\\
  \n  TargetFilename|endswith: .com\nfilter_optional_webex:\n  Image|endswith: \\\
  winword.exe\n  TargetFilename|contains: \\AppData\\Local\\Temp\\webexdelta\\\n \
  \ TargetFilename|endswith:\n  - .dll\n  - .exe\nfilter_optional_webservicecache:\n\
  \  TargetFilename|contains|all:\n  - C:\\Users\\\n  - \\AppData\\Local\\Microsoft\\\
  Office\\\n  - \\WebServiceCache\\AllUsers\n  TargetFilename|endswith: .com\nselection1:\n\
  \  Image|endswith:\n  - \\excel.exe\n  - \\msaccess.exe\n  - \\mspub.exe\n  - \\\
  powerpnt.exe\n  - \\visio.exe\n  - \\winword.exe\nselection2:\n  TargetFilename|endswith:\n\
  \  - .bat\n  - .cmd\n  - .com\n  - .dll\n  - .exe\n  - .hta\n  - .ocx\n  - .proj\n\
  \  - .ps1\n  - .scf\n  - .scr\n  - .sys\n  - .vbe\n  - .vbs\n  - .wsf\n  - .wsh\n"
explanation: Detects the creation of files with an executable or script extension
  by an Office application.
false_positives:
- Unknown
references:
- https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
- https://github.com/vadim-hunter/Detection-Ideas-Rules/blob/02bcbfc2bfb8b4da601bb30de0344ae453aa1afe/Threat%20Intelligence/The%20DFIR%20Report/20210329_Sodinokibi_(aka_REvil)_Ransomware.yaml
tags:
- attack.t1204.002
- attack.execution
logsource:
  product: windows
  category: file_event
detection:
  selection1:
    Image|endswith:
    - \excel.exe
    - \msaccess.exe
    - \mspub.exe
    - \powerpnt.exe
    - \visio.exe
    - \winword.exe
  selection2:
    TargetFilename|endswith:
    - .bat
    - .cmd
    - .com
    - .dll
    - .exe
    - .hta
    - .ocx
    - .proj
    - .ps1
    - .scf
    - .scr
    - .sys
    - .vbe
    - .vbs
    - .wsf
    - .wsh
  filter_main_localassembly:
    TargetFilename|contains: \AppData\Local\assembly\tmp\
    TargetFilename|endswith: .dll
  filter_optional_webservicecache:
    TargetFilename|contains|all:
    - C:\Users\
    - \AppData\Local\Microsoft\Office\
    - \WebServiceCache\AllUsers
    TargetFilename|endswith: .com
  filter_optional_webex:
    Image|endswith: \winword.exe
    TargetFilename|contains: \AppData\Local\Temp\webexdelta\
    TargetFilename|endswith:
    - .dll
    - .exe
  filter_optional_backstageinappnavcache:
    TargetFilename|contains|all:
    - C:\Users\
    - \AppData\Local\Microsoft\Office\
    - \BackstageInAppNavCache\
    TargetFilename|endswith: .com
  condition: all of selection* and not 1 of filter_main_* and not 1 of filter_optional_*
