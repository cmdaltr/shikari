technique_id: T1036.002
technique_name: Potential File Extension Spoofing Using Right-to-Left Override
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 979baf41-ca44-4540-9d0c-4fcef3b5a3a4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_extensions:\n  TargetFilename|contains:\n  - 3pm.\n  - 4pm.\n  - cod.\n\
  \  - fdp.\n  - ftr.\n  - gepj.\n  - gnp.\n  - gpj.\n  - ism.\n  - lmth.\n  - nls.\n\
  \  - piz.\n  - slx.\n  - tdo.\n  - vsc.\n  - vwm.\n  - xcod.\n  - xslx.\n  - xtpp.\n\
  selection_rtlo_unicode:\n  TargetFilename|contains:\n  - \\u202e\n  - '[U+202E]'\n"
explanation: 'Detects suspicious filenames that contain a right-to-left override character
  and a potentially spoofed file extensions.

  '
false_positives:
- Filenames that contains scriptures such as arabic or hebrew might make use of this
  character
references:
- https://redcanary.com/blog/right-to-left-override/
- https://www.malwarebytes.com/blog/news/2014/01/the-rtlo-method
- https://tria.ge/241015-l98snsyeje/behavioral2
- https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
tags:
- attack.execution
- attack.defense-evasion
- attack.t1036.002
logsource:
  category: file_event
  product: windows
detection:
  selection_rtlo_unicode:
    TargetFilename|contains:
    - \u202e
    - '[U+202E]'
  selection_extensions:
