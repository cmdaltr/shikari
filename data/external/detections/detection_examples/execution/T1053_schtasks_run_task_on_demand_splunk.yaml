technique_id: T1053
technique_name: Schtasks Run Task On Demand
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` values(Processes.process) as process
  values(Processes.process_id) as process_id count min(_time) as firstTime max(_time)
  as lastTime  from datamodel=Endpoint.Processes where Processes.process_name = "schtasks.exe"
  Processes.process = "*/run*" by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `schtasks_run_task_on_demand_filter`'
explanation: The following analytic detects the execution of a Windows Scheduled Task
  on demand via the shell or command line. It leverages process-related data, including
  process name, parent process, and command-line executions, sourced from endpoint
  logs. The detection focuses on 'schtasks.exe' with an associated 'run' command.
  This activity is significant as adversaries often use it to force the execution
  of their created Scheduled Tasks for persistent access or lateral movement within
  a compromised machine. If confirmed malicious, this could allow attackers to maintain
  persistence or move laterally within the network, potentially leading to further
  compromise.
source: Splunk Security Content
