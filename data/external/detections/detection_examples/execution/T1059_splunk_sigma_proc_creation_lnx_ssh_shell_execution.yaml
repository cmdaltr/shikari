technique_id: T1059
technique_name: Shell Invocation Via Ssh - Linux
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 8737b7f6-8df3-4bb7-b1da-06019b99b687
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - /bin/bash\n  - /bin/dash\n  - /bin/fish\n\
  \  - /bin/sh\n  - /bin/zsh\n  - sh 0<&2 1>&2\n  - sh 1>&2 0<&2\nselection_img:\n\
  \  CommandLine|contains:\n  - ProxyCommand=;\n  - permitlocalcommand=yes\n  - localhost\n\
  \  Image|endswith: /ssh\n"
explanation: 'Detects the use of the "ssh" utility to execute a shell. Such behavior
  may be associated with privilege escalation, unauthorized command execution, or
  to break out from restricted environments.

  '
false_positives:
- Unknown
references:
- https://gtfobins.github.io/gtfobins/ssh/
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: /ssh
    CommandLine|contains:
    - ProxyCommand=;
    - permitlocalcommand=yes
    - localhost
  selection_cli:
    CommandLine|contains:
    - /bin/bash
    - /bin/dash
    - /bin/fish
    - /bin/sh
    - /bin/zsh
    - sh 0<&2 1>&2
    - sh 1>&2 0<&2
  condition: all of selection_*
