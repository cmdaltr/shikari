technique_id: T1059.001
technique_name: Potentially Suspicious Command Executed Via Run Dialog Box - Registry
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: a7df0e9e-91a5-459a-a003-4cde67c2ff5d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_key and (all\
  \ of selection_powershell_* or all of selection_wmic_*)\nselection_key:\n  TargetObject|contains:\
  \ \\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU\nselection_powershell_command:\n\
  \  Details|contains:\n  - powershell\n  - pwsh\nselection_powershell_susp_keywords:\n\
  \  Details|contains:\n  - ' -e '\n  - ' -ec '\n  - ' -en '\n  - ' -enc '\n  - '\
  \ -enco'\n  - ftp\n  - Hidden\n  - http\n  - iex\n  - Invoke-\nselection_wmic_command:\n\
  \  Details|contains: wmic\nselection_wmic_susp_keywords:\n  Details|contains:\n\
  \  - shadowcopy\n  - process call create\n"
explanation: 'Detects execution of commands via the run dialog box on Windows by checking
  values of the "RunMRU" registry key.

  This technique was seen being abused by threat actors to deceive users into pasting
  and executing malicious commands, often disguised as CAPTCHA verification steps.

  '
false_positives:
- Unknown
references:
- https://medium.com/@ahmed.moh.farou2/fake-captcha-campaign-on-arabic-pirated-movie-sites-delivers-lumma-stealer-4f203f7adabf
- https://medium.com/@shaherzakaria8/downloading-trojan-lumma-infostealer-through-capatcha-1f25255a0e71
- https://www.forensafe.com/blogs/runmrukey.html
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-october-2024/
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: registry_set
detection:
  selection_key:
    TargetObject|contains: \Microsoft\Windows\CurrentVersion\Explorer\RunMRU
  selection_powershell_command:
    Details|contains:
    - powershell
    - pwsh
  selection_powershell_susp_keywords:
    Details|contains:
    - ' -e '
    - ' -ec '
    - ' -en '
    - ' -enc '
    - ' -enco'
    - ftp
    - Hidden
    - http
    - iex
    - Invoke-
  selection_wmic_command:
    Details|contains: wmic
  selection_wmic_susp_keywords:
    Details|contains:
    - shadowcopy
    - process call create
  condition: selection_key and (all of selection_powershell_* or all of selection_wmic_*)
