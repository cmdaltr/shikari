query: '# Sigma Detection Logic

  # Convert to platform-specific query using Sigma tools:

  # https://github.com/SigmaHQ/sigma


  condition: keywords

  keywords:

  - wget * - http* | perl

  - wget * - http* | sh

  - wget * - http* | bash

  - python -m SimpleHTTPServer

  - -m http.server

  - import pty; pty.spawn*

  - socat exec:*

  - socat -O /tmp/*

  - socat tcp-connect*

  - ''*echo binary >>*''

  - ''*wget *; chmod +x*''

  - ''*wget *; chmod 777 *''

  - ''*cd /tmp || cd /var/run || cd /mnt*''

  - ''*stop;service iptables stop;*''

  - ''*stop;SuSEfirewall2 stop;*''

  - chmod 777 2020*

  - ''*>>/etc/rc.local''

  - ''*base64 -d /tmp/*''

  - ''* | base64 -d *''

  - ''*/chmod u+s *''

  - ''*chmod +s /tmp/*''

  - ''*chmod u+s /tmp/*''

  - ''* /tmp/haxhax*''

  - ''* /tmp/ns_sploit*''

  - nc -l -p *

  - cp /bin/ksh *

  - cp /bin/sh *

  - ''* /tmp/*.b64 *''

  - ''*/tmp/ysocereal.jar*''

  - ''*/tmp/x *''

  - ''*; chmod +x /tmp/*''

  - ''*;chmod +x /tmp/*''

  '
explanation: Detects suspicious shell commands used in various exploit codes (see
  references)
false_positives:
- Unknown
