technique_id: T1059
technique_name: Potential Code Execution via Postgresql
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  event.action in (\"exec\", \"exec_event\", \"fork\", \"fork_event\") and user.name\
  \ == \"postgres\" and (\n  (process.parent.args : \"*sh\" and process.parent.args\
  \ : \"echo*\") or\n  (process.args : \"*sh\" and process.args : \"echo*\")\n) and\
  \ not (\n  process.parent.name == \"puppet\" or\n  process.command_line like (\n\
  \    \"*BECOME-SUCCESS-*\", \"bash -c while true; do sleep 1;*\", \"df -l\", \"\
  sleep 1\", \"who\", \"head -v -n *\", \"tail -v -n *\",\n    \"/bin/sh -c echo BECOME-SUCCESS*\"\
  , \"/usr/bin/python3 /var/tmp/ansible-tmp*\"\n  ) or\n  process.parent.command_line\
  \ like \"*BECOME-SUCCESS-*\"\n)"
explanation: 'This rule monitors for suspicious activities that may indicate an attacker
  attempting to execute arbitrary code within a

  PostgreSQL environment. Attackers can execute code via PostgreSQL as a result of
  gaining unauthorized access to a public

  facing PostgreSQL database or exploiting vulnerabilities, such as remote command
  execution and SQL injection attacks,

  which can result in unauthorized access and malicious actions, and facilitate post-exploitation
  activities for

  unauthorized access and malicious actions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2a692072-d78d-42f3-a48a-775677d79c4e.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Puppet processes may trigger false positives due to their legitimate use of
    shell commands. To mitigate this, ensure that puppet-related processes are excluded
    by verifying that process.parent.name is set to "puppet".

    - Automation tools that use shell scripts for configuration management might be
    flagged. Review and exclude these by checking for specific command patterns that
    are known to be safe, such as those containing "BECOME-SUCCESS".

    - Scheduled maintenance scrip'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
