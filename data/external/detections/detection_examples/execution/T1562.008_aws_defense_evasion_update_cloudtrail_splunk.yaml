technique_id: T1562.008
technique_name: AWS Defense Evasion Update Cloudtrail
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName = UpdateTrail eventSource = cloudtrail.amazonaws.com
  userAgent !=console.amazonaws.com errorCode = success | rename user_name as user
  | stats count min(_time) as firstTime max(_time) as lastTime by signature dest user
  user_agent src vendor_account vendor_region vendor_product | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)`| `aws_defense_evasion_update_cloudtrail_filter`'
explanation: The following analytic detects `UpdateTrail` events in AWS CloudTrail
  logs. It identifies attempts to modify CloudTrail settings, potentially to evade
  logging. The detection leverages CloudTrail logs, focusing on `UpdateTrail` events
  where the user agent is not the AWS console and the operation is successful. This
  activity is significant because altering CloudTrail settings can disable or limit
  logging, hindering visibility into AWS account activities. If confirmed malicious,
  this could allow attackers to operate undetected, compromising the integrity and
  security of the AWS environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/7c921d28-ef48-4f1b-85b3-0af8af7697db/
indicators:
