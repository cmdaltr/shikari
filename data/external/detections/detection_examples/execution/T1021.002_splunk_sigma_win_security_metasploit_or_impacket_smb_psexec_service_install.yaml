technique_id: T1021.002
technique_name: Metasploit Or Impacket Service Installation Via SMB PsExec
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 6fb63b40-e02a-403e-9ffd-3bcc1d749442
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ServiceName: PSEXESVC\nselection:\n  EventID: 4697\n  ServiceFileName|re:\
  \ ^%systemroot%\\\\[a-zA-Z]{8}\\.exe$\n  ServiceName|re: (^[a-zA-Z]{4}$)|(^[a-zA-Z]{8}$)|(^[a-zA-Z]{16}$)\n\
  \  ServiceStartType: 3\n  ServiceType: '0x10'\n"
explanation: Detects usage of Metasploit SMB PsExec (exploit/windows/smb/psexec) and
  Impacket psexec.py by triggering on specific service installation
false_positives:
- Possible, different agents with a 8 character binary and a 4, 8 or 16 character
  service name
references:
- https://bczyz1.github.io/2021/01/30/psexec.html
tags:
- attack.lateral-movement
- attack.t1021.002
