technique_id: T1078
technique_name: ESXi Account Modified
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`esxi_syslog` Message="*esxcli system account*" Message IN ("*-i *","*--id*")
  NOT Message="*[shell*" | rex field=_raw "Z (?<dest>[\w\.]+)\s.*: \[(?<initial_user>\w+)]:\s.+-i[d]*\s(?<modified_user>[\w_\-0-9]+)"
  | stats min(_time) as firstTime max(_time) as lastTime count by dest initial_user
  modified_user | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `esxi_account_modified_filter`'
explanation: This detection identifies the creation, deletion, or modification of
  a local user account on an ESXi host. This activity may indicate unauthorized access,
  indicator removal, or persistence attempts by an attacker seeking to establish or
  maintain control of the host.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/b5e3b024-a7bb-4019-8975-46cf54485e78/
indicators:
- type: data_source
  value: VMWare ESXi Syslog
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: New local accounts being created in ESXi is rare in most environments.
    Tune as needed.
  mitigation: Review context and user activity
references:
- https://detect.fyi/detecting-and-responding-to-esxi-compromise-with-splunk-f33998ce7823
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098/esxi_account_modification/esxi_account_modified.log
