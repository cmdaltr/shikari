technique_id: T1072
technique_name: New GitHub App Installed
tactic: execution
platform: Elastic
fidelity_score: 0.88
validated: true
query: configuration where event.dataset == "github.audit" and event.action == "integration_installation.create"
explanation: 'This rule detects when a new GitHub App has been installed in your organization
  account. GitHub Apps extend GitHub''s

  functionality both within and outside of GitHub. When an app is installed it is
  granted permissions to read or modify

  your repository and organization data. Only trusted apps should be installed and
  any newly installed apps should be

  investigated to verify their legitimacy. Unauthorized app installation could lower
  your organization''s security posture

  and leave you exposed for future attacks.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1ca62f14-4787-4913-b7af-df11745a49da.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Github
  confidence: high
false_positives:
- description: 'False positive analysis


    - Frequent installations of trusted internal apps may trigger alerts. To manage
    this, maintain a list of approved internal apps and create exceptions for these
    in the detection rule.

    - Automated deployment tools that integrate with GitHub might cause false positives.
    Identify these tools and exclude their installation events from triggering alerts.

    - Regular updates or re-installations of existing apps can be mistaken for new
    installations. Track app version updates sepa'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
