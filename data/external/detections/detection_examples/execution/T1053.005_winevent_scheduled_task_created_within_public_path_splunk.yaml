  value: Windows Event Log Security 4698
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: False positives are possible if legitimate applications are allowed
    to register tasks in public paths. Filter as needed based on paths that are used
    legitimately.
  mitigation: Review context and user activity
