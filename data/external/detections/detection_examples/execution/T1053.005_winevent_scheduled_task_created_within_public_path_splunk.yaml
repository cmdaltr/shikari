technique_id: T1053.005
technique_name: WinEvent Scheduled Task Created Within Public Path
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "`wineventlog_security`\nEventCode=4698 \nTaskContent IN (\n  \"*\\\\users\\\
  \\public\\\\*\", \"*\\\\programdata\\\\*\", \"*\\\\temp\\\\*\", \n  \"*\\\\Windows\\\
  \\Tasks\\\\*\", \"*\\\\appdata\\\\*\", \"*\\\\perflogs\\\\*\"\n  )\n| stats count\
  \ min(_time) as firstTime max(_time) as lastTime \n  by Computer, TaskName, TaskContent,\
  \ user \n|  rename Computer as dest \n| `security_content_ctime(firstTime)` \n|\
  \ `security_content_ctime(lastTime)`\n| `winevent_scheduled_task_created_within_public_path_filter`"
explanation: The following analytic detects the creation of scheduled tasks within
  user-writable paths using Windows Security EventCode 4698. It identifies tasks registered
  via schtasks.exe or TaskService that execute commands from directories like Public,
  ProgramData, Temp, and AppData. This behavior is significant as it may indicate
  an attempt to establish persistence or execute unauthorized commands. If confirmed
  malicious, an attacker could maintain long-term access, escalate privileges, or
  execute arbitrary code, posing a severe threat to system integrity and security.
source: Splunk Security Content
