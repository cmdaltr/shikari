technique_id: T1078.004
technique_name: Azure AD Multiple Failed MFA Requests For User
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` category=SignInLogs operationName="Sign-in activity" properties.status.errorCode=500121
  properties.status.additionalDetails!="MFA denied; user declined the authentication"
  | rename properties.* as * | bucket span=10m _time | rename userAgent as user_agent
  | fillnull | stats count min(_time) as firstTime max(_time) as lastTime values(dest)
  as dest values(src) as src by user, status.additionalDetails, appDisplayName, user_agent,
  vendor_account, vendor_product, signature | where count > 10 | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `azure_ad_multiple_failed_mfa_requests_for_user_filter`'
explanation: The following analytic identifies multiple failed multi-factor authentication
  (MFA) requests for a single user within an Azure AD tenant. It leverages Azure AD
  Sign-in Logs, specifically error code 500121, to detect more than 10 failed MFA
  attempts within 10 minutes. This behavior is significant as it may indicate an adversary
  attempting to bypass MFA by bombarding the user with repeated authentication prompts.
  If confirmed malicious, this activity could lead to unauthorized access, allowing
  attackers to compromise user accounts and potentially escalate their privileges
  within the environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/264ea131-ab1f-41b8-90e0-33ad1a1888ea/
indicators:
- type: data_source
  value: Azure Active Directory Sign-in activity
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Multiple Failed MFA requests may also be a sign of authentication or
    application issues. Filter as needed.
  mitigation: Review context and user activity
