false_positives:
- description: 'False positive analysis


    - Legitimate system maintenance tasks may trigger this rule if they involve decompressing
    logs or data files using funzip. To manage this, identify and exclude specific
    maintenance scripts or processes that are known to use funzip in a non-threatening
    manner.

    - Automated backup or data processing operations might use funzip in combination
    with tail for legitimate purposes. Review these operations and add exceptions
    for known benign processes or scripts that match this pa'
  mitigation: Review investigation guide for details
references:
- https://attack.mitre.org/software/S0482/
