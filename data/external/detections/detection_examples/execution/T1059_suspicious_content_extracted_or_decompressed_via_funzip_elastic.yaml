technique_id: T1059
technique_name: Suspicious Content Extracted or Decompressed via Funzip
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: 'process where host.os.type == "linux" and event.action in ("exec", "exec_event",
  "start") and

  ((process.args == "tail" and process.args == "-c" and process.args == "funzip"))
  and

  not process.args : "/var/log/messages" and

  not process.parent.executable : ("/usr/bin/dracut", "/sbin/dracut", "/usr/bin/xargs")
  and

  not (process.parent.name in ("sh", "sudo") and process.parent.command_line : "*nessus_su*")'
explanation: 'Identifies when suspicious content is extracted from a file and subsequently
  decompressed using the funzip utility.

  Malware may execute the tail utility using the "-c" option to read a sequence of
  bytes from the end of a file. The

  output from tail can be piped to funzip in order to decompress malicious code before
  it is executed. This behavior is

  consistent with malware families such as Bundlore.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/dc0b7782-0df0-47ff-8337-db0d678bdb66.toml
query_type: eql
query_language: eql
