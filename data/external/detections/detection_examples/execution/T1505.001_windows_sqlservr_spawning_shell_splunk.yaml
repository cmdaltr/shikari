  value: dest
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate administrative activities or monitoring tools might occasionally
    spawn command shells from sqlservr.exe. Review the process command-line arguments
    and consider filtering out known legitimate processes or users.
  mitigation: Review context and user activity
