technique_id: T1204.002
technique_name: Suspicious WMIC Execution Via Office Process
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: e1693bc8-7168-4eab-8718-cdcaa68a1738
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_parent:\n  ParentImage|endswith:\n  - \\WINWORD.EXE\n  - \\EXCEL.EXE\n\
  \  - \\POWERPNT.exe\n  - \\MSPUB.exe\n  - \\VISIO.exe\n  - \\MSACCESS.EXE\n  - \\\
  EQNEDT32.EXE\n  - \\ONENOTE.EXE\n  - \\wordpad.exe\n  - \\wordview.exe\nselection_wmic_cli:\n\
  \  CommandLine|contains:\n  - regsvr32\n  - rundll32\n  - msiexec\n  - mshta\n \
  \ - verclsid\n  - wscript\n  - cscript\n  CommandLine|contains|all:\n  - process\n\
  \  - create\n  - call\nselection_wmic_img:\n- Image|endswith: \\wbem\\WMIC.exe\n\
  - OriginalFileName: wmic.exe\n"
explanation: Office application called wmic to proxye execution through a LOLBIN process.
  This is often used to break suspicious parent-child chain (Office app spawns LOLBin).
false_positives:
- Unknown
references:
- https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
- https://github.com/vadim-hunter/Detection-Ideas-Rules/blob/02bcbfc2bfb8b4da601bb30de0344ae453aa1afe/Threat%20Intelligence/The%20DFIR%20Report/20210329_Sodinokibi_(aka_REvil)_Ransomware.yaml
tags:
- attack.t1204.002
- attack.t1047
- attack.t1218.010
- attack.execution
- attack.defense-evasion
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - \WINWORD.EXE
    - \EXCEL.EXE
    - \POWERPNT.exe
    - \MSPUB.exe
    - \VISIO.exe
    - \MSACCESS.EXE
    - \EQNEDT32.EXE
    - \ONENOTE.EXE
    - \wordpad.exe
    - \wordview.exe
  selection_wmic_img:
  - Image|endswith: \wbem\WMIC.exe
  - OriginalFileName: wmic.exe
  selection_wmic_cli:
    CommandLine|contains|all:
    - process
    - create
    - call
    CommandLine|contains:
    - regsvr32
    - rundll32
    - msiexec
    - mshta
    - verclsid
    - wscript
    - cscript
  condition: all of selection_*
