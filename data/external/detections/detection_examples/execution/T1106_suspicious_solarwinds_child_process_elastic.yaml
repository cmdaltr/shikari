technique_id: T1106
technique_name: Suspicious SolarWinds Child Process
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.name: (\"SolarWinds.BusinessLayerHost.exe\", \"SolarWinds.BusinessLayerHostx64.exe\"\
  ) and\n not (\n    process.name : (\n        \"APMServiceControl*.exe\",\n     \
  \   \"ExportToPDFCmd*.Exe\",\n        \"SolarWinds.Credentials.Orion.WebApi*.exe\"\
  ,\n        \"SolarWinds.Orion.Topology.Calculator*.exe\",\n        \"Database-Maint.exe\"\
  ,\n        \"SolarWinds.Orion.ApiPoller.Service.exe\",\n        \"WerFault.exe\"\
  ,\n        \"WerMgr.exe\",\n        \"SolarWinds.BusinessLayerHost.exe\",\n    \
  \    \"SolarWinds.BusinessLayerHostx64.exe\",\n        \"SolarWinds.Topology.Calculator.exe\"\
  ,\n        \"SolarWinds.Topology.Calculatorx64.exe\",\n        \"SolarWinds.APM.RealTimeProcessPoller.exe\"\
  ) and\n    process.code_signature.trusted == true\n ) and\n not process.executable\
  \ : (\"?:\\\\Windows\\\\SysWOW64\\\\ARP.EXE\", \"?:\\\\Windows\\\\SysWOW64\\\\lodctr.exe\"\
  , \"?:\\\\Windows\\\\SysWOW64\\\\unlodctr.exe\")"
explanation: A suspicious SolarWinds child process was detected, which may indicate
  an attempt to execute malicious programs.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/93b22c0a-06a0-4131-b830-b10d5e166ff4.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate SolarWinds updates or patches may trigger the rule. Ensure that the
    process code signature is verified as trusted and matches known update signatures.

    - Custom scripts or tools integrated with SolarWinds for automation purposes might
    be flagged. Review these processes and add them to the exclusion list if they
    are verified as safe and necessary for operations.

    - Third-party plugins or extensions that interact with SolarWinds could be misidentified.
    Validate'
  mitigation: Review investigation guide for details
references:
- https://www.fireeye.com/blog/threat-research/2020/12/evasive-attacker-leverages-solarwinds-supply-chain-compromises-with-sunburst-backdoor.html
- https://github.com/mandiant/sunburst_countermeasures/blob/main/rules/SUNBURST/hxioc/SUNBURST%20SUSPICIOUS%20CHILD%20PROCESSES%20(METHODOLOGY).ioc
has_investigation_guide: true
risk_score: 47
