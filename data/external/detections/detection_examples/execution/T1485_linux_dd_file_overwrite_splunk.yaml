technique_id: T1485
technique_name: Linux DD File Overwrite
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name = "dd"
  AND Processes.process = "*of=*" by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `linux_dd_file_overwrite_filter`'
explanation: The following analytic detects the use of the 'dd' command to overwrite
  files on a Linux system. It leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on process execution logs that include command-line details.
  This activity is significant because adversaries often use the 'dd' command to destroy
  or irreversibly overwrite files, disrupting system availability and services. If
  confirmed malicious, this behavior could lead to data destruction, making recovery
  difficult and potentially causing significant operational disruptions.
source: Splunk Security Content
