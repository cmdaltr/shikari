technique_id: T1059
technique_name: Binary Executed from Shared Memory Directory
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'process where host.os.type == "linux" and event.type == "start" and event.action
  in ("exec", "exec_event") and

  user.id == "0" and process.executable : ("/dev/shm/*", "/run/shm/*", "/var/run/*",
  "/var/lock/*") and

  not process.executable : ("/var/run/docker/*", "/var/run/utsns/*", "/var/run/s6/*",
  "/var/run/cloudera-scm-agent/*",

  "/var/run/argo/argoexec") and not process.parent.command_line : "/usr/bin/runc init"'
explanation: 'Identifies the execution of a binary by root in Linux shared memory
  directories: (/dev/shm/, /run/shm/, /var/run/,

  /var/lock/). This activity is to be considered highly abnormal and should be investigated.
  Threat actors have placed

  executables used for persistence on high-uptime servers in these directories as
  system backdoors.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3f3f9fe2-d095-11ec-95dc-f661ea17fbce.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Docker-related processes can trigger false positives when binaries are executed
    from shared memory directories. To mitigate this, exclude paths like /var/run/docker/*
    from the detection rule.

    - Processes related to container orchestration tools such as Kubernetes might
    also cause false positives. Exclude paths like /var/run/utsns/* and /var/run/s6/*
    to prevent these.

    - Cloudera services may execute binaries from shared memory directories as part
    of their normal operati'
  mitigation: Review investigation guide for details
references:
- https://linuxsecurity.com/features/fileless-malware-on-linux
- https://twitter.com/GossiTheDog/status/1522964028284411907
- https://www.elastic.co/security-labs/a-peek-behind-the-bpfdoor
has_investigation_guide: true
risk_score: 73
