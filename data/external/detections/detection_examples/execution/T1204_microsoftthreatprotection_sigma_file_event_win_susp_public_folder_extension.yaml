technique_id: T1204
technique_name: Suspicious Binaries and Scripts in Public Folder
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: b447f7de-1e53-4cbf-bfb4-f1f6d0b04e4e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetFilename|contains: :\\Users\\Public\\\n  TargetFilename|endswith:\n  -\
  \ .bat\n  - .dll\n  - .exe\n  - .hta\n  - .js\n  - .ps1\n  - .vbe\n  - .vbs\n"
explanation: Detects the creation of a file with a suspicious extension in the public
  folder, which could indicate potential malicious activity.
false_positives:
- Administrators deploying legitimate binaries to public folders.
