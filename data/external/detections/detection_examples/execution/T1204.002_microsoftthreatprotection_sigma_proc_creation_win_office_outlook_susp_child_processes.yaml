  \  - \\forfiles.exe\n  - \\hh.exe\n  - \\mftrace.exe\n  - \\msbuild.exe\n  - \\\
  msdt.exe\n  - \\mshta.exe\n  - \\msiexec.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n\
  \  - \\regsvr32.exe\n  - \\schtasks.exe\n  - \\scrcons.exe\n  - \\scriptrunner.exe\n\
  \  - \\sh.exe\n  - \\svchost.exe\n  - \\wmic.exe\n  - \\wscript.exe\n  ParentImage|endswith:\
  \ \\OUTLOOK.EXE\n"
explanation: Detects a suspicious process spawning from an Outlook process.
