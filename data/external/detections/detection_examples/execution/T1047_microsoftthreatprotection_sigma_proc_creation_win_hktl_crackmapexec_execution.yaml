technique_id: T1047
technique_name: HackTool - CrackMapExec Execution
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_* or all\
  \ of part_localauth*\npart_localauth_1:\n  CommandLine|contains|all:\n  - ' --local-auth'\n\
  \  - ' -u '\n  - ' -p '\npart_localauth_2:\n  CommandLine|contains|all:\n  - ' 10.'\n\
  \  - ' 192.168.'\n  - '/24 '\nselection_binary:\n  Image|endswith: \\crackmapexec.exe\n\
  selection_execute:\n  CommandLine|contains|all:\n  - ' --local-auth'\n  - ' -u '\n\
  \  - ' -x '\nselection_hash:\n  CommandLine|contains|all:\n  - ' --local-auth'\n\
  \  - ' -u '\n  - ' -p '\n  - ' -H ''NTHASH'''\nselection_module_mssql:\n  CommandLine|contains|all:\n\
  \  - ' mssql '\n  - ' -u '\n  - ' -p '\n  - ' -M '\n  - ' -d '\nselection_module_smb1:\n\
  \  CommandLine|contains|all:\n  - ' smb '\n  - ' -u '\n  - ' -H '\n  - ' -M '\n\
  \  - ' -o '\nselection_module_smb2:\n  CommandLine|contains|all:\n  - ' smb '\n\
  \  - ' -u '\n  - ' -p '\n  - ' --local-auth'\nselection_special:\n  CommandLine|contains:\
  \ ' -M pe_inject '\n"
explanation: This rule detect common flag combinations used by CrackMapExec in order
  to detect its use even if the binary has been replaced.
false_positives:
- Unknown
references:
- https://mpgn.gitbook.io/crackmapexec/smb-protocol/authentication/checking-credentials-local
- https://www.mandiant.com/resources/telegram-malware-iranian-espionage
- https://www.infosecmatter.com/crackmapexec-module-library/?cmem=mssql-mimikatz
- https://www.infosecmatter.com/crackmapexec-module-library/?cmem=smb-pe_inject
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.credential-access
- attack.discovery
- attack.t1047
- attack.t1053
- attack.t1059.003
- attack.t1059.001
- attack.t1110
- attack.t1201
logsource:
  category: process_creation
  product: windows
detection:
  selection_binary:
    Image|endswith: \crackmapexec.exe
  selection_special:
    CommandLine|contains: ' -M pe_inject '
  selection_execute:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -x '
  selection_hash:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -p '
    - ' -H ''NTHASH'''
  selection_module_mssql:
    CommandLine|contains|all:
    - ' mssql '
    - ' -u '
    - ' -p '
    - ' -M '
    - ' -d '
  selection_module_smb1:
    CommandLine|contains|all:
    - ' smb '
    - ' -u '
    - ' -H '
    - ' -M '
    - ' -o '
  selection_module_smb2:
    CommandLine|contains|all:
    - ' smb '
    - ' -u '
    - ' -p '
    - ' --local-auth'
  part_localauth_1:
    CommandLine|contains|all:
    - ' --local-auth'
    - ' -u '
    - ' -p '
  part_localauth_2:
    CommandLine|contains|all:
    - ' 10.'
    - ' 192.168.'
    - '/24 '
  condition: 1 of selection_* or all of part_localauth*
