technique_id: T1059.006
technique_name: Interactive Terminal Spawned via Python
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ in (\"exec\", \"exec_event\", \"start\") and\n(\n  (process.parent.name : \"python*\"\
  \ and process.name in (\"bash\", \"dash\", \"ash\", \"sh\", \"tcsh\", \"csh\", \"\
  zsh\", \"ksh\",\n   \"fish\") and process.parent.args_count >= 3 and process.parent.args\
  \ : \"*pty.spawn*\" and process.parent.args : \"-c\") or\n  (process.parent.name\
  \ : \"python*\" and process.name in (\"bash\", \"dash\", \"ash\", \"sh\", \"tcsh\"\
  , \"csh\", \"zsh\", \"ksh\",\n   \"fish\") and process.args : \"*sh\" and process.args_count\
  \ == 1 and process.parent.args_count == 1)\n)"
explanation: 'Identifies when a terminal (tty) is spawned via Python. Attackers may
  upgrade a simple reverse shell to a fully

  interactive tty after obtaining initial access to a host.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d76b02ef-fc95-4001-9297-01cb7412232f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Administrative scripts or automation tools that use Python to manage system
    processes may trigger this rule. To handle this, identify and whitelist specific
    scripts or tools that are known to perform legitimate tasks.

    - Developers or system administrators using Python for interactive debugging or
    system management might inadvertently match the rule''s criteria. Consider excluding
    processes initiated by trusted user accounts or within specific directories associated
    with'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
