technique_id: T1562.008
technique_name: ASL AWS Defense Evasion Delete CloudWatch Log Group
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`amazon_security_lake` api.operation=DeleteLogGroup | fillnull | stats count
  min(_time) as firstTime max(_time) as lastTime by actor.user.uid api.operation api.service.name
  http_request.user_agent src_endpoint.ip actor.user.account.uid cloud.provider cloud.region
  | rename actor.user.uid as user api.operation as action api.service.name as dest
  http_request.user_agent as user_agent src_endpoint.ip as src actor.user.account.uid
  as vendor_account cloud.provider as vendor_product cloud.region as vendor_region
  | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)` | `asl_aws_defense_evasion_delete_cloudwatch_log_group_filter`'
explanation: The following analytic detects the deletion of CloudWatch log groups
  in AWS, identified through `DeleteLogGroup` events in CloudTrail logs. This method
  leverages Amazon Security Lake logs parsed in the OCSF format. The activity is significant
  because attackers may delete log groups to evade detection and disrupt logging capabilities,
  hindering incident response efforts. If confirmed malicious, this action could allow
  attackers to cover their tracks, making it difficult to trace their activities and
  potentially leading to undetected data breaches or further malicious actions within
  the compromised AWS environment.
