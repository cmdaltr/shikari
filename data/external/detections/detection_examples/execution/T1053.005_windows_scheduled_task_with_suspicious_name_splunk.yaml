technique_id: T1053.005
technique_name: Windows Scheduled Task with Suspicious Name
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "`wineventlog_security` EventCode IN (4698,4700,4702)\n| eval TaskContent =\
  \ case(isnotnull(TaskContentNew),TaskContentNew,true(),TaskContent)\n| xmlkv TaskContent\n\
  | stats count min(_time) as firstTime max(_time) as lastTime latest(Arguments) as\
  \ Arguments latest(Author) as Author by Computer, TaskName, Command, Enabled, Hidden,Caller_User_Name,\
  \ EventCode\n| lookup windows_suspicious_tasks task_name as TaskName \n| where isnotnull(tool_type)\n\
  | eval command=TaskName, process=Command+if(isnotnull(Arguments),\" \".Arguments,\"\
  \"), src_user=Author, user = Caller_User_Name, dest = Computer\n| `security_content_ctime(firstTime)`\
  \ \n| `security_content_ctime(lastTime)`\n| `windows_scheduled_task_with_suspicious_name_filter`"
explanation: The following analytic detects the creation, modification, or enabling
  of scheduled tasks with known suspicious or malicious task names. It leverages Windows
  Security EventCode 4698, 4700, and 4702 to identify when such tasks are registered,
  modified, or enabled. This activity is significant as it may indicate an attempt
  to establish persistence or execute malicious commands on a system. If confirmed
  malicious, this could allow an attacker to maintain access, execute arbitrary code,
  or escalate privileges, posing a severe threat to the environment.
source: Splunk Security Content
