query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_extension:\n  CommandLine|contains:\n  - .csv\n  - .dat\n  - .doc\n  -\
  \ .gif\n  - .jpeg\n  - .jpg\n  - .png\n  - .ppt\n  - .txt\n  - .xls\n  - .xml\n\
  selection_img:\n- OriginalFileName:\n  - wscript.exe\n  - cscript.exe\n- Image|endswith:\n\
  \  - \\wscript.exe\n  - \\cscript.exe\n"
explanation: Detects Wscript/Cscript executing a file with an uncommon (i.e. non-script)
  extension
