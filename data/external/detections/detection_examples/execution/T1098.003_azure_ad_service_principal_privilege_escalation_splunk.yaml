technique_id: T1098.003
technique_name: Azure AD Service Principal Privilege Escalation
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` category=AuditLogs operationName="Add app role assignment
  to service principal" properties.initiatedBy.app.displayName=* properties.result=Success
  | spath path=properties{}.targetResources{}.modifiedProperties{} output=targetResources
  | rename properties.* as * | eval user="NA" | eval src="NA" | stats min(_time) as
  firstTime max(_time) as lastTime values(eval(mvfilter(match(targetResources, "AppRole.Value"))))
  as appRole, values(eval(mvfilter(match(targetResources, "ServicePrincipal.DisplayName"))))
  as targetServicePrincipal values(eval(mvindex(''properties.targetResources{}.displayName'',0)))
  as targetAppContext values(user_agent) as user_agent values(identity) as servicePrincipal
  values(properties.initiatedBy.app.servicePrincipalId) as servicePrincipalId by dest
  user src vendor_account vendor_product signature | spath input=appRole path=newValue
  output=appRole | spath input=targetServicePrincipal path=newValue output=targetServicePrincipal
  | eval appRole=trim(replace(appRole, "\"", "")), targetServicePrincipal=trim(replace(targetServicePrincipal,
  "\"", "")) | where servicePrincipal=targetServicePrincipal | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `azure_ad_service_principal_privilege_escalation_filter`'
explanation: This detection identifies when an Azure Service Principal elevates privileges
  by adding themself to a new app role assignment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/29eb39d3-2bc8-49cc-99b3-35593191a588/
indicators:
- type: data_source
  value: Azure Active Directory Add app role assignment to service principal
  confidence: high
- type: risk_user
  value: servicePrincipal
  confidence: high
false_positives:
