false_positives:
- description: 'False positive analysis


    - Routine administrative tasks using AWS SSM SendCommand may trigger alerts. Identify
    and document regular maintenance scripts and exclude them from detection to reduce
    noise.

    - Automated deployment processes often use AWS-RunShellScript or AWS-RunPowerShellScript.
    Review deployment logs and whitelist these processes if they are verified as non-threatening.

    - Monitoring or compliance checks that utilize SSM for gathering system information
    can be mistaken for malicious a'
