technique_id: T1651
technique_name: AWS SSM `SendCommand` with Run Shell Command Parameters
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.category: \"process\" and event.type: \"start\" and process.name: \"\
  aws\"\nand (\n    host.os.type: (\"windows\" or \"macos\")\n    or (\n        host.os.type:\
  \ \"linux\"\n        and event.action: (\"exec\" or \"exec_event\" or \"executed\"\
  \ or \"process_started\")\n    )\n)\nand process.args: (\n    \"send-command\" and\
  \ \"--parameters\" and commands=*\n    and (\"AWS-RunShellScript\" or \"AWS-RunPowerShellScript\"\
  )\n)"
explanation: 'Identifies the use of the AWS Systems Manager (SSM) `SendCommand` API
  with the either `AWS-RunShellScript` or

  `AWS-RunPowerShellScript` parameters. The `SendCommand` API call allows users to
  execute commands on EC2 instances using

  the SSM service. Adversaries may use this technique to execute commands on EC2 instances
  without the need for SSH or RDP

  access. This behavior may indicate an adversary attempting to execute commands on
  an EC2 instance for malicious

  purposes. This is a [New Terms](https://www.elastic.co/guide/en/security/current/rules-ui-create.html#create-new-terms-rule)
  rule that only flags

  when this behavior is observed for the first time on a host in the last 7 days.'
