technique_id: T1071
technique_name: Potential Reverse Shell via Suspicious Binary
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id, process.entity_id with maxspan=1s\n[ process where host.os.type\
  \ == \"linux\" and event.type == \"start\" and event.action == \"exec\" and\n  process.executable\
  \ : (\n  \"./*\", \"/tmp/*\", \"/var/tmp/*\", \"/var/www/*\", \"/dev/shm/*\", \"\
  /etc/init.d/*\", \"/etc/rc*.d/*\",\n  \"/etc/crontab\", \"/etc/cron.*\", \"/etc/update-motd.d/*\"\
  , \"/usr/lib/update-notifier/*\",\n  \"/boot/*\", \"/srv/*\", \"/run/*\", \"/root/*\"\
  , \"/etc/rc.local\"\n   ) and\n  process.parent.name : (\"bash\", \"dash\", \"sh\"\
  , \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\") and not\n  process.name : (\"curl\"\
  , \"wget\", \"ping\", \"apt\", \"dpkg\", \"yum\", \"rpm\", \"dnf\", \"dockerd\"\
  ) ]\n[ network where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ in (\"connection_attempted\", \"connection_accepted\") and\n  process.executable\
  \ : (\n  \"./*\", \"/tmp/*\", \"/var/tmp/*\", \"/var/www/*\", \"/dev/shm/*\", \"\
  /etc/init.d/*\", \"/etc/rc*.d/*\",\n  \"/etc/crontab\", \"/etc/cron.*\", \"/etc/update-motd.d/*\"\
  , \"/usr/lib/update-notifier/*\",\n  \"/boot/*\", \"/srv/*\", \"/run/*\", \"/root/*\"\
  , \"/etc/rc.local\"\n   ) and destination.ip != null and destination.ip != \"127.0.0.1\"\
  \ and destination.ip != \"::1\" ]\n[ process where host.os.type == \"linux\" and\
  \ event.type == \"start\" and event.action == \"exec\" and\n  process.name : (\"\
  bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\") and\n \
  \ process.parent.name : (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\"\
  , \"ksh\", \"fish\") ]"
explanation: 'This detection rule detects the creation of a shell through a chain
  consisting of the execution of a suspicious binary

  (located in a commonly abused location or executed manually) followed by a network
  event and ending with a shell being

  spawned. Stageless reverse tcp shells display this behaviour. Attackers may spawn
  reverse shells to establish

  persistence onto a target system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/fa3a59dc-33c3-43bf-80a9-e8437a922c7f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts or binaries may be executed from directories
    like /tmp or /var/tmp during maintenance tasks. To handle this, create exceptions
    for known scripts or binaries used by trusted administrators.

    - Automated deployment tools might temporarily use directories such as /dev/shm
    or /run for staging files. Identify these tools and exclude their processes from
    triggering the rule.

    - Custom monitoring or backup scripts could initiate network connect'
  mitigation: Review investigation guide for details
references:
- https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/Methodology%20and%20Resources/Reverse%20Shell%20Cheatsheet.md
has_investigation_guide: true
risk_score: 47
