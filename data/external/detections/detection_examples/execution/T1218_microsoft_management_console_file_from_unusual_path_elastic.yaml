technique_id: T1218
technique_name: Microsoft Management Console File from Unusual Path
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.executable : (\n    \"?:\\\\Windows\\\\System32\\\\mmc.exe\",\n\n   \
  \ /* Crowdstrike specific condition as it uses NT Object paths */\n    \"\\\\Device\\\
  \\HarddiskVolume*\\\\Windows\\\\System32\\\\mmc.exe\"\n  ) and\n  process.args :\
  \ \"*.msc\" and\n  not process.args : (\n        \"?:\\\\Windows\\\\System32\\\\\
  *.msc\",\n        \"?:\\\\Windows\\\\SysWOW64\\\\*.msc\",\n        \"?:\\\\Program\
  \ files\\\\*.msc\",\n        \"?:\\\\Program Files (x86)\\\\*.msc\",\n        \"\
  ?:\\\\Windows\\\\ADFS\\\\Microsoft.IdentityServer.msc\"\n  ) and\n  not process.command_line\
  \ : (\n    \"C:\\\\Windows\\\\system32\\\\mmc.exe eventvwr.msc /s\",\n    \"mmc.exe\
  \ eventvwr.msc /s\",\n    \"\\\"C:\\\\Windows\\\\System32\\\\mmc.exe\\\" CompMgmt.msc*\"\
  \n  )"
explanation: 'Identifies attempts to open a Microsoft Management Console File from
  untrusted paths. Adversaries may use MSC files for

  initial access and execution.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7e23dfef-da2c-4d64-b11d-5f285b638853.toml
