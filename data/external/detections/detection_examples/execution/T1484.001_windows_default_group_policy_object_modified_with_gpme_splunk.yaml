technique_id: T1484.001
technique_name: Windows Default Group Policy Object Modified with GPME
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name=mmc.exe
  (Processes.process =*gpme.msc*) AND (Processes.process = "*31B2F340-016D-11D2-945F-00C04FB984F9*"
  OR Processes.process = "*6AC1786C-016F-11D2-945F-00C04fB984F9*"  ) by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_default_group_policy_object_modified_with_gpme_filter`'
explanation: The following analytic detects modifications to default Group Policy
  Objects (GPOs) using the Group Policy Management Editor (GPME). It leverages the
  Endpoint data model to identify processes where `mmc.exe` executes `gpme.msc` with
  specific GUIDs related to default GPOs. This activity is significant because default
  GPOs, such as the `Default Domain Controllers Policy` and `Default Domain Policy`,
  are critical for enforcing security policies across the domain. If malicious, such
  modifications could allow an attacker to gain further access, establish persistence,
  or deploy malware across numerous hosts, severely compromising the network's security.
