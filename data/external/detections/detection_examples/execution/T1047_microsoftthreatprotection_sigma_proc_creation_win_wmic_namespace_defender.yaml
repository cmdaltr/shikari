query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains: /Namespace:\\\\\\\\root\\\\Microsoft\\\\\
  Windows\\\\Defender\nselection_img:\n- OriginalFileName: wmic.exe\n- Image|endswith:\
  \ \\WMIC.exe\n"
explanation: Detects potential tampering with Windows Defender settings such as adding
  exclusion using wmic
false_positives:
- Unknown
