technique_id: T1110.003
technique_name: Windows Multiple Invalid Users Fail To Authenticate Using Kerberos
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`wineventlog_security` EventCode=4768 TargetUserName!=*$ Status=0x6 | bucket
  span=5m _time | stats dc(TargetUserName) AS unique_accounts values(TargetUserName)
  as user values(dest) as dest by _time, IpAddress | where unique_accounts > 30 |
  `windows_multiple_invalid_users_fail_to_authenticate_using_kerberos_filter`'
explanation: The following analytic identifies a source endpoint failing to authenticate
  with 30 unique invalid domain users using the Kerberos protocol. This detection
  leverages EventCode 4768, specifically looking for failure code 0x6, indicating
  the user is not found in the Kerberos database. This activity is significant as
  it may indicate a Password Spraying attack, where an adversary attempts to gain
  initial access or elevate privileges. If confirmed malicious, this could lead to
  unauthorized access or privilege escalation within the Active Directory environment,
  posing a significant security risk.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/001266a6-9d5b-11eb-829b-acde48001122/
indicators:
- type: data_source
  value: Windows Event Log Security 4768
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: A host failing to authenticate with multiple invalid domain users is
    not a common behavior for legitimate systems. Possible false positive scenarios
    include but are not limited to vulnerability scanners, multi-user systems and
    missconfigured systems.
  mitigation: Review context and user activity
