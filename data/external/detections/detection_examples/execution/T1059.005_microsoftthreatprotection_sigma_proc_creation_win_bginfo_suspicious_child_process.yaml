technique_id: T1059.005
technique_name: Suspicious Child Process Of BgInfo.EXE
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 811f459f-9231-45d4-959a-0266c6311987
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_child:\n- Image|endswith:\n  - \\calc.exe\n  - \\cmd.exe\n  - \\cscript.exe\n\
  \  - \\mshta.exe\n  - \\notepad.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\\
  wscript.exe\n- Image|contains:\n  - \\AppData\\Local\\\n  - \\AppData\\Roaming\\\
  \n  - :\\Users\\Public\\\n  - :\\Temp\\\n  - :\\Windows\\Temp\\\n  - :\\PerfLogs\\\
  \nselection_parent:\n  ParentImage|endswith:\n  - \\bginfo.exe\n  - \\bginfo64.exe\n"
explanation: Detects suspicious child processes of "BgInfo.exe" which could be a sign
  of potential abuse of the binary to proxy execution via external VBScript
false_positives:
- Unknown
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Bginfo/
- https://oddvar.moe/2017/05/18/bypassing-application-whitelisting-with-bginfo/
tags:
- attack.execution
- attack.t1059.005
- attack.defense-evasion
- attack.t1218
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - \bginfo.exe
    - \bginfo64.exe
  selection_child:
  - Image|endswith:
    - \calc.exe
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \notepad.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
  - Image|contains:
    - \AppData\Local\
    - \AppData\Roaming\
    - :\Users\Public\
    - :\Temp\
    - :\Windows\Temp\
    - :\PerfLogs\
  condition: all of selection_*
