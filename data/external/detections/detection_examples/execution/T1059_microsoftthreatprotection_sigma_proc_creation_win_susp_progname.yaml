query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection_commandline:\n\
  \  CommandLine|contains:\n  - inject.ps1\n  - Invoke-CVE\n  - pupy.ps1\n  - payload.ps1\n\
  \  - beacon.ps1\n  - PowerView.ps1\n  - bypass.ps1\n  - obfuscated.ps1\n  - obfusc.ps1\n\
  \  - obfus.ps1\n  - obfs.ps1\n  - evil.ps1\n  - MiniDogz.ps1\n  - _enc.ps1\n  -\
  \ \\shell.ps1\n  - \\rshell.ps1\n  - revshell.ps1\n  - \\av.ps1\n  - \\av_test.ps1\n\
  \  - adrecon.ps1\n  - mimikatz.ps1\n  - \\PowerUp_\n  - powerup.ps1\n  - \\Temp\\\
  a.ps1\n  - \\Temp\\p.ps1\n  - \\Temp\\1.ps1\n  - Hound.ps1\n  - encode.ps1\n  -\
  \ powercat.ps1\nselection_image:\n- Image|contains:\n  - \\CVE-202\n  - \\CVE202\n\
  - Image|endswith:\n  - \\poc.exe\n  - \\artifact.exe\n  - \\artifact64.exe\n  -\
  \ \\artifact_protected.exe\n  - \\artifact32.exe\n  - \\artifact32big.exe\n  - obfuscated.exe\n\
  \  - obfusc.exe\n  - \\meterpreter\n"
explanation: Detects suspicious patterns in program names or folders that are often
  found in malicious samples or hacktools
