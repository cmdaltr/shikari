technique_id: T1087.004
technique_name: Okta IDP Lifecycle Modifications
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`okta` eventType IN ("system.idp.lifecycle.activate","system.idp.lifecycle.create","system.idp.lifecycle.delete","system.idp.lifecycle.deactivate")
  |  stats count  min(_time) as firstTime max(_time) as lastTime values(target{}.id)
  as target_id values(target{}.type) as target_modified by src dest src_user_id user
  user_agent command description | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `okta_idp_lifecycle_modifications_filter`'
explanation: The following analytic identifies modifications to Okta Identity Provider
  (IDP) lifecycle events, including creation, activation, deactivation, and deletion
  of IDP configurations. It uses OktaIm2 logs ingested via the Splunk Add-on for Okta
  Identity Cloud. Monitoring these events is crucial for maintaining the integrity
  and security of authentication mechanisms. Unauthorized or anomalous changes could
  indicate potential security breaches or misconfigurations. If confirmed malicious,
  attackers could manipulate authentication processes, potentially gaining unauthorized
  access or disrupting identity management systems.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/e0be2c83-5526-4219-a14f-c3db2e763d15/
indicators:
- type: data_source
  value: Okta
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: It's possible for legitimate administrative actions or automated processes
    to trigger this detection, especially if there are bulk modifications to Okta
    IDP lifecycle events. Review the context of the modification, such as the user
    making the change and the specific lifecycle event modified, to determine if it
    aligns with expected behavior.
  mitigation: Review context and user activity
references:
- https://www.obsidiansecurity.com/blog/behind-the-breach-cross-tenant-impersonation-in-okta/
- https://splunkbase.splunk.com/app/6553
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556/okta_idp/okta.log
