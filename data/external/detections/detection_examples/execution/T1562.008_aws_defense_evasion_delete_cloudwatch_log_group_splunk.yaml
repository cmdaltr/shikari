  value: AWS CloudTrail DeleteLogGroup
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: While this search has no known false positives, it is possible that
    an AWS admin has deleted CloudWatch logging. Please investigate this activity.
  mitigation: Review context and user activity
