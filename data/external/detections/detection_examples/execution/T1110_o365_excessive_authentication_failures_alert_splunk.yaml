technique_id: T1110
technique_name: O365 Excessive Authentication Failures Alert
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=AzureActiveDirectory UserAuthenticationMethod=*
  status=failure | stats count earliest(_time) AS firstTime latest(_time) AS lastTime
  values(UserAuthenticationMethod) AS UserAuthenticationMethod values(UserAgent) AS
  user_agent values(status) AS status values(src_ip) AS src values(signature) as signature
  by user vendor_account vendor_product dest | where count > 10 | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `o365_excessive_authentication_failures_alert_filter`'
explanation: The following analytic identifies an excessive number of authentication
  failures, including failed attempts against MFA prompt codes. It uses data from
  the `o365_management_activity` dataset, focusing on events where the authentication
  status is marked as failure. This behavior is significant as it may indicate a brute
  force attack or an attempt to compromise user accounts. If confirmed malicious,
  this activity could lead to unauthorized access, data breaches, or further exploitation
  within the environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/d441364c-349c-453b-b55f-12eccab67cf9/
indicators:
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: The threshold for alert is above 10 attempts and this should reduce
    the number of false positives.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1110/
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1110/o365_brute_force_login/o365_brute_force_login.json
