technique_id: T1059
technique_name: File Creation, Execution and Self-Deletion in Suspicious Directory
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id, user.id with maxspan=1m\n  [file where host.os.type ==\
  \ \"linux\" and event.action == \"creation\" and\n   process.name in (\"curl\",\
  \ \"wget\", \"fetch\", \"ftp\", \"sftp\", \"scp\", \"rsync\", \"ld\") and\n   file.path\
  \ : (\"/dev/shm/*\", \"/run/shm/*\", \"/tmp/*\", \"/var/tmp/*\",\n     \"/run/*\"\
  , \"/var/run/*\", \"/var/www/*\", \"/proc/*/fd/*\")] by file.name\n  [process where\
  \ host.os.type == \"linux\" and event.type == \"start\" and event.action == \"exec\"\
  \ and\n   process.parent.name in (\"bash\", \"dash\", \"ash\", \"sh\", \"tcsh\"\
  , \"csh\", \"zsh\", \"ksh\", \"fish\") and\n   not process.parent.executable like\
  \ (\n     \"/tmp/VeeamApp*\", \"/tmp/rajh/spack-stage/*\", \"plz-out/bin/vault/bridge/test/e2e/base/bridge-dev\"\
  ,\n     \"/usr/bin/ranlib\", \"/usr/bin/ar\", \"plz-out/bin/vault/bridge/test/e2e/base/local-k8s\"\
  \n   )] by process.name\n  [file where host.os.type == \"linux\" and event.action\
  \ == \"deletion\" and\n   file.path : (\n     \"/dev/shm/*\", \"/run/shm/*\", \"\
  /tmp/*\", \"/var/tmp/*\", \"/run/*\", \"/var/run/*\", \"/var/www/*\", \"/proc/*/fd/*\"\
  \n    ) and not process.name in (\"rm\", \"ld\", \"conftest\", \"link\", \"gcc\"\
  , \"getarch\", \"ld\")] by file.name"
explanation: 'This rule monitors for the creation of a file, followed by its execution
  and self-deletion in a short timespan within a

  directory often used for malicious purposes by threat actors. This behavior is often
  used by malware to execute

  malicious code and delete itself to hide its tracks.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/09bc6c90-7501-494d-b015-5d988dc3f233.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Development and testing activities in temporary directories can trigger false
    positives. Exclude specific paths or processes related to known development tools
    or scripts that frequently create, execute, and delete files in these directories.

    - Automated system maintenance scripts may perform similar actions. Identify and
    whitelist these scripts by their process names or paths to prevent unnecessary
    alerts.

    - Backup or deployment tools like Veeam or Spack may use tempo'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
