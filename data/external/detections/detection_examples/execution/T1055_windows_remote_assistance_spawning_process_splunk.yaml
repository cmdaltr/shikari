technique_id: T1055
technique_name: Windows Remote Assistance Spawning Process
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.parent_process_name=msra.exe
  `windows_shells` by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_remote_assistance_spawning_process_filter`'
explanation: The following analytic detects Microsoft Remote Assistance (msra.exe)
  spawning PowerShell.exe or cmd.exe as a child process. This detection leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process creation
  events where msra.exe is the parent process. This activity is significant because
  msra.exe typically does not spawn command-line interfaces, indicating potential
  process injection or misuse. If confirmed malicious, an attacker could use this
  technique to execute arbitrary commands, escalate privileges, or maintain persistence
  on the compromised system.
