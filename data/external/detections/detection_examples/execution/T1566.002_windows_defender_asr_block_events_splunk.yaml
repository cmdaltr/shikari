false_positives:
- description: False positives are expected from legitimate applications generating
    events that are similar to those generated by malicious activity. For example,
    Event ID 1122 is generated when a process attempts to load a DLL that is blocked
    by an ASR rule. This can be triggered by legitimate applications that attempt
    to load DLLs that are not blocked by ASR rules. This is block only.
  mitigation: Review context and user activity
