technique_id: T1078
technique_name: Cloud Provisioning Activity From Previously Unseen IP Address
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats earliest(_time) as firstTime, latest(_time) as lastTime, values(All_Changes.object_id)
  as object_id from datamodel=Change where (All_Changes.action=started OR All_Changes.action=created)
  All_Changes.status=success by All_Changes.src, All_Changes.user, All_Changes.command
  | `drop_dm_object_name("All_Changes")` | lookup previously_seen_cloud_provisioning_activity_sources
  src as src OUTPUT firstTimeSeen, enough_data | eventstats max(enough_data) as enough_data
  | where enough_data=1 | eval firstTimeSeenSrc=min(firstTimeSeen) | where isnull(firstTimeSeenSrc)
  OR firstTimeSeenSrc > relative_time(now(), `previously_unseen_cloud_provisioning_activity_window`)
  | `security_content_ctime(firstTime)` | table firstTime, src, user, object_id, command
  | `cloud_provisioning_activity_from_previously_unseen_ip_address_filter`'
explanation: The following analytic detects cloud provisioning activities originating
  from previously unseen IP addresses. It leverages cloud infrastructure logs to identify
  events where resources are created or started, and cross-references these with a
  baseline of known IP addresses. This activity is significant as it may indicate
  unauthorized access or potential misuse of cloud resources. If confirmed malicious,
  an attacker could gain unauthorized control over cloud resources, leading to data
  breaches, service disruptions, or increased operational costs.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/f86a8ec9-b042-45eb-92f4-e9ed1d781078/
indicators:
- type: data_source
  value: AWS CloudTrail
  confidence: high
- type: risk_system
  value: object_id
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: 'This is a strictly behavioral search, so we define "false positive"
    slightly differently. Every time this fires, it will accurately reflect the first
    occurrence in the time period you''re searching within, plus what is stored in
    the cache feature. But while there are really no "false positives" in a traditional
    sense, there is definitely lots of noise.

    This search will fire any time a new IP address is seen in the **GeoIP** database
    for any kind of provisioning activity. If you typically do all provisioning from
    tools inside of your country, there should be few false positives. If you are
    located in countries where the free version of **MaxMind GeoIP** that ships by
    default with Splunk has weak resolution (particularly small countries in less
    economically powerful regions), this may be much less valuable to you.'
  mitigation: Review context and user activity
