technique_id: T1053.005
technique_name: Uncommon One Time Only Scheduled Task At 00:00
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 970823b7-273b-460a-8afc-3a6811998529
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - wscript\n  - vbscript\n  - cscript\n\
  \  - 'wmic '\n  - wmic.exe\n  - regsvr32.exe\n  - powershell\n  - \\AppData\\\n\
  selection_img:\n- Image|contains: \\schtasks.exe\n- OriginalFileName: schtasks.exe\n\
  selection_time:\n  CommandLine|contains|all:\n  - once\n  - 00:00\n"
explanation: Detects scheduled task creation events that include suspicious actions,
  and is run once at 00:00
false_positives:
- Software installation
references:
- https://www.trendmicro.com/vinfo/us/security/news/ransomware-spotlight/ransomware-spotlight-blackbyte
tags:
- attack.execution
- attack.persistence
- attack.privilege-escalation
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|contains: \schtasks.exe
  - OriginalFileName: schtasks.exe
  selection_cli:
    CommandLine|contains:
    - wscript
    - vbscript
    - cscript
    - 'wmic '
    - wmic.exe
    - regsvr32.exe
    - powershell
    - \AppData\
  selection_time:
    CommandLine|contains|all:
    - once
    - 00:00
  condition: all of selection_*
