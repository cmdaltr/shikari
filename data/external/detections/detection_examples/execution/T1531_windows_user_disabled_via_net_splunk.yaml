technique_id: T1531
technique_name: Windows User Disabled Via Net
tactic: execution
platform: Splunk
fidelity_score: 0.85
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_net` AND Processes.process="*user*"
  AND Processes.process="*/active:no*" by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_user_disabled_via_net_filter`'
explanation: The following analytic detects the use of the `net.exe` utility to disable
  a user account via the command line. It leverages data from Endpoint Detection and
  Response (EDR) agents, focusing on process execution logs and command-line arguments.
  This activity is significant as it may indicate an adversary's attempt to disrupt
  user availability, potentially as a precursor to further malicious actions. If confirmed
  malicious, this could lead to denial of service for legitimate users, aiding the
  attacker in maintaining control or covering their tracks.
