technique_id: T1059
technique_name: ESXi Reverse Shell Patterns
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`esxi_syslog` Message IN ("*bash -i >&*","*/dev/tcp/*","*/dev/udp/*", "*/socat
  exec:*","*socket(S,PF_INET*") OR (Message="*python -c*" AND Message="*import socket*")
  | rex field=_raw "Z (?<dest>[\w\.]+)\s" | stats min(_time) as firstTime max(_time)
  as lastTime count by dest Message | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `esxi_reverse_shell_patterns_filter`'
explanation: This detection looks for reverse shell string patterns on an ESXi host,
  which may indicate that a threat actor is attempting to establish remote control
  over the system.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/ee8b16a4-118e-4dd7-af4b-835530415610/
