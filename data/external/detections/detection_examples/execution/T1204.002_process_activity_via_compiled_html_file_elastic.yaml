technique_id: T1204.002
technique_name: Process Activity via Compiled HTML File
tactic: execution
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.name : \"hh.exe\" and\n process.name : (\"mshta.exe\", \"cmd.exe\"\
  , \"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\", \"cscript.exe\", \"\
  wscript.exe\")"
explanation: 'Compiled HTML files (.chm) are commonly distributed as part of the Microsoft
  HTML Help system. Adversaries may conceal

  malicious code in a CHM file and deliver it to a victim for execution. CHM content
  is loaded by the HTML Help executable

  program (hh.exe).'
source: Elastic Detection Rules
