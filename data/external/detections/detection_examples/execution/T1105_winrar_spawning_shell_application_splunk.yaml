false_positives:
- description: Be aware of potential false positives - legitimate uses of WinRAR and
    the listed processes in your environment may cause benign activities to be flagged.
    Upon triage, review the destination, user, parent process, and process name involved
    in the flagged activity. Capture and inspect any relevant on-disk artifacts, and
    look for concurrent processes to identify the attack source. This approach helps
    analysts detect potential threats earlier and mitigate the risks.
  mitigation: Review context and user activity
