query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - join*split\n  - ( $ShellId[1]+$ShellId[13]+'x')\n\
  \  - ( $PSHome[*]+$PSHOME[*]+\n  - ( $env:Public[13]+$env:Public[5]+'x')\n  - (\
  \ $env:ComSpec[4,*,25]-Join'')\n  - '[1,3]+''x''-Join'''')'\nselection_img:\n- Image|endswith:\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n- OriginalFileName:\n  - PowerShell.EXE\n\
  \  - pwsh.dll\n"
explanation: The CrachMapExec pentesting framework implements a PowerShell obfuscation
  with some static strings detected by this rule.
false_positives:
- Unknown
