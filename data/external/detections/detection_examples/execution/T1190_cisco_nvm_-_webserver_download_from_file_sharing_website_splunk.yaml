false_positives:
- description: 'In rare cases, a web server may make outbound connections to pull
    content for legitimate purposes (e.g., downloading templates or updates from a
    trusted source).

    However, communication to anonymous file-sharing or temporary content domains
    is strongly suspicious.

    If legitimate use is confirmed, domain- or process-level allowlisting is recommended.'
  mitigation: Review context and user activity
