technique_id: T1190
technique_name: Cisco NVM - Webserver Download From File Sharing Website
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "`cisco_network_visibility_module_flowdata`\nprocess_name IN (\n    \"http*.exe\"\
  , \"nginx*.exe\", \"php*.exe\", \"php-cgi*.exe\", \"tomcat*.exe\"\n  )\ndest_hostname\
  \ IN (\n    \"*.githubusercontent.com*\", \"*anonfiles.com*\", \"*cdn.discordapp.com*\"\
  , \"*ddns.net*\",\n    \"*dl.dropboxusercontent.com*\", \"*ghostbin.co*\", \"*glitch.me*\"\
  , \"*gofile.io*\",\n    \"*hastebin.com*\", \"*mediafire.com*\", \"*mega.nz*\",\
  \ \"*onrender.com*\", \"*pages.dev*\",\n    \"*paste.ee*\", \"*pastebin.*\", \"\
  *pastetext.net*\", \"*privatlab.*\",\n    \"*send.exploit.in*\", \"*sendspace.com*\"\
  , \"*storage.googleapis.com*\",\n    \"*storjshare.io*\", \"*supabase.co*\", \"\
  *temp.sh*\", \"*transfer.sh*\", \"*trycloudflare.com*\",\n    \"*ufile.io*\", \"\
  *w3spaces.com*\", \"*workers.dev*\"\n  )\n| stats count min(_time) as firstTime\
  \ max(_time) as lastTime\n        values(parent_process_arguments) as parent_process_arguments\n\
  \        values(process_arguments) as process_arguments\n        values(parent_process_hash)\
  \ as parent_process_hash\n        values(process_hash) as process_hash\n       \
  \ values(module_name_list) as module_name_list\n        values(module_hash_list)\
  \ as module_hash_list\n        values(dest_port) as dest_port\n        values(aliul)\
  \ as additional_logged_in_users_list\n        values(dest_hostname) as dest_hostname\n\
  \        by src dest parent_process_path parent_process_integrity_level process_path\
  \ process_name process_integrity_level process_id transport\n| `security_content_ctime(firstTime)`\n\
  | `security_content_ctime(lastTime)`\n| table\n  parent_process_integrity_level\
  \ parent_process_path parent_process_arguments parent_process_hash\n  process_integrity_level\
  \ process_path process_name process_arguments process_hash process_id\n  additional_logged_in_users_list\
  \ module_name_list module_hash_list\n  src dest_hostname dest dest_port transport\
  \ firstTime lastTime\n| `cisco_nvm___webserver_download_from_file_sharing_website_filter`"
explanation: 'This analytic detects unexpected outbound network connections initiated
  by known webserver processes such as `httpd.exe`, `nginx.exe`, or `tomcat.exe` to
  common file sharing or public content hosting services like GitHub, Discord CDN,
  Transfer.sh, or Pastebin.

  Webservers are rarely expected to perform outbound downloads, especially to dynamic
  or anonymous file hosting domains. This behavior is often associated with server
  compromise,

  where an attacker uses a reverse shell, webshell, or injected task to fetch malware
  or tools post-exploitation.

  The detection leverages Cisco Network Visibility Module flow data, enriched with
  process context, to identify this highly suspicious behavior.'
