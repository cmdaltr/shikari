technique_id: T1560
technique_name: Detect Certipy File Modifications
tactic: execution
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Filesystem where Filesystem.file_name IN ("*_certipy.zip","*_certipy.txt",
  "*_certipy.json", "*.ccache") by Filesystem.action Filesystem.dest Filesystem.file_access_time
  Filesystem.file_create_time Filesystem.file_hash Filesystem.file_modify_time Filesystem.file_name
  Filesystem.file_path Filesystem.file_acl Filesystem.file_size Filesystem.process_guid
  Filesystem.process_id Filesystem.user Filesystem.vendor_product | `drop_dm_object_name(Filesystem)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `detect_certipy_file_modifications_filter`'
explanation: The following analytic detects the use of the Certipy tool to enumerate
  Active Directory Certificate Services (AD CS) environments by identifying unique
  file modifications. It leverages endpoint process and filesystem data to spot the
  creation of files with specific names or extensions associated with Certipy's information
  gathering and exfiltration activities. This activity is significant as it indicates
  potential reconnaissance and data exfiltration efforts by an attacker. If confirmed
  malicious, this could lead to unauthorized access to sensitive AD CS information,
  enabling further attacks or privilege escalation within the network.
source: Splunk Security Content
