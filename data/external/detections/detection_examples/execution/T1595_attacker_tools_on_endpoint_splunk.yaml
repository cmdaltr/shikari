technique_id: T1595
technique_name: Attacker Tools On Endpoint
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime values(Processes.process) as process values(Processes.parent_process)
  as parent_process from datamodel=Endpoint.Processes where [| inputlookup attacker_tools
  | rename attacker_tool_names AS Processes.process_name | fields Processes.process_name]
  AND Processes.dest!=unknown AND Processes.user!=unknown by Processes.action Processes.dest
  Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `drop_dm_object_name(Processes)`
  | lookup attacker_tools attacker_tool_names AS process_name OUTPUT description |
  search description !=false| `attacker_tools_on_endpoint_filter`'
explanation: The following analytic detects the execution of tools commonly exploited
  by cybercriminals, such as those used for unauthorized access, network scanning,
  or data exfiltration. It leverages process activity data from Endpoint Detection
  and Response (EDR) agents, focusing on known attacker tool names. This activity
  is significant because it serves as an early warning system for potential security
  incidents, enabling prompt response. If confirmed malicious, this activity could
  lead to unauthorized access, data theft, or further network compromise, posing a
  severe threat to the organization's security infrastructure.
