technique_id: T1059
technique_name: Unusual Parent Process for cmd.exe
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"cmd.exe\" and\n  process.parent.name : (\"lsass.exe\",\n   \
  \                      \"csrss.exe\",\n                         \"epad.exe\",\n\
  \                         \"regsvr32.exe\",\n                         \"dllhost.exe\"\
  ,\n                         \"LogonUI.exe\",\n                         \"wermgr.exe\"\
  ,\n                         \"spoolsv.exe\",\n                         \"jucheck.exe\"\
  ,\n                         \"jusched.exe\",\n                         \"ctfmon.exe\"\
  ,\n                         \"taskhostw.exe\",\n                         \"GoogleUpdate.exe\"\
  ,\n                         \"sppsvc.exe\",\n                         \"sihost.exe\"\
  ,\n                         \"slui.exe\",\n                         \"SIHClient.exe\"\
  ,\n                         \"SearchIndexer.exe\",\n                         \"\
  SearchProtocolHost.exe\",\n                         \"FlashPlayerUpdateService.exe\"\
  ,\n                         \"WerFault.exe\",\n                         \"WUDFHost.exe\"\
  ,\n                         \"unsecapp.exe\",\n                         \"wlanext.exe\"\
  \ ) and\n  not (process.parent.name : \"dllhost.exe\" and process.parent.args :\
  \ \"/Processid:{CA8C87C1-929D-45BA-94DB-EF8E6CB346AD}\")"
explanation: Identifies a suspicious parent child process relationship with cmd.exe
  descending from an unusual process.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3b47900d-e793-49e8-968f-c90dc3526aa1.toml
query_type: eql
query_language: eql
