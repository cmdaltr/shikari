false_positives:
- description: 'False positive analysis


    - Cmd.exe instances spawned by legitimate system maintenance tools like Windows
    Update or system indexing services can trigger false positives. Users can create
    exceptions for processes like SearchIndexer.exe or WUDFHost.exe if they are verified
    as part of routine system operations.

    - Software updates or installations that use cmd.exe for scripting purposes might
    be flagged. If GoogleUpdate.exe or FlashPlayerUpdateService.exe are known to be
    part of regular update proces'
  mitigation: Review investigation guide for details
has_investigation_guide: true
