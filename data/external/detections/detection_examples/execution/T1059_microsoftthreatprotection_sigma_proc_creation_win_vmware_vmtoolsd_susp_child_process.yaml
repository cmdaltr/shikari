technique_id: T1059
technique_name: VMToolsd Suspicious Child Process
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 5687f942-867b-4578-ade7-1e341c46e99a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection* and\
  \ not 1 of filter_main_*\nfilter_main_empty:\n  CommandLine: ''\n  Image|endswith:\
  \ \\cmd.exe\nfilter_main_null:\n  CommandLine: null\n  Image|endswith: \\cmd.exe\n\
  filter_main_vmwaretools_script:\n  CommandLine|contains:\n  - \\VMware\\VMware Tools\\\
  poweron-vm-default.bat\n  - \\VMware\\VMware Tools\\poweroff-vm-default.bat\n  -\
  \ \\VMware\\VMware Tools\\resume-vm-default.bat\n  - \\VMware\\VMware Tools\\suspend-vm-default.bat\n\
  \  Image|endswith: \\cmd.exe\nselection_img:\n- Image|endswith:\n  - \\cmd.exe\n\
  \  - \\cscript.exe\n  - \\mshta.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\\
  regsvr32.exe\n  - \\rundll32.exe\n  - \\wscript.exe\n- OriginalFileName:\n  - Cmd.Exe\n\
  \  - cscript.exe\n  - MSHTA.EXE\n  - PowerShell.EXE\n  - pwsh.dll\n  - REGSVR32.EXE\n\
  \  - RUNDLL32.EXE\n  - wscript.exe\nselection_parent:\n  ParentImage|endswith: \\\
  vmtoolsd.exe\n"
explanation: Detects suspicious child process creations of VMware Tools process which
  may indicate persistence setup
false_positives:
- Legitimate use by VM administrator
references:
- https://bohops.com/2021/10/08/analyzing-and-detecting-a-vmtools-persistence-technique/
- https://user-images.githubusercontent.com/61026070/136518004-b68cce7d-f9b8-4e9a-9b7b-53b1568a9a94.png
- https://github.com/vmware/open-vm-tools/blob/master/open-vm-tools/tools.conf
tags:
- attack.execution
- attack.persistence
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: \vmtoolsd.exe
  selection_img:
  - Image|endswith:
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \wscript.exe
  - OriginalFileName:
    - Cmd.Exe
    - cscript.exe
    - MSHTA.EXE
    - PowerShell.EXE
    - pwsh.dll
    - REGSVR32.EXE
    - RUNDLL32.EXE
    - wscript.exe
  filter_main_vmwaretools_script:
    Image|endswith: \cmd.exe
    CommandLine|contains:
    - \VMware\VMware Tools\poweron-vm-default.bat
    - \VMware\VMware Tools\poweroff-vm-default.bat
    - \VMware\VMware Tools\resume-vm-default.bat
    - \VMware\VMware Tools\suspend-vm-default.bat
  filter_main_empty:
    Image|endswith: \cmd.exe
    CommandLine: ''
  filter_main_null:
    Image|endswith: \cmd.exe
    CommandLine: null
  condition: all of selection* and not 1 of filter_main_*
