detection:
  selection_img:
  - OriginalFileName: Cmd.Exe
  - Image|endswith: \cmd.exe
  selection_cli:
    CommandLine|startswith:
    - 'cmd '
    - cmd.exe
    - c:\windows\system32\cmd.exe
    CommandLine|contains:
    - psinject
    - spawnas
    - make_token
    - remote-exec
    - rev2self
    - dcsync
    - logonpasswords
    - execute-assembly
    - getsystem
  condition: all of selection_*
