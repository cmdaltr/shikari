query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - psinject\n  - spawnas\n  - make_token\n\
  \  - remote-exec\n  - rev2self\n  - dcsync\n  - logonpasswords\n  - execute-assembly\n\
  \  - getsystem\n  CommandLine|startswith:\n  - 'cmd '\n  - cmd.exe\n  - c:\\windows\\\
  system32\\cmd.exe\nselection_img:\n- OriginalFileName: Cmd.Exe\n- Image|endswith:\
  \ \\cmd.exe\n"
explanation: Detects use of Cobalt Strike commands accidentally entered in the CMD
  shell
false_positives:
- Unknown
