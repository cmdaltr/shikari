technique_id: T1566.001
technique_name: Windows Office Product Spawned MSDT
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_office_products_parent`
  Processes.process_name=msdt.exe by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)` | `windows_office_product_spawned_msdt_filter`'
explanation: The following analytic detects a Microsoft Office product spawning the
  Windows msdt.exe process. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process creation events where Office applications
  are the parent process. This activity is significant as it may indicate an attempt
  to exploit protocol handlers to bypass security controls, even if macros are disabled.
  If confirmed malicious, this behavior could allow an attacker to execute arbitrary
  code, potentially leading to system compromise, data exfiltration, or further lateral
  movement within the network.
