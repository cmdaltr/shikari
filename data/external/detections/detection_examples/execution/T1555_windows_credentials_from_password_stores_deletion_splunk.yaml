technique_id: T1555
technique_name: Windows Credentials from Password Stores Deletion
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name="cmdkey.exe"
  OR Processes.original_file_name = "cmdkey.exe" AND Processes.process = "*/delete*"
  by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_credentials_from_password_stores_deletion_filter`'
explanation: The following analytic detects the execution of the Windows OS tool cmdkey.exe
  with the /delete parameter. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process execution logs and command-line arguments.
  The activity is significant because cmdkey.exe can be used by attackers to delete
  stored credentials, potentially leading to privilege escalation and persistence.
  If confirmed malicious, this behavior could allow attackers to remove stored user
  credentials, hindering incident response efforts and enabling further unauthorized
  access to the compromised system.
