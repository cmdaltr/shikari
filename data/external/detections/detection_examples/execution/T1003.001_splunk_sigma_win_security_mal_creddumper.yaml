technique_id: T1003.001
technique_name: Credential Dumping Tools Service Execution - Security
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: f0d1feba-4344-4ca9-8121-a6c97bd6df52
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  EventID: 4697\n  ServiceFileName|contains:\n  - cachedump\n  - dumpsvc\n  - fgexec\n\
  \  - gsecdump\n  - mimidrv\n  - pwdump\n  - servpw\n"
explanation: Detects well-known credential dumping tools execution via service execution
  events
false_positives:
- Legitimate Administrator using credential dumping tool for password recovery
references:
- https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
tags:
- attack.credential-access
- attack.execution
- attack.t1003.001
- attack.t1003.002
- attack.t1003.004
- attack.t1003.005
- attack.t1003.006
- attack.t1569.002
- attack.s0005
logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  selection:
    EventID: 4697
    ServiceFileName|contains:
    - cachedump
    - dumpsvc
    - fgexec
    - gsecdump
    - mimidrv
    - pwdump
    - servpw
  condition: selection
