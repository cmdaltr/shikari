query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_dll and 1 of\
  \ selection_folders_*\nselection_dll:\n  ImageLoaded|endswith:\n  - \\coreclr.dll\n\
  \  - \\facesdk.dll\n  - \\HPCustPartUI.dll\n  - \\libcef.dll\n  - \\ZIPDLL.dll\n\
  selection_folders_1:\n  ImageLoaded|contains:\n  - :\\Perflogs\\\n  - :\\Users\\\
  Public\\\n  - \\Temporary Internet\n  - \\Windows\\Temp\\\nselection_folders_2:\n\
  - ImageLoaded|contains|all:\n  - :\\Users\\\n  - \\Favorites\\\n- ImageLoaded|contains|all:\n\
  \  - :\\Users\\\n  - \\Favourites\\\n- ImageLoaded|contains|all:\n  - :\\Users\\\
  \n  - \\Contacts\\\n- ImageLoaded|contains|all:\n  - :\\Users\\\n  - \\Pictures\\\
  \n"
explanation: Detects potential DLL sideloading of DLLs that are known to be abused
  from suspicious locations
false_positives:
- Unknown
