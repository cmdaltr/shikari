technique_id: T1053.005
technique_name: Scheduled Task Creation Masquerading as System Processes
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 9f8573c9-22b4-40e3-89c1-72bc2b8d49ab
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - ' audiodg'\n  - ' conhost'\n  - ' dwm.exe'\n\
  \  - ' explorer'\n  - ' lsass'\n  - ' lsm'\n  - ' mmc'\n  - ' msiexec'\n  - ' regsvr32'\n\
  \  - ' rundll32'\n  - ' services'\n  - ' spoolsv'\n  - ' svchost'\n  - ' taskeng'\n\
  \  - ' taskhost'\n  - ' wininit'\n  - ' winlogon'\n  CommandLine|contains|windash:\
  \ ' /create '\nselection_img:\n- Image|endswith: \\schtasks.exe\n- OriginalFileName:\
  \ schtasks.exe\n"
explanation: Detects the creation of scheduled tasks that involve system processes,
  which may indicate malicious actors masquerading as or abusing these processes to
  execute payloads or maintain persistence.
false_positives:
- Legitimate system administration tasks scheduling trusted system processes.
references:
- https://tria.ge/241015-l98snsyeje/behavioral2
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.defense-evasion
- attack.t1036.004
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \schtasks.exe
  - OriginalFileName: schtasks.exe
  selection_cli:
    CommandLine|contains|windash: ' /create '
    CommandLine|contains:
    - ' audiodg'
    - ' conhost'
    - ' dwm.exe'
    - ' explorer'
    - ' lsass'
    - ' lsm'
    - ' mmc'
    - ' msiexec'
    - ' regsvr32'
    - ' rundll32'
    - ' services'
    - ' spoolsv'
    - ' svchost'
    - ' taskeng'
    - ' taskhost'
    - ' wininit'
    - ' winlogon'
  condition: all of selection_*
