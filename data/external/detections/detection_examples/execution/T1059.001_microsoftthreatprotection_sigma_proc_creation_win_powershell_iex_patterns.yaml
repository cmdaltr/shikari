technique_id: T1059.001
technique_name: Suspicious PowerShell IEX Execution Patterns
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 09576804-7a05-458e-a817-eb718ca91f54
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_combined_*\
  \ or selection_standalone\nselection_combined_1:\n  CommandLine|contains:\n  - '\
  \ | iex;'\n  - ' | iex '\n  - ' | iex}'\n  - ' | IEX ;'\n  - ' | IEX -Error'\n \
  \ - ' | IEX (new'\n  - ');IEX '\n  Image|endswith:\n  - \\powershell.exe\n  - \\\
  pwsh.exe\nselection_combined_2:\n  CommandLine|contains:\n  - ::FromBase64String\n\
  \  - '.GetString([System.Convert]::'\nselection_standalone:\n  CommandLine|contains:\n\
  \  - )|iex;$\n  - );iex($\n  - );iex $\n  - ' | IEX | '\n  - ' | iex\\\"'\n"
explanation: Detects suspicious ways to run Invoke-Execution using IEX alias
false_positives:
- Legitimate scripts that use IEX
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/invoke-expression?view=powershell-7.2
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_combined_1:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' | iex;'
    - ' | iex '
    - ' | iex}'
    - ' | IEX ;'
    - ' | IEX -Error'
    - ' | IEX (new'
    - ');IEX '
  selection_combined_2:
    CommandLine|contains:
    - ::FromBase64String
    - '.GetString([System.Convert]::'
  selection_standalone:
    CommandLine|contains:
    - )|iex;$
    - );iex($
    - );iex $
    - ' | IEX | '
    - ' | iex\"'
  condition: all of selection_combined_* or selection_standalone
