  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine monitoring scripts or health checks that use curl or wget to verify
    the availability of Kubernetes API endpoints may trigger this rule. To manage
    this, identify and whitelist the specific scripts or IP addresses that are known
    to perform these checks regularly.

    - Automated backup processes that access Kubernetes secrets or config maps using
    curl or wget could be flagged. Exclude these processes by specifying their unique
    command patterns or execution contexts i'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
