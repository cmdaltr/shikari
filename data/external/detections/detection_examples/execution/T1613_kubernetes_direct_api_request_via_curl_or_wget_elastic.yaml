technique_id: T1613
technique_name: Kubernetes Direct API Request via Curl or Wget
tactic: execution
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  event.action in (\"exec\", \"exec_event\", \"start\", \"executed\", \"process_started\"\
  ) and\nprocess.name in (\"curl\", \"wget\") and process.args like~ (\n  \"*http*//*/apis/authorization.k8s.io/*\"\
  ,\n  \"*http*//*/apis/rbac.authorization.k8s.io/*\",\n  \"*http*//*/api/v1/secrets*\"\
  ,\n  \"*http*//*/api/v1/namespaces/*/secrets*\",\n  \"*http*//*/api/v1/configmaps*\"\
  ,\n  \"*http*//*/api/v1/pods*\",\n  \"*http*//*/apis/apps/v1/deployments*\"\n)"
explanation: 'This rule monitors for the execution of curl or wget commands that directly
  access Kubernetes API endpoints,

  which may indicate an attempt to interact with Kubernetes resources in a potentially
  unauthorized manner. This

  technique is often used by adversaries to gather information about the Kubernetes
  environment, such as secrets,

  config maps, and other sensitive data, without using the official Kubernetes client
  tools such as "kubectl".'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b53f1d73-150d-484d-8f02-222abeb5d5fa.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Crowdstrike
  confidence: high
