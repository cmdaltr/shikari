query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_* and not 1 of filter_optional_*\nfilter_main_empty:\n  Details: (Empty)\n\
  filter_main_explorer:\n  Image: C:\\Windows\\explorer.exe\n  TargetObject|contains:\
  \ \\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tree\\Microsoft\\\
  Windows\\PLA\\Server\n    Manager Performance Monitor\\\nfilter_main_mousocoreworker:\n\
  \  Image|endswith: C:\\Windows\\System32\\MoUsoCoreWorker.exe\nfilter_main_msiexec:\n\
  \  Image: C:\\Windows\\System32\\msiexec.exe\nfilter_main_ngen:\n  Image|endswith:\
  \ \\ngen.exe\n  Image|startswith: C:\\Windows\\Microsoft.NET\\Framework\n  TargetObject|contains:\n\
  \  - \\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tasks\\{B66B135D-DA06-4FC4-95F8-7458E1D10129}\n\
  \  - \\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tree\\Microsoft\\\
  Windows\\.NET\n    Framework\\.NET Framework NGEN\nfilter_main_null:\n  Details:\
  \ null\nfilter_main_office:\n  Image:\n  - C:\\Program Files\\Microsoft Office\\\
  root\\Integration\\Integrator.exe\n  - C:\\Program Files (x86)\\Microsoft Office\\\
  root\\Integration\\Integrator.exe\n  - C:\\Program Files\\Common Files\\microsoft\
  \ shared\\ClickToRun\\OfficeC2RClient.exe\n  - C:\\Program Files (x86)\\Common Files\\\
  microsoft shared\\ClickToRun\\OfficeC2RClient.exe\nfilter_main_other:\n  TargetObject|contains:\n\
  \  - Microsoft\\Windows\\UpdateOrchestrator\n  - Microsoft\\Windows\\SoftwareProtectionPlatform\\\
  SvcRestartTask\\Index\n  - Microsoft\\Windows\\Flighting\\OneSettings\\RefreshCache\\\
  Index\nfilter_main_runtimebroker:\n  Image: C:\\Windows\\System32\\RuntimeBroker.exe\n\
  filter_main_services:\n  Image|endswith: C:\\Windows\\System32\\services.exe\nfilter_main_svchost:\n\
  \  Image: C:\\WINDOWS\\system32\\svchost.exe\nfilter_main_system:\n  Image: System\n\
  filter_main_tiworker:\n  Image|endswith: \\TiWorker.exe\n  Image|startswith: C:\\\
  Windows\\\nfilter_optional_dropbox_updater:\n  Image:\n  - C:\\Program Files (x86)\\\
  Dropbox\\Update\\DropboxUpdate.exe\n  - C:\\Program Files\\Dropbox\\Update\\DropboxUpdate.exe\n\
  filter_optional_edge:\n  Image|endswith:\n  - C:\\Program Files (x86)\\Microsoft\\\
  EdgeUpdate\\MicrosoftEdgeUpdate.exe\n  - C:\\Program Files\\Microsoft\\EdgeUpdate\\\
  MicrosoftEdgeUpdate.exe\nfilter_optional_onedrive:\n  Image|endswith:\n  - C:\\\
  Program Files (x86)\\Microsoft OneDrive\\OneDrive.exe\n  - C:\\Program Files\\Microsoft\
  \ OneDrive\\OneDrive.exe\nselection:\n  TargetObject|contains: SOFTWARE\\Microsoft\\\
  Windows NT\\CurrentVersion\\Schedule\\TaskCache\\\n"
explanation: Monitor the creation of a new key under 'TaskCache' when a new scheduled
  task is registered by a process that is not svchost.exe, which is suspicious
false_positives:
- Unknown
