technique_id: T1053
technique_name: HackTool - SharPersist Execution
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 26488ad0-f9fd-4536-876f-52fea846a2e4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cli_1:\n\
  \  CommandLine|contains:\n  - ' -t schtask -c '\n  - ' -t startupfolder -c '\nselection_cli_2:\n\
  \  CommandLine|contains|all:\n  - ' -t reg -c '\n  - ' -m add'\nselection_cli_3:\n\
  \  CommandLine|contains|all:\n  - ' -t service -c '\n  - ' -m add'\nselection_cli_4:\n\
  \  CommandLine|contains|all:\n  - ' -t schtask -c '\n  - ' -m add'\nselection_img:\n\
  - Image|endswith: \\SharPersist.exe\n- Product: SharPersist\n"
explanation: Detects the execution of the hacktool SharPersist - used to deploy various
  different kinds of persistence mechanisms
false_positives:
- Unknown
references:
- https://www.mandiant.com/resources/blog/sharpersist-windows-persistence-toolkit
- https://github.com/mandiant/SharPersist
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \SharPersist.exe
  - Product: SharPersist
  selection_cli_1:
    CommandLine|contains:
    - ' -t schtask -c '
    - ' -t startupfolder -c '
  selection_cli_2:
    CommandLine|contains|all:
    - ' -t reg -c '
    - ' -m add'
  selection_cli_3:
    CommandLine|contains|all:
    - ' -t service -c '
    - ' -m add'
  selection_cli_4:
    CommandLine|contains|all:
    - ' -t schtask -c '
    - ' -m add'
  condition: 1 of selection_*
