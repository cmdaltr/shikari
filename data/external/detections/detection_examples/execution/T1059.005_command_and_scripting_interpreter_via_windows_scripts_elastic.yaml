technique_id: T1059.005
technique_name: Command and Scripting Interpreter via Windows Scripts
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.command_line != null and\n  (\n    process.name : (\"powershell.exe\"\
  , \"pwsh.exe\", \"powershell_ise.exe\", \"cmd.exe\") or\n    ?process.pe.original_file_name\
  \ : (\"powershell.exe\", \"pwsh.dll\", \"powershell_ise.exe\", \"Cmd.Exe\")\n  )\
  \ and\n  process.parent.name : (\"wscript.exe\", \"mshta.exe\")"
explanation: Identifies PowerShell.exe or Cmd.exe execution spawning from Windows
  Script Host processes Wscript.exe.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2d62889e-e758-4c5e-b57e-c735914ee32a.toml
query_type: eql
query_language: eql
