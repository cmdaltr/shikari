technique_id: T1003.003
technique_name: Ntdsutil Export NTDS
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where (Processes.process_name=ntdsutil.exe
  Processes.process=*ntds* Processes.process=*create*) by Processes.action Processes.dest
  Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`
  | `ntdsutil_export_ntds_filter`'
explanation: The following analytic detects the use of Ntdsutil to export the Active
  Directory database (NTDS.dit). It leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on process names and command-line arguments. This activity
  is significant because exporting NTDS.dit can be a precursor to offline password
  cracking, posing a severe security risk. If confirmed malicious, an attacker could
  gain access to sensitive credentials, potentially leading to unauthorized access
  and privilege escalation within the network.
source: Splunk Security Content
