technique_id: T1497
technique_name: Windows Chromium Browser with Custom User Data Directory
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: "| tstats `security_content_summariesonly` min(_time) as firstTime max(_time)\n\
  as lastTime from datamodel=Endpoint.Processes where \nProcesses.process_name IN\
  \ (\"Chrome.exe\",\"Brave.exe\", \"Opera.exe\", \"Vivaldi.exe\", \"msedge.exe\"\
  )\nProcesses.process = \"*--user-data-dir*\" \nProcesses.process IN (\"*--disable-gpu*\"\
  , \"*--disable-3d-apis*\")\nby Processes.action Processes.dest Processes.original_file_name\
  \ Processes.parent_process\nProcesses.parent_process_exec Processes.parent_process_guid\
  \ Processes.parent_process_id\nProcesses.parent_process_name Processes.parent_process_path\
  \ Processes.process Processes.process_exec\nProcesses.process_guid Processes.process_hash\
  \ Processes.process_id Processes.process_integrity_level\nProcesses.process_name\
  \ Processes.process_path Processes.user Processes.user_id Processes.vendor_product\n\
  | `drop_dm_object_name(Processes)` \n| `security_content_ctime(firstTime)` \n| `security_content_ctime(lastTime)`\
  \ \n| `windows_chromium_browser_with_custom_user_data_directory_filter`"
explanation: The following analytic detects instances where the Chromium-based browser
  (e.g., Google Chrome, Microsoft Edge) is launched with the --user-data-dir command-line
  argument. While this flag is legitimate and used for multi-profile support or automation,
  it is frequently leveraged by malware and adversaries to run Chrome in an isolated
  environment for stealth operations, credential harvesting, phishing delivery, or
  evasion of user session artifacts.
