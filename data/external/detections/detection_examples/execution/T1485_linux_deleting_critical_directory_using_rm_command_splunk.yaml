technique_id: T1485
technique_name: Linux Deleting Critical Directory Using RM Command
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name =rm AND
  Processes.process= "* -rf *" AND Processes.process IN ("*/boot/*", "*/var/log/*",
  "*/etc/*", "*/dev/*") by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `linux_deleting_critical_directory_using_rm_command_filter`'
explanation: The following analytic detects the deletion of critical directories on
  a Linux machine using the `rm` command with argument rf. It leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on command-line executions
  targeting directories like /boot, /var/log, /etc, and /dev. This activity is significant
  because deleting these directories can severely disrupt system operations and is
  often associated with destructive campaigns like Industroyer2. If confirmed malicious,
  this action could lead to system instability, data loss, and potential downtime,
  making it crucial for immediate investigation and response.
