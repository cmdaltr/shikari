level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CallTrace|contains: '|UNKNOWN('\n  CallTrace|endswith: )\n  CallTrace|startswith:\
  \ C:\\Windows\\System32\\ntdll.dll+\n  GrantedAccess: '0x1440'\n  TargetImage|endswith:\
  \ \\lsass.exe\n"
explanation: Detects HandleKatz opening LSASS to duplicate its handle to later dump
  the memory without opening any new handles
false_positives:
- Unknown
