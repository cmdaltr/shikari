indicators:
- type: data_source
  value: Windows Event Log Security 5136
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Domain mergers and migrations may generate large volumes of false positives
    for this analytic.
  mitigation: Review context and user activity
