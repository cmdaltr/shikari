technique_id: T1059.001
technique_name: Potential WinAPI Calls Via PowerShell Scripts
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 03d83090-8cba-44a0-b02f-0b756a050306
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_duplicate_token:\n\
  \  ScriptBlockText|contains|all:\n  - OpenProcessToken\n  - DuplicateTokenEx\n \
  \ - CloseHandle\nselection_injection:\n  ScriptBlockText|contains|all:\n  - VirtualAlloc\n\
  \  - OpenProcess\n  - WriteProcessMemory\n  - CreateRemoteThread\nselection_process_write_read:\n\
  \  ScriptBlockText|contains|all:\n  - WriteProcessMemory\n  - VirtualAlloc\n  -\
  \ ReadProcessMemory\n  - VirtualFree\nselection_token_steal:\n  ScriptBlockText|contains|all:\n\
  \  - OpenProcessToken\n  - LookupPrivilegeValue\n  - AdjustTokenPrivileges\n"
explanation: Detects use of WinAPI functions in PowerShell scripts
false_positives:
- Unknown
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
tags:
- attack.execution
- attack.t1059.001
- attack.t1106
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_injection:
    ScriptBlockText|contains|all:
    - VirtualAlloc
    - OpenProcess
    - WriteProcessMemory
    - CreateRemoteThread
  selection_token_steal:
    ScriptBlockText|contains|all:
    - OpenProcessToken
    - LookupPrivilegeValue
    - AdjustTokenPrivileges
  selection_duplicate_token:
    ScriptBlockText|contains|all:
    - OpenProcessToken
    - DuplicateTokenEx
    - CloseHandle
  selection_process_write_read:
    ScriptBlockText|contains|all:
    - WriteProcessMemory
    - VirtualAlloc
    - ReadProcessMemory
    - VirtualFree
  condition: 1 of selection_*
