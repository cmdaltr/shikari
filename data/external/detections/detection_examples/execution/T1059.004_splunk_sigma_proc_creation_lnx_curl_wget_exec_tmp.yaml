technique_id: T1059.004
technique_name: Suspicious Download and Execute Pattern via Curl/Wget
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.85
validated: true
source: sigma
sigma_id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_downloader:\n  CommandLine|contains:\n  - /curl\n  - /wget\nselection_executor:\n\
  \  CommandLine|contains: sh -c\nselection_tmp:\n  CommandLine|contains:\n  - /tmp/\n\
  \  - /dev/shm/\n"
explanation: 'Detects suspicious use of command-line tools such as curl or wget to
  download remote

  content - particularly scripts - into temporary directories (e.g., /dev/shm, /tmp),
  followed by

  immediate execution, indicating potential malicious activity. This pattern is commonly
  used

  by malicious scripts, stagers, or downloaders in fileless or multi-stage Linux attacks.

  '
false_positives:
- System update scripts using temporary files
- Installer scripts or automated provisioning tools
references:
- https://gtfobins.github.io/gtfobins/wget/
- https://gtfobins.github.io/gtfobins/curl/
tags:
- attack.execution
- attack.t1059.004
- attack.t1203
logsource:
  category: process_creation
  product: linux
detection:
  selection_downloader:
    CommandLine|contains:
    - /curl
    - /wget
  selection_tmp:
    CommandLine|contains:
    - /tmp/
    - /dev/shm/
  selection_executor:
    CommandLine|contains: sh -c
  condition: all of selection_*
