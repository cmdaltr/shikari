    - verification
    - verify
  - Details|contains:
    - '%comspec%'
    - bitsadmin
    - certutil
    - cmd
    - cscript
    - curl
    - mshta
    - powershell
    - pwsh
    - regsvr32
    - rundll32
    - schtasks
    - wget
    - wscript
  condition: all of selection_*
