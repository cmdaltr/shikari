technique_id: T1190
technique_name: Detect Exchange Web Shell
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime FROM datamodel=Endpoint.Filesystem where Filesystem.file_path IN ("*\\HttpProxy\\owa\\auth\\*",
  "*\\inetpub\\wwwroot\\aspnet_client\\*", "*\\HttpProxy\\OAB\\*") Filesystem.file_name
  IN( "*.aspx", "*.ashx") by Filesystem.action Filesystem.dest Filesystem.file_access_time
  Filesystem.file_create_time Filesystem.file_hash Filesystem.file_modify_time Filesystem.file_name
  Filesystem.file_path Filesystem.file_acl Filesystem.file_size Filesystem.process_guid
  Filesystem.process_id Filesystem.user Filesystem.vendor_product | `drop_dm_object_name(Filesystem)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `detect_exchange_web_shell_filter`'
explanation: The following analytic identifies the creation of suspicious .aspx files
  in known drop locations for Exchange exploitation, specifically targeting paths
  associated with HAFNIUM group and vulnerabilities like ProxyShell and ProxyNotShell.
  It leverages data from the Endpoint datamodel, focusing on process and filesystem
  events. This activity is significant as it may indicate a web shell deployment,
  a common method for persistent access and remote code execution. If confirmed malicious,
  attackers could gain unauthorized access, execute arbitrary commands, and potentially
  escalate privileges within the Exchange environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/8c14eeee-2af1-4a4b-bda8-228da0f4862a/
