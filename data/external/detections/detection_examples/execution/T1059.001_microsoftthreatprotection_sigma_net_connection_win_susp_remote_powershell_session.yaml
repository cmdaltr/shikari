technique_id: T1059.001
technique_name: Potential Remote PowerShell Session Initiated
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.87
validated: true
source: sigma
sigma_id: c539afac-c12a-46ed-b1bd-5a5567c9f045
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_* and not 1 of filter_optional_*\nfilter_main_localhost:\n  DestinationIp:\n\
  \  - ::1\n  - 127.0.0.1\n  SourceIp:\n  - ::1\n  - 127.0.0.1\nfilter_main_service_users:\n\
  - User|contains:\n  - NETWORK SERVICE\n  - NETZWERKDIENST\n  - SERVICIO DE RED\n\
  \  - SERVIZIO DI RETE\n- User|contains|all:\n  - SERVICE R\n  - SEAU\nfilter_optional_avast:\n\
  \  Image:\n  - C:\\Program Files\\Avast Software\\Avast\\AvastSvc.exe\n  - C:\\\
  Program Files (x86)\\Avast Software\\Avast\\AvastSvc.exe\nselection:\n  DestinationPort:\n\
  \  - 5985\n  - 5986\n  Initiated: 'true'\n  SourceIsIpv6: 'false'\n"
explanation: 'Detects a process that initiated a network connection over ports 5985
  or 5986 from a non-network service account.

  This could potentially indicates a remote PowerShell connection.

  '
false_positives:
- Legitimate usage of remote PowerShell, e.g. remote administration and monitoring.
- Network Service user name of a not-covered localization
references:
- https://threathunterplaybook.com/hunts/windows/190511-RemotePwshExecution/notebook.html
tags:
- attack.execution
- attack.t1059.001
- attack.lateral-movement
- attack.t1021.006
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort:
    - 5985
    - 5986
    Initiated: 'true'
    SourceIsIpv6: 'false'
  filter_main_service_users:
  - User|contains:
    - NETWORK SERVICE
    - NETZWERKDIENST
    - SERVICIO DE RED
    - SERVIZIO DI RETE
  - User|contains|all:
    - SERVICE R
    - SEAU
  filter_main_localhost:
    SourceIp:
    - ::1
    - 127.0.0.1
    DestinationIp:
    - ::1
    - 127.0.0.1
  filter_optional_avast:
    Image:
    - C:\Program Files\Avast Software\Avast\AvastSvc.exe
    - C:\Program Files (x86)\Avast Software\Avast\AvastSvc.exe
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
