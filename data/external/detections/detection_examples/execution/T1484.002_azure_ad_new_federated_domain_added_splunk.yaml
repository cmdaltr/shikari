technique_id: T1484.002
technique_name: Azure AD New Federated Domain Added
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` operationName="Set domain authentication" "properties.result"=success
  | rename properties.* as * | rename targetResources{}.displayName as domain | rename
  userAgent as user_agent | fillnull | stats count min(_time) as firstTime max(_time)
  as lastTime by dest user src vendor_account vendor_product user_agent domain signature
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `azure_ad_new_federated_domain_added_filter`'
explanation: The following analytic detects the addition of a new federated domain
  within an Azure Active Directory tenant. It leverages Azure AD AuditLogs to identify
  successful "Set domain authentication" operations. This activity is significant
  as it may indicate the use of the Azure AD identity federation backdoor technique,
  allowing an adversary to establish persistence. If confirmed malicious, the attacker
  could impersonate any user, bypassing password and MFA requirements, potentially
  leading to unauthorized access and control over the Azure AD environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a87cd633-076d-4ab2-9047-977751a3c1a0/
indicators:
- type: data_source
  value: Azure Active Directory Set domain authentication
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: In most organizations, domain federation settings will be updated infrequently.
    Filter as needed.
  mitigation: Review context and user activity
