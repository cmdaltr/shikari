technique_id: T1203
technique_name: Suspicious Spool Service Child Process
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: dcdbc940-0bff-46b2-95f3-2d73f848e33b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: spoolsv and ( suspicious_unrestricted\
  \ or (suspicious_net and not suspicious_net_filter)\n  or (suspicious_cmd and not\
  \ suspicious_cmd_filter) or (suspicious_netsh and not suspicious_netsh_filter)\n\
  \  or (suspicious_powershell and not suspicious_powershell_filter) or all of suspicious_rundll32_*\n\
  \  )\nspoolsv:\n  IntegrityLevel:\n  - System\n  - S-1-16-16384\n  ParentImage|endswith:\
  \ \\spoolsv.exe\nsuspicious_cmd:\n  Image|endswith: \\cmd.exe\nsuspicious_cmd_filter:\n\
  \  CommandLine|contains:\n  - .spl\n  - route add\n  - program files\nsuspicious_net:\n\
  \  Image|endswith:\n  - \\net.exe\n  - \\net1.exe\nsuspicious_net_filter:\n  CommandLine|contains:\
  \ start\nsuspicious_netsh:\n  Image|endswith: \\netsh.exe\nsuspicious_netsh_filter:\n\
  \  CommandLine|contains:\n  - add portopening\n  - rule name\nsuspicious_powershell:\n\
  \  Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\nsuspicious_powershell_filter:\n\
  \  CommandLine|contains: .spl\nsuspicious_rundll32_cli:\n  CommandLine|endswith:\
  \ rundll32.exe\nsuspicious_rundll32_img:\n- Image|endswith: \\rundll32.exe\n- OriginalFileName:\
  \ RUNDLL32.EXE\nsuspicious_unrestricted:\n  Image|endswith:\n  - \\gpupdate.exe\n\
  \  - \\whoami.exe\n  - \\nltest.exe\n  - \\taskkill.exe\n  - \\wmic.exe\n  - \\\
  taskmgr.exe\n  - \\sc.exe\n  - \\findstr.exe\n  - \\curl.exe\n  - \\wget.exe\n \
  \ - \\certutil.exe\n  - \\bitsadmin.exe\n  - \\accesschk.exe\n  - \\wevtutil.exe\n\
  \  - \\bcdedit.exe\n  - \\fsutil.exe\n  - \\cipher.exe\n  - \\schtasks.exe\n  -\
  \ \\write.exe\n  - \\wuauclt.exe\n  - \\systeminfo.exe\n  - \\reg.exe\n  - \\query.exe\n"
explanation: Detects suspicious print spool service (spoolsv.exe) child processes.
false_positives:
- Unknown
references:
- https://github.com/microsoft/Microsoft-365-Defender-Hunting-Queries/blob/efa17a600b43c897b4b7463cc8541daa1987eeb4/Exploits/Print%20Spooler%20RCE/Suspicious%20Spoolsv%20Child%20Process.md
tags:
- attack.execution
- attack.t1203
- attack.privilege-escalation
- attack.t1068
logsource:
  category: process_creation
  product: windows
detection:
  spoolsv:
    ParentImage|endswith: \spoolsv.exe
    IntegrityLevel:
    - System
    - S-1-16-16384
  suspicious_unrestricted:
    Image|endswith:
    - \gpupdate.exe
    - \whoami.exe
    - \nltest.exe
    - \taskkill.exe
    - \wmic.exe
    - \taskmgr.exe
    - \sc.exe
    - \findstr.exe
    - \curl.exe
    - \wget.exe
    - \certutil.exe
    - \bitsadmin.exe
    - \accesschk.exe
    - \wevtutil.exe
    - \bcdedit.exe
    - \fsutil.exe
    - \cipher.exe
    - \schtasks.exe
    - \write.exe
    - \wuauclt.exe
    - \systeminfo.exe
    - \reg.exe
    - \query.exe
  suspicious_net:
    Image|endswith:
    - \net.exe
    - \net1.exe
  suspicious_net_filter:
    CommandLine|contains: start
  suspicious_cmd:
    Image|endswith: \cmd.exe
  suspicious_cmd_filter:
    CommandLine|contains:
    - .spl
    - route add
    - program files
  suspicious_netsh:
    Image|endswith: \netsh.exe
  suspicious_netsh_filter:
    CommandLine|contains:
    - add portopening
    - rule name
  suspicious_powershell:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  suspicious_powershell_filter:
    CommandLine|contains: .spl
  suspicious_rundll32_img:
  - Image|endswith: \rundll32.exe
  - OriginalFileName: RUNDLL32.EXE
  suspicious_rundll32_cli:
    CommandLine|endswith: rundll32.exe
  condition: spoolsv and ( suspicious_unrestricted or (suspicious_net and not suspicious_net_filter)
    or (suspicious_cmd and not suspicious_cmd_filter) or (suspicious_netsh and not
    suspicious_netsh_filter) or (suspicious_powershell and not suspicious_powershell_filter)
    or all of suspicious_rundll32_* )
