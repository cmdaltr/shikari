false_positives:
- description: Legitimate programs and administrators will execute sc.exe with the
    start disabled flag.  It is possible, but unlikely from the telemetry of normal
    Windows operation we observed, that sc.exe will be called more than seven times
    in a short period of time.
  mitigation: Review context and user activity
