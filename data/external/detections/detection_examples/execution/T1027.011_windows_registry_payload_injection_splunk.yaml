technique_id: T1027.011
technique_name: Windows Registry Payload Injection
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count from datamodel=Endpoint.Registry
  where Registry.registry_value_data=* by _time span=1h Registry.dest Registry.registry_path
  Registry.registry_value_name Registry.process_guid Registry.registry_value_data
  Registry.registry_key_name Registry.registry_hive Registry.status Registry.action
  Registry.process_id Registry.user Registry.vendor_product | `drop_dm_object_name(Registry)`
  | eval reg_data_len = len(registry_value_data) | where reg_data_len > 512 | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `windows_registry_payload_injection_filter`'
explanation: The following analytic detects suspiciously long data written to the
  Windows registry, a behavior often linked to fileless malware or persistence techniques.
  It leverages Endpoint Detection and Response (EDR) telemetry, focusing on registry
  events with data lengths exceeding 512 characters. This activity is significant
  as it can indicate an attempt to evade traditional file-based defenses, making it
  crucial for SOC monitoring. If confirmed malicious, this technique could allow attackers
  to maintain persistence, execute code, or manipulate system configurations without
  leaving a conventional file footprint.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/c6b2d80f-179a-41a1-b95e-ce5601d7427a/
indicators:
