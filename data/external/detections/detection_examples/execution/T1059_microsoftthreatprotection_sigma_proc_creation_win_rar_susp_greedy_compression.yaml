technique_id: T1059
technique_name: Suspicious Greedy Compression Using Rar.EXE
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: afe52666-401e-4a02-b4ff-5d128990b8cb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_opt_*\
  \ and all of selection_cli_*\nselection_cli_flags:\n  CommandLine|contains|all:\n\
  \  - ' -hp'\n  - ' -r '\nselection_cli_folders:\n  CommandLine|contains:\n  - '\
  \ ?:\\\\\\*.'\n  - ' ?:\\\\\\\\\\*.'\n  - ' ?:\\$Recycle.bin\\'\n  - ' ?:\\PerfLogs\\\
  '\n  - ' ?:\\Temp'\n  - ' ?:\\Users\\Public\\'\n  - ' ?:\\Windows\\'\n  - ' %public%'\n\
  selection_opt_1:\n- Image|endswith: \\rar.exe\n- Description: Command line RAR\n\
  selection_opt_2:\n  CommandLine|contains:\n  - '.exe a '\n  - ' a -m'\n"
explanation: Detects RAR usage that creates an archive from a suspicious folder, either
  a system folder or one of the folders often used by attackers for staging purposes
false_positives:
- Unknown
references:
- https://decoded.avast.io/martinchlumecky/png-steganography
tags:
- attack.execution
- attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  selection_opt_1:
  - Image|endswith: \rar.exe
  - Description: Command line RAR
  selection_opt_2:
    CommandLine|contains:
    - '.exe a '
    - ' a -m'
  selection_cli_flags:
    CommandLine|contains|all:
    - ' -hp'
    - ' -r '
  selection_cli_folders:
    CommandLine|contains:
    - ' ?:\\\*.'
    - ' ?:\\\\\*.'
    - ' ?:\$Recycle.bin\'
    - ' ?:\PerfLogs\'
    - ' ?:\Temp'
    - ' ?:\Users\Public\'
    - ' ?:\Windows\'
    - ' %public%'
  condition: 1 of selection_opt_* and all of selection_cli_*
