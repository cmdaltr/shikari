technique_id: T1021.006
technique_name: Interactive Session on Remote Endpoint with PowerShell
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`powershell` EventCode=4104 (ScriptBlockText="*Enter-PSSession*" AND ScriptBlockText="*-ComputerName*")
  | fillnull | stats count min(_time) as firstTime max(_time) as lastTime by dest
  signature signature_id user_id vendor_product EventID Guid Opcode Name Path ProcessID
  ScriptBlockId ScriptBlockText | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `interactive_session_on_remote_endpoint_with_powershell_filter`'
explanation: The following analytic detects the use of the `Enter-PSSession` cmdlet
  to establish an interactive session on a remote endpoint via the WinRM protocol.
  It leverages PowerShell Script Block Logging (EventCode=4104) to identify this activity
  by searching for specific script block text patterns. This behavior is significant
  as it may indicate lateral movement or remote code execution attempts by adversaries.
  If confirmed malicious, this activity could allow attackers to execute commands
  remotely, potentially leading to further compromise of the network and unauthorized
  access to sensitive information.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af/
indicators:
- type: data_source
  value: Powershell Script Block Logging 4104
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Administrators may leverage WinRM and `Enter-PSSession` for administrative
    and troubleshooting tasks. This activity is usually limited to a small set of
    hosts or users. In certain environments, tuning may not be possible.
  mitigation: Review context and user activity
references:
