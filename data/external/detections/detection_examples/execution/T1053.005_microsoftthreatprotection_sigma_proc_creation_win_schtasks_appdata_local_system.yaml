technique_id: T1053.005
technique_name: Suspicious Schtasks Execution AppData Folder
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: c5c00f49-b3f9-45a6-997e-cfdecc6e1967
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  CommandLine|contains: /TN TVInstallRestore\n  Image|endswith: \\schtasks.exe\n\
  \  ParentImage|contains|all:\n  - \\AppData\\Local\\Temp\\\n  - TeamViewer_.exe\n\
  selection:\n  CommandLine|contains:\n  - NT AUT\n  - ' SYSTEM '\n  CommandLine|contains|all:\n\
  \  - /Create\n  - /RU\n  - /TR\n  - C:\\Users\\\n  - \\AppData\\Local\\\n  Image|endswith:\
  \ \\schtasks.exe\n"
explanation: Detects the creation of a schtask that executes a file from C:\Users\<USER>\AppData\Local
false_positives:
- Unknown
references:
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: \schtasks.exe
    CommandLine|contains|all:
    - /Create
    - /RU
    - /TR
    - C:\Users\
    - \AppData\Local\
    CommandLine|contains:
    - NT AUT
    - ' SYSTEM '
  filter:
    ParentImage|contains|all:
    - \AppData\Local\Temp\
    - TeamViewer_.exe
    Image|endswith: \schtasks.exe
    CommandLine|contains: /TN TVInstallRestore
  condition: selection and not filter
