technique_id: T1489
technique_name: Linux Auditd Sysmon Service Stop
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`linux_auditd` type=SERVICE_STOP unit IN ("sysmon") | rename host as dest
  | stats count min(_time) as firstTime max(_time) as lastTime by type pid comm exe
  unit dest | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`|
  `linux_auditd_sysmon_service_stop_filter`'
explanation: The following analytic detects the suspicious sysmon service stop. This
  behavior is critical for a SOC to monitor because it may indicate attempts to gain
  unauthorized access or maintain control over a system. Such actions could be signs
  of malicious activity. If confirmed, this could lead to serious consequences, including
  a compromised system, unauthorized access to sensitive data, or even a wider breach
  affecting the entire network. Detecting and responding to these signs early is essential
  to prevent potential security incidents.
