technique_id: T1566.002
technique_name: Unusual Execution via Microsoft Common Console File
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.executable : \"?:\\\\Windows\\\\System32\\\\mmc.exe\" and endswith~(process.parent.args,\
  \ \".msc\") and\n  not (\n    process.parent.args : (\n      \"?:\\\\Windows\\\\\
  System32\\\\*.msc\",\n      \"?:\\\\Windows\\\\SysWOW64\\\\*.msc\",\n      \"?:\\\
  \\Program files\\\\*.msc\",\n      \"?:\\\\Program Files (x86)\\\\*.msc\"\n    )\
  \ or\n    (\n      process.executable : \"?:\\\\Windows\\\\System32\\\\mmc.exe\"\
  \ and\n      process.command_line : \"\\\"C:\\\\WINDOWS\\\\system32\\\\mmc.exe\\\
  \" \\\"C:\\\\Windows\\\\System32\\\\gpme.msc\\\" /s /gpobject:\\\"LDAP://*\"\n \
  \   ) or\n    (\n      process.executable : (\n        \"?:\\\\Program Files (x86)\\\
  \\Microsoft\\\\Edge\\\\Application\\\\msedge.exe\",\n        \"?:\\\\Program Files\\\
  \\Mozilla Firefox\\\\firefox.exe\",\n        \"?:\\\\Program Files\\\\Google\\\\\
  Chrome\\\\Application\\\\chrome.exe\",\n        \"?:\\\\Program Files\\\\internet\
  \ explorer\\\\iexplore.exe\"\n      ) and\n      process.args : \"http*://go.microsoft.com/fwlink/*\"\
  \n    ) or\n    process.executable : (\n      \"?:\\\\Windows\\\\System32\\\\vmconnect.exe\"\
  ,\n      \"?:\\\\Windows\\\\System32\\\\WerFault.exe\",\n      \"?:\\\\Windows\\\
  \\System32\\\\wermgr.exe\"\n    )\n  )"
explanation: 'Identifies the execution of a child process from a Microsoft Common
  Console file. Adversaries may embed a malicious

  command in an MSC file in order to trick victims into executing malicious commands.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e760c72b-bb1f-44f0-9f0d-37d51744ee75.toml
