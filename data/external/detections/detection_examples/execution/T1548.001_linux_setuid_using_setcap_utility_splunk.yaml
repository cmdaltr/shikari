technique_id: T1548.001
technique_name: Linux Setuid Using Setcap Utility
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where (Processes.process_name = setcap
  OR Processes.process = "*setcap *") AND Processes.process IN ("* cap_setuid=ep *",
  "* cap_setuid+ep *", "* cap_net_bind_service+p *", "* cap_net_raw+ep *", "* cap_dac_read_search+ep
  *") by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `linux_setuid_using_setcap_utility_filter`'
explanation: The following analytic detects the execution of the 'setcap' utility
  to enable the SUID bit on Linux systems. It leverages Endpoint Detection and Response
  (EDR) data, focusing on process names and command-line arguments that indicate the
  use of 'setcap' with specific capabilities. This activity is significant because
  setting the SUID bit allows a user to temporarily gain root access, posing a substantial
  security risk. If confirmed malicious, an attacker could escalate privileges, execute
  arbitrary commands with elevated permissions, and potentially compromise the entire
  system.
