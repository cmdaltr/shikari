technique_id: T1059
technique_name: Suspicious Remote Child Process From Outlook
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: e212d415-0e93-435f-9e1a-f29005bb4723
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|startswith: \\\\\\\\\n  ParentImage|endswith: \\outlook.exe\n"
explanation: Detects a suspicious child process spawning from Outlook where the image
  is located in a remote location (SMB/WebDav shares).
false_positives:
- Unknown
references:
- https://github.com/sensepost/ruler
- https://www.fireeye.com/blog/threat-research/2018/12/overruled-containing-a-potentially-destructive-adversary.html
- https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=49
tags:
