technique_id: T1059.004
technique_name: Suspicious Mining Process Creation Event
tactic: execution
platform: Elastic
fidelity_score: 0.91
validated: true
query: 'file where host.os.type == "linux" and event.type == "creation" and event.action
  : ("creation", "file_create_event") and

  file.name : ("aliyun.service", "moneroocean_miner.service", "c3pool_miner.service",
  "pnsd.service", "apache4.service", "pastebin.service", "xvf.service")'
explanation: 'Identifies service creation events of common mining services, possibly
  indicating the infection of a system with a

  cryptominer.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e2258f48-ba75-4248-951b-7c885edf18c2.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Crowdstrike
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts or services may create files with names similar
    to known mining services. Verify the origin and purpose of such files before taking
    action.

    - System administrators might deploy custom monitoring or management services
    that inadvertently match the file names in the detection rule. Review and whitelist
    these services if they are confirmed to be non-threatening.

    - Automated deployment tools or scripts could create service files as part of'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
