technique_id: T1505.001
technique_name: Windows SQL Server Critical Procedures Enabled
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`wineventlog_application` EventCode=15457 | rex field=EventData_Xml "<Data>(?<config_name>[^<]+)</Data><Data>(?<old_value>[^<]+)</Data><Data>(?<new_value>[^<]+)</Data>"
  | where config_name IN ("Ad Hoc Distributed Queries", "external scripts enabled",
  "Ole Automation Procedures", "clr enabled", "clr strict security") | rename host
  as dest | eval change_type=case( old_value="0" AND new_value="1", "enabled", old_value="1"
  AND new_value="0", "disabled", true(), "modified" ) | eval risk_score=case( change_type="enabled",
  90, change_type="disabled", 60, true(), 70 ) | eval risk_message="SQL Server critical
  procedure ".config_name." was ".change_type." on host ".dest.", which may indicate
  attempts to gain code execution or perform reconnaissance" | stats count min(_time)
  as firstTime max(_time) as lastTime by dest EventCode config_name change_type risk_message
  risk_score | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_sql_server_critical_procedures_enabled_filter`'
explanation: This detection identifies when critical SQL Server configuration options
  are modified, including "Ad Hoc Distributed Queries", "external scripts enabled",
  "Ole Automation Procedures", "clr enabled", and "clr strict security". These features
  can be abused by attackers for various malicious purposes - Ad Hoc Distributed Queries
  enables Active Directory reconnaissance through ADSI provider, external scripts
  and Ole Automation allow execution of arbitrary code, and CLR features can be used
  to run custom assemblies. Enabling these features could indicate attempts to gain
  code execution or perform reconnaissance through SQL Server.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/d0434864-b043-41e3-8c08-30e53605e9cb/
indicators:
- type: data_source
  value: Windows Event Log Application 15457
  confidence: high
- type: risk_system
  value: dest
  confidence: high
- type: risk_other
  value: config_name
  confidence: high
false_positives:
- description: Database administrators may legitimately enable these features for
    valid business purposes such as cross-database queries, custom CLR assemblies,
    automation scripts, or application requirements. To reduce false positives, document
    when these features are required, monitor for unauthorized changes, create change
    control procedures for configuration modifications, and consider alerting on the
    enabled state rather than configuration changes if preferred.
  mitigation: Review context and user activity
