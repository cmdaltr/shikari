technique_id: T1484.002
technique_name: O365 Cross-Tenant Access Change
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=AzureActiveDirectory Operation IN ("Add
  a partner to cross-tenant access setting.","Delete partner specific cross-tenant
  access setting.") | eval user = case(match(mvindex(''Actor{}.ID'',-1),"User"),mvindex(''Actor{}.ID'',0),match(mvindex(''Actor{}.ID'',-1),"ServicePrincipal"),mvindex(''Actor{}.ID'',3),true(),mvindex(''Actor{}.ID'',0))
  | fillnull | stats count min(_time) as firstTime max(_time) as lastTime by dest
  user src vendor_account vendor_product signature signature_id | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `o365_cross_tenant_access_change_filter`'
explanation: The following analytic identifies when cross-tenant access/synchronization
  policies are changed in an Azure tenant. Adversaries have been observed altering
  victim cross-tenant policies as a method of lateral movement or maintaining persistent
  access to compromised environments. These policies should be considered sensitive
  and monitored for changes and/or loose configuration.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/7c0fa490-12b0-4d0b-b9f5-e101d1e0e06f/
indicators:
- type: data_source
  value: Office 365 Universal Audit Log
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Business approved changes by known administrators.
  mitigation: Review context and user activity
