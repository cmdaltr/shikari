technique_id: T1136.003
technique_name: Azure AD Service Principal Created
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` operationName="Add service principal" properties.initiatedBy.user.id=*
  | rename properties.* as * | rename targetResources{}.displayName as displayName
  | rename targetResources{}.type as type | fillnull | stats count min(_time) as firstTime
  max(_time) as lastTime by dest user src vendor_account vendor_product displayName
  result signature | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `azure_ad_service_principal_created_filter`'
explanation: The following analytic detects the creation of a Service Principal in
  an Azure AD environment. It leverages Azure Active Directory events ingested through
  EventHub, specifically monitoring the "Add service principal" operation. This activity
  is significant because Service Principals can be used by adversaries to establish
  persistence and bypass multi-factor authentication and conditional access policies.
  If confirmed malicious, this could allow attackers to maintain single-factor access
  to the Azure AD environment, potentially leading to unauthorized access to resources
  and prolonged undetected activity.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/f8ba49e7-ffd3-4b53-8f61-e73974583c5d/
indicators:
- type: data_source
  value: Azure Active Directory Add service principal
  confidence: high
- type: risk_user
  value: displayName
  confidence: high
false_positives:
- description: Administrator may legitimately create Service Principal. Filter as
    needed.
  mitigation: Review context and user activity
