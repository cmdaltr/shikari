technique_id: T1071
technique_name: Potential Reverse Shell
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id with maxspan=5s\n  [network where event.type == \"start\"\
  \ and host.os.type == \"linux\" and\n     event.action in (\"connection_attempted\"\
  , \"connection_accepted\") and\n     process.name : (\"bash\", \"dash\", \"sh\"\
  , \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\", \"socat\") and destination.ip !=\
  \ null and\n     not cidrmatch(destination.ip, \"127.0.0.0/8\", \"169.254.0.0/16\"\
  , \"224.0.0.0/4\", \"::1\")] by process.entity_id\n  [process where event.type ==\
  \ \"start\" and host.os.type == \"linux\" and event.action in (\"exec\", \"fork\"\
  ) and\n     process.name in (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\"\
  , \"ksh\", \"fish\") and (\n       (process.args : (\"-i\", \"-l\")) or (process.parent.name\
  \ == \"socat\" and process.parent.args : \"*exec*\")\n   )] by process.parent.entity_id"
explanation: 'This detection rule identifies suspicious network traffic patterns associated
  with TCP reverse shell activity. This

  activity consists of a parent-child relationship where a network event is followed
  by the creation of a shell process.

  An attacker may establish a Linux TCP reverse shell to gain remote access to a target
  system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/48b3d2e3-f4e8-41e6-95e6-9b2091228db3.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tasks using interactive shells may trigger this rule.
    System administrators often use shells with interactive flags for maintenance.
    To mitigate, create exceptions for known administrator accounts or specific IP
    addresses.

    - Automated scripts or cron jobs that use shell commands with interactive flags
    can be mistaken for reverse shells. Review and whitelist these scripts by process
    name or parent process ID to prevent false alerts.

    - Tools lik'
  mitigation: Review investigation guide for details
references:
