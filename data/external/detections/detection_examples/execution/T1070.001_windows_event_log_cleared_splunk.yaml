technique_id: T1070.001
technique_name: Windows Event Log Cleared
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: (`wineventlog_security` EventCode=1102) OR (`wineventlog_system` EventCode=104)
  | stats count min(_time) as firstTime max(_time) as lastTime by action app change_type
  dest dvc name object_attrs object_category signature signature_id src_user status
  subject user vendor_product object EventCode | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `windows_event_log_cleared_filter`
explanation: The following analytic detects the clearing of Windows event logs by
  identifying Windows Security Event ID 1102 or System log event 104. This detection
  leverages Windows event logs to monitor for log clearing activities. Such behavior
  is significant as it may indicate an attempt to cover tracks after malicious activities.
  If confirmed malicious, this action could hinder forensic investigations and allow
  attackers to persist undetected, making it crucial to investigate further and correlate
  with other alerts and data sources.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/ad517544-aff9-4c96-bd99-d6eb43bfbb6a/
indicators:
- type: data_source
  value: Windows Event Log Security 1102
  confidence: high
- type: data_source
  value: Windows Event Log System 104
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: It is possible that these logs may be legitimately cleared by Administrators.
    Filter as needed.
  mitigation: Review context and user activity
