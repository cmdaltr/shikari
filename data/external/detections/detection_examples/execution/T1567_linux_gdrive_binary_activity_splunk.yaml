technique_id: T1567
technique_name: Linux Gdrive Binary Activity
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name="gdrive"
  Processes.process IN  ("* download *", "* upload *", "* list*", "* update *", "*
  sync *", "* share *", "* account add*", "* drives *", "* files *") by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `linux_gdrive_binary_activity_filter`'
explanation: The following analytic detects the execution of the 'gdrive' tool on
  a Linux host. This tool allows standard users to perform tasks associated with Google
  Drive via the command line. This is used by actors to stage tools as well as exfiltrate
  data. The detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process names and command-line executions. If confirmed malicious, this
  could lead to compromise of systems or sensitive data being stolen.
source: Splunk Security Content
