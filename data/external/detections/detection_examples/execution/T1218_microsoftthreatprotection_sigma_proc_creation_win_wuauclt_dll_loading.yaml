technique_id: T1218
technique_name: Proxy Execution Via Wuauclt.EXE
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: af77cf95-c469-471c-b6a0-946c685c4798
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_generic:\n  CommandLine|contains: ' /UpdateDeploymentProvider\
  \ UpdateDeploymentProvider.dll '\nfilter_main_uus:\n  CommandLine|contains:\n  -\
  \ :\\Windows\\UUS\\Packages\\Preview\\amd64\\updatedeploy.dll /ClassId\n  - :\\\
  Windows\\UUS\\amd64\\UpdateDeploy.dll /ClassId\nfilter_main_winsxs:\n  CommandLine|contains|all:\n\
  \  - :\\Windows\\WinSxS\\\n  - '\\UpdateDeploy.dll /ClassId '\nfilter_main_wuaueng:\n\
  \  CommandLine|contains: ' wuaueng.dll '\nselection_cli:\n  CommandLine|contains|all:\n\
  \  - UpdateDeploymentProvider\n  - RunHandlerComServer\nselection_img:\n- Image|endswith:\
  \ \\wuauclt.exe\n- OriginalFileName: wuauclt.exe\n"
explanation: Detects the use of the Windows Update Client binary (wuauclt.exe) for
  proxy execution.
false_positives:
- Unknown
references:
- https://dtm.uk/wuauclt/
- https://blog.malwarebytes.com/threat-intelligence/2022/01/north-koreas-lazarus-apt-leverages-windows-update-client-github-in-latest-campaign/
tags:
- attack.defense-evasion
- attack.t1218
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \wuauclt.exe
  - OriginalFileName: wuauclt.exe
  selection_cli:
    CommandLine|contains|all:
    - UpdateDeploymentProvider
    - RunHandlerComServer
  filter_main_generic:
    CommandLine|contains: ' /UpdateDeploymentProvider UpdateDeploymentProvider.dll '
  filter_main_wuaueng:
    CommandLine|contains: ' wuaueng.dll '
  filter_main_uus:
    CommandLine|contains:
    - :\Windows\UUS\Packages\Preview\amd64\updatedeploy.dll /ClassId
    - :\Windows\UUS\amd64\UpdateDeploy.dll /ClassId
  filter_main_winsxs:
    CommandLine|contains|all:
    - :\Windows\WinSxS\
    - '\UpdateDeploy.dll /ClassId '
  condition: all of selection_* and not 1 of filter_main_*
