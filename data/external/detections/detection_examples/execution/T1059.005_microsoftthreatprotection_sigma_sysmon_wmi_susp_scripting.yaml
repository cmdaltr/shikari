source: sigma
sigma_id: fe21810c-2a8c-478f-8dd3-5a287fb2a0e0
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_destination\n\
  selection_destination:\n- Destination|contains|all:\n  - new-object\n  - net.webclient\n\
  \  - .downloadstring\n- Destination|contains|all:\n  - new-object\n  - net.webclient\n\
  \  - .downloadfile\n- Destination|contains:\n  - ' iex('\n  - ' -nop '\n  - ' -noprofile\
  \ '\n  - ' -decode '\n  - ' -enc '\n  - WScript.Shell\n  - System.Security.Cryptography.FromBase64Transform\n"
explanation: Detects suspicious commands that are related to scripting/powershell
  in WMI Event Consumers
false_positives:
- Legitimate administrative scripts
references:
