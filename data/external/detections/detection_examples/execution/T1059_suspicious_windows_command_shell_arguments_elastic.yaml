- description: 'false positives. This helps in early detection of potential threats
    by monitoring for suspicious command executions.


    ### Possible investigation steps


    - Review the command line arguments associated with the cmd.exe process to identify
    any suspicious patterns or keywords such as "curl", "regsvr32", "wscript", or
    "Invoke-WebRequest" that may indicate malicious activity.

    - Check the parent process of the cmd.exe execution to determine if it is a known
    benign process or if it is associated with pot'
  mitigation: Review investigation guide for details
