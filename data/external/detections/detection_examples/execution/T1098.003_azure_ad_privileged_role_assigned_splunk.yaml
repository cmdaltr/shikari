technique_id: T1098.003
technique_name: Azure AD Privileged Role Assigned
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` "operationName"="Add member to role" | rename properties.*
  as * | rename initiatedBy.user.userPrincipalName as initiatedBy | rename targetResources{}.modifiedProperties{}.newValue
  as roles | eval role=mvindex(roles,1) | fillnull | stats count min(_time) as firstTime
  max(_time) as lastTime by dest user src vendor_account vendor_product initiatedBy
  result role signature | lookup privileged_azure_ad_roles azureadrole AS role OUTPUT
  isprvilegedadrole description | search isprvilegedadrole = True | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `azure_ad_privileged_role_assigned_filter`'
explanation: The following analytic detects the assignment of privileged Azure Active
  Directory roles to a user. It leverages Azure AD audit logs, specifically monitoring
  the "Add member to role" operation. This activity is significant as adversaries
  may assign privileged roles to compromised accounts to maintain persistence within
  the Azure AD environment. If confirmed malicious, this could allow attackers to
  escalate privileges, access sensitive information, and maintain long-term control
  over the Azure AD infrastructure.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a28f0bc3-3400-4a6e-a2da-89b9e95f0d2a/
indicators:
- type: data_source
  value: Azure Active Directory Add member to role
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_user
  value: initiatedBy
  confidence: high
false_positives:
- description: Administrators will legitimately assign the privileged roles users
    as part of administrative tasks. Filter as needed.
  mitigation: Review context and user activity
