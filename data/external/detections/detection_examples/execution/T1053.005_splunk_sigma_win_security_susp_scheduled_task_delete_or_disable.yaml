technique_id: T1053.005
technique_name: Important Scheduled Task Deleted/Disabled
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 7595ba94-cf3b-4471-aa03-4f6baa9e5fad
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_sys_username:\n  EventID: 4699\n  SubjectUserName|endswith: $\n\
  \  TaskName|contains: \\Windows\\Windows Defender\\\nselection:\n  EventID:\n  -\
  \ 4699\n  - 4701\n  TaskName|contains:\n  - \\Windows\\SystemRestore\\SR\n  - \\\
  Windows\\Windows Defender\\\n  - \\Windows\\BitLocker\n  - \\Windows\\WindowsBackup\\\
  \n  - \\Windows\\WindowsUpdate\\\n  - \\Windows\\UpdateOrchestrator\\Schedule\n\
  \  - \\Windows\\ExploitGuard\n"
explanation: Detects when adversaries stop services or processes by deleting or disabling
  their respective scheduled tasks in order to conduct data destructive activities
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4699
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4701
tags:
- attack.execution
- attack.privilege-escalation
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  service: security
  definition: The Advanced Audit Policy setting Object Access > Audit Other Object
    Access Events has to be configured to allow this detection. We also recommend
    extracting the Command field from the embedded XML in the event data.
detection:
  selection:
    EventID:
    - 4699
    - 4701
    TaskName|contains:
    - \Windows\SystemRestore\SR
    - \Windows\Windows Defender\
    - \Windows\BitLocker
    - \Windows\WindowsBackup\
    - \Windows\WindowsUpdate\
    - \Windows\UpdateOrchestrator\Schedule
    - \Windows\ExploitGuard
  filter_sys_username:
    EventID: 4699
    SubjectUserName|endswith: $
    TaskName|contains: \Windows\Windows Defender\
  condition: selection and not 1 of filter_*
