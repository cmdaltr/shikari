  u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\\u2007\"\
  \n  - \"\\u2008\\u2008\\u2008\\u2008\\u2008\\u2008\\u2008\\u2008\\u2008\\u2008\\\
  u2008\\u2008\"\n  - \"\\u2009\\u2009\\u2009\\u2009\\u2009\\u2009\\u2009\\u2009\\\
  u2009\\u2009\\u2009\\u2009\"\n  - \"\\u200A\\u200A\\u200A\\u200A\\u200A\\u200A\\\
  u200A\\u200A\\u200A\\u200A\\u200A\\u200A\"\n  - \"\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_\\_\"\n  - '            '\n"
explanation: 'Detects process creation with suspicious whitespace padding followed
  by a ''#'' character, which may indicate ClickFix or FileFix techniques used to
  conceal malicious commands from visual inspection.

  ClickFix and FileFix are social engineering attack techniques where adversaries
  distribute phishing documents or malicious links that deceive users into opening
  the Windows Run dialog box or File Explorer search bar.

  The victims are then instructed to paste commands from their clipboard, which contain
  extensive whitespace padding using various Unicode space characters to push the
  actual malicious command far to the right, effectively hiding it from immediate
  view.

  '
false_positives:
