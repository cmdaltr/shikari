technique_id: T1203
technique_name: Suspicious Execution from Foomatic-rip or Cupsd Parent
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\") and\nprocess.parent.name\
  \ in (\"foomatic-rip\", \"cupsd\") and process.command_line like (\n  // persistence\n\
  \  \"*cron*\", \"*/etc/rc.local*\", \"*/dev/tcp/*\", \"*/etc/init.d*\", \"*/etc/update-motd.d*\"\
  , \"*/etc/sudoers*\",\n  \"*/etc/profile*\", \"*autostart*\", \"*/etc/ssh*\", \"\
  */home/*/.ssh/*\", \"*/root/.ssh*\", \"*~/.ssh/*\", \"*udev*\",\n  \"*/etc/shadow*\"\
  , \"*/etc/passwd*\",\n\n  // Downloads\n  \"*curl*\", \"*wget*\",\n\n  // encoding\
  \ and decoding\n  \"*base64 *\", \"*base32 *\", \"*xxd *\", \"*openssl*\",\n\n \
  \ // reverse connections\n  \"*GS_ARGS=*\", \"*/dev/tcp*\", \"*/dev/udp/*\", \"\
  *import*pty*spawn*\", \"*import*subprocess*call*\", \"*TCPSocket.new*\",\n  \"*TCPSocket.open*\"\
  , \"*io.popen*\", \"*os.execute*\", \"*fsockopen*\", \"*disown*\", \"*nohup*\",\n\
  \n  // SO loads\n  \"*openssl*-engine*.so*\", \"*cdll.LoadLibrary*.so*\", \"*ruby*-e**Fiddle.dlopen*.so*\"\
  , \"*Fiddle.dlopen*.so*\",\n  \"*cdll.LoadLibrary*.so*\",\n\n  // misc. suspicious\
  \ command lines\n   \"*/etc/ld.so*\", \"*/dev/shm/*\", \"*/var/tmp*\", \"*echo*\"\
  , \"*>>*\", \"*|*\"\n) and not process.args like \"gs*\""
explanation: 'This detection rule addresses multiple vulnerabilities in the CUPS printing
  system, including CVE-2024-47176,

  CVE-2024-47076, CVE-2024-47175, and CVE-2024-47177. Specifically, this rule detects
  suspicious process command lines

  executed by child processes of foomatic-rip and cupsd. These flaws impact components
  like cups-browsed, libcupsfilters,

  libppd, and foomatic-rip, allowing remote unauthenticated attackers to manipulate
  IPP URLs or inject malicious data

  through crafted UDP packets or network spoofing. This can result in arbitrary command
  execution when a print job is

  initiated.'
