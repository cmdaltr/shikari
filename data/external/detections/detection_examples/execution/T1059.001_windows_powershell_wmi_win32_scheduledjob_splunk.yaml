technique_id: T1059.001
technique_name: Windows PowerShell WMI Win32 ScheduledJob
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`powershell` EventCode=4104 ScriptBlockText="*win32_scheduledjob*" | fillnull
  | stats count min(_time) as firstTime max(_time) as lastTime by dest signature signature_id
  user_id vendor_product EventID Guid Opcode Name Path ProcessID ScriptBlockId ScriptBlockText
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_powershell_wmi_win32_scheduledjob_filter`'
explanation: The following analytic detects the use of the Win32_ScheduledJob WMI
  class via PowerShell script block logging. This class, which manages scheduled tasks,
  is disabled by default due to security concerns and must be explicitly enabled through
  registry modifications. The detection leverages PowerShell event code 4104 and script
  block text analysis. Monitoring this activity is crucial as it may indicate malicious
  intent, especially if the class was enabled by an attacker. If confirmed malicious,
  this could allow attackers to persist in the environment by creating scheduled tasks.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/47c69803-2c09-408b-b40a-063c064cbb16/
indicators:
- type: data_source
  value: Powershell Script Block Logging 4104
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: False positives may be present based on legacy applications or utilities.
    Win32_ScheduledJob uses the Remote Procedure Call (RPC) protocol to create scheduled
    tasks on remote computers. It uses the DCOM (Distributed Component Object Model)
    infrastructure to establish a connection with the remote computer and invoke the
    necessary methods. The RPC service needs to be running on both the local and remote
    computers for the communication to take place.
  mitigation: Review context and user activity
