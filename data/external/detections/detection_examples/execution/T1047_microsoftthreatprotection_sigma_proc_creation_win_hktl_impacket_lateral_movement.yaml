technique_id: T1047
technique_name: HackTool - Potential Impacket Lateral Movement Activity
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 10c14723-61c7-4c75-92ca-9af245723ad2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_atexec:\n\
  \  CommandLine|contains|all:\n  - cmd.exe\n  - /C\n  - Windows\\Temp\\\n  - '&1'\n\
  \  ParentCommandLine|contains:\n  - svchost.exe -k netsvcs\n  - taskeng.exe\nselection_other:\n\
  \  CommandLine|contains|all:\n  - cmd.exe\n  - /Q\n  - /c\n  - \\\\\\\\127.0.0.1\\\
  \\\n  - '&1'\n  ParentImage|endswith:\n  - \\wmiprvse.exe\n  - \\mmc.exe\n  - \\\
  explorer.exe\n  - \\services.exe\n"
explanation: Detects wmiexec/dcomexec/atexec/smbexec from Impacket framework
false_positives:
- Unknown
references:
- https://github.com/SecureAuthCorp/impacket/blob/8b1a99f7c715702eafe3f24851817bb64721b156/examples/wmiexec.py
- https://github.com/SecureAuthCorp/impacket/blob/8b1a99f7c715702eafe3f24851817bb64721b156/examples/atexec.py
- https://github.com/SecureAuthCorp/impacket/blob/8b1a99f7c715702eafe3f24851817bb64721b156/examples/smbexec.py
- https://github.com/SecureAuthCorp/impacket/blob/8b1a99f7c715702eafe3f24851817bb64721b156/examples/dcomexec.py
- https://www.elastic.co/guide/en/security/current/suspicious-cmd-execution-via-wmi.html
tags:
- attack.execution
- attack.t1047
- attack.lateral-movement
- attack.t1021.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_other:
    ParentImage|endswith:
    - \wmiprvse.exe
    - \mmc.exe
    - \explorer.exe
    - \services.exe
    CommandLine|contains|all:
    - cmd.exe
    - /Q
    - /c
    - \\\\127.0.0.1\\
    - '&1'
  selection_atexec:
    ParentCommandLine|contains:
    - svchost.exe -k netsvcs
    - taskeng.exe
    CommandLine|contains|all:
    - cmd.exe
    - /C
    - Windows\Temp\
    - '&1'
  condition: 1 of selection_*
