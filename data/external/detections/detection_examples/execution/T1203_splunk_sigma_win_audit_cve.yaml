level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  EventID: 1\n  Provider_Name:\n  - Microsoft-Windows-Audit-CVE\n  - Audit-CVE\n"
explanation: 'Detects events generated by user-mode applications when they call the
  CveEventWrite API when a known vulnerability is trying to be exploited.

  MS started using this log in Jan. 2020 with CVE-2020-0601 (a Windows CryptoAPI vulnerability.

  Unfortunately, that is about the only instance of CVEs being written to this log.

  '
