technique_id: T1059.001
technique_name: Nishang PowershellTCPOneLine
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_powershell` (Processes.process=*Net.Sockets.TCPClient*
  AND Processes.process=*System.Text.ASCIIEncoding*) by Processes.action Processes.dest
  Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`|
  `nishang_powershelltcponeline_filter`'
explanation: The following analytic detects the use of the Nishang Invoke-PowerShellTCPOneLine
  utility, which initiates a callback to a remote Command and Control (C2) server.
  It leverages Endpoint Detection and Response (EDR) data, focusing on PowerShell
  processes that include specific .NET classes like Net.Sockets.TCPClient and System.Text.ASCIIEncoding.
  This activity is significant as it indicates potential remote control or data exfiltration
  attempts by an attacker. If confirmed malicious, this could lead to unauthorized
  remote access, data theft, or further compromise of the affected system.
