technique_id: T1059.005
technique_name: Execute Javascript With Jscript COM CLSID
tactic: execution
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name = "cscript.exe"
  Processes.process="*-e:{F414C262-6AC0-11CF-B6D1-00AA00BBBB58}*" by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `execute_javascript_with_jscript_com_clsid_filter`'
explanation: The following analytic detects the execution of JavaScript using the
  JScript.Encode CLSID (COM Object) by cscript.exe. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on process names, command-line executions,
  and parent processes. This activity is significant as it is a known technique used
  by ransomware, such as Reddot, to execute malicious scripts and potentially disable
  AMSI (Antimalware Scan Interface). If confirmed malicious, this behavior could allow
  attackers to execute arbitrary code, evade detection, and maintain persistence within
  the environment.
