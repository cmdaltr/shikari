technique_id: T1059
technique_name: Suspicious Automator Workflows Execution
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id, process.entity_id with maxspan=15s\n [process where host.os.type\
  \ == \"macos\" and event.type in (\"start\", \"process_started\") and process.name\
  \ == \"Automator\"]\n [network where host.os.type == \"macos\"]"
explanation: 'Identifies the execution of the Automator Workflows process followed
  by a network connection from it''s XPC service.

  Adversaries may drop a custom workflow template that hosts malicious JavaScript
  for Automation (JXA) code as an

  alternative to using osascript.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5d9f8cfc-0d03-443e-a167-2b0597ce0965.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate Automator workflows: Users may have legitimate workflows that trigger
    network connections, such as automated data uploads or API calls. To handle these,
    identify and document known safe workflows and create exceptions for them in the
    detection rule.

    - Frequent developer activity: Developers using Automator for testing or development
    purposes might frequently trigger this rule. Consider excluding specific user
    accounts or development environments from the rul'
  mitigation: Review investigation guide for details
references:
- https://posts.specterops.io/persistent-jxa-66e1c3cd1cf5
has_investigation_guide: true
risk_score: 47
