technique_id: T1114.002
technique_name: O365 OAuth App Mailbox Access via EWS
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=Exchange Operation=MailItemsAccessed AppId=*
  ClientAppId=* | regex ClientInfoString="^Client=WebServices;ExchangeWebServices"
  | fillnull | stats count earliest(_time) as firstTime latest(_time) as lastTime
  values(ClientIPAddress) as src by user ClientAppId OperationCount AppId vendor_account
  vendor_product dest signature ClientInfoString | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `o365_oauth_app_mailbox_access_via_ews_filter`'
explanation: The following analytic detects when emails are accessed in Office 365
  Exchange via Exchange Web Services (EWS) using OAuth-authenticated applications.
  It leverages the ClientInfoString field to identify EWS interactions and aggregates
  metrics such as access counts, timing, and client IP addresses, categorized by user,
  ClientAppId, OperationCount, and AppId. Monitoring OAuth applications accessing
  emails through EWS is crucial for identifying potential abuse or unauthorized data
  access. If confirmed malicious, this activity could lead to unauthorized email access,
  data exfiltration, or further compromise of sensitive information.
source: Splunk Security Content
