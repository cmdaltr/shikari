  value: O365 MailItemsAccessed
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: OAuth applications may access mailboxes for legitimate purposes, you
    can use the src_ip to add trusted sources to an allow list.
  mitigation: Review context and user activity
