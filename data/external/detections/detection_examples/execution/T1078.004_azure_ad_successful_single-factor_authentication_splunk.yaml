technique_id: T1078.004
technique_name: Azure AD Successful Single-Factor Authentication
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` category=SignInLogs properties.authenticationRequirement=singleFactorAuthentication
  properties.authenticationDetails{}.succeeded=true | rename properties.* as * | rename
  userAgent as user_agent | fillnull | stats count min(_time) as firstTime max(_time)
  as lastTime by dest user src vendor_account vendor_product user_agent signature
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `azure_ad_successful_single_factor_authentication_filter`'
explanation: The following analytic identifies a successful single-factor authentication
  event against Azure Active Directory. It leverages Azure SignInLogs data, specifically
  focusing on events where single-factor authentication succeeded. This activity is
  significant as it may indicate a misconfiguration, policy violation, or potential
  account takeover attempt. If confirmed malicious, an attacker could gain unauthorized
  access to the account, potentially leading to data breaches, privilege escalation,
  or further exploitation within the environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a560e7f6-1711-4353-885b-40be53101fcd/
indicators:
- type: data_source
  value: Azure Active Directory
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Although not recommended, certain users may be required without multi-factor
    authentication. Filter as needed
  mitigation: Review context and user activity
