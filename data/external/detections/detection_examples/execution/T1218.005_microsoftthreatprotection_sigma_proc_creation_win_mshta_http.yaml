technique_id: T1218.005
technique_name: Remotely Hosted HTA File Executed Via Mshta.EXE
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: b98d0db6-511d-45de-ad02-e82a98729620
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - http://\n  - https://\n  - ftp://\n\
  selection_img:\n- Image|endswith: \\mshta.exe\n- OriginalFileName: MSHTA.EXE\n"
explanation: Detects execution of the "mshta" utility with an argument containing
  the "http" keyword, which could indicate that an attacker is executing a remotely
  hosted malicious hta file
false_positives:
- Unknown
references:
- https://www.trendmicro.com/en_us/research/22/e/avoslocker-ransomware-variant-abuses-driver-file-to-disable-anti-Virus-scans-log4shell.html
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \mshta.exe
  - OriginalFileName: MSHTA.EXE
  selection_cli:
    CommandLine|contains:
    - http://
    - https://
    - ftp://
  condition: all of selection_*
