technique_id: T1562
technique_name: M365 Copilot Non Compliant Devices Accessing M365 Copilot
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`m365_copilot_graph_api` (appDisplayName="*Copilot*" OR appDisplayName="M365ChatClient")
  deviceDetail.isCompliant=false OR deviceDetail.isManaged=false | eval user = userPrincipalName
  | stats count as events, dc(ipAddress) as unique_ips, values(ipAddress) as ip_addresses,
  dc(location.city) as unique_cities, values(location.city) as cities, dc(location.countryOrRegion)
  as unique_countries, values(location.countryOrRegion) as countries, values(deviceDetail.isCompliant)
  as compliance_status, values(deviceDetail.isManaged) as management_status, min(_time)
  as first_seen, max(_time) as last_seen by user, deviceDetail.operatingSystem, deviceDetail.browser
  | eval days_active = round((last_seen - first_seen)/86400, 1) | eval first_seen
  = strftime(first_seen, "%Y-%m-%d %H:%M:%S") | eval last_seen = strftime(last_seen,
  "%Y-%m-%d %H:%M:%S") | sort -events, -unique_countries | `m365_copilot_non_compliant_devices_accessing_m365_copilot_filter`'
explanation: Detects M365 Copilot access from non-compliant or unmanaged devices that
  violate corporate security policies, indicating potential shadow IT usage, BYOD
  policy violations, or compromised endpoint access. The detection filters M365 Copilot
  Graph API events where deviceDetail.isCompliant=false or deviceDetail.isManaged=false,
  then aggregates by user, operating system, and browser to calculate metrics including
  event counts, unique IPs and locations, and compliance/management status over time.
  Users accessing Copilot from non-compliant or unmanaged devices are flagged and
  sorted by activity volume and geographic spread, enabling security teams to identify
  unauthorized endpoints that may lack proper security controls, encryption, or MDM
  enrollment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/e26bc52d-9cbc-4743-9745-e8781d935042/
indicators:
- type: data_source
  value: M365 Copilot Graph API
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate employees using personal devices during emergencies, new
    hires awaiting device provisioning, temporary workers with unmanaged equipment,
    or users accessing Copilot from approved but temporarily non-compliant devices
    may trigger false positives.
  mitigation: Review context and user activity
