technique_id: T1059
technique_name: Network Connection via Recently Compiled Executable
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id with maxspan=1m\n  [process where host.os.type == \"linux\"\
  \ and event.type == \"start\" and event.action == \"exec\" and\n   process.name\
  \ in (\"gcc\", \"g++\", \"cc\")] by process.args\n  [file where host.os.type ==\
  \ \"linux\" and event.action == \"creation\" and process.name == \"ld\"] by file.name\n\
  \  [process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ == \"exec\"] by process.name\n  [network where host.os.type == \"linux\" and event.action\
  \ == \"connection_attempted\" and destination.ip != null and not (\n     cidrmatch(destination.ip,\
  \ \"127.0.0.0/8\", \"169.254.0.0/16\", \"224.0.0.0/4\", \"::1\") or\n     process.name\
  \ in (\"simpleX\", \"conftest\", \"ssh\", \"python\", \"ispnull\", \"pvtui\", \"\
  npreal2d\", \"ruby\", \"source\", \"ssh\")\n   )] by process.name"
explanation: 'This rule monitors a sequence involving a program compilation event
  followed by its execution and a subsequent network

  connection event. This behavior can indicate the set up of a reverse tcp connection
  to a command-and-control server.

  Attackers may spawn reverse shells to establish persistence onto a target system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/64cfca9e-0f6f-4048-8251-9ec56a055e9e.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Development activities involving frequent compilation and execution of new code
    can trigger false positives. To manage this, exclude specific user accounts or
    directories commonly used for legitimate development work.

    - Automated build systems or continuous integration pipelines may compile and
    execute code regularly. Identify and exclude these processes or IP addresses from
    monitoring to prevent false alerts.

    - Legitimate software updates or installations that involve'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
