false_positives:
- description: False positives may occur if legitimate processes are writing to world-writable
    directories. It is recommended to investigate the context of the file write operation
    to determine if it is malicious or not. Modify the search to include additional
    known good paths for `mshta.exe` to reduce false positives.
  mitigation: Review context and user activity
