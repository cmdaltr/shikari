false_positives:
- description: 'Some software installers or automation scripts may extract and run
    scripts from archive files in temporary directories.

    However, it is uncommon for such scripts to initiate outbound network connections
    immediately upon extraction.

    This behavior should be considered suspicious and investigated, especially in
    environments where such scripting is not typical.'
  mitigation: Review context and user activity
