technique_id: T1574.001
technique_name: Windows DLL Search Order Hijacking with iscsicpl
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.parent_process_name=iscsicpl.exe
  `windows_shells` by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`| `windows_dll_search_order_hijacking_with_iscsicpl_filter`'
explanation: The following analytic detects DLL search order hijacking involving iscsicpl.exe.
  It identifies when iscsicpl.exe loads a malicious DLL from a new path, triggering
  the payload execution. This detection leverages data from Endpoint Detection and
  Response (EDR) agents, focusing on child processes spawned by iscsicpl.exe. This
  activity is significant as it indicates a potential attempt to execute unauthorized
  code via DLL hijacking. If confirmed malicious, this could allow an attacker to
  execute arbitrary code, escalate privileges, or maintain persistence within the
  environment.
