technique_id: T1222
technique_name: Icacls Deny Command
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "| tstats `security_content_summariesonly` min(_time) as firstTime max(_time)\n\
  as lastTime from datamodel=Endpoint.Processes where \nProcesses.process_name IN\
  \ ( \"icacls.exe\", \"cacls.exe\", \"xcacls.exe\") AND \nProcesses.process IN (\"\
  */deny*\", \"*/d:*\", \"*/d \") \nby Processes.action Processes.dest Processes.original_file_name\
  \ Processes.parent_process \nProcesses.parent_process_exec Processes.parent_process_guid\
  \ Processes.parent_process_id \nProcesses.parent_process_name Processes.parent_process_path\
  \ Processes.process Processes.process_exec \nProcesses.process_guid Processes.process_hash\
  \ Processes.process_id Processes.process_integrity_level \nProcesses.process_name\
  \ Processes.process_path Processes.user Processes.user_id Processes.vendor_product\n\
  | `drop_dm_object_name(Processes)` \n| `security_content_ctime(firstTime)` \n| `security_content_ctime(lastTime)`\n\
  | `icacls_deny_command_filter`"
explanation: 'The following analytic detects instances where an adversary modifies

  security permissions of a file or directory using commands like "icacls.exe", "cacls.exe",

  or "xcacls.exe" with deny options. It leverages data from Endpoint Detection and

  Response (EDR) agents, focusing on process names and command-line executions. This

  activity is significant as it is commonly used by Advanced Persistent Threats (APTs)

  and coinminer scripts to evade detection and impede access to critical files. If

  confirmed malicious, this could allow attackers to maintain persistence and hinder

  incident response efforts.'
