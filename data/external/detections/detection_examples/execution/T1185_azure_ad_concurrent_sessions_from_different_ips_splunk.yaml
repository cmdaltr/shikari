technique_id: T1185
technique_name: Azure AD Concurrent Sessions From Different Ips
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` properties.authenticationDetails{}.succeeded=true category=NonInteractiveUserSignInLogs
  action=success | rename properties.* as * | bucket span=5m _time | rename userAgent
  as user_agent | fillnull | stats count min(_time) as firstTime max(_time) as lastTime
  dc(src) as unique_ips values(dest) as dest values(src) as src values(user_agent)
  as user_agent by user _time vendor_account vendor_product category | where unique_ips
  > 1 | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` |
  `azure_ad_concurrent_sessions_from_different_ips_filter`'
explanation: The following analytic detects an Azure AD account with concurrent sessions
  originating from multiple unique IP addresses within a 5-minute window. It leverages
  Azure Active Directory NonInteractiveUserSignInLogs to identify this behavior by
  analyzing successful authentication events and counting distinct source IPs. This
  activity is significant as it may indicate session hijacking, where an attacker
  uses stolen session cookies to access corporate resources from a different location.
  If confirmed malicious, this could lead to unauthorized access to sensitive information
  and potential data breaches.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a9126f73-9a9b-493d-96ec-0dd06695490d/
indicators:
- type: data_source
  value: Azure Active Directory
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: A user with concurrent sessions from different Ips may also represent
    the legitimate use of more than one device. Filter as needed and/or customize
    the threshold to fit your environment. Also consider the geographic location of
    the IP addresses and filter out IP space that belong to your organization.
  mitigation: Review context and user activity
