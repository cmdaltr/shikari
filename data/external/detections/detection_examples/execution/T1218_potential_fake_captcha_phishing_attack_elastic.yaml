technique_id: T1218
technique_name: Potential Fake CAPTCHA Phishing Attack
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.name : (\"powershell.exe\", \"cmd.exe\", \"mshta.exe\") and process.parent.name\
  \ : \"explorer.exe\" and\n process.command_line : (\"*recaptcha *\", \"*CAPTCHA\
  \ Verif*\", \"*complete verification*\", \"*Verification ID*\", \"*Verification\
  \ Code*\", \"*Verification UID*\",\n                         \"*hυmаn vаlіdаtiοn*\"\
  , \"*human ID*\", \"*Action Identificator*\", \"*not a robot*\", \"*Click OK to*\"\
  , \"*anti-robot test*\",\n                         \"*Cloudflare ID*\")"
explanation: 'Identifies potential fake CAPTCHA phishing attack based on PowerShell
  or Cmd argument values. Adversaries employ this

  technique via compromised websites with browser injects, posing either as fake CAPTCHAs
  to access the site or as a page

  loading error requiring a fix to display the page. The victim is instructed to copy
  and past a malicious command to

  the Windows Run dialog box.'
source: Elastic Detection Rules
