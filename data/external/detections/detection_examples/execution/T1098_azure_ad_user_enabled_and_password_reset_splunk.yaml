technique_id: T1098
technique_name: Azure AD User Enabled And Password Reset
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` (operationName="Enable account" OR operationName="Reset
  password (by admin)" OR operationName="Update user") | transaction user startsWith=(operationName="Enable
  account") endsWith=(operationName="Reset password (by admin)") maxspan=2m | rename
  properties.* as * | rename initiatedBy.user.userPrincipalName as initiatedBy | fillnull
  | stats count min(_time) as firstTime max(_time) as lastTime by dest user src vendor_account
  vendor_product initiatedBy signature | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `azure_ad_user_enabled_and_password_reset_filter`'
explanation: The following analytic detects an Azure AD user enabling a previously
  disabled account and resetting its password within 2 minutes. It uses Azure Active
  Directory events to identify this sequence of actions. This activity is significant
  because it may indicate an adversary with administrative access attempting to establish
  a backdoor identity within the Azure AD tenant. If confirmed malicious, this could
  allow the attacker to maintain persistent access, escalate privileges, and potentially
  exfiltrate sensitive information from the environment.
source: Splunk Security Content
