technique_id: T1059.009
technique_name: AWS IAM S3Browser Templated S3 Bucket Policy Creation
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: db014773-7375-4f4e-b83b-133337c0ffee
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  eventName: PutUserPolicy\n  eventSource: iam.amazonaws.com\n  requestParameters|contains|all:\n\
  \  - '\"arn:aws:s3:::<YOUR-BUCKET-NAME>/*\"'\n  - '\"s3:GetObject\"'\n  - '\"Allow\"\
  '\n  userAgent|contains: S3 Browser\n"
explanation: Detects S3 browser utility creating Inline IAM policy containing default
  S3 bucket name placeholder value of "<YOUR-BUCKET-NAME>".
false_positives:
- Valid usage of S3 browser with accidental creation of default Inline IAM policy
  without changing default S3 bucket name placeholder value
references:
- https://permiso.io/blog/s/unmasking-guivil-new-cloud-threat-actor
tags:
- attack.execution
- attack.t1059.009
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.privilege-escalation
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: PutUserPolicy
    userAgent|contains: S3 Browser
    requestParameters|contains|all:
    - '"arn:aws:s3:::<YOUR-BUCKET-NAME>/*"'
    - '"s3:GetObject"'
    - '"Allow"'
  condition: selection
