technique_id: T1203
technique_name: Cupsd or Foomatic-rip Shell Execution
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\") and\
  \ process.parent.name == \"foomatic-rip\" and\n  process.name in (\"bash\", \"dash\"\
  , \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\") and not (\n    process.command_line\
  \ like (\n      \"*/tmp/foomatic-*\", \"*-sDEVICE=ps2write*\", \"*printf*\", \"\
  /bin/sh -e -c cat\", \"/bin/bash -c cat\",\n      \"/bin/bash -e -c cat\"\n    )\
  \ or\n    process.args like \"gs*\"\n  )"
explanation: 'This detection rule addresses multiple vulnerabilities in the CUPS printing
  system, including CVE-2024-47176,

  CVE-2024-47076, CVE-2024-47175, and CVE-2024-47177. Specifically, this rule detects
  shell executions from the

  foomatic-rip parent process. These flaws impact components like cups-browsed, libcupsfilters,
  libppd, and foomatic-rip,

  allowing remote unauthenticated attackers to manipulate IPP URLs or inject malicious
  data through crafted UDP packets or

  network spoofing. This can result in arbitrary command execution when a print job
  is initiated.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/476267ff-e44f-476e-99c1-04c78cb3769d.toml
