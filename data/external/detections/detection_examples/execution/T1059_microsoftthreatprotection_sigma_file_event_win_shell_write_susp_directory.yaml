query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_1:\n\
  \  Image|endswith:\n  - \\bash.exe\n  - \\cmd.exe\n  - \\cscript.exe\n  - \\msbuild.exe\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n  - \\sh.exe\n  - \\wscript.exe\n  TargetFilename|startswith:\n\
  \  - C:\\PerfLogs\\\n  - C:\\Users\\Public\\\nselection_2:\n  Image|endswith:\n\
  \  - \\certutil.exe\n  - \\forfiles.exe\n  - \\mshta.exe\n  - \\schtasks.exe\n \
  \ - \\scriptrunner.exe\n  - \\wmic.exe\n  TargetFilename|contains:\n  - C:\\PerfLogs\\\
  \n  - C:\\Users\\Public\\\n  - C:\\Windows\\Temp\\\n"
explanation: Detects Windows shells and scripting applications that write files to
  suspicious folders
false_positives:
- Unknown
