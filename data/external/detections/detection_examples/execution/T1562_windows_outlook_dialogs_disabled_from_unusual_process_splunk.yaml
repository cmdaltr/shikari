  value: dest
  confidence: high
false_positives:
- description: It is unusual for processes other than Outlook to modify this feature
    on a Windows system since it is a default Outlook functionality. Although no false
    positives have been identified, use the provided filter macro to tune the search.
  mitigation: Review context and user activity
