technique_id: T1562.003
technique_name: ESXi Audit Tampering
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`esxi_syslog` Message="*esxcli system auditrecords*" Message IN ("*remote*","*local*")
  NOT Message = "*[shell*" | rex field=_raw "Z (?<dest>[\w\.]+)\s" | rex field=_raw
  "[\w+]\]: (?<full_command>.*)" | rex field=full_command "\[(?<user>.*)]:\s(?<command>.*)"
  | stats min(_time) as firstTime max(_time) as lastTime count by dest user command
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `esxi_audit_tampering_filter`'
explanation: This detection identifies the use of the esxcli system auditrecords commands,
  which can be used to tamper with logging on an ESXi host. This action may indicate
  an attempt to evade detection or hinder forensic analysis by preventing the recording
  of system-level audit events.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/c48a155b-2861-417a-813c-220f5272cf01/
indicators:
- type: data_source
  value: VMWare ESXi Syslog
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Limited false positives in most environments, however tune as needed.
  mitigation: Review context and user activity
references:
- https://detect.fyi/detecting-and-responding-to-esxi-compromise-with-splunk-f33998ce7823
validation:
