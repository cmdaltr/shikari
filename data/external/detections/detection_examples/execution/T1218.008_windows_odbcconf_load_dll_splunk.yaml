technique_id: T1218.008
technique_name: Windows Odbcconf Load DLL
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name=odbcconf.exe
  Processes.process IN ("*/a *",  "*-a*") Processes.process="*regsvr*" by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_odbcconf_load_dll_filter`'
explanation: The following analytic detects the execution of odbcconf.exe with the
  regsvr action to load a DLL. This is identified by monitoring command-line arguments
  in process creation logs from Endpoint Detection and Response (EDR) agents. This
  activity is significant as it may indicate an attempt to execute arbitrary code
  via DLL loading, a common technique used in various attack vectors. If confirmed
  malicious, this could allow an attacker to execute code with the privileges of the
  odbcconf.exe process, potentially leading to system compromise or further lateral
  movement.
