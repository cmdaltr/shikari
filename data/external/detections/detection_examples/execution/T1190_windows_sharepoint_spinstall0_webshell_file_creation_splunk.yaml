technique_id: T1190
technique_name: Windows SharePoint Spinstall0 Webshell File Creation
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Filesystem
  where Filesystem.file_name="spinstall0.aspx" AND (Filesystem.file_path="*\\microsoft
  shared\\Web Server Extensions\\16\\TEMPLATE\\LAYOUTS*" OR Filesystem.file_path="*\\microsoft
  shared\\Web Server Extensions\\15\\TEMPLATE\\LAYOUTS*") by Filesystem.dest Filesystem.user
  Filesystem.file_create_time Filesystem.file_name Filesystem.file_path Filesystem.action
  Filesystem.process_guid Filesystem.process_id Filesystem.vendor_product | `drop_dm_object_name(Filesystem)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_sharepoint_spinstall0_webshell_file_creation_filter`'
explanation: This detection identifies the creation or modification of the "spinstall0.aspx"
  webshell file in Microsoft SharePoint directories. This file is a known indicator
  of compromise associated with the exploitation of CVE-2025-53770 (ToolShell vulnerability).
  Attackers exploit the vulnerability to drop webshells that provide persistent access
  to compromised SharePoint servers, allowing them to execute arbitrary commands,
  access sensitive data, and move laterally within the network.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/7a0dda67-4cc7-4113-b3bd-b3f1489a98bf/
indicators:
- type: data_source
  value: Sysmon EventID 11
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Limited false positives are expected as the spinstall0.aspx file is
    not a legitimate SharePoint component. However, there might be rare cases where
    legitimate files with similar names are created during SharePoint updates or maintenance.
    Verify the process that created the file and the file content to confirm malicious
    intent.
  mitigation: Review context and user activity
references:
- https://research.eye.security/sharepoint-under-siege/
- https://www.cisa.gov/news-events/alerts/2025/07/20/microsoft-releases-guidance-exploitation-sharepoint-vulnerability-cve-2025-53770
- https://msrc.microsoft.com/blog/2025/07/customer-guidance-for-sharepoint-vulnerability-cve-2025-53770/
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1505.003/sharepoint_webshell/sysmon_spinstall0.log
