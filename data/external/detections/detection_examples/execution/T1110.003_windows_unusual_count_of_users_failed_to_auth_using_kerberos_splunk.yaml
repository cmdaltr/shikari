technique_id: T1110.003
technique_name: Windows Unusual Count Of Users Failed To Auth Using Kerberos
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`wineventlog_security` EventCode=4771 TargetUserName!="*$" Status=0x18 | bucket
  span=5m _time | stats dc(TargetUserName) AS unique_accounts values(TargetUserName)
  as user values(dest) as dest by _time, IpAddress | eventstats avg(unique_accounts)
  as comp_avg , stdev(unique_accounts) as comp_std by IpAddress | eval upperBound=(comp_avg+comp_std*3)
  | eval isOutlier=if(unique_accounts > 10 and unique_accounts >= upperBound, 1, 0)
  | search isOutlier=1 | `windows_unusual_count_of_users_failed_to_auth_using_kerberos_filter`'
explanation: The following analytic identifies a source endpoint failing to authenticate
  multiple valid users using the Kerberos protocol, potentially indicating a Password
  Spraying attack. It leverages Event 4771, which is generated when the Key Distribution
  Center fails to issue a Kerberos Ticket Granting Ticket (TGT) due to a wrong password
  (failure code 0x18). This detection uses statistical analysis, specifically the
  3-sigma rule, to identify unusual authentication failures. If confirmed malicious,
  this activity could allow an attacker to gain initial access or elevate privileges
  within an Active Directory environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/bc9cb715-08ba-40c3-9758-6e2b26e455cb/
indicators:
- type: data_source
  value: Windows Event Log Security 4771
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: A host failing to authenticate with multiple valid domain users is
    not a common behavior for legitimate systems. Possible false positive scenarios
    include but are not limited to vulnerability scanners, missconfigured systems
    and multi-user systems like Citrix farms.
  mitigation: Review context and user activity
