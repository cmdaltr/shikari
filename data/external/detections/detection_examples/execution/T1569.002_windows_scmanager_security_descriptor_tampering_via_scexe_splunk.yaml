technique_id: T1569.002
technique_name: Windows ScManager Security Descriptor Tampering Via Sc.EXE
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` values(Processes.process) as process
  min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes
  where (Processes.process_name=sc.exe OR Processes.original_file_name=sc.exe) Processes.process="*sdset
  *" Processes.process="*scmanager*" by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_scmanager_security_descriptor_tampering_via_sc_exe_filter`'
explanation: The following analytic detects changes in the ScManager service security
  descriptor settings. It leverages data from Endpoint Detection and Response (EDR)
  agents, specifically searching for any process execution involving the "sc.exe"
  binary with the "sdset" flag targeting the "scmanager" service. If confirmed malicious,
  this could allow an attacker to escalate their privileges.
