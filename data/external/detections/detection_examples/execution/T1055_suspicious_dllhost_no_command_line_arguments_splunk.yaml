technique_id: T1055
technique_name: Suspicious DLLHost no Command Line Arguments
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count FROM datamodel=Endpoint.Processes
  where `process_dllhost` by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | regex
  process="(?i)(dllhost\.exe.{0,4}$)" | `suspicious_dllhost_no_command_line_arguments_filter`'
explanation: The following analytic detects instances of DLLHost.exe executing without
  command line arguments. This behavior is unusual and often associated with malicious
  activities, such as those performed by Cobalt Strike. The detection leverages data
  from Endpoint Detection and Response (EDR) agents, focusing on process execution
  logs. This activity is significant because DLLHost.exe typically requires arguments
  to function correctly, and its absence may indicate an attempt to evade detection.
  If confirmed malicious, this could lead to unauthorized actions like credential
  dumping or file manipulation, posing a severe threat to the environment.
source: Splunk Security Content
