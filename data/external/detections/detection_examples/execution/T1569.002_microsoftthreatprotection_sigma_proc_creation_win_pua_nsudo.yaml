query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - '-U:S '\n  - '-U:T '\n  - '-U:E '\n\
  \  - '-P:E '\n  - '-M:S '\n  - '-M:H '\n  - '-U=S '\n  - '-U=T '\n  - '-U=E '\n\
  \  - '-P=E '\n  - '-M=S '\n  - '-M=H '\n  - -ShowWindowMode:Hide\nselection_img:\n\
  - Image|endswith:\n  - \\NSudo.exe\n  - \\NSudoLC.exe\n  - \\NSudoLG.exe\n- OriginalFileName:\n\
  \  - NSudo.exe\n  - NSudoLC.exe\n  - NSudoLG.exe\n"
explanation: Detects the use of NSudo tool for command execution
false_positives:
- Legitimate use by administrators
references:
- https://web.archive.org/web/20221019044836/https://nsudo.m2team.org/en-us/
- https://www.winhelponline.com/blog/run-program-as-system-localsystem-account-windows/
