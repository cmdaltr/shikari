technique_id: T1059
technique_name: Potential Reverse Shell via Background Process
tactic: execution
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\") and\n\
  \  process.name in (\"setsid\", \"nohup\") and process.args : \"*/dev/tcp/*0>&1*\"\
  \ and\n  process.parent.name in (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\",\
  \ \"zsh\", \"ksh\", \"fish\")"
explanation: 'Monitors for the execution of background processes with process arguments
  capable of opening a socket in the /dev/tcp

  channel. This may indicate the creation of a backdoor reverse connection, and should
  be investigated further.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/259be2d8-3b1a-4c2c-a0eb-0c8e77f35e39.toml
