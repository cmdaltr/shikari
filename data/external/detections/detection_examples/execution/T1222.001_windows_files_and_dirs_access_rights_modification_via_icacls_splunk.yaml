technique_id: T1222.001
technique_name: Windows Files and Dirs Access Rights Modification Via Icacls
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "| tstats `security_content_summariesonly` min(_time) as firstTime max(_time)\n\
  as lastTime from datamodel=Endpoint.Processes where \nProcesses.process_name IN\
  \ (\"icacls.exe\", \"cacls.exe\",\"xcacls.exe\") AND \nProcesses.process IN (\"\
  *:R*\", \"*:W*\", \"*:F*\", \"*:C*\", \"*:N*\", \"*/P*\", \"*/E*\") \nby Processes.action\
  \ Processes.dest Processes.original_file_name Processes.parent_process\nProcesses.parent_process_exec\
  \ Processes.parent_process_guid Processes.parent_process_id \nProcesses.parent_process_name\
  \ Processes.parent_process_path Processes.process Processes.process_exec\nProcesses.process_guid\
  \ Processes.process_hash Processes.process_id Processes.process_integrity_level\n\
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product\
  \ \n| `drop_dm_object_name(Processes)`\n| `security_content_ctime(firstTime)` \n\
  | `security_content_ctime(lastTime)` \n| `windows_files_and_dirs_access_rights_modification_via_icacls_filter`"
explanation: 'The following analytic identifies the modification of security permissions

  on files or directories using tools like icacls.exe, cacls.exe, or xcacls.exe. It

  leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific

  command-line executions. This activity is significant as it is commonly used by

  Advanced Persistent Threats (APTs) and coinminer scripts to evade detection and

  maintain control over compromised systems. If confirmed malicious, this behavior

  could allow attackers to hinder investigation, impede remediation efforts, and maintain

  persistent access to the compromised environment.'
source: Splunk Security Content
