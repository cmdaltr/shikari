technique_id: T1059
technique_name: Suspicious Invocation of Shell via Rsync
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 297241f3-8108-4b3a-8c15-2dda9f844594
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_expected:\n  CommandLine|contains: ' -e '\nselection:\n\
  \  Image|endswith:\n  - /ash\n  - /bash\n  - /csh\n  - /dash\n  - /ksh\n  - /sh\n\
  \  - /tcsh\n  - /zsh\n  ParentImage|endswith:\n  - /rsync\n  - /rsyncd\n"
explanation: 'Detects the execution of a shell as sub process of "rsync" without the
  expected command line flag "-e" being used, which could be an indication of exploitation
  as described in CVE-2024-12084. This behavior is commonly associated with attempts
  to execute arbitrary commands or escalate privileges, potentially leading to unauthorized
  access or further exploitation.

  '
false_positives:
- Unknown
