technique_id: T1562.008
technique_name: AWS Defense Evasion Stop Logging Cloudtrail
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName = StopLogging eventSource = cloudtrail.amazonaws.com
  userAgent!=console.amazonaws.com errorCode = success | rename user_name as user
  | stats count min(_time) as firstTime max(_time) as lastTime by signature dest user
  user_agent src vendor_account vendor_region vendor_product | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_defense_evasion_stop_logging_cloudtrail_filter`'
explanation: The following analytic detects `StopLogging` events in AWS CloudTrail
  logs. It leverages CloudTrail event data to identify when logging is intentionally
  stopped, excluding console-based actions and focusing on successful attempts. This
  activity is significant because adversaries may stop logging to evade detection
  and operate stealthily within the compromised environment. If confirmed malicious,
  this action could allow attackers to perform further activities without being logged,
  hindering incident response and forensic investigations, and potentially leading
  to unauthorized access or data exfiltration.
source: Splunk Security Content
