technique_id: T1053.005
technique_name: Schtasks Creation Or Modification With SYSTEM Privileges
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 89ca78fd-b37c-4310-b3d3-81a023f83936
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_optional_*\nfilter_optional_avira:\n  CommandLine|contains:\n\
  \  - '/Create /F /RU System /SC WEEKLY /TN AviraSystemSpeedupVerify /TR '\n  - :\\\
  Program Files (x86)\\Avira\\System Speedup\\setup\\avira_speedup_setup.exe\n  -\
  \ /VERIFY /VERYSILENT /NOSTART /NODOTNET /NORESTART\" /RL HIGHEST\nfilter_optional_office:\n\
  \  CommandLine|contains|all:\n  - Subscription Heartbeat\n  - \\HeartbeatConfig.xml\n\
  \  - \\Microsoft Shared\\OFFICE\nfilter_optional_teamviewer:\n  CommandLine|contains|all:\n\
  \  - /TN TVInstallRestore\n  - \\TeamViewer_.exe\n  Image|endswith: \\schtasks.exe\n\
  selection_root:\n  CommandLine|contains:\n  - ' /change '\n  - ' /create '\n  Image|endswith:\
  \ \\schtasks.exe\nselection_run:\n  CommandLine|contains: '/ru '\nselection_user:\n\
  \  CommandLine|contains:\n  - NT AUT\n  - ' SYSTEM '\n"
explanation: Detects the creation or update of a scheduled task to run with "NT AUTHORITY\SYSTEM"
  privileges
false_positives:
- Unknown
references:
- https://www.elastic.co/security-labs/exploring-the-qbot-attack-pattern
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_root:
    Image|endswith: \schtasks.exe
    CommandLine|contains:
    - ' /change '
    - ' /create '
  selection_run:
    CommandLine|contains: '/ru '
  selection_user:
    CommandLine|contains:
    - NT AUT
    - ' SYSTEM '
  filter_optional_teamviewer:
    Image|endswith: \schtasks.exe
    CommandLine|contains|all:
    - /TN TVInstallRestore
    - \TeamViewer_.exe
  filter_optional_office:
    CommandLine|contains|all:
    - Subscription Heartbeat
    - \HeartbeatConfig.xml
    - \Microsoft Shared\OFFICE
  filter_optional_avira:
    CommandLine|contains:
    - '/Create /F /RU System /SC WEEKLY /TN AviraSystemSpeedupVerify /TR '
    - :\Program Files (x86)\Avira\System Speedup\setup\avira_speedup_setup.exe
    - /VERIFY /VERYSILENT /NOSTART /NODOTNET /NORESTART" /RL HIGHEST
  condition: all of selection_* and not 1 of filter_optional_*
