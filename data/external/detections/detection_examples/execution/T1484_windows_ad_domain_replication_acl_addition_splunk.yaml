false_positives:
- description: When there is a change to nTSecurityDescriptor, Windows logs the entire
    ACL with the newly added components. If existing accounts are present with this
    permission, they will raise an alert each time the nTSecurityDescriptor is updated
    unless whitelisted.
  mitigation: Review context and user activity
