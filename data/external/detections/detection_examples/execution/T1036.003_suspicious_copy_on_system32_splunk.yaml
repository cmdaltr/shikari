technique_id: T1036.003
technique_name: Suspicious Copy on System32
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)\n\
  as lastTime from datamodel=Endpoint.Processes where\nProcesses.parent_process_name\
  \ IN (\n  \"cmd.exe\", \n  \"powershell_ise.exe\",\n  \"powershell.exe\", \n  \"\
  pwsh.exe\", \n  \"sqlps.exe\", \n  \"sqltoolsps.exe\"\n)\n`process_copy` \nProcesses.process\
  \ IN (\n  \"* \\\"C:\\\\Windows\\\\System32\\\\*\", \n  \"* \\'C:\\\\Windows\\\\\
  System32\\\\*\", \n  \"* C:\\\\Windows\\\\System32\\\\*\", \n  \"* \\\"C:\\\\Windows\\\
  \\SysWow64\\\\*\",\n  \"* \\'C:\\\\Windows\\\\SysWow64\\\\*\",\n  \"* C:\\\\Windows\\\
  \\SysWow64\\\\*\"\n)\nby Processes.action Processes.dest Processes.original_file_name\n\
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid\n\
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path\n\
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash\n\
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path\n\
  Processes.user Processes.user_id Processes.vendor_product \n| `drop_dm_object_name(Processes)`\n\
  | `security_content_ctime(firstTime)` \n| `security_content_ctime(lastTime)` \n\
  | `suspicious_copy_on_system32_filter`"
explanation: "The following analytic detects potentially suspicious file copy operations\
  \ targeting the\nSystem32 or SysWow64 directories as source, often indicative of\
  \ malicious activity.\nIt leverages data from Endpoint Detection and Response (EDR)\
  \ agents, \nfocusing on activity initiated by command-line tools like cmd.exe or\
  \ PowerShell.\nThis behavior is significant as it may indicate an attempt to evade\
  \ defenses by copying\nan existing binary from the system directory and renaming\
  \ it.\nIf confirmed malicious, this activity could allow an attacker to execute\n\
  code undetected and potentially leading to system compromise or further lateral\
  \ movement\nwithin the network."
