technique_id: T1059.003
technique_name: Suspicious Cmd Execution via WMI
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.name : \"WmiPrvSE.exe\" and process.name : \"cmd.exe\" and process.args\
  \ : \"/c\" and process.args:\"/Q\" and \n process.args : \"2>&1\" and process.args:\
  \ \"1>\"  and \n process.args : (\"C:\\\\windows\\\\temp\\\\*.txt\", \"\\\\Windows\\\
  \\Temp\\\\*\", \"-encodehex\", \"\\\\\\\\127.0.0.1\\\\C$\\\\Windows\\\\Temp\\\\\
  *\", \"\\\\\\\\127.0.0.1\\\\ADMIN$\\\\__*.*\")"
explanation: 'Identifies suspicious command execution (cmd) via Windows Management
  Instrumentation (WMI) on a remote host. This could

  be indicative of adversary lateral movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/12f07955-1674-44f7-86b5-c35da0a6f41a.toml
query_type: eql
query_language: eql
