technique_id: T1055
technique_name: DotNet CLR DLL Loaded By Scripting Applications
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 4508a70e-97ef-4300-b62b-ff27992990ea
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ImageLoaded|endswith:\n  - \\clr.dll\n  - \\mscoree.dll\n  - \\mscorlib.dll\n\
  \  Image|endswith:\n  - \\cmstp.exe\n  - \\cscript.exe\n  - \\mshta.exe\n  - \\\
  msxsl.exe\n  - \\regsvr32.exe\n  - \\wmic.exe\n  - \\wscript.exe\n"
explanation: Detects .NET CLR DLLs being loaded by scripting applications such as
  wscript or cscript. This could be an indication of potential suspicious execution.
false_positives:
- Unknown
