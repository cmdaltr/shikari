technique_id: T1059
technique_name: Suspicious Persistence Via VMwareToolBoxCmd.EXE VM State Change Script
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 236d8e89-ed95-4789-a982-36f4643738ba
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_bin_cli:\n  CommandLine|contains|all:\n  - ' script '\n  - ' set '\nselection_bin_img:\n\
  - Image|endswith: \\VMwareToolBoxCmd.exe\n- OriginalFileName: toolbox-cmd.exe\n\
  selection_susp_paths:\n  CommandLine|contains:\n  - :\\PerfLogs\\\n  - :\\Temp\\\
  \n  - :\\Windows\\System32\\Tasks\\\n  - :\\Windows\\Tasks\\\n  - :\\Windows\\Temp\\\
  \n  - \\AppData\\Local\\Temp\n"
explanation: Detects execution of the "VMwareToolBoxCmd.exe" with the "script" and
  "set" flag to setup a specific script that's located in a potentially suspicious
  location to run for a specific VM state
false_positives:
- Unknown
references:
- https://bohops.com/2021/10/08/analyzing-and-detecting-a-vmtools-persistence-technique/
tags:
- attack.execution
- attack.persistence
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_bin_img:
  - Image|endswith: \VMwareToolBoxCmd.exe
  - OriginalFileName: toolbox-cmd.exe
  selection_bin_cli:
    CommandLine|contains|all:
    - ' script '
    - ' set '
  selection_susp_paths:
    CommandLine|contains:
    - :\PerfLogs\
    - :\Temp\
    - :\Windows\System32\Tasks\
    - :\Windows\Tasks\
    - :\Windows\Temp\
    - \AppData\Local\Temp
  condition: all of selection_*
