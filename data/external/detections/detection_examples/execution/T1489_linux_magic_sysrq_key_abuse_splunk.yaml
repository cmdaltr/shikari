technique_id: T1489
technique_name: Linux Magic SysRq Key Abuse
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`linux_auditd` type=Path name="/proc/sysrq-trigger" OR name="/proc/sys/kernel/sysrq"
  OR name="/etc/sysctl.conf" | rename host as dest | stats count min(_time) as firstTime
  max(_time) as lastTime by dest name | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `linux_magic_sysrq_key_abuse_filter`'
explanation: 'Detects potential abuse of the Linux Magic SysRq (System Request) key
  by adversaries

  with root or sufficient privileges to manipulate or destabilize a system.

  Writing to /proc/sysrq-trigger can crash the system, kill processes, or bypass standard
  logging.

  Monitoring SysRq abuse helps detect stealthy post-exploitation activity.'
source: Splunk Security Content
source_url: https://research.splunk.com/detections/22c03600-f84a-47fa-abaa-ffbe3e72c782/
