technique_id: T1021.001
technique_name: Windows Default Rdp File Unhidden
tactic: execution
platform: Splunk
fidelity_score: 0.85
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name = "attrib.exe"
  Processes.process IN("*-s*", "*-h*") Processes.process = "*default.rdp*" by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_default_rdp_file_unhidden_filter`'
explanation: This detection identifies the use of attrib.exe to remove hidden (-h)
  or system (-s) attributes from the Default.rdp file, which is automatically created
  in a user's Documents folder when a Remote Desktop Protocol (RDP) session is initiated
  using mstsc.exe. The Default.rdp file stores session configuration details such
  as the remote host address and screen settings. Unhiding this file is uncommon in
  normal user behavior and may indicate that an attacker or red team operator is attempting
  to access or manipulate RDP connection history that was previously hidden—either
  by default or as part of an earlier anti-forensics effort. This activity may represent
  part of a broader pattern of reconnaissance or staging for credential reuse, lateral
  movement, or forensic analysis evasion. Monitoring for this behavior can help uncover
  suspicious manipulation of user artifacts and highlight interactive attacker activity
  on a compromised host.
