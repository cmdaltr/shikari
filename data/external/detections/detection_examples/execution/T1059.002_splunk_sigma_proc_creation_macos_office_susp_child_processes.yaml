query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith:\n  - /bash\n  - /curl\n  - /dash\n  - /fish\n  - /osacompile\n\
  \  - /osascript\n  - /sh\n  - /zsh\n  - /python\n  - /python3\n  - /wget\n  ParentImage|contains:\n\
  \  - Microsoft Word\n  - Microsoft Excel\n  - Microsoft PowerPoint\n  - Microsoft\
  \ OneNote\n"
explanation: Detects suspicious child processes spawning from microsoft office suite
  applications such as word or excel. This could indicates malicious macro execution
false_positives:
- Unknown
