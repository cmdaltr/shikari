technique_id: T1059.007
technique_name: Suspicious Execution with NodeJS
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \n(process.name : \"node.exe\" or ?process.pe.original_file_name == \"node.exe\"\
  \ or ?process.code_signature.subject_name : \"OpenJS Foundation\") and\n\n(\n  (process.executable\
  \ : (\"?:\\\\Users\\\\*\\\\AppData\\\\*\\\\node.exe\", \"\\\\Device\\\\HarddiskVolume?\\\
  \\\\\\Users\\\\*\\\\AppData\\\\*\\\\node.exe\") and process.args : \"*.js\") or\n\
  \n  (process.args : \"-r\" and process.parent.name : \"powershell.exe\") or\n\n\
  \   process.command_line : (\"*eval(*\", \"*atob(*\", \"*require*child_process*\"\
  )\n)"
explanation: Identifies suspicious execution patterns using NodeJS interpeter like
  process path and arguments.
source: Elastic Detection Rules
