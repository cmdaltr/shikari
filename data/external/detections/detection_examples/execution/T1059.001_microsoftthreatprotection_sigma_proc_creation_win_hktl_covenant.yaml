  \  - -Sta\n  - -Nop\n  - -Window\n  - Hidden\nselection_2:\n  CommandLine|contains:\n\
  \  - 'sv o (New-Object IO.MemorySteam);sv d '\n  - mshta file.hta\n  - GruntHTTP\n\
  \  - -EncodedCommand cwB2ACAAbwAgA\n"
