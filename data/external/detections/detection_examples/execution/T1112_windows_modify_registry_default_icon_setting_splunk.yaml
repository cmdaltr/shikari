technique_id: T1112
technique_name: Windows Modify Registry Default Icon Setting
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats `security_content_summariesonly` count  min(_time) as firstTime max(_time)
  as lastTime FROM datamodel=Endpoint.Registry where Registry.registry_path ="*\\defaultIcon\\(Default)*"
  Registry.registry_path = "*HKCR\\*" by Registry.action Registry.dest Registry.process_guid
  Registry.process_id Registry.registry_hive Registry.registry_path Registry.registry_key_name
  Registry.registry_value_data Registry.registry_value_name Registry.registry_value_type
  Registry.status Registry.user Registry.vendor_product | `security_content_ctime(lastTime)`
  | `security_content_ctime(firstTime)` | `drop_dm_object_name(Registry)` | `windows_modify_registry_default_icon_setting_filter`'
explanation: The following analytic detects suspicious modifications to the Windows
  registry's default icon settings, a technique associated with Lockbit ransomware.
  It leverages data from the Endpoint Registry data model, focusing on changes to
  registry paths under "*HKCR\\*\\defaultIcon\\(Default)*". This activity is significant
  as it is uncommon for normal users to modify these settings, and such changes can
  indicate ransomware infection or other malware. If confirmed malicious, this could
  lead to system defacement and signal a broader ransomware attack, potentially compromising
  sensitive data and system integrity.
