query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_parent and\
  \ 1 of selection_child_*\nselection_child_processes:\n- OriginalFileName:\n  - bitsadmin.exe\n\
  \  - CertOC.exe\n  - CertUtil.exe\n  - Cmd.Exe\n  - CMSTP.EXE\n  - cscript.exe\n\
  \  - curl.exe\n  - HH.exe\n  - IEExec.exe\n  - InstallUtil.exe\n  - javaw.exe\n\
  \  - Microsoft.Workflow.Compiler.exe\n  - msdt.exe\n  - MSHTA.EXE\n  - msiexec.exe\n\
  \  - Msxsl.exe\n  - odbcconf.exe\n  - pcalua.exe\n  - PowerShell.EXE\n  - RegAsm.exe\n\
  \  - RegSvcs.exe\n  - REGSVR32.exe\n  - RUNDLL32.exe\n  - schtasks.exe\n  - ScriptRunner.exe\n\
  \  - wmic.exe\n  - WorkFolders.exe\n  - wscript.exe\n- Image|endswith:\n  - \\AppVLP.exe\n\
  \  - \\bash.exe\n  - \\bitsadmin.exe\n  - \\certoc.exe\n  - \\certutil.exe\n  -\
  \ \\cmd.exe\n  - \\cmstp.exe\n  - \\control.exe\n  - \\cscript.exe\n  - \\curl.exe\n\
  \  - \\forfiles.exe\n  - \\hh.exe\n  - \\ieexec.exe\n  - \\installutil.exe\n  -\
  \ \\javaw.exe\n  - \\mftrace.exe\n  - \\Microsoft.Workflow.Compiler.exe\n  - \\\
  msbuild.exe\n  - \\msdt.exe\n  - \\mshta.exe\n  - \\msidb.exe\n  - \\msiexec.exe\n\
  \  - \\msxsl.exe\n  - \\odbcconf.exe\n  - \\pcalua.exe\n  - \\powershell.exe\n \
  \ - \\pwsh.exe\n  - \\regasm.exe\n  - \\regsvcs.exe\n  - \\regsvr32.exe\n  - \\\
  rundll32.exe\n  - \\schtasks.exe\n  - \\scrcons.exe\n  - \\scriptrunner.exe\n  -\
  \ \\sh.exe\n  - \\svchost.exe\n  - \\verclsid.exe\n  - \\wmic.exe\n  - \\workfolders.exe\n\
  \  - \\wscript.exe\nselection_child_susp_paths:\n  Image|contains:\n  - \\AppData\\\
  \n  - \\Users\\Public\\\n  - \\ProgramData\\\n  - \\Windows\\Tasks\\\n  - \\Windows\\\
  Temp\\\n  - \\Windows\\System32\\Tasks\\\nselection_parent:\n  ParentImage|endswith:\n\
  \  - \\EQNEDT32.EXE\n  - \\EXCEL.EXE\n  - \\MSACCESS.EXE\n  - \\MSPUB.exe\n  - \\\
  ONENOTE.EXE\n  - \\POWERPNT.exe\n  - \\VISIO.exe\n  - \\WINWORD.EXE\n  - \\wordpad.exe\n\
  \  - \\wordview.exe\n"
explanation: Detects a suspicious process spawning from one of the Microsoft Office
  suite products (Word, Excel, PowerPoint, Publisher, Visio, etc.)
false_positives:
- Unknown
