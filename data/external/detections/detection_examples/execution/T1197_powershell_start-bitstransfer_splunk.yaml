technique_id: T1197
technique_name: PowerShell Start-BitsTransfer
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_powershell` Processes.process=*start-bitstransfer*
  by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `powershell_start_bitstransfer_filter`'
explanation: The following analytic detects the execution of the PowerShell command
  `Start-BitsTransfer`, which can be used for file transfers, including potential
  data exfiltration. It leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on process creation events and command-line arguments. This activity
  is significant because `Start-BitsTransfer` can be abused by adversaries to upload
  sensitive files to remote locations, posing a risk of data loss. If confirmed malicious,
  this could lead to unauthorized data exfiltration, compromising sensitive information
  and potentially leading to further exploitation of the network.
