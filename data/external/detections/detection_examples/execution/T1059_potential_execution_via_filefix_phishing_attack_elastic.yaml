technique_id: T1059
technique_name: Potential Execution via FileFix Phishing Attack
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.args == \"--message-loop-type-ui\" and process.parent.args == \"\
  --service-sandbox-type=none\" and\n (\n  process.name : (\"pwsh.exe\", \"powershell.exe\"\
  , \"curl.exe\", \"msiexec.exe\", \"mshta.exe\", \"wscript.exe\", \"cscript.exe\"\
  , \"rundll32.exe\", \"certutil.exe\", \"certreq.exe\") or\n  process.executable\
  \ : \"?:\\\\Users\\\\*\\\\Downloads\\\\*\"\n  ) and\nnot (process.name : \"rundll32.exe\"\
  \ and process.args : (\"ndfapi.dll,NdfRunDllDiagnoseWithAnswerFile\", \"shwebsvc.dll,AddNetPlaceRunDll\"\
  ))"
explanation: 'Identifies the execution of Windows commands or downloaded files via
  the browser''s dialog box. Adversaries may use phishing

  to instruct the victim to copy and paste malicious commands for execution via crafted
  phsihing web pages.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7dc45430-7407-4790-b89e-c857c3f6bf23.toml
