technique_id: T1021.004
technique_name: ESXi SSH Enabled
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`esxi_syslog` Message="*SSH access has been enabled" | rex field=_raw "Z (?<dest>[\w\.]+)\s"
  | stats min(_time) as firstTime max(_time) as lastTime count by dest Message | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `esxi_ssh_enabled_filter`'
explanation: This detection identifies SSH being enabled on ESXi hosts, which can
  be an early indicator of malicious activity. Threat actors often use SSH to gain
  persistent remote access after compromising credentials or exploiting vulnerabilities.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/b8003567-c5b6-445b-8966-ecdacc81c24d/
indicators:
- type: data_source
  value: VMWare ESXi Syslog
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Limited false positives in most environments, however tune as needed.
    Some Administrators may use SSH for troubleshooting.
  mitigation: Review context and user activity
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021.004/esxi_ssh_enabled/esxi_ssh_enabled.log
