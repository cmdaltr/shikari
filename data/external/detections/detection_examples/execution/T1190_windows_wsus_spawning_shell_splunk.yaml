false_positives:
- description: Legitimate WSUS maintenance scripts or administrative tools may spawn
    shells in rare cases. However, wsusservice.exe spawning interactive shells is
    highly abnormal behavior. Review the command line arguments and user context to
    determine legitimacy. Filter known administrative scripts if needed.
  mitigation: Review context and user activity
