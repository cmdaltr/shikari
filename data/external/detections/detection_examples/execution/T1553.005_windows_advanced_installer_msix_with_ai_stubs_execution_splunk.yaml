false_positives:
- description: Legitimate applications packaged with Advanced Installer using the
    Package Support Framework may trigger this detection. Verify if the MSIX package
    is from a trusted source and signed by a trusted publisher before taking action.
    Organizations that use Advanced Installer for legitimate software packaging may
    see false positives.
  mitigation: Review context and user activity
