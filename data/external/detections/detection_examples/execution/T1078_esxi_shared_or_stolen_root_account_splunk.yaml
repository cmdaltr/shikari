technique_id: T1078
technique_name: ESXi Shared or Stolen Root Account
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`esxi_syslog` Message="*root*" Message="*logged in*" NOT Message="*root@127.0.0.1*"
  | rex field=_raw "root@(?<SrcIpAddr>\d{1,3}(?:\.\d{1,3}){3})" | rex field=_raw "Z
  (?<dest>[\w\.]+)\s" | bin _time span=15m | stats min(_time) as firstTime max(_time)
  as lastTime dc(SrcIpAddr) AS distinct_ip_count values(SrcIpAddr) AS SrcIps by dest
  | where distinct_ip_count > 1 | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `esxi_shared_or_stolen_root_account_filter`'
explanation: This detection monitors for signs of a shared or potentially compromised
  root account on ESXi hosts by tracking the number of unique IP addresses logging
  in as root within a short time window. Multiple logins from different IPs in a brief
  period may indicate credential misuse, lateral movement, or account compromise.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/1bc8f235-5d7c-457c-95ca-5e92edcb52ea/
indicators:
- type: data_source
  value: VMWare ESXi Syslog
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Limited false positives in most environments, however tune as needed
  mitigation: Review context and user activity
