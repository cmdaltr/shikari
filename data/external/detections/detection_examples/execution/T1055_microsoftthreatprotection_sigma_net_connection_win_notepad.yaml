technique_id: T1055
technique_name: Network Connection Initiated Via Notepad.EXE
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: e81528db-fc02-45e8-8e98-4e84aba1f10b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_optional_*\nfilter_optional_printing:\n  DestinationPort: 9100\nselection:\n\
  \  Image|endswith: \\notepad.exe\n"
explanation: 'Detects a network connection that is initiated by the "notepad.exe"
  process.

  This might be a sign of process injection from a beacon process or something similar.

  Notepad rarely initiates a network communication except when printing documents
  for example.

  '
false_positives:
- Printing documents via notepad might cause communication with the printer via port
  9100 or similar.
references:
- https://web.archive.org/web/20200219102749/https://www.sans.org/cyber-security-summit/archives/file/summit-archive-1492186586.pdf
- https://www.cobaltstrike.com/blog/why-is-notepad-exe-connecting-to-the-internet
