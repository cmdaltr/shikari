technique_id: T1562.001
technique_name: Windows Cisco Secure Endpoint Stop Immunet Service Via Sfc
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name="sfc.exe"
  Processes.process="* -k*" AND NOT Processes.process_path IN ("*:\\Windows\\System32\\*",
  "*:\\Windows\\SysWOW64\\*", ":\\Windows\\WinSxS\\*") by Processes.action Processes.dest
  Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_cisco_secure_endpoint_stop_immunet_service_via_sfc_filter`'
explanation: The following analytic detects the use of the `sfc.exe` utility, in order
  to stop the Immunet Protect service. The Sfc.exe utility is part of Cisco Secure
  Endpoint installation. This detection leverages telemetry from the endpoint, focusing
  on command-line executions involving the `-k` parameter. This activity is significant
  as it indicates potential tampering with defensive mechanisms. If confirmed malicious,
  attackers could partially blind the EDR, enabling further compromise and lateral
  movement within the network.
