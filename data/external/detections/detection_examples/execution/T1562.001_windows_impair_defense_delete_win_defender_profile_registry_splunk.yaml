  value: Sysmon EventID 13
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: It is unusual to turn this feature off a Windows system since it is
    a default security control, although it is not rare for some policies to disable
    it. Although no false positives have been identified, use the provided filter
    macro to tune the search.
  mitigation: Review context and user activity
