technique_id: T1558.004
technique_name: Kerberos Pre-Authentication Flag Disabled in UserAccountControl
tactic: execution
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '`wineventlog_security` EventCode=4738 MSADChangedAttributes="*\''Don\''t Require
  Preauth\'' - Enabled*" |rename Account_Name as user | table EventCode, user, dest,
  Security_ID, MSADChangedAttributes | `kerberos_pre_authentication_flag_disabled_in_useraccountcontrol_filter`'
explanation: The following analytic detects when the Kerberos Pre-Authentication flag
  is disabled in a user account, using Windows Security Event 4738. This event indicates
  a change in the UserAccountControl property of a domain user object. Disabling this
  flag allows adversaries to perform offline brute force attacks on the user's password
  using the AS-REP Roasting technique. This activity is significant as it can be used
  by attackers with existing privileges to escalate their access or maintain persistence.
  If confirmed malicious, this could lead to unauthorized access and potential compromise
  of sensitive information.
