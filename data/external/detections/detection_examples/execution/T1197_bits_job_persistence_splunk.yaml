technique_id: T1197
technique_name: BITS Job Persistence
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_bitsadmin` Processes.process
  IN (*create*, *addfile*, *setnotifyflags*, *setnotifycmdline*, *setminretrydelay*,
  *setcustomheaders*, *resume* ) by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `bits_job_persistence_filter`'
explanation: The following analytic detects the use of `bitsadmin.exe` to schedule
  a BITS job for persistence on an endpoint. It leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on specific command-line parameters such as
  `create`, `addfile`, and `resume`. This activity is significant because BITS jobs
  can be used by attackers to maintain persistence, download malicious payloads, or
  exfiltrate data. If confirmed malicious, this could allow an attacker to persist
  in the environment, execute arbitrary code, or transfer sensitive information, necessitating
  further investigation and potential remediation.
