technique_id: T1003.001
technique_name: Dump LSASS via procdump
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "| tstats `security_content_summariesonly` \n  count min(_time) as firstTime\
  \ \n        max(_time) as lastTime\n        \nfrom datamodel=Endpoint.Processes\
  \ where \n\n`process_procdump`\nProcesses.process IN (*-ma*, *-mm*, \"*-mp*\", */ma*,\
  \ */mm*, \"*/mp*\")\nProcesses.process IN (* ls*, \"* keyiso*\", \"* samss*\")\n\
  \nby Processes.action Processes.dest Processes.original_file_name Processes.parent_process\
  \ \n   Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id\n\
  \   Processes.parent_process_name Processes.parent_process_path Processes.process\
  \ Processes.process_exec\n   Processes.process_guid Processes.process_hash Processes.process_id\
  \ Processes.process_integrity_level\n   Processes.process_name Processes.process_path\
  \ Processes.user Processes.user_id Processes.vendor_product\n\n| `drop_dm_object_name(Processes)`\n\
  | `security_content_ctime(firstTime)`\n| `security_content_ctime(lastTime)`\n| `dump_lsass_via_procdump_filter`"
explanation: 'The following analytic detects the use of procdump.exe to dump the LSASS

  process, specifically looking for the -mm and -ma command-line arguments. It leverages

  data from Endpoint Detection and Response (EDR) agents, focusing on process names,

  command-line executions, and parent processes. This activity is significant because

  dumping LSASS can expose sensitive credentials, posing a severe security risk. If

  confirmed malicious, an attacker could obtain credentials, escalate privileges,

  and move laterally within the network, leading to potential data breaches and further

  compromise of the environment.'
