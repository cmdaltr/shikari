technique_id: T1110.003
technique_name: Windows Multiple Users Fail To Authenticate Wth ExplicitCredentials
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`wineventlog_security` EventCode=4648 Caller_User_Name!=*$ Target_User_Name!=*$
  | bucket span=5m _time | stats dc(Target_User_Name) AS unique_accounts values(Target_User_Name)
  as tried_account values(dest) as dest values(src_ip) as src_ip values(user) as user
  by _time, Computer, Caller_User_Name | where unique_accounts > 30 | `windows_multiple_users_fail_to_authenticate_wth_explicitcredentials_filter`'
explanation: The following analytic identifies a source user failing to authenticate
  with 30 unique users using explicit credentials on a host. It leverages Windows
  Event 4648, which is generated when a process attempts an account logon by explicitly
  specifying account credentials. This detection is significant as it may indicate
  a Password Spraying attack, where an adversary attempts to gain initial access or
  elevate privileges within an Active Directory environment. If confirmed malicious,
  this activity could lead to unauthorized access, privilege escalation, and potential
  compromise of sensitive information.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/e61918fa-9ca4-11eb-836c-acde48001122/
indicators:
- type: data_source
  value: Windows Event Log Security 4648
  confidence: high
- type: risk_system
  value: Computer
  confidence: high
false_positives:
- description: A source user failing attempting to authenticate multiple users on
    a host is not a common behavior for regular systems. Some applications, however,
    may exhibit this behavior in which case sets of users hosts can be added to an
    allow list. Possible false positive scenarios include systems where several users
    connect to like Mail servers, identity providers, remote desktop services, Citrix,
    etc.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1110/003/
- https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4648
- https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/basic-audit-logon-events
validation:
