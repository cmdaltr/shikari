technique_id: T1547.006
technique_name: Linux Install Kernel Module Using Modprobe Utility
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name IN("kmod",
  "sudo") AND Processes.process = *modprobe* by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `linux_install_kernel_module_using_modprobe_utility_filter`'
explanation: The following analytic detects the installation of a Linux kernel module
  using the modprobe utility. It leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on process names and command-line executions. This activity
  is significant because installing a kernel module can indicate an attempt to deploy
  a rootkit or other malicious kernel-level code, potentially leading to elevated
  privileges and bypassing security detections. If confirmed malicious, this could
  allow an attacker to gain persistent, high-level access to the system, compromising
  its integrity and security.
