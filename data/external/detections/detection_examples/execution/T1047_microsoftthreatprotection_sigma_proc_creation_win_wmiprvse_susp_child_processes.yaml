query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_parent and\
  \ 1 of selection_children_* and not 1 of filter_main_*\nfilter_main_msiexec:\n \
  \ CommandLine|contains: '/i '\n  Image|endswith: \\msiexec.exe\nfilter_main_werfault:\n\
  \  Image|endswith: \\WerFault.exe\nfilter_main_wmiprvse:\n  Image|endswith: \\WmiPrvSE.exe\n\
  selection_children_1:\n  Image|endswith:\n  - \\certutil.exe\n  - \\cscript.exe\n\
  \  - \\mshta.exe\n  - \\msiexec.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n  -\
  \ \\verclsid.exe\n  - \\wscript.exe\nselection_children_2:\n  CommandLine|contains:\n\
  \  - cscript\n  - mshta\n  - powershell\n  - pwsh\n  - regsvr32\n  - rundll32\n\
  \  - wscript\n  Image|endswith: \\cmd.exe\nselection_parent:\n  ParentImage|endswith:\
  \ \\wbem\\WmiPrvSE.exe\n"
explanation: Detects suspicious and uncommon child processes of WmiPrvSE
false_positives:
- Unknown
