- type: data_source
  value: Sysmon EventID 23
  confidence: high
- type: data_source
  value: Sysmon EventID 26
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Users may delete a large number of pictures or files in a folder, which
    could trigger this detection. Additionally, heavy usage of PowerBI and Outlook
    may also result in false positives.
  mitigation: Review context and user activity
