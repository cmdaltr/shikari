technique_id: T1562
technique_name: ESXi VIB Acceptance Level Tampering
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`esxi_syslog` Message="*esxcli software acceptance set*" Message="*shell*"
  | rex field=_raw "\]: \[(?<user>\w+)\]:(?<command>.+)" | rex field=_raw "Z (?<dest>[\w\.]+)\s"
  | stats min(_time) as firstTime max(_time) as lastTime count by dest user command
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `esxi_vib_acceptance_level_tampering_filter`'
explanation: This detection identifies changes to the VIB (vSphere Installation Bundle)
  acceptance level on an ESXi host. Modifying the acceptance level, such as setting
  it to CommunitySupported, lowers the system's integrity enforcement and may allow
  the installation of unsigned or unverified software.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/d051d94f-c792-445e-b5d2-0b904f93ac09/
indicators:
- type: data_source
  value: VMWare ESXi Syslog
  confidence: high
- type: risk_system
  value: dest
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Administrators may use this command when installing third party VIBs.
    Tune as needed.
  mitigation: Review context and user activity
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562/esxi_vib_acceptance_level_tampering/esxi_vib_acceptance_level_tampering.log
