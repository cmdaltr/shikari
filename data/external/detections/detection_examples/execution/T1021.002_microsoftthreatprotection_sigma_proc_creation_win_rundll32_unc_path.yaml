query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains: ' \\\\\\\\'\nselection_img:\n- Image|endswith:\
  \ \\rundll32.exe\n- OriginalFileName: RUNDLL32.EXE\n- CommandLine|contains: rundll32\n"
explanation: Detects rundll32 execution where the DLL is located on a remote location
  (share)
false_positives:
- Unlikely
references:
- https://www.cybereason.com/blog/rundll32-the-infamous-proxy-for-executing-malicious-code
