query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : (\"wscript.exe\",\n                  \"cscript.exe\",\n      \
  \            \"rundll32.exe\",\n                  \"regsvr32.exe\",\n          \
  \        \"cmstp.exe\",\n                  \"RegAsm.exe\",\n                  \"\
  installutil.exe\",\n                  \"mshta.exe\",\n                  \"RegSvcs.exe\"\
  ,\n                  \"powershell.exe\",\n                  \"pwsh.exe\",\n    \
  \              \"cmd.exe\") and\n\n  /* add suspicious execution paths here */\n\
  \  process.args : (\"C:\\\\PerfLogs\\\\*\",\n                  \"C:\\\\Users\\\\\
  Public\\\\*\",\n                  \"C:\\\\Windows\\\\Tasks\\\\*\",\n           \
  \       \"C:\\\\Intel\\\\*\",\n                  \"C:\\\\AMD\\\\Temp\\\\*\",\n \
  \                 \"C:\\\\Windows\\\\AppReadiness\\\\*\",\n                  \"\
  C:\\\\Windows\\\\ServiceState\\\\*\",\n                  \"C:\\\\Windows\\\\security\\\
  \\*\",\n                  \"C:\\\\Windows\\\\IdentityCRL\\\\*\",\n             \
  \     \"C:\\\\Windows\\\\Branding\\\\*\",\n                  \"C:\\\\Windows\\\\\
  csc\\\\*\",\n                  \"C:\\\\Windows\\\\DigitalLocker\\\\*\",\n      \
  \            \"C:\\\\Windows\\\\en-US\\\\*\",\n                  \"C:\\\\Windows\\\
  \\wlansvc\\\\*\",\n                  \"C:\\\\Windows\\\\Prefetch\\\\*\",\n     \
  \             \"C:\\\\Windows\\\\Fonts\\\\*\",\n                  \"C:\\\\Windows\\\
  \\diagnostics\\\\*\",\n                  \"C:\\\\Windows\\\\TAPI\\\\*\",\n     \
  \             \"C:\\\\Windows\\\\INF\\\\*\",\n                  \"C:\\\\Windows\\\
  \\System32\\\\Speech\\\\*\",\n                  \"C:\\\\windows\\\\tracing\\\\*\"\
  ,\n                  \"c:\\\\windows\\\\IME\\\\*\",\n                  \"c:\\\\\
  Windows\\\\Performance\\\\*\",\n                  \"c:\\\\windows\\\\intel\\\\*\"\
  ,\n                  \"c:\\\\windows\\\\ms\\\\*\",\n                  \"C:\\\\Windows\\\
  \\dot3svc\\\\*\",\n                  \"C:\\\\Windows\\\\panther\\\\*\",\n      \
  \            \"C:\\\\Windows\\\\RemotePackages\\\\*\",\n                  \"C:\\\
  \\Windows\\\\OCR\\\\*\",\n                  \"C:\\\\Windows\\\\appcompat\\\\*\"\
  ,\n                  \"C:\\\\Windows\\\\apppatch\\\\*\",\n                  \"C:\\\
  \\Windows\\\\addins\\\\*\",\n                  \"C:\\\\Windows\\\\Setup\\\\*\",\n\
  \                  \"C:\\\\Windows\\\\Help\\\\*\",\n                  \"C:\\\\Windows\\\
  \\SKB\\\\*\",\n                  \"C:\\\\Windows\\\\Vss\\\\*\",\n              \
  \    \"C:\\\\Windows\\\\servicing\\\\*\",\n                  \"C:\\\\Windows\\\\\
  CbsTemp\\\\*\",\n                  \"C:\\\\Windows\\\\Logs\\\\*\",\n           \
  \       \"C:\\\\Windows\\\\WaaS\\\\*\",\n                  \"C:\\\\Windows\\\\twain_32\\\
  \\*\",\n                  \"C:\\\\Windows\\\\ShellExperiences\\\\*\",\n        \
  \          \"C:\\\\Windows\\\\ShellComponents\\\\*\",\n                  \"C:\\\\\
  Windows\\\\PLA\\\\*\",\n                  \"C:\\\\Windows\\\\Migration\\\\*\",\n\
  \                  \"C:\\\\Windows\\\\debug\\\\*\",\n                  \"C:\\\\\
  Windows\\\\Cursors\\\\*\",\n                  \"C:\\\\Windows\\\\Containers\\\\\
  *\",\n                  \"C:\\\\Windows\\\\Boot\\\\*\",\n                  \"C:\\\
  \\Windows\\\\bcastdvr\\\\*\",\n                  \"C:\\\\Windows\\\\TextInput\\\\\
  *\",\n                  \"C:\\\\Windows\\\\security\\\\*\",\n                  \"\
  C:\\\\Windows\\\\schemas\\\\*\",\n                  \"C:\\\\Windows\\\\SchCache\\\
  \\*\",\n                  \"C:\\\\Windows\\\\Resources\\\\*\",\n               \
  \   \"C:\\\\Windows\\\\rescache\\\\*\",\n                  \"C:\\\\Windows\\\\Provisioning\\\
  \\*\",\n                  \"C:\\\\Windows\\\\PrintDialog\\\\*\",\n             \
  \     \"C:\\\\Windows\\\\PolicyDefinitions\\\\*\",\n                  \"C:\\\\Windows\\\
  \\media\\\\*\",\n                  \"C:\\\\Windows\\\\Globalization\\\\*\",\n  \
  \                \"C:\\\\Windows\\\\L2Schemas\\\\*\",\n                  \"C:\\\\\
  Windows\\\\LiveKernelReports\\\\*\",\n                  \"C:\\\\Windows\\\\ModemLogs\\\
  \\*\",\n                  \"C:\\\\Windows\\\\ImmersiveControlPanel\\\\*\",\n   \
  \               \"C:\\\\$Recycle.Bin\\\\*\") and\n\n  /* noisy FP patterns */\n\n\
  \  not process.parent.executable : (\"C:\\\\WINDOWS\\\\System32\\\\DriverStore\\\
  \\FileRepository\\\\*\\\\igfxCUIService*.exe\",\n                              \
  \     \"C:\\\\Windows\\\\System32\\\\spacedeskService.exe\",\n                 \
  \                  \"C:\\\\Program Files\\\\Dell\\\\SupportAssistAgent\\\\SRE\\\\\
  SRE.exe\") and\n  not (process.name : \"rundll32.exe\" and\n       process.args\
  \ : (\"uxtheme.dll,#64\",\n                       \"PRINTUI.DLL,PrintUIEntry\",\n\
  \                       \"?:\\\\Windows\\\\System32\\\\FirewallControlPanel.dll,ShowNotificationDialog\"\
  ,\n                       \"?:\\\\WINDOWS\\\\system32\\\\Speech\\\\SpeechUX\\\\\
  sapi.cpl\",\n                       \"?:\\\\Windows\\\\system32\\\\shell32.dll,OpenAs_RunDLL\"\
  )) and\n\n  not (process.name : \"cscript.exe\" and process.args : \"?:\\\\WINDOWS\\\
  \\system32\\\\calluxxprovider.vbs\") and\n\n  not (process.name : \"cmd.exe\" and\
  \ process.args : \"?:\\\\WINDOWS\\\\system32\\\\powercfg.exe\" and process.args\
  \ : \"?:\\\\WINDOWS\\\\inf\\\\PowerPlan.log\") and\n\n  not (process.name : \"regsvr32.exe\"\
  \ and process.args : \"?:\\\\Windows\\\\Help\\\\OEM\\\\scripts\\\\checkmui.dll\"\
  ) and\n\n  not (process.name : \"cmd.exe\" and\n       process.parent.executable\
  \ : (\"?:\\\\Windows\\\\System32\\\\oobe\\\\windeploy.exe\",\n                 \
  \                   \"?:\\\\Program Files (x86)\\\\ossec-agent\\\\wazuh-agent.exe\"\
  ,\n                                    \"?:\\\\Windows\\\\System32\\\\igfxCUIService.exe\"\
  ,\n                                    \"?:\\\\Windows\\\\Temp\\\\IE*.tmp\\\\IE*-support\\\
  \\ienrcore.exe\"))"
explanation: 'Identifies process execution from suspicious default Windows directories.
  This may be abused by adversaries to hide

  malware in trusted paths.'
