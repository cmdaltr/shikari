indicators:
- type: data_source
  value: AWS CloudTrail UpdateSAMLProvider
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Updating a SAML provider or creating a new one may not necessarily
    be malicious however it needs to be closely monitored.
  mitigation: Review context and user activity
