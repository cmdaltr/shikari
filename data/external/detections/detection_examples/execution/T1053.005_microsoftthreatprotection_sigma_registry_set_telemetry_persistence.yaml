technique_id: T1053.005
technique_name: Potential Registry Persistence Attempt Via Windows Telemetry
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 73a883d0-0348-4be4-a8d8-51031c2564f8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_generic:\n  Details|contains:\n  - \\system32\\CompatTelRunner.exe\n\
  \  - \\system32\\DeviceCensus.exe\nselection:\n  Details|contains:\n  - .bat\n \
  \ - .bin\n  - .cmd\n  - .dat\n  - .dll\n  - .exe\n  - .hta\n  - .jar\n  - .js\n\
  \  - .msi\n  - .ps\n  - .sh\n  - .vb\n  TargetObject|contains: \\SOFTWARE\\Microsoft\\\
  Windows NT\\CurrentVersion\\AppCompatFlags\\TelemetryController\\\n  TargetObject|endswith:\
  \ \\Command\n"
explanation: 'Detects potential persistence behavior using the windows telemetry registry
  key.

  Windows telemetry makes use of the binary CompatTelRunner.exe to run a variety of
  commands and perform the actual telemetry collections.

  This binary was created to be easily extensible, and to that end, it relies on the
  registry to instruct on which commands to run.

  The problem is, it will run any arbitrary command without restriction of location
  or type.

  '
false_positives:
- Unknown
references:
- https://www.trustedsec.com/blog/abusing-windows-telemetry-for-persistence/
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  category: registry_set
  product: windows
  definition: 'Requirements: Sysmon config that monitors \SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\AppCompatFlags\TelemetryController subkey of the HKLM hives'
detection:
  selection:
    TargetObject|contains: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\TelemetryController\
    TargetObject|endswith: \Command
    Details|contains:
    - .bat
    - .bin
    - .cmd
    - .dat
    - .dll
    - .exe
    - .hta
    - .jar
    - .js
    - .msi
    - .ps
    - .sh
    - .vb
  filter_main_generic:
    Details|contains:
    - \system32\CompatTelRunner.exe
    - \system32\DeviceCensus.exe
  condition: selection and not 1 of filter_main_*
