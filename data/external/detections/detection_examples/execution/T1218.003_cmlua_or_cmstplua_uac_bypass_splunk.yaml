technique_id: T1218.003
technique_name: CMLUA Or CMSTPLUA UAC Bypass
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`sysmon` EventCode=7  ImageLoaded IN ("*\\CMLUA.dll", "*\\CMSTPLUA.dll", "*\\CMLUAUTIL.dll")
  NOT(process_name IN("CMSTP.exe", "CMMGR32.exe")) NOT(Image IN("*\\windows\\*", "*\\program
  files*")) | fillnull | stats count min(_time) as firstTime max(_time) as lastTime
  by Image ImageLoaded dest loaded_file loaded_file_path original_file_name process_exec
  process_guid process_hash process_id process_name process_path service_dll_signature_exists
  service_dll_signature_verified signature signature_id user_id vendor_product | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `cmlua_or_cmstplua_uac_bypass_filter`'
explanation: The following analytic detects the use of COM objects like CMLUA or CMSTPLUA
  to bypass User Account Control (UAC). It leverages Sysmon EventCode 7 to identify
  the loading of specific DLLs (CMLUA.dll, CMSTPLUA.dll, CMLUAUTIL.dll) by processes
  not typically associated with these libraries. This activity is significant as it
  indicates an attempt to gain elevated privileges, a common tactic used by ransomware
  adversaries. If confirmed malicious, this could allow attackers to execute code
  with administrative rights, leading to potential system compromise and further malicious
  activities.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/f87b5062-b405-11eb-a889-acde48001122/
indicators:
- type: data_source
  value: Sysmon EventID 7
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Legitimate windows application that are not on the list loading this
    dll. Filter as needed.
  mitigation: Review context and user activity
