technique_id: T1059.001
technique_name: Execution of Powershell Script in Public Folder
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: fb9d3ff7-7348-46ab-af8c-b55f5fbf39b4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - -f C:\\Users\\Public\n  - -f \"C:\\Users\\Public\n\
  \  - -f %Public%\n  - -fi C:\\Users\\Public\n  - -fi \"C:\\Users\\Public\n  - -fi\
  \ %Public%\n  - -fil C:\\Users\\Public\n  - -fil \"C:\\Users\\Public\n  - -fil %Public%\n\
  \  - -file C:\\Users\\Public\n  - -file \"C:\\Users\\Public\n  - -file %Public%\n\
  \  Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\n"
explanation: This rule detects execution of PowerShell scripts located in the "C:\Users\Public"
  folder
false_positives:
- Unlikely
