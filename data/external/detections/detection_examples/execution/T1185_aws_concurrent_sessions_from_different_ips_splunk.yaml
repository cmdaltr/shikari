technique_id: T1185
technique_name: AWS Concurrent Sessions From Different Ips
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName = DescribeEventAggregates src_ip!="AWS Internal" |
  bin span=5m _time | rename user_name as user | stats min(_time) as firstTime max(_time)
  as lastTime values(user_agent) as user_agent values(signature) as signature values(src)
  as src values(dest) as dest dc(src) as distinct_ip_count by _time user vendor_account
  vendor_region vendor_product | where distinct_ip_count > 1 |  `security_content_ctime(firstTime)`
  |`security_content_ctime(lastTime)` | `aws_concurrent_sessions_from_different_ips_filter`'
explanation: The following analytic identifies an AWS IAM account with concurrent
  sessions originating from more than one unique IP address within a 5-minute window.
  It leverages AWS CloudTrail logs, specifically the `DescribeEventAggregates` event,
  to detect this behavior. This activity is significant as it may indicate a session
  hijacking attack, where an adversary uses stolen session cookies to access AWS resources
  from a different location. If confirmed malicious, this could allow unauthorized
  access to sensitive corporate resources, leading to potential data breaches or further
  exploitation within the AWS environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/51c04fdb-2746-465a-b86e-b413a09c9085/
indicators:
- type: data_source
  value: AWS CloudTrail DescribeEventAggregates
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: A user with concurrent sessions from different Ips may also represent
    the legitimate use of more than one device. Filter as needed and/or customize
    the threshold to fit your environment.
  mitigation: Review context and user activity
