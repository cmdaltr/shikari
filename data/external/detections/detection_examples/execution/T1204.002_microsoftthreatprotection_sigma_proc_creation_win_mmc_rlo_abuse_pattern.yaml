technique_id: T1204.002
technique_name: MMC Executing Files with Reversed Extensions Using RTLO Abuse
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.83
validated: true
source: sigma
sigma_id: 9cfe4b27-1e56-48b4-b7a8-d46851c91a44
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_commandline:\n  CommandLine|contains:\n  - cod.msc\n  - fdp.msc\n  - ftr.msc\n\
  \  - lmth.msc\n  - slx.msc\n  - tdo.msc\n  - xcod.msc\n  - xslx.msc\n  - xtpp.msc\n\
  selection_image:\n- Image|endswith: \\mmc.exe\n- OriginalFileName: MMC.exe\n"
explanation: Detects malicious behavior where the MMC utility (`mmc.exe`) executes
  files with reversed extensions caused by Right-to-Left Override (RLO) abuse, disguising
  them as document formats.
false_positives:
- Legitimate administrative actions using MMC to execute misnamed `.msc` files.
- Unconventional but non-malicious usage of RLO or reversed extensions.
references:
- https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
- https://en.wikipedia.org/wiki/Right-to-left_override
- https://tria.ge/241015-l98snsyeje/behavioral2
