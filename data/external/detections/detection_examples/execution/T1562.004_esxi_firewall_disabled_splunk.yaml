technique_id: T1562.004
technique_name: ESXi Firewall Disabled
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`esxi_syslog` Message="*network firewall set*" AND Message="*enabled f*" |
  rex field=_raw "Z (?<dest>[\w\.]+)\s" | stats min(_time) as firstTime max(_time)
  as lastTime count by dest Message | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `esxi_firewall_disabled_filter`'
explanation: This detection identifies when the ESXi firewall is disabled or set to
  permissive mode, which can expose the host to unauthorized access and network-based
  attacks. Such changes are often a precursor to lateral movement, data exfiltration,
  or the installation of malicious software by a threat actor.
source: Splunk Security Content
