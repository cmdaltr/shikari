source: sigma
sigma_id: 36388120-b3f1-4ce9-b50b-280d9a7f4c04
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - stop\n  - kesl\n  Image|endswith:\n  - /systemctl\n\
  \  - /bash\n  - /sh\n"
explanation: 'Detects execution of the Kaspersky init.d stop script on Linux systems
  either directly or via systemctl.

  This activity may indicate a manual interruption of the antivirus service by an
  administrator, or it could be a sign of potential tampering or evasion attempts
  by malicious actors.

  '
false_positives:
- System administrator manually stopping Kaspersky services
references:
- https://support.kaspersky.com/KES4Linux/12.0.0/en-US/197929.htm
tags:
