technique_id: T1021.006
technique_name: Remote Process Instantiation via WinRM and PowerShell Script Block
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`powershell` EventCode=4104 (ScriptBlockText="*Invoke-Command*" AND ScriptBlockText="*-ComputerName*")
  | fillnull | stats count min(_time) as firstTime max(_time) as lastTime by dest
  signature signature_id user_id vendor_product EventID Guid Opcode Name Path ProcessID
  ScriptBlockId ScriptBlockText | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `remote_process_instantiation_via_winrm_and_powershell_script_block_filter`'
explanation: The following analytic detects the execution of PowerShell commands that
  use the `Invoke-Command` cmdlet to start a process on a remote endpoint via the
  WinRM protocol. It leverages PowerShell Script Block Logging (EventCode=4104) to
  identify such activities. This behavior is significant as it may indicate lateral
  movement or remote code execution attempts by adversaries. If confirmed malicious,
  this activity could allow attackers to execute arbitrary code on remote systems,
  potentially leading to further compromise and persistence within the network.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/7d4c618e-4716-11ec-951c-3e22fbd008af/
indicators:
- type: data_source
  value: Powershell Script Block Logging 4104
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Administrators may leverage WinRM and `Invoke-Command` to start a process
    on remote systems for system administration or automation use cases. This activity
    is usually limited to a small set of hosts or users. In certain environments,
    tuning may not be possible.
  mitigation: Review context and user activity
references:
