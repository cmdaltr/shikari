technique_id: T1119
technique_name: AWS Exfiltration via DataSync Task
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName = CreateTask eventSource="datasync.amazonaws.com" |
  rename  requestParameters.*  as * | rename user_name as user | stats count min(_time)
  as firstTime max(_time) as lastTime by signature dest user user_agent src vendor_account
  vendor_region vendor_product destinationLocationArn sourceLocationArn | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_exfiltration_via_datasync_task_filter`'
explanation: The following analytic detects the creation of an AWS DataSync task,
  which could indicate potential data exfiltration. It leverages AWS CloudTrail logs
  to identify the `CreateTask` event from the DataSync service. This activity is significant
  because attackers can misuse DataSync to transfer sensitive data from a private
  AWS location to a public one, leading to data compromise. If confirmed malicious,
  this could result in unauthorized access to sensitive information, causing severe
  data breaches and compliance violations.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/05c4b09f-ea28-4c7c-a7aa-a246f665c8a2/
indicators:
- type: data_source
  value: AWS CloudTrail CreateTask
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: It is possible that an AWS Administrator has legitimately created this
    task for creating backup. Please check the `sourceLocationArn` and `destinationLocationArn`
    of this task
  mitigation: Review context and user activity
references:
- https://labs.nettitude.com/blog/how-to-exfiltrate-aws-ec2-data/
- https://www.shehackske.com/how-to/data-exfiltration-on-cloud-1606/
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1119/aws_exfil_datasync/cloudtrail.json
