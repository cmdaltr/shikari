false_positives:
- description: False positives are possible if legitimate applications are allowed
    to register tasks that call a shell to be spawned. Filter as needed based on command-line
    or processes that are used legitimately. Windows Defender, Google Chrome, and
    MS Edge updates may trigger this detection.
  mitigation: Review context and user activity
