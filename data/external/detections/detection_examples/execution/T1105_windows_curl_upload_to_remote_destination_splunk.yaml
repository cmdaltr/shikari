technique_id: T1105
technique_name: Windows Curl Upload to Remote Destination
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_curl` Processes.process
  IN ("*-T *","*--upload-file *", "*-d *", "*--data *", "*-F *") by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_curl_upload_to_remote_destination_filter`'
explanation: The following analytic detects the use of Windows Curl.exe to upload
  a file to a remote destination. It identifies command-line arguments such as `-T`,
  `--upload-file`, `-d`, `--data`, and `-F` in process execution logs. This activity
  is significant because adversaries may use Curl to exfiltrate data or upload malicious
  payloads. If confirmed malicious, this could lead to data breaches or further compromise
  of the system. Analysts should review parallel processes and network logs to determine
  if the upload was successful and isolate the endpoint if necessary.
