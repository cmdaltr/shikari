  \\Windows\\\\System32\\\\KERNELBASE\\.dll\\+[a-z0-9]{4,6}\\|UNKNOWN\\([A-Z0-9]{16}\\\
  )$\n  GrantedAccess:\n  - '0x1028'\n  - '0x1fffff'\n"
