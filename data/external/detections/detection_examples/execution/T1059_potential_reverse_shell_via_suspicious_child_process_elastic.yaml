technique_id: T1059
technique_name: Potential Reverse Shell via Suspicious Child Process
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id, process.entity_id with maxspan=1s\n  [process where host.os.type\
  \ == \"linux\" and event.type == \"start\" and event.action in (\"exec\", \"fork\"\
  ) and (\n    (process.name : \"python*\" and process.args : \"-c\" and process.args\
  \ : (\n     \"*import*pty*spawn*\", \"*import*subprocess*call*\"\n    )) or\n  \
  \  (process.name : \"perl*\" and process.args : \"-e\" and process.args : \"*socket*\"\
  \ and process.args : (\n     \"*exec*\", \"*system*\"\n    )) or\n    (process.name\
  \ : \"ruby*\" and process.args : (\"-e\", \"-rsocket\") and process.args : (\n \
  \    \"*TCPSocket.new*\", \"*TCPSocket.open*\"\n     )) or\n    (process.name :\
  \ \"lua*\" and process.args : \"-e\" and process.args : \"*socket.tcp*\" and process.args\
  \ : (\n     \"*io.popen*\", \"*os.execute*\"\n    )) or\n    (process.name : \"\
  php*\" and process.args : \"-r\" and process.args : \"*fsockopen*\" and process.args\
  \ : \"*/bin/*sh*\") or\n    (process.name : (\"awk\", \"gawk\", \"mawk\", \"nawk\"\
  ) and process.args : \"*/inet/tcp/*\") or\n    (process.name : \"openssl\" and process.args\
  \ : \"-connect\") or\n    (process.name : (\"nc\", \"ncat\", \"netcat\") and process.args\
  \ == \"-e\" and process.args_count >= 3 and\n     not process.args == \"-z\") or\n\
  \    (process.name : \"telnet\" and process.args_count >= 3)\n  ) and process.parent.name\
  \ : (\n    \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\"\
  , \"python*\", \"php*\", \"perl\", \"ruby\", \"lua*\",\n    \"openssl\", \"nc\"\
  , \"netcat\", \"ncat\", \"telnet\", \"awk\")]\n  [network where host.os.type ==\
  \ \"linux\" and event.type == \"start\" and event.action in (\"connection_attempted\"\
  , \"connection_accepted\") and\n    process.name : (\"python*\", \"php*\", \"perl\"\
  , \"ruby\", \"lua*\", \"openssl\", \"nc\", \"netcat\", \"ncat\", \"telnet\", \"\
  awk\") and\n    destination.ip != null and not cidrmatch(destination.ip, \"127.0.0.0/8\"\
  , \"169.254.0.0/16\", \"224.0.0.0/4\", \"::1\")]"
explanation: 'This detection rule detects the creation of a shell through a suspicious
  process chain. Any reverse shells spawned by

  the specified utilities that are initialized from a single process followed by a
  network connection attempt will be

  captured through this rule. Attackers may spawn reverse shells to establish persistence
  onto a target system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/76e4d92b-61c1-4a95-ab61-5fd94179a1ee.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Development and testing environments may frequently execute scripts using languages
    like Python, Perl, or Ruby, which can trigger the rule. To manage this, consider
    excluding specific host IDs or process names associated with known development
    activities.

    - Automated scripts or cron jobs that utilize network connections for legitimate
    purposes, such as data backups or updates, might be flagged. Identify these processes
    and add them to an exception list based on their p'
  mitigation: Review investigation guide for details
references:
- https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/Methodology%20and%20Resources/Reverse%20Shell%20Cheatsheet.md
has_investigation_guide: true
