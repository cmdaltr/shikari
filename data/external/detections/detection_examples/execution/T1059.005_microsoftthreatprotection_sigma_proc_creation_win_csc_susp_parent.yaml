technique_id: T1059.005
technique_name: Csc.EXE Execution Form Potentially Suspicious Parent
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: b730a276-6b63-41b8-bcf8-55930c8fc6ee
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img and 1 of\
  \ selection_parent_* and not 1 of filter_main_* and\n  not 1 of filter_optional_*\n\
  filter_main_programfiles:\n  ParentImage|startswith:\n  - C:\\Program Files (x86)\\\
  \n  - C:\\Program Files\\\nfilter_main_sdiagnhost:\n  ParentImage: C:\\Windows\\\
  System32\\sdiagnhost.exe\nfilter_main_w3p:\n  ParentImage: C:\\Windows\\System32\\\
  inetsrv\\w3wp.exe\nfilter_optional_ansible:\n  ParentCommandLine|contains:\n  -\
  \ JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw\n\
  \  - cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA\n\
  \  - nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA\n\
  filter_optional_chocolatey:\n  ParentImage: C:\\ProgramData\\chocolatey\\choco.exe\n\
  filter_optional_defender:\n  ParentCommandLine|contains: \\ProgramData\\Microsoft\\\
  Windows Defender Advanced Threat\n    Protection\nselection_img:\n- Image|endswith:\
  \ \\csc.exe\n- OriginalFileName: csc.exe\nselection_parent_generic:\n  ParentImage|endswith:\n\
  \  - \\cscript.exe\n  - \\excel.exe\n  - \\mshta.exe\n  - \\onenote.exe\n  - \\\
  outlook.exe\n  - \\powerpnt.exe\n  - \\winword.exe\n  - \\wscript.exe\nselection_parent_powershell:\n\
  \  ParentCommandLine|contains:\n  - '-Encoded '\n  - FromBase64String\n  ParentImage|endswith:\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\nselection_parent_susp_location:\n- ParentCommandLine|re:\
  \ ([Pp]rogram[Dd]ata|%([Ll]ocal)?[Aa]pp[Dd]ata%|\\\\[Aa]pp[Dd]ata\\\\([Ll]ocal([Ll]ow)?|[Rr]oaming))\\\
  \\[^\\\\]{1,256}$\n- ParentCommandLine|contains:\n  - :\\PerfLogs\\\n  - :\\Users\\\
  Public\\\n  - :\\Windows\\Temp\\\n  - \\Temporary Internet\n- ParentCommandLine|contains|all:\n\
  \  - :\\Users\\\n  - \\Favorites\\\n- ParentCommandLine|contains|all:\n  - :\\Users\\\
  \n  - \\Favourites\\\n- ParentCommandLine|contains|all:\n  - :\\Users\\\n  - \\\
  Contacts\\\n- ParentCommandLine|contains|all:\n  - :\\Users\\\n  - \\Pictures\\\n"
explanation: Detects a potentially suspicious parent of "csc.exe", which could be
  a sign of payload delivery.
false_positives:
- Unknown
references:
- https://www.uptycs.com/blog/warzonerat-can-now-evade-with-process-hollowing
- https://reaqta.com/2017/11/short-journey-darkvnc/
- https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/yellow-liderc-ships-its-scripts-delivers-imaploader-malware.html
tags:
- attack.execution
- attack.t1059.005
- attack.t1059.007
- attack.defense-evasion
- attack.t1218.005
- attack.t1027.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \csc.exe
  - OriginalFileName: csc.exe
  selection_parent_generic:
    ParentImage|endswith:
    - \cscript.exe
    - \excel.exe
    - \mshta.exe
    - \onenote.exe
    - \outlook.exe
    - \powerpnt.exe
    - \winword.exe
    - \wscript.exe
  selection_parent_powershell:
    ParentImage|endswith:
    - \powershell.exe
    - \pwsh.exe
    ParentCommandLine|contains:
    - '-Encoded '
    - FromBase64String
  selection_parent_susp_location:
  - ParentCommandLine|re: ([Pp]rogram[Dd]ata|%([Ll]ocal)?[Aa]pp[Dd]ata%|\\[Aa]pp[Dd]ata\\([Ll]ocal([Ll]ow)?|[Rr]oaming))\\[^\\]{1,256}$
  - ParentCommandLine|contains:
    - :\PerfLogs\
    - :\Users\Public\
    - :\Windows\Temp\
    - \Temporary Internet
  - ParentCommandLine|contains|all:
    - :\Users\
    - \Favorites\
  - ParentCommandLine|contains|all:
    - :\Users\
    - \Favourites\
  - ParentCommandLine|contains|all:
    - :\Users\
    - \Contacts\
  - ParentCommandLine|contains|all:
    - :\Users\
    - \Pictures\
  filter_main_programfiles:
    ParentImage|startswith:
    - C:\Program Files (x86)\
    - C:\Program Files\
  filter_main_sdiagnhost:
    ParentImage: C:\Windows\System32\sdiagnhost.exe
  filter_main_w3p:
    ParentImage: C:\Windows\System32\inetsrv\w3wp.exe
  filter_optional_chocolatey:
    ParentImage: C:\ProgramData\chocolatey\choco.exe
  filter_optional_defender:
    ParentCommandLine|contains: \ProgramData\Microsoft\Windows Defender Advanced Threat
      Protection
  filter_optional_ansible:
    ParentCommandLine|contains:
    - JwB7ACIAZgBhAGkAbABlAGQAIgA6AHQAcgB1AGUALAAiAG0AcwBnACIAOgAiAEEAbgBzAGkAYgBsAGUAIAByAGUAcQB1AGkAcgBlAHMAIABQAG8AdwBlAHIAUwBoAGUAbABsACAAdgAzAC4AMAAgAG8AcgAgAG4AZQB3AGUAcgAiAH0AJw
    - cAewAiAGYAYQBpAGwAZQBkACIAOgB0AHIAdQBlACwAIgBtAHMAZwAiADoAIgBBAG4AcwBpAGIAbABlACAAcgBlAHEAdQBpAHIAZQBzACAAUABvAHcAZQByAFMAaABlAGwAbAAgAHYAMwAuADAAIABvAHIAIABuAGUAdwBlAHIAIgB9ACcA
    - nAHsAIgBmAGEAaQBsAGUAZAAiADoAdAByAHUAZQAsACIAbQBzAGcAIgA6ACIAQQBuAHMAaQBiAGwAZQAgAHIAZQBxAHUAaQByAGUAcwAgAFAAbwB3AGUAcgBTAGgAZQBsAGwAIAB2ADMALgAwACAAbwByACAAbgBlAHcAZQByACIAfQAnA
  condition: selection_img and 1 of selection_parent_* and not 1 of filter_main_*
    and not 1 of filter_optional_*
