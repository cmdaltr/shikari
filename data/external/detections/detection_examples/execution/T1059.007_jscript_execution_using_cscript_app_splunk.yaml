technique_id: T1059.007
technique_name: Jscript Execution Using Cscript App
tactic: execution
platform: Splunk
fidelity_score: 0.8999999999999999
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where (Processes.parent_process_name
  = "cscript.exe" AND Processes.parent_process = "*//e:jscript*") OR (Processes.process_name
  = "cscript.exe" AND Processes.process = "*//e:jscript*") by Processes.action Processes.dest
  Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `jscript_execution_using_cscript_app_filter`'
explanation: The following analytic detects the execution of JScript using the cscript.exe
  process. It leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on process and command-line telemetry. This behavior is significant because JScript
  files are typically executed by wscript.exe, making cscript.exe execution unusual
  and potentially indicative of malicious activity, such as the FIN7 group's tactics.
  If confirmed malicious, this activity could allow attackers to execute arbitrary
  scripts, leading to code execution, data exfiltration, or further system compromise.
