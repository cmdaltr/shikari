technique_id: T1490
technique_name: Prevent Automatic Repair Mode using Bcdedit
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name = "bcdedit.exe"
  Processes.process = "*bootstatuspolicy*"  Processes.process = "*ignoreallfailures*"
  by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`|
  `prevent_automatic_repair_mode_using_bcdedit_filter`'
explanation: The following analytic detects the execution of "bcdedit.exe" with parameters
  to set the boot status policy to ignore all failures. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on process names and command-line
  arguments. This activity is significant because it can indicate an attempt by ransomware
  to prevent a compromised machine from booting into automatic repair mode, thereby
  hindering recovery efforts. If confirmed malicious, this action could allow attackers
  to maintain control over the infected system, complicating remediation and potentially
  leading to further damage.
source: Splunk Security Content
