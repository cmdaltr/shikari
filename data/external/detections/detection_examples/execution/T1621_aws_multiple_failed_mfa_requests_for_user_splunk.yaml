technique_id: T1621
technique_name: AWS Multiple Failed MFA Requests For User
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName= ConsoleLogin "additionalEventData.MFAUsed"=Yes errorMessage="Failed
  authentication" | bucket span=5m _time | rename user_name as user | stats dc(_raw)
  as mfa_prompts min(_time) as firstTime max(_time) as lastTime values(user_agent)
  as user_agent values(src) as src values(dest) as dest by _time user signature vendor_account
  vendor_region vendor_product errorMessage | where mfa_prompts > 10 | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_multiple_failed_mfa_requests_for_user_filter`'
explanation: The following analytic identifies multiple failed multi-factor authentication
  (MFA) requests to an AWS Console for a single user. It leverages AWS CloudTrail
  logs, specifically the `additionalEventData` field, to detect more than 10 failed
  MFA prompts within 5 minutes. This activity is significant as it may indicate an
  adversary attempting to bypass MFA by bombarding the user with repeated authentication
  requests. If confirmed malicious, this could lead to unauthorized access to the
  AWS environment, potentially compromising sensitive data and resources.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/1fece617-e614-4329-9e61-3ba228c0f353/
indicators:
- type: data_source
  value: AWS CloudTrail ConsoleLogin
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Multiple Failed MFA requests may also be a sign of authentication or
    application issues. Filter as needed.
  mitigation: Review context and user activity
references:
