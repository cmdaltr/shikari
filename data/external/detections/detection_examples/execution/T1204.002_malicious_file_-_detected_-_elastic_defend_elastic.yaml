technique_id: T1204.002
technique_name: Malicious File - Detected - Elastic Defend
tactic: execution
platform: Elastic
fidelity_score: 0.9
validated: true
query: 'event.kind : alert and event.code : malicious_file and (event.type : allowed
  or (event.type: denied and event.outcome: failure))'
explanation: 'Generates a detection alert each time an Elastic Defend alert for malicious
  files is received. Enabling this rule allows

  you to immediately begin investigating your Endpoint malicious file alerts. This
  rule identifies Elastic Defend

  malicious file detections only, and does not include prevention alerts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f2c3caa6-ea34-11ee-a417-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
false_positives:
- description: "False positive analysis\n\n- Other endpoint security vendors especially\
    \ with their quarantine folders.\n- Dynamically generated or compiled executables\
    \ such as from csc.exe or other compilers. Due to the dynamic nature, each instance\
    \ will likely have a unique hash and no signer\n\n### Response and Remediation\n\
    \n- Initiate the incident response process based on the outcome of the triage.\n\
    \  - If malicious activity is confirmed, perform a broader investigation to identify\
    \ the scope of the compromise and"
  mitigation: Review investigation guide for details
references:
- https://github.com/elastic/protections-artifacts/tree/main/yara
- https://docs.elastic.co/en/integrations/endpoint
has_investigation_guide: true
risk_score: 47
