    - This activity can happen legitimately. Some vendors have their own PowerShell
    implementations that are shipped with some products. These benign true positives
    (B-TPs) can be added as exceptions if necessary after analysis.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved hosts to prevent further post-compromise behavior.

    - If the triage identified malware, search the environment for addit'
  mitigation: Review investigation guide for details
references:
- https://www.elastic.co/security-labs/elastic-security-labs-steps-through-the-r77-rootkit
