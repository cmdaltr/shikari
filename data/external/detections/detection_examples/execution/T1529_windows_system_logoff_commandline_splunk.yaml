technique_id: T1529
technique_name: Windows System LogOff Commandline
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats `security_content_summariesonly` values(Processes.process) as process
  min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes
  where (Processes.process_name = shutdown.exe OR Processes.original_file_name = shutdown.exe)
  Processes.process="*shutdown*" Processes.process IN ("* /l*", "* -l*") Processes.process
  IN ("* /t*","* -t*","* /f*","* -f*") by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_system_logoff_commandline_filter`'
explanation: The following analytic detects the execution of the Windows command line
  to log off a host machine. It leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on processes involving `shutdown.exe` with specific parameters.
  This activity is significant as it is often associated with Advanced Persistent
  Threats (APTs) and Remote Access Trojans (RATs) like dcrat, which use this technique
  to disrupt operations, aid in system destruction, or inhibit recovery. If confirmed
  malicious, this could lead to system downtime, data loss, or hindered incident response
  efforts.
