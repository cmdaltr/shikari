technique_id: T1566.001
technique_name: Windows Office Product Spawned Control
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_office_products_parent`
  Processes.process_name=control.exe by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)` | `windows_office_product_spawned_control_filter`'
explanation: The following analytic identifies instances where `control.exe` is spawned
  by a Microsoft Office product. It leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on process and parent process relationships. This activity
  is significant because it can indicate exploitation attempts related to CVE-2021-40444,
  where `control.exe` is used to execute malicious .cpl or .inf files. If confirmed
  malicious, this behavior could allow an attacker to execute arbitrary code, potentially
  leading to system compromise, data exfiltration, or further lateral movement within
  the network.
