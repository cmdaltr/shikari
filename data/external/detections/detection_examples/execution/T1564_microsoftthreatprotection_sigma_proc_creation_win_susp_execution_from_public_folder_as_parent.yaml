technique_id: T1564
technique_name: Potentially Suspicious Execution From Parent Process In Public Folder
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 69bd9b97-2be2-41b6-9816-fb08757a4d1a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_child:\n- Image|endswith:\n  - \\bitsadmin.exe\n  - \\certutil.exe\n \
  \ - \\cmd.exe\n  - \\cscript.exe\n  - \\mshta.exe\n  - \\powershell.exe\n  - \\\
  pwsh.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n  - \\wscript.exe\n- CommandLine|contains:\n\
  \  - bitsadmin\n  - certutil\n  - cscript\n  - mshta\n  - powershell\n  - regsvr32\n\
  \  - rundll32\n  - wscript\nselection_parent:\n  ParentImage|contains: :\\Users\\\
  Public\\\n"
explanation: 'Detects a potentially suspicious execution of a parent process located
  in the "\Users\Public" folder executing a child process containing references to
  shell or scripting binaries and commandlines.

  '
false_positives:
- Unknown
references:
- https://redcanary.com/blog/blackbyte-ransomware/
tags:
- attack.defense-evasion
- attack.execution
- attack.t1564
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains: :\Users\Public\
  selection_child:
  - Image|endswith:
    - \bitsadmin.exe
    - \certutil.exe
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \wscript.exe
  - CommandLine|contains:
    - bitsadmin
    - certutil
    - cscript
    - mshta
    - powershell
    - regsvr32
    - rundll32
    - wscript
  condition: all of selection_*
