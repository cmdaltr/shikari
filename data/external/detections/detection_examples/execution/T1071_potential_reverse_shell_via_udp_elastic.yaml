technique_id: T1071
technique_name: Potential Reverse Shell via UDP
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sample by host.id, process.pid, process.parent.pid\n  [process where host.os.type\
  \ == \"linux\" and event.type == \"start\" and event.action == \"executed\" and\
  \ process.name : (\n    \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\",\
  \ \"ksh\", \"fish\", \"perl\", \"python*\", \"nc\", \"ncat\", \"netcat\", \"php*\"\
  ,\n    \"ruby\", \"openssl\", \"awk\", \"telnet\", \"lua*\", \"socat\"\n    )]\n\
  \  [process where host.os.type == \"linux\" and auditd.data.syscall == \"socket\"\
  \ and process.name : (\n    \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\"\
  , \"ksh\", \"fish\", \"perl\", \"python*\", \"nc\", \"ncat\", \"netcat\", \"php*\"\
  ,\n    \"ruby\", \"openssl\", \"awk\", \"telnet\", \"lua*\", \"socat\"\n    ) and\
  \ auditd.data.a1 == \"2\"]\n  [network where host.os.type == \"linux\" and event.type\
  \ == \"start\" and event.action == \"connected-to\" and\n   process.name : (\n \
  \   \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\", \"\
  perl\", \"python*\", \"nc\", \"ncat\", \"netcat\", \"php*\",\n    \"ruby\", \"openssl\"\
  , \"awk\", \"telnet\", \"lua*\", \"socat\"\n    ) and network.direction == \"egress\"\
  \ and destination.ip != null and\n   not cidrmatch(destination.ip, \"127.0.0.0/8\"\
  , \"169.254.0.0/16\", \"224.0.0.0/4\", \"::1\")]"
explanation: 'This detection rule identifies suspicious network traffic patterns associated
  with UDP reverse shell activity. This

  activity consists of a sample of an execve, socket and connect syscall executed
  by the same process, where the

  auditd.data.a0-1 indicate a UDP connection, ending with an egress connection event.
  An attacker may establish a Linux

  UDP reverse shell to bypass traditional firewall restrictions and gain remote access
  to a target system covertly.'
source: Elastic Detection Rules
