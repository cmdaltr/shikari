technique_id: T1105
technique_name: Linux Curl Upload File
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name=curl
  Processes.process IN ("*-F *", "*--form *","*--upload-file *","*-T *","*-d *","*--data
  *","*--data-raw *", "*-I *", "*--head *") AND Processes.process IN ("*.aws/credentials*".
  "*.aws/config*") by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `linux_curl_upload_file_filter`'
explanation: The following analytic detects the use of the curl command with specific
  switches (-F, --form, --upload-file, -T, -d, --data, --data-raw, -I, --head) to
  upload AWS credentials or configuration files to a remote destination. This detection
  leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line
  executions and process details. This activity is significant as it may indicate
  an attempt to exfiltrate sensitive AWS credentials, a technique known to be used
  by the TeamTNT group. If confirmed malicious, this could lead to unauthorized access
  and potential compromise of AWS resources.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/c1de2d9a-0c02-4bb4-a49a-510c6e9cf2bf/
indicators:
- type: data_source
  value: Sysmon for Linux EventID 1
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Filtering may be required. In addition to AWS credentials, add other
    important files and monitor. The inverse would be to look for _all_ -F behavior
    and tune from there.
  mitigation: Review context and user activity
references:
- https://curl.se/docs/manpage.html
- https://www.cadosecurity.com/team-tnt-the-first-crypto-mining-worm-to-steal-aws-credentials/
- https://gtfobins.github.io/gtfobins/curl/
validation:
