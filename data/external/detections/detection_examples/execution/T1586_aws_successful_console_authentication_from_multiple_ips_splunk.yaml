technique_id: T1586
technique_name: AWS Successful Console Authentication From Multiple IPs
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName = ConsoleLogin | bin span=5m _time | rename user_name
  as user | stats  dc(src) as distinct_ip_count values(src) as src values(user_agent)
  as user_agent values(dest) as dest by _time, user, signature, vendor_account, vendor_region,
  vendor_product | where distinct_ip_count>1 | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_successful_console_authentication_from_multiple_ips_filter`'
explanation: The following analytic detects an AWS account successfully authenticating
  from multiple unique IP addresses within a 5-minute window. It leverages AWS CloudTrail
  logs, specifically monitoring `ConsoleLogin` events and counting distinct source
  IPs. This behavior is significant as it may indicate compromised credentials, potentially
  from a phishing attack, being used concurrently by an adversary and a legitimate
  user. If confirmed malicious, this activity could allow unauthorized access to corporate
  resources, leading to data breaches or further exploitation within the AWS environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/395e50e1-2b87-4fa3-8632-0dfbdcbcd2cb/
indicators:
- type: data_source
  value: AWS CloudTrail ConsoleLogin
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: A user with successful authentication events from different Ips may
    also represent the legitimate use of more than one device. Filter as needed and/or
    customize the threshold to fit your environment.
  mitigation: Review context and user activity
references:
- https://rhinosecuritylabs.com/aws/mfa-phishing-on-aws/
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1586.003/aws_console_login_multiple_ips/cloudtrail.json
