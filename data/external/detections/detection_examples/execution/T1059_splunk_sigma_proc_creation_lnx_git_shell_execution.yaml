technique_id: T1059
technique_name: Shell Execution via Git - Linux
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 47b3bbd4-1bf7-48cc-84ab-995362aaa75a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - bash 0<&1\n  - dash 0<&1\n  - sh 0<&1\n  ParentCommandLine|contains|all:\n\
  \  - ' -p '\n  - help\n  ParentImage|endswith: /git\n"
explanation: 'Detects the use of the "git" utility to execute a shell. Such behavior
  may be associated with privilege escalation, unauthorized command execution, or
  to break out from restricted environments.

  '
false_positives:
- Unknown
references:
- https://gtfobins.github.io/gtfobins/git/#shell
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    ParentImage|endswith: /git
    ParentCommandLine|contains|all:
    - ' -p '
    - help
    CommandLine|contains:
    - bash 0<&1
    - dash 0<&1
    - sh 0<&1
  condition: selection
