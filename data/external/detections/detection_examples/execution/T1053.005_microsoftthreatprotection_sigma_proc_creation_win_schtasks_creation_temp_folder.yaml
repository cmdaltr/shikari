technique_id: T1053.005
technique_name: Suspicious Scheduled Task Creation Involving Temp Folder
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.81
validated: true
source: sigma
sigma_id: 39019a4e-317f-4ce3-ae63-309a8c6b53c5
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - ' /create '\n  - ' /sc once '\n  - \\Temp\\\n\
  \  Image|endswith: \\schtasks.exe\n"
explanation: Detects the creation of scheduled tasks that involves a temporary folder
  and runs only once
false_positives:
- Administrative activity
- Software installation
references:
- https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289/3
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \schtasks.exe
    CommandLine|contains|all:
    - ' /create '
    - ' /sc once '
    - \Temp\
  condition: selection
