technique_id: T1562.008
technique_name: ASL AWS Defense Evasion Delete Cloudtrail
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`amazon_security_lake` api.operation=DeleteTrail | fillnull | stats count
  min(_time) as firstTime max(_time) as lastTime by actor.user.uid api.operation api.service.name
  http_request.user_agent src_endpoint.ip actor.user.account.uid cloud.provider cloud.region
  | rename actor.user.uid as user api.operation as action api.service.name as dest
  http_request.user_agent as user_agent src_endpoint.ip as src actor.user.account.uid
  as vendor_account cloud.provider as vendor_product cloud.region as vendor_region
  | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)` | `asl_aws_defense_evasion_delete_cloudtrail_filter`'
explanation: The following analytic detects AWS `DeleteTrail` events within CloudTrail
  logs. It leverages Amazon Security Lake logs parsed in the Open Cybersecurity Schema
  Framework (OCSF) format to identify when a CloudTrail is deleted. This activity
  is significant because adversaries may delete CloudTrail logs to evade detection
  and operate with stealth. If confirmed malicious, this action could allow attackers
  to cover their tracks, making it difficult to trace their activities and investigate
  other potential compromises within the AWS environment.
