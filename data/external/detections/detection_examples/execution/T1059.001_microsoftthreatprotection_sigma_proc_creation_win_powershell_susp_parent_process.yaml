technique_id: T1059.001
technique_name: Suspicious PowerShell Parent Process
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 754ed792-634f-40ae-b3bc-e0448d33f695
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_parent:\n- ParentImage|contains: tomcat\n- ParentImage|endswith:\n  -\
  \ \\amigo.exe\n  - \\browser.exe\n  - \\chrome.exe\n  - \\firefox.exe\n  - \\httpd.exe\n\
  \  - \\iexplore.exe\n  - \\jbosssvc.exe\n  - \\microsoftedge.exe\n  - \\microsoftedgecp.exe\n\
  \  - \\MicrosoftEdgeSH.exe\n  - \\mshta.exe\n  - \\nginx.exe\n  - \\outlook.exe\n\
  \  - \\php-cgi.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n  - \\safari.exe\n \
  \ - \\services.exe\n  - \\sqlagent.exe\n  - \\sqlserver.exe\n  - \\sqlservr.exe\n\
  \  - \\vivaldi.exe\n  - \\w3wp.exe\nselection_powershell:\n- Image|endswith:\n \
  \ - \\powershell.exe\n  - \\pwsh.exe\n- CommandLine|contains:\n  - /c powershell\n\
  \  - /c pwsh\n- Description: Windows PowerShell\n- Product: PowerShell Core 6\n\
  - OriginalFileName:\n  - PowerShell.EXE\n  - pwsh.dll\n"
explanation: Detects a suspicious or uncommon parent processes of PowerShell
false_positives:
- Other scripts
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=26
tags:
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
  - ParentImage|contains: tomcat
  - ParentImage|endswith:
    - \amigo.exe
    - \browser.exe
    - \chrome.exe
    - \firefox.exe
    - \httpd.exe
    - \iexplore.exe
    - \jbosssvc.exe
    - \microsoftedge.exe
    - \microsoftedgecp.exe
    - \MicrosoftEdgeSH.exe
    - \mshta.exe
    - \nginx.exe
    - \outlook.exe
    - \php-cgi.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \safari.exe
    - \services.exe
    - \sqlagent.exe
    - \sqlserver.exe
    - \sqlservr.exe
    - \vivaldi.exe
    - \w3wp.exe
  selection_powershell:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  - CommandLine|contains:
    - /c powershell
    - /c pwsh
  - Description: Windows PowerShell
  - Product: PowerShell Core 6
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  condition: all of selection_*
