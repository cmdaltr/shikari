query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - /SC ONLOGON\n  - /SC DAILY /ST\n  - /SC ONIDLE\n \
  \ - /SC HOURLY\n  CommandLine|contains|all:\n  - /Create\n  - powershell.exe -NonI\n\
  \  - /TN Updater /TR\n  Image|endswith: \\schtasks.exe\n  ParentImage|endswith:\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n"
explanation: Detects the creation of a schtask via PowerSploit or Empire Default Configuration.
