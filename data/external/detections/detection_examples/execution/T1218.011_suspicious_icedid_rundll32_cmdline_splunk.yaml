technique_id: T1218.011
technique_name: Suspicious IcedID Rundll32 Cmdline
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_rundll32` Processes.process=*/i:*
  by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `suspicious_icedid_rundll32_cmdline_filter`'
explanation: The following analytic detects a suspicious `rundll32.exe` command line
  used to execute a DLL file, a technique associated with IcedID malware. It leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on command-line
  executions containing the pattern `*/i:*`. This activity is significant as it indicates
  potential malware attempting to load an encrypted DLL payload, often named `license.dat`.
  If confirmed malicious, this could allow attackers to execute arbitrary code, leading
  to further system compromise and potential data exfiltration.
