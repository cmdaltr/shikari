technique_id: T1059.001
technique_name: Exchange PowerShell Snap-Ins Usage
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 25676e10-2121-446e-80a4-71ff8506af47
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_*\nfilter_msiexec:\n  CommandLine|contains: $exserver=Get-ExchangeServer\
  \ ([Environment]::MachineName)\n    -ErrorVariable exerr 2> $null\n  ParentImage:\
  \ C:\\Windows\\System32\\msiexec.exe\nselection_cli:\n  CommandLine|contains: Add-PSSnapin\n\
  selection_img:\n- Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\n- OriginalFileName:\n\
  \  - PowerShell.EXE\n  - pwsh.dll\nselection_module:\n  CommandLine|contains:\n\
  \  - Microsoft.Exchange.Powershell.Snapin\n  - Microsoft.Exchange.Management.PowerShell.SnapIn\n"
explanation: Detects adding and using Exchange PowerShell snap-ins to export mailbox
  data. As seen used by HAFNIUM and APT27
false_positives:
- Unknown
references:
- https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://www.intrinsec.com/apt27-analysis/
tags:
- attack.execution
- attack.t1059.001
- attack.collection
- attack.t1114
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  selection_cli:
    CommandLine|contains: Add-PSSnapin
  selection_module:
    CommandLine|contains:
    - Microsoft.Exchange.Powershell.Snapin
    - Microsoft.Exchange.Management.PowerShell.SnapIn
  filter_msiexec:
    ParentImage: C:\Windows\System32\msiexec.exe
    CommandLine|contains: $exserver=Get-ExchangeServer ([Environment]::MachineName)
      -ErrorVariable exerr 2> $null
  condition: all of selection_* and not 1 of filter_*
