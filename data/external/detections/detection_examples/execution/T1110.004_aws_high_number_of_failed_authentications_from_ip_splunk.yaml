technique_id: T1110.004
technique_name: AWS High Number Of Failed Authentications From Ip
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`cloudtrail` eventName=ConsoleLogin action=failure | bucket span=10m _time
  | rename user_name as user | stats dc(_raw) AS failed_attempts values(user) as user
  values(user_agent) as user_agent by _time, src, signature, dest, vendor_account
  vendor_region, vendor_product | where failed_attempts > 20 | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_high_number_of_failed_authentications_from_ip_filter`'
explanation: The following analytic detects an IP address with 20 or more failed authentication
  attempts to the AWS Web Console within a 5-minute window. This detection leverages
  CloudTrail logs, aggregating failed login events by IP address and time span. This
  activity is significant as it may indicate a brute force attack aimed at gaining
  unauthorized access or escalating privileges within an AWS environment. If confirmed
  malicious, this could lead to unauthorized access, data breaches, or further exploitation
  of AWS resources.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/f75b7f1a-b8eb-4975-a214-ff3e0a944757/
indicators:
- type: data_source
  value: AWS CloudTrail ConsoleLogin
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: An Ip address with more than 20 failed authentication attempts in the
    span of 5 minutes may also be triggered by a broken application.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1110/003/
