technique_id: T1490
technique_name: AWS Disable Bucket Versioning
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName= PutBucketVersioning "requestParameters.VersioningConfiguration.Status"=Suspended
  | rename user_name as user, requestParameters.bucketName as bucket_name | stats
  count min(_time) as firstTime max(_time) as lastTime by signature dest user user_agent
  src vendor_account vendor_region vendor_product bucket_name | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `aws_disable_bucket_versioning_filter`'
explanation: The following analytic detects when AWS S3 bucket versioning is suspended
  by a user. It leverages AWS CloudTrail logs to identify `PutBucketVersioning` events
  with the `VersioningConfiguration.Status` set to `Suspended`. This activity is significant
  because disabling versioning can prevent recovery of deleted or modified data, which
  is a common tactic in ransomware attacks. If confirmed malicious, this action could
  lead to data loss and hinder recovery efforts, severely impacting data integrity
  and availability.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/657902a9-987d-4879-a1b2-e7a65512824b/
indicators:
- type: data_source
  value: AWS CloudTrail PutBucketVersioning
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: It is possible that an AWS Administrator has legitimately disabled
    versioning on certain buckets to avoid costs.
  mitigation: Review context and user activity
references:
