technique_id: T1562.001
technique_name: Windows Impair Defense Define Win Defender Threat Action
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime FROM datamodel=Endpoint.Registry where Registry.registry_path= "*\\Windows
  Defender\\Threats\\ThreatSeverityDefaultAction*" Registry.registry_value_data IN
  ("0x00000001", "9") by Registry.action Registry.dest Registry.process_guid Registry.process_id
  Registry.registry_hive Registry.registry_path Registry.registry_key_name Registry.registry_value_data
  Registry.registry_value_name Registry.registry_value_type Registry.status Registry.user
  Registry.vendor_product | `drop_dm_object_name(Registry)` | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `windows_impair_defense_define_win_defender_threat_action_filter`'
explanation: The following analytic detects modifications to the Windows Defender
  ThreatSeverityDefaultAction registry setting. It leverages data from the Endpoint.Registry
  datamodel to identify changes in registry values that define how Windows Defender
  responds to threats. This activity is significant because altering these settings
  can impair the system's defense mechanisms, potentially allowing threats to go unaddressed.
  If confirmed malicious, this could enable attackers to bypass antivirus protections,
  leading to persistent threats and increased risk of data compromise or further system
  exploitation.
