technique_id: T1106
technique_name: Suspicious Mshta.EXE Execution Patterns
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: e32f92d1-523e-49c3-9374-bdb13b46a3ba
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* or\
  \ (selection_img and not filter_img)\nfilter_img:\n- Image|startswith:\n  - C:\\\
  Windows\\System32\\\n  - C:\\Windows\\SysWOW64\\\n- CommandLine|contains:\n  - .htm\n\
  \  - .hta\n- CommandLine|endswith:\n  - mshta.exe\n  - mshta\nselection_img:\n-\
  \ Image|endswith: \\mshta.exe\n- OriginalFileName: MSHTA.EXE\nselection_susp:\n\
  \  CommandLine|contains:\n  - \\AppData\\Local\\\n  - C:\\ProgramData\\\n  - C:\\\
  Users\\Public\\\n  - C:\\Windows\\Temp\\\n  ParentImage|endswith:\n  - \\cmd.exe\n\
  \  - \\cscript.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n \
  \ - \\rundll32.exe\n  - \\wscript.exe\n"
explanation: Detects suspicious mshta process execution patterns
false_positives:
- Unknown
references:
- https://en.wikipedia.org/wiki/HTML_Application
- https://www.echotrail.io/insights/search/mshta.exe
- https://app.any.run/tasks/34221348-072d-4b70-93f3-aa71f6ebecad/
tags:
- attack.execution
- attack.t1106
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \mshta.exe
  - OriginalFileName: MSHTA.EXE
  selection_susp:
    ParentImage|endswith:
    - \cmd.exe
    - \cscript.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \wscript.exe
    CommandLine|contains:
    - \AppData\Local\
    - C:\ProgramData\
    - C:\Users\Public\
    - C:\Windows\Temp\
  filter_img:
  - Image|startswith:
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
  - CommandLine|contains:
    - .htm
    - .hta
  - CommandLine|endswith:
    - mshta.exe
    - mshta
  condition: all of selection_* or (selection_img and not filter_img)
