technique_id: T1098
technique_name: Azure AD User ImmutableId Attribute Updated
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` operationName="Update user" properties.targetResources{}.modifiedProperties{}.displayName=SourceAnchor
  | rename properties.* as * | rename initiatedBy.user.userPrincipalName as initiatedBy
  | rename targetResources{}.modifiedProperties{}.newValue as modifiedProperties |
  fillnull | stats count min(_time) as firstTime max(_time) as lastTime by dest user
  src vendor_account vendor_product initiatedBy signature | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `azure_ad_user_immutableid_attribute_updated_filter`'
explanation: The following analytic identifies the modification of the SourceAnchor
  (ImmutableId) attribute for an Azure Active Directory user. This detection leverages
  Azure AD audit logs, specifically monitoring the "Update user" operation and changes
  to the SourceAnchor attribute. This activity is significant as it is a step in setting
  up an Azure AD identity federation backdoor, allowing an adversary to establish
  persistence. If confirmed malicious, the attacker could impersonate any user, bypassing
  password and MFA requirements, leading to unauthorized access and potential data
  breaches.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/0c0badad-4536-4a84-a561-5ff760f3c00e/
indicators:
