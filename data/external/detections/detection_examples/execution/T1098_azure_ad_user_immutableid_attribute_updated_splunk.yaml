  value: Azure Active Directory Update user
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_user
  value: initiatedBy
  confidence: high
false_positives:
- description: The SourceAnchor (also called ImmutableId) Azure AD attribute has legitimate
    uses for directory synchronization. Investigate and filter as needed.
  mitigation: Review context and user activity
