technique_id: T1078
technique_name: Cloud Provisioning Activity From Previously Unseen Country
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats earliest(_time) as firstTime, latest(_time) as lastTime from datamodel=Change
  where (All_Changes.action=started OR All_Changes.action=created) All_Changes.status=success
  by All_Changes.src, All_Changes.user, All_Changes.object, All_Changes.command |
  `drop_dm_object_name("All_Changes")` | iplocation src | where isnotnull(Country)
  | lookup previously_seen_cloud_provisioning_activity_sources Country as Country
  OUTPUT firstTimeSeen, enough_data | eventstats max(enough_data) as enough_data |
  where enough_data=1 | eval firstTimeSeenCountry=min(firstTimeSeen) | where isnull(firstTimeSeenCountry)
  OR firstTimeSeenCountry > relative_time(now(), "-24h@h") | `security_content_ctime(firstTime)`
  | table firstTime, src, Country, user, object, command | `cloud_provisioning_activity_from_previously_unseen_country_filter`'
explanation: The following analytic detects cloud provisioning activities originating
  from previously unseen countries. It leverages cloud infrastructure logs and compares
  the geographic location of the source IP address against a baseline of known locations.
  This activity is significant as it may indicate unauthorized access or potential
  compromise of cloud resources. If confirmed malicious, an attacker could gain control
  over cloud assets, leading to data breaches, service disruptions, or further infiltration
  into the network.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/94994255-3acf-4213-9b3f-0494df03bb31/
indicators:
- type: data_source
  value: AWS CloudTrail
  confidence: high
- type: risk_system
  value: object
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: 'This is a strictly behavioral search, so we define "false positive"
    slightly differently. Every time this fires, it will accurately reflect the first
    occurrence in the time period you''re searching within, plus what is stored in
    the cache feature. But while there are really no "false positives" in a traditional
    sense, there is definitely lots of noise.

    This search will fire any time a new IP address is seen in the **GeoIP** database
    for any kind of provisioning activity. If you typically do all provisioning from
    tools inside of your country, there should be few false positives. If you are
    located in countries where the free version of **MaxMind GeoIP** that ships by
    default with Splunk has weak resolution (particularly small countries in less
    economically powerful regions), this may be much less valuable to you.'
  mitigation: Review context and user activity
