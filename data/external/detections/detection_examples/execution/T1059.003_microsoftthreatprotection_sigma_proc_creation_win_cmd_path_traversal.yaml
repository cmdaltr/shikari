technique_id: T1059.003
technique_name: Potential CommandLine Path Traversal Via Cmd.EXE
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 087790e3-3287-436c-bccf-cbd0184a7db1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_*\nfilter_java:\n  CommandLine|contains: \\Tasktop\\keycloak\\\
  bin\\/../../jre\\bin\\java\nselection_flags:\n- ParentCommandLine|contains:\n  -\
  \ /c\n  - /k\n  - /r\n- CommandLine|contains:\n  - /c\n  - /k\n  - /r\nselection_img:\n\
  - ParentImage|endswith: \\cmd.exe\n- Image|endswith: \\cmd.exe\n- OriginalFileName:\
  \ cmd.exe\nselection_path_traversal:\n- ParentCommandLine: /../../\n- CommandLine|contains:\
  \ /../../\n"
explanation: Detects potential path traversal attempt via cmd.exe. Could indicate
  possible command/argument confusion/hijacking
false_positives:
- Java tools are known to produce false-positive when loading libraries
references:
- https://hackingiscool.pl/cmdhijack-command-argument-confusion-with-path-traversal-in-cmd-exe/
- https://twitter.com/Oddvarmoe/status/1270633613449723905
tags:
- attack.execution
- attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - ParentImage|endswith: \cmd.exe
  - Image|endswith: \cmd.exe
  - OriginalFileName: cmd.exe
  selection_flags:
  - ParentCommandLine|contains:
    - /c
    - /k
    - /r
  - CommandLine|contains:
    - /c
    - /k
    - /r
  selection_path_traversal:
  - ParentCommandLine: /../../
  - CommandLine|contains: /../../
  filter_java:
    CommandLine|contains: \Tasktop\keycloak\bin\/../../jre\bin\java
  condition: all of selection_* and not 1 of filter_*
