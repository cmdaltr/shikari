query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains: -Embedding\n  Image|endswith: \\mmc.exe\n  ParentImage|endswith:\
  \ \\svchost.exe\n"
explanation: Detects MMC20.Application Lateral Movement; specifically looks for the
  spawning of the parent MMC.exe with a command line of "-Embedding" as a child of
  svchost.exe
