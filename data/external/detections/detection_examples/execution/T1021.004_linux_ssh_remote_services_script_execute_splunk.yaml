technique_id: T1021.004
technique_name: Linux SSH Remote Services Script Execute
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where  Processes.process_name=ssh
  Processes.process IN ("*oStrictHostKeyChecking*", "*oConnectTimeout*", "*oBatchMode*")
  AND Processes.process IN ("*http:*","*https:*") by Processes.action Processes.dest
  Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `linux_ssh_remote_services_script_execute_filter`'
explanation: The following analytic detects the use of SSH to move laterally and execute
  a script or file on a remote host. It leverages data from Endpoint Detection and
  Response (EDR) agents, focusing on specific SSH command-line parameters and URLs.
  This activity is significant as it may indicate an attacker attempting to execute
  remote commands or scripts, potentially leading to unauthorized access or control
  over additional systems. If confirmed malicious, this could result in lateral movement,
  privilege escalation, or the execution of malicious payloads, compromising the security
  of the network.
