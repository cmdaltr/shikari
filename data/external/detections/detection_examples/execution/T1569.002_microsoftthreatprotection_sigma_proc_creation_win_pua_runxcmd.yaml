query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_account:\n  CommandLine|contains:\n  - ' /account=system '\n  - ' /account=ti\
  \ '\nselection_exec:\n  CommandLine|contains: /exec=\n"
explanation: Detects the use of the RunXCmd tool to execute commands with System or
  TrustedInstaller accounts
false_positives:
- Legitimate use by administrators
references:
- https://www.d7xtech.com/free-software/runx/
- https://www.winhelponline.com/blog/run-program-as-system-localsystem-account-windows/
