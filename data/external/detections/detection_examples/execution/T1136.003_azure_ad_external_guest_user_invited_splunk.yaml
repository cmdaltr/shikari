technique_id: T1136.003
technique_name: Azure AD External Guest User Invited
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` operationName="Invite external user" | rename properties.*
  as * | rename initiatedBy.user.userPrincipalName as initiatedBy | rename targetResources{}.type
  as type | rename userAgent as user_agent | fillnull | stats count min(_time) as
  firstTime max(_time) as lastTime by dest user src vendor_account vendor_product
  user_agent initiatedBy type signature | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `azure_ad_external_guest_user_invited_filter`'
explanation: The following analytic detects the invitation of an external guest user
  within Azure AD. It leverages Azure AD AuditLogs to identify events where an external
  user is invited, using fields such as operationName and initiatedBy. Monitoring
  these invitations is crucial as they can lead to unauthorized access if abused.
  If confirmed malicious, this activity could allow attackers to gain access to internal
  resources, potentially leading to data breaches or further exploitation of the environment.
source: Splunk Security Content
