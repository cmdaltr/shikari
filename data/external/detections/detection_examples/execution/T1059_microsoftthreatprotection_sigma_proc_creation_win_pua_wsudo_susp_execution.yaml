technique_id: T1059
technique_name: PUA - Wsudo Suspicious Execution
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: bdeeabc9-ff2a-4a51-be59-bb253aac7891
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cli:\n\
  \  CommandLine|contains:\n  - -u System\n  - -uSystem\n  - -u TrustedInstaller\n\
  \  - -uTrustedInstaller\n  - ' --ti '\nselection_metadata:\n- Image|endswith: \\\
  wsudo.exe\n- OriginalFileName: wsudo.exe\n- Description: Windows sudo utility\n\
  - ParentImage|endswith: \\wsudo-bridge.exe\n"
explanation: Detects usage of wsudo (Windows Sudo Utility). Which is a tool that let
  the user execute programs with different permissions (System, Trusted Installer,
  Administrator...etc)
false_positives:
- Unknown
references:
- https://github.com/M2Team/Privexec/
