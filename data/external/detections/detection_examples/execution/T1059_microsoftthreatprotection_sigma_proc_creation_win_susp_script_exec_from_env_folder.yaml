technique_id: T1059
technique_name: Script Interpreter Execution From Suspicious Folder
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 1228c958-e64e-4e71-92ad-7d429f4138ba
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_proc_*\
  \ and 1 of selection_folders_*\nselection_folders_1:\n  CommandLine|contains:\n\
  \  - :\\Perflogs\\\n  - :\\Users\\Public\\\n  - \\AppData\\Local\\Temp\n  - \\AppData\\\
  Roaming\\Temp\n  - \\Temporary Internet\n  - \\Windows\\Temp\nselection_folders_2:\n\
  - CommandLine|contains|all:\n  - :\\Users\\\n  - \\Favorites\\\n- CommandLine|contains|all:\n\
  \  - :\\Users\\\n  - \\Favourites\\\n- CommandLine|contains|all:\n  - :\\Users\\\
  \n  - \\Contacts\\\nselection_proc_flags:\n  CommandLine|contains:\n  - ' -ep bypass\
  \ '\n  - ' -ExecutionPolicy bypass '\n  - ' -w hidden '\n  - '/e:javascript '\n\
  \  - '/e:Jscript '\n  - '/e:vbscript '\nselection_proc_image:\n  Image|endswith:\n\
  \  - \\cscript.exe\n  - \\mshta.exe\n  - \\wscript.exe\nselection_proc_original:\n\
  \  OriginalFileName:\n  - cscript.exe\n  - mshta.exe\n  - wscript.exe\n"
explanation: Detects a suspicious script execution in temporary folders or folders
  accessible by environment variables
false_positives:
- Unknown
references:
- https://www.virustotal.com/gui/file/91ba814a86ddedc7a9d546e26f912c541205b47a853d227756ab1334ade92c3f
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/shuckworm-russia-ukraine-military
- https://learn.microsoft.com/en-us/windows/win32/shell/csidl
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  selection_proc_image:
    Image|endswith:
    - \cscript.exe
    - \mshta.exe
    - \wscript.exe
  selection_proc_flags:
    CommandLine|contains:
    - ' -ep bypass '
    - ' -ExecutionPolicy bypass '
    - ' -w hidden '
    - '/e:javascript '
    - '/e:Jscript '
    - '/e:vbscript '
  selection_proc_original:
    OriginalFileName:
    - cscript.exe
    - mshta.exe
    - wscript.exe
  selection_folders_1:
    CommandLine|contains:
    - :\Perflogs\
    - :\Users\Public\
    - \AppData\Local\Temp
    - \AppData\Roaming\Temp
    - \Temporary Internet
    - \Windows\Temp
  selection_folders_2:
  - CommandLine|contains|all:
    - :\Users\
    - \Favorites\
  - CommandLine|contains|all:
    - :\Users\
    - \Favourites\
  - CommandLine|contains|all:
    - :\Users\
    - \Contacts\
  condition: 1 of selection_proc_* and 1 of selection_folders_*
