technique_id: T1562.001
technique_name: Windows Raccine Scheduled Task Deletion
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name=schtasks.exe
  Processes.process="*delete*" AND Processes.process="*Raccine*" by Processes.action
  Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec
  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name
  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid
  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name
  Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_raccine_scheduled_task_deletion_filter`'
explanation: The following analytic identifies the deletion of the Raccine Rules Updater
  scheduled task using the `schtasks.exe` command. This detection leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on process names and command-line
  executions. This activity is significant because adversaries may delete this task
  to disable Raccine, a tool designed to prevent ransomware attacks. If confirmed
  malicious, this action could allow ransomware to execute without interference, leading
  to potential data encryption and loss.
