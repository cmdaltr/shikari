indicators:
- type: data_source
  value: AWS CloudTrail DeleteGuardrail
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate administrators may delete GuardRails as part of normal operations,
    such as when replacing outdated guardrails with updated versions, cleaning up
    test resources, or consolidating security controls. Consider implementing an allowlist
    for expected administrators who regularly manage GuardRails configurations.
  mitigation: Review context and user activity
