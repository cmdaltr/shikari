technique_id: T1059.005
technique_name: Windows Shell/Scripting Processes Spawning Suspicious Programs
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.89
validated: true
source: sigma
sigma_id: 3a6586ad-127a-4d3b-a677-1e6eacdf8fde
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_amazon:\n  ParentCommandLine|contains:\n  - \\Program Files\\\
  Amazon\\WorkSpacesConfig\\Scripts\\setup-scheduledtask.ps1\n  - \\Program Files\\\
  Amazon\\WorkSpacesConfig\\Scripts\\set-selfhealing.ps1\n  - \\Program Files\\Amazon\\\
  WorkSpacesConfig\\Scripts\\check-workspacehealth.ps1\n  - \\nessus_\nfilter_ccmcache:\n\
  \  CurrentDirectory|contains: \\ccmcache\\\nfilter_nessus:\n  CommandLine|contains:\
  \ \\nessus_\nfilter_sccm_install:\n  CommandLine|contains|all:\n  - C:\\MEM_Configmgr_\n\
  \  - \\SMSSETUP\\BIN\\\n  - \\autorun.hta\n  - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'\n\
  \  Image|endswith: \\mshta.exe\n  ParentCommandLine|contains|all:\n  - C:\\MEM_Configmgr_\n\
  \  - \\splash.hta\n  - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'\n  ParentImage|endswith:\
  \ \\mshta.exe\nselection:\n  Image|endswith:\n  - \\schtasks.exe\n  - \\nslookup.exe\n\
  \  - \\certutil.exe\n  - \\bitsadmin.exe\n  - \\mshta.exe\n  ParentImage|endswith:\n\
  \  - \\mshta.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\rundll32.exe\n  -\
  \ \\cscript.exe\n  - \\wscript.exe\n  - \\wmiprvse.exe\n  - \\regsvr32.exe\n"
explanation: Detects suspicious child processes of a Windows shell and scripting processes
  such as wscript, rundll32, powershell, mshta...etc.
false_positives:
- Administrative scripts
- Microsoft SCCM
references:
- https://mgreen27.github.io/posts/2018/04/02/DownloadCradle.html
tags:
- attack.execution
- attack.defense-evasion
- attack.t1059.005
- attack.t1059.001
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - \mshta.exe
    - \powershell.exe
    - \pwsh.exe
    - \rundll32.exe
    - \cscript.exe
    - \wscript.exe
    - \wmiprvse.exe
    - \regsvr32.exe
    Image|endswith:
    - \schtasks.exe
    - \nslookup.exe
    - \certutil.exe
    - \bitsadmin.exe
    - \mshta.exe
  filter_ccmcache:
    CurrentDirectory|contains: \ccmcache\
  filter_amazon:
    ParentCommandLine|contains:
    - \Program Files\Amazon\WorkSpacesConfig\Scripts\setup-scheduledtask.ps1
    - \Program Files\Amazon\WorkSpacesConfig\Scripts\set-selfhealing.ps1
    - \Program Files\Amazon\WorkSpacesConfig\Scripts\check-workspacehealth.ps1
    - \nessus_
  filter_nessus:
    CommandLine|contains: \nessus_
  filter_sccm_install:
    ParentImage|endswith: \mshta.exe
    Image|endswith: \mshta.exe
    ParentCommandLine|contains|all:
    - C:\MEM_Configmgr_
    - \splash.hta
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
    CommandLine|contains|all:
    - C:\MEM_Configmgr_
    - \SMSSETUP\BIN\
    - \autorun.hta
    - '{1E460BD7-F1C3-4B2E-88BF-4E770A288AF5}'
  condition: selection and not 1 of filter_*
