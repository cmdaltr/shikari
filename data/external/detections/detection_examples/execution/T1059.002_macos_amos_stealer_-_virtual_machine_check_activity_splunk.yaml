technique_id: T1059.002
technique_name: MacOS AMOS Stealer - Virtual Machine Check Activity
tactic: execution
platform: Splunk
fidelity_score: 0.85
validated: true
query: "`osquery_macro` name=es_process_events \ncolumns.cmdline=\"*osascript*\" AND\
  \ columns.cmdline=\"* -e *\" AND columns.cmdline=\"*set*\" AND columns.cmdline=\"\
  *system_profiler*\" AND columns.cmdline IN (\"*VMware*\", \"*QEMU*\") \n| rename\
  \ columns.* as * \n| stats  min(_time) as firstTime max(_time) as lastTime \n  values(cmdline)\
  \ as cmdline, \n  values(pid) as pid, \n  values(parent) as parent, \n  values(path)\
  \ as path,\n  values(signing_id) as signing_id,  \n  by username host \n| rename\
  \ \n  username as user, \n  cmdline as process, \n  parent as parent_process, \n\
  \  path as process_path, \n  host as dest \n| `security_content_ctime(firstTime)`\
  \ \n| `security_content_ctime(lastTime)`\n| `macos_amos_stealer___virtual_machine_check_activity_filter`"
explanation: 'The following analytic detects AMOS Stealer VM check activity on macOS.
  It leverages osquery to monitor process events and identifies the execution of the
  "osascript" command along with specific commandline strings. This activity is significant

  as AMOS stealer was seen using this pattern in order to check if the host is a Virtual
  Machine or not. If confirmed malicious, this behavior indicate that the host is
  already infected by the AMOS stealer, which could allow attackers to execute arbitrary
  code, escalate privileges, steal information, or persist within the environment,
  posing a significant security risk.'
