fidelity_score: 0.88
validated: true
source: sigma
sigma_id: b86f6dea-0b2f-41f5-bdcc-a057bd19cd6a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_cli:\n\
  \  CommandLine|contains: -GetCACAPS\nselection_img:\n- Image|endswith: \\certoc.exe\n\
  - OriginalFileName: CertOC.exe\nselection_ip:\n  CommandLine|re: ://[0-9]{1,3}\\\
  .[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\n"
explanation: Detects when a user downloads a file from an IP based URL using CertOC.exe
false_positives:
- Unknown
references:
- https://lolbas-project.github.io/lolbas/Binaries/Certoc/
tags:
