technique_id: T1053.005
technique_name: Suspicious Scheduled Task Update
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 614cf376-6651-47c4-9dcc-6b9527f749f4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_commands:\n  TaskContentNew|contains:\n  - regsvr32\n  - rundll32\n  -\
  \ cmd.exe</Command>\n  - cmd</Command>\n  - '<Arguments>/c '\n  - '<Arguments>/k\
  \ '\n  - '<Arguments>/r '\n  - powershell\n  - pwsh\n  - mshta\n  - wscript\n  -\
  \ cscript\n  - certutil\n  - bitsadmin\n  - bash.exe\n  - 'bash '\n  - scrcons\n\
  \  - 'wmic '\n  - wmic.exe\n  - forfiles\n  - scriptrunner\n  - hh.exe\nselection_eid:\n\
  \  EventID: 4702\nselection_paths:\n  TaskContentNew|contains:\n  - \\AppData\\\
  Local\\Temp\\\n  - \\AppData\\Roaming\\\n  - \\Users\\Public\\\n  - \\WINDOWS\\\
  Temp\\\n  - C:\\Temp\\\n  - \\Desktop\\\n  - \\Downloads\\\n  - \\Temporary Internet\n\
  \  - C:\\ProgramData\\\n  - C:\\Perflogs\\\n"
explanation: Detects update to a scheduled task event that contain suspicious keywords.
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4698
tags:
- attack.execution
- attack.privilege-escalation
- attack.persistence
- attack.t1053.005
logsource:
  product: windows
  service: security
  definition: The Advanced Audit Policy setting Object Access > Audit Other Object
    Access Events has to be configured to allow this detection. We also recommend
    extracting the Command field from the embedded XML in the event data.
detection:
  selection_eid:
    EventID: 4702
  selection_paths:
    TaskContentNew|contains:
    - \AppData\Local\Temp\
    - \AppData\Roaming\
    - \Users\Public\
    - \WINDOWS\Temp\
    - C:\Temp\
    - \Desktop\
    - \Downloads\
    - \Temporary Internet
    - C:\ProgramData\
    - C:\Perflogs\
  selection_commands:
    TaskContentNew|contains:
    - regsvr32
    - rundll32
    - cmd.exe</Command>
    - cmd</Command>
    - '<Arguments>/c '
    - '<Arguments>/k '
    - '<Arguments>/r '
    - powershell
    - pwsh
    - mshta
    - wscript
    - cscript
    - certutil
    - bitsadmin
    - bash.exe
    - 'bash '
    - scrcons
    - 'wmic '
    - wmic.exe
    - forfiles
    - scriptrunner
    - hh.exe
  condition: all of selection_*
