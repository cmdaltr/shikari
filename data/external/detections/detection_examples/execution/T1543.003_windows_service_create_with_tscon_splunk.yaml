false_positives:
- description: False positives may arise in the RDP Hijacking analytic when legitimate
    administrators access remote sessions for maintenance or troubleshooting purposes.
    These activities might resemble an attacker''s attempt to hijack a disconnected
    session, leading to false alarms. To mitigate the risk of false positives and
    improve the overall security posture, organizations can implement Group Policy
    to automatically disconnect RDP sessions when they are complete. By enforcing
    this policy, administrators ensure that disconnected sessions are promptly terminated,
    reducing the window of opportunity for an attacker to hijack a session. Additionally,
    organizations can also implement access control mechanisms and monitor the behavior
    of privileged accounts to further enhance security and reduce the chances of false
    positives in RDP Hijacking detection.
  mitigation: Review context and user activity
