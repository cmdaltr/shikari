  \  CommandLine|contains:\n  - ;iex $\n  - '| IEX'\n  - '|IEX '\n  - I`E`X\n  - I`EX\n\
  \  - IE`X\n  - 'iex '\n  - IEX (\n  - IEX(\n  - Invoke-Expression\n"
