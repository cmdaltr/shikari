false_positives:
- description: An single endpoint accessing windows administrative shares across a
    large number of endpoints is not common behavior. Possible false positive scenarios
    include but are not limited to vulnerability scanners, administration systems
    and missconfigured systems.
  mitigation: Review context and user activity
