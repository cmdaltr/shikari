technique_id: T1005
technique_name: ESXi Sensitive Files Accessed
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`esxi_syslog` Message="*shell[*" Message IN ("*/etc/shadow*","*/etc/vmware/hostd/hostd.xml*",
  "*/etc/vmware/vpxa/vpxa.cfg*","*/etc/sfcb/sfcb.cfg*","*/etc/security/*", "*/etc/likewise/krb5-affinity.conf*","*/etc/vmware-vpx/vcdb.properties*")
  | rex field=_raw "\]: \[(?<user>\w+)\]:(?<command>.+)" | rex field=_raw "Z (?<dest>[\w\.]+)\s"
  | stats min(_time) as firstTime max(_time) as lastTime count by dest user command
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `esxi_sensitive_files_accessed_filter`'
explanation: This detection identifies access to sensitive system and configuration
  files on an ESXi host, including authentication data, service configurations, and
  VMware-specific management settings. Interaction with these files may indicate adversary
  reconnaissance, credential harvesting, or preparation for privilege escalation,
  lateral movement, or persistence.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/6fa0073d-6ca0-4f93-913d-fb420c9de15b/
indicators:
- type: data_source
  value: VMWare ESXi Syslog
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Administrators may access these files for initial setup or troubleshooting.
    Limited in most environments. Tune as needed.
  mitigation: Review context and user activity
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.008/esxi_sensitive_files/esxi_sensitive_files.log
