technique_id: T1218
technique_name: MSDT Execution Via Answer File
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 9c8c7000-3065-44a8-a555-79bcba5d9955
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_pcwrun:\n  ParentImage|endswith: \\pcwrun.exe\nselection:\n\
  \  CommandLine|contains: \\WINDOWS\\diagnostics\\index\\PCWDiagnostic.xml\n  CommandLine|contains|windash:\
  \ ' -af '\n  Image|endswith: \\msdt.exe\n"
explanation: 'Detects execution of "msdt.exe" using an answer file which is simulating
  the legitimate way of calling msdt via "pcwrun.exe" (For example from the compatibility
  tab).

  '
false_positives:
- Possible undocumented parents of "msdt" other than "pcwrun".
references:
- https://lolbas-project.github.io/lolbas/Binaries/Msdt/
tags:
- attack.defense-evasion
- attack.t1218
- attack.execution
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \msdt.exe
    CommandLine|contains: \WINDOWS\diagnostics\index\PCWDiagnostic.xml
    CommandLine|contains|windash: ' -af '
  filter_main_pcwrun:
    ParentImage|endswith: \pcwrun.exe
  condition: selection and not 1 of filter_main_*
