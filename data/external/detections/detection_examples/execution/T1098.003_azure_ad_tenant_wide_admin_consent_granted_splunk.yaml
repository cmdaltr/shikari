technique_id: T1098.003
technique_name: Azure AD Tenant Wide Admin Consent Granted
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` operationName="Consent to application" | eval new_field=mvindex(''properties.targetResources{}.modifiedProperties{}.newValue'',4)
  | rename properties.* as * | rex field=new_field "ConsentType:(?<ConsentType> [^\,]+)"
  | rex field=new_field "Scope:(?<Scope> [^\,]+)" | search ConsentType = "*AllPrincipals*"
  | rename userAgent as user_agent | fillnull | stats count min(_time) as firstTime
  max(_time) as lastTime by dest user src vendor_account vendor_product ConsentType
  Scope signature | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `azure_ad_tenant_wide_admin_consent_granted_filter`'
explanation: The following analytic identifies instances where admin consent is granted
  to an application within an Azure AD tenant. It leverages Azure AD audit logs, specifically
  events related to the admin consent action within the ApplicationManagement category.
  This activity is significant because admin consent allows applications to access
  data across the entire tenant, potentially exposing vast amounts of organizational
  data. If confirmed malicious, an attacker could gain extensive and persistent access
  to sensitive data, leading to data exfiltration, espionage, further malicious activities,
  and potential compliance violations.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/dc02c0ee-6ac0-4c7f-87ba-8ce43a4e4418/
indicators:
- type: data_source
  value: Azure Active Directory Consent to application
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Legitimate applications may be granted tenant wide consent, filter
    as needed.
  mitigation: Review context and user activity
