technique_id: T1059
technique_name: Shell Invocation via Env Command - Linux
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: bed978f8-7f3a-432b-82c5-9286a9b3031a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|endswith:\n  - /bin/bash\n  - /bin/dash\n  - /bin/fish\n  - /bin/sh\n\
  \  - /bin/zsh\n  Image|endswith: /env\n"
explanation: 'Detects the use of the env command to invoke a shell. This may indicate
  an attempt to bypass restricted environments, escalate privileges, or execute arbitrary
  commands.

  '
false_positives:
- Github operations such as ghe-backup
references:
- https://gtfobins.github.io/gtfobins/env/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: /env
    CommandLine|endswith:
    - /bin/bash
    - /bin/dash
    - /bin/fish
    - /bin/sh
    - /bin/zsh
  condition: selection
