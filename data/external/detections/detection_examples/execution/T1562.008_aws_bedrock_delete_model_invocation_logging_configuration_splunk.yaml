false_positives:
- description: Legitimate administrators may delete model invocation logging configurations
    during maintenance, when updating logging policies, or when cleaning up unused
    resources. Consider implementing an allowlist for expected administrators who
    regularly manage logging configurations.
  mitigation: Review context and user activity
