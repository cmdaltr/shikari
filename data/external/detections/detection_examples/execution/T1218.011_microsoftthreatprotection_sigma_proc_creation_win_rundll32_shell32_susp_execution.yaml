technique_id: T1218.011
technique_name: Shell32 DLL Execution in Suspicious Directory
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 32b96012-7892-429e-b26c-ac2bf46066ff
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - '%AppData%'\n  - '%LocalAppData%'\n\
  \  - '%Temp%'\n  - '%tmp%'\n  - \\AppData\\\n  - \\Temp\\\n  - \\Users\\Public\\\
  \n  CommandLine|contains|all:\n  - shell32.dll\n  - Control_RunDLL\nselection_img:\n\
  - Image|endswith: \\rundll32.exe\n- OriginalFileName: RUNDLL32.EXE\n"
explanation: Detects shell32.dll executing a DLL in a suspicious directory
false_positives:
- Unknown
references:
- https://www.group-ib.com/resources/threat-research/red-curl-2.html
tags:
- attack.defense-evasion
- attack.execution
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \rundll32.exe
  - OriginalFileName: RUNDLL32.EXE
  selection_cli:
    CommandLine|contains|all:
    - shell32.dll
    - Control_RunDLL
    CommandLine|contains:
    - '%AppData%'
    - '%LocalAppData%'
    - '%Temp%'
    - '%tmp%'
    - \AppData\
    - \Temp\
    - \Users\Public\
  condition: all of selection_*
