  value: Powershell Script Block Logging 4104
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Administrators may leverage DCOM to start a process on remote systems,
    but this activity is usually limited to a small set of hosts or users.
  mitigation: Review context and user activity
