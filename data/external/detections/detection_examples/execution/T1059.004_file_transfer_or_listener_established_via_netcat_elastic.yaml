technique_id: T1059.004
technique_name: File Transfer or Listener Established via Netcat
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\", \"executed\"\
  , \"process_started\") and\nprocess.name in (\"nc\",\"ncat\",\"netcat\",\"netcat.openbsd\"\
  ,\"netcat.traditional\") and\nprocess.args like~ (\n  /* bind shell to specific\
  \ port or listener */\n  \"-*l*\",\"-*p*\",\n  /* reverse shell to command-line\
  \ interpreter used for command execution */\n  \"-*e*\",\n  /* file transfer via\
  \ stdout/pipe */\n  \">\",\"<\", \"|\"\n)"
explanation: 'A netcat process is engaging in network activity on a Linux host. Netcat
  is often used as a persistence mechanism by

  exporting a reverse shell or by serving a shell on a listening port. Netcat is also
  sometimes used for data

  exfiltration.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/adb961e0-cb74-42a0-af9e-29fc41f88f5f.toml
query_type: eql
query_language: eql
