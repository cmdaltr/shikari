false_positives:
- description: 'False positive analysis


    - Netcat is a dual-use tool that can be used for benign or malicious activity.
    It is included in some Linux distributions, so its presence is not necessarily
    suspicious. Some normal use of this program, while uncommon, may originate from
    scripts, automation tools, and frameworks.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - Investigate'
  mitigation: Review investigation guide for details
