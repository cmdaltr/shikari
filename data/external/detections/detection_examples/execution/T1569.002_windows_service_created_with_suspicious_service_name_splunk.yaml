technique_id: T1569.002
technique_name: Windows Service Created with Suspicious Service Name
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: "`wineventlog_system` EventCode=7045 \n| stats values(ImagePath) as process,\
  \ count, min(_time) as firstTime, max(_time) as lastTime values(EventCode) as signature\
  \ by Computer, ServiceName, StartType, ServiceType, UserID\n| eval process_name\
  \ = replace(mvindex(split(process,\"\\\\\"),-1), \"\\\"\", \"\")\n| rename Computer\
  \ as dest, ServiceName as object_name, ServiceType as object_type, UserID as user_id\n\
  | lookup windows_suspicious_services service_name as object_name\n| where isnotnull(tool_name)\n\
  | `security_content_ctime(firstTime)` \n| `security_content_ctime(lastTime)` \n\
  | `windows_service_created_with_suspicious_service_name_filter`"
explanation: The following analytic detects the creation of a Windows Service with
  a known suspicious or malicious name using Windows Event ID 7045. It leverages logs
  from the `wineventlog_system` to identify these services installations. This activity
  is significant as adversaries, including those deploying Clop ransomware, often
  create malicious services for lateral movement, remote code execution, persistence,
  and execution. If confirmed malicious, this could allow attackers to maintain persistence,
  execute arbitrary code, and potentially escalate privileges, posing a severe threat
  to the environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/35eb6d19-a497-400c-93c5-645562804b11/
indicators:
