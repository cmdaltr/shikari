query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - Signature|startswith:\n  - ATK/\n  - Exploit.Script.CVE\n  - HKTL\n  - HTOOL\n\
  \  - PWS.\n  - PWSX\n  - SecurityTool\n- Signature|contains:\n  - Adfind\n  - Brutel\n\
  \  - BruteR\n  - Cobalt\n  - COBEACON\n  - Cometer\n  - DumpCreds\n  - FastReverseProxy\n\
  \  - Hacktool\n  - Havoc\n  - Impacket\n  - Keylogger\n  - Koadic\n  - Mimikatz\n\
  \  - Nighthawk\n  - PentestPowerShell\n  - Potato\n  - PowerSploit\n  - PowerSSH\n\
  \  - PshlSpy\n  - PSWTool\n  - PWCrack\n  - PWDump\n  - Rozena\n  - Rusthound\n\
  \  - Sbelt\n  - Seatbelt\n  - SecurityTool\n  - SharpDump\n  - SharpHound\n  - Shellcode\n\
  \  - Sliver\n  - Snaffler\n  - SOAPHound\n  - Splinter\n  - Swrort\n  - TurtleLoader\n"
explanation: 'Detects a highly relevant Antivirus alert that reports a hack tool or
  other attack tool.

  This event must not be ignored just because the AV has blocked the malware but investigate,
  how it came there in the first place.

  '
false_positives:
- Unlikely
