technique_id: T1027.010
technique_name: Obfuscated PowerShell MSI Install via WindowsInstaller COM
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 7b6a7418-3afc-11f0-aff4-000d3abf478c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - -ComObject\n  - InstallProduct(\n\
  \  - .Insert(\n  - UILevel\nselection_img:\n- Image|endswith:\n  - \\powershell_ise.exe\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n- OriginalFileName:\n  - PowerShell_ISE.EXE\n\
  \  - PowerShell.EXE\n  - pwsh.dll\n"
explanation: 'Detects the execution of obfuscated PowerShell commands that attempt
  to install MSI packages via the Windows Installer COM object (`WindowsInstaller.Installer`).

  The technique involves manipulating strings to hide functionality, such as constructing
  class names using string insertion (e.g., ''indowsInstaller.Installer''.Insert(0,''W''))
  and correcting

  malformed URLs (e.g., converting ''htps://'' to ''https://'') at runtime. This behavior
  is commonly associated with malware loaders or droppers that aim to bypass static
  detection

  by hiding intent in runtime-generated strings and using legitimate tools for code
  execution. The use of `InstallProduct` and COM object creation, particularly combined
  with

  hidden window execution and suppressed UI, indicates an attempt to install software
  (likely malicious) without user interaction.

  '
false_positives:
- Unknown
