technique_id: T1021.006
technique_name: Remote Process Instantiation via WinRM and PowerShell
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where `process_powershell` (Processes.process="*Invoke-Command*"
  AND Processes.process="*-ComputerName*") by Processes.action Processes.dest Processes.original_file_name
  Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
  Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
  Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
  Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
  Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)` | `remote_process_instantiation_via_winrm_and_powershell_filter`'
explanation: The following analytic detects the execution of `powershell.exe` with
  arguments used to start a process on a remote endpoint via the WinRM protocol, specifically
  targeting the `Invoke-Command` cmdlet. It leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on command-line executions and process telemetry.
  This activity is significant as it may indicate lateral movement or remote code
  execution attempts by adversaries. If confirmed malicious, this could allow attackers
  to execute arbitrary code on remote systems, potentially leading to further compromise
  and lateral spread within the network.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/ba24cda8-4716-11ec-8009-3e22fbd008af/
