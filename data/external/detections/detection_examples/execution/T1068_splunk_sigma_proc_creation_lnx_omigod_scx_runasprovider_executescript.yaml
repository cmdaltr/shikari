technique_id: T1068
technique_name: OMIGOD SCX RunAsProvider ExecuteScript
tactic: execution
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 6eea1bf6-f8d2-488a-a742-e6ef6c1b67db
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains: /etc/opt/microsoft/scx/conf/tmpdir/scx\n  CurrentDirectory:\
  \ /var/opt/microsoft/scx/tmp\n  LogonId: 0\n  User: root\n"
explanation: 'Rule to detect the use of the SCX RunAsProvider ExecuteScript to execute
  any UNIX/Linux script using the /bin/sh shell.

  Script being executed gets created as a temp file in /tmp folder with a scx* prefix.

  Then it is invoked from the following directory /etc/opt/microsoft/scx/conf/tmpdir/.

  The file in that directory has the same prefix scx*. SCXcore, started as the Microsoft
  Operations Manager UNIX/Linux Agent, is now used in a host of products including

  Microsoft Operations Manager, Microsoft Azure, and Microsoft Operations Management
  Suite.

  '
false_positives:
- Legitimate use of SCX RunAsProvider ExecuteScript.
references:
- https://www.wiz.io/blog/omigod-critical-vulnerabilities-in-omi-azure
- https://github.com/Azure/Azure-Sentinel/pull/3059
