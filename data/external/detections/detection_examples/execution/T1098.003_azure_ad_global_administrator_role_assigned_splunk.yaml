technique_id: T1098.003
technique_name: Azure AD Global Administrator Role Assigned
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` operationName="Add member to role" properties.targetResources{}.modifiedProperties{}.newValue="*Global
  Administrator*" | rename properties.* as * | rename initiatedBy.user.userPrincipalName
  as initiatedBy | rename userAgent as user_agent | fillnull | stats count min(_time)
  as firstTime max(_time) as lastTime by dest user src vendor_account vendor_product
  user_agent initiatedBy signature | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `azure_ad_global_administrator_role_assigned_filter`'
explanation: The following analytic detects the assignment of the Azure AD Global
  Administrator role to a user. It leverages Azure Active Directory AuditLogs to identify
  when the "Add member to role" operation includes the "Global Administrator" role.
  This activity is significant because the Global Administrator role grants extensive
  access to data, resources, and settings, similar to a Domain Administrator in traditional
  AD environments. If confirmed malicious, this could allow an attacker to establish
  persistence, escalate privileges, and potentially gain control over Azure resources,
  posing a severe security risk.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/825fed20-309d-4fd1-8aaf-cd49c1bb093c/
indicators:
- type: data_source
  value: Azure Active Directory Add member to role
  confidence: high
- type: risk_user
  value: user
  confidence: high
- type: risk_user
  value: initiatedBy
  confidence: high
false_positives:
- description: Administrators may legitimately assign the Global Administrator role
    to a user. Filter as needed.
  mitigation: Review context and user activity
