    \ malware, search the environment for additional compromised hosts.\n  - Implement\
    \ temporary network rules, procedures, and segmentation to contain the malware.\n\
    \  - Stop suspicious processes.\n  - Imm"
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
