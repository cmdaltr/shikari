technique_id: T1059.001
technique_name: Potential Command Shell via NetCat
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  process.name : (\"cmd.exe\", \"powershell.exe\") and process.parent.args : \"-e\"\
  \ and\n (\n  (process.parent.args_count == 5 and process.parent.command_line regex~\
  \ \"\"\".*[0-9]{1,3}(\\.[0-9]{1,3}){3}.*\"\"\") or\n  (process.parent.args : \"\
  -*l*\" and process.parent.args : \"-*p*\" and process.parent.args : (\"cmd.exe\"\
  , \"powershell.exe\"))\n  )"
explanation: 'Identifies potential attempt to execute via a reverse shell using the
  netcat utility to execute Windows commands using

  the default interpreters like Cmd.exe and Powershell.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9c0f61fa-abf4-4b11-8d9d-5978c09182dd.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: "False positive analysis\n\n- IT Support or system amdinistrator authorized\
