technique_id: T1119
technique_name: AWS Exfiltration via Anomalous GetObject API Activity
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName=GetObject | bin _time span=10m | rename user_name as
  user | stats count values(requestParameters.bucketName) as bucketName by signature
  dest user user_agent src vendor_account vendor_region vendor_product | anomalydetection
  "count" "user" action=annotate | search probable_cause=* |`aws_exfiltration_via_anomalous_getobject_api_activity_filter`'
explanation: The following analytic identifies anomalous GetObject API activity in
  AWS, indicating potential data exfiltration attempts. It leverages AWS CloudTrail
  logs and uses the `anomalydetection` command to detect unusual patterns in the frequency
  of GetObject API calls by analyzing fields such as "count," "user_type," and "user_arn"
  within a 10-minute window. This activity is significant as it may indicate unauthorized
  data access or exfiltration from S3 buckets. If confirmed malicious, attackers could
  exfiltrate sensitive data, leading to data breaches and compliance violations.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/e4384bbf-5835-4831-8d85-694de6ad2cc6/
indicators:
- type: data_source
  value: AWS CloudTrail GetObject
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: It is possible that a user downloaded these files to use them locally
    and there are AWS services in configured that perform these activities for a legitimate
    reason. Filter is needed.
  mitigation: Review context and user activity
