technique_id: T1185
technique_name: ASL AWS Concurrent Sessions From Different Ips
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`amazon_security_lake` api.operation=DescribeEventAggregates src_endpoint.domain!="AWS
  Internal" | bin span=5m _time | stats min(_time) as firstTime max(_time) as lastTime
  values(api.operation) as api.operation values(api.service.name) as api.service.name
  values(http_request.user_agent) as http_request.user_agent values(src_endpoint.ip)
  as src_ip values(actor.user.account.uid) as actor.user.account.uid values(cloud.provider)
  as cloud.provider values(cloud.region) as cloud.region dc(src_endpoint.ip) as distinct_ip_count
  by _time actor.user.uid | where distinct_ip_count > 1 | rename actor.user.uid as
  user api.operation as action api.service.name as dest http_request.user_agent as
  user_agent src_endpoint.ip as src actor.user.account.uid as vendor_account cloud.provider
  as vendor_product cloud.region as vendor_region | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `asl_aws_concurrent_sessions_from_different_ips_filter`'
explanation: The following analytic identifies an AWS IAM account with concurrent
  sessions originating from more than one unique IP address within a 5-minute span.
  This detection leverages AWS CloudTrail logs, specifically the `DescribeEventAggregates`
  API call, to identify multiple IP addresses associated with the same user session.
  This behavior is significant as it may indicate a session hijacking attack, where
  an adversary uses stolen session cookies to access AWS resources from a different
  location. If confirmed malicious, this activity could allow unauthorized access
  to sensitive corporate resources, leading to potential data breaches or further
  exploitation.
source: Splunk Security Content
