technique_id: T1059.001
technique_name: Potential Powershell ReverseShell Connection
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: edc2f8ae-2412-4dfd-b9d5-0c57727e70be
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - ' Net.Sockets.TCPClient'\n  - .GetStream(\n\
  \  - .Write(\nselection_img:\n- OriginalFileName:\n  - PowerShell.EXE\n  - pwsh.dll\n\
  - Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\n"
explanation: Detects usage of the "TcpClient" class. Which can be abused to establish
  remote connections and reverse-shells. As seen used by the Nishang "Invoke-PowerShellTcpOneLine"
  reverse shell and other.
false_positives:
- In rare administrative cases, this function might be used to check network connectivity
references:
- https://www.volexity.com/blog/2021/03/02/active-exploitation-of-microsoft-exchange-zero-day-vulnerabilities/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://github.com/samratashok/nishang/blob/414ee1104526d7057f9adaeee196d91ae447283e/Shells/Invoke-PowerShellTcpOneLine.ps1
tags:
- attack.execution
