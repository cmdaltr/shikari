technique_id: T1547.001
technique_name: Suspicious Autorun Registry Modified via WMI
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: c80e66d8-1780-48a9-b412-46663fd21ac0
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_execution_*\
  \ and (selection_suspicious_paths_1 or (all\n  of selection_suspicious_paths_user_*))\n\
  selection_execution_cmd:\n  CommandLine|contains:\n  - \\Software\\Microsoft\\Windows\\\
  CurrentVersion\\Run\n  - \\Software\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\\
  Run\n  - \\Software\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer\\Run\n\
  \  CommandLine|contains|all:\n  - reg\n  - ' add '\nselection_execution_img:\n-\
  \ Image|endswith: \\wmic.exe\n- OriginalFileName: wmic.exe\n- ParentImage|endswith:\
  \ \\wmiprvse.exe\nselection_suspicious_paths_1:\n  CommandLine|contains:\n  - :\\\
  Perflogs\n  - :\\ProgramData'\n  - :\\Windows\\Temp\n  - :\\Temp\n  - \\AppData\\\
  Local\\Temp\n  - \\AppData\\Roaming\n  - :\\$Recycle.bin\n  - :\\Users\\Default\n\
  \  - :\\Users\\public\n  - '%temp%'\n  - '%tmp%'\n  - '%Public%'\n  - '%AppData%'\n\
  selection_suspicious_paths_user_1:\n  CommandLine|contains: :\\Users\\\nselection_suspicious_paths_user_2:\n\
  \  CommandLine|contains:\n  - \\Favorites\n  - \\Favourites\n  - \\Contacts\n  -\
  \ \\Music\n  - \\Pictures\n  - \\Documents\n  - \\Photos\n"
explanation: 'Detects suspicious activity where the WMIC process is used to create
  an autorun registry entry via reg.exe, which is often indicative of persistence
  mechanisms employed by malware.

  '
false_positives:
- Legitimate administrative activity or software installations
references:
- Internal Research
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1547.001
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_execution_img:
  - Image|endswith: \wmic.exe
  - OriginalFileName: wmic.exe
  - ParentImage|endswith: \wmiprvse.exe
  selection_execution_cmd:
    CommandLine|contains|all:
    - reg
    - ' add '
    CommandLine|contains:
    - \Software\Microsoft\Windows\CurrentVersion\Run
    - \Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
    - \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
  selection_suspicious_paths_1:
    CommandLine|contains:
    - :\Perflogs
    - :\ProgramData'
    - :\Windows\Temp
    - :\Temp
    - \AppData\Local\Temp
    - \AppData\Roaming
    - :\$Recycle.bin
    - :\Users\Default
    - :\Users\public
    - '%temp%'
    - '%tmp%'
    - '%Public%'
    - '%AppData%'
  selection_suspicious_paths_user_1:
    CommandLine|contains: :\Users\
  selection_suspicious_paths_user_2:
    CommandLine|contains:
    - \Favorites
    - \Favourites
    - \Contacts
    - \Music
    - \Pictures
    - \Documents
    - \Photos
  condition: all of selection_execution_* and (selection_suspicious_paths_1 or (all
    of selection_suspicious_paths_user_*))
