false_positives:
- description: 'False positive analysis


    - Routine administrative tasks using SolarWinds may trigger the rule when legitimate
    scripts are executed via Cmd.exe or Powershell.exe. Users can create exceptions
    for known maintenance scripts or tasks that are regularly scheduled and verified
    as safe.

    - Automated updates or patches initiated by SolarWinds processes might be flagged.
    To mitigate this, users should whitelist specific update processes or scripts
    that are part of the regular update cycle.

    - Monitoring or'
  mitigation: Review investigation guide for details
