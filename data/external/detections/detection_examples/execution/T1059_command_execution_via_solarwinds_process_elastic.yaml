technique_id: T1059
technique_name: Command Execution via SolarWinds Process
tactic: execution
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\
  \ process.name: (\"cmd.exe\", \"powershell.exe\") and\nprocess.parent.name: (\n\
  \     \"ConfigurationWizard*.exe\",\n     \"NetflowDatabaseMaintenance*.exe\",\n\
  \     \"NetFlowService*.exe\",\n     \"SolarWinds.Administration*.exe\",\n     \"\
  SolarWinds.Collector.Service*.exe\",\n     \"SolarwindsDiagnostics*.exe\"\n    \
  \ )"
explanation: A suspicious SolarWinds child process (Cmd.exe or Powershell.exe) was
  detected.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d72e33fc-6e91-42ff-ac8b-e573268c5a87.toml
