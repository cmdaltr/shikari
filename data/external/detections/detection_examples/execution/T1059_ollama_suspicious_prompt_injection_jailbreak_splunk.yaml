false_positives:
- description: Legitimate complex queries requiring extensive model reasoning, large
    context windows processing substantial amounts of text, batch processing operations,
    or resource-constrained systems experiencing performance degradation may trigger
    this detection during normal operations.
  mitigation: Review context and user activity
