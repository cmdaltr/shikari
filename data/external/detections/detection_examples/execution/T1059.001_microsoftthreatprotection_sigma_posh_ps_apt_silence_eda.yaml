technique_id: T1059.001
technique_name: Silence.EDA Detection
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.91
validated: true
source: sigma
sigma_id: 3ceb2083-a27f-449a-be33-14ec1b7cc973
level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: empire and dnscat\ndnscat:\n\
  \  ScriptBlockText|contains|all:\n  - set type=$LookupType`nserver\n  - $Command\
  \ | nslookup 2>&1 | Out-String\n  - New-RandomDNSField\n  - '[Convert]::ToString($SYNOptions,\
  \ 16)'\n  - $Session.Dead = $True\n  - $Session[\"Driver\"] -eq\nempire:\n  ScriptBlockText|contains|all:\n\
  \  - System.Diagnostics.Process\n  - Stop-Computer\n  - Restart-Computer\n  - Exception\
  \ in execution\n  - $cmdargs\n  - Close-Dnscat2Tunnel\n"
explanation: Detects Silence EmpireDNSAgent as described in the Group-IP report
false_positives:
- Unknown
references:
- https://www.group-ib.com/resources/threat-research/silence_2.0.going_global.pdf
tags:
- attack.execution
- attack.t1059.001
- attack.command-and-control
- attack.t1071.004
- attack.t1572
- attack.impact
- attack.t1529
- attack.g0091
- attack.s0363
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  empire:
    ScriptBlockText|contains|all:
    - System.Diagnostics.Process
    - Stop-Computer
    - Restart-Computer
    - Exception in execution
    - $cmdargs
    - Close-Dnscat2Tunnel
  dnscat:
    ScriptBlockText|contains|all:
    - set type=$LookupType`nserver
    - $Command | nslookup 2>&1 | Out-String
    - New-RandomDNSField
    - '[Convert]::ToString($SYNOptions, 16)'
    - $Session.Dead = $True
    - $Session["Driver"] -eq
  condition: empire and dnscat
