technique_id: T1548.003
technique_name: Linux Doas Tool Execution
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
  as lastTime from datamodel=Endpoint.Processes where Processes.process_name = "doas"
  by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `linux_doas_tool_execution_filter`'
explanation: The following analytic detects the execution of the 'doas' tool on a
  Linux host. This tool allows standard users to perform tasks with root privileges,
  similar to 'sudo'. The detection leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on process names and command-line executions. This activity
  is significant as 'doas' can be exploited by adversaries to gain elevated privileges
  on a compromised host. If confirmed malicious, this could lead to unauthorized administrative
  access, potentially compromising the entire system.
