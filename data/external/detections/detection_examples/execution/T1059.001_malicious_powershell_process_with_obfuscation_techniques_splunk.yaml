technique_id: T1059.001
technique_name: Malicious PowerShell Process With Obfuscation Techniques
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '| tstats `security_content_summariesonly` count values(Processes.process)
  as process values(Processes.parent_process) as parent_process min(_time) as firstTime
  max(_time) as lastTime from datamodel=Endpoint.Processes where `process_powershell`
  by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
  Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
  Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
  Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
  Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product
  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`|
  eval num_obfuscation = (mvcount(split(process,"`"))-1) + (mvcount(split(process,
  "^"))-1) + (mvcount(split(process, "''"))-1) | `malicious_powershell_process_with_obfuscation_techniques_filter`
  | search num_obfuscation > 10'
explanation: The following analytic detects PowerShell processes launched with command-line
  arguments indicative of obfuscation techniques. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on process names, parent processes,
  and complete command-line executions. This activity is significant because obfuscated
  PowerShell commands are often used by attackers to evade detection and execute malicious
  scripts. If confirmed malicious, this activity could lead to unauthorized code execution,
  privilege escalation, or persistent access within the environment, posing a significant
  security risk.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/cde75cf6-3c7a-4dd6-af01-27cdb4511fd4/
indicators:
- type: data_source
  value: Sysmon EventID 1
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: These characters might be legitimately on the command-line, but it
    is not common.
  mitigation: Review context and user activity
validation:
  test_available: true
  test_count: 1
  test_data_url: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/obfuscated_powershell/windows-sysmon.log
