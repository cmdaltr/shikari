technique_id: T1059.004
technique_name: Potential Upgrade of Non-interactive Shell
tactic: execution
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\") and\n\
  \  (\n    (process.name == \"stty\" and process.args == \"raw\" and process.args\
  \ == \"-echo\" and process.args_count >= 3) or\n    (process.name == \"script\"\
  \ and process.args in (\"-qc\", \"-c\") and process.args == \"/dev/null\" and\n\
  \    process.args_count == 4)\n  )"
explanation: 'Identifies when a non-interactive terminal (tty) is being upgraded to
  a fully interactive shell. Attackers may upgrade a

  simple reverse shell to a fully interactive tty after obtaining initial access to
  a host, in order to obtain a more

  stable connection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/84d1f8db-207f-45ab-a578-921d91c23eb2.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Crowdstrike
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - System administrators or legitimate users may use stty or script commands for
    routine maintenance or troubleshooting, which can trigger the rule. To manage
    this, create exceptions for known user accounts or specific maintenance windows.

    - Automated scripts or cron jobs that utilize stty or script for legitimate purposes
    might be flagged. Review these scripts and whitelist them by process hash or command
    line pattern to prevent false positives.

    - Development environment'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
