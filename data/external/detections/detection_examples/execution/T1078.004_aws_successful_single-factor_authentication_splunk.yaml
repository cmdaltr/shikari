technique_id: T1078.004
technique_name: AWS Successful Single-Factor Authentication
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`cloudtrail` eventName= ConsoleLogin errorCode=success "additionalEventData.MFAUsed"=No
  | rename user_name as user | stats count min(_time) as firstTime max(_time) as lastTime
  by signature dest user user_agent src vendor_account vendor_region vendor_product
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `aws_successful_single_factor_authentication_filter`'
explanation: The following analytic identifies a successful Console Login authentication
  event for an AWS IAM user account without Multi-Factor Authentication (MFA) enabled.
  It leverages AWS CloudTrail logs to detect instances where MFA was not used during
  login. This activity is significant as it may indicate a misconfiguration, policy
  violation, or potential account takeover attempt. If confirmed malicious, an attacker
  could gain unauthorized access to the AWS environment, potentially leading to data
  exfiltration, resource manipulation, or further privilege escalation.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/a520b1fe-cc9e-4f56-b762-18354594c52f/
indicators:
- type: data_source
  value: AWS CloudTrail ConsoleLogin
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: It is possible that some accounts do not have MFA enabled for the AWS
    account however its agaisnt the best practices of securing AWS.
  mitigation: Review context and user activity
references:
- https://attack.mitre.org/techniques/T1621/
- https://attack.mitre.org/techniques/T1078/004/
- https://aws.amazon.com/what-is/mfa/
validation:
