technique_id: T1005
technique_name: ESXi VM Exported via Remote Tool
tactic: execution
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`esxi_syslog` Message="*File download from path*" Message="*was initiated
  from*" | rex field=_raw "from path ''\[(?<Datastore>[^\]]+)\](?<VMPath>[^'']+)''"
  | rex field=_raw "initiated from ''(?<InitiatorTool>[^/]+)/(?<ToolVersion>[^@]+)@(?<InitiatorIP>\d{1,3}(?:\.\d{1,3}){3})''"
  | rex field=_raw "Z (?<dest>[\w\.]+)\s" | stats min(_time) as firstTime max(_time)
  as lastTime count by Datastore VMPath InitiatorTool ToolVersion InitiatorIP dest
  | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `esxi_vm_exported_via_remote_tool_filter`'
explanation: This detection identifies the use of a remote tool to download virtual
  machine disk files from a datastore. The NFC protocol is used by management tools
  to transfer files to and from ESXi hosts, but it can also be abused by attackers
  or insiders to exfiltrate full virtual disk images
source: Splunk Security Content
source_url: https://research.splunk.com/detections/2e155547-aaac-49d3-b0ef-ceabc31fd364/
indicators:
- type: data_source
  value: VMWare ESXi Syslog
  confidence: high
- type: risk_system
  value: dest
  confidence: high
false_positives:
- description: Administrators may use this command when troubleshooting. Tune as needed.
  mitigation: Review context and user activity
validation:
