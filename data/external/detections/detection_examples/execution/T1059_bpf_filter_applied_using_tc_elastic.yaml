technique_id: T1059
technique_name: BPF filter applied using TC
tactic: execution
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'process where host.os.type == "linux" and event.type == "start" and process.executable
  == "/usr/sbin/tc" and

  process.args == "filter" and process.args == "add" and process.args == "bpf" and

  not process.parent.executable == "/usr/sbin/libvirtd"'
explanation: 'Detects when the tc (transmission control) binary is utilized to set
  a BPF (Berkeley Packet Filter) on a network

  interface. Tc is used to configure Traffic Control in the Linux kernel. It can shape,
  schedule, police and drop traffic.

  A threat actor can utilize tc to set a bpf filter on an interface for the purpose
  of manipulating the incoming traffic.

  This technique is not at all common and should indicate abnormal, suspicious or
  malicious activity.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ef04a476-07ec-48fc-8f3d-5e1742de76d3.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'false positive.

    - Investigate the parent process of the `tc` command to determine if it is a known
    legitimate process or if it appears suspicious, especially since the rule excludes
    `/usr/sbin/libvirtd`.

    - Check the user account associated with the process execution to assess if it
    is a privileged account and whether the activity aligns with the user''s typical
    behavior.

    - Analyze network traffic logs around the time of the alert to identify any unusual
    patterns or connections that may indicate m'
  mitigation: Review investigation guide for details
references:
