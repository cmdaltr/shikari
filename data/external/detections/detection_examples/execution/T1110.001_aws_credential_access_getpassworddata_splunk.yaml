technique_id: T1110.001
technique_name: AWS Credential Access GetPasswordData
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`cloudtrail` eventName=GetPasswordData eventSource = ec2.amazonaws.com | bin
  _time span=5m | rename user_name as user | stats count min(_time) as firstTime max(_time)
  as lastTime dc(requestParameters.instanceId) as distinct_instance_ids by signature
  dest user user_agent src vendor_account vendor_region vendor_product |  where distinct_instance_ids
  > 10 | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `aws_credential_access_getpassworddata_filter`'
explanation: The following analytic identifies more than 10 GetPasswordData API calls
  within a 5-minute window in your AWS account. It leverages AWS CloudTrail logs to
  detect this activity by counting the distinct instance IDs accessed. This behavior
  is significant as it may indicate an attempt to retrieve encrypted administrator
  passwords for running Windows instances, which is a critical security concern. If
  confirmed malicious, attackers could gain unauthorized access to administrative
  credentials, potentially leading to full control over the affected instances and
  further compromise of the AWS environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/4d347c4a-306e-41db-8d10-b46baf71b3e2/
indicators:
- type: data_source
  value: AWS CloudTrail GetPasswordData
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Administrator tooling or automated scripts may make these calls but
    it is highly unlikely to make several calls in a short period of time.
  mitigation: Review context and user activity
references:
