technique_id: T1552.004
technique_name: Linux Auditd Find Ssh Private Keys
tactic: execution
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`linux_auditd` execve_command IN ("*find*", "*grep*") AND execve_command IN
  ("*id_rsa*", "*id_dsa*", "*.key*", "*ssh_key*", "*authorized_keys*") | rename host
  as dest | rename comm as process_name | rename exe as process | stats count min(_time)
  as firstTime max(_time) as lastTime by argc execve_command dest | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `linux_auditd_find_ssh_private_keys_filter`'
explanation: The following analytic detects suspicious attempts to find SSH private
  keys, which may indicate an attacker's effort to compromise secure access to systems.
  SSH private keys are essential for secure authentication, and unauthorized access
  to these keys can enable attackers to gain unauthorized access to servers and other
  critical infrastructure. By monitoring for unusual or unauthorized searches for
  SSH private keys, this analytic helps identify potential threats to network security,
  allowing security teams to quickly respond and safeguard against unauthorized access
  and potential breaches.
