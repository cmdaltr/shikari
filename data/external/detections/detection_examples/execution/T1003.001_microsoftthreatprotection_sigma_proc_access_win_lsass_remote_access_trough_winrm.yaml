technique_id: T1003.001
technique_name: Remote LSASS Process Access Through Windows Remote Management
tactic: execution
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: aa35a627-33fb-4d04-a165-d33b4afca3e8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_access:\n  GrantedAccess: '0x80000000'\nselection:\n\
  \  SourceImage|endswith: :\\Windows\\system32\\wsmprovhost.exe\n  TargetImage|endswith:\
  \ \\lsass.exe\n"
explanation: Detects remote access to the LSASS process via WinRM. This could be a
  sign of credential dumping from tools like mimikatz.
false_positives:
- Unlikely
references:
- https://pentestlab.blog/2018/05/15/lateral-movement-winrm/
tags:
