    \ response process based on the outcome of the triage.\n- Identify the possible\
    \ impact of the incident and prioritize accordingly; the following actions can\
    \ help you gain context:\n    - Identify the accou"
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
has_investigation_guide: true
