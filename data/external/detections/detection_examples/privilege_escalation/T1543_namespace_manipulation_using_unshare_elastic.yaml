technique_id: T1543
technique_name: Namespace Manipulation Using Unshare
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: 'process where host.os.type == "linux" and event.type == "start" and event.action
  : ("exec", "exec_event", "start") and

  process.executable: "/usr/bin/unshare" and

  not process.parent.executable: ("/usr/bin/udevadm", "*/lib/systemd/systemd-udevd",
  "/usr/bin/unshare") and

  not process.args == "/usr/bin/snap" and not process.parent.name in ("zz-proxmox-boot",
  "java")'
explanation: 'Identifies suspicious usage of unshare to manipulate system namespaces.
  Unshare can be utilized to escalate privileges

  or escape container security boundaries. Threat actors have utilized this binary
  to allow themselves to escape to the

  host and access other resources or escalate privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d00f33e7-b57d-4023-9952-2db91b1767c4.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - System management tools like udevadm and systemd-udevd may invoke unshare as
    part of their normal operations. These should be excluded by ensuring the rule
    filters out processes with these as parent executables.

    - Snap package management can trigger unshare during its operations. Exclude processes
    where the arguments include /usr/bin/snap to prevent unnecessary alerts.

    - Java applications might occasionally use unshare for legitimate purposes. Exclude
    processes with ja'
  mitigation: Review investigation guide for details
references:
- https://man7.org/linux/man-pages/man1/unshare.1.html
- https://www.crowdstrike.com/blog/cve-2022-0185-kubernetes-container-escape-using-linux-kernel-exploit/
has_investigation_guide: true
risk_score: 47
