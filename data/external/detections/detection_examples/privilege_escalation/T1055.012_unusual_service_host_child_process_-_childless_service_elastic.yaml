false_positives:
- description: 'false positives listed in the query to rule out benign activities.

    - Utilize threat intelligence sources to determine if the child process or its
    executable path is associated with known malware or attack patterns.


    ### False positive analysis


    - Processes like WerFault.exe, WerFaultSecure.exe, and wermgr.exe are known to
    be legitimate Windows error reporting tools that may occasionally be spawned by
    svchost.exe. To handle these, add them to the exclusion list in the detection
    rule to prevent un'
  mitigation: Review investigation guide for details
