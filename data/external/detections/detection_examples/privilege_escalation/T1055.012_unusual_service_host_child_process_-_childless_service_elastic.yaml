technique_id: T1055.012
technique_name: Unusual Service Host Child Process - Childless Service
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : \"svchost.exe\" and\n\n  /* based on svchost service arguments\
  \ -s svcname where the service is known to be childless */\n  process.parent.args\
  \ : (\n    \"WdiSystemHost\", \"LicenseManager\", \"StorSvc\", \"CDPSvc\", \"cdbhsvc\"\
  , \"BthAvctpSvc\", \"SstpSvc\", \"WdiServiceHost\",\n    \"imgsvc\", \"TrkWks\"\
  , \"WpnService\", \"IKEEXT\", \"PolicyAgent\", \"CryptSvc\", \"netprofm\", \"ProfSvc\"\
  , \"StateRepository\",\n    \"camsvc\", \"LanmanWorkstation\", \"NlaSvc\", \"EventLog\"\
  , \"hidserv\", \"DisplayEnhancementService\", \"ShellHWDetection\",\n    \"AppHostSvc\"\
  , \"fhsvc\", \"CscService\", \"PushToInstall\"\n  ) and\n\n  /* unknown FPs can\
  \ be added here */\n  not process.name : (\"WerFault.exe\", \"WerFaultSecure.exe\"\
  , \"wermgr.exe\") and\n  not (process.executable : \"?:\\\\Windows\\\\System32\\\
  \\RelPost.exe\" and process.parent.args : \"WdiSystemHost\") and\n  not (\n    process.name\
  \ : \"rundll32.exe\" and\n    process.args : \"?:\\\\WINDOWS\\\\System32\\\\winethc.dll,ForceProxyDetectionOnNextRun\"\
  \ and\n    process.parent.args : \"WdiServiceHost\"\n  ) and\n  not (\n    process.executable\
  \ : (\n      \"?:\\\\Program Files\\\\*\",\n      \"?:\\\\Program Files (x86)\\\\\
  *\",\n      \"?:\\\\Windows\\\\System32\\\\Kodak\\\\kds_?????\\\\lib\\\\lexexe.exe\"\
  \n    ) and process.parent.args : \"imgsvc\"\n  )"
explanation: 'Identifies unusual child processes of Service Host (svchost.exe) that
  traditionally do not spawn any child processes.

  This may indicate a code injection or an equivalent form of exploitation.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/6a8ab9cc-4023-4d17-b5df-1a3e16882ce7.toml
query_type: eql
query_language: eql
