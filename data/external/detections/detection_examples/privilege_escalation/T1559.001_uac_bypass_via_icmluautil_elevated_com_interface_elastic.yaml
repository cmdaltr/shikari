technique_name: UAC Bypass via ICMLuaUtil Elevated COM Interface
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.name == \"dllhost.exe\" and\n process.parent.args in (\"/Processid:{3E5FC7F9-9A51-4367-9063-A120244FBEC7}\"\
  , \"/Processid:{D2E7041B-2927-42FB-8E9F-7CE93B6DC937}\") and\n process.pe.original_file_name\
  \ != \"WerFault.exe\""
explanation: 'Identifies User Account Control (UAC) bypass attempts via the ICMLuaUtil
  Elevated COM interface. Attackers may attempt

  to bypass UAC to stealthily execute code with elevated permissions.'
