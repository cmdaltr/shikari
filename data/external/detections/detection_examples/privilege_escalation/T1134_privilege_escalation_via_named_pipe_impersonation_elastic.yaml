technique_id: T1134
technique_name: Privilege Escalation via Named Pipe Impersonation
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (process.name : (\"Cmd.Exe\", \"PowerShell.EXE\") or ?process.pe.original_file_name\
  \ in (\"Cmd.Exe\", \"PowerShell.EXE\")) and\n process.args : \"echo\" and process.args\
  \ : \">\" and process.args : \"\\\\\\\\.\\\\pipe\\\\*\""
explanation: 'Identifies a privilege escalation attempt via named pipe impersonation.
  An adversary may abuse this technique by

  utilizing a framework such Metasploit''s meterpreter getsystem command.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3ecbdc9e-e4f2-43fa-8cca-63802125e582.toml
