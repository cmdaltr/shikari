technique_id: T1053
technique_name: Scheduled Task Execution at Scale via GPO
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "any where host.os.type == \"windows\" and event.code in (\"5136\", \"5145\"\
  ) and\n(\n  (\n    winlog.event_data.AttributeLDAPDisplayName : (\n      \"gPCMachineExtensionNames\"\
  ,\n      \"gPCUserExtensionNames\"\n    ) and\n    winlog.event_data.AttributeValue\
  \ : \"*CAB54552-DEEA-4691-817E-ED4A4D1AFC72*\" and\n    winlog.event_data.AttributeValue\
  \ : \"*AADCED64-746C-4633-A97C-D61349046527*\"\n  ) or\n  (\n    winlog.event_data.ShareName\
  \ : \"\\\\\\\\*\\\\SYSVOL\" and\n    winlog.event_data.RelativeTargetName : \"*ScheduledTasks.xml\"\
  \ and\n    winlog.event_data.AccessList:\"*%%4417*\"\n  )\n)"
explanation: 'Detects the modification of Group Policy Object attributes to execute
  a scheduled task in the objects controlled by the

  GPO.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/15a8ba77-1c13-4274-88fe-6bd14133861e.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
