  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate use of tar, rsync, or zip with wildcard-related flags in automated
    scripts or backup processes can trigger false positives. Review the context of
    these processes and consider excluding specific scripts or directories from monitoring
    if they are verified as safe.

    - System administrators or maintenance scripts may use shell commands following
    tar, rsync, or zip for legitimate purposes. Identify these routine operations
    and create exceptions for known safe pare'
  mitigation: Review investigation guide for details
references:
- https://www.exploit-db.com/papers/33930
has_investigation_guide: true
