technique_id: T1068
technique_name: Potential Shell via Wildcard Injection Detected
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id with maxspan=1s\n  [process where host.os.type == \"linux\"\
  \ and event.type == \"start\" and event.action in (\"exec\", \"start\", \"ProcessRollup2\"\
  ) and (\n    (process.name == \"tar\" and process.args : \"--checkpoint=*\" and\
  \ process.args : \"--checkpoint-action=*\") or\n    (process.name == \"rsync\" and\
  \ process.args : \"-e*\") or\n    (process.name == \"zip\" and process.args == \"\
  --unzip-command\")\n   ) and not process.executable : \"/tmp/newroot/*\"\n  ]  by\
  \ process.entity_id\n  [process where host.os.type == \"linux\" and event.type ==\
  \ \"start\" and event.action in (\"exec\", \"start\", \"ProcessRollup2\") and\n\
  \     process.parent.name : (\"tar\", \"rsync\", \"zip\") and\n     process.name\
  \ : (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\")\n\
  \  ] by process.parent.entity_id"
explanation: 'This rule monitors for the execution of a set of linux binaries, that
  are potentially vulnerable to wildcard injection,

  with suspicious command line flags followed by a shell spawn event. Linux wildcard
  injection is a type of security

  vulnerability where attackers manipulate commands or input containing wildcards
  (e.g., *, ?, []) to execute unintended

  operations or access sensitive data by tricking the system into interpreting the
  wildcard characters in unexpected ways.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0b803267-74c5-444d-ae29-32b5db2d562a.toml
query_type: eql
query_language: eql
