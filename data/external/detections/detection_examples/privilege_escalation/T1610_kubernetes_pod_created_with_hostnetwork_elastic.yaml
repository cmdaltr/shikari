technique_id: T1610
technique_name: Kubernetes Pod Created With HostNetwork
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset : \"kubernetes.audit_logs\"\n  and kubernetes.audit.annotations.authorization_k8s_io/decision:\"\
  allow\"\n  and kubernetes.audit.objectRef.resource:\"pods\"\n  and kubernetes.audit.verb:(\"\
  create\" or \"update\" or \"patch\")\n  and kubernetes.audit.requestObject.spec.hostNetwork:true\n\
  \  and not kubernetes.audit.requestObject.spec.containers.image: (\"docker.elastic.co/beats/elastic-agent:8.4.0\"\
  )"
explanation: 'This rules detects an attempt to create or modify a pod attached to
  the host network. HostNetwork allows a pod to use

  the node network namespace. Doing so gives the pod access to any service running
  on localhost of the host. An attacker

  could use this access to snoop on network activity of other pods on the same node
  or bypass restrictive network policies

  applied to its given namespace.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/12cbf709-69e8-4055-94f9-24314385c27e.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Kubernetes
  confidence: high
false_positives:
- description: 'False positive analysis


    - Pods used for monitoring or logging may require HostNetwork access to gather
    network data across nodes. Users can exclude these by adding their specific container
    images to the exception list in the detection rule.

    - Certain system-level services or infrastructure components might need HostNetwork
    for legitimate reasons, such as network plugins or ingress controllers. Identify
    these services and update the rule to exclude their specific images or namespaces.

    - Developm'
  mitigation: Review investigation guide for details
references:
- https://research.nccgroup.com/2021/11/10/detection-engineering-for-kubernetes-clusters/#part3-kubernetes-detections
- https://kubernetes.io/docs/concepts/security/pod-security-policy/#host-namespaces
- https://bishopfox.com/blog/kubernetes-pod-privilege-escalation
has_investigation_guide: true
risk_score: 47
