technique_id: T1068
technique_name: Sudo Heap-Based Buffer Overflow Attempt
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and event.type:start and\n  process.name:(sudo or sudoedit)\
  \ and\n  process.args:(*\\\\ and (\"-i\" or \"-s\"))"
explanation: 'Identifies the attempted use of a heap-based buffer overflow vulnerability
  for the Sudo binary in Unix-like systems

  (CVE-2021-3156). Successful exploitation allows an unprivileged user to escalate
  to the root user.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f37f3054-d40b-49ac-aa9b-a786c74c58b8.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks using sudo or sudoedit with interactive or shell
    options may trigger the rule. Review the context of these commands and consider
    excluding specific user accounts or scripts that are known to perform legitimate
    administrative functions.

    - Automated scripts or cron jobs that use sudo with the -i or -s options for legitimate
    purposes can be flagged. Identify these scripts and add them to an exception list
    to prevent unnecessary alerts.

    - Devel'
  mitigation: Review investigation guide for details
references:
- https://cve.mitre.org/cgi-bin/cvename.cgi?name=2021-3156
- https://blog.qualys.com/vulnerabilities-research/2021/01/26/cve-2021-3156-heap-based-buffer-overflow-in-sudo-baron-samedit
- https://www.bleepingcomputer.com/news/security/latest-macos-big-sur-also-has-sudo-root-privilege-escalation-flaw
- https://www.sudo.ws/alerts/unescape_overflow.html
has_investigation_guide: true
risk_score: 73
