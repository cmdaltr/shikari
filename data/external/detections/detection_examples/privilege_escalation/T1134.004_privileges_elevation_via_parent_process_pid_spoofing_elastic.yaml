technique_id: T1134.004
technique_name: Privileges Elevation via Parent Process PID Spoofing
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "/* This rule is compatible with Elastic Endpoint only */\n\nprocess where\
  \ host.os.type == \"windows\" and event.action == \"start\" and\n\n /* process creation\
  \ via seclogon */\n process.parent.Ext.real.pid > 0 and\n\n /* PrivEsc to SYSTEM\
  \ */\n user.id : \"S-1-5-18\"  and\n\n /* Common FPs - evasion via hollowing is\
  \ possible, should be covered by code injection */\n not process.executable : (\"\
  ?:\\\\Windows\\\\System32\\\\WerFault.exe\",\n                           \"?:\\\\\
  Windows\\\\SysWOW64\\\\WerFault.exe\",\n                           \"?:\\\\Windows\\\
  \\System32\\\\WerFaultSecure.exe\",\n                           \"?:\\\\Windows\\\
  \\SysWOW64\\\\WerFaultSecure.exe\",\n                           \"?:\\\\Windows\\\
  \\System32\\\\Wermgr.exe\",\n                           \"?:\\\\Windows\\\\SysWOW64\\\
  \\Wermgr.exe\",\n                           \"?:\\\\Windows\\\\SoftwareDistribution\\\
  \\Download\\\\Install\\\\securityhealthsetup.exe\") and\n /* Logon Utilities */\n\
  \ not (process.parent.executable : \"?:\\\\Windows\\\\System32\\\\Utilman.exe\"\
  \ and\n     process.executable : (\"?:\\\\Windows\\\\System32\\\\osk.exe\",\n  \
  \                         \"?:\\\\Windows\\\\System32\\\\Narrator.exe\",\n     \
  \                      \"?:\\\\Windows\\\\System32\\\\Magnify.exe\")) and\n\n not\
  \ process.parent.executable : \"?:\\\\Windows\\\\System32\\\\AtBroker.exe\" and\n\
  \n not (process.code_signature.subject_name in\n           (\"philandro Software\
  \ GmbH\", \"Freedom Scientific Inc.\", \"TeamViewer Germany GmbH\", \"Projector.is,\
  \ Inc.\",\n            \"TeamViewer GmbH\", \"Cisco WebEx LLC\", \"Dell Inc\") and\
  \ process.code_signature.trusted == true) and\n\n /* AM_Delta_Patch Windows Update\
  \ */\n not (process.executable : (\"?:\\\\Windows\\\\System32\\\\MpSigStub.exe\"\
  , \"?:\\\\Windows\\\\SysWOW64\\\\MpSigStub.exe\") and\n      process.parent.executable\
  \ : (\"?:\\\\Windows\\\\System32\\\\wuauclt.exe\",\n                           \
  \        \"?:\\\\Windows\\\\SysWOW64\\\\wuauclt.exe\",\n                       \
  \            \"?:\\\\Windows\\\\UUS\\\\Packages\\\\Preview\\\\*\\\\wuaucltcore.exe\"\
  ,\n                                   \"?:\\\\Windows\\\\UUS\\\\amd64\\\\wuauclt.exe\"\
  ,\n                                   \"?:\\\\Windows\\\\UUS\\\\amd64\\\\wuaucltcore.exe\"\
  ,\n                                   \"?:\\\\ProgramData\\\\Microsoft\\\\Windows\\\
  \\UUS\\\\*\\\\wuaucltcore.exe\")) and\n not (process.executable : (\"?:\\\\Windows\\\
  \\System32\\\\MpSigStub.exe\", \"?:\\\\Windows\\\\SysWOW64\\\\MpSigStub.exe\") and\
  \ process.parent.executable == null) and\n\n /* Other third party SW */\n not process.parent.executable\
  \ :\n                   (\"?:\\\\Program Files (x86)\\\\HEAT Software\\\\HEAT Remote\\\
  \\HEATRemoteServer.exe\",\n                    \"?:\\\\Program Files (x86)\\\\VisualCron\\\
  \\VisualCronService.exe\",\n                    \"?:\\\\Program Files\\\\BinaryDefense\\\
  \\Vision\\\\Agent\\\\bds-vision-agent-app.exe\",\n                    \"?:\\\\Program\
  \ Files\\\\Tablet\\\\Wacom\\\\WacomHost.exe\",\n                    \"?:\\\\Program\
  \ Files (x86)\\\\LogMeIn\\\\x64\\\\LogMeIn.exe\",\n                    \"?:\\\\\
  Program Files (x86)\\\\EMC Captiva\\\\Captiva Cloud Runtime\\\\Emc.Captiva.WebCaptureRunner.exe\"\
  ,\n                    \"?:\\\\Program Files\\\\Freedom Scientific\\\\*.exe\",\n\
  \                    \"?:\\\\Program Files (x86)\\\\Google\\\\Chrome Remote Desktop\\\
  \\*\\\\remoting_host.exe\",\n                    \"?:\\\\Program Files (x86)\\\\\
  GoToAssist Remote Support Customer\\\\*\\\\g2ax_comm_customer.exe\") and\n not (\n\
  \    process.code_signature.trusted == true and process.code_signature.subject_name\
  \ == \"Netwrix Corporation\" and\n    process.name : \"adcrcpy.exe\" and process.parent.executable\
  \ : (\n      \"?:\\\\Program Files (x86)\\\\Netwrix Auditor\\\\Active Directory\
  \ Auditing\\\\Netwrix.ADA.EventCollector.exe\",\n      \"?:\\\\Program Files (x86)\\\
  \\Netwrix Auditor\\\\Active Directory Auditing\\\\Netwrix.ADA.Analyzer.exe\",\n\
  \      \"?:\\\\Netwrix Auditor\\\\Active Directory Auditing\\\\Netwrix.ADA.EventCollector.exe\"\
  \n    )\n )"
explanation: 'Identifies parent process spoofing used to create an elevated child
  process. Adversaries may spoof the parent process

  identifier (PPID) of a new process to evade process-monitoring defenses or to elevate
  privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/26b01043-4f04-4d2f-882a-5a1d2e95751b.toml
query_type: eql
query_language: eql
