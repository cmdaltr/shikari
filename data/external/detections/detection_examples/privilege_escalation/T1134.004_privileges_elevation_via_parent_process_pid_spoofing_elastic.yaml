  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Processes related to Windows Error Reporting such as WerFault.exe and Wermgr.exe
    can trigger false positives. These are legitimate system processes and can be
    excluded by verifying their signatures and paths.

    - Logon utilities like Utilman.exe spawning processes such as osk.exe, Narrator.exe,
    or Magnify.exe may appear suspicious but are often legitimate. Exclude these by
    confirming their usage context and ensuring they are executed by trusted users.

    - Third-party softw'
  mitigation: Review investigation guide for details
