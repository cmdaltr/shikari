technique_id: T1134.002
technique_name: Process Creation via Secondary Logon
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by winlog.computer_name with maxspan=1m\n\n[authentication where\
  \ event.action:\"logged-in\" and\n event.outcome == \"success\" and user.id : (\"\
  S-1-5-21-*\", \"S-1-12-1-*\") and\n\n /* seclogon service */\n process.name == \"\
  svchost.exe\" and\n winlog.event_data.LogonProcessName : \"seclogo*\" and source.ip\
  \ == \"::1\" ] by winlog.event_data.TargetLogonId\n\n[process where event.type ==\
  \ \"start\"] by winlog.event_data.TargetLogonId"
explanation: 'Identifies process creation with alternate credentials. Adversaries
  may create a new process with a different token to

  escalate privileges and bypass access controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/42eeee3d-947f-46d3-a14d-7036b962c266.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tasks using the Secondary Logon service can trigger
    alerts. To manage this, identify and whitelist specific administrative accounts
    or tasks that frequently use this service for legitimate purposes.

    - Scheduled tasks or automated scripts that use alternate credentials for routine
    operations may cause false positives. Review and exclude these tasks by creating
    exceptions for known scripts or scheduled jobs.

    - Internal IT support activities ofte'
  mitigation: Review investigation guide for details
references:
- https://attack.mitre.org/techniques/T1134/002/
has_investigation_guide: true
risk_score: 47
