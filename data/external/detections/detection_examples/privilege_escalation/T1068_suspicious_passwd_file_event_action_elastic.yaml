technique_id: T1068
technique_name: Suspicious Passwd File Event Action
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.91
validated: true
query: "sequence by host.id, process.parent.pid with maxspan=1m\n  [process where\
  \ host.os.type == \"linux\" and event.type == \"start\" and event.action == \"exec\"\
  \ and\n   process.name == \"openssl\" and process.args == \"passwd\" and user.id\
  \ != \"0\"]\n  [file where host.os.type == \"linux\" and file.path == \"/etc/passwd\"\
  \ and process.parent.pid != 1 and\n   not auditd.data.a2 == \"80000\" and event.outcome\
  \ == \"success\" and user.id != \"0\"]"
explanation: 'Monitors for the generation of a passwd password entry via openssl,
  followed by a file write activity on the

  "/etc/passwd" file. The "/etc/passwd" file in Linux stores user account information,
  including usernames, user IDs,

  group IDs, home directories, and default shell paths. Attackers may exploit a misconfiguration
  in the "/etc/passwd" file

  permissions or other privileges to add a new entry to the "/etc/passwd" file with
  root permissions, and leverage this

  new user account to login as root.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/71d6a53d-abbd-40df-afee-c21fff6aafb0.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Auditd Manager
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - System administrators or automated scripts may use openssl to manage user passwords
    without malicious intent. To handle this, identify and whitelist known administrative
    scripts or processes that perform legitimate password management tasks.

    - Some legitimate software installations or updates might temporarily modify the
    /etc/passwd file. Monitor and document these activities to distinguish them from
    unauthorized changes, and consider creating exceptions for known soft'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
