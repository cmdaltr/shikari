technique_id: T1098
technique_name: AWS IAM AdministratorAccess Policy Attached to Group
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "iam where event.dataset == \"aws.cloudtrail\"\n   and event.provider == \"\
  iam.amazonaws.com\"\n   and event.action == \"AttachGroupPolicy\"\n   and event.outcome\
  \ == \"success\"\n   and stringContains(aws.cloudtrail.request_parameters, \"policyArn=arn:aws:iam::aws:policy/AdministratorAccess\"\
  )"
explanation: 'An adversary with access to a set of compromised credentials may attempt
  to persist or escalate privileges by attaching

  additional permissions to user groups the compromised user account belongs to. This
  rule looks for use of the IAM

  AttachGroupPolicy API operation to attach the highly permissive AdministratorAccess
  AWS managed policy to an existing

  IAM user group.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/df919b5e-a0f6-4fd8-8598-e3ce79299e3b.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS IAM
  confidence: high
false_positives:
- description: "False positive analysis\n\n- **Intentional access updates.**  \n \
    \ Policy attachment may occur during legitimate administrative provisioning. Confirm\
    \ via ticketing systems.  \n- **Automation or compliance tasks.**  \n  Some environments\
    \ use centralized scripts to attach AdministratorAccess temporarily. Validate\
    \ through automation logs.  \n\n### Response and remediation\n\n**1. Immediate\
    \ containment**\n- Detach the policy from the affected group (`aws iam detach-group-policy`).\
    \  \n- Review and limit group me"
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_AttachGroupPolicy.html
- https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AdministratorAccess.html
- https://hackingthe.cloud/aws/exploitation/iam_privilege_escalation/
has_investigation_guide: true
risk_score: 47
