technique_id: T1098
technique_name: Azure RBAC Built-In Administrator Roles Assigned
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset: azure.activitylogs and\n    event.action: \"MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE\"\
  \ and\n    azure.activitylogs.properties.requestbody.properties.roleDefinitionId:\n\
  \    (\n      *18d7d88d-d35e-4fb5-a5c3-7773c20a72d9* or\n      *f58310d9-a9f6-439a-9e8d-f62e7b41a168*\
  \ or\n      *b24988ac-6180-42a0-ab88-20f7382dd24c* or\n      *8e3af657-a8ff-443c-a75c-2fe8c4bcb635*\
  \ or\n      *92b92042-07d9-4307-87f7-36a593fc5850* or\n      *a8889054-8d42-49c9-bc1c-52486c10e7cd*\n\
  \  )"
explanation: Identifies when a user is assigned a built-in administrator role in Azure
  RBAC (Role-Based Access Control). These roles provide significant privileges and
  can be abused by attackers for lateral movement, persistence, or privilege escalation.
  The privileged built-in administrator roles include Owner, Contributor, User Access
  Administrator, Azure File Sync Administrator, Reservations Administrator, and Role
  Based Access Control Administrator.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1a1046f4-9257-11f0-9a42-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Azure Activity Logs
  confidence: high
false_positives:
- description: "False positive analysis\n\n- Legitimate administrators may assign\
    \ built-in administrator roles during routine operations, maintenance or as required\
    \ for onboarding new staff.\n- Review internal tickets, change logs, or admin\
    \ activity dashboards for approved operations.\n\n### Response and remediation\n\
    \n- If administrative assignment was not authorized:\n  - Immediately remove the\
    \ built-in administrator role from the account.\n  - Disable or lock the account\
    \ and begin credential rotation.\n  - Audit activ"
  mitigation: Review investigation guide for details
references:
- https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
- https://orca.security/resources/research-pod/azure-identity-access-management-iam-active-directory-ad/
- https://www.microsoft.com/en-us/security/blog/2025/08/27/storm-0501s-evolving-techniques-lead-to-cloud-based-ransomware/
