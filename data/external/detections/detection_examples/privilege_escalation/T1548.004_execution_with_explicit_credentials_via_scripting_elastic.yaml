technique_id: T1548.004
technique_name: Execution with Explicit Credentials via Scripting
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n process.name == \"security_authtrampoline\" and\n process.parent.name like~\
  \ (\"osascript\", \"com.apple.automator.runner\", \"sh\", \"bash\", \"dash\", \"\
  zsh\", \"python*\", \"perl*\", \"php*\", \"ruby\", \"pwsh\")"
explanation: 'Identifies execution of the security_authtrampoline process via a scripting
  interpreter. This occurs when programs use

  AuthorizationExecute-WithPrivileges from the Security.framework to run another program
  with root privileges. It should

  not be run by itself, as this is a sign of execution with explicit logon credentials.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f0eb70e9-71e9-40cd-813f-bf8e8c812cb1.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tasks using scripting languages may trigger this rule.
    Users should review the context of the script execution to determine if it aligns
    with expected administrative activities.

    - Automated scripts or scheduled tasks that require elevated privileges might
    be flagged. Consider creating exceptions for known scripts by specifying their
    hash or path in the monitoring system.

    - Development or testing environments where developers frequently use scr'
  mitigation: Review investigation guide for details
references:
- https://objectivebythesea.com/v2/talks/OBTS_v2_Thomas.pdf
- https://www.manpagez.com/man/8/security_authtrampoline/
has_investigation_guide: true
risk_score: 47
