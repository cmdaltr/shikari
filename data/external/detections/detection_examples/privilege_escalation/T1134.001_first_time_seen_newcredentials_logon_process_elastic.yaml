technique_id: T1134.001
technique_name: First Time Seen NewCredentials Logon Process
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.category:\"authentication\" and host.os.type:\"windows\" and winlog.logon.type:\"\
  NewCredentials\" and\n    winlog.event_data.LogonProcessName:Advapi* and\n    not\
  \ winlog.event_data.SubjectUserName:*$ and\n    not process.executable: (C\\:\\\\\
  Program*Files*\\(x86\\)\\\\*.exe or C\\:\\\\Program*Files\\\\*.exe)"
explanation: 'Identifies a new credentials logon type performed by an unusual process.
  This may indicate the existence of an access

  token forging capability that are often abused to bypass access control restrictions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e468f3f6-7c4c-45bb-846a-053738b3fe5d.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tools or scripts may trigger this rule if they use
    the NewCredentials logon type for network resource access. To manage this, identify
    and whitelist these tools by their process executable paths.

    - Scheduled tasks or automated processes running under service accounts might
    be flagged. Review these tasks and exclude them by adding exceptions for known
    service account names.

    - Software updates or installations that require elevated privileges co'
  mitigation: Review investigation guide for details
references:
- https://www.elastic.co/pt/blog/how-attackers-abuse-access-token-manipulation
has_investigation_guide: true
risk_score: 47
