technique_id: T1548.002
technique_name: Bypass UAC via Event Viewer
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : \"eventvwr.exe\" and\n  not process.executable : (\n  \
  \      \"?:\\\\Windows\\\\SysWOW64\\\\mmc.exe\",\n        \"?:\\\\Windows\\\\System32\\\
  \\mmc.exe\",\n        \"?:\\\\Windows\\\\SysWOW64\\\\WerFault.exe\",\n        \"\
  ?:\\\\Windows\\\\System32\\\\WerFault.exe\",\n\n        /* Crowdstrike specific\
  \ exclusion as it uses NT Object paths */\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\Sys?????\\\\mmc.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\\
  Windows\\\\Sys?????\\\\WerFault.exe\"\n  )"
explanation: 'Identifies User Account Control (UAC) bypass via eventvwr.exe. Attackers
  bypass UAC to stealthily execute code with

  elevated permissions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/31b4c719-f2b4-41f6-a9bd-fce93c2eaf62.toml
