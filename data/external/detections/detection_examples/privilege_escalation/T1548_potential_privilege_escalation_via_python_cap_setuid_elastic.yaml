technique_id: T1548
technique_name: Potential Privilege Escalation via Python cap_setuid
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.91
validated: true
query: "sequence by host.id, process.entity_id with maxspan=1s\n  [process where host.os.type\
  \ == \"linux\" and event.type == \"start\" and event.action == \"exec\" and\n  \
  \ process.args : \"import os;os.set?id(0);os.system(*)\" and process.args : \"*python*\"\
  \ and user.id != \"0\"]\n  [process where host.os.type == \"linux\" and event.action\
  \ in (\"uid_change\", \"gid_change\") and event.type == \"change\" and\n   (user.id\
  \ == \"0\" or group.id == \"0\")]"
explanation: 'This detection rule monitors for the execution of a system command with
  setuid or setgid capabilities via Python,

  followed by a uid or gid change to the root user. This sequence of events may indicate
  successful privilege escalation.

  Setuid (Set User ID) and setgid (Set Group ID) are Unix-like OS features that enable
  processes to run with elevated

  privileges, based on the file owner or group. Threat actors can exploit these attributes
  to escalate privileges to the

  privileges that are set on the binary that is being executed.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a0ddb77b-0318-41f0-91e4-8c1b5528834f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Development and testing environments may trigger this rule when developers use
    Python scripts to test setuid or setgid functionalities. To manage this, exclude
    specific user accounts or host IDs associated with development activities.

    - Automated scripts or maintenance tasks that require temporary privilege escalation
    might be flagged. Identify and whitelist these scripts by their process names
    or paths to prevent false positives.

    - System administrators using Python s'
  mitigation: Review investigation guide for details
has_investigation_guide: true
