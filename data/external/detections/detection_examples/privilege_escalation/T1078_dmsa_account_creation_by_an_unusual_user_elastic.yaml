technique_id: T1078
technique_name: dMSA Account Creation by an Unusual User
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.code:5137 and winlog.event_data.ObjectClass:"msDS-DelegatedManagedServiceAccount"
explanation: 'Detects the creation of a delegated Managed Service Account by an unusual
  subject account. Attackers can abuse the dMSA

  account migration feature to elevate privileges abusing weak persmission allowing
  users child objects rights or

  msDS-DelegatedManagedServiceAccount rights.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f0dbff4c-1aa7-4458-9ed5-ada472f64970.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Migration of legacy service accounts using delegated managed service account.


    ### Response and remediation


    - Immediately disable the winlog.event_data.SubjectUserName account and revert
    all changes performed by that account.

    - Identify and isolate the source machines from where the SubjectUserName is authenticating.

    - Reset passwords for all accounts that were potentially affected or had their
    permissions altered, focusing on privileged accounts to prevent adversarie'
  mitigation: Review investigation guide for details
references:
- https://www.akamai.com/blog/security-research/abusing-dmsa-for-privilege-escalation-in-active-directory
has_investigation_guide: true
risk_score: 73
