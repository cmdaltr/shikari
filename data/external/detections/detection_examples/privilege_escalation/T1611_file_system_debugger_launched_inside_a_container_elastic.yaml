technique_id: T1611
technique_name: File System Debugger Launched Inside a Container
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: 'process where host.os.type == "linux" and event.type == "start" and event.action
  == "exec" and

  process.entry_leader.entry_meta.type == "container" and process.name == "debugfs"
  and

  process.command_line like~ "/dev/sd*" and not process.args == "-R"'
explanation: 'This rule detects the use of the built-in Linux DebugFS utility from
  inside a container. DebugFS is a special

  file system debugging utility which supports reading and writing directly from a
  hard drive device. When launched inside

  a privileged container, a container deployed with all the capabilities of the host
  machine, an attacker can access

  sensitive host level files which could be used for further privilege escalation
  and container escapes to the host

  machine.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/35c029c3-090e-4a25-b613-0b8099970fc1.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance tasks using DebugFS in privileged containers can trigger
    alerts. To manage this, identify and document regular maintenance processes and
    create exceptions for these specific processes.

    - Automated scripts or tools that utilize DebugFS for legitimate monitoring or
    debugging purposes may cause false positives. Review these scripts and whitelist
    them by excluding their specific process arguments or execution contexts.

    - Development and testing environm'
  mitigation: Review investigation guide for details
references:
- https://cyberark.wistia.com/medias/ygbzkzx93q?wvideo=ygbzkzx93q
- https://book.hacktricks.xyz/linux-hardening/privilege-escalation/docker-security/docker-breakout-privilege-escalation#privileged
has_investigation_guide: true
risk_score: 47
