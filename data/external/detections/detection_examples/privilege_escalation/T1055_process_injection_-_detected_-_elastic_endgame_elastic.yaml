technique_id: T1055
technique_name: Process Injection - Detected - Elastic Endgame
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.kind:alert and event.module:endgame and endgame.metadata.type:detection
  and (event.action:kernel_shellcode_event or endgame.event_subtype_full:kernel_shellcode_event)
explanation: 'Elastic Endgame detected Process Injection. Click the Elastic Endgame
  icon in the event.module column or the link in the

  rule.reference column for additional information.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/80c52164-c82a-402c-9964-852533d58be1.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or patches may trigger process injection alerts.
    Users can create exceptions for known update processes by identifying their unique
    process names or hashes.

    - Security tools or monitoring software that use process injection for legitimate
    purposes might be flagged. Users should whitelist these tools by specifying their
    process identifiers or paths.

    - Custom scripts or automation tasks that interact with system processes could
    be misidentifie'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
