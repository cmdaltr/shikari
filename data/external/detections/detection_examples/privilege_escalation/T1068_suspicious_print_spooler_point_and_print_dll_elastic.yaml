technique_id: T1068
technique_name: Suspicious Print Spooler Point and Print DLL
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id with maxspan=30s\n[registry where host.os.type == \"windows\"\
  \ and\n   registry.value : \"SpoolDirectory\" and\n   registry.path : \"*\\\\SOFTWARE\\\
  \\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Print\\\\Printers\\\\*\\\\SpoolDirectory\"\
  \ and\n   registry.data.strings : \"C:\\\\Windows\\\\System32\\\\spool\\\\drivers\\\
  \\x64\\\\4\"]\n[registry where host.os.type == \"windows\" and\n   registry.value\
  \ : \"Module\" and\n   registry.path : \"*\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\
  \\CurrentVersion\\\\Print\\\\Printers\\\\*\\\\CopyFiles\\\\Payload\\\\Module\" and\n\
  \   registry.data.strings : \"C:\\\\Windows\\\\System32\\\\spool\\\\drivers\\\\\
  x64\\\\4\\\\*\"]"
explanation: 'Detects attempts to exploit a privilege escalation vulnerability (CVE-2020-1030)
  related to the print spooler service.

  Exploitation involves chaining multiple primitives to load an arbitrary DLL into
  the print spooler process running as

  SYSTEM.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/bd7eefee-f671-494e-98df-f01daf9e5f17.toml
