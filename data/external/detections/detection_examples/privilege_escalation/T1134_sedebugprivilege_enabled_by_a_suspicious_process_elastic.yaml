technique_id: T1134
technique_name: SeDebugPrivilege Enabled by a Suspicious Process
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "any where host.os.type == \"windows\" and event.provider: \"Microsoft-Windows-Security-Auditing\"\
  \ and\n event.action : \"Token Right Adjusted Events\" and\n\n winlog.event_data.EnabledPrivilegeList\
  \ : \"SeDebugPrivilege\" and\n\n /* exclude processes with System Integrity  */\n\
  \ not winlog.event_data.SubjectUserSid : (\"S-1-5-18\", \"S-1-5-19\", \"S-1-5-20\"\
  ) and\n\n not winlog.event_data.ProcessName :\n         (\"?:\\\\Windows\\\\System32\\\
  \\msiexec.exe\",\n          \"?:\\\\Windows\\\\SysWOW64\\\\msiexec.exe\",\n    \
  \      \"?:\\\\Windows\\\\System32\\\\lsass.exe\",\n          \"?:\\\\Windows\\\\\
  WinSxS\\\\*\",\n          \"?:\\\\Program Files\\\\*\",\n          \"?:\\\\Program\
  \ Files (x86)\\\\*\",\n          \"?:\\\\Windows\\\\System32\\\\MRT.exe\",\n   \
  \       \"?:\\\\Windows\\\\System32\\\\cleanmgr.exe\",\n          \"?:\\\\Windows\\\
  \\System32\\\\taskhostw.exe\",\n          \"?:\\\\Windows\\\\System32\\\\mmc.exe\"\
  ,\n          \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Temp\\\\*-*\\\\DismHost.exe\"\
  ,\n          \"?:\\\\Windows\\\\System32\\\\auditpol.exe\",\n          \"?:\\\\\
  Windows\\\\System32\\\\wbem\\\\WmiPrvSe.exe\",\n          \"?:\\\\Windows\\\\SysWOW64\\\
  \\wbem\\\\WmiPrvSe.exe\")"
explanation: 'Identifies the creation of a process running as SYSTEM and impersonating
  a Windows core binary privileges. Adversaries

  may create a new process with a different token to escalate privileges and bypass
  access controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/97020e61-e591-4191-8a3b-2861a2b887cd.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate system maintenance tasks may trigger the rule, such as Windows Update
    or system diagnostics. Users can monitor the timing of these tasks and correlate
    them with alerts to determine if they are the cause.

    - Software installations or updates using msiexec.exe might be flagged. Consider
    excluding msiexec.exe from the rule if it is frequently used in your environment
    for legitimate purposes.

    - Administrative tools like taskhostw.exe and mmc.exe can sometimes ena'
  mitigation: Review investigation guide for details
references:
- https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4703
- https://blog.palantir.com/windows-privilege-abuse-auditing-detection-and-defense-3078a403d74e
has_investigation_guide: true
risk_score: 47
