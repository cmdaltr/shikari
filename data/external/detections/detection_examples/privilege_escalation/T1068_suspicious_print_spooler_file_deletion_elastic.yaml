technique_id: T1068
technique_name: Suspicious Print Spooler File Deletion
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"windows\" and event.type == \"deletion\" and\n\
  \  file.extension : \"dll\" and file.path : \"?:\\\\Windows\\\\System32\\\\spool\\\
  \\drivers\\\\x64\\\\3\\\\*.dll\" and\n  not process.name : (\"spoolsv.exe\", \"\
  dllhost.exe\", \"explorer.exe\")"
explanation: 'Detects deletion of print driver files by an unusual process. This may
  indicate a clean up attempt post successful

  privilege escalation via Print Spooler service related vulnerabilities.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c4818812-d44f-47be-aaef-4cfb2f9cc799.toml
query_type: eql
query_language: eql
