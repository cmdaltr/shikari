  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: Microsoft Defender for Endpoint
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - System maintenance or updates may trigger legitimate deletions of print driver
    files. Monitor scheduled maintenance activities and correlate them with detected
    events to confirm legitimacy.

    - Third-party printer management software might delete or update driver files
    as part of its normal operation. Identify and whitelist these processes if they
    are verified as non-threatening.

    - Custom scripts or administrative tools used by IT staff for printer management
    could inadv'
  mitigation: Review investigation guide for details
references:
- https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527
has_investigation_guide: true
