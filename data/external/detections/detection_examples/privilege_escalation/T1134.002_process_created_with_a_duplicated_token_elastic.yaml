    or system repair utilities may trigger the rule. Users can create exceptions for
    these processes by excluding specific parent-child process relationships that
    are known to be safe.

    - Software installations or updates that involve temporary elevation of privileges
    might be flagged. Users should consider excluding processes originating'
  mitigation: Review investigation guide for details
