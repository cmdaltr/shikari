technique_id: T1134.002
technique_name: Process Created with a Duplicated Token
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "/* This rule is only compatible with Elastic Endpoint 8.4+ */\n\nprocess where\
  \ host.os.type == \"windows\" and event.action == \"start\" and\n\n user.id : (\"\
  S-1-5-21-*\", \"S-1-12-1-*\") and\n\n (process.Ext.effective_parent.executable regex~\
  \ \"\"\"[C-Z]:\\\\Windows\\\\(System32|SysWOW64)\\\\[a-zA-Z0-9\\-\\_\\.]+\\.exe\"\
  \"\" or\n  process.Ext.effective_parent.executable : \"?:\\\\Windows\\\\explorer.exe\"\
  ) and\n\n (\n  process.name : (\"powershell.exe\", \"cmd.exe\", \"rundll32.exe\"\
  , \"notepad.exe\", \"net.exe\", \"ntdsutil.exe\",\n                  \"tasklist.exe\"\
  , \"reg.exe\", \"certutil.exe\", \"bitsadmin.exe\", \"msbuild.exe\", \"esentutl.exe\"\
  ) or\n\n  ((process.Ext.relative_file_creation_time <= 900 or process.Ext.relative_file_name_modify_time\
  \ <= 900) and\n   not process.code_signature.status : (\"trusted\", \"errorExpired\"\
  , \"errorCode_endpoint*\") and\n   not process.executable : (\"?:\\\\Program Files\\\
  \\*\", \"?:\\\\Program Files (x86)\\\\*\"))\n ) and\n not (process.name : \"rundll32.exe\"\
  \ and\n      process.command_line : (\"*davclnt.dll,DavSetCookie*\", \"*?:\\\\Program\
  \ Files*\",\n                              \"*\\\\Windows\\\\System32\\\\winethc.dll*\"\
  , \"*\\\\Windows\\\\SYSTEM32\\\\EDGEHTML.dll*\",\n                             \
  \ \"*shell32.dll,SHCreateLocalServerRunDll*\")) and\n not startswith~(process.Ext.effective_parent.name,\
  \ process.parent.name) and\n not (process.name : \"powershell.exe\" and process.parent.name\
  \ : \"wmiprvse.exe\" and process.Ext.effective_parent.executable : \"?:\\\\Windows\\\
  \\System32\\\\wsmprovhost.exe\") and\n not (process.Ext.effective_parent.executable\
  \ : \"?:\\\\Windows\\\\System32\\\\RuntimeBroker.exe\" and process.parent.executable\
  \ : \"?:\\\\Windows\\\\System32\\\\sihost.exe\") and\n not (process.Ext.effective_parent.executable\
  \ : \"?:\\\\Windows\\\\System32\\\\sethc.exe\" and process.parent.executable : \"\
  ?:\\\\Windows\\\\System32\\\\svchost.exe\") and\n not (process.Ext.effective_parent.executable\
  \ : \"?:\\\\Windows\\\\explorer.exe\" and\n      process.parent.executable : (\"\
  ?:\\\\Windows\\\\System32\\\\svchost.exe\", \"?:\\\\Windows\\\\System32\\\\msiexec.exe\"\
  , \"?:\\\\Windows\\\\twain_32\\\\*.exe\"))"
explanation: 'Identifies the creation of a process impersonating the token of another
  user logon session. Adversaries may create a new

  process with a different token to escalate privileges and bypass access controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1b0b4818-5655-409b-9c73-341cac4bb73f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
