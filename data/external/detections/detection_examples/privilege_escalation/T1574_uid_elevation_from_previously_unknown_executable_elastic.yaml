technique_id: T1574
technique_name: UID Elevation from Previously Unknown Executable
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "host.os.type:\"linux\" and event.category:\"process\" and event.action:\"\
  uid_change\" and event.type:\"change\" and user.id:\"0\"\nand process.parent.name:(\"\
  bash\" or \"dash\" or \"sh\" or \"tcsh\" or \"csh\" or \"zsh\" or \"ksh\" or \"\
  fish\") and not (\n  process.executable:(\n    /bin/* or /usr/bin/* or /sbin/* or\
  \ /usr/sbin/* or /snap/* or /tmp/newroot/* or /var/lib/docker/* or /usr/local/*\
  \ or\n    /opt/psa/admin/* or /usr/lib/snapd/snap-confine or /opt/dynatrace/* or\
  \ /opt/microsoft/* or\n    /var/lib/snapd/snap/bin/node or /opt/gitlab/embedded/sbin/logrotate\
  \ or /etc/apt/universal-hooks/* or\n    /opt/puppetlabs/puppet/bin/puppet or /opt/cisco/*\
  \ or /run/k3s/containerd/* or /usr/lib/postfix/sbin/master or\n    /usr/libexec/postfix/local\
  \ or /var/lib/snapd/snap/bin/postgresql* or /opt/puppetlabs/puppet/bin/ruby\n  )\
  \ or\n  process.name:(\n    \"bash\" or \"dash\" or \"sh\" or \"tcsh\" or \"csh\"\
  \ or \"zsh\" or \"ksh\" or \"fish\" or \"sudo\" or \"su\" or \"apt\" or \"apt-get\"\
  \ or\n    \"aptitude\" or \"squid\" or \"snap\" or \"fusermount\" or \"pkexec\"\
  \ or \"umount\" or \"master\" or \"omsbaseline\" or \"dzdo\" or\n    \"sandfly\"\
  \ or \"logrotate\" or \"nix-installer\" \n  ) or\n  process.args:/usr/bin/python*\n\
  )"
explanation: 'Monitors for the elevation of regular user permissions to root permissions
  through a previously unknown executable.

  Attackers may attempt to evade detection by hijacking the execution flow and hooking
  certain functions/syscalls through

  a rootkit in order to provide easy access to root via a special modified command.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7787362c-90ff-4b1a-b313-8808b1020e64.toml
