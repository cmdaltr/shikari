technique_id: T1548.002
technique_name: UAC Bypass Attempt via Windows Directory Masquerading
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.args : (\"C:\\\\Windows \\\\system32\\\\*.exe\", \"C:\\\\Windows \\\\\
  SysWOW64\\\\*.exe\")"
explanation: 'Identifies an attempt to bypass User Account Control (UAC) by masquerading
  as a Microsoft trusted Windows directory.

  Attackers may bypass UAC to stealthily execute code with elevated permissions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/290aca65-e94d-403b-ba0f-62f320e63f51.toml
