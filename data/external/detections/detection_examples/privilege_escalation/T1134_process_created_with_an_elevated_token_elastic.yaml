technique_id: T1134
technique_name: Process Created with an Elevated Token
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "/* This rule is only compatible with Elastic Endpoint 8.4+ */\n\nprocess where\
  \ host.os.type == \"windows\" and event.action == \"start\" and\n\n /* CreateProcessWithToken\
  \ and effective parent is a privileged MS native binary used as a target for token\
  \ theft */\n user.id : \"S-1-5-18\"  and\n\n /* Token Theft target process usually\
  \ running as service are located in one of the following paths */\n process.Ext.effective_parent.executable\
  \ :\n                (\"?:\\\\Windows\\\\*.exe\",\n                 \"?:\\\\Program\
  \ Files\\\\*.exe\",\n                 \"?:\\\\Program Files (x86)\\\\*.exe\",\n\
  \                 \"?:\\\\ProgramData\\\\*\") and\n\n/* Ignores Utility Manager\
  \ in Windows running in debug mode */\n not (process.Ext.effective_parent.executable\
  \ : \"?:\\\\Windows\\\\System32\\\\Utilman.exe\" and\n      process.parent.executable\
  \ : \"?:\\\\Windows\\\\System32\\\\Utilman.exe\" and process.parent.args : \"/debug\"\
  ) and\n\n/* Ignores Windows print spooler service with correlation to Access Intelligent\
  \ Form */\nnot (process.parent.executable : \"?\\\\Windows\\\\System32\\\\spoolsv.exe\"\
  \ and\n     process.executable: \"?:\\\\Program Files*\\\\Access\\\\Intelligent\
  \ Form\\\\*\\\\LaunchCreate.exe\") and\n\n/* Ignores Windows error reporting executables\
  \ */\n not process.executable : (\"?:\\\\Windows\\\\System32\\\\WerFault.exe\",\n\
  \                           \"?:\\\\Windows\\\\SysWOW64\\\\WerFault.exe\",\n   \
  \                        \"?:\\\\Windows\\\\System32\\\\WerFaultSecure.exe\",\n\
  \                           \"?:\\\\Windows\\\\SysWOW64\\\\WerFaultSecure.exe\"\
  ,\n                           \"?:\\\\windows\\\\system32\\\\WerMgr.exe\",\n   \
  \                        \"?:\\\\Windows\\\\SoftwareDistribution\\\\Download\\\\\
  Install\\\\securityhealthsetup.exe\")  and\n\n /* Ignores Windows updates from TiWorker.exe\
  \ that runs with elevated privileges */\n not (process.parent.executable : \"?:\\\
  \\Windows\\\\WinSxS\\\\*\\\\TiWorker.exe\" and\n      process.executable : (\"?:\\\
  \\Windows\\\\Microsoft.NET\\\\Framework*.exe\",\n                            \"\
  ?:\\\\Windows\\\\WinSxS\\\\*.exe\",\n                            \"?:\\\\Windows\\\
  \\System32\\\\inetsrv\\\\iissetup.exe\",\n                            \"?:\\\\Windows\\\
  \\SysWOW64\\\\inetsrv\\\\iissetup.exe\",\n                            \"?:\\\\Windows\\\
  \\System32\\\\inetsrv\\\\aspnetca.exe\",\n                            \"?:\\\\Windows\\\
  \\SysWOW64\\\\inetsrv\\\\aspnetca.exe\",\n                            \"?:\\\\Windows\\\
  \\System32\\\\lodctr.exe\",\n                            \"?:\\\\Windows\\\\SysWOW64\\\
  \\lodctr.exe\",\n                            \"?:\\\\Windows\\\\System32\\\\netcfg.exe\"\
  ,\n                            \"?:\\\\Windows\\\\Microsoft.NET\\\\Framework*\\\\\
  *\\\\ngen.exe\",\n                            \"?:\\\\Windows\\\\Microsoft.NET\\\
  \\Framework*\\\\*\\\\aspnet_regiis.exe\")) and\n\n\n/* Ignores additional parent\
  \ executables that run with elevated privileges */\n not process.parent.executable\
  \ :\n               (\"?:\\\\Windows\\\\System32\\\\AtBroker.exe\",\n          \
  \      \"?:\\\\Windows\\\\system32\\\\svchost.exe\",\n                \"?:\\\\Program\
  \ Files (x86)\\\\*.exe\",\n                \"?:\\\\Program Files\\\\*.exe\",\n \
  \               \"?:\\\\Windows\\\\System32\\\\msiexec.exe\",\n                \"\
  ?:\\\\Windows\\\\System32\\\\DriverStore\\\\*\") and\n\n/* Ignores Windows binaries\
  \ with a trusted signature and specific signature name */\n not (process.code_signature.trusted\
  \ == true and\n      process.code_signature.subject_name :\n                (\"\
  philandro Software GmbH\",\n                 \"Freedom Scientific Inc.\",\n    \
  \             \"TeamViewer Germany GmbH\",\n                 \"Projector.is, Inc.\"\
  ,\n                 \"TeamViewer GmbH\",\n                 \"Cisco WebEx LLC\",\n\
  \                 \"Dell Inc\"))"
explanation: 'Identifies the creation of a process running as SYSTEM and impersonating
  a Windows core binary privileges. Adversaries

  may create a new process with a different token to escalate privileges and bypass
  access controls.'
source: Elastic Detection Rules
