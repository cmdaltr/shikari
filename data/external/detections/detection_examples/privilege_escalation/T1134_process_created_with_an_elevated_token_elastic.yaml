false_positives:
- description: 'False positive analysis


    - Utility Manager in Windows running in debug mode can trigger false positives.
    To handle this, exclude processes where both the effective parent and parent executables
    are Utilman.exe with the /debug argument.

    - Windows print spooler service correlated with Access Intelligent Form may cause
    false alerts. Exclude processes where the parent executable is spoolsv.exe and
    the process executable is LaunchCreate.exe under Access Intelligent Form.

    - Windows error reporting exe'
  mitigation: Review investigation guide for details
