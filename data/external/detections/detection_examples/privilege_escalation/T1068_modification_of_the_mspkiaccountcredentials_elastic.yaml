technique_id: T1068
technique_name: Modification of the msPKIAccountCredentials
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.code:\"5136\" and winlog.event_data.AttributeLDAPDisplayName:\"msPKIAccountCredentials\"\
  \ and\n  winlog.event_data.OperationType:\"%%14674\" and\n  not winlog.event_data.SubjectUserSid\
  \ : \"S-1-5-18\""
explanation: 'Identify the modification of the msPKIAccountCredentials attribute in
  an Active Directory User Object. Attackers can

  abuse the credentials roaming feature to overwrite an arbitrary file for privilege
  escalation. ms-PKI-AccountCredentials

  contains binary large objects (BLOBs) of encrypted credential objects from the credential
  manager store, private keys,

  certificates, and certificate requests.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/670b3b5a-35e5-42db-bd36-6c5b9b4b7313.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
