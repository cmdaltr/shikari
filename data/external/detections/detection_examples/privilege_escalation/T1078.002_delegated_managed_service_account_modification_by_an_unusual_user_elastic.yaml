technique_id: T1078.002
technique_name: Delegated Managed Service Account Modification by an Unusual User
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.code:5136 and winlog.event_data.AttributeLDAPDisplayName:"msDS-ManagedAccountPrecededByLink"
explanation: 'Detects modifications in the msDS-ManagedAccountPrecededByLink attribute
  of a delegated managed service account by an unusual

  subject account. Attackers can abuse this attribute to take over the permission
  of a target account and inherit it''s permissions

  allowing them to further elevate privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2c74e26b-dfe3-4644-b62b-d0482f124210.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Migration of legacy service accounts using delegated managed service account.


    ### Response and remediation


    - Immediately disable the winlog.event_data.SubjectUserName account and revert
    all changes performed by that account.

    - Identify and isolate the source machines from where the SubjectUserName is authenticating.

    - Reset passwords for all accounts that were potentially affected or had their
    permissions altered, focusing on privileged accounts to prevent adversarie'
  mitigation: Review investigation guide for details
references:
- https://www.akamai.com/blog/security-research/abusing-dmsa-for-privilege-escalation-in-active-directory
has_investigation_guide: true
risk_score: 73
