technique_id: T1068
technique_name: Potential Privileged Escalation via SamAccountName Spoofing
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "iam where event.action == \"renamed-user-account\" and\n  /* machine account\
  \ name renamed to user like account name */\n  winlog.event_data.OldTargetUserName\
  \ : \"*$\" and not winlog.event_data.NewTargetUserName : \"*$\""
explanation: 'Identifies a suspicious computer account name rename event, which may
  indicate an attempt to exploit CVE-2021-42278 to

  elevate privileges from a standard domain user to a user with domain admin privileges.
  CVE-2021-42278 is a security

  vulnerability that allows potential attackers to impersonate a domain controller
  via samAccountName attribute spoofing.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/bdcf646b-08d4-492c-870a-6c04e3700034.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
