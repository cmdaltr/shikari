false_positives:
- description: 'False positive analysis


    - System updates or patches may temporarily alter the Windir environment variable.
    Monitor for these events during known maintenance windows and consider excluding
    them from alerts.

    - Custom scripts or applications that modify environment variables for legitimate
    purposes can trigger false positives. Identify these scripts and whitelist their
    activity in the detection rule.

    - User profile migrations or system restorations might change the Windir path.
    Exclude these opera'
  mitigation: Review investigation guide for details
