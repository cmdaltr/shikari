technique_id: T1574.007
technique_name: Privilege Escalation via Windir Environment Variable
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  registry.value : (\"windir\", \"systemroot\") and registry.data.strings != null\
  \ and\nregistry.path : (\n    \"*\\\\Environment\\\\windir\",\n    \"*\\\\Environment\\\
  \\systemroot\"\n    ) and\n not registry.data.strings : (\"C:\\\\windows\", \"%SystemRoot%\"\
  )"
explanation: 'Identifies a privilege escalation attempt via a rogue Windows directory
  (Windir) environment variable. This is a known

  primitive that is often combined with other vulnerabilities to elevate privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d563aaba-2e72-462b-8658-3e5ea22db3a6.toml
