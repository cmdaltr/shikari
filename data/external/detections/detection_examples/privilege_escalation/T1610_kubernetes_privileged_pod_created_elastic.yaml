technique_id: T1610
technique_name: Kubernetes Privileged Pod Created
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset : \"kubernetes.audit_logs\"\n  and kubernetes.audit.annotations.authorization_k8s_io/decision:\"\
  allow\"\n  and kubernetes.audit.objectRef.resource:pods\n  and kubernetes.audit.verb:create\n\
  \  and kubernetes.audit.requestObject.spec.containers.securityContext.privileged:true\n\
  \  and not kubernetes.audit.requestObject.spec.containers.image: (\"docker.elastic.co/beats/elastic-agent:8.4.0\"\
  )"
explanation: 'This rule detects when a user creates a pod/container running in privileged
  mode. A highly privileged container has

  access to the node''s resources and breaks the isolation between containers. If
  compromised, an attacker can use the

  privileged container to gain access to the underlying host. Gaining access to the
  host may provide the adversary with

  the opportunity to achieve follow-on objectives, such as establishing persistence,
  moving laterally within the

  environment, or setting up a command and control channel on the host.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c7908cac-337a-4f38-b50d-5eeb78bdb531.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Kubernetes
  confidence: high
false_positives:
- description: 'False positive analysis


    - Known safe images like "docker.elastic.co/beats/elastic-agent:8.4.0" are already
    excluded from triggering alerts. Ensure that any additional internal or third-party
    images that are verified as safe are added to the exclusion list to prevent unnecessary
    alerts.

    - Development and testing environments often use privileged pods for legitimate
    purposes. Consider creating separate rules or exceptions for these environments
    to avoid false positives while maintaining security'
  mitigation: Review investigation guide for details
references:
- https://media.defense.gov/2021/Aug/03/2002820425/-1/-1/1/CTR_KUBERNETES%20HARDENING%20GUIDANCE.PDF
- https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
has_investigation_guide: true
risk_score: 47
