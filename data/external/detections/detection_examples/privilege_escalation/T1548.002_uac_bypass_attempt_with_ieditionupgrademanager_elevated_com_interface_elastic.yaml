technique_id: T1548.002
technique_name: UAC Bypass Attempt with IEditionUpgradeManager Elevated COM Interface
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\
  \ process.name : \"Clipup.exe\" and\n  not process.executable : \"C:\\\\Windows\\\
  \\System32\\\\ClipUp.exe\" and process.parent.name : \"dllhost.exe\" and\n  /* CLSID\
  \ of the Elevated COM Interface IEditionUpgradeManager */\n  process.parent.args\
  \ : \"/Processid:{BD54C901-076B-434E-B6C7-17C531F4AB41}\""
explanation: 'Identifies attempts to bypass User Account Control (UAC) by abusing
  an elevated COM Interface to launch a rogue Windows

  ClipUp program. Attackers may attempt to bypass UAC to stealthily execute code with
  elevated permissions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b90cdde7-7e0d-4359-8bf0-2c112ce2008a.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: Microsoft Defender for Endpoint
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may trigger the rule if they temporarily
    use non-standard paths for ClipUp.exe. Verify the source and purpose of the process
    to determine if it is part of a legitimate update or installation.

    - Custom scripts or administrative tools that utilize ClipUp.exe from non-standard
    paths for legitimate purposes can cause false positives. Review the script or
    tool usage and consider excluding these specific paths if they are verified'
  mitigation: Review investigation guide for details
references:
- https://github.com/hfiref0x/UACME
has_investigation_guide: true
risk_score: 73
