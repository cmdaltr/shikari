technique_id: T1611
technique_name: Docker Escape via Nsenter
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: 'process where host.os.type == "linux" and event.type == "change" and event.action
  == "uid_change" and

  process.entry_leader.entry_meta.type == "container" and process.args == "nsenter"
  and

  process.args in ("-t", "--target") and process.args_count >= 4'
explanation: 'This rule identifies a UID change event via `nsenter`. The `nsenter`
  command is used to enter a namespace, which is a

  way to isolate processes and resources. Attackers can use `nsenter` to escape from
  a container to the host, which can

  lead to privilege escalation and lateral movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5f3ab3ce-7b41-4168-a06a-68d2af8ebc88.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks using nsenter can trigger false positives, especially
    when system administrators use it for legitimate container management. To mitigate
    this, create exceptions for known administrative scripts or processes that frequently
    use nsenter.

    - Automated monitoring tools or scripts that perform health checks or maintenance
    on containers might use nsenter, leading to false alerts. Identify these tools
    and whitelist their specific processes or user'
  mitigation: Review investigation guide for details
references:
- https://www.cyberark.com/resources/threat-research-blog/the-route-to-root-container-escape-using-kernel-exploitation
has_investigation_guide: true
risk_score: 47
