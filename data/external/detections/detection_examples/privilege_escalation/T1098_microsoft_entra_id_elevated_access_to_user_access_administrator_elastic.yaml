    \ for approved operations.\n\n### Response and remediation\n\n- If elevation was\
    \ not authorized:\n  - Immediately remove the User Access Administrator role from\
    \ the account.\n  - Disable or lock the account and b"
  mitigation: Review investigation guide for details
