technique_id: T1548
technique_name: UAC Bypass via Windows Firewall Snap-In Hijack
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.name == \"mmc.exe\" and\n /* process.Ext.token.integrity_level_name\
  \ == \"high\" can be added in future for tuning */\n /* args of the Windows Firewall\
  \ SnapIn */\n  process.parent.args == \"WF.msc\" and process.name != \"WerFault.exe\""
explanation: 'Identifies attempts to bypass User Account Control (UAC) by hijacking
  the Microsoft Management Console (MMC) Windows

  Firewall snap-in. Attackers bypass UAC to stealthily execute code with elevated
  permissions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1178ae09-5aff-460a-9f2f-455cd0ac4d8e.toml
