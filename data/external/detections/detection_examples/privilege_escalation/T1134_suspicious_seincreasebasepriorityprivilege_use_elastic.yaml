technique_id: T1134
technique_name: Suspicious SeIncreaseBasePriorityPrivilege Use
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'event.category:iam and event.code:"4674" and

  winlog.event_data.PrivilegeList:"SeIncreaseBasePriorityPrivilege" and event.outcome:"success"
  and

  winlog.event_data.AccessMask:"512" and not winlog.event_data.SubjectUserSid:("S-1-5-18"
  or "S-1-5-19" or "S-1-5-20")'
explanation: 'Identifies attempts to use the SeIncreaseBasePriorityPrivilege privilege
  by an unusual process. This could be related to

  hijack execution flow of a process via threats priority manipulation.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/6fa0f15b-1926-419b-8de2-fce1429797ba.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Administrative tasks involving legitimate CPU scheduling priority changes.


    ### Response and remediation


    - Immediately isolate the affected machine from the network to prevent further
    unauthorized access or lateral movement within the domain.

    - Terminate the processes involved in the execution chain.

    - Escalate the incident to the security operations center (SOC) or incident response
    team for further investigation and to ensure comprehensive remediation efforts
    are un'
  mitigation: Review investigation guide for details
