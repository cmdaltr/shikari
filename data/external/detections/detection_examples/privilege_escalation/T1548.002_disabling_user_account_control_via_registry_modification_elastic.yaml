technique_id: T1548.002
technique_name: Disabling User Account Control via Registry Modification
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : (\"EnableLUA\", \"ConsentPromptBehaviorAdmin\", \"PromptOnSecureDesktop\"\
  ) and\n  registry.data.strings : (\"0\", \"0x00000000\")\n\n  /*\n    Full registry\
  \ key path omitted due to data source variations:\n    HKLM\\\\SOFTWARE\\\\Microsoft\\\
  \\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\EnableLUA\n    HKLM\\\\SOFTWARE\\\
  \\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\System\\\\ConsentPromptBehaviorAdmin\n\
  \    HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\\
  System\\\\PromptOnSecureDesktop\n  */"
explanation: 'User Account Control (UAC) can help mitigate the impact of malware on
  Windows hosts. With UAC, apps and tasks always run

  in the security context of a non-administrator account, unless an administrator
  specifically authorizes

  administrator-level access to the system. This rule identifies registry value changes
  to bypass User Access Control

  (UAC) protection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d31f183a-e5b1-451b-8534-ba62bca0b404.toml
