technique_id: T1548
technique_name: UAC Bypass Attempt via Privileged IFileOperation COM Interface
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.type : \"change\" and process.name\
  \ : \"dllhost.exe\" and\n  /* Known modules names side loaded into process running\
  \ with high or system integrity level for UAC Bypass, update here for new modules\
  \ */\n  file.name : (\"wow64log.dll\", \"comctl32.dll\", \"DismCore.dll\", \"OskSupport.dll\"\
  , \"duser.dll\", \"Accessibility.ni.dll\") and\n  /* has no impact on rule logic\
  \ just to avoid OS install related FPs */\n  not file.path : (\"C:\\\\Windows\\\\\
  SoftwareDistribution\\\\*\", \"C:\\\\Windows\\\\WinSxS\\\\*\")"
explanation: 'Identifies attempts to bypass User Account Control (UAC) via DLL side-loading.
  Attackers may attempt to bypass UAC to

  stealthily execute code with elevated permissions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5a14d01d-7ac8-4545-914c-b687c2cf66b3.toml
