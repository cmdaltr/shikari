technique_id: T1548
technique_name: UAC Bypass via DiskCleanup Scheduled Task Hijack
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.args : \"/autoclean\" and process.args : \"/d\" and process.executable\
  \ != null and\n not process.executable : (\n        \"C:\\\\Windows\\\\System32\\\
  \\cleanmgr.exe\",\n        \"C:\\\\Windows\\\\SysWOW64\\\\cleanmgr.exe\",\n    \
  \    \"C:\\\\Windows\\\\System32\\\\taskhostw.exe\",\n\n        /* Crowdstrike specific\
  \ exclusion as it uses NT Object paths */\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\System32\\\\cleanmgr.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\SysWOW64\\\\cleanmgr.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\System32\\\\taskhostw.exe\"\n)"
explanation: 'Identifies User Account Control (UAC) bypass via hijacking DiskCleanup
  Scheduled Task. Attackers bypass UAC to

  stealthily execute code with elevated permissions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1dcc51f6-ba26-49e7-9ef4-2655abb2361e.toml
