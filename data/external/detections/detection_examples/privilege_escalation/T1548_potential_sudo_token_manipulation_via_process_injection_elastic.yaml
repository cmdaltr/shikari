technique_id: T1548
technique_name: Potential Sudo Token Manipulation via Process Injection
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id, process.session_leader.entity_id with maxspan=15s\n[\
  \ process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ == \"exec\" and\n  process.name == \"gdb\" and process.user.id != \"0\" and process.group.id\
  \ != \"0\" ]\n[ process where host.os.type == \"linux\" and event.action == \"uid_change\"\
  \ and event.type == \"change\" and\n  process.name == \"sudo\" and process.user.id\
  \ == \"0\" and process.group.id == \"0\" ]"
explanation: 'This rule detects potential sudo token manipulation attacks through
  process injection by monitoring the use of a

  debugger (gdb) process followed by a successful uid change event during the execution
  of the sudo process. A sudo token

  manipulation attack is performed by injecting into a process that has a valid sudo
  token, which can then be used by

  attackers to activate their own sudo token. This attack requires ptrace to be enabled
  in conjunction with the existence

  of a living process that has a valid sudo token with the same uid as the current
  user.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ff9bc8b9-f03b-4283-be58-ee0a16f5a11b.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
