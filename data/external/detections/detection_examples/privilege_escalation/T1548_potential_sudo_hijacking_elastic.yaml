technique_id: T1548
technique_name: Potential Sudo Hijacking
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"linux\" and event.action in (\"creation\", \"\
  rename\") and\nfile.path in (\"/usr/bin/sudo\", \"/bin/sudo\") and not (\n  file.Ext.original.path\
  \ in (\"/usr/bin/sudo\", \"/bin/sudo\") or\n  process.executable in (\n    \"/bin/dpkg\"\
  , \"/usr/bin/dpkg\", \"/bin/dockerd\", \"/usr/bin/dockerd\", \"/usr/sbin/dockerd\"\
  , \"/bin/microdnf\",\n    \"/bin/rpm\", \"/usr/bin/rpm\", \"/bin/snapd\", \"/usr/bin/snapd\"\
  , \"/bin/yum\", \"/usr/bin/yum\", \"/bin/dnf\", \"/usr/bin/dnf\",\n    \"/bin/podman\"\
  , \"/usr/bin/podman\", \"/bin/dnf-automatic\", \"/usr/bin/dnf-automatic\", \"/bin/pacman\"\
  , \"/usr/bin/pacman\",\n    \"/usr/bin/dpkg-divert\", \"/bin/dpkg-divert\", \"/sbin/apk\"\
  , \"/usr/sbin/apk\", \"/usr/local/sbin/apk\", \"/usr/bin/apt\",\n    \"/usr/sbin/pacman\"\
  , \"/usr/bin/microdnf\", \"/usr/local/bin/dockerd\", \"/usr/local/bin/podman\",\
  \ \"/usr/local/bin/dnf\",\n    \"/kaniko/executor\", \"/proc/self/exe\", \"/usr/bin/apt-get\"\
  , \"/usr/bin/apt-cache\", \"/usr/bin/apt-mark\"\n  ) or\n  file.Ext.original.extension\
  \ == \"dpkg-new\" or\n  process.executable : (\n    \"/nix/store/*\", \"/var/lib/dpkg/*\"\
  , \"/tmp/vmis.*\", \"/snap/*\", \"/dev/fd/*\", \"/var/lib/docker/*\"\n  ) or\n \
  \ process.executable == null or\n  (process.name == \"sed\" and file.name : \"sed*\"\
  )\n)"
explanation: 'Identifies the creation of a sudo binary located at /usr/bin/sudo. Attackers
  may hijack the default sudo binary and

  replace it with a custom binary or script that can read the user''s password in
  clear text to escalate privileges or

  enable persistence onto the system every time the sudo binary is executed.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/88fdcb8c-60e5-46ee-9206-2663adf1b1ce.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Package management processes can trigger false positives when legitimate updates
    or installations occur. To handle this, ensure that processes like dpkg, rpm,
    yum, and apt are included in the exclusion list as they are common package managers.

    - Custom scripts or automation tools that modify the sudo binary for legitimate
    reasons may cause alerts. Review these scripts and consider adding their paths
    to the exclusion list if they are verified as safe.

    - Temporary files'
  mitigation: Review investigation guide for details
references:
- https://eapolsniper.github.io/2020/08/17/Sudo-Hijacking/
- https://www.elastic.co/security-labs/sequel-on-persistence-mechanisms
has_investigation_guide: true
risk_score: 47
