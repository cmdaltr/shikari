technique_id: T1098.003
technique_name: AWS IAM AdministratorAccess Policy Attached to User
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "iam where event.dataset == \"aws.cloudtrail\"\n   and event.provider == \"\
  iam.amazonaws.com\"\n   and event.action == \"AttachUserPolicy\"\n   and event.outcome\
  \ == \"success\"\n   and stringContains(aws.cloudtrail.request_parameters, \"policyArn=arn:aws:iam::aws:policy/AdministratorAccess\"\
  )"
explanation: 'An adversary with access to a set of compromised credentials may attempt
  to persist or escalate privileges by attaching

  additional permissions to compromised user accounts. This rule looks for use of
  the IAM AttachUserPolicy API operation

  to attach the highly permissive AdministratorAccess AWS managed policy to an existing
  IAM user.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9aa4be8d-5828-417d-9f54-7cd304571b24.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS IAM
  confidence: high
false_positives:
- description: "False positive analysis\n\n- **Legitimate administrative change.**\
    \  \n  Policy attachments may be expected during provisioning or troubleshooting.\
    \ Validate through change management records.  \n- **Authorized automation.**\
    \  \n  Some CI/CD pipelines or identity automation systems temporarily attach\
    \ this policy. Review automation logs and intended IAM behavior.  \n- **Delegated\
    \ admin scenarios.**  \n  Verify if the calling user or role is part of a delegated\
    \ IAM administration group.\n\n### Response and re"
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_AttachUserPolicy.html
- https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AdministratorAccess.html
- https://hackingthe.cloud/aws/exploitation/iam_privilege_escalation/
has_investigation_guide: true
risk_score: 47
