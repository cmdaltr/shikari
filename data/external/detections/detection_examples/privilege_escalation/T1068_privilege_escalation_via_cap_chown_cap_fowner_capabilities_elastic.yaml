technique_id: T1068
technique_name: Privilege Escalation via CAP_CHOWN/CAP_FOWNER Capabilities
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id, process.pid with maxspan=1s\n  [process where host.os.type\
  \ == \"linux\" and event.type == \"start\" and event.action == \"exec\" and\n  \
  \ process.name != null and process.thread.capabilities.effective : (\"CAP_CHOWN\"\
  , \"CAP_FOWNER\") and\n   process.command_line : (\"*sudoers*\", \"*passwd*\", \"\
  *shadow*\", \"*/root/*\") and user.id != \"0\"]\n  [file where host.os.type == \"\
  linux\" and event.action == \"changed-file-ownership-of\" and event.type == \"change\"\
  \ and\n   event.outcome == \"success\" and file.path in (\n     \"/etc/passwd\"\
  ,\n     \"/etc/shadow\",\n     \"/etc/sudoers\",\n     \"/root/.ssh/*\"\n   ) and\
  \ user.id != \"0\"\n  ]"
explanation: 'Identifies instances where a processes (granted CAP_CHOWN and/or CAP_FOWNER
  capabilities) is executed, after which the

  ownership of a suspicious file or binary is changed. In Linux, the CAP_CHOWN capability
  allows a process to change the

  owner of a file, while CAP_FOWNER permits it to bypass permission checks on operations
  that require file ownership (like

  reading, writing, and executing). Attackers may abuse these capabilities to obtain
  unauthorized access to files.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d55abdfb-5384-402b-add4-6c401501b0c3.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Auditd Manager
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - System administration scripts or automated processes may legitimately use CAP_CHOWN
    or CAP_FOWNER capabilities to manage file permissions or ownership. Review and
    whitelist these processes if they are verified as non-malicious.

    - Backup or restoration operations often require changing file ownership and permissions.
    Identify and exclude these operations from triggering alerts by specifying known
    backup tools or scripts.

    - Software installation or update processes might'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
