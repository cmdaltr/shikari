technique_id: T1547
technique_name: Potential Port Monitor or Print Processor Registration Abuse
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.path : (\n      \"HKLM\\\\SYSTEM\\\\*ControlSet*\\\\Control\\\\Print\\\
  \\Monitors\\\\*\",\n      \"HKLM\\\\SYSTEM\\\\*ControlSet*\\\\Control\\\\Print\\\
  \\Environments\\\\Windows*\\\\Print Processors\\\\*\",\n      \"\\\\REGISTRY\\\\\
  MACHINE\\\\SYSTEM\\\\*ControlSet*\\\\Control\\\\Print\\\\Monitors\\\\*\",\n    \
  \  \"\\\\REGISTRY\\\\MACHINE\\\\SYSTEM\\\\*ControlSet*\\\\Control\\\\Print\\\\Environments\\\
  \\Windows*\\\\Print Processors\\\\*\"\n  ) and registry.data.strings : \"*.dll\"\
  \ and\n  /* exclude SYSTEM SID - look for changes by non-SYSTEM user */\n  not user.id\
  \ : \"S-1-5-18\""
explanation: 'Identifies port monitor and print processor registry modifications.
  Adversaries may abuse port monitor and print

  processors to run malicious DLLs during system boot that will be executed as SYSTEM
  for privilege escalation and/or

  persistence, if permissions allow writing a fully-qualified pathname for that DLL.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8f3e91c7-d791-4704-80a1-42c160d7aa27.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Microsoft Defender for Endpoint
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may modify print processor or port
    monitor registry paths. Users should verify if recent installations or updates
    coincide with the detected changes.

    - System administrators performing maintenance or configuration changes might
    trigger alerts. Ensure that such activities are documented and cross-referenced
    with the alert timestamps.

    - Some third-party printing solutions may register their own DLLs in these registry
    paths. Id'
  mitigation: Review investigation guide for details
references:
- https://www.welivesecurity.com/2020/05/21/no-game-over-winnti-group/
has_investigation_guide: true
risk_score: 47
