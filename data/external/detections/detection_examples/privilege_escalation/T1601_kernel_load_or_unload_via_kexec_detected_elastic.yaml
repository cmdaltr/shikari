technique_id: T1601
technique_name: Kernel Load or Unload via Kexec Detected
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\", \"\
  executed\", \"process_started\") and\n  process.name == \"kexec\" and process.args\
  \ in (\"--exec\", \"-e\", \"--load\", \"-l\", \"--unload\", \"-u\") and\n  not process.parent.name\
  \ in (\"kdumpctl\", \"unload.sh\")"
explanation: 'This detection rule identifies the usage of kexec, helping to uncover
  unauthorized kernel replacements and potential

  compromise of the system''s integrity. Kexec is a Linux feature that enables the
  loading and execution of a different

  kernel without going through the typical boot process. Malicious actors can abuse
  kexec to bypass security measures,

  escalate privileges, establish persistence or hide their activities by loading a
  malicious kernel, enabling them to

  tamper with the system''s trusted state, allowing e.g. a VM Escape.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/4d4c35f4-414e-4d0c-bb7e-6db7c80a6957.toml
query_type: eql
query_language: eql
