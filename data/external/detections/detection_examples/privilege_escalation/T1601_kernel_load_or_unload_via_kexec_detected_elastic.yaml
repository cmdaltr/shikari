false_positives:
- description: 'False positive analysis


    - Kdump operations may trigger false positives as kdumpctl is a benign parent
    process for kexec. Ensure kdumpctl is included in the exclusion list to prevent
    unnecessary alerts.

    - Custom scripts for kernel unloading, such as unload.sh, can cause false positives.
    Verify these scripts are legitimate and add them to the exclusion list if they
    are frequently used in your environment.

    - Routine administrative tasks involving kernel updates or testing may involve
    kexec. Confir'
  mitigation: Review investigation guide for details
