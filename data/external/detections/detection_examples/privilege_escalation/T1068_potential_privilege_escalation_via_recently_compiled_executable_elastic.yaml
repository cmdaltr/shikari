technique_id: T1068
technique_name: Potential Privilege Escalation via Recently Compiled Executable
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id with maxspan=1m\n  [process where host.os.type == \"linux\"\
  \ and event.type == \"start\" and event.action == \"exec\" and\n   process.name\
  \ in (\"gcc\", \"g++\", \"cc\") and user.id != \"0\"] by process.args\n  [file where\
  \ host.os.type == \"linux\" and event.action == \"creation\" and event.type == \"\
  creation\" and\n   process.name == \"ld\" and user.id != \"0\"] by file.name\n \
  \ [process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ == \"exec\" and\n   user.id != \"0\"] by process.name\n  [process where host.os.type\
  \ == \"linux\" and event.action in (\"uid_change\", \"guid_change\") and event.type\
  \ == \"change\" and\n   user.id == \"0\"] by process.name"
explanation: 'This rule monitors a sequence involving a program compilation event
  followed by its execution and a subsequent

  alteration of UID permissions to root privileges. This behavior can potentially
  indicate the execution of a kernel or

  software privilege escalation exploit.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/193549e8-bb9e-466a-a7f9-7e783f5cb5a6.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Development activities by legitimate users can trigger this rule when compiling
    and testing new software. To manage this, consider creating exceptions for specific
    users or groups known to perform regular development tasks.

    - Automated build systems or continuous integration pipelines may compile and
    execute code as part of their normal operation. Exclude these systems by identifying
    their user accounts or host identifiers.

    - System administrators performing maintenanc'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
