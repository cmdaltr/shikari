technique_id: T1610
technique_name: Kubernetes Pod Created With HostPID
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset : \"kubernetes.audit_logs\"\n  and kubernetes.audit.annotations.authorization_k8s_io/decision:\"\
  allow\"\n  and kubernetes.audit.objectRef.resource:\"pods\"\n  and kubernetes.audit.verb:(\"\
  create\" or \"update\" or \"patch\")\n  and kubernetes.audit.requestObject.spec.hostPID:true\n\
  \  and not kubernetes.audit.requestObject.spec.containers.image: (\"docker.elastic.co/beats/elastic-agent:8.4.0\"\
  )"
explanation: 'This rule detects an attempt to create or modify a pod attached to the
  host PID namespace. HostPID allows a pod to

  access all the processes running on the host and could allow an attacker to take
  malicious action. When paired with

  ptrace this can be used to escalate privileges outside of the container. When paired
  with a privileged container, the

  pod can see all of the processes on the host. An attacker can enter the init system
  (PID 1) on the host. From there,

  they could execute a shell and continue to escalate privileges to root.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/df7fda76-c92b-4943-bc68-04460a5ea5ba.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Kubernetes
  confidence: high
false_positives:
