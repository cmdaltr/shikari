technique_id: T1484
technique_name: Group Policy Abuse for Privilege Addition
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "any where host.os.type == \"windows\" and event.code: \"5136\" and\n  winlog.event_data.AttributeLDAPDisplayName:\
  \ \"gPCMachineExtensionNames\" and\n  winlog.event_data.AttributeValue: \"*827D319E-6EAC-11D2-A4EA-00C04F79F83A*\"\
  \ and\n  winlog.event_data.AttributeValue: \"*803E14A0-B4FB-11D0-A0D0-00A0C90F574B*\""
explanation: 'Detects the first occurrence of a modification to Group Policy Object
  Attributes to add privileges to user accounts or

  use them to add users as local admins.'
