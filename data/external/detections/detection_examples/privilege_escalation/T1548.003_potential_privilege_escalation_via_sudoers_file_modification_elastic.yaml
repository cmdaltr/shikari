technique_id: T1548.003
technique_name: Potential Privilege Escalation via Sudoers File Modification
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.category:process and event.type:start and process.args:(echo and *NOPASSWD*ALL*)
explanation: 'A sudoers file specifies the commands users or groups can run and from
  which terminals. Adversaries can take advantage

  of these configurations to execute commands as other users or spawn processes with
  higher privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/76152ca1-71d0-4003-9e37-0983e12832da.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks may trigger the rule if administrators frequently
    update the sudoers file to add legitimate NOPASSWD entries for automation purposes.
    To manage this, create exceptions for known administrative scripts or processes
    that are regularly reviewed and approved.

    - Configuration management tools like Ansible or Puppet might modify the sudoers
    file as part of their normal operation. Exclude these tools from triggering alerts
    by identifying their spe'
  mitigation: Review investigation guide for details
references:
- https://www.elastic.co/security-labs/primer-on-persistence-mechanisms
has_investigation_guide: true
risk_score: 73
