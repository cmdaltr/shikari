technique_id: T1548
technique_name: UAC Bypass Attempt via Elevated COM Internet Explorer Add-On Installer
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.executable : \"C:\\\\*\\\\AppData\\\\*\\\\Temp\\\\IDC*.tmp\\\\*.exe\"\
  \ and\n process.parent.name : \"ieinstal.exe\" and process.parent.args : \"-Embedding\"\
  \n\n /* uncomment once in winlogbeat */\n /* and not (process.code_signature.subject_name\
  \ == \"Microsoft Corporation\" and process.code_signature.trusted == true) */"
explanation: 'Identifies User Account Control (UAC) bypass attempts by abusing an
  elevated COM Interface to launch a malicious

  program. Attackers may attempt to bypass UAC to stealthily execute code with elevated
  permissions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/fc7c0fa4-8f03-4b3e-8336-c5feab0be022.toml
query_type: eql
query_language: eql
