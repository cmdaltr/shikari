  value: Microsoft Defender for Endpoint
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may trigger the rule if they involve
    browser-based help documentation. To manage this, identify and whitelist known
    software update processes that frequently access Microsoft Help pages.

    - Automated scripts or administrative tools that use browsers to access Microsoft
    Help for legitimate purposes can cause false positives. Exclude these scripts
    or tools by specifying their unique command-line patterns or process names.

    - Use'
  mitigation: Review investigation guide for details
references:
- https://sec-consult.com/blog/detail/msi-installer-repair-to-system-a-detailed-journey/
- https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2024-38014
has_investigation_guide: true
