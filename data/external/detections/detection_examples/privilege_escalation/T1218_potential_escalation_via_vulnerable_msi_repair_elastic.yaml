technique_id: T1218
technique_name: Potential Escalation via Vulnerable MSI Repair
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where event.type == \"start\" and host.os.type == \"windows\" and\n\
  \ user.domain : (\"NT AUTHORITY\", \"AUTORITE NT\", \"AUTORIDADE NT\") and\n process.parent.name\
  \ : (\"chrome.exe\", \"msedge.exe\", \"brave.exe\", \"whale.exe\", \"browser.exe\"\
  , \"dragon.exe\", \"vivaldi.exe\",\n                        \"opera.exe\", \"iexplore\"\
  , \"firefox.exe\", \"waterfox.exe\", \"iexplore.exe\", \"tor.exe\", \"safari.exe\"\
  ) and\n process.parent.command_line : \"*go.microsoft.com*\""
explanation: 'Identifies when a browser process navigates to the Microsoft Help page
  followed by spawning an elevated process. This

  may indicate a successful exploitation for privilege escalation abusing a vulnerable
  Windows Installer repair setup.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/043d80a3-c49e-43ef-9c72-1088f0c7b278.toml
query_type: eql
query_language: eql
