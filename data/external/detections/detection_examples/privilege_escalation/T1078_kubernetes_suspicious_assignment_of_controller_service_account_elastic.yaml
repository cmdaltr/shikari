technique_id: T1078
technique_name: Kubernetes Suspicious Assignment of Controller Service Account
tactic: privilege_escalation
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset : \"kubernetes.audit_logs\"\n  and kubernetes.audit.annotations.authorization_k8s_io/decision:\"\
  allow\"\n  and kubernetes.audit.verb : \"create\"\n  and kubernetes.audit.objectRef.resource\
  \ : \"pods\"\n  and kubernetes.audit.objectRef.namespace : \"kube-system\"\n  and\
  \ kubernetes.audit.requestObject.spec.serviceAccountName:*controller"
explanation: 'This rule detects a request to attach a controller service account to
  an existing or new pod running in the kube-system

  namespace. By default, controllers running as part of the API Server utilize admin-equivalent
  service accounts hosted in

  the kube-system namespace. Controller service accounts aren''t normally assigned
  to running pods and could indicate

  adversary behavior within the cluster. An attacker that can create or modify pods
  or pod controllers in the kube-system

  namespace, can assign one of these admin-equivalent service accounts to a pod and
  abuse their powerful token to escalate

  privileges and gain complete cluster control.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/63c05204-339a-11ed-a261-0242ac120002.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Kubernetes
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance tasks in the kube-system namespace may involve creating
    or modifying pods with elevated service accounts. Review the context of such actions
    to determine if they are part of scheduled maintenance or updates.

    - Automated deployment tools might temporarily assign controller service accounts
    to pods for configuration purposes. Verify if these actions align with known deployment
    processes and consider excluding these specific tools from triggering alert'
  mitigation: Review investigation guide for details
references:
- https://www.paloaltonetworks.com/apps/pan/public/downloadResource?pagePath=/content/pan/en_US/resources/whitepapers/kubernetes-privilege-escalation-excessive-permissions-in-popular-platforms
has_investigation_guide: true
risk_score: 47
