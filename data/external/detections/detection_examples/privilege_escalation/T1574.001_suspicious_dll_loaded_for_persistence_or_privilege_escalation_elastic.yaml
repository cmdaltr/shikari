query: "any where host.os.type == \"windows\" and\n(event.category : (\"driver\",\
  \ \"library\") or (event.category == \"process\" and event.action : \"Image loaded*\"\
  )) and\n(\n  /* compatible with Elastic Endpoint Library Events */\n  (\n    ?dll.name\
  \ : (\n        \"wlbsctrl.dll\", \"wbemcomn.dll\", \"WptsExtensions.dll\", \"Tsmsisrv.dll\"\
  , \"TSVIPSrv.dll\", \"Msfte.dll\",\n        \"wow64log.dll\", \"WindowsCoreDeviceInfo.dll\"\
  , \"Ualapi.dll\", \"wlanhlp.dll\", \"phoneinfo.dll\", \"EdgeGdi.dll\",\n       \
  \ \"cdpsgshims.dll\", \"windowsperformancerecordercontrol.dll\", \"diagtrack_win.dll\"\
  , \"TPPCOIPW32.dll\", \n        \"tpgenlic.dll\", \"thinmon.dll\", \"fxsst.dll\"\
  , \"msTracer.dll\"\n    )\n    and (\n      ?dll.code_signature.trusted != true\
  \ or\n      ?dll.code_signature.exists != true or\n      (\n        ?dll.code_signature.trusted\
  \ == true and\n          not ?dll.code_signature.subject_name : (\"Microsoft Windows\"\
  , \"Microsoft Corporation\", \"Microsoft Windows Publisher\")\n      )\n  ) or\n\
  \   /* oci.dll is too noisy due to unsigned Oracle related DLL loaded from random\
  \ dirs */\n  (\n   (?dll.path : \"?:\\\\Windows\\\\*\\\\oci.dll\" and process.executable\
  \ : \"?:\\\\Windows\\\\*.exe\" and \n    (?dll.code_signature.trusted != true or\
  \ ?dll.code_signature.exists != true)) or \n    \n   (file.path : \"?:\\\\Windows\\\
  \\*\\\\oci.dll\" and not file.code_signature.status == \"Valid\" and process.executable\
  \ : \"?:\\\\Windows\\\\*.exe\")\n   ) or \n\n  /* compatible with Sysmon EventID\
  \ 7 - Image Load */\n  (file.name : (\"wlbsctrl.dll\", \"wbemcomn.dll\", \"WptsExtensions.dll\"\
  , \"Tsmsisrv.dll\", \"TSVIPSrv.dll\", \"Msfte.dll\",\n               \"wow64log.dll\"\
  , \"WindowsCoreDeviceInfo.dll\", \"Ualapi.dll\", \"wlanhlp.dll\", \"phoneinfo.dll\"\
  , \"EdgeGdi.dll\",\n               \"cdpsgshims.dll\", \"windowsperformancerecordercontrol.dll\"\
  , \"diagtrack_win.dll\", \"TPPCOIPW32.dll\", \n               \"tpgenlic.dll\",\
  \ \"thinmon.dll\", \"fxsst.dll\", \"msTracer.dll\") and \n   not file.hash.sha256\
  \ : \n            (\"6e837794fc282446906c36d681958f2f6212043fc117c716936920be166a700f\"\
  , \n             \"b14e4954e8cca060ffeb57f2458b6a3a39c7d2f27e94391cbcea5387652f21a4\"\
  , \n             \"c258d90acd006fa109dc6b748008edbb196d6168bc75ace0de0de54a4db46662\"\
  ) and \n   not file.code_signature.status == \"Valid\")\n  ) and\n  not\n  (\n \
  \   ?dll.path : (\n      \"?:\\\\Windows\\\\System32\\\\wbemcomn.dll\",\n      \"\
  ?:\\\\Windows\\\\SysWOW64\\\\wbemcomn.dll\",\n      \"?:\\\\Windows\\\\System32\\\
  \\windowsperformancerecordercontrol.dll\",\n      \"?:\\\\Windows\\\\System32\\\\\
  wlanhlp.dll\", \n      \"\\\\Device\\\\HarddiskVolume?\\\\Windows\\\\SysWOW64\\\\\
  wbemcomn.dll\", \n      \"\\\\Device\\\\HarddiskVolume?\\\\Windows\\\\System32\\\
  \\wbemcomn.dll\", \n      \"\\\\Device\\\\HarddiskVolume?\\\\Windows\\\\SysWOW64\\\
  \\wlanhlp.dll\", \n      \"\\\\Device\\\\HarddiskVolume?\\\\Windows\\\\System32\\\
  \\wlanhlp.dll\", \n      \"\\\\Device\\\\HarddiskVolume?\\\\Windows\\\\SysWOW64\\\
  \\windowsperformancerecordercontrol.dll\", \n      \"\\\\Device\\\\HarddiskVolume?\\\
  \\Windows\\\\System32\\\\windowsperformancerecordercontrol.dll\", \n      \"C:\\\
  \\ProgramData\\\\docker\\\\windowsfilter\\\\*\\\\Files\\\\Windows\\\\System32\\\\\
  windowsperformancerecordercontrol.dll\", \n      \"C:\\\\ProgramData\\\\docker\\\
  \\windowsfilter\\\\*\\\\Files\\\\Windows\\\\System32\\\\windowsperformancerecordercontrol.dll\"\
  , \n      \"\\\\Device\\\\vmsmb\\\\VSMB-{*}\\\\os\\\\windows\\\\system32\\\\*.dll\"\
  \n    ) or\n    file.path : (\n      \"?:\\\\Windows\\\\System32\\\\wbemcomn.dll\"\
  ,\n      \"?:\\\\Windows\\\\SysWOW64\\\\wbemcomn.dll\",\n      \"?:\\\\Windows\\\
  \\System32\\\\windowsperformancerecordercontrol.dll\",\n      \"?:\\\\Windows\\\\\
  System32\\\\wlanhlp.dll\", \n      \"C:\\\\ProgramData\\\\docker\\\\windowsfilter\\\
  \\*\\\\Files\\\\Windows\\\\System32\\\\windowsperformancerecordercontrol.dll\",\
  \ \n      \"C:\\\\ProgramData\\\\docker\\\\windowsfilter\\\\*\\\\Files\\\\Windows\\\
  \\System32\\\\wbemcomn.dll\", \n      \"\\\\Device\\\\vmsmb\\\\VSMB-{*}\\\\os\\\\\
