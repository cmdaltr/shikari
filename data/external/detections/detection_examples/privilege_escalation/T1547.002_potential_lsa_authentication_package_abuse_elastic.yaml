  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Microsoft Defender for Endpoint
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may modify the LSA authentication
    package registry path. Users should verify if recent installations or updates
    coincide with the detected changes and consider excluding these specific software
    processes if they are deemed safe.

    - System administrators or IT management tools might perform authorized changes
    to the registry for maintenance or configuration purposes. Users can create exceptions
    for known administrative tools o'
  mitigation: Review investigation guide for details
has_investigation_guide: true
