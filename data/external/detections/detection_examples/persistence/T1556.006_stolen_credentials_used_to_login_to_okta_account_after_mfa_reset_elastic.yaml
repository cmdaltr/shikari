technique_id: T1556.006
technique_name: Stolen Credentials Used to Login to Okta Account After MFA Reset
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by user.name with maxspan=12h\n    [any where host.os.type == \"\
  windows\" and signal.rule.threat.tactic.name == \"Credential Access\"]\n    [any\
  \ where event.dataset == \"okta.system\" and okta.event_type == \"user.mfa.factor.update\"\
  ]\n    [any where event.dataset == \"okta.system\" and okta.event_type: (\"user.session.start\"\
  , \"user.authentication*\")]"
explanation: 'Detects a sequence of suspicious activities on Windows hosts indicative
  of credential compromise, followed by efforts to

  undermine multi-factor authentication (MFA) and single sign-on (SSO) mechanisms
  for an Okta user account.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5610b192-7f18-11ee-825b-f661ea17fbcd.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Okta
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
false_positives:
- description: 'False positive analysis:

    - A Windows administrator may have triggered a low-fidelity credential access
    alert during a legitimate administrative action. Following this, the administrator
    may have reset the MFA credentials for themselves and then logged into the Okta
    console for AD directory services integration management.


    ### Response and remediation:

    - If confirmed that the user did not intentionally have their MFA factor reset,
    deactivate the user account.

    - After deactivation, reset the user'
  mitigation: Review investigation guide for details
references:
- https://developer.okta.com/docs/reference/api/system-log/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://sec.okta.com/articles/2023/08/cross-tenant-impersonation-prevention-and-detection
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 73
