query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  eventName:\n  - AssociateDirectory\n  - DisableExternalIdPConfigurationForDirectory\n\
  \  - DisassociateDirectory\n  - EnableExternalIdPConfigurationForDirectory\n  eventSource:\n\
  \  - sso-directory.amazonaws.com\n  - sso.amazonaws.com\n"
explanation: 'Detects a change in the AWS Identity Center (FKA AWS SSO) identity provider.

  A change in identity provider allows an attacker to establish persistent access
  or escalate privileges via user impersonation.

  '
false_positives:
- Authorized changes to the AWS account's identity provider
