technique_id: T1098.005
technique_name: AWS IAM Virtual MFA Device Registration Attempt with Session Token
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset: \"aws.cloudtrail\"\n  and event.provider: \"iam.amazonaws.com\"\
  \n  and event.action: (\"CreateVirtualMFADevice\" or \"EnableMFADevice\")\n  and\
  \ aws.cloudtrail.user_identity.access_key_id: ASIA*"
explanation: 'Identifies attempts to register or enable an IAM Virtual MFA device
  using temporary credentials (access keys

  starting with ''ASIA''). This may indicate an adversary attempting to escalate privileges
  or establish persistence using

  stolen session tokens.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e4feea34-3b62-4c83-b77f-018fbef48c00.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS CloudTrail
  confidence: high
- type: data_source
  value: AWS IAM
  confidence: high
false_positives:
- description: 'False Positive Analysis


    - This may occur if an admin or automation tool is legitimately setting up a new
    MFA device using temporary credentials.

    - Review the IP, agent, and context to differentiate expected automation from
    unauthorized access.


    ### Response and Remediation


    - **Revoke Credentials**: If unauthorized, revoke the access keys or terminate
    the session.

    - **Reset MFA and Passwords**: Rotate credentials for the affected IAM user.

    - **Review IAM Policies**: Limit permissions to registe'
  mitigation: Review investigation guide for details
references:
- https://www.sygnia.co/blog/sygnia-investigation-bybit-hack/
has_investigation_guide: true
risk_score: 47
