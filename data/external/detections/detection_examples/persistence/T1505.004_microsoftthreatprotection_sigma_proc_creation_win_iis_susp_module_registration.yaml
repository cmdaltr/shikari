technique_id: T1505.004
technique_name: Suspicious IIS Module Registration
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 043c4b8b-3a54-4780-9682-081cb6b8185c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_parent and\
  \ 1 of selection_cli_*\nselection_cli_1:\n  CommandLine|contains: appcmd.exe add\
  \ module\nselection_cli_2:\n  CommandLine|contains: ' system.enterpriseservices.internal.publish'\n\
  \  Image|endswith: \\powershell.exe\nselection_cli_3:\n  CommandLine|contains|all:\n\
  \  - gacutil\n  - ' /I'\nselection_parent:\n  ParentImage|endswith: \\w3wp.exe\n"
explanation: Detects a suspicious IIS module registration as described in Microsoft
  threat report on IIS backdoors
false_positives:
- Administrative activity
references:
- https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
tags:
- attack.persistence
- attack.t1505.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: \w3wp.exe
  selection_cli_1:
    CommandLine|contains: appcmd.exe add module
  selection_cli_2:
    CommandLine|contains: ' system.enterpriseservices.internal.publish'
    Image|endswith: \powershell.exe
  selection_cli_3:
    CommandLine|contains|all:
    - gacutil
    - ' /I'
  condition: selection_parent and 1 of selection_cli_*
