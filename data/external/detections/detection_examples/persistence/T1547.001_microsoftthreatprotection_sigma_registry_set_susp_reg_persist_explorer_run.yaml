technique_id: T1547.001
technique_name: Registry Persistence via Explorer Run Key
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: b7916c2a-fa2f-4795-9477-32b731f70f11
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details|contains:\n  - :\\$Recycle.bin\\\n  - :\\ProgramData\\\n  - :\\Temp\\\
  \n  - :\\Users\\Default\\\n  - :\\Users\\Public\\\n  - :\\Windows\\Temp\\\n  - \\\
  AppData\\Local\\Temp\\\n  TargetObject|endswith: \\Microsoft\\Windows\\CurrentVersion\\\
  Policies\\Explorer\\Run\n"
explanation: Detects a possible persistence mechanism using RUN key for Windows Explorer
  and pointing to a suspicious folder
false_positives:
- Unknown
references:
- https://researchcenter.paloaltonetworks.com/2018/07/unit42-upatre-continues-evolve-new-anti-analysis-techniques/
