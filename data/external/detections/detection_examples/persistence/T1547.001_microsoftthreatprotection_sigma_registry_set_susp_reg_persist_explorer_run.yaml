detection:
  selection:
    TargetObject|endswith: \Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
    Details|contains:
    - :\$Recycle.bin\
    - :\ProgramData\
    - :\Temp\
    - :\Users\Default\
    - :\Users\Public\
    - :\Windows\Temp\
