technique_id: T1528
technique_name: Application URI Configuration Changes
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 0055ad1f-be85-4798-83cf-a6da17c993b3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  properties.message: Update Application Sucess- Property Name AppAddress\n"
explanation: 'Detects when a configuration change is made to an applications URI.

  URIs for domain names that no longer exist (dangling URIs), not using HTTPS, wildcards
  at the end of the domain, URIs that are no unique to that app, or URIs that point
  to domains you do not control should be investigated.

  '
false_positives:
- When and administrator is making legitimate URI configuration changes to an application.
  This should be a planned event.
references:
- https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications#application-configuration-changes
