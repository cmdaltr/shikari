technique_id: T1546.003
technique_name: Suspicious WMI Event Subscription Created
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "any where\n (\n   (event.dataset == \"windows.sysmon_operational\" and event.code\
  \ == \"21\" and\n    ?winlog.event_data.Operation : \"Created\" and ?winlog.event_data.Consumer\
  \ : (\"*subscription:CommandLineEventConsumer*\", \"*subscription:ActiveScriptEventConsumer*\"\
  )) or\n\n   (event.dataset == \"endpoint.events.api\" and event.provider == \"Microsoft-Windows-WMI-Activity\"\
  \ and ?process.Ext.api.name == \"IWbemServices::PutInstance\" and\n    ?process.Ext.api.parameters.consumer_type\
  \ in (\"ActiveScriptEventConsumer\", \"CommandLineEventConsumer\"))\n )"
explanation: 'Detects the creation of a WMI Event Subscription. Attackers can abuse
  this mechanism for persistence or to elevate to

  SYSTEM privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e72f87d0-a70e-4f8d-8443-a6407bc34643.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts or tools may create WMI event subscriptions
    for system monitoring or automation. Review the source and context of the event
    to determine if it aligns with known administrative activities.

    - Software installations or updates might use WMI event subscriptions as part
    of their setup or configuration processes. Verify if the event coincides with
    recent software changes and consider excluding these specific events if they are
    routine.

    - Sec'
  mitigation: Review investigation guide for details
references:
- https://www.blackhat.com/docs/us-15/materials/us-15-Graeber-Abusing-Windows-Management-Instrumentation-WMI-To-Build-A-Persistent%20Asynchronous-And-Fileless-Backdoor-wp.pdf
- https://medium.com/threatpunter/detecting-removing-wmi-persistence-60ccbb7dff96
has_investigation_guide: true
risk_score: 47
