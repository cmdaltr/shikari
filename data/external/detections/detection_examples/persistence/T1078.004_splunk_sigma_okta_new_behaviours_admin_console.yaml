technique_id: T1078.004
technique_name: Okta New Admin Console Behaviours
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: a0b38b70-3cb5-484b-a4eb-c4d8e7bcc0a9
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_event:\n  eventtype: policy.evaluate_sign_on\n  target.displayname: Okta\
  \ Admin Console\nselection_positive:\n- debugcontext.debugdata.behaviors|contains:\
  \ POSITIVE\n- debugcontext.debugdata.logonlysecuritydata|contains: POSITIVE\n"
explanation: Detects when Okta identifies new activity in the Admin Console.
false_positives:
- When an admin begins using the Admin Console and one of Okta's heuristics incorrectly
  identifies the behavior as being unusual.
references:
- https://developer.okta.com/docs/reference/api/system-log/
- https://sec.okta.com/articles/2023/08/cross-tenant-impersonation-prevention-and-detection
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.t1078.004
logsource:
  product: okta
  service: okta
detection:
  selection_event:
    eventtype: policy.evaluate_sign_on
    target.displayname: Okta Admin Console
  selection_positive:
  - debugcontext.debugdata.behaviors|contains: POSITIVE
  - debugcontext.debugdata.logonlysecuritydata|contains: POSITIVE
  condition: all of selection_*
