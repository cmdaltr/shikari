technique_id: T1219
technique_name: Suspicious Velociraptor Child Process
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 4bc90587-e6ca-4b41-be0b-ed4d04e4ed0c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_parent and\
  \ 1 of selection_child_*\nselection_child_msiexec:\n  CommandLine|contains|all:\n\
  \  - msiexec\n  - /i\n  - http\nselection_child_powershell:\n  CommandLine|contains:\n\
  \  - 'Invoke-WebRequest '\n  - 'IWR '\n  - .DownloadFile\n  - .DownloadString\n\
  \  Image|endswith:\n  - \\powershell.exe\n  - \\powershell_ise.exe\n  - \\pwsh.exe\n\
  selection_child_vscode_tunnel:\n  CommandLine|contains|all:\n  - code.exe\n  - tunnel\n\
  \  - --accept-server-license-terms\nselection_parent:\n  ParentImage|endswith: \\\
  Velociraptor.exe\n"
explanation: Detects the suspicious use of the Velociraptor DFIR tool to execute other
  tools or download additional payloads, as seen in a campaign where it was abused
  for remote access and to stage further attacks.
false_positives:
- Legitimate administrators or incident responders might use Velociraptor to execute
  scripts or tools. However, the combination of Velociraptor spawning these specific
  processes with these command lines is suspicious. Tuning may be required to exclude
  known administrative actions or specific scripts.
references:
- https://news.sophos.com/en-us/2025/08/26/velociraptor-incident-response-tool-abused-for-remote-access/
tags:
- attack.command-and-control
- attack.persistence
- attack.defense-evasion
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: \Velociraptor.exe
  selection_child_vscode_tunnel:
    CommandLine|contains|all:
    - code.exe
    - tunnel
    - --accept-server-license-terms
  selection_child_msiexec:
    CommandLine|contains|all:
    - msiexec
    - /i
    - http
  selection_child_powershell:
    Image|endswith:
    - \powershell.exe
    - \powershell_ise.exe
    - \pwsh.exe
    CommandLine|contains:
    - 'Invoke-WebRequest '
    - 'IWR '
    - .DownloadFile
    - .DownloadString
  condition: selection_parent and 1 of selection_child_*
metadata:
  created_date: 2025-08-29
