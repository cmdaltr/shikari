technique_id: T1505
technique_name: Unusual File Creation by Web Server
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: "from logs-endpoint.events.file-*\n| keep\n    @timestamp,\n    host.os.type,\n\
  \    event.type,\n    event.action,\n    user.name,\n    user.id,\n    process.name,\n\
  \    process.executable,\n    file.path,\n    agent.id,\n    host.name\n| where\n\
  \    @timestamp > now() - 1 hours and\n    host.os.type == \"linux\" and\n    event.type\
  \ == \"change\" and\n    event.action in (\"rename\", \"creation\") and (\n    \
  \    user.name in (\n            \"apache\", \"www-data\", \"httpd\", \"nginx\"\
  , \"lighttpd\", \"tomcat\", \"tomcat8\", \"tomcat9\", \"ftp\", \"ftpuser\", \"ftpd\"\
  \n        ) or\n        user.id in (\"99\", \"33\", \"498\", \"48\")\n    ) and\
  \ (\n        process.name in (\n            \"apache\", \"nginx\", \"apache2\",\
  \ \"httpd\", \"lighttpd\", \"caddy\", \"node\", \"mongrel_rails\", \"java\", \"\
  gunicorn\",\n            \"uwsgi\", \"openresty\", \"cherokee\", \"h2o\", \"resin\"\
  , \"puma\", \"unicorn\", \"traefik\", \"tornado\", \"hypercorn\",\n            \"\
  daphne\", \"twistd\", \"yaws\", \"webfsd\", \"httpd.worker\", \"flask\", \"rails\"\
  , \"mongrel\"\n        ) or\n        process.name like \"php-*\" or\n        process.name\
  \ like \"python*\" or\n        process.name like \"ruby*\" or\n        process.name\
  \ like \"perl*\"\n    )\n| stats\n    Esql.event_count = count(),\n    Esql.agent_id_count_distinct\
  \ = count_distinct(agent.id),\n    Esql.host_name_values = values(host.name),\n\
  \    Esql.agent_id_values = values(agent.id)\n  by process.executable, file.path\n\
  | where\n    Esql.agent_id_count_distinct == 1 and\n    Esql.event_count < 5\n|\
  \ sort Esql.event_count asc\n| limit 100"
explanation: 'This rule detects unusual file creations from a web server parent process.
  Adversaries may attempt to create files from

  a web server parent process to establish persistence, execute malicious scripts,
  or exfiltrate data. ES|QL rules have

  limited fields available in its alert documents. Make sure to review the original
  documents to aid in the investigation

  of this alert.'
