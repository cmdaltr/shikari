query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_legit_path:\n  Image|startswith: C:\\Windows\\System32\\\
  SystemResetPlatform\\\nselection:\n  Image: \\SystemResetPlatform.exe\n  ImageLoaded|endswith:\
  \ \\RjvPlatform.dll\n"
explanation: Detects potential DLL sideloading of "RjvPlatform.dll" by "SystemResetPlatform.exe"
  located in a non-default location.
false_positives:
- Unlikely
