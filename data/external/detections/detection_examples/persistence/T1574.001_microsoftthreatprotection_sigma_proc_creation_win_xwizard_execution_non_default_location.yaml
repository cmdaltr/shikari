technique_id: T1574.001
technique_name: Xwizard.EXE Execution From Non-Default Location
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 193d5ccd-6f59-40c6-b5b0-8e32d5ddd3d1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_legit_location:\n  Image|startswith:\n  - C:\\Windows\\\
  System32\\\n  - C:\\Windows\\SysWOW64\\\n  - C:\\Windows\\WinSxS\\\nselection:\n\
  - Image|endswith: \\xwizard.exe\n- OriginalFileName: xwizard.exe\n"
explanation: 'Detects the execution of Xwizard tool from a non-default directory.

  When executed from a non-default directory, this utility can be abused in order
  to side load a custom version of "xwizards.dll".

  '
false_positives:
- Windows installed on non-C drive
references:
- https://lolbas-project.github.io/lolbas/Binaries/Xwizard/
- http://www.hexacorn.com/blog/2017/07/31/the-wizard-of-x-oppa-plugx-style/
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: \xwizard.exe
  - OriginalFileName: xwizard.exe
  filter_main_legit_location:
    Image|startswith:
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
    - C:\Windows\WinSxS\
  condition: selection and not 1 of filter_main_*
