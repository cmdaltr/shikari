query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_group:\n  CommandLine|contains:\n  - Remote Desktop Users\n  - \"Utilisateurs\
  \ du Bureau \\xE0 distance\"\n  - Usuarios de escritorio remoto\nselection_main:\n\
  - CommandLine|contains|all:\n  - 'localgroup '\n  - ' /add'\n- CommandLine|contains|all:\n\
  \  - 'Add-LocalGroupMember '\n  - ' -Group '\n"
explanation: Detects addition of users to the local Remote Desktop Users group via
  "Net" or "Add-LocalGroupMember".
