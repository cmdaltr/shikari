technique_id: T1098
technique_name: Google Workspace Custom Admin Role Created
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:google_workspace.admin and event.provider:admin and event.category:iam
  and event.action:CREATE_ROLE
explanation: 'Detects when a custom admin role is created in Google Workspace. An
  adversary may create a custom admin role in order to

  elevate the permissions of other user accounts and persist in their target’s environment.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ad3f2807-2b3e-47d7-b282-f84acbbe14be.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Google Workspace
  confidence: high
false_positives:
- description: 'False positive analysis


    - After identifying the user account that created the role, verify whether the
    action was intentional.

    - Verify that the user who created the role should have administrative privileges
    in Google Workspace to create custom roles.

    - Review organizational units or groups the role may have been added to and ensure
    the new privileges align properly.

    - Create a filter with the user''s `user.name` and filter for `event.action`.
    In the results, check if there are multiple `CREATE'
  mitigation: Review investigation guide for details
references:
- https://support.google.com/a/answer/2406043?hl=en
- https://www.elastic.co/security-labs/google-workspace-attack-surface-part-one
- https://www.elastic.co/security-labs/google-workspace-attack-surface-part-two
has_investigation_guide: true
risk_score: 47
