technique_id: T1653
technique_name: Mask System Power Settings Via Systemctl
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: c172b7b5-f3a1-4af2-90b7-822c63df86cb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_power_options:\n  CommandLine|contains:\n  - suspend.target\n  - hibernate.target\n\
  \  - hybrid-sleep.target\nselection_systemctl:\n  CommandLine|contains: ' mask'\n\
  \  Image|endswith: /systemctl\n"
explanation: 'Detects the use of systemctl mask to disable system power management
  targets such as suspend, hibernate, or hybrid sleep.

  Adversaries may mask these targets to prevent a system from entering sleep or shutdown
  states, ensuring their malicious processes remain active and uninterrupted.

  This behavior can be associated with persistence or defense evasion, as it impairs
  normal system power operations to maintain long-term access or avoid termination
  of malicious activity.

  '
false_positives:
- Unlikely
references:
- https://www.man7.org/linux/man-pages/man1/systemctl.1.html
- https://linux-audit.com/systemd/faq/what-is-the-difference-between-systemctl-disable-and-systemctl-mask/
tags:
- attack.persistence
- attack.impact
- attack.t1653
logsource:
  category: process_creation
  product: linux
detection:
  selection_systemctl:
    Image|endswith: /systemctl
    CommandLine|contains: ' mask'
  selection_power_options:
    CommandLine|contains:
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
  condition: all of selection_*
