technique_id: T1098.003
technique_name: Azure Privilege Identity Management Role Modified
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:azure.auditlogs and azure.auditlogs.operation_name:"Update role
  setting in PIM" and event.outcome:(Success or success)
explanation: 'Azure Active Directory (AD) Privileged Identity Management (PIM) is
  a service that enables you to manage, control, and

  monitor access to important resources in an organization. PIM can be used to manage
  the built-in Azure resource roles

  such as Global Administrator and Application Administrator. An adversary may add
  a user to a PIM role in order to

  maintain persistence in their target''s environment or modify a PIM role to weaken
  their target''s security controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7882cebf-6cf1-4de3-9662-213aa13e8b80.toml
query_type: query
query_language: kuery
