query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - Image|endswith: \\SharpUp.exe\n- Description: SharpUp\n- CommandLine|contains:\n\
  \  - HijackablePaths\n  - UnquotedServicePath\n  - ProcessDLLHijack\n  - ModifiableServiceBinaries\n\
  \  - ModifiableScheduledTask\n  - DomainGPPPassword\n  - CachedGPPPassword\n"
