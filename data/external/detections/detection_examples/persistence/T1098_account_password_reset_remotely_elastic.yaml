technique_id: T1098
technique_name: Account Password Reset Remotely
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by winlog.computer_name with maxspan=1m\n  [authentication where\
  \ event.action == \"logged-in\" and\n    /* event 4624 need to be logged */\n  \
  \  winlog.logon.type : \"Network\" and event.outcome == \"success\" and source.ip\
  \ != null and\n    source.ip != \"127.0.0.1\" and source.ip != \"::1\" and\n   \
  \ not winlog.event_data.TargetUserName : (\"svc*\", \"PIM_*\", \"_*_\", \"*-*-*\"\
  , \"*$\")] by winlog.event_data.TargetLogonId\n   /* event 4724 need to be logged\
  \ */\n  [iam where event.action == \"reset-password\" and\n   (\n    /*\n      \
  \ This rule is very noisy if not scoped to privileged accounts, duplicate the\n\
  \       rule and add your own naming convention and accounts of interest here.\n\
  \     */\n    winlog.event_data.TargetUserName: (\"*Admin*\", \"*super*\", \"*SVC*\"\
  , \"*DC0*\", \"*service*\", \"*DMZ*\", \"*ADM*\") or\n    winlog.event_data.TargetSid\
  \ : (\"S-1-5-21-*-500\", \"S-1-12-1-*-500\")\n    )\n  ] by winlog.event_data.SubjectLogonId"
explanation: 'Identifies an attempt to reset a potentially privileged account password
  remotely. Adversaries may manipulate account

  passwords to maintain access or evade password duration policies and preserve compromised
  credentials.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2820c9c2-bcd7-4d6e-9eba-faf3891ba450.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks can trigger false positives when legitimate IT
    staff reset passwords for maintenance or support. To manage this, create exceptions
    for known IT personnel or service accounts that frequently perform these actions.

    - Automated scripts or tools used for account management might cause false alerts.
    Identify and exclude these scripts or tools by their specific account names or
    IP addresses.

    - Scheduled password resets for compliance or security'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4724
- https://stealthbits.com/blog/manipulating-user-passwords-with-mimikatz/
- https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES/blob/master/Credential%20Access/remote_pwd_reset_rpc_mimikatz_postzerologon_target_DC.evtx
- https://www.elastic.co/security-labs/detect-credential-access
has_investigation_guide: true
risk_score: 47
