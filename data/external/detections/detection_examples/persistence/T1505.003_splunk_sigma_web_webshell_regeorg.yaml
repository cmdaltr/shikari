technique_id: T1505.003
technique_name: Webshell ReGeorg Detection Via Web Logs
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 2ea44a60-cfda-11ea-87d0-0242ac130003
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and filter\n\
  filter:\n  cs-method: POST\n  cs-referer: null\n  cs-user-agent: null\nselection:\n\
  \  cs-uri-query|contains:\n  - cmd=read\n  - connect&target\n  - cmd=connect\n \
  \ - cmd=disconnect\n  - cmd=forward\n"
explanation: Certain strings in the uri_query field when combined with null referer
  and null user agent can indicate activity associated with the webshell ReGeorg.
false_positives:
- Web applications that use the same URL parameters as ReGeorg
references:
- https://community.rsa.com/community/products/netwitness/blog/2019/02/19/web-shells-and-netwitness-part-3
- https://github.com/sensepost/reGeorg
tags:
