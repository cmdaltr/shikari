technique_id: T1574.001
technique_name: DHCP Callout DLL Installation
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 9d3436ef-9476-4c43-acca-90ce06bdf33a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetObject|endswith:\n  - \\Services\\DHCPServer\\Parameters\\CalloutDlls\n\
  \  - \\Services\\DHCPServer\\Parameters\\CalloutEnabled\n"
explanation: Detects the installation of a Callout DLL via CalloutDlls and CalloutEnabled
  parameter in Registry, which can be used to execute code in context of the DHCP
  server (restart required)
false_positives:
- Unknown
