technique_id: T1197
technique_name: Persistence via BITS Job Notify Cmdline
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : \"svchost.exe\" and process.parent.args : \"BITS\" and\n\
  \  not process.executable :\n              (\"?:\\\\Windows\\\\System32\\\\WerFaultSecure.exe\"\
  ,\n               \"?:\\\\Windows\\\\System32\\\\WerFault.exe\",\n             \
  \  \"?:\\\\Windows\\\\System32\\\\wermgr.exe\",\n               \"?:\\\\WINDOWS\\\
  \\system32\\\\directxdatabaseupdater.exe\")"
explanation: 'An adversary can use the Background Intelligent Transfer Service (BITS)
  SetNotifyCmdLine method to execute a program

  that runs after a job finishes transferring data or after a job enters a specified
  state in order to persist on a

  system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c3b915e0-22f3-4bf7-991d-b643513c722f.toml
