technique_id: T1037
technique_name: Message-of-the-Day (MOTD) File Creation
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"linux\" and event.action in (\"rename\", \"creation\"\
  ) and\nfile.path : \"/etc/update-motd.d/*\" and not (\n  process.executable in (\n\
  \    \"/bin/dpkg\", \"/usr/bin/dpkg\", \"/bin/dockerd\", \"/usr/bin/dockerd\", \"\
  /usr/sbin/dockerd\", \"/bin/microdnf\",\n    \"/usr/bin/microdnf\", \"/bin/rpm\"\
  , \"/usr/bin/rpm\", \"/bin/snapd\", \"/usr/bin/snapd\", \"/bin/yum\", \"/usr/bin/yum\"\
  ,\n    \"/bin/dnf\", \"/usr/bin/dnf\", \"/bin/podman\", \"/usr/bin/podman\", \"\
  /bin/dnf-automatic\", \"/usr/bin/dnf-automatic\",\n    \"/bin/pacman\", \"/usr/bin/pacman\"\
  , \"/usr/bin/dpkg-divert\", \"/bin/dpkg-divert\", \"/sbin/apk\", \"/usr/sbin/apk\"\
  ,\n    \"/usr/local/sbin/apk\", \"/usr/bin/apt\", \"/usr/sbin/pacman\", \"/bin/podman\"\
  , \"/usr/bin/podman\", \"/usr/bin/puppet\",\n    \"/bin/puppet\", \"/opt/puppetlabs/puppet/bin/puppet\"\
  , \"/usr/bin/chef-client\", \"/bin/chef-client\",\n    \"/bin/autossl_check\", \"\
  /usr/bin/autossl_check\", \"/proc/self/exe\", \"/dev/fd/*\",  \"/usr/bin/pamac-daemon\"\
  ,\n    \"/bin/pamac-daemon\", \"/usr/lib/snapd/snapd\", \"/usr/local/bin/dockerd\"\
  \n  ) or\n  file.extension in (\"swp\", \"swpx\", \"swx\", \"dpkg-remove\") or\n\
  \  file.Ext.original.extension == \"dpkg-new\" or\n  process.executable : (\n  \
  \  \"/nix/store/*\", \"/var/lib/dpkg/*\", \"/tmp/vmis.*\", \"/snap/*\", \"/dev/fd/*\"\
  , \"/usr/lib/virtualbox/*\"\n  ) or\n  process.executable == null or\n  process.name\
  \ in (\"executor\", \"dockerd\", \"crio\") or\n  (process.name == \"sed\" and file.name\
  \ : \"sed*\") or\n  (process.name == \"perl\" and file.name : \"e2scrub_all.tmp*\"\
  ) \n)"
explanation: 'This rule detects the creation of potentially malicious files within
  the default MOTD file directories. Message of the

  day (MOTD) is the message that is presented to the user when a user connects to
  a Linux server via SSH or a serial

  connection. Linux systems contain several default MOTD files located in the "/etc/update-motd.d/"
  directory. These

  scripts run as the root user every time a user connects over SSH or a serial connection.
  Adversaries may create

  malicious MOTD files that grant them persistence onto the target every time a user
  connects to the system by executing a

  backdoor script or command.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/96d11d31-9a79-480f-8401-da28b194608f.toml
