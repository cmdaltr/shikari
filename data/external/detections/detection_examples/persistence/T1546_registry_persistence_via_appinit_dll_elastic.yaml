technique_id: T1546
technique_name: Registry Persistence via AppInit DLL
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : \"AppInit_Dlls\" and\n  not process.executable : (\n     \"\
  ?:\\\\Windows\\\\System32\\\\DriverStore\\\\FileRepository\\\\*\\\\Display.NvContainer\\\
  \\NVDisplay.Container.exe\",\n     \"?:\\\\Windows\\\\System32\\\\msiexec.exe\"\
  ,\n     \"?:\\\\Windows\\\\SysWOW64\\\\msiexec.exe\",\n     \"?:\\\\Program Files\\\
  \\Commvault\\\\Base\\\\cvd.exe\",\n     \"?:\\\\Program Files\\\\Commvault\\\\ContentStore*\\\
  \\Base\\\\cvd.exe\",\n     \"?:\\\\Program Files (x86)\\\\Commvault\\\\Base\\\\\
  cvd.exe\",\n     \"?:\\\\Program Files (x86)\\\\Commvault\\\\ContentStore*\\\\Base\\\
  \\cvd.exe\",\n     \"?:\\\\Program Files\\\\NVIDIA Corporation\\\\Display.NvContainer\\\
  \\NVDisplay.Container.exe\",\n\n     /* Crowdstrike specific condition as it uses\
  \ NT Object paths */\n     \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\
  \\DriverStore\\\\FileRepository\\\\*\\\\Display.NvContainer\\\\NVDisplay.Container.exe\"\
  ,\n     \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\msiexec.exe\"\
  ,\n     \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\SysWOW64\\\\msiexec.exe\"\
  ,\n     \"\\\\Device\\\\HarddiskVolume*\\\\Program Files\\\\Commvault\\\\Base\\\\\
  cvd.exe\",\n     \"\\\\Device\\\\HarddiskVolume*\\\\Program Files\\\\Commvault\\\
  \\ContentStore*\\\\Base\\\\cvd.exe\",\n     \"\\\\Device\\\\HarddiskVolume*\\\\\
  Program Files (x86)\\\\Commvault\\\\Base\\\\cvd.exe\",\n     \"\\\\Device\\\\HarddiskVolume*\\\
  \\Program Files (x86)\\\\Commvault\\\\ContentStore*\\\\Base\\\\cvd.exe\",\n    \
  \ \"\\\\Device\\\\HarddiskVolume*\\\\Program Files\\\\NVIDIA Corporation\\\\Display.NvContainer\\\
  \\NVDisplay.Container.exe\"\n  )\n  /*\n    Full registry key path omitted due to\
  \ data source variations:\n    \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\\
  CurrentVersion\\\\Windows\\\\AppInit_Dlls\"\n    \"HKLM\\\\SOFTWARE\\\\Wow6432Node\\\
  \\Microsoft\\\\Windows NT\\\\CurrentVersion\\\\Windows\\\\AppInit_Dlls\"\n  */"
explanation: 'AppInit DLLs are dynamic-link libraries (DLLs) that are loaded into
  every process that creates a user interface (loads

  user32.dll) on Microsoft Windows operating systems. The AppInit DLL mechanism is
  used to load custom code into user-mode

  processes, allowing for the customization of the user interface and the behavior
  of Windows-based applications.

  Attackers who add those DLLs to the registry locations can execute code with elevated
  privileges, similar to process

  injection, and provide a solid and constant persistence on the machine.'
