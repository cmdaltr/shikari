level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - sethc.exe\n  - utilman.exe\n  - osk.exe\n  - Magnify.exe\n\
  \  - Narrator.exe\n  - DisplaySwitch.exe\n  Image|endswith:\n  - \\cmd.exe\n  -\
  \ \\cscript.exe\n  - \\mshta.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n\
  \  - \\rundll32.exe\n  - \\wscript.exe\n  - \\wt.exe\n  ParentImage|endswith: \\\
  winlogon.exe\n"
explanation: Detects the usage and installation of a backdoor that uses an option
  to register a malicious debugger for built-in tools that are accessible in the login
  screen
false_positives:
- Unlikely
