false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may modify registry keys for setup
    or configuration purposes. Users can create exceptions for known software paths
    like C:\Program Files\*.exe to reduce noise.

    - System maintenance processes such as Windows Update might trigger changes in
    registry keys like SetupExecute. Exclude processes like TiWorker.exe and poqexec.exe
    when they match known update patterns.

