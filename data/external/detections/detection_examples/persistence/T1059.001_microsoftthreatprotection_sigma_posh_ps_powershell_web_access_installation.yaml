technique_id: T1059.001
technique_name: PowerShell Web Access Installation - PsScript
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 5f9c7f1a-7c21-4c39-b2f3-8d8006e0e51f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_auth:\n\
  \  ScriptBlockText|contains|all:\n  - Add-PswaAuthorizationRule\n  - -UserName *\n\
  \  - -ComputerName *\nselection_config:\n  ScriptBlockText|contains: Install-PswaWebApplication\n\
  selection_install:\n  ScriptBlockText|contains: Install-WindowsFeature WindowsPowerShellWebAccess\n"
explanation: Detects the installation and configuration of PowerShell Web Access,
  which could be used for remote access and potential abuse
false_positives:
- Legitimate PowerShell Web Access installations by administrators
references:
- https://docs.microsoft.com/en-us/powershell/module/powershellwebaccess/install-pswawebapplication
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
- https://gist.github.com/MHaggis/7e67b659af9148fa593cf2402edebb41
tags:
- attack.persistence
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_install:
    ScriptBlockText|contains: Install-WindowsFeature WindowsPowerShellWebAccess
  selection_config:
    ScriptBlockText|contains: Install-PswaWebApplication
  selection_auth:
    ScriptBlockText|contains|all:
    - Add-PswaAuthorizationRule
    - -UserName *
    - -ComputerName *
  condition: 1 of selection_*
