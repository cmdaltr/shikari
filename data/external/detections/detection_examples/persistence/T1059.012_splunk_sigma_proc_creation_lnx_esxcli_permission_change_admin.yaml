technique_id: T1059.012
technique_name: ESXi Admin Permission Assigned To Account Via ESXCLI
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains: system\n  CommandLine|contains|all:\n  - ' permission '\n\
  \  - ' set'\n  - Admin\n  Image|endswith: /esxcli\n"
explanation: Detects execution of the "esxcli" command with the "system" and "permission"
  flags in order to assign admin permissions to an account.
false_positives:
- Legitimate administration activities
references:
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_system.html
tags:
- attack.persistence
- attack.execution
- attack.privilege-escalation
- attack.t1059.012
- attack.t1098
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: /esxcli
    CommandLine|contains: system
    CommandLine|contains|all:
    - ' permission '
    - ' set'
    - Admin
  condition: selection
