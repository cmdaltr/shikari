technique_id: T1546.013
technique_name: Persistence via PowerShell profile
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.type != \"deletion\" and\n\
  \  file.name : (\"profile.ps1\", \"Microsoft.Powershell_profile.ps1\") and\n  file.path\
  \ : (\"?:\\\\Users\\\\*\\\\Documents\\\\WindowsPowerShell\\\\*.ps1\", \n       \
  \             \"?:\\\\Users\\\\*\\\\Documents\\\\PowerShell\\\\*.ps1\", \n     \
  \               \"?:\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\*.ps1\", \n\
  \                    \"\\\\Device\\\\HarddiskVolume*\\\\Users\\\\*\\\\Documents\\\
  \\WindowsPowerShell\\\\*.ps1\", \n                    \"\\\\Device\\\\HarddiskVolume*\\\
  \\Users\\\\*\\\\Documents\\\\PowerShell\\\\*.ps1\", \n                    \"\\\\\
  Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\WindowsPowerShell\\\\*.ps1\"\
  )"
explanation: 'Identifies the creation or modification of a PowerShell profile. PowerShell
  profile is a script that is executed when

  PowerShell starts to customize the user environment, which can be abused by attackers
  to persist in a environment where

  PowerShell is common.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5cf6397e-eb91-4f31-8951-9f0eaa755a31.toml
