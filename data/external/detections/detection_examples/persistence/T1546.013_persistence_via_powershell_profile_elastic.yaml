false_positives:
- description: "False positive analysis\n\n- This is a dual-use mechanism, meaning\
    \ its usage is not inherently malicious. Analysts can dismiss the alert if the\
    \ script doesn't contain malicious functions or potential for abuse, no other\
    \ suspicious activity was identified, and the user has business justifications\
    \ to use PowerShell.\n\n### Response and remediation\n\n- Initiate the incident\
    \ response process based on the outcome of the triage.\n  - If malicious activity\
    \ is confirmed, perform a broader investigation to ide"
  mitigation: Review investigation guide for details
