technique_id: T1574
technique_name: Suspicious Printer Driver Empty Manufacturer
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: e0813366-0407-449a-9869-a2db1119dc41
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_cutepdf:\n  TargetObject|contains: \\CutePDF Writer v4.0\\\n\
  filter_pdf24:\n  TargetObject|contains: \\Version-3\\PDF24\\\nfilter_vnc:\n  TargetObject|contains:\n\
  \  - \\VNC Printer (PS)\\\n  - \\VNC Printer (UD)\\\nselection:\n  Details: (Empty)\n\
  \  TargetObject|contains|all:\n  - \\Control\\Print\\Environments\\Windows x64\\\
  Drivers\n  - \\Manufacturer\n"
explanation: Detects a suspicious printer driver installation with an empty Manufacturer
  value
false_positives:
- Alerts on legitimate printer drivers that do not set any more details in the Manufacturer
  value
references:
- https://twitter.com/SBousseaden/status/1410545674773467140
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574
- cve.2021-1675
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - \Control\Print\Environments\Windows x64\Drivers
    - \Manufacturer
    Details: (Empty)
  filter_cutepdf:
    TargetObject|contains: \CutePDF Writer v4.0\
  filter_vnc:
    TargetObject|contains:
    - \VNC Printer (PS)\
    - \VNC Printer (UD)\
  filter_pdf24:
    TargetObject|contains: \Version-3\PDF24\
  condition: selection and not 1 of filter_*
