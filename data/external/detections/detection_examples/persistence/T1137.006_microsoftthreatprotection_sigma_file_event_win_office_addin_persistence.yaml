technique_id: T1137.006
technique_name: Potential Persistence Via Microsoft Office Add-In
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_generic:\n\
  \  TargetFilename|contains: \\Microsoft\\Addins\\\n  TargetFilename|endswith:\n\
  \  - .xlam\n  - .xla\n  - .ppam\nselection_wlldropped:\n  TargetFilename|contains:\
  \ \\Microsoft\\Word\\Startup\\\n  TargetFilename|endswith: .wll\nselection_xladropped:\n\
  \  TargetFilename|contains: Microsoft\\Excel\\XLSTART\\\n  TargetFilename|endswith:\
  \ .xlam\nselection_xlldropped:\n  TargetFilename|contains: \\Microsoft\\Excel\\\
  Startup\\\n  TargetFilename|endswith: .xll\n"
explanation: Detects potential persistence activity via startup add-ins that load
  when Microsoft Office starts (.wll/.xll are simply .dll fit for Word or Excel).
false_positives:
- Legitimate add-ins
references:
- Internal Research
- https://labs.withsecure.com/publications/add-in-opportunities-for-office-persistence
- https://github.com/redcanaryco/atomic-red-team/blob/4ae9580a1a8772db87a1b6cdb0d03e5af231e966/atomics/T1137.006/T1137.006.md
tags:
- attack.persistence
- attack.t1137.006
logsource:
  category: file_event
  product: windows
detection:
  selection_wlldropped:
    TargetFilename|contains: \Microsoft\Word\Startup\
    TargetFilename|endswith: .wll
  selection_xlldropped:
    TargetFilename|contains: \Microsoft\Excel\Startup\
    TargetFilename|endswith: .xll
  selection_xladropped:
    TargetFilename|contains: Microsoft\Excel\XLSTART\
    TargetFilename|endswith: .xlam
  selection_generic:
    TargetFilename|contains: \Microsoft\Addins\
    TargetFilename|endswith:
    - .xlam
    - .xla
    - .ppam
  condition: 1 of selection_*
