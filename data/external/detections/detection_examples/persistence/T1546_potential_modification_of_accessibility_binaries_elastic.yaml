technique_id: T1546
technique_name: Potential Modification of Accessibility Binaries
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.name : (\"Utilman.exe\", \"winlogon.exe\") and user.name == \"\
  SYSTEM\" and\n process.pe.original_file_name : \"?*\" and\n process.args :\n   \
  \ (\n    \"C:\\\\Windows\\\\System32\\\\osk.exe\",\n    \"C:\\\\Windows\\\\System32\\\
  \\Magnify.exe\",\n    \"C:\\\\Windows\\\\System32\\\\Narrator.exe\",\n    \"C:\\\
  \\Windows\\\\System32\\\\Sethc.exe\",\n    \"utilman.exe\",\n    \"ATBroker.exe\"\
  ,\n    \"DisplaySwitch.exe\",\n    \"sethc.exe\"\n    )\n and not process.pe.original_file_name\
  \ in\n    (\n    \"osk.exe\",\n    \"sethc.exe\",\n    \"utilman2.exe\",\n    \"\
  DisplaySwitch.exe\",\n    \"atbroker.exe\",\n    \"ATBroker.exe\",\n    \"ScreenMagnifier.exe\"\
  ,\n    \"SR.exe\",\n    \"Narrator.exe\",\n    \"magnify.exe\",\n    \"MAGNIFY.EXE\"\
  \n    )"
explanation: 'Windows contains accessibility features that may be launched with a
  key combination before a user has logged in. An

  adversary can modify the way these programs are launched to get a command prompt
  or backdoor without logging in to the

  system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7405ddf1-6c8e-41ce-818f-48bea6bcaed8.toml
