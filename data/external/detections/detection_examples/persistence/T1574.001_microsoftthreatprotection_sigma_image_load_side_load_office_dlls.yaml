query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ImageLoaded|startswith:\n  - C:\\Program Files\\Microsoft Office\\OFFICE\n\
  \  - C:\\Program Files (x86)\\Microsoft Office\\OFFICE\n  - C:\\Program Files\\\
  Microsoft Office\\Root\\OFFICE\n  - C:\\Program Files (x86)\\Microsoft Office\\\
  Root\\OFFICE\nselection:\n  ImageLoaded|endswith: \\outllib.dll\n"
explanation: Detects DLL sideloading of DLLs that are part of Microsoft Office from
  non standard location
false_positives:
- Unlikely
references:
- https://hijacklibs.net/
