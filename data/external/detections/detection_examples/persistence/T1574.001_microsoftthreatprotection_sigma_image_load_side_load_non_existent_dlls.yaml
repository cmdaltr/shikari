technique_id: T1574.001
technique_name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_ms_signed:\n  Signature: Microsoft Windows\n  SignatureStatus:\
  \ Valid\n  Signed: 'true'\nselection:\n  ImageLoaded|endswith:\n  - :\\Windows\\\
  System32\\TSMSISrv.dll\n  - :\\Windows\\System32\\TSVIPSrv.dll\n  - :\\Windows\\\
  System32\\wbem\\wbemcomn.dll\n  - :\\Windows\\System32\\WLBSCTRL.dll\n  - :\\Windows\\\
  System32\\wow64log.dll\n  - :\\Windows\\System32\\WptsExtensions.dll\n"
explanation: 'Detects DLL sideloading of system DLLs that are not present on the system
  by default (at least not in system directories).

  Usually this technique is used to achieve UAC bypass or privilege escalation.

  '
false_positives:
- Unknown
