technique_id: T1547.006
technique_name: Loading of Kernel Module via Insmod
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 106d7cbd-80ff-4985-b682-a7043e5acb72
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  comm: insmod\n  exe: /usr/bin/kmod\n  type: SYSCALL\n"
explanation: 'Detects loading of kernel modules with insmod command.

  Loadable Kernel Modules (LKMs) are pieces of code that can be loaded and unloaded
  into the kernel upon demand.

  Adversaries may use LKMs to obtain persistence within the system or elevate the
  privileges.

  '
false_positives:
- Unknown
