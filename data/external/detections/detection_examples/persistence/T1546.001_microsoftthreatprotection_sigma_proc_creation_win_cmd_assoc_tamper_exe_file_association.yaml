technique_id: T1546.001
technique_name: Change Default File Association To Executable Via Assoc
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: ae6f14e6-14de-45b0-9f44-c0986f50dc89
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not filter\nfilter:\n  CommandLine|contains: .exe=exefile\nselection_cli:\n  CommandLine|contains|all:\n\
  \  - 'assoc '\n  - exefile\nselection_img:\n- Image|endswith: \\cmd.exe\n- OriginalFileName:\
  \ Cmd.Exe\n"
explanation: 'Detects when a program changes the default file association of any extension
  to an executable.

  When a file is opened, the default program used to open the file (also called the
  file association or handler) is checked. File association selections are stored
  in the Windows Registry and can be edited by users, administrators, or programs
  that have Registry access or by administrators using the built-in assoc utility.
  Applications can modify the file association for a given file extension to call
  an arbitrary program when a file with the given extension is opened.

  '
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/assoc
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \cmd.exe
  - OriginalFileName: Cmd.Exe
  selection_cli:
    CommandLine|contains|all:
    - 'assoc '
    - exefile
  filter:
    CommandLine|contains: .exe=exefile
  condition: all of selection_* and not filter
