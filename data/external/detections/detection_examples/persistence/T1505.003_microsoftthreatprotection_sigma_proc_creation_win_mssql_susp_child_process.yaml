query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_optional_*\nfilter_optional_datev:\n  CommandLine|startswith: '\"C:\\Windows\\\
  system32\\cmd.exe\" '\n  Image: C:\\Windows\\System32\\cmd.exe\n  ParentImage|endswith:\
  \ DATEV_DBENGINE\\MSSQL\\Binn\\sqlservr.exe\n  ParentImage|startswith: C:\\Program\
  \ Files\\Microsoft SQL Server\\\nselection:\n  Image|endswith:\n  - \\bash.exe\n\
  \  - \\bitsadmin.exe\n  - \\cmd.exe\n  - \\netstat.exe\n  - \\nltest.exe\n  - \\\
  ping.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n\
  \  - \\sh.exe\n  - \\systeminfo.exe\n  - \\tasklist.exe\n  - \\wsl.exe\n  ParentImage|endswith:\
  \ \\sqlservr.exe\n"
