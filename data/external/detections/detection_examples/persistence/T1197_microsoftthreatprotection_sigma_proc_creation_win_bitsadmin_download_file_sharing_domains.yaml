technique_id: T1197
technique_name: Suspicious Download From File-Sharing Website Via Bitsadmin
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 8518ed3d-f7c9-4601-a26c-f361a4256a0c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_domain:\n  CommandLine|contains:\n  - .githubusercontent.com\n  - anonfiles.com\n\
  \  - cdn.discordapp.com\n  - ddns.net\n  - dl.dropboxusercontent.com\n  - ghostbin.co\n\
  \  - glitch.me\n  - gofile.io\n  - hastebin.com\n  - mediafire.com\n  - mega.nz\n\
  \  - onrender.com\n  - pages.dev\n  - paste.ee\n  - pastebin.com\n  - pastebin.pl\n\
  \  - pastetext.net\n  - privatlab.com\n  - privatlab.net\n  - send.exploit.in\n\
  \  - sendspace.com\n  - storage.googleapis.com\n  - storjshare.io\n  - supabase.co\n\
  \  - temp.sh\n  - transfer.sh\n  - trycloudflare.com\n  - ufile.io\n  - w3spaces.com\n\
  \  - workers.dev\nselection_flags:\n  CommandLine|contains:\n  - ' /transfer '\n\
  \  - ' /create '\n  - ' /addfile '\nselection_img:\n- Image|endswith: \\bitsadmin.exe\n\
  - OriginalFileName: bitsadmin.exe\n"
explanation: Detects usage of bitsadmin downloading a file from a suspicious domain
false_positives:
- Some legitimate apps use this, but limited.
references:
- https://blog.netspi.com/15-ways-to-download-a-file/#bitsadmin
- https://isc.sans.edu/diary/22264
- https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/ransomware-hive-conti-avoslocker
- https://www.cisa.gov/uscert/ncas/alerts/aa22-321a
- https://www.microsoft.com/en-us/security/blog/2024/01/17/new-ttps-observed-in-mint-sandstorm-campaign-targeting-high-profile-individuals-at-universities-and-research-orgs/
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1197
- attack.s0190
- attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \bitsadmin.exe
  - OriginalFileName: bitsadmin.exe
  selection_flags:
    CommandLine|contains:
    - ' /transfer '
    - ' /create '
    - ' /addfile '
  selection_domain:
    CommandLine|contains:
    - .githubusercontent.com
    - anonfiles.com
    - cdn.discordapp.com
    - ddns.net
    - dl.dropboxusercontent.com
    - ghostbin.co
    - glitch.me
    - gofile.io
    - hastebin.com
    - mediafire.com
    - mega.nz
    - onrender.com
    - pages.dev
    - paste.ee
    - pastebin.com
    - pastebin.pl
    - pastetext.net
    - privatlab.com
    - privatlab.net
    - send.exploit.in
    - sendspace.com
    - storage.googleapis.com
    - storjshare.io
    - supabase.co
    - temp.sh
    - transfer.sh
    - trycloudflare.com
    - ufile.io
    - w3spaces.com
    - workers.dev
  condition: all of selection_*
