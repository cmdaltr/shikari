query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Image|endswith: \\conhost.exe\nselection:\n  ParentImage|endswith: \\\
  dns.exe\n"
explanation: Detects an unexpected process spawning from dns.exe which may indicate
  activity related to remote code execution or other forms of exploitation as seen
  in CVE-2020-1350 (SigRed)
false_positives:
- Unknown
references:
- https://www.elastic.co/guide/en/security/current/unusual-child-process-of-dns-exe.html
