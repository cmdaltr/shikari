technique_id: T1547.006
technique_name: Kernel Module Load via insmod
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and process.name\
  \ == \"insmod\" and process.args : \"*.ko\" and\nnot process.parent.executable like\
  \ (\n  \"/opt/ds_agent/*\", \"/usr/sbin/veeamsnap-loader\", \"/opt/TrendMicro/vls_agent/*\"\
  , \"/opt/intel/oneapi/*\",\n  \"/opt/commvault/Base/linux_drv\", \"/bin/falcoctl\"\
  \n)"
explanation: 'Detects the use of the insmod binary to load a Linux kernel object file.
  Threat actors can use this binary, given they

  have root privileges, to load a rootkit on a system providing them with complete
  control and the ability to hide from

  security products. Manually loading a kernel module in this manner should not be
  at all common and can indicate

  suspcious or malicious behavior.'
