technique_id: T1505.003
technique_name: Suspicious ASPX File Drop by Exchange
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: bd1212e5-78da-431e-95fa-c58e3237a8e6
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection:\n\
  \  CommandLine|contains: MSExchange\n  Image|endswith: \\w3wp.exe\n  TargetFilename|contains:\n\
  \  - FrontEnd\\HttpProxy\\\n  - \\inetpub\\wwwroot\\aspnet_client\\\nselection_types:\n\
  \  TargetFilename|endswith:\n  - .aspx\n  - .asp\n  - .ashx\n"
explanation: Detects suspicious file type dropped by an Exchange component in IIS
  into a suspicious folder
false_positives:
- Unknown
references:
- https://www.microsoft.com/security/blog/2022/09/30/analyzing-attacks-using-the-exchange-vulnerabilities-cve-2022-41040-and-cve-2022-41082/
- https://www.gteltsc.vn/blog/canh-bao-chien-dich-tan-cong-su-dung-lo-hong-zero-day-tren-microsoft-exchange-server-12714.html
- https://en.gteltsc.vn/blog/cap-nhat-nhe-ve-lo-hong-bao-mat-0day-microsoft-exchange-dang-duoc-su-dung-de-tan-cong-cac-to-chuc-tai-viet-nam-9685.html
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith: \w3wp.exe
    CommandLine|contains: MSExchange
    TargetFilename|contains:
    - FrontEnd\HttpProxy\
    - \inetpub\wwwroot\aspnet_client\
  selection_types:
    TargetFilename|endswith:
    - .aspx
    - .asp
    - .ashx
  condition: all of selection*
