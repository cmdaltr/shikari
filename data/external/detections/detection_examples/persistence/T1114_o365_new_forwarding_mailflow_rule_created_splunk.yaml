technique_id: T1114
technique_name: O365 New Forwarding Mailflow Rule Created
tactic: persistence
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=Exchange Operation="New-TransportRule"
  | eval match1=mvfind(''Parameters{}.Name'',"BlindCopyTo") | eval match2=mvfind(''Parameters{}.Name'',"CopyTo")
  | eval match3=mvfind(''Parameters{}.Name'', "RedirectMessageTo") | where match1>=
  0 OR match2>= 0 OR match3>=0 | eval ForwardTo=coalesce(BlindCopyTo, CopyTo, RedirectMessageTo)
  | search ForwardTo!="" | rename UserId as user | fillnull | stats count earliest(_time)
  as firstTime latest(_time) as lastTime by user, Name, ForwardTo, vendor_account,
  vendor_product, dest, signature | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `o365_new_forwarding_mailflow_rule_created_filter`'
explanation: The following analytic detects the creation of new mail flow rules in
  Office 365 that may redirect or copy emails to unauthorized or external addresses.
  It leverages Office 365 Management Activity logs, specifically querying for the
  "New-TransportRule" operation and parameters like "BlindCopyTo", "CopyTo", and "RedirectMessageTo".
  This activity is significant as it can indicate potential data exfiltration or unauthorized
  access to sensitive information. If confirmed malicious, attackers could intercept
  or redirect email communications, leading to data breaches or information leakage.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/289ed0a1-4c78-4a43-9321-44ea2e089c14/
indicators:
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Forwarding mail flow rules may be created for legitimate reasons, filter
    as needed.
  mitigation: Review context and user activity
references:
