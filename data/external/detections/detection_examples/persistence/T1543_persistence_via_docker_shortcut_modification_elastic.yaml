technique_id: T1543
technique_name: Persistence via Docker Shortcut Modification
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"macos\" and event.action == \"modification\"\
  \ and\n file.path like \"/Users/*/Library/Preferences/com.apple.dock.plist\" and\n\
  \ ((process.name like~ (\"osascript\", \"python*\", \"sh\", \"bash\", \"zsh\", \"\
  node\") or Effective_process.name like~ (\"osascript\", \"python*\", \"sh\", \"\
  bash\", \"zsh\", \"node\")) or\n  (process.code_signature.exists == false or process.code_signature.trusted\
  \ == false))"
explanation: 'An adversary can establish persistence by modifying an existing macOS
  dock property list in order to execute a malicious

  application instead of the intended one when invoked.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c81cefcb-82b9-4408-a533-3c3df549e62d.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may modify the dock property list.
    Users can create exceptions for known update processes like software management
    tools to prevent false alerts.

    - System maintenance tasks performed by macOS utilities might trigger the rule.
    Exclude processes such as cfprefsd and plutil, which are involved in regular system
    operations, to reduce noise.

    - Custom scripts or automation tools that modify user preferences could be flagged.
    Ident'
  mitigation: Review investigation guide for details
references:
- https://github.com/specterops/presentations/raw/master/Leo%20Pitt/Hey_Im_Still_in_Here_Modern_macOS_Persistence_SO-CON2020.pdf
has_investigation_guide: true
risk_score: 47
