technique_id: T1136.003
technique_name: AWS IAM Create User via Assumed Role on EC2 Instance
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset: \"aws.cloudtrail\"\n    and event.provider: \"iam.amazonaws.com\"\
  \n    and event.action: \"CreateUser\"\n    and event.outcome: \"success\"\n   \
  \ and aws.cloudtrail.user_identity.type: \"AssumedRole\"\n    and user.id: *\\:i-*"
explanation: 'Detects the creation of an AWS Identity and Access Management (IAM)
  user initiated by an assumed role on an EC2

  instance. Assumed roles allow users or services to temporarily adopt different AWS
  permissions, but the creation of IAM

  users through these roles, particularly from within EC2 instances, may indicate
  a compromised instance. Adversaries might

  exploit such permissions to establish persistence by creating new IAM users under
  unauthorized conditions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f7a1c536-9ac0-11ef-9911-f661ea17fbcd.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS IAM
  confidence: high
false_positives:
