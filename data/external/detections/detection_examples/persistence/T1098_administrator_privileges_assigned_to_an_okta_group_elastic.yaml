technique_id: T1098
technique_name: Administrator Privileges Assigned to an Okta Group
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:okta.system and event.action:group.privilege.grant
explanation: 'Detects when an administrator role is assigned to an Okta group. An
  adversary may attempt to assign administrator

  privileges to an Okta group in order to assign additional permissions to compromised
  user accounts and maintain access

  to their target organization.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b8075894-0b62-46e5-977c-31275da34419.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks may trigger alerts when legitimate IT staff assign
    administrator roles to groups for maintenance or updates. To manage this, create
    exceptions for known IT personnel or scheduled maintenance windows.

    - Organizational changes such as mergers or department restructuring might require
    temporary privilege escalations. Document these changes and adjust the detection
    rule to exclude these specific events during the transition period.

    - Automated'
  mitigation: Review investigation guide for details
references:
- https://help.okta.com/en/prod/Content/Topics/Security/administrators-admin-comparison.htm
- https://developer.okta.com/docs/reference/api/system-log/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 47
