technique_id: T1136.001
technique_name: Privileged User Has Been Created
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 0ac15ec3-d24f-4246-aa2a-3077bb1cf90e
level: high
query: '# Sigma Detection Logic

  # Convert to platform-specific query using Sigma tools:

  # https://github.com/SigmaHQ/sigma


  condition: all of selection_*

  selection_new_user:

  - new user

  selection_uids_gids:

  - GID=0,

  - UID=0,

  - GID=10,

  - GID=27,

  '
explanation: Detects the addition of a new user to a privileged group such as "root"
  or "sudo"
false_positives:
- Administrative activity
references:
- https://digital.nhs.uk/cyber-alerts/2018/cc-2825
- https://linux.die.net/man/8/useradd
- https://github.com/redcanaryco/atomic-red-team/blob/25acadc0b43a07125a8a5b599b28bbc1a91ffb06/atomics/T1136.001/T1136.001.md#atomic-test-5---create-a-new-user-in-linux-with-root-uid-and-gid
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1136.001
- attack.t1098
logsource:
  product: linux
  definition: /var/log/secure on REHL systems or /var/log/auth.log on debian like
    Systems needs to be collected in order for this detection to work
detection:
  selection_new_user:
  - new user
  selection_uids_gids:
  - GID=0,
  - UID=0,
  - GID=10,
  - GID=27,
  condition: all of selection_*
