technique_id: T1574.001
technique_name: Suspicious GUP Usage
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 0a4f6091-223b-41f6-8743-f322ec84930b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_programfiles:\n  Image|endswith:\n  - \\Program Files\\Notepad++\\\
  updater\\GUP.exe\n  - \\Program Files (x86)\\Notepad++\\updater\\GUP.exe\nfilter_user:\n\
  \  Image|contains: \\Users\\\n  Image|endswith:\n  - \\AppData\\Local\\Notepad++\\\
  updater\\GUP.exe\n  - \\AppData\\Roaming\\Notepad++\\updater\\GUP.exe\nselection:\n\
  \  Image|endswith: \\GUP.exe\n"
explanation: Detects execution of the Notepad++ updater in a suspicious directory,
  which is often used in DLL side-loading attacks
false_positives:
- Execution of tools named GUP.exe and located in folders different than Notepad++\updater
references:
- https://www.fireeye.com/blog/threat-research/2018/09/apt10-targeting-japanese-corporations-using-updated-ttps.html
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \GUP.exe
  filter_programfiles:
    Image|endswith:
    - \Program Files\Notepad++\updater\GUP.exe
    - \Program Files (x86)\Notepad++\updater\GUP.exe
  filter_user:
    Image|contains: \Users\
    Image|endswith:
    - \AppData\Local\Notepad++\updater\GUP.exe
    - \AppData\Roaming\Notepad++\updater\GUP.exe
  condition: selection and not 1 of filter_*
