technique_id: T1071
technique_name: Unusual Command Execution from Web Server Parent
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "from logs-endpoint.events.process-*\n| keep\n    @timestamp,\n    host.os.type,\n\
  \    event.type,\n    event.action,\n    process.parent.name,\n    user.name,\n\
  \    user.id,\n    process.working_directory,\n    process.name,\n    process.command_line,\n\
  \    process.parent.executable,\n    agent.id,\n    host.name\n| where\n    @timestamp\
  \ > now() - 1 hours and\n    host.os.type == \"linux\" and\n    event.type == \"\
  start\" and\n    event.action == \"exec\" and (\n      (\n        process.parent.name\
  \ in (\n            \"apache\", \"nginx\", \"apache2\", \"httpd\", \"lighttpd\"\
  , \"caddy\", \"node\", \"mongrel_rails\", \"java\", \"gunicorn\",\n            \"\
  uwsgi\", \"openresty\", \"cherokee\", \"h2o\", \"resin\", \"puma\", \"unicorn\"\
  , \"traefik\", \"tornado\", \"hypercorn\",\n            \"daphne\", \"twistd\",\
  \ \"yaws\", \"webfsd\", \"httpd.worker\", \"flask\", \"rails\", \"mongrel\"\n  \
  \      ) or\n        user.name in (\n            \"apache\", \"www-data\", \"httpd\"\
  , \"nginx\", \"lighttpd\", \"tomcat\", \"tomcat8\", \"tomcat9\", \"ftp\", \"ftpuser\"\
  , \"ftpd\"\n        ) or\n        user.id in (\"99\", \"33\", \"498\", \"48\") or\n\
  \        process.working_directory like \"/var/www/*\"\n      ) or\n      (\n  \
  \      (\n          process.parent.name like \"php-*\" or\n          process.parent.name\
  \ like \"python*\" or\n          process.parent.name like \"ruby*\" or\n       \
  \   process.parent.name like \"perl*\"\n        ) and (\n          process.working_directory\
  \ like \"/var/www/*\" or\n          process.working_directory like \"/srv/www/*\"\
  \ or\n          process.working_directory like \"/usr/share/nginx/*\"\n        )\n\
  \      )\n    ) and\n    process.name in (\"bash\", \"dash\", \"sh\", \"tcsh\",\
  \ \"csh\", \"zsh\", \"ksh\", \"fish\") and\n    process.command_line like \"* -c\
  \ *\" and not (\n        process.working_directory like \"/home/*\" or\n       \
  \ process.working_directory == \"/\" or\n        process.working_directory like\
  \ \"/vscode/vscode-server/*\" or\n        process.parent.executable like \"/vscode/vscode-server/*\"\
  \ or\n        process.parent.executable == \"/usr/bin/xfce4-terminal\"\n    )\n\
  | stats\n    Esql.event_count = count(),\n    Esql.agent_id_count_distinct = count_distinct(agent.id),\n\
  \    Esql.host_name_values = values(host.name),\n    Esql.agent_id_values = values(agent.id)\n\
  \  by process.command_line, process.working_directory, process.parent.executable\n\
  | where\n    Esql.agent_id_count_distinct == 1 and\n    Esql.event_count < 5\n|\
  \ sort Esql.event_count asc\n| limit 100"
explanation: 'This rule detects potential command execution from a web server parent
  process on a Linux host. Adversaries may attempt

  to execute commands from a web server parent process to blend in with normal web
  server activity and evade detection.

  This behavior is commonly observed in web shell attacks where adversaries exploit
  web server vulnerabilities to execute

  arbitrary commands on the host. The detection rule identifies unusual command execution
  from web server parent

  processes, which may indicate a compromised host or an ongoing attack. ESQL rules
  have limited fields available in its

  alert documents. Make sure to review the original documents to aid in the investigation
  of this alert.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8a7933b4-9d0a-4c1c-bda5-e39fb045ff1d.toml
query_type: esql
query_language: esql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Web development or testing environments may frequently execute commands from
    web server processes. To handle this, exclude specific working directories like
    /var/www/dev or /var/www/test from the rule.

    - Automated scripts or cron jobs running under web server user accounts can trigger
    alerts. Identify these scripts and add exceptions for their specific command lines
    or user IDs.

    - Legitimate administrative tasks performed by web server administrators might
    appear suspi'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
