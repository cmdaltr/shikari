  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts executed via SSH may trigger the rule if they
    use scripting languages like Perl, Python, or PHP. To handle this, identify and
    whitelist known administrative scripts and their execution paths.

    - Automated backup or maintenance processes that run from directories like /var/backups
    or /var/log can be mistaken for malicious activity. Exclude these processes by
    specifying their exact paths and names in the exception list.

    - Development or t'
  mitigation: Review investigation guide for details
