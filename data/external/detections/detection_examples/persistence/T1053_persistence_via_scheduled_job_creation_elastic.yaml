  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: data_source
  value: Microsoft Defender for Endpoint
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'false positives.


    ### Possible investigation steps


    - Review the file path and extension to confirm the presence of a scheduled job
    in the "?:\Windows\Tasks\" directory with a ".job" extension, which is indicative
    of a scheduled task.

    - Examine the process executable path to determine if the job creation is associated
    with any known legitimate processes, such as CCleaner or ManageEngine, which are
    excluded in the detection rule.

    - Investigate the origin of the process that created the scheduled'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
