technique_id: T1053
technique_name: Persistence via Scheduled Job Creation
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"windows\" and event.type != \"deletion\" and\n\
  \  file.path : \"?:\\\\Windows\\\\Tasks\\\\*\" and file.extension : \"job\" and\n\
  \  not (\n    (\n      process.executable : \"?:\\\\Program Files\\\\CCleaner\\\\\
  CCleaner64.exe\" and\n      file.path : \"?:\\\\Windows\\\\Tasks\\\\CCleanerCrashReporting.job\"\
  \n    ) or\n    (\n      process.executable : (\n        \"?:\\\\Program Files (x86)\\\
  \\ManageEngine\\\\UEMS_Agent\\\\bin\\\\dcagentregister.exe\",\n        \"?:\\\\\
  Program Files (x86)\\\\DesktopCentral_Agent\\\\bin\\\\dcagentregister.exe\"\n  \
  \    ) and\n      file.path : \"?:\\\\Windows\\\\Tasks\\\\DCAgentUpdater.job\"\n\
  \    )\n  )"
explanation: 'A job can be used to schedule programs or scripts to be executed at
  a specified date and time. Adversaries may abuse

  task scheduling functionality to facilitate initial or recurring execution of malicious
  code.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1327384f-00f3-44d5-9a8c-2373ba071e92.toml
query_type: eql
query_language: eql
