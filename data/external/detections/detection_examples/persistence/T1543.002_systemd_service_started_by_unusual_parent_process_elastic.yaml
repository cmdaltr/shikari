technique_id: T1543.002
technique_name: Systemd Service Started by Unusual Parent Process
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "host.os.type:linux and event.category:process and event.type:start and event.action:exec\
  \ and\nprocess.executable:/usr/bin/systemctl and process.args:(enable or reenable\
  \ or start) and \nprocess.entry_leader.entry_meta.type:* and\nnot (\n  process.entry_leader.entry_meta.type:(container\
  \ or init or unknown) or\n  process.parent.pid:1 or\n  process.parent.executable:(\n\
  \    /bin/adduser or /bin/dnf or /bin/dnf-automatic or /bin/dockerd or /bin/dpkg\
  \ or /bin/microdnf or /bin/pacman or\n    /bin/podman or /bin/rpm or /bin/snapd\
  \ or /bin/sudo or /bin/useradd or /bin/yum or /usr/bin/dnf or\n    /usr/bin/dnf-automatic\
  \ or /usr/bin/dockerd or /usr/bin/dpkg or /usr/bin/microdnf or /usr/bin/pacman or\n\
  \    /usr/bin/podman or /usr/bin/rpm or /usr/bin/snapd or /usr/bin/sudo or /usr/bin/yum\
  \ or /usr/sbin/adduser or\n    /usr/sbin/invoke-rc.d or /usr/sbin/useradd or /var/lib/dpkg/*\n\
  \  ) or\n  process.args_count >= 5\n)"
explanation: 'Systemctl is a process used in Linux systems to manage systemd processes
  through service configuration files. Malicious

  actors can leverage systemd services to achieve persistence by creating or modifying
  service files to execute malicious

  commands or payloads during system startup. This allows them to maintain unauthorized
  access, execute additional

  malicious activities, or evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b605f262-f7dc-41b5-9ebc-06bafe7a83b6.toml
query_type: new_terms
query_language: kuery
indicators:
