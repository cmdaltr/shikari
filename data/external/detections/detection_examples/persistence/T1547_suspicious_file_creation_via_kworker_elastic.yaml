technique_id: T1547
technique_name: Suspicious File Creation via Kworker
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"linux\" and event.action in (\"creation\", \"\
  file_create_event\") and\n  process.name : \"kworker*\" and not (\n    (process.name\
  \ : \"kworker*kcryptd*\") or\n    (file.path : (\n      \"/var/log/*\", \"/var/crash/*\"\
  , \"/var/run/*\", \"/var/lib/systemd/coredump/*\", \"/var/spool/*\",\n      \"/var/lib/nfs/nfsdcltrack/main.sqlite-journal\"\
  , \"/proc/*/cwd/core.*\", \"/var/run/apport.lock\",\n      \"/var/spool/abrt/ccpp-*\"\
  , \"/var/lib/dynatrace/oneagent/*\", \"/var/lib/nfs*\", \"/run/user/*/.bubblewrap/*\"\
  ,\n      \"/etc/localtime/*\", \"/proc/*/cwd/core.*\"\n      )\n    )\n  )"
explanation: 'This rule monitors for a file creation event originating from a kworker
  parent process. kworker, or kernel worker,

  processes are part of the kernel''s workqueue mechanism. They are responsible for
  executing work that has been scheduled

  to be done in kernel space, which might include tasks like handling interrupts,
  background activities, and other

  kernel-related tasks. Attackers may attempt to evade detection by masquerading as
  a kernel worker process.'
