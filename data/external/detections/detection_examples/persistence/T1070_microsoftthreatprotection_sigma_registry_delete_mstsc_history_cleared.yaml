technique_id: T1070
technique_name: Terminal Server Client Connection History Cleared - Registry
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 07bdd2f5-9c58-4f38-aec8-e101bb79ef8d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection1:\n\
  \  EventType: DeleteValue\n  TargetObject|contains: \\Microsoft\\Terminal Server\
  \ Client\\Default\\MRU\nselection2:\n  EventType: DeleteKey\n  TargetObject|contains:\
  \ \\Microsoft\\Terminal Server Client\\Servers\\\n"
explanation: Detects the deletion of registry keys containing the MSTSC connection
  history
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/troubleshoot/windows-server/remote/remove-entries-from-remote-desktop-connection-computer
- http://woshub.com/how-to-clear-rdp-connections-history/
- https://www.trendmicro.com/en_us/research/23/a/vice-society-ransomware-group-targets-manufacturing-companies.html
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1070
- attack.t1112
logsource:
  category: registry_delete
  product: windows
detection:
  selection1:
    EventType: DeleteValue
    TargetObject|contains: \Microsoft\Terminal Server Client\Default\MRU
  selection2:
    EventType: DeleteKey
    TargetObject|contains: \Microsoft\Terminal Server Client\Servers\
  condition: 1 of selection*
