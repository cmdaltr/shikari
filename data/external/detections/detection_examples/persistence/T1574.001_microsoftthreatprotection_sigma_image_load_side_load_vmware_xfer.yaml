technique_id: T1574.001
technique_name: Potential DLL Sideloading Via VMware Xfer
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 9313dc13-d04c-46d8-af4a-a930cc55d93b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ImageLoaded|startswith: C:\\Program Files\\VMware\\\nselection:\n  ImageLoaded|endswith:\
  \ \\glib-2.0.dll\n  Image|endswith: \\VMwareXferlogs.exe\n"
explanation: Detects loading of a DLL by the VMware Xfer utility from the non-default
  directory which may be an attempt to sideload arbitrary DLL
false_positives:
- Unlikely
references:
- https://www.sentinelone.com/labs/lockbit-ransomware-side-loads-cobalt-strike-beacon-with-legitimate-vmware-utility/
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    Image|endswith: \VMwareXferlogs.exe
    ImageLoaded|endswith: \glib-2.0.dll
  filter:
    ImageLoaded|startswith: C:\Program Files\VMware\
  condition: selection and not filter
