technique_id: T1546
technique_name: Suspicious Get-Variable.exe Creation
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 0c3fac91-5627-46e8-a6a8-a0d7b9b8ae1b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetFilename|endswith: Local\\Microsoft\\WindowsApps\\Get-Variable.exe\n"
explanation: 'Get-Variable is a valid PowerShell cmdlet

  WindowsApps is by default in the path where PowerShell is executed.

  So when the Get-Variable command is issued on PowerShell execution, the system first
  looks for the Get-Variable executable in the path and executes the malicious binary
  instead of looking for the PowerShell cmdlet.

  '
false_positives:
- Unknown
