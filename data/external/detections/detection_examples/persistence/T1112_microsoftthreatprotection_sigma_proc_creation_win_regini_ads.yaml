query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_img:\n- Image|endswith: \\regini.exe\n- OriginalFileName: REGINI.EXE\n\
  selection_re:\n  CommandLine|re: :[^ \\\\]\n"
explanation: Detects the import of an alternate data stream with regini.exe, regini.exe
  can be used to modify registry keys.
false_positives:
- Unknown
