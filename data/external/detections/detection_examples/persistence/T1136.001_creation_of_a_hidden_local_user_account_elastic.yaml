technique_id: T1136.001
technique_name: Creation of a Hidden Local User Account
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.path : (\n    \"HKLM\\\\SAM\\\\SAM\\\\Domains\\\\Account\\\\Users\\\\\
  Names\\\\*$\\\\\",\n    \"\\\\REGISTRY\\\\MACHINE\\\\SAM\\\\SAM\\\\Domains\\\\Account\\\
  \\Users\\\\Names\\\\*$\\\\\",\n    \"MACHINE\\\\SAM\\\\SAM\\\\Domains\\\\Account\\\
  \\Users\\\\Names\\\\*$\\\\\"\n)"
explanation: 'Identifies the creation of a hidden local user account by appending
  the dollar sign to the account name. This is

  sometimes done by attackers to increase access to a system and avoid appearing in
  the results of accounts listing using

  the net users command.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2edc8076-291e-41e9-81e4-e3fcbc97ae5e.toml
