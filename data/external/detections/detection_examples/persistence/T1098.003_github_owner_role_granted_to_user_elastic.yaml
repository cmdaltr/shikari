technique_id: T1098.003
technique_name: GitHub Owner Role Granted To User
tactic: persistence
platform: Elastic
fidelity_score: 0.88
validated: true
query: iam where event.dataset == "github.audit" and event.action == "org.update_member"
  and github.permission == "admin"
explanation: 'This rule detects when a member is granted the organization owner role
  of a GitHub organization. This role provides

  admin level privileges. Any new owner role should be investigated to determine its
  validity. Unauthorized owner roles

  could indicate compromise within your organization and provide unlimited access
  to data and settings.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9b343b62-d173-4cfd-bd8b-e6379f964ca4.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Github
  confidence: high
false_positives:
- description: 'False positive analysis


    - Role changes due to organizational restructuring or legitimate promotions can
    trigger alerts. Regularly update the list of expected role changes to minimize
    unnecessary alerts.

    - Automated scripts or integrations that manage user roles might inadvertently
    trigger the rule. Identify and whitelist these scripts to prevent false positives.

    - Temporary role assignments for project-specific tasks can be mistaken for unauthorized
    access. Implement a process to document and p'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
