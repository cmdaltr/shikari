technique_id: T1110.001
technique_name: Azure AD Successful Authentication From Different Ips
tactic: persistence
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` properties.authenticationDetails{}.succeeded=true category=SignInLogs
  | rename properties.* as * | bucket span=30m _time | fillnull | stats count min(_time)
  as firstTime max(_time) as lastTime dc(src) AS unique_ips values(dest) as dest values(src)
  as src by user vendor_account vendor_product signature | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | where unique_ips > 1 | `azure_ad_successful_authentication_from_different_ips_filter`'
explanation: The following analytic detects an Azure AD account successfully authenticating
  from multiple unique IP addresses within a 30-minute window. It leverages Azure
  AD SignInLogs to identify instances where the same user logs in from different IPs
  in a short time frame. This behavior is significant as it may indicate compromised
  credentials being used by an adversary, potentially following a phishing attack.
  If confirmed malicious, this activity could allow unauthorized access to corporate
  resources, leading to data breaches or further exploitation within the network.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/be6d868d-33b6-4aaa-912e-724fb555b11a/
indicators:
- type: data_source
  value: Azure Active Directory
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: A user with successful authentication events from different Ips may
    also represent the legitimate use of more than one device. Filter as needed and/or
    customize the threshold to fit your environment.
  mitigation: Review context and user activity
references:
