technique_id: T1112
technique_name: Uncommon Microsoft Office Trusted Location Added
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: f742bde7-9528-42e5-bd82-84f51a8387d2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_* and not 1 of filter_exclude_*\nfilter_exclude_known_paths:\n  Details|contains:\n\
  \  - '%APPDATA%\\Microsoft\\Templates'\n  - '%%APPDATA%%\\Microsoft\\Templates'\n\
  \  - '%APPDATA%\\Microsoft\\Word\\Startup'\n  - '%%APPDATA%%\\Microsoft\\Word\\\
  Startup'\n  - :\\Program Files (x86)\\Microsoft Office\\root\\Templates\\\n  - :\\\
  Program Files\\Microsoft Office (x86)\\Templates\n  - :\\Program Files\\Microsoft\
  \ Office\\root\\Templates\\\n  - :\\Program Files\\Microsoft Office\\Templates\\\
  \nfilter_main_office_apps:\n  Image|contains:\n  - :\\Program Files\\Microsoft Office\\\
  \n  - :\\Program Files (x86)\\Microsoft Office\\\nfilter_main_office_click_to_run:\n\
  \  Image|contains: :\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\\
  \n  Image|endswith: \\OfficeClickToRun.exe\nselection:\n  TargetObject|contains:\
  \ Security\\Trusted Locations\\Location\n  TargetObject|endswith: \\Path\n"
explanation: Detects changes to registry keys related to "Trusted Location" of Microsoft
  Office where the path is set to something uncommon. Attackers might add additional
  trusted locations to avoid macro security restrictions.
false_positives:
- Other unknown legitimate or custom paths need to be filtered to avoid false positives
references:
- Internal Research
- https://admx.help/?Category=Office2016&Policy=excel16.Office.Microsoft.Policies.Windows::L_TrustedLoc01
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: Security\Trusted Locations\Location
    TargetObject|endswith: \Path
  filter_exclude_known_paths:
    Details|contains:
    - '%APPDATA%\Microsoft\Templates'
    - '%%APPDATA%%\Microsoft\Templates'
    - '%APPDATA%\Microsoft\Word\Startup'
    - '%%APPDATA%%\Microsoft\Word\Startup'
    - :\Program Files (x86)\Microsoft Office\root\Templates\
    - :\Program Files\Microsoft Office (x86)\Templates
    - :\Program Files\Microsoft Office\root\Templates\
    - :\Program Files\Microsoft Office\Templates\
  filter_main_office_click_to_run:
    Image|contains: :\Program Files\Common Files\Microsoft Shared\ClickToRun\
    Image|endswith: \OfficeClickToRun.exe
  filter_main_office_apps:
    Image|contains:
    - :\Program Files\Microsoft Office\
    - :\Program Files (x86)\Microsoft Office\
  condition: selection and not 1 of filter_main_* and not 1 of filter_exclude_*
