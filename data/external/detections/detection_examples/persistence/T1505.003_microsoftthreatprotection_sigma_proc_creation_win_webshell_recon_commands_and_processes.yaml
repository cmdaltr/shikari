technique_id: T1505.003
technique_name: Webshell Detection With Command Line Keywords
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: bed2a484-9348-4143-8a8a-b801c979301c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_webserver_*\
  \ and 1 of selection_susp_*\nselection_susp_change_dir:\n  CommandLine|contains:\n\
  \  - '&cd&echo'\n  - 'cd /d '\nselection_susp_misc_discovery_binaries:\n- Image|endswith:\n\
  \  - \\dsquery.exe\n  - \\find.exe\n  - \\findstr.exe\n  - \\ipconfig.exe\n  - \\\
  netstat.exe\n  - \\nslookup.exe\n  - \\pathping.exe\n  - \\quser.exe\n  - \\schtasks.exe\n\
  \  - \\systeminfo.exe\n  - \\tasklist.exe\n  - \\tracert.exe\n  - \\ver.exe\n  -\
  \ \\wevtutil.exe\n  - \\whoami.exe\n- OriginalFileName:\n  - dsquery.exe\n  - find.exe\n\
  \  - findstr.exe\n  - ipconfig.exe\n  - netstat.exe\n  - nslookup.exe\n  - pathping.exe\n\
  \  - quser.exe\n  - schtasks.exe\n  - sysinfo.exe\n  - tasklist.exe\n  - tracert.exe\n\
  \  - ver.exe\n  - VSSADMIN.EXE\n  - wevtutil.exe\n  - whoami.exe\nselection_susp_misc_discovery_commands:\n\
  \  CommandLine|contains:\n  - ' Test-NetConnection '\n  - dir \\\nselection_susp_net_utility:\n\
  \  CommandLine|contains:\n  - ' user '\n  - ' use '\n  - ' group '\n  OriginalFileName:\n\
  \  - net.exe\n  - net1.exe\nselection_susp_ping_utility:\n  CommandLine|contains:\
  \ ' -n '\n  OriginalFileName: ping.exe\nselection_susp_powershell_cli:\n  CommandLine|contains:\n\
  \  - ' -enc '\n  - ' -EncodedCommand '\n  - ' -w hidden '\n  - ' -windowstyle hidden'\n\
  \  - .WebClient).Download\n  Image|endswith:\n  - \\cmd.exe\n  - \\powershell.exe\n\
  \  - \\pwsh.exe\nselection_susp_wmic_utility:\n  CommandLine|contains: ' /node:'\n\
  \  OriginalFileName: wmic.exe\nselection_webserver_characteristics_tomcat1:\n  ParentImage|contains:\n\
  \  - -tomcat-\n  - \\tomcat\n  ParentImage|endswith:\n  - \\java.exe\n  - \\javaw.exe\n\
  selection_webserver_characteristics_tomcat2:\n  CommandLine|contains:\n  - catalina.jar\n\
  \  - CATALINA_HOME\n  ParentImage|endswith:\n  - \\java.exe\n  - \\javaw.exe\nselection_webserver_image:\n\
  \  ParentImage|endswith:\n  - \\w3wp.exe\n  - \\php-cgi.exe\n  - \\nginx.exe\n \
  \ - \\httpd.exe\n  - \\caddy.exe\n  - \\ws_tomcatservice.exe\n"
explanation: Detects certain command line parameters often used during reconnaissance
  activity via web shells
false_positives:
- Unknown
references:
- https://www.fireeye.com/blog/threat-research/2013/08/breaking-down-the-china-chopper-web-shell-part-ii.html
- https://unit42.paloaltonetworks.com/bumblebee-webshell-xhunt-campaign/
- https://www.huntress.com/blog/threat-advisory-oh-no-cleo-cleo-software-actively-being-exploited-in-the-wild
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - \w3wp.exe
    - \php-cgi.exe
    - \nginx.exe
    - \httpd.exe
    - \caddy.exe
    - \ws_tomcatservice.exe
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    ParentImage|contains:
    - -tomcat-
    - \tomcat
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    CommandLine|contains:
    - catalina.jar
    - CATALINA_HOME
  selection_susp_net_utility:
    OriginalFileName:
    - net.exe
    - net1.exe
    CommandLine|contains:
    - ' user '
    - ' use '
    - ' group '
  selection_susp_ping_utility:
    OriginalFileName: ping.exe
    CommandLine|contains: ' -n '
  selection_susp_change_dir:
    CommandLine|contains:
    - '&cd&echo'
    - 'cd /d '
  selection_susp_wmic_utility:
    OriginalFileName: wmic.exe
    CommandLine|contains: ' /node:'
  selection_susp_powershell_cli:
    Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - ' -enc '
    - ' -EncodedCommand '
    - ' -w hidden '
    - ' -windowstyle hidden'
    - .WebClient).Download
  selection_susp_misc_discovery_binaries:
  - Image|endswith:
    - \dsquery.exe
    - \find.exe
    - \findstr.exe
    - \ipconfig.exe
    - \netstat.exe
    - \nslookup.exe
    - \pathping.exe
    - \quser.exe
    - \schtasks.exe
    - \systeminfo.exe
    - \tasklist.exe
    - \tracert.exe
    - \ver.exe
    - \wevtutil.exe
    - \whoami.exe
  - OriginalFileName:
    - dsquery.exe
    - find.exe
    - findstr.exe
    - ipconfig.exe
    - netstat.exe
    - nslookup.exe
    - pathping.exe
    - quser.exe
    - schtasks.exe
    - sysinfo.exe
    - tasklist.exe
    - tracert.exe
    - ver.exe
    - VSSADMIN.EXE
    - wevtutil.exe
    - whoami.exe
  selection_susp_misc_discovery_commands:
    CommandLine|contains:
    - ' Test-NetConnection '
    - dir \
  condition: 1 of selection_webserver_* and 1 of selection_susp_*
