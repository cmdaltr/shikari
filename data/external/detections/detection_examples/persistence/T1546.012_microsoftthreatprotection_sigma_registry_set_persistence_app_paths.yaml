technique_id: T1546.012
technique_name: Potential Persistence Via App Paths Default Property
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 707e097c-e20f-4f67-8807-1f72ff4500d6
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details|contains:\n  - \\Users\\Public\n  - \\AppData\\Local\\Temp\\\n  - \\\
  Windows\\Temp\\\n  - \\Desktop\\\n  - \\Downloads\\\n  - '%temp%'\n  - '%tmp%'\n\
  \  - iex\n  - Invoke-\n  - rundll32\n  - regsvr32\n  - mshta\n  - cscript\n  - wscript\n\
  \  - .bat\n  - .hta\n  - .dll\n  - .ps1\n  TargetObject|contains: \\SOFTWARE\\Microsoft\\\
  Windows\\CurrentVersion\\App Paths\n  TargetObject|endswith:\n  - (Default)\n  -\
  \ Path\n"
explanation: 'Detects changes to the "Default" property for keys located in the \Software\Microsoft\Windows\CurrentVersion\App
  Paths\ registry. Which might be used as a method of persistence

  The entries found under App Paths are used primarily for the following purposes.

  First, to map an application''s executable file name to that file''s fully qualified
  path.

  Second, to prepend information to the PATH environment variable on a per-application,
  per-process basis.

  '
false_positives:
- Legitimate applications registering their binary from on of the suspicious locations
  mentioned above (tune it)
references:
- https://www.hexacorn.com/blog/2013/01/19/beyond-good-ol-run-key-part-3/
- https://learn.microsoft.com/en-us/windows/win32/shell/app-registration
tags:
- attack.privilege-escalation
