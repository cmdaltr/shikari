query: event.dataset:o365.audit and event.provider:Exchange and event.category:web
  and event.action:"New-ManagementRoleAssignment" and event.outcome:success
explanation: 'Identifies when a new role is assigned to a management group in Microsoft
  365. An adversary may attempt to add a role in

  order to maintain persistence in an environment.'
