technique_id: T1574.001
technique_name: Tasks Folder Evasion
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: cc4e02ba-9c06-48e2-b09e-2500cace9ae0
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection1:\n\
  \  CommandLine|contains:\n  - 'echo '\n  - 'copy '\n  - 'type '\n  - file createnew\n\
  selection2:\n  CommandLine|contains:\n  - ' C:\\Windows\\System32\\Tasks\\'\n  -\
  \ ' C:\\Windows\\SysWow64\\Tasks\\'\n"
explanation: 'The Tasks folder in system32 and syswow64 are globally writable paths.

  Adversaries can take advantage of this and load or influence any script hosts or
  ANY .NET Application

  in Tasks to load and execute a custom assembly into cscript, wscript, regsvr32,
  mshta, eventvwr

  '
false_positives:
- Unknown
