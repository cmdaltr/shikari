query: "event.category:file and host.os.type:macos and not event.type:\"deletion\"\
  \ and\n file.name:\"com.apple.loginwindow.plist\" and\n not process.name: (systemmigrationd\
  \ or DesktopServicesHelper or diskmanagementd or rsync or launchd or cfprefsd or\
  \ xpcproxy or ManagedClient or MCXCompositor or backupd or \"iMazing Profile Editor\"\
  \ or storagekitd or CloneKitService)"
explanation: 'Identifies the creation or modification of the login window property
  list (plist). Adversaries may modify plist files to

  run a program during system boot or user login for persistence.'
