technique_id: T1547
technique_name: Execution of Persistent Suspicious Program
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "/* userinit followed by explorer followed by early child process of explorer\
  \ (unlikely to be launched interactively) within 1m */\nsequence by host.id, user.name\
  \ with maxspan=1m\n  [process where host.os.type == \"windows\" and event.type ==\
  \ \"start\" and process.name : \"userinit.exe\" and process.parent.name : \"winlogon.exe\"\
  ]\n  [process where host.os.type == \"windows\" and event.type == \"start\" and\
  \ process.name : \"explorer.exe\"]\n  [process where host.os.type == \"windows\"\
  \ and event.type == \"start\" and process.parent.name : \"explorer.exe\" and\n \
  \  /* add suspicious programs here */\n   process.pe.original_file_name in (\"cscript.exe\"\
  ,\n                                     \"wscript.exe\",\n                     \
  \                \"PowerShell.EXE\",\n                                     \"MSHTA.EXE\"\
  ,\n                                     \"RUNDLL32.EXE\",\n                    \
  \                 \"REGSVR32.EXE\",\n                                     \"RegAsm.exe\"\
  ,\n                                     \"MSBuild.exe\",\n                     \
  \                \"InstallUtil.exe\") and\n    /* add potential suspicious paths\
  \ here */\n    process.args : (\"C:\\\\Users\\\\*\", \"C:\\\\ProgramData\\\\*\"\
  , \"C:\\\\Windows\\\\Temp\\\\*\", \"C:\\\\Windows\\\\Tasks\\\\*\", \"C:\\\\PerfLogs\\\
  \\*\", \"C:\\\\Intel\\\\*\")\n   ]"
explanation: 'Identifies execution of suspicious persistent programs (scripts, rundll32,
  etc.) by looking at process lineage and

  command line usage.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e7125cea-9fe1-42a5-9a05-b0792cf86f5a.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts or tools may trigger alerts if they are executed
    from common directories like C:\Users or C:\ProgramData. To manage this, create
    exceptions for known administrative scripts that are regularly used in your environment.

    - Software updates or installations might use processes like PowerShell or RUNDLL32,
    leading to false positives. Identify and exclude these processes when they are
    part of a verified update or installation routine.

    - Cust'
  mitigation: Review investigation guide for details
has_investigation_guide: true
