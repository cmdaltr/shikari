technique_id: T1053.005
technique_name: Suspicious Schtasks Schedule Types
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 24c8392b-aa3c-46b7-a545-43f71657fe98
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_*\nfilter_privs:\n  CommandLine|contains:\n  - NT AUT\n  - ' SYSTEM'\n\
  \  - HIGHEST\nselection_img:\n- Image|endswith: \\schtasks.exe\n- OriginalFileName:\
  \ schtasks.exe\nselection_time:\n  CommandLine|contains:\n  - ' ONLOGON '\n  - '\
  \ ONSTART '\n  - ' ONCE '\n  - ' ONIDLE '\n"
explanation: Detects scheduled task creations or modification on a suspicious schedule
  type
false_positives:
- Legitimate processes that run at logon. Filter according to your environment
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-change
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
- http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: \schtasks.exe
  - OriginalFileName: schtasks.exe
  selection_time:
    CommandLine|contains:
    - ' ONLOGON '
    - ' ONSTART '
    - ' ONCE '
    - ' ONIDLE '
  filter_privs:
    CommandLine|contains:
    - NT AUT
    - ' SYSTEM'
    - HIGHEST
  condition: all of selection_* and not 1 of filter_*
