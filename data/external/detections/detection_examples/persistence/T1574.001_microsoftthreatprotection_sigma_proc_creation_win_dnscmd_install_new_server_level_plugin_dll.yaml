technique_id: T1574.001
technique_name: New DNS ServerLevelPluginDll Installed Via Dnscmd.EXE
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: f63b56ee-3f79-4b8a-97fb-5c48007e8573
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - /config\n  - /serverlevelplugindll\n  Image|endswith:\
  \ \\dnscmd.exe\n"
explanation: Detects the installation of a DNS plugin DLL via ServerLevelPluginDll
  parameter in registry, which can be used to execute code in context of the DNS server
  (restart required)
false_positives:
- Unknown
