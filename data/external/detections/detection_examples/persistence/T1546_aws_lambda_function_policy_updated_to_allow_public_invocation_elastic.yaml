technique_id: T1546
technique_name: AWS Lambda Function Policy Updated to Allow Public Invocation
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset: aws.cloudtrail\n    and event.provider: lambda.amazonaws.com\n\
  \    and event.outcome: success\n    and event.action: AddPermission*\n    and aws.cloudtrail.request_parameters:\
  \ (*lambda\\:InvokeFunction* and *principal=\\**)"
explanation: 'Identifies when an AWS Lambda function policy is updated to allow public
  invocation. This rule specifically looks for

  the `AddPermission` API call with the `Principal` set to `*` which allows any AWS
  account to invoke the Lambda function.

  Adversaries may abuse this permission to create a backdoor in the Lambda function
  that allows them to execute arbitrary

  code.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/151d8f72-0747-11ef-a0c2-f661ea17fbcc.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS Lambda
  confidence: high
false_positives:
- description: 'False Positive Analysis:


    - **Legitimate Administrative Actions**: Confirm if the update to allow public
    invocation aligns with scheduled updates, development activities, or legitimate
    administrative tasks documented in change management systems.

    - **Consistency Check**: Compare the action against historical data of similar
    actions performed by the user or within the organization. If the action is consistent
    with past legitimate activities, it might indicate a false alarm.

    - **Verify through Out'
  mitigation: Review investigation guide for details
references:
- https://cloud.hacktricks.xyz/pentesting-cloud/aws-security/aws-persistence/aws-lambda-persistence
- https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.lambda-backdoor-function/
- https://docs.aws.amazon.com/lambda/latest/api/API_AddPermission.html
has_investigation_guide: true
risk_score: 47
