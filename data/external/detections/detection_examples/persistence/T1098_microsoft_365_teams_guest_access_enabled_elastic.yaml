technique_id: T1098
technique_name: Microsoft 365 Teams Guest Access Enabled
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: 'event.dataset:o365.audit and event.provider:(SkypeForBusiness or MicrosoftTeams)
  and

  event.category:web and event.action:"Set-CsTeamsClientConfiguration" and

  o365.audit.Parameters.AllowGuestUser:True and event.outcome:success'
explanation: 'Identifies when guest access is enabled in Microsoft Teams. Guest access
  in Teams allows people outside the organization

  to access teams and channels. An adversary may enable guest access to maintain persistence
  in an environment.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5e552599-ddec-4e14-bad1-28aa42404388.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Microsoft 365
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate collaboration with external partners may trigger alerts when guest
    access is enabled for business purposes. To manage this, create exceptions for
    known and approved external domains or specific projects that require guest access.

    - Routine administrative actions by IT staff to enable guest access for specific
    teams or channels can be mistaken for unauthorized changes. Implement a process
    to log and approve such changes internally, and exclude these from trig'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/powershell/module/skype/get-csteamsclientconfiguration?view=skype-ps
has_investigation_guide: true
risk_score: 47
