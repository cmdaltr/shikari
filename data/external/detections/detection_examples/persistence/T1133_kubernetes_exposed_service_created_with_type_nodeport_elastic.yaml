technique_id: T1133
technique_name: Kubernetes Exposed Service Created With Type NodePort
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset : \"kubernetes.audit_logs\"\n  and kubernetes.audit.annotations.authorization_k8s_io/decision:\"\
  allow\"\n  and kubernetes.audit.objectRef.resource:\"services\"\n  and kubernetes.audit.verb:(\"\
  create\" or \"update\" or \"patch\")\n  and kubernetes.audit.requestObject.spec.type:\"\
  NodePort\""
explanation: 'This rule detects an attempt to create or modify a service as type NodePort.
  The NodePort service allows a user to

  externally expose a set of labeled pods to the internet. This creates an open port
  on every worker node in the cluster

  that has a pod for that service. When external traffic is received on that open
  port, it directs it to the specific pod

  through the service representing it. A malicious user can configure a service as
  type Nodeport in order to intercept

  traffic from other pods or nodes, bypassing firewalls and other network security
  measures configured for load balancers

  within a cluster. This creates a direct method of communication between the cluster
  and the outside world, which could

  be used for more malicious behavior and certainly widens the attack surface of your
  cluster.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/65f9bccd-510b-40df-8263-334f03174fed.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Kubernetes
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine service updates or deployments may trigger the rule if NodePort services
    are part of standard operations. To manage this, create exceptions for specific
    namespaces or service accounts that are known to perform these actions regularly.

    - Development or testing environments often use NodePort services for ease of
    access. Exclude these environments from the rule by filtering based on labels
    or annotations that identify non-production clusters.

    - Automated deployme'
  mitigation: Review investigation guide for details
references:
- https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
- https://kubernetes.io/docs/concepts/services-networking/service/#type-nodeport
- https://www.tigera.io/blog/new-vulnerability-exposes-kubernetes-to-man-in-the-middle-attacks-heres-how-to-mitigate/
has_investigation_guide: true
risk_score: 47
