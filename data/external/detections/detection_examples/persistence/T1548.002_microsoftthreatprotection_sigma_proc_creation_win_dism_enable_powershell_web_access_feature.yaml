technique_id: T1548.002
technique_name: PowerShell Web Access Feature Enabled Via DISM
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 7e8f2d3b-9c1a-4f67-b9e8-8d9006e0e51f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - WindowsPowerShellWebAccess\n  -\
  \ /online\n  - /enable-feature\nselection_img:\n- Image|endswith: \\dism.exe\n-\
  \ OriginalFileName: DISM.EXE\n"
explanation: Detects the use of DISM to enable the PowerShell Web Access feature,
  which could be used for remote access and potential abuse
false_positives:
- Legitimate PowerShell Web Access installations by administrators
references:
- https://docs.microsoft.com/en-us/powershell/module/dism/enable-windowsoptionalfeature
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
- https://gist.github.com/MHaggis/7e67b659af9148fa593cf2402edebb41
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \dism.exe
  - OriginalFileName: DISM.EXE
  selection_cli:
    CommandLine|contains|all:
    - WindowsPowerShellWebAccess
    - /online
    - /enable-feature
  condition: all of selection_*
