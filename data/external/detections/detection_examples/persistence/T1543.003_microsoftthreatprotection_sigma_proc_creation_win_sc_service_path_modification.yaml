technique_id: T1543.003
technique_name: Suspicious Service Path Modification
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 138d3531-8793-4f50-a2cd-f291b2863d78
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - powershell\n  - 'cmd '\n  - mshta\n  - wscript\n \
  \ - cscript\n  - rundll32\n  - svchost\n  - dllhost\n  - cmd.exe /c\n  - cmd.exe\
  \ /k\n  - cmd.exe /r\n  - cmd /c\n  - cmd /k\n  - cmd /r\n  - C:\\Users\\Public\n\
  \  - \\Downloads\\\n  - \\Desktop\\\n  - \\Microsoft\\Windows\\Start Menu\\Programs\\\
  Startup\\\n  - C:\\Windows\\TEMP\\\n  - \\AppData\\Local\\Temp\n  CommandLine|contains|all:\n\
  \  - config\n  - binPath\n  Image|endswith: \\sc.exe\n"
explanation: Detects service path modification via the "sc" binary to a suspicious
  command or path
false_positives:
- Unlikely
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
tags:
