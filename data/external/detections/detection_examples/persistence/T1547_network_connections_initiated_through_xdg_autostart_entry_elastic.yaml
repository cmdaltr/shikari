    - Network connections from legitimate applications like Firefox or FortiClient
    may trigger false positives. To handle this, add these applications to the exclusion
    list in the detection rule.

    - Internal network traffic within known safe IP ranges can be mistakenly flagged.
    Ensure these IP ranges are included in the exclusion criteria to prevent unnecessary
    alerts.

    - Custom scripts or applications that are part of the user''s normal login process
    migh'
  mitigation: Review investigation guide for details
