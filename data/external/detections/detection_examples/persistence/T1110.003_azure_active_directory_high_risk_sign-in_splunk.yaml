technique_id: T1110.003
technique_name: Azure Active Directory High Risk Sign-in
tactic: persistence
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` `azure_monitor_aad` category=UserRiskEvents properties.riskLevel=high
  | fillnull | stats count min(_time) as firstTime max(_time) as lastTime by dest
  user src vendor_account vendor_product category | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `azure_active_directory_high_risk_sign_in_filter`'
explanation: The following analytic detects high-risk sign-in attempts against Azure
  Active Directory, identified by Azure Identity Protection. It leverages the RiskyUsers
  and UserRiskEvents log categories from Azure AD events ingested via EventHub. This
  activity is significant as it indicates potentially compromised accounts, flagged
  by heuristics and machine learning. If confirmed malicious, attackers could gain
  unauthorized access to sensitive resources, leading to data breaches or further
  exploitation within the environment.
source: Splunk Security Content
