  value: Azure Active Directory
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Details for the risk calculation algorithm used by Identity Protection
    are unknown and may be prone to false positives.
  mitigation: Review context and user activity
