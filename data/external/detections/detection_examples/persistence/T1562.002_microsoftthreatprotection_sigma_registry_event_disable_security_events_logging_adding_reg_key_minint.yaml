query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - EventType: CreateKey\n  TargetObject: HKLM\\SYSTEM\\CurrentControlSet\\Control\\\
  MiniNt\n- NewName: HKLM\\SYSTEM\\CurrentControlSet\\Control\\MiniNt\n"
explanation: Detects the addition of a key 'MiniNt' to the registry. Upon a reboot,
  Windows Event Log service will stop writing events.
