technique_id: T1574.001
technique_name: DLL Sideloading Of ShellChromeAPI.DLL
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: ee4c5d06-3abc-48cc-8885-77f1c20f4451
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ImageLoaded|endswith: \\ShellChromeAPI.dll\n"
explanation: 'Detects processes loading the non-existent DLL "ShellChromeAPI". One
  known example is the "DeviceEnroller" binary in combination with the "PhoneDeepLink"
  flag tries to load this DLL.

  Adversaries can drop their own renamed DLL and execute it via DeviceEnroller.exe
  using this parameter

  '
