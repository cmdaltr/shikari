technique_id: T1021.001
technique_name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 0d5675be-bc88-4172-86d3-1e96a4476536
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_main_*\
  \ and 1 of selection_values_*\nselection_main_cli:\n  CommandLine|contains|all:\n\
  \  - ' add '\n  - \\CurrentControlSet\\Control\\Terminal Server\n  - REG_DWORD\n\
  \  - ' /f'\nselection_main_img:\n- Image|endswith: \\reg.exe\n- OriginalFileName:\
  \ reg.exe\nselection_values_1:\n  CommandLine|contains|all:\n  - Licensing Core\n\
  \  - EnableConcurrentSessions\nselection_values_2:\n  CommandLine|contains:\n  -\
  \ WinStations\\RDP-Tcp\n  - MaxInstanceCount\n  - fEnableWinStation\n  - TSUserEnabled\n\
  \  - TSEnabled\n  - TSAppCompat\n  - IdleWinStationPoolCount\n  - TSAdvertise\n\
  \  - AllowTSConnections\n  - fSingleSessionPerUser\n  - fDenyTSConnections\n"
explanation: Detects the execution of "reg.exe" for enabling/disabling the RDP service
  on the host by tampering with the 'CurrentControlSet\Control\Terminal Server' values
false_positives:
- Unknown
references:
- https://thedfirreport.com/2022/02/21/qbot-and-zerologon-lead-to-full-domain-compromise/
tags:
- attack.persistence
- attack.defense-evasion
- attack.lateral-movement
- attack.t1021.001
- attack.t1112
logsource:
  product: windows
  category: process_creation
detection:
  selection_main_img:
  - Image|endswith: \reg.exe
  - OriginalFileName: reg.exe
  selection_main_cli:
    CommandLine|contains|all:
    - ' add '
    - \CurrentControlSet\Control\Terminal Server
    - REG_DWORD
    - ' /f'
  selection_values_1:
    CommandLine|contains|all:
    - Licensing Core
    - EnableConcurrentSessions
  selection_values_2:
    CommandLine|contains:
    - WinStations\RDP-Tcp
    - MaxInstanceCount
    - fEnableWinStation
    - TSUserEnabled
    - TSEnabled
    - TSAppCompat
    - IdleWinStationPoolCount
    - TSAdvertise
    - AllowTSConnections
    - fSingleSessionPerUser
    - fDenyTSConnections
  condition: all of selection_main_* and 1 of selection_values_*
