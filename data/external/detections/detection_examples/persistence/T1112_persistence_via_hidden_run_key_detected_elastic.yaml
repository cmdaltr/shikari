false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may create registry keys in the
    specified paths, leading to false positives. Users can monitor the installation
    process and temporarily disable the rule during known software updates to prevent
    unnecessary alerts.

    - System administrators may intentionally configure startup programs for maintenance
    or monitoring purposes. Document these configurations and create exceptions in
    the detection rule to avoid flagging them as threa'
  mitigation: Review investigation guide for details
