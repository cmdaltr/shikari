technique_id: T1112
technique_name: Persistence via Hidden Run Key Detected
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "/* Registry Path ends with backslash */\nregistry where host.os.type == \"\
  windows\" and event.type == \"change\" and length(registry.data.strings) > 0 and\n\
  \  registry.path : \"*\\\\Run\\\\\" and\n  registry.path : (\n    \"*\\\\Software\\\
  \\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\\",\n    \"*\\\\Software\\\\\
  WOW6432Node\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run\\\\\",\n    \"*\\\\\
  Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Policies\\\\Explorer\\\\Run\\\
  \\\"\n  )"
explanation: 'Identifies a persistence mechanism that utilizes the NtSetValueKey native
  API to create a hidden (null terminated)

  registry key. An adversary may use this method to hide from system utilities such
  as the Registry Editor (regedit).'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a9b05c3b-b304-4bf9-970d-acdfaef2944c.toml
query_type: eql
query_language: eql
