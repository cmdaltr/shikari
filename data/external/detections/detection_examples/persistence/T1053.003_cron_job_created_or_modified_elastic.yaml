technique_id: T1053.003
technique_name: Cron Job Created or Modified
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"linux\" and\nevent.action in (\"rename\", \"\
  creation\") and file.path : (\n  \"/etc/cron.allow\", \"/etc/cron.deny\", \"/etc/cron.d/*\"\
  , \"/etc/cron.hourly/*\", \"/etc/cron.daily/*\", \"/etc/cron.weekly/*\",\n  \"/etc/cron.monthly/*\"\
  , \"/etc/crontab\", \"/var/spool/cron/crontabs/*\", \"/var/spool/anacron/*\"\n)\
  \ and not (\n  process.executable in (\n    \"/bin/dpkg\", \"/usr/bin/dpkg\", \"\
  /bin/dockerd\", \"/usr/bin/dockerd\", \"/usr/sbin/dockerd\", \"/bin/microdnf\",\n\
  \    \"/usr/bin/microdnf\", \"/bin/rpm\", \"/usr/bin/rpm\", \"/bin/snapd\", \"/usr/bin/snapd\"\
  , \"/bin/yum\", \"/usr/bin/yum\",\n    \"/bin/dnf\", \"/usr/bin/dnf\", \"/bin/podman\"\
  , \"/usr/bin/podman\", \"/bin/dnf-automatic\", \"/usr/bin/dnf-automatic\",\n   \
  \ \"/bin/pacman\", \"/usr/bin/pacman\", \"/usr/bin/dpkg-divert\", \"/bin/dpkg-divert\"\
  , \"/sbin/apk\", \"/usr/sbin/apk\",\n    \"/usr/local/sbin/apk\", \"/usr/bin/apt\"\
  , \"/usr/sbin/pacman\", \"/bin/podman\", \"/usr/bin/podman\", \"/usr/bin/puppet\"\
  ,\n    \"/bin/puppet\", \"/opt/puppetlabs/puppet/bin/puppet\", \"/usr/bin/chef-client\"\
  , \"/bin/chef-client\",\n    \"/bin/autossl_check\", \"/usr/bin/autossl_check\"\
  , \"/proc/self/exe\", \"/dev/fd/*\",  \"/usr/bin/pamac-daemon\",\n    \"/bin/pamac-daemon\"\
  , \"/usr/local/bin/dockerd\", \"/opt/elasticbeanstalk/bin/platform-engine\",\n \
  \   \"/opt/puppetlabs/puppet/bin/ruby\", \"/usr/libexec/platform-python\", \"/opt/imunify360/venv/bin/python3\"\
  ,\n    \"/opt/eset/efs/lib/utild\", \"/usr/sbin/anacron\", \"/usr/bin/podman\",\
  \ \"/kaniko/kaniko-executor\",\n    \"/usr/bin/pvedaemon\", \"./usr/bin/podman\"\
  , \"/usr/lib/systemd/systemd\"\n  ) or\n  file.path like (\"/var/spool/cron/crontabs/tmp.*\"\
  , \"/etc/cron.d/jumpcloud-updater\") or\n  file.extension in (\"swp\", \"swpx\"\
  , \"swx\", \"dpkg-remove\") or\n  file.Ext.original.extension == \"dpkg-new\" or\n\
  \  process.executable : (\n    \"/nix/store/*\", \"/var/lib/dpkg/*\", \"/tmp/vmis.*\"\
  , \"/snap/*\", \"/dev/fd/*\", \"/usr/libexec/platform-python*\",\n    \"/var/lib/waagent/Microsoft*\"\
  \n  ) or\n  process.executable == null or\n  process.name in (\n    \"crond\", \"\
  executor\", \"puppet\", \"droplet-agent.postinst\", \"cf-agent\", \"schedd\", \"\
  imunify-notifier\", \"perl\",\n    \"jumpcloud-agent\", \"crio\", \"dnf_install\"\
  , \"utild\"\n  ) or\n  (process.name == \"sed\" and file.name : \"sed*\") or\n \
  \ (process.name == \"perl\" and file.name : \"e2scrub_all.tmp*\")  or\n  (process.name\
  \ in (\"vi\", \"vim\") and file.name like \"*~\")\n)"
explanation: 'This rule monitors for (ana)cron jobs being created or renamed. Linux
  cron jobs are scheduled tasks that can be

  leveraged by system administrators to set up scheduled tasks, but may be abused
  by malicious actors for persistence,

  privilege escalation and command execution. By creating or modifying cron job configurations,
  attackers can execute

  malicious commands or scripts at predefined intervals, ensuring their continued
  presence and enabling unauthorized

  activities.'
