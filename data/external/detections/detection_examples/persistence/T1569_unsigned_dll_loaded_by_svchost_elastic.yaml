  *\",\n                  \"?:\\\\Windows\\\\security\\\\*\",\n                  \"\
  ?:\\\\Windows\\\\schemas\\\\*\",\n                  \"?:\\\\Windows\\\\SchCache\\\
  \\*\",\n                  \"?:\\\\Windows\\\\Resources\\\\*\",\n               \
  \   \"?:\\\\Windows\\\\rescache\\\\*\",\n                  \"?:\\\\Windows\\\\Provisioning\\\
