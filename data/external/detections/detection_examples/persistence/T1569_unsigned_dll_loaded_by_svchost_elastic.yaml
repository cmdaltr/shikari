technique_id: T1569
technique_name: Unsigned DLL Loaded by Svchost
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "library where host.os.type == \"windows\" and\n\n process.executable :\n \
  \    (\"?:\\\\Windows\\\\System32\\\\svchost.exe\", \"?:\\\\Windows\\\\Syswow64\\\
  \\svchost.exe\") and\n\n dll.code_signature.trusted != true and\n\n not dll.code_signature.status\
  \ : (\"trusted\", \"errorExpired\", \"errorCode_endpoint*\") and\n\n dll.hash.sha256\
  \ != null and\n\n (\n       /* DLL created within 5 minutes of the library load\
  \ event - compatible with Elastic Endpoint 8.4+ */\n       dll.Ext.relative_file_creation_time\
  \ <= 300 or\n\n       /* unusual paths */\n       dll.path :(\"?:\\\\ProgramData\\\
  \\*\",\n                  \"?:\\\\Users\\\\*\",\n                  \"?:\\\\PerfLogs\\\
  \\*\",\n                  \"?:\\\\Windows\\\\Tasks\\\\*\",\n                  \"\
  ?:\\\\Intel\\\\*\",\n                  \"?:\\\\AMD\\\\Temp\\\\*\",\n           \
  \       \"?:\\\\Windows\\\\AppReadiness\\\\*\",\n                  \"?:\\\\Windows\\\
  \\ServiceState\\\\*\",\n                  \"?:\\\\Windows\\\\security\\\\*\",\n\
  \                  \"?:\\\\Windows\\\\IdentityCRL\\\\*\",\n                  \"\
