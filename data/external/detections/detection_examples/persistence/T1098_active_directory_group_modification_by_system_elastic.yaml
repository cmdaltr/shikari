technique_id: T1098
technique_name: Active Directory Group Modification by SYSTEM
tactic: persistence
platform: Elastic
fidelity_score: 0.88
validated: true
query: 'iam where host.os.type == "windows" and event.code == "4728" and

  winlog.event_data.SubjectUserSid : "S-1-5-18" and


  /* DOMAIN_USERS and local groups */

  not group.id : "S-1-5-21-*-513"'
explanation: 'Identifies a user being added to an active directory group by the SYSTEM
  (S-1-5-18) user. This behavior can indicate

  that the attacker has achieved SYSTEM privileges in a domain controller, which attackers
  can obtain by exploiting

  vulnerabilities or abusing default group privileges (e.g., Server Operators), and
  is attempting to pivot to a domain

  account.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/6f024bde-7085-489b-8250-5957efdf1caf.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks performed by automated scripts or scheduled tasks
    may trigger this rule. Review and document these tasks, then create exceptions
    for known benign scripts to prevent unnecessary alerts.

    - System maintenance activities, such as software updates or system reconfigurations,
    might involve legitimate group modifications by SYSTEM. Coordinate with IT teams
    to identify and whitelist these activities.

    - Certain security tools or monitoring solutions'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
