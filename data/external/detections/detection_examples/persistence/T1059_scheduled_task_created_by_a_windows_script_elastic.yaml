technique_id: T1059
technique_name: Scheduled Task Created by a Windows Script
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id with maxspan = 30s\n  [any where host.os.type == \"windows\"\
  \ and \n    (event.category : (\"library\", \"driver\") or (event.category == \"\
  process\" and event.action : \"Image loaded*\")) and\n    (?dll.name : \"taskschd.dll\"\
  \ or file.name : \"taskschd.dll\") and\n    process.name : (\"cscript.exe\", \"\
  wscript.exe\", \"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\")]\n  [registry\
  \ where host.os.type == \"windows\" and event.type == \"change\" and registry.value\
  \ : \"Actions\" and\n    registry.path : (\n      \"HKLM\\\\SOFTWARE\\\\Microsoft\\\
  \\Windows NT\\\\CurrentVersion\\\\Schedule\\\\TaskCache\\\\Tasks\\\\*\\\\Actions\"\
  ,\n      \"\\\\REGISTRY\\\\MACHINE\\\\SOFTWARE\\\\Microsoft\\\\Windows NT\\\\CurrentVersion\\\
  \\Schedule\\\\TaskCache\\\\Tasks\\\\*\\\\Actions\"\n  )]"
explanation: 'A scheduled task was created by a Windows script via cscript.exe, wscript.exe
  or powershell.exe. This can be abused by

  an adversary to establish persistence.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/689b9d57-e4d5-4357-ad17-9c334609d79a.toml
query_type: eql
query_language: eql
