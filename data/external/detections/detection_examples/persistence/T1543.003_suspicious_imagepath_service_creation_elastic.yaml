    alerts. Users can create exceptions for known software update processes to reduce
    noise.

    - System administrators might intentionally change service configurations for
    maintenance or optimization. Document and exclude these planned changes to prevent
    false positives.

    - Some enterprise applications use named pipes for inter-process communication,
    which could be flagged. Identify and whit'
  mitigation: Review investigation guide for details
