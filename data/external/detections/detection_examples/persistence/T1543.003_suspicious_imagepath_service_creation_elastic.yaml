technique_id: T1543.003
technique_name: Suspicious ImagePath Service Creation
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : \"ImagePath\" and\n  registry.path : \"*\\\\SYSTEM\\\\ControlSet*\\\
  \\Services\\\\*\\\\ImagePath\" and\n  /* add suspicious registry ImagePath values\
  \ here */\n  registry.data.strings : (\"%COMSPEC%*\", \"*\\\\.\\\\pipe\\\\*\")"
explanation: 'Identifies the creation of a suspicious ImagePath value. This could
  be an indication of an adversary attempting to

  stealthily persist or escalate privileges through abnormal service creation.'
source: Elastic Detection Rules
