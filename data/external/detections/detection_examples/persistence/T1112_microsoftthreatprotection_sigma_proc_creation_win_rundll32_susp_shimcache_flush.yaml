query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: ( selection1a and selection1b\
  \ ) or ( selection2a and selection2b )\nselection1a:\n  CommandLine|contains|all:\n\
  \  - rundll32\n  - apphelp.dll\nselection1b:\n  CommandLine|contains:\n  - ShimFlushCache\n\
  \  - '#250'\nselection2a:\n  CommandLine|contains|all:\n  - rundll32\n  - kernel32.dll\n\
  selection2b:\n  CommandLine|contains:\n  - BaseFlushAppcompatCache\n  - '#46'\n"
