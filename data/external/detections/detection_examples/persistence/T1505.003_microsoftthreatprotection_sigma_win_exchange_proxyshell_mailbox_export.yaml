technique_id: T1505.003
technique_name: Mailbox Export to Exchange Webserver
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.93
validated: true
source: sigma
sigma_id: 516376b4-05cd-4122-bae0-ad7641c38d48
level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (export_command and export_params)\
  \ or role_assignment\nexport_command:\n  '|all':\n  - New-MailboxExportRequest\n\
  \  - ' -Mailbox '\nexport_params:\n- -FilePath \"\\\\\\\\\n- .aspx\nrole_assignment:\n\
  \  '|all':\n  - New-ManagementRoleAssignment\n  - ' -Role \"Mailbox Import Export\"\
  '\n  - ' -User '\n"
explanation: Detects a successful export of an Exchange mailbox to untypical directory
  or with aspx name suffix which can be used to place a webshell or the needed role
  assignment for it
false_positives:
- Unlikely
references:
- https://blog.orange.tw/2021/08/proxylogon-a-new-attack-surface-on-ms-exchange-part-1.html
tags:
- attack.persistence
- attack.t1505.003
logsource:
  service: msexchange-management
  product: windows
detection:
  export_command:
    '|all':
    - New-MailboxExportRequest
    - ' -Mailbox '
  export_params:
  - -FilePath "\\\\
  - .aspx
  role_assignment:
    '|all':
    - New-ManagementRoleAssignment
    - ' -Role "Mailbox Import Export"'
    - ' -User '
  condition: (export_command and export_params) or role_assignment
