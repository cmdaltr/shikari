technique_id: T1114.002
technique_name: O365 Compliance Content Search Started
tactic: persistence
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=SecurityComplianceCenter Operation=SearchCreated
  | rename user_id as user | fillnull | stats count min(_time) as firstTime max(_time)
  as lastTime by signature dest user src vendor_account vendor_product ExchangeLocations
  Query | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `o365_compliance_content_search_started_filter`'
explanation: The following analytic detects when a content search is initiated within
  the Office 365 Security and Compliance Center. It leverages the SearchCreated operation
  from the o365_management_activity logs under the SecurityComplianceCenter workload.
  This activity is significant as it may indicate an attempt to access sensitive organizational
  data, including emails and documents. If confirmed malicious, this could lead to
  unauthorized data access, potential data exfiltration, and compliance violations.
  Monitoring this behavior helps ensure the integrity and security of organizational
  data.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/f4cabbc7-c19a-4e41-8be5-98daeaccbb50/
indicators:
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Compliance content searches may be executed for legitimate purposes,
    filter as needed.
  mitigation: Review context and user activity
