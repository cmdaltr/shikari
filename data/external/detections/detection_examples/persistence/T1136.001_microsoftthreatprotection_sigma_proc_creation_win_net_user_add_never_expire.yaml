query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - user\n  - add\n  - expires:never\n\
  selection_img:\n- Image|endswith:\n  - \\net.exe\n  - \\net1.exe\n- OriginalFileName:\n\
  \  - net.exe\n  - net1.exe\n"
