technique_id: T1037.004
technique_name: rc.local/rc.common File Creation
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"linux\" and event.action in (\"rename\", \"creation\"\
  ) and\nfile.path in (\"/etc/rc.local\", \"/etc/rc.common\") and not (\n  process.executable\
  \ in (\n    \"/bin/dpkg\", \"/usr/bin/dpkg\", \"/bin/dockerd\", \"/usr/bin/dockerd\"\
  , \"/usr/sbin/dockerd\", \"/bin/microdnf\",\n    \"/usr/bin/microdnf\", \"/bin/rpm\"\
  , \"/usr/bin/rpm\", \"/bin/snapd\", \"/usr/bin/snapd\", \"/bin/yum\", \"/usr/bin/yum\"\
  ,\n    \"/bin/dnf\", \"/usr/bin/dnf\", \"/bin/podman\", \"/usr/bin/podman\", \"\
  /bin/dnf-automatic\", \"/usr/bin/dnf-automatic\",\n    \"/bin/pacman\", \"/usr/bin/pacman\"\
  , \"/usr/bin/dpkg-divert\", \"/bin/dpkg-divert\", \"/sbin/apk\", \"/usr/sbin/apk\"\
  ,\n    \"/usr/local/sbin/apk\", \"/usr/bin/apt\", \"/usr/sbin/pacman\", \"/bin/podman\"\
  , \"/usr/bin/podman\", \"/usr/bin/puppet\",\n    \"/bin/puppet\", \"/opt/puppetlabs/puppet/bin/puppet\"\
  , \"/usr/bin/chef-client\", \"/bin/chef-client\",\n    \"/bin/autossl_check\", \"\
  /usr/bin/autossl_check\", \"/proc/self/exe\", \"/dev/fd/*\",  \"/usr/bin/pamac-daemon\"\
  ,\n    \"/bin/pamac-daemon\", \"/usr/lib/snapd/snapd\", \"/usr/local/bin/dockerd\"\
  , \"/usr/libexec/platform-python\"\n  ) or\n  file.extension in (\"swp\", \"swpx\"\
  , \"swx\", \"dpkg-remove\") or\n  file.Ext.original.extension == \"dpkg-new\" or\n\
  \  process.executable : (\n    \"/nix/store/*\", \"/var/lib/dpkg/*\", \"/snap/*\"\
  , \"/dev/fd/*\", \"/usr/lib/virtualbox/*\"\n  ) or\n  process.executable == null\
  \ or\n  process.name in (\"ssm-agent-worker\", \"convert2rhel\", \"platform-python*\"\
  ) or\n  (process.name == \"sed\" and file.name : \"sed*\") or\n  (process.name ==\
  \ \"perl\" and file.name : \"e2scrub_all.tmp*\") \n)"
explanation: 'This rule monitors the creation/alteration of the rc.local/rc.common
  file. The /etc/rc.local file is used to start

  custom applications, services, scripts or commands during start-up. The rc.local
  file has mostly been replaced by

  Systemd. However, through the "systemd-rc-local-generator", rc.local files can be
  converted to services that run at

  boot. Adversaries may alter rc.local/rc.common to execute malicious code at start-up,
  and gain persistence onto the

  system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0f4d35e4-925e-4959-ab24-911be207ee6f.toml
query_type: eql
query_language: eql
