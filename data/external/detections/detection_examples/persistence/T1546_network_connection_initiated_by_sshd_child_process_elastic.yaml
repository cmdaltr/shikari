technique_id: T1546
technique_name: Network Connection Initiated by SSHD Child Process
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id with maxspan=1s\n  [process where host.os.type == \"linux\"\
  \ and event.type == \"start\" and event.action == \"exec\" and\n   process.parent.executable\
  \ == \"/usr/sbin/sshd\"] by process.entity_id\n  [network where host.os.type ==\
  \ \"linux\" and event.type == \"start\" and event.action == \"connection_attempted\"\
  \ and not (\n     destination.ip == null or destination.ip == \"0.0.0.0\" or cidrmatch(\n\
  \     destination.ip, \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\"\
  , \"192.0.0.0/24\", \"192.0.0.0/29\",\n     \"192.0.0.8/32\", \"192.0.0.9/32\",\
  \ \"192.0.0.10/32\", \"192.0.0.170/32\", \"192.0.0.171/32\", \"192.0.2.0/24\",\n\
  \     \"192.31.196.0/24\", \"192.52.193.0/24\", \"192.168.0.0/16\", \"192.88.99.0/24\"\
  , \"224.0.0.0/4\", \"100.64.0.0/10\",\n     \"192.175.48.0/24\",\"198.18.0.0/15\"\
  , \"198.51.100.0/24\", \"203.0.113.0/24\", \"240.0.0.0/4\", \"::1\", \"FE80::/10\"\
  ,\n     \"FF00::/8\", \"172.31.0.0/16\"\n     )\n    ) and not (\n      process.executable\
  \ in (\"/bin/yum\", \"/usr/bin/yum\") or\n      process.name in (\"login_duo\",\
  \ \"ssh\", \"sshd\", \"sshd-session\")\n    )\n  ] by process.parent.entity_id"
explanation: 'This rule identifies an egress internet connection initiated by an SSH
  Daemon child process. This behavior is

  indicative of the alteration of a shell configuration file or other mechanism that
  launches a process when a

  new SSH login occurs. Attackers can also backdoor the SSH daemon to allow for persistence,
  call out to a C2

  or to steal credentials.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/63431796-f813-43af-820b-492ee2efec8e.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Internal administrative scripts or tools that initiate network connections upon
    SSH login can trigger false positives. To manage this, identify and whitelist
    these specific scripts or tools by their process names or executable paths.

    - Automated software updates or package management processes like yum may occasionally
    initiate network connections. Exclude these processes by adding them to the exception
    list using their executable paths.

    - Security tools such as login_'
  mitigation: Review investigation guide for details
references:
- https://hadess.io/the-art-of-linux-persistence/
has_investigation_guide: true
risk_score: 47
