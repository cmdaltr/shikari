technique_id: T1098
technique_name: AWS RDS DB Instance or Cluster Password Modified
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "any where event.dataset == \"aws.cloudtrail\"\n    and event.provider == \"\
  rds.amazonaws.com\"\n    and event.action in (\"ModifyDBInstance\", \"ModifyDBCluster\"\
  )\n    and event.outcome == \"success\"\n    and stringContains(aws.cloudtrail.request_parameters,\
  \ \"masterUserPassword=*\")"
explanation: Identifies the modification of the master password for an AWS RDS DB
  instance or cluster. DB instances may contain sensitive data that can be abused
  if accessed by unauthorized actors. Amazon RDS API operations never return the password,
  so this operation provides a means to regain access if the password is lost. Adversaries
  with the proper permissions can take advantage of this to evade defenses and gain
  unauthorized access to a DB instance or cluster to support persistence mechanisms
  or privilege escalation.
source: Elastic Detection Rules
