technique_id: T1112
technique_name: Reg Add Suspicious Paths
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: b7e2a8d4-74bb-4b78-adc9-3f92af2d4829
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_path:\n  CommandLine|contains:\n  - \\AppDataLow\\Software\\Microsoft\\\
  \n  - \\Policies\\Microsoft\\Windows\\OOBE\n  - \\Policies\\Microsoft\\Windows NT\\\
  CurrentVersion\\Winlogon\n  - \\SOFTWARE\\Microsoft\\Windows NT\\Currentversion\\\
  Winlogon\n  - \\CurrentControlSet\\Control\\SecurityProviders\\WDigest\n  - \\Microsoft\\\
  Windows Defender\\\nselection_reg:\n- Image|endswith: \\reg.exe\n- OriginalFileName:\
  \ reg.exe\n"
explanation: Detects when an adversary uses the reg.exe utility to add or modify new
  keys or subkeys
false_positives:
- Rare legitimate add to registry via cli (to these locations)
references:
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1112/T1112.md
- https://github.com/redcanaryco/atomic-red-team/blob/40b77d63808dd4f4eafb83949805636735a1fd15/atomics/T1562.001/T1562.001.md
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
  - Image|endswith: \reg.exe
  - OriginalFileName: reg.exe
  selection_path:
    CommandLine|contains:
    - \AppDataLow\Software\Microsoft\
    - \Policies\Microsoft\Windows\OOBE
    - \Policies\Microsoft\Windows NT\CurrentVersion\Winlogon
    - \SOFTWARE\Microsoft\Windows NT\Currentversion\Winlogon
    - \CurrentControlSet\Control\SecurityProviders\WDigest
    - \Microsoft\Windows Defender\
  condition: all of selection_*
