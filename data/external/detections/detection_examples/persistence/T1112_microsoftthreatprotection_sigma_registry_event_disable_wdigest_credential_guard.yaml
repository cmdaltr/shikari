technique_id: T1112
technique_name: Wdigest CredGuard Registry Modification
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 1a2d6c47-75b0-45bd-b133-2c0be75349fd
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetObject|endswith: \\IsCredGuardEnabled\n"
explanation: 'Detects potential malicious modification of the property value of IsCredGuardEnabled
  from

  HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest to disable Cred
  Guard on a system.

  This is usually used with UseLogonCredential to manipulate the caching credentials.

  '
false_positives:
- Unknown
references:
- https://teamhydra.blog/2020/08/25/bypassing-credential-guard/
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
