technique_id: T1053.005
technique_name: Schtasks From Suspicious Folders
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 8a8379b8-780b-4dbf-b1e9-31c8d112fefb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_all_folders:\n  CommandLine|contains:\n  - C:\\ProgramData\\\n  - '%ProgramData%'\n\
  selection_command:\n  CommandLine|contains:\n  - powershell\n  - pwsh\n  - 'cmd\
  \ /c '\n  - 'cmd /k '\n  - 'cmd /r '\n  - 'cmd.exe /c '\n  - 'cmd.exe /k '\n  -\
  \ 'cmd.exe /r '\nselection_create:\n  CommandLine|contains: ' /create '\nselection_img:\n\
  - Image|endswith: \\schtasks.exe\n- OriginalFileName: schtasks.exe\n"
explanation: Detects scheduled task creations that have suspicious action command
  and folder combinations
false_positives:
- Unknown
references:
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/lazarus-dream-job-chemical
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: \schtasks.exe
  - OriginalFileName: schtasks.exe
  selection_create:
    CommandLine|contains: ' /create '
  selection_command:
    CommandLine|contains:
    - powershell
    - pwsh
    - 'cmd /c '
    - 'cmd /k '
    - 'cmd /r '
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
  selection_all_folders:
    CommandLine|contains:
    - C:\ProgramData\
    - '%ProgramData%'
  condition: all of selection_*
metadata:
  created_date: 2022-04-15
  modified_date: 2022-11-18
