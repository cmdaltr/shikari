technique_id: T1546.008
technique_name: Sticky Key Like Backdoor Usage - Registry
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.89
validated: true
source: sigma
sigma_id: baca5663-583c-45f9-b5dc-ea96a22ce542
level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_registry\n\
  selection_registry:\n  TargetObject|endswith:\n  - \\SOFTWARE\\Microsoft\\Windows\
  \ NT\\CurrentVersion\\Image File Execution Options\\sethc.exe\\Debugger\n  - \\\
  SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\\
  utilman.exe\\Debugger\n  - \\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image\
  \ File Execution Options\\osk.exe\\Debugger\n  - \\SOFTWARE\\Microsoft\\Windows\
  \ NT\\CurrentVersion\\Image File Execution Options\\Magnify.exe\\Debugger\n  - \\\
  SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\\
  Narrator.exe\\Debugger\n  - \\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\\
  Image File Execution Options\\DisplaySwitch.exe\\Debugger\n  - \\SOFTWARE\\Microsoft\\\
  Windows NT\\CurrentVersion\\Image File Execution Options\\atbroker.exe\\Debugger\n\
  \  - \\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\\
  HelpPane.exe\\Debugger\n"
explanation: Detects the usage and installation of a backdoor that uses an option
  to register a malicious debugger for built-in tools that are accessible in the login
  screen
false_positives:
- Unlikely
references:
- https://blogs.technet.microsoft.com/jonathantrull/2016/10/03/detecting-sticky-key-backdoors/
- https://bazaar.abuse.ch/sample/6f3aa9362d72e806490a8abce245331030d1ab5ac77e400dd475748236a6cc81/
tags:
- attack.privilege-escalation
