technique_id: T1112
technique_name: Outlook EnableUnsafeClientMailRules Setting Enabled - Registry
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000001)\n  TargetObject|endswith: \\Outlook\\Security\\EnableUnsafeClientMailRules\n"
explanation: Detects an attacker trying to enable the outlook security setting "EnableUnsafeClientMailRules"
  which allows outlook to run applications or execute macros
false_positives:
- Unknown
