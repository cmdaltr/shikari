technique_id: T1574.001
technique_name: DLL Search Order Hijackig Via Additional Space in Path
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: b6f91281-20aa-446a-b986-38a92813a18f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetFilename|endswith: .dll\n  TargetFilename|startswith:\n  - C:\\Windows\
  \ \\\n  - C:\\Program Files \\\n  - C:\\Program Files (x86) \\\n"
explanation: 'Detects when an attacker create a similar folder structure to windows
  system folders such as (Windows, Program Files...)

  but with a space in order to trick DLL load search order and perform a "DLL Search
  Order Hijacking" attack

  '
false_positives:
- Unknown
references:
- https://twitter.com/cyb3rops/status/1552932770464292864
- https://www.wietzebeukema.nl/blog/hijacking-dlls-in-windows
