technique_id: T1112
technique_name: Office Macros Warning Disabled
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 91239011-fe3c-4b54-9f24-15c86bb65913
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000001)\n  TargetObject|endswith: \\Security\\VBAWarnings\n"
explanation: Detects registry changes to Microsoft Office "VBAWarning" to a value
  of "1" which enables the execution of all macros, whether signed or unsigned.
