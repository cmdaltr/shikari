technique_id: T1137
technique_name: Persistence via Microsoft Outlook VBA
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"windows\" and event.type != \"deletion\" and\n\
  \  file.name : \"VbaProject.OTM\" and\n  file.path : (\"?:\\\\Users\\\\*\\\\AppData\\\
  \\Roaming\\\\Microsoft\\\\Outlook\\\\VbaProject.OTM\", \"\\\\Device\\\\HarddiskVolume*\\\
  \\Users\\\\*\\\\AppData\\\\Roaming\\\\Microsoft\\\\Outlook\\\\VbaProject.OTM\")"
explanation: Detects attempts to establish persistence on an endpoint by installing
  a rogue Microsoft Outlook VBA Template.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/397945f3-d39a-4e6f-8bcb-9656c2031438.toml
