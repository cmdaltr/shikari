technique_id: T1574.001
technique_name: DLL Sideloading by VMware Xfer Utility
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: ebea773c-a8f1-42ad-a856-00cb221966e8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Image|startswith: C:\\Program Files\\VMware\\\nselection:\n  Image|endswith:\
  \ \\VMwareXferlogs.exe\n"
explanation: Detects execution of VMware Xfer utility (VMwareXferlogs.exe) from the
  non-default directory which may be an attempt to sideload arbitrary DLL
false_positives:
- Unlikely
references:
- https://www.sentinelone.com/labs/lockbit-ransomware-side-loads-cobalt-strike-beacon-with-legitimate-vmware-utility/
