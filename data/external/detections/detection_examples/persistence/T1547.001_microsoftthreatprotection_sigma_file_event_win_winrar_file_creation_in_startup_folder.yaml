technique_id: T1547.001
technique_name: WinRAR Creating Files in Startup Locations
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 74a2b37d-fea4-41e0-9ac7-c9fbcf1f60cc
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith:\n  - \\WinRAR.exe\n  - \\Rar.exe\n  TargetFilename|contains:\
  \ \\Start Menu\\Programs\\Startup\\\n"
explanation: 'Detects WinRAR creating files in Windows startup locations, which may
  indicate an attempt to establish persistence by adding malicious files to the Startup
  folder.

  This kind of behaviour has been associated with exploitation of WinRAR path traversal
  vulnerability CVE-2025-6218 or CVE-2025-8088.

  '
false_positives:
- Unknown
references:
- https://github.com/mulwareX/CVE-2025-6218-POC
- https://x.com/0x534c/status/1944694507787710685
- https://www.welivesecurity.com/en/eset-research/update-winrar-tools-now-romcom-and-others-exploiting-zero-day-vulnerability/
tags:
