technique_id: T1548.001
technique_name: Setcap setuid/setgid Capability Set
tactic: persistence
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\") and\
  \ \n  process.name == \"setcap\" and process.args : \"cap_set?id+ep\" and not (\n\
  \    process.parent.name in (\"jem\", \"vzctl\") or\n    process.args like \"/usr/bin/new?idmap\"\
  \n  )"
explanation: 'This rule monitors for the addition of the cap_setuid+ep or cap_setgid+ep
  capabilities via setcap. Setuid (Set User ID)

  and setgid (Set Group ID) are Unix-like OS features that enable processes to run
  with elevated privileges, based on the

  file owner or group. Threat actors can exploit these attributes to achieve persistence
  by creating malicious binaries,

  allowing them to maintain control over a compromised system with elevated permissions.'
