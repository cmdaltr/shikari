technique_id: T1546.008
technique_name: Suspicious Debugger Registration Cmdline
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: ae215552-081e-44c7-805f-be16f975c8a2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection1:\n\
  \  CommandLine|contains: \\CurrentVersion\\Image File Execution Options\\\nselection2:\n\
  \  CommandLine|contains:\n  - sethc.exe\n  - utilman.exe\n  - osk.exe\n  - magnify.exe\n\
  \  - narrator.exe\n  - displayswitch.exe\n  - atbroker.exe\n  - HelpPane.exe\n"
explanation: Detects the registration of a debugger for a program that is available
  in the logon screen (sticky key backdoor).
false_positives:
- Unknown
references:
- https://blogs.technet.microsoft.com/jonathantrull/2016/10/03/detecting-sticky-key-backdoors/
- https://bazaar.abuse.ch/sample/6f3aa9362d72e806490a8abce245331030d1ab5ac77e400dd475748236a6cc81/
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1546.008
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains: \CurrentVersion\Image File Execution Options\
  selection2:
    CommandLine|contains:
    - sethc.exe
    - utilman.exe
    - osk.exe
    - magnify.exe
    - narrator.exe
    - displayswitch.exe
    - atbroker.exe
    - HelpPane.exe
  condition: all of selection*
