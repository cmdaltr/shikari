technique_id: T1136
technique_name: Potential Linux Backdoor User Account Creation
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \ event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\", \"executed\"\
  , \"process_started\")\n and process.name == \"usermod\" and process.args : \"-u\"\
  \ and process.args : \"0\" and process.args : \"-o\""
explanation: 'Identifies the attempt to create a new backdoor user by setting the
  user''s UID to 0. Attackers may alter a user''s UID to

  0 to establish persistence on a system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/494ebba4-ecb7-4be4-8c6f-654c686549ad.toml
query_type: eql
query_language: eql
