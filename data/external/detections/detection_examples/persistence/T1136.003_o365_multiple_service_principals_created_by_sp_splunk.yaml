technique_id: T1136.003
technique_name: O365 Multiple Service Principals Created by SP
tactic: persistence
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`o365_management_activity` Workload=AzureActiveDirectory Operation="Add service
  principal." | bucket span=10m _time | eval len=mvcount(''Actor{}.ID'') | eval userType
  = mvindex(''Actor{}.ID'',len-1) | search userType = "ServicePrincipal" | eval displayName
  = object | fillnull | stats count earliest(_time) as firstTime latest(_time) as
  lastTime values(displayName) as displayName dc(displayName) as unique_apps values(user)
  as user values(src) as src by src_user vendor_account vendor_product dest signature
  | where unique_apps > 3 | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `o365_multiple_service_principals_created_by_sp_filter`'
explanation: The following analytic identifies instances where a single service principal
  creates more than three unique OAuth applications within a 10-minute timeframe.
  It leverages O365 logs from the Unified Audit Log, focusing on the 'Add service
  principal' operation in the Office 365 Azure Active Directory environment. This
  activity is significant as it may indicate a compromised or malicious service principal
  attempting to expand control or access within the network. If confirmed malicious,
  this could lead to unauthorized access and potential lateral movement within the
  environment, posing a significant security risk.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/ef4c3f20-d1ad-4ad1-a3f4-d5f391c005fe/
indicators:
- type: data_source
  value: O365 Add service principal.
  confidence: high
- type: risk_user
  value: src_user
  confidence: high
false_positives:
- description: Certain users or applications may create multiple service principals
    in a short period of time for legitimate purposes. Filter as needed.
  mitigation: Review context and user activity
references:
