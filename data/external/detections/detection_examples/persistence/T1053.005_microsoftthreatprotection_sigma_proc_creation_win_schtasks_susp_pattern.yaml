technique_id: T1053.005
technique_name: Suspicious Command Patterns In Scheduled Task Creation
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: f2c64357-b1d2-41b7-849f-34d2682c0fad
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_schtasks and\
  \ ( all of selection_pattern_* or selection_uncommon\n  or all of selection_anomaly_*\
  \ )\nselection_anomaly_1:\n  CommandLine|contains:\n  - :\\ProgramData\\\n  - :\\\
  Temp\\\n  - :\\Tmp\\\n  - :\\Users\\Public\\\n  - :\\Windows\\Temp\\\n  - \\AppData\\\
  \n  - '%AppData%'\n  - '%Temp%'\n  - '%tmp%'\nselection_anomaly_2:\n  CommandLine|contains:\n\
  \  - cscript\n  - curl\n  - wscript\nselection_pattern_1:\n  CommandLine|contains:\n\
  \  - '/sc minute '\n  - '/ru system '\nselection_pattern_2:\n  CommandLine|contains:\n\
  \  - cmd /c\n  - cmd /k\n  - cmd /r\n  - 'cmd.exe /c '\n  - 'cmd.exe /k '\n  - 'cmd.exe\
  \ /r '\nselection_schtasks:\n  CommandLine|contains: '/Create '\n  Image|endswith:\
  \ \\schtasks.exe\nselection_uncommon:\n  CommandLine|contains:\n  - ' -decode '\n\
  \  - ' -enc '\n  - ' -w hidden '\n  - ' bypass '\n  - ' IEX'\n  - .DownloadData\n\
  \  - .DownloadFile\n  - .DownloadString\n  - '/c start /min '\n  - FromBase64String\n\
  \  - mshta http\n  - mshta.exe http\n"
explanation: Detects scheduled task creation using "schtasks" that contain potentially
  suspicious or uncommon commands
false_positives:
- Software installers that run from temporary folders and also install scheduled tasks
  are expected to generate some false positives
references:
- https://app.any.run/tasks/512c1352-6380-4436-b27d-bb62f0c020d6/
- https://twitter.com/RedDrip7/status/1506480588827467785
- https://www.ncsc.gov.uk/static-assets/documents/malware-analysis-reports/devil-bait/NCSC-MAR-Devil-Bait.pdf
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_schtasks:
    Image|endswith: \schtasks.exe
    CommandLine|contains: '/Create '
  selection_pattern_1:
    CommandLine|contains:
    - '/sc minute '
    - '/ru system '
  selection_pattern_2:
    CommandLine|contains:
    - cmd /c
    - cmd /k
    - cmd /r
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
  selection_uncommon:
    CommandLine|contains:
    - ' -decode '
    - ' -enc '
    - ' -w hidden '
    - ' bypass '
    - ' IEX'
    - .DownloadData
    - .DownloadFile
    - .DownloadString
    - '/c start /min '
    - FromBase64String
    - mshta http
    - mshta.exe http
  selection_anomaly_1:
    CommandLine|contains:
    - :\ProgramData\
    - :\Temp\
    - :\Tmp\
    - :\Users\Public\
    - :\Windows\Temp\
    - \AppData\
    - '%AppData%'
    - '%Temp%'
    - '%tmp%'
  selection_anomaly_2:
    CommandLine|contains:
    - cscript
    - curl
    - wscript
  condition: selection_schtasks and ( all of selection_pattern_* or selection_uncommon
    or all of selection_anomaly_* )
metadata:
  created_date: 2022-02-23
