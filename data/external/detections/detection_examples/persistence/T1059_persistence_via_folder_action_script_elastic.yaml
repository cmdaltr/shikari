technique_id: T1059
technique_name: Persistence via Folder Action Script
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and process.parent.name == \"com.apple.foundation.UserScriptService\" and\n ((process.name\
  \ like~ (\"osascript\", \"python*\", \"tcl*\", \"node\", \"perl\", \"ruby\", \"\
  php\")) or \n  (process.name in (\"bash\", \"csh\", \"zsh\", \"sh\") and process.args\
  \ == \"-c\")) and \n not process.args like (\"/Users/*/Library/Scripts/*\", \"/Users/*/Library/Application\
  \ Scripts/*\", \"/Library/Scripts/*\")"
explanation: 'Detects modification of a Folder Action script. A Folder Action script
  is executed when the folder to which it is

  attached has items added or removed, or when its window is opened, closed, moved,
  or resized. Adversaries may abuse this

  feature to establish persistence by utilizing a malicious script.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c292fa52-4115-408a-b897-e14f684b3cb7.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Scripts associated with legitimate applications like iTerm2 and Microsoft Office
    may trigger alerts. These are known benign scripts and can be excluded by adding
    their paths to the exception list in the detection rule.

    - Custom user scripts that automate routine tasks might be flagged. Users should
    review these scripts and, if verified as safe, add their specific paths to the
    exclusion criteria.

    - Development environments that frequently execute scripts for testing pur'
  mitigation: Review investigation guide for details
references:
- https://posts.specterops.io/folder-actions-for-persistence-on-macos-8923f222343d
has_investigation_guide: true
risk_score: 47
