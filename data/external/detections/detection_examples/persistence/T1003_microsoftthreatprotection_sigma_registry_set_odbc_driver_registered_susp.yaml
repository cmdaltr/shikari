fidelity_score: 0.84
validated: true
source: sigma
sigma_id: e4d22291-f3d5-4b78-9a0c-a1fbaf32a6a4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details|contains:\n  - :\\PerfLogs\\\n  - :\\ProgramData\\\n  - :\\Temp\\\n \
  \ - :\\Users\\Public\\\n  - :\\Windows\\Registration\\CRMLog\n  - :\\Windows\\System32\\\
  com\\dmp\\\n  - :\\Windows\\System32\\FxsTmp\\\n  - :\\Windows\\System32\\Microsoft\\\
  Crypto\\RSA\\MachineKeys\\\n  - :\\Windows\\System32\\spool\\drivers\\color\\\n\
  \  - :\\Windows\\System32\\spool\\PRINTERS\\\n  - :\\Windows\\System32\\spool\\\
  SERVERS\\\n  - :\\Windows\\System32\\Tasks_Migrated\\\n  - :\\Windows\\System32\\\
  Tasks\\Microsoft\\Windows\\SyncCenter\\\n  - :\\Windows\\SysWOW64\\com\\dmp\\\n\
  \  - :\\Windows\\SysWOW64\\FxsTmp\\\n  - :\\Windows\\SysWOW64\\Tasks\\Microsoft\\\
  Windows\\PLA\\System\\\n  - :\\Windows\\SysWOW64\\Tasks\\Microsoft\\Windows\\SyncCenter\\\
  \n  - :\\Windows\\Tasks\\\n  - :\\Windows\\Temp\\\n  - :\\Windows\\Tracing\\\n \
  \ - \\AppData\\Local\\Temp\\\n  - \\AppData\\Roaming\\\n  TargetObject|contains:\
  \ \\SOFTWARE\\ODBC\\ODBCINST.INI\\\n  TargetObject|endswith:\n  - \\Driver\n  -\
  \ \\Setup\n"
explanation: Detects the registration of a new ODBC driver where the driver is located
  in a potentially suspicious location
false_positives:
- Unlikely
references:
- https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/
