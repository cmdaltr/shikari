technique_id: T1053.005
technique_name: Suspicious Modification Of Scheduled Tasks
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 1c0e41cd-21bb-4433-9acc-4a2cd6367b9b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_schtasks:\n  CommandLine|contains|all:\n  - ' /Change '\n  - ' /TN '\n\
  \  Image|endswith: \\schtasks.exe\nselection_susp_images:\n  CommandLine|contains:\n\
  \  - regsvr32\n  - rundll32\n  - 'cmd /c '\n  - 'cmd /k '\n  - 'cmd /r '\n  - 'cmd.exe\
  \ /c '\n  - 'cmd.exe /k '\n  - 'cmd.exe /r '\n  - powershell\n  - mshta\n  - wscript\n\
  \  - cscript\n  - certutil\n  - bitsadmin\n  - bash.exe\n  - 'bash '\n  - scrcons\n\
  \  - 'wmic '\n  - wmic.exe\n  - forfiles\n  - scriptrunner\n  - hh.exe\n  - 'hh\
  \ '\nselection_susp_locations:\n  CommandLine|contains:\n  - \\AppData\\Local\\\
  Temp\n  - \\AppData\\Roaming\\\n  - \\Users\\Public\\\n  - \\WINDOWS\\Temp\\\n \
  \ - \\Desktop\\\n  - \\Downloads\\\n  - \\Temporary Internet\n  - C:\\ProgramData\\\
  \n  - C:\\Perflogs\\\n  - '%ProgramData%'\n  - '%appdata%'\n  - '%comspec%'\n  -\
  \ '%localappdata%'\n"
explanation: 'Detects when an attacker tries to modify an already existing scheduled
  tasks to run from a suspicious location

  Attackers can create a simple looking task in order to avoid detection on creation
  as it''s often the most focused on

  Instead they modify the task after creation to include their malicious payload

  '
false_positives:
- Unknown
references:
- Internal Research
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_schtasks:
    Image|endswith: \schtasks.exe
    CommandLine|contains|all:
    - ' /Change '
    - ' /TN '
  selection_susp_locations:
    CommandLine|contains:
    - \AppData\Local\Temp
    - \AppData\Roaming\
    - \Users\Public\
    - \WINDOWS\Temp\
    - \Desktop\
    - \Downloads\
    - \Temporary Internet
    - C:\ProgramData\
    - C:\Perflogs\
    - '%ProgramData%'
    - '%appdata%'
    - '%comspec%'
    - '%localappdata%'
  selection_susp_images:
    CommandLine|contains:
    - regsvr32
    - rundll32
    - 'cmd /c '
    - 'cmd /k '
    - 'cmd /r '
    - 'cmd.exe /c '
    - 'cmd.exe /k '
    - 'cmd.exe /r '
    - powershell
    - mshta
    - wscript
    - cscript
    - certutil
    - bitsadmin
    - bash.exe
    - 'bash '
    - scrcons
    - 'wmic '
    - wmic.exe
    - forfiles
    - scriptrunner
    - hh.exe
    - 'hh '
  condition: all of selection_*
