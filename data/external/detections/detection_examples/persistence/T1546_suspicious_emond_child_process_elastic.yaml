technique_id: T1546
technique_name: Suspicious Emond Child Process
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n process.parent.name == \"emond\" and\n process.name like~ (\n   \"bash\"\
  ,\n   \"dash\",\n   \"sh\",\n   \"tcsh\",\n   \"csh\",\n   \"zsh\",\n   \"ksh\"\
  ,\n   \"fish\",\n   \"Python\",\n   \"python*\",\n   \"perl*\",\n   \"php*\",\n\
  \   \"osascript\",\n   \"pwsh\",\n   \"curl\",\n   \"wget\",\n   \"cp\",\n   \"\
  mv\",\n   \"touch\",\n   \"echo\",\n   \"base64\",\n   \"launchctl\")"
explanation: 'Identifies the execution of a suspicious child process of the Event
  Monitor Daemon (emond). Adversaries may abuse this

  service by writing a rule to execute commands when a defined event occurs, such
  as system start up or user

  authentication.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3e3d15c6-1509-479a-b125-21718372157e.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - System maintenance scripts may trigger the rule if they use shell scripts or
    command-line utilities. Review scheduled tasks or maintenance scripts and exclude
    them if they are verified as non-threatening.

    - Legitimate software installations or updates might spawn processes like bash
    or curl. Monitor installation logs and exclude these processes if they align with
    known software updates.

    - User-initiated scripts for automation or customization can cause alerts. Verify
    t'
  mitigation: Review investigation guide for details
references:
- https://www.xorrior.com/emond-persistence/
- https://www.elastic.co/security-labs/handy-elastic-tools-for-the-enthusiastic-detection-engineer
has_investigation_guide: true
risk_score: 47
