    action.


    ### Response and remediation

    - If the change is unauthorized, immediately revert the discovery URL to the trusted
    IdP via the Entra ID portal.

    - Revoke tokens or sessions issued after the configuration change.

    - Investigate how the unauthorized change occurred (e.g'
  mitigation: Review investigation guide for details
