technique_id: T1543
technique_name: Modification of Standard Authentication Module or Configuration
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:file and event.type:change and\n  (file.name:pam_*.so or file.path:(/etc/pam.d/*\
  \ or /private/etc/pam.d/* or /usr/lib64/security/*)) and\n  process.executable:\n\
  \    (* and\n      not\n      (\n        /usr/libexec/packagekitd or\n        /usr/bin/vim\
  \ or\n        /usr/libexec/xpcproxy or\n        /usr/bin/bsdtar or\n        /usr/local/bin/brew\
  \ or\n        \"/System/Library/PrivateFrameworks/PackageKit.framework/Versions/A/XPCServices/package_script_service.xpc/Contents/MacOS/package_script_service\"\
  \n      )\n    ) and\n  not file.path:\n         (\n           /tmp/snap.rootfs_*/pam_*.so\
  \ or\n           /tmp/newroot/lib/*/pam_*.so or\n           /private/var/folders/*/T/com.apple.fileprovider.ArchiveService/TemporaryItems/*/lib/security/pam_*.so\
  \ or\n           /tmp/newroot/usr/lib64/security/pam_*.so\n         ) and\n  not\
  \ process.name:\n         (\n           yum or dnf or rsync or platform-python or\
  \ authconfig or rpm or pdkg or apk or dnf-automatic or btrfs or\n           dpkg\
  \ or pam-auth-update or steam or platform-python3.6 or pam-config or microdnf or\
  \ yum_install or yum-cron or\n           systemd or containerd or pacman\n     \
  \    )"
explanation: 'Adversaries may modify the standard authentication module for persistence
  via patching the normal authorization process

  or modifying the login configuration to allow unauthorized access or elevate privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/93f47b6f-5728-4004-ba00-625083b3dcb0.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'false positive.

    - Look into recent system changes or updates that might have affected authentication
    modules, focusing on the time frame around the alert.

    - Correlate the alert with other security events or logs to identify any related
    suspicious activities or patterns, such as unauthorized access attempts or privilege
    escalation.

    - Verify the integrity of the affected authentication module or configuration
    file by comparing it with a known good version or using file integrity monitoring
    tools.'
  mitigation: Review investigation guide for details
references:
- https://github.com/zephrax/linux-pam-backdoor
