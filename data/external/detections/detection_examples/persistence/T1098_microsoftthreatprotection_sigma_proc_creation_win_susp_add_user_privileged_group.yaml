query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_group:\n  CommandLine|contains:\n  - Group Policy Creator Owners\n  -\
  \ Schema Admins\nselection_main:\n- CommandLine|contains|all:\n  - 'localgroup '\n\
  \  - ' /add'\n- CommandLine|contains|all:\n  - 'Add-LocalGroupMember '\n  - ' -Group\
  \ '\n"
explanation: Detects addition of users to highly privileged groups via "Net" or "Add-LocalGroupMember".
false_positives:
- Administrative activity that must be investigated
references:
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
