technique_id: T1036.001
technique_name: Startup Folder Persistence via Unsigned Process
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id, process.entity_id with maxspan=5s\n  [process where host.os.type\
  \ == \"windows\" and event.type == \"start\" and process.code_signature.trusted\
  \ == false and\n  /* suspicious paths can be added here  */\n   process.executable\
  \ : (\"C:\\\\Users\\\\*.exe\",\n                         \"C:\\\\ProgramData\\\\\
  *.exe\",\n                         \"C:\\\\Windows\\\\Temp\\\\*.exe\",\n       \
  \                  \"C:\\\\Windows\\\\Tasks\\\\*.exe\",\n                      \
  \   \"C:\\\\Intel\\\\*.exe\",\n                         \"C:\\\\PerfLogs\\\\*.exe\"\
  )\n   ]\n   [file where host.os.type == \"windows\" and event.type != \"deletion\"\
  \ and user.domain != \"NT AUTHORITY\" and\n    file.path : (\"C:\\\\Users\\\\*\\\
  \\AppData\\\\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\
  \\*\",\n                 \"C:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Start Menu\\\
  \\Programs\\\\StartUp\\\\*\")\n   ]"
explanation: 'Identifies files written or modified in the startup folder by unsigned
  processes. Adversaries may abuse this technique

  to maintain persistence in an environment.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2fba96c0-ade5-4bce-b92f-a5df2509da3f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - There is a high possibility of benign legitimate programs being added to Startup
    folders. This activity could be based on new software installations, patches,
    or any kind of network administrator related activity. Before undertaking further
    investigation, verify that this activity is not benign.


    ### Related rules


    - Suspicious Startup Shell Folder Modification - c8b150f0-0164-475b-a75e-74b47800a9ff

    - Persistent Scripts in the Startup Directory - f7c4dc5a-a58d-491d-9f1'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
