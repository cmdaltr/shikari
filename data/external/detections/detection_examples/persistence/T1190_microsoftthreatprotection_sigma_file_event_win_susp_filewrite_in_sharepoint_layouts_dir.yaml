technique_id: T1190
technique_name: Suspicious File Write to SharePoint Layouts Directory
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 1f0489be-b496-4ddf-b3a9-5900f2044e9c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith:\n  - \\cmd.exe\n  - \\powershell_ise.exe\n  - \\powershell.exe\n\
  \  - \\pwsh.exe\n  - \\w3wp.exe\n  TargetFilename|contains:\n  - \\15\\TEMPLATE\\\
  LAYOUTS\\\n  - \\16\\TEMPLATE\\LAYOUTS\\\n  TargetFilename|endswith:\n  - .asax\n\
  \  - .ascx\n  - .ashx\n  - .asmx\n  - .asp\n  - .aspx\n  - .bat\n  - .cmd\n  - .cer\n\
  \  - .config\n  - .hta\n  - .js\n  - .jsp\n  - .jspx\n  - .php\n  - .ps1\n  - .vbs\n\
  \  TargetFilename|startswith:\n  - C:\\Program Files\\Common Files\\Microsoft Shared\\\
  Web Server Extensions\\\n  - C:\\Program Files (x86)\\Common Files\\Microsoft Shared\\\
  Web Server Extensions\\\n"
explanation: 'Detects suspicious file writes to SharePoint layouts directory which
  could indicate webshell activity or post-exploitation.

  This behavior has been observed in the exploitation of SharePoint vulnerabilities
  such as CVE-2025-49704, CVE-2025-49706 or CVE-2025-53770.

  '
false_positives:
- Unknown
references:
- https://unit42.paloaltonetworks.com/microsoft-sharepoint-cve-2025-49704-cve-2025-49706-cve-2025-53770/
- https://www.microsoft.com/en-us/security/blog/2025/07/22/disrupting-active-exploitation-of-on-premises-sharepoint-vulnerabilities/
tags:
- attack.initial-access
- attack.t1190
- attack.persistence
- attack.t1505.003
