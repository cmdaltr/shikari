query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter_main\n\
  filter_main:\n  Details:\n  - '%windir%\\System32\\ActXPrxy.dll'\n  - C:\\Windows\\\
  System32\\ActXPrxy.dll\nselection:\n  TargetObject|endswith: \\CLSID\\{c90250f3-4d7d-4991-9b69-a5c5bc1c2ae6}\\\
  InProcServer32\\(Default)\n"
explanation: Detects changes to the PSFactory COM InProcServer32 registry. This technique
  was used by RomCom to create persistence storing a malicious DLL.
