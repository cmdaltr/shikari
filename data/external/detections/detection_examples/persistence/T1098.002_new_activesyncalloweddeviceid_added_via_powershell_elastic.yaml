technique_id: T1098.002
technique_name: New ActiveSyncAllowedDeviceID Added via PowerShell
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name: (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\") and\
  \ process.args : \"Set-CASMailbox*ActiveSyncAllowedDeviceIDs*\""
explanation: 'Identifies the use of the Exchange PowerShell cmdlet, Set-CASMailbox,
  to add a new ActiveSync allowed device.

  Adversaries may target user email to collect sensitive information.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ce64d965-6cb0-466d-b74f-8d2c76f47f05.toml
