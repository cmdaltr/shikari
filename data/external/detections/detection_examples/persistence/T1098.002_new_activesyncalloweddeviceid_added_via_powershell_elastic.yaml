false_positives:
- description: 'False positive analysis


    - Legitimate administrative tasks may trigger the rule when IT staff use PowerShell
    to configure or update ActiveSync settings for users. To manage this, create exceptions
    for known administrative accounts or specific maintenance windows.

    - Automated scripts for device management that include the Set-CASMailbox cmdlet
    can cause false positives. Review and whitelist these scripts if they are verified
    as part of routine operations.

    - Third-party applications that integrate'
