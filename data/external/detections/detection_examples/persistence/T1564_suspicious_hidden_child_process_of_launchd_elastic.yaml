technique_id: T1564
technique_name: Suspicious Hidden Child Process of Launchd
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n process.name like~ \".*\" and process.parent.name == \"launchd\""
explanation: 'Identifies the execution of a launchd child process with a hidden file.
  An adversary can establish persistence by

  installing a new logon item, launch agent, or daemon that executes upon login.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/083fa162-e790-4d85-9aeb-4fea04188adb.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'false positive.

    - Investigate the file path and attributes of the hidden file associated with
    the child process to determine its origin and legitimacy.

    - Check the user account associated with the process initiation event to assess
    if it aligns with expected user behavior or if it indicates potential compromise.

    - Correlate the event with other recent process initiation events on the same
    host to identify any patterns or additional suspicious activities.

    - Review system logs and other security a'
  mitigation: Review investigation guide for details
references:
- https://objective-see.com/blog/blog_0x61.html
- https://www.intezer.com/blog/research/operation-electrorat-attacker-creates-fake-companies-to-drain-your-crypto-wallets/
- https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CreatingLaunchdJobs.html
has_investigation_guide: true
risk_score: 47
