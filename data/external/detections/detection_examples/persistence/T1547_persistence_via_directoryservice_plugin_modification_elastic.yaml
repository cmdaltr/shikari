technique_id: T1547
technique_name: Persistence via DirectoryService Plugin Modification
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: "file where host.os.type == \"macos\" and event.action == \"modification\"\
  \ and\n  file.path like \"/Library/DirectoryServices/PlugIns/*.dsplug\""
explanation: 'Identifies the creation or modification of a DirectoryService PlugIns
  (dsplug) file. The DirectoryService daemon

  launches on each system boot and automatically reloads after crash. It scans and
  executes bundles that are located in

  the DirectoryServices PlugIns folder and can be abused by adversaries to maintain
  persistence.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/89fa6cb7-6b53-4de2-b604-648488841ab8.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine system updates or legitimate software installations may modify dsplug
    files, triggering alerts. Users can create exceptions for known update processes
    or trusted software installations to reduce noise.

    - Administrative tasks performed by IT personnel, such as configuring directory
    services, might involve legitimate modifications to dsplug files. Implementing
    a whitelist for actions performed by verified IT accounts can help minimize false
    positives.

    - Security'
  mitigation: Review investigation guide for details
references:
- https://blog.chichou.me/2019/11/21/two-macos-persistence-tricks-abusing-plugins/
has_investigation_guide: true
risk_score: 47
