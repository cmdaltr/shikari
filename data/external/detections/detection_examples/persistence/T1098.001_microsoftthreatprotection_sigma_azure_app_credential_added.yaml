level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  properties.message:\n  - \"Update application \\u2013 Certificates and secrets\
  \ management\"\n  - Update Service principal/Update Application\n"
explanation: Detects when a new credential is added to an existing application. Any
  additional credentials added outside of expected processes could be a malicious
  actor using those credentials.
false_positives:
- When credentials are added/removed as part of the normal working hours/workflows
