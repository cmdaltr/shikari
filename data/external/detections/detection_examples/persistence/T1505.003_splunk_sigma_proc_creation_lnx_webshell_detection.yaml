technique_id: T1505.003
technique_name: Linux Webshell Indicators
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 818f7b24-0fba-4c49-a073-8b755573b9c7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_* and\
  \ sub_processes\nselection_general:\n  ParentImage|endswith:\n  - /httpd\n  - /lighttpd\n\
  \  - /nginx\n  - /apache2\n  - /node\n  - /caddy\nselection_tomcat:\n  ParentCommandLine|contains|all:\n\
  \  - /bin/java\n  - tomcat\nselection_websphere:\n  ParentCommandLine|contains|all:\n\
  \  - /bin/java\n  - websphere\nsub_processes:\n  Image|endswith:\n  - /whoami\n\
  \  - /ifconfig\n  - /ip\n  - /bin/uname\n  - /bin/cat\n  - /bin/crontab\n  - /hostname\n\
  \  - /iptables\n  - /netstat\n  - /pwd\n  - /route\n"
explanation: Detects suspicious sub processes of web server processes
false_positives:
- Web applications that invoke Linux command line tools
references:
- https://www.acunetix.com/blog/articles/web-shells-101-using-php-introduction-web-shells-part-2/
- https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_general:
    ParentImage|endswith:
    - /httpd
    - /lighttpd
    - /nginx
    - /apache2
    - /node
    - /caddy
  selection_tomcat:
    ParentCommandLine|contains|all:
    - /bin/java
    - tomcat
  selection_websphere:
    ParentCommandLine|contains|all:
    - /bin/java
    - websphere
  sub_processes:
    Image|endswith:
    - /whoami
    - /ifconfig
    - /ip
    - /bin/uname
    - /bin/cat
    - /bin/crontab
    - /hostname
    - /iptables
    - /netstat
    - /pwd
    - /route
  condition: 1 of selection_* and sub_processes
metadata:
