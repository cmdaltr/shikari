technique_id: T1574
technique_name: Persistence via TelemetryController Scheduled Task Hijack
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : \"CompatTelRunner.exe\" and process.args : \"-cv*\" and\n\
  \  not process.name : (\"conhost.exe\",\n                      \"DeviceCensus.exe\"\
  ,\n                      \"CompatTelRunner.exe\",\n                      \"DismHost.exe\"\
  ,\n                      \"rundll32.exe\",\n                      \"powershell.exe\"\
  )"
explanation: 'Detects the successful hijack of Microsoft Compatibility Appraiser scheduled
  task to establish persistence with an

  integrity level of system.'
