technique_id: T1574
technique_name: Dynamic Linker Copy
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by process.entity_id with maxspan=1m\n[process where host.os.type\
  \ == \"linux\" and event.type == \"start\" and process.name in (\"cp\", \"rsync\"\
  ) and\n   process.args in (\n     \"/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2\"\
  , \"/etc/ld.so.preload\", \"/lib64/ld-linux-x86-64.so.2\",\n     \"/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2\"\
  , \"/usr/lib64/ld-linux-x86-64.so.2\"\n    )]\n[file where host.os.type == \"linux\"\
  \ and event.action == \"creation\" and file.extension == \"so\"]"
explanation: 'Detects the copying of the Linux dynamic loader binary and subsequent
  file creation for the purpose of creating a backup

  copy. This technique was seen recently being utilized by Linux malware prior to
  patching the dynamic loader in order to

  inject and preload a malicious shared object file. This activity should never occur
  and if it does then it should be

  considered highly suspicious or malicious.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/df6f62d9-caab-4b88-affa-044f4395a1e0.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
