technique_id: T1059.003
technique_name: System Shells via Services
tactic: persistence
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.name : \"services.exe\" and\n  process.name : (\"cmd.exe\", \"\
  powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\") and\n\n  /* Third party\
  \ FP's */\n  not process.args : \"NVDisplay.ContainerLocalSystem\""
explanation: 'Windows services typically run as SYSTEM and can be used as a privilege
  escalation opportunity. Malware or penetration

  testers may run a shell as a service to gain SYSTEM permissions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0022d47d-39c7-4f69-a232-4fe9dc7a3acd.toml
query_type: eql
