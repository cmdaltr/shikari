query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details|contains: '0x00000001'\n  TargetObject|endswith: \\Outlook\\LoadMacroProviderOnBoot\n"
explanation: Detects the modification of Outlook setting "LoadMacroProviderOnBoot"
  which if enabled allows the automatic loading of any configured VBA project/module
