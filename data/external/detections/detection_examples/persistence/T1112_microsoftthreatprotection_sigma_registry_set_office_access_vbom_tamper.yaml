technique_id: T1112
technique_name: Trust Access Disable For VBApplications
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 1a5c46e9-f32f-42f7-b2bc-6e9084db7fbf
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000001)\n  TargetObject|endswith: \\Security\\AccessVBOM\n"
explanation: Detects registry changes to Microsoft Office "AccessVBOM" to a value
  of "1" which disables trust access for VBA on the victim machine and lets attackers
  execute malicious macros without any Microsoft Office warnings.
false_positives:
- Unlikely
