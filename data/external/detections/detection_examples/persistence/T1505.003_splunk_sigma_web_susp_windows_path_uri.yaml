technique_id: T1505.003
technique_name: Suspicious Windows Strings In URI
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 9f6a34b4-2688-4eb7-a7f5-e39fef573d0e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  cs-uri-query|contains:\n  - =C:/Users\n  - =C:/Program%20Files\n  - =C:/Windows\n\
  \  - =C%3A%5CUsers\n  - =C%3A%5CProgram%20Files\n  - =C%3A%5CWindows\n"
explanation: Detects suspicious Windows strings in URI which could indicate possible
  exfiltration or webshell communication
false_positives:
- Legitimate application and websites that use windows paths in their URL
references:
- https://thedfirreport.com/2022/06/06/will-the-real-msiexec-please-stand-up-exploit-leads-to-data-exfiltration/
