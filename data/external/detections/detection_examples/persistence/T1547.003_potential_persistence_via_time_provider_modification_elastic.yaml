technique_id: T1547.003
technique_name: Potential Persistence via Time Provider Modification
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.path: \"*\\\\SYSTEM\\\\*ControlSet*\\\\Services\\\\W32Time\\\\TimeProviders\\\
  \\*\" and\n  registry.data.strings:\"*.dll\" and\n  not\n  (\n    process.executable\
  \ : (\"?:\\\\Windows\\\\System32\\\\msiexec.exe\", \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\System32\\\\msiexec.exe\") and\n    registry.data.strings : \"?:\\\\\
  Program Files\\\\VMware\\\\VMware Tools\\\\vmwTimeProvider\\\\vmwTimeProvider.dll\"\
  \n  ) and\n  not registry.data.strings : \"C:\\\\Windows\\\\SYSTEM32\\\\w32time.DLL\""
explanation: 'Identifies modification of the Time Provider. Adversaries may establish
  persistence by registering and enabling a

  malicious DLL as a time provider. Windows uses the time provider architecture to
  obtain accurate time stamps from other

  network devices or clients in the network. Time providers are implemented in the
  form of a DLL file which resides in the

  System32 folder. The service W32Time initiates during the startup of Windows and
  loads w32time.dll.'
