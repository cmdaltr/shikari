technique_id: T1574.011
technique_name: Abuse of Service Permissions to Hide Services Via Set-Service - PS
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.81
validated: true
source: sigma
sigma_id: 953945c5-22fe-4a92-9f8a-a9edc1e522da
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ScriptBlockText|contains:\n  - '-SecurityDescriptorSddl '\n  - '-sd '\n  ScriptBlockText|contains|all:\n\
  \  - 'Set-Service '\n  - DCLCWPDTSD\n"
explanation: Detects usage of the "Set-Service" powershell cmdlet to configure a new
  SecurityDescriptor that allows a service to be hidden from other utilities such
  as "sc.exe", "Get-Service"...etc. (Works only in powershell 7)
false_positives:
- Rare intended use of hidden services
- Rare FP could occur due to the non linearity of the ScriptBlockText log
references:
- https://twitter.com/Alh4zr3d/status/1580925761996828672
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/set-service?view=powershell-7.2
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.011
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'Set-Service '
    - DCLCWPDTSD
    ScriptBlockText|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  condition: selection
