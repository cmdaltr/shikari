logsource:
  category: process_creation
  product: windows
detection:
  selection_origin:
  - Image|endswith: \w3wp.exe
  - ParentImage|endswith: \w3wp.exe
  selection_cmdline:
    CommandLine|contains:
    - '&ipconfig&echo'
    - '&quser&echo'
    - '&whoami&echo'
    - '&c:&echo'
    - '&cd&echo'
    - '&dir&echo'
    - '&echo [E]'
    - '&echo [S]'
  condition: all of selection_*
