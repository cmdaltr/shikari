technique_id: T1505.003
technique_name: Chopper Webshell Process Pattern
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cmdline:\n  CommandLine|contains:\n  - '&ipconfig&echo'\n  - '&quser&echo'\n\
  \  - '&whoami&echo'\n  - '&c:&echo'\n  - '&cd&echo'\n  - '&dir&echo'\n  - '&echo\
  \ [E]'\n  - '&echo [S]'\nselection_origin:\n- Image|endswith: \\w3wp.exe\n- ParentImage|endswith:\
  \ \\w3wp.exe\n"
explanation: Detects patterns found in process executions cause by China Chopper like
  tiny (ASPX) webshells
false_positives:
- Unknown
references:
- https://www.microsoft.com/security/blog/2022/09/30/analyzing-attacks-using-the-exchange-vulnerabilities-cve-2022-41040-and-cve-2022-41082/
