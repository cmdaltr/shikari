technique_id: T1546.011
technique_name: Suspicious Shim Database Patching Activity
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: bf344fea-d947-4ef4-9192-34d008315d3a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetObject|contains: \\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\\
  Custom\\\n  TargetObject|endswith:\n  - \\csrss.exe\n  - \\dllhost.exe\n  - \\explorer.exe\n\
  \  - \\RuntimeBroker.exe\n  - \\services.exe\n  - \\sihost.exe\n  - \\svchost.exe\n\
  \  - \\taskhostw.exe\n  - \\winlogon.exe\n  - \\WmiPrvSe.exe\n"
explanation: Detects installation of new shim databases that try to patch sections
  of known processes for potential process injection or persistence.
false_positives:
- Unknown
references:
- https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/pillowmint-fin7s-monkey-thief/
- https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html
tags:
