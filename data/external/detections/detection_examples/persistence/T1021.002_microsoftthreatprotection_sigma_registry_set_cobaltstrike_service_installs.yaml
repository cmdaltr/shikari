technique_id: T1021.002
technique_name: Potential CobaltStrike Service Installations - Registry
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 61a7697c-cb79-42a8-a2ff-5f0cdfae0130
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_details:\n- Details|contains|all:\n  - ADMIN$\n  - .exe\n- Details|contains|all:\n\
  \  - '%COMSPEC%'\n  - start\n  - powershell\nselection_key:\n- TargetObject|contains:\
  \ \\System\\CurrentControlSet\\Services\n- TargetObject|contains|all:\n  - \\System\\\
  ControlSet\n  - \\Services\n"
explanation: 'Detects known malicious service installs that appear in cases in which
  a Cobalt Strike beacon elevates privileges or lateral movement.

  '
false_positives:
- Unlikely
references:
- https://www.sans.org/webcasts/tech-tuesday-workshop-cobalt-strike-detection-log-analysis-119395
tags:
- attack.persistence
- attack.execution
- attack.privilege-escalation
- attack.lateral-movement
- attack.t1021.002
- attack.t1543.003
- attack.t1569.002
logsource:
  category: registry_set
  product: windows
detection:
  selection_key:
  - TargetObject|contains: \System\CurrentControlSet\Services
  - TargetObject|contains|all:
    - \System\ControlSet
    - \Services
  selection_details:
  - Details|contains|all:
    - ADMIN$
    - .exe
  - Details|contains|all:
    - '%COMSPEC%'
    - start
    - powershell
  condition: all of selection_*
