query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: not system_utility and\
  \ parent_is_settingsynchost\nparent_is_settingsynchost:\n  ParentCommandLine|contains|all:\n\
  \  - cmd.exe /c\n  - RoamDiag.cmd\n  - -outputpath\nsystem_utility:\n  Image|startswith:\n\
  \  - C:\\Windows\\System32\\\n  - C:\\Windows\\SysWOW64\\\n"
explanation: Detects using SettingSyncHost.exe to run hijacked binary
false_positives:
- Unknown
