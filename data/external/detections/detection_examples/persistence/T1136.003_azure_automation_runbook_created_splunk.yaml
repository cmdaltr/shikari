technique_id: T1136.003
technique_name: Azure Automation Runbook Created
tactic: persistence
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_audit` operationName.value="Microsoft.Automation/automationAccounts/runbooks/write"
  object!=AzureAutomationTutorial* status.value=Succeeded | dedup object | rename
  claims.ipaddr as src, subscriptionId as vendor_account, operationName.value as operationName
  | stats count min(_time) as firstTime max(_time) as lastTime by dest user src vendor_account
  vendor_product object object_path | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `azure_automation_runbook_created_filter`'
explanation: The following analytic detects the creation of a new Azure Automation
  Runbook within an Azure tenant. It leverages Azure Audit events, specifically the
  Azure Activity log category, to identify when a new Runbook is created or updated.
  This activity is significant because adversaries with privileged access can use
  Runbooks to maintain persistence, escalate privileges, or execute malicious code.
  If confirmed malicious, this could lead to unauthorized actions such as creating
  Global Administrators, executing code on VMs, and compromising the entire Azure
  environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/178d696d-6dc6-4ee8-9d25-93fee34eaf5b/
indicators:
- type: data_source
  value: Azure Audit Create or Update an Azure Automation Runbook
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Administrators may legitimately create Azure Automation Runbooks. Filter
    as needed.
  mitigation: Review context and user activity
