technique_id: T1543.003
technique_name: Allow Service Access Using Security Descriptor Tampering Via Sc.EXE
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 6c8fbee5-dee8-49bc-851d-c3142d02aa47
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_optional_*\nfilter_optional_hexnode:\n  ParentImage: C:\\Hexnode\\\
  Hexnode Agent\\Current\\HexnodeAgent.exe\nselection_sc:\n- Image|endswith: \\sc.exe\n\
  - OriginalFileName: sc.exe\nselection_sdset:\n  CommandLine|contains|all:\n  - sdset\n\
  \  - A;\nselection_trustee:\n  CommandLine|contains:\n  - ;IU\n  - ;SU\n  - ;BA\n\
  \  - ;SY\n  - ;WD\n"
explanation: Detects suspicious DACL modifications to allow access to a service from
  a suspicious trustee. This can be used to override access restrictions set by previous
  ACLs.
false_positives:
- Unknown
references:
- https://twitter.com/0gtweet/status/1628720819537936386
- https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
- https://learn.microsoft.com/en-us/windows/win32/secauthz/sid-strings
tags:
- attack.privilege-escalation
