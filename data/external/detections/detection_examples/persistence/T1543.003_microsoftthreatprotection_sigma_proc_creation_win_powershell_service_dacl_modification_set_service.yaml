technique_id: T1543.003
technique_name: Suspicious Service DACL Modification Via Set-Service Cmdlet
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: a95b9b42-1308-4735-a1af-abb1c5e6f5ac
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_img:\n- Image|endswith: \\pwsh.exe\n- OriginalFileName: pwsh.dll\nselection_sddl_flag:\n\
  \  CommandLine|contains:\n  - '-SecurityDescriptorSddl '\n  - '-sd '\nselection_set_service:\n\
  \  CommandLine|contains:\n  - ;;;IU\n  - ;;;SU\n  - ;;;BA\n  - ;;;SY\n  - ;;;WD\n\
  \  CommandLine|contains|all:\n  - 'Set-Service '\n  - D;;\n"
explanation: Detects suspicious DACL modifications via the "Set-Service" cmdlet using
  the "SecurityDescriptorSddl" flag (Only available with PowerShell 7) that can be
  used to hide services or make them unstopable
false_positives:
- Unknown
references:
- https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
- https://learn.microsoft.com/pt-br/windows/win32/secauthz/sid-strings
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \pwsh.exe
  - OriginalFileName: pwsh.dll
  selection_sddl_flag:
    CommandLine|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  selection_set_service:
    CommandLine|contains|all:
    - 'Set-Service '
    - D;;
    CommandLine|contains:
    - ;;;IU
    - ;;;SU
    - ;;;BA
    - ;;;SY
    - ;;;WD
  condition: all of selection_*
