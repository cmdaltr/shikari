technique_id: T1556
technique_name: Github High Risk Configuration Disabled
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 8622c92d-c00e-463c-b09d-fd06166f6794
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  action:\n  - business_advanced_security.disabled_for_new_repos\n  - business_advanced_security.disabled_for_new_user_namespace_repos\n\
  \  - business_advanced_security.disabled\n  - business_advanced_security.user_namespace_repos_disabled\n\
  \  - org.advanced_security_disabled_for_new_repos\n  - org.advanced_security_disabled_on_all_repos\n\
  \  - org.advanced_security_policy_selected_member_disabled\n  - org.disable_oauth_app_restrictions\n\
  \  - org.disable_two_factor_requirement\n  - repo.advanced_security_disabled\n"
explanation: Detects when a user disables a critical security feature for an organization.
false_positives:
- Approved administrator/owner activities.
references:
- https://docs.github.com/en/organizations/managing-oauth-access-to-your-organizations-data/disabling-oauth-app-access-restrictions-for-your-organization
- https://docs.github.com/en/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/reviewing-the-audit-log-for-your-organization#dependabot_alerts-category-actions
- https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-security-and-analysis-settings-for-your-repository
- https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
tags:
- attack.credential-access
- attack.defense-evasion
- attack.persistence
- attack.t1556
logsource:
  product: github
  service: audit
  definition: 'Requirements: The audit log streaming feature must be enabled to be
    able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
  selection:
    action:
    - business_advanced_security.disabled_for_new_repos
    - business_advanced_security.disabled_for_new_user_namespace_repos
    - business_advanced_security.disabled
    - business_advanced_security.user_namespace_repos_disabled
    - org.advanced_security_disabled_for_new_repos
    - org.advanced_security_disabled_on_all_repos
    - org.advanced_security_policy_selected_member_disabled
    - org.disable_oauth_app_restrictions
    - org.disable_two_factor_requirement
    - repo.advanced_security_disabled
  condition: selection
