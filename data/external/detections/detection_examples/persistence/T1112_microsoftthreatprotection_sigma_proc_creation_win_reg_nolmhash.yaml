technique_id: T1112
technique_name: Enable LM Hash Storage - ProcCreation
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 98dedfdd-8333-49d4-9f23-d7018cccae53
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - \\System\\CurrentControlSet\\Control\\Lsa\n  -\
  \ NoLMHash\n  - ' 0'\n"
explanation: 'Detects changes to the "NoLMHash" registry value in order to allow Windows
  to store LM Hashes.

  By setting this registry value to "0" (DWORD), Windows will be allowed to store
  a LAN manager hash of your password in Active Directory and local SAM databases.

  '
false_positives:
- Unknown
references:
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
- https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/prevent-windows-store-lm-hash-password
- https://www.sans.org/blog/protecting-privileged-domain-accounts-lm-hashes-the-good-the-bad-and-the-ugly/
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains|all:
    - \System\CurrentControlSet\Control\Lsa
    - NoLMHash
    - ' 0'
  condition: selection
