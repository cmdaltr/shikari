technique_id: T1574.011
technique_name: Service DACL Abuse To Hide Services Via Sc.EXE
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: a537cfc3-4297-4789-92b5-345bfd845ad0
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - sdset\n  - DCLCWPDTSD\nselection_img:\n\
  - Image|endswith: \\sc.exe\n- OriginalFileName: sc.exe\n"
explanation: Detects usage of the "sc.exe" utility adding a new service with special
  permission seen used by threat actors which makes the service hidden and unremovable.
false_positives:
- Unknown
