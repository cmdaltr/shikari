technique_id: T1543.003
technique_name: Suspicious Service was Installed in the System
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "any where\n  (event.code : \"4697\" and\n   (winlog.event_data.ServiceFileName\
  \ : \n           (\"*COMSPEC*\", \"*\\\\127.0.0.1*\", \"*Admin$*\", \"*powershell*\"\
  , \"*rundll32*\", \"*cmd.exe*\", \"*PSEXESVC*\", \n            \"*echo*\", \"*RemComSvc*\"\
  , \"*.bat*\", \"*.cmd*\", \"*certutil*\", \"*vssadmin*\", \"*certmgr*\", \"*bitsadmin*\"\
  , \n            \"*\\\\Users\\\\*\", \"*\\\\Windows\\\\Temp\\\\*\", \"*\\\\Windows\\\
  \\Tasks\\\\*\", \"*\\\\PerfLogs\\\\*\", \"*\\\\Windows\\\\Debug\\\\*\",\n      \
  \      \"*regsvr32*\", \"*msbuild*\") or\n   winlog.event_data.ServiceFileName regex~\
  \ \"\"\"%systemroot%\\\\[a-z0-9]+\\.exe\"\"\")) or\n\n  (event.code : \"7045\" and\n\
  \   winlog.event_data.ImagePath : (\n       \"*COMSPEC*\", \"*\\\\127.0.0.1*\",\
  \ \"*Admin$*\", \"*powershell*\", \"*rundll32*\", \"*cmd.exe*\", \"*PSEXESVC*\"\
  ,\n       \"*echo*\", \"*RemComSvc*\", \"*.bat*\", \"*.cmd*\", \"*certutil*\", \"\
  *vssadmin*\", \"*certmgr*\", \"*bitsadmin*\",\n       \"*\\\\Users\\\\*\", \"*\\\
  \\Windows\\\\Temp\\\\*\", \"*\\\\Windows\\\\Tasks\\\\*\", \"*\\\\PerfLogs\\\\*\"\
  , \"*\\\\Windows\\\\Debug\\\\*\",\n       \"*regsvr32*\", \"*msbuild*\"))"
explanation: 'Identifies the creation of a new Windows service with suspicious Service
  command values. Windows services typically run

  as SYSTEM and can be used for privilege escalation and persistence.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/da87eee1-129c-4661-a7aa-57d0b9645fad.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: data_source
  value: Windows System Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Certain services such as PSEXECSVC may happen legitimately. The security team
    should address any potential benign true positive (B-TP) by excluding the relevant
    FP by pattern.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - Investigate credential exposure on systems compromised or used by the attacker
    to ensure all compromised accounts'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
