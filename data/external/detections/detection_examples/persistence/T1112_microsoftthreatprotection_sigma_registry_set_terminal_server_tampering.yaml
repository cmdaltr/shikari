technique_id: T1112
technique_name: RDP Sensitive Settings Changed
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_shadow or selection_terminal_services_key\
  \ or selection_tamper_only\nselection_shadow:\n  Details:\n  - DWORD (0x00000001)\n\
  \  - DWORD (0x00000002)\n  - DWORD (0x00000003)\n  - DWORD (0x00000004)\n  TargetObject|contains:\n\
  \  - \\Control\\Terminal Server\\\n  - \\Windows NT\\Terminal Services\\\n  TargetObject|endswith:\
  \ \\Shadow\nselection_tamper_only:\n  TargetObject|contains:\n  - \\Control\\Terminal\
  \ Server\\InitialProgram\n  - \\Control\\Terminal Server\\WinStations\\RDP-Tcp\\\
  InitialProgram\n  - \\services\\TermService\\Parameters\\ServiceDll\n  - \\Windows\
  \ NT\\Terminal Services\\InitialProgram\nselection_terminal_services_key:\n  Details:\
  \ DWORD (0x00000001)\n  TargetObject|contains:\n  - \\Control\\Terminal Server\\\
  \n  - \\Windows NT\\Terminal Services\\\n  TargetObject|endswith:\n  - \\DisableRemoteDesktopAntiAlias\n\
  \  - \\DisableSecuritySettings\n  - \\fAllowUnsolicited\n  - \\fAllowUnsolicitedFullControl\n"
explanation: 'Detects tampering of RDP Terminal Service/Server sensitive settings.

  Such as allowing unauthorized users access to a system via the ''fAllowUnsolicited''
  or enabling RDP via ''fDenyTSConnections''...etc

  '
false_positives:
- Some of the keys mentioned here could be modified by an administrator while setting
  group policy (it should be investigated either way)
