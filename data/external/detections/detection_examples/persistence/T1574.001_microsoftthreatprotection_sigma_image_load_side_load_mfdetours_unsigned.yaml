level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_legit_path:\n  ImageLoaded|contains: :\\Program Files\
  \ (x86)\\Windows Kits\\10\\bin\\\n  SignatureStatus: Valid\nselection:\n  ImageLoaded|endswith:\
  \ \\mfdetours.dll\n"
explanation: Detects DLL sideloading of unsigned "mfdetours.dll". Executing "mftrace.exe"
  can be abused to attach to an arbitrary process and force load any DLL named "mfdetours.dll"
  from the current directory of execution.
