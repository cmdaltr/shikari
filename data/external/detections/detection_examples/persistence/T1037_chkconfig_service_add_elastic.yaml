technique_id: T1037
technique_name: Chkconfig Service Add
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.action in (\"exec\", \"\
  exec_event\", \"start\") and\n( \n  (process.executable : \"/usr/sbin/chkconfig\"\
  \ and process.args : \"--add\") or\n  (process.args : \"*chkconfig\" and process.args\
  \ : \"--add\")\n) and not (\n  process.parent.name in (\"rpm\", \"qualys-scan-util\"\
  , \"qualys-cloud-agent\", \"update-alternatives\") or\n  process.parent.args : (\"\
  /var/tmp/rpm*\", \"/var/lib/waagent/*\") or\n  process.args in (\"jexec\", \"sapinit\"\
  , \"httpd\", \"dbora\")\n)"
explanation: 'Detects the use of the chkconfig binary to manually add a service for
  management by chkconfig. Threat actors may utilize

  this technique to maintain persistence on a system. When a new service is added,
  chkconfig ensures that the service has

  either a start or a kill entry in every runlevel and when the system is rebooted
  the service file added will run

  providing long-term persistence.'
source: Elastic Detection Rules
