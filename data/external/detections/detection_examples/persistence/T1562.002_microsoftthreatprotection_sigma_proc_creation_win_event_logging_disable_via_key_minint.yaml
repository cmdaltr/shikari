technique_id: T1562.002
technique_name: Security Event Logging Disabled via MiniNt Registry Key - Process
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 1a4bd6af-99ac-4466-b5b2-7b72b4a05462
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_reg_*\
  \ or all of selection_powershell_*\nselection_powershell_cmd1:\n  CommandLine|contains:\n\
  \  - 'New-Item '\n  - 'ni '\nselection_powershell_cmd2:\n  CommandLine|contains:\
  \ \\SYSTEM\\CurrentControlSet\\Control\\MiniNt\nselection_powershell_img:\n- Image|endswith:\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n  - \\powershell_ise.exe\n- OriginalFileName:\n\
  \  - PowerShell.EXE\n  - pwsh.dll\nselection_reg_cmd:\n  CommandLine|contains|all:\n\
  \  - ' add '\n  - \\SYSTEM\\CurrentControlSet\\Control\\MiniNt\nselection_reg_img:\n\
  - Image|endswith: \\reg.exe\n- OriginalFileName: reg.exe\n"
explanation: 'Detects attempts to disable security event logging by adding the `MiniNt`
  registry key.

  This key is used to disable the Windows Event Log service, which collects and stores
  event logs from the operating system and applications.

  Adversaries may want to disable this service to prevent logging of security events
  that could be used to detect their activities.

  '
false_positives:
- Highly Unlikely
references:
- https://www.hackingarticles.in/defense-evasion-windows-event-logging-t1562-002/
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1562.002
- attack.t1112
- car.2022-03-001
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_img:
  - Image|endswith: \reg.exe
  - OriginalFileName: reg.exe
  selection_reg_cmd:
    CommandLine|contains|all:
    - ' add '
    - \SYSTEM\CurrentControlSet\Control\MiniNt
  selection_powershell_img:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \powershell_ise.exe
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  selection_powershell_cmd1:
    CommandLine|contains:
    - 'New-Item '
    - 'ni '
  selection_powershell_cmd2:
    CommandLine|contains: \SYSTEM\CurrentControlSet\Control\MiniNt
  condition: all of selection_reg_* or all of selection_powershell_*
