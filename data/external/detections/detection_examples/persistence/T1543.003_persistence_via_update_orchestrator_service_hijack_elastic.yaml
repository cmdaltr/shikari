technique_id: T1543.003
technique_name: Persistence via Update Orchestrator Service Hijack
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.executable : \"C:\\\\Windows\\\\System32\\\\svchost.exe\" and\n\
  \  process.parent.args : \"UsoSvc\" and\n  not process.executable :\n          (\"\
  ?:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\UUS\\\\Packages\\\\*\\\\amd64\\\\MoUsoCoreWorker.exe\"\
  ,\n          \"?:\\\\Windows\\\\System32\\\\UsoClient.exe\",\n          \"?:\\\\\
  Windows\\\\System32\\\\MusNotification.exe\",\n          \"?:\\\\Windows\\\\System32\\\
  \\MusNotificationUx.exe\",\n          \"?:\\\\Windows\\\\System32\\\\MusNotifyIcon.exe\"\
  ,\n          \"?:\\\\Windows\\\\System32\\\\WerFault.exe\",\n          \"?:\\\\\
  Windows\\\\System32\\\\WerMgr.exe\",\n          \"?:\\\\Windows\\\\UUS\\\\amd64\\\
  \\MoUsoCoreWorker.exe\",\n          \"?:\\\\Windows\\\\System32\\\\MoUsoCoreWorker.exe\"\
  ,\n          \"?:\\\\Windows\\\\UUS\\\\amd64\\\\UsoCoreWorker.exe\",\n         \
  \ \"?:\\\\Windows\\\\System32\\\\UsoCoreWorker.exe\",\n          \"?:\\\\Program\
  \ Files\\\\Common Files\\\\microsoft shared\\\\ClickToRun\\\\OfficeC2RClient.exe\"\
  ) and\n  not process.name : (\"MoUsoCoreWorker.exe\", \"OfficeC2RClient.exe\")"
explanation: 'Identifies potential hijacking of the Microsoft Update Orchestrator
  Service to establish persistence with an integrity

  level of SYSTEM.'
source: Elastic Detection Rules
