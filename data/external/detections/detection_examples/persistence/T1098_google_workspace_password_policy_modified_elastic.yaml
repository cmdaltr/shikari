technique_id: T1098
technique_name: Google Workspace Password Policy Modified
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset:google_workspace.admin and event.provider:admin and event.category:iam\
  \ and\n  event.action:(CHANGE_APPLICATION_SETTING or CREATE_APPLICATION_SETTING)\
  \ and\n  google_workspace.admin.setting.name:(\n    \"Password Management - Enforce\
  \ strong password\" or\n    \"Password Management - Password reset frequency\" or\n\
  \    \"Password Management - Enable password reuse\" or\n    \"Password Management\
  \ - Enforce password policy at next login\" or\n    \"Password Management - Minimum\
  \ password length\" or\n    \"Password Management - Maximum password length\"\n\
  \  )"
explanation: 'Detects when a Google Workspace password policy is modified. An adversary
  may attempt to modify a password policy in

  order to weaken an organization’s security controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a99f82f5-8e77-4f8b-b3ce-10c0f6afbc73.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Google Workspace
  confidence: high
false_positives:
- description: 'False positive analysis


    - After identifying the user account that updated the password policy, verify
    whether the action was intentional.

    - Verify whether the user should have administrative privileges in Google Workspace
    to modify password policies.

    - Review organizational units or groups the role may have been added to and ensure
    the new privileges align properly.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Consider resetting p'
  mitigation: Review investigation guide for details
references:
- https://support.google.com/a/answer/7061566
- https://www.elastic.co/security-labs/google-workspace-attack-surface-part-one
- https://www.elastic.co/security-labs/google-workspace-attack-surface-part-two
has_investigation_guide: true
risk_score: 47
