query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_port:\n  Details: DWORD (0x00000d3d)\nselection:\n\
  \  TargetObject|endswith: \\Control\\Terminal Server\\WinStations\\RDP-Tcp\\PortNumber\n"
explanation: 'Detects changes to the default RDP port.

  Remote desktop is a common feature in operating systems. It allows a user to log
  into a remote system using an interactive session with a graphical user interface.

  Microsoft refers to its implementation of the Remote Desktop Protocol (RDP) as Remote
  Desktop Services (RDS).

  '
