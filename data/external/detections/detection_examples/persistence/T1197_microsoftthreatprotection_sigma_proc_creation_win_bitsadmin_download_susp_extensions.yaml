technique_id: T1197
technique_name: File With Suspicious Extension Downloaded Via Bitsadmin
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 5b80a791-ad9b-4b75-bcc1-ad4e1e89c200
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_extension:\n  CommandLine|contains:\n  - .7z\n  - .asax\n  - .ashx\n \
  \ - .asmx\n  - .asp\n  - .aspx\n  - .bat\n  - .cfm\n  - .cgi\n  - .chm\n  - .cmd\n\
  \  - .dll\n  - .gif\n  - .jpeg\n  - .jpg\n  - .jsp\n  - .jspx\n  - .log\n  - .png\n\
  \  - .ps1\n  - .psm1\n  - .rar\n  - .scf\n  - .sct\n  - .txt\n  - .vbe\n  - .vbs\n\
  \  - .war\n  - .wsf\n  - .wsh\n  - .xll\n  - .zip\nselection_flags:\n  CommandLine|contains:\n\
  \  - ' /transfer '\n  - ' /create '\n  - ' /addfile '\nselection_img:\n- Image|endswith:\
  \ \\bitsadmin.exe\n- OriginalFileName: bitsadmin.exe\n"
explanation: Detects usage of bitsadmin downloading a file with a suspicious extension
false_positives:
- Unknown
references:
- https://blog.netspi.com/15-ways-to-download-a-file/#bitsadmin
- https://isc.sans.edu/diary/22264
- https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
tags:
- attack.defense-evasion
- attack.persistence
