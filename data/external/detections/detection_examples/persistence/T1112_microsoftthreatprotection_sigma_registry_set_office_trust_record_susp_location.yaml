level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_paths:\n  TargetObject|contains:\n  - /AppData/Local/Microsoft/Windows/INetCache/\n\
  \  - /AppData/Local/Temp/\n  - /PerfLogs/\n  - C:/Users/Public/\n  - file:///D:/\n\
  \  - file:///E:/\nselection_value:\n  TargetObject|contains: \\Security\\Trusted\
  \ Documents\\TrustRecords\n"
explanation: Detects registry changes to Office trust records where the path is located
  in a potentially suspicious location
false_positives:
- Unlikely
