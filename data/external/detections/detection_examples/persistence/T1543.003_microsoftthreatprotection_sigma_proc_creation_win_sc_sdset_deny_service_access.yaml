technique_id: T1543.003
technique_name: Deny Service Access Using Security Descriptor Tampering Via Sc.EXE
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 99cf1e02-00fb-4c0d-8375-563f978dfd37
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_sc:\n- Image|endswith: \\sc.exe\n- OriginalFileName: sc.exe\nselection_sdset:\n\
  \  CommandLine|contains|all:\n  - sdset\n  - D;\nselection_trustee:\n  CommandLine|contains:\n\
  \  - ;IU\n  - ;SU\n  - ;BA\n  - ;SY\n  - ;WD\n"
explanation: Detects suspicious DACL modifications to deny access to a service that
  affects critical trustees. This can be used to hide services or make them unstoppable.
false_positives:
- Unknown
references:
- https://www.sans.org/blog/red-team-tactics-hiding-windows-services/
- https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
- https://learn.microsoft.com/en-us/windows/win32/secauthz/sid-strings
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
  - Image|endswith: \sc.exe
  - OriginalFileName: sc.exe
  selection_sdset:
    CommandLine|contains|all:
    - sdset
    - D;
  selection_trustee:
    CommandLine|contains:
    - ;IU
    - ;SU
    - ;BA
    - ;SY
    - ;WD
  condition: all of selection_*
