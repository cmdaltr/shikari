technique_id: T1053
technique_name: Temporarily Scheduled Task Creation
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by winlog.computer_name, winlog.event_data.TaskName with maxspan=5m\n\
  \   [iam where event.action == \"scheduled-task-created\" and not user.name : \"\
  *$\"]\n   [iam where event.action == \"scheduled-task-deleted\" and not user.name\
  \ : \"*$\"]"
explanation: 'Indicates the creation and deletion of a scheduled task within a short
  time interval. Adversaries can use these to proxy

  malicious execution via the schedule service and perform clean up.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/81ff45f8-f8c2-4e28-992e-5a0e8d98e0fe.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks may trigger the rule if system administrators frequently
    create and delete scheduled tasks for maintenance purposes. To manage this, create
    exceptions for known administrative accounts or specific task names that are part
    of regular operations.

    - Automated scripts or software updates that temporarily create scheduled tasks
    can also cause false positives. Identify these scripts or update processes and
    exclude their associated user accounts o'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4698
has_investigation_guide: true
risk_score: 47
