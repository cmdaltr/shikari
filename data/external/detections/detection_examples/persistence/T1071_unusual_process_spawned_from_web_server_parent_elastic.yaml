  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Processes related to legitimate web server maintenance tasks may trigger alerts.
    Review scheduled tasks or cron jobs that align with the alert timing and consider
    excluding these specific processes if they are verified as non-threatening.

    - Development environments often spawn processes that mimic attack patterns. Identify
    and exclude processes originating from known development directories or executed
    by development user accounts.

    - Automated scripts or monitoring too'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
