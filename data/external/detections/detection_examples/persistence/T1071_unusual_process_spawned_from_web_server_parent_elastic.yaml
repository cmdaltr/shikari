technique_id: T1071
technique_name: Unusual Process Spawned from Web Server Parent
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "from logs-endpoint.events.process-*\n| keep\n    @timestamp,\n    host.os.type,\n\
  \    event.type,\n    event.action,\n    process.parent.name,\n    user.name,\n\
  \    user.id,\n    process.working_directory,\n    process.name,\n    process.executable,\n\
  \    process.command_line,\n    process.parent.executable,\n    agent.id,\n    host.name\n\
  | where\n    @timestamp > now() - 1 hours and\n    host.os.type == \"linux\" and\n\
  \    event.type == \"start\" and\n    event.action == \"exec\" and (\n      (\n\
  \        process.parent.name in (\n            \"apache\", \"nginx\", \"apache2\"\
  , \"httpd\", \"lighttpd\", \"caddy\", \"node\", \"mongrel_rails\", \"java\", \"\
  gunicorn\",\n            \"uwsgi\", \"openresty\", \"cherokee\", \"h2o\", \"resin\"\
  , \"puma\", \"unicorn\", \"traefik\", \"tornado\", \"hypercorn\",\n            \"\
  daphne\", \"twistd\", \"yaws\", \"webfsd\", \"httpd.worker\", \"flask\", \"rails\"\
  , \"mongrel\"\n        ) or\n        user.name in (\n            \"apache\", \"\
  www-data\", \"httpd\", \"nginx\", \"lighttpd\", \"tomcat\", \"tomcat8\", \"tomcat9\"\
  , \"ftp\", \"ftpuser\", \"ftpd\"\n        ) or\n        user.id in (\"99\", \"33\"\
  , \"498\", \"48\") or\n        process.working_directory like \"/var/www/*\"\n \
  \     ) or\n      (\n        (\n          process.parent.name like \"php-*\" or\n\
  \          process.parent.name like \"python*\" or\n          process.parent.name\
  \ like \"ruby*\" or\n          process.parent.name like \"perl*\"\n        ) and\
  \ (\n          process.working_directory like \"/var/www/*\" or\n          process.working_directory\
  \ like \"/srv/www/*\" or\n          process.working_directory like \"/usr/share/nginx/*\"\
  \n        )\n      )\n    ) and (\n        process.name in (\n          \"bash\"\
  , \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\", \"socat\", \"\
  openssl\", \"busybox\",\n          \"nc\", \"ncat\", \"netcat\", \"nc.openbsd\"\
  , \"nc.traditional\", \"nohup\", \"setsid\", \"mkfifo\", \"mknod\",\n          \"\
  node\", \"socket\"\n        ) or\n        process.name like \"python*\" or\n   \
  \     process.name like \"php*\" or\n        process.name like \"perl\" or\n   \
  \     process.name like \"ruby*\" or\n        process.name like \"lua*\" or\n  \
  \      process.executable like \"/tmp/*\" or\n        process.executable like \"\
  /var/tmp/*\" or\n        process.executable like \"/dev/shm/*\" or\n        process.executable\
  \ like \"/var/log/*\" or\n        process.executable like \"/sys/*\" or\n      \
  \  process.executable like \"/media/*\" or\n        process.executable like \"/proc/*\"\
  \ or\n        process.executable like \"/var/backups/*\" or\n        process.executable\
  \ like \"/var/mail/*\" or\n        process.executable like \"/var/spool/*\" or\n\
  \        process.executable like \"/var/www/*\" or\n        process.executable like\
  \ \"./*\" or\n        process.name like \".*\"\n    ) and    \n    not (\n     \
  \   process.working_directory like \"/home/*\" or\n        process.working_directory\
  \ == \"/\" or\n        process.working_directory like \"/var/www/*.ch\" or\n   \
  \     process.parent.executable like \"/vscode/vscode-server/*\"\n    )\n| stats\n\
  \    Esql.event_count = count(),\n    Esql.agent_id_count_distinct = count_distinct(agent.id),\n\
  \    Esql.host_name_values = values(host.name),\n    Esql.agent_id_values = values(agent.id)\n\
  \  by process.executable, process.working_directory, process.parent.executable\n\
  | where\n    Esql.agent_id_count_distinct == 1 and\n    Esql.event_count < 5\n|\
  \ sort Esql.event_count asc\n| limit 100"
explanation: 'This rule detects unusual processes spawned from a web server parent
  process by identifying low frequency counts of

  process spawning activity. Unusual process spawning activity may indicate an attacker
  attempting to establish

  persistence, execute malicious commands, or establish command and control channels
  on the host system. ESQL rules have

  limited fields available in its alert documents. Make sure to review the original
  documents to aid in the investigation

  of this alert.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/976b2391-413f-4a94-acb4-7911f3803346.toml
query_type: esql
query_language: esql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
