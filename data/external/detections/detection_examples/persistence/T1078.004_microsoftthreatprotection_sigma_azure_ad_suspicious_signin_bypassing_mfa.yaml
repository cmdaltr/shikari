fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 53bb4f7f-48a8-4475-ac30-5a82ddfdf6fc
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Status: Success\n  userAgent|contains:\n  - BAV2ROPC\n  - CBAinPROD\n  - CBAinTAR\n"
explanation: Detects successful authentication from potential clients using legacy
  authentication via user agent strings. This could be a sign of MFA bypass using
  a password spray attack.
false_positives:
- Known Legacy Accounts
