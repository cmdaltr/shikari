technique_id: T1546.011
technique_name: Potential Persistence Via Shim Database In Uncommon Location
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 6b6976a3-b0e6-4723-ac24-ae38a737af41
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_known_locations:\n  Details|contains: :\\Windows\\\
  AppPatch\\Custom\nselection:\n  TargetObject|contains|all:\n  - \\SOFTWARE\\Microsoft\\\
  Windows NT\\CurrentVersion\\AppCompatFlags\\InstalledSDB\\\n  - \\DatabasePath\n"
explanation: Detects the installation of a new shim database where the file is located
  in a non-default location
false_positives:
- Unknown
references:
- https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html
- https://andreafortuna.org/2018/11/12/process-injection-and-persistence-using-application-shimming/
- https://www.blackhat.com/docs/asia-14/materials/Erickson/Asia-14-Erickson-Persist-It-Using-And-Abusing-Microsofts-Fix-It-Patches.pdf
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.011
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - \SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\
    - \DatabasePath
  filter_main_known_locations:
    Details|contains: :\Windows\AppPatch\Custom
  condition: selection and not 1 of filter_main_*
