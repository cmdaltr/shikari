query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n- CommandLine|contains|all:\n  - 'reg '\n  - add\n- CommandLine|contains:\n\
  \  - powershell\n  - set-itemproperty\n  - ' sp '\n  - new-itemproperty\nselection_data:\n\
  \  CommandLine|contains:\n  - ImagePath\n  - FailureCommand\n  - ServiceDLL\n  CommandLine|contains|all:\n\
  \  - ControlSet\n  - Services\n  IntegrityLevel:\n  - Medium\n  - S-1-16-8192\n"
explanation: Search for usage of reg or Powershell by non-privileged users to modify
  service configuration in registry
false_positives:
- Unknown
