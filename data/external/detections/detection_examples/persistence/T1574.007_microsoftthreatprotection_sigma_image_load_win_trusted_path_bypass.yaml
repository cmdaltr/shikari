technique_id: T1574.007
technique_name: Trusted Path Bypass via Windows Directory Spoofing
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 0cbe38c0-270c-41d9-ab79-6e5a9a669290
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ImageLoaded|contains:\n  - :\\Windows \\System32\\\n  - :\\Windows \\SysWOW64\\\
  \n"
explanation: 'Detects DLLs loading from a spoofed Windows directory path with an extra
  space (e.g "C:\Windows \System32") which can bypass Windows trusted path verification.

  This technique tricks Windows into treating the path as trusted, allowing malicious
  DLLs to load with high integrity privileges bypassing UAC.

  '
false_positives:
- Unlikely
references:
- https://x.com/Wietze/status/1933495426952421843
