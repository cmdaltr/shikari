technique_id: T1574.011
technique_name: Abuse of Service Permissions to Hide Services Via Set-Service
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 514e4c3a-c77d-4cde-a00f-046425e2301e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cmdlet:\n  CommandLine|contains:\n  - '-SecurityDescriptorSddl '\n  -\
  \ '-sd '\nselection_img:\n- Image|endswith: \\pwsh.exe\n- OriginalFileName: pwsh.dll\n\
  selection_sddl:\n  CommandLine|contains|all:\n  - 'Set-Service '\n  - DCLCWPDTSD\n"
explanation: Detects usage of the "Set-Service" powershell cmdlet to configure a new
  SecurityDescriptor that allows a service to be hidden from other utilities such
  as "sc.exe", "Get-Service"...etc. (Works only in powershell 7)
false_positives:
- Rare intended use of hidden services
references:
- https://twitter.com/Alh4zr3d/status/1580925761996828672
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/set-service?view=powershell-7.2
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \pwsh.exe
  - OriginalFileName: pwsh.dll
  selection_sddl:
    CommandLine|contains|all:
    - 'Set-Service '
    - DCLCWPDTSD
  selection_cmdlet:
    CommandLine|contains:
    - '-SecurityDescriptorSddl '
    - '-sd '
  condition: all of selection_*
