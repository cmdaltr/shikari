technique_id: T1546
technique_name: APT Package Manager Configuration File Creation
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"linux\" and event.action in (\"rename\", \"creation\"\
  ) and\nfile.path : \"/etc/apt/apt.conf.d/*\" and not (\n  process.executable in\
  \ (\n    \"/bin/dpkg\", \"/usr/bin/dpkg\", \"/bin/dockerd\", \"/usr/bin/dockerd\"\
  , \"/usr/sbin/dockerd\", \"/bin/microdnf\",\n    \"/usr/bin/microdnf\", \"/bin/rpm\"\
  , \"/usr/bin/rpm\", \"/bin/snapd\", \"/usr/bin/snapd\", \"/bin/yum\", \"/usr/bin/yum\"\
  ,\n    \"/bin/dnf\", \"/usr/bin/dnf\", \"/bin/podman\", \"/usr/bin/podman\", \"\
  /bin/dnf-automatic\", \"/usr/bin/dnf-automatic\",\n    \"/bin/pacman\", \"/usr/bin/pacman\"\
  , \"/usr/bin/dpkg-divert\", \"/bin/dpkg-divert\", \"/sbin/apk\", \"/usr/sbin/apk\"\
  ,\n    \"/usr/local/sbin/apk\", \"/usr/bin/apt\", \"/usr/sbin/pacman\", \"/bin/podman\"\
  , \"/usr/bin/podman\", \"/usr/bin/puppet\",\n    \"/bin/puppet\", \"/opt/puppetlabs/puppet/bin/puppet\"\
  , \"/usr/bin/chef-client\", \"/bin/chef-client\",\n    \"/bin/autossl_check\", \"\
  /usr/bin/autossl_check\", \"/proc/self/exe\", \"/dev/fd/*\",  \"/usr/bin/pamac-daemon\"\
  ,\n    \"/bin/pamac-daemon\", \"/usr/lib/snapd/snapd\", \"/usr/local/bin/dockerd\"\
  , \"/usr/libexec/netplan/generate\",\n    \"/usr/local/bin/apt-get\", \"/usr/bin/apt-get\"\
  \n  ) or\n  file.path :(\"/etc/apt/apt.conf.d/*.tmp*\") or\n  file.extension in\
  \ (\"swp\", \"swpx\", \"swx\", \"dpkg-remove\") or\n  file.Ext.original.extension\
  \ == \"dpkg-new\" or\n  process.executable : (\n    \"/nix/store/*\", \"/var/lib/dpkg/*\"\
  , \"/tmp/vmis.*\", \"/snap/*\", \"/dev/fd/*\", \"/usr/lib/*\", \"/usr/libexec/*\"\
  ,\n    \"/etc/kernel/*\"\n  ) or\n  process.executable == null or\n  process.name\
  \ in (\"pveupdate\", \"perl\", \"executor\", \"crio\", \"docker-init\", \"dockerd\"\
  , \"pvedaemon\") or\n  (process.name == \"sed\" and file.name : \"sed*\") or\n \
  \ (process.name == \"perl\" and file.name : \"e2scrub_all.tmp*\")\n)"
explanation: 'Detects file creation events in the configuration directory for the
  APT package manager. In Linux, APT (Advanced Package

  Tool) is a command-line utility used for handling packages on (by default) Debian-based
  systems, providing functions for

  installing, updating, upgrading, and removing software along with managing package
  repositories. Attackers can backdoor

  APT to gain persistence by injecting malicious code into scripts that APT runs,
  thereby ensuring continued unauthorized

  access or control each time APT is used for package management.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7c2e1297-7664-42bc-af11-6d5d35220b6b.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate package management operations by system tools like dpkg or apt-get
    can trigger alerts. To manage this, ensure these processes are included in the
    exclusion list within the detection rule.

    - Temporary files created during package updates or installations, such as those
    with extensions like swp or dpkg-new, may cause false positives. Exclude these
    file extensions from triggering alerts.

    - Automated system maintenance scripts or tools like puppet or chef-client'
  mitigation: Review investigation guide for details
references:
- https://packetstormsecurity.com/files/152668/APT-Package-Manager-Persistence.html
- https://www.elastic.co/security-labs/sequel-on-persistence-mechanisms
has_investigation_guide: true
risk_score: 47
