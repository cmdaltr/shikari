technique_id: T1021.002
technique_name: CobaltStrike Service Installations - System
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.95
validated: true
source: sigma
sigma_id: 5a105d34-05fc-401e-8553-272b45c1522d
level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_id and (selection1\
  \ or selection2 or selection3 or selection4)\nselection1:\n  ImagePath|contains|all:\n\
  \  - ADMIN$\n  - .exe\nselection2:\n  ImagePath|contains|all:\n  - '%COMSPEC%'\n\
  \  - start\n  - powershell\nselection3:\n  ImagePath|contains: powershell -nop -w\
  \ hidden -encodedcommand\nselection4:\n  ImagePath|base64offset|contains: 'IEX (New-Object\
  \ Net.Webclient).DownloadString(''http://127.0.0.1:'\nselection_id:\n  EventID:\
  \ 7045\n  Provider_Name: Service Control Manager\n"
explanation: Detects known malicious service installs that appear in cases in which
  a Cobalt Strike beacon elevates privileges or lateral movement
false_positives:
- Unknown
references:
- https://www.sans.org/webcasts/119395
- https://www.crowdstrike.com/blog/getting-the-bacon-from-cobalt-strike-beacon/
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
