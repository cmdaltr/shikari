technique_id: T1574.001
technique_name: Potential Mpclient.DLL Sideloading
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 418dc89a-9808-4b87-b1d7-e5ae0cb6effc
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_known_locations:\n  Image|startswith:\n  - C:\\Program\
  \ Files (x86)\\Windows Defender\\\n  - C:\\Program Files\\Microsoft Security Client\\\
  \n  - C:\\Program Files\\Windows Defender\\\n  - C:\\ProgramData\\Microsoft\\Windows\
  \ Defender\\Platform\\\n  - C:\\Windows\\WinSxS\\\nselection:\n  ImageLoaded|endswith:\
  \ \\mpclient.dll\n  Image|endswith:\n  - \\MpCmdRun.exe\n  - \\NisSrv.exe\n"
explanation: Detects potential sideloading of "mpclient.dll" by Windows Defender processes
  ("MpCmdRun" and "NisSrv") from their non-default directory.
false_positives:
- Unlikely
references:
- https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: image_load
detection:
  selection:
    ImageLoaded|endswith: \mpclient.dll
    Image|endswith:
    - \MpCmdRun.exe
    - \NisSrv.exe
  filter_main_known_locations:
    Image|startswith:
    - C:\Program Files (x86)\Windows Defender\
    - C:\Program Files\Microsoft Security Client\
    - C:\Program Files\Windows Defender\
    - C:\ProgramData\Microsoft\Windows Defender\Platform\
    - C:\Windows\WinSxS\
  condition: selection and not 1 of filter_main_*
