technique_id: T1112
technique_name: Imports Registry Key From an ADS
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 0b80ade5-6997-4b1d-99a1-71701778ea61
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not filter\nfilter:\n  CommandLine|contains|windash:\n  - ' -e '\n  - ' -a '\n\
  \  - ' -c '\nselection_cli:\n  CommandLine|contains:\n  - ' /i '\n  - .reg\n  CommandLine|re:\
  \ :[^ \\\\]\nselection_img:\n- Image|endswith: \\regedit.exe\n- OriginalFileName:\
  \ REGEDIT.EXE\n"
explanation: Detects the import of a alternate datastream to the registry with regedit.exe.
false_positives:
- Unknown
references:
- https://lolbas-project.github.io/lolbas/Binaries/Regedit/
- https://gist.github.com/api0cradle/cdd2d0d0ec9abb686f0e89306e277b8f
tags:
- attack.persistence
- attack.t1112
- attack.defense-evasion
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \regedit.exe
  - OriginalFileName: REGEDIT.EXE
  selection_cli:
    CommandLine|contains:
    - ' /i '
    - .reg
    CommandLine|re: :[^ \\]
  filter:
    CommandLine|contains|windash:
    - ' -e '
    - ' -a '
    - ' -c '
  condition: all of selection_* and not filter
