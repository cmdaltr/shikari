technique_id: T1505
technique_name: Execution via MSSQL xp_cmdshell Stored Procedure
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "host.os.type:windows and event.category:process and event.type:start and\n\
  process.parent.name:\"sqlservr.exe\" and process.command_line : * and\n(\n  (\n\
  \    (process.name.caseless : \"cmd.exe\" or process.pe.original_file_name : \"\
  Cmd.Exe\") and\n    not process.args : (\n          \\\\\\\\* or diskfree or rmdir\
  \ or mkdir or dir or DIR or del or rename or bcp or md or ren or REN or send or\
  \ echo or\n          ECHO or TYPE or type or EXIST or forfiles or sqlcmd or SQLCMD\
  \ or dtexec or Sort-Object or cat or copy or COPY or\n          move or MOVE or\
  \ CD\\\\ or show or rd or powercfg or \"C:\\SPAN4\\DATA\\RISKPARAM.SPN\" or (\"\
  @ECHO\" and \"@FOR\") or\n          (\"@echo\" and \"@for\") or (SET and PATH=*)\
  \ or (\"-ExecutionPolicy\" and \"-File\") or MSSQLFDLauncher$DATEV_DBENGINE or\n\
  \          (wmic and (cpu or computersystem or logicaldisk or os or ComputerSystem\
  \ or volume)) or -s\\:C\\:\\\\WINDOWS\\\\SERVIC* or\n          D\\:\\\\* or E\\\
  :\\\\* or F\\:\\\\* or Z\\:\\\\* or \"C:\\Program Files\\Amazon\\AWSCLIV2\\aws.exe\"\
  \ or C\\:\\\\7-Zip\\\\7z.exe* or\n          C\\:\\\\FTP* or *\\(Get-Item* or C\\\
  :\\\\ProgramData\\\\Daktronics*\n    ) and\n    not process.command_line : (\n \
  \         \"\\\"C:\\\\Windows\\\\system32\\\\cmd.exe\\\" /c \" or\n          \"\\\
  \"C:\\\\Windows\\\\System32\\\\cmd.exe\\\"\"\"    )\n  ) or\n  process.name.caseless:(\"\
  bitsadmin.exe\" or \"certutil.exe\" or \"vpnbridge.exe\") or\n  process.name:(\"\
  bitsadmin.exe\" or \"certutil.exe\" or \"vpnbridge.exe\") or\n  process.pe.original_file_name:(\"\
  CertUtil.exe\" or \"bitsadmin.exe\" or \"vpnbridge.exe\")\n)"
explanation: 'Identifies execution via MSSQL xp_cmdshell stored procedure. Malicious
  users may attempt to elevate their privileges by

  using xp_cmdshell, which is disabled by default, thus, it''s important to review
  the context of it''s use.'
