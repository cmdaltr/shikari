technique_id: T1098.005
technique_name: Suspicious ADRS Token Request by Microsoft Auth Broker
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset: \"azure.signinlogs\" and\n    azure.signinlogs.properties.app_id\
  \ : \"29d9ed98-a469-4536-ade2-f981bc1d605e\" and\n    azure.signinlogs.properties.resource_id\
  \ : \"01cb2876-7ebd-4aa4-9cc9-d28bd4d359a9\" and\n    azure.signinlogs.category:\
  \ \"NonInteractiveUserSignInLogs\" and\n    azure.signinlogs.properties.authentication_processing_details:\
  \ *adrs_access* and\n    azure.signinlogs.properties.incoming_token_type: \"refreshToken\"\
  \ and\n    azure.signinlogs.properties.user_type: \"Member\""
explanation: 'Detects suspicious OAuth 2.0 token requests where the Microsoft Authentication
  Broker

  (29d9ed98-a469-4536-ade2-f981bc1d605e) requests access to the Device Registration
  Service

  (01cb2876-7ebd-4aa4-9cc9-d28bd4d359a9) on behalf of a user principal. The presence
  of the adrs_access scope in the

  authentication processing details suggests an attempt to access ADRS, which is atypical
  for standard user sign-ins. This

  behavior may reflect an effort to abuse device registration for unauthorized persistence,
  such as acquiring a Primary

  Refresh Token (PRT) or establishing a trusted session.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d121f0a8-4875-11f0-bb2b-f661ea17fbcd.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Microsoft Entra ID
  confidence: high
- type: data_source
  value: Microsoft Entra ID Sign-In Logs
  confidence: high
false_positives:
- description: 'False positive analysis

    - Legitimate applications or services that require access to the Device Registration
    Service may trigger this rule. If this is expected behavior, consider adjusting
    the rule or adding exceptions for specific applications or user accounts.

    - Users being onboarded or enrolled in new devices may also trigger this rule,
    especially if they are using the Microsoft Authentication Broker for the first
    time.


