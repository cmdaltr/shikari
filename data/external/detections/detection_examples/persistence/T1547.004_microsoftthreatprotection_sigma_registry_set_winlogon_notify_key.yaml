fidelity_score: 0.84
validated: true
source: sigma
sigma_id: bbf59793-6efb-4fa1-95ca-a7d288e52c88
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details|endswith: .dll\n  TargetObject|endswith: \\SOFTWARE\\Microsoft\\Windows\
  \ NT\\CurrentVersion\\Winlogon\\Notify\\logon\n"
explanation: 'Adversaries may abuse features of Winlogon to execute DLLs and/or executables
  when a user logs in.

  Winlogon.exe is a Windows component responsible for actions at logon/logoff as well
  as the secure attention sequence (SAS) triggered by Ctrl-Alt-Delete.

  '
