technique_id: T1112
technique_name: RestrictedAdminMode Registry Value Tampering - ProcCreation
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 28ac00d6-22d9-4a3c-927f-bbd770104573
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - \\System\\CurrentControlSet\\Control\\Lsa\n  -\
  \ DisableRestrictedAdmin\n"
explanation: 'Detects changes to the "DisableRestrictedAdmin" registry value in order
  to disable or enable RestrictedAdmin mode.

  RestrictedAdmin mode prevents the transmission of reusable credentials to the remote
  system to which you connect using Remote Desktop.

  This prevents your credentials from being harvested during the initial connection
  process if the remote server has been compromise

  '
false_positives:
- Unknown
references:
