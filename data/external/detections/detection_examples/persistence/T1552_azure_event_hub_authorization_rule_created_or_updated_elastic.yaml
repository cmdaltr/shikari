technique_id: T1552
technique_name: Azure Event Hub Authorization Rule Created or Updated
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:azure.activitylogs and azure.activitylogs.operation_name:"MICROSOFT.EVENTHUB/NAMESPACES/AUTHORIZATIONRULES/WRITE"
  and event.outcome:(Success or success)
explanation: 'Identifies when an Event Hub Authorization Rule is created or updated
  in Azure. An authorization rule is associated with

  specific rights, and carries a pair of cryptographic keys. When you create an Event
  Hubs namespace, a policy rule named

  RootManageSharedAccessKey is created for the namespace. This has manage permissions
  for the entire namespace and it''s

  recommended that you treat this rule like an administrative root account and don''t
  use it in your application.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b6dce542-2b75-4ffb-b7d6-38787298ba9d.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative updates to authorization rules by IT staff can trigger
    alerts. To manage this, create exceptions for known administrative accounts or
    scheduled maintenance windows.

    - Automated scripts or deployment tools that update authorization rules as part
    of regular operations may cause false positives. Identify these scripts and exclude
    their activity from alerts by filtering based on their service principal or user
    identity.

    - Changes made by trusted thir'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/azure/event-hubs/authorize-access-shared-access-signature
has_investigation_guide: true
risk_score: 47
