technique_id: T1068
technique_name: Process Explorer Driver Creation By Non-Sysinternals Binary
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: de46c52b-0bf8-4936-a327-aace94f94ac6
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_process_explorer:\n  Image|endswith:\n  - \\procexp.exe\n\
  \  - \\procexp64.exe\nselection:\n  TargetFilename|contains: \\PROCEXP\n  TargetFilename|endswith:\
  \ .sys\n"
explanation: 'Detects creation of the Process Explorer drivers by processes other
  than Process Explorer (procexp) itself.

  Hack tools or malware may use the Process Explorer driver to elevate privileges,
  drops it to disk for a few moments, runs a service using that driver and removes
  it afterwards.

  '
false_positives:
- Some false positives may occur with legitimate renamed process explorer binaries
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/process-explorer
- https://github.com/Yaxser/Backstab
- https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks
- https://news.sophos.com/en-us/2023/04/19/aukill-edr-killer-malware-abuses-process-explorer-driver/
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1068
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: \PROCEXP
    TargetFilename|endswith: .sys
  filter_main_process_explorer:
    Image|endswith:
    - \procexp.exe
    - \procexp64.exe
  condition: selection and not 1 of filter_main_*
