technique_id: T1136.003
technique_name: Azure AD Multiple Service Principals Created by User
tactic: persistence
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`azure_monitor_aad` operationName="Add service principal" properties.initiatedBy.user.id=*
  | rename properties.* as * | bucket span=10m _time | rename targetResources{}.displayName
  as displayName | rename userAgent as user_agent | fillnull | stats count min(_time)
  as firstTime max(_time) as lastTime dc(displayName) as unique_apps values(displayName)
  as displayName values(dest) as dest values(src) as src values(user) as user values(user_agent)
  as user_agent by src_user vendor_account vendor_product signature | where unique_apps
  > 3 | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` |
  `azure_ad_multiple_service_principals_created_by_user_filter`'
explanation: The following analytic identifies instances where a single user creates
  more than three unique OAuth applications within a 10-minute timeframe in Azure
  AD. It detects this activity by monitoring the 'Add service principal' operation
  and aggregating data in 10-minute intervals. This behavior is significant as it
  may indicate an adversary rapidly creating multiple service principals to stage
  an attack or expand their foothold within the network. If confirmed malicious, this
  activity could allow attackers to establish persistence, escalate privileges, or
  access sensitive information within the Azure environment.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/32880707-f512-414e-bd7f-204c0c85b758/
indicators:
- type: data_source
  value: Azure Active Directory Add service principal
  confidence: high
- type: risk_user
  value: src_user
  confidence: high
false_positives:
- description: Certain users or applications may create multiple service principals
    in a short period of time for legitimate purposes. Filter as needed.
  mitigation: Review context and user activity
