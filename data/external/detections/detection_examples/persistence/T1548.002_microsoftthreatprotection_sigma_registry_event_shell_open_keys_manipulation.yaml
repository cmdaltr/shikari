technique_id: T1548.002
technique_name: Shell Open Registry Keys Manipulation
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 152f3630-77c1-4284-bcc0-4cc68ab2f6e7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection1 or selection2\
  \ or (selection3 and not filter_sel3)\nfilter_sel3:\n  Details: (Empty)\nselection1:\n\
  \  Details|contains: \\Software\\Classes\\{\n  EventType: SetValue\n  TargetObject|endswith:\
  \ Classes\\ms-settings\\shell\\open\\command\\SymbolicLinkValue\nselection2:\n \
  \ TargetObject|endswith: Classes\\ms-settings\\shell\\open\\command\\DelegateExecute\n\
  selection3:\n  EventType: SetValue\n  TargetObject|endswith:\n  - Classes\\ms-settings\\\
  shell\\open\\command\\(Default)\n  - Classes\\exefile\\shell\\open\\command\\(Default)\n"
explanation: Detects the shell open key manipulation (exefile and ms-settings) used
  for persistence and the pattern of UAC Bypass using fodhelper.exe, computerdefaults.exe,
  slui.exe via registry keys (e.g. UACMe 33 or 62)
false_positives:
- Unknown
references:
- https://github.com/hfiref0x/UACME
- https://winscripting.blog/2017/05/12/first-entry-welcome-and-uac-bypass/
- https://github.com/RhinoSecurityLabs/Aggressor-Scripts/tree/master/UACBypass
- https://tria.ge/211119-gs7rtshcfr/behavioral2 [Lokibot sample from Nov 2021]
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
- attack.t1546.001
logsource:
  category: registry_event
  product: windows
detection:
  selection1:
    EventType: SetValue
    TargetObject|endswith: Classes\ms-settings\shell\open\command\SymbolicLinkValue
    Details|contains: \Software\Classes\{
  selection2:
    TargetObject|endswith: Classes\ms-settings\shell\open\command\DelegateExecute
  selection3:
    EventType: SetValue
    TargetObject|endswith:
    - Classes\ms-settings\shell\open\command\(Default)
    - Classes\exefile\shell\open\command\(Default)
  filter_sel3:
    Details: (Empty)
  condition: selection1 or selection2 or (selection3 and not filter_sel3)
