technique_id: T1112
technique_name: Potential Persistence Via Outlook Today Page
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 487bb375-12ef-41f6-baae-c6a1572b4dd1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_main and 1\
  \ of selection_value_* and not 1 of filter_main_*\nfilter_main_office:\n  Image|endswith:\
  \ \\OfficeClickToRun.exe\n  Image|startswith:\n  - C:\\Program Files\\Common Files\\\
  Microsoft Shared\\ClickToRun\\\n  - C:\\Program Files\\Common Files\\Microsoft Shared\\\
  ClickToRun\\Updates\\\nselection_main:\n  TargetObject|contains|all:\n  - Software\\\
  Microsoft\\Office\\\n  - \\Outlook\\Today\\\nselection_value_stamp:\n  Details:\
  \ DWORD (0x00000001)\n  TargetObject|endswith: \\Stamp\nselection_value_url:\n \
  \ TargetObject|endswith:\n  - \\URL\n  - \\UserDefinedUrl\n"
explanation: 'Detects potential persistence activity via outlook today page.

  An attacker can set a custom page to execute arbitrary code and link to it via the
  registry values "URL" and "UserDefinedUrl".

  '
false_positives:
- Unknown
references:
- https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=74
- https://trustedsec.com/blog/specula-turning-outlook-into-a-c2-with-one-registry-change
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1112
logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains|all:
    - Software\Microsoft\Office\
    - \Outlook\Today\
  selection_value_stamp:
    TargetObject|endswith: \Stamp
    Details: DWORD (0x00000001)
  selection_value_url:
    TargetObject|endswith:
    - \URL
    - \UserDefinedUrl
  filter_main_office:
    Image|startswith:
    - C:\Program Files\Common Files\Microsoft Shared\ClickToRun\
    - C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\
    Image|endswith: \OfficeClickToRun.exe
  condition: selection_main and 1 of selection_value_* and not 1 of filter_main_*
