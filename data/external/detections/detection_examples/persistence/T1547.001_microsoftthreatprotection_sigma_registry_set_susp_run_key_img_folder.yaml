technique_id: T1547.001
technique_name: New RUN Key Pointing to Suspicious Folder
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_target and\
  \ (selection_suspicious_paths_1 or (all of selection_suspicious_paths_user_*\n \
  \ )) and not 1 of filter_main_* and not 1 of filter_optional_*\nfilter_main_windows_update:\n\
  \  Details|contains:\n  - \\AppData\\Local\\Temp\\\n  - C:\\Windows\\Temp\\\n  Details|contains|all:\n\
  \  - 'rundll32.exe '\n  - C:\\WINDOWS\\system32\\advpack.dll,DelNodeRunDLL32\n \
  \ Image|startswith: C:\\Windows\\SoftwareDistribution\\Download\\\n  TargetObject|contains:\
  \ \\Microsoft\\Windows\\CurrentVersion\\RunOnce\\\nfilter_optional_spotify:\n  Details|endswith:\
  \ Spotify.exe --autostart --minimized\n  Image|endswith:\n  - C:\\Program Files\\\
  Spotify\\Spotify.exe\n  - C:\\Program Files (x86)\\Spotify\\Spotify.exe\n  - \\\
  AppData\\Roaming\\Spotify\\Spotify.exe\n  TargetObject|endswith: SOFTWARE\\Microsoft\\\
  Windows\\CurrentVersion\\Run\\Spotify\nselection_suspicious_paths_1:\n  Details|contains:\n\
  \  - :\\Perflogs\n  - :\\ProgramData'\n  - :\\Windows\\Temp\n  - :\\Temp\n  - \\\
  AppData\\Local\\Temp\n  - \\AppData\\Roaming\n  - :\\$Recycle.bin\n  - :\\Users\\\
  Default\n  - :\\Users\\public\n  - '%temp%'\n  - '%tmp%'\n  - '%Public%'\n  - '%AppData%'\n\
  selection_suspicious_paths_user_1:\n  Details|contains: :\\Users\\\nselection_suspicious_paths_user_2:\n\
  \  Details|contains:\n  - \\Favorites\n  - \\Favourites\n  - \\Contacts\n  - \\\
  Music\n  - \\Pictures\n  - \\Documents\n  - \\Photos\nselection_target:\n  TargetObject|contains:\n\
  \  - \\Software\\Microsoft\\Windows\\CurrentVersion\\Run\n  - \\Software\\WOW6432Node\\\
  Microsoft\\Windows\\CurrentVersion\\Run\n  - \\Software\\Microsoft\\Windows\\CurrentVersion\\\
  Policies\\Explorer\\Run\n"
explanation: Detects suspicious new RUN key element pointing to an executable in a
  suspicious folder
false_positives:
- Software using weird folders for updates
references:
- https://www.fireeye.com/blog/threat-research/2018/08/fin7-pursuing-an-enigmatic-and-evasive-global-criminal-operation.html
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_target:
    TargetObject|contains:
    - \Software\Microsoft\Windows\CurrentVersion\Run
    - \Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run
    - \Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run
  selection_suspicious_paths_1:
    Details|contains:
    - :\Perflogs
    - :\ProgramData'
    - :\Windows\Temp
    - :\Temp
    - \AppData\Local\Temp
    - \AppData\Roaming
    - :\$Recycle.bin
    - :\Users\Default
    - :\Users\public
    - '%temp%'
    - '%tmp%'
    - '%Public%'
    - '%AppData%'
  selection_suspicious_paths_user_1:
    Details|contains: :\Users\
  selection_suspicious_paths_user_2:
    Details|contains:
    - \Favorites
    - \Favourites
    - \Contacts
    - \Music
    - \Pictures
    - \Documents
    - \Photos
  filter_main_windows_update:
    TargetObject|contains: \Microsoft\Windows\CurrentVersion\RunOnce\
    Image|startswith: C:\Windows\SoftwareDistribution\Download\
    Details|contains|all:
    - 'rundll32.exe '
    - C:\WINDOWS\system32\advpack.dll,DelNodeRunDLL32
    Details|contains:
    - \AppData\Local\Temp\
    - C:\Windows\Temp\
  filter_optional_spotify:
    Image|endswith:
    - C:\Program Files\Spotify\Spotify.exe
    - C:\Program Files (x86)\Spotify\Spotify.exe
    - \AppData\Roaming\Spotify\Spotify.exe
    TargetObject|endswith: SOFTWARE\Microsoft\Windows\CurrentVersion\Run\Spotify
    Details|endswith: Spotify.exe --autostart --minimized
  condition: selection_target and (selection_suspicious_paths_1 or (all of selection_suspicious_paths_user_*
    )) and not 1 of filter_main_* and not 1 of filter_optional_*
