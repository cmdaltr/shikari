technique_id: T1547.001
technique_name: File Creation In Suspicious Directory By Msdt.EXE
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 318557a5-150c-4c8d-b70e-a9910e199857
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith: \\msdt.exe\n  TargetFilename|contains:\n  - \\Desktop\\\n  -\
  \ \\Start Menu\\Programs\\Startup\\\n  - C:\\PerfLogs\\\n  - C:\\ProgramData\\\n\
  \  - C:\\Users\\Public\\\n"
explanation: Detects msdt.exe creating files in suspicious directories which could
  be a sign of exploitation of either Follina or Dogwalk vulnerabilities
false_positives:
- Unknown
references:
- https://irsl.medium.com/the-trouble-with-microsofts-troubleshooters-6e32fc80b8bd
- https://msrc-blog.microsoft.com/2022/05/30/guidance-for-cve-2022-30190-microsoft-support-diagnostic-tool-vulnerability/
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
- cve.2022-30190
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith: \msdt.exe
    TargetFilename|contains:
    - \Desktop\
    - \Start Menu\Programs\Startup\
    - C:\PerfLogs\
    - C:\ProgramData\
    - C:\Users\Public\
  condition: selection
