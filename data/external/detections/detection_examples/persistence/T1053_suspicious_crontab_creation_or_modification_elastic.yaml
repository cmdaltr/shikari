technique_id: T1053
technique_name: Suspicious CronTab Creation or Modification
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: "file where host.os.type == \"macos\" and event.type != \"deletion\" and process.name\
  \ != null and\n  file.path like \"/private/var/at/tabs/*\" and not process.executable\
  \ == \"/usr/bin/crontab\""
explanation: 'Identifies attempts to create or modify a crontab via a process that
  is not crontab (i.e python, osascript, etc.). This

  activity should not be highly prevalent and could indicate the use of cron as a
  persistence mechanism by a threat actor.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/530178da-92ea-43ce-94c2-8877a826783d.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - System maintenance scripts or legitimate administrative tools may modify crontabs
    using non-standard processes. Review the process name and executable path to determine
    if the activity is part of routine maintenance.

    - Development or testing environments might use scripts or automation tools that
    modify crontabs for legitimate purposes. Identify and document these processes
    to create exceptions in the detection rule.

    - Some third-party applications may use cron jobs fo'
  mitigation: Review investigation guide for details
references:
- https://taomm.org/PDFs/vol1/CH%200x02%20Persistence.pdf
- https://theevilbit.github.io/beyond/beyond_0004/
has_investigation_guide: true
risk_score: 47
