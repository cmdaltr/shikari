technique_id: T1098.003
technique_name: Microsoft 365 Global Administrator Role Assigned
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:o365.audit\n    and event.code:\"AzureActiveDirectory\"\n  \
  \  and event.action:\"Add member to role.\"\n    and event.outcome: \"success\"\n\
  \    and o365.audit.ModifiedProperties.Role_DisplayName.NewValue: (\n        \"\
  Global Administrator\" or \"Company Administrator\"\n    )\n    and o365.audit.AzureActiveDirectoryEventType:\
  \ 1\n    and o365.audit.RecordType: 8"
explanation: 'Identifies when the Microsoft 365 Global Administrator or Company Administrator
  role is assigned to a user or service

  principal. The Global Administrator role has extensive privileges across Entra ID
  and Microsoft 365 services, making it

  a high-value target for adversaries seeking persistent access. Successful assignments
  of this role may indicate

  potential privilege escalation or unauthorized access attempts, especially if performed
  by accounts that do not

  typically manage high-privilege roles.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/88671231-6626-4e1b-abb7-6e361a171fbb.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Microsoft 365
  confidence: high
- type: data_source
  value: Microsoft 365 Audit Logs
  confidence: high
false_positives:
- description: 'False positive analysis


    - Role assignments by IT administrators as part of routine maintenance or incident
    response may appear suspicious in environments without change tracking or ticket
    correlation.

    - PIM (Privileged Identity Management) activations may temporarily elevate accounts
    to Global Administrator and then revoke the role afterward.

    - Onboarding processes or internal audits may require temporary elevation to Global
    Administrator for legitimate users.

    - Automation tools and scripts may'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/azure/active-directory/roles/permissions-reference#global-administrator
- https://learn.microsoft.com/en-us/purview/audit-log-activities
- https://www.blackhat.com/us-24/briefings/schedule/#unoauthorized-a-technique-to-privilege-escalation-to-global-administrator-39231
has_investigation_guide: true
risk_score: 47
