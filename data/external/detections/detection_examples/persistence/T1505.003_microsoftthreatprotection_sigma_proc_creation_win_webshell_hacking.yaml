technique_id: T1505.003
technique_name: Webshell Hacking Activity Patterns
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 4ebc877f-4612-45cb-b3a5-8e3834db36c9
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_webserver_*\
  \ and 1 of selection_child_*\nselection_child_1:\n  CommandLine|contains|all:\n\
  \  - rundll32\n  - comsvcs\nselection_child_2:\n  CommandLine|contains|all:\n  -\
  \ ' -hp'\n  - ' a '\n  - ' -m'\nselection_child_3:\n  CommandLine|contains|all:\n\
  \  - net\n  - ' user '\n  - ' /add'\nselection_child_4:\n  CommandLine|contains|all:\n\
  \  - net\n  - ' localgroup '\n  - ' administrators '\n  - /add\nselection_child_5:\n\
  \  Image|endswith:\n  - \\ntdsutil.exe\n  - \\ldifde.exe\n  - \\adfind.exe\n  -\
  \ \\procdump.exe\n  - \\Nanodump.exe\n  - \\vssadmin.exe\n  - \\fsutil.exe\nselection_child_6:\n\
  \  CommandLine|contains:\n  - ' -decode '\n  - ' -NoP '\n  - ' -W Hidden '\n  -\
  \ ' /decode '\n  - ' /ticket:'\n  - ' sekurlsa'\n  - .dmp full\n  - .downloadfile(\n\
  \  - .downloadstring(\n  - FromBase64String\n  - process call create\n  - 'reg save\
  \ '\n  - whoami /priv\nselection_webserver_characteristics_tomcat1:\n  ParentImage|contains:\n\
  \  - -tomcat-\n  - \\tomcat\n  ParentImage|endswith:\n  - \\java.exe\n  - \\javaw.exe\n\
  selection_webserver_characteristics_tomcat2:\n  CommandLine|contains:\n  - catalina.jar\n\
  \  - CATALINA_HOME\n  ParentImage|endswith:\n  - \\java.exe\n  - \\javaw.exe\nselection_webserver_image:\n\
  \  ParentImage|endswith:\n  - \\caddy.exe\n  - \\httpd.exe\n  - \\nginx.exe\n  -\
  \ \\php-cgi.exe\n  - \\w3wp.exe\n  - \\ws_tomcatservice.exe\n"
explanation: 'Detects certain parent child patterns found in cases in which a web
  shell is used to perform certain credential dumping or exfiltration activities on
  a compromised system

  '
false_positives:
- Unlikely
references:
- https://youtu.be/7aemGhaE9ds?t=641
tags:
- attack.persistence
- attack.discovery
- attack.t1505.003
- attack.t1018
- attack.t1033
- attack.t1087
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - \caddy.exe
    - \httpd.exe
    - \nginx.exe
    - \php-cgi.exe
    - \w3wp.exe
    - \ws_tomcatservice.exe
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    ParentImage|contains:
    - -tomcat-
    - \tomcat
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    CommandLine|contains:
    - catalina.jar
    - CATALINA_HOME
  selection_child_1:
    CommandLine|contains|all:
    - rundll32
    - comsvcs
  selection_child_2:
    CommandLine|contains|all:
    - ' -hp'
    - ' a '
    - ' -m'
  selection_child_3:
    CommandLine|contains|all:
    - net
    - ' user '
    - ' /add'
  selection_child_4:
    CommandLine|contains|all:
    - net
    - ' localgroup '
    - ' administrators '
    - /add
  selection_child_5:
    Image|endswith:
    - \ntdsutil.exe
    - \ldifde.exe
    - \adfind.exe
    - \procdump.exe
    - \Nanodump.exe
    - \vssadmin.exe
    - \fsutil.exe
  selection_child_6:
    CommandLine|contains:
    - ' -decode '
    - ' -NoP '
    - ' -W Hidden '
    - ' /decode '
    - ' /ticket:'
    - ' sekurlsa'
    - .dmp full
    - .downloadfile(
    - .downloadstring(
    - FromBase64String
    - process call create
    - 'reg save '
    - whoami /priv
  condition: 1 of selection_webserver_* and 1 of selection_child_*
