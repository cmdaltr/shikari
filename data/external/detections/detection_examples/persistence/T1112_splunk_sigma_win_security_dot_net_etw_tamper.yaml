technique_id: T1112
technique_name: ETW Logging Disabled In .NET Processes - Registry
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: a4c90ea1-2634-4ca0-adbb-35eae169b6fc
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_complus:\n\
  \  EventID: 4657\n  NewValue: 0\n  ObjectName|contains: \\Environment\n  ObjectValueName:\n\
  \  - COMPlus_ETWEnabled\n  - COMPlus_ETWFlags\nselection_etw_enabled:\n  EventID:\
  \ 4657\n  NewValue: 0\n  ObjectName|endswith: \\SOFTWARE\\Microsoft\\.NETFramework\n\
  \  ObjectValueName: ETWEnabled\n"
explanation: Potential adversaries stopping ETW providers recording loaded .NET assemblies.
false_positives:
- Unknown
