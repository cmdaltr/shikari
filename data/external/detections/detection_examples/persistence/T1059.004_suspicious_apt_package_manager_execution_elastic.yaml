technique_id: T1059.004
technique_name: Suspicious APT Package Manager Execution
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id with maxspan=5s\n  [process where host.os.type == \"linux\"\
  \ and event.type == \"start\" and event.action in (\"exec\", \"start\", \"ProcessRollup2\"\
  ) and\n   process.parent.name == \"apt\" and process.args == \"-c\" and process.name\
  \ in (\n     \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"\
  fish\"\n   ) and not process.executable == \"/usr/lib/venv-salt-minion/bin/python.original\"\
  \n  ] by process.entity_id\n  [process where host.os.type == \"linux\" and event.type\
  \ == \"start\" and event.action in (\"exec\", \"start\", \"ProcessRollup2\") and\
  \ process.name : (\n     \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\"\
  , \"ksh\", \"fish\", \"python*\", \"php*\",\n     \"perl\", \"ruby\", \"lua*\",\
  \ \"openssl\", \"nc\", \"netcat\", \"ncat\", \"telnet\", \"awk\"\n   )\n  ] by process.parent.entity_id"
explanation: 'Detects suspicious process events executed by the APT package manager,
  potentially indicating persistence through an APT

  backdoor. In Linux, APT (Advanced Package Tool) is a command-line utility used for
  handling packages on Debian-based

  systems, providing functions for installing, updating, upgrading, and removing software
  along with managing package

  repositories. Attackers can backdoor APT to gain persistence by injecting malicious
  code into scripts that APT runs,

  thereby ensuring continued unauthorized access or control each time APT is used
  for package management.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ad959eeb-2b7b-4722-ba08-a45f6622f005.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: data_source
  value: Crowdstrike
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts executed by system administrators using APT
    may trigger the rule. To handle this, identify and document routine administrative
    tasks and create exceptions for these specific scripts or commands.

    - Automated system maintenance scripts that use APT for updates or installations
    can be mistaken for suspicious activity. Review and whitelist these scripts by
    their specific command patterns or script names.

    - Custom software deployment proces'
  mitigation: Review investigation guide for details
references:
- https://www.elastic.co/security-labs/sequel-on-persistence-mechanisms
has_investigation_guide: true
risk_score: 47
