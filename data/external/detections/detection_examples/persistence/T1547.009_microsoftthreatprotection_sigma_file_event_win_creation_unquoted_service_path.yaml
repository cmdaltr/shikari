query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetFilename: C:\\program.exe\n"
explanation: 'Adversaries may execute their own malicious payloads by hijacking vulnerable
  file path references.

  Adversaries can take advantage of paths that lack surrounding quotations by placing
  an executable in a higher level directory within the path, so that Windows will
  choose the adversary''s executable to launch.

  '
