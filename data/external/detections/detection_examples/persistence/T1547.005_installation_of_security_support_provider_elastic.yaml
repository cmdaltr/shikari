technique_id: T1547.005
technique_name: Installation of Security Support Provider
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : \"Security Packages\" and\n  registry.path : (\n      \"*\\\\\
  SYSTEM\\\\*ControlSet*\\\\Control\\\\Lsa\\\\Security Packages\",\n      \"*\\\\\
  SYSTEM\\\\*ControlSet*\\\\Control\\\\Lsa\\\\OSConfig\\\\Security Packages\"\n  )\
  \ and\n  not process.executable : (\n        \"C:\\\\Windows\\\\System32\\\\msiexec.exe\"\
  ,\n        \"C:\\\\Windows\\\\SysWOW64\\\\msiexec.exe\",\n        /* Crowdstrike\
  \ specific exclusion as it uses NT Object paths */\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\System32\\\\msiexec.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\SysWOW64\\\\msiexec.exe\"\n  )"
explanation: 'Identifies registry modifications related to the Windows Security Support
  Provider (SSP) configuration. Adversaries may

  abuse this to establish persistence in an environment.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e86da94d-e54b-4fb5-b96c-cecff87e8787.toml
