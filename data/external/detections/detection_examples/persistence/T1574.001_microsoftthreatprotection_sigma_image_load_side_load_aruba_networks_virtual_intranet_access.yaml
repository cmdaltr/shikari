fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 90ae0469-0cee-4509-b67f-e5efcef040f7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ImageLoaded|startswith:\n  - C:\\Windows\\System32\\\n  - C:\\Windows\\\
  SysWOW64\\\n  - C:\\Windows\\WinSxS\\\nselection:\n  ImageLoaded|endswith:\n  -\
  \ \\wtsapi32.dll\n  - \\msvcr100.dll\n  - \\msvcp100.dll\n  - \\dbghelp.dll\n  -\
  \ \\dbgcore.dll\n  - \\wininet.dll\n  - \\iphlpapi.dll\n  - \\version.dll\n  - \\\
  cryptsp.dll\n  - \\cryptbase.dll\n  - \\wldp.dll\n  - \\profapi.dll\n  - \\sspicli.dll\n\
  \  - \\winsta.dll\n  - \\dpapi.dll\n  Image|endswith: \\arubanetsvc.exe\n"
explanation: Detects potential DLL sideloading activity via the Aruba Networks Virtual
  Intranet Access "arubanetsvc.exe" process using DLL Search Order Hijacking
false_positives:
- Unknown
references:
- https://twitter.com/wdormann/status/1616581559892545537?t=XLCBO9BziGzD7Bmbt8oMEQ&s=09
