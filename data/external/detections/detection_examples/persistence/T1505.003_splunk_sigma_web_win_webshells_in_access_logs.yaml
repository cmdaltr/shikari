query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_keywords:\n- =whoami\n- =net%20user\n- =net+user\n- =net%2Buser\n- =cmd%20/c%\n\
  - =cmd+/c+\n- =cmd%2B/c%\n- =cmd%20/r%\n- =cmd+/r+\n- =cmd%2B/r%\n- =cmd%20/k%\n\
  - =cmd+/k+\n- =cmd%2B/k%\n- =powershell%\n- =powershell+\n- =tasklist%\n- =tasklist+\n\
  - =wmic%\n- =wmic+\n- =ssh%\n- =ssh+\n- =python%\n- =python+\n- =python3%\n- =python3+\n\
  - =ipconfig\n- =wget%\n- =wget+\n- =curl%\n- =curl+\n- =certutil\n- =copy%20%5C%5C\n\
  - =dsquery%\n- =dsquery+\n- =nltest%\n- =nltest+\nselection_method:\n  cs-method:\
  \ GET\n"
explanation: Detects common commands used in Windows webshells
false_positives:
- Web sites like wikis with articles on os commands and pages that include the os
  commands in the URLs
- User searches in search boxes of the respective website
