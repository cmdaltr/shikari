  System32\\logonUI.exe.local\\\n  - C:\\Windows\\System32\\werFault.exe.local\\\n\
  \  - C:\\Windows\\System32\\consent.exe.local\\\n  - C:\\Windows\\System32\\narrator.exe.local\\\
  \n  - C:\\windows\\system32\\wermgr.exe.local\\\n"
