sigma_id: 8839e550-52d7-4958-9f2f-e13c1e736838
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetObject: HKLM\\System\\CurrentControlSet\\Control\\MiniNt\\(Default)\n"
explanation: 'Detects the addition of the ''MiniNt'' key to the registry. Upon a reboot,
  Windows Event Log service will stop writing events.

  Windows Event Log is a service that collects and stores event logs from the operating
  system and applications. It is an important component of Windows security and auditing.

  Adversary may want to disable this service to disable logging of security events
  which could be used to detect their activities.

  '
false_positives:
