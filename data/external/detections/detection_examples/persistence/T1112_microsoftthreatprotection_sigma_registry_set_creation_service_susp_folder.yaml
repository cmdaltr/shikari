technique_id: T1112
technique_name: Service Binary in Suspicious Folder
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: a07f0359-4c90-4dc4-a681-8ffea40b4f47
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_* and\
  \ not 1 of filter_optional_*\nfilter_optional_avast:\n  Image|contains|all:\n  -\
  \ \\Common Files\\\n  - \\Temp\\\nfilter_optional_mbamservice:\n  Details|endswith:\
  \ \\AppData\\Local\\Temp\\MBAMInstallerService.exe\"\n  Image: C:\\Windows\\system32\\\
  services.exe\n  TargetObject|endswith: \\CurrentControlSet\\Services\\MBAMInstallerService\\\
  ImagePath\nselection_service_imagepath:\n  Details|contains:\n  - \\Users\\Public\\\
  \n  - \\Perflogs\\\n  - \\ADMIN$\\\n  - \\Temp\\\n  TargetObject|endswith: \\ImagePath\n\
  \  TargetObject|startswith: HKLM\\System\\CurrentControlSet\\Services\\\nselection_service_start:\n\
  \  Details:\n  - DWORD (0x00000000)\n  - DWORD (0x00000001)\n  - DWORD (0x00000002)\n\
  \  Image|contains:\n  - \\Users\\Public\\\n  - \\Perflogs\\\n  - \\ADMIN$\\\n  -\
  \ \\Temp\\\n  TargetObject|endswith: \\Start\n  TargetObject|startswith: HKLM\\\
  System\\CurrentControlSet\\Services\\\n"
explanation: Detect the creation of a service with a service binary located in a suspicious
  directory
false_positives:
- Unknown
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection_service_start:
    TargetObject|startswith: HKLM\System\CurrentControlSet\Services\
    TargetObject|endswith: \Start
    Image|contains:
    - \Users\Public\
    - \Perflogs\
    - \ADMIN$\
    - \Temp\
    Details:
    - DWORD (0x00000000)
    - DWORD (0x00000001)
    - DWORD (0x00000002)
  selection_service_imagepath:
    TargetObject|startswith: HKLM\System\CurrentControlSet\Services\
    TargetObject|endswith: \ImagePath
    Details|contains:
    - \Users\Public\
    - \Perflogs\
    - \ADMIN$\
    - \Temp\
  filter_optional_avast:
    Image|contains|all:
    - \Common Files\
    - \Temp\
  filter_optional_mbamservice:
    TargetObject|endswith: \CurrentControlSet\Services\MBAMInstallerService\ImagePath
    Details|endswith: \AppData\Local\Temp\MBAMInstallerService.exe"
    Image: C:\Windows\system32\services.exe
  condition: 1 of selection_* and not 1 of filter_optional_*
