technique_id: T1574
technique_name: Git Hook Command Execution
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id with maxspan=3s\n  [process where host.os.type == \"linux\"\
  \ and event.type == \"start\" and event.action in (\"exec\", \"start\", \"ProcessRollup2\"\
  ) and\n   process.parent.name == \"git\" and process.args : \".git/hooks/*\" and\n\
  \   process.name in (\"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"\
  ksh\", \"fish\")\n  ] by process.entity_id\n  [process where host.os.type == \"\
  linux\" and event.type == \"start\" and event.action in (\"exec\", \"start\", \"\
  ProcessRollup2\") and\n   process.parent.name in (\"bash\", \"dash\", \"sh\", \"\
  tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\")] by process.parent.entity_id"
explanation: 'This rule detects the execution of a potentially malicious process from
  a Git hook. Git hooks are scripts that Git

  executes before or after events such as: commit, push, and receive. An attacker
  can abuse Git hooks to execute arbitrary

  commands on the system and establish persistence.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/dc61f382-dc0c-4cc0-a845-069f2a071704.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: data_source
  value: Crowdstrike
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Developers using Git hooks for legitimate automation tasks may trigger this
    rule. To manage this, identify and document common scripts used in your development
    environment and create exceptions for these known benign processes.

    - Continuous integration and deployment (CI/CD) systems often utilize Git hooks
    to automate workflows. Review the processes initiated by these systems and exclude
    them from detection if they are verified as non-malicious.

    - Custom scripts execut'
  mitigation: Review investigation guide for details
references:
- https://swisskyrepo.github.io/InternalAllTheThings/redteam/persistence/linux-persistence/#backdooring-git
- https://www.elastic.co/security-labs/sequel-on-persistence-mechanisms
has_investigation_guide: true
risk_score: 47
