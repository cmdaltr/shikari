level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\n  TargetFilename|endswith:\
  \ .bat\n"
explanation: 'Powerup tool''s Write Hijack DLL exploits DLL hijacking for privilege
  escalation.

  In it''s default mode, it builds a self deleting .bat file which executes malicious
  command.

  The detection rule relies on creation of the malicious bat file (debug.bat by default).

  '
false_positives:
- Any powershell script that creates bat files
