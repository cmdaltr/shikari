technique_id: T1543.002
technique_name: Systemd Shell Execution During Boot
tactic: persistence
platform: Elastic
fidelity_score: 0.91
validated: true
query: 'process where host.os.type == "linux" and event.type == "info" and event.action
  == "already_running" and

  process.parent.name == "systemd" and process.name in ("bash", "sh", "tcsh", "csh",
  "zsh", "ksh", "fish") and

  process.parent.command_line == "/sbin/init" and process.args_count >= 2'
explanation: 'This rule detects the execution of shell commands by systemd during
  the boot process on Linux systems. Systemd

  is a system and service manager for Linux operating systems. Attackers may execute
  shell commands during the

  boot process to maintain persistence on the system. This may be a sign of malicious
  systemd services, initramfs

  or GRUB bootloader manipulation, or other persistence mechanisms.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0b76ad27-c3f3-4769-9e7e-3237137fdf06.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'false positive.

    - Examine the specific shell process name (e.g., bash, sh, etc.) and its arguments
    to identify any unusual or suspicious commands being executed.

    - Investigate the history and configuration of the systemd service or unit file
    associated with the suspicious process to determine if it has been modified or
    created recently.

    - Check for any recent changes or anomalies in the initramfs or GRUB bootloader
    configurations that could indicate tampering or unauthorized modifications.

    - Cor'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
