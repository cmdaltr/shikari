technique_id: T1574.001
technique_name: Potential DLL Sideloading Of KeyScramblerIE.DLL Via KeyScrambler.EXE
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: d2451be2-b582-4e15-8701-4196ac180260
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_legitimate_path:\n  ImageLoaded|contains:\n  - C:\\\
  Program Files (x86)\\KeyScrambler\\\n  - C:\\Program Files\\KeyScrambler\\\n  Image|contains:\n\
  \  - C:\\Program Files (x86)\\KeyScrambler\\\n  - C:\\Program Files\\KeyScrambler\\\
  \nfilter_main_signature:\n  Signature: QFX Software Corporation\n  SignatureStatus:\
  \ Valid\nselection:\n  ImageLoaded|endswith: \\KeyScramblerIE.dll\n  Image|endswith:\n\
  \  - \\KeyScrambler.exe\n  - \\KeyScramblerLogon.exe\n"
explanation: 'Detects potential DLL side loading of "KeyScramblerIE.dll" by "KeyScrambler.exe".

  Various threat actors and malware have been found side loading a masqueraded "KeyScramblerIE.dll"
  through "KeyScrambler.exe".

  '
false_positives:
- Unknown
