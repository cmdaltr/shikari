technique_id: T1547.001
technique_name: Windows Event Log Access Tampering Via Registry
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: ba226dcf-d390-4642-b9af-b534872f1156
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_key_*\
  \ and selection_details and not 1 of filter_main_* and\n  not 1 of filter_optional_*\n\
  filter_main_tiworker:\n  Image|endswith: \\TiWorker.exe\n  Image|startswith: C:\\\
  Windows\\WinSxS\\\nfilter_main_trustedinstaller:\n  Image: C:\\Windows\\servicing\\\
  TrustedInstaller.exe\nfilter_optional_empty:\n  Image: ''\nfilter_optional_null:\n\
  \  Image: null\nselection_details:\n- Details|contains: D:(D;\n- Details|contains|all:\n\
  \  - D:(\n  - )(D;\nselection_key_1:\n  TargetObject|contains: \\SYSTEM\\CurrentControlSet\\\
  Services\\EventLog\\\n  TargetObject|endswith: \\CustomSD\nselection_key_2:\n  TargetObject|contains:\n\
  \  - \\Policies\\Microsoft\\Windows\\EventLog\\\n  - \\Microsoft\\Windows\\CurrentVersion\\\
  WINEVT\\Channels\n  TargetObject|endswith: \\ChannelAccess\n"
explanation: 'Detects changes to the Windows EventLog channel permission values. It
  focuses on changes to the Security Descriptor Definition Language (SDDL) string,
  as modifications to these values can restrict access to specific users or groups,
  potentially aiding in defense evasion by controlling who can view or modify a event
  log channel. Upon execution, the user shouldn''t be able to access the event log
  channel via the event viewer or via utilities such as "Get-EventLog" or "wevtutil".

  '
false_positives:
- Administrative activity, still unlikely
references:
- https://www.atomicredteam.io/atomic-red-team/atomics/T1562.002#atomic-test-8---modify-event-log-channel-access-permissions-via-registry---powershell
- https://www.youtube.com/watch?v=uSYvHUVU8xY
- https://learn.microsoft.com/en-us/windows/win32/secauthz/security-descriptor-definition-language
tags:
