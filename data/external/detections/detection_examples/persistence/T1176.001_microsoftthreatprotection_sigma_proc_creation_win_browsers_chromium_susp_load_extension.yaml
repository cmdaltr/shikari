technique_id: T1176.001
technique_name: Suspicious Chromium Browser Instance Executed With Custom Extension
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 27ba3207-dd30-4812-abbf-5d20c57d474e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains: --load-extension=\n  Image|endswith:\n  - \\brave.exe\n\
  \  - \\chrome.exe\n  - \\msedge.exe\n  - \\opera.exe\n  - \\vivaldi.exe\n  ParentImage|endswith:\n\
  \  - \\cmd.exe\n  - \\cscript.exe\n  - \\mshta.exe\n  - \\powershell.exe\n  - \\\
  pwsh.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n  - \\wscript.exe\n"
explanation: Detects a suspicious process spawning a Chromium based browser process
  with the 'load-extension' flag to start an instance with a custom extension
false_positives:
- Unknown
references:
- https://redcanary.com/blog/chromeloader/
- https://emkc.org/s/RJjuLa
- https://www.mandiant.com/resources/blog/lnk-between-browsers
tags:
- attack.persistence
- attack.t1176.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \wscript.exe
    Image|endswith:
    - \brave.exe
    - \chrome.exe
    - \msedge.exe
    - \opera.exe
    - \vivaldi.exe
    CommandLine|contains: --load-extension=
  condition: selection
