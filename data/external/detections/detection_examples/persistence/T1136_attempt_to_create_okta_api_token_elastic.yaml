technique_id: T1136
technique_name: Attempt to Create Okta API Token
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:okta.system and event.action:system.api_token.create
explanation: 'Detects attempts to create an Okta API token. An adversary may create
  an Okta API token to maintain access to an

  organization''s network while they work to achieve their objectives. An attacker
  may abuse an API token to execute

  techniques such as creating user accounts or disabling security rules or policies.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/96b9f4ea-0e8c-435b-8d53-2096e75fcac5.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks may trigger the rule when legitimate IT staff create
    API tokens for automation or integration purposes. To manage this, maintain a
    list of authorized personnel and their expected activities, and create exceptions
    for these known users.

    - Scheduled system maintenance or updates might involve creating API tokens, leading
    to false positives. Document these events and adjust the monitoring window or
    create temporary exceptions during these peri'
  mitigation: Review investigation guide for details
references:
- https://developer.okta.com/docs/reference/api/system-log/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 47
