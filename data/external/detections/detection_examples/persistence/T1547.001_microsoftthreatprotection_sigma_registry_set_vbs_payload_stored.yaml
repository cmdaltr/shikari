technique_id: T1547.001
technique_name: VBScript Payload Stored in Registry
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 46490193-1b22-4c29-bdd6-5bf63907216f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter*\nfilter:\n  TargetObject|contains: Software\\Microsoft\\Windows\\CurrentVersion\\\
  Run\nfilter_dotnet:\n  Details|contains:\n  - \\Microsoft.NET\\Primary Interop Assemblies\\\
  Microsoft.mshtml.dll\n  - <\\Microsoft.mshtml,fileVersion=\n  - _mshtml_dll_\n \
  \ - <\\Microsoft.mshtml,culture=\n  Image|endswith: \\msiexec.exe\n  TargetObject|contains:\
  \ \\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Installer\\UserData\\\nselection:\n\
  \  Details|contains:\n  - 'vbscript:'\n  - 'jscript:'\n  - mshtml,\n  - RunHTMLApplication\n\
  \  - Execute(\n  - CreateObject\n  - window.close\n  TargetObject|contains: Software\\\
  Microsoft\\Windows\\CurrentVersion\n"
explanation: Detects VBScript content stored into registry keys as seen being used
  by UNC2452 group
false_positives:
- Unknown
references:
- https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: Software\Microsoft\Windows\CurrentVersion
    Details|contains:
    - 'vbscript:'
    - 'jscript:'
    - mshtml,
    - RunHTMLApplication
    - Execute(
    - CreateObject
    - window.close
  filter:
    TargetObject|contains: Software\Microsoft\Windows\CurrentVersion\Run
  filter_dotnet:
    Image|endswith: \msiexec.exe
    TargetObject|contains: \SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\
    Details|contains:
    - \Microsoft.NET\Primary Interop Assemblies\Microsoft.mshtml.dll
    - <\Microsoft.mshtml,fileVersion=
    - _mshtml_dll_
    - <\Microsoft.mshtml,culture=
  condition: selection and not 1 of filter*
