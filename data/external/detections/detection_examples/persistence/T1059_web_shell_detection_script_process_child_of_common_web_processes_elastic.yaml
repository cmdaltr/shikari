technique_id: T1059
technique_name: 'Web Shell Detection: Script Process Child of Common Web Processes'
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "host.os.type:windows and event.category:process and event.type:start and process.args\
  \ : * and\n  process.parent.name:(\"w3wp.exe\" or \"httpd.exe\" or \"nginx.exe\"\
  \ or \"php.exe\" or \"php-cgi.exe\" or \"tomcat.exe\") and\n  (\n    process.name\
  \ : (\"cmd.exe\" or \"cscript.exe\" or \"powershell.exe\" or \"pwsh.exe\" or \"\
  powershell_ise.exe\" or \"wmic.exe\" or \"wscript.exe\") or\n    process.name.caseless\
  \ : (\"cmd.exe\" or \"cscript.exe\" or \"powershell.exe\" or \"pwsh.exe\" or \"\
  powershell_ise.exe\" or \"wmic.exe\" or \"wscript.exe\")\n  ) and\n  not\n  (\n\
  \    process.command_line : (\n      \"cmd.exe /c mode CON\" or\n      \"cmd.exe\
  \ /s /c \\\"mode CON\\\"\" or\n      \"cmd.exe /c \\\"mode\\\"\" or\n      \"cmd.exe\
  \ /s /c \\\"tput colors 2>&1\\\"\" or\n      \"cmd.exe /s /c \\\"stty 2> NUL\\\"\
  \" or\n      \"cmd.exe /s /c \\\"stty 2>&1\\\"\" or\n      \"cmd.exe /c \\\"stty\
  \ 2>&1\\\"\" or\n      \"cmd.exe /s /c \\\"ipconfig /all 2>&1\\\"\" or\n      \"\
  cmd.exe /s /c \\\"echo '%os%'\\\"\" or\n      *.\\\\install\\\\awk.exe*\n    ) or\n\
  \    process.args : (\\(git or (*artisan* and *queue\\:work*) or *rmdir* or \"mode\
  \ CON\" or ver or ls or mode or dir)\n  )"
explanation: Identifies suspicious commands executed via a web server, which may suggest
  a vulnerability and remote shell access.
source: Elastic Detection Rules
