technique_id: T1098.003
technique_name: AWS IAM Roles Anywhere Trust Anchor Created with External CA
tactic: persistence
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset: aws.cloudtrail\n    and event.provider: rolesanywhere.amazonaws.com\n\
  \    and event.action: CreateTrustAnchor\n    and event.outcome: success\n    and\
  \ not aws.cloudtrail.request_parameters: *sourceType=AWS_ACM_PCA*"
explanation: 'Identifies when an AWS IAM Roles Anywhere Trust Anchor with an external
  certificate authority is created. AWS Roles

  Anywhere profiles are legitimate profiles that can be created by administrators
  to allow access from any location. This

  rule detects when a trust anchor is created with an external certificate authority
  that is not managed by AWS

  Certificate Manager Private Certificate Authority (ACM PCA). Adversaries may accomplish
  this to maintain persistence in

  the environment.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/71de53ea-ff3b-11ee-b572-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS IAM
  confidence: high
false_positives:
- description: 'False Positive Analysis:


    - **Legitimate Administrative Actions**: Confirm if the trust anchor creation
    aligns with scheduled updates, development activities, or legitimate administrative
    tasks documented in change management systems.

    - **Consistency Check**: Compare the action against historical data of similar
    actions performed by the user or within the organization. If the action is consistent
    with past legitimate activities, it might indicate a false alarm.

    - **Verify through Outcomes**: Che'
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
- https://ermetic.com/blog/aws/keep-your-iam-users-close-keep-your-third-parties-even-closer-part-1/
- https://docs.aws.amazon.com/rolesanywhere/latest/APIReference/API_CreateTrustAnchor.html
has_investigation_guide: true
risk_score: 47
