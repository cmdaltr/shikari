technique_id: T1547
technique_name: Potential RipZip Attack on Startup Folder
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: a6976974-ea6f-4e97-818e-ea08625c52cb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith: \\explorer.exe\n  TargetFilename|contains|all:\n  - \\Microsoft\\\
  Windows\\Start Menu\\Programs\\Startup\n  - .lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}\n"
explanation: 'Detects a phishing attack which expands a ZIP file containing a malicious
  shortcut.

  If the victim expands the ZIP file via the explorer process, then the explorer process
  expands the malicious ZIP file and drops a malicious shortcut redirected to a backdoor
  into the Startup folder.

  Additionally, the file name of the malicious shortcut in Startup folder contains
  {0AFACED1-E828-11D1-9187-B532F1E9575D} meaning the folder shortcut operation.

  '
false_positives:
- Unknown
