technique_id: T1543.003
technique_name: Sliver C2 Default Service Installation
tactic: persistence
platform: Splunk
connectorId: Splunk
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 31c51af6-e7aa-4da7-84d4-8f32cc580af2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_eid and 1 of\
  \ selection_service_*\nselection_eid:\n  EventID: 7045\n  Provider_Name: Service\
  \ Control Manager\nselection_service_1:\n  ImagePath|re: ^[a-zA-Z]:\\\\windows\\\
  \\temp\\\\[a-zA-Z0-9]{10}\\.exe\nselection_service_2:\n  ServiceName:\n  - Sliver\n\
  \  - Sliver implant\n"
explanation: Detects known malicious service installation that appear in cases in
  which a Sliver implants execute the PsExec commands
false_positives:
- Unknown
references:
- https://github.com/BishopFox/sliver/blob/79f2d48fcdfc2bee4713b78d431ea4b27f733f30/client/command/commands.go#L1231
