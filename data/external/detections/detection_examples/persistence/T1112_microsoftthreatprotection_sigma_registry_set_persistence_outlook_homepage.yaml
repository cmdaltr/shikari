technique_id: T1112
technique_name: Potential Persistence Via Outlook Home Page
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: ddd171b5-2cc6-4975-9e78-f0eccd08cc76
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetObject|contains|all:\n  - \\Software\\Microsoft\\Office\\\n  - \\Outlook\\\
  WebView\\\n  TargetObject|endswith: \\URL\n"
explanation: 'Detects potential persistence activity via outlook home page.

  An attacker can set a home page to achieve code execution and persistence by editing
  the WebView registry keys.

  '
false_positives:
- Unknown
references:
- https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=70
- https://support.microsoft.com/en-us/topic/outlook-home-page-feature-is-missing-in-folder-properties-d207edb7-aa02-46c5-b608-5d9dbed9bd04?ui=en-us&rs=en-us&ad=us
- https://trustedsec.com/blog/specula-turning-outlook-into-a-c2-with-one-registry-change
tags:
- attack.defense-evasion
- attack.persistence
- attack.t1112
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains|all:
    - \Software\Microsoft\Office\
    - \Outlook\WebView\
    TargetObject|endswith: \URL
  condition: selection
