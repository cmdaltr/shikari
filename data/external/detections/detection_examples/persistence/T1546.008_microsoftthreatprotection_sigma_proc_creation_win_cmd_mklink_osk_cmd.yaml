technique_id: T1546.008
technique_name: Potential Privilege Escalation Using Symlink Between Osk and Cmd
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: e9b61244-893f-427c-b287-3e708f321c6b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - mklink\n  - \\osk.exe\n  - \\cmd.exe\n\
  selection_img:\n- Image|endswith: \\cmd.exe\n- OriginalFileName: Cmd.Exe\n"
explanation: Detects the creation of a symbolic link between "cmd.exe" and the accessibility
  on-screen keyboard binary (osk.exe) using "mklink". This technique provides an elevated
  command prompt to the user from the login screen without the need to log in.
false_positives:
- Unknown
references:
- https://github.com/redcanaryco/atomic-red-team/blob/5c1e6f1b4fafd01c8d1ece85f510160fc1275fbf/atomics/T1546.008/T1546.008.md
- https://ss64.com/nt/mklink.html
tags:
