query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - \\ImagePath\n  - \\FailureCommand\n  - \\ServiceDll\n\
  \  CommandLine|contains|all:\n  - ControlSet\n  - services\n  IntegrityLevel:\n\
  \  - Medium\n  - S-1-16-8192\n"
explanation: Detect modification of services configuration (ImagePath, FailureCommand
  and ServiceDLL) in registry by processes with Medium integrity level
