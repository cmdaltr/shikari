query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|contains:\n  - \\AppData\\\n  - C:\\PerfLogs\n  - \\Windows\\System32\\\
  config\\systemprofile\n  TargetFilename|contains: \\Windows\\System32\\Tasks\n"
explanation: Detects the creation of tasks from processes executed from suspicious
  locations
