technique_id: T1547
technique_name: Startup Persistence by a Suspicious Process
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.type != \"deletion\" and\n\
  \  user.domain != \"NT AUTHORITY\" and\n  file.path : (\"C:\\\\Users\\\\*\\\\AppData\\\
  \\Roaming\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\\Startup\\\\*\",\n\
  \               \"C:\\\\ProgramData\\\\Microsoft\\\\Windows\\\\Start Menu\\\\Programs\\\
  \\StartUp\\\\*\") and\n  process.name : (\"cmd.exe\",\n                  \"powershell.exe\"\
  ,\n                  \"wmic.exe\",\n                  \"mshta.exe\",\n         \
  \         \"pwsh.exe\",\n                  \"cscript.exe\",\n                  \"\
  wscript.exe\",\n                  \"regsvr32.exe\",\n                  \"RegAsm.exe\"\
  ,\n                  \"rundll32.exe\",\n                  \"EQNEDT32.EXE\",\n  \
  \                \"WINWORD.EXE\",\n                  \"EXCEL.EXE\",\n          \
  \        \"POWERPNT.EXE\",\n                  \"MSPUB.EXE\",\n                 \
  \ \"MSACCESS.EXE\",\n                  \"iexplore.exe\",\n                  \"InstallUtil.exe\"\
  )"
explanation: 'Identifies files written to or modified in the startup folder by commonly
  abused processes. Adversaries may use this

  technique to maintain persistence.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/440e2db4-bc7f-4c96-a068-65b78da59bde.toml
query_type: eql
