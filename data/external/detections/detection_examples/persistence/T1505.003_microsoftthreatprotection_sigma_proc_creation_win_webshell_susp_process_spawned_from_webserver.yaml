technique_id: T1505.003
technique_name: Suspicious Process By Web Server Process
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 8202070f-edeb-4d31-a010-a26c72ac5600
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_webserver_*\
  \ and selection_anomaly_children and not 1 of\n  filter_main_*\nfilter_main_fp_1:\n\
  \  CommandLine|endswith: Windows\\system32\\cmd.exe /c C:\\ManageEngine\\ADManager\
  \ \"Plus\\ES\\bin\\elasticsearch.bat\n    -Enode.name=RMP-NODE1 -pelasticsearch-pid.txt\n\
  \  ParentImage|endswith: \\java.exe\nfilter_main_fp_2:\n  CommandLine|contains|all:\n\
  \  - sc query\n  - ADManager Plus\n  ParentImage|endswith: \\java.exe\nselection_anomaly_children:\n\
  \  Image|endswith:\n  - \\arp.exe\n  - \\at.exe\n  - \\bash.exe\n  - \\bitsadmin.exe\n\
  \  - \\certutil.exe\n  - \\cmd.exe\n  - \\cscript.exe\n  - \\dsget.exe\n  - \\hostname.exe\n\
  \  - \\nbtstat.exe\n  - \\net.exe\n  - \\net1.exe\n  - \\netdom.exe\n  - \\netsh.exe\n\
  \  - \\nltest.exe\n  - \\ntdsutil.exe\n  - \\powershell_ise.exe\n  - \\powershell.exe\n\
  \  - \\pwsh.exe\n  - \\qprocess.exe\n  - \\query.exe\n  - \\qwinsta.exe\n  - \\\
  reg.exe\n  - \\rundll32.exe\n  - \\sc.exe\n  - \\sh.exe\n  - \\wmic.exe\n  - \\\
  wscript.exe\n  - \\wusa.exe\nselection_webserver_characteristics_tomcat1:\n  ParentImage|contains:\n\
  \  - -tomcat-\n  - \\tomcat\n  ParentImage|endswith:\n  - \\java.exe\n  - \\javaw.exe\n\
  selection_webserver_characteristics_tomcat2:\n  ParentCommandLine|contains:\n  -\
  \ CATALINA_HOME\n  - catalina.home\n  - catalina.jar\n  ParentImage|endswith:\n\
  \  - \\java.exe\n  - \\javaw.exe\nselection_webserver_image:\n  ParentImage|endswith:\n\
  \  - \\caddy.exe\n  - \\httpd.exe\n  - \\nginx.exe\n  - \\php-cgi.exe\n  - \\php.exe\n\
  \  - \\tomcat.exe\n  - \\UMWorkerProcess.exe\n  - \\w3wp.exe\n  - \\ws_TomcatService.exe\n"
explanation: 'Detects potentially suspicious processes being spawned by a web server
  process which could be the result of a successfully placed web shell or exploitation

  '
false_positives:
- Particular web applications may spawn a shell process legitimately
references:
- https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
tags:
- attack.persistence
- attack.initial-access
- attack.t1505.003
- attack.t1190
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - \caddy.exe
    - \httpd.exe
    - \nginx.exe
    - \php-cgi.exe
    - \php.exe
    - \tomcat.exe
    - \UMWorkerProcess.exe
    - \w3wp.exe
    - \ws_TomcatService.exe
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    ParentImage|contains:
    - -tomcat-
    - \tomcat
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    ParentCommandLine|contains:
    - CATALINA_HOME
    - catalina.home
    - catalina.jar
  selection_anomaly_children:
    Image|endswith:
    - \arp.exe
    - \at.exe
    - \bash.exe
    - \bitsadmin.exe
    - \certutil.exe
    - \cmd.exe
    - \cscript.exe
    - \dsget.exe
    - \hostname.exe
    - \nbtstat.exe
    - \net.exe
    - \net1.exe
    - \netdom.exe
    - \netsh.exe
    - \nltest.exe
    - \ntdsutil.exe
    - \powershell_ise.exe
    - \powershell.exe
    - \pwsh.exe
    - \qprocess.exe
    - \query.exe
    - \qwinsta.exe
    - \reg.exe
    - \rundll32.exe
    - \sc.exe
    - \sh.exe
    - \wmic.exe
    - \wscript.exe
    - \wusa.exe
  filter_main_fp_1:
    ParentImage|endswith: \java.exe
    CommandLine|endswith: Windows\system32\cmd.exe /c C:\ManageEngine\ADManager "Plus\ES\bin\elasticsearch.bat
      -Enode.name=RMP-NODE1 -pelasticsearch-pid.txt
  filter_main_fp_2:
    ParentImage|endswith: \java.exe
    CommandLine|contains|all:
    - sc query
    - ADManager Plus
  condition: 1 of selection_webserver_* and selection_anomaly_children and not 1 of
    filter_main_*
