technique_id: T1505.003
technique_name: Certificate Request Export to Exchange Webserver
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.91
validated: true
source: sigma
sigma_id: b7bc7038-638b-4ffd-880c-292c692209ef
level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: keywords_export_command\
  \ and keywords_export_params\nkeywords_export_command:\n  '|all':\n  - New-ExchangeCertificate\n\
  \  - ' -GenerateRequest'\n  - ' -BinaryEncoded'\n  - ' -RequestFile'\nkeywords_export_params:\n\
  - \\\\\\\\localhost\\\\C$\n- \\\\\\\\127.0.0.1\\\\C$\n- C:\\\\inetpub\n- .aspx\n"
explanation: Detects a write of an Exchange CSR to an untypical directory or with
  aspx name suffix which can be used to place a webshell
false_positives:
- Unlikely
references:
- https://twitter.com/GossiTheDog/status/1429175908905127938
tags:
- attack.persistence
- attack.t1505.003
logsource:
  service: msexchange-management
  product: windows
detection:
  keywords_export_command:
    '|all':
    - New-ExchangeCertificate
    - ' -GenerateRequest'
    - ' -BinaryEncoded'
    - ' -RequestFile'
  keywords_export_params:
  - \\\\localhost\\C$
  - \\\\127.0.0.1\\C$
  - C:\\inetpub
  - .aspx
  condition: keywords_export_command and keywords_export_params
