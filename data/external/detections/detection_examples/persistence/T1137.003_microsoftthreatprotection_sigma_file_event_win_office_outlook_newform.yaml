query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith: \\outlook.exe\n  TargetFilename|contains:\n  - \\AppData\\Local\\\
  Microsoft\\FORMS\\IPM\n  - \\Local Settings\\Application Data\\Microsoft\\Forms\n"
explanation: Detects the creation of a new Outlook form which can contain malicious
  code
false_positives:
- Legitimate use of outlook forms
references:
- https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=76
- https://speakerdeck.com/heirhabarov/hunting-for-persistence-via-microsoft-exchange-server-or-outlook?slide=79
