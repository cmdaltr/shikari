    as part of legitimate processes. Users can monitor update schedules and correlate
    alerts with known update activities to verify legitimacy.

    - Some third-party applications install launch agents or daemons to provide background
    services or updates. Users should maintain an inventory of installed applications
    and their expected behaviors to identify benign entries.

    - User-created scripts or autom'
  mitigation: Review investigation guide for details
references:
- https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/CreatingLaunchdJobs.html
