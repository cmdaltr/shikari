technique_id: T1543.001
technique_name: Creation of Hidden Launch Agent or Daemon
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: "file where host.os.type == \"macos\" and event.action == \"launch_daemon\"\
  \ and\n  Persistence.name : \".*\""
explanation: 'Identifies the creation of a hidden launch agent or daemon. An adversary
  may establish persistence by installing a new

  launch agent or daemon which executes at login.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/092b068f-84ac-485d-8a55-7dd9e006715f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


