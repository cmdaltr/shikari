technique_id: T1098.001
technique_name: Microsoft Entra ID Service Principal Credentials Added by Rare User
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset: \"azure.auditlogs\"\n    and azure.auditlogs.operation_name:\"\
  Add service principal credentials\"\n    and event.outcome: \"success\""
explanation: 'Identifies when new Service Principal credentials have been added in
  Microsoft Entra ID. In most organizations,

  credentials will be added to service principals infrequently. Hijacking an application
  (by adding a rogue secret or

  certificate) with granted permissions will allow the attacker to access data that
  is normally protected by MFA

  requirements.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f766ffaf-9568-4909-b734-75d19b35cbf4.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Microsoft Entra ID
  confidence: high
- type: data_source
  value: Microsoft Entra ID Audit Logs
  confidence: high
false_positives:
- description: 'False Positive Analysis

    - Routine Administrative Tasks: This alert may trigger when legitimate administrators
    or DevOps engineers rotate credentials for service principals as part of normal
    operations.

    - First-Time Actions by Known Accounts: If a new user joins the team or an existing
    user is performing this task for the first time in the observed period, it may
    be expected behavior. Verify with the relevant team.


