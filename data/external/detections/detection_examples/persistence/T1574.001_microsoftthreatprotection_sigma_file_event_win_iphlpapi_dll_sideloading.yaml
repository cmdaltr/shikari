query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetFilename|contains|all:\n  - iphlpapi.dll\n  - \\AppData\\Local\\Microsoft\n"
explanation: 'Detects creation of a malicious DLL file in the location where the OneDrive
  or Team applications

  Upon execution of the Teams or OneDrive application, the dropped malicious DLL file
  ("iphlpapi.dll") is sideloaded

  '
