query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_msiexec:\n  Image:\n  - C:\\Windows\\system32\\msiexec.exe\n\
  \  - C:\\Windows\\syswow64\\MsiExec.exe\nselection:\n  TargetObject|endswith:\n\
  \  - \\Control\\Lsa\\Security Packages\n  - \\Control\\Lsa\\OSConfig\\Security Packages\n"
explanation: 'Detects the addition of a SSP to the registry. Upon a reboot or API
  call, SSP DLLs gain access to encrypted and plaintext passwords stored in Windows.

  '
