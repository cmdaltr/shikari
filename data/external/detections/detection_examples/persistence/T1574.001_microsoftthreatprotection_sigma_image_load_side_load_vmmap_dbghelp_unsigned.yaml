technique_id: T1574.001
technique_name: VMMap Unsigned Dbghelp.DLL Potential Sideloading
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 273a8dd8-3742-4302-bcc7-7df5a80fe425
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_signed:\n  Signed: 'true'\nselection:\n  ImageLoaded|contains:\
  \ C:\\Debuggers\\dbghelp.dll\n  Image|endswith:\n  - \\vmmap.exe\n  - \\vmmap64.exe\n"
explanation: Detects potential DLL sideloading of an unsigned dbghelp.dll by the Sysinternals
  VMMap.
false_positives:
- Unknown
references:
- https://techcommunity.microsoft.com/t5/sysinternals-blog/zoomit-v7-1-procdump-2-0-for-linux-process-explorer-v17-05/ba-p/3884766
tags:
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|contains: C:\Debuggers\dbghelp.dll
    Image|endswith:
    - \vmmap.exe
    - \vmmap64.exe
  filter_main_signed:
    Signed: 'true'
  condition: selection and not 1 of filter_main_*
