technique_id: T1546
technique_name: Screensaver Plist File Modified by Unexpected Process
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"macos\" and event.action == \"modification\"\
  \ and\n  file.name like~ \"com.apple.screensaver.*.plist\" and\n   file.path like\
  \ (\n      \"/Users/*/Library/Preferences/ByHost/*\",\n      \"/Library/Managed\
  \ Preferences/*\",\n      \"/System/Library/Preferences/*\"\n      ) and\n  (\n\
  \    process.code_signature.trusted == false or\n    process.code_signature.exists\
  \ == false or\n\n    /* common script interpreters and abused native macOS bins\
  \ */\n    process.name like~ (\n      \"curl\",\n      \"mktemp\",\n      \"tail\"\
  ,\n      \"funzip\",\n      \"python*\",\n      \"osascript\",\n      \"perl\"\n\
  \      )\n   ) and\n\n  /* Filter OS processes modifying screensaver plist files\
  \ */\n  not process.executable like (\n    \"/usr/sbin/cfprefsd\",\n    \"/usr/libexec/xpcproxy\"\
  ,\n    \"/System/Library/CoreServices/ManagedClient.app/Contents/Resources/MCXCompositor\"\
  ,\n    \"/System/Library/CoreServices/ManagedClient.app/Contents/MacOS/ManagedClient\"\
  \n    )"
explanation: 'Identifies when a screensaver plist file is modified by an unexpected
  process. An adversary can maintain persistence on

  a macOS endpoint by creating a malicious screensaver (.saver) file and configuring
  the screensaver plist file to execute

  code each time the screensaver is activated.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e6e8912f-283f-4d0d-8442-e0dcaf49944b.toml
query_type: eql
query_language: eql
indicators:
