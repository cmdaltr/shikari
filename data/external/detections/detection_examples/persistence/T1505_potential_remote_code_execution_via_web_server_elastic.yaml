technique_id: T1505
technique_name: Potential Remote Code Execution via Web Server
tactic: persistence
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  event.action in (\"exec\", \"exec_event\", \"start\") and process.parent.executable\
  \ : (\n  \"/usr/sbin/nginx\", \"/usr/local/sbin/nginx\",\n  \"/usr/sbin/apache\"\
  , \"/usr/local/sbin/apache\",\n  \"/usr/sbin/apache2\", \"/usr/local/sbin/apache2\"\
  ,\n  \"/usr/sbin/php*\", \"/usr/local/sbin/php*\",\n  \"/usr/sbin/lighttpd\", \"\
  /usr/local/sbin/lighttpd\",\n  \"/usr/sbin/hiawatha\", \"/usr/local/sbin/hiawatha\"\
  ,\n  \"/usr/local/bin/caddy\", \n  \"/usr/local/lsws/bin/lswsctrl\",\n  \"*/bin/catalina.sh\"\
  \n) and\nprocess.name : (\n  \"bash\", \"dash\", \"sh\", \"tcsh\", \"csh\", \"zsh\"\
  , \"ksh\", \"fish\", \"python*\", \"php*\", \"perl\", \"ruby\", \"lua*\", \"openssl\"\
  , \"nc\",\n  \"netcat\", \"ncat\", \"telnet\", \"awk\", \"socat\"\n  ) and process.args\
  \ : (\n  \"whoami\", \"id\", \"uname\", \"cat\", \"hostname\", \"ip\", \"curl\"\
  , \"wget\", \"pwd\", \"ls\", \"cd\", \"python*\", \"php*\", \"perl\",\n  \"ruby\"\
  , \"lua*\", \"openssl\", \"nc\", \"netcat\", \"ncat\", \"telnet\", \"awk\", \"socat\"\
  \n  ) and not process.name == \"phpquery\""
explanation: 'Identifies suspicious commands executed via a web server, which may
  suggest a vulnerability and remote shell access.

  Attackers may exploit a vulnerability in a web application to execute commands via
  a web server, or place a backdoor

  file that can be abused to gain code execution as a mechanism for persistence.'
