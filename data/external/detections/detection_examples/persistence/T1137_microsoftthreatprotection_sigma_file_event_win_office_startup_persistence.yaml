technique_id: T1137
technique_name: Potential Persistence Via Microsoft Office Startup Folder
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.89
validated: true
source: sigma
sigma_id: 0e20c89d-2264-44ae-8238-aeeaba609ece
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (all of selection_word_*\
  \ or all of selection_excel_*) and not filter_main_office\nfilter_main_office:\n\
  \  Image|endswith:\n  - \\WINWORD.exe\n  - \\EXCEL.exe\nselection_excel_extension:\n\
  \  TargetFilename|endswith:\n  - .xls\n  - .xlsm\n  - .xlsx\n  - .xlt\n  - .xltm\n\
  selection_excel_paths:\n- TargetFilename|contains: \\Microsoft\\Excel\\XLSTART\n\
  - TargetFilename|contains|all:\n  - \\Office\n  - \\Program Files\n  - \\XLSTART\n\
  selection_word_extension:\n  TargetFilename|endswith:\n  - .doc\n  - .docm\n  -\
  \ .docx\n  - .dot\n  - .dotm\n  - .rtf\nselection_word_paths:\n- TargetFilename|contains:\
  \ \\Microsoft\\Word\\STARTUP\n- TargetFilename|contains|all:\n  - \\Office\n  -\
  \ \\Program Files\n  - \\STARTUP\n"
explanation: Detects creation of Microsoft Office files inside of one of the default
  startup folders in order to achieve persistence.
false_positives:
- Loading a user environment from a backup or a domain controller
- Synchronization of templates
references:
- https://insight-jp.nttsecurity.com/post/102hojk/operation-restylink-apt-campaign-targeting-japanese-companies
- https://learn.microsoft.com/en-us/office/troubleshoot/excel/use-startup-folders
tags:
- attack.persistence
- attack.t1137
logsource:
  category: file_event
  product: windows
detection:
  selection_word_paths:
  - TargetFilename|contains: \Microsoft\Word\STARTUP
  - TargetFilename|contains|all:
    - \Office
    - \Program Files
    - \STARTUP
  selection_word_extension:
    TargetFilename|endswith:
    - .doc
    - .docm
    - .docx
    - .dot
    - .dotm
    - .rtf
  selection_excel_paths:
  - TargetFilename|contains: \Microsoft\Excel\XLSTART
  - TargetFilename|contains|all:
    - \Office
    - \Program Files
    - \XLSTART
  selection_excel_extension:
    TargetFilename|endswith:
    - .xls
    - .xlsm
    - .xlsx
    - .xlt
    - .xltm
  filter_main_office:
    Image|endswith:
    - \WINWORD.exe
    - \EXCEL.exe
  condition: (all of selection_word_* or all of selection_excel_*) and not filter_main_office
