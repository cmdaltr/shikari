technique_id: T1133
technique_name: Unusual File Deletion by Dns.exe
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 8f0b1fb1-9bd4-4e74-8cdf-a8de4d2adfd0
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  TargetFilename|endswith: \\dns.log\nselection:\n  Image|endswith: \\\
  dns.exe\n"
explanation: Detects an unexpected file being deleted by dns.exe which my indicate
  activity related to remote code execution or other forms of exploitation as seen
  in CVE-2020-1350 (SigRed)
false_positives:
- Unknown
references:
- https://www.elastic.co/guide/en/security/current/unusual-file-modification-by-dns-exe.html
tags:
