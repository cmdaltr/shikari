technique_id: T1546.009
technique_name: Registry Persistence via AppCert DLL
tactic: persistence
platform: Elastic
fidelity_score: 0.88
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.path : \"*\\\\SYSTEM\\\\*ControlSet*\\\\Control\\\\Session Manager\\\
  \\AppCertDLLs\\\\*\""
explanation: 'Detects attempts to maintain persistence by creating registry keys using
  AppCert DLLs. AppCert DLLs are loaded by every

  process using the common API functions to create processes.'
source: Elastic Detection Rules
