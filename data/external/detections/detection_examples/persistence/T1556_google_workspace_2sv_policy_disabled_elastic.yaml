technique_id: T1556
technique_name: Google Workspace 2SV Policy Disabled
tactic: persistence
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:"google_workspace.login" and event.action:"2sv_disable"
explanation: 'Google Workspace admins may setup 2-step verification (2SV) to add an
  extra layer of security to user accounts by asking

  users to verify their identity when they use login credentials. Admins have the
  ability to enforce 2SV from the admin

  console as well as the methods acceptable for verification and enrollment period.
  2SV requires enablement on admin

  accounts prior to it being enabled for users within organization units. Adversaries
  may disable 2SV to lower the

  security requirements to access a valid account.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5e161522-2545-11ed-ac47-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Google Workspace
  confidence: high
false_positives:
- description: 'False positive analysis


    - After finding the user account that updated the password policy, verify whether
    the action was intentional.

    - Verify whether the user should have Google Workspace administrative privileges
    that allow them to modify password policies.

    - Review organizational units or groups the role may have been added to and ensure
    its privileges are properly aligned.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

