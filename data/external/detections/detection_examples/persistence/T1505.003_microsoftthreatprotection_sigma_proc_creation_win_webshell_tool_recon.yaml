technique_id: T1505.003
technique_name: Webshell Tool Reconnaissance Activity
tactic: persistence
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: f64e5c19-879c-4bae-b471-6d84c8339677
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_webserver_*\
  \ and selection_recon\nselection_recon:\n  CommandLine|contains:\n  - perl --help\n\
  \  - perl -h\n  - python --help\n  - python -h\n  - python3 --help\n  - python3\
  \ -h\n  - wget --help\nselection_webserver_characteristics_tomcat1:\n  ParentImage|contains:\n\
  \  - -tomcat-\n  - \\tomcat\n  ParentImage|endswith:\n  - \\java.exe\n  - \\javaw.exe\n\
  selection_webserver_characteristics_tomcat2:\n  CommandLine|contains:\n  - CATALINA_HOME\n\
  \  - catalina.jar\n  ParentImage|endswith:\n  - \\java.exe\n  - \\javaw.exe\nselection_webserver_image:\n\
  \  ParentImage|endswith:\n  - \\caddy.exe\n  - \\httpd.exe\n  - \\nginx.exe\n  -\
  \ \\php-cgi.exe\n  - \\w3wp.exe\n  - \\ws_tomcatservice.exe\n"
explanation: 'Detects processes spawned from web servers (PHP, Tomcat, IIS, etc.)
  that perform reconnaissance looking for the existence of popular scripting tools
  (perl, python, wget) on the system via the help commands

  '
false_positives:
- Unknown
references:
- https://ragged-lab.blogspot.com/2020/07/webshells-automating-reconnaissance.html
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_webserver_image:
    ParentImage|endswith:
    - \caddy.exe
    - \httpd.exe
    - \nginx.exe
    - \php-cgi.exe
    - \w3wp.exe
    - \ws_tomcatservice.exe
  selection_webserver_characteristics_tomcat1:
    ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    ParentImage|contains:
    - -tomcat-
    - \tomcat
  selection_webserver_characteristics_tomcat2:
    ParentImage|endswith:
    - \java.exe
    - \javaw.exe
    CommandLine|contains:
    - CATALINA_HOME
    - catalina.jar
  selection_recon:
    CommandLine|contains:
    - perl --help
    - perl -h
    - python --help
    - python -h
    - python3 --help
    - python3 -h
    - wget --help
  condition: 1 of selection_webserver_* and selection_recon
metadata:
