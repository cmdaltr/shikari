technique_id: T1595
technique_name: PUA - PingCastle Execution From Potentially Suspicious Parent
tactic: reconnaissance
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: b37998de-a70b-4f33-b219-ec36bf433dc0
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_parent_*\
  \ and selection_parent_ext and selection_cli\nselection_cli:\n- Image|endswith:\
  \ \\PingCastle.exe\n- OriginalFileName: PingCastle.exe\n- Product: Ping Castle\n\
  - CommandLine|contains:\n  - --scanner aclcheck\n  - --scanner antivirus\n  - --scanner\
  \ computerversion\n  - --scanner foreignusers\n  - --scanner laps_bitlocker\n  -\
  \ --scanner localadmin\n  - --scanner nullsession\n  - --scanner nullsession-trust\n\
  \  - --scanner oxidbindings\n  - --scanner remote\n  - --scanner share\n  - --scanner\
  \ smb\n  - --scanner smb3querynetwork\n  - --scanner spooler\n  - --scanner startup\n\
  \  - --scanner zerologon\n- CommandLine|contains: --no-enum-limit\n- CommandLine|contains|all:\n\
  \  - --healthcheck\n  - --level Full\n- CommandLine|contains|all:\n  - --healthcheck\n\
  \  - '--server '\nselection_parent_ext:\n  ParentCommandLine|contains:\n  - .bat\n\
  \  - .chm\n  - .cmd\n  - .hta\n  - .htm\n  - .html\n  - .js\n  - .lnk\n  - .ps1\n\
  \  - .vbe\n  - .vbs\n  - .wsf\nselection_parent_path_1:\n  ParentCommandLine|contains:\n\
  \  - :\\Perflogs\\\n  - :\\Temp\\\n  - :\\Users\\Public\\\n  - :\\Windows\\Temp\\\
  \n  - \\AppData\\Local\\Temp\n  - \\AppData\\Roaming\\\n  - \\Temporary Internet\n\
  selection_parent_path_2:\n- ParentCommandLine|contains|all:\n  - :\\Users\\\n  -\
  \ \\Favorites\\\n- ParentCommandLine|contains|all:\n  - :\\Users\\\n  - \\Favourites\\\
  \n- ParentCommandLine|contains|all:\n  - :\\Users\\\n  - \\Contacts\\\n"
explanation: 'Detects the execution of PingCastle, a tool designed to quickly assess
  the Active Directory security level via a script located in a potentially suspicious
  or uncommon location.

  '
false_positives:
- Unknown
references:
- https://github.com/vletoux/pingcastle
- https://thedfirreport.com/2023/10/30/netsupport-intrusion-results-in-domain-compromise/
- https://github.com/fengjixuchui/Start-ADEnum/blob/e237a739db98b6104427d833004836507da36a58/Functions/Start-ADEnum.ps1#L450
- https://github.com/lkys37en/Start-ADEnum/blob/5b42c54215fe5f57fc59abc52c20487d15764005/Functions/Start-ADEnum.ps1#L680
- https://github.com/projectHULK/AD_Recon/blob/dde2daba9b3393a9388cbebda87068972cc0bd3b/SecurityAssessment.ps1#L2699
- https://github.com/802-1x/Compliance/blob/2e53df8b6e89686a0b91116b3f42c8f717dca820/Ping%20Castle/Get-PingCastle-HTMLComplianceReport.ps1#L8
- https://github.com/EvotecIT/TheDashboard/blob/481a9ce8f82f2fd55fe65220ee6486bae6df0c9d/Examples/RunReports/PingCastle.ps1
tags:
- attack.reconnaissance
- attack.t1595
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_ext:
    ParentCommandLine|contains:
    - .bat
    - .chm
    - .cmd
    - .hta
    - .htm
    - .html
    - .js
    - .lnk
    - .ps1
    - .vbe
    - .vbs
    - .wsf
  selection_parent_path_1:
    ParentCommandLine|contains:
    - :\Perflogs\
    - :\Temp\
    - :\Users\Public\
    - :\Windows\Temp\
    - \AppData\Local\Temp
    - \AppData\Roaming\
    - \Temporary Internet
  selection_parent_path_2:
  - ParentCommandLine|contains|all:
    - :\Users\
    - \Favorites\
  - ParentCommandLine|contains|all:
    - :\Users\
    - \Favourites\
  - ParentCommandLine|contains|all:
    - :\Users\
    - \Contacts\
  selection_cli:
  - Image|endswith: \PingCastle.exe
  - OriginalFileName: PingCastle.exe
  - Product: Ping Castle
  - CommandLine|contains:
    - --scanner aclcheck
    - --scanner antivirus
    - --scanner computerversion
    - --scanner foreignusers
    - --scanner laps_bitlocker
    - --scanner localadmin
    - --scanner nullsession
    - --scanner nullsession-trust
    - --scanner oxidbindings
    - --scanner remote
    - --scanner share
    - --scanner smb
    - --scanner smb3querynetwork
    - --scanner spooler
    - --scanner startup
    - --scanner zerologon
  - CommandLine|contains: --no-enum-limit
  - CommandLine|contains|all:
    - --healthcheck
    - --level Full
  - CommandLine|contains|all:
    - --healthcheck
    - '--server '
  condition: 1 of selection_parent_* and selection_parent_ext and selection_cli
