sigma_id: 724ea201-6514-4f38-9739-e5973c34f49a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_default:\n  Details: '%SystemRoot%'\nselection:\n \
  \ TargetObject|endswith: \\Environment\\windir\n"
explanation: 'Detects the setting of the environement variable "windir" to a non default
  value.

  Attackers often abuse this variable in order to trigger a UAC bypass via the "SilentCleanup"
  task.

  The SilentCleanup task located in %windir%\system32\cleanmgr.exe is an auto-elevated
  task that can be abused to elevate any file with administrator privileges without
  prompting UAC.

  '
