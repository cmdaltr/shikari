query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ScriptBlockText|contains: System.IdentityModel.Tokens.KerberosRequestorSecurityToken\n"
explanation: 'utilize native PowerShell Identity modules to query the domain to extract
  the Service Principal Names for a single computer.

  This behavior is typically used during a kerberos or silver ticket attack.

  A successful execution will output the SPNs for the endpoint in question.

  '
