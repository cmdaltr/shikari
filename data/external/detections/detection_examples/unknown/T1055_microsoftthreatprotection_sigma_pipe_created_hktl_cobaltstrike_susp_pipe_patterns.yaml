technique_id: T1055
technique_name: CobaltStrike Named Pipe Patterns
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.87
validated: true
source: sigma
sigma_id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_malleable_profile_*\
  \ and not 1 of filter_main_* and not 1\n  of filter_optional_*\nfilter_main_generic:\n\
  \  PipeName:\n  - \\wkssvc\n  - \\spoolss\n  - \\scerpc\n  - \\ntsvcs\n  - \\SearchTextHarvester\n\
  \  - \\PGMessagePipe\n  - \\MsFteWds\nfilter_optional_websense:\n  Image|contains:\n\
  \  - :\\Program Files\\Websense\\\n  - :\\Program Files (x86)\\Websense\\\n  PipeName|startswith:\n\
  \  - \\DserNamePipeR\n  - \\DserNamePipeW\nselection_malleable_profile_catalog_change_listener:\n\
  \  PipeName|endswith: -0,\n  PipeName|startswith: \\Winsock2\\CatalogChangeListener-\n\
  selection_malleable_profile_generic:\n- PipeName|startswith:\n  - \\DserNamePipe\n\
  \  - \\f4c3\n  - \\f53f\n  - \\fullduplex_\n  - \\mojo.5688.8052.183894939787088877\n\
  \  - \\mojo.5688.8052.35780273329370473\n  - \\MsFteWds\n  - \\msrpc_\n  - \\mypipe-f\n\
  \  - \\mypipe-h\n  - \\ntsvcs\n  - \\PGMessagePipe\n  - \\rpc_\n  - \\scerpc\n \
  \ - \\SearchTextHarvester\n  - \\spoolss\n  - \\win_svc\n  - \\win\\msrpc_\n  -\
  \ \\windows.update.manager\n  - \\wkssvc\n- PipeName:\n  - \\demoagent_11\n  - \\\
  demoagent_22\n"
explanation: Detects the creation of a named pipe with a pattern found in CobaltStrike
  malleable C2 profiles
false_positives:
- Chrome instances using the exact same pipe name "mojo.xxx"
- Websense Endpoint using the pipe name "DserNamePipe(R|W)\d{1,5}"
references:
- https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575
- https://gist.github.com/MHaggis/6c600e524045a6d49c35291a21e10752
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055
- stp.1k
logsource:
  product: windows
  category: pipe_created
  definition: Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular You can also use other repo, e.g.
    https://github.com/Neo23x0/sysmon-config, https://github.com/olafhartong/sysmon-modular.
    How to test detection? You can always use Cobalt Strike, but also you can check
    powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575
detection:
  selection_malleable_profile_generic:
  - PipeName|startswith:
    - \DserNamePipe
    - \f4c3
    - \f53f
    - \fullduplex_
    - \mojo.5688.8052.183894939787088877
    - \mojo.5688.8052.35780273329370473
    - \MsFteWds
    - \msrpc_
    - \mypipe-f
    - \mypipe-h
    - \ntsvcs
    - \PGMessagePipe
    - \rpc_
    - \scerpc
    - \SearchTextHarvester
    - \spoolss
    - \win_svc
    - \win\msrpc_
    - \windows.update.manager
    - \wkssvc
  - PipeName:
    - \demoagent_11
    - \demoagent_22
  selection_malleable_profile_catalog_change_listener:
    PipeName|startswith: \Winsock2\CatalogChangeListener-
    PipeName|endswith: -0,
  filter_main_generic:
    PipeName:
    - \wkssvc
    - \spoolss
    - \scerpc
    - \ntsvcs
    - \SearchTextHarvester
    - \PGMessagePipe
    - \MsFteWds
  filter_optional_websense:
    Image|contains:
    - :\Program Files\Websense\
    - :\Program Files (x86)\Websense\
    PipeName|startswith:
    - \DserNamePipeR
    - \DserNamePipeW
  condition: 1 of selection_malleable_profile_* and not 1 of filter_main_* and not
    1 of filter_optional_*
