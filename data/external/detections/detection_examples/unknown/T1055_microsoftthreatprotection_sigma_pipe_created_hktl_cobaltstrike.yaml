technique_id: T1055
technique_name: CobaltStrike Named Pipe
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.95
validated: true
source: sigma
sigma_id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection_MSSE:\n\
  \  PipeName|contains|all:\n  - \\MSSE-\n  - -server\nselection_interprocess:\n \
  \ PipeName|startswith: \\interprocess_\nselection_lsarpc:\n  PipeName|startswith:\
  \ \\lsarpc_\nselection_mojo:\n  PipeName|startswith: \\mojo_\nselection_msagent:\n\
  \  PipeName|startswith: \\msagent_\nselection_netlogon:\n  PipeName|startswith:\
  \ \\netlogon_\nselection_postex:\n  PipeName|startswith: \\postex_\nselection_samr:\n\
  \  PipeName|startswith: \\samr_\nselection_srvsvc:\n  PipeName|startswith: \\srvsvc_\n\
  selection_status:\n  PipeName|startswith: \\status_\nselection_wkssvc:\n  PipeName|startswith:\
  \ \\wkssvc_\n"
explanation: Detects the creation of a named pipe as used by CobaltStrike
false_positives:
- Unknown
references:
- https://twitter.com/d4rksystem/status/1357010969264873472
- https://labs.f-secure.com/blog/detecting-cobalt-strike-default-modules-via-named-pipe-analysis/
- https://github.com/SigmaHQ/sigma/issues/253
- https://blog.cobaltstrike.com/2021/02/09/learn-pipe-fitting-for-all-of-your-offense-projects/
- https://redcanary.com/threat-detection-report/threats/cobalt-strike/
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055
logsource:
  product: windows
  category: pipe_created
  definition: Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    always use Cobalt Strike, but also you can check powershell script from this site
    https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575
detection:
  selection_MSSE:
    PipeName|contains|all:
    - \MSSE-
    - -server
  selection_postex:
    PipeName|startswith: \postex_
  selection_status:
    PipeName|startswith: \status_
  selection_msagent:
    PipeName|startswith: \msagent_
  selection_mojo:
    PipeName|startswith: \mojo_
  selection_interprocess:
    PipeName|startswith: \interprocess_
  selection_samr:
    PipeName|startswith: \samr_
  selection_netlogon:
    PipeName|startswith: \netlogon_
  selection_srvsvc:
    PipeName|startswith: \srvsvc_
  selection_lsarpc:
    PipeName|startswith: \lsarpc_
  selection_wkssvc:
    PipeName|startswith: \wkssvc_
  condition: 1 of selection*
