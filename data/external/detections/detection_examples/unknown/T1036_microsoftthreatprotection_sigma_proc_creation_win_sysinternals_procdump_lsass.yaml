logsource:
  category: process_creation
  product: windows
detection:
  selection_flags:
    CommandLine|contains|windash:
    - ' -ma '
    - ' -mm '
    - ' -mp '
  selection_process:
    CommandLine|contains:
    - ' ls'
    - ' keyiso'
    - ' samss'
  condition: all of selection_*
