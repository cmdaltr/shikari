technique_id: T1105
technique_name: Suspicious Desktopimgdownldr Command
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: bb58aa4a-b80b-415a-a2c0-2f65a4c81009
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: ( selection1 and not\
  \ selection1_filter ) or selection_reg\nselection1:\n  CommandLine|contains: ' /lockscreenurl:'\n\
  selection1_filter:\n  CommandLine|contains:\n  - .jpg\n  - .jpeg\n  - .png\nselection_reg:\n\
  \  CommandLine|contains|all:\n  - reg delete\n  - \\PersonalizationCSP\n"
explanation: Detects a suspicious Microsoft desktopimgdownldr execution with parameters
  used to download files from the Internet
false_positives:
- False positives depend on scripts and administrative tools used in the monitored
  environment
references:
- https://labs.sentinelone.com/living-off-windows-land-a-new-native-file-downldr/
- https://twitter.com/SBousseaden/status/1278977301745741825
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains: ' /lockscreenurl:'
  selection1_filter:
    CommandLine|contains:
    - .jpg
    - .jpeg
    - .png
  selection_reg:
    CommandLine|contains|all:
    - reg delete
    - \PersonalizationCSP
  condition: ( selection1 and not selection1_filter ) or selection_reg
