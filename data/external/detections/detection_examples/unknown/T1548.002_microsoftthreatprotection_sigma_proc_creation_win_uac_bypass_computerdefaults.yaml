query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ParentImage|contains:\n  - :\\Windows\\System32\n  - :\\Program Files\n\
  selection:\n  Image: C:\\Windows\\System32\\ComputerDefaults.exe\n  IntegrityLevel:\n\
  \  - High\n  - System\n  - S-1-16-16384\n  - S-1-16-12288\n"
explanation: Detects tools such as UACMe used to bypass UAC with computerdefaults.exe
  (UACMe 59)
