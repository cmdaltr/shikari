query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli_flag:\n  CommandLine|contains:\n  - ' save '\n  - ' export '\n  -\
  \ \" \\u02E2ave \"\n  - \" e\\u02E3port \"\nselection_cli_hive:\n  CommandLine|contains:\n\
  \  - \\system\n  - \\sam\n  - \\security\n  - \"\\\\\\u02E2ystem\"\n  - \"\\\\sy\\\
  u02E2tem\"\n  - \"\\\\\\u02E2y\\u02E2tem\"\n  - \"\\\\\\u02E2am\"\n  - \"\\\\\\\
  u02E2ecurity\"\nselection_cli_hklm:\n  CommandLine|contains:\n  - hklm\n  - \"hk\\\
  u02EAm\"\n  - hkey_local_machine\n  - \"hkey_\\u02EAocal_machine\"\n  - \"hkey_loca\\\
  u02EA_machine\"\n  - \"hkey_\\u02EAoca\\u02EA_machine\"\nselection_img:\n- Image|endswith:\
  \ \\reg.exe\n- OriginalFileName: reg.exe\n"
explanation: Detects the usage of "reg.exe" in order to dump sensitive registry hives.
  This includes SAM, SYSTEM and SECURITY hives.
false_positives:
- Dumping hives for legitimate purpouse i.e. backup or forensic investigation
