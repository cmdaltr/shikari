technique_id: T1071.001
technique_name: Renamed Visual Studio Code Tunnel Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 2cf29f11-e356-4f61-98c0-1bdb9393d6da
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (1 of selection_image_*\
  \ and not 1 of filter_main_image_*) or (selection_parent_tunnel\n  and not 1 of\
  \ filter_main_parent_*)\nfilter_main_image_code:\n  Image|endswith:\n  - \\code-tunnel.exe\n\
  \  - \\code.exe\nfilter_main_parent_code:\n  ParentImage|endswith:\n  - \\code-tunnel.exe\n\
  \  - \\code.exe\nselection_image_only_tunnel:\n  CommandLine|endswith: .exe tunnel\n\
  \  OriginalFileName: null\nselection_image_tunnel_args:\n  CommandLine|contains|all:\n\
  \  - .exe tunnel\n  - --accept-server-license-terms\nselection_image_tunnel_service:\n\
  \  CommandLine|contains|all:\n  - 'tunnel '\n  - service\n  - internal-run\n  -\
  \ tunnel-service.log\nselection_parent_tunnel:\n  CommandLine|contains|all:\n  -\
  \ '/d /c '\n  - \\servers\\Stable-\n  - code-server.cmd\n  Image|endswith: \\cmd.exe\n\
  \  ParentCommandLine|endswith: ' tunnel'\n"
explanation: Detects renamed Visual Studio Code tunnel execution. Attackers can abuse
  this functionality to establish a C2 channel
false_positives:
- Unknown
references:
- https://ipfyx.fr/post/visual-studio-code-tunnel/
- https://badoption.eu/blog/2023/01/31/code_c2.html
- https://code.visualstudio.com/docs/remote/tunnels
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_image_only_tunnel:
    OriginalFileName: null
    CommandLine|endswith: .exe tunnel
  selection_image_tunnel_args:
    CommandLine|contains|all:
    - .exe tunnel
    - --accept-server-license-terms
  selection_image_tunnel_service:
    CommandLine|contains|all:
    - 'tunnel '
    - service
    - internal-run
    - tunnel-service.log
  selection_parent_tunnel:
    ParentCommandLine|endswith: ' tunnel'
    Image|endswith: \cmd.exe
    CommandLine|contains|all:
    - '/d /c '
    - \servers\Stable-
    - code-server.cmd
  filter_main_parent_code:
    ParentImage|endswith:
    - \code-tunnel.exe
    - \code.exe
  filter_main_image_code:
    Image|endswith:
    - \code-tunnel.exe
    - \code.exe
  condition: (1 of selection_image_* and not 1 of filter_main_image_*) or (selection_parent_tunnel
    and not 1 of filter_main_parent_*)
metadata:
