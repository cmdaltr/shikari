technique_id: T1552.002
technique_name: Registry Export of Third-Party Credentials
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: cc1abf27-78a3-4ac5-a51c-f3070b1d8e40
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli_path:\n  CommandLine|contains:\n  - \\Software\\Aerofox\\Foxmail\\\
  V3.1\n  - \\Software\\Aerofox\\FoxmailPreview\n  - \\Software\\DownloadManager\\\
  Passwords\n  - \\Software\\FTPWare\\COREFTP\\Sites\n  - \\Software\\IncrediMail\\\
  Identities\n  - \\Software\\Martin Prikryl\\WinSCP 2\\Sessions\n  - \\Software\\\
  Mobatek\\MobaXterm\n  - \\Software\\OpenSSH\\Agent\\Keys\n  - \\Software\\OpenVPN-GUI\\\
  configs\n  - \\Software\\ORL\\WinVNC3\\Password\n  - \\Software\\Qualcomm\\Eudora\\\
  CommandLine\n  - \\Software\\RealVNC\\WinVNC4\n  - \\Software\\RimArts\\B2\\Settings\n\
  \  - \\Software\\SimonTatham\\PuTTY\\Sessions\n  - \\Software\\SimonTatham\\PuTTY\\\
  SshHostKeys\n  - \\Software\\Sota\\FFFTP\n  - \\Software\\TightVNC\\Server\n  -\
  \ \\Software\\WOW6432Node\\Radmin\\v3.0\\Server\\Parameters\\Radmin\nselection_cli_save:\n\
  \  CommandLine|contains:\n  - save\n  - export\nselection_img:\n- Image|endswith:\
  \ \\reg.exe\n- OriginalFileName: reg.exe\n"
explanation: 'Detects the use of reg.exe to export registry paths associated with
  third-party credentials.

  Credential stealers have been known to use this technique to extract sensitive information
  from the registry.

  '
false_positives:
- Unknown
references:
- https://www.virustotal.com/gui/file/fdc86a5b3d7df37a72c3272836f743747c47bfbc538f05af9ecf78547fa2e789/behavior
