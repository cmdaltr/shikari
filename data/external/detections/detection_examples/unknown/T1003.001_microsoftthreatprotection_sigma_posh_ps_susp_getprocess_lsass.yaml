technique_id: T1003.001
technique_name: PowerShell Get-Process LSASS in ScriptBlock
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 84c174ab-d3ef-481f-9c86-a50d0b8e3edb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ScriptBlockText|contains: Get-Process lsass\n"
explanation: Detects a Get-Process command on lsass process, which is in almost all
  cases a sign of malicious activity
false_positives:
- Legitimate certificate exports invoked by administrators or users (depends on processes
  in the environment - filter if unusable)
references:
- https://web.archive.org/web/20220205033028/https://twitter.com/PythonResponder/status/1385064506049630211
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains: Get-Process lsass
  condition: selection
