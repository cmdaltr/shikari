query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_AppLockerPolicyTest:\n  Image: C:\\Windows\\\
  System32\\dllhost.exe\n  TargetFilename|contains|all:\n  - :\\Users\\\n  - \\AppData\\\
  Local\\Temp\\__PSScriptPolicyTest_\n  TargetFilename|endswith: .ps1\nfilter_main_clipchamp:\n\
  \  Image: C:\\Windows\\system32\\svchost.exe\n  TargetFilename|contains|all:\n \
  \ - C:\\Program Files\\WindowsApps\\Clipchamp\n  - .ps1\nfilter_main_powershell_preview:\n\
  \  Image:\n  - C:\\Windows\\system32\\svchost.exe\n  - C:\\Windows\\SysWOW64\\svchost.exe\n\
  \  TargetFilename|endswith: .ps1\n  TargetFilename|startswith:\n  - C:\\Program\
  \ Files\\WindowsApps\\Microsoft.PowerShellPreview\n  - C:\\Program Files (x86)\\\
  WindowsApps\\Microsoft.PowerShellPreview\nfilter_main_script_gpo_machine:\n  Image:\
  \ C:\\Windows\\system32\\svchost.exe\n  TargetFilename|contains|all:\n  - C:\\Windows\\\
  System32\\GroupPolicy\\DataStore\\\n  - \\sysvol\\\n  - \\Policies\\\n  - \\Machine\\\
  Scripts\\Startup\\\n  TargetFilename|endswith:\n  - .ps1\n  - .bat\nselection_generic:\n\
  \  Image|endswith:\n  - \\csrss.exe\n  - \\lsass.exe\n  - \\RuntimeBroker.exe\n\
  \  - \\sihost.exe\n  - \\smss.exe\n  - \\wininit.exe\n  - \\winlogon.exe\n  TargetFilename|endswith:\n\
  \  - .bat\n  - .dll\n  - .exe\n  - .hta\n  - .iso\n  - .ps1\n  - .txt\n  - .vbe\n\
  \  - .vbs\nselection_special:\n  Image|endswith:\n  - \\dllhost.exe\n  - \\rundll32.exe\n\
  \  - \\svchost.exe\n  TargetFilename|endswith:\n  - .bat\n  - .hta\n  - .iso\n \
  \ - .ps1\n  - .vbe\n  - .vbs\n"
explanation: Detects Windows executables that write files with suspicious extensions
