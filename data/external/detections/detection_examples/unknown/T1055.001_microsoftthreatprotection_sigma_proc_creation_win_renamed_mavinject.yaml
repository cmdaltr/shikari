query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Image|endswith:\n  - \\mavinject32.exe\n  - \\mavinject64.exe\nselection:\n\
  \  OriginalFileName:\n  - mavinject32.exe\n  - mavinject64.exe\n"
explanation: Detects the execution of a renamed version of the "Mavinject" process.
  Which can be abused to perform process injection using the "/INJECTRUNNING" flag
