technique_id: T1021.002
technique_name: Suspicious PsExec Execution - Zeek
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: f1b3a22a-45e6-4004-afb5-4291f9c21166
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  name|startswith: PSEXESVC\nselection:\n  name|endswith:\n  - -stdin\n\
  \  - -stdout\n  - -stderr\n  path|contains|all:\n  - \\\\\n  - \\IPC$\n"
explanation: detects execution of psexec or paexec with renamed service name, this
  rule helps to filter out the noise if psexec is used for legit purposes or if attacker
  uses a different psexec client other than sysinternal one
false_positives:
- Unknown
references:
- https://web.archive.org/web/20230329171218/https://blog.menasec.net/2019/02/threat-hunting-3-detecting-psexec.html
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: zeek
  service: smb_files
detection:
  selection:
    path|contains|all:
    - \\
    - \IPC$
    name|endswith:
    - -stdin
    - -stdout
    - -stderr
  filter:
    name|startswith: PSEXESVC
  condition: selection and not filter
