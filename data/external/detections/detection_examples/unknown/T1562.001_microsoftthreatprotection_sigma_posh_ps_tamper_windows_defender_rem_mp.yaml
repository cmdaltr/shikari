technique_id: T1562.001
technique_name: Tamper Windows Defender Remove-MpPreference - ScriptBlockLogging
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: ae2bdd58-0681-48ac-be7f-58ab4e593458
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_remove:\n  ScriptBlockText|contains: Remove-MpPreference\nselection_tamper:\n\
  \  ScriptBlockText|contains:\n  - '-ControlledFolderAccessProtectedFolders '\n \
  \ - '-AttackSurfaceReductionRules_Ids '\n  - '-AttackSurfaceReductionRules_Actions\
  \ '\n  - '-CheckForSignaturesBeforeRunningScan '\n"
explanation: Detects attempts to remove Windows Defender configuration using the 'MpPreference'
  cmdlet
false_positives:
- Legitimate PowerShell scripts
references:
- https://techcommunity.microsoft.com/t5/core-infrastructure-and-security/windows-10-controlled-folder-access-event-search/ba-p/2326088
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_remove:
    ScriptBlockText|contains: Remove-MpPreference
  selection_tamper:
    ScriptBlockText|contains:
    - '-ControlledFolderAccessProtectedFolders '
    - '-AttackSurfaceReductionRules_Ids '
    - '-AttackSurfaceReductionRules_Actions '
    - '-CheckForSignaturesBeforeRunningScan '
  condition: all of selection_*
