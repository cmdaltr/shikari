technique_id: T1003.002
technique_name: Copying Sensitive Files with Credential Data
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: e7be6119-fc37-43f0-ad4f-1f3f99be2f9f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_esent_*\
  \ or selection_susp_paths\nselection_esent_cli:\n  CommandLine|contains|windash:\n\
  \  - vss\n  - ' /m '\n  - ' /y '\nselection_esent_img:\n- Image|endswith: \\esentutl.exe\n\
  - OriginalFileName: \\esentutl.exe\nselection_susp_paths:\n  CommandLine|contains:\n\
  \  - \\config\\RegBack\\sam\n  - \\config\\RegBack\\security\n  - \\config\\RegBack\\\
  system\n  - \\config\\sam\n  - \\config\\security\n  - '\\config\\system '\n  -\
  \ \\repair\\sam\n  - \\repair\\security\n  - \\repair\\system\n  - \\windows\\ntds\\\
  ntds.dit\n"
explanation: Files with well-known filenames (sensitive files with credential data)
  copying
false_positives:
- Copying sensitive files for legitimate use (eg. backup) or forensic investigation
  by legitimate incident responder or forensic investigator.
references:
- https://room362.com/post/2013/2013-06-10-volume-shadow-copy-ntdsdit-domain-hashes-remotely-part-1/
- https://www.slideshare.net/heirhabarov/hunting-for-credentials-dumping-in-windows-environment
- https://dfironthemountain.wordpress.com/2018/12/06/locked-file-access-using-esentutl-exe/
- https://github.com/LOLBAS-Project/LOLBAS/blob/2cc01b01132b5c304027a658c698ae09dd6a92bf/yml/OSBinaries/Esentutl.yml
tags:
- attack.credential-access
- attack.t1003.002
- attack.t1003.003
- car.2013-07-001
- attack.s0404
logsource:
  category: process_creation
  product: windows
detection:
  selection_esent_img:
  - Image|endswith: \esentutl.exe
  - OriginalFileName: \esentutl.exe
  selection_esent_cli:
    CommandLine|contains|windash:
    - vss
    - ' /m '
    - ' /y '
  selection_susp_paths:
    CommandLine|contains:
    - \config\RegBack\sam
    - \config\RegBack\security
    - \config\RegBack\system
    - \config\sam
    - \config\security
    - '\config\system '
    - \repair\sam
    - \repair\security
    - \repair\system
    - \windows\ntds\ntds.dit
  condition: all of selection_esent_* or selection_susp_paths
