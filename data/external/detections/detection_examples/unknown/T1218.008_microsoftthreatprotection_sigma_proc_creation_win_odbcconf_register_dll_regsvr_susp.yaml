technique_id: T1218.008
technique_name: Potentially Suspicious DLL Registered Via Odbcconf.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: ba4cfc11-d0fa-4d94-bf20-7c332c412e76
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_dll_ext:\n  CommandLine|contains: .dll\nselection_cli:\n\
  \  CommandLine|contains: 'REGSVR '\nselection_img:\n- Image|endswith: \\odbcconf.exe\n\
  - OriginalFileName: odbcconf.exe\n"
explanation: Detects execution of "odbcconf" with the "REGSVR" action where the DLL
  in question doesn't contain a ".dll" extension. Which is often used as a method
  to evade defenses.
false_positives:
- Unlikely
references:
- https://learn.microsoft.com/en-us/sql/odbc/odbcconf-exe?view=sql-server-ver16
- https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
- https://www.trendmicro.com/en_us/research/17/h/backdoor-carrying-emails-set-sights-on-russian-speaking-businesses.html
tags:
- attack.defense-evasion
- attack.t1218.008
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \odbcconf.exe
  - OriginalFileName: odbcconf.exe
  selection_cli:
    CommandLine|contains: 'REGSVR '
  filter_main_dll_ext:
    CommandLine|contains: .dll
  condition: all of selection_* and not 1 of filter_main_*
