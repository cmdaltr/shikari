technique_id: T1102
technique_name: Suspicious Child Process Of Manage Engine ServiceDesk
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: cea2b7ea-792b-405f-95a1-b903ea06458f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_net:\n  CommandLine|contains: ' stop'\n  Image|endswith:\n\
  \  - \\net.exe\n  - \\net1.exe\nselection:\n  Image|endswith:\n  - \\AppVLP.exe\n\
  \  - \\bash.exe\n  - \\bitsadmin.exe\n  - \\calc.exe\n  - \\certutil.exe\n  - \\\
  cscript.exe\n  - \\curl.exe\n  - \\forfiles.exe\n  - \\mftrace.exe\n  - \\mshta.exe\n\
  \  - \\net.exe\n  - \\net1.exe\n  - \\notepad.exe\n  - \\powershell.exe\n  - \\\
  pwsh.exe\n  - \\query.exe\n  - \\reg.exe\n  - \\schtasks.exe\n  - \\scrcons.exe\n\
  \  - \\sh.exe\n  - \\systeminfo.exe\n  - \\whoami.exe\n  - \\wmic.exe\n  - \\wscript.exe\n\
  \  ParentImage|contains|all:\n  - \\ManageEngine\\ServiceDesk\\\n  - \\java.exe\n"
explanation: Detects suspicious child processes of the "Manage Engine ServiceDesk
  Plus" Java web service
false_positives:
- Legitimate sub processes started by Manage Engine ServiceDesk Pro
references:
- https://www.horizon3.ai/manageengine-cve-2022-47966-technical-deep-dive/
- https://github.com/horizon3ai/CVE-2022-47966/blob/3a51c6b72ebbd87392babd955a8fbeaee2090b35/CVE-2022-47966.py
- https://blog.viettelcybersecurity.com/saml-show-stopper/
tags:
- attack.command-and-control
- attack.t1102
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|contains|all:
    - \ManageEngine\ServiceDesk\
    - \java.exe
    Image|endswith:
    - \AppVLP.exe
    - \bash.exe
    - \bitsadmin.exe
    - \calc.exe
    - \certutil.exe
    - \cscript.exe
    - \curl.exe
    - \forfiles.exe
    - \mftrace.exe
    - \mshta.exe
    - \net.exe
    - \net1.exe
    - \notepad.exe
    - \powershell.exe
    - \pwsh.exe
    - \query.exe
    - \reg.exe
    - \schtasks.exe
    - \scrcons.exe
    - \sh.exe
    - \systeminfo.exe
    - \whoami.exe
    - \wmic.exe
    - \wscript.exe
  filter_main_net:
    Image|endswith:
    - \net.exe
    - \net1.exe
    CommandLine|contains: ' stop'
  condition: selection and not 1 of filter_main_*
