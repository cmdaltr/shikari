query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_eid:\n  EventID: 7045\nselection_imagepath:\n- ImagePath|re: \\$PSHome\\\
  [\\s*\\d{1,3}\\s*\\]\\s*\\+\\s*\\$PSHome\\[\n- ImagePath|re: \\$ShellId\\[\\s*\\\
  d{1,3}\\s*\\]\\s*\\+\\s*\\$ShellId\\[\n- ImagePath|re: \\$env:Public\\[\\s*\\d{1,3}\\\
  s*\\]\\s*\\+\\s*\\$env:Public\\[\n- ImagePath|re: \\$env:ComSpec\\[(\\s*\\d{1,3}\\\
  s*,){2}\n- ImagePath|re: \\\\*mdr\\*\\W\\s*\\)\\.Name\n- ImagePath|re: \\$VerbosePreference\\\
  .ToString\\(\n- ImagePath|re: \\String\\]\\s*\\$VerbosePreference\n"
explanation: Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the code block linked in the references
