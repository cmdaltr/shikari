technique_id: T1548
technique_name: Potential Privilege Escalation via Local Kerberos Relay over LDAP
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 749c9f5e-b353-4b90-a9c1-05243357ca4b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_ip_null:\n  IpPort: '0'\nselection:\n  AuthenticationPackageName:\
  \ Kerberos\n  EventID: 4624\n  IpAddress: 127.0.0.1\n  LogonType: 3\n  TargetUserSid|endswith:\
  \ '-500'\n  TargetUserSid|startswith: S-1-5-21-\n"
explanation: 'Detects a suspicious local successful logon event where the Logon Package
  is Kerberos, the remote address is set to localhost, and the target user SID is
  the built-in local Administrator account.

  This may indicate an attempt to leverage a Kerberos relay attack variant that can
  be used to elevate privilege locally from a domain joined limited user to local
  System privileges.

  '
false_positives:
- Unknown
