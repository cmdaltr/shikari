technique_id: T1036
technique_name: Renamed CreateDump Utility Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 1a1ed54a-2ba4-4221-94d5-01dee560d71e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_* and\
  \ not filter\nfilter:\n  Image|endswith: \\createdump.exe\nselection_cli:\n- CommandLine|contains|all:\n\
  \  - ' -u '\n  - ' -f '\n  - .dmp\n- CommandLine|contains|all:\n  - ' --full '\n\
  \  - ' --name '\n  - .dmp\nselection_pe:\n  OriginalFileName: FX_VER_INTERNALNAME_STR\n"
explanation: Detects uses of a renamed legitimate createdump.exe LOLOBIN utility to
  dump process memory
false_positives:
- Command lines that use the same flags
references:
- https://www.crowdstrike.com/blog/overwatch-exposes-aquatic-panda-in-possession-of-log-4-shell-exploit-tools/
- https://twitter.com/bopin2020/status/1366400799199272960
