technique_id: T1071.001
technique_name: Raw Paste Service Access
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 5468045b-4fcc-4d1a-973c-c9c9578edacb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  c-uri|contains:\n  - .paste.ee/r/\n  - .pastebin.com/raw/\n  - .hastebin.com/raw/\n\
  \  - .ghostbin.co/paste/*/raw/\n  - pastetext.net/\n  - pastebin.pl/\n  - paste.ee/\n"
explanation: Detects direct access to raw pastes in different paste services often
  used by malware in their second stages to download malicious code in encrypted or
  encoded form
false_positives:
- User activity (e.g. developer that shared and copied code snippets and used the
  raw link instead of just copy & paste)
references:
- https://www.virustotal.com/gui/domain/paste.ee/relations
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1102.001
- attack.t1102.003
- attack.defense-evasion
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
    - .paste.ee/r/
    - .pastebin.com/raw/
    - .hastebin.com/raw/
    - .ghostbin.co/paste/*/raw/
    - pastetext.net/
