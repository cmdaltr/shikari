technique_id: T1202
technique_name: Potentially Suspicious Child Processes Spawned by ConHost
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: dfa03a09-8b92-4d83-8e74-f72839b1c407
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_child:\n- Image|endswith:\n  - \\cmd.exe\n  - \\cscript.exe\n  - \\mshta.exe\n\
  \  - \\powershell_ise.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n\
  \  - \\wscript.exe\n- OriginalFileName:\n  - cmd.exe\n  - cscript.exe\n  - mshta.exe\n\
  \  - powershell_ise.exe\n  - powershell.exe\n  - pwsh.dll\n  - regsvr32.exe\n  -\
  \ wscript.exe\nselection_parent:\n  ParentImage|endswith: \\conhost.exe\n"
explanation: Detects suspicious child processes related to Windows Shell utilities
  spawned by `conhost.exe`, which could indicate malicious activity using trusted
  system components.
false_positives:
- Legitimate administrative tasks using `conhost.exe` to spawn child processes such
  as `cmd.exe`, `powershell.exe`, or `regsvr32.exe`.
references:
- https://tria.ge/241015-l98snsyeje/behavioral2
tags:
- attack.t1202
