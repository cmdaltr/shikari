logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: \conhost.exe
  selection_child:
  - Image|endswith:
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \powershell_ise.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \wscript.exe
  - OriginalFileName:
    - cmd.exe
    - cscript.exe
    - mshta.exe
    - powershell_ise.exe
    - powershell.exe
    - pwsh.dll
    - regsvr32.exe
    - wscript.exe
  condition: all of selection_*
