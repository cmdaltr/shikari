technique_id: T1003.001
technique_name: Potential Credential Dumping Via WER - Application
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: a18e0862-127b-43ca-be12-1a542c75c7c5
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  AppName: lsass.exe\n  EventID: 1000\n  ExceptionCode: c0000001\n  Provider_Name:\
  \ Application Error\n"
explanation: Detects Windows error reporting event where the process that crashed
  is lsass. This could be the cause of an intentional crash by techniques such as
  Lsass-Shtinkering to dump credential
false_positives:
- Rare legitimate crashing of the lsass process
references:
- https://github.com/deepinstinct/Lsass-Shtinkering
- https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
- https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-erref/596a1078-e883-4972-9bbc-49e60bebca55
