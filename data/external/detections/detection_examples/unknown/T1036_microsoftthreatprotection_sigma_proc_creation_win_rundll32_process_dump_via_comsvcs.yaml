technique_id: T1036
technique_name: Process Memory Dump Via Comsvcs.DLL
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 646ea171-dded-4578-8a4d-65e9822892e3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (selection_img and 1\
  \ of selection_cli_*) or selection_generic\nselection_cli_1:\n  CommandLine|contains:\n\
  \  - '#-'\n  - '#+'\n  - '#24'\n  - '24 '\n  - MiniDump\n  - '#65560'\n  CommandLine|contains|all:\n\
  \  - comsvcs\n  - full\nselection_generic:\n  CommandLine|contains:\n  - ' #'\n\
  \  - ',#'\n  - ', #'\n  - '\"#'\n  CommandLine|contains|all:\n  - '24'\n  - comsvcs\n\
  \  - full\nselection_img:\n- Image|endswith: \\rundll32.exe\n- OriginalFileName:\
  \ RUNDLL32.EXE\n- CommandLine|contains: rundll32\n"
explanation: Detects a process memory dump via "comsvcs.dll" using rundll32, covering
  multiple different techniques (ordinal, minidump function, etc.)
false_positives:
- Unlikely
references:
- https://twitter.com/shantanukhande/status/1229348874298388484
