fidelity_score: 0.86
validated: true
source: sigma
sigma_id: be344333-921d-4c4d-8bb8-e584cf584780
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_generic:\n  Image|endswith:\n  - :\\Windows\\System32\\\
  mmc.exe\n  - :\\Windows\\System32\\WerFault.exe\n  - :\\Windows\\SysWOW64\\WerFault.exe\n\
  selection:\n  ParentImage|endswith: \\eventvwr.exe\n"
explanation: Detects uncommon or suspicious child processes of "eventvwr.exe" which
  might indicate a UAC bypass attempt
false_positives:
- Unknown
references:
- https://enigma0x3.net/2016/08/15/fileless-uac-bypass-using-eventvwr-exe-and-registry-hijacking/
