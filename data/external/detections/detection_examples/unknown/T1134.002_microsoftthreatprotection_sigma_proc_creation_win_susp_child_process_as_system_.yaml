logsource:
  category: process_creation
  product: windows
  definition: 'Requirements: ParentUser field needs sysmon >= 13.30'
detection:
  selection:
    ParentUser|contains:
    - AUTHORI
    - AUTORI
    ParentUser|endswith:
    - \NETWORK SERVICE
    - \LOCAL SERVICE
    User|contains:
    - AUTHORI
    - AUTORI
    User|endswith:
    - \SYSTEM
    - \Système
    - \СИСТЕМА
    IntegrityLevel:
    - System
    - S-1-16-16384
  filter_rundll32:
    Image|endswith: \rundll32.exe
    CommandLine|contains: DavSetCookie
  condition: selection and not 1 of filter_*
