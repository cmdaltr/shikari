technique_id: T1134.002
technique_name: Suspicious Child Process Created as System
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 590a5f4c-6c8c-4f10-8307-89afe9453a9d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_rundll32:\n  CommandLine|contains: DavSetCookie\n  Image|endswith:\
  \ \\rundll32.exe\nselection:\n  IntegrityLevel:\n  - System\n  - S-1-16-16384\n\
  \  ParentUser|contains:\n  - AUTHORI\n  - AUTORI\n  ParentUser|endswith:\n  - \\\
  NETWORK SERVICE\n  - \\LOCAL SERVICE\n  User|contains:\n  - AUTHORI\n  - AUTORI\n\
  \  User|endswith:\n  - \\SYSTEM\n  - \"\\\\Syst\\xE8me\"\n  - \"\\\\\\u0421\\u0418\\\
  u0421\\u0422\\u0415\\u041C\\u0410\"\n"
explanation: Detection of child processes spawned with SYSTEM privileges by parents
  with LOCAL SERVICE or NETWORK SERVICE accounts
false_positives:
- Unknown
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
