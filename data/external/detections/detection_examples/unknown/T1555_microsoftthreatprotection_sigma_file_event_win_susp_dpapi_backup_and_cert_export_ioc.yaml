technique_id: T1555
technique_name: DPAPI Backup Keys And Certificate Export Activity IOC
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetFilename|contains:\n  - ntds_capi_\n  - ntds_legacy_\n  - ntds_unknown_\n\
  \  TargetFilename|endswith:\n  - .cer\n  - .key\n  - .pfx\n  - .pvk\n"
explanation: 'Detects file names with specific patterns seen generated and used by
  tools such as Mimikatz and DSInternals related to exported or stolen DPAPI backup
  keys and certificates.

  '
false_positives:
- Unlikely
references:
- https://www.dsinternals.com/en/dpapi-backup-key-theft-auditing/
- https://github.com/MichaelGrafnetter/DSInternals/blob/39ee8a69bbdc1cfd12c9afdd7513b4788c4895d4/Src/DSInternals.Common/Data/DPAPI/DPAPIBackupKey.cs#L28-L32
