technique_id: T1218
technique_name: Uncommon Child Process Of Setres.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 835e75bf-4bfd-47a4-b8a6-b766cac8bcb7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_legit_location:\n  Image|endswith:\n  - C:\\Windows\\\
  System32\\choice.exe\n  - C:\\Windows\\SysWOW64\\choice.exe\nselection:\n  Image|contains:\
  \ \\choice\n  ParentImage|endswith: \\setres.exe\n"
explanation: 'Detects uncommon child process of Setres.EXE.

  Setres.EXE is a Windows server only process and tool that can be used to set the
  screen resolution.

  It can potentially be abused in order to launch any arbitrary file with a name containing
  the word "choice" from the current execution path.

  '
false_positives:
- Unlikely
