query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000000)\n  TargetObject|endswith:\n  - \\Microsoft\\Windows\\\
  DeviceGuard\\HypervisorEnforcedCodeIntegrity\n  - \\Control\\DeviceGuard\\HypervisorEnforcedCodeIntegrity\n\
  \  - \\Control\\DeviceGuard\\Scenarios\\HypervisorEnforcedCodeIntegrity\\Enabled\n"
explanation: 'Detects changes to the HypervisorEnforcedCodeIntegrity registry key
  and the "Enabled" value being set to 0 in order to disable the Hypervisor Enforced
  Code Integrity feature. This allows an attacker to load unsigned and untrusted code
  to be run in the kernel

  '
