query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection:\n\
  \  CommandLine|contains:\n  - /EXEFilename\n  - /CommandLine\nselection_runas:\n\
  - CommandLine|contains:\n  - ' /RunAs 8 '\n  - ' /RunAs 4 '\n  - ' /RunAs 10 '\n\
  \  - ' /RunAs 11 '\n- CommandLine|endswith:\n  - /RunAs 8\n  - /RunAs 4\n  - /RunAs\
  \ 10\n  - /RunAs 11\n"
explanation: Detects the execution of AdvancedRun utility in the context of the TrustedInstaller,
  SYSTEM, Local Service or Network Service accounts
false_positives:
- Unknown
