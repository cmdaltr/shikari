technique_id: T1105
technique_name: File Download with Headless Browser
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 0e8cfe08-02c9-4815-a2f8-0d157b7ed33e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_optional_*\nfilter_optional_edge_1:\n  CommandLine|contains: --headless\
  \ --disable-gpu --disable-extensions --disable-plugins\n    --mute-audio --no-first-run\
  \ --incognito --aggressive-cache-discard --dump-dom\n  Image|endswith:\n  - \\msedge.exe\n\
  \  - \\msedgewebview2.exe\n  - \\MicrosoftEdge.exe\n  Image|startswith:\n  - C:\\\
  Program Files (x86)\\Microsoft\\Edge\\Application\\\n  - C:\\Program Files (x86)\\\
  Microsoft\\EdgeCore\\\n  - C:\\Program Files (x86)\\Microsoft\\EdgeWebView\\\n \
  \ - C:\\Program Files\\Microsoft\\Edge\\Application\\\n  - C:\\Program Files\\Microsoft\\\
  EdgeCore\\\n  - C:\\Program Files\\Microsoft\\EdgeWebView\\\n  - C:\\Program Files\\\
  WindowsApps\\Microsoft.MicrosoftEdge\nfilter_optional_edge_2:\n  CommandLine|contains:\
  \ --headless --disable-gpu --disable-extensions --disable-plugins\n    --mute-audio\
  \ --no-first-run --incognito --aggressive-cache-discard --dump-dom\n  Image|contains:\n\
  \  - \\AppData\\Local\\Microsoft\\WindowsApps\\\n  - \\Windows\\SystemApps\\Microsoft.MicrosoftEdge\n\
  \  Image|endswith:\n  - \\msedge.exe\n  - \\MicrosoftEdge.exe\nselection:\n  CommandLine|contains|all:\n\
  \  - --headless\n  - dump-dom\n  - http\n  Image|endswith:\n  - \\brave.exe\n  -\
  \ \\chrome.exe\n  - \\msedge.exe\n  - \\opera.exe\n  - \\vivaldi.exe\n"
explanation: Detects execution of chromium based browser in headless mode using the
  "dump-dom" command line to download files
false_positives:
- Unknown
references:
- https://twitter.com/mrd0x/status/1478234484881436672?s=12
- https://www.trendmicro.com/en_us/research/23/e/managed-xdr-investigation-of-ducktail-in-trend-micro-vision-one.html
tags:
- attack.defense-evasion
- attack.command-and-control
- attack.t1105
- attack.t1564.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \brave.exe
    - \chrome.exe
    - \msedge.exe
    - \opera.exe
    - \vivaldi.exe
    CommandLine|contains|all:
    - --headless
    - dump-dom
    - http
  filter_optional_edge_1:
    Image|startswith:
    - C:\Program Files (x86)\Microsoft\Edge\Application\
    - C:\Program Files (x86)\Microsoft\EdgeCore\
    - C:\Program Files (x86)\Microsoft\EdgeWebView\
    - C:\Program Files\Microsoft\Edge\Application\
    - C:\Program Files\Microsoft\EdgeCore\
    - C:\Program Files\Microsoft\EdgeWebView\
    - C:\Program Files\WindowsApps\Microsoft.MicrosoftEdge
    Image|endswith:
    - \msedge.exe
    - \msedgewebview2.exe
    - \MicrosoftEdge.exe
    CommandLine|contains: --headless --disable-gpu --disable-extensions --disable-plugins
      --mute-audio --no-first-run --incognito --aggressive-cache-discard --dump-dom
  filter_optional_edge_2:
    Image|contains:
    - \AppData\Local\Microsoft\WindowsApps\
    - \Windows\SystemApps\Microsoft.MicrosoftEdge
    Image|endswith:
    - \msedge.exe
    - \MicrosoftEdge.exe
    CommandLine|contains: --headless --disable-gpu --disable-extensions --disable-plugins
      --mute-audio --no-first-run --incognito --aggressive-cache-discard --dump-dom
  condition: selection and not 1 of filter_optional_*
