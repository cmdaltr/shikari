source: sigma
sigma_id: 1547e27c-3974-43e2-a7d7-7f484fb928ec
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_optional_*\nfilter_optional_hexnode:\n  Details: Service\n  Image: C:\\\
  Hexnode\\Hexnode Agent\\Current\\HexnodeAgent.exe\n  TargetObject|endswith:\n  -\
  \ \\Control\\SafeBoot\\Minimal\\Hexnode Updater\\(Default)\n  - \\Control\\SafeBoot\\\
  Network\\Hexnode Updater\\(Default)\n  - \\Control\\SafeBoot\\Minimal\\Hexnode Agent\\\
  (Default)\n  - \\Control\\SafeBoot\\Network\\Hexnode Agent\\(Default)\nfilter_optional_mbamservice:\n\
  \  Details: Service\n  Image|endswith: \\MBAMInstallerService.exe\n  TargetObject|endswith:\
  \ \\MBAMService\\(Default)\nfilter_optional_sophos:\n  Image: C:\\WINDOWS\\system32\\\
  msiexec.exe\n  TargetObject|endswith:\n  - \\Control\\SafeBoot\\Minimal\\SAVService\\\
  (Default)\n  - \\Control\\SafeBoot\\Network\\SAVService\\(Default)\nselection:\n\
  \  Details: Service\n  TargetObject|contains:\n  - \\Control\\SafeBoot\\Minimal\\\
  \n  - \\Control\\SafeBoot\\Network\\\n  TargetObject|endswith: \\(Default)\n"
explanation: Detects the modification of the registry to allow a driver or service
  to persist in Safe Mode.
false_positives:
- Unknown
