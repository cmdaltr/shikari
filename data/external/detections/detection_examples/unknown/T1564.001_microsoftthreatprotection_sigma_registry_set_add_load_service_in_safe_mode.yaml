    - \Control\SafeBoot\Network\Hexnode Updater\(Default)
    - \Control\SafeBoot\Minimal\Hexnode Agent\(Default)
    - \Control\SafeBoot\Network\Hexnode Agent\(Default)
    Details: Service
  condition: selection and not 1 of filter_optional_*
