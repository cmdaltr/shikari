technique_id: T1562.001
technique_name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 452bce90-6fb0-43cc-97a5-affc283139b3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_root_*\
  \ and 1 of selection_dword_*\nselection_dword_0:\n  CommandLine|contains:\n  - DisallowExploitProtectionOverride\n\
  \  - EnableControlledFolderAccess\n  - MpEnablePus\n  - PUAProtection\n  - SpynetReporting\n\
  \  - SubmitSamplesConsent\n  - TamperProtection\n  CommandLine|contains|all:\n \
  \ - ' add '\n  - d 0\nselection_dword_1:\n  CommandLine|contains:\n  - DisableAccess\n\
  \  - DisableAntiSpyware\n  - DisableAntiSpywareRealtimeProtection\n  - DisableAntiVirus\n\
  \  - DisableAntiVirusSignatures\n  - DisableArchiveScanning\n  - DisableBehaviorMonitoring\n\
  \  - DisableBlockAtFirstSeen\n  - DisableCloudProtection\n  - DisableConfig\n  -\
  \ DisableEnhancedNotifications\n  - DisableIntrusionPreventionSystem\n  - DisableIOAVProtection\n\
  \  - DisableNetworkProtection\n  - DisableOnAccessProtection\n  - DisablePrivacyMode\n\
  \  - DisableRealtimeMonitoring\n  - DisableRoutinelyTakingAction\n  - DisableScanOnRealtimeEnable\n\
  \  - DisableScriptScanning\n  - DisableSecurityCenter\n  - Notification_Suppress\n\
  \  - SignatureDisableUpdateOnStartupWithoutEngine\n  CommandLine|contains|all:\n\
  \  - ' add '\n  - d 1\nselection_root_img:\n- Image|endswith: \\reg.exe\n- OriginalFileName:\
  \ reg.exe\nselection_root_path:\n  CommandLine|contains:\n  - SOFTWARE\\Microsoft\\\
  Windows Defender\\\n  - SOFTWARE\\Policies\\Microsoft\\Windows Defender Security\
  \ Center\n  - SOFTWARE\\Policies\\Microsoft\\Windows Defender\\\n"
explanation: 'Detects the usage of "reg.exe" to tamper with different Windows Defender
  registry keys in order to disable some important features related to protection
  and detection

  '
false_positives:
- Rare legitimate use by administrators to test software (should always be investigated)
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
- https://github.com/swagkarna/Defeat-Defender-V1.2.0/tree/ae4059c4276da6f6303b8f53cdff085ecae88a91
- https://www.elevenforum.com/t/video-guide-how-to-completely-disable-microsoft-defender-antivirus.14608/page-2
- https://tria.ge/241231-j9yatstqbm/behavioral1
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_root_img:
  - Image|endswith: \reg.exe
  - OriginalFileName: reg.exe
  selection_root_path:
    CommandLine|contains:
    - SOFTWARE\Microsoft\Windows Defender\
    - SOFTWARE\Policies\Microsoft\Windows Defender Security Center
    - SOFTWARE\Policies\Microsoft\Windows Defender\
  selection_dword_0:
    CommandLine|contains|all:
    - ' add '
    - d 0
    CommandLine|contains:
    - DisallowExploitProtectionOverride
    - EnableControlledFolderAccess
    - MpEnablePus
    - PUAProtection
    - SpynetReporting
    - SubmitSamplesConsent
    - TamperProtection
  selection_dword_1:
    CommandLine|contains|all:
    - ' add '
    - d 1
    CommandLine|contains:
    - DisableAccess
    - DisableAntiSpyware
    - DisableAntiSpywareRealtimeProtection
    - DisableAntiVirus
    - DisableAntiVirusSignatures
    - DisableArchiveScanning
    - DisableBehaviorMonitoring
    - DisableBlockAtFirstSeen
    - DisableCloudProtection
    - DisableConfig
    - DisableEnhancedNotifications
    - DisableIntrusionPreventionSystem
    - DisableIOAVProtection
    - DisableNetworkProtection
    - DisableOnAccessProtection
    - DisablePrivacyMode
    - DisableRealtimeMonitoring
    - DisableRoutinelyTakingAction
    - DisableScanOnRealtimeEnable
    - DisableScriptScanning
    - DisableSecurityCenter
    - Notification_Suppress
    - SignatureDisableUpdateOnStartupWithoutEngine
  condition: all of selection_root_* and 1 of selection_dword_*
