technique_id: T1027
technique_name: Suspicious File Downloaded From File-Sharing Website Via Certutil.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 42a5f1e7-9603-4f6d-97ae-3f37d130d794
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_flags:\n  CommandLine|contains:\n  - 'urlcache '\n  - 'verifyctl '\nselection_http:\n\
  \  CommandLine|contains:\n  - .githubusercontent.com\n  - anonfiles.com\n  - cdn.discordapp.com\n\
  \  - ddns.net\n  - dl.dropboxusercontent.com\n  - ghostbin.co\n  - glitch.me\n \
  \ - gofile.io\n  - hastebin.com\n  - mediafire.com\n  - mega.nz\n  - onrender.com\n\
  \  - pages.dev\n  - paste.ee\n  - pastebin.com\n  - pastebin.pl\n  - pastetext.net\n\
  \  - privatlab.com\n  - privatlab.net\n  - send.exploit.in\n  - sendspace.com\n\
  \  - storage.googleapis.com\n  - storjshare.io\n  - supabase.co\n  - temp.sh\n \
  \ - transfer.sh\n  - trycloudflare.com\n  - ufile.io\n  - w3spaces.com\n  - workers.dev\n\
  selection_img:\n- Image|endswith: \\certutil.exe\n- OriginalFileName: CertUtil.exe\n"
explanation: Detects the execution of certutil with certain flags that allow the utility
  to download files from file-sharing websites.
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
- https://forensicitguy.github.io/agenttesla-vba-certutil-download/
- https://news.sophos.com/en-us/2021/04/13/compromised-exchange-server-hosting-cryptojacker-targeting-other-exchange-servers/
- https://twitter.com/egre55/status/1087685529016193025
- https://lolbas-project.github.io/lolbas/Binaries/Certutil/
- https://www.microsoft.com/en-us/security/blog/2024/01/17/new-ttps-observed-in-mint-sandstorm-campaign-targeting-high-profile-individuals-at-universities-and-research-orgs/
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \certutil.exe
  - OriginalFileName: CertUtil.exe
  selection_flags:
    CommandLine|contains:
    - 'urlcache '
    - 'verifyctl '
  selection_http:
    CommandLine|contains:
    - .githubusercontent.com
    - anonfiles.com
    - cdn.discordapp.com
