query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_svchost:\n  Image|endswith: :\\windows\\system32\\\
  svchost.exe\n  User|contains:\n  - AUTHORI\n  - AUTORI\nselection:\n  TargetFilename|contains:\
  \ :\\Windows\\Prefetch\\\n  TargetFilename|endswith: .pf\n"
explanation: Detects the deletion of a prefetch file which may indicate an attempt
  to destroy forensic evidence
false_positives:
- Unknown
references:
- Internal Research
- https://www.group-ib.com/blog/hunting-for-ttps-with-prefetch-files/
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  product: windows
  category: file_delete
detection:
  selection:
    TargetFilename|contains: :\Windows\Prefetch\
    TargetFilename|endswith: .pf
  filter_main_svchost:
    Image|endswith: :\windows\system32\svchost.exe
    User|contains:
    - AUTHORI
    - AUTORI
  condition: selection and not 1 of filter_main_*
