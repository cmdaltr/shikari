technique_id: T1036
technique_name: Suspicious DumpMinitool Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: eb1c4225-1c23-4241-8dd4-051389fde4ce
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncmd_has_flags:\n  CommandLine|contains:\n\
  \  - ' Full'\n  - ' Mini'\n  - ' WithHeap'\ncondition: selection and ( ( not filter_folder\
  \ ) or susp_flags or ( cmd_has_flags\n  and not filter_cmd_misses_flags ) )\nfilter_cmd_misses_flags:\n\
  \  CommandLine|contains: --dumpType\nfilter_folder:\n  Image|contains:\n  - \\Microsoft\
  \ Visual Studio\\\n  - \\Extensions\\\nselection:\n- Image|endswith:\n  - \\DumpMinitool.exe\n\
  \  - \\DumpMinitool.x86.exe\n  - \\DumpMinitool.arm64.exe\n- OriginalFileName:\n\
  \  - DumpMinitool.exe\n  - DumpMinitool.x86.exe\n  - DumpMinitool.arm64.exe\nsusp_flags:\n\
  \  CommandLine|contains: .txt\n"
explanation: Detects suspicious ways to use the "DumpMinitool.exe" binary
false_positives:
- Unknown
references:
- https://twitter.com/mrd0x/status/1511415432888131586
- https://twitter.com/mrd0x/status/1511489821247684615
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/DumpMinitool/
tags:
- attack.defense-evasion
- attack.credential-access
- attack.t1036
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith:
    - \DumpMinitool.exe
    - \DumpMinitool.x86.exe
    - \DumpMinitool.arm64.exe
  - OriginalFileName:
    - DumpMinitool.exe
    - DumpMinitool.x86.exe
    - DumpMinitool.arm64.exe
  filter_folder:
    Image|contains:
    - \Microsoft Visual Studio\
    - \Extensions\
  susp_flags:
    CommandLine|contains: .txt
  cmd_has_flags:
    CommandLine|contains:
    - ' Full'
    - ' Mini'
    - ' WithHeap'
  filter_cmd_misses_flags:
    CommandLine|contains: --dumpType
  condition: selection and ( ( not filter_folder ) or susp_flags or ( cmd_has_flags
    and not filter_cmd_misses_flags ) )
