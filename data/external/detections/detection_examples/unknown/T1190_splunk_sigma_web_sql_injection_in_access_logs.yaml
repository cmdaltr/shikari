query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and keywords\
  \ and not 1 of filter_main_*\nfilter_main_status:\n  sc-status: 404\nkeywords:\n\
  - '@@version'\n- '%271%27%3D%271'\n- '=select '\n- =select(\n- =select%20\n- concat_ws(\n\
  - CONCAT(0x\n- from mysql.innodb_table_stats\n- from%20mysql.innodb_table_stats\n\
  - group_concat(\n- information_schema.tables\n- json_arrayagg(\n- or 1=1#\n- or%201=1#\n\
  - 'order by '\n- order%20by%20\n- 'select * '\n- select database()\n- select version()\n\
  - select%20*%20\n- select%20database()\n- select%20version()\n- select%28sleep%2810%29\n\
  - SELECTCHAR(\n- table_schema\n- UNION ALL SELECT\n- UNION SELECT\n- UNION%20ALL%20SELECT\n\
  - UNION%20SELECT\n- '''1''=''1'\nselection:\n  cs-method: GET\n"
explanation: Detects potential SQL injection attempts via GET requests in access logs.
false_positives:
- Java scripts and CSS Files
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you experience
  a lot of FPs due to this think of adding more filters such as "User Agent" strings
  and more response codes
references:
- https://www.acunetix.com/blog/articles/exploiting-sql-injection-example/
