technique_id: T1562.004
technique_name: Suspicious Program Location Whitelisted In Firewall Via Netsh.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: a35f5a72-f347-4e36-8895-9869b0d5fc6d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n- CommandLine|contains|all:\n  - firewall\n  - add\n  - allowedprogram\n\
  - CommandLine|contains|all:\n  - advfirewall\n  - firewall\n  - add\n  - rule\n\
  \  - action=allow\n  - program=\nselection_img:\n- Image|endswith: \\netsh.exe\n\
  - OriginalFileName: netsh.exe\nselection_paths:\n  CommandLine|contains:\n  - :\\\
  $Recycle.bin\\\n  - :\\RECYCLER.BIN\\\n  - :\\RECYCLERS.BIN\\\n  - :\\SystemVolumeInformation\\\
  \n  - :\\Temp\\\n  - :\\Users\\Default\\\n  - :\\Users\\Desktop\\\n  - :\\Users\\\
  Public\\\n  - :\\Windows\\addins\\\n  - :\\Windows\\cursors\\\n  - :\\Windows\\\
  debug\\\n  - :\\Windows\\drivers\\\n  - :\\Windows\\fonts\\\n  - :\\Windows\\help\\\
  \n  - :\\Windows\\system32\\tasks\\\n  - :\\Windows\\Tasks\\\n  - :\\Windows\\Temp\\\
  \n  - \\Downloads\\\n  - \\Local Settings\\Temporary Internet Files\\\n  - \\Temporary\
  \ Internet Files\\Content.Outlook\\\n  - '%Public%\\'\n  - '%TEMP%'\n  - '%TMP%'\n"
explanation: Detects Netsh command execution that whitelists a program located in
  a suspicious location in the Windows Firewall
false_positives:
- Unknown
references:
- https://www.virusradar.com/en/Win32_Kasidet.AD/description
