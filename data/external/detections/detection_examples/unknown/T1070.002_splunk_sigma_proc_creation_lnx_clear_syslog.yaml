technique_id: T1070.002
technique_name: Syslog Clearing or Removal Via System Utilities
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.89
validated: true
source: sigma
sigma_id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (selection_file and 1\
  \ of selection_command_*) or 1 of selection_unique_*\nselection_command_cp:\n  CommandLine|contains:\
  \ /dev/null\n  Image|endswith: /cp\nselection_command_ln:\n  CommandLine|contains:\n\
  \  - '-sf '\n  - '-sfn '\n  - '-sfT '\n  CommandLine|contains|all:\n  - '/dev/null\
  \ '\n  - /var/log/syslog\n  Image|endswith: /ln\nselection_command_mv:\n  Image|endswith:\
  \ /mv\nselection_command_rm:\n  CommandLine|contains:\n  - ' -r '\n  - ' -f '\n\
  \  - ' -rf '\n  - /var/log/syslog\n  Image|endswith: /rm\nselection_command_shred:\n\
  \  CommandLine|contains: '-u '\n  Image|endswith: /shred\nselection_command_truncate:\n\
  \  CommandLine|contains:\n  - '-s '\n  - '-c '\n  - --size\n  CommandLine|contains|all:\n\
  \  - '0 '\n  - /var/log/syslog\n  Image|endswith: /truncate\nselection_command_unlink:\n\
  \  Image|endswith: /unlink\nselection_file:\n  CommandLine|contains: /var/log/syslog\n\
  selection_unique_journalctl:\n  CommandLine|contains:\n  - journalctl --vacuum\n\
  \  - journalctl --rotate\nselection_unique_other:\n  CommandLine|contains:\n  -\
  \ ' > /var/log/syslog'\n  - ' >/var/log/syslog'\n  - ' >| /var/log/syslog'\n  -\
  \ ': > /var/log/syslog'\n  - :> /var/log/syslog\n  - :>/var/log/syslog\n  - '>|/var/log/syslog'\n"
explanation: 'Detects specific commands commonly used to remove or empty the syslog.
  Which is a technique often used by attacker as a method to hide their tracks

  '
false_positives:
- Log rotation.
- Maintenance.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
- https://www.virustotal.com/gui/file/54d60fd58d7fa3475fa123985bfc1594df26da25c1f5fbc7dfdba15876dd8ac5/behavior
tags:
- attack.defense-evasion
- attack.t1070.002
logsource:
  product: linux
  category: process_creation
detection:
  selection_file:
    CommandLine|contains: /var/log/syslog
  selection_command_rm:
    Image|endswith: /rm
    CommandLine|contains:
    - ' -r '
    - ' -f '
    - ' -rf '
    - /var/log/syslog
  selection_command_unlink:
    Image|endswith: /unlink
  selection_command_mv:
    Image|endswith: /mv
  selection_command_truncate:
    Image|endswith: /truncate
    CommandLine|contains|all:
    - '0 '
    - /var/log/syslog
    CommandLine|contains:
    - '-s '
    - '-c '
    - --size
  selection_command_ln:
    Image|endswith: /ln
    CommandLine|contains|all:
    - '/dev/null '
    - /var/log/syslog
    CommandLine|contains:
    - '-sf '
    - '-sfn '
    - '-sfT '
  selection_command_cp:
    Image|endswith: /cp
    CommandLine|contains: /dev/null
  selection_command_shred:
    Image|endswith: /shred
    CommandLine|contains: '-u '
  selection_unique_other:
    CommandLine|contains:
    - ' > /var/log/syslog'
    - ' >/var/log/syslog'
    - ' >| /var/log/syslog'
    - ': > /var/log/syslog'
    - :> /var/log/syslog
    - :>/var/log/syslog
    - '>|/var/log/syslog'
  selection_unique_journalctl:
    CommandLine|contains:
    - journalctl --vacuum
    - journalctl --rotate
  condition: (selection_file and 1 of selection_command_*) or 1 of selection_unique_*
