query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image: C:\\WINDOWS\\system32\\WerFault.exe\n  TargetFilename|contains:\n  - \\\
  lsass\n  - lsass.exe\n"
explanation: Detects WerFault creating a dump file with a name that indicates that
  the dump file could be an LSASS process memory, which contains user credentials
false_positives:
- Unknown
