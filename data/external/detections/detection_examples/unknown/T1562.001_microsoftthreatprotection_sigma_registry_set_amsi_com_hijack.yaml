technique_id: T1562.001
technique_name: Potential AMSI COM Server Hijacking
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 160d2780-31f7-4922-8b3a-efce30e63e96
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Details: '%windir%\\system32\\amsi.dll'\nselection:\n  TargetObject|endswith:\
  \ \\CLSID\\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\\InProcServer32\\(Default)\n"
explanation: Detects changes to the AMSI come server registry key in order disable
  AMSI scanning functionalities. When AMSI attempts to starts its COM component, it
  will query its registered CLSID and return a non-existent COM server. This causes
  a load failure and prevents any scanning methods from being accessed, ultimately
  rendering AMSI useless
false_positives:
- Unknown
