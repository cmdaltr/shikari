technique_id: T1027
technique_name: File In Suspicious Location Encoded To Base64 Via Certutil.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 82a6714f-4899-4f16-9c1e-9a333544d4c3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|windash: -encode\nselection_extension:\n\
  \  CommandLine|contains:\n  - \\AppData\\Roaming\\\n  - \\Desktop\\\n  - \\Local\\\
  Temp\\\n  - \\PerfLogs\\\n  - \\Users\\Public\\\n  - \\Windows\\Temp\\\n  - $Recycle.Bin\n\
  selection_img:\n- Image|endswith: \\certutil.exe\n- OriginalFileName: CertUtil.exe\n"
explanation: Detects the execution of certutil with the "encode" flag to encode a
  file to base64 where the files are located in potentially suspicious locations
false_positives:
- Unknown
