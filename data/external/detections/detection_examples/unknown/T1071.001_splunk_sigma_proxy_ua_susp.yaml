query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection* and not\
  \ falsepositives\nfalsepositives:\n- c-useragent: Mozilla/3.0 * Acrobat *\n- cs-host|endswith:\n\
  \  - .acrobat.com\n  - .adobe.com\n  - .adobe.io\nselection1:\n  c-useragent|startswith:\n\
  \  - user-agent\n  - 'Mozilla/3.0 '\n  - 'Mozilla/2.0 '\n  - 'Mozilla/1.0 '\n  -\
  \ 'Mozilla '\n  - ' Mozilla/'\n  - Mozila/\n  - Mozilla/4.0 (compatible; MSIE 6.0;\
  \ MS Web Services Client Protocol\nselection2:\n  c-useragent|contains:\n  - ' (compatible;MSIE\
  \ '\n  - '.0;Windows NT '\n  - loader\nselection3:\n  c-useragent:\n  - _\n  - CertUtil\
  \ URL Agent\n  - Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:60.0)\n  - Mozilla/5.0\
  \ (Windows NT 6.3; WOW64; rv:28.0) Gecko/20100101 Firefox/28.0\n  - HTTPS\n  - Erbium-UA-4ce7c27cb4be9d32e333bf032c88235a\n\
  \  - x\n  - xxx\n"
explanation: Detects suspicious malformed user agent strings in proxy logs
false_positives:
- Unknown
references:
