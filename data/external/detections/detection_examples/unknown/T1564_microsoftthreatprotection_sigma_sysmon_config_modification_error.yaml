technique_id: T1564
technique_name: Sysmon Configuration Error
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 815cd91b-7dbc-4247-841a-d7dd1392b0a8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_error and not\
  \ 1 of filter*\nfilter_by_errorcode:\n  Description|contains:\n  - Failed to open\
  \ service configuration with error 19\n  - Failed to open service configuration\
  \ with error 93\nfilter_generic_english:\n  Description|contains|all:\n  - Failed\
  \ to open service configuration with error\n  - 'Last error: The media is write\
  \ protected.'\nselection_error:\n  Description|contains:\n  - Failed to open service\
  \ configuration with error\n  - Failed to connect to the driver to update configuration\n"
explanation: Detects when an adversary is trying to hide it's action from Sysmon logging
  based on error messages
false_positives:
- Legitimate administrative action
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
- https://talesfrominfosec.blogspot.com/2017/12/killing-sysmon-silently.html
tags:
- attack.defense-evasion
- attack.t1564
logsource:
  product: windows
  category: sysmon_error
detection:
  selection_error:
    Description|contains:
    - Failed to open service configuration with error
    - Failed to connect to the driver to update configuration
  filter_generic_english:
    Description|contains|all:
    - Failed to open service configuration with error
    - 'Last error: The media is write protected.'
  filter_by_errorcode:
    Description|contains:
    - Failed to open service configuration with error 19
    - Failed to open service configuration with error 93
  condition: selection_error and not 1 of filter*
