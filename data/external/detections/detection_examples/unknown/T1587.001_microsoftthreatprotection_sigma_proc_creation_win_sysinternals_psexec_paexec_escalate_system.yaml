technique_id: T1587.001
technique_name: PsExec/PAExec Escalation to LOCAL SYSTEM
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.83
validated: true
source: sigma
sigma_id: 8834e2f7-6b4b-4f09-8906-d2276470ee23
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_other:\n  CommandLine|contains:\n  - psexec\n  - paexec\n  - accepteula\n\
  selection_sys:\n  CommandLine|contains|windash:\n  - ' -s cmd'\n  - ' -s -i cmd'\n\
  \  - ' -i -s cmd'\n  - ' -s pwsh'\n  - ' -s -i pwsh'\n  - ' -i -s pwsh'\n  - ' -s\
  \ powershell'\n  - ' -s -i powershell'\n  - ' -i -s powershell'\n"
explanation: Detects suspicious commandline flags used by PsExec and PAExec to escalate
  a command line to LOCAL_SYSTEM rights
false_positives:
- Admins that use PsExec or PAExec to escalate to the SYSTEM account for maintenance
  purposes (rare)
- Users that debug Microsoft Intune issues using the commands mentioned in the official
  documentation; see https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_sys:
    CommandLine|contains|windash:
    - ' -s cmd'
    - ' -s -i cmd'
    - ' -i -s cmd'
    - ' -s pwsh'
    - ' -s -i pwsh'
    - ' -i -s pwsh'
    - ' -s powershell'
    - ' -s -i powershell'
    - ' -i -s powershell'
  selection_other:
    CommandLine|contains:
    - psexec
    - paexec
    - accepteula
  condition: all of selection_*
