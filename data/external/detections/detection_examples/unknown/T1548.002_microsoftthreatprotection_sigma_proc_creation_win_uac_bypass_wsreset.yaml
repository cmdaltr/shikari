query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n- Image|endswith: \\conhost.exe\n- OriginalFileName: CONHOST.EXE\nselection:\n\
  \  ParentImage|endswith: \\wsreset.exe\n"
explanation: Detects use of WSReset.exe to bypass User Account Control (UAC). Adversaries
  use this technique to execute privileged processes.
false_positives:
- Unknown sub processes of Wsreset.exe
