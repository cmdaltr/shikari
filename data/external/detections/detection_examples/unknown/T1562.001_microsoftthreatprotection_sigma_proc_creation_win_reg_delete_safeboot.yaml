technique_id: T1562.001
technique_name: SafeBoot Registry Key Deleted Via Reg.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: fc0e89b5-adb0-43c1-b749-c12a10ec37de
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_delete:\n  CommandLine|contains|all:\n  - ' delete '\n  - \\SYSTEM\\CurrentControlSet\\\
  Control\\SafeBoot\nselection_img:\n- Image|endswith: reg.exe\n- OriginalFileName:\
  \ reg.exe\n"
explanation: Detects execution of "reg.exe" commands with the "delete" flag on safe
  boot registry keys. Often used by attacker to prevent safeboot execution of security
  products
false_positives:
- Unlikely
references:
- https://www.trendmicro.com/en_us/research/22/e/avoslocker-ransomware-variant-abuses-driver-file-to-disable-anti-Virus-scans-log4shell.html
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: reg.exe
  - OriginalFileName: reg.exe
  selection_delete:
    CommandLine|contains|all:
    - ' delete '
    - \SYSTEM\CurrentControlSet\Control\SafeBoot
  condition: all of selection_*
