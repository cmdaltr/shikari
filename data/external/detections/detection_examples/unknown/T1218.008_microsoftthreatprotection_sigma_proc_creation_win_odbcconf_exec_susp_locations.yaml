query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - :\\PerfLogs\\\n  - :\\ProgramData\\\
  \n  - :\\Temp\\\n  - :\\Users\\Public\\\n  - :\\Windows\\Registration\\CRMLog\n\
  \  - :\\Windows\\System32\\com\\dmp\\\n  - :\\Windows\\System32\\FxsTmp\\\n  - :\\\
  Windows\\System32\\Microsoft\\Crypto\\RSA\\MachineKeys\\\n  - :\\Windows\\System32\\\
  spool\\drivers\\color\\\n  - :\\Windows\\System32\\spool\\PRINTERS\\\n  - :\\Windows\\\
  System32\\spool\\SERVERS\\\n  - :\\Windows\\System32\\Tasks_Migrated\\\n  - :\\\
  Windows\\System32\\Tasks\\Microsoft\\Windows\\SyncCenter\\\n  - :\\Windows\\SysWOW64\\\
  com\\dmp\\\n  - :\\Windows\\SysWOW64\\FxsTmp\\\n  - :\\Windows\\SysWOW64\\Tasks\\\
  Microsoft\\Windows\\PLA\\System\\\n  - :\\Windows\\SysWOW64\\Tasks\\Microsoft\\\
  Windows\\SyncCenter\\\n  - :\\Windows\\Tasks\\\n  - :\\Windows\\Temp\\\n  - :\\\
  Windows\\Tracing\\\n  - \\AppData\\Local\\Temp\\\n  - \\AppData\\Roaming\\\nselection_img:\n\
  - Image|endswith: \\odbcconf.exe\n- OriginalFileName: odbcconf.exe\n"
explanation: Detects execution of "odbcconf" where the path of the DLL being registered
  is located in a potentially suspicious location.
false_positives:
- Unlikely
