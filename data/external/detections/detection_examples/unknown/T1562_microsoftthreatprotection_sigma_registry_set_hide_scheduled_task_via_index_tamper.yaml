technique_id: T1562
technique_name: Hide Schedule Task Via Index Value Tamper
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 5b16df71-8615-4f7f-ac9b-6c43c0509e61
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000000)\n  TargetObject|contains|all:\n  - \\SOFTWARE\\Microsoft\\\
  Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tree\\\n  - Index\n"
explanation: 'Detects when the "index" value of a scheduled task is modified from
  the registry

  Which effectively hides it from any tooling such as "schtasks /query" (Read the
  referenced link for more information about the effects of this technique)

  '
false_positives:
- Unlikely
references:
