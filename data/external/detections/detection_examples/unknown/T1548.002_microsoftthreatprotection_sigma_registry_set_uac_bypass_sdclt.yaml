query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection1:\n\
  \  TargetObject|endswith: Software\\Classes\\exefile\\shell\\runas\\command\\isolatedCommand\n\
  selection2:\n  Details|re: -1[0-9]{3}\\\\Software\\\\Classes\\\\\n  TargetObject|endswith:\
  \ Software\\Classes\\Folder\\shell\\open\\command\\SymbolicLinkValue\n"
explanation: Detects the pattern of UAC Bypass using registry key manipulation of
  sdclt.exe (e.g. UACMe 53)
false_positives:
