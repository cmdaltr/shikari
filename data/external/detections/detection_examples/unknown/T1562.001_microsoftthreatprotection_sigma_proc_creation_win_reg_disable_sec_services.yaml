technique_id: T1562.001
technique_name: Security Service Disabled Via Reg.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 5e95028c-5229-4214-afae-d653d573d0ec
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli_reg_start:\n  CommandLine|contains:\n  - \\AppIDSvc\n  - \\MsMpSvc\n\
  \  - \\NisSrv\n  - \\SecurityHealthService\n  - \\Sense\n  - \\UsoSvc\n  - \\WdBoot\n\
  \  - \\WdFilter\n  - \\WdNisDrv\n  - \\WdNisSvc\n  - \\WinDefend\n  - \\wscsvc\n\
  \  - \\wuauserv\n  CommandLine|contains|all:\n  - d 4\n  - v Start\nselection_reg_add:\n\
  \  CommandLine|contains|all:\n  - reg\n  - add\n"
explanation: Detects execution of "reg.exe" to disable security services such as Windows
  Defender.
false_positives:
- Unlikely
references:
- https://twitter.com/JohnLaTwC/status/1415295021041979392
- https://github.com/gordonbay/Windows-On-Reins/blob/e587ac7a0407847865926d575e3c46f68cf7c68d/wor.ps1
- https://vms.drweb.fr/virus/?i=24144899
- https://bidouillesecurity.com/disable-windows-defender-in-powershell/
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg_add:
    CommandLine|contains|all:
    - reg
    - add
  selection_cli_reg_start:
    CommandLine|contains|all:
    - d 4
    - v Start
    CommandLine|contains:
    - \AppIDSvc
    - \MsMpSvc
    - \NisSrv
    - \SecurityHealthService
    - \Sense
    - \UsoSvc
    - \WdBoot
    - \WdFilter
    - \WdNisDrv
    - \WdNisSvc
    - \WinDefend
    - \wscsvc
    - \wuauserv
  condition: all of selection_*
