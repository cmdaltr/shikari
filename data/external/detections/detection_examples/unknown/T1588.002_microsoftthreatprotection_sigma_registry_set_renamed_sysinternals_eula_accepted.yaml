technique_id: T1588.002
technique_name: Usage of Renamed Sysinternals Tools - RegistrySet
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 8023f872-3f1d-4301-a384-801889917ab4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_* and not 1 of filter_optional_*\nfilter_main_image_names:\n  Image|endswith:\n\
  \  - \\PsExec.exe\n  - \\PsExec64.exe\n  - \\procdump.exe\n  - \\procdump64.exe\n\
  \  - \\handle.exe\n  - \\handle64.exe\n  - \\livekd.exe\n  - \\livekd64.exe\n  -\
  \ \\procexp.exe\n  - \\procexp64.exe\n  - \\psloglist.exe\n  - \\psloglist64.exe\n\
  \  - \\pspasswd.exe\n  - \\pspasswd64.exe\n  - \\ADExplorer.exe\n  - \\ADExplorer64.exe\n\
  filter_optional_null:\n  Image: null\nselection:\n  TargetObject|contains:\n  -\
  \ \\PsExec\n  - \\ProcDump\n  - \\Handle\n  - \\LiveKd\n  - \\Process Explorer\n\
  \  - \\PsLoglist\n  - \\PsPasswd\n  - \\Active Directory Explorer\n  TargetObject|endswith:\
  \ \\EulaAccepted\n"
explanation: Detects non-sysinternals tools setting the "accepteula" key which normally
  is set on sysinternals tool execution
false_positives:
- Unlikely
references:
- Internal Research
tags:
- attack.resource-development
- attack.t1588.002
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains:
    - \PsExec
    - \ProcDump
    - \Handle
    - \LiveKd
    - \Process Explorer
    - \PsLoglist
    - \PsPasswd
    - \Active Directory Explorer
    TargetObject|endswith: \EulaAccepted
  filter_main_image_names:
    Image|endswith:
    - \PsExec.exe
    - \PsExec64.exe
    - \procdump.exe
    - \procdump64.exe
    - \handle.exe
    - \handle64.exe
    - \livekd.exe
    - \livekd64.exe
    - \procexp.exe
    - \procexp64.exe
    - \psloglist.exe
    - \psloglist64.exe
    - \pspasswd.exe
    - \pspasswd64.exe
    - \ADExplorer.exe
    - \ADExplorer64.exe
  filter_optional_null:
    Image: null
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
