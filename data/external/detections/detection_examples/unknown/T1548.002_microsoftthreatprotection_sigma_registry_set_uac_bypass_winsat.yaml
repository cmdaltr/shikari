query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details|endswith: \\appdata\\local\\temp\\system32\\winsat.exe\n  Details|startswith:\
  \ c:\\users\\\n  TargetObject|contains: \\Root\\InventoryApplicationFile\\winsat.exe|\n\
  \  TargetObject|endswith: \\LowerCaseLongPath\n"
explanation: Detects the pattern of UAC Bypass using a path parsing issue in winsat.exe
  (UACMe 52)
false_positives:
- Unknown
