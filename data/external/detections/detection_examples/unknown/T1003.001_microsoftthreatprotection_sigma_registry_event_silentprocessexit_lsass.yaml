query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetObject|contains: Microsoft\\Windows NT\\CurrentVersion\\SilentProcessExit\\\
  lsass.exe\n"
explanation: Detects changes to the Registry in which a monitor program gets registered
  to dump the memory of the lsass.exe process
