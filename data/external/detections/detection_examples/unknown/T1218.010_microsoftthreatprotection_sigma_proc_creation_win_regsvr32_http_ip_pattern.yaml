technique_id: T1218.010
technique_name: Potentially Suspicious Regsvr32 HTTP IP Pattern
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 2dd2c217-bf68-437a-b57c-fe9fd01d5de8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_img:\n- Image|endswith: \\regsvr32.exe\n- OriginalFileName: REGSVR32.EXE\n\
  selection_ip:\n  CommandLine|contains:\n  - ' /i:http://1'\n  - ' /i:http://2'\n\
  \  - ' /i:http://3'\n  - ' /i:http://4'\n  - ' /i:http://5'\n  - ' /i:http://6'\n\
  \  - ' /i:http://7'\n  - ' /i:http://8'\n  - ' /i:http://9'\n  - ' /i:https://1'\n\
  \  - ' /i:https://2'\n  - ' /i:https://3'\n  - ' /i:https://4'\n  - ' /i:https://5'\n\
  \  - ' /i:https://6'\n  - ' /i:https://7'\n  - ' /i:https://8'\n  - ' /i:https://9'\n\
  \  - ' -i:http://1'\n  - ' -i:http://2'\n  - ' -i:http://3'\n  - ' -i:http://4'\n\
  \  - ' -i:http://5'\n  - ' -i:http://6'\n  - ' -i:http://7'\n  - ' -i:http://8'\n\
  \  - ' -i:http://9'\n  - ' -i:https://1'\n  - ' -i:https://2'\n  - ' -i:https://3'\n\
  \  - ' -i:https://4'\n  - ' -i:https://5'\n  - ' -i:https://6'\n  - ' -i:https://7'\n\
  \  - ' -i:https://8'\n  - ' -i:https://9'\n"
explanation: Detects regsvr32 execution to download and install DLLs located remotely
  where the address is an IP address.
false_positives:
- FQDNs that start with a number such as "7-Zip"
