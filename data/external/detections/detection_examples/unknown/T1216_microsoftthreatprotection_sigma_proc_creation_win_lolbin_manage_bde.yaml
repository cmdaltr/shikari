query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_wscript_*\
  \ or (selection_parent and not selection_filter_cmd)\nselection_filter_cmd:\n  Image|endswith:\
  \ \\cmd.exe\nselection_parent:\n  ParentCommandLine|contains: manage-bde.wsf\n \
  \ ParentImage|endswith:\n  - \\cscript.exe\n  - \\wscript.exe\nselection_wscript_cli:\n\
  \  CommandLine|contains: manage-bde.wsf\nselection_wscript_img:\n- Image|endswith:\
  \ \\wscript.exe\n- OriginalFileName: wscript.exe\n"
explanation: Detects potential abuse of the "manage-bde.wsf" script as a LOLBIN to
  proxy execution
false_positives:
- Unlikely
