technique_id: T1134
technique_name: Suspicious SYSTEM User Process Creation
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 2617e7ed-adb7-40ba-b0f3-8f9945fe6c09
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection* and\
  \ not 1 of filter_*\nfilter_config_mgr:\n  ParentImage|contains: :\\Packages\\Plugins\\\
  Microsoft.GuestConfiguration.ConfigurationforWindows\\\nfilter_java:\n  CommandLine|contains:\
  \ ' -ma '\n  Image|contains:\n  - :\\Program Files (x86)\\Java\\\n  - :\\Program\
  \ Files\\Java\\\n  Image|endswith: \\bin\\jp2launcher.exe\n  ParentImage|contains:\n\
  \  - :\\Program Files (x86)\\Java\\\n  - :\\Program Files\\Java\\\n  ParentImage|endswith:\
  \ \\bin\\javaws.exe\nfilter_main_ping:\n  CommandLine|contains|all:\n  - ping\n\
  \  - 127.0.0.1\n  - ' -n '\nfilter_vs:\n  Image|endswith: \\PING.EXE\n  ParentCommandLine|contains:\
  \ \\DismFoDInstall.cmd\nselection:\n  IntegrityLevel:\n  - System\n  - S-1-16-16384\n\
  \  User|contains:\n  - AUTHORI\n  - AUTORI\nselection_special:\n- Image|endswith:\n\
  \  - \\calc.exe\n  - \\cscript.exe\n  - \\forfiles.exe\n  - \\hh.exe\n  - \\mshta.exe\n\
  \  - \\ping.exe\n  - \\wscript.exe\n- CommandLine|re: net\\s+user\\s+\n- CommandLine|contains:\n\
  \  - ' -NoP '\n  - ' -W Hidden '\n  - ' -decode '\n  - ' /decode '\n  - ' /urlcache\
  \ '\n  - ' -urlcache '\n  - ' -e* JAB'\n  - ' -e* SUVYI'\n  - ' -e* SQBFAFgA'\n\
  \  - ' -e* aWV4I'\n  - ' -e* IAB'\n  - ' -e* PAA'\n  - ' -e* aQBlAHgA'\n  - vssadmin\
  \ delete shadows\n  - reg SAVE HKLM\n  - ' -ma '\n  - Microsoft\\Windows\\CurrentVersion\\\
  Run\n  - .downloadstring(\n  - .downloadfile(\n  - ' /ticket:'\n  - 'dpapi::'\n\
  \  - event::clear\n  - event::drop\n  - id::modify\n  - 'kerberos::'\n  - 'lsadump::'\n\
  \  - 'misc::'\n  - 'privilege::'\n  - 'rpc::'\n  - 'sekurlsa::'\n  - 'sid::'\n \
  \ - 'token::'\n  - vault::cred\n  - vault::list\n  - ' p::d '\n  - ;iex(\n  - MiniDump\n"
explanation: Detects a suspicious process creation as SYSTEM user (suspicious program
  or command line parameter)
false_positives:
- Administrative activity
- Scripts and administrative tools used in the monitored environment
- Monitoring activity
references:
- Internal Research
- https://tools.thehacker.recipes/mimikatz/modules
tags:
- attack.credential-access
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134
- attack.t1003
- attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    IntegrityLevel:
    - System
    - S-1-16-16384
    User|contains:
    - AUTHORI
    - AUTORI
  selection_special:
  - Image|endswith:
    - \calc.exe
    - \cscript.exe
    - \forfiles.exe
    - \hh.exe
    - \mshta.exe
    - \ping.exe
    - \wscript.exe
  - CommandLine|re: net\s+user\s+
  - CommandLine|contains:
    - ' -NoP '
    - ' -W Hidden '
    - ' -decode '
    - ' /decode '
    - ' /urlcache '
    - ' -urlcache '
    - ' -e* JAB'
    - ' -e* SUVYI'
    - ' -e* SQBFAFgA'
    - ' -e* aWV4I'
    - ' -e* IAB'
    - ' -e* PAA'
    - ' -e* aQBlAHgA'
    - vssadmin delete shadows
    - reg SAVE HKLM
    - ' -ma '
    - Microsoft\Windows\CurrentVersion\Run
    - .downloadstring(
    - .downloadfile(
    - ' /ticket:'
    - 'dpapi::'
    - event::clear
    - event::drop
    - id::modify
    - 'kerberos::'
    - 'lsadump::'
    - 'misc::'
    - 'privilege::'
    - 'rpc::'
    - 'sekurlsa::'
    - 'sid::'
    - 'token::'
    - vault::cred
    - vault::list
    - ' p::d '
    - ;iex(
    - MiniDump
  filter_main_ping:
    CommandLine|contains|all:
    - ping
    - 127.0.0.1
    - ' -n '
  filter_vs:
    Image|endswith: \PING.EXE
    ParentCommandLine|contains: \DismFoDInstall.cmd
  filter_config_mgr:
    ParentImage|contains: :\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
  filter_java:
    ParentImage|contains:
    - :\Program Files (x86)\Java\
    - :\Program Files\Java\
    ParentImage|endswith: \bin\javaws.exe
    Image|contains:
    - :\Program Files (x86)\Java\
    - :\Program Files\Java\
    Image|endswith: \bin\jp2launcher.exe
    CommandLine|contains: ' -ma '
  condition: all of selection* and not 1 of filter_*
