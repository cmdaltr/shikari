query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Image|startswith:\n  - C:\\Windows\\System32\\\n  - C:\\Windows\\SysWOW64\\\
  \n  - C:\\Windows\\WinSxS\\\nselection:\n- Image|endswith: \\msiexec.exe\n- OriginalFileName:\
  \ \\msiexec.exe\n"
