technique_id: T1105
technique_name: Suspicious Invoke-WebRequest Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 5e3cc4d8-3e68-43db-8656-eaaeefdec9cc
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_commands:\n  CommandLine|contains:\n  - 'curl '\n  - Invoke-WebRequest\n\
  \  - 'iwr '\n  - 'wget '\nselection_flags:\n  CommandLine|contains:\n  - ' -ur'\n\
  \  - ' -o'\nselection_img:\n- Image|endswith:\n  - \\powershell_ise.exe\n  - \\\
  powershell.exe\n  - \\pwsh.exe\n- OriginalFileName:\n  - powershell_ise.EXE\n  -\
  \ PowerShell.EXE\n  - pwsh.dll\nselection_susp_locations:\n  CommandLine|contains:\n\
  \  - \\AppData\\\n  - \\Desktop\\\n  - \\Temp\\\n  - \\Users\\Public\\\n  - '%AppData%'\n\
  \  - '%Public%'\n  - '%Temp%'\n  - '%tmp%'\n  - :\\Windows\\\n"
explanation: Detects a suspicious call to Invoke-WebRequest cmdlet where the and output
  is located in a suspicious location
false_positives:
- Unknown
references:
- https://www.sentinelone.com/blog/living-off-windows-defender-lockbit-ransomware-sideloads-cobalt-strike-through-microsoft-security-tool/
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \powershell_ise.exe
    - \powershell.exe
    - \pwsh.exe
  - OriginalFileName:
    - powershell_ise.EXE
    - PowerShell.EXE
    - pwsh.dll
  selection_commands:
    CommandLine|contains:
    - 'curl '
    - Invoke-WebRequest
    - 'iwr '
    - 'wget '
  selection_flags:
    CommandLine|contains:
    - ' -ur'
    - ' -o'
  selection_susp_locations:
    CommandLine|contains:
    - \AppData\
    - \Desktop\
    - \Temp\
    - \Users\Public\
    - '%AppData%'
    - '%Public%'
    - '%Temp%'
    - '%tmp%'
    - :\Windows\
  condition: all of selection_*
