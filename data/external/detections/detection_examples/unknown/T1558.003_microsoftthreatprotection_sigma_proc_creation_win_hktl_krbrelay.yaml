query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cli_1:\n\
  \  CommandLine|contains|all:\n  - ' -spn '\n  - ' -clsid '\n  - ' -rbcd '\nselection_cli_2:\n\
  \  CommandLine|contains|all:\n  - shadowcred\n  - clsid\n  - spn\nselection_cli_3:\n\
  \  CommandLine|contains|all:\n  - 'spn '\n  - 'session '\n  - 'clsid '\nselection_img:\n\
  - Image|endswith: \\KrbRelay.exe\n- OriginalFileName: KrbRelay.exe\n"
explanation: Detects the use of KrbRelay, a Kerberos relaying tool
false_positives:
- Unlikely
references:
- https://github.com/cube0x0/KrbRelay
tags:
- attack.credential-access
