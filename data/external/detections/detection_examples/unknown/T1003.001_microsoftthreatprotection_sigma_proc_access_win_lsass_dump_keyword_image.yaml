technique_id: T1003.001
technique_name: LSASS Memory Access by Tool With Dump Keyword In Name
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 9bd012ee-0dff-44d7-84a0-aa698cfd87a3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  GrantedAccess|endswith:\n  - '10'\n  - '30'\n  - '50'\n  - '70'\n  - '90'\n \
  \ - B0\n  - D0\n  - F0\n  - '18'\n  - '38'\n  - '58'\n  - '78'\n  - '98'\n  - B8\n\
  \  - D8\n  - F8\n  - 1A\n  - 3A\n  - 5A\n  - 7A\n  - 9A\n  - BA\n  - DA\n  - FA\n\
  \  - '0x14C2'\n  - FF\n  SourceImage|contains: dump\n  TargetImage|endswith: \\\
  lsass.exe\n"
explanation: Detects LSASS process access requests from a source process with the
  "dump" keyword in its image name.
false_positives:
- Rare programs that contain the word dump in their name and access lsass
references:
- https://twitter.com/_xpn_/status/1491557187168178176
- https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dump-credentials-from-lsass-process-without-mimikatz
tags:
