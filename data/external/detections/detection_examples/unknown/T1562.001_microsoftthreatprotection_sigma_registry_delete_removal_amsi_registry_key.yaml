query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_defender:\n  Image|endswith: \\MsMpEng.exe\n  Image|startswith:\n\
  \  - C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\\n  - C:\\Program Files\\\
  Windows Defender\\\n  - C:\\Program Files (x86)\\Windows Defender\\\nselection:\n\
  \  TargetObject|endswith:\n  - '{2781761E-28E0-4109-99FE-B9D127C57AFE}'\n  - '{A7C452EF-8E9F-42EB-9F2B-245613CA0DC9}'\n"
explanation: Detects the deletion of AMSI provider registry key entries in HKLM\Software\Microsoft\AMSI.
  This technique could be used by an attacker in order to disable AMSI inspection.
