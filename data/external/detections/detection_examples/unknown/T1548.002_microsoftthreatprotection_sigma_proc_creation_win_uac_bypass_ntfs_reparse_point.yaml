technique_id: T1548.002
technique_name: UAC Bypass Using NTFS Reparse Point - Process
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 39ed3c80-e6a1-431b-9df3-911ac53d08a7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection1:\n\
  \  CommandLine|endswith: \\AppData\\Local\\Temp\\update.msu\n  CommandLine|startswith:\
  \ '\"C:\\Windows\\system32\\wusa.exe\"  /quiet C:\\Users\\'\n  IntegrityLevel:\n\
  \  - High\n  - System\n  - S-1-16-16384\n  - S-1-16-12288\nselection2:\n  CommandLine|contains|all:\n\
  \  - C:\\Users\\\n  - \\AppData\\Local\\Temp\\\n  - \\dismhost.exe {\n  Image|endswith:\
  \ \\DismHost.exe\n  IntegrityLevel:\n  - High\n  - System\n  ParentCommandLine:\
  \ '\"C:\\Windows\\system32\\dism.exe\" /online /quiet /norestart /add-package\n\
  \    /packagepath:\"C:\\Windows\\system32\\pe386\" /ignorecheck'\n"
explanation: Detects the pattern of UAC Bypass using NTFS reparse point and wusa.exe
  DLL hijacking (UACMe 36)
false_positives:
- Unknown
references:
- https://github.com/hfiref0x/UACME
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|startswith: '"C:\Windows\system32\wusa.exe"  /quiet C:\Users\'
    CommandLine|endswith: \AppData\Local\Temp\update.msu
    IntegrityLevel:
    - High
    - System
    - S-1-16-16384
    - S-1-16-12288
  selection2:
    ParentCommandLine: '"C:\Windows\system32\dism.exe" /online /quiet /norestart /add-package
      /packagepath:"C:\Windows\system32\pe386" /ignorecheck'
    IntegrityLevel:
    - High
    - System
    CommandLine|contains|all:
    - C:\Users\
    - \AppData\Local\Temp\
    - \dismhost.exe {
    Image|endswith: \DismHost.exe
  condition: 1 of selection*
