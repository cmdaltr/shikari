query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - cpassword\n  - \\sysvol\\\n  -\
  \ .xml\nselection_img:\n- Image|endswith:\n  - \\find.exe\n  - \\findstr.exe\n-\
  \ OriginalFileName:\n  - FIND.EXE\n  - FINDSTR.EXE\n"
explanation: Look for the encrypted cpassword value within Group Policy Preference
  files on the Domain Controller. This value can be decrypted with gpp-decrypt.
false_positives:
- Unknown
