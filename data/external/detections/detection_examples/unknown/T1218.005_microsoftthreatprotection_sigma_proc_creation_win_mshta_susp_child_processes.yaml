technique_id: T1218.005
technique_name: Suspicious MSHTA Child Process
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.83
validated: true
source: sigma
sigma_id: 03cc0c25-389f-4bf8-b48d-11878079f1ca
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_child:\n\
  - Image|endswith:\n  - \\cmd.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\wscript.exe\n\
  \  - \\cscript.exe\n  - \\sh.exe\n  - \\bash.exe\n  - \\reg.exe\n  - \\regsvr32.exe\n\
  \  - \\bitsadmin.exe\n- OriginalFileName:\n  - Cmd.Exe\n  - PowerShell.EXE\n  -\
  \ pwsh.dll\n  - wscript.exe\n  - cscript.exe\n  - Bash.exe\n  - reg.exe\n  - REGSVR32.EXE\n\
  \  - bitsadmin.exe\nselection_parent:\n  ParentImage|endswith: \\mshta.exe\n"
explanation: Detects a suspicious process spawning from an "mshta.exe" process, which
  could be indicative of a malicious HTA script execution
false_positives:
- Printer software / driver installations
- HP software
references:
- https://www.trustedsec.com/july-2015/malicious-htas/
tags:
- attack.defense-evasion
- attack.t1218.005
- car.2013-02-003
- car.2013-03-001
- car.2014-04-003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: \mshta.exe
  selection_child:
  - Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
    - \cscript.exe
    - \sh.exe
    - \bash.exe
    - \reg.exe
    - \regsvr32.exe
    - \bitsadmin.exe
  - OriginalFileName:
    - Cmd.Exe
    - PowerShell.EXE
    - pwsh.dll
    - wscript.exe
    - cscript.exe
    - Bash.exe
    - reg.exe
    - REGSVR32.EXE
    - bitsadmin.exe
  condition: all of selection*
