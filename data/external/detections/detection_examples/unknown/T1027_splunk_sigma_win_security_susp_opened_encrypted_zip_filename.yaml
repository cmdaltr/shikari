source: sigma
sigma_id: 54f0434b-726f-48a1-b2aa-067df14516e4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and selection_filename\n\
  selection:\n  EventID: 5379\n  TargetName|contains: Microsoft_Windows_Shell_ZipFolder:filename\n\
  selection_filename:\n  TargetName|contains:\n  - invoice\n  - new order\n  - rechnung\n\
  \  - factura\n  - delivery\n  - purchase\n  - order\n  - payment\n"
explanation: Detects the extraction of password protected ZIP archives with suspicious
  file names. See the filename variable for more details on which file has been opened.
false_positives:
- Legitimate used of encrypted ZIP files
references:
- https://twitter.com/sbousseaden/status/1523383197513379841
