query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|endswith:\n  - .bin\n  - .bmp\n  - .cr2\n  - .dat\n\
  \  - .eps\n  - .gif\n  - .ico\n  - .jpeg\n  - .jpg\n  - .log\n  - .nef\n  - .orf\n\
  \  - .png\n  - .raw\n  - .rtf\n  - .sr2\n  - .temp\n  - .tif\n  - .tiff\n  - .tmp\n\
  \  - .txt\nselection_img:\n- Image|endswith: \\regsvr32.exe\n- OriginalFileName:\
  \ REGSVR32.EXE\n"
explanation: Detects the execution of REGSVR32.exe with DLL files masquerading as
  other files
false_positives:
- Unlikely
