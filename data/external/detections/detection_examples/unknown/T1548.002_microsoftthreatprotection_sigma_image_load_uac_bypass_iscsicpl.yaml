query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ImageLoaded|contains|all:\n  - C:\\Windows\\\n  - iscsiexe.dll\nselection:\n\
  \  Image: C:\\Windows\\SysWOW64\\iscsicpl.exe\n  ImageLoaded|endswith: \\iscsiexe.dll\n"
explanation: Detects the "iscsicpl.exe" UAC bypass technique that leverages a DLL
  Search Order hijacking technique to load a custom DLL's from temp or a any user
  controlled location in the users %PATH%
false_positives:
- Unknown
