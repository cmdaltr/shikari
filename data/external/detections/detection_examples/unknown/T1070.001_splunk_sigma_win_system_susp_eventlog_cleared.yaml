technique_id: T1070.001
technique_name: Important Windows Eventlog Cleared
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.81
validated: true
source: sigma
sigma_id: 100ef69e-3327-481c-8e5c-6d80d9507556
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Channel:\n  - Microsoft-Windows-PowerShell/Operational\n  - Microsoft-Windows-Sysmon/Operational\n\
  \  - PowerShellCore/Operational\n  - Security\n  - System\n  - Windows PowerShell\n\
  \  EventID: 104\n  Provider_Name: Microsoft-Windows-Eventlog\n"
explanation: Detects the clearing of one of the Windows Core Eventlogs. e.g. caused
  by "wevtutil cl" command execution
false_positives:
- Rollout of log collection agents (the setup routine often includes a reset of the
  local Eventlog)
- System provisioning (system reset before the golden image creation)
