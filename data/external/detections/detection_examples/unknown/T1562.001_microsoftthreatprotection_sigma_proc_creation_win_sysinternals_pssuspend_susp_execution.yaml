fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 4beb6ae0-f85b-41e2-8f18-8668abc8af78
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains: msmpeng.exe\nselection_img:\n- OriginalFileName:\
  \ pssuspend.exe\n- Image|endswith:\n  - \\pssuspend.exe\n  - \\pssuspend64.exe\n"
explanation: Detects suspicious execution of Sysinternals PsSuspend, where the utility
  is used to suspend critical processes such as AV or EDR to bypass defenses
false_positives:
- Unlikely
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/pssuspend
- https://twitter.com/0gtweet/status/1638069413717975046
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: pssuspend.exe
  - Image|endswith:
    - \pssuspend.exe
    - \pssuspend64.exe
  selection_cli:
    CommandLine|contains: msmpeng.exe
  condition: all of selection_*
