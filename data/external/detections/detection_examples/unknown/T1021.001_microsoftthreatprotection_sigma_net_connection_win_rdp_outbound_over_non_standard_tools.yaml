technique_id: T1021.001
technique_name: Outbound RDP Connections Over Non-Standard Tools
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: ed74fe75-7594-4b4b-ae38-e38e3fd2eb23
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_* and not 1 of filter_optional_*\nfilter_main_mstsc:\n  Image:\n \
  \ - C:\\Windows\\System32\\mstsc.exe\n  - C:\\Windows\\SysWOW64\\mstsc.exe\nfilter_optional_avast:\n\
  \  Image|endswith:\n  - \\Avast Software\\Avast\\AvastSvc.exe\n  - \\Avast\\AvastSvc.exe\n\
  filter_optional_chrome:\n  Image: C:\\Program Files\\Google\\Chrome\\Application\\\
  chrome.exe\nfilter_optional_dns:\n  Image: C:\\Windows\\System32\\dns.exe\n  Protocol:\
  \ udp\n  SourcePort: 53\nfilter_optional_empty:\n  Image: ''\nfilter_optional_firefox:\n\
  \  Image: C:\\Program Files\\Mozilla Firefox\\firefox.exe\nfilter_optional_null:\n\
  \  Image: null\nfilter_optional_sentinel_one:\n  Image|endswith: \\Ranger\\SentinelRanger.exe\n\
  filter_optional_splunk:\n  Image|startswith: C:\\Program Files\\SplunkUniversalForwarder\\\
  bin\\\nfilter_optional_sysinternals_rdcman:\n  Image|endswith: \\RDCMan.exe\nfilter_optional_third_party:\n\
  \  Image|endswith:\n  - \\FSAssessment.exe\n  - \\FSDiscovery.exe\n  - \\MobaRTE.exe\n\
  \  - \\mRemote.exe\n  - \\mRemoteNG.exe\n  - \\Passwordstate.exe\n  - \\RemoteDesktopManager.exe\n\
  \  - \\RemoteDesktopManager64.exe\n  - \\RemoteDesktopManagerFree.exe\n  - \\RSSensor.exe\n\
  \  - \\RTS2App.exe\n  - \\RTSApp.exe\n  - \\spiceworks-finder.exe\n  - \\Terminals.exe\n\
  \  - \\ws_TunnelService.exe\nfilter_optional_thor:\n  Image|endswith:\n  - \\thor.exe\n\
  \  - \\thor64.exe\nfilter_optional_tsplus:\n  Image:\n  - C:\\Program Files\\TSplus\\\
  Java\\bin\\HTML5service.exe\n  - C:\\Program Files (x86)\\TSplus\\Java\\bin\\HTML5service.exe\n\
  filter_optional_unknown:\n  Image: <unknown process>\nselection:\n  DestinationPort:\
  \ 3389\n  Initiated: 'true'\n"
explanation: 'Detects Non-Standard tools initiating a connection over port 3389 indicating
  possible lateral movement.

  An initial baseline is required before using this utility to exclude third party
  RDP tooling that you might use.

  '
false_positives:
- Third party RDP tools
references:
- https://portal.msrc.microsoft.com/en-US/security-guidance/advisory/CVE-2019-0708
tags:
- attack.lateral-movement
- attack.t1021.001
- car.2013-07-002
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationPort: 3389
    Initiated: 'true'
  filter_main_mstsc:
    Image:
    - C:\Windows\System32\mstsc.exe
    - C:\Windows\SysWOW64\mstsc.exe
  filter_optional_dns:
    Image: C:\Windows\System32\dns.exe
    SourcePort: 53
    Protocol: udp
  filter_optional_avast:
    Image|endswith:
    - \Avast Software\Avast\AvastSvc.exe
    - \Avast\AvastSvc.exe
  filter_optional_sysinternals_rdcman:
    Image|endswith: \RDCMan.exe
  filter_optional_chrome:
    Image: C:\Program Files\Google\Chrome\Application\chrome.exe
  filter_optional_third_party:
    Image|endswith:
    - \FSAssessment.exe
    - \FSDiscovery.exe
    - \MobaRTE.exe
    - \mRemote.exe
    - \mRemoteNG.exe
    - \Passwordstate.exe
    - \RemoteDesktopManager.exe
    - \RemoteDesktopManager64.exe
    - \RemoteDesktopManagerFree.exe
    - \RSSensor.exe
    - \RTS2App.exe
    - \RTSApp.exe
    - \spiceworks-finder.exe
    - \Terminals.exe
    - \ws_TunnelService.exe
  filter_optional_thor:
    Image|endswith:
    - \thor.exe
    - \thor64.exe
  filter_optional_splunk:
    Image|startswith: C:\Program Files\SplunkUniversalForwarder\bin\
  filter_optional_sentinel_one:
    Image|endswith: \Ranger\SentinelRanger.exe
  filter_optional_firefox:
    Image: C:\Program Files\Mozilla Firefox\firefox.exe
  filter_optional_tsplus:
    Image:
    - C:\Program Files\TSplus\Java\bin\HTML5service.exe
    - C:\Program Files (x86)\TSplus\Java\bin\HTML5service.exe
  filter_optional_null:
    Image: null
  filter_optional_empty:
    Image: ''
  filter_optional_unknown:
    Image: <unknown process>
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
