technique_id: T1055
technique_name: Suspicious Child Process Of Wermgr.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 396f6630-f3ac-44e3-bfc8-1b161bc00c4e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_rundll32:\n  CommandLine|contains:\n  - -queuereporting\n\
  \  - -responsepester\n  CommandLine|contains|all:\n  - C:\\Windows\\system32\\WerConCpl.dll\n\
  \  - 'LaunchErcApp '\n  Image|endswith: \\rundll32.exe\nselection:\n  Image|endswith:\n\
  \  - \\cmd.exe\n  - \\cscript.exe\n  - \\ipconfig.exe\n  - \\mshta.exe\n  - \\net.exe\n\
  \  - \\net1.exe\n  - \\netstat.exe\n  - \\nslookup.exe\n  - \\powershell_ise.exe\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n\
  \  - \\systeminfo.exe\n  - \\whoami.exe\n  - \\wscript.exe\n  ParentImage|endswith:\
  \ \\wermgr.exe\n"
explanation: Detects suspicious Windows Error Reporting manager (wermgr.exe) child
  process
false_positives:
- Unknown
references:
- https://www.trendmicro.com/en_us/research/22/j/black-basta-infiltrates-networks-via-qakbot-brute-ratel-and-coba.html
- https://www.echotrail.io/insights/search/wermgr.exe
- https://github.com/binderlabs/DirCreate2System
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: \wermgr.exe
    Image|endswith:
    - \cmd.exe
    - \cscript.exe
    - \ipconfig.exe
    - \mshta.exe
    - \net.exe
    - \net1.exe
    - \netstat.exe
    - \nslookup.exe
    - \powershell_ise.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \systeminfo.exe
    - \whoami.exe
    - \wscript.exe
  filter_main_rundll32:
    Image|endswith: \rundll32.exe
    CommandLine|contains|all:
    - C:\Windows\system32\WerConCpl.dll
    - 'LaunchErcApp '
    CommandLine|contains:
    - -queuereporting
    - -responsepester
  condition: selection and not 1 of filter_main_*
