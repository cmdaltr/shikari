technique_id: T1003.001
technique_name: Potential Credential Dumping Via WER
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 9a4ccd1a-3526-4d99-b980-9f9c5d3a6ff3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_*\nfilter_lsass:\n  ParentImage: C:\\Windows\\System32\\lsass.exe\n\
  selection_cli:\n  CommandLine|contains|all:\n  - ' -u -p '\n  - ' -ip '\n  - ' -s\
  \ '\n  ParentUser|contains:\n  - AUTHORI\n  - AUTORI\n  User|contains:\n  - AUTHORI\n\
  \  - AUTORI\nselection_img:\n- Image|endswith: \\Werfault.exe\n- OriginalFileName:\
  \ WerFault.exe\n"
explanation: Detects potential credential dumping via Windows Error Reporting LSASS
  Shtinkering technique which uses the Windows Error Reporting to dump lsass
false_positives:
- Windows Error Reporting might produce similar behavior. In that case, check the
  PID associated with the "-p" parameter in the CommandLine.
references:
- https://github.com/deepinstinct/Lsass-Shtinkering
- https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: \Werfault.exe
  - OriginalFileName: WerFault.exe
  selection_cli:
    ParentUser|contains:
    - AUTHORI
    - AUTORI
    User|contains:
    - AUTHORI
    - AUTORI
    CommandLine|contains|all:
    - ' -u -p '
    - ' -ip '
    - ' -s '
  filter_lsass:
    ParentImage: C:\Windows\System32\lsass.exe
  condition: all of selection_* and not 1 of filter_*
