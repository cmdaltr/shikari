fidelity_score: 0.86
validated: true
source: sigma
sigma_id: fc014922-5def-4da9-a0fc-28c973f41bfb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Details: '%CommonProgramFiles%\\System\\wab32.dll'\nselection:\n  TargetObject|endswith:\
  \ \\Software\\Microsoft\\WAB\\DLLPath\n"
explanation: This rule detects that the path to the DLL written in the registry is
  different from the default one. Launched WAB.exe tries to load the DLL from Registry.
