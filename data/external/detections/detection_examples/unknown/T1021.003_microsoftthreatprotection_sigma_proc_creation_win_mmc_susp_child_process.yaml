query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection1:\n\
  \  ParentImage|endswith: \\mmc.exe\nselection2:\n- Image|endswith:\n  - \\cmd.exe\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n  - \\wscript.exe\n  - \\cscript.exe\n  -\
  \ \\sh.exe\n  - \\bash.exe\n  - \\reg.exe\n  - \\regsvr32.exe\n- Image|contains:\
  \ \\BITSADMIN\n"
explanation: Detects a Windows command line executable started from MMC
