technique_id: T1562.001
technique_name: Disable Windows Defender AV Security Monitoring
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: a7ee1722-c3c5-aeff-3212-c777e4733217
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_pwsh_*\
  \ or (selection_sc_binary and 1 of selection_sc_tamper_*)\nselection_pwsh_binary:\n\
  - Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\n- OriginalFileName:\n \
  \ - PowerShell.EXE\n  - pwsh.dll\nselection_pwsh_cli:\n  CommandLine|contains:\n\
  \  - -DisableBehaviorMonitoring $true\n  - -DisableRuntimeMonitoring $true\nselection_sc_binary:\n\
  - Image|endswith: \\sc.exe\n- OriginalFileName: sc.exe\nselection_sc_tamper_cmd_delete:\n\
  \  CommandLine|contains|all:\n  - delete\n  - WinDefend\nselection_sc_tamper_cmd_disabled:\n\
  \  CommandLine|contains|all:\n  - config\n  - WinDefend\n  - start=disabled\nselection_sc_tamper_cmd_stop:\n\
  \  CommandLine|contains|all:\n  - stop\n  - WinDefend\n"
explanation: Detects attackers attempting to disable Windows Defender using Powershell
false_positives:
- Minimal, for some older versions of dev tools, such as pycharm, developers were
  known to sometimes disable Windows Defender to improve performance, but this generally
  is not considered a good security practice.
references:
- https://research.nccgroup.com/2020/06/23/wastedlocker-a-new-ransomware-variant-developed-by-the-evil-corp-group/
- https://rvsec0n.wordpress.com/2020/01/24/malwares-that-bypass-windows-defender/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_pwsh_binary:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  selection_pwsh_cli:
    CommandLine|contains:
    - -DisableBehaviorMonitoring $true
    - -DisableRuntimeMonitoring $true
  selection_sc_binary:
  - Image|endswith: \sc.exe
  - OriginalFileName: sc.exe
  selection_sc_tamper_cmd_stop:
    CommandLine|contains|all:
    - stop
    - WinDefend
  selection_sc_tamper_cmd_delete:
    CommandLine|contains|all:
    - delete
    - WinDefend
  selection_sc_tamper_cmd_disabled:
    CommandLine|contains|all:
    - config
    - WinDefend
    - start=disabled
  condition: all of selection_pwsh_* or (selection_sc_binary and 1 of selection_sc_tamper_*)
