technique_id: T1003.002
technique_name: NTDS.DIT Creation By Uncommon Process
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 11b1ed55-154d-4e82-8ad7-83739298f720
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_ntds and 1\
  \ of selection_process_*\nselection_ntds:\n  TargetFilename|endswith: \\ntds.dit\n\
  selection_process_img:\n  Image|endswith:\n  - \\cmd.exe\n  - \\cscript.exe\n  -\
  \ \\mshta.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n  - \\\
  rundll32.exe\n  - \\wscript.exe\n  - \\wsl.exe\n  - \\wt.exe\nselection_process_paths:\n\
  \  Image|contains:\n  - \\AppData\\\n  - \\Temp\\\n  - \\Public\\\n  - \\PerfLogs\\\
  \n"
explanation: Detects creation of a file named "ntds.dit" (Active Directory Database)
  by an uncommon process or a process located in a suspicious directory
false_positives:
- Unknown
references:
- https://stealthbits.com/blog/extracting-password-hashes-from-the-ntds-dit-file/
- https://adsecurity.org/?p=2398
tags:
- attack.credential-access
- attack.t1003.002
- attack.t1003.003
logsource:
  product: windows
  category: file_event
detection:
  selection_ntds:
    TargetFilename|endswith: \ntds.dit
  selection_process_img:
    Image|endswith:
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \wscript.exe
    - \wsl.exe
    - \wt.exe
  selection_process_paths:
    Image|contains:
    - \AppData\
    - \Temp\
    - \Public\
    - \PerfLogs\
  condition: selection_ntds and 1 of selection_process_*
