technique_id: T1562.001
technique_name: Disabling Windows Defender WMI Autologger Session via Reg.exe
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: a1b2c3d4-e5f6-a7b8-c9d0-e1f2a3b4c5d6
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_enable:\n  CommandLine|contains: '0x00000001'\n\
  selection_img:\n- Image|endswith: \\reg.exe\n- OriginalFileName: reg.exe\nselection_reg_add:\n\
  \  CommandLine|contains|all:\n  - add\n  - '0'\nselection_reg_path:\n  CommandLine|contains:\n\
  \  - \\Control\\WMI\\Autologger\\DefenderApiLogger\\Start\n  - \\Control\\WMI\\\
  Autologger\\DefenderAuditLogger\\Start\n"
explanation: 'Detects the use of reg.exe to disable the Event Tracing for Windows
  (ETW) Autologger session for Windows Defender API and Audit events.

  By setting the ''Start'' value to ''0'' for the ''DefenderApiLogger'' or ''DefenderAuditLogger''
  session, an attacker can prevent these critical security events

  from being logged, effectively blinding monitoring tools that rely on this data.
  This is a powerful defense evasion technique.

  '
false_positives:
- Highly unlikely
references:
- https://research.splunk.com/endpoint/76406a0f-f5e0-4167-8e1f-337fdc0f1b0c/
- https://docs.microsoft.com/en-us/windows/win32/etw/configuring-and-starting-an-autologger-session
- https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
- https://blog.malwarebytes.com/malwarebytes-news/2021/02/lazyscripter-from-empire-to-double-rat/
- https://www.binarly.io/blog/design-issues-of-modern-edrs-bypassing-etw-based-solutions
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \reg.exe
  - OriginalFileName: reg.exe
  selection_reg_path:
    CommandLine|contains:
    - \Control\WMI\Autologger\DefenderApiLogger\Start
    - \Control\WMI\Autologger\DefenderAuditLogger\Start
  selection_reg_add:
    CommandLine|contains|all:
    - add
    - '0'
  filter_main_enable:
    CommandLine|contains: '0x00000001'
  condition: all of selection_* and not 1 of filter_main_*
