technique_id: T1218.001
technique_name: Remote CHM File Download/Execution Via HH.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: f57c58b3-ee69-4ef5-9041-455bf39aaa89
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - http://\n  - https://\n  - \\\\\\\\\
  \nselection_img:\n- OriginalFileName: HH.exe\n- Image|endswith: \\hh.exe\n"
explanation: Detects the usage of "hh.exe" to execute/download remotely hosted ".chm"
  files.
false_positives:
- Unknown
references:
- https://www.splunk.com/en_us/blog/security/follina-for-protocol-handlers.html
