technique_id: T1027
technique_name: Invoke-Obfuscation Obfuscated IEX Invocation - Security
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: fd0f5778-d3cb-4c9a-9695-66759d04702a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_eid:\n  EventID: 4697\nselection_servicefilename:\n- ServiceFileName|re:\
  \ \\$PSHome\\[\\s*\\d{1,3}\\s*\\]\\s*\\+\\s*\\$PSHome\\[\n- ServiceFileName|re:\
  \ \\$ShellId\\[\\s*\\d{1,3}\\s*\\]\\s*\\+\\s*\\$ShellId\\[\n- ServiceFileName|re:\
  \ \\$env:Public\\[\\s*\\d{1,3}\\s*\\]\\s*\\+\\s*\\$env:Public\\[\n- ServiceFileName|re:\
  \ \\$env:ComSpec\\[(\\s*\\d{1,3}\\s*,){2}\n- ServiceFileName|re: \\\\*mdr\\*\\W\\\
  s*\\)\\.Name\n- ServiceFileName|re: \\$VerbosePreference\\.ToString\\(\n- ServiceFileName|re:\
  \ \\String\\]\\s*\\$VerbosePreference\n"
explanation: Detects all variations of obfuscated powershell IEX invocation code generated
  by Invoke-Obfuscation framework from the code block linked in the references
false_positives:
- Unknown
references:
- https://github.com/danielbohannon/Invoke-Obfuscation/blob/f20e7f843edd0a3a7716736e9eddfa423395dd26/Out-ObfuscatedStringCommand.ps1#L873-L888
tags:
- attack.defense-evasion
- attack.t1027
logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  selection_eid:
    EventID: 4697
  selection_servicefilename:
  - ServiceFileName|re: \$PSHome\[\s*\d{1,3}\s*\]\s*\+\s*\$PSHome\[
  - ServiceFileName|re: \$ShellId\[\s*\d{1,3}\s*\]\s*\+\s*\$ShellId\[
  - ServiceFileName|re: \$env:Public\[\s*\d{1,3}\s*\]\s*\+\s*\$env:Public\[
  - ServiceFileName|re: \$env:ComSpec\[(\s*\d{1,3}\s*,){2}
  - ServiceFileName|re: \\*mdr\*\W\s*\)\.Name
  - ServiceFileName|re: \$VerbosePreference\.ToString\(
  - ServiceFileName|re: \String\]\s*\$VerbosePreference
  condition: all of selection_*
