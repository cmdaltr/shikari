technique_id: T1564.004
technique_name: Suspicious File Download From File Sharing Websites -  File Stream
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 52182dfb-afb7-41db-b4bc-5336cb29b464
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_domain:\n  Contents|contains:\n  - .githubusercontent.com\n  - anonfiles.com\n\
  \  - cdn.discordapp.com\n  - ddns.net\n  - dl.dropboxusercontent.com\n  - ghostbin.co\n\
  \  - glitch.me\n  - gofile.io\n  - hastebin.com\n  - mediafire.com\n  - mega.nz\n\
  \  - onrender.com\n  - pages.dev\n  - paste.ee\n  - pastebin.com\n  - pastebin.pl\n\
  \  - pastetext.net\n  - pixeldrain.com\n  - privatlab.com\n  - privatlab.net\n \
  \ - send.exploit.in\n  - sendspace.com\n  - storage.googleapis.com\n  - storjshare.io\n\
  \  - supabase.co\n  - temp.sh\n  - transfer.sh\n  - trycloudflare.com\n  - ufile.io\n\
  \  - w3spaces.com\n  - workers.dev\nselection_extension:\n  TargetFilename|contains:\n\
  \  - .cpl:Zone\n  - .dll:Zone\n  - .exe:Zone\n  - .hta:Zone\n  - .lnk:Zone\n  -\
  \ .one:Zone\n  - .vbe:Zone\n  - .vbs:Zone\n  - .xll:Zone\n"
explanation: Detects the download of suspicious file type from a well-known file and
  paste sharing domain
false_positives:
- Some false positives might occur with binaries download via Github
references:
- https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=90015
