level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - Signature|startswith: PWS\n- Signature|contains:\n  - Certify\n  - DCSync\n  -\
  \ DumpCreds\n  - DumpLsass\n  - DumpPert\n  - HTool/WCE\n  - Kekeo\n  - Lazagne\n\
  \  - LsassDump\n  - Mimikatz\n  - MultiDump\n  - Nanodump\n  - NativeDump\n  - Outflank\n\
  \  - PShlSpy\n  - PSWTool\n  - PWCrack\n  - PWDump\n  - PWS.\n  - PWSX\n  - pypykatz\n\
  \  - Rubeus\n  - SafetyKatz\n  - SecurityTool\n  - SharpChrome\n  - SharpDPAPI\n\
  \  - SharpDump\n  - SharpKatz\n  - SharpS.\n  - ShpKatz\n  - TrickDump\n"
explanation: 'Detects a highly relevant Antivirus alert that reports a password dumper.

  This event must not be ignored just because the AV has blocked the malware but investigate,
  how it came there in the first place.

  '
