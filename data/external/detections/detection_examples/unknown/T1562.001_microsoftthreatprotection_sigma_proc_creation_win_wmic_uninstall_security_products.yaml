technique_id: T1562.001
technique_name: Potential Tampering With Security Products Via WMIC
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 847d5ff3-8a31-4737-a970-aeae8fe21765
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_cli_*\
  \ and selection_product\nselection_cli_1:\n  CommandLine|contains|all:\n  - wmic\n\
  \  - 'product where '\n  - call\n  - uninstall\n  - /nointeractive\nselection_cli_2:\n\
  \  CommandLine|contains:\n  - call delete\n  - call terminate\n  CommandLine|contains|all:\n\
  \  - wmic\n  - 'caption like '\nselection_cli_3:\n  CommandLine|contains|all:\n\
  \  - 'process '\n  - 'where '\n  - delete\nselection_product:\n  CommandLine|contains:\n\
  \  - '%carbon%'\n  - '%cylance%'\n  - '%endpoint%'\n  - '%eset%'\n  - '%malware%'\n\
  \  - '%Sophos%'\n  - '%symantec%'\n  - Antivirus\n  - 'AVG '\n  - Carbon Black\n\
  \  - CarbonBlack\n  - Cb Defense Sensor 64-bit\n  - Crowdstrike Sensor\n  - 'Cylance\
  \ '\n  - Dell Threat Defense\n  - DLP Endpoint\n  - Endpoint Detection\n  - Endpoint\
  \ Protection\n  - Endpoint Security\n  - Endpoint Sensor\n  - ESET File Security\n\
  \  - LogRhythm System Monitor Service\n  - Malwarebytes\n  - McAfee Agent\n  - Microsoft\
  \ Security Client\n  - Sophos Anti-Virus\n  - Sophos AutoUpdate\n  - Sophos Credential\
  \ Store\n  - Sophos Management Console\n  - Sophos Management Database\n  - Sophos\
  \ Management Server\n  - Sophos Remote Management System\n  - Sophos Update Manager\n\
  \  - Threat Protection\n  - VirusScan\n  - Webroot SecureAnywhere\n  - Windows Defender\n"
explanation: Detects uninstallation or termination of security products using the
  WMIC utility
false_positives:
- Legitimate administration
references:
- https://twitter.com/cglyer/status/1355171195654709249
