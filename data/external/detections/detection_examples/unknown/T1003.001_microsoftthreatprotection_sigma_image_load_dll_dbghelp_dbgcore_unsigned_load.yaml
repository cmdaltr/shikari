technique_id: T1003.001
technique_name: Suspicious Unsigned Dbghelp/Dbgcore DLL Loaded
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: bdc64095-d59a-42a2-8588-71fd9c9d9abc
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ImageLoaded|endswith:\n  - \\dbghelp.dll\n  - \\dbgcore.dll\n  Signed: 'false'\n"
explanation: 'Detects the load of dbghelp/dbgcore DLL (used to make memory dumps)
  by suspicious processes.

  Tools like ProcessHacker and some attacker tradecract use MiniDumpWriteDump API
  found in dbghelp.dll or dbgcore.dll.

  As an example, SilentTrynity C2 Framework has a module that leverages this API to
  dump the contents of Lsass.exe and transfer it over the network back to the attacker''s
  machine.

  '
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/windows/win32/api/minidumpapiset/nf-minidumpapiset-minidumpwritedump
- https://www.pinvoke.net/default.aspx/dbghelp/MiniDumpWriteDump.html
- https://medium.com/@fsx30/bypass-edrs-memory-protection-introduction-to-hooking-2efb21acffd6
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
