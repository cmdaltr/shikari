query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img or selection_cli_required\
  \ or all of selection_cli_attack_rbcd_*\n  or selection_cli_attack_changepass or\
  \ selection_cli_attack_addgrpname or selection_cli_attack_smb\nselection_cli_attack_addgrpname:\n\
  \  CommandLine|contains|all:\n  - '-addgroupmember '\n  - '-group '\n  - '-groupuser\
  \ '\nselection_cli_attack_changepass:\n  CommandLine|contains: '-chp '\n  CommandLine|contains|all:\n\
  \  - '-chpPass '\n  - '-chpUser '\nselection_cli_attack_rbcd_main:\n  CommandLine|contains:\
  \ '-rbcd '\nselection_cli_attack_rbcd_options:\n  CommandLine|contains:\n  - '-cn\
  \ '\n  - '--computername '\nselection_cli_attack_smb:\n  CommandLine|contains:\n\
  \  - interactive\n  - secrets\n  - service-add\n  CommandLine|contains|all:\n  -\
  \ '-smb '\n  - '--smbkeyword '\nselection_cli_required:\n  CommandLine|contains|all:\n\
  \  - ' -clsid '\n  - ' -target '\n  - ' -victim '\nselection_img:\n- Image|endswith:\
  \ \\RemoteKrbRelay.exe\n- OriginalFileName: RemoteKrbRelay.exe\n"
explanation: 'Detects the use of RemoteKrbRelay, a Kerberos relaying tool via CommandLine
  flags and PE metadata.

  '
false_positives:
- Unlikely
references:
- https://github.com/CICADA8-Research/RemoteKrbRelay
tags:
- attack.credential-access
- attack.t1558.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \RemoteKrbRelay.exe
  - OriginalFileName: RemoteKrbRelay.exe
  selection_cli_required:
    CommandLine|contains|all:
    - ' -clsid '
    - ' -target '
    - ' -victim '
  selection_cli_attack_smb:
    CommandLine|contains|all:
    - '-smb '
    - '--smbkeyword '
    CommandLine|contains:
    - interactive
    - secrets
    - service-add
  selection_cli_attack_rbcd_main:
    CommandLine|contains: '-rbcd '
  selection_cli_attack_rbcd_options:
    CommandLine|contains:
    - '-cn '
    - '--computername '
  selection_cli_attack_changepass:
    CommandLine|contains: '-chp '
    CommandLine|contains|all:
    - '-chpPass '
    - '-chpUser '
  selection_cli_attack_addgrpname:
    CommandLine|contains|all:
    - '-addgroupmember '
    - '-group '
    - '-groupuser '
  condition: selection_img or selection_cli_required or all of selection_cli_attack_rbcd_*
    or selection_cli_attack_changepass or selection_cli_attack_addgrpname or selection_cli_attack_smb
