  \  - IMPHASH=1195F7935954A2CD09157390C33F8E8C\n  - IMPHASH=129F58DE3D687FB7F012BF6C3D679997\n\
  \  - IMPHASH=2C617A175D0086251642C6619F7CC8BA\n  - IMPHASH=8828F0B906F7844358FB92A899E9520F\n\
  \  - IMPHASH=AF76D95157EC554DC1EF178E4E66D447\n  - IMPHASH=E1B04316B61ACA31DD52ABBEC0A37FD5\n"
explanation: 'Detects execution of EDR-Freeze, a tool that exploits the MiniDumpWriteDump
  function and WerFaultSecure.exe to suspend EDR and Antivirus processes on Windows.

  EDR-Freeze leverages a race-condition attack to put security processes into a dormant
  state by suspending WerFaultSecure at the moment it freezes the target process.

  This technique does not require kernel-level exploits or BYOVD, but instead abuses
  user-mode functionality to temporarily disable monitoring by EDR or Antimalware
  solutions.

  '
