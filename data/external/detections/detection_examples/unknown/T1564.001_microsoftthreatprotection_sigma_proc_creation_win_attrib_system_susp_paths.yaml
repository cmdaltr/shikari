technique_id: T1564.001
technique_name: Set Suspicious Files as System Files Using Attrib.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: efec536f-72e8-4656-8960-5e85d091345b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection* and\
  \ not 1 of filter_optional_*\nfilter_optional_installer:\n  CommandLine|contains|all:\n\
  \  - \\Windows\\TEMP\\\n  - .exe\nselection_cli:\n  CommandLine|contains: ' +s'\n\
  selection_ext:\n  CommandLine|contains:\n  - .bat\n  - .dll\n  - .exe\n  - .hta\n\
  \  - .ps1\n  - .vbe\n  - .vbs\nselection_img:\n- Image|endswith: \\attrib.exe\n\
  - OriginalFileName: ATTRIB.EXE\nselection_paths:\n  CommandLine|contains:\n  - '\
  \ %'\n  - \\Users\\Public\\\n  - \\AppData\\Local\\\n  - \\ProgramData\\\n  - \\\
  Downloads\\\n  - \\Windows\\Temp\\\n"
explanation: 'Detects the usage of attrib with the "+s" option to set scripts or executables
  located in suspicious locations as system files to hide them from users and make
  them unable to be deleted with simple rights. The rule limits the search to specific
  extensions and directories to avoid FPs

  '
false_positives:
- Unknown
references:
- https://app.any.run/tasks/c28cabc8-a19f-40f3-a78b-cae506a5c0d4
- https://app.any.run/tasks/cfc8870b-ccd7-4210-88cf-a8087476a6d0
- https://unit42.paloaltonetworks.com/unit42-sure-ill-take-new-combojack-malware-alters-clipboards-steal-cryptocurrency/
tags:
- attack.defense-evasion
- attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \attrib.exe
  - OriginalFileName: ATTRIB.EXE
  selection_cli:
    CommandLine|contains: ' +s'
  selection_paths:
    CommandLine|contains:
    - ' %'
    - \Users\Public\
    - \AppData\Local\
    - \ProgramData\
    - \Downloads\
    - \Windows\Temp\
  selection_ext:
    CommandLine|contains:
    - .bat
    - .dll
    - .exe
    - .hta
    - .ps1
    - .vbe
    - .vbs
  filter_optional_installer:
    CommandLine|contains|all:
    - \Windows\TEMP\
    - .exe
  condition: all of selection* and not 1 of filter_optional_*
