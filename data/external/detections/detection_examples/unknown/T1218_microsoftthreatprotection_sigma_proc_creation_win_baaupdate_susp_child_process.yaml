technique_id: T1218
technique_name: Suspicious BitLocker Access Agent Update Utility Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 9f38c1db-e2ae-40bf-81d0-5b68f73fb512
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith:\n  - \\bitsadmin.exe\n  - \\cmd.exe\n  - \\cscript.exe\n  - \\\
  mshta.exe\n  - \\powershell_ise.exe\n  - \\powershell.exe\n  - \\regsvr32.exe\n\
  \  - \\rundll32.exe\n  - \\schtasks.exe\n  - \\wmic.exe\n  - \\wscript.exe\n  ParentImage|endswith:\
  \ \\baaupdate.exe\n"
explanation: 'Detects the execution of the BitLocker Access Agent Update Utility (baaupdate.exe)
  which is not a common parent process for other processes.

  Suspicious child processes spawned by baaupdate.exe could indicate an attempt at
  lateral movement via BitLocker DCOM & COM Hijacking.

  '
false_positives:
- Unknown
references:
- https://github.com/rtecCyberSec/BitlockMove
