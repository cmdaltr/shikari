technique_id: T1055
technique_name: HackTool - EfsPotato Named Pipe Creation
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 637f689e-b4a5-4a86-be0e-0100a0a33ba2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_optional_*\nfilter_optional_ctx:\n  PipeName|contains: \\CtxShare\nfilter_optional_default:\n\
  \  PipeName|startswith: \\pipe\\\nselection:\n  PipeName|contains:\n  - \\pipe\\\
  \n  - \\pipe\\srvsvc\n"
explanation: Detects the pattern of a pipe name as used by the hack tool EfsPotato
false_positives:
- \pipe\LOCAL\Monitorian
references:
- https://twitter.com/SBousseaden/status/1429530155291193354?s=20
- https://github.com/zcgonvh/EfsPotato
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1055
logsource:
  product: windows
  category: pipe_created
  definition: Note that you have to configure logging for Named Pipe Events in Sysmon
    config (Event ID 17 and Event ID 18). The basic configuration is in popular sysmon
    configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it is worth
    verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config,
    https://github.com/olafhartong/sysmon-modular. How to test detection? You can
    check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575
detection:
  selection:
    PipeName|contains:
    - \pipe\
    - \pipe\srvsvc
  filter_optional_ctx:
    PipeName|contains: \CtxShare
  filter_optional_default:
    PipeName|startswith: \pipe\
  condition: selection and not 1 of filter_optional_*
metadata:
