technique_id: T1562.010
technique_name: LSA PPL Protection Disabled Via Reg.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 8c0eca51-0f88-4db2-9183-fdfb10c703f9
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains: SYSTEM\\CurrentControlSet\\Control\\Lsa\n\
  \  CommandLine|contains|all:\n  - ' add '\n  - ' /d 0'\n  - ' /v RunAsPPL '\nselection_img:\n\
  - Image|endswith: \\reg.exe\n- OriginalFileName: reg.exe\n"
explanation: Detects the usage of the "reg.exe" utility to disable PPL protection
  on the LSA process
false_positives:
- Unlikely
references:
- https://thedfirreport.com/2022/03/21/apt35-automates-initial-access-using-proxyshell/
tags:
- attack.defense-evasion
- attack.t1562.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \reg.exe
  - OriginalFileName: reg.exe
  selection_cli:
    CommandLine|contains: SYSTEM\CurrentControlSet\Control\Lsa
    CommandLine|contains|all:
    - ' add '
    - ' /d 0'
    - ' /v RunAsPPL '
  condition: all of selection_*
