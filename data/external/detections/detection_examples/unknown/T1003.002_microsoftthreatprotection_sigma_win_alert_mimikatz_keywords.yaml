level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: keywords and not filter\n\
  filter:\n  EventID: 15\nkeywords:\n- dpapi::masterkey\n- eo.oe.kiwi\n- event::clear\n\
  - event::drop\n- gentilkiwi.com\n- kerberos::golden\n- kerberos::ptc\n- kerberos::ptt\n\
  - kerberos::tgt\n- Kiwi Legit Printer\n- 'lsadump::'\n- mimidrv.sys\n- \\mimilib.dll\n\
  - misc::printnightmare\n- misc::shadowcopies\n- misc::skeleton\n- privilege::backup\n\
  - privilege::debug\n- privilege::driver\n- 'sekurlsa::'\n"
explanation: This method detects mimikatz keywords in different Eventlogs (some of
  them only appear in older Mimikatz version that are however still used by different
  threat groups)
false_positives:
- Naughty administrators
- AV Signature updates
- Files with Mimikatz in their filename
