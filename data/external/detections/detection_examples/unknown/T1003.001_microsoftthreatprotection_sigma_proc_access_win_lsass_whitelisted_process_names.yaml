technique_id: T1003.001
technique_name: LSASS Access From Potentially White-Listed Processes
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 4be8b654-0c01-4c9d-a10c-6b28467fc651
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  GrantedAccess|endswith:\n  - '10'\n  - '30'\n  - '50'\n  - '70'\n  - '90'\n \
  \ - B0\n  - D0\n  - F0\n  - '18'\n  - '38'\n  - '58'\n  - '78'\n  - '98'\n  - B8\n\
  \  - D8\n  - F8\n  - 1A\n  - 3A\n  - 5A\n  - 7A\n  - 9A\n  - BA\n  - DA\n  - FA\n\
  \  - '0x14C2'\n  - FF\n  SourceImage|endswith:\n  - \\TrolleyExpress.exe\n  - \\\
  ProcessDump.exe\n  - \\dump64.exe\n  TargetImage|endswith: \\lsass.exe\n"
explanation: 'Detects a possible process memory dump that uses a white-listed filename
  like TrolleyExpress.exe as a way to dump the LSASS process memory without Microsoft
  Defender interference

  '
false_positives:
- Unknown
references:
- https://twitter.com/_xpn_/status/1491557187168178176
