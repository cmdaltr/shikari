technique_id: T1003.003
technique_name: NTDS.DIT Creation By Uncommon Parent Process
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_file and 1\
  \ of selection_process_*\nselection_file:\n  TargetFilename|endswith: \\ntds.dit\n\
  selection_process_parent:\n  ParentImage|endswith:\n  - \\cscript.exe\n  - \\httpd.exe\n\
  \  - \\nginx.exe\n  - \\php-cgi.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\\
  w3wp.exe\n  - \\wscript.exe\nselection_process_parent_path:\n  ParentImage|contains:\n\
  \  - \\apache\n  - \\tomcat\n  - \\AppData\\\n  - \\Temp\\\n  - \\Public\\\n  -\
  \ \\PerfLogs\\\n"
explanation: Detects creation of a file named "ntds.dit" (Active Directory Database)
  by an uncommon parent process or directory
false_positives:
- Unknown
references:
- https://www.ired.team/offensive-security/credential-access-and-credential-dumping/ntds.dit-enumeration
- https://www.n00py.io/2022/03/manipulating-user-passwords-without-mimikatz/
- https://pentestlab.blog/tag/ntds-dit/
- https://github.com/samratashok/nishang/blob/414ee1104526d7057f9adaeee196d91ae447283e/Gather/Copy-VSS.ps1
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  product: windows
  category: file_event
  definition: 'Requirements: The "ParentImage" field is not available by default on
    EID 11 of Sysmon logs. To be able to use this rule to the full extent you need
    to enrich the log with additional ParentImage data'
detection:
  selection_file:
    TargetFilename|endswith: \ntds.dit
  selection_process_parent:
    ParentImage|endswith:
    - \cscript.exe
    - \httpd.exe
    - \nginx.exe
    - \php-cgi.exe
    - \powershell.exe
    - \pwsh.exe
    - \w3wp.exe
    - \wscript.exe
  selection_process_parent_path:
    ParentImage|contains:
    - \apache
    - \tomcat
    - \AppData\
    - \Temp\
    - \Public\
    - \PerfLogs\
  condition: selection_file and 1 of selection_process_*
metadata:
  created_date: 2022-03-11
  modified_date: 2023-01-05
