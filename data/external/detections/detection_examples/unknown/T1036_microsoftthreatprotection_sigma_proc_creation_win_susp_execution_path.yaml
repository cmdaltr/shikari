query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_optional_*\nfilter_optional_citrix:\n  Image|endswith: \\CitrixReceiverUpdater.exe\n\
  \  Image|startswith: C:\\Windows\\SysWOW64\\config\\systemprofile\\Citrix\\UpdaterBinaries\\\
  \nfilter_optional_ibm:\n  Image|startswith: C:\\Users\\Public\\IBM\\ClientSolutions\\\
  Start_Programs\\\nselection:\n  Image|contains:\n  - :\\Perflogs\\\n  - :\\Users\\\
  All Users\\\n  - :\\Users\\Default\\\n  - :\\Users\\NetworkService\\\n  - :\\Windows\\\
  addins\\\n  - :\\Windows\\debug\\\n  - :\\Windows\\Fonts\\\n  - :\\Windows\\Help\\\
  \n  - :\\Windows\\IME\\\n  - :\\Windows\\Media\\\n  - :\\Windows\\repair\\\n  -\
  \ :\\Windows\\security\\\n  - :\\Windows\\System32\\Tasks\\\n  - :\\Windows\\Tasks\\\
  \n  - $Recycle.bin\n  - \\config\\systemprofile\\\n  - \\Intel\\Logs\\\n  - \\RSA\\\
  MachineKeys\\\n"
explanation: Detects a potentially suspicious execution from an uncommon folder.
false_positives:
- Unknown
