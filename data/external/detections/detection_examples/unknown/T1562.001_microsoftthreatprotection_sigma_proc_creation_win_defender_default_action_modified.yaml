technique_id: T1562.001
technique_name: PowerShell Defender Threat Severity Default Action Set to 'Allow'
  or 'NoAction'
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 1e8a9b4d-3c2a-4f9b-8d1e-7c6a5b4f3d2e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_action:\n  CommandLine|contains:\n  - -LowThreatDefaultAction\n  - -ModerateThreatDefaultAction\n\
  \  - -HighThreatDefaultAction\n  - -SevereThreatDefaultAction\n  - '-ltdefac '\n\
  \  - '-mtdefac '\n  - '-htdefac '\n  - '-stdefac '\nselection_cmdlet:\n  CommandLine|contains:\
  \ Set-MpPreference\nselection_value:\n  CommandLine|contains:\n  - Allow\n  - '6'\n\
  \  - NoAction\n  - '9'\n"
explanation: 'Detects the use of PowerShell to execute the ''Set-MpPreference'' cmdlet
  to configure Windows Defender''s threat severity default action to ''Allow'' (value
  ''6'') or ''NoAction'' (value ''9'').

  This is a highly suspicious configuration change that effectively disables Defender''s
  ability to automatically mitigate threats of a certain severity level.

  An attacker might use this technique via the command line to bypass defenses before
  executing payloads.

  '
false_positives:
- Highly unlikely
references:
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
- https://learn.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/security-malware-windows-defender-threatseveritydefaultaction
- https://research.splunk.com/endpoint/7215831c-8252-4ae3-8d43-db588e82f952
- https://gist.github.com/Dump-GUY/8daef859f382b895ac6fd0cf094555d2
- https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmdlet:
    CommandLine|contains: Set-MpPreference
  selection_action:
    CommandLine|contains:
    - -LowThreatDefaultAction
    - -ModerateThreatDefaultAction
    - -HighThreatDefaultAction
    - -SevereThreatDefaultAction
    - '-ltdefac '
    - '-mtdefac '
    - '-htdefac '
    - '-stdefac '
  selection_value:
    CommandLine|contains:
    - Allow
    - '6'
    - NoAction
    - '9'
  condition: all of selection_*
