technique_id: T1588.002
technique_name: Suspicious Execution Of Renamed Sysinternals Tools - Registry
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: f50f3c09-557d-492d-81db-9064a8d4e211
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Image|endswith:\n  - \\ADExplorer.exe\n  - \\ADExplorer64.exe\n  - \\\
  handle.exe\n  - \\handle64.exe\n  - \\livekd.exe\n  - \\livekd64.exe\n  - \\procdump.exe\n\
  \  - \\procdump64.exe\n  - \\procexp.exe\n  - \\procexp64.exe\n  - \\PsExec.exe\n\
  \  - \\PsExec64.exe\n  - \\PsLoggedon.exe\n  - \\PsLoggedon64.exe\n  - \\psloglist.exe\n\
  \  - \\psloglist64.exe\n  - \\pspasswd.exe\n  - \\pspasswd64.exe\n  - \\PsPing.exe\n\
  \  - \\PsPing64.exe\n  - \\PsService.exe\n  - \\PsService64.exe\n  - \\sdelete.exe\n\
  selection:\n  EventType: CreateKey\n  TargetObject|contains:\n  - \\Active Directory\
  \ Explorer\n  - \\Handle\n  - \\LiveKd\n  - \\ProcDump\n  - \\Process Explorer\n\
  \  - \\PsExec\n  - \\PsLoggedon\n  - \\PsLoglist\n  - \\PsPasswd\n  - \\PsPing\n\
  \  - \\PsService\n  - \\SDelete\n  TargetObject|endswith: \\EulaAccepted\n"
explanation: Detects the creation of the "accepteula" key related to the Sysinternals
  tools being created from executables with the wrong name (e.g. a renamed Sysinternals
  tool)
false_positives:
- Unlikely
