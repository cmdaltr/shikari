  \  - \\wordview.exe\n  - \\certutil.exe\n  - \\certoc.exe\n  - \\CertReq.exe\n \
  \ - \\Desktopimgdownldr.exe\n  - \\esentutl.exe\n  - \\finger.exe\n  - \\notepad.exe\n\
  \  - \\AcroRd32.exe\n  - \\RdrCEF.exe\n  - \\mshta.exe\n  - \\hh.exe\n  TargetFilename|endswith:\n\
  \  - .zip\n  - .rar\n  - .7z\n  - .diagcab\n  - .appx\n"
