technique_id: T1003
technique_name: Microsoft IIS Connection Strings Decryption
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 97dbf6e2-e436-44d8-abee-4261b24d3e41
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_args:\n\
  \  CommandLine|contains|all:\n  - connectionStrings\n  - ' -pdf'\nselection_name:\n\
  - Image|endswith: \\aspnet_regiis.exe\n- OriginalFileName: aspnet_regiis.exe\n"
explanation: Detects use of aspnet_regiis to decrypt Microsoft IIS connection strings.
  An attacker with Microsoft IIS web server access via a webshell or alike can decrypt
  and dump any hardcoded connection strings, such as the MSSQL service account password
  using aspnet_regiis command.
false_positives:
- Unknown
references:
- https://www.elastic.co/guide/en/security/current/microsoft-iis-connection-strings-decryption.html
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_name:
  - Image|endswith: \aspnet_regiis.exe
  - OriginalFileName: aspnet_regiis.exe
  selection_args:
    CommandLine|contains|all:
    - connectionStrings
    - ' -pdf'
  condition: all of selection*
