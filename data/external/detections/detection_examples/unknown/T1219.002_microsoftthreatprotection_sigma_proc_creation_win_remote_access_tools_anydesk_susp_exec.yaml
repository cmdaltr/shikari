technique_id: T1219.002
technique_name: Remote Access Tool - Anydesk Execution From Suspicious Folder
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 065b00ca-5d5c-4557-ac95-64a6d0b64d86
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Image|contains:\n  - \\AppData\\\n  - Program Files (x86)\\AnyDesk\n\
  \  - Program Files\\AnyDesk\nselection:\n- Image|endswith:\n  - \\AnyDesk.exe\n\
  \  - \\AnyDeskMSI.exe\n- Description: AnyDesk\n- Product: AnyDesk\n- Company: AnyDesk\
  \ Software GmbH\n"
explanation: 'An adversary may use legitimate desktop support and remote access software,
  such as Team Viewer, Go2Assist, LogMein, AmmyyAdmin, etc, to establish an interactive
  command and control channel to target systems within networks.

  These services are commonly used as legitimate technical support software, and may
  be allowed by application control within a target environment.

  Remote access tools like VNC, Ammyy, and Teamviewer are used frequently when compared
  with other legitimate software commonly used by adversaries. (Citation: Symantec
  Living off the Land)

  '
false_positives:
- Legitimate use of AnyDesk from a non-standard folder
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-2---anydesk-files-detected-test-on-windows
- https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
