technique_id: T1218
technique_name: Suspicious DotNET CLR Usage Log Artifact
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: e0b06658-7d1d-4cd3-bf15-03467507ff7c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_rundll32:\n  CommandLine|contains|all:\n  - Temp\n\
  \  - zzzzInvokeManagedCustomActionOutOfProc\n  Image|endswith: \\rundll32.exe\n\
  \  ParentCommandLine|contains: ' -Embedding'\n  ParentImage|endswith: \\MsiExec.exe\n\
  selection:\n  TargetFilename|endswith:\n  - \\UsageLogs\\cmstp.exe.log\n  - \\UsageLogs\\\
  cscript.exe.log\n  - \\UsageLogs\\mshta.exe.log\n  - \\UsageLogs\\msxsl.exe.log\n\
  \  - \\UsageLogs\\regsvr32.exe.log\n  - \\UsageLogs\\rundll32.exe.log\n  - \\UsageLogs\\\
  svchost.exe.log\n  - \\UsageLogs\\wscript.exe.log\n  - \\UsageLogs\\wmic.exe.log\n"
explanation: Detects the creation of Usage Log files by the CLR (clr.dll). These files
  are named after the executing process once the assembly is finished executing for
  the first time in the (user) session context.
false_positives:
- Rundll32.exe with zzzzInvokeManagedCustomActionOutOfProc in command line and msiexec.exe
  as parent process - https://twitter.com/SBousseaden/status/1388064061087260675
references:
- https://bohops.com/2021/03/16/investigating-net-clr-usage-log-tampering-techniques-for-edr-evasion/
- https://github.com/olafhartong/sysmon-modular/blob/fa1ae53132403d262be2bbd7f17ceea7e15e8c78/11_file_create/include_dotnet.xml
- https://web.archive.org/web/20221026202428/https://gist.github.com/code-scrap/d7f152ffcdb3e0b02f7f394f5187f008
- https://web.archive.org/web/20230329154538/https://blog.menasec.net/2019/07/interesting-difr-traces-of-net-clr.html
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: UsageLogs folder must be monitored by the sysmon configuration'
detection:
  selection:
    TargetFilename|endswith:
    - \UsageLogs\cmstp.exe.log
    - \UsageLogs\cscript.exe.log
    - \UsageLogs\mshta.exe.log
    - \UsageLogs\msxsl.exe.log
    - \UsageLogs\regsvr32.exe.log
    - \UsageLogs\rundll32.exe.log
    - \UsageLogs\svchost.exe.log
    - \UsageLogs\wscript.exe.log
    - \UsageLogs\wmic.exe.log
  filter_main_rundll32:
    ParentImage|endswith: \MsiExec.exe
    ParentCommandLine|contains: ' -Embedding'
    Image|endswith: \rundll32.exe
    CommandLine|contains|all:
    - Temp
    - zzzzInvokeManagedCustomActionOutOfProc
  condition: selection and not 1 of filter_main_*
