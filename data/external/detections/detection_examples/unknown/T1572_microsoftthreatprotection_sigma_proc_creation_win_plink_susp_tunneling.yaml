source: sigma
sigma_id: f38ce0b9-5e97-4b47-a211-7dc8d8b871da
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_a or all of\
  \ selection_b*\nselection_a:\n  CommandLine|contains: :127.0.0.1:3389\n  Image|endswith:\
  \ \\plink.exe\nselection_b1:\n  CommandLine|contains: :3389\n  Image|endswith: \\\
  plink.exe\nselection_b2:\n  CommandLine|contains:\n  - ' -P 443'\n  - ' -P 22'\n"
explanation: Execution of plink to perform data exfiltration and tunneling
false_positives:
- Unknown
references:
- https://www.microsoft.com/security/blog/2022/07/26/malicious-iis-extensions-quietly-open-persistent-backdoors-into-servers/
tags:
