query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - '-autoreconnect '\n  - '-connect '\n  - '-id:'\n"
explanation: Detects suspicious UltraVNC command line flag combination that indicate
  a auto reconnect upon execution, e.g. startup (as seen being used by Gamaredon threat
  group)
