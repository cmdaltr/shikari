technique_id: T1219.002
technique_name: Suspicious Binary Writes Via AnyDesk
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 2d367498-5112-4ae5-a06a-96e7bc33a211
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_dlls:\n  TargetFilename|endswith: \\gcapi.dll\nselection:\n \
  \ Image|endswith:\n  - \\AnyDesk.exe\n  - \\AnyDeskMSI.exe\n  TargetFilename|endswith:\n\
  \  - .dll\n  - .exe\n"
explanation: 'Detects AnyDesk writing binary files to disk other than "gcapi.dll".

  According to RedCanary research it is highly abnormal for AnyDesk to write executable
  files to disk besides gcapi.dll,

  which is a legitimate DLL that is part of the Google Chrome web browser used to
  interact with the Google Cloud API. (See reference section for more details)

  '
false_positives:
- Unknown
