technique_id: T1003.001
technique_name: Process Memory Dump via RdrLeakDiag.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: edadb1e5-5919-4e4c-8462-a9e643b02c4b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli_dump:\n  CommandLine|contains|windash:\n  - /memdmp\n  - fullmemdmp\n\
  selection_cli_output_process:\n  CommandLine|contains|windash:\n  - ' /o '\n  -\
  \ ' /p '\nselection_img:\n- Image|endswith: \\rdrleakdiag.exe\n- OriginalFileName:\
  \ RdrLeakDiag.exe\n"
explanation: Detects the use of the Microsoft Windows Resource Leak Diagnostic tool
  "rdrleakdiag.exe" to dump process memory
false_positives:
- Unlikely
references:
- https://www.pureid.io/dumping-abusing-windows-credentials-part-1/
- https://www.crowdstrike.com/blog/overwatch-exposes-aquatic-panda-in-possession-of-log-4-shell-exploit-tools/
- https://lolbas-project.github.io/lolbas/Binaries/Rdrleakdiag/
- https://twitter.com/0gtweet/status/1299071304805560321?s=21
- https://news.sophos.com/en-us/2024/06/05/operation-crimson-palace-a-technical-deep-dive
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \rdrleakdiag.exe
  - OriginalFileName: RdrLeakDiag.exe
  selection_cli_dump:
    CommandLine|contains|windash:
    - /memdmp
    - fullmemdmp
  selection_cli_output_process:
    CommandLine|contains|windash:
    - ' /o '
    - ' /p '
  condition: all of selection_*
