technique_id: T1105
technique_name: Suspicious Desktopimgdownldr Target File
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: fc4f4817-0c53-4683-a4ee-b17a64bc1039
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter1\
  \ and not filter2\nfilter1:\n  TargetFilename|contains: C:\\Windows\\\nfilter2:\n\
  \  TargetFilename|contains:\n  - .jpg\n  - .jpeg\n  - .png\nselection:\n  Image|endswith:\
  \ \\svchost.exe\n  TargetFilename|contains: \\Personalization\\LockScreenImage\\\
  \n"
explanation: Detects a suspicious Microsoft desktopimgdownldr file creation that stores
  a file to a suspicious location or contains a file with a suspicious extension
false_positives:
- False positives depend on scripts and administrative tools used in the monitored
  environment
references:
- https://labs.sentinelone.com/living-off-windows-land-a-new-native-file-downldr/
- https://twitter.com/SBousseaden/status/1278977301745741825
tags:
- attack.command-and-control
- attack.t1105
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith: \svchost.exe
    TargetFilename|contains: \Personalization\LockScreenImage\
  filter1:
    TargetFilename|contains: C:\Windows\
  filter2:
    TargetFilename|contains:
    - .jpg
    - .jpeg
    - .png
  condition: selection and not filter1 and not filter2
