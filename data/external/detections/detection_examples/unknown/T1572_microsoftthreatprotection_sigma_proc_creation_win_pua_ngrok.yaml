technique_id: T1572
technique_name: PUA - Ngrok Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.87
validated: true
source: sigma
sigma_id: ee37eb7c-a4e7-4cd5-8fa4-efa27f1c3f31
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection1:\n\
  \  CommandLine|contains:\n  - ' tcp 139'\n  - ' tcp 445'\n  - ' tcp 3389'\n  - '\
  \ tcp 5985'\n  - ' tcp 5986'\nselection2:\n  CommandLine|contains|all:\n  - ' start\
  \ '\n  - --all\n  - --config\n  - .yml\nselection3:\n  CommandLine|contains:\n \
  \ - ' tcp '\n  - ' http '\n  - ' authtoken '\n  Image|endswith: ngrok.exe\nselection4:\n\
  \  CommandLine|contains:\n  - '.exe authtoken '\n  - .exe start --all\n"
explanation: 'Detects the use of Ngrok, a utility used for port forwarding and tunneling,
  often used by threat actors to make local protected services publicly available.

  Involved domains are bin.equinox.io for download and *.ngrok.io for connections.

  '
false_positives:
- Another tool that uses the command line switches of Ngrok
- Ngrok http 3978 (https://learn.microsoft.com/en-us/azure/bot-service/bot-service-debug-channel-ngrok?view=azure-bot-service-4.0)
