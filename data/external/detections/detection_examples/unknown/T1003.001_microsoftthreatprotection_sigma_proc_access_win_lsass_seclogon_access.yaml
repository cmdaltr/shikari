technique_id: T1003.001
technique_name: Suspicious LSASS Access Via MalSecLogon
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 472159c5-31b9-4f56-b794-b766faa8b0a7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CallTrace|contains: seclogon.dll\n  GrantedAccess: '0x14c0'\n  SourceImage|endswith:\
  \ \\svchost.exe\n  TargetImage|endswith: \\lsass.exe\n"
explanation: Detects suspicious access to LSASS handle via a call trace to "seclogon.dll"
  with a suspicious access right.
false_positives:
- Unknown
references:
- https://twitter.com/SBousseaden/status/1541920424635912196
- https://github.com/elastic/detection-rules/blob/2bc1795f3d7bcc3946452eb4f07ae799a756d94e/rules/windows/credential_access_lsass_handle_via_malseclogon.toml
- https://splintercod3.blogspot.com/p/the-hidden-side-of-seclogon-part-3.html
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    SourceImage|endswith: \svchost.exe
    GrantedAccess: '0x14c0'
    CallTrace|contains: seclogon.dll
  condition: selection
