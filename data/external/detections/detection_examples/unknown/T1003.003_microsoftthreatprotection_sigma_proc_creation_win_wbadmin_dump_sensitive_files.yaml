technique_id: T1003.003
technique_name: Sensitive File Dump Via Wbadmin.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 8b93a509-1cb8-42e1-97aa-ee24224cdc15
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_backup:\n  CommandLine|contains:\n  - start\n  - backup\nselection_img:\n\
  - Image|endswith: \\wbadmin.exe\n- OriginalFileName: WBADMIN.EXE\nselection_path:\n\
  \  CommandLine|contains:\n  - \\config\\SAM\n  - \\config\\SECURITY\n  - \\config\\\
  SYSTEM\n  - \\Windows\\NTDS\\NTDS.dit\n"
explanation: 'Detects the dump of highly sensitive files such as "NTDS.DIT" and "SECURITY"
  hive.

  Attackers can leverage the "wbadmin" utility in order to dump sensitive files that
  might contain credential or sensitive information.

  '
false_positives:
- Legitimate backup operation by authorized administrators. Matches must be investigated
  and allowed on a case by case basis.
references:
- https://github.com/LOLBAS-Project/LOLBAS/blob/2cc01b01132b5c304027a658c698ae09dd6a92bf/yml/OSBinaries/Wbadmin.yml
- https://lolbas-project.github.io/lolbas/Binaries/Wbadmin/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wbadmin-start-recovery
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wbadmin-start-backup
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \wbadmin.exe
  - OriginalFileName: WBADMIN.EXE
  selection_backup:
    CommandLine|contains:
    - start
    - backup
  selection_path:
    CommandLine|contains:
    - \config\SAM
    - \config\SECURITY
    - \config\SYSTEM
    - \Windows\NTDS\NTDS.dit
  condition: all of selection_*
