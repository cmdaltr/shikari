technique_id: T1036.007
technique_name: Suspicious Double Extension Files
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: b4926b47-a9d7-434c-b3a0-adc3fa0bd13e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_exe:\n\
  \  TargetFilename|endswith:\n  - .rar.exe\n  - .zip.exe\nselection_gen:\n  TargetFilename|contains:\n\
  \  - .doc.\n  - .docx.\n  - .gif.\n  - .jpeg.\n  - .jpg.\n  - .mp3.\n  - .mp4.\n\
  \  - .pdf.\n  - .png.\n  - .ppt.\n  - .pptx.\n  - .rtf.\n  - .svg.\n  - .txt.\n\
  \  - .xls.\n  - .xlsx.\n  TargetFilename|endswith:\n  - .exe\n  - .iso\n  - .rar\n\
  \  - .svg\n  - .zip\n"
explanation: Detects dropped files with double extensions, which is often used by
  malware as a method to abuse the fact that Windows hide default extensions by default.
false_positives:
- Unlikely
