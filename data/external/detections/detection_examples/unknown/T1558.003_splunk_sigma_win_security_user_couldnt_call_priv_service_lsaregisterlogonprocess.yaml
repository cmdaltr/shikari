query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  EventID: 4673\n  Keywords: '0x8010000000000000'\n  Service: LsaRegisterLogonProcess()\n"
explanation: The 'LsaRegisterLogonProcess' function verifies that the application
  making the function call is a logon process by checking that it has the SeTcbPrivilege
  privilege set. Possible Rubeus tries to get a handle to LSA.
