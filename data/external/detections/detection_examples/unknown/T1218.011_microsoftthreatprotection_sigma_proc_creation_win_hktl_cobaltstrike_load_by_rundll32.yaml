technique_id: T1218.011
technique_name: CobaltStrike Load by Rundll32
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: ae9c6a7c-9521-42a6-915e-5aaa8689d529
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_params:\n\
  \  CommandLine|contains: .dll\n  CommandLine|endswith:\n  - ' StartW'\n  - ',StartW'\n\
  selection_rundll:\n- Image|endswith: \\rundll32.exe\n- OriginalFileName: RUNDLL32.EXE\n\
  - CommandLine|contains:\n  - rundll32.exe\n  - 'rundll32 '\n"
explanation: Rundll32 can be use by Cobalt Strike with StartW function to load DLLs
  from the command line.
false_positives:
- Unknown
references:
- https://www.cobaltstrike.com/help-windows-executable
- https://redcanary.com/threat-detection-report/
- https://thedfirreport.com/2020/10/18/ryuk-in-5-hours/
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_rundll:
  - Image|endswith: \rundll32.exe
  - OriginalFileName: RUNDLL32.EXE
  - CommandLine|contains:
    - rundll32.exe
    - 'rundll32 '
  selection_params:
    CommandLine|contains: .dll
    CommandLine|endswith:
    - ' StartW'
    - ',StartW'
  condition: all of selection*
