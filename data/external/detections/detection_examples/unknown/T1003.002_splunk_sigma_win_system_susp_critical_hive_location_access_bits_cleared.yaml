technique_id: T1003.002
technique_name: Critical Hive In Suspicious Location Access Bits Cleared
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 39f919f3-980b-4e6f-a975-8af7e507ef2b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  EventID: 16\n  HiveName|contains:\n  - \\Temp\\SAM\n  - \\Temp\\SECURITY\n  Provider_Name:\
  \ Microsoft-Windows-Kernel-General\n"
explanation: 'Detects events from the Kernel-General ETW indicating that the access
  bits of a hive with a system like hive name located in the temp directory have been
  reset.

  This occurs when an application tries to access a hive and the hive has not be recognized
  since the last 7 days (by default).

  Registry hive dumping utilities such as QuarksPwDump were seen emitting this behavior.

  '
false_positives:
- Unknown
