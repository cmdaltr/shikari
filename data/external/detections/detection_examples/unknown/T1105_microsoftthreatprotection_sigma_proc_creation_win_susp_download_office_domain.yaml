technique_id: T1105
technique_name: Suspicious Download from Office Domain
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 00d49ed5-4491-4271-a8db-650a4ef6f8c1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_domains:\n  CommandLine|contains:\n  - https://attachment.outlook.live.net/owa/\n\
  \  - https://onenoteonlinesync.onenote.com/onenoteonlinesync/\nselection_download:\n\
  - Image|endswith:\n  - \\curl.exe\n  - \\wget.exe\n- CommandLine|contains:\n  -\
  \ Invoke-WebRequest\n  - 'iwr '\n  - 'curl '\n  - 'wget '\n  - Start-BitsTransfer\n\
  \  - .DownloadFile(\n  - .DownloadString(\n"
explanation: Detects suspicious ways to download files from Microsoft domains that
  are used to store attachments in Emails or OneNote documents
false_positives:
- Scripts or tools that download attachments from these domains (OneNote, Outlook
  365)
references:
- https://twitter.com/an0n_r0/status/1474698356635193346?s=12
- https://twitter.com/mrd0x/status/1475085452784844803?s=12
