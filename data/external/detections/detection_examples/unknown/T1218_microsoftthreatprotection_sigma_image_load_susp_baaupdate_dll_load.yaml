technique_id: T1218
technique_name: BaaUpdate.exe Suspicious DLL Load
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 6e8fe0a8-ba0b-4a93-8f9e-82657e7a5984
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  ImageLoaded|contains:\n  - :\\Perflogs\\\n  - :\\Users\\Default\\\n  - :\\Users\\\
  Public\\\n  - :\\Windows\\Temp\\\n  - \\AppData\\Local\\Temp\\\n  - \\AppData\\\
  Roaming\\\n  - \\Contacts\\\n  - \\Favorites\\\n  - \\Favourites\\\n  - \\Links\\\
  \n  - \\Music\\\n  - \\Pictures\\\n  - \\ProgramData\\\n  - \\Temporary Internet\n\
  \  - \\Videos\\\n  ImageLoaded|endswith: .dll\n  Image|endswith: \\BaaUpdate.exe\n"
explanation: 'Detects BitLocker Access Agent Update Utility (baaupdate.exe) loading
  DLLs from suspicious locations that are publicly writable which could indicate an
  attempt to lateral movement via BitLocker DCOM & COM Hijacking.

  This technique abuses COM Classes configured as INTERACTIVE USER to spawn processes
  in the context of the logged-on user''s session. Specifically, it targets the BDEUILauncher
  Class (CLSID ab93b6f1-be76-4185-a488-a9001b105b94)

  which can launch BaaUpdate.exe, which is vulnerable to COM Hijacking when started
  with input parameters. This allows attackers to execute code in the user''s context
  without needing to steal credentials or use additional techniques to compromise
  the account.

  '
false_positives:
- Unknown
references:
