technique_id: T1218.011
technique_name: Bad Opsec Defaults Sacrificial Processes With Improper Arguments
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: a7c3d773-caef-227e-a7e7-c2f13c622329
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_* and\
  \ not 1 of filter_optional_*\nfilter_optional_chromium_installer:\n  CommandLine|endswith:\
  \ rundll32.exe\n  Image|endswith: \\rundll32.exe\n  ParentCommandLine|contains:\
  \ '--uninstall '\n  ParentImage|contains:\n  - \\AppData\\Local\\BraveSoftware\\\
  Brave-Browser\\Application\\\n  - \\AppData\\Local\\Google\\Chrome\\Application\\\
  \n  ParentImage|endswith: \\Installer\\setup.exe\nfilter_optional_edge_update:\n\
  \  CommandLine|endswith: rundll32.exe\n  Image|endswith: \\rundll32.exe\n  ParentImage|contains:\
  \ \\AppData\\Local\\Microsoft\\EdgeUpdate\\Install\\{\nselection_regasm:\n  CommandLine|endswith:\
  \ regasm.exe\n  Image|endswith: \\regasm.exe\nselection_regsvcs:\n  CommandLine|endswith:\
  \ regsvcs.exe\n  Image|endswith: \\regsvcs.exe\nselection_regsvr32:\n  CommandLine|endswith:\
  \ regsvr32.exe\n  Image|endswith: \\regsvr32.exe\nselection_rundll32:\n  CommandLine|endswith:\
  \ rundll32.exe\n  Image|endswith: \\rundll32.exe\nselection_werfault:\n  CommandLine|endswith:\
  \ WerFault.exe\n  Image|endswith: \\WerFault.exe\n"
explanation: 'Detects attackers using tooling with bad opsec defaults.

  E.g. spawning a sacrificial process to inject a capability into the process without
  taking into account how the process is normally run.

  One trivial example of this is using rundll32.exe without arguments as a sacrificial
  process (default in CS, now highlighted by c2lint), running WerFault without arguments
  (Kraken - credit am0nsec), and other examples.

  '
false_positives:
- Unlikely
references:
- https://blog.malwarebytes.com/malwarebytes-news/2020/10/kraken-attack-abuses-wer-service/
- https://www.cobaltstrike.com/help-opsec
- https://twitter.com/CyberRaiju/status/1251492025678983169
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/regsvr32
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/rundll32
- https://learn.microsoft.com/en-us/dotnet/framework/tools/regasm-exe-assembly-registration-tool
- https://learn.microsoft.com/en-us/dotnet/framework/tools/regsvcs-exe-net-services-installation-tool
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_werfault:
    Image|endswith: \WerFault.exe
    CommandLine|endswith: WerFault.exe
  selection_rundll32:
    Image|endswith: \rundll32.exe
    CommandLine|endswith: rundll32.exe
  selection_regsvcs:
    Image|endswith: \regsvcs.exe
    CommandLine|endswith: regsvcs.exe
  selection_regasm:
    Image|endswith: \regasm.exe
    CommandLine|endswith: regasm.exe
  selection_regsvr32:
    Image|endswith: \regsvr32.exe
    CommandLine|endswith: regsvr32.exe
  filter_optional_edge_update:
    ParentImage|contains: \AppData\Local\Microsoft\EdgeUpdate\Install\{
    Image|endswith: \rundll32.exe
    CommandLine|endswith: rundll32.exe
  filter_optional_chromium_installer:
    ParentImage|contains:
    - \AppData\Local\BraveSoftware\Brave-Browser\Application\
    - \AppData\Local\Google\Chrome\Application\
    ParentImage|endswith: \Installer\setup.exe
    ParentCommandLine|contains: '--uninstall '
    Image|endswith: \rundll32.exe
    CommandLine|endswith: rundll32.exe
  condition: 1 of selection_* and not 1 of filter_optional_*
