query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_block:\n  Action: 2\nselection:\n  ApplicationPath|contains:\n\
  \  - :\\PerfLogs\\\n  - :\\Temp\\\n  - :\\Tmp\\\n  - :\\Users\\Public\\\n  - :\\\
  Windows\\Tasks\\\n  - :\\Windows\\Temp\\\n  - \\AppData\\Local\\Temp\\\n  EventID:\n\
  \  - 2004\n  - 2071\n  - 2097\n"
explanation: Detects the addition of a new rule to the Windows Firewall exception
  list for an application located in a potentially suspicious location.
