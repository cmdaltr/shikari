fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 4ae3e30b-b03f-43aa-87e3-b622f4048eed
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_http:\n  CommandLine|contains:\n  - http://\n  - https://\nselection_img:\n\
  - Image|endswith:\n  - \\EXCEL.EXE\n  - \\POWERPNT.EXE\n  - \\WINWORD.exe\n- OriginalFileName:\n\
  \  - Excel.exe\n  - POWERPNT.EXE\n  - WinWord.exe\n"
explanation: Detects potential arbitrary file download using a Microsoft Office application
false_positives:
- Unknown
references:
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Winword/
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Powerpnt/
