query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not filter\nfilter:\n  CommandLine|contains|all:\n  - ' route '\n  - ' ADD '\n\
  selection_img:\n- Image|endswith:\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\\
  cmd.exe\n- OriginalFileName:\n  - PowerShell.EXE\n  - pwsh.dll\n  - Cmd.Exe\nselection_parent:\n\
  \  ParentImage|endswith:\n  - \\winlogon.exe\n  - \\services.exe\n  - \\lsass.exe\n\
  \  - \\csrss.exe\n  - \\smss.exe\n  - \\wininit.exe\n  - \\spoolsv.exe\n  - \\searchindexer.exe\n\
  \  User|contains:\n  - AUTHORI\n  - AUTORI\n"
explanation: Detection of unusual child processes by different system processes
