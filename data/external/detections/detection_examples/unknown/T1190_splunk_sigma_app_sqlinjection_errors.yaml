technique_id: T1190
technique_name: Suspicious SQL Error Messages
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 8a670c6d-7189-4b1c-8017-a417ca84a086
level: high
query: '# Sigma Detection Logic

  # Convert to platform-specific query using Sigma tools:

  # https://github.com/SigmaHQ/sigma


  condition: keywords

  keywords:

  - quoted string not properly terminated

  - You have an error in your SQL syntax

  - Unclosed quotation mark

  - ''near "*": syntax error''

  - SELECTs to the left and right of UNION do not have the same number of result columns

  '
explanation: Detects SQL error messages that indicate probing for an injection attack
false_positives:
- A syntax error in MySQL also occurs in non-dynamic (safe) queries if there is an
  empty in() clause, that may often be the case.
references:
- http://www.sqlinjection.net/errors
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: application
  product: sql
  definition: 'Requirements: application error logs must be collected (with LOG_LEVEL
    ERROR and above)'
detection:
  keywords:
  - quoted string not properly terminated
  - You have an error in your SQL syntax
  - Unclosed quotation mark
  - 'near "*": syntax error'
