fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 9ccba514-7cb6-4c5c-b377-700758f2f120
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_child:\n- Image|endswith:\n  - \\calc.exe\n  - \\notepad.exe\n- Image|contains:\n\
  \  - \\Users\\Public\\\n  - \\AppData\\Local\\Temp\\\n  - \\AppData\\Local\\Roaming\\\
  \n  - :\\Temp\\\n  - :\\Windows\\Temp\\\n  - :\\Windows\\System32\\Tasks\\\n  -\
  \ :\\Windows\\Tasks\\\nselection_parent:\n  ParentImage|endswith: \\aspnet_compiler.exe\n"
explanation: Detects potentially suspicious child processes of "aspnet_compiler.exe".
false_positives:
- Unknown
references:
- https://lolbas-project.github.io/lolbas/Binaries/Aspnet_Compiler/
- https://ijustwannared.team/2020/08/01/the-curious-case-of-aspnet_compiler-exe/
tags:
- attack.defense-evasion
