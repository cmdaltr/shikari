logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: \aspnet_compiler.exe
  selection_child:
  - Image|endswith:
    - \calc.exe
    - \notepad.exe
  - Image|contains:
    - \Users\Public\
    - \AppData\Local\Temp\
    - \AppData\Local\Roaming\
    - :\Temp\
    - :\Windows\Temp\
    - :\Windows\System32\Tasks\
    - :\Windows\Tasks\
  condition: all of selection_*
