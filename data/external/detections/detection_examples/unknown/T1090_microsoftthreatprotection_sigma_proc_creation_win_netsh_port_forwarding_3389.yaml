technique_id: T1090
technique_name: RDP Port Forwarding Rule Added Via Netsh.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|all:\n  - ' i'\n  - ' p'\n  - =3389\n  -\
  \ ' c'\nselection_img:\n- Image|endswith: \\netsh.exe\n- OriginalFileName: netsh.exe\n"
explanation: Detects the execution of netsh to configure a port forwarding of port
  3389 (RDP) rule
false_positives:
- Legitimate administration activity
references:
- https://www.fireeye.com/blog/threat-research/2019/01/bypassing-network-restrictions-through-rdp-tunneling.html
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.command-and-control
- attack.t1090
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \netsh.exe
  - OriginalFileName: netsh.exe
  selection_cli:
    CommandLine|contains|all:
    - ' i'
    - ' p'
    - =3389
    - ' c'
  condition: all of selection_*
