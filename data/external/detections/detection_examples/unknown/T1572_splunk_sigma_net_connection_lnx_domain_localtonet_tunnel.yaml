source: sigma
sigma_id: c4568f5d-131f-4e78-83d4-45b2da0ec4f1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  DestinationHostname|endswith:\n  - .localto.net\n  - .localtonet.com\n  Initiated:\
  \ 'true'\n"
explanation: 'Detects an executable initiating a network connection to "LocaltoNet"
  tunneling sub-domains.

  LocaltoNet is a reverse proxy that enables localhost services to be exposed to the
  Internet.

  Attackers have been seen to use this service for command-and-control activities
  to bypass MFA and perimeter controls.

  '
false_positives:
- Legitimate use of the LocaltoNet service.
references:
- https://localtonet.com/documents/supported-tunnels
- https://cloud.google.com/blog/topics/threat-intelligence/unc3944-targets-saas-applications
