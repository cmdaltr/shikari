technique_id: T1027
technique_name: Renamed AutoIt Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: f4264e47-f522-4c38-a420-04525d5b880f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_legit_name:\n  Image|endswith:\n  - \\AutoIt.exe\n\
  \  - \\AutoIt2.exe\n  - \\AutoIt3_x64.exe\n  - \\AutoIt3.exe\nselection_1:\n  CommandLine|contains:\n\
  \  - ' /AutoIt3ExecuteScript'\n  - ' /ErrorStdOut'\nselection_2:\n  Hashes|contains:\n\
  \  - IMPHASH=FDC554B3A8683918D731685855683DDF\n  - IMPHASH=CD30A61B60B3D60CECDB034C8C83C290\n\
  \  - IMPHASH=F8A00C72F2D667D2EDBB234D0C0AE000\nselection_3:\n  OriginalFileName:\n\
  \  - AutoIt3.exe\n  - AutoIt2.exe\n  - AutoIt.exe\n"
explanation: 'Detects the execution of a renamed AutoIt2.exe or AutoIt3.exe.

  AutoIt is a scripting language and automation tool for Windows systems. While primarily
  used for legitimate automation tasks, it can be misused in cyber attacks.

  Attackers can leverage AutoIt to create and distribute malware, including keyloggers,
  spyware, and botnets. A renamed AutoIt executable is particularly suspicious.

  '
false_positives:
- Unknown
