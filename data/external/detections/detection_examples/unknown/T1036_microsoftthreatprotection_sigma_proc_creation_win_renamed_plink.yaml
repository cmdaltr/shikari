query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Image|endswith: \\plink.exe\nselection:\n- OriginalFileName: Plink\n\
  - CommandLine|contains|all:\n  - ' -l forward'\n  - ' -P '\n  - ' -R '\n"
explanation: Detects the execution of a renamed version of the Plink binary
