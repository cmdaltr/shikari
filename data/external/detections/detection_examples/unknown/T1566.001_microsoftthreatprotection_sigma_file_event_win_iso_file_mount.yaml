technique_id: T1566.001
technique_name: ISO File Created Within Temp Folders
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection_1:\n\
  \  TargetFilename|contains|all:\n  - \\AppData\\Local\\Temp\\\n  - .zip\\\n  TargetFilename|endswith:\
  \ .iso\nselection_2:\n  TargetFilename|contains: \\AppData\\Local\\Microsoft\\Windows\\\
  INetCache\\Content.Outlook\\\n  TargetFilename|endswith: .iso\n"
explanation: Detects the creation of a ISO file in the Outlook temp folder or in the
  Appdata temp folder. Typical of Qakbot TTP from end-July 2022.
false_positives:
- Potential FP by sysadmin opening a zip file containing a legitimate ISO file
