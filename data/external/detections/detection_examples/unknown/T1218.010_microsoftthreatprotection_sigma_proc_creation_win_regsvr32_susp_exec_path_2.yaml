query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img and (selection_path_1\
  \ or (selection_path_2 and not selection_exclude_known_dirs))\n  and not 1 of filter_main_*\n\
  filter_main_empty:\n  CommandLine: ''\nfilter_main_null:\n  CommandLine: null\n\
  selection_exclude_known_dirs:\n  CommandLine|contains:\n  - C:\\Program Files (x86)\\\
  \n  - C:\\Program Files\\\n  - C:\\ProgramData\\\n  - C:\\Users\\\n  - ' C:\\Windows\\\
  '\n  - ' \"C:\\Windows\\'\n  - ' ''C:\\Windows\\'\nselection_img:\n- Image|endswith:\
  \ \\regsvr32.exe\n- OriginalFileName: REGSVR32.EXE\nselection_path_1:\n  CommandLine|contains:\n\
  \  - :\\PerfLogs\\\n  - :\\Temp\\\n  - \\Windows\\Registration\\CRMLog\n  - \\Windows\\\
  System32\\com\\dmp\\\n  - \\Windows\\System32\\FxsTmp\\\n  - \\Windows\\System32\\\
  Microsoft\\Crypto\\RSA\\MachineKeys\\\n  - \\Windows\\System32\\spool\\drivers\\\
  color\\\n  - \\Windows\\System32\\spool\\PRINTERS\\\n  - \\Windows\\System32\\spool\\\
  SERVERS\\\n  - \\Windows\\System32\\Tasks_Migrated\\\n  - \\Windows\\System32\\\
  Tasks\\Microsoft\\Windows\\SyncCenter\\\n  - \\Windows\\SysWOW64\\com\\dmp\\\n \
  \ - \\Windows\\SysWOW64\\FxsTmp\\\n  - \\Windows\\SysWOW64\\Tasks\\Microsoft\\Windows\\\
  PLA\\System\\\n  - \\Windows\\SysWOW64\\Tasks\\Microsoft\\Windows\\SyncCenter\\\n\
  \  - \\Windows\\Tasks\\\n  - \\Windows\\Tracing\\\nselection_path_2:\n  CommandLine|contains:\n\
  \  - ' \"C:\\'\n  - ' C:\\'\n  - ' ''C:\\'\n  - D:\\\n"
