technique_id: T1562.001
technique_name: Service Registry Key Deleted Via Reg.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 05b2aa93-1210-42c8-8d9a-2fcc13b284f5
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_delete:\n  CommandLine|contains: ' delete '\nselection_img:\n- Image|endswith:\
  \ reg.exe\n- OriginalFileName: reg.exe\nselection_key:\n  CommandLine|contains:\
  \ \\SYSTEM\\CurrentControlSet\\services\\\n"
explanation: Detects execution of "reg.exe" commands with the "delete" flag on services
  registry key. Often used by attacker to remove AV software services
false_positives:
- Unlikely
references:
- https://www.virustotal.com/gui/file/2bcd5702a7565952c44075ac6fb946c7780526640d1264f692c7664c02c68465
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: reg.exe
  - OriginalFileName: reg.exe
  selection_delete:
    CommandLine|contains: ' delete '
  selection_key:
    CommandLine|contains: \SYSTEM\CurrentControlSet\services\
  condition: all of selection_*
