technique_id: T1027
technique_name: Potential CommandLine Obfuscation Using Unicode Characters From Suspicious
  Image
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 584bca0f-3608-4402-80fd-4075ff6072e3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_img:\n  Image|endswith:\n  - \\cmd.exe\n  - \\cscript.exe\n  - \\powershell.exe\n\
  \  - \\powershell_ise.exe\n  - \\pwsh.exe\n  - \\wscript.exe\n  OriginalFileName:\n\
  \  - Cmd.EXE\n  - cscript.exe\n  - PowerShell.EXE\n  - PowerShell_ISE.EXE\n  - pwsh.dll\n\
  \  - wscript.exe\nselection_special_chars:\n  CommandLine|contains:\n  - \"\\u02E3\"\
  \n  - \"\\u02EA\"\n  - \"\\u02E2\"\n  - \"\\u2215\"\n  - \"\\u2044\"\n  - \"\\u2015\"\
  \n  - \"\\u2014\"\n  - \"\\_\"\n  - \"\\xAF\"\n  - \"\\xAE\"\n  - \"\\xB6\"\n  -\
  \ \"\\u2800\"\n"
explanation: 'Detects potential commandline obfuscation using unicode characters.

  Adversaries may attempt to make an executable or file difficult to discover or analyze
  by encrypting, encoding, or otherwise obfuscating its contents on the system or
  in transit.

  '
false_positives:
- Unknown
references:
- https://www.wietzebeukema.nl/blog/windows-command-line-obfuscation
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1027/T1027.md#atomic-test-6---dlp-evasion-via-sensitive-data-in-vba-macro-over-http
tags:
