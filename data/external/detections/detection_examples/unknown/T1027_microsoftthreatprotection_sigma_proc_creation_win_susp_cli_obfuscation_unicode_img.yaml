detection:
  selection_img:
    Image|endswith:
    - \cmd.exe
    - \cscript.exe
    - \powershell.exe
    - \powershell_ise.exe
    - \pwsh.exe
    - \wscript.exe
    OriginalFileName:
    - Cmd.EXE
    - cscript.exe
    - PowerShell.EXE
    - PowerShell_ISE.EXE
    - pwsh.dll
    - wscript.exe
  selection_special_chars:
    CommandLine|contains:
    - ˣ
    - ˪
    - ˢ
    - ∕
    - ⁄
