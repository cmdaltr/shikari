technique_id: T1555
technique_name: Suspicious Serv-U Process Pattern
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 58f4ea09-0fc2-4520-ba18-b85c540b0eaf
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith:\n  - \\cmd.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\\
  wscript.exe\n  - \\cscript.exe\n  - \\sh.exe\n  - \\bash.exe\n  - \\schtasks.exe\n\
  \  - \\regsvr32.exe\n  - \\wmic.exe\n  - \\mshta.exe\n  - \\rundll32.exe\n  - \\\
  msiexec.exe\n  - \\forfiles.exe\n  - \\scriptrunner.exe\n  ParentImage|endswith:\
  \ \\Serv-U.exe\n"
explanation: Detects a suspicious process pattern which could be a sign of an exploited
  Serv-U service
false_positives:
- Legitimate uses in which users or programs use the SSH service of Serv-U for remote
  command execution
references:
- https://www.microsoft.com/security/blog/2021/07/13/microsoft-discovers-threat-actor-targeting-solarwinds-serv-u-software-with-0-day-exploit/
tags:
