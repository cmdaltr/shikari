technique_id: T1036.003
technique_name: Potential Defense Evasion Via Rename Of Highly Relevant Binaries
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.83
validated: true
source: sigma
sigma_id: 0ba1da6d-b6ce-4366-828c-18826c9de23e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Image|endswith:\n  - \\certutil.exe\n  - \\cmstp.exe\n  - \\cscript.exe\n\
  \  - \\ie4uinit.exe\n  - \\mshta.exe\n  - \\msiexec.exe\n  - \\msxsl.exe\n  - \\\
  powershell_ise.exe\n  - \\powershell.exe\n  - \\psexec.exe\n  - \\psexec64.exe\n\
  \  - \\PSEXESVC.exe\n  - \\pwsh.exe\n  - \\reg.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n\
  \  - \\wermgr.exe\n  - \\wmic.exe\n  - \\wscript.exe\nselection:\n- Description:\
  \ Execute processes remotely\n- Product: Sysinternals PsExec\n- Description|startswith:\n\
  \  - Windows PowerShell\n  - pwsh\n- OriginalFileName:\n  - certutil.exe\n  - cmstp.exe\n\
  \  - cscript.exe\n  - IE4UINIT.EXE\n  - mshta.exe\n  - msiexec.exe\n  - msxsl.exe\n\
  \  - powershell_ise.exe\n  - powershell.exe\n  - psexec.c\n  - psexec.exe\n  - psexesvc.exe\n\
  \  - pwsh.dll\n  - reg.exe\n  - regsvr32.exe\n  - rundll32.exe\n  - WerMgr\n  -\
  \ wmic.exe\n  - wscript.exe\n"
explanation: Detects the execution of a renamed binary often used by attackers or
  malware leveraging new Sysmon OriginalFileName datapoint.
false_positives:
- Custom applications use renamed binaries adding slight change to binary name. Typically
  this is easy to spot and add to whitelist
- PsExec installed via Windows Store doesn't contain original filename field (False
  negative)
references:
