query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - '      .exe'\n  - ______.exe\n  - .doc.exe\n  - .doc.js\n\
  \  - .docx.exe\n  - .docx.js\n  - .gif.exe\n  - .jpeg.exe\n  - .jpg.exe\n  - .mkv.exe\n\
  \  - .mov.exe\n  - .mp3.exe\n  - .mp4.exe\n  - .pdf.exe\n  - .pdf.js\n  - .png.exe\n\
  \  - .ppt.exe\n  - .ppt.js\n  - .pptx.exe\n  - .pptx.js\n  - .rtf.exe\n  - .rtf.js\n\
  \  - .svg.exe\n  - .txt.exe\n  - .txt.js\n  - .xls.exe\n  - .xls.js\n  - .xlsx.exe\n\
  \  - .xlsx.js\n  - \"\\u2800\\u2800\\u2800\\u2800\\u2800\\u2800.exe\"\n  Image|endswith:\n\
  \  - '      .exe'\n  - ______.exe\n  - .doc.exe\n  - .doc.js\n  - .docx.exe\n  -\
  \ .docx.js\n  - .gif.exe\n  - .jpeg.exe\n  - .jpg.exe\n  - .mkv.exe\n  - .mov.exe\n\
  \  - .mp3.exe\n  - .mp4.exe\n  - .pdf.exe\n  - .pdf.js\n  - .png.exe\n  - .ppt.exe\n\
  \  - .ppt.js\n  - .pptx.exe\n  - .pptx.js\n  - .rtf.exe\n  - .rtf.js\n  - .svg.exe\n\
  \  - .txt.exe\n  - .txt.js\n  - .xls.exe\n  - .xls.js\n  - .xlsx.exe\n  - .xlsx.js\n\
  \  - \"\\u2800\\u2800\\u2800\\u2800\\u2800\\u2800.exe\"\n"
explanation: Detects suspicious use of an .exe extension after a non-executable file
  extension like .pdf.exe, a set of spaces or underlines to cloak the executable file
  in spear phishing campaigns
false_positives:
- Unknown
