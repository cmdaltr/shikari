query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cli_1:\n\
  \  CommandLine|contains|all:\n  - ' relay '\n  - ' -Domain '\n  - ' -ComputerName\
  \ '\nselection_cli_2:\n  CommandLine|contains|all:\n  - ' krbscm '\n  - ' -sc '\n\
  selection_cli_3:\n  CommandLine|contains|all:\n  - ' spawn '\n  - ' -d '\n  - '\
  \ -cn '\n  - ' -cp '\nselection_img:\n- Image|endswith: \\KrbRelayUp.exe\n- OriginalFileName:\
  \ KrbRelayUp.exe\n"
explanation: Detects KrbRelayUp used to perform a universal no-fix local privilege
  escalation in Windows domain environments where LDAP signing is not enforced
false_positives:
- Unlikely
