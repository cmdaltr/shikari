query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|contains:\n  - \\Users\\Public\\\n  - \\$Recycle.bin\n  - \\Users\\All\
  \ Users\\\n  - \\Users\\Default\\\n  - \\Users\\Contacts\\\n  - \\Users\\Searches\\\
  \n  - C:\\Perflogs\\\n  - \\config\\systemprofile\\\n  - \\Windows\\Fonts\\\n  -\
  \ \\Windows\\IME\\\n  - \\Windows\\addins\\\n  ParentImage|endswith:\n  - \\services.exe\n\
  \  - \\svchost.exe\n"
explanation: Detects a service binary running in a suspicious directory
