technique_id: T1212
technique_name: Suspicious NTLM Authentication on the Printer Spooler Service
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: bb76d96b-821c-47cf-944b-7ce377864492
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - spoolss\n  - srvsvc\n  - /print/pipe/\n\
  \  CommandLine|contains|all:\n  - C:\\windows\\system32\\davclnt.dll,DavSetCookie\n\
  \  - http\nselection_img:\n- Image|endswith: \\rundll32.exe\n- OriginalFileName:\
  \ RUNDLL32.EXE\n"
explanation: Detects a privilege elevation attempt by coercing NTLM authentication
  on the Printer Spooler service
false_positives:
- Unknown
references:
- https://twitter.com/med0x2e/status/1520402518685200384
- https://github.com/elastic/detection-rules/blob/dd224fb3f81d0b4bf8593c5f02a029d647ba2b2d/rules/windows/credential_access_relay_ntlm_auth_via_http_spoolss.toml
tags:
- attack.privilege-escalation
- attack.credential-access
- attack.t1212
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \rundll32.exe
  - OriginalFileName: RUNDLL32.EXE
  selection_cli:
    CommandLine|contains|all:
    - C:\windows\system32\davclnt.dll,DavSetCookie
    - http
    CommandLine|contains:
    - spoolss
    - srvsvc
    - /print/pipe/
  condition: all of selection_*
