technique_id: T1562.001
technique_name: Add SafeBoot Keys Via Reg Utility
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: d7662ff6-9e97-4596-a61d-9839e32dee8d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_flag:\n\
  \  CommandLine|contains:\n  - ' copy '\n  - ' add '\nselection_img:\n- Image|endswith:\
  \ \\reg.exe\n- OriginalFileName: reg.exe\nselection_safeboot:\n  CommandLine|contains:\
  \ \\SYSTEM\\CurrentControlSet\\Control\\SafeBoot\n"
explanation: Detects execution of "reg.exe" commands with the "add" or "copy" flags
  on safe boot registry keys. Often used by attacker to allow the ransomware to work
  in safe mode as some security products do not
false_positives:
- Unlikely
references:
- https://redacted.com/blog/bianlian-ransomware-gang-gives-it-a-go/
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \reg.exe
  - OriginalFileName: reg.exe
  selection_safeboot:
    CommandLine|contains: \SYSTEM\CurrentControlSet\Control\SafeBoot
  selection_flag:
    CommandLine|contains:
    - ' copy '
    - ' add '
  condition: all of selection*
