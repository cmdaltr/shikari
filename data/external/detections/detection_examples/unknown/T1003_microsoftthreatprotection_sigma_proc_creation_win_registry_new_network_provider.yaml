technique_id: T1003
technique_name: Potential Credential Dumping Attempt Using New NetworkProvider - CLI
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: baef1ec6-2ca9-47a3-97cc-4cf2bda10b77
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains|all:\n  - \\System\\CurrentControlSet\\Services\\\n  - \\\
  NetworkProvider\n"
explanation: Detects when an attacker tries to add a new network provider in order
  to dump clear text credentials, similar to how the NPPSpy tool does it
false_positives:
- Other legitimate network providers used and not filtred in this rule
references:
- https://learn.microsoft.com/en-us/troubleshoot/windows-client/setup-upgrade-and-drivers/network-provider-settings-removed-in-place-upgrade
- https://github.com/gtworek/PSBits/tree/master/PasswordStealing/NPPSpy
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - \System\CurrentControlSet\Services\
    - \NetworkProvider
  condition: selection
