technique_id: T1219.002
technique_name: Suspicious Mstsc.EXE Execution With Local RDP File
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 6e22722b-dfb1-4508-a911-49ac840b40f8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_extension:\n  CommandLine|endswith:\n  - .rdp\n  - .rdp\"\nselection_img:\n\
  - Image|endswith: \\mstsc.exe\n- OriginalFileName: mstsc.exe\nselection_paths:\n\
  \  CommandLine|contains:\n  - :\\Users\\Public\\\n  - :\\Windows\\System32\\spool\\\
  drivers\\color\n  - ':\\Windows\\System32\\Tasks_Migrated '\n  - :\\Windows\\Tasks\\\
  \n  - :\\Windows\\Temp\\\n  - :\\Windows\\Tracing\\\n  - \\AppData\\Local\\Temp\\\
  \n  - \\Downloads\\\n"
explanation: Detects potential RDP connection via Mstsc using a local ".rdp" file
  located in suspicious locations.
false_positives:
- Likelihood is related to how often the paths are used in the environment
references:
- https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/
- https://web.archive.org/web/20230726144748/https://blog.thickmints.dev/mintsights/detecting-rogue-rdp/
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \mstsc.exe
  - OriginalFileName: mstsc.exe
  selection_extension:
    CommandLine|endswith:
    - .rdp
    - .rdp"
  selection_paths:
    CommandLine|contains:
    - :\Users\Public\
    - :\Windows\System32\spool\drivers\color
    - ':\Windows\System32\Tasks_Migrated '
    - :\Windows\Tasks\
    - :\Windows\Temp\
    - :\Windows\Tracing\
    - \AppData\Local\Temp\
    - \Downloads\
  condition: all of selection_*
