technique_id: T1140
technique_name: Potential Base64 Decoded From Images
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 09a910bf-f71f-4737-9c40-88880ba5913d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_b64:\n  CommandLine|contains|all:\n  - base64\n  - -d\n  - '>'\nselection_files:\n\
  \  CommandLine|contains:\n  - .avif\n  - .gif\n  - .jfif\n  - .jpeg\n  - .jpg\n\
  \  - .pjp\n  - .pjpeg\n  - .png\n  - .svg\n  - .webp\nselection_image:\n  Image|endswith:\
  \ /bash\nselection_view:\n  CommandLine|contains|all:\n  - tail\n  - -c\n"
explanation: 'Detects the use of tail to extract bytes at an offset from an image
  and then decode the base64 value to create a new file with the decoded content.
  The detected execution is a bash one-liner.

  '
false_positives:
- Unknown
