technique_id: T1566
technique_name: Suspicious Microsoft OneNote Child Process
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: c27515df-97a9-4162-8a60-dc0eeb51b775
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_parent and\
  \ 1 of selection_opt_* and not 1 of filter_*\nfilter_onedrive:\n  CommandLine|endswith:\
  \ -Embedding\n  Image|contains: \\AppData\\Local\\Microsoft\\OneDrive\\\n  Image|endswith:\
  \ \\FileCoAuth.exe\nfilter_teams:\n  CommandLine|endswith: -Embedding\n  Image|endswith:\
  \ \\AppData\\Local\\Microsoft\\Teams\\current\\Teams.exe\nselection_opt_explorer:\n\
  \  CommandLine|contains:\n  - .hta\n  - .vb\n  - .wsh\n  - .js\n  - .ps\n  - .scr\n\
  \  - .pif\n  - .bat\n  - .cmd\n  Image|endswith: \\explorer.exe\nselection_opt_img:\n\
  - OriginalFileName:\n  - bitsadmin.exe\n  - CertOC.exe\n  - CertUtil.exe\n  - Cmd.Exe\n\
  \  - CMSTP.EXE\n  - cscript.exe\n  - curl.exe\n  - HH.exe\n  - IEExec.exe\n  - InstallUtil.exe\n\
  \  - javaw.exe\n  - Microsoft.Workflow.Compiler.exe\n  - msdt.exe\n  - MSHTA.EXE\n\
  \  - msiexec.exe\n  - Msxsl.exe\n  - odbcconf.exe\n  - pcalua.exe\n  - PowerShell.EXE\n\
  \  - RegAsm.exe\n  - RegSvcs.exe\n  - REGSVR32.exe\n  - RUNDLL32.exe\n  - schtasks.exe\n\
  \  - ScriptRunner.exe\n  - wmic.exe\n  - WorkFolders.exe\n  - wscript.exe\n- Image|endswith:\n\
  \  - \\AppVLP.exe\n  - \\bash.exe\n  - \\bitsadmin.exe\n  - \\certoc.exe\n  - \\\
  certutil.exe\n  - \\cmd.exe\n  - \\cmstp.exe\n  - \\control.exe\n  - \\cscript.exe\n\
  \  - \\curl.exe\n  - \\forfiles.exe\n  - \\hh.exe\n  - \\ieexec.exe\n  - \\installutil.exe\n\
  \  - \\javaw.exe\n  - \\mftrace.exe\n  - \\Microsoft.Workflow.Compiler.exe\n  -\
  \ \\msbuild.exe\n  - \\msdt.exe\n  - \\mshta.exe\n  - \\msidb.exe\n  - \\msiexec.exe\n\
  \  - \\msxsl.exe\n  - \\odbcconf.exe\n  - \\pcalua.exe\n  - \\powershell.exe\n \
  \ - \\pwsh.exe\n  - \\regasm.exe\n  - \\regsvcs.exe\n  - \\regsvr32.exe\n  - \\\
  rundll32.exe\n  - \\schtasks.exe\n  - \\scrcons.exe\n  - \\scriptrunner.exe\n  -\
  \ \\sh.exe\n  - \\svchost.exe\n  - \\verclsid.exe\n  - \\wmic.exe\n  - \\workfolders.exe\n\
  \  - \\wscript.exe\nselection_opt_paths:\n  Image|contains:\n  - \\AppData\\\n \
  \ - \\Users\\Public\\\n  - \\ProgramData\\\n  - \\Windows\\Tasks\\\n  - \\Windows\\\
  Temp\\\n  - \\Windows\\System32\\Tasks\\\nselection_parent:\n  ParentImage|endswith:\
  \ \\onenote.exe\n"
explanation: Detects suspicious child processes of the Microsoft OneNote application.
  This may indicate an attempt to execute malicious embedded objects from a .one file.
false_positives:
- File located in the AppData folder with trusted signature
references:
- https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-e34e43eb5666427602ddf488b2bf3b545bd9aae81af3e6f6c7949f9652abdf18
- https://micahbabinski.medium.com/detecting-onenote-one-malware-delivery-407e9321ecf0
tags:
- attack.t1566
- attack.t1566.001
- attack.initial-access
logsource:
  category: process_creation
  product: windows
