query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_hash:\n\
  \  Hashes|contains:\n  - IMPHASH=136F0A8572C058A96436C82E541E4C41\n  - IMPHASH=589657C64DDE88533186C39F82FA1F50\n\
  \  - IMPHASH=6BFE09EFCB4FFDE061EBDBAFC4DB84CF\n  - IMPHASH=7D490037BF450877E6D0287BDCFF8D2E\n\
  \  - IMPHASH=8AB93B061287C79F3088C5BC7E7D97ED\n  - IMPHASH=A53A02B997935FD8EEDCB5F7ABAB9B9F\n\
  \  - IMPHASH=BA434A7A729EEC20E136CA4C32D6C740\n  - IMPHASH=BD1D1547DA13C0FCB6C15E86217D5EB8\n\
  \  - IMPHASH=E96A73C7BF33A464C510EDE582318BF2\nselection_img:\n  Image|endswith:\n\
  \  - \\WCE.exe\n  - \\WCE64.exe\n"
explanation: 'Detects the use of Windows Credential Editor (WCE), a popular post-exploitation
  tool used to extract plaintext passwords, hash, PIN code and Kerberos tickets from
  memory.

  It is often used by threat actors for credential dumping and lateral movement within
  compromised networks.

  '
