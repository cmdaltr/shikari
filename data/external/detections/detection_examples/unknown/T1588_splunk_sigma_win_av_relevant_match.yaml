query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: keywords and not 1 of\
  \ filter_optional_*\nfilter_optional_generic:\n- anti_ransomware_service.exe\n-\
  \ Anti-Ransomware\n- Crack\n- cyber-protect-service.exe\n- encryptor\n- Keygen\n\
  filter_optional_information:\n  Level: 4\nfilter_optional_restartmanager:\n  Provider_Name:\
  \ Microsoft-Windows-RestartManager\nkeywords:\n- Adfind\n- 'ASP/BackDoor '\n- ATK/\n\
  - Backdoor.ASP\n- Backdoor.Cobalt\n- Backdoor.JSP\n- Backdoor.PHP\n- Blackworm\n\
  - Brutel\n- BruteR\n- Chopper\n- Cobalt\n- COBEACON\n- Cometer\n- CRYPTES\n- Cryptor\n\
  - Destructor\n- DumpCreds\n- Exploit.Script.CVE\n- FastReverseProxy\n- Filecoder\n\
  - 'GrandCrab '\n- HackTool\n- HKTL\n- HTool-\n- /HTool\n- .HTool\n- IISExchgSpawnCMD\n\
  - Impacket\n- 'JSP/BackDoor '\n- Keylogger\n- Koadic\n- Krypt\n- Lazagne\n- Metasploit\n\
  - Meterpreter\n- MeteTool\n- mikatz\n- Mimikatz\n- Mpreter\n- MsfShell\n- Nighthawk\n\
  - Packed.Generic.347\n- PentestPowerShell\n- Phobos\n- 'PHP/BackDoor '\n- Potato\n\
  - PowerSploit\n- PowerSSH\n- PshlSpy\n- PSWTool\n- PWCrack\n- PWDump\n- Ransom\n\
  - Rozena\n- Ryzerlo\n- Sbelt\n- Seatbelt\n- 'SecurityTool '\n- SharpDump\n- Shellcode\n\
  - Sliver\n- Splinter\n- Swrort\n- Tescrypt\n- TeslaCrypt\n- TurtleLoader\n- Valyria\n\
  - Webshell\n"
explanation: 'Detects potentially highly relevant antivirus events in the application
  log based on known virus signature names and malware keywords.

  '
