  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains|all:
    - 'taskkill '
    - RaccineSettings.exe
  selection2:
    CommandLine|contains|all:
    - reg.exe
    - delete
    - Raccine Tray
  selection3:
    CommandLine|contains|all:
    - schtasks
    - /DELETE
    - Raccine Rules Updater
  condition: 1 of selection*
