technique_id: T1562.001
technique_name: Raccine Uninstall
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: a31eeaed-3fd5-478e-a8ba-e62c6b3f9ecc
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection1:\n\
  \  CommandLine|contains|all:\n  - 'taskkill '\n  - RaccineSettings.exe\nselection2:\n\
  \  CommandLine|contains|all:\n  - reg.exe\n  - delete\n  - Raccine Tray\nselection3:\n\
  \  CommandLine|contains|all:\n  - schtasks\n  - /DELETE\n  - Raccine Rules Updater\n"
explanation: Detects commands that indicate a Raccine removal from an end system.
  Raccine is a free ransomware protection tool.
false_positives:
- Legitimate deinstallation by administrative staff
references:
- https://github.com/Neo23x0/Raccine
tags:
- attack.defense-evasion
- attack.t1562.001
