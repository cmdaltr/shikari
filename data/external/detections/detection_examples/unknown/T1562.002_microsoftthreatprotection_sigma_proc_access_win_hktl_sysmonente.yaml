level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: ( selection_sysmon and\
  \ not 1 of filter_main_* ) or selection_calltrace\nfilter_main_generic:\n  SourceImage|contains:\n\
  \  - :\\Program Files (x86)\\\n  - :\\Program Files\\\n  - :\\Windows\\System32\\\
  \n  - :\\Windows\\SysWOW64\\\nfilter_main_msdefender:\n  SourceImage|contains: :\\\
  ProgramData\\Microsoft\\Windows Defender\\Platform\\\n  SourceImage|endswith: \\\
  MsMpEng.exe\nselection_calltrace:\n  CallTrace: Ente\nselection_sysmon:\n  GrantedAccess:\
  \ '0x1400'\n  TargetImage|contains:\n  - :\\Windows\\Sysmon.exe\n  - :\\Windows\\\
  Sysmon64.exe\n"
explanation: Detects the use of SysmonEnte, a tool to attack the integrity of Sysmon
false_positives:
- Unknown
references:
- https://codewhitesec.blogspot.com/2022/09/attacks-on-sysmon-revisited-sysmonente.html
- https://github.com/codewhitesec/SysmonEnte/
- https://github.com/codewhitesec/SysmonEnte/blob/fe267690fcc799fbda15398243615a30451d9099/screens/1.png
tags:
