query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ParentCommandLine|contains: \\shell32.dll,Control_RunDLL\nselection:\n\
  \  Image|endswith: \\explorer.exe\n  ParentImage|endswith: \\rundll32.exe\n"
explanation: Detects RunDLL32.exe spawning explorer.exe as child, which is very uncommon,
  often observes Gamarue spawning the explorer.exe process in an unusual way
false_positives:
- Unknown
