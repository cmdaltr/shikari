fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 4aa6040b-3f28-44e3-a769-9208e5feb5ec
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - .bmp\n  - .cr2\n  - .eps\n  - .gif\n\
  \  - .ico\n  - .jpeg\n  - .jpg\n  - .nef\n  - .orf\n  - .png\n  - .raw\n  - .sr2\n\
  \  - .tif\n  - .tiff\nselection_img:\n- Image|endswith: \\rundll32.exe\n- OriginalFileName:\
  \ RUNDLL32.exe\n"
explanation: Detects the execution of Rundll32.exe with DLL files masquerading as
  image files
false_positives:
- Unknown
