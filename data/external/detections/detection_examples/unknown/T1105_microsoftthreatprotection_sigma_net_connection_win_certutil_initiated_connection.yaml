fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 0dba975d-a193-4ed1-a067-424df57570d1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  DestinationPort:\n  - 80\n  - 135\n  - 443\n  - 445\n  Image|endswith: \\certutil.exe\n\
  \  Initiated: 'true'\n"
explanation: 'Detects a network connection initiated by the certutil.exe utility.

  Attackers can abuse the utility in order to download malware or additional payloads.

  '
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
