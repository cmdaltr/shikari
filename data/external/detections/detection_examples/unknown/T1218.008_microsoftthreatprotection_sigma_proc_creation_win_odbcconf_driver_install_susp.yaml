technique_id: T1218.008
technique_name: Suspicious Driver/DLL Installation Via Odbcconf.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: cb0fe7c5-f3a3-484d-aa25-d350a7912729
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_dll_ext:\n  CommandLine|contains: .dll\nselection_cli:\n\
  \  CommandLine|contains: 'INSTALLDRIVER '\nselection_img:\n- Image|endswith: \\\
  odbcconf.exe\n- OriginalFileName: odbcconf.exe\n"
explanation: Detects execution of "odbcconf" with the "INSTALLDRIVER" action where
  the driver doesn't contain a ".dll" extension. This is often used as a defense evasion
  method.
false_positives:
- Unlikely
references:
- https://lolbas-project.github.io/lolbas/Binaries/Odbcconf/
- https://web.archive.org/web/20191023232753/https://twitter.com/Hexacorn/status/1187143326673330176
- https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/
tags:
- attack.defense-evasion
- attack.t1218.008
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \odbcconf.exe
  - OriginalFileName: odbcconf.exe
  selection_cli:
    CommandLine|contains: 'INSTALLDRIVER '
  filter_main_dll_ext:
    CommandLine|contains: .dll
  condition: all of selection_* and not 1 of filter_main_*
