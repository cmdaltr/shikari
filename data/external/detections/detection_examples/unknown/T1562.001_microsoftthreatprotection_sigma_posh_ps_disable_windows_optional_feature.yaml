query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_cmd:\n\
  \  ScriptBlockText|contains|all:\n  - Disable-WindowsOptionalFeature\n  - -Online\n\
  \  - -FeatureName\nselection_feature:\n  ScriptBlockText|contains:\n  - Windows-Defender-Gui\n\
  \  - Windows-Defender-Features\n  - Windows-Defender\n  - Windows-Defender-ApplicationGuard\n"
explanation: 'Detect built in PowerShell cmdlet Disable-WindowsOptionalFeature, Deployment
  Image Servicing and Management tool.

  Similar to DISM.exe, this cmdlet is used to enumerate, install, uninstall, configure,
  and update features and packages in Windows images

  '
false_positives:
- Unknown
