technique_id: T1036
technique_name: Suspicious Process Parents
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: cbec226f-63d9-4eca-9f52-dfb6652f24df
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection or ( selection_special\
  \ and not 1 of filter_* )\nfilter_null:\n  Image: null\nfilter_special:\n  Image|endswith:\n\
  \  - \\WerFault.exe\n  - \\wermgr.exe\n  - \\conhost.exe\n  - \\mmc.exe\n  - \\\
  win32calc.exe\n  - \\notepad.exe\nselection:\n  ParentImage|endswith:\n  - \\minesweeper.exe\n\
  \  - \\winver.exe\n  - \\bitsadmin.exe\nselection_special:\n  ParentImage|endswith:\n\
  \  - \\csrss.exe\n  - \\certutil.exe\n  - \\eventvwr.exe\n  - \\calc.exe\n  - \\\
  notepad.exe\n"
explanation: Detects suspicious parent processes that should not have any children
  or should only have a single possible child program
false_positives:
- Unknown
references:
- https://twitter.com/x86matthew/status/1505476263464607744?s=12
- https://svch0st.medium.com/stats-from-hunting-cobalt-strike-beacons-c17e56255f9b
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
    - \minesweeper.exe
    - \winver.exe
    - \bitsadmin.exe
  selection_special:
    ParentImage|endswith:
    - \csrss.exe
    - \certutil.exe
    - \eventvwr.exe
    - \calc.exe
    - \notepad.exe
  filter_special:
    Image|endswith:
    - \WerFault.exe
    - \wermgr.exe
    - \conhost.exe
    - \mmc.exe
    - \win32calc.exe
    - \notepad.exe
  filter_null:
    Image: null
  condition: selection or ( selection_special and not 1 of filter_* )
