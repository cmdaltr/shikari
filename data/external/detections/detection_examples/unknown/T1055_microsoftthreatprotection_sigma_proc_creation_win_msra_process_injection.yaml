technique_id: T1055
technique_name: Potential Process Injection Via Msra.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 744a188b-0415-4792-896f-11ddb0588dbc
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith:\n  - \\arp.exe\n  - \\cmd.exe\n  - \\net.exe\n  - \\netstat.exe\n\
  \  - \\nslookup.exe\n  - \\route.exe\n  - \\schtasks.exe\n  - \\whoami.exe\n  ParentCommandLine|endswith:\
  \ msra.exe\n  ParentImage|endswith: \\msra.exe\n"
explanation: Detects potential process injection via Microsoft Remote Asssistance
  (Msra.exe) by looking at suspicious child processes spawned from the aforementioned
  process. It has been a target used by many threat actors and used for discovery
  and persistence tactics
false_positives:
- Legitimate use of Msra.exe
references:
- https://www.microsoft.com/security/blog/2021/12/09/a-closer-look-at-qakbots-latest-building-blocks-and-how-to-knock-them-down/
- https://www.fortinet.com/content/dam/fortinet/assets/analyst-reports/ar-qakbot.pdf
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: \msra.exe
    ParentCommandLine|endswith: msra.exe
    Image|endswith:
    - \arp.exe
    - \cmd.exe
    - \net.exe
    - \netstat.exe
    - \nslookup.exe
    - \route.exe
    - \schtasks.exe
