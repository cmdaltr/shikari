query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - \\Users\\Public\\\n  - \\AppData\\Local\\Temp\\\n\
  \  - \\AppData\\Local\\Roaming\\\n  - :\\Temp\\\n  - :\\Windows\\Temp\\\n  - :\\\
  Windows\\System32\\Tasks\\\n  - :\\Windows\\Tasks\\\n  Image|contains:\n  - :\\\
  Windows\\Microsoft.NET\\Framework\\\n  - :\\Windows\\Microsoft.NET\\Framework64\\\
  \n  - :\\Windows\\Microsoft.NET\\FrameworkArm\\\n  - :\\Windows\\Microsoft.NET\\\
  FrameworkArm64\\\n  Image|endswith: \\aspnet_compiler.exe\n"
explanation: Detects execution of "aspnet_compiler.exe" with potentially suspicious
  paths for compilation.
false_positives:
- Unknown
