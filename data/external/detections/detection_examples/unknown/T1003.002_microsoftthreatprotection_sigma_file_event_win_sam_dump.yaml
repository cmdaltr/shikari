technique_id: T1003.002
technique_name: Potential SAM Database Dump
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - TargetFilename|endswith:\n  - \\Temp\\sam\n  - \\sam.sav\n  - \\Intel\\sam\n \
  \ - \\sam.hive\n  - \\Perflogs\\sam\n  - \\ProgramData\\sam\n  - \\Users\\Public\\\
  sam\n  - \\AppData\\Local\\sam\n  - \\AppData\\Roaming\\sam\n  - _ShadowSteal.zip\n\
  \  - \\Documents\\SAM.export\n  - :\\sam\n- TargetFilename|contains:\n  - \\hive_sam_\n\
  \  - \\sam.save\n  - \\sam.export\n  - \\~reg_sam.save\n  - \\sam_backup\n  - \\\
  sam.bck\n  - \\sam.backup\n"
explanation: Detects the creation of files that look like exports of the local SAM
  (Security Account Manager)
false_positives:
- Rare cases of administrative activity
references:
- https://github.com/search?q=CVE-2021-36934
- https://web.archive.org/web/20210725081645/https://github.com/cube0x0/CVE-2021-36934
- https://www.google.com/search?q=%22reg.exe+save%22+sam
- https://github.com/HuskyHacks/ShadowSteal
- https://github.com/FireFart/hivenightmare
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  product: windows
  category: file_event
detection:
  selection:
  - TargetFilename|endswith:
    - \Temp\sam
    - \sam.sav
    - \Intel\sam
    - \sam.hive
    - \Perflogs\sam
    - \ProgramData\sam
    - \Users\Public\sam
    - \AppData\Local\sam
    - \AppData\Roaming\sam
    - _ShadowSteal.zip
    - \Documents\SAM.export
    - :\sam
  - TargetFilename|contains:
    - \hive_sam_
    - \sam.save
    - \sam.export
    - \~reg_sam.save
    - \sam_backup
    - \sam.bck
    - \sam.backup
  condition: selection
