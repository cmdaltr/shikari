technique_id: T1202
technique_name: Potential Arbitrary Command Execution Using Msdt.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 258fc8ce-8352-443a-9120-8a11e4857fa5
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img and (selection_cmd_inline\
  \ or all of selection_cmd_answerfile_*)\nselection_cmd_answerfile_flag:\n  CommandLine|contains:\
  \ ' PCWDiagnostic'\nselection_cmd_answerfile_param:\n  CommandLine|contains|windash:\
  \ ' -af '\nselection_cmd_inline:\n  CommandLine|contains: IT_BrowseForFile=\nselection_img:\n\
  - Image|endswith: \\msdt.exe\n- OriginalFileName: msdt.exe\n"
explanation: Detects processes leveraging the "ms-msdt" handler or the "msdt.exe"
  binary to execute arbitrary commands as seen in the follina (CVE-2022-30190) vulnerability
false_positives:
- Unknown
references:
- https://twitter.com/nao_sec/status/1530196847679401984
- https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/
- https://twitter.com/_JohnHammond/status/1531672601067675648
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \msdt.exe
  - OriginalFileName: msdt.exe
  selection_cmd_inline:
    CommandLine|contains: IT_BrowseForFile=
  selection_cmd_answerfile_flag:
    CommandLine|contains: ' PCWDiagnostic'
  selection_cmd_answerfile_param:
    CommandLine|contains|windash: ' -af '
  condition: selection_img and (selection_cmd_inline or all of selection_cmd_answerfile_*)
