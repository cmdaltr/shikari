logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains: ' run run-cmd '
  filter_main_legit_parents:
    ParentImage|endswith:
    - \cleanapi.exe
    - \kavremover.exe
  condition: selection and not 1 of filter_main_*
