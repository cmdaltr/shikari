query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_legit_parents:\n  ParentImage|endswith:\n  - \\cleanapi.exe\n\
  \  - \\kavremover.exe\nselection:\n  CommandLine|contains: ' run run-cmd '\n"
explanation: Detects the execution of a signed binary dropped by Kaspersky Lab Products
  Remover (kavremover) which can be abused as a LOLBIN to execute arbitrary commands
  and binaries.
false_positives:
- Unknown
references:
- https://nasbench.medium.com/lolbined-using-kaspersky-endpoint-security-kes-installer-to-execute-arbitrary-commands-1c999f1b7fea
