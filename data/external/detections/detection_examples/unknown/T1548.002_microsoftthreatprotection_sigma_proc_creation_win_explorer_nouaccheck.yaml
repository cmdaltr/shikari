technique_id: T1548.002
technique_name: Explorer NOUACCHECK Flag
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.83
validated: true
source: sigma
sigma_id: 534f2ef7-e8a2-4433-816d-c91bccde289b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_dc_logon:\n- ParentCommandLine: C:\\Windows\\system32\\svchost.exe\
  \ -k netsvcs -p -s Schedule\n- ParentImage: C:\\Windows\\System32\\svchost.exe\n\
  selection:\n  CommandLine|contains: /NOUACCHECK\n  Image|endswith: \\explorer.exe\n"
explanation: Detects suspicious starts of explorer.exe that use the /NOUACCHECK flag
  that allows to run all sub processes of that newly started explorer.exe without
  any UAC checks
false_positives:
- Domain Controller User Logon
- Unknown how many legitimate software products use that method
references:
- https://twitter.com/ORCA6665/status/1496478087244095491
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \explorer.exe
    CommandLine|contains: /NOUACCHECK
  filter_dc_logon:
  - ParentCommandLine: C:\Windows\system32\svchost.exe -k netsvcs -p -s Schedule
  - ParentImage: C:\Windows\System32\svchost.exe
  condition: selection and not 1 of filter_*
