level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_msdt:\n- Image|endswith: \\msdt.exe\n- OriginalFileName: msdt.exe\nselection_parent:\n\
  \  ParentImage|endswith:\n  - \\cmd.exe\n  - \\cscript.exe\n  - \\mshta.exe\n  -\
  \ \\powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n  -\
  \ \\schtasks.exe\n  - \\wmic.exe\n  - \\wscript.exe\n  - \\wsl.exe\n"
explanation: Detects msdt.exe executed by a suspicious parent as seen in CVE-2022-30190
  / Follina exploitation
false_positives:
- Unknown
