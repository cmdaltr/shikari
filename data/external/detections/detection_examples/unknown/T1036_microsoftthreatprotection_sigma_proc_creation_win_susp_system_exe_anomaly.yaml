technique_id: T1036
technique_name: System File Execution Location Anomaly
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: e4a6b256-3e47-40fc-89d2-7a477edd6915
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_* and not 1 of filter_optional_*\nfilter_main_generic:\n  Image|startswith:\n\
  \  - C:\\$WINDOWS.~BT\\\n  - C:\\$WinREAgent\\\n  - C:\\Windows\\SoftwareDistribution\\\
  \n  - C:\\Windows\\System32\\\n  - C:\\Windows\\SystemTemp\\\n  - C:\\Windows\\\
  SysWOW64\\\n  - C:\\Windows\\uus\\\n  - C:\\Windows\\WinSxS\\\nfilter_main_powershell:\n\
  \  Image|contains:\n  - C:\\Program Files\\PowerShell\\7\\\n  - C:\\Program Files\\\
  PowerShell\\7-preview\\\n  - C:\\Program Files\\WindowsApps\\Microsoft.PowerShellPreview\n\
  \  - \\AppData\\Local\\Microsoft\\WindowsApps\\Microsoft.PowerShellPreview\n  Image|endswith:\
  \ \\pwsh.exe\nfilter_main_wsl_appdata:\n  Image|contains: \\AppData\\Local\\Microsoft\\\
  WindowsApps\\\n  Image|endswith: \\wsl.exe\n  Image|startswith: C:\\Users\\'\nfilter_main_wsl_programfiles:\n\
  \  Image|endswith: \\wsl.exe\n  Image|startswith:\n  - C:\\Program Files\\WindowsApps\\\
  MicrosoftCorporationII.WindowsSubsystemForLinux\n  - C:\\Program Files\\WSL\\\n\
  filter_optional_system32:\n  Image|contains: \\SystemRoot\\System32\\\nselection:\n\
  \  Image|endswith:\n  - \\atbroker.exe\n  - \\audiodg.exe\n  - \\bcdedit.exe\n \
  \ - \\bitsadmin.exe\n  - \\certreq.exe\n  - \\certutil.exe\n  - \\cmstp.exe\n  -\
  \ \\conhost.exe\n  - \\consent.exe\n  - \\cscript.exe\n  - \\csrss.exe\n  - \\dashost.exe\n\
  \  - \\defrag.exe\n  - \\dfrgui.exe\n  - \\dism.exe\n  - \\dllhost.exe\n  - \\dllhst3g.exe\n\
  \  - \\dwm.exe\n  - \\eventvwr.exe\n  - \\logonui.exe\n  - \\LsaIso.exe\n  - \\\
  lsass.exe\n  - \\lsm.exe\n  - \\msiexec.exe\n  - \\ntoskrnl.exe\n  - \\powershell_ise.exe\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n\
  \  - \\runonce.exe\n  - \\RuntimeBroker.exe\n  - \\schtasks.exe\n  - \\services.exe\n\
  \  - \\sihost.exe\n  - \\smartscreen.exe\n  - \\smss.exe\n  - \\spoolsv.exe\n  -\
  \ \\svchost.exe\n  - \\taskhost.exe\n  - \\taskhostw.exe\n  - \\Taskmgr.exe\n  -\
  \ \\userinit.exe\n  - \\wininit.exe\n  - \\winlogon.exe\n  - \\winver.exe\n  - \\\
  wlanext.exe\n  - \\wscript.exe\n  - \\wsl.exe\n  - \\wsmprovhost.exe\n"
explanation: 'Detects the execution of a Windows system binary that is usually located
  in the system folder from an uncommon location.

  '
false_positives:
- Unknown
references:
- https://twitter.com/GelosSnake/status/934900723426439170
- https://asec.ahnlab.com/en/39828/
- https://www.splunk.com/en_us/blog/security/inno-setup-malware-redline-stealer-campaign.html
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \atbroker.exe
    - \audiodg.exe
    - \bcdedit.exe
    - \bitsadmin.exe
    - \certreq.exe
    - \certutil.exe
    - \cmstp.exe
    - \conhost.exe
    - \consent.exe
    - \cscript.exe
    - \csrss.exe
    - \dashost.exe
    - \defrag.exe
    - \dfrgui.exe
    - \dism.exe
    - \dllhost.exe
    - \dllhst3g.exe
    - \dwm.exe
    - \eventvwr.exe
    - \logonui.exe
    - \LsaIso.exe
    - \lsass.exe
    - \lsm.exe
    - \msiexec.exe
    - \ntoskrnl.exe
    - \powershell_ise.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \runonce.exe
    - \RuntimeBroker.exe
    - \schtasks.exe
    - \services.exe
    - \sihost.exe
    - \smartscreen.exe
    - \smss.exe
    - \spoolsv.exe
    - \svchost.exe
    - \taskhost.exe
    - \taskhostw.exe
    - \Taskmgr.exe
    - \userinit.exe
    - \wininit.exe
    - \winlogon.exe
    - \winver.exe
    - \wlanext.exe
    - \wscript.exe
    - \wsl.exe
    - \wsmprovhost.exe
  filter_main_generic:
    Image|startswith:
    - C:\$WINDOWS.~BT\
    - C:\$WinREAgent\
    - C:\Windows\SoftwareDistribution\
    - C:\Windows\System32\
    - C:\Windows\SystemTemp\
    - C:\Windows\SysWOW64\
    - C:\Windows\uus\
    - C:\Windows\WinSxS\
  filter_optional_system32:
    Image|contains: \SystemRoot\System32\
  filter_main_powershell:
    Image|contains:
    - C:\Program Files\PowerShell\7\
    - C:\Program Files\PowerShell\7-preview\
    - C:\Program Files\WindowsApps\Microsoft.PowerShellPreview
    - \AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview
    Image|endswith: \pwsh.exe
  filter_main_wsl_programfiles:
    Image|startswith:
    - C:\Program Files\WindowsApps\MicrosoftCorporationII.WindowsSubsystemForLinux
    - C:\Program Files\WSL\
    Image|endswith: \wsl.exe
  filter_main_wsl_appdata:
    Image|startswith: C:\Users\'
    Image|contains: \AppData\Local\Microsoft\WindowsApps\
    Image|endswith: \wsl.exe
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
