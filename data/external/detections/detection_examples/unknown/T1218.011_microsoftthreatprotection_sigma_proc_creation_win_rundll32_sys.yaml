technique_id: T1218.011
technique_name: Suspicious Rundll32 Activity Invoking Sys File
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 731231b9-0b5d-4219-94dd-abb6959aa7ea
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection1:\n\
  \  CommandLine|contains: rundll32.exe\nselection2:\n  CommandLine|contains:\n  -\
  \ .sys,\n  - '.sys '\n"
explanation: Detects suspicious process related to rundll32 based on command line
  that includes a *.sys file as seen being used by UNC2452
false_positives:
- Unknown
references:
- https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains: rundll32.exe
  selection2:
    CommandLine|contains:
    - .sys,
    - '.sys '
  condition: all of selection*
