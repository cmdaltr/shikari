technique_id: T1036
technique_name: Potential SysInternals ProcDump Evasion
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 79b06761-465f-4f88-9ef2-150e24d3d737
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_1:\n\
  \  CommandLine|contains:\n  - copy procdump\n  - move procdump\nselection_2:\n \
  \ CommandLine|contains:\n  - 2.dmp\n  - lsass\n  - out.dmp\n  CommandLine|contains|all:\n\
  \  - 'copy '\n  - '.dmp '\nselection_3:\n  CommandLine|contains:\n  - copy lsass.exe_\n\
  \  - move lsass.exe_\n"
explanation: Detects uses of the SysInternals ProcDump utility in which ProcDump or
  its output get renamed, or a dump file is moved or copied to a different name
false_positives:
- False positives are expected in cases in which ProcDump just gets copied to a different
  directory without any renaming
references:
- https://twitter.com/mrd0x/status/1480785527901204481
tags:
- attack.defense-evasion
- attack.t1036
- attack.t1003.001
- attack.credential-access
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains:
    - copy procdump
    - move procdump
  selection_2:
    CommandLine|contains|all:
    - 'copy '
    - '.dmp '
    CommandLine|contains:
    - 2.dmp
    - lsass
    - out.dmp
  selection_3:
    CommandLine|contains:
    - copy lsass.exe_
    - move lsass.exe_
  condition: 1 of selection_*
