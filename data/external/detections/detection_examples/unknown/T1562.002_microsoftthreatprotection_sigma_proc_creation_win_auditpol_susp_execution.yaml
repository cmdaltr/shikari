technique_id: T1562.002
technique_name: Audit Policy Tampering Via Auditpol
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 0a13e132-651d-11eb-ae93-0242ac130002
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - disable\n  - clear\n  - remove\n  -\
  \ restore\nselection_img:\n- Image|endswith: \\auditpol.exe\n- OriginalFileName:\
  \ AUDITPOL.EXE\n"
explanation: 'Threat actors can use auditpol binary to change audit policy configuration
  to impair detection capability.

  This can be carried out by selectively disabling/removing certain audit policies
  as well as restoring a custom policy owned by the threat actor.

  '
false_positives:
- Administrator or administrator scripts might leverage the flags mentioned in the
  detection section. Either way, it should always be monitored
references:
- https://www.microsoft.com/security/blog/2021/01/20/deep-dive-into-the-solorigate-second-stage-activation-from-sunburst-to-teardrop-and-raindrop/
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \auditpol.exe
  - OriginalFileName: AUDITPOL.EXE
  selection_cli:
    CommandLine|contains:
    - disable
    - clear
    - remove
    - restore
  condition: all of selection_*
