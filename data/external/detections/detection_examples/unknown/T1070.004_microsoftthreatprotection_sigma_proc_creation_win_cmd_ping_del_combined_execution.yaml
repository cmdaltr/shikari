technique_id: T1070.004
technique_name: Suspicious Ping/Del Command Combination
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 54786ddc-5b8a-11ed-9b6a-0242ac120002
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_all:\n  CommandLine|contains|all:\n  - ping\n  - 'del '\nselection_count:\n\
  \  CommandLine|contains|windash: ' -n '\nselection_del_param:\n  CommandLine|contains|windash:\n\
  \  - ' -f '\n  - ' -q '\nselection_nul:\n  CommandLine|contains: Nul\n"
explanation: Detects a method often used by ransomware. Which combines the "ping"
  to wait a couple of seconds and then "del" to delete the file in question. Its used
  to hide the file responsible for the initial infection for example
false_positives:
- Unknown
references:
- https://blog.sygnia.co/kaseya-ransomware-supply-chain-attack
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2022/06/23093553/Common-TTPs-of-the-modern-ransomware_low-res.pdf
- https://www.acronis.com/en-us/blog/posts/lockbit-ransomware/
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/blackbyte-exbyte-ransomware
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_count:
    CommandLine|contains|windash: ' -n '
  selection_nul:
    CommandLine|contains: Nul
  selection_del_param:
    CommandLine|contains|windash:
    - ' -f '
    - ' -q '
  selection_all:
    CommandLine|contains|all:
    - ping
    - 'del '
  condition: all of selection_*
