technique_id: T1218
technique_name: Suspicious AddinUtil.EXE CommandLine Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img and (all\
  \ of selection_susp_1_* or selection_susp_2)\nselection_img:\n- Image|endswith:\
  \ \\addinutil.exe\n- OriginalFileName: AddInUtil.exe\nselection_susp_1_flags:\n\
  \  CommandLine|contains:\n  - '-AddInRoot:'\n  - '-PipelineRoot:'\nselection_susp_1_paths:\n\
  \  CommandLine|contains:\n  - \\AppData\\Local\\Temp\\\n  - \\Desktop\\\n  - \\\
  Downloads\\\n  - \\Users\\Public\\\n  - \\Windows\\Temp\\\nselection_susp_2:\n \
  \ CommandLine|contains:\n  - -AddInRoot:.\n  - -AddInRoot:\".\"\n  - -PipelineRoot:.\n\
  \  - -PipelineRoot:\".\"\n  CurrentDirectory|contains:\n  - \\AppData\\Local\\Temp\\\
  \n  - \\Desktop\\\n  - \\Downloads\\\n  - \\Users\\Public\\\n  - \\Windows\\Temp\\\
  \n"
explanation: 'Detects execution of the Add-In deployment cache updating utility (AddInutil.exe)
  with suspicious Addinroot or Pipelineroot paths. An adversary may execute AddinUtil.exe
  with uncommon Addinroot/Pipelineroot paths that point to the adversaries Addins.Store
  payload.

  '
false_positives:
- Unknown
references:
- https://www.blue-prints.blog/content/blog/posts/lolbin/addinutil-lolbas.html
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \addinutil.exe
  - OriginalFileName: AddInUtil.exe
  selection_susp_1_flags:
    CommandLine|contains:
    - '-AddInRoot:'
    - '-PipelineRoot:'
  selection_susp_1_paths:
    CommandLine|contains:
    - \AppData\Local\Temp\
    - \Desktop\
    - \Downloads\
    - \Users\Public\
    - \Windows\Temp\
  selection_susp_2:
    CommandLine|contains:
    - -AddInRoot:.
    - -AddInRoot:"."
    - -PipelineRoot:.
    - -PipelineRoot:"."
    CurrentDirectory|contains:
    - \AppData\Local\Temp\
    - \Desktop\
    - \Downloads\
    - \Users\Public\
    - \Windows\Temp\
  condition: selection_img and (all of selection_susp_1_* or selection_susp_2)
