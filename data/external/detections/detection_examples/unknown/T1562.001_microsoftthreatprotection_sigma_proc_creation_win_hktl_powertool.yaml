query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - Image|endswith:\n  - \\PowerTool.exe\n  - \\PowerTool64.exe\n- OriginalFileName:\
  \ PowerTool.exe\n"
explanation: Detects the execution of the tool PowerTool which has the ability to
  kill a process, delete its process file, unload drivers, and delete the driver files
