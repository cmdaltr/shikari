fidelity_score: 0.88
validated: true
source: sigma
sigma_id: ca621ba5-54ab-4035-9942-d378e6fcde3c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_flags:\n\
  \  CommandLine|contains:\n  - .dmp\n  - lsass\n  - .obf\n  - dump\n  CommandLine|contains|all:\n\
  \  - '--pid:'\n  - '--outfile:'\nselection_loader_img:\n  CommandLine|contains:\
  \ '--pid:'\n  Image|endswith: \\loader.exe\nselection_loader_imphash:\n  Hashes|contains:\n\
  \  - IMPHASH=38D9E015591BBFD4929E0D0F47FA0055\n  - IMPHASH=0E2216679CA6E1094D63322E3412D650\n"
explanation: Detects the use of HandleKatz, a tool that demonstrates the usage of
  cloned handles to Lsass in order to create an obfuscated memory dump of the same
false_positives:
- Unknown
references:
- https://github.com/codewhitesec/HandleKatz
tags:
- attack.credential-access
- attack.t1003.001
