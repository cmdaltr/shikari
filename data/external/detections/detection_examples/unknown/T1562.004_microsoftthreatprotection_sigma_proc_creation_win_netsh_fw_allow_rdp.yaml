technique_id: T1562.004
technique_name: RDP Connection Allowed Via Netsh.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - portopening\n  - allow\n  CommandLine|contains|all:\n\
  \  - 'firewall '\n  - 'add '\n  - 'tcp '\n  - '3389'\nselection_img:\n- Image|endswith:\
  \ \\netsh.exe\n- OriginalFileName: netsh.exe\n"
explanation: Detects usage of the netsh command to open and allow connections to port
  3389 (RDP). As seen used by Sarwent Malware
false_positives:
- Legitimate administration activity
references:
- https://labs.sentinelone.com/sarwent-malware-updates-command-detonation/
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \netsh.exe
  - OriginalFileName: netsh.exe
  selection_cli:
    CommandLine|contains|all:
    - 'firewall '
    - 'add '
    - 'tcp '
    - '3389'
    CommandLine|contains:
    - portopening
    - allow
  condition: all of selection_*
