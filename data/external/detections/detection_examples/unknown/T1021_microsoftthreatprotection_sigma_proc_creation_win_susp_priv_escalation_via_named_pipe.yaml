query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection*\nselection_args:\n\
  \  CommandLine|contains|all:\n  - echo\n  - '>'\n  - \\\\\\\\.\\\\pipe\\\\\nselection_name:\n\
  - Image|endswith:\n  - \\cmd.exe\n  - \\powershell.exe\n- OriginalFileName:\n  -\
  \ Cmd.Exe\n  - PowerShell.EXE\n"
explanation: Detects a remote file copy attempt to a hidden network share. This may
  indicate lateral movement or data staging activity.
false_positives:
- Other programs that cause these patterns (please report)
references:
