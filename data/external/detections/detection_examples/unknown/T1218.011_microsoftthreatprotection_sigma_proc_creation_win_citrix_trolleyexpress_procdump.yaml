technique_id: T1218.011
technique_name: Process Access via TrolleyExpress Exclusion
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 4c0aaedc-154c-4427-ada0-d80ef9c9deb6
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection or ( renamed\
  \ and not 1 of filter* )\nfilter_empty:\n  OriginalFileName: null\nfilter_renamed:\n\
  \  OriginalFileName|contains: CtxInstall\nrenamed:\n  Image|endswith: \\TrolleyExpress.exe\n\
  selection:\n  CommandLine|contains:\n  - \\TrolleyExpress 7\n  - \\TrolleyExpress\
  \ 8\n  - \\TrolleyExpress 9\n  - \\TrolleyExpress.exe 7\n  - \\TrolleyExpress.exe\
  \ 8\n  - \\TrolleyExpress.exe 9\n  - '\\TrolleyExpress.exe -ma '\n"
explanation: Detects a possible process memory dump that uses the white-listed Citrix
  TrolleyExpress.exe filename as a way to dump the lsass process memory
false_positives:
- Unknown
references:
- https://twitter.com/_xpn_/status/1491557187168178176
- https://www.youtube.com/watch?v=Ie831jF0bb0
tags:
- attack.defense-evasion
