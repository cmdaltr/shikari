technique_id: T1562.002
technique_name: Suspicious Svchost Process Access
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 166e9c50-8cd9-44af-815d-d1f0c0e90dde
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_msbuild:\n  CallTrace|contains:\n  - Microsoft.Build.ni.dll\n\
  \  - System.ni.dll\n  SourceImage|contains: :\\Program Files\\Microsoft Visual Studio\\\
  \n  SourceImage|endswith: \\MSBuild\\Current\\Bin\\MSBuild.exe\nselection:\n  CallTrace|contains:\
  \ UNKNOWN\n  GrantedAccess: '0x1F3FFF'\n  TargetImage|endswith: :\\Windows\\System32\\\
  svchost.exe\n"
explanation: Detects suspicious access to the "svchost" process such as that used
  by Invoke-Phantom to kill the thread of the Windows event logging service.
false_positives:
- Unknown
references:
- https://github.com/hlldz/Invoke-Phant0m
- https://twitter.com/timbmsft/status/900724491076214784
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: :\Windows\System32\svchost.exe
    GrantedAccess: '0x1F3FFF'
    CallTrace|contains: UNKNOWN
  filter_main_msbuild:
    SourceImage|contains: :\Program Files\Microsoft Visual Studio\
    SourceImage|endswith: \MSBuild\Current\Bin\MSBuild.exe
    CallTrace|contains:
    - Microsoft.Build.ni.dll
    - System.ni.dll
  condition: selection and not 1 of filter_main_*
