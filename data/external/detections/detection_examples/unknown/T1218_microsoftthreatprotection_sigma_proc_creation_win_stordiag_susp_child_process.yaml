query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ParentImage|startswith:\n  - c:\\windows\\system32\\\n  - c:\\windows\\\
  syswow64\\\nselection:\n  Image|endswith:\n  - \\schtasks.exe\n  - \\systeminfo.exe\n\
  \  - \\fltmc.exe\n  ParentImage|endswith: \\stordiag.exe\n"
explanation: Detects the use of stordiag.exe to execute schtasks.exe systeminfo.exe
  and fltmc.exe
false_positives:
- Legitimate usage of stordiag.exe.
