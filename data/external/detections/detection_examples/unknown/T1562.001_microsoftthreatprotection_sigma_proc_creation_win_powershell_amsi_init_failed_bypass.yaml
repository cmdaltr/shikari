query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - CommandLine|contains|all:\n  - System.Management.Automation.AmsiUtils\n  - amsiInitFailed\n\
  - CommandLine|contains|all:\n  - '[Ref].Assembly.GetType'\n  - SetValue($null,$true)\n\
  \  - NonPublic,Static\n"
explanation: Detects Request to "amsiInitFailed" that can be used to disable AMSI
  Scanning
