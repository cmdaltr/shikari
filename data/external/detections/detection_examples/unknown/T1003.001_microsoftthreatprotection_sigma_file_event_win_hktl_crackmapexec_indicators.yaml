technique_id: T1003.001
technique_name: HackTool - CrackMapExec File Indicators
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 736ffa74-5f6f-44ca-94ef-1c0df4f51d2a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_path and 1\
  \ of selection_names_*\nselection_names_re:\n- TargetFilename|re: \\\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\\
  .txt$\n- TargetFilename|re: \\\\[a-zA-Z]{8}\\.tmp$\nselection_names_str:\n  TargetFilename|endswith:\n\
  \  - \\temp.ps1\n  - \\msol.ps1\nselection_path:\n  TargetFilename|startswith: C:\\\
  Windows\\Temp\\\n"
explanation: Detects file creation events with filename patterns used by CrackMapExec.
false_positives:
- Unknown
references:
- https://github.com/byt3bl33d3r/CrackMapExec/
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: file_event
detection:
  selection_path:
    TargetFilename|startswith: C:\Windows\Temp\
  selection_names_str:
    TargetFilename|endswith:
    - \temp.ps1
    - \msol.ps1
  selection_names_re:
  - TargetFilename|re: \\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$
  - TargetFilename|re: \\[a-zA-Z]{8}\.tmp$
  condition: selection_path and 1 of selection_names_*
