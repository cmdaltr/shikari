technique_id: T1027.001
technique_name: Binary Padding - Linux
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: c52a914f-3d8b-4b2a-bb75-b3991e75f8ba
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_execve and\
  \ (keywords_truncate or (keywords_dd and not keywords_filter))\nkeywords_dd:\n \
  \ '|all':\n  - dd\n  - if=\nkeywords_filter:\n- of=\nkeywords_truncate:\n  '|all':\n\
  \  - truncate\n  - -s\nselection_execve:\n  type: EXECVE\n"
explanation: 'Adversaries may use binary padding to add junk data and change the on-disk
  representation of malware.

  This rule detect using dd and truncate to add a junk data to file.

  '
false_positives:
- Unknown
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1027.001/T1027.001.md
tags:
- attack.defense-evasion
- attack.t1027.001
logsource:
  product: linux
  service: auditd
detection:
  selection_execve:
    type: EXECVE
  keywords_truncate:
    '|all':
    - truncate
    - -s
  keywords_dd:
    '|all':
    - dd
    - if=
  keywords_filter:
  - of=
  condition: selection_execve and (keywords_truncate or (keywords_dd and not keywords_filter))
