query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000000)\n  TargetObject|contains:\n  - \\Sophos Endpoint\
  \ Defense\\TamperProtection\\Config\\SAVEnabled\n  - \\Sophos Endpoint Defense\\\
  TamperProtection\\Config\\SEDEnabled\n  - \\Sophos\\SAVService\\TamperProtection\\\
  Enabled\n"
explanation: Detects tamper attempts to sophos av functionality via registry key modification
false_positives:
- Some FP may occur when the feature is disabled by the AV itself, you should always
  investigate if the action was legitimate
