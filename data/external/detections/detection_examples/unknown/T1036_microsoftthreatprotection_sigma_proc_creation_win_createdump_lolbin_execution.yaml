  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \createdump.exe
  - OriginalFileName: FX_VER_INTERNALNAME_STR
  selection_cli:
    CommandLine|contains:
    - ' -u '
    - ' --full '
    - ' -f '
    - ' --name '
    - '.dmp '
  condition: all of selection_*
