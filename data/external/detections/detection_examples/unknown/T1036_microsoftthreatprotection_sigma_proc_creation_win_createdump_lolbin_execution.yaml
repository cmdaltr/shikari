level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - ' -u '\n  - ' --full '\n  - ' -f '\n\
  \  - ' --name '\n  - '.dmp '\nselection_img:\n- Image|endswith: \\createdump.exe\n\
  - OriginalFileName: FX_VER_INTERNALNAME_STR\n"
explanation: Detects uses of the createdump.exe LOLOBIN utility to dump process memory
false_positives:
- Command lines that use the same flags
references:
- https://www.crowdstrike.com/blog/overwatch-exposes-aquatic-panda-in-possession-of-log-4-shell-exploit-tools/
- https://twitter.com/bopin2020/status/1366400799199272960
