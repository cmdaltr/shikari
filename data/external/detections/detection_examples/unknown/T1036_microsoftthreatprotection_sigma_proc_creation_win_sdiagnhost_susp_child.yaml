technique_id: T1036
technique_name: Sdiagnhost Calling Suspicious Child Process
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: f3d39c45-de1a-4486-a687-ab126124f744
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_cmd_bits:\n  CommandLine|contains: bits\n  Image|endswith:\
  \ \\cmd.exe\nfilter_main_powershell_noprofile:\n  CommandLine|endswith:\n  - -noprofile\
  \ -\n  - -noprofile\n  Image|endswith: \\powershell.exe\nselection:\n  Image|endswith:\n\
  \  - \\powershell.exe\n  - \\pwsh.exe\n  - \\cmd.exe\n  - \\mshta.exe\n  - \\cscript.exe\n\
  \  - \\wscript.exe\n  - \\taskkill.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n\
  \  - \\calc.exe\n  ParentImage|endswith: \\sdiagnhost.exe\n"
explanation: Detects sdiagnhost.exe calling a suspicious child process (e.g. used
  in exploits for Follina / CVE-2022-30190)
false_positives:
- Unknown
references:
- https://twitter.com/nao_sec/status/1530196847679401984
- https://doublepulsar.com/follina-a-microsoft-office-code-execution-vulnerability-1a47fce5629e
- https://app.any.run/tasks/713f05d2-fe78-4b9d-a744-f7c133e3fafb/
- https://app.any.run/tasks/f420d295-0457-4e9b-9b9e-6732be227583/
- https://app.any.run/tasks/c4117d9a-f463-461a-b90f-4cd258746798/
tags:
- attack.defense-evasion
- attack.t1036
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: \sdiagnhost.exe
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \cmd.exe
    - \mshta.exe
    - \cscript.exe
    - \wscript.exe
    - \taskkill.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \calc.exe
  filter_main_cmd_bits:
    Image|endswith: \cmd.exe
    CommandLine|contains: bits
  filter_main_powershell_noprofile:
    Image|endswith: \powershell.exe
    CommandLine|endswith:
    - -noprofile -
    - -noprofile
  condition: selection and not 1 of filter_main_*
