query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - TargetFilename|contains:\n  - \\hive_sam_\n  - \\SAM-2021-\n  - \\SAM-2022-\n\
  \  - \\SAM-2023-\n  - \\SAM-haxx\n  - \\Sam.save\n- TargetFilename: C:\\windows\\\
  temp\\sam\n"
explanation: Detects files written by the different tools that exploit HiveNightmare
false_positives:
- Files that accidentally contain these strings
