query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - \\u202e\n  - '[U+202E]'\n"
explanation: 'Detects the presence of the "u202+E" character, which causes a terminal,
  browser, or operating system to render text in a right-to-left sequence.

  This is used as an obfuscation and masquerading techniques.

  '
false_positives:
- Commandlines that contains scriptures such as arabic or hebrew might make use of
  this character
references:
