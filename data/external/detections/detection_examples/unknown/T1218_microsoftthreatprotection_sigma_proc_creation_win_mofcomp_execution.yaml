technique_id: T1218
technique_name: Potential Suspicious Mofcomp Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 1dd05363-104e-4b4a-b963-196a534b03a1
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_main_* and not 1 of filter_optional_*\nfilter_main_wmiprvse:\n\
  \  CommandLine|contains: C:\\Windows\\TEMP\\\n  CommandLine|endswith: .mof\n  ParentImage:\
  \ C:\\Windows\\System32\\wbem\\WmiPrvSE.exe\nfilter_optional_null_parent:\n  CommandLine|contains:\
  \ C:\\Windows\\TEMP\\\n  CommandLine|endswith: .mof\nselection_case:\n- ParentImage|endswith:\n\
  \  - \\cmd.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\wsl.exe\n  - \\wscript.exe\n\
  \  - \\cscript.exe\n- CommandLine|contains:\n  - \\AppData\\Local\\Temp\n  - \\\
  Users\\Public\\\n  - \\WINDOWS\\Temp\\\n  - '%temp%'\n  - '%tmp%'\n  - '%appdata%'\n\
  selection_img:\n- Image|endswith: \\mofcomp.exe\n- OriginalFileName: mofcomp.exe\n"
explanation: 'Detects execution of the "mofcomp" utility as a child of a suspicious
  shell or script running utility or by having a suspicious path in the commandline.

  The "mofcomp" utility parses a file containing MOF statements and adds the classes
  and class instances defined in the file to the WMI repository.

  Attackers abuse this utility to install malicious MOF scripts

  '
false_positives:
- Unknown
references:
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
- https://github.com/The-DFIR-Report/Sigma-Rules/blob/75260568a7ffe61b2458ca05f6f25914efb44337/win_mofcomp_execution.yml
- https://learn.microsoft.com/en-us/windows/win32/wmisdk/mofcomp
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \mofcomp.exe
  - OriginalFileName: mofcomp.exe
  selection_case:
  - ParentImage|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \wsl.exe
    - \wscript.exe
    - \cscript.exe
  - CommandLine|contains:
    - \AppData\Local\Temp
    - \Users\Public\
    - \WINDOWS\Temp\
    - '%temp%'
    - '%tmp%'
    - '%appdata%'
  filter_main_wmiprvse:
    ParentImage: C:\Windows\System32\wbem\WmiPrvSE.exe
    CommandLine|contains: C:\Windows\TEMP\
    CommandLine|endswith: .mof
  filter_optional_null_parent:
    CommandLine|contains: C:\Windows\TEMP\
    CommandLine|endswith: .mof
  condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
