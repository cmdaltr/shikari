query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cli:\n\
  \  CommandLine|contains:\n  - '.exe -tran '\n  - '.exe -slave '\nselection_img:\n\
  \  Image|endswith:\n  - \\htran.exe\n  - \\lcx.exe\n"
explanation: Detects executable names or flags used by Htran or Htran-like tools (e.g.
  NATBypass)
false_positives:
- Unknown
