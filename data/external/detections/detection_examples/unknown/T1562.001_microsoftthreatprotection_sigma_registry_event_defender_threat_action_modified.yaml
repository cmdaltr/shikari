technique_id: T1562.001
technique_name: Windows Defender Threat Severity Default Action Modified
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.81
validated: true
source: sigma
sigma_id: 5a9e1b2c-8f7d-4a1e-9b3c-0f6d7e5a4b1f
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details:\n  - DWORD (0x00000006)\n  - DWORD (0x00000009)\n  TargetObject|contains:\
  \ \\Microsoft\\Windows Defender\\Threats\\ThreatSeverityDefaultAction\\\n  TargetObject|endswith:\n\
  \  - \\1\n  - \\2\n  - \\4\n  - \\5\n"
explanation: 'Detects modifications or creations of Windows Defender''s default threat
  action settings based on severity to ''allow'' or take ''no action''.

  This is a highly suspicious configuration change that effectively disables Defender''s
  ability to automatically mitigate threats of a certain severity level,

  allowing malicious software to run unimpeded. An attacker might use this technique
  to bypass defenses before executing payloads.

  '
false_positives:
- Legitimate administration via scripts or tools (e.g., SCCM, Intune, GPO enforcement).
  Correlate with administrative activity.
- Software installations that legitimately modify Defender settings (less common for
  these specific keys).
references:
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
