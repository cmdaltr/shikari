technique_id: T1021.002
technique_name: HackTool - SharpMove Tool Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 055fb54c-a8f4-4aee-bd44-f74cf30a0d9d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img or all\
  \ of selection_cli_*\nselection_cli_actions:\n  CommandLine|contains:\n  - action=create\n\
  \  - action=dcom\n  - action=executevbs\n  - action=hijackdcom\n  - action=modschtask\n\
  \  - action=modsvc\n  - action=query\n  - action=scm\n  - action=startservice\n\
  \  - action=taskscheduler\nselection_cli_computer:\n  CommandLine|contains: computername=\n\
  selection_img:\n- Image|endswith: \\SharpMove.exe\n- OriginalFileName: SharpMove.exe\n"
explanation: 'Detects the execution of SharpMove, a .NET utility performing multiple
  tasks such as "Task Creation", "SCM" query, VBScript execution using WMI via its
  PE metadata and command line options.

  '
false_positives:
- Unknown
references:
- https://github.com/0xthirteen/SharpMove/
- https://pentestlab.blog/tag/sharpmove/
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \SharpMove.exe
  - OriginalFileName: SharpMove.exe
  selection_cli_computer:
    CommandLine|contains: computername=
  selection_cli_actions:
    CommandLine|contains:
    - action=create
    - action=dcom
    - action=executevbs
    - action=hijackdcom
    - action=modschtask
    - action=modsvc
    - action=query
    - action=scm
    - action=startservice
    - action=taskscheduler
  condition: selection_img or all of selection_cli_*
