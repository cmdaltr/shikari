technique_id: T1562.001
technique_name: Windows Defender Context Menu Removed
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: b9e8c7d6-a5f4-4e3d-8b1a-9f0c8d7e6a5b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_action:\n  CommandLine|contains:\n  - del\n  - Remove-Item\n  - 'ri '\n\
  selection_img:\n- Image|endswith:\n  - \\powershell_ise.exe\n  - \\powershell.exe\n\
  \  - \\pwsh.exe\n  - \\reg.exe\n- OriginalFileName:\n  - powershell_ise.EXE\n  -\
  \ PowerShell.EXE\n  - pwsh.dll\n  - reg.exe\nselection_reg_path:\n  CommandLine|contains:\
  \ \\shellex\\ContextMenuHandlers\\EPP\n"
explanation: 'Detects the use of reg.exe or PowerShell to delete the Windows Defender
  context menu handler registry keys.

  This action removes the "Scan with Microsoft Defender" option from the right-click
  menu for files, directories, and drives.

  Attackers may use this technique to hinder manual, on-demand scans and reduce the
  visibility of the security product.

  '
false_positives:
- May be part of a system customization or "debloating" script, but this is highly
  unusual in a managed corporate environment.
references:
