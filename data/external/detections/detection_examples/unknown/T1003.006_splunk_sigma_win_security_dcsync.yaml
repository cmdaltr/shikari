technique_id: T1003.006
technique_name: Mimikatz DC Sync
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.87
validated: true
source: sigma
sigma_id: 611eab06-a145-4dfa-a295-3ccc5c20f59a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter*\nfilter1:\n  SubjectDomainName: Window Manager\nfilter2:\n  SubjectUserName|startswith:\n\
  \  - NT AUT\n  - MSOL_\nfilter3:\n  SubjectUserName|endswith: $\nselection:\n  AccessMask:\
  \ '0x100'\n  EventID: 4662\n  Properties|contains:\n  - Replicating Directory Changes\
  \ All\n  - 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2\n  - 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2\n\
  \  - 9923a32a-3607-11d2-b9be-0000f87a36b2\n  - 89e95b76-444d-4c62-991a-0facbeda640c\n"
explanation: Detects Mimikatz DC sync security events
false_positives:
- Valid DC Sync that is not covered by the filters; please report
- Local Domain Admin account used for Azure AD Connect
references:
- https://twitter.com/gentilkiwi/status/1003236624925413376
- https://gist.github.com/gentilkiwi/dcc132457408cf11ad2061340dcb53c2
- https://blog.blacklanternsecurity.com/p/detecting-dcsync?s=r
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4662
tags:
- attack.credential-access
- attack.s0002
- attack.t1003.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains:
    - Replicating Directory Changes All
    - 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
    - 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2
    - 9923a32a-3607-11d2-b9be-0000f87a36b2
    - 89e95b76-444d-4c62-991a-0facbeda640c
    AccessMask: '0x100'
  filter1:
    SubjectDomainName: Window Manager
  filter2:
    SubjectUserName|startswith:
    - NT AUT
    - MSOL_
  filter3:
    SubjectUserName|endswith: $
  condition: selection and not 1 of filter*
