technique_id: T1202
technique_name: WSL Kali-Linux Usage
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 6f1a11aa-4b8a-4b7f-9e13-4d3e4ff0e0d4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_img_*\
  \ or all of selection_kali_* and not 1 of filter_main_*\nfilter_main_install_uninstall:\n\
  \  CommandLine|contains:\n  - ' -i '\n  - ' --install '\n  - ' --unregister '\n\
  selection_img_appdata:\n- Image|contains|all:\n  - :\\Users\\\n  - \\AppData\\Local\\\
  packages\\KaliLinux\n- Image|contains|all:\n  - :\\Users\\\n  - \\AppData\\Local\\\
  Microsoft\\WindowsApps\\kali.exe\nselection_img_windowsapps:\n  Image|contains:\
  \ :\\Program Files\\WindowsApps\\KaliLinux.\n  Image|endswith: \\kali.exe\nselection_kali_wsl_child:\n\
  - Image|contains:\n  - \\kali.exe\n  - \\KaliLinux\n- CommandLine|contains:\n  -\
  \ Kali.exe\n  - Kali-linux\n  - kalilinux\nselection_kali_wsl_parent:\n  ParentImage|endswith:\n\
  \  - \\wsl.exe\n  - \\wslhost.exe\n"
explanation: Detects the use of Kali Linux through Windows Subsystem for Linux
false_positives:
- Legitimate installation or usage of Kali Linux WSL by administrators or security
  teams
references:
- https://medium.com/@redfanatic7/running-kali-linux-on-windows-51ad95166e6e
- https://learn.microsoft.com/en-us/windows/wsl/install
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_img_appdata:
  - Image|contains|all:
    - :\Users\
    - \AppData\Local\packages\KaliLinux
  - Image|contains|all:
    - :\Users\
    - \AppData\Local\Microsoft\WindowsApps\kali.exe
  selection_img_windowsapps:
    Image|contains: :\Program Files\WindowsApps\KaliLinux.
    Image|endswith: \kali.exe
  selection_kali_wsl_parent:
    ParentImage|endswith:
    - \wsl.exe
    - \wslhost.exe
  selection_kali_wsl_child:
  - Image|contains:
    - \kali.exe
    - \KaliLinux
  - CommandLine|contains:
    - Kali.exe
    - Kali-linux
    - kalilinux
  filter_main_install_uninstall:
    CommandLine|contains:
    - ' -i '
    - ' --install '
    - ' --unregister '
  condition: 1 of selection_img_* or all of selection_kali_* and not 1 of filter_main_*
metadata:
  created_date: 2025-10-10
