technique_id: T1134.001
technique_name: Meterpreter or Cobalt Strike Getsystem Service Installation - Security
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: ecbc5e16-58e0-4521-9c60-eb9a7ea4ad34
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_eid and 1 of\
  \ selection_cli_*\nselection_cli_cmd:\n  ServiceFileName|contains:\n  - cmd\n  -\
  \ '%COMSPEC%'\n  ServiceFileName|contains|all:\n  - /c\n  - echo\n  - \\pipe\\\n\
  selection_cli_rundll:\n  ServiceFileName|contains|all:\n  - rundll32\n  - .dll,a\n\
  \  - '/p:'\nselection_cli_share:\n  ServiceFileName|startswith: \\\\\\\\127.0.0.1\\\
  \\ADMIN$\\\nselection_eid:\n  EventID: 4697\n"
explanation: Detects the use of getsystem Meterpreter/Cobalt Strike command by detecting
  a specific service installation
false_positives:
- Unlikely
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://blog.cobaltstrike.com/2014/04/02/what-happens-when-i-type-getsystem/
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1134.001
- attack.t1134.002
logsource:
  product: windows
  service: security
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  selection_eid:
    EventID: 4697
  selection_cli_cmd:
    ServiceFileName|contains|all:
    - /c
    - echo
    - \pipe\
    ServiceFileName|contains:
    - cmd
    - '%COMSPEC%'
  selection_cli_rundll:
    ServiceFileName|contains|all:
    - rundll32
    - .dll,a
    - '/p:'
  selection_cli_share:
    ServiceFileName|startswith: \\\\127.0.0.1\\ADMIN$\
  condition: selection_eid and 1 of selection_cli_*
metadata:
