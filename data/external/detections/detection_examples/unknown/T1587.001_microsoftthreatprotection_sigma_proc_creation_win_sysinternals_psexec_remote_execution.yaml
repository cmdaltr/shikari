technique_id: T1587.001
technique_name: Potential PsExec Remote Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: ea011323-7045-460b-b2d7-0f7442ea6b38
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_localhost:\n  CommandLine|contains:\n  - \\\\\\\\localhost\n\
  \  - \\\\\\\\127.\nselection:\n  CommandLine|contains|all:\n  - accepteula\n  -\
  \ ' -u '\n  - ' -p '\n  - ' \\\\\\\\'\n"
explanation: Detects potential psexec command that initiate execution on a remote
  systems via common commandline flags used by the utility
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - accepteula
    - ' -u '
    - ' -p '
    - ' \\\\'
  filter_main_localhost:
    CommandLine|contains:
    - \\\\localhost
    - \\\\127.
  condition: selection and not 1 of filter_main_*
