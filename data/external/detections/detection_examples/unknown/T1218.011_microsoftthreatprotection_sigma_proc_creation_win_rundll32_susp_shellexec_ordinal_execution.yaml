technique_id: T1218.011
technique_name: Suspicious ShellExec_RunDLL Call Via Ordinal
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 8823e85d-31d8-473e-b7f4-92da070f0fc6
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_parent_*\
  \ and 1 of selection_susp_*\nselection_parent_img:\n  ParentCommandLine|contains:\
  \ SHELL32.DLL\nselection_parent_ordinal:\n  ParentCommandLine|contains:\n  - '#568'\n\
  \  - '#570'\n  - '#572'\n  - '#576'\nselection_susp_child_img:\n  Image|endswith:\n\
  \  - \\bash.exe\n  - \\bitsadmin.exe\n  - \\cmd.exe\n  - \\cscript.exe\n  - \\curl.exe\n\
  \  - \\mshta.exe\n  - \\msiexec.exe\n  - \\msxsl.exe\n  - \\odbcconf.exe\n  - \\\
  powershell.exe\n  - \\pwsh.exe\n  - \\regsvr32.exe\n  - \\schtasks.exe\n  - \\wmic.exe\n\
  \  - \\wscript.exe\nselection_susp_cli_parent:\n- ParentCommandLine|contains:\n\
  \  - comspec\n  - iex\n  - Invoke-\n  - msiexec\n  - odbcconf\n  - regsvr32\n- ParentCommandLine|contains:\n\
  \  - \\Desktop\\\n  - \\ProgramData\\\n  - \\Temp\\\n  - \\Users\\Public\\\n"
explanation: 'Detects suspicious call to the "ShellExec_RunDLL" exported function
  of SHELL32.DLL through the ordinal number to launch other commands.

  Adversary might only use the ordinal number in order to bypass existing detection
  that alert on usage of ShellExec_RunDLL on CommandLine.

  '
false_positives:
- Unknown
references:
- https://redcanary.com/blog/raspberry-robin/
- https://www.microsoft.com/en-us/security/blog/2022/10/27/raspberry-robin-worm-part-of-larger-ecosystem-facilitating-pre-ransomware-activity/
- https://github.com/SigmaHQ/sigma/issues/1009
- https://strontic.github.io/xcyclopedia/library/shell32.dll-65DA072F25DE83D9F83653E3FEA3644D.html
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_img:
    ParentCommandLine|contains: SHELL32.DLL
  selection_parent_ordinal:
    ParentCommandLine|contains:
    - '#568'
    - '#570'
    - '#572'
    - '#576'
  selection_susp_cli_parent:
  - ParentCommandLine|contains:
    - comspec
    - iex
    - Invoke-
    - msiexec
    - odbcconf
    - regsvr32
  - ParentCommandLine|contains:
    - \Desktop\
    - \ProgramData\
    - \Temp\
    - \Users\Public\
  selection_susp_child_img:
    Image|endswith:
    - \bash.exe
    - \bitsadmin.exe
    - \cmd.exe
    - \cscript.exe
    - \curl.exe
    - \mshta.exe
    - \msiexec.exe
    - \msxsl.exe
    - \odbcconf.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \schtasks.exe
    - \wmic.exe
    - \wscript.exe
  condition: all of selection_parent_* and 1 of selection_susp_*
