technique_id: T1587.001
technique_name: Potential Privilege Escalation To LOCAL SYSTEM
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.83
validated: true
source: sigma
sigma_id: 207b0396-3689-42d9-8399-4222658efc99
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_exclude_coverage:\n  CommandLine|contains:\n  - paexec\n\
  \  - PsExec\n  - accepteula\nselection:\n  CommandLine|contains|windash:\n  - '\
  \ -s cmd'\n  - ' -s -i cmd'\n  - ' -i -s cmd'\n  - ' -s pwsh'\n  - ' -s -i pwsh'\n\
  \  - ' -i -s pwsh'\n  - ' -s powershell'\n  - ' -s -i powershell'\n  - ' -i -s powershell'\n"
explanation: Detects unknown program using commandline flags usually used by tools
  such as PsExec and PAExec to start programs with SYSTEM Privileges
false_positives:
- Weird admins that rename their tools
- Software companies that bundle PsExec/PAExec with their software and rename it,
  so that it is less embarrassing
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/psexec
- https://www.poweradmin.com/paexec/
- https://www.fireeye.com/blog/threat-research/2020/10/kegtap-and-singlemalt-with-a-ransomware-chaser.html
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|windash:
    - ' -s cmd'
    - ' -s -i cmd'
    - ' -i -s cmd'
    - ' -s pwsh'
    - ' -s -i pwsh'
    - ' -i -s pwsh'
    - ' -s powershell'
    - ' -s -i powershell'
    - ' -i -s powershell'
  filter_main_exclude_coverage:
    CommandLine|contains:
    - paexec
    - PsExec
    - accepteula
  condition: selection and not 1 of filter_main_*
