technique_id: T1070
technique_name: ETW Trace Evasion Activity
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_clear_1:\n\
  \  CommandLine|contains|all:\n  - cl\n  - /Trace\nselection_clear_2:\n  CommandLine|contains|all:\n\
  \  - clear-log\n  - /Trace\nselection_disable_1:\n  CommandLine|contains|all:\n\
  \  - sl\n  - /e:false\nselection_disable_2:\n  CommandLine|contains|all:\n  - set-log\n\
  \  - /e:false\nselection_disable_3:\n  CommandLine|contains|all:\n  - logman\n \
  \ - update\n  - trace\n  - --p\n  - -ets\nselection_pwsh_remove:\n  CommandLine|contains:\
  \ Remove-EtwTraceProvider\nselection_pwsh_set:\n  CommandLine|contains|all:\n  -\
  \ Set-EtwTraceProvider\n  - '0x11'\n"
explanation: 'Detects command line activity that tries to clear or disable any ETW
  trace log which could be a sign of logging evasion.

  '
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
- https://abuse.io/lockergoga.txt
- https://medium.com/palantir/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
tags:
- attack.defense-evasion
- attack.t1070
- attack.t1562.006
- car.2016-04-002
logsource:
  category: process_creation
  product: windows
detection:
  selection_clear_1:
    CommandLine|contains|all:
    - cl
    - /Trace
  selection_clear_2:
    CommandLine|contains|all:
    - clear-log
    - /Trace
  selection_disable_1:
    CommandLine|contains|all:
    - sl
    - /e:false
  selection_disable_2:
    CommandLine|contains|all:
    - set-log
    - /e:false
  selection_disable_3:
    CommandLine|contains|all:
    - logman
    - update
    - trace
    - --p
    - -ets
  selection_pwsh_remove:
    CommandLine|contains: Remove-EtwTraceProvider
  selection_pwsh_set:
    CommandLine|contains|all:
    - Set-EtwTraceProvider
    - '0x11'
  condition: 1 of selection_*
