technique_id: T1552.006
technique_name: LSASS Process Reconnaissance Via Findstr.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: fe63010f-8823-4864-a96b-a7b4a0f7b929
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_findstr_*\
  \ or selection_special\nselection_findstr_cli:\n  CommandLine|contains: lsass\n\
  selection_findstr_img:\n- Image|endswith:\n  - \\find.exe\n  - \\findstr.exe\n-\
  \ OriginalFileName:\n  - FIND.EXE\n  - FINDSTR.EXE\nselection_special:\n  CommandLine|contains|windash:\n\
  \  - ' /i \"lsass'\n  - ' /i lsass.exe'\n  - findstr \"lsass\n  - findstr lsass\n\
  \  - findstr.exe \"lsass\n  - findstr.exe lsass\n"
explanation: Detects findstring commands that include the keyword lsass, which indicates
  recon actviity for the LSASS process PID
false_positives:
- Unknown
references:
- https://blog.talosintelligence.com/2022/08/recent-cyber-attack.html?m=1
tags:
- attack.credential-access
- attack.t1552.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr_img:
  - Image|endswith:
    - \find.exe
    - \findstr.exe
  - OriginalFileName:
    - FIND.EXE
    - FINDSTR.EXE
  selection_findstr_cli:
    CommandLine|contains: lsass
  selection_special:
    CommandLine|contains|windash:
    - ' /i "lsass'
    - ' /i lsass.exe'
    - findstr "lsass
    - findstr lsass
    - findstr.exe "lsass
    - findstr.exe lsass
  condition: all of selection_findstr_* or selection_special
