technique_id: T1587.001
technique_name: Uncommon File Created In Office Startup Folder
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: ((selection_word_paths\
  \ and not filter_exclude_word_ext) or (selection_excel_paths\n  and not filter_exclude_excel_ext))\
  \ and not 1 of filter_main_*\nfilter_exclude_excel_ext:\n  TargetFilename|endswith:\n\
  \  - .xll\n  - .xls\n  - .xlsm\n  - .xlsx\n  - .xlt\n  - .xltm\n  - .xlw\nfilter_exclude_word_ext:\n\
  \  TargetFilename|endswith:\n  - .docb\n  - .docm\n  - .docx\n  - .dotm\n  - .mdb\n\
  \  - .mdw\n  - .pdf\n  - .wll\n  - .wwl\nfilter_main_office_apps:\n  Image|contains:\n\
  \  - :\\Program Files\\Microsoft Office\\\n  - :\\Program Files (x86)\\Microsoft\
  \ Office\\\n  Image|endswith:\n  - \\winword.exe\n  - \\excel.exe\nfilter_main_office_click_to_run:\n\
  \  Image|contains: :\\Program Files\\Common Files\\Microsoft Shared\\ClickToRun\\\
  \n  Image|endswith: \\OfficeClickToRun.exe\nselection_excel_paths:\n- TargetFilename|contains:\
  \ \\Microsoft\\Excel\\XLSTART\n- TargetFilename|contains|all:\n  - \\Office\n  -\
  \ \\Program Files\n  - \\XLSTART\nselection_word_paths:\n- TargetFilename|contains:\
  \ \\Microsoft\\Word\\STARTUP\n- TargetFilename|contains|all:\n  - \\Office\n  -\
  \ \\Program Files\n  - \\STARTUP\n"
explanation: Detects the creation of a file with an uncommon extension in an Office
  application startup folder
false_positives:
- False positive might stem from rare extensions used by other Office utilities.
references:
- https://app.any.run/tasks/d6fe6624-6ef8-485d-aa75-3d1bdda2a08c/
- http://addbalance.com/word/startup.htm
- https://answers.microsoft.com/en-us/msoffice/forum/all/document-in-word-startup-folder-doesnt-open-when/44ab0932-2917-4150-8cdc-2f2cf39e86f3
- https://en.wikipedia.org/wiki/List_of_Microsoft_Office_filename_extensions
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  product: windows
  category: file_event
detection:
  selection_word_paths:
  - TargetFilename|contains: \Microsoft\Word\STARTUP
  - TargetFilename|contains|all:
    - \Office
    - \Program Files
    - \STARTUP
  filter_exclude_word_ext:
    TargetFilename|endswith:
    - .docb
    - .docm
    - .docx
    - .dotm
    - .mdb
    - .mdw
    - .pdf
    - .wll
    - .wwl
  selection_excel_paths:
  - TargetFilename|contains: \Microsoft\Excel\XLSTART
  - TargetFilename|contains|all:
    - \Office
    - \Program Files
    - \XLSTART
  filter_exclude_excel_ext:
    TargetFilename|endswith:
    - .xll
    - .xls
    - .xlsm
    - .xlsx
    - .xlt
    - .xltm
    - .xlw
  filter_main_office_click_to_run:
    Image|contains: :\Program Files\Common Files\Microsoft Shared\ClickToRun\
    Image|endswith: \OfficeClickToRun.exe
  filter_main_office_apps:
    Image|contains:
    - :\Program Files\Microsoft Office\
    - :\Program Files (x86)\Microsoft Office\
    Image|endswith:
    - \winword.exe
    - \excel.exe
  condition: ((selection_word_paths and not filter_exclude_word_ext) or (selection_excel_paths
    and not filter_exclude_excel_ext)) and not 1 of filter_main_*
