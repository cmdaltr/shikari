query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000000)\n  TargetObject|contains: \\Microsoft\\Windows\\\
  CurrentVersion\\WINEVT\\Channels\\Microsoft-Windows-Windows\n    Defender/Operational\\\
  Enabled\n"
explanation: Detects the disabling of the Windows Defender eventlog as seen in relation
  to Lockbit 3.0 infections
false_positives:
- Other Antivirus software installations could cause Windows to disable that eventlog
  (unknown)
