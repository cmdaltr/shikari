query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - Image|endswith: \\Rubeus.exe\n- OriginalFileName: Rubeus.exe\n- Description: Rubeus\n\
  - CommandLine|contains:\n  - 'asreproast '\n  - 'dump /service:krbtgt '\n  - dump\
  \ /luid:0x\n  - 'kerberoast '\n  - 'createnetonly /program:'\n  - 'ptt /ticket:'\n\
  \  - '/impersonateuser:'\n  - 'renew /ticket:'\n  - 'asktgt /user:'\n  - 'harvest\
  \ /interval:'\n  - 's4u /user:'\n  - 's4u /ticket:'\n  - 'hash /password:'\n  -\
  \ 'golden /aes256:'\n  - 'silver /user:'\n"
