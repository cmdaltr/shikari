technique_id: T1562.001
technique_name: Tamper Windows Defender - ScriptBlockLogging
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 14c71865-6cd3-44ae-adaa-1db923fae5f2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_options_disabling_*\
  \ or all of selection_other_default_actions_*\nselection_options_disabling_function:\n\
  \  ScriptBlockText|contains:\n  - -dbaf $true\n  - -dbaf 1\n  - -dbm $true\n  -\
  \ -dbm 1\n  - -dips $true\n  - -dips 1\n  - -DisableArchiveScanning $true\n  - -DisableArchiveScanning\
  \ 1\n  - -DisableBehaviorMonitoring $true\n  - -DisableBehaviorMonitoring 1\n  -\
  \ -DisableBlockAtFirstSeen $true\n  - -DisableBlockAtFirstSeen 1\n  - -DisableCatchupFullScan\
  \ $true\n  - -DisableCatchupFullScan 1\n  - -DisableCatchupQuickScan $true\n  -\
  \ -DisableCatchupQuickScan 1\n  - -DisableIntrusionPreventionSystem $true\n  - -DisableIntrusionPreventionSystem\
  \ 1\n  - -DisableIOAVProtection $true\n  - -DisableIOAVProtection 1\n  - -DisableRealtimeMonitoring\
  \ $true\n  - -DisableRealtimeMonitoring 1\n  - -DisableRemovableDriveScanning $true\n\
  \  - -DisableRemovableDriveScanning 1\n  - -DisableScanningMappedNetworkDrivesForFullScan\
  \ $true\n  - -DisableScanningMappedNetworkDrivesForFullScan 1\n  - -DisableScanningNetworkFiles\
  \ $true\n  - -DisableScanningNetworkFiles 1\n  - -DisableScriptScanning $true\n\
  \  - -DisableScriptScanning 1\n  - -MAPSReporting $false\n  - -MAPSReporting 0\n\
  \  - -drdsc $true\n  - -drdsc 1\n  - -drtm $true\n  - -drtm 1\n  - -dscrptsc $true\n\
  \  - -dscrptsc 1\n  - -dsmndf $true\n  - -dsmndf 1\n  - -dsnf $true\n  - -dsnf 1\n\
  \  - -dss $true\n  - -dss 1\nselection_options_disabling_preference:\n  ScriptBlockText|contains:\
  \ Set-MpPreference\nselection_other_default_actions_allow:\n  ScriptBlockText|contains:\
  \ Set-MpPreference\nselection_other_default_actions_func:\n  ScriptBlockText|contains:\n\
  \  - HighThreatDefaultAction Allow\n  - htdefac Allow\n  - LowThreatDefaultAction\
  \ Allow\n  - ltdefac Allow\n  - ModerateThreatDefaultAction Allow\n  - mtdefac Allow\n\
  \  - SevereThreatDefaultAction Allow\n  - stdefac Allow\n"
explanation: Detects PowerShell scripts attempting to disable scheduled scanning and
  other parts of Windows Defender ATP or set default actions to allow.
false_positives:
- Legitimate PowerShell scripts that disable Windows Defender for troubleshooting
  purposes. Must be investigated.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference?view=windowsserver2022-ps
- https://bidouillesecurity.com/disable-windows-defender-in-powershell/
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection_options_disabling_preference:
    ScriptBlockText|contains: Set-MpPreference
  selection_options_disabling_function:
    ScriptBlockText|contains:
    - -dbaf $true
    - -dbaf 1
    - -dbm $true
    - -dbm 1
    - -dips $true
    - -dips 1
    - -DisableArchiveScanning $true
    - -DisableArchiveScanning 1
    - -DisableBehaviorMonitoring $true
    - -DisableBehaviorMonitoring 1
    - -DisableBlockAtFirstSeen $true
    - -DisableBlockAtFirstSeen 1
    - -DisableCatchupFullScan $true
    - -DisableCatchupFullScan 1
    - -DisableCatchupQuickScan $true
    - -DisableCatchupQuickScan 1
    - -DisableIntrusionPreventionSystem $true
    - -DisableIntrusionPreventionSystem 1
    - -DisableIOAVProtection $true
    - -DisableIOAVProtection 1
    - -DisableRealtimeMonitoring $true
    - -DisableRealtimeMonitoring 1
    - -DisableRemovableDriveScanning $true
    - -DisableRemovableDriveScanning 1
    - -DisableScanningMappedNetworkDrivesForFullScan $true
    - -DisableScanningMappedNetworkDrivesForFullScan 1
    - -DisableScanningNetworkFiles $true
    - -DisableScanningNetworkFiles 1
    - -DisableScriptScanning $true
    - -DisableScriptScanning 1
    - -MAPSReporting $false
    - -MAPSReporting 0
    - -drdsc $true
    - -drdsc 1
    - -drtm $true
    - -drtm 1
    - -dscrptsc $true
    - -dscrptsc 1
    - -dsmndf $true
    - -dsmndf 1
    - -dsnf $true
    - -dsnf 1
    - -dss $true
    - -dss 1
  selection_other_default_actions_allow:
    ScriptBlockText|contains: Set-MpPreference
  selection_other_default_actions_func:
    ScriptBlockText|contains:
    - HighThreatDefaultAction Allow
    - htdefac Allow
    - LowThreatDefaultAction Allow
    - ltdefac Allow
    - ModerateThreatDefaultAction Allow
    - mtdefac Allow
    - SevereThreatDefaultAction Allow
    - stdefac Allow
  condition: all of selection_options_disabling_* or all of selection_other_default_actions_*
