technique_id: T1070.003
technique_name: Linux Command History Tampering
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: fdc88d25-96fb-4b7c-9633-c0e417fdbd4e
level: high
query: '# Sigma Detection Logic

  # Convert to platform-specific query using Sigma tools:

  # https://github.com/SigmaHQ/sigma


  condition: keywords

  keywords:

  - cat /dev/null >*sh_history

  - cat /dev/zero >*sh_history

  - chattr +i*sh_history

  - echo "" >*sh_history

  - empty_bash_history

  - export HISTFILESIZE=0

  - history -c

  - history -w

  - ln -sf /dev/null *sh_history

  - ln -sf /dev/zero *sh_history

  - rm *sh_history

  - shopt -ou history

  - shopt -uo history

  - shred *sh_history

  - truncate -s0 *sh_history

  '
explanation: 'Detects commands that try to clear or tamper with the Linux command
  history.

  This technique is used by threat actors in order to evade defenses and execute commands
  without them being recorded in files such as "bash_history" or "zsh_history".

  '
false_positives:
- Unknown
