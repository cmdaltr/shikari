technique_id: T1036.003
technique_name: Renamed ProcDump Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.87
validated: true
source: sigma
sigma_id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (selection_ofn or all\
  \ of selection_cli_*) and not 1 of filter_main_*\nfilter_main_known_names:\n  Image|endswith:\n\
  \  - \\procdump.exe\n  - \\procdump64.exe\nselection_cli_dump_flag:\n  CommandLine|contains|windash:\n\
  \  - ' -ma '\n  - ' -mp '\nselection_cli_eula_flag:\n  CommandLine|contains|windash:\
  \ ' /accepteula'\nselection_ofn:\n  OriginalFileName: procdump\n"
explanation: 'Detects the execution of a renamed ProcDump executable.

  This often done by attackers or malware in order to evade defensive mechanisms.

  '
false_positives:
- Procdump illegally bundled with legitimate software.
- Administrators who rename binaries (should be investigated).
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
tags:
- attack.defense-evasion
- attack.t1036.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_ofn:
    OriginalFileName: procdump
  selection_cli_dump_flag:
    CommandLine|contains|windash:
    - ' -ma '
    - ' -mp '
  selection_cli_eula_flag:
    CommandLine|contains|windash: ' /accepteula'
  filter_main_known_names:
    Image|endswith:
    - \procdump.exe
    - \procdump64.exe
  condition: (selection_ofn or all of selection_cli_*) and not 1 of filter_main_*
