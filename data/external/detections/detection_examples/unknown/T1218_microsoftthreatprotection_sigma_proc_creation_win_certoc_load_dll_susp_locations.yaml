technique_id: T1218
technique_name: Suspicious DLL Loaded via CertOC.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 84232095-ecca-4015-b0d7-7726507ee793
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|windash: ' -LoadDLL '\nselection_img:\n-\
  \ Image|endswith: \\certoc.exe\n- OriginalFileName: CertOC.exe\nselection_paths:\n\
  \  CommandLine|contains:\n  - \\Appdata\\Local\\Temp\\\n  - \\Desktop\\\n  - \\\
  Downloads\\\n  - \\Users\\Public\\\n  - C:\\Windows\\Tasks\\\n  - C:\\Windows\\\
  Temp\\\n"
explanation: Detects when a user installs certificates by using CertOC.exe to load
  the target DLL file.
false_positives:
- Unknown
references:
- https://twitter.com/sblmsrsn/status/1445758411803480072?s=20
- https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-fe98e74189873d6df72a15df2eaa0315c59ba9cdaca93ecd68afc4ea09194ef2
- https://lolbas-project.github.io/lolbas/Binaries/Certoc/
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \certoc.exe
  - OriginalFileName: CertOC.exe
  selection_cli:
    CommandLine|contains|windash: ' -LoadDLL '
  selection_paths:
    CommandLine|contains:
    - \Appdata\Local\Temp\
    - \Desktop\
    - \Downloads\
    - \Users\Public\
    - C:\Windows\Tasks\
    - C:\Windows\Temp\
  condition: all of selection_*
