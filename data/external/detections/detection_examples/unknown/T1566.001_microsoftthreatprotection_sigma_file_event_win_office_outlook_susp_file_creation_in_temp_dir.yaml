technique_id: T1566.001
technique_name: Suspicious File Created in Outlook Temporary Directory
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: fabb0e80-030c-4e3e-a104-d09676991ac3
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_extension:\n  TargetFilename|endswith:\n  - .cpl\n  - .hta\n  - .iso\n\
  \  - .rdp\n  - .svg\n  - .vba\n  - .vbe\n  - .vbs\nselection_location:\n- TargetFilename|contains:\n\
  \  - \\AppData\\Local\\Packages\\Microsoft.Outlook_\n  - \\AppData\\Local\\Microsoft\\\
  Olk\\Attachments\\\n- TargetFilename|contains|all:\n  - \\AppData\\Local\\Microsoft\\\
  Windows\\\n  - \\Content.Outlook\\\n"
explanation: 'Detects the creation of files with suspicious file extensions in the
  temporary directory that Outlook uses when opening attachments.

  This can be used to detect spear-phishing campaigns that use suspicious files as
  attachments, which may contain malicious code.

  '
false_positives:
- Opening of headers or footers in email signatures that include SVG images or legitimate
  SVG attachments
references:
- https://vipre.com/blog/svg-phishing-attacks-the-new-trick-in-the-cybercriminals-playbook/
- https://thecyberexpress.com/rogue-rdp-files-used-in-ukraine-cyberattacks/
- https://www.microsoft.com/en-us/security/blog/2024/10/29/midnight-blizzard-conducts-large-scale-spear-phishing-campaign-using-rdp-files/
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  product: windows
  category: file_event
detection:
  selection_extension:
    TargetFilename|endswith:
    - .cpl
    - .hta
    - .iso
    - .rdp
    - .svg
    - .vba
    - .vbe
    - .vbs
  selection_location:
  - TargetFilename|contains:
    - \AppData\Local\Packages\Microsoft.Outlook_
    - \AppData\Local\Microsoft\Olk\Attachments\
  - TargetFilename|contains|all:
    - \AppData\Local\Microsoft\Windows\
    - \Content.Outlook\
  condition: all of selection_*
