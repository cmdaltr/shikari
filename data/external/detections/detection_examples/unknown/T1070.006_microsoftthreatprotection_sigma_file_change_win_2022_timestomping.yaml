technique_id: T1070.006
technique_name: File Creation Date Changed to Another Year
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 558eebe5-f2ba-4104-b339-36f7902bcc1a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: (( selection1 and not\
  \ filter1 ) or ( selection2 and not filter2 )) and\n  not 1 of gen_filter*\nfilter1:\n\
  \  CreationUtcTime|startswith: '2022'\nfilter2:\n  CreationUtcTime|startswith: '202'\n\
  gen_filter_tiworker:\n  Image|endswith: \\TiWorker.exe\n  Image|startswith: C:\\\
  WINDOWS\\\n  TargetFilename|endswith: .cab\ngen_filter_updates:\n- Image:\n  - C:\\\
  Windows\\system32\\ProvTool.exe\n  - C:\\Windows\\System32\\usocoreworker.exe\n\
  \  - C:\\Windows\\ImmersiveControlPanel\\SystemSettings.exe\n- TargetFilename|startswith:\
  \ C:\\ProgramData\\USOPrivate\\UpdateStore\\\n- TargetFilename|endswith:\n  - .tmp\n\
  \  - .temp\nselection1:\n  PreviousCreationUtcTime|startswith: '2022'\nselection2:\n\
  \  PreviousCreationUtcTime|startswith: '202'\n"
explanation: 'Attackers may change the file creation time of a backdoor to make it
  look like it was installed with the operating system.

  Note that many processes legitimately change the creation time of a file; it does
  not necessarily indicate malicious activity.

  '
false_positives:
- Changes made to or by the local NTP service
references:
- https://www.inversecos.com/2022/04/defence-evasion-technique-timestomping.html
tags:
- attack.t1070.006
- attack.defense-evasion
logsource:
  category: file_change
  product: windows
detection:
  selection1:
    PreviousCreationUtcTime|startswith: '2022'
  filter1:
    CreationUtcTime|startswith: '2022'
  selection2:
    PreviousCreationUtcTime|startswith: '202'
  filter2:
    CreationUtcTime|startswith: '202'
  gen_filter_updates:
  - Image:
    - C:\Windows\system32\ProvTool.exe
    - C:\Windows\System32\usocoreworker.exe
    - C:\Windows\ImmersiveControlPanel\SystemSettings.exe
  - TargetFilename|startswith: C:\ProgramData\USOPrivate\UpdateStore\
  - TargetFilename|endswith:
    - .tmp
    - .temp
  gen_filter_tiworker:
    Image|startswith: C:\WINDOWS\
    Image|endswith: \TiWorker.exe
    TargetFilename|endswith: .cab
  condition: (( selection1 and not filter1 ) or ( selection2 and not filter2 )) and
    not 1 of gen_filter*
