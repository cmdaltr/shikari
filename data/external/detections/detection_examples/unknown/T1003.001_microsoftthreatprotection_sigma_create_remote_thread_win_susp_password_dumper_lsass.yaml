query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  StartModule: ''\n  TargetImage|endswith: \\lsass.exe\n"
explanation: 'Detects password dumper activity by monitoring remote thread creation
  EventID 8 in combination with the lsass.exe process as TargetImage.

  The process in field Process is the malicious program. A single execution can lead
  to hundreds of events.

  '
