technique_id: T1189
technique_name: Cross Site Scripting Strings
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.82
validated: true
source: sigma
sigma_id: 65354b83-a2ea-4ea6-8414-3ab38be0d409
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: select_method and keywords\
  \ and not filter\nfilter:\n  sc-status: 404\nkeywords:\n- =<script>\n- =%3Cscript%3E\n\
  - =%253Cscript%253E\n- '<iframe '\n- '%3Ciframe '\n- '<svg '\n- '%3Csvg '\n- document.cookie\n\
  - document.domain\n- ' onerror='\n- ' onresize='\n- ' onload=\"'\n- onmouseover=\n\
  - ${alert\n- javascript:alert\n- javascript%3Aalert\nselect_method:\n  cs-method:\
  \ GET\n"
explanation: Detects XSS attempts injected via GET requests in access logs
false_positives:
- JavaScripts,CSS Files and PNG files
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you experience
  a lot of FPs due to this think of adding more filters such as "User Agent" strings
  and more response codes
references:
- https://github.com/payloadbox/xss-payload-list
- https://portswigger.net/web-security/cross-site-scripting/contexts
tags:
- attack.initial-access
- attack.t1189
logsource:
  category: webserver
detection:
  select_method:
    cs-method: GET
  keywords:
  - =<script>
  - =%3Cscript%3E
  - =%253Cscript%253E
  - '<iframe '
  - '%3Ciframe '
  - '<svg '
  - '%3Csvg '
  - document.cookie
  - document.domain
  - ' onerror='
  - ' onresize='
  - ' onload="'
  - onmouseover=
  - ${alert
  - javascript:alert
  - javascript%3Aalert
  filter:
    sc-status: 404
  condition: select_method and keywords and not filter
