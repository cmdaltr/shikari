- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - \Microsoft\Office\
    - \Excel\Security
    - PythonFunctionWarnings
    CommandLine|contains: ' 0'
  condition: selection
