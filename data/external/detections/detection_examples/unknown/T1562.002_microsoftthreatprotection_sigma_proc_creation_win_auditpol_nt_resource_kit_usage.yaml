technique_id: T1562.002
technique_name: Audit Policy Tampering Via NT Resource Kit Auditpol
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: c6c56ada-612b-42d1-9a29-adad3c5c2c1e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - /logon:none\n  - /system:none\n  - /sam:none\n  -\
  \ /privilege:none\n  - /object:none\n  - /process:none\n  - /policy:none\n"
explanation: 'Threat actors can use an older version of the auditpol binary available
  inside the NT resource kit to change audit policy configuration to impair detection
  capability.

  This can be carried out by selectively disabling/removing certain audit policies
  as well as restoring a custom policy owned by the threat actor.

  '
false_positives:
- The old auditpol utility isn't available by default on recent versions of Windows
  as it was replaced by a newer version. The FP rate should be very low except for
  tools that use a similar flag structure
references:
- https://github.com/3CORESec/MAL-CL/tree/master/Descriptors/Windows%202000%20Resource%20Kit%20Tools/AuditPol
tags:
