technique_id: T1562.001
technique_name: Python Function Execution Security Warning Disabled In Excel - Registry
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 17e53739-a1fc-4a62-b1b9-87711c2d5e44
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000001)\n  TargetObject|contains: \\Microsoft\\Office\\\n\
  \  TargetObject|endswith: \\Excel\\Security\\PythonFunctionWarnings\n"
explanation: 'Detects changes to the registry value "PythonFunctionWarnings" that
  would prevent any warnings or alerts from showing when Python functions are about
  to be executed.

  Threat actors could run malicious code through the new Microsoft Excel feature that
  allows Python to run within the spreadsheet.

  '
false_positives:
- Unknown
references:
- https://support.microsoft.com/en-us/office/data-security-and-python-in-excel-33cc88a4-4a87-485e-9ff9-f35958278327
tags:
