query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection1:\n\
  \  CommandLine|contains|all:\n  - ' -name IEHarden '\n  - ' -value 0 '\nselection2:\n\
  \  CommandLine|contains|all:\n  - ' -name DEPOff '\n  - ' -value 1 '\nselection3:\n\
  \  CommandLine|contains|all:\n  - ' -name DisableFirstRunCustomize '\n  - ' -value\
  \ 2 '\n"
explanation: Detects command lines that indicate unwanted modifications to registry
  keys that disable important Internet Explorer security features
false_positives:
- Unknown
