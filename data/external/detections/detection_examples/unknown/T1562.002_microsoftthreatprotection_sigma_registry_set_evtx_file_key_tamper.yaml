query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  Details|contains: \\System32\\Winevt\\Logs\\\nselection:\n  TargetObject|contains:\
  \ \\SYSTEM\\CurrentControlSet\\Services\\EventLog\\\n  TargetObject|endswith: \\\
  File\n"
explanation: Detects tampering with EventLog service "file" key. In order to change
  the default location of an Evtx file. This technique is used to tamper with log
  collection and alerting
false_positives:
- Unknown
