technique_id: T1562.001
technique_name: Suspicious Uninstall of Windows Defender Feature via PowerShell
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: c443012c-7928-43bf-ac20-7eda5efe61ad
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli_defender_feature:\n  CommandLine|contains: Windows-Defender\nselection_cli_uninstall:\n\
  \  CommandLine|contains:\n  - Uninstall-WindowsFeature\n  - Remove-WindowsFeature\n\
  selection_img:\n- Image|endswith:\n  - \\powershell_ise.exe\n  - \\powershell.exe\n\
  \  - \\pwsh.exe\n- OriginalFileName:\n  - PowerShell_ISE.EXE\n  - PowerShell.EXE\n\
  \  - pwsh.dll\n"
explanation: 'Detects the use of PowerShell with Uninstall-WindowsFeature or Remove-WindowsFeature
  cmdlets to disable or remove the Windows Defender GUI feature, a common technique
  used by adversaries to evade defenses.

  '
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/powershell/module/microsoft.windows.servermanager.migration/uninstall-windowsfeature
- https://thedfirreport.com/2023/04/03/malicious-iso-file-leads-to-domain-wide-ransomware
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \powershell_ise.exe
    - \powershell.exe
    - \pwsh.exe
  - OriginalFileName:
    - PowerShell_ISE.EXE
    - PowerShell.EXE
    - pwsh.dll
  selection_cli_uninstall:
    CommandLine|contains:
    - Uninstall-WindowsFeature
    - Remove-WindowsFeature
  selection_cli_defender_feature:
    CommandLine|contains: Windows-Defender
  condition: all of selection_*
