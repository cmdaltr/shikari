query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  TargetObject|endswith: \\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\\
  RunMRU\n"
explanation: 'Detects attempts to delete the RunMRU registry key, which stores the
  history of commands executed via the run dialog.

  In the clickfix techniques, the phishing lures instruct users to open a run dialog
  through (Win + R) and execute malicious commands.

  Adversaries may delete this key to cover their tracks after executing commands.

  '
false_positives:
- Unknown
