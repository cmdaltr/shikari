query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not filter\nfilter:\n  CommandLine|contains: Shell32.dll\nselection_img:\n- Image|endswith:\
  \ \\rundll32.exe\n- OriginalFileName: RUNDLL32.EXE\nselection_parent:\n  ParentImage|endswith:\
  \ \\System32\\control.exe\n"
explanation: Detects suspicious Rundll32 execution from control.exe as used by Equation
  Group and Exploit Kits
false_positives:
- Unknown
