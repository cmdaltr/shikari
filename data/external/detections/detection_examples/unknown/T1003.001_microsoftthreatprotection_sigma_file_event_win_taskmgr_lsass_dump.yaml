technique_id: T1003.001
technique_name: LSASS Process Memory Dump Creation Via Taskmgr.EXE
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 69ca12af-119d-44ed-b50f-a47af0ebc364
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Image|endswith:\n  - :\\Windows\\system32\\taskmgr.exe\n  - :\\Windows\\SysWOW64\\\
  taskmgr.exe\n  TargetFilename|contains|all:\n  - \\AppData\\Local\\Temp\\\n  - \\\
  lsass\n  - .DMP\n"
explanation: Detects the creation of an "lsass.dmp" file by the taskmgr process. This
  indicates a manual dumping of the LSASS.exe process memory using Windows Task Manager.
false_positives:
- Rare case of troubleshooting by an administrator or support that has to be investigated
  regardless
references:
- https://github.com/redcanaryco/atomic-red-team/blob/987e3ca988ae3cff4b9f6e388c139c05bf44bbb8/atomics/T1003.001/T1003.001.md#L1
