technique_id: T1071.004
technique_name: Suspicious Cobalt Strike DNS Beaconing - DNS Client
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.93
validated: true
source: sigma
sigma_id: 0d18728b-f5bf-4381-9dcf-915539fff6c2
level: critical
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_eid and 1 of\
  \ selection_query_*\nselection_eid:\n  EventID: 3008\nselection_query_1:\n  QueryName|startswith:\n\
  \  - aaa.stage.\n  - post.1\nselection_query_2:\n  QueryName|contains: .stage.123456.\n"
explanation: Detects a program that invoked suspicious DNS queries known from Cobalt
  Strike beacons
false_positives:
- Unknown
references:
- https://www.icebrg.io/blog/footprints-of-fin7-tracking-actor-patterns
- https://www.sekoia.io/en/hunting-and-detecting-cobalt-strike/
tags:
- attack.t1071.004
- attack.command-and-control
logsource:
  product: windows
  service: dns-client
  definition: 'Requirements: Microsoft-Windows-DNS Client Events/Operational Event
    Log must be enabled/collected in order to receive the events.'
detection:
  selection_eid:
    EventID: 3008
  selection_query_1:
    QueryName|startswith:
    - aaa.stage.
    - post.1
  selection_query_2:
    QueryName|contains: .stage.123456.
  condition: selection_eid and 1 of selection_query_*
