fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 551d9c1f-816c-445b-a7a6-7a3864720d60
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_child:\n- OriginalFileName:\n  - foxprow.exe\n  - schdplus.exe\n  - winproj.exe\n\
  - Image|endswith:\n  - \\foxprow.exe\n  - \\schdplus.exe\n  - \\winproj.exe\nselection_parent:\n\
  \  ParentImage|endswith: \\excel.exe\n"
explanation: 'Detects suspicious child processes of Excel which could be an indicator
  of lateral movement leveraging the "ActivateMicrosoftApp" Excel DCOM object.

  '
false_positives:
- Unknown
references:
- https://posts.specterops.io/lateral-movement-abuse-the-power-of-dcom-excel-application-3c016d0d9922
- https://github.com/grayhatkiller/SharpExShell
- https://learn.microsoft.com/en-us/office/vba/api/excel.xlmsapplication
tags:
