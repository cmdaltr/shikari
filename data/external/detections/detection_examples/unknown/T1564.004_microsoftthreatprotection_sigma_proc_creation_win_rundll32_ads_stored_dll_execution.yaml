query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|re: '[Rr][Uu][Nn][Dd][Ll][Ll]32(\\.[Ee][Xx][Ee])?\
  \ \\S+?\\w:\\S+?:'\nselection_img:\n- Image|endswith: \\rundll32.exe\n- OriginalFileName:\
  \ RUNDLL32.EXE\n"
explanation: Detects execution of rundll32 where the DLL being called is stored in
  an Alternate Data Stream (ADS).
