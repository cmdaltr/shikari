technique_id: T1202
technique_name: Potentially Suspicious Office Document Executed From Trusted Location
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: f99abdf0-6283-4e71-bd2b-b5c048a94743
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_dotx:\n  CommandLine|endswith:\n  - .dotx\n\
  \  - .xltx\n  - .potx\nselection_img:\n- Image|endswith:\n  - \\EXCEL.EXE\n  - \\\
  POWERPNT.EXE\n  - \\WINWORD.exe\n- OriginalFileName:\n  - Excel.exe\n  - POWERPNT.EXE\n\
  \  - WinWord.exe\nselection_parent:\n  ParentImage|endswith:\n  - \\explorer.exe\n\
  \  - \\dopus.exe\nselection_trusted_location:\n  CommandLine|contains:\n  - \\AppData\\\
  Roaming\\Microsoft\\Templates\n  - \\AppData\\Roaming\\Microsoft\\Word\\Startup\\\
  \n  - \\Microsoft Office\\root\\Templates\\\n  - \\Microsoft Office\\Templates\\\
  \n"
explanation: Detects the execution of an Office application that points to a document
  that is located in a trusted location. Attackers often used this to avoid macro
  security and execute their malicious code.
false_positives:
- Unknown
references:
- Internal Research
- https://twitter.com/Max_Mal_/status/1633863678909874176
- https://techcommunity.microsoft.com/t5/microsoft-365-blog/new-security-hardening-policies-for-trusted-documents/ba-p/3023465
- https://twitter.com/_JohnHammond/status/1588155401752788994
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
    - \explorer.exe
    - \dopus.exe
  selection_img:
  - Image|endswith:
    - \EXCEL.EXE
    - \POWERPNT.EXE
    - \WINWORD.exe
  - OriginalFileName:
    - Excel.exe
    - POWERPNT.EXE
    - WinWord.exe
  selection_trusted_location:
    CommandLine|contains:
    - \AppData\Roaming\Microsoft\Templates
    - \AppData\Roaming\Microsoft\Word\Startup\
    - \Microsoft Office\root\Templates\
    - \Microsoft Office\Templates\
  filter_main_dotx:
    CommandLine|endswith:
    - .dotx
    - .xltx
    - .potx
  condition: all of selection_* and not 1 of filter_main_*
