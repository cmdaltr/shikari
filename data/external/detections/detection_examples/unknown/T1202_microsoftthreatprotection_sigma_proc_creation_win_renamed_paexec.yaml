technique_id: T1202
technique_name: Renamed PAExec Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.8
validated: true
source: sigma
sigma_id: c4e49831-1496-40cf-8ce1-b53f942b02f9
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_known_location:\n- Image|endswith: \\paexec.exe\n-\
  \ Image|startswith: C:\\Windows\\PAExec-\nselection:\n- Description: PAExec Application\n\
  - OriginalFileName: PAExec.exe\n- Product|contains: PAExec\n- Hashes|contains:\n\
  \  - IMPHASH=11D40A7B7876288F919AB819CC2D9802\n  - IMPHASH=6444f8a34e99b8f7d9647de66aabe516\n\
  \  - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f\n  - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c\n"
explanation: Detects execution of renamed version of PAExec. Often used by attackers
false_positives:
- Weird admins that rename their tools
- Software companies that bundle PAExec with their software and rename it, so that
  it is less embarrassing
- When executed with the "-s" flag. PAExec will copy itself to the "C:\Windows\" directory
  with a different name. Usually like this "PAExec-[XXXXX]-[ComputerName]"
references:
- https://www.poweradmin.com/paexec/
- https://summit.fireeye.com/content/dam/fireeye-www/summit/cds-2018/presentations/cds18-technical-s05-att&cking-fin7.pdf
tags:
- attack.defense-evasion
- attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Description: PAExec Application
  - OriginalFileName: PAExec.exe
  - Product|contains: PAExec
  - Hashes|contains:
    - IMPHASH=11D40A7B7876288F919AB819CC2D9802
    - IMPHASH=6444f8a34e99b8f7d9647de66aabe516
    - IMPHASH=dfd6aa3f7b2b1035b76b718f1ddc689f
    - IMPHASH=1a6cca4d5460b1710a12dea39e4a592c
  filter_main_known_location:
  - Image|endswith: \paexec.exe
  - Image|startswith: C:\Windows\PAExec-
  condition: selection and not 1 of filter_main_*
