technique_id: T1036
technique_name: Suspicious Calculator Usage
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 737e618a-a410-49b5-bec3-9e55ff7fbc15
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_1 or ( selection_2\
  \ and not filter_main_known_locations )\nfilter_main_known_locations:\n  Image|contains:\n\
  \  - :\\Windows\\System32\\\n  - :\\Windows\\SysWOW64\\\n  - :\\Windows\\WinSxS\\\
  \nselection_1:\n  CommandLine|contains: '\\calc.exe '\nselection_2:\n  Image|endswith:\
  \ \\calc.exe\n"
explanation: 'Detects suspicious use of ''calc.exe'' with command line parameters
  or in a suspicious directory, which is likely caused by some PoC or detection evasion.

  '
false_positives:
- Unknown
references:
- https://twitter.com/ItsReallyNick/status/1094080242686312448
tags:
- attack.defense-evasion
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  selection_1:
    CommandLine|contains: '\calc.exe '
  selection_2:
    Image|endswith: \calc.exe
  filter_main_known_locations:
    Image|contains:
    - :\Windows\System32\
    - :\Windows\SysWOW64\
    - :\Windows\WinSxS\
  condition: selection_1 or ( selection_2 and not filter_main_known_locations )
