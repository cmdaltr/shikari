technique_id: T1218
technique_name: Self Extracting Package Creation Via Iexpress.EXE From Potentially
  Suspicious Location
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: b2b048b0-7857-4380-b0fb-d3f0ab820b71
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains|windash: ' /n '\nselection_img:\n- Image|endswith:\
  \ \\iexpress.exe\n- OriginalFileName: IEXPRESS.exe\nselection_paths:\n  CommandLine|contains:\n\
  \  - :\\ProgramData\\\n  - :\\Temp\\\n  - :\\Windows\\System32\\Tasks\\\n  - :\\\
  Windows\\Tasks\\\n  - :\\Windows\\Temp\\\n  - \\AppData\\Local\\Temp\\\n"
explanation: 'Detects the use of iexpress.exe to create binaries via Self Extraction
  Directive (SED) files located in potentially suspicious locations.

  This behavior has been observed in-the-wild by different threat actors.

  '
false_positives:
- Administrators building packages using iexpress.exe
references:
- https://strontic.github.io/xcyclopedia/library/iexpress.exe-D594B2A33EFAFD0EABF09E3FDC05FCEA.html
- https://en.wikipedia.org/wiki/IExpress
- https://decoded.avast.io/janvojtesek/raspberry-robins-roshtyak-a-little-lesson-in-trickery/
- https://www.virustotal.com/gui/file/602f4ae507fa8de57ada079adff25a6c2a899bd25cd092d0af7e62cdb619c93c/behavior
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \iexpress.exe
  - OriginalFileName: IEXPRESS.exe
  selection_cli:
    CommandLine|contains|windash: ' /n '
  selection_paths:
    CommandLine|contains:
    - :\ProgramData\
    - :\Temp\
    - :\Windows\System32\Tasks\
    - :\Windows\Tasks\
    - :\Windows\Temp\
    - \AppData\Local\Temp\
  condition: all of selection_*
