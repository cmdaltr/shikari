technique_id: T1036.003
technique_name: LOL-Binary Copied From System Directory
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: f5d19838-41b5-476c-98d8-ba8af4929ee2
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_tools_*\
  \ and all of selection_target_*\nselection_target_lolbin:\n  CommandLine|contains:\n\
  \  - \\bitsadmin.exe\n  - \\calc.exe\n  - \\certutil.exe\n  - \\cmdl32.exe\n  -\
  \ \\cscript.exe\n  - \\mshta.exe\n  - \\rundll32.exe\n  - \\wscript.exe\nselection_target_path:\n\
  \  CommandLine|contains:\n  - \\System32\n  - \\SysWOW64\n  - \\WinSxS\nselection_tools_cmd:\n\
  \  CommandLine|contains: 'copy '\n  Image|endswith: \\cmd.exe\nselection_tools_other:\n\
  - Image|endswith:\n  - \\robocopy.exe\n  - \\xcopy.exe\n- OriginalFileName:\n  -\
  \ robocopy.exe\n  - XCOPY.EXE\nselection_tools_pwsh:\n  CommandLine|contains:\n\
  \  - copy-item\n  - ' copy '\n  - 'cpi '\n  - ' cp '\n  Image|endswith:\n  - \\\
  powershell.exe\n  - \\pwsh.exe\n"
explanation: 'Detects a suspicious copy operation that tries to copy a known LOLBIN
  from system (System32, SysWOW64, WinSxS) directories to another on disk in order
  to bypass detections based on locations.

  '
false_positives:
- Unknown
references:
- https://www.hybrid-analysis.com/sample/8da5b75b6380a41eee3a399c43dfe0d99eeefaa1fd21027a07b1ecaa4cd96fdd?environmentId=120
- https://web.archive.org/web/20180331144337/https://www.fireeye.com/blog/threat-research/2018/03/sanny-malware-delivery-method-updated-in-recently-observed-attacks.html
- https://thedfirreport.com/2023/08/28/html-smuggling-leads-to-domain-wide-ransomware/
tags:
- attack.defense-evasion
- attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_tools_cmd:
    Image|endswith: \cmd.exe
    CommandLine|contains: 'copy '
  selection_tools_pwsh:
    Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    CommandLine|contains:
    - copy-item
    - ' copy '
    - 'cpi '
    - ' cp '
  selection_tools_other:
  - Image|endswith:
    - \robocopy.exe
    - \xcopy.exe
  - OriginalFileName:
    - robocopy.exe
    - XCOPY.EXE
  selection_target_path:
    CommandLine|contains:
    - \System32
    - \SysWOW64
    - \WinSxS
  selection_target_lolbin:
    CommandLine|contains:
    - \bitsadmin.exe
    - \calc.exe
    - \certutil.exe
    - \cmdl32.exe
    - \cscript.exe
    - \mshta.exe
    - \rundll32.exe
    - \wscript.exe
  condition: 1 of selection_tools_* and all of selection_target_*
