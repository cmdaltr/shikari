query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cli:\n\
  - CommandLine|contains|all:\n  - ' user:'\n  - ' binary:'\n- CommandLine|contains|all:\n\
  \  - ' user:'\n  - ' shellcode:'\n- CommandLine|contains:\n  - ' technique:CreateProcessAsUserW'\n\
  \  - ' technique:ImpersonateLoggedOnuser'\nselection_img:\n- Image|endswith: \\\
  SharpImpersonation.exe\n- OriginalFileName: SharpImpersonation.exe\n"
explanation: Detects execution of the SharpImpersonation tool. Which can be used to
  manipulate tokens on a Windows computers remotely (PsExec/WmiExec) or interactively
false_positives:
- Unknown
