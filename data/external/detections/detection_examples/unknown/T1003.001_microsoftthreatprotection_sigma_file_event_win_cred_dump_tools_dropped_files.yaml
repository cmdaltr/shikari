query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - TargetFilename|contains:\n  - \\fgdump-log\n  - \\kirbi\n  - \\pwdump\n  - \\\
  pwhashes\n  - \\wce_ccache\n  - \\wce_krbtkts\n- TargetFilename|endswith:\n  - \\\
  cachedump.exe\n  - \\cachedump64.exe\n  - \\DumpExt.dll\n  - \\DumpSvc.exe\n  -\
  \ \\Dumpy.exe\n  - \\fgexec.exe\n  - \\lsremora.dll\n  - \\lsremora64.dll\n  - \\\
  NTDS.out\n  - \\procdump64.exe\n  - \\pstgdump.exe\n  - \\pwdump.exe\n  - \\SAM.out\n\
  \  - \\SECURITY.out\n  - \\servpw.exe\n  - \\servpw64.exe\n  - \\SYSTEM.out\n  -\
  \ \\test.pwd\n  - \\wceaux.dll\n"
explanation: Files with well-known filenames (parts of credential dump software or
  files produced by them) creation
