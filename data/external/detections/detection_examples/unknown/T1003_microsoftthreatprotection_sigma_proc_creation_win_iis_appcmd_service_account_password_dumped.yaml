technique_id: T1003
technique_name: Microsoft IIS Service Account Password Dumped
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_base_*\
  \ and (selection_standalone or all of selection_cmd_*)\nselection_base_list:\n \
  \ CommandLine|contains: 'list '\nselection_base_name:\n- Image|endswith: \\appcmd.exe\n\
  - OriginalFileName: appcmd.exe\nselection_cmd_flags:\n  CommandLine|contains:\n\
  \  - ' /@t'\n  - ' /text'\n  - ' /show'\n  - ' -@t'\n  - ' -text'\n  - ' -show'\n\
  selection_cmd_grep:\n  CommandLine|contains:\n  - :\\*\n  - password\nselection_standalone:\n\
  \  CommandLine|contains:\n  - ' /config'\n  - ' /xml'\n  - ' -config'\n  - ' -xml'\n"
explanation: Detects the Internet Information Services (IIS) command-line tool, AppCmd,
  being used to list passwords
false_positives:
- Unknown
references:
- https://www.elastic.co/guide/en/security/current/microsoft-iis-service-account-password-dumped.html
- https://twitter.com/0gtweet/status/1588815661085917186?cxt=HHwWhIDUyaDbzYwsAAAA
- https://www.netspi.com/blog/technical/network-penetration-testing/decrypting-iis-passwords-to-break-out-of-the-dmz-part-2/
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection_base_name:
  - Image|endswith: \appcmd.exe
  - OriginalFileName: appcmd.exe
  selection_base_list:
    CommandLine|contains: 'list '
  selection_standalone:
    CommandLine|contains:
    - ' /config'
    - ' /xml'
    - ' -config'
    - ' -xml'
  selection_cmd_flags:
    CommandLine|contains:
    - ' /@t'
    - ' /text'
    - ' /show'
    - ' -@t'
    - ' -text'
    - ' -show'
  selection_cmd_grep:
    CommandLine|contains:
    - :\*
    - password
  condition: all of selection_base_* and (selection_standalone or all of selection_cmd_*)
metadata:
