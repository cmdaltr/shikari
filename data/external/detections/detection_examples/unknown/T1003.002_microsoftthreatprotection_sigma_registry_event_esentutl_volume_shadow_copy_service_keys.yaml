source: sigma
sigma_id: 5aad0995-46ab-41bd-a9ff-724f41114971
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  TargetObject|contains: System\\CurrentControlSet\\Services\\VSS\\Start\n\
  selection:\n  Image|endswith: esentutl.exe\n  TargetObject|contains: System\\CurrentControlSet\\\
  Services\\VSS\n"
explanation: Detects the volume shadow copy service initialization and processing
  via esentutl. Registry keys such as HKLM\\System\\CurrentControlSet\\Services\\VSS\\Diag\\VolSnap\\Volume
  are captured.
