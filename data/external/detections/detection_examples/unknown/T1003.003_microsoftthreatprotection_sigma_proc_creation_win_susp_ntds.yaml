technique_id: T1003.003
technique_name: Suspicious Process Patterns NTDS.DIT Exfil
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.92
validated: true
source: sigma
sigma_id: 8bc64091-6875-4881-aaf9-7bd25b5dda08
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection* or all\
  \ of set1*\nselection_oneliner_1:\n  CommandLine|contains|all:\n  - ac i ntds\n\
  \  - create full\nselection_onliner_2:\n  CommandLine|contains|all:\n  - '/c copy\
  \ '\n  - \\windows\\ntds\\ntds.dit\nselection_onliner_3:\n  CommandLine|contains|all:\n\
  \  - activate instance ntds\n  - create full\nselection_powershell:\n  CommandLine|contains|all:\n\
  \  - powershell\n  - ntds.dit\nselection_tool:\n- Image|endswith:\n  - \\NTDSDump.exe\n\
  \  - \\NTDSDumpEx.exe\n- CommandLine|contains|all:\n  - ntds.dit\n  - system.hiv\n\
  - CommandLine|contains: NTDSgrab.ps1\nset1_selection_image_folder:\n- ParentImage|contains:\n\
  \  - \\apache\n  - \\tomcat\n  - \\AppData\\\n  - \\Temp\\\n  - \\Public\\\n  -\
  \ \\PerfLogs\\\n- Image|contains:\n  - \\apache\n  - \\tomcat\n  - \\AppData\\\n\
  \  - \\Temp\\\n  - \\Public\\\n  - \\PerfLogs\\\nset1_selection_ntds_dit:\n  CommandLine|contains:\
  \ ntds.dit\n"
explanation: Detects suspicious process patterns used in NTDS.DIT exfiltration
false_positives:
- Unknown
references:
- https://www.ired.team/offensive-security/credential-access-and-credential-dumping/ntds.dit-enumeration
- https://www.n00py.io/2022/03/manipulating-user-passwords-without-mimikatz/
- https://pentestlab.blog/tag/ntds-dit/
- https://github.com/samratashok/nishang/blob/414ee1104526d7057f9adaeee196d91ae447283e/Gather/Copy-VSS.ps1
- https://github.com/zcgonvh/NTDSDumpEx
- https://github.com/rapid7/metasploit-framework/blob/d297adcebb5c1df6fe30b12ca79b161deb71571c/data/post/powershell/NTDSgrab.ps1
- https://blog.talosintelligence.com/2022/08/recent-cyber-attack.html?m=1
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_tool:
  - Image|endswith:
    - \NTDSDump.exe
    - \NTDSDumpEx.exe
  - CommandLine|contains|all:
    - ntds.dit
    - system.hiv
  - CommandLine|contains: NTDSgrab.ps1
  selection_oneliner_1:
    CommandLine|contains|all:
    - ac i ntds
    - create full
  selection_onliner_2:
    CommandLine|contains|all:
    - '/c copy '
    - \windows\ntds\ntds.dit
  selection_onliner_3:
    CommandLine|contains|all:
    - activate instance ntds
    - create full
  selection_powershell:
    CommandLine|contains|all:
    - powershell
    - ntds.dit
  set1_selection_ntds_dit:
    CommandLine|contains: ntds.dit
  set1_selection_image_folder:
  - ParentImage|contains:
    - \apache
    - \tomcat
    - \AppData\
    - \Temp\
    - \Public\
    - \PerfLogs\
  - Image|contains:
    - \apache
    - \tomcat
    - \AppData\
    - \Temp\
    - \Public\
    - \PerfLogs\
  condition: 1 of selection* or all of set1*
