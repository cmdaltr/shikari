query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - ParentImage|endswith:\n  - .doc.lnk\n  - .docx.lnk\n  - .xls.lnk\n  - .xlsx.lnk\n\
  \  - .ppt.lnk\n  - .pptx.lnk\n  - .rtf.lnk\n  - .pdf.lnk\n  - .txt.lnk\n  - .doc.js\n\
  \  - .docx.js\n  - .xls.js\n  - .xlsx.js\n  - .ppt.js\n  - .pptx.js\n  - .rtf.js\n\
  \  - .pdf.js\n  - .txt.js\n- ParentCommandLine|contains:\n  - .doc.lnk\n  - .docx.lnk\n\
  \  - .xls.lnk\n  - .xlsx.lnk\n  - .ppt.lnk\n  - .pptx.lnk\n  - .rtf.lnk\n  - .pdf.lnk\n\
  \  - .txt.lnk\n  - .doc.js\n  - .docx.js\n  - .xls.js\n  - .xlsx.js\n  - .ppt.js\n\
  \  - .pptx.js\n  - .rtf.js\n  - .pdf.js\n  - .txt.js\n"
