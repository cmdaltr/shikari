technique_id: T1218
technique_name: Suspicious AgentExecutor PowerShell Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: c0b40568-b1e9-4b03-8d6c-b096da6da9ab
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_* and\
  \ not 1 of filter_main_*\nfilter_main_intune:\n  ParentImage|endswith: \\Microsoft.Management.Services.IntuneWindowsAgent.exe\n\
  filter_main_pwsh:\n  CommandLine|contains:\n  - C:\\Windows\\System32\\WindowsPowerShell\\\
  v1.0\\\n  - C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\\nselection_cli:\n \
  \ CommandLine|contains:\n  - ' -powershell'\n  - ' -remediationScript'\nselection_img:\n\
  - Image|endswith: \\AgentExecutor.exe\n- OriginalFileName: AgentExecutor.exe\n"
explanation: Detects execution of the AgentExecutor.exe binary. Which can be abused
  as a LOLBIN to execute powershell scripts with the ExecutionPolicy "Bypass" or any
  binary named "powershell.exe" located in the path provided by 6th positional argument
false_positives:
- Unknown
references:
- https://twitter.com/lefterispan/status/1286259016436514816
- https://lolbas-project.github.io/lolbas/OtherMSBinaries/Agentexecutor/
- https://learn.microsoft.com/en-us/mem/intune/apps/intune-management-extension
- https://twitter.com/jseerden/status/1247985304667066373/photo/1
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \AgentExecutor.exe
  - OriginalFileName: AgentExecutor.exe
  selection_cli:
    CommandLine|contains:
    - ' -powershell'
    - ' -remediationScript'
  filter_main_pwsh:
    CommandLine|contains:
    - C:\Windows\System32\WindowsPowerShell\v1.0\
    - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\
  filter_main_intune:
    ParentImage|endswith: \Microsoft.Management.Services.IntuneWindowsAgent.exe
  condition: all of selection_* and not 1 of filter_main_*
