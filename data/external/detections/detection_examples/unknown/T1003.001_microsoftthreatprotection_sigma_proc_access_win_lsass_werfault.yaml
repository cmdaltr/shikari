technique_id: T1003.001
technique_name: Credential Dumping Attempt Via WerFault
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.81
validated: true
source: sigma
sigma_id: e5b33f7d-eb93-48b6-9851-09e1e610b6d7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  GrantedAccess: '0x1FFFFF'\n  SourceImage|endswith: \\WerFault.exe\n  TargetImage|endswith:\
  \ \\lsass.exe\n"
explanation: Detects process LSASS memory dump using Mimikatz, NanoDump, Invoke-Mimikatz,
  Procdump or Taskmgr based on the CallTrace pointing to ntdll.dll, dbghelp.dll or
  dbgcore.dll for win10, server2016 and up.
false_positives:
- Actual failures in lsass.exe that trigger a crash dump (unlikely)
- Unknown cases in which WerFault accesses lsass.exe
references:
- https://github.com/helpsystems/nanodump/commit/578116faea3d278d53d70ea932e2bbfe42569507
tags:
- attack.credential-access
- attack.t1003.001
- attack.s0002
logsource:
  category: process_access
  product: windows
detection:
  selection:
    SourceImage|endswith: \WerFault.exe
    TargetImage|endswith: \lsass.exe
    GrantedAccess: '0x1FFFFF'
  condition: selection
