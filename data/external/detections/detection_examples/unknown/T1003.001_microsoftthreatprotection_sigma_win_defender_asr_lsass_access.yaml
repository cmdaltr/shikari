technique_id: T1003.001
technique_name: LSASS Access Detected via Attack Surface Reduction
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.87
validated: true
source: sigma
sigma_id: a0a278fe-2c0e-4de2-ac3c-c68b08a9ba98
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_*\nfilter_begins:\n  ProcessName|startswith:\n  - C:\\Windows\\System32\\\
  DriverStore\\\n  - C:\\WINDOWS\\Installer\\\n  - C:\\Program Files\\\n  - C:\\Program\
  \ Files (x86)\\\nfilter_exact:\n  ProcessName:\n  - C:\\Windows\\System32\\atiesrxx.exe\n\
  \  - C:\\Windows\\System32\\CompatTelRunner.exe\n  - C:\\Windows\\System32\\msiexec.exe\n\
  \  - C:\\Windows\\System32\\nvwmi64.exe\n  - C:\\Windows\\System32\\svchost.exe\n\
  \  - C:\\Windows\\System32\\Taskmgr.exe\n  - C:\\Windows\\System32\\wbem\\WmiPrvSE.exe\n\
  \  - C:\\Windows\\SysWOW64\\msiexec.exe\nfilter_thor:\n  ProcessName|endswith:\n\
  \  - \\thor64.exe\n  - \\thor.exe\n  ProcessName|startswith: C:\\Windows\\Temp\\\
  asgard2-agent\\\nselection:\n  EventID: 1121\n  Path|endswith: \\lsass.exe\n"
explanation: Detects Access to LSASS Process
false_positives:
- Google Chrome GoogleUpdate.exe
- Some Taskmgr.exe related activity
references:
- https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  service: windefend
  definition: 'Requirements:Enabled Block credential stealing from the Windows local
    security authority subsystem (lsass.exe) from Attack Surface Reduction (GUID:
    9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2)'
detection:
  selection:
    EventID: 1121
    Path|endswith: \lsass.exe
  filter_thor:
    ProcessName|startswith: C:\Windows\Temp\asgard2-agent\
    ProcessName|endswith:
    - \thor64.exe
    - \thor.exe
  filter_exact:
    ProcessName:
    - C:\Windows\System32\atiesrxx.exe
    - C:\Windows\System32\CompatTelRunner.exe
    - C:\Windows\System32\msiexec.exe
    - C:\Windows\System32\nvwmi64.exe
    - C:\Windows\System32\svchost.exe
    - C:\Windows\System32\Taskmgr.exe
    - C:\Windows\System32\wbem\WmiPrvSE.exe
    - C:\Windows\SysWOW64\msiexec.exe
  filter_begins:
    ProcessName|startswith:
    - C:\Windows\System32\DriverStore\
    - C:\WINDOWS\Installer\
    - C:\Program Files\
    - C:\Program Files (x86)\
  condition: selection and not 1 of filter_*
