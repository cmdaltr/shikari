query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  PipeName|contains:\n  - \\imposecost\n  - \\imposingcost\n"
explanation: Detects creation of default named pipes used by the Koh tool
false_positives:
- Unlikely
references:
- https://github.com/GhostPack/Koh/blob/0283d9f3f91cf74732ad377821986cfcb088e20a/Clients/BOF/KohClient.c#L12
