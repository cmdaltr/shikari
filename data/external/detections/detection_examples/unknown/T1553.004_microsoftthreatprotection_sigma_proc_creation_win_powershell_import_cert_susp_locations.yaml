technique_id: T1553.004
technique_name: Root Certificate Installed From Susp Locations
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 5f6a601c-2ecb-498b-9c33-660362323afa
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains:\n  - \\AppData\\Local\\Temp\\\n  - :\\Windows\\TEMP\\\n\
  \  - \\Desktop\\\n  - \\Downloads\\\n  - \\Perflogs\\\n  - :\\Users\\Public\\\n\
  \  CommandLine|contains|all:\n  - Import-Certificate\n  - ' -FilePath '\n  - Cert:\\\
  LocalMachine\\Root\n"
explanation: Adversaries may install a root certificate on a compromised system to
  avoid warnings when connecting to adversary controlled web servers.
false_positives:
- Unlikely
references:
- https://www.microsoft.com/security/blog/2022/09/07/profiling-dev-0270-phosphorus-ransomware-operations/
- https://learn.microsoft.com/en-us/powershell/module/pki/import-certificate?view=windowsserver2022-ps
tags:
- attack.defense-evasion
- attack.t1553.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - Import-Certificate
    - ' -FilePath '
    - Cert:\LocalMachine\Root
    CommandLine|contains:
    - \AppData\Local\Temp\
    - :\Windows\TEMP\
    - \Desktop\
    - \Downloads\
    - \Perflogs\
    - :\Users\Public\
  condition: selection
