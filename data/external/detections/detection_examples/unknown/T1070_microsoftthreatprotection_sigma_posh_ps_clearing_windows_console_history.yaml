technique_id: T1070
technique_name: Clearing Windows Console History
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: bde47d4b-9987-405c-94c7-b080410e8ea7
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection1 or selection2a\
  \ and selection2b\nselection1:\n  ScriptBlockText|contains: Clear-History\nselection2a:\n\
  \  ScriptBlockText|contains:\n  - Remove-Item\n  - rm\nselection2b:\n  ScriptBlockText|contains:\n\
  \  - ConsoleHost_history.txt\n  - (Get-PSReadlineOption).HistorySavePath\n"
explanation: Identifies when a user attempts to clear console history. An adversary
  may clear the command history of a compromised account to conceal the actions undertaken
  during an intrusion.
false_positives:
- Unknown
references:
- https://stefanos.cloud/blog/kb/how-to-clear-the-powershell-command-history/
- https://www.shellhacks.com/clear-history-powershell/
- https://community.sophos.com/sophos-labs/b/blog/posts/powershell-command-history-forensics
tags:
- attack.defense-evasion
- attack.t1070
- attack.t1070.003
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection1:
    ScriptBlockText|contains: Clear-History
  selection2a:
    ScriptBlockText|contains:
    - Remove-Item
    - rm
  selection2b:
    ScriptBlockText|contains:
    - ConsoleHost_history.txt
    - (Get-PSReadlineOption).HistorySavePath
  condition: selection1 or selection2a and selection2b
