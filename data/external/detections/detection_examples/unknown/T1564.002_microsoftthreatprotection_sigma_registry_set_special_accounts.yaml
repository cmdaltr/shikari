technique_id: T1564.002
technique_name: Hiding User Account Via SpecialAccounts Registry Key
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: f8aebc67-a56d-4ec9-9fbe-7b0e8b7b4efd
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000000)\n  TargetObject|contains: \\SOFTWARE\\Microsoft\\\
  Windows NT\\CurrentVersion\\Winlogon\\SpecialAccounts\\UserList\n"
explanation: Detects modifications to the registry key "HKLM\Software\Microsoft\Windows
  NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist" where the value is set to "0"
  in order to hide user account from being listed on the logon screen.
