technique_id: T1218.011
technique_name: Potential PowerShell Execution Via DLL
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 6812a10b-60ea-420c-832f-dfcc33b646ba
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - Default.GetString\n  - DownloadString\n\
  \  - FromBase64String\n  - 'ICM '\n  - 'IEX '\n  - Invoke-Command\n  - Invoke-Expression\n\
  selection_img:\n- Image|endswith:\n  - \\InstallUtil.exe\n  - \\RegAsm.exe\n  -\
  \ \\RegSvcs.exe\n  - \\regsvr32.exe\n  - \\rundll32.exe\n- OriginalFileName:\n \
  \ - InstallUtil.exe\n  - RegAsm.exe\n  - RegSvcs.exe\n  - REGSVR32.EXE\n  - RUNDLL32.EXE\n"
explanation: 'Detects potential PowerShell execution from a DLL instead of the usual
  PowerShell process as seen used in PowerShdll.

  This detection assumes that PowerShell commands are passed via the CommandLine.

  '
false_positives:
- Unknown
references:
- https://github.com/p3nt4/PowerShdll/blob/62cfa172fb4e1f7f4ac00ca942685baeb88ff356/README.md
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \InstallUtil.exe
    - \RegAsm.exe
    - \RegSvcs.exe
    - \regsvr32.exe
    - \rundll32.exe
  - OriginalFileName:
    - InstallUtil.exe
    - RegAsm.exe
    - RegSvcs.exe
    - REGSVR32.EXE
    - RUNDLL32.EXE
  selection_cli:
    CommandLine|contains:
    - Default.GetString
    - DownloadString
    - FromBase64String
    - 'ICM '
    - 'IEX '
    - Invoke-Command
    - Invoke-Expression
  condition: all of selection_*
