technique_id: T1218
technique_name: Suspicious Provlaunch.EXE Child Process
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: f9999590-1f94-4a34-a91e-951e47bedefd
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_child:\n- Image|endswith:\n  - \\calc.exe\n  - \\cmd.exe\n  - \\cscript.exe\n\
  \  - \\mshta.exe\n  - \\notepad.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n  - \\\
  regsvr32.exe\n  - \\rundll32.exe\n  - \\wscript.exe\n- Image|contains:\n  - :\\\
  PerfLogs\\\n  - :\\Temp\\\n  - :\\Users\\Public\\\n  - \\AppData\\Temp\\\n  - \\\
  Windows\\System32\\Tasks\\\n  - \\Windows\\Tasks\\\n  - \\Windows\\Temp\\\nselection_parent:\n\
  \  ParentImage|endswith: \\provlaunch.exe\n"
explanation: Detects suspicious child processes of "provlaunch.exe" which might indicate
  potential abuse to proxy execution.
false_positives:
- Unknown
references:
- https://lolbas-project.github.io/lolbas/Binaries/Provlaunch/
