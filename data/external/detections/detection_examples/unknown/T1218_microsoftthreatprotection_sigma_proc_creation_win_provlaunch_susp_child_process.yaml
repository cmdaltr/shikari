logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: \provlaunch.exe
  selection_child:
  - Image|endswith:
    - \calc.exe
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \notepad.exe
    - \powershell.exe
    - \pwsh.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \wscript.exe
  - Image|contains:
    - :\PerfLogs\
    - :\Temp\
    - :\Users\Public\
    - \AppData\Temp\
    - \Windows\System32\Tasks\
    - \Windows\Tasks\
    - \Windows\Temp\
  condition: all of selection_*
