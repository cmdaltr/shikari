technique_id: T1027.001
technique_name: Binary Padding - MacOS
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 95361ce5-c891-4b0a-87ca-e24607884a96
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_dd:\n\
  \  CommandLine|contains:\n  - if=/dev/zero\n  - if=/dev/random\n  - if=/dev/urandom\n\
  \  Image|endswith: /dd\nselection_truncate:\n  CommandLine|contains: -s +\n  Image|endswith:\
  \ /truncate\n"
explanation: Adversaries may use binary padding to add junk data and change the on-disk
  representation of malware. This rule detect using dd and truncate to add a junk
  data to file.
false_positives:
- Legitimate script work
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1027.001/T1027.001.md
- https://linux.die.net/man/1/truncate
- https://linux.die.net/man/1/dd
tags:
- attack.defense-evasion
- attack.t1027.001
logsource:
  product: macos
  category: process_creation
detection:
  selection_truncate:
    Image|endswith: /truncate
    CommandLine|contains: -s +
  selection_dd:
    Image|endswith: /dd
    CommandLine|contains:
    - if=/dev/zero
    - if=/dev/random
    - if=/dev/urandom
  condition: 1 of selection_*
