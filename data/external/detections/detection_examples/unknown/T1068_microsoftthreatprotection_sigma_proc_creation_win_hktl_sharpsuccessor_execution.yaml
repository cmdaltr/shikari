technique_id: T1068
technique_name: HKTL - SharpSuccessor Privilege Escalation Tool Execution
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 38a1ac5f-9c74-47d2-a345-dd6f5eb4e7c8
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - Image|endswith: \\SharpSuccessor.exe\n- OriginalFileName: SharpSuccessor.exe\n\
  - CommandLine|contains: SharpSuccessor\n- CommandLine|contains|all:\n  - ' add '\n\
  \  - ' /impersonate'\n  - ' /path'\n  - ' /account'\n  - ' /name'\n"
explanation: 'Detects the execution of SharpSuccessor, a tool used to exploit the
  BadSuccessor attack for privilege escalation in WinServer 2025 Active Directory
  environments.

  Successful usage of this tool can let the attackers gain the domain admin privileges
  by exploiting the BadSuccessor vulnerability.

  '
false_positives:
- Unknown
references:
- https://github.com/logangoins/SharpSuccessor
tags:
- attack.privilege-escalation
- attack.t1068
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - Image|endswith: \SharpSuccessor.exe
  - OriginalFileName: SharpSuccessor.exe
  - CommandLine|contains: SharpSuccessor
  - CommandLine|contains|all:
    - ' add '
    - ' /impersonate'
    - ' /path'
    - ' /account'
    - ' /name'
  condition: selection
