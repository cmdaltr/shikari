query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_ext:\n\
  \  Filename|endswith:\n  - .asax\n  - .ashx\n  - .asmx\n  - .asp\n  - .aspx\n  -\
  \ .bat\n  - .cfm\n  - .cgi\n  - .chm\n  - .cmd\n  - .dat\n  - .ear\n  - .gif\n \
  \ - .hta\n  - .jpeg\n  - .jpg\n  - .jsp\n  - .jspx\n  - .lnk\n  - .msc\n  - .php\n\
  \  - .pl\n  - .png\n  - .ps1\n  - .psm1\n  - .py\n  - .pyc\n  - .rb\n  - .scf\n\
  \  - .sct\n  - .sh\n  - .svg\n  - .txt\n  - .vbe\n  - .vbs\n  - .war\n  - .wll\n\
  \  - .wsf\n  - .wsh\n  - .xll\n  - .xml\nselection_path:\n  Filename|contains:\n\
  \  - :\\PerfLogs\\\n  - :\\Temp\\\n  - :\\Users\\Default\\\n  - :\\Users\\Public\\\
  \n  - :\\Windows\\\n  - /www/\n  - \\inetpub\\\n  - \\tsclient\\\n  - apache\n \
  \ - nginx\n  - tomcat\n  - weblogic\n"
explanation: 'Detects an Antivirus alert in a highly relevant file path or with a
  relevant file name.

  This event must not be ignored just because the AV has blocked the malware but investigate,
  how it came there in the first place.

  '
false_positives:
