query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - Image|endswith: \\Inveigh.exe\n- OriginalFileName:\n  - \\Inveigh.exe\n  - \\\
  Inveigh.dll\n- Description: Inveigh\n- CommandLine|contains:\n  - ' -SpooferIP'\n\
  \  - ' -ReplyToIPs '\n  - ' -ReplyToDomains '\n  - ' -ReplyToMACs '\n  - ' -SnifferIP'\n"
explanation: Detects the use of Inveigh a cross-platform .NET IPv4/IPv6 machine-in-the-middle
  tool
false_positives:
- Very unlikely
