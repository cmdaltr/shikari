technique_id: T1003.001
technique_name: Potential Windows Defender AV Bypass Via Dump64.EXE Rename
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 129966c9-de17-4334-a123-8b58172e664d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_dump and 1\
  \ of selection_tools_*\nselection_dump:\n  Image|contains: \\Microsoft Visual Studio\\\
  \n  Image|endswith: \\dump64.exe\n  Image|startswith: :\\Program Files\nselection_tools_procdump:\n\
  - OriginalFileName: procdump\n- CommandLine|contains:\n  - ' -ma '\n  - ' -mp '\n"
explanation: 'Detects when a user is potentially trying to bypass the Windows Defender
  AV by renaming a tool to dump64.exe and placing it in the Visual Studio folder.

  Currently the rule is covering only usage of procdump but other utilities can be
  added in order to increase coverage.

  '
false_positives:
- Unknown
references:
- https://twitter.com/mrd0x/status/1460597833917251595
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_dump:
    Image|startswith: :\Program Files
    Image|contains: \Microsoft Visual Studio\
    Image|endswith: \dump64.exe
  selection_tools_procdump:
  - OriginalFileName: procdump
  - CommandLine|contains:
    - ' -ma '
    - ' -mp '
  condition: selection_dump and 1 of selection_tools_*
