technique_id: T1003.001
technique_name: Lsass Full Dump Request Via DumpType Registry Settings
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  Details: DWORD (0x00000002)\n  TargetObject|contains:\n  - \\SOFTWARE\\Microsoft\\\
  Windows\\Windows Error Reporting\\LocalDumps\\DumpType\n  - \\SOFTWARE\\Microsoft\\\
  Windows\\Windows Error Reporting\\LocalDumps\\lsass.exe\\DumpType\n"
explanation: Detects the setting of the "DumpType" registry value to "2" which stands
  for a "Full Dump". Technique such as LSASS Shtinkering requires this value to be
  "2" in order to dump LSASS.
false_positives:
- Legitimate application that needs to do a full dump of their process
references:
- https://github.com/deepinstinct/Lsass-Shtinkering
- https://learn.microsoft.com/en-us/windows/win32/wer/collecting-user-mode-dumps
- https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - \SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\DumpType
    - \SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\lsass.exe\DumpType
    Details: DWORD (0x00000002)
  condition: selection
