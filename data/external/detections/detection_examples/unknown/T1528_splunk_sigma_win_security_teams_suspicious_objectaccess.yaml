query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not filter\n\
  filter:\n  ProcessName|contains: \\Microsoft\\Teams\\current\\Teams.exe\nselection:\n\
  \  EventID: 4663\n  ObjectName|contains:\n  - \\Microsoft\\Teams\\Cookies\n  - \\\
  Microsoft\\Teams\\Local Storage\\leveldb\n"
explanation: Detects an access to authentication tokens and accounts of Microsoft
  Teams desktop application.
