technique_id: T1003.001
technique_name: LSASS Dump Keyword In CommandLine
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: ffa6861c-4461-4f59-8a41-578c39f3f23e
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  - CommandLine|contains:\n  - lsass.dmp\n  - lsass.zip\n  - lsass.rar\n  - Andrew.dmp\n\
  \  - Coredump.dmp\n  - NotLSASS.zip\n  - lsass_2\n  - lsassdump\n  - lsassdmp\n\
  - CommandLine|contains|all:\n  - lsass\n  - .dmp\n- CommandLine|contains|all:\n\
  \  - SQLDmpr\n  - .mdmp\n- CommandLine|contains|all:\n  - nanodump\n  - .dmp\n"
explanation: 'Detects the presence of the keywords "lsass" and ".dmp" in the commandline,
  which could indicate a potential attempt to dump or create a dump of the lsass process.

  '
false_positives:
- Unlikely
references:
- https://github.com/Hackndo/lsassy
- https://medium.com/@markmotig/some-ways-to-dump-lsass-exe-c4a75fdc49bf
- https://github.com/elastic/detection-rules/blob/c76a39796972ecde44cb1da6df47f1b6562c9770/rules/windows/credential_access_lsass_memdump_file_created.toml
- https://www.whiteoaksecurity.com/blog/attacks-defenses-dumping-lsass-no-mimikatz/
- https://github.com/helpsystems/nanodump
- https://github.com/CCob/MirrorDump
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
  - CommandLine|contains:
    - lsass.dmp
    - lsass.zip
    - lsass.rar
    - Andrew.dmp
    - Coredump.dmp
    - NotLSASS.zip
    - lsass_2
    - lsassdump
    - lsassdmp
  - CommandLine|contains|all:
    - lsass
    - .dmp
  - CommandLine|contains|all:
    - SQLDmpr
    - .mdmp
  - CommandLine|contains|all:
    - nanodump
    - .dmp
  condition: selection
