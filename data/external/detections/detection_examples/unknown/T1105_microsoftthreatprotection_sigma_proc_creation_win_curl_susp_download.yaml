technique_id: T1105
technique_name: Suspicious Curl.EXE Download
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: e218595b-bbe7-4ee5-8a96-f32a24ad3468
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_curl and 1\
  \ of selection_susp_* and not 1 of filter_optional_*\nfilter_optional_git_windows:\n\
  \  CommandLine|contains|all:\n  - '--silent --show-error --output '\n  - gfw-httpget-\n\
  \  - AppData\n  Image: C:\\Program Files\\Git\\mingw64\\bin\\curl.exe\n  ParentImage:\
  \ C:\\Program Files\\Git\\usr\\bin\\sh.exe\nselection_curl:\n- Image|endswith: \\\
  curl.exe\n- Product: The curl executable\nselection_susp_extensions:\n  CommandLine|endswith:\n\
  \  - .dll\n  - .gif\n  - .jpeg\n  - .jpg\n  - .png\n  - .temp\n  - .tmp\n  - .txt\n\
  \  - .vbe\n  - .vbs\nselection_susp_locations:\n  CommandLine|contains:\n  - '%AppData%'\n\
  \  - '%Public%'\n  - '%Temp%'\n  - '%tmp%'\n  - \\AppData\\\n  - \\Desktop\\\n \
  \ - \\Temp\\\n  - \\Users\\Public\\\n  - C:\\PerfLogs\\\n  - C:\\ProgramData\\\n\
  \  - C:\\Windows\\Temp\\\n"
explanation: Detects a suspicious curl process start on Windows and outputs the requested
  document to a local file
false_positives:
- Unknown
references:
- https://twitter.com/max_mal_/status/1542461200797163522
- https://web.archive.org/web/20200128160046/https://twitter.com/reegun21/status/1222093798009790464
- https://github.com/pr0xylife/Qakbot/blob/4f0795d79dabee5bc9dd69f17a626b48852e7869/Qakbot_AA_23.06.2022.txt
- https://www.volexity.com/blog/2022/07/28/sharptongue-deploys-clever-mail-stealing-browser-extension-sharpext/
- https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1105/T1105.md#atomic-test-18---curl-download-file
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_curl:
  - Image|endswith: \curl.exe
  - Product: The curl executable
  selection_susp_locations:
    CommandLine|contains:
    - '%AppData%'
    - '%Public%'
    - '%Temp%'
    - '%tmp%'
    - \AppData\
    - \Desktop\
    - \Temp\
    - \Users\Public\
    - C:\PerfLogs\
    - C:\ProgramData\
    - C:\Windows\Temp\
  selection_susp_extensions:
    CommandLine|endswith:
    - .dll
    - .gif
    - .jpeg
    - .jpg
    - .png
    - .temp
    - .tmp
    - .txt
    - .vbe
    - .vbs
  filter_optional_git_windows:
    ParentImage: C:\Program Files\Git\usr\bin\sh.exe
    Image: C:\Program Files\Git\mingw64\bin\curl.exe
    CommandLine|contains|all:
    - '--silent --show-error --output '
    - gfw-httpget-
    - AppData
  condition: selection_curl and 1 of selection_susp_* and not 1 of filter_optional_*
