technique_id: T1105
technique_name: File Download Using Notepad++ GUP Utility
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 44143844-0631-49ab-97a0-96387d6b2d7c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection* and\
  \ not filter\nfilter:\n  ParentImage|endswith: \\notepad++.exe\nselection_cli:\n\
  \  CommandLine|contains|all:\n  - ' -unzipTo '\n  - http\nselection_img:\n- Image|endswith:\
  \ \\GUP.exe\n- OriginalFileName: gup.exe\n"
explanation: Detects execution of the Notepad++ updater (gup) from a process other
  than Notepad++ to download files.
false_positives:
- Other parent processes other than notepad++ using GUP that are not currently identified
references:
- https://twitter.com/nas_bench/status/1535322182863179776
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \GUP.exe
  - OriginalFileName: gup.exe
  selection_cli:
    CommandLine|contains|all:
    - ' -unzipTo '
    - http
  filter:
    ParentImage|endswith: \notepad++.exe
  condition: all of selection* and not filter
