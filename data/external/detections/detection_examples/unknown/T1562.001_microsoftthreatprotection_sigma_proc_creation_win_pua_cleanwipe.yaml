query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection1:\n\
  \  Image|endswith: \\SepRemovalToolNative_x64.exe\nselection2:\n  CommandLine|contains:\
  \ --uninstall\n  Image|endswith: \\CATClean.exe\nselection3:\n  CommandLine|contains:\
  \ -r\n  Image|endswith: \\NetInstaller.exe\nselection4:\n  CommandLine|contains|all:\n\
  \  - /uninstall\n  - /enterprise\n  Image|endswith: \\WFPUnins.exe\n"
explanation: Detects the use of CleanWipe a tool usually used to delete Symantec antivirus.
false_positives:
- Legitimate administrative use (Should be investigated either way)
