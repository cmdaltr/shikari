query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cmdline:\n\
  \  CommandLine|contains:\n  - ' -lvp '\n  - ' -lvnp'\n  - ' -l -v -p '\n  - ' -lv\
  \ -p '\n  - ' -l --proxy-type http '\n  - ' -vnl --exec '\n  - ' -vnl -e '\n  -\
  \ ' --lua-exec '\n  - ' --sh-exec '\nselection_img:\n  Image|endswith:\n  - \\nc.exe\n\
  \  - \\ncat.exe\n  - \\netcat.exe\n"
explanation: Detects execution of Netcat. Adversaries may use a non-application layer
  protocol for communication between host and C2 server or among infected hosts within
  a network
false_positives:
- Legitimate ncat use
references:
- https://nmap.org/ncat/
