technique_id: T1003.001
technique_name: Lsass Memory Dump via Comsvcs DLL
tactic: unknown
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: a49fa4d5-11db-418c-8473-1e014a8dd462
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CallTrace|contains: comsvcs.dll\n  SourceImage|endswith: \\rundll32.exe\n  TargetImage|endswith:\
  \ \\lsass.exe\n"
explanation: Detects adversaries leveraging the MiniDump export function from comsvcs.dll
  via rundll32 to perform a memory dump from lsass.
false_positives:
- Unknown
references:
- https://twitter.com/shantanukhande/status/1229348874298388484
- https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-com-services-dll/
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    SourceImage|endswith: \rundll32.exe
    CallTrace|contains: comsvcs.dll
  condition: selection
