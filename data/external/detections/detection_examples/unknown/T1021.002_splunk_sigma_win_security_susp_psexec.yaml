technique_id: T1021.002
technique_name: Suspicious PsExec Execution
tactic: unknown
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: c462f537-a1e3-41a6-b5fc-b2c2cef9bf82
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection1 and not filter\n\
  filter:\n  RelativeTargetName|startswith: PSEXESVC\nselection1:\n  EventID: 5145\n\
  \  RelativeTargetName|endswith:\n  - -stdin\n  - -stdout\n  - -stderr\n  ShareName:\
  \ \\\\\\\\\\*\\\\IPC$\n"
explanation: detects execution of psexec or paexec with renamed service name, this
  rule helps to filter out the noise if psexec is used for legit purposes or if attacker
  uses a different psexec client other than sysinternal one
false_positives:
- Unknown
references:
- https://web.archive.org/web/20230329171218/https://blog.menasec.net/2019/02/threat-hunting-3-detecting-psexec.html
tags:
- attack.lateral-movement
- attack.t1021.002
logsource:
  product: windows
  service: security
  definition: The advanced audit policy setting "Object Access > Audit Detailed File
    Share" must be configured for Success/Failure
detection:
  selection1:
    EventID: 5145
    ShareName: \\\\\*\\IPC$
    RelativeTargetName|endswith:
    - -stdin
    - -stdout
    - -stderr
  filter:
    RelativeTargetName|startswith: PSEXESVC
  condition: selection1 and not filter
