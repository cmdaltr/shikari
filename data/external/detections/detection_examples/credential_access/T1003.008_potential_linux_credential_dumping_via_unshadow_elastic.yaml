technique_id: T1003.008
technique_name: Potential Linux Credential Dumping via Unshadow
tactic: credential_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: 'process where host.os.type == "linux" and event.type == "start" and event.action
  in ("exec", "exec_event", "start", "ProcessRollup2") and

  process.name == "unshadow" and process.args_count >= 3'
explanation: 'Identifies the execution of the unshadow utility which is part of John
  the Ripper, a password-cracking tool on the host

  machine. Malicious actors can use the utility to retrieve the combined contents
  of the ''/etc/shadow'' and ''/etc/password''

  files. Using the combined file generated from the utility, the malicious threat
  actors can use them as input for

  password-cracking utilities or prepare themselves for future operations by gathering
  credential information of the

  victim.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e7cb3cfd-aaa3-4d7b-af18-23b89955062c.toml
query_type: eql
query_language: eql
