technique_id: T1556
technique_name: Potential SSH Password Grabbing via strace
tactic: credential_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: "sequence by host.id with maxspan=3s\n  [process where host.os.type == \"linux\"\
  \ and event.type == \"end\" and process.name == \"sshd\"]\n  [process where host.os.type\
  \ == \"linux\" and event.type == \"start\" and event.action == \"exec\" and process.name\
  \ == \"strace\"]"
explanation: 'Detects potential SSH password grabbing via the use of strace on sshd
  processes. Attackers may use strace to capture

  sensitive information, such as passwords, by tracing system calls made by the sshd
  process. This rule looks for a sequence

  of events where an sshd process ends followed closely by the start of a strace process.
  This may be indicative of an attacker

  attempting to capture SSH credentials.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9eaa3fb1-3f70-48ed-bb0e-d7ae4d3c8f28.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
references:
- https://github.com/braindead-sec/ssh-grabber
- https://dfir.ch/posts/strace/
risk_score: 47
