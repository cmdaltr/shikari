technique_id: T1040
technique_name: Azure Full Network Packet Capture Detected
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:azure.activitylogs and azure.activitylogs.operation_name:\n\
  \    (\n        MICROSOFT.NETWORK/*/STARTPACKETCAPTURE/ACTION or\n        MICROSOFT.NETWORK/*/VPNCONNECTIONS/STARTPACKETCAPTURE/ACTION\
  \ or\n        MICROSOFT.NETWORK/*/PACKETCAPTURES/WRITE\n    ) and\nevent.outcome:(Success\
  \ or success)"
explanation: 'Identifies potential full network packet capture in Azure. Packet Capture
  is an Azure Network Watcher feature that can

  be used to inspect network traffic. This feature can potentially be abused to read
  sensitive data from unencrypted

  internal traffic.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3ad77ed4-4dcf-4c51-8bfc-e3f7ce316b2f.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine network diagnostics by authorized personnel can trigger the rule. To
    manage this, create exceptions for specific user accounts or IP addresses known
    to perform regular diagnostics.

    - Automated network monitoring tools might initiate packet captures as part of
    their normal operations. Identify these tools and exclude their activities from
    triggering alerts.

    - Scheduled maintenance activities often involve packet captures for performance
    analysis. Document these'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations
has_investigation_guide: true
risk_score: 47
