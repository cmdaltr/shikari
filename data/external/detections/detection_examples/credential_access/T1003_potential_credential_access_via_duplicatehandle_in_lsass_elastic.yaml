technique_id: T1003
technique_name: Potential Credential Access via DuplicateHandle in LSASS
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.code == \"10\" and\n\n\
  \ /* LSASS requesting DuplicateHandle access right to another process */\n process.name\
  \ : \"lsass.exe\" and winlog.event_data.GrantedAccess == \"0x40\" and\n\n /* call\
  \ is coming from an unknown executable region */\n winlog.event_data.CallTrace :\
  \ \"*UNKNOWN*\""
explanation: 'Identifies suspicious access to an LSASS handle via DuplicateHandle
  from an unknown call trace module. This may indicate

  an attempt to bypass the NtOpenProcess API to evade detection and dump LSASS memory
  for credential access.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/02a4576a-7480-4284-9327-548a806b5e48.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


