technique_id: T1056
technique_name: Suspicious pbpaste High Volume Activity
tactic: credential_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: 'sequence by host.hostname, host.id with maxspan=1m

  [process where host.os.type == "macos" and event.type == "start" and event.action
  == "exec" and process.name: "pbpaste"] with runs = 5'
explanation: 'Identifies a high volume of `pbpaste` executions, which may indicate
  a bash loop continuously collecting clipboard

  contents, potentially allowing an attacker to harvest user credentials or other
  sensitive information.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e29599ee-d6ad-46a9-9c6a-dc39f361890d.toml
query_type: eql
query_language: eql
indicators:
