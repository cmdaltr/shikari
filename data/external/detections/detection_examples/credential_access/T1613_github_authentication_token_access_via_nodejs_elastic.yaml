technique_id: T1613
technique_name: GitHub Authentication Token Access via Node.js
tactic: credential_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: 'process where host.os.type == "linux" and event.type == "start" and event.action
  in ("exec", "ProcessRollup2") and process.parent.name == "node" and

  process.name in ("bash", "dash", "sh", "tcsh", "csh", "zsh", "ksh", "fish") and
  process.args == "gh auth token"'
explanation: 'This rule detects when the Node.js runtime spawns a shell to execute
  the GitHub CLI (gh) command to retrieve

  a GitHub authentication token. The GitHub CLI is a command-line tool that allows
  users to interact with

  GitHub from the terminal. The "gh auth token" command is used to retrieve an authentication
  token for

  GitHub, which can be used to authenticate API requests and perform actions on behalf
  of the user. Adversaries

  may use this technique to access GitHub repositories and potentially exfiltrate
  sensitive information or

  perform malicious actions. This activity was observed in the wild as part of the
  Shai-Hulud worm.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e5d69377-f8cf-4e8f-8328-690822cd012a.toml
query_type: eql
query_language: eql
indicators:
