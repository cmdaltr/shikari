technique_id: T1539
technique_name: Potential Cookies Theft via Browser Debugging
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where event.type in (\"start\", \"process_started\", \"info\") and\n\
  \  process.name in (\n             \"Microsoft Edge\",\n             \"chrome.exe\"\
  ,\n             \"Google Chrome\",\n             \"google-chrome-stable\",\n   \
  \          \"google-chrome-beta\",\n             \"google-chrome\",\n          \
  \   \"msedge.exe\") and\n   process.args : (\"--remote-debugging-port=*\",\n   \
  \                \"--remote-debugging-targets=*\",\n                   \"--remote-debugging-pipe=*\"\
  ) and\n   process.args : \"--user-data-dir=*\" and not process.args:\"--remote-debugging-port=0\""
explanation: 'Identifies the execution of a Chromium based browser with the debugging
  process argument, which may indicate an attempt

  to steal authentication cookies. An adversary may steal web application or service
  session cookies and use them to gain

  access web applications or Internet services as an authenticated user without needing
  credentials.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/027ff9ea-85e7-42e3-99d2-bbb7069e02eb.toml
