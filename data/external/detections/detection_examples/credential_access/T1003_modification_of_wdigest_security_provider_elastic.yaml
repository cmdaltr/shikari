technique_id: T1003
technique_name: Modification of WDigest Security Provider
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type in (\"creation\"\
  , \"change\") and\n    registry.value : \"UseLogonCredential\" and\n    registry.path\
  \ : \"*\\\\SYSTEM\\\\*ControlSet*\\\\Control\\\\SecurityProviders\\\\WDigest\\\\\
  UseLogonCredential\" and\n    registry.data.strings : (\"1\", \"0x00000001\") and\n\
  \    not (process.executable : \"?:\\\\Windows\\\\System32\\\\svchost.exe\" and\
  \ user.id : \"S-1-5-18\")"
explanation: 'Identifies attempts to modify the WDigest security provider in the registry
  to force the user''s password to be stored in

  clear text in memory. This behavior can be indicative of an adversary attempting
  to weaken the security configuration of

  an endpoint. Once the UseLogonCredential value is modified, the adversary may attempt
  to dump clear text passwords from

  memory.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d703a5af-d5b0-43bd-8ddb-7a5d500b7da5.toml
