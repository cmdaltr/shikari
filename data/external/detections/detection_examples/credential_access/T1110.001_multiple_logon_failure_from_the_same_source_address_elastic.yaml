technique_id: T1110.001
technique_name: Multiple Logon Failure from the same Source Address
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by winlog.computer_name, source.ip with maxspan=10s\n  [authentication\
  \ where event.action == \"logon-failed\" and\n    /* event 4625 need to be logged\
  \ */\n    winlog.logon.type : \"Network\" and\n    source.ip != null and source.ip\
  \ != \"127.0.0.1\" and source.ip != \"::1\" and\n    not user.name : (\"ANONYMOUS\
  \ LOGON\", \"-\", \"*$\") and not user.domain == \"NT AUTHORITY\" and\n\n    /*\n\
  \    noisy failure status codes often associated to authentication misconfiguration\
  \ :\n     0xC000015B - The user has not been granted the requested logon type (also\
  \ called the logon right) at this machine.\n     0XC000005E\t- There are currently\
  \ no logon servers available to service the logon request.\n     0XC0000133\t- Clocks\
  \ between DC and other computer too far out of sync.\n     0XC0000192\tAn attempt\
  \ was made to logon, but the Netlogon service was not started.\n    */\n    not\
  \ winlog.event_data.Status : (\"0xC000015B\", \"0XC000005E\", \"0XC0000133\", \"\
  0XC0000192\")] with runs=10"
explanation: 'Identifies multiple consecutive logon failures from the same source
  address and within a short time interval.

  Adversaries will often brute force login attempts across multiple users with a common
  or known password, in an attempt

  to gain access to accounts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/48b6edfc-079d-4907-b43c-baffa243270d.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Understand the context of the authentications by contacting the asset owners.
    This activity can be related to a new or existing automation or business process
    that is in a failing state.

    - Authentication misconfiguration or obsolete credentials.

    - Service account password expired.

    - Domain trust relationship issues.

    - Infrastructure or availability issues.


    ### Related rules


    - Multiple Logon Failure Followed by Logon Success - 4e85dc8a-3e41-40d8-bc28-91af7ac6cf60


    ###'
  mitigation: Review investigation guide for details
