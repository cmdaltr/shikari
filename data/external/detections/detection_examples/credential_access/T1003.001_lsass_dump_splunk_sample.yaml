  - https://jpcertcc.github.io/ToolAnalysisResultSheet/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md
  - https://docs.microsoft.com/en-us/sysinternals/downloads/procdump

