technique_id: T1003
technique_name: NTDS or SAM Database File Copied
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n    ((?process.pe.original_file_name in (\"Cmd.Exe\", \"PowerShell.EXE\",\
  \ \"XCOPY.EXE\") or process.name : (\"Cmd.Exe\", \"PowerShell.EXE\", \"XCOPY.EXE\"\
  )) and\n       process.args : (\"copy\", \"xcopy\", \"Copy-Item\", \"move\", \"\
  cp\", \"mv\")\n    ) or\n    ((?process.pe.original_file_name : \"esentutl.exe\"\
  \ or process.name : \"esentutl.exe\") and process.args : (\"*/y*\", \"*/vss*\",\
  \ \"*/d*\"))\n  ) and\n  process.command_line : (\"*\\\\ntds.dit*\", \"*\\\\config\\\
  \\SAM*\", \"*\\\\*\\\\GLOBALROOT\\\\Device\\\\HarddiskVolumeShadowCopy*\\\\*\",\
  \ \"*/system32/config/SAM*\", \"*\\\\User Data\\\\*\")"
explanation: 'Identifies a copy operation of the Active Directory Domain Database
  (ntds.dit) or Security Account Manager (SAM) files.

  Those files contain sensitive information including hashed domain and/or local credentials.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3bc6deaa-fbd4-433a-ae21-3e892f95624f.toml
