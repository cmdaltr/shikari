technique_id: T1003
technique_name: Linux init (PID 1) Secret Dump via GDB
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: 'process where host.os.type == "linux" and event.type == "start" and event.action
  in ("exec", "exec_event", "start", "ProcessRollup2") and

  process.name == "gdb" and process.args in ("--pid", "-p") and process.args == "1"'
explanation: 'This rule monitors for the potential memory dump of the init process
  (PID 1) through gdb. Attackers may leverage memory

  dumping techniques to attempt secret extraction from privileged processes. Tools
  that display this behavior include

  "truffleproc" and "bash-memory-dump". This behavior should not happen by default,
  and should be investigated thoroughly.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d4ff2f53-c802-4d2e-9fb9-9ecc08356c3f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Crowdstrike
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - System administrators or developers may use GDB for legitimate debugging purposes
    on the init process. To handle this, create exceptions for known maintenance windows
    or specific user accounts that are authorized to perform such actions.

    - Automated scripts or monitoring tools might inadvertently trigger this rule
    if they include GDB commands targeting PID 1 for health checks. Review and adjust
    these scripts to avoid unnecessary memory access or exclude them from the r'
  mitigation: Review investigation guide for details
references:
- https://github.com/controlplaneio/truffleproc
- https://github.com/hajzer/bash-memory-dump
has_investigation_guide: true
risk_score: 47
