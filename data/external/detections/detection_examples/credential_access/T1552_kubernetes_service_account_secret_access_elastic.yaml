technique_id: T1552
technique_name: Kubernetes Service Account Secret Access
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ == \"exec\" and (\n  process.command_line like (\n    \"*/run/secrets/kubernetes.io/serviceaccount*\"\
  ,\n    \"*/var/run/secrets/kubernetes.io/serviceaccount*\",\n    \"*/secrets/kubernetes.io/serviceaccount*\"\
  \n  ) or (\n    process.working_directory like (\n      \"/run/secrets/kubernetes.io/serviceaccount\"\
  ,\n      \"/var/run/secrets/kubernetes.io/serviceaccount\",\n      \"/secrets/kubernetes.io/serviceaccount\"\
  \n    ) and\n    process.args in (\"ca.crt\", \"token\", \"namespace\")\n  )\n)"
explanation: 'This rule detects when a process accesses Kubernetes service account
  secrets. Kubernetes service

  account secrets are files that contain sensitive information used by applications
  running in Kubernetes

  clusters to authenticate and authorize access to the cluster. These secrets are
  typically mounted into

  pods at runtime, allowing applications to access them securely. Unauthorized access
  to these secrets

  can lead to privilege escalation, lateral movement and unauthorized actions within
  the cluster.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ce73954b-a0a4-4f05-b67b-294c500dac77.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine access by system processes or monitoring tools can trigger false positives.
    Identify these processes and create exceptions to prevent unnecessary alerts.

    - Automated scripts or applications that regularly access service account secrets
    for legitimate purposes may be flagged. Review these scripts and whitelist them
    if they are verified as non-threatening.

    - Development and testing environments often have processes accessing service
    account secrets as part of nor'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
