  value: Entra ID
  confidence: high
- type: data_source
  value: Entra ID Sign-in logs
  confidence: high
false_positives:
- description: "False Positive Analysis:\n\n    - Verify if the failed attempts could\
    \ result from the user’s unfamiliarity with TOTP codes or issues with device synchronization.\n\
    \    - Check if the user recently switched MFA methods or devices, which could\
    \ explain multiple failures.\n    - Determine if this is whitebox testing or a\
    \ developer testing MFA integration.\n\n#### Response and Remediation:\n\n   \
    \ - If proven malicious, lock the affected account temporarily to prevent further\
    \ unauthorized attempts.\n    - Notif"
  mitigation: Review investigation guide for details
