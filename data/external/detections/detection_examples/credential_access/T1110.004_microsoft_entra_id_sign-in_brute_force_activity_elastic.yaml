false_positives:
- description: 'False positive analysis


    - Legitimate automation (e.g., misconfigured scripts, sync processes) can trigger
    repeated failures.

    - Internal red team activity or penetration tests may mimic brute-force behaviors.

    - Certain service accounts or mobile clients may generate repetitive sign-in noise
    if not properly configured.


    ### Response and remediation


    - Notify your identity security team for further analysis.

    - Investigate and lock or reset impacted accounts if compromise is suspected.

    - Block offe'
