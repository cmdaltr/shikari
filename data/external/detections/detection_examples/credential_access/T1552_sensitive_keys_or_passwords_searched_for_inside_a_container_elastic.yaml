technique_id: T1552
technique_name: Sensitive Keys Or Passwords Searched For Inside A Container
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ == \"exec\" and\nprocess.entry_leader.entry_meta.type == \"container\" and\nprocess.name\
  \ in (\"grep\", \"egrep\", \"fgrep\", \"find\", \"locate\", \"mlocate\") and\nprocess.command_line\
  \ like~ (\n  \"*BEGIN PRIVATE*\", \"*BEGIN OPENSSH PRIVATE*\", \"*BEGIN RSA PRIVATE*\"\
  , \"*BEGIN DSA PRIVATE*\", \"*BEGIN EC PRIVATE*\",\n  \"*pass*\", \"*ssh*\", \"\
  *user*\", \"*id_rsa*\", \"*id_dsa*\"\n)"
explanation: 'This rule detects the use of system search utilities like grep and find
  to search for private SSH keys or passwords

  inside a container. Unauthorized access to these sensitive files could lead to further
  compromise of the container

  environment or facilitate a container breakout to the underlying host machine.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/23cd4ba2-344e-41bf-bcda-655bea43fdbc.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks may trigger the rule when system administrators
    use grep or find to audit or manage SSH keys and passwords within containers.
    To mitigate this, create exceptions for known administrative scripts or processes
    that regularly perform these tasks.

    - Automated backup or configuration management tools might search for sensitive
    files as part of their normal operation. Identify these tools and exclude their
    process IDs or specific command patterns'
  mitigation: Review investigation guide for details
references:
- https://sysdig.com/blog/cve-2021-25741-kubelet-falco/
has_investigation_guide: true
risk_score: 47
