technique_id: T1003.003
technique_name: Symbolic Link to Shadow Copy Created
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (\n    (?process.pe.original_file_name in (\"Cmd.Exe\",\"PowerShell.EXE\")) or\n\
  \    (process.name : (\"cmd.exe\", \"powershell.exe\"))\n ) and\n\n /* Create Symbolic\
  \ Link to Shadow Copies */\n process.args : (\"*mklink*\", \"*SymbolicLink*\") and\
  \ process.command_line : (\"*HarddiskVolumeShadowCopy*\")"
explanation: 'Identifies the creation of symbolic links to a shadow copy. Symbolic
  links can be used to access files in the shadow

  copy, including sensitive files such as ntds.dit, System Boot Key and browser offline
  credentials.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d117cbb4-7d56-41b4-b999-bdf8c25648a0.toml
