technique_id: T1110
technique_name: Okta Brute Force or Password Spraying Attack
tactic: credential_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:okta.system and event.category:authentication and event.outcome:failure
explanation: 'Identifies a high number of failed Okta user authentication attempts
  from a single IP address, which could be indicative

  of a brute force or password spraying attack. An adversary may attempt a brute force
  or password spraying attack to

  obtain unauthorized access to user accounts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/42bf698b-4738-445b-8231-c834ddefd8a0.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis:


    - A single user or automated process that attempts to authenticate using expired
    or wrong credentials multiple times may trigger a false positive.

    - Analyze the behavior of the source IP. If the IP is associated with legitimate
    users or services, it may be a false positive.


    ### Response and remediation:


    - If you identify unauthorized access attempts, consider blocking the source IP
    at the firewall level.

    - Notify the users who are targeted by the attack. Ask them to c'
  mitigation: Review investigation guide for details
references:
- https://developer.okta.com/docs/reference/api/system-log/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
