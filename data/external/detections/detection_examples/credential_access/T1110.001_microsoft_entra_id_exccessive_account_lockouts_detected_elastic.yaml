  confidence: high
false_positives:
- description: 'False positive analysis


    - Misconfigured clients, scripts, or services with outdated credentials may inadvertently
    cause lockouts.

    - Repeated lockouts from known internal IPs or during credential rotation windows
    could be benign.

    - Legacy applications without modern auth support may repeatedly fail and trigger
    Smart Lockout.

    - Specific known user agents (e.g., corporate service accounts).

    - Internal IPs or cloud-hosted automation with expected failure behavior.


    ### Response and remediation


    - I'
