technique_id: T1003
technique_name: Microsoft IIS Connection Strings Decryption
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (process.name : \"aspnet_regiis.exe\" or ?process.pe.original_file_name == \"\
  aspnet_regiis.exe\") and\n  process.args : \"connectionStrings\" and process.args\
  \ : \"-pdf\""
explanation: 'Identifies use of aspnet_regiis to decrypt Microsoft IIS connection
  strings. An attacker with Microsoft IIS web server

  access via a webshell or alike can decrypt and dump any hardcoded connection strings,
  such as the MSSQL service account

  password using aspnet_regiis command.'
source: Elastic Detection Rules
