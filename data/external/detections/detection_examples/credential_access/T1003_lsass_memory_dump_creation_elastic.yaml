technique_id: T1003
technique_name: LSASS Memory Dump Creation
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.action != \"deletion\" and\n\
  \  file.name : (\"lsass*.dmp\", \"dumpert.dmp\", \"Andrew.dmp\", \"SQLDmpr*.mdmp\"\
  , \"Coredump.dmp\") and\n\n  not (\n        process.executable : (\n          \"\
  ?:\\\\Program Files\\\\Microsoft SQL Server\\\\*\\\\Shared\\\\SqlDumper.exe\",\n\
  \          \"?:\\\\Program Files\\\\Microsoft SQL Server Reporting Services\\\\\
  SSRS\\\\ReportServer\\\\bin\\\\SqlDumper.exe\",\n          \"?:\\\\Windows\\\\System32\\\
  \\dllhost.exe\"\n        ) and\n        file.path : (\n          \"?:\\\\*\\\\Reporting\
  \ Services\\\\Logfiles\\\\SQLDmpr*.mdmp\",\n          \"?:\\\\Program Files\\\\\
  Microsoft SQL Server Reporting Services\\\\SSRS\\\\Logfiles\\\\SQLDmpr*.mdmp\",\n\
  \          \"?:\\\\Program Files\\\\Microsoft SQL Server\\\\*\\\\Shared\\\\ErrorDumps\\\
  \\SQLDmpr*.mdmp\",\n          \"?:\\\\Program Files\\\\Microsoft SQL Server\\\\\
  *\\\\MSSQL\\\\LOG\\\\SQLDmpr*.mdmp\"\n        )\n      ) and\n\n  not (\n      \
  \  process.executable : (\n          \"?:\\\\Windows\\\\system32\\\\WerFault.exe\"\
  ,\n          \"?:\\\\Windows\\\\System32\\\\WerFaultSecure.exe\"\n          ) and\n\
  \        file.path : (\n          \"?:\\\\Windows\\\\System32\\\\config\\\\systemprofile\\\
  \\AppData\\\\Local\\\\CrashDumps\\\\lsass.exe.*.dmp\",\n          \"?:\\\\Windows\\\
  \\System32\\\\%LOCALAPPDATA%\\\\CrashDumps\\\\lsass.exe.*.dmp\"\n        )\n  )"
explanation: 'Identifies the creation of a Local Security Authority Subsystem Service
  (lsass.exe) default memory dump. This may

  indicate a credential access attempt via trusted system utilities such as Task Manager
  (taskmgr.exe) and SQL Dumper

  (sqldumper.exe) or known pentesting tools such as Dumpert and AndrewSpecial.'
source: Elastic Detection Rules
