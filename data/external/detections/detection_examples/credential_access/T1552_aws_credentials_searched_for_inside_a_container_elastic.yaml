technique_id: T1552
technique_name: AWS Credentials Searched For Inside A Container
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ == \"exec\" and\nprocess.entry_leader.entry_meta.type == \"container\" and\nprocess.name\
  \ in (\"grep\", \"egrep\", \"fgrep\", \"find\", \"locate\", \"mlocate\") and\nprocess.command_line\
  \ like~ (\n  \"*aws_access_key_id*\", \"*aws_secret_access_key*\", \"*aws_session_token*\"\
  , \"*accesskeyid*\", \"*secretaccesskey*\",\n  \"*access_key*\", \"*.aws/credentials*\"\
  \n)"
explanation: 'This rule detects the use of system search utilities like grep and find
  to search for AWS credentials inside a

  container. Unauthorized access to these sensitive files could lead to further compromise
  of the container environment or

  facilitate a container breakout to the underlying cloud environment.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5749282b-7524-4c9d-af9a-e2b3e814e5d4.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance scripts or automated processes may use search utilities
    to verify the presence of AWS credentials for legitimate configuration checks.
    To handle this, identify and whitelist these specific scripts or processes by
    their unique identifiers or execution paths.

    - Developers or system administrators might manually search for AWS credentials
    during debugging or configuration tasks. Implement a policy to log and review
    these activities, and consider exclud'
  mitigation: Review investigation guide for details
references:
- https://sysdig.com/blog/threat-detection-aws-cloud-containers/
has_investigation_guide: true
risk_score: 47
