technique_id: T1003
technique_name: Potential LSASS Memory Dump via PssCaptureSnapShot
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and event.code:10 and\n winlog.event_data.TargetImage:(\"\
  C:\\\\Windows\\\\system32\\\\lsass.exe\" or\n                                 \"\
  c:\\\\Windows\\\\system32\\\\lsass.exe\" or\n                                 \"\
  c:\\\\Windows\\\\System32\\\\lsass.exe\")"
explanation: 'Identifies suspicious access to an LSASS handle via PssCaptureSnapShot
  where two successive process accesses are

  performed by the same process and target two different instances of LSASS. This
  may indicate an attempt to evade

  detection and dump LSASS memory for credential access.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0f93cb9a-1931-48c2-8cd0-f173fd3e5283.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate diagnostic tools or software that utilize PssCaptureSnapShot for
    debugging purposes may trigger this rule. Users should identify and whitelist
    these trusted applications to prevent false positives.

    - System administrators or security tools performing regular health checks on
    LSASS might access LSASS memory in a non-malicious manner. Exclude these known
    processes by creating exceptions based on their process names or hashes.

    - Automated scripts or maintenance'
  mitigation: Review investigation guide for details
references:
- https://www.matteomalvica.com/blog/2019/12/02/win-defender-atp-cred-bypass/
- https://twitter.com/sbousseaden/status/1280619931516747777?lang=en
has_investigation_guide: true
risk_score: 73
