  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - System administrators or monitoring tools may use the ''ps'' and ''strings''
    commands for legitimate system diagnostics and performance monitoring. To mitigate
    this, create exceptions for known administrative scripts or tools that regularly
    execute these commands.

    - Automated scripts for system health checks might trigger the rule if they use
    ''ps'' and ''strings'' to gather process information. Identify and whitelist these
    scripts by their specific command patterns or executi'
  mitigation: Review investigation guide for details
references:
- https://github.com/huntergregal/mimipenguin
- https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2018-20781
