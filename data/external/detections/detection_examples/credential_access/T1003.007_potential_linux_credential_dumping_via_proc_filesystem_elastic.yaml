technique_id: T1003.007
technique_name: Potential Linux Credential Dumping via Proc Filesystem
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id, process.parent.name with maxspan=1m\n  [process where\
  \ host.os.type == \"linux\" and process.name == \"ps\" and event.action in (\"exec\"\
  , \"start\", \"exec_event\")\n   and process.args in (\"-eo\", \"pid\", \"command\"\
  )]\n  [process where host.os.type == \"linux\" and process.name == \"strings\" and\
  \ event.action in (\"exec\", \"start\", \"exec_event\")\n   and process.args : \"\
  /tmp/*\"]"
explanation: 'Identifies the execution of the mimipenguin exploit script which is
  linux adaptation of Windows tool mimikatz.

  Mimipenguin exploit script is used to dump clear text passwords from a currently
  logged-in user. The tool exploits a

  known vulnerability CVE-2018-20781. Malicious actors can exploit the cleartext credentials
  in memory by dumping the

  process and extracting lines that have a high probability of containing cleartext
  passwords.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ef100a2e-ecd4-4f72-9d1e-2f779ff3c311.toml
query_type: eql
query_language: eql
