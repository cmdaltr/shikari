technique_id: T1557
technique_name: Potential NTLM Relay Attack against a Computer Account
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by winlog.computer_name, source.ip with maxspan=5s\n\n/* Filter for\
  \ an event that indicates coercion against known abused named pipes using an account\
  \ that is not the host */\n[file where host.os.type == \"windows\" and event.code\
  \ : \"5145\" and \n    not startswith~(winlog.computer_name, substring(user.name,\
  \ 0, -1)) and\n    file.name : (\n        \"Spoolss\", \"netdfs\", \"lsarpc\", \"\
  lsass\", \"netlogon\", \"samr\", \"efsrpc\", \"FssagentRpc\",\n        \"eventlog\"\
  , \"winreg\", \"srvsvc\", \"dnsserver\", \"dhcpserver\", \"WinsPipe\"\n    )]\n\n\
  /* Detects a logon attempt using the NTLM protocol resulting from the coercion coming\
  \ from the same IP address */\n[authentication where host.os.type == \"windows\"\
  \ and event.code in (\"4624\", \"4625\") and\n    endswith~(user.name, \"$\") and\
  \ winlog.logon.type : \"network\" and\n    winlog.event_data.AuthenticationPackageName\
  \ : \"NTLM\" and\n\n    /* Filter for a machine account that matches the hostname\
  \ */\n    startswith~(winlog.computer_name, substring(user.name, 0, -1)) and\n\n\
  \    /* Verify if the Source IP belongs to the host */\n    not endswith(string(source.ip),\
  \ string(host.ip)) and\n    source.ip != null and source.ip != \"::1\" and source.ip\
  \ != \"127.0.0.1\"]"
explanation: 'Detects potential relay attacks by identifying coercion attempts followed
  by authentication events using a target

  server''s computer account, originating from a different host. This may indicate
  that an attacker has captured and

  relayed the server''s computer account hash to execute code on behalf of the compromised
  system.'
source: Elastic Detection Rules
