technique_id: T1187
technique_name: Active Directory Forced Authentication from Linux Host - SMB Named
  Pipes
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: 'sequence with maxspan=15s

  [network where host.os.type == "linux" and event.action == "connection_attempted"
  and destination.port == 445 and not startswith~(string(destination.ip), string(host.ip))]
  by host.ip, data_stream.namespace

  [file where host.os.type == "windows" and event.code == "5145" and file.name : ("Spoolss",
  "netdfs", "lsarpc", "lsass", "netlogon", "samr", "efsrpc", "FssagentRpc")] by source.ip,
  data_stream.namespace'
explanation: 'Identifies a potential forced authentication using related SMB named
  pipes. Attackers may attempt to force targets to

  authenticate to a host controlled by them to capture hashes or enable relay attacks.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c24e9a43-f67e-431d-991b-09cdb83b3c0c.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks from Linux hosts may trigger alerts. Identify and
    document these tasks to create exceptions for known IP addresses or hostnames
    involved in regular operations.

    - Automated backup or monitoring systems that connect to Windows hosts using SMB
    may cause false positives. Review and whitelist these systems by their IP addresses
    or specific named pipes they access.

    - Development or testing environments where Linux hosts frequently interact with
    W'
  mitigation: Review investigation guide for details
references:
- https://github.com/p0dalirius/windows-coerced-authentication-methods
- https://www.thehacker.recipes/a-d/movement/mitm-and-coerced-authentications
- https://attack.mitre.org/techniques/T1187/
has_investigation_guide: true
risk_score: 47
