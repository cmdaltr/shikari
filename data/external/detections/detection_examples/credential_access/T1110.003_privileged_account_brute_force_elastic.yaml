    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the source host to prevent further post-compromise behavior.

    - If the asset is exposed to the internet with RDP or other remote services available,
    take the necessary measures to restri'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
has_investigation_guide: true
risk_score: 47
