technique_id: T1110.003
technique_name: Privileged Account Brute Force
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by winlog.computer_name, source.ip with maxspan=10s\n  [authentication\
  \ where event.action == \"logon-failed\" and winlog.logon.type : \"Network\" and\n\
  \    source.ip != null and source.ip != \"127.0.0.1\" and source.ip != \"::1\" and\
  \ user.name : \"*admin*\" and\n\n    /* noisy failure status codes often associated\
  \ to authentication misconfiguration */\n    not winlog.event_data.Status : (\"\
  0xC000015B\", \"0XC000005E\", \"0XC0000133\", \"0XC0000192\")] with runs=5"
explanation: 'Identifies multiple consecutive logon failures targeting an Admin account
  from the same source address and within a

  short time interval. Adversaries will often brute force login attempts across multiple
  users with a common or known

  password, in an attempt to gain access to accounts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f9790abf-bd0c-45f9-8b5f-d0b74015e029.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
