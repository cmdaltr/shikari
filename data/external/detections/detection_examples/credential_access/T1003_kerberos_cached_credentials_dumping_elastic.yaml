technique_id: T1003
technique_name: Kerberos Cached Credentials Dumping
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n  process.name == \"kcc\" and\n  process.args like~ \"copy_cred_cache\""
explanation: 'Identifies the use of the Kerberos credential cache (kcc) utility to
  dump locally cached Kerberos tickets. Adversaries

  may attempt to dump credential material in the form of tickets that can be leveraged
  for lateral movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ad88231f-e2ab-491c-8fc6-64746da26cfe.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks using the kcc utility may trigger the rule. Identify
    and document these tasks to create exceptions for known benign activities.

    - Automated scripts or maintenance processes that involve copying Kerberos credential
    caches can be mistaken for malicious activity. Review and whitelist these scripts
    if they are verified as safe.

    - Developers or IT personnel testing Kerberos configurations might use the kcc
    utility in a non-malicious context. Est'
  mitigation: Review investigation guide for details
references:
- https://github.com/EmpireProject/EmPyre/blob/master/lib/modules/collection/osx/kerberosdump.py
- https://opensource.apple.com/source/Heimdal/Heimdal-323.12/kuser/kcc-commands.in.auto.html
has_investigation_guide: true
risk_score: 73
