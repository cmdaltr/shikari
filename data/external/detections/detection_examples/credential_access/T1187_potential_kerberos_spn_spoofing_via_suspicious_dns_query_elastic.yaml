technique_id: T1187
technique_name: Potential Kerberos SPN Spoofing via Suspicious DNS Query
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'network where host.os.type == "windows" and dns.question.name : "*UWhRC*BAAAA*"'
explanation: 'Identifies queries to a DNS record containing a base64-encoded blob
  matching the pattern "UWhRCA...BAAAA". This pattern

  corresponds to a marshaled CREDENTIAL_TARGET_INFORMATION structure, commonly used
  in Kerberos coercion attacks. It is

  associated with tools and techniques that exploit SPN spoofing via DNS. Adversaries
  may abuse this to coerce victim

  systems into authenticating to attacker-controlled hosts while requesting Kerberos
  tickets for legitimate services

  (often the victim''s own identity), enabling attacks such as NTLM reflection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/99ac5005-8a9e-4625-a0af-5f7bb447204b.toml
query_type: eql
query_language: eql
