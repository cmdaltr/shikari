false_positives:
- description: 'False positive analysis


    - This activity is unlikely to happen legitimately.


    ### Response and remediation


    - Review and remove malicious DNS records containing the embedded CREDENTIAL_TARGET_INFORMATION
    Base64 payload (UWhRCA...BAAAA). Ensure that no additional coercion records exist
    in the same DNS zone.

    - Isolate involved systems if signs of compromise or lateral movement are detected,
    especially if the record was successfully resolved and used for coercion.

    - Monitor network traffic for sign'
  mitigation: Review investigation guide for details
