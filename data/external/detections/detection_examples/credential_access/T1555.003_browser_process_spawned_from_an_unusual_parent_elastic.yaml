false_positives:
- description: 'False positive analysis


    - Certain enterprise management or testing tools may launch browsers with remote
    debugging enabled for automation purposes. Identify and document such legitimate
    tools and processes.

    - Development environments may use browser remote debugging features during legitimate
    software testing. Exclude known dev/test machines or users from triggering alerts
    in production environments.

    - Security testing frameworks or internal red team activities may use similar
    techniques. Coord'
  mitigation: Review investigation guide for details
