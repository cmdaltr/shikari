technique_id: T1555.003
technique_name: Browser Process Spawned from an Unusual Parent
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : (\"chrome.exe\", \"msedge.exe\") and\n  process.parent.executable\
  \ != null and process.command_line != null and\n  (\n  process.command_line :\n\
  \           (\"\\\"C:\\\\Program Files (x86)\\\\Microsoft\\\\Edge\\\\Application\\\
  \\msedge.exe\\\"\",\n            \"\\\"C:\\\\Program Files\\\\Google\\\\Chrome\\\
  \\Application\\\\chrome.exe\\\"\",\n            \"\\\"C:\\\\Program Files\\\\Google\\\
  \\Chrome\\\\Application\\\\chrome.exe\\\" --headless --disable-logging --log-level=3\
  \ --v=0\",\n            \"\\\"C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\
  \\chrome.exe\\\" --headless --log-level=3\",\n            \"\\\"C:\\\\Program Files\\\
  \\Google\\\\Chrome\\\\Application\\\\chrome.exe\\\" --headless\",\n            \"\
  \\\"C:\\\\Program Files\\\\Google\\\\Chrome\\\\Application\\\\chrome.exe\\\" --remote-debugging-port=922?\
  \ --profile-directory=\\\"Default\\\"*\",\n            \"\\\"C:\\\\Program Files\\\
  \\Google\\\\Chrome\\\\Application\\\\chrome.exe\\\" --headless --restore-last-session\
  \ --remote-debugging-port=45452*\") or\n\n  (process.args : \"--remote-debugging-port=922?\"\
  \ and process.args : \"--window-position=-*,-*\")\n   ) and\n  not process.parent.executable\
  \ :\n                         (\"C:\\\\Windows\\\\explorer.exe\",\n            \
  \              \"C:\\\\Program Files (x86)\\\\*.exe\",\n                       \
  \   \"C:\\\\Program Files\\\\*.exe\",\n                          \"C:\\\\Windows\\\
  \\System32\\\\rdpinit.exe\",\n                          \"C:\\\\Windows\\\\System32\\\
  \\sihost.exe\",\n                          \"C:\\\\Windows\\\\System32\\\\RuntimeBroker.exe\"\
  ,\n                          \"C:\\\\Windows\\\\System32\\\\SECOCL64.exe\")"
explanation: 'Identifies instances where an unusual process spawns a chrome browser
  child process. This behavior could be related to malware

  stealing browser information.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/46b01bb5-cff2-4a00-9f87-c041d9eab554.toml
query_type: eql
query_language: eql
