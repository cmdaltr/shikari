technique_id: T1187
technique_name: Rare Connection to WebDAV Target
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "from logs-*\n| where\n    @timestamp > now() - 8 hours and\n    event.category\
  \ == \"process\" and\n    event.type == \"start\" and\n    process.name == \"rundll32.exe\"\
  \ and\n    process.command_line like \"*DavSetCookie*\"\n| keep host.id, process.command_line,\
  \ user.name\n| grok\n    process.command_line \"\"\"(?<Esql.server_webdav_cookie>DavSetCookie\
  \ .* http) \"\"\"| eval\n    Esql.server_webdav_cookie_replace = replace(Esql.server_webdav_cookie,\
  \ \"(DavSetCookie | http)\", \"\")\n| where\n    Esql.server_webdav_cookie_replace\
  \ is not null and\n    Esql.server_webdav_cookie_replace rlike \"\"\"(([a-zA-Z0-9-]+\\\
  .)+[a-zA-Z]{2,3}(@SSL.*)*|(\\d{1,3}\\.){3}\\d{1,3})\"\"\" and\n    not Esql.server_webdav_cookie_replace\
  \ in (\"www.google.com@SSL\", \"www.elastic.co@SSL\") and\n    not Esql.server_webdav_cookie_replace\
  \ rlike \"\"\"(10\\.(\\d{1,3}\\.){2}\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.(\\d{1,3}\\\
  .)\\d{1,3}|192\\.168\\.(\\d{1,3}\\.)\\d{1,3}) \"\"\"| stats\n    Esql.event_count\
  \ = count(*),\n    Esql.host_id_count_distinct = count_distinct(host.id),\n    Esql.host_id_values\
  \ = values(host.id),\n    Esql.user_name_values = values(user.name)\n  by Esql.server_webdav_cookie_replace\n\
  | where\n    Esql.host_id_count_distinct == 1 and\n    Esql.event_count <= 3"
explanation: 'Identifies rare connection attempts to a Web Distributed Authoring and
  Versioning (WebDAV) resource. Attackers may

  inject WebDAV paths in files or features opened by a victim user to leak their NTLM
  credentials via forced

  authentication.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/6756ee27-9152-479b-9b73-54b5bbda301c.toml
query_type: esql
query_language: esql
