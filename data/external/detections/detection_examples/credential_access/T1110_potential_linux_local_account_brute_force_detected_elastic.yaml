technique_id: T1110
technique_name: Potential Linux Local Account Brute Force Detected
tactic: credential_access
platform: Elastic
fidelity_score: 0.91
validated: true
query: "sequence by host.id, process.parent.executable, user.id with maxspan=1s\n\
  \  [process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ == \"exec\" and process.name == \"su\" and\n   not process.parent.name in (\n\
  \     \"bash\", \"dash\", \"ash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\",\
  \ \"fish\", \"clickhouse-server\", \"ma\", \"gitlab-runner\",\n     \"updatedb.findutils\"\
  , \"cron\", \"perl\", \"sudo\", \"java\", \"cloud-app-identify\", \"ambari-sudo.sh\"\
  \n   )\n  ] with runs=10"
explanation: 'Identifies multiple consecutive login attempts executed by one process
  targeting a local linux user account within a

  short time interval. Adversaries might brute force login attempts across different
  users with a default wordlist or a

  set of customly crafted passwords in an attempt to gain access to these accounts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/835c0622-114e-40b5-a346-f843ea5d01f1.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts or automation tools may trigger the rule if
    they execute the ''su'' command frequently. To mitigate this, identify and whitelist
    these scripts or tools by adding their parent process names to the exclusion list.

    - Scheduled tasks or cron jobs that require switching users might be misidentified
    as brute force attempts. Review and exclude these tasks by specifying their parent
    process names in the exclusion criteria.

    - Development or testi'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
