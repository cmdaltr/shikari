technique_id: T1218
technique_name: Potential Credential Access via Renamed COM+ Services DLL
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by process.entity_id with maxspan=1m\n [process where host.os.type\
  \ == \"windows\" and event.category == \"process\" and\n    process.name : \"rundll32.exe\"\
  ]\n [process where host.os.type == \"windows\" and event.category == \"process\"\
  \ and event.dataset : \"windows.sysmon_operational\" and event.code == \"7\" and\n\
  \   (file.pe.original_file_name : \"COMSVCS.DLL\" or file.pe.imphash : \"EADBCCBB324829ACB5F2BBE87E5549A8\"\
  ) and\n    /* renamed COMSVCS */\n    not file.name : \"COMSVCS.DLL\"]"
explanation: 'Identifies suspicious renamed COMSVCS.DLL Image Load, which exports
  the MiniDump function that can be used to dump a

  process memory. This may indicate an attempt to dump LSASS memory while bypassing
  command-line based detection in

  preparation for credential access.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c5c9f591-d111-4cf8-baec-c26a39bc31ef.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - False positives may include legitimate instances of rundll32.exe loading a renamed
    COMSVCS.DLL image for non-malicious purposes, such as during software development,
    testing, or troubleshooting.


    ### Related Rules


    - Potential Credential Access via LSASS Memory Dump - 9960432d-9b26-409f-972b-839a959e79e2

    - Suspicious Module Loaded by LSASS - 3a6001a0-0939-4bbe-86f4-47d8faeb7b97

    - Suspicious Lsass Process Access - 128468bf-cab1-4637-99ea-fdf3780a4609

    - LSASS Process Acc'
  mitigation: Review investigation guide for details
references:
- https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-com-services-dll/
has_investigation_guide: true
risk_score: 73
