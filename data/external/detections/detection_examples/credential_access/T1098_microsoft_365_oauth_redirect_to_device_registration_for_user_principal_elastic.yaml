technique_id: T1098
technique_name: Microsoft 365 OAuth Redirect to Device Registration for User Principal
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by related.user with maxspan=30m\n[authentication where event.action\
  \ == \"UserLoggedIn\" and\n o365.audit.ExtendedProperties.RequestType == \"OAuth2:Authorize\"\
  \ and o365.audit.ExtendedProperties.ResultStatusDetail == \"Redirect\" and\n o365.audit.UserType:\
  \ (\"0\", \"2\", \"3\", \"10\")] // victim source.ip\n[authentication where event.action\
  \ == \"UserLoggedIn\" and\n o365.audit.ExtendedProperties.RequestType == \"OAuth2:Token\"\
  \ and o365.audit.ExtendedProperties.ResultStatusDetail == \"Success\"] // attacker\
  \ source.ip to convert oauth code to token\n[web where event.dataset == \"o365.audit\"\
  \ and event.action == \"Add registered users to device.\"] // user.name is captured\
  \ in related.user"
explanation: 'Identifies attempts to register a new device in Microsoft Entra ID after
  OAuth authentication with authorization code

  grant. Adversaries may use OAuth phishing techniques to obtain an OAuth authorization
  code, which can then be exchanged

  for access and refresh tokens. This rule detects a sequence of events where a user
  principal authenticates via OAuth,

  followed by a device registration event, indicating potential misuse of the OAuth
  flow to establish persistence or

  access resources.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/fcd2e4be-6ec4-482f-9222-6245367cd738.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Microsoft 365
  confidence: high
- type: data_source
  value: Microsoft 365 Audit Logs
  confidence: high
false_positives:
- description: 'False positive analysis

    - Both authentcation events of the sequence are originatng from the same source.ip.

    - User using multiple devices and attempted to add a new device post an OAuth
    code authentication.


    ### Response and remediation

    - Immediately revoke the compromised Primary Refresh Tokens (PRTs) to prevent
    further unauthorized access. This can be done through the Azure portal by navigating
    to the user''s account and invalidating all active sessions.

    - Enforce a password reset for the affec'
  mitigation: Review investigation guide for details
references:
- https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-auth-code-flow
- https://www.volexity.com/blog/2025/04/22/phishing-for-codes-russian-threat-actors-target-microsoft-365-oauth-workflows/
has_investigation_guide: true
risk_score: 73
