technique_id: T1003.002
technique_name: Sensitive Registry Hive Access via RegBack
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and\n event.action == \"open\" and\
  \ event.outcome == \"success\" and process.executable != null and \n file.path :\n\
  \      (\"?:\\\\Windows\\\\System32\\\\config\\\\RegBack\\\\SAM\",\n       \"?:\\\
  \\Windows\\\\System32\\\\config\\\\RegBack\\\\SECURITY\",\n       \"?:\\\\Windows\\\
  \\System32\\\\config\\\\RegBack\\\\SYSTEM\") and \n not (\n    user.id == \"S-1-5-18\"\
  \ and process.executable : (\n        \"?:\\\\Windows\\\\system32\\\\taskhostw.exe\"\
  , \"?:\\\\Windows\\\\system32\\\\taskhost.exe\"\n    ))"
explanation: Identifies attempts to access sensitive registry hives which contain
  credentials from the registry backup folder.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/63e381a6-0ffe-4afb-9a26-72a59ad16d7b.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Administrators can export registry hives for backup purposes. Check whether
    the user is legitamitely performing this kind of activity.


    ### Related rules


    - Registry Hive File Creation via SMB - a4c7473a-5cb4-4bc1-9d06-e4a75adbc494


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved hosts to prevent further post-compromise behavior.

    - Investigate credential exposure on systems compromised or'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
