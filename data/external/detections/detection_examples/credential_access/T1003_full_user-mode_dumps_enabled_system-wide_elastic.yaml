technique_id: T1003
technique_name: Full User-Mode Dumps Enabled System-Wide
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "registry where host.os.type == \"windows\" and\n    registry.path : (\n  \
  \      \"HKLM\\\\SOFTWARE\\\\Microsoft\\\\Windows\\\\Windows Error Reporting\\\\\
  LocalDumps\\\\DumpType\",\n        \"\\\\REGISTRY\\\\MACHINE\\\\SOFTWARE\\\\Microsoft\\\
  \\Windows\\\\Windows Error Reporting\\\\LocalDumps\\\\DumpType\"\n    ) and\n  \
  \  registry.data.strings : (\"2\", \"0x00000002\") and\n    not (process.executable\
  \ : \"?:\\\\Windows\\\\system32\\\\svchost.exe\" and user.id : (\"S-1-5-18\", \"\
  S-1-5-19\", \"S-1-5-20\"))"
explanation: 'Identifies the enable of the full user-mode dumps feature system-wide.
  This feature allows Windows Error Reporting (WER)

  to collect data after an application crashes. This setting is a requirement for
  the LSASS Shtinkering attack, which

  fakes the communication of a crash on LSASS, generating a dump of the process memory,
  which gives the attacker access to

  the credentials present on the system without having to bring malware to the system.
  This setting is not enabled by

  default, and applications must create their registry subkeys to hold settings that
  enable them to collect dumps.'
source: Elastic Detection Rules
