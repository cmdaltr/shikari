false_positives:
- description: 'False positive analysis


    - Routine administrative tasks using VaultCmd for legitimate credential management
    can trigger alerts. To manage this, create exceptions for known administrative
    accounts or scheduled tasks that regularly use VaultCmd with the /list argument.

    - Security software or system management tools that perform regular audits of
    stored credentials might also cause false positives. Identify these tools and
    exclude their processes from triggering the rule.

