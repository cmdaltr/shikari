technique_id: T1555.004
technique_name: Searching for Saved Credentials via VaultCmd
tactic: credential_access
platform: Elastic
fidelity_score: 0.9
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (?process.pe.original_file_name:\"vaultcmd.exe\" or process.name:\"vaultcmd.exe\"\
  ) and\n  process.args:\"/list*\""
explanation: 'Windows Credential Manager allows you to create, view, or delete saved
  credentials for signing into websites, connected

  applications, and networks. An adversary may abuse this to list or dump credentials
  stored in the Credential Manager for

  saved usernames and passwords. This may also be performed in preparation of lateral
  movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/be8afaed-4bcd-4e0a-b5f9-5562003dde81.toml
