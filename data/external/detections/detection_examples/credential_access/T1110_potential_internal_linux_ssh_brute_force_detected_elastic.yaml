technique_id: T1110
technique_name: Potential Internal Linux SSH Brute Force Detected
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by host.id, source.ip, user.name with maxspan=15s\n  [ authentication\
  \ where host.os.type == \"linux\" and \n   event.action in (\"ssh_login\", \"user_login\"\
  ) and event.outcome == \"failure\" and\n   cidrmatch(source.ip, \"10.0.0.0/8\",\
  \ \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \"192.0.0.0/24\",\n  \
  \     \"192.0.0.0/29\", \"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\", \"\
  192.0.0.170/32\", \"192.0.0.171/32\",\n       \"192.0.2.0/24\", \"192.31.196.0/24\"\
  , \"192.52.193.0/24\", \"192.168.0.0/16\", \"192.88.99.0/24\", \"224.0.0.0/4\",\n\
  \       \"100.64.0.0/10\", \"192.175.48.0/24\",\"198.18.0.0/15\", \"198.51.100.0/24\"\
  , \"203.0.113.0/24\", \"240.0.0.0/4\", \n       \"::1\", \"FE80::/10\", \"FF00::/8\"\
  ) ] with runs = 10"
explanation: 'Identifies multiple internal consecutive login failures targeting a
  user account from the same source address within a

  short time interval. Adversaries will often brute force login attempts across multiple
  users with a common or known

  password, in an attempt to gain access to these accounts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1c27fa22-7727-4dd3-81c0-de6da5555feb.toml
query_type: eql
query_language: eql
indicators:
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Authentication misconfiguration or obsolete credentials.

    - Service account password expired.

    - Infrastructure or availability issue.


    ### Related Rules


    - Potential External Linux SSH Brute Force Detected - fa210b61-b627-4e5e-86f4-17e8270656ab

    - Potential SSH Password Guessing - 8cb84371-d053-4f4f-bce0-c74990e28f28


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved hosts to prevent further'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
