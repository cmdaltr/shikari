technique_id: T1555
technique_name: Azure Key Vault Secret Key Usage by Unusual Identity
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset : \"azure.platformlogs\" and\nevent.outcome: \"success\" and\n\
  event.action : (\n    \"VaultGet\" or\n    \"KeyGet\" or\n    \"KeyList\" or\n \
  \   \"KeyListVersions\" or\n    \"KeyGetDeleted\" or\n    \"KeyListDeleted\" or\n\
  \    \"SecretGet\" or\n    \"SecretList\" or\n    \"SecretListVersions\" or\n  \
  \  \"SecretGetDeleted\" or\n    \"SecretListDeleted\" or\n    \"CertificateGet\"\
  \ or\n    \"CertificateList\" or\n    \"CertificateListVersions\" or\n    \"CertificateGetDeleted\"\
  \ or\n    \"CertificateListDeleted\" or\n    \"CertificatePolicyGet\" or\n    \"\
  CertificateContactsGet\" or\n    \"CertificateIssuerGet\" or\n    \"CertificateIssuersList\"\
  \n) and azure.platformlogs.identity.claim.upn: * and azure.platformlogs.properties.id:\
  \ *"
explanation: 'Identifies secrets, keys, or certificates retrieval operations from
  Azure Key Vault by a user principal that has not

  been seen previously doing so in a certain amount of days. Azure Key Vault is a
  cloud service for securely storing and accessing secrets,

  keys, and certificates. Unauthorized or excessive retrievals may indicate potential
  abuse or unauthorized access

  attempts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/75c53838-5dcd-11f0-829c-f661ea17fbcd.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Azure Platform Logs
  confidence: high
- type: data_source
  value: Azure Key Vault
  confidence: high
false_positives:
- description: 'False positive analysis

    - Routine administrative tasks or automated scripts may trigger excessive retrievals,
    especially in environments where Key Vaults are heavily utilized for application
    configurations or secrets management. If this is expected behavior, consider adjusting
    the rule or adding exceptions for specific applications or user principals.

    - Legitimate applications or services may perform frequent retrievals of keys
    or secrets for operational purposes, such as configuration updates o'
  mitigation: Review investigation guide for details
references:
- https://www.inversecos.com/2022/05/detection-and-compromise-azure-key.html
has_investigation_guide: true
risk_score: 43
