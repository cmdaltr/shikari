technique_id: T1555.006
technique_name: Excessive Secret or Key Retrieval from Azure Key Vault
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "from logs-azure.platformlogs-* metadata _id, _index\n\n// Filter for Azure\
  \ Key Vault read operations\n| where event.dataset == \"azure.platformlogs\"\n \
  \ and event.action in (\n    \"VaultGet\",\n    \"KeyGet\",\n    \"KeyList\",\n\
  \    \"KeyListVersions\",\n    \"KeyGetDeleted\",\n    \"KeyListDeleted\",\n   \
  \ \"SecretGet\",\n    \"SecretList\",\n    \"SecretListVersions\",\n    \"SecretGetDeleted\"\
  ,\n    \"SecretListDeleted\",\n    \"CertificateGet\",\n    \"CertificateList\"\
  ,\n    \"CertificateListVersions\",\n    \"CertificateGetDeleted\",\n    \"CertificateListDeleted\"\
  ,\n    \"CertificatePolicyGet\",\n    \"CertificateContactsGet\",\n    \"CertificateIssuerGet\"\
  ,\n    \"CertificateIssuersList\"\n  )\n\n// Truncate timestamps into 1-minute windows\n\
  | eval Esql.time_window_date_trunc = date_trunc(1 minute, @timestamp)\n\n// Aggregate\
  \ identity, geo, resource, and activity info\n| stats\n    Esql_priv.azure_platformlogs_identity_claim_upn_values\
  \ = values(azure.platformlogs.identity.claim.upn),\n    Esql.azure_platformlogs_identity_claim_upn_count_distinct\
  \ = count_distinct(azure.platformlogs.identity.claim.upn),\n    Esql.azure_platformlogs_identity_claim_appid_values\
  \ = values(azure.platformlogs.identity.claim.appid),\n\n    Esql.source_ip_values\
  \ = values(source.ip),\n    Esql.source_geo_city_values = values(source.geo.city_name),\n\
  \    Esql.source_geo_region_values = values(source.geo.region_name),\n    Esql.source_geo_country_values\
  \ = values(source.geo.country_name),\n    Esql.source_as_organization_name_values\
  \ = values(source.as.organization.name),\n\n    Esql.event_action_values = values(event.action),\n\
  \    Esql.event_count = count(*),\n    Esql.event_action_count_distinct = count_distinct(event.action),\n\
  \    Esql.azure_resource_name_count_distinct = count_distinct(azure.resource.name),\n\
  \    Esql.azure_resource_name_values = values(azure.resource.name),\n    Esql.azure_platformlogs_result_type_values\
  \ = values(azure.platformlogs.result_type),\n    Esql.cloud_region_values = values(cloud.region),\n\
  \n    Esql.agent_name_values = values(agent.name),\n    Esql.azure_subscription_id_values\
  \ = values(azure.subscription_id),\n    Esql.azure_resource_group_values = values(azure.resource.group),\n\
  \    Esql.azure_resource_id_values = values(azure.resource.id)\n\nby Esql.time_window_date_trunc,\
  \ azure.platformlogs.identity.claim.upn\n\n// keep relevant fields\n| keep\n   \
  \ Esql.time_window_date_trunc,\n    Esql_priv.azure_platformlogs_identity_claim_upn_values,\n\
  \    Esql.azure_platformlogs_identity_claim_upn_count_distinct,\n    Esql.azure_platformlogs_identity_claim_appid_values,\n\
  \    Esql.source_ip_values,\n    Esql.source_geo_city_values,\n    Esql.source_geo_region_values,\n\
  \    Esql.source_geo_country_values,\n    Esql.source_as_organization_name_values,\n\
  \    Esql.event_action_values,\n    Esql.event_count,\n    Esql.event_action_count_distinct,\n\
  \    Esql.azure_resource_name_count_distinct,\n    Esql.azure_resource_name_values,\n\
  \    Esql.azure_platformlogs_result_type_values,\n    Esql.cloud_region_values,\n\
  \    Esql.agent_name_values,\n    Esql.azure_subscription_id_values,\n    Esql.azure_resource_group_values,\n\
  \    Esql.azure_resource_id_values\n\n// Filter for suspiciously high volume of\
  \ distinct Key Vault reads by a single actor\n| where Esql.azure_platformlogs_identity_claim_upn_count_distinct\
  \ == 1 and Esql.event_count >= 10 and Esql.event_action_count_distinct >= 2\n\n\
  | sort Esql.time_window_date_trunc desc"
explanation: 'Identifies excessive secret or key retrieval operations from Azure Key
  Vault. This rule detects when a user principal

  retrieves secrets or keys from Azure Key Vault multiple times within a short time
  frame, which may indicate potential

  abuse or unauthorized access attempts. The rule focuses on high-frequency retrieval
  operations that deviate from normal

  user behavior, suggesting possible credential harvesting or misuse of sensitive
  information.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c07f7898-5dc3-11f0-9f27-f661ea17fbcd.toml
query_type: esql
query_language: esql
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Azure Platform Logs
  confidence: high
- type: data_source
  value: Azure Key Vault
  confidence: high
false_positives:
- description: 'False positive analysis

    - Routine administrative tasks or automated scripts may trigger excessive retrievals,
    especially in environments where Key Vaults are heavily utilized for application
    configurations or secrets management. If this is expected behavior, consider adjusting
    the rule or adding exceptions for specific applications or user principals.

    - Legitimate applications or services may perform frequent retrievals of keys
    or secrets for operational purposes, such as configuration updates o'
  mitigation: Review investigation guide for details
references:
- https://www.inversecos.com/2022/05/detection-and-compromise-azure-key.html
has_investigation_guide: true
risk_score: 43
