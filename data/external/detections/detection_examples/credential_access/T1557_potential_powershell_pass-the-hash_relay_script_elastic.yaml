technique_id: T1557
technique_name: Potential PowerShell Pass-the-Hash/Relay Script
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    (\"NTLMSSPNegotiate\" and (\"NegotiateSMB\" or \"NegotiateSMB2\")) or\n\
  \    \"4E544C4D53535000\" or\n    \"0x4e,0x54,0x4c,0x4d,0x53,0x53,0x50\" or\n  \
  \  \"0x4e,0x54,0x20,0x4c,0x4d\" or\n    \"0x53,0x4d,0x42,0x20,0x32\" or\n    \"\
  0x81,0xbb,0x7a,0x36,0x44,0x98,0xf1,0x35,0xad,0x32,0x98,0xf0,0x38\"\n  ) and\n  not\
  \ file.directory : \"C:\\ProgramData\\Microsoft\\Windows Defender Advanced Threat\
  \ Protection\\Downloads\""
explanation: 'Detects PowerShell scripts that can execute pass-the-hash (PtH) attacks,
  intercept and relay NTLM challenges, and carry

  out other man-in-the-middle (MitM) attacks.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/951779c2-82ad-4a6c-82b8-296c1f691449.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate system processes may occasionally trigger the rule if they perform
    operations that mimic NTLM negotiation patterns. To manage this, users can create
    exceptions for specific processes known to be safe by excluding their file paths
    or hashes.

    - Security tools or network monitoring solutions that perform NTLM authentication
    checks might generate false positives. Users should identify these tools and exclude
    their associated scripts or directories from the detec'
  mitigation: Review investigation guide for details
references:
- https://github.com/Kevin-Robertson/Invoke-TheHash/blob/master/Invoke-WMIExec.ps1
- https://github.com/Kevin-Robertson/Invoke-TheHash/blob/master/Invoke-SMBExec.ps1
- https://github.com/dafthack/Check-LocalAdminHash/blob/master/Check-LocalAdminHash.ps1
- https://github.com/nettitude/PoshC2/blob/master/resources/modules/Invoke-Tater.ps1
- https://github.com/Kevin-Robertson/Inveigh/blob/master/Inveigh.ps1
has_investigation_guide: true
risk_score: 73
