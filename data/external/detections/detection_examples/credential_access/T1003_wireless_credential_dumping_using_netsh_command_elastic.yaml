technique_id: T1003
technique_name: Wireless Credential Dumping using Netsh Command
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (process.name : \"netsh.exe\" or ?process.pe.original_file_name == \"netsh.exe\"\
  ) and\n  process.args : \"wlan\" and process.args : \"key*clear\""
explanation: Identifies attempts to dump Wireless saved access keys in clear text
  using the Windows built-in utility Netsh.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2de87d72-ee0c-43e2-b975-5f0b029ac600.toml
