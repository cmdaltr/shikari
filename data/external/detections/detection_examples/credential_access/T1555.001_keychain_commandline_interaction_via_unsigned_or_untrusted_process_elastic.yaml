technique_id: T1555.001
technique_name: Keychain CommandLine Interaction via Unsigned or Untrusted Process
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and event.action == \"exec\" and\n  process.args like (\"/Users/*/Library/Keychains/*\"\
  , \"/Library/Keychains/*\", \"login.keychain-db\", \"login.keychain\") and \n  ((process.code_signature.trusted\
  \ == false or process.code_signature.exists == false) or \n   (process.name in (\"\
  bash\", \"sh\", \"zsh\", \"osascript\", \"cat\", \"echo\", \"cp\") and \n   (process.parent.code_signature.trusted\
  \ == false or process.parent.code_signature.exists == false)))"
explanation: 'Adversaries may collect the keychain storage data from a system to acquire
  credentials. Keychains are the built-in way

  for macOS to keep track of users'' passwords and credentials for many services and
  features such as WiFi passwords,

  websites, secure notes and certificates.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/96e90768-c3b7-4df6-b5d9-6237f8bc36a8.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Processes related to legitimate security applications like Microsoft Defender,
    JumpCloud Agent, and Rapid7 IR Agent may trigger false positives. Users can mitigate
    this by ensuring these applications are included in the exclusion list for process
    executables and effective parent executables.

    - Routine administrative tasks involving keychain management, such as setting
    keychain settings or importing certificates, might be flagged. To handle this,
    users should add these'
  mitigation: Review investigation guide for details
references:
- https://objective-see.com/blog/blog_0x25.html
- https://securelist.com/calisto-trojan-for-macos/86543/
has_investigation_guide: true
risk_score: 73
