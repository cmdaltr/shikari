technique_id: T1556
technique_name: Potential Shadow Credentials added to AD Object
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.code:\"5136\" and winlog.event_data.AttributeLDAPDisplayName:\"msDS-KeyCredentialLink\"\
  \ and\n  winlog.event_data.AttributeValue :B\\:828* and\n  not winlog.event_data.SubjectUserName:\
  \ MSOL_*"
explanation: 'Identify the modification of the msDS-KeyCredentialLink attribute in
  an Active Directory Computer or User Object.

  Attackers can abuse control over the object and create a key pair, append to raw
  public key in the attribute, and obtain

  persistent and stealthy access to the target user or computer object.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/79f97b31-480e-4e63-a7f4-ede42bf2c6de.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Administrators might use custom accounts on Azure AD Connect. If this is the
    case, make sure the account is properly secured. You can also create an exception
    for the account if expected activity makes too much noise in your environment.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Investigate credential exposure on systems compromised or used by the attacker
    to ensure all compromised accounts are identif'
  mitigation: Review investigation guide for details
references:
- https://posts.specterops.io/shadow-credentials-abusing-key-trust-account-mapping-for-takeover-8ee1a53566ab
- https://www.thehacker.recipes/ad/movement/kerberos/shadow-credentials
- https://github.com/OTRF/Set-AuditRule
- https://cyberstoph.org/posts/2022/03/detecting-shadow-credentials/
has_investigation_guide: true
risk_score: 73
