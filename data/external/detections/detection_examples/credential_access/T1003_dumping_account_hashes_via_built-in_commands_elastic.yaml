technique_id: T1003
technique_name: Dumping Account Hashes via Built-In Commands
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n process.name in (\"defaults\", \"mkpassdb\") and process.args like~ (\"\
  ShadowHashData\", \"-dump\")"
explanation: 'Identifies the execution of macOS built-in commands used to dump user
  account hashes. Adversaries may attempt to dump

  credentials to obtain account login information in the form of a hash. These hashes
  can be cracked or leveraged for

  lateral movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/02ea4563-ec10-4974-b7de-12e65aa4f9b3.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - System administrators or security tools may legitimately use the `defaults`
    or `mkpassdb` commands for system maintenance or auditing purposes. To manage
    these, create exceptions for known administrative accounts or tools that regularly
    execute these commands.

    - Automated scripts or management software might invoke these commands as part
    of routine operations. Identify and whitelist these scripts or software to prevent
    unnecessary alerts.

    - Developers or IT personnel m'
  mitigation: Review investigation guide for details
references:
- https://apple.stackexchange.com/questions/186893/os-x-10-9-where-are-password-hashes-stored
- https://www.unix.com/man-page/osx/8/mkpassdb/
has_investigation_guide: true
risk_score: 73
