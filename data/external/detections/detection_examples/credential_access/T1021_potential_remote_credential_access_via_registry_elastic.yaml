technique_id: T1021
technique_name: Potential Remote Credential Access via Registry
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and\n  event.action == \"creation\"\
  \ and process.name : \"svchost.exe\" and\n  file.Ext.header_bytes : \"72656766*\"\
  \ and user.id : (\"S-1-5-21-*\", \"S-1-12-1-*\") and file.size >= 30000 and\n  file.path\
  \ : (\"?:\\\\Windows\\\\system32\\\\*.tmp\", \"?:\\\\WINDOWS\\\\Temp\\\\*.tmp\")"
explanation: 'Identifies remote access to the registry to potentially dump credential
  data from the Security Account Manager (SAM)

  registry hive in preparation for credential access and privileges elevation.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/850d901a-2a3c-46c6-8b22-55398a01aad8.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


