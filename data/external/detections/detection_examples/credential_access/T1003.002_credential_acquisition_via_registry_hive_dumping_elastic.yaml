technique_id: T1003.002
technique_name: Credential Acquisition via Registry Hive Dumping
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (?process.pe.original_file_name == \"reg.exe\" or process.name : \"reg.exe\")\
  \ and\n process.args : (\"save\", \"export\") and\n process.args : (\"hklm\\\\sam\"\
  , \"hklm\\\\security\")"
explanation: Identifies attempts to export a registry hive which may contain credentials
  using the Windows reg.exe tool.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a7e7bfa3-088e-4f13-b29e-3986e0e756b8.toml
