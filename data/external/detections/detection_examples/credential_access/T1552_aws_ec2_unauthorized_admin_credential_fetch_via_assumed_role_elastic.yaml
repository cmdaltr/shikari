technique_id: T1552
technique_name: AWS EC2 Unauthorized Admin Credential Fetch via Assumed Role
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:\"aws.cloudtrail\"\n    and event.provider:\"ec2.amazonaws.com\"\
  \ and event.action:\"GetPasswordData\"\n    and aws.cloudtrail.user_identity.type:\"\
  AssumedRole\" and aws.cloudtrail.error_code:\"Client.UnauthorizedOperation\""
explanation: 'Identifies the first occurrence of an unauthorized attempt by an AWS
  role to use `GetPassword` to access the administrator password of an EC2 instance.

  Adversaries may use this API call to escalate privileges or move laterally within
  EC2 instances.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8446517c-f789-11ee-8ad0-f661ea17fbce.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS EC2
  confidence: high
false_positives:
- description: 'False Positive Analysis


    - **Legitimate Administrative Actions**: Ensure that the activity was not part
    of legitimate administrative tasks such as system maintenance or updates.

    - **Automation Scripts**: Verify if the activity was generated by automation or
    deployment scripts that are authorized to use `GetPasswordData` for legitimate
    purposes.


    ### Response and Remediation


    - **User Account Review**: Review the permissions of the implicated user identity.
    Apply the principle of least privilege'
  mitigation: Review investigation guide for details
references:
- https://cloud.hacktricks.xyz/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ec2-privesc
has_investigation_guide: true
risk_score: 47
