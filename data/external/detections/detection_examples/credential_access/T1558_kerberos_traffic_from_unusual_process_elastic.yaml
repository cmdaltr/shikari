query: "network where host.os.type == \"windows\" and event.type == \"start\" and\
  \ network.direction == \"egress\" and\n  destination.port == 88 and source.port\
  \ >= 49152 and process.pid != 4 and destination.address : \"*\" and\n  not \n  (\n\
