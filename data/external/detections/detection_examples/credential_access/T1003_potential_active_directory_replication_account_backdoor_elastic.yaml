technique_id: T1003
technique_name: Potential Active Directory Replication Account Backdoor
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.code:\"5136\" and\n  winlog.event_data.AttributeLDAPDisplayName:\"nTSecurityDescriptor\"\
  \ and\n  winlog.event_data.AttributeValue : (\n    (\n      *1131f6ad-9c07-11d1-f79f-00c04fc2dcd2;;S-1-5-21-*\
  \ and\n      *1131f6aa-9c07-11d1-f79f-00c04fc2dcd2;;S-1-5-21-* and\n      *89e95b76-444d-4c62-991a-0facbeda640c;;S-1-5-21-*\n\
  \    )\n  )"
explanation: 'Identifies the modification of the nTSecurityDescriptor attribute in
  a domain object with rights related to DCSync to a

  user/computer account. Attackers can use this backdoor to re-obtain access to hashes
  of any user/computer.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f8822053-a5d2-46db-8c96-d460b12c36ac.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Changes made by authorized administrators during legitimate security audits
    or system maintenance can trigger the rule. To manage this, create exceptions
    for known administrative accounts performing regular audits.

    - Automated scripts or tools used for Active Directory management might modify
    security descriptors as part of their normal operation. Identify these scripts
    and exclude their associated accounts from triggering alerts.

    - Scheduled tasks or system processes'
  mitigation: Review investigation guide for details
