technique_id: T1555.001
technique_name: Dumping of Keychain Content via Security Command
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n process.args like~ \"dump-keychain\" and process.args == \"-d\""
explanation: 'Adversaries may dump the content of the keychain storage data from a
  system to acquire credentials. Keychains are the

  built-in way for macOS to keep track of users'' passwords and credentials for many
  services and features, including Wi-Fi

  and website passwords, secure notes, certificates, and Kerberos.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/565d6ca5-75ba-4c82-9b13-add25353471c.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative tasks or system maintenance activities may trigger
    the rule if they involve keychain access. Users should review the context of the
    process initiation to determine if it aligns with routine administrative operations.

    - Security or IT tools that perform regular audits or backups of keychain data
    might be flagged. Users can create exceptions for these tools by identifying their
    specific process names or paths and excluding them from the rule.

    -'
  mitigation: Review investigation guide for details
references:
- https://ss64.com/osx/security.html
has_investigation_guide: true
risk_score: 73
