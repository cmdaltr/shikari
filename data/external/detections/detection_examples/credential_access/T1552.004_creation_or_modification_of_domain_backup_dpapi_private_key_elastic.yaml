technique_id: T1552.004
technique_name: Creation or Modification of Domain Backup DPAPI private key
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'file where host.os.type == "windows" and event.type != "deletion" and file.name
  : ("ntds_capi_*.pfx", "ntds_capi_*.pvk")'
explanation: 'Identifies the creation or modification of Domain Backup private keys.
  Adversaries may extract the Data Protection API

  (DPAPI) domain backup key from a Domain Controller (DC) to be able to decrypt any
  domain user master key file.'
