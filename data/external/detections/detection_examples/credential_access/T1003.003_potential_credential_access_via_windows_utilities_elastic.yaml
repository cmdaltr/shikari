technique_id: T1003.003
technique_name: Potential Credential Access via Windows Utilities
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  (\n  (\n    (?process.pe.original_file_name : \"procdump\" or process.name : \"\
  procdump.exe\") and process.args : \"-ma\"\n  ) or\n  (\n    process.name : \"ProcessDump.exe\"\
  \ and not process.parent.executable regex~ \"\"\"C:\\\\Program Files( \\(x86\\))?\\\
  \\Cisco Systems\\\\.* \"\"\"  ) or\n  (\n    (?process.pe.original_file_name : \"\
  WriteMiniDump.exe\" or process.name : \"WriteMiniDump.exe\") and\n      not process.parent.executable\
  \ regex~ \"\"\"C:\\\\Program Files( \\(x86\\))?\\\\Steam\\\\.* \"\"\"  ) or\n  (\n\
  \    (?process.pe.original_file_name : \"RUNDLL32.EXE\" or process.name : \"RUNDLL32.exe\"\
  ) and\n      (process.args : \"*MiniDump*\" or process.command_line : \"*comsvcs*#*24*\"\
  )\n  ) or\n  (\n    (?process.pe.original_file_name : \"RdrLeakDiag.exe\" or process.name\
  \ : \"RdrLeakDiag.exe\") and\n      process.args : \"/fullmemdmp\"\n  ) or\n  (\n\
  \    (?process.pe.original_file_name : \"SqlDumper.exe\" or process.name : \"SqlDumper.exe\"\
  ) and\n      process.args : \"0x01100*\") or\n  (\n    (?process.pe.original_file_name\
  \ : \"TTTracer.exe\" or process.name : \"TTTracer.exe\") and\n      process.args\
  \ : \"-dumpFull\" and process.args : \"-attach\") or\n  (\n    (?process.pe.original_file_name\
  \ : \"ntdsutil.exe\" or process.name : \"ntdsutil.exe\") and\n      process.args\
  \ : \"cr*fu*\") or\n  (\n    (?process.pe.original_file_name : \"diskshadow.exe\"\
  \ or process.name : \"diskshadow.exe\") and process.args : \"/s\")\n)"
explanation: 'Identifies the execution of known Windows utilities often abused to
  dump LSASS memory or the Active Directory database

  (NTDS.dit) in preparation for credential access.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/00140285-b827-4aee-aa09-8113f58a08f3.toml
