technique_id: T1098
technique_name: Sensitive Privilege SeEnableDelegationPrivilege assigned to a User
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.code:4704 and winlog.event_data.PrivilegeList:"SeEnableDelegationPrivilege"
explanation: 'Identifies the assignment of the SeEnableDelegationPrivilege sensitive
  "user right" to a user. The

  SeEnableDelegationPrivilege "user right" enables computer and user accounts to be
  trusted for delegation. Attackers can

  abuse this right to compromise Active Directory accounts and elevate their privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f494c678-3c33-43aa-b169-bb3d5198c41d.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


