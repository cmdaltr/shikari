technique_id: T1218
technique_name: Potential Local NTLM Relay via HTTP
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"rundll32.exe\" and\n\n  /* Rundll32 WbeDav Client  */\n  process.args\
  \ : (\"?:\\\\Windows\\\\System32\\\\davclnt.dll,DavSetCookie\", \"?:\\\\Windows\\\
  \\SysWOW64\\\\davclnt.dll,DavSetCookie\") and\n\n  /* Access to named pipe via http\
  \ */\n  process.args : (\"http*/print/pipe/*\", \"http*/pipe/spoolss\", \"http*/pipe/srvsvc\"\
  )"
explanation: 'Identifies attempt to coerce a local NTLM authentication via HTTP using
  the Windows Printer Spooler service as a target.

  An adversary may use this primitive in combination with other techniques to elevate
  privileges on a compromised system.'
source: Elastic Detection Rules
