false_positives:
- description: 'False positive analysis


    - Scheduled backups by legitimate IT staff can trigger the rule. Verify the identity
    and role of the user executing wbadmin and consider excluding known backup schedules
    from detection.

    - Automated recovery processes in disaster recovery plans might use wbadmin with
    similar arguments. Review and whitelist these processes if they are part of approved
    recovery procedures.

    - Security audits or compliance checks may involve accessing NTDS.dit for validation
    purposes. Confirm'
  mitigation: Review investigation guide for details
references:
- https://medium.com/r3d-buck3t/windows-privesc-with-sebackupprivilege-65d2cd1eb960
has_investigation_guide: true
