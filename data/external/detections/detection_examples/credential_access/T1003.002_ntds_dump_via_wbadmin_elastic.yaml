technique_id: T1003.002
technique_name: NTDS Dump via Wbadmin
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \    (process.name : \"wbadmin.exe\" or ?process.pe.original_file_name : \"wbadmin.exe\"\
  ) and\n     process.args : \"recovery\" and process.command_line : \"*ntds.dit*\""
explanation: 'Identifies the execution of wbadmin to access the NTDS.dit file in a
  domain controller. Attackers with privileges from

  groups like Backup Operators can abuse the utility to perform credential access
  and compromise the domain.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d93e61db-82d6-4095-99aa-714988118064.toml
query_type: eql
query_language: eql
