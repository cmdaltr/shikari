false_positives:
- description: 'False positive analysis


    - Legitimate administrative tools or scripts that manage Kerberos tickets may
    create .kirbi files as part of their normal operations. Review the context of
    the file creation event to determine if it aligns with expected administrative
    activities.

    - Scheduled tasks or automated processes that involve Kerberos ticket management
    might trigger this rule. Identify and document these processes, and consider creating
    exceptions for known, benign activities.

    - Security software'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
