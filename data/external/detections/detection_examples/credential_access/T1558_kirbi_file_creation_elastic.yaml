technique_id: T1558
technique_name: Kirbi File Creation
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'file where host.os.type == "windows" and event.type == "creation" and file.extension
  : "kirbi"'
explanation: 'Identifies the creation of .kirbi files. The creation of this kind of
  file is an indicator of an attacker running

  Kerberos ticket dump utilities, such as Mimikatz, and precedes attacks such as Pass-The-Ticket
  (PTT), which allows the

  attacker to impersonate users using Kerberos tickets.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b8f8da2d-a9dc-48c0-90e4-955c0aa1259a.toml
query_type: eql
query_language: eql
