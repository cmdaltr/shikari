technique_id: T1110
technique_name: AWS Management Console Brute Force of Root User Identity
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset:aws.cloudtrail and\nevent.provider:signin.amazonaws.com and\
  \ \nevent.action:ConsoleLogin and \naws.cloudtrail.user_identity.type:Root and \n\
  event.outcome:failure"
explanation: 'Identifies a high number of failed authentication attempts to the AWS
  management console for the Root user identity. An

  adversary may attempt to brute force the password for the Root user identity, as
  it has complete access to all services

  and resources for the AWS account.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/4d50a94f-2844-43fa-8395-6afbd5e1c5ef.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS Sign-In
  confidence: high
false_positives:
- description: "False positive analysis\n\n- **Forgotten or mistyped credentials.**\
    \  \n  Repeated failed logins from known internal IPs could indicate a legitimate\
    \ user typing errors. Validate by checking if a successful root login followed\
    \ soon after.  \n- **Automation or scanners.**  \n  Misconfigured monitoring tools\
    \ or old browser sessions attempting to reuse cached credentials may trigger this\
    \ rule.  \n- **Planned penetration testing.**  \n  Red-team or security testing\
    \ activities can generate deliberate brute fo"
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
has_investigation_guide: true
risk_score: 73
