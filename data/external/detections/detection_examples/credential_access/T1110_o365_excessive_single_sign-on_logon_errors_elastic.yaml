technique_id: T1110
technique_name: O365 Excessive Single Sign-On Logon Errors
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.dataset:o365.audit and event.provider:AzureActiveDirectory and event.category:authentication
  and o365.audit.LogonError:"SsoArtifactInvalidOrExpired"
explanation: 'Identifies accounts with a high number of single sign-on (SSO) logon
  errors. Excessive logon errors may indicate an

  attempt to brute force a password or SSO token.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2de10e77-c144-4e69-afb7-344e7127abd0.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: Microsoft 365
  confidence: high
false_positives:
- description: 'False positive analysis


    - High volume of legitimate user logins: Users who frequently log in and out of
    multiple O365 applications may trigger excessive logon errors. To manage this,
    create exceptions for known high-activity accounts.

    - Automated scripts or applications: Some automated processes may use outdated
    or incorrect credentials, leading to repeated logon errors. Identify and update
    these scripts to prevent false positives.

    - Password changes: Users who recently changed their passwords'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
