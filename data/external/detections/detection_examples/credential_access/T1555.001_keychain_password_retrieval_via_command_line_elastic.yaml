technique_id: T1555.001
technique_name: Keychain Password Retrieval via Command Line
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"macos\" and event.action == \"exec\" and\n\
  \ process.name == \"security\" and\n process.args like (\"-wa\", \"-ga\") and process.args\
  \ like~ (\"find-generic-password\", \"find-internet-password\") and\n process.command_line\
  \ : (\"*Chrome*\", \"*Chromium*\", \"*Opera*\", \"*Safari*\", \"*Brave*\", \"*Microsoft\
  \ Edge*\", \"*Firefox*\") and\n not process.parent.executable like \"/Applications/Keeper\
  \ Password Manager.app/Contents/Frameworks/Keeper Password Manager Helper*/Contents/MacOS/Keeper\
  \ Password Manager Helper*\""
explanation: 'Adversaries may collect keychain storage data from a system to in order
  to acquire credentials. Keychains are the

  built-in way for macOS to keep track of users'' passwords and credentials for many
  services and features, including Wi-Fi

  and website passwords, secure notes, certificates, and Kerberos.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9092cd6c-650f-4fa3-8a8a-28256c7489c9.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate password managers like Keeper Password Manager may trigger the rule
    due to their access to Keychain for managing user credentials. To handle this,
    ensure that the process parent executable path for such applications is added
    to the exclusion list.

    - System maintenance or administrative scripts that access Keychain for legitimate
    purposes might be flagged. Review these scripts and, if verified as safe, add
    their specific command patterns to the exception list'
  mitigation: Review investigation guide for details
references:
- https://www.netmeister.org/blog/keychain-passwords.html
- https://github.com/priyankchheda/chrome_password_grabber/blob/master/chrome.py
- https://ss64.com/osx/security.html
- https://www.intezer.com/blog/research/operation-electrorat-attacker-creates-fake-companies-to-drain-your-crypto-wallets/
has_investigation_guide: true
risk_score: 73
