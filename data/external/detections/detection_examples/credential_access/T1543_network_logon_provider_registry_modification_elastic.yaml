technique_id: T1543
technique_name: Network Logon Provider Registry Modification
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.data.strings : \"?*\" and registry.value : \"ProviderPath\" and\n  registry.path\
  \ : (\n    \"HKLM\\\\SYSTEM\\\\*ControlSet*\\\\Services\\\\*\\\\NetworkProvider\\\
  \\ProviderPath\",\n    \"\\\\REGISTRY\\\\MACHINE\\\\SYSTEM\\\\*ControlSet*\\\\Services\\\
  \\*\\\\NetworkProvider\\\\ProviderPath\"\n  ) and\n  /* Excluding default NetworkProviders\
  \ RDPNP, LanmanWorkstation and webclient. */\n  not (\n    user.id : \"S-1-5-18\"\
  \ and\n    registry.data.strings : (\n        \"%SystemRoot%\\\\System32\\\\ntlanman.dll\"\
  ,\n        \"%SystemRoot%\\\\System32\\\\drprov.dll\",\n        \"%SystemRoot%\\\
  \\System32\\\\davclnt.dll\",\n        \"%SystemRoot%\\\\System32\\\\vmhgfs.dll\"\
  ,\n        \"?:\\\\Program Files (x86)\\\\Citrix\\\\ICA Client\\\\x64\\\\pnsson.dll\"\
  ,\n        \"?:\\\\Program Files\\\\Dell\\\\SARemediation\\\\agent\\\\DellMgmtNP.dll\"\
  ,\n        \"?:\\\\Program Files (x86)\\\\CheckPoint\\\\Endpoint Connect\\\\\\\\\
  epcgina.dll\"\n    )\n  )"
explanation: 'Identifies the modification of the network logon provider registry.
  Adversaries may register a rogue network logon

  provider module for persistence and/or credential access via intercepting the authentication
  credentials in clear text

  during user logon.'
source: Elastic Detection Rules
