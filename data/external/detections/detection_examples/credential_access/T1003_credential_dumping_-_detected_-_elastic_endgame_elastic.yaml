technique_id: T1003
technique_name: Credential Dumping - Detected - Elastic Endgame
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.kind:alert and event.module:endgame and endgame.metadata.type:detection
  and (event.action:cred_theft_event or endgame.event_subtype_full:cred_theft_event)
explanation: 'Elastic Endgame detected Credential Dumping. Click the Elastic Endgame
  icon in the event.module column or the link in

  the rule.reference column for additional information.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/571afc56-5ed9-465d-a2a9-045f099f6e7e.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Elastic Endgame
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks that involve legitimate credential access tools
    may trigger alerts. Users can create exceptions for known administrative accounts
    or tools that are frequently used in these tasks.

    - Security software updates or scans that access credential stores might be flagged.
    Exclude these processes by identifying their specific event actions and adding
    them to the exception list.

    - Automated scripts for system maintenance that require credential acces'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
