technique_id: T1003
technique_name: Multiple Vault Web Credentials Read
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by winlog.computer_name, winlog.process.pid with maxspan=1s\n\n /*\
  \ 2 consecutive vault reads from same pid for web creds */\n\n [any where event.code\
  \ : \"5382\" and\n  (winlog.event_data.SchemaFriendlyName : \"Windows Web Password\
  \ Credential\" and winlog.event_data.Resource : \"http*\") and\n  not winlog.event_data.SubjectLogonId\
  \ : \"0x3e7\" and\n  not winlog.event_data.Resource : \"http://localhost/\"]\n\n\
  \ [any where event.code : \"5382\" and\n  (winlog.event_data.SchemaFriendlyName\
  \ : \"Windows Web Password Credential\" and winlog.event_data.Resource : \"http*\"\
  ) and\n  not winlog.event_data.SubjectLogonId : \"0x3e7\" and\n  not winlog.event_data.Resource\
  \ : \"http://localhost/\"]"
explanation: 'Windows Credential Manager allows you to create, view, or delete saved
  credentials for signing into websites, connected

  applications, and networks. An adversary may abuse this to list or dump credentials
  stored in the Credential Manager for

  saved usernames and passwords. This may also be performed in preparation of lateral
  movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/44fc462c-1159-4fa8-b1b7-9b6296ab4f96.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Localhost access is a common false positive since the rule excludes localhost
    reads. Ensure that any legitimate applications accessing credentials via localhost
    are properly whitelisted to prevent unnecessary alerts.

    - Automated scripts or applications that frequently access web credentials for
    legitimate purposes may trigger the rule. Identify these processes and create
    exceptions for them to reduce noise.

    - System maintenance or updates might involve credential reads'
  mitigation: Review investigation guide for details
references:
- https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=5382
- https://www.elastic.co/security-labs/detect-credential-access
has_investigation_guide: true
risk_score: 47
