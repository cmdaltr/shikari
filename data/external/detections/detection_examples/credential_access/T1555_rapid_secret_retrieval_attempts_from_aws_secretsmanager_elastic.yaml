technique_id: T1555
technique_name: Rapid Secret Retrieval Attempts from AWS SecretsManager
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:aws.cloudtrail and event.provider:secretsmanager.amazonaws.com\
  \ and\n    event.action: (GetSecretValue or BatchGetSecretValue) and event.outcome:success\
  \ and\n    not user_agent.name: (\"Chrome\" or \"Firefox\" or \"Safari\" or \"Edge\"\
  \ or \"Brave\" or \"Opera\")"
explanation: 'This rule attempts to identify rapid secret retrieval attempts from
  AWS SecretsManager. Adversaries may attempt to

  retrieve secrets from the Secrets Manager programmatically using the `GetSecretValue`
  or `BatchGetSecretValue` API

  actions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/185c782e-f86a-11ee-9d9f-f661ea17fbce.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS Secrets Manager
  confidence: high
false_positives:
- description: 'False positive analysis


    - False positives may occur due to the intended usage of the service. Tuning is
    needed in order to have higher confidence. Consider adding exceptions — preferably
    with a combination of user agent and IP address conditions.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Disable or limit the account during the investigation and response.

    - Identify the possible impact of the incident and prioritize accordingly;'
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
- https://detectioninthe.cloud/ttps/credential_access/access_secret_in_secrets_manager/
- https://cloud.hacktricks.xyz/pentesting-cloud/aws-security/aws-services/aws-secrets-manager-enum
- https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_BatchGetSecretValue.html
has_investigation_guide: true
risk_score: 47
