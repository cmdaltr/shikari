technique_id: T1059
technique_name: PowerShell Invoke-NinjaCopy script
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    \"StealthReadFile\" or\n    \"StealthReadFileAddr\" or\n    \"StealthCloseFileDelegate\"\
  \ or\n    \"StealthOpenFile\" or\n    \"StealthCloseFile\" or\n    \"StealthReadFile\"\
  \ or\n    \"Invoke-NinjaCopy\"\n   )\n  and not user.id : \"S-1-5-18\"\n  and not\
  \ powershell.file.script_block_text : (\n    \"sentinelbreakpoints\" and \"Set-PSBreakpoint\"\
  \ and \"PowerSploitIndicators\"\n  )"
explanation: 'Detects PowerShell scripts that contain the default exported functions
  used on Invoke-NinjaCopy. Attackers can use

  Invoke-NinjaCopy to read SYSTEM files that are normally locked, such as the NTDS.dit
  file or registry hives.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b8386923-b02c-4b94-986a-d223d9b01f88.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This activity is unlikely to happen legitimately. Any activity that triggered
    the alert and is not inherently malicious must be monitored by the security team.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved hosts to prevent further post-compromise behavior.

    - Restrict PowerShell usage outside of IT and engineering business units using
    GPOs, AppLocker, Intune, or similar software.

    - Inve'
  mitigation: Review investigation guide for details
references:
- https://github.com/BC-SECURITY/Empire/blob/main/empire/server/data/module_source/collection/Invoke-NinjaCopy.ps1
has_investigation_guide: true
risk_score: 73
