    can trigger false positives. To manage this, identify and whitelist known IP addresses
    associated with legitimate administrative tasks or automated processes.

    - Scheduled tasks or automated scripts that use machine accounts for network operations
    may be flagged. Review and document these tasks, then create exceptions for their
    associated IP addresses and hostnames.

    - Load balancers or pro'
  mitigation: Review investigation guide for details
