technique_id: T1003
technique_name: PowerShell Kerberos Ticket Request
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    KerberosRequestorSecurityToken\n  ) and not user.id : (\"S-1-5-18\" or\
  \ \"S-1-5-20\") and\n  not powershell.file.script_block_text : (\n    (\"sentinelbreakpoints\"\
  \ and (\"Set-PSBreakpoint\" or \"Set-HookFunctionTabs\")) or\n    (\"function global\"\
  \ and \"\\\\windows\\\\sentinel\\\\4\")\n  )"
explanation: 'Detects PowerShell scripts that have the capability of requesting kerberos
  tickets, which is a common step in

  Kerberoasting toolkits to crack service accounts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/eb610e70-f9e6-4949-82b9-f1c5bcd37c39.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - A possible false positive can be identified if the script content is not malicious/harmful
    or does not request Kerberos tickets for user accounts, as computer accounts are
    not vulnerable to Kerberoasting due to complex password requirements and policy.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Investigate credential exposure on systems compromised or used by the attacker
    to ensure all compromised accou'
  mitigation: Review investigation guide for details
references:
- https://cobalt.io/blog/kerberoast-attack-techniques
- https://github.com/EmpireProject/Empire/blob/master/data/module_source/credentials/Invoke-Kerberoast.ps1
has_investigation_guide: true
risk_score: 73
