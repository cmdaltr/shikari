technique_id: T1003
technique_name: Potential Credential Access via LSASS Memory Dump
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.code == \"10\" and\n \
  \ winlog.event_data.TargetImage : \"?:\\\\WINDOWS\\\\system32\\\\lsass.exe\" and\n\
  \n   /* DLLs exporting MiniDumpWriteDump API to create an lsass mdmp*/\n  winlog.event_data.CallTrace\
  \ : (\"*dbghelp*\", \"*dbgcore*\") and\n\n   /* case of lsass crashing */\n  not\
  \ process.executable : (\n        \"?:\\\\Windows\\\\System32\\\\WerFault.exe\"\
  ,\n        \"?:\\\\Windows\\\\SysWOW64\\\\WerFault.exe\",\n        \"?:\\\\Windows\\\
  \\System32\\\\WerFaultSecure.exe\"\n      )"
explanation: 'Identifies suspicious access to LSASS handle from a call trace pointing
  to DBGHelp.dll or DBGCore.dll, which both export

  the MiniDumpWriteDump method that can be used to dump LSASS memory content in preparation
  for credential access.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9960432d-9b26-409f-972b-839a959e79e2.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate crash handlers like WerFault.exe may access LSASS during system crashes.
    To prevent these from being flagged, ensure that the rule excludes processes such
    as WerFault.exe, WerFaultSecure.exe, and their SysWOW64 counterparts.

    - Debugging tools used by developers or IT administrators might trigger this rule
    if they access LSASS for legitimate purposes. Consider creating exceptions for
    known and trusted debugging tools within your environment.

    - Security softwa'
  mitigation: Review investigation guide for details
references:
- https://www.ired.team/offensive-security/credential-access-and-credential-dumping/dump-credentials-from-lsass-process-without-mimikatz
- https://www.elastic.co/security-labs/detect-credential-access
- https://www.elastic.co/security-labs/elastic-protects-against-data-wiper-malware-targeting-ukraine-hermeticwiper
has_investigation_guide: true
risk_score: 73
