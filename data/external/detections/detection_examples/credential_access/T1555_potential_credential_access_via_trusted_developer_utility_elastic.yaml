technique_id: T1555
technique_name: Potential Credential Access via Trusted Developer Utility
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by process.entity_id\n [process where host.os.type == \"windows\"\
  \ and event.type == \"start\" and (process.name : \"MSBuild.exe\" or process.pe.original_file_name\
  \ == \"MSBuild.exe\")]\n [any where host.os.type == \"windows\" and (event.category\
  \ == \"library\" or (event.category == \"process\" and event.action : \"Image loaded*\"\
  )) and\n  (?dll.name : (\"vaultcli.dll\", \"SAMLib.DLL\") or file.name : (\"vaultcli.dll\"\
  , \"SAMLib.DLL\"))]"
explanation: 'An instance of MSBuild, the Microsoft Build Engine, loaded DLLs (dynamically
  linked libraries) responsible for Windows

  credential management. This technique is sometimes used for credential dumping.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9d110cb3-5f4b-4c9a-b9f5-53f0a1707ae5.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
