technique_id: T1539
technique_name: WebProxy Settings Modification
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and event.action == \"exec\" and\n process.name == \"networksetup\" and process.args\
  \ like~ (\"-setwebproxy\", \"-setsecurewebproxy\", \"-setautoproxyurl\") and\n (process.parent.name\
  \ like~ (\"osascript\", \"bash\", \"sh\", \"zsh\", \"Terminal\", \"Python*\") or\
  \ (process.parent.code_signature.exists == false or process.parent.code_signature.trusted\
  \ == false))"
explanation: 'Identifies the use of the built-in networksetup command to configure
  webproxy settings. This may indicate an attempt to

  hijack web browser traffic for credential access via traffic sniffing or redirection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/10a500bb-a28f-418e-ba29-ca4c8d1a9f2f.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate applications like FreedomHelper, Fiddler Everywhere, and xpcproxy
    may trigger the rule when they modify proxy settings. To prevent these from being
    flagged, ensure they are included in the exclusion list of known applications.

    - Network management tools such as Proxyman and Incoggo might also be detected.
    Add these to the exclusion list to avoid unnecessary alerts.

    - Regular system updates or configurations by IT administrators can sometimes
    involve proxy se'
  mitigation: Review investigation guide for details
