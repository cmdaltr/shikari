technique_id: T1078
technique_name: Potential Credential Access via DCSync
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "host.os.type:\"windows\" and event.code:\"4662\" and\n  winlog.event_data.Properties:(\n\
  \    *DS-Replication-Get-Changes* or *DS-Replication-Get-Changes-All* or\n    *DS-Replication-Get-Changes-In-Filtered-Set*\
  \ or *1131f6ad-9c07-11d1-f79f-00c04fc2dcd2* or\n    *1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*\
  \ or *89e95b76-444d-4c62-991a-0facbeda640c*\n  ) and winlog.event_data.AccessMask\
  \ : \"0x100\" and\n  not winlog.event_data.SubjectUserName:(*$ or MSOL_*)"
explanation: 'This rule identifies when a User Account starts the Active Directory
  Replication Process. Attackers can use the DCSync

  technique to get credential information of individual accounts or the entire domain,
  thus compromising the entire

  domain.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9f962927-1a4f-45f3-a57b-287f2c7029c1.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Active Directory
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Administrators may use custom accounts on Azure AD Connect, investigate if it
    is the case, and if it is properly secured. If noisy in your environment due to
    expected activity, consider adding the corresponding account as a exception.

    - Although replicating Active Directory (AD) data to non-Domain Controllers is
    not a common practice and is generally not recommended from a security perspective,
    some software vendors may require it for their products to function correct'
  mitigation: Review investigation guide for details
references:
- https://threathunterplaybook.com/notebooks/windows/06_credential_access/WIN-180815210510.html
- https://threathunterplaybook.com/library/windows/active_directory_replication.html?highlight=dcsync#directory-replication-services-auditing
- https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_ad_replication_non_machine_account.yml
- https://github.com/atc-project/atomic-threat-coverage/blob/master/Atomic_Threat_Coverage/Logging_Policies/LP_0027_windows_audit_directory_service_access.md
- https://attack.stealthbits.com/privilege-escalation-using-mimikatz-dcsync
- https://www.thehacker.recipes/ad/movement/credentials/dumping/dcsync
- https://www.elastic.co/security-labs/siestagraph-new-implant-uncovered-in-asean-member-foreign-ministry
has_investigation_guide: true
risk_score: 47
