technique_id: T1555.006
technique_name: First Time Seen AWS Secret Value Accessed in Secrets Manager
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:aws.cloudtrail and event.provider:secretsmanager.amazonaws.com\
  \ and\n    event.action: (GetSecretValue or BatchGetSecretValue) and event.outcome:success\
  \ and\n    not user_agent.name: (\"Chrome\" or \"Firefox\" or \"Safari\" or \"Edge\"\
  \ or \"Brave\" or \"Opera\")"
explanation: 'An adversary with access to a compromised AWS service such as an EC2
  instance, Lambda function, or other service may

  attempt to leverage the compromised service to access secrets in AWS Secrets Manager.
  This rule looks for the first time

  a specific user identity has programmatically retrieved a secret value from Secrets
  Manager using the `GetSecretValue`

  or `BatchGetSecretValue` actions. This rule assumes that AWS services such as Lambda
  functions and EC2 instances are

  setup with IAM role''s assigned that have the necessary permissions to access the
  secrets in Secrets Manager. An

  adversary with access to a compromised AWS service would rely on its'' attached
  role to access the secrets in Secrets Manager.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a00681e3-9ed6-447c-ab2c-be648821c622.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS Secrets Manager
  confidence: high
false_positives:
- description: 'False positive analysis


    - Review `actor.entity.id` and `target.entity.id` values for expected combinations
    of identity and secret value access. If this is an expected behavior, consider
    adding exceptions to the rule.

    - False positives may occur due to the intended usage of the service. Tuning is
    needed in order to have higher confidence. Consider adding exceptions — preferably
    with a combination of user agent and IP address conditions.


    ### Response and remediation


    - Initiate the incident resp'
  mitigation: Review investigation guide for details
