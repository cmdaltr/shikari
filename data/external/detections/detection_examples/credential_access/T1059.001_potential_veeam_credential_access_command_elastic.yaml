false_positives:
- description: 'False positive analysis


    - Routine database maintenance tasks may trigger the rule if they involve accessing
    Veeam credentials for legitimate purposes. To manage this, identify and document
    regular maintenance schedules and exclude these activities from triggering alerts.

    - Automated scripts used for backup verification or testing might use similar
    commands. Review and whitelist these scripts by their process names or specific
    arguments to prevent unnecessary alerts.

    - Internal security audits o'
