technique_id: T1059.001
technique_name: Potential Veeam Credential Access Command
tactic: credential_access
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n    (process.name : \"sqlcmd.exe\" or ?process.pe.original_file_name : \"\
  sqlcmd.exe\") or\n    process.args : (\"Invoke-Sqlcmd\", \"Invoke-SqlExecute\",\
  \ \"Invoke-DbaQuery\", \"Invoke-SqlQuery\")\n  ) and\n  process.args : \"*[VeeamBackup].[dbo].[Credentials]*\""
explanation: 'Identifies commands that can access and decrypt Veeam credentials stored
  in MSSQL databases. Attackers can use Veeam

  Credentials to target backups as part of destructive operations such as Ransomware
  attacks.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b661f86d-1c23-4ce7-a59e-2edbdba28247.toml
