technique_id: T1110.001
technique_name: Potential Successful SSH Brute Force Attack
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id, source.ip, user.name with maxspan=15s\n  [authentication\
  \ where host.os.type == \"linux\" and event.action  in (\"ssh_login\", \"user_login\"\
  ) and\n   event.outcome == \"failure\" and source.ip != null and source.ip != \"\
  0.0.0.0\" and source.ip != \"::\" ] with runs=10\n\n  [authentication where host.os.type\
  \ == \"linux\" and event.action  in (\"ssh_login\", \"user_login\") and\n   event.outcome\
  \ == \"success\" and source.ip != null and source.ip != \"0.0.0.0\" and source.ip\
  \ != \"::\" ]"
explanation: 'Identifies multiple SSH login failures followed by a successful one
  from the same source address. Adversaries can

  attempt to login into multiple users with a common or known password to gain access
  to accounts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8cb84371-d053-4f4f-bce0-c74990e28f28.toml
query_type: eql
query_language: eql
indicators:
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Authentication misconfiguration or obsolete credentials.

    - Service account password expired.

    - Infrastructure or availability issue.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Ensure active session(s) on the host(s) are terminated as the attacker could
    have gained initial access to the system(s).

    - Isolate the involved hosts to prevent further post-compromise behavior.

    - Investigate credential exposure'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
