  value: Windows Security Event Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - There should be very few or no false positives for this rule. If this activity
    is expected or noisy in your environment, consider adding exceptions — preferably
    with a combination of user and command line conditions.

    - If the process is related to antivirus or endpoint detection and response solutions,
    validate that it is installed on the correct path and signed with the company''s
    valid digital signature.


    ### Response and remediation


    - Initiate the incident response'
  mitigation: Review investigation guide for details
