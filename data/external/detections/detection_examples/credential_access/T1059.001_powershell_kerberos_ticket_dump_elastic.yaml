technique_id: T1059.001
technique_name: PowerShell Kerberos Ticket Dump
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    \"LsaCallAuthenticationPackage\" and\n    (\n      \"KerbRetrieveEncodedTicketMessage\"\
  \ or\n      \"KerbQueryTicketCacheMessage\" or\n      \"KerbQueryTicketCacheExMessage\"\
  \ or\n      \"KerbQueryTicketCacheEx2Message\" or\n      \"KerbRetrieveTicketMessage\"\
  \ or\n      \"KerbDecryptDataMessage\"\n    )\n  )"
explanation: 'Detects PowerShell scripts that have the capability of dumping Kerberos
  tickets from LSA, which potentially indicates an

  attacker''s attempt to acquire credentials for lateral movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/fddff193-48a3-484d-8d35-90bb3d323a56.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: "False positive analysis\n\n- If this activity is expected and noisy\
    \ in your environment, consider adding exceptions — preferably with a combination\
    \ of file path and user ID conditions.\n\n### Related Rules\n\n- PowerShell Kerberos\
    \ Ticket Request - eb610e70-f9e6-4949-82b9-f1c5bcd37c39\n\n### Response and Remediation\n\
    \n- Initiate the incident response process based on the outcome of the triage.\n\
    \  - If malicious activity is confirmed, perform a broader investigation to identify\
    \ the scope of the compromise a"
  mitigation: Review investigation guide for details
references:
- https://github.com/MzHmO/PowershellKerberos/blob/main/dumper.ps1
has_investigation_guide: true
risk_score: 73
