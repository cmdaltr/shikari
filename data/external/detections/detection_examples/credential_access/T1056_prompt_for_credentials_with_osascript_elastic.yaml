technique_id: T1056
technique_name: Prompt for Credentials with Osascript
tactic: credential_access
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where event.action == \"exec\" and host.os.type == \"macos\" and\n\
  \ process.name == \"osascript\" and process.args == \"-e\" and process.command_line\
  \ like~ (\"*osascript*display*dialog*password*\", \"*osascript*display*dialog*passphrase*\"\
  , \"*pass*display*dialog*\") and\n not (process.parent.executable == \"/usr/bin/sudo\"\
  \ and process.command_line like~ \"*Encryption Key Escrow*\") and\n not (process.command_line\
  \ like~ \"*-e with timeout of 3600 seconds*\" and user.id like \"0\" and process.parent.executable\
  \ == \"/bin/bash\") and\n not process.Ext.effective_parent.executable like~\n  \
  \                                             (\"/usr/local/jamf/*\",\n        \
  \                                        \"/Library/Intune/Microsoft Intune Agent.app/Contents/MacOS/IntuneMdmDaemon\"\
  ,\n                                                \"/Library/Application Support/Mosyle/MosyleMDM.app/Contents/MacOS/MosyleMDM\"\
  ,\n                                                \"/Applications/Karabiner-Elements.app/Contents/MacOS/Karabiner-Elements\"\
  ,\n                                                \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfDaemon.app/Contents/MacOS/JamfDaemon\"\
  ,\n                                                \"/Library/Application Support/JAMF/Jamf.app/Contents/MacOS/JamfManagementService.app/Contents/MacOS/JamfManagementService\"\
  )"
explanation: 'Identifies the use of osascript to execute scripts via standard input
  that may prompt a user with a rogue dialog for

  credentials.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/38948d29-3d5d-42e3-8aec-be832aaaf8eb.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'false positives.

    - Investigate the user account associated with the process to determine if it
    is a privileged account or if there is any unusual activity associated with it.

    - Examine the process execution context, including the effective parent executable,
    to identify if the osascript was executed by a legitimate management tool or script.

    - Look for any other related alerts or logs around the same timeframe to identify
    if this is part of a broader attack or isolated incident.

    - Assess the ris'
  mitigation: Review investigation guide for details
references:
- https://github.com/EmpireProject/EmPyre/blob/master/lib/modules/collection/osx/prompt.py
- https://ss64.com/osx/osascript.html
has_investigation_guide: true
risk_score: 73
