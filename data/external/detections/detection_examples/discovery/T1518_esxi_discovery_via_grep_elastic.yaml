false_positives:
- description: 'False positive analysis


    - System administrators or automated scripts may use grep to search for VM-related
    files as part of routine maintenance or monitoring tasks. To handle this, create
    exceptions for known administrative scripts or processes by excluding specific
    parent processes or user accounts.

    - Backup or snapshot management tools might invoke grep to verify the presence
    of VM files. Identify these tools and exclude their process names or paths from
    the detection rule to prevent false al'
  mitigation: Review investigation guide for details
