technique_id: T1518
technique_name: ESXI Discovery via Grep
tactic: discovery
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"executed\", \"process_started\"\
  ) and\n  process.name in (\"grep\", \"egrep\", \"pgrep\") and\n  process.args in\
  \ (\"vmdk\", \"vmx\", \"vmxf\", \"vmsd\", \"vmsn\", \"vswp\", \"vmss\", \"nvram\"\
  , \"vmem\") and\n  not process.parent.executable == \"/usr/share/qemu/init/qemu-kvm-init\""
explanation: 'Identifies instances where a process named ''grep'', ''egrep'', or ''pgrep''
  is started on a Linux system with arguments

  related to virtual machine (VM) files, such as "vmdk", "vmx", "vmxf", "vmsd", "vmsn",
  "vswp", "vmss", "nvram", or

  "vmem". These file extensions are associated with VM-related file formats, and their
  presence in grep command arguments

  may indicate that a threat actor is attempting to search for, analyze, or manipulate
  VM files on the system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2b662e21-dc6e-461e-b5cf-a6eb9b235ec4.toml
