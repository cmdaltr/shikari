technique_id: T1083
technique_name: Shell Execution via Nice - Linux
tactic: discovery
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 093d68c7-762a-42f4-9f46-95e79142571a
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|endswith:\n  - /bin/bash\n  - /bin/dash\n  - /bin/fish\n  - /bin/sh\n\
  \  - /bin/zsh\n  Image|endswith: /nice\n"
explanation: 'Detects the use of the "nice" utility to execute a shell. Such behavior
  may be associated with privilege escalation, unauthorized command execution, or
  to break out from restricted environments.

  '
false_positives:
- Unknown
references:
- https://gtfobins.github.io/gtfobins/nice/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: /nice
    CommandLine|endswith:
    - /bin/bash
    - /bin/dash
    - /bin/fish
    - /bin/sh
    - /bin/zsh
  condition: selection
