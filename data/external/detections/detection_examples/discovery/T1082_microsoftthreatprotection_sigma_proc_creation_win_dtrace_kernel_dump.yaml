technique_id: T1082
technique_name: Suspicious Kernel Dump Using Dtrace
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 7124aebe-4cd7-4ccb-8df0-6d6b93c96795
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection_obfuscated:\n\
  \  CommandLine|contains|all:\n  - syscall:::return\n  - lkd(\nselection_plain:\n\
  \  CommandLine|contains: lkd(0)\n  Image|endswith: \\dtrace.exe\n"
explanation: Detects suspicious way to dump the kernel on Windows systems using dtrace.exe,
  which is available on Windows systems since Windows 10 19H1
false_positives:
- Unknown
references:
- https://twitter.com/0gtweet/status/1474899714290208777?s=12
- https://learn.microsoft.com/en-us/windows-hardware/drivers/devtest/dtrace
tags:
- attack.discovery
- attack.t1082
logsource:
  product: windows
  category: process_creation
detection:
  selection_plain:
    Image|endswith: \dtrace.exe
    CommandLine|contains: lkd(0)
  selection_obfuscated:
    CommandLine|contains|all:
    - syscall:::return
    - lkd(
  condition: 1 of selection*
