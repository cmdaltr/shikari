technique_id: T1087.002
technique_name: Reconnaissance Activity
tactic: discovery
platform: Splunk
connectorId: Splunk
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 968eef52-9cff-4454-8992-1e74b9cbad6c
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  AccessMask: '0x2d'\n  EventID: 4661\n  ObjectName|endswith:\n  - '-500'\n  -\
  \ '-512'\n  ObjectName|startswith: S-1-5-21-\n  ObjectType:\n  - SAM_USER\n  - SAM_GROUP\n"
explanation: Detects activity as "net user administrator /domain" and "net group domain
  admins /domain"
false_positives:
- Administrator activity
references:
- https://findingbad.blogspot.de/2017/01/hunting-what-does-it-look-like.html
tags:
- attack.discovery
- attack.t1087.002
- attack.t1069.002
- attack.s0039
logsource:
  product: windows
  service: security
  definition: The volume of Event ID 4661 is high on Domain Controllers and therefore
    "Audit SAM" and "Audit Kernel Object" advanced audit policy settings are not configured
    in the recommendations for server systems
detection:
  selection:
    EventID: 4661
    AccessMask: '0x2d'
    ObjectType:
    - SAM_USER
    - SAM_GROUP
    ObjectName|startswith: S-1-5-21-
    ObjectName|endswith:
    - '-500'
    - '-512'
  condition: selection
