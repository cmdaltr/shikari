false_positives:
- description: 'False positive analysis


    - Routine network testing by IT teams may trigger the rule when using Hping for
    legitimate purposes. To manage this, create exceptions for known IP addresses
    or user accounts involved in regular network audits.

    - Automated scripts or cron jobs that utilize Hping for monitoring network performance
    can lead to false positives. Identify these scripts and exclude their execution
    paths or associated user accounts from the detection rule.

    - Security training exercises or penet'
