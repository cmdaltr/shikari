technique_id: T1082
technique_name: Hping Process Activity
tactic: discovery
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \ event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\", \"executed\"\
  , \"process_started\") and\n process.name in (\"hping\", \"hping2\", \"hping3\")"
explanation: 'Hping ran on a Linux host. Hping is a FOSS command-line packet analyzer
  and has the ability to construct network packets

  for a wide variety of network security testing applications, including scanning
  and firewall auditing.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/90169566-2260-4824-b8e4-8615c3b4ed52.toml
