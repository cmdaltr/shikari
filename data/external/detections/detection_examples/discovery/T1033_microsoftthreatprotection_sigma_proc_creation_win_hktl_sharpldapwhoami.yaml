query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection*\nselection_flags1:\n\
  \  CommandLine|endswith:\n  - ' /method:ntlm'\n  - ' /method:kerb'\n  - ' /method:nego'\n\
  \  - ' /m:nego'\n  - ' /m:ntlm'\n  - ' /m:kerb'\nselection_name:\n  Image|endswith:\
  \ \\SharpLdapWhoami.exe\nselection_pe:\n- OriginalFileName|contains: SharpLdapWhoami\n\
  - Product: SharpLdapWhoami\n"
explanation: Detects SharpLdapWhoami, a whoami alternative that queries the LDAP service
  on a domain controller
false_positives:
- Programs that use the same command line flags
