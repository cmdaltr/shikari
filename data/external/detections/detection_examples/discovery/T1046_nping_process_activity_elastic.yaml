technique_id: T1046
technique_name: Nping Process Activity
tactic: discovery
platform: Elastic
fidelity_score: 0.9
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \ event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\", \"executed\"\
  , \"process_started\") and\n process.name == \"nping\""
explanation: 'Nping ran on a Linux host. Nping is part of the Nmap tool suite and
  has the ability to construct raw packets for a wide

  variety of security testing applications, including denial of service testing.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0d69150b-96f8-467c-a86d-a67a3378ce77.toml
