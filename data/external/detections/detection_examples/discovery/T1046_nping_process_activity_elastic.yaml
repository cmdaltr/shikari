false_positives:
- description: 'False positive analysis


    - Routine network diagnostics by IT teams using Nping for legitimate purposes
    can trigger alerts. To manage this, create exceptions for specific user accounts
    or IP addresses known to perform regular network testing.

    - Automated scripts or monitoring tools that incorporate Nping for network health
    checks may cause false positives. Identify these scripts and whitelist their execution
    paths or associated processes.

    - Security assessments or penetration tests conducted by a'
  mitigation: Review investigation guide for details
