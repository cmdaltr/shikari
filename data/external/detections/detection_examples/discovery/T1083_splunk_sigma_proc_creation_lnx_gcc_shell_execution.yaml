technique_id: T1083
technique_name: Shell Execution GCC  - Linux
tactic: discovery
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 9b5de532-a757-4d70-946c-1f3e44f48b4d
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - /bin/bash,-s\n  - /bin/dash,-s\n  -\
  \ /bin/fish,-s\n  - /bin/sh,-s\n  - /bin/zsh,-s\nselection_img:\n  CommandLine|contains:\
  \ -wrapper\n  Image|endswith:\n  - /c89\n  - /c99\n  - /gcc\n"
explanation: 'Detects the use of the "gcc" utility to execute a shell. Such behavior
  may be associated with privilege escalation, unauthorized command execution, or
  to break out from restricted environments.

  '
false_positives:
- Unknown
references:
- https://gtfobins.github.io/gtfobins/gcc/#shell
- https://gtfobins.github.io/gtfobins/c89/#shell
- https://gtfobins.github.io/gtfobins/c99/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - /c89
    - /c99
    - /gcc
    CommandLine|contains: -wrapper
  selection_cli:
    CommandLine|contains:
    - /bin/bash,-s
    - /bin/dash,-s
    - /bin/fish,-s
    - /bin/sh,-s
    - /bin/zsh,-s
  condition: all of selection_*
