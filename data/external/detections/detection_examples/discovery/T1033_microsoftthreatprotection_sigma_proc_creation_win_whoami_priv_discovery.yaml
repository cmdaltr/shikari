technique_id: T1033
technique_name: Security Privileges Enumeration Via Whoami.EXE
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 97a80ec7-0e2f-4d05-9ef4-65760e634f6b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - ' /priv'\n  - ' -priv'\nselection_img:\n\
  - Image|endswith: \\whoami.exe\n- OriginalFileName: whoami.exe\n"
explanation: Detects a whoami.exe executed with the /priv command line flag instructing
  the tool to show all current user privileges. This is often used after a privilege
  escalation attempt.
false_positives:
- Unknown
references:
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \whoami.exe
  - OriginalFileName: whoami.exe
  selection_cli:
    CommandLine|contains:
    - ' /priv'
    - ' -priv'
  condition: all of selection_*
