technique_id: T1083
technique_name: Vim GTFOBin Abuse - Linux
tactic: discovery
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - :!/\n  - ':lua '\n  - ':py '\n  - /bin/bash\n\
  \  - /bin/dash\n  - /bin/fish\n  - /bin/sh\n  - /bin/zsh\nselection_img:\n  CommandLine|contains:\n\
  \  - ' --cmd'\n  - ' -c '\n  Image|endswith:\n  - /rvim\n  - /vim\n  - /vimdiff\n"
explanation: 'Detects the use of "vim" and it''s siblings commands to execute a shell
  or proxy commands.

  Such behavior may be associated with privilege escalation, unauthorized command
  execution, or to break out from restricted environments.

  '
false_positives:
- Unknown
references:
- https://gtfobins.github.io/gtfobins/vim/
- https://gtfobins.github.io/gtfobins/rvim/
- https://gtfobins.github.io/gtfobins/vimdiff/
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - /rvim
    - /vim
    - /vimdiff
    CommandLine|contains:
    - ' --cmd'
    - ' -c '
  selection_cli:
    CommandLine|contains:
    - :!/
    - ':lua '
    - ':py '
    - /bin/bash
    - /bin/dash
    - /bin/fish
    - /bin/sh
    - /bin/zsh
  condition: all of selection_*
