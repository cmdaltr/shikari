technique_id: T1110
technique_name: TeamFiltration User-Agents Detected
tactic: discovery
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:(\"azure.signinlogs\" or \"o365.audit\")\n    and ((user_agent.name:\"\
  Electron\" and user_agent.os.name:\"Windows\" and user_agent.version:\"8.5.1\")\
  \ or\n    user_agent.original:\"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\
  \ (KHTML, like Gecko) Teams/1.3.00.30866 Chrome/80.0.3987.165 Electron/8.5.1 Safari/537.36\"\
  )"
explanation: 'Identifies potential enumeration or password spraying activity using
  TeamFiltration tool. TeamFiltration is an

  open-source enumeration, password spraying and exfiltration tool designed for Entra
  ID and Microsoft 365. Adversaries

  are known to use TeamFiltration in-the-wild to enumerate users, groups, and roles,
  as well as to perform password

  spraying attacks against Microsoft Entra ID and Microsoft 365 accounts. This rule
  detects the use of TeamFiltration by

  monitoring for specific user-agent strings associated with the tool in Azure and
  Microsoft 365 logs.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f541ca3a-5752-11f0-b44b-f661ea17fbcd.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
- type: data_source
  value: Microsoft 365
  confidence: high
- type: data_source
  value: Microsoft 365 Audit Logs
  confidence: high
- type: data_source
  value: Microsoft Entra ID
  confidence: high
- type: data_source
  value: Microsoft Entra ID Sign-in Logs
  confidence: high
false_positives:
- description: "False positive analysis\n\n- This activity may be benign if performed\
    \ by red teams, internal security auditors, or known security tools under authorization.\n\
    \n### Response and remediation\n\n- If confirmed malicious:\n    - Identify successful\
    \ sign-in attempts or API calls made by the user or app.\n    - Revoke active\
    \ sessions or tokens associated with the identified user/app.\n    - Disable the\
    \ account or rotate credentials immediately.\n    - Review the role assignments\
    \ (`Directory.Read.All`, `AuditLog"
  mitigation: Review investigation guide for details
references:
- https://www.proofpoint.com/us/blog/threat-insight/attackers-unleash-teamfiltration-account-takeover-campaign
- https://github.com/Flangvik/TeamFiltration
has_investigation_guide: true
risk_score: 47
