technique_id: T1135
technique_name: File Explorer Folder Opened Using Explorer Folder Shortcut Via Shell
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: c3d76afc-93df-461e-8e67-9b2bad3f2ac4
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  CommandLine|contains: shell:mycomputerfolder\n  Image|endswith: \\explorer.exe\n\
  \  ParentImage|endswith:\n  - \\cmd.exe\n  - \\powershell.exe\n  - \\pwsh.exe\n"
explanation: 'Detects the initial execution of "cmd.exe" which spawns "explorer.exe"
  with the appropriate command line arguments for opening the "My Computer" folder.

  '
false_positives:
- Unknown
references:
- https://ss64.com/nt/shell.html
tags:
- attack.discovery
- attack.t1135
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    Image|endswith: \explorer.exe
    CommandLine|contains: shell:mycomputerfolder
  condition: selection
