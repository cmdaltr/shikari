technique_id: T1083
technique_name: Shell Execution via Find - Linux
tactic: discovery
platform: Splunk
connectorId: Splunk
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 6adfbf8f-52be-4444-9bac-81b539624146
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains:\n  - /bin/bash\n  - /bin/dash\n  - /bin/fish\n\
  \  - /bin/sh\n  - /bin/zsh\nselection_img:\n  CommandLine|contains|all:\n  - ' .\
  \ '\n  - -exec\n  Image|endswith: /find\n"
explanation: 'Detects the use of the find command to execute a shell. Such behavior
  may be associated with privilege escalation, unauthorized command execution, or
  exploitation attempt.

  '
false_positives:
- Unknown
references:
- https://gtfobins.github.io/gtfobins/find/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: /find
    CommandLine|contains|all:
    - ' . '
    - -exec
  selection_cli:
    CommandLine|contains:
    - /bin/bash
    - /bin/dash
    - /bin/fish
    - /bin/sh
    - /bin/zsh
  condition: all of selection_*
