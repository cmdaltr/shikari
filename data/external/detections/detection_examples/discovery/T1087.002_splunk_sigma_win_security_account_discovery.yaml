technique_id: T1087.002
technique_name: AD Privileged Users or Groups Reconnaissance
tactic: discovery
platform: Splunk
connectorId: Splunk
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 35ba1d85-724d-42a3-889f-2e2362bcaf23
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and selection_object\
  \ and not filter\nfilter:\n  SubjectUserName|endswith: $\nselection:\n  EventID:\
  \ 4661\n  ObjectType:\n  - SAM_USER\n  - SAM_GROUP\nselection_object:\n- ObjectName|endswith:\n\
  \  - '-512'\n  - '-502'\n  - '-500'\n  - '-505'\n  - '-519'\n  - '-520'\n  - '-544'\n\
  \  - '-551'\n  - '-555'\n- ObjectName|contains: admin\n"
explanation: Detect priv users or groups recon based on 4661 eventid and known privileged
  users or groups SIDs
false_positives:
- If source account name is not an admin then its super suspicious
references:
- https://web.archive.org/web/20230329163438/https://blog.menasec.net/2019/02/threat-hunting-5-detecting-enumeration.html
tags:
- attack.discovery
- attack.t1087.002
logsource:
  product: windows
  service: security
  definition: 'Requirements: enable Object Access SAM on your Domain Controllers'
detection:
  selection:
    EventID: 4661
    ObjectType:
    - SAM_USER
    - SAM_GROUP
  selection_object:
  - ObjectName|endswith:
    - '-512'
    - '-502'
    - '-500'
    - '-505'
    - '-519'
    - '-520'
    - '-544'
    - '-551'
    - '-555'
  - ObjectName|contains: admin
  filter:
    SubjectUserName|endswith: $
  condition: selection and selection_object and not filter
