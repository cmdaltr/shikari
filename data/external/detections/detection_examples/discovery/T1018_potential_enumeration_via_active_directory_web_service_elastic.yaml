technique_id: T1018
technique_name: Potential Enumeration via Active Directory Web Service
tactic: discovery
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by process.entity_id with maxspan=3m\n [library where host.os.type\
  \ == \"windows\" and\n  dll.name : (\"System.DirectoryServices*.dll\", \"System.IdentityModel*.dll\"\
  ) and\n  not user.id in (\"S-1-5-18\", \"S-1-5-19\", \"S-1-5-20\") and\n  not process.executable\
  \ :\n                (\"?:\\\\windows\\\\system32\\\\dsac.exe\",\n             \
  \    \"?:\\\\program files\\\\powershell\\\\?\\\\pwsh.exe\",\n                 \"\
  ?:\\\\windows\\\\system32\\\\windowspowershell\\\\*.exe\",\n                 \"\
  ?:\\\\windows\\\\syswow64\\\\windowspowershell\\\\*.exe\",\n                 \"\
  ?:\\\\program files\\\\microsoft monitoring agent\\\\*.exe\",\n                \
  \ \"?:\\\\windows\\\\adws\\\\microsoft.activedirectory.webservices.exe\")]\n [network\
  \ where host.os.type == \"windows\" and destination.port == 9389 and source.port\
  \ >= 49152 and\n  network.direction == \"egress\" and network.transport == \"tcp\"\
  \ and not cidrmatch(destination.ip, \"127.0.0.0/8\", \"::1/128\")]"
explanation: 'Identifies processes loading Active Directory related modules followed
  by a network connection to the ADWS dedicated TCP

  port. Adversaries may abuse the ADWS Windows service that allows Active Directory
  to be queried via this web service.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9c951837-7d13-4b0c-be7a-f346623c8795.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
