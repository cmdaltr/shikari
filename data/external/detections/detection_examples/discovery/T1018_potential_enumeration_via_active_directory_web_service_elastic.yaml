    administrative processes that regularly perform these actions.

    - Scheduled tasks or automated scripts running under service accounts might trigger
    the rule. Identify these tasks and exclude their associated user IDs or process
    paths from the detection rule.

    - Security or monitoring software that queries Active Di'
  mitigation: Review investigation guide for details
