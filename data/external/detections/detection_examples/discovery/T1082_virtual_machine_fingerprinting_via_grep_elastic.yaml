technique_id: T1082
technique_name: Virtual Machine Fingerprinting via Grep
tactic: discovery
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where event.type == \"start\" and\n process.name in (\"grep\", \"\
  egrep\") and user.id != \"0\" and\n process.args : (\"parallels*\", \"vmware*\"\
  , \"virtualbox*\") and process.args : \"Manufacturer*\" and\n not process.parent.executable\
  \ in (\"/Applications/Docker.app/Contents/MacOS/Docker\", \"/usr/libexec/kcare/virt-what\"\
  )"
explanation: 'An adversary may attempt to get detailed information about the operating
  system and hardware. This rule identifies

  common locations used to discover virtual machine hardware by a non-root user. This
  technique has been used by the Pupy

  RAT and other malware.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c85eb82c-d2c8-485c-a36f-534f914b7663.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Non-root users running legitimate scripts or applications that query virtual
    machine identifiers for system management or inventory purposes may trigger the
    rule. To handle this, identify and whitelist these specific scripts or applications
    by excluding their parent executable paths.

    - Developers or IT personnel using grep to troubleshoot or gather system information
    on virtual machines might be flagged. Create exceptions for known user accounts
    or specific directories'
  mitigation: Review investigation guide for details
references:
- https://objective-see.com/blog/blog_0x4F.html
has_investigation_guide: true
risk_score: 47
