technique_id: T1526
technique_name: PUA - Seatbelt Execution
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 38646daa-e78f-4ace-9de0-55547b2d30da
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img or all\
  \ of selection_group_*\nselection_group_list:\n  CommandLine|contains:\n  - ' -group=misc'\n\
  \  - ' -group=remote'\n  - ' -group=chromium'\n  - ' -group=slack'\n  - ' -group=system'\n\
  \  - ' -group=user'\n  - ' -group=all'\nselection_group_output:\n  CommandLine|contains:\
  \ ' -outputfile='\nselection_img:\n- Image|endswith: \\Seatbelt.exe\n- OriginalFileName:\
  \ Seatbelt.exe\n- Description: Seatbelt\n- CommandLine|contains:\n  - ' DpapiMasterKeys'\n\
  \  - ' InterestingProcesses'\n  - ' InterestingFiles'\n  - ' CertificateThumbprints'\n\
  \  - ' ChromiumBookmarks'\n  - ' ChromiumHistory'\n  - ' ChromiumPresence'\n  -\
  \ ' CloudCredentials'\n  - ' CredEnum'\n  - ' CredGuard'\n  - ' FirefoxHistory'\n\
  \  - ' ProcessCreationEvents'\n"
explanation: Detects the execution of the PUA/Recon tool Seatbelt via PE information
  of command line parameters
false_positives:
- Unlikely
references:
- https://github.com/GhostPack/Seatbelt
- https://www.bluetangle.dev/2022/08/fastening-seatbelt-on-threat-hunting.html
tags:
- attack.discovery
- attack.t1526
- attack.t1087
- attack.t1083
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \Seatbelt.exe
  - OriginalFileName: Seatbelt.exe
  - Description: Seatbelt
  - CommandLine|contains:
    - ' DpapiMasterKeys'
    - ' InterestingProcesses'
    - ' InterestingFiles'
    - ' CertificateThumbprints'
    - ' ChromiumBookmarks'
    - ' ChromiumHistory'
    - ' ChromiumPresence'
    - ' CloudCredentials'
    - ' CredEnum'
    - ' CredGuard'
    - ' FirefoxHistory'
    - ' ProcessCreationEvents'
  selection_group_list:
    CommandLine|contains:
    - ' -group=misc'
    - ' -group=remote'
    - ' -group=chromium'
    - ' -group=slack'
    - ' -group=system'
    - ' -group=user'
    - ' -group=all'
  selection_group_output:
    CommandLine|contains: ' -outputfile='
  condition: selection_img or all of selection_group_*
