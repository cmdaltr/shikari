technique_id: T1033
technique_name: Whoami.EXE Execution From Privileged Process
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 79ce34ca-af29-4d0e-b832-fc1b377020db
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_img:\n- OriginalFileName: whoami.exe\n- Image|endswith: \\whoami.exe\n\
  selection_user:\n  User|contains:\n  - AUTHORI\n  - AUTORI\n  - TrustedInstaller\n"
explanation: Detects the execution of "whoami.exe" by privileged accounts that are
  often abused by threat actors
false_positives:
- Unknown
references:
- https://speakerdeck.com/heirhabarov/hunting-for-privilege-escalation-in-windows-environment
- https://web.archive.org/web/20221019044836/https://nsudo.m2team.org/en-us/
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: whoami.exe
  - Image|endswith: \whoami.exe
  selection_user:
    User|contains:
    - AUTHORI
    - AUTORI
    - TrustedInstaller
  condition: all of selection_*
