technique_id: T1613
technique_name: Kubernetes Denied Service Account Request
tactic: discovery
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset: \"kubernetes.audit_logs\"\n  and kubernetes.audit.user.username:\
  \ system\\:serviceaccount\\:*\n  and kubernetes.audit.annotations.authorization_k8s_io/decision:\
  \ \"forbid\""
explanation: 'This rule detects when a service account makes an unauthorized request
  for resources from the API server. Service

  accounts follow a very predictable pattern of behavior. A service account should
  never send an unauthorized request to

  the API server. This behavior is likely an indicator of compromise or of a problem
  within the cluster. An adversary may

  have gained access to credentials/tokens and this could be an attempt to access
  or create resources to facilitate

  further movement or execution within the cluster.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/63c056a0-339a-11ed-a261-0242ac120002.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Kubernetes
  confidence: high
false_positives:
- description: 'False positive analysis


    - Service accounts used for testing or development may generate unauthorized requests
    if they are not properly configured. Regularly review and update permissions for
    these accounts to ensure they align with their intended use.

    - Automated scripts or tools that interact with the Kubernetes API might trigger
    false positives if they use service accounts with insufficient permissions. Ensure
    these tools have the necessary permissions or adjust the detection rule to exclude'
  mitigation: Review investigation guide for details
references:
- https://research.nccgroup.com/2021/11/10/detection-engineering-for-kubernetes-clusters/#part3-kubernetes-detections
- https://kubernetes.io/docs/reference/access-authn-authz/authentication/#service-account-tokens
has_investigation_guide: true
risk_score: 47
