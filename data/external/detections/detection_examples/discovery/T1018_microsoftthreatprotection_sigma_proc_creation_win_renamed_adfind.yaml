technique_id: T1018
technique_name: Renamed AdFind Execution
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: df55196f-f105-44d3-a675-e9dfb6cc2f2b
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection* and not\
  \ filter\nfilter:\n  Image|endswith: \\AdFind.exe\nselection_1:\n  CommandLine|contains:\n\
  \  - domainlist\n  - trustdmp\n  - dcmodes\n  - adinfo\n  - ' dclist '\n  - computer_pwdnotreqd\n\
  \  - objectcategory=\n  - -subnets -f\n  - name=\"Domain Admins\"\n  - '-sc u:'\n\
  \  - domainncs\n  - dompol\n  - ' oudmp '\n  - subnetdmp\n  - gpodmp\n  - fspdmp\n\
  \  - users_noexpire\n  - computers_active\n  - computers_pwdnotreqd\nselection_2:\n\
  \  Hashes|contains:\n  - IMPHASH=BCA5675746D13A1F246E2DA3C2217492\n  - IMPHASH=53E117A96057EAF19C41380D0E87F1C2\n\
  \  - IMPHASH=d144de8117df2beceaba2201ad304764\n  - IMPHASH=12ce1c0f3f5837ecc18a3782408fa975\n\
  \  - IMPHASH=4fbf3f084fbbb2470b80b2013134df35\n  - IMPHASH=49b639b4acbecc49d72a01f357aa4930\n\
  \  - IMPHASH=680dad9e300346e05a85023965867201\n  - IMPHASH=21aa085d54992511b9f115355e468782\n\
  selection_3:\n  OriginalFileName: AdFind.exe\n"
explanation: Detects the use of a renamed Adfind.exe. AdFind continues to be seen
  across majority of breaches. It is used to domain trust discovery to plan out subsequent
  steps in the attack chain.
false_positives:
- Unknown
