technique_id: T1649
technique_name: HackTool - Certipy Execution
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img or all\
  \ of selection_cli_*\nselection_cli_commands:\n  CommandLine|contains:\n  - ' account\
  \ '\n  - ' auth '\n  - ' cert '\n  - ' find '\n  - ' forge '\n  - ' ptt '\n  - '\
  \ relay '\n  - ' req '\n  - ' shadow '\n  - ' template '\nselection_cli_flags:\n\
  \  CommandLine|contains:\n  - ' -bloodhound'\n  - ' -ca-pfx '\n  - ' -dc-ip '\n\
  \  - ' -kirbi'\n  - ' -old-bloodhound'\n  - ' -pfx '\n  - ' -target'\n  - ' -template'\n\
  \  - ' -username '\n  - ' -vulnerable'\n  - auth -pfx\n  - shadow auto\n  - shadow\
  \ list\nselection_img:\n- Image|endswith: \\Certipy.exe\n- OriginalFileName: Certipy.exe\n\
  - Description|contains: Certipy\n"
explanation: 'Detects Certipy execution, a tool for Active Directory Certificate Services
  enumeration and abuse based on PE metadata characteristics and common command line
  arguments.

  '
false_positives:
- Unlikely
references:
- https://github.com/ly4k/Certipy
- https://research.ifcr.dk/certipy-4-0-esc9-esc10-bloodhound-gui-new-authentication-and-request-methods-and-more-7237d88061f7
tags:
- attack.discovery
- attack.credential-access
- attack.t1649
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \Certipy.exe
  - OriginalFileName: Certipy.exe
  - Description|contains: Certipy
  selection_cli_commands:
    CommandLine|contains:
    - ' account '
    - ' auth '
    - ' cert '
    - ' find '
    - ' forge '
    - ' ptt '
    - ' relay '
    - ' req '
    - ' shadow '
    - ' template '
  selection_cli_flags:
    CommandLine|contains:
    - ' -bloodhound'
    - ' -ca-pfx '
    - ' -dc-ip '
    - ' -kirbi'
    - ' -old-bloodhound'
    - ' -pfx '
    - ' -target'
    - ' -template'
    - ' -username '
    - ' -vulnerable'
    - auth -pfx
    - shadow auto
    - shadow list
  condition: selection_img or all of selection_cli_*
