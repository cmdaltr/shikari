level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_img or all\
  \ of selection_cli_*\nselection_cli_commands:\n  CommandLine|contains:\n  - '.exe\
  \ cas '\n  - '.exe find '\n  - '.exe pkiobjects '\n  - '.exe request '\n  - '.exe\
  \ download '\nselection_cli_options:\n  CommandLine|contains:\n  - ' /vulnerable'\n\
  \  - ' /template:'\n  - ' /altname:'\n  - ' /domain:'\n  - ' /path:'\n  - ' /ca:'\n\
  selection_img:\n- Image|endswith: \\Certify.exe\n- OriginalFileName: Certify.exe\n\
  - Description|contains: Certify\n"
explanation: Detects Certify a tool for Active Directory certificate abuse based on
  PE metadata characteristics and common command line arguments.
false_positives:
- Unknown
references:
- https://github.com/GhostPack/Certify
tags:
- attack.discovery
- attack.credential-access
- attack.t1649
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \Certify.exe
  - OriginalFileName: Certify.exe
  - Description|contains: Certify
  selection_cli_commands:
    CommandLine|contains:
    - '.exe cas '
    - '.exe find '
    - '.exe pkiobjects '
    - '.exe request '
    - '.exe download '
  selection_cli_options:
    CommandLine|contains:
    - ' /vulnerable'
    - ' /template:'
    - ' /altname:'
    - ' /domain:'
    - ' /path:'
    - ' /ca:'
  condition: selection_img or all of selection_cli_*
