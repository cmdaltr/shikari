query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cli_dl:\n\
  \  CommandLine|contains: https://github.com/carlospolop/PEASS-ng/releases/latest/download/\n\
  selection_cli_option:\n  CommandLine|contains:\n  - ' applicationsinfo'\n  - ' browserinfo'\n\
  \  - ' eventsinfo'\n  - ' fileanalysis'\n  - ' filesinfo'\n  - ' processinfo'\n\
  \  - ' servicesinfo'\n  - ' windowscreds'\nselection_cli_specific:\n- ParentCommandLine|endswith:\
  \ ' -linpeas'\n- CommandLine|endswith: ' -linpeas'\nselection_img:\n- OriginalFileName:\
  \ winPEAS.exe\n- Image|endswith:\n  - \\winPEASany_ofs.exe\n  - \\winPEASany.exe\n\
  \  - \\winPEASx64_ofs.exe\n  - \\winPEASx64.exe\n  - \\winPEASx86_ofs.exe\n  - \\\
  winPEASx86.exe\n"
explanation: WinPEAS is a script that search for possible paths to escalate privileges
  on Windows hosts. The checks are explained on book.hacktricks.xyz
false_positives:
- Unlikely
references:
- https://github.com/carlospolop/PEASS-ng
- https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation
tags:
- attack.privilege-escalation
- attack.discovery
- attack.t1082
- attack.t1087
- attack.t1046
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - OriginalFileName: winPEAS.exe
  - Image|endswith:
    - \winPEASany_ofs.exe
    - \winPEASany.exe
    - \winPEASx64_ofs.exe
    - \winPEASx64.exe
    - \winPEASx86_ofs.exe
    - \winPEASx86.exe
  selection_cli_option:
    CommandLine|contains:
    - ' applicationsinfo'
    - ' browserinfo'
    - ' eventsinfo'
    - ' fileanalysis'
    - ' filesinfo'
    - ' processinfo'
    - ' servicesinfo'
    - ' windowscreds'
  selection_cli_dl:
    CommandLine|contains: https://github.com/carlospolop/PEASS-ng/releases/latest/download/
  selection_cli_specific:
  - ParentCommandLine|endswith: ' -linpeas'
  - CommandLine|endswith: ' -linpeas'
  condition: 1 of selection_*
