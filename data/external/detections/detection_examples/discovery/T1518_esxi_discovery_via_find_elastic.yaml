false_positives:
- description: 'False positive analysis


    - Legitimate administrative tasks may trigger the rule if system administrators
    use the ''find'' command to audit or manage VMware-related files. To handle this,
    create exceptions for known administrative scripts or user accounts that regularly
    perform these tasks.

    - Automated backup or monitoring scripts that scan VMware directories can also
    cause false positives. Identify these scripts and exclude their parent processes
    from the detection rule.

    - Software updates or main'
  mitigation: Review investigation guide for details
