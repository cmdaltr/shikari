technique_id: T1518
technique_name: ESXI Discovery via Find
tactic: discovery
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"executed\", \"process_started\"\
  ) and\n  process.name == \"find\" and process.args : (\"/etc/vmware/*\", \"/usr/lib/vmware/*\"\
  , \"/vmfs/*\") and\n  not process.parent.executable == \"/usr/lib/vmware/viewagent/bin/uninstall_viewagent.sh\""
explanation: 'Identifies instances where the ''find'' command is started on a Linux
  system with arguments targeting specific VM-related

  paths, such as "/etc/vmware/", "/usr/lib/vmware/", or "/vmfs/*". These paths are
  associated with VMware virtualization

  software, and their presence in the find command arguments may indicate that a threat
  actor is attempting to search for,

  analyze, or manipulate VM-related files and configurations on the system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/33a6752b-da5e-45f8-b13a-5f094c09522f.toml
query_type: eql
query_language: eql
