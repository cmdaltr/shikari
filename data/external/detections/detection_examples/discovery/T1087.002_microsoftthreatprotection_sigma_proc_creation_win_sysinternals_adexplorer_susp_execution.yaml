technique_id: T1087.002
technique_name: Suspicious Active Directory Database Snapshot Via ADExplorer
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: ef61af62-bc74-4f58-b49b-626448227652
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_flag:\n  CommandLine|contains: snapshot\nselection_img:\n- Image|endswith:\n\
  \  - \\ADExp.exe\n  - \\ADExplorer.exe\n  - \\ADExplorer64.exe\n  - \\ADExplorer64a.exe\n\
  - OriginalFileName: AdExp\n- Description: Active Directory Editor\n- Product: Sysinternals\
  \ ADExplorer\nselection_paths:\n  CommandLine|contains:\n  - \\Downloads\\\n  -\
  \ \\Users\\Public\\\n  - \\AppData\\\n  - \\Windows\\Temp\\\n"
explanation: Detects the execution of Sysinternals ADExplorer with the "-snapshot"
  flag in order to save a local copy of the active directory database to a suspicious
  directory. This can be used by attackers to extract data for Bloodhound, usernames
  for password spraying or use the meta data for social engineering. The snapshot
  doesn't contain password hashes but there have been cases, where administrators
  put passwords in the comment field.
false_positives:
- Unknown
references:
- https://www.documentcloud.org/documents/5743766-Global-Threat-Report-2019.html
- https://learn.microsoft.com/de-de/sysinternals/downloads/adexplorer
