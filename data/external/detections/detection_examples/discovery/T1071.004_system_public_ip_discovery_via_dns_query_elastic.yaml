false_positives:
- description: 'False positive analysis


    - Trusted domain from an expected process running in the environment.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - Immediately block the identified indicators of compromise (IoCs).

    - Implement any temporary network rules, procedures, and segmentation required
    to contain the attack.

    - Investigate credential exposure on systems compromis'
  mitigation: Review investigation guide for details
references:
- https://attack.mitre.org/techniques/T1016/
