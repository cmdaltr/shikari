technique_id: T1518.001
technique_name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 37db85d1-b089-490a-a59a-c7b6f984f480
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli:\n  CommandLine|contains: ' 385201'\nselection_img:\n- Image|endswith:\n\
  \  - \\find.exe\n  - \\findstr.exe\n- OriginalFileName:\n  - FIND.EXE\n  - FINDSTR.EXE\n"
explanation: Detects usage of "findstr" with the argument "385201". Which could indicate
  potential discovery of an installed Sysinternals Sysmon service using the default
  driver altitude (even if the name is changed).
false_positives:
- Unknown
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518.001/T1518.001.md#atomic-test-5---security-software-discovery---sysmon-service
tags:
