  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \find.exe
    - \findstr.exe
  - OriginalFileName:
    - FIND.EXE
    - FINDSTR.EXE
  selection_cli:
    CommandLine|contains: ' 385201'
  condition: all of selection_*
