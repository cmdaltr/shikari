technique_id: T1087.001
technique_name: HackTool - Bloodhound/Sharphound Execution
tactic: discovery
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: f376c8a7-a2d0-4ddc-aa0c-16c17236d962
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: 1 of selection_*\nselection_cli_1:\n\
  \  CommandLine|contains:\n  - ' -CollectionMethod All '\n  - ' --CollectionMethods\
  \ Session '\n  - ' --Loop --Loopduration '\n  - ' --PortScanTimeout '\n  - '.exe\
  \ -c All -d '\n  - Invoke-Bloodhound\n  - Get-BloodHoundData\nselection_cli_2:\n\
  \  CommandLine|contains|all:\n  - ' -JsonFolder '\n  - ' -ZipFileName '\nselection_cli_3:\n\
  \  CommandLine|contains|all:\n  - ' DCOnly '\n  - ' --NoSaveCache '\nselection_img:\n\
  - Product|contains: SharpHound\n- Description|contains: SharpHound\n- Company|contains:\n\
  \  - SpecterOps\n  - evil corp\n- Image|contains:\n  - \\Bloodhound.exe\n  - \\\
  SharpHound.exe\n"
explanation: Detects command line parameters used by Bloodhound and Sharphound hack
  tools
false_positives:
- Other programs that use these command line option and accepts an 'All' parameter
references:
- https://github.com/BloodHoundAD/BloodHound
- https://github.com/BloodHoundAD/SharpHound
tags:
- attack.discovery
- attack.t1087.001
- attack.t1087.002
- attack.t1482
- attack.t1069.001
- attack.t1069.002
- attack.execution
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Product|contains: SharpHound
  - Description|contains: SharpHound
  - Company|contains:
    - SpecterOps
    - evil corp
  - Image|contains:
    - \Bloodhound.exe
    - \SharpHound.exe
  selection_cli_1:
    CommandLine|contains:
    - ' -CollectionMethod All '
    - ' --CollectionMethods Session '
    - ' --Loop --Loopduration '
    - ' --PortScanTimeout '
    - '.exe -c All -d '
    - Invoke-Bloodhound
    - Get-BloodHoundData
  selection_cli_2:
    CommandLine|contains|all:
    - ' -JsonFolder '
    - ' -ZipFileName '
  selection_cli_3:
    CommandLine|contains|all:
    - ' DCOnly '
    - ' --NoSaveCache '
  condition: 1 of selection_*
metadata:
  created_date: 2019-12-20
  modified_date: 2023-02-04
  author: Florian Roth (Nextron Systems)
