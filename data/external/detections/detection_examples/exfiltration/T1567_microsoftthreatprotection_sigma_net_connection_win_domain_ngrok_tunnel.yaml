technique_id: T1567
technique_name: Communication To Ngrok Tunneling Service Initiated
tactic: exfiltration
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 1d08ac94-400d-4469-a82f-daee9a908849
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  DestinationHostname|contains:\n  - tunnel.us.ngrok.com\n  - tunnel.eu.ngrok.com\n\
  \  - tunnel.ap.ngrok.com\n  - tunnel.au.ngrok.com\n  - tunnel.sa.ngrok.com\n  -\
  \ tunnel.jp.ngrok.com\n  - tunnel.in.ngrok.com\n"
explanation: 'Detects an executable initiating a network connection to "ngrok" tunneling
  domains.

  Attackers were seen using this "ngrok" in order to store their second stage payloads
  and malware.

  While communication with such domains can be legitimate, often times is a sign of
  either data exfiltration by malicious actors or additional download.

  '
false_positives:
- Legitimate use of the ngrok service.
references:
- https://twitter.com/hakluke/status/1587733971814977537/photo/1
- https://ngrok.com/docs/secure-tunnels/tunnels/ssh-reverse-tunnel-agent
