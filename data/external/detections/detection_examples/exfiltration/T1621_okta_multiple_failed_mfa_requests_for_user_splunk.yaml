technique_id: T1621
technique_name: Okta Multiple Failed MFA Requests For User
tactic: exfiltration
platform: Splunk
fidelity_score: 0.9
validated: true
query: '`okta` eventType=user.authentication.auth_via_mfa outcome.result=FAILURE debugContext.debugData.factor!=PASSWORD_AS_FACTOR
  | bucket _time span=5m | stats count min(_time) as firstTime max(_time) as lastTime
  values(displayMessage) values(src_ip) as src_ip values(debugContext.debugData.factor)
  values(dest) as dest by _time src_user | where count >= 10 | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)` | `okta_multiple_failed_mfa_requests_for_user_filter`'
explanation: The following analytic identifies multiple failed multi-factor authentication
  (MFA) requests for a single user within an Okta tenant. It triggers when more than
  10 MFA attempts fail within 5 minutes, using Okta event logs to detect this pattern.
  This activity is significant as it may indicate an adversary attempting to bypass
  MFA by bombarding the user with repeated authentication requests, a technique used
  by threat actors like Lapsus and APT29. If confirmed malicious, this could lead
  to unauthorized access, potentially compromising sensitive information and systems.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/826dbaae-a1e6-4c8c-b384-d16898956e73/
indicators:
- type: data_source
  value: Okta
  confidence: high
- type: risk_user
  value: src_user
  confidence: high
false_positives:
- description: Multiple Failed MFA requests may also be a sign of authentication or
    application issues. Filter as needed and monitor for any unusual activity.
  mitigation: Review context and user activity
