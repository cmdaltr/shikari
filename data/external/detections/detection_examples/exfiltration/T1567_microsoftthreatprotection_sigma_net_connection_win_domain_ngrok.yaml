technique_id: T1567
technique_name: Process Initiated Network Connection To Ngrok Domain
tactic: exfiltration
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.84
validated: true
source: sigma
sigma_id: 18249279-932f-45e2-b37a-8925f2597670
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  DestinationHostname|endswith:\n  - .ngrok-free.app\n  - .ngrok-free.dev\n  -\
  \ .ngrok.app\n  - .ngrok.dev\n  - .ngrok.io\n  Initiated: 'true'\n"
explanation: 'Detects an executable initiating a network connection to "ngrok" domains.

  Attackers were seen using this "ngrok" in order to store their second stage payloads
  and malware.

  While communication with such domains can be legitimate, often times is a sign of
  either data exfiltration by malicious actors or additional download.

  '
false_positives:
- Legitimate use of the ngrok service.
references:
- https://ngrok.com/
- https://ngrok.com/blog-post/new-ngrok-domains
- https://www.virustotal.com/gui/file/cca0c1182ac114b44dc52dd2058fcd38611c20bb6b5ad84710681d38212f835a/
- https://www.rnbo.gov.ua/files/2023_YEAR/CYBERCENTER/november/APT29%20attacks%20Embassies%20using%20CVE-2023-38831%20-%20report%20en.pdf
tags:
