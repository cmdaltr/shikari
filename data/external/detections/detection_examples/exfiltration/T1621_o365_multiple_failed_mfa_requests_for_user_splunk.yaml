technique_id: T1621
technique_name: O365 Multiple Failed MFA Requests For User
tactic: exfiltration
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`o365_management_activity` Workload=AzureActiveDirectory Operation=UserLoginFailed
  ResultStatus=Success ErrorNumber=500121 | bucket span=10m _time | stats dc(_raw)
  as mfa_prompts values(LogonError) as LogonError values(signature) as signature values(action)
  as action values(src) as src by user _time vendor_account vendor_product dest |
  where mfa_prompts > 9 | `o365_multiple_failed_mfa_requests_for_user_filter`'
explanation: The following analytic identifies potential "MFA fatigue" attacks targeting
  Office 365 users by detecting more than nine Multi-Factor Authentication (MFA) prompts
  within a 10-minute timeframe. It leverages O365 management activity logs, focusing
  on Azure Active Directory events with the UserLoginFailed operation, a Success ResultStatus,
  and an ErrorNumber of 500121. This activity is significant as attackers may exploit
  MFA fatigue to gain unauthorized access by overwhelming users with repeated MFA
  requests. If confirmed malicious, this could lead to data breaches, unauthorized
  data access, or further compromise within the O365 environment. Immediate investigation
  is crucial.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/fd22124e-dbac-4744-a8ce-be10d8ec3e26/
indicators:
- type: data_source
  value: O365 UserLoginFailed
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Multiple Failed MFA requests may also be a sign of authentication or
    application issues. Filter as needed.
  mitigation: Review context and user activity
