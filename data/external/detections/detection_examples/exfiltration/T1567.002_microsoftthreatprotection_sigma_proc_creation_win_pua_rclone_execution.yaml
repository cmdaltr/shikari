technique_id: T1567.002
technique_name: PUA - Rclone Execution
tactic: exfiltration
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.88
validated: true
source: sigma
sigma_id: e37db05d-d1f9-49c8-b464-cee1a4b11638
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection_specific_options\
  \ or all of selection_rclone_*\nselection_rclone_cli:\n  CommandLine|contains:\n\
  \  - pass\n  - user\n  - copy\n  - sync\n  - config\n  - lsd\n  - remote\n  - ls\n\
  \  - mega\n  - pcloud\n  - ftp\n  - ignore-existing\n  - auto-confirm\n  - transfers\n\
  \  - multi-thread-streams\n  - 'no-check-certificate '\nselection_rclone_img:\n\
  - Image|endswith: \\rclone.exe\n- Description: Rsync for cloud storage\nselection_specific_options:\n\
  \  CommandLine|contains|all:\n  - '--config '\n  - '--no-check-certificate '\n \
  \ - ' copy '\n"
explanation: Detects execution of RClone utility for exfiltration as used by various
  ransomwares strains like REvil, Conti, FiveHands, etc
false_positives:
- Unknown
references:
- https://research.nccgroup.com/2021/05/27/detecting-rclone-an-effective-tool-for-exfiltration/
- https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware
- https://us-cert.cisa.gov/ncas/analysis-reports/ar21-126a
- https://labs.sentinelone.com/egregor-raas-continues-the-chaos-with-cobalt-strike-and-rclone
- https://www.splunk.com/en_us/blog/security/darkside-ransomware-splunk-threat-update-and-detections.html
tags:
- attack.exfiltration
- attack.t1567.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_specific_options:
    CommandLine|contains|all:
    - '--config '
    - '--no-check-certificate '
    - ' copy '
  selection_rclone_img:
  - Image|endswith: \rclone.exe
  - Description: Rsync for cloud storage
  selection_rclone_cli:
    CommandLine|contains:
    - pass
    - user
    - copy
    - sync
    - config
    - lsd
    - remote
    - ls
    - mega
    - pcloud
    - ftp
    - ignore-existing
    - auto-confirm
    - transfers
    - multi-thread-streams
    - 'no-check-certificate '
  condition: selection_specific_options or all of selection_rclone_*
