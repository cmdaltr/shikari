technique_id: T1621
technique_name: Azure AD Multiple Denied MFA Requests For User
tactic: exfiltration
platform: Splunk
fidelity_score: 0.95
validated: true
query: '`azure_monitor_aad` category=SignInLogs operationName="Sign-in activity" |
  rename properties.* as * | search status.errorCode=500121 status.additionalDetails="MFA
  denied; user declined the authentication" | bucket span=10m _time | rename userAgent
  as user_agent | fillnull | stats count min(_time) as firstTime max(_time) as lastTime
  values(dest) as dest values(user_agent) as user_agent values(src) as src by user
  status.additionalDetails vendor_account vendor_product signature _time | where count
  > 9 | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` |
  `azure_ad_multiple_denied_mfa_requests_for_user_filter`'
explanation: The following analytic detects an unusually high number of denied Multi-Factor
  Authentication (MFA) requests for a single user within a 10-minute window, specifically
  when more than nine MFA prompts are declined. It leverages Azure Active Directory
  (Azure AD) sign-in logs, focusing on "Sign-in activity" events with error code 500121
  and additional details indicating "MFA denied; user declined the authentication."
  This behavior is significant as it may indicate a targeted attack or account compromise
  attempt, with the user actively declining unauthorized access. If confirmed malicious,
  it could lead to data exfiltration, lateral movement, or further malicious activities.
source: Splunk Security Content
source_url: https://research.splunk.com/detections/d0895c20-de71-4fd2-b56c-3fcdb888eba1/
indicators:
- type: data_source
  value: Azure Active Directory Sign-in activity
  confidence: high
- type: risk_user
  value: user
  confidence: high
false_positives:
- description: Multiple denifed MFA requests in a short period of span may also be
    a sign of authentication errors. Investigate and filter as needed.
  mitigation: Review context and user activity
