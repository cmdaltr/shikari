technique_id: T1105
technique_name: Suspicious Dropbox API Usage
tactic: exfiltration
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection and not 1 of\
  \ filter_main_*\nfilter_main_legit_dropbox:\n  Image|contains: \\Dropbox\nselection:\n\
  \  DestinationHostname|endswith:\n  - api.dropboxapi.com\n  - content.dropboxapi.com\n\
  \  Initiated: 'true'\n"
explanation: Detects an executable that isn't dropbox but communicates with the Dropbox
  API
false_positives:
- Legitimate use of the API with a tool that the author wasn't aware of
references:
- https://app.any.run/tasks/7e906adc-9d11-447f-8641-5f40375ecebb
- https://www.zscaler.com/blogs/security-research/new-espionage-attack-molerats-apt-targeting-users-middle-east
tags:
- attack.command-and-control
- attack.exfiltration
- attack.t1105
- attack.t1567.002
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Initiated: 'true'
    DestinationHostname|endswith:
    - api.dropboxapi.com
    - content.dropboxapi.com
  filter_main_legit_dropbox:
    Image|contains: \Dropbox
  condition: selection and not 1 of filter_main_*
