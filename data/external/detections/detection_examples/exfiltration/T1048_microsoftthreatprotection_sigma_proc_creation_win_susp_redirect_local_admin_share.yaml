technique_id: T1048
technique_name: Suspicious Redirection to Local Admin Share
tactic: exfiltration
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.86
validated: true
source: sigma
sigma_id: ab9e3b40-0c85-4ba1-aede-455d226fd124
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_redirect:\n  CommandLine|contains: '>'\nselection_share:\n  CommandLine|contains:\n\
  \  - \\\\\\\\127.0.0.1\\\\admin$\\\\\n  - \\\\\\\\localhost\\\\admin$\\\\\n"
explanation: Detects a suspicious output redirection to the local admins share, this
  technique is often found in malicious scripts or hacktool stagers
false_positives:
- Unknown
references:
- https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/
- http://blog.talosintelligence.com/2022/09/lazarus-three-rats.html
tags:
- attack.exfiltration
- attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  selection_redirect:
    CommandLine|contains: '>'
  selection_share:
    CommandLine|contains:
    - \\\\127.0.0.1\\admin$\\
    - \\\\localhost\\admin$\\
  condition: all of selection_*
