query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: selection\nselection:\n\
  \  eventName:\n  - ModifyDBCluster\n  - DeleteDBCluster\n  eventSource: rds.amazonaws.com\n"
explanation: Detects modifications to an RDS cluster or its deletion, which may indicate
  potential data exfiltration attempts, unauthorized access, or exposure of sensitive
  information.
false_positives:
- Verify if the modification or deletion was performed by an authorized administrator.
- Confirm if the modification or deletion was part of a planned change or maintenance
  activity.
