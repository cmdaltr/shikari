technique_id: T1012
technique_name: Exports Critical Registry Keys To a File
tactic: exfiltration
platform: MicrosoftThreatProtection
connectorId: MicrosoftThreatProtection
fidelity_score: 0.9
validated: true
source: sigma
sigma_id: 82880171-b475-4201-b811-e9c826cd5eaa
level: high
query: "# Sigma Detection Logic\n# Convert to platform-specific query using Sigma\
  \ tools:\n# https://github.com/SigmaHQ/sigma\n\ncondition: all of selection_*\n\
  selection_cli_1:\n  CommandLine|contains|windash: ' -E '\nselection_cli_2:\n  CommandLine|contains:\n\
  \  - hklm\n  - hkey_local_machine\nselection_cli_3:\n  CommandLine|endswith:\n \
  \ - \\system\n  - \\sam\n  - \\security\nselection_img:\n- Image|endswith: \\regedit.exe\n\
  - OriginalFileName: REGEDIT.EXE\n"
explanation: Detects the export of a crital Registry key to a file.
false_positives:
- Dumping hives for legitimate purpouse i.e. backup or forensic investigation
references:
- https://lolbas-project.github.io/lolbas/Binaries/Regedit/
- https://gist.github.com/api0cradle/cdd2d0d0ec9abb686f0e89306e277b8f
tags:
- attack.exfiltration
- attack.discovery
- attack.t1012
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \regedit.exe
  - OriginalFileName: REGEDIT.EXE
  selection_cli_1:
    CommandLine|contains|windash: ' -E '
  selection_cli_2:
    CommandLine|contains:
    - hklm
    - hkey_local_machine
  selection_cli_3:
    CommandLine|endswith:
    - \system
    - \sam
    - \security
  condition: all of selection_*
