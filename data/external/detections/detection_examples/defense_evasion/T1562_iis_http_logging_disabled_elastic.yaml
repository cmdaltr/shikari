false_positives:
- description: 'False positive analysis


    - This activity is unlikely to happen legitimately. Benign true positives (B-TPs)
    can be added as exceptions if necessary.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - Re-enable affected logging components, services, and security monitoring.

    - Run a full antimalware scan. This may reveal additional artifacts left in the
    system, persist'
  mitigation: Review investigation guide for details
