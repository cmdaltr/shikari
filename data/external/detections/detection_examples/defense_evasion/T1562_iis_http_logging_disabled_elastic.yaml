technique_id: T1562
technique_name: IIS HTTP Logging Disabled
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (process.name : \"appcmd.exe\" or ?process.pe.original_file_name == \"appcmd.exe\"\
  ) and\n  process.args : \"/dontLog*:*True\" and\n  not process.parent.name : \"\
  iissetup.exe\""
explanation: 'Identifies when Internet Information Services (IIS) HTTP Logging is
  disabled on a server. An attacker with IIS server

  access via a webshell or other mechanism can disable HTTP Logging as an effective
  anti-forensics measure.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ebf1adea-ccf2-4943-8b96-7ab11ca173a5.toml
