technique_id: T1203
technique_name: Suspicious Zoom Child Process
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.88
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.name : \"Zoom.exe\" and process.name : (\"cmd.exe\", \"powershell.exe\"\
  , \"pwsh.exe\", \"powershell_ise.exe\")"
explanation: 'A suspicious Zoom child process was detected, which may indicate an
  attempt to run unnoticed. Verify process details

  such as command line, network connections, file writes and associated file signature
  details as well.'
source: Elastic Detection Rules
