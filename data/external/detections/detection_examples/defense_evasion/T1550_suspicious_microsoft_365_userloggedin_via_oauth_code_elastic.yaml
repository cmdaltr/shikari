technique_id: T1550
technique_name: Suspicious Microsoft 365 UserLoggedIn via OAuth Code
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "from logs-o365.audit-*\n| where\n    event.dataset == \"o365.audit\" and\n\
  \    event.action == \"UserLoggedIn\" and\n    source.ip is not null and\n    o365.audit.UserId\
  \ is not null and\n    o365.audit.ApplicationId is not null and\n    o365.audit.UserType\
  \ in (\"0\", \"2\", \"3\", \"10\") and\n    o365.audit.ApplicationId in (\"aebc6443-996d-45c2-90f0-388ff96faa56\"\
  , \"29d9ed98-a469-4536-ade2-f981bc1d605e\") and\n    o365.audit.ObjectId in (\"\
  00000003-0000-0000-c000-000000000000\")\n| eval\n    Esql.time_window_date_trunc\
  \ = date_trunc(30 minutes, @timestamp),\n    Esql.oauth_authorize_user_id_case =\
  \ case(\n        o365.audit.ExtendedProperties.RequestType == \"OAuth2:Authorize\"\
  \ and o365.audit.ExtendedProperties.ResultStatusDetail == \"Redirect\",\n      \
  \  o365.audit.UserId,\n        null\n    ),\n    Esql.oauth_token_user_id_case =\
  \ case(\n        o365.audit.ExtendedProperties.RequestType == \"OAuth2:Token\",\n\
  \        o365.audit.UserId,\n        null\n    )\n| stats\n    Esql.source_ip_count_distinct\
  \ = count_distinct(source.ip),\n    Esql.source_ip_values = values(source.ip),\n\
  \    Esql.o365_audit_ApplicationId_values = values(o365.audit.ApplicationId),\n\
  \    Esql.source_as_organization_name_values = values(source.`as`.organization.name),\n\
  \    Esql.oauth_token_count_distinct = count_distinct(Esql.oauth_token_user_id_case),\n\
  \    Esql.oauth_authorize_count_distinct = count_distinct(Esql.oauth_authorize_user_id_case)\n\
  \  by\n    o365.audit.UserId,\n    Esql.time_window_date_trunc,\n    o365.audit.ApplicationId,\n\
  \    o365.audit.ObjectId\n| keep\n    Esql.time_window_date_trunc,\n    Esql.source_ip_values,\n\
  \    Esql.source_ip_count_distinct,\n    Esql.o365_audit_ApplicationId_values,\n\
  \    Esql.source_as_organization_name_values,\n    Esql.oauth_token_count_distinct,\n\
  \    Esql.oauth_authorize_count_distinct\n| where\n    Esql.source_ip_count_distinct\
  \ >= 2 and\n    Esql.oauth_token_count_distinct > 0 and\n    Esql.oauth_authorize_count_distinct\
  \ > 0"
explanation: 'Identifies sign-ins on behalf of a principal user to the Microsoft Graph
  API from multiple IPs using the Microsoft

  Authentication Broker or Visual Studio Code application. This behavior may indicate
  an adversary using a phished OAuth

  refresh token.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/36188365-f88f-4f70-8c1d-0b9554186b9c.toml
query_type: esql
query_language: esql
indicators:
- type: data_source
  value: Microsoft 365
  confidence: high
- type: data_source
  value: Microsoft 365 Audit Logs
  confidence: high
false_positives:
- description: 'False Positive Analysis


    - Developers or IT administrators working across environments may also produce
    similar behavior.


    ### Response and Remediation


    - If confirmed unauthorized, revoke all refresh tokens for the affected user and
    remove any devices registered during this session.

    - Notify the user and determine whether the device join or authentication activity
    was expected.

    - Audit Conditional Access and broker permissions (`29d9ed98-a469-4536-ade2-f981bc1d605e`)
    to ensure policies enforce'
  mitigation: Review investigation guide for details
