technique_id: T1562.001
technique_name: Microsoft 365 Exchange DKIM Signing Configuration Disabled
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:o365.audit and event.provider:Exchange and event.category:web
  and event.action:"Set-DkimSigningConfig" and o365.audit.Parameters.Enabled:False
  and event.outcome:success
explanation: 'Identifies when a DomainKeys Identified Mail (DKIM) signing configuration
  is disabled in Microsoft 365. With DKIM in

  Microsoft 365, messages that are sent from Exchange Online will be cryptographically
  signed. This will allow the

  receiving email system to validate that the messages were generated by a server
  that the organization authorized and

  were not spoofed.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/514121ce-c7b6-474a-8237-68ff71672379.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Microsoft 365
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative changes: Sometimes, DKIM signing configurations may be
    disabled temporarily during routine maintenance or updates by authorized IT personnel.
    To manage this, establish a process to document and approve such changes, and
    create exceptions in the monitoring system for these documented events.

    - Testing and troubleshooting: IT teams may disable DKIM as part of testing or
    troubleshooting email configurations. Ensure that these activities are logged
    a'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/powershell/module/exchange/set-dkimsigningconfig?view=exchange-ps
has_investigation_guide: true
risk_score: 47
