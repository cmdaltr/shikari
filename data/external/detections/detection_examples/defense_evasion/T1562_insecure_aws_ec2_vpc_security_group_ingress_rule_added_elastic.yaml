technique_id: T1562
technique_name: Insecure AWS EC2 VPC Security Group Ingress Rule Added
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset: \"aws.cloudtrail\"\n    and event.provider: ec2.amazonaws.com\n\
  \    and event.action: AuthorizeSecurityGroupIngress\n    and event.outcome: success\n\
  \    and aws.cloudtrail.flattened.request_parameters.ipPermissions.items.ipRanges.items.cidrIp:\
  \ (\"0.0.0.0/0\" or \"::/0\")\n    and aws.cloudtrail.flattened.request_parameters.ipPermissions.items.fromPort:\
  \ (\n        21 or 22 or 23 or 445 or 3389 or 5985 or 5986)"
explanation: Identifies when a specified inbound (ingress) rule is added or adjusted
  for a VPC security group in AWS EC2. This rule detects when a security group rule
  is added that allows traffic from any IP address or from a specific IP address to
  common remote access ports, such as 22 (SSH) or 3389 (RDP). Adversaries may add
  these rules to allow remote access to VPC instances from any location, increasing
  the attack surface and potentially exposing the instances to unauthorized access.
