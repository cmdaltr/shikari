technique_id: T1550
technique_name: Local Account TokenFilter Policy Disabled
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : \"LocalAccountTokenFilterPolicy\" and\n  registry.path : (\n\
  \    \"HKLM\\\\*\\\\LocalAccountTokenFilterPolicy\",\n    \"\\\\REGISTRY\\\\MACHINE\\\
  \\*\\\\LocalAccountTokenFilterPolicy\",\n    \"MACHINE\\\\*\\\\LocalAccountTokenFilterPolicy\"\
  \n  ) and registry.data.strings : (\"1\", \"0x00000001\") and\n  not process.executable\
  \ : (\n    /* Intune */\n    \"C:\\\\Windows\\\\system32\\\\deviceenroller.exe\"\
  ,\n    \"C:\\\\Windows\\\\system32\\\\omadmclient.exe\",\n\n    /* Crowdstrike specific\
  \ exclusion as it uses NT Object paths */\n    \"\\\\Device\\\\HarddiskVolume*\\\
  \\system32\\\\deviceenroller.exe\",\n    \"\\\\Device\\\\HarddiskVolume*\\\\system32\\\
  \\omadmclient.exe\"\n  )"
explanation: 'Identifies registry modification to the LocalAccountTokenFilterPolicy
  policy. If this value exists (which doesn''t by

  default) and is set to 1, then remote connections from all local members of Administrators
  are granted full

  high-integrity tokens during negotiation.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/07b1ef73-1fde-4a49-a34a-5dd40011b076.toml
