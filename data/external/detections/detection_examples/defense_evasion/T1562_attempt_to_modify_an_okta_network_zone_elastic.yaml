technique_id: T1562
technique_name: Attempt to Modify an Okta Network Zone
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:okta.system and event.action:(zone.update or network_zone.rule.disabled
  or zone.remove_blacklist)
explanation: 'Detects attempts to modify an Okta network zone. Okta network zones
  can be configured to limit or restrict access to a

  network based on IP addresses or geolocations. An adversary may attempt to modify,
  delete, or deactivate an Okta network

  zone in order to remove or weaken an organization''s security controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e48236ca-b67a-4b4e-840c-fdc7782bc0c3.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis:


    - Check if there were issues with the Okta system at the time of the modification
    attempt. This could indicate a system error rather than a genuine threat activity.

    - Check the geographical location (`okta.request.ip_chain.geographical_context`)
    and time of the modification attempt. If these match the actor''s normal behavior,
    it might be a false positive.

    - Verify the actor''s administrative rights to ensure they are correctly configured.


    ### Response and remediation:'
  mitigation: Review investigation guide for details
references:
- https://help.okta.com/en/prod/Content/Topics/Security/network/network-zones.htm
- https://developer.okta.com/docs/reference/api/system-log/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 47
