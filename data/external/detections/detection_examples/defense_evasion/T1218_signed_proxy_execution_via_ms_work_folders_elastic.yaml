technique_id: T1218
technique_name: Signed Proxy Execution via MS Work Folders
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"control.exe\" and process.parent.name : \"WorkFolders.exe\"\
  \ and\n  not process.executable : (\n    \"?:\\\\Windows\\\\System32\\\\control.exe\"\
  ,\n    \"?:\\\\Windows\\\\SysWOW64\\\\control.exe\",\n\n    /* Crowdstrike specific\
  \ condition as it uses NT Object paths */\n    \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\System32\\\\control.exe\",\n    \"\\\\Device\\\\HarddiskVolume*\\\\\
  Windows\\\\SysWOW64\\\\control.exe\"\n  )"
explanation: 'Identifies the use of Windows Work Folders to execute a potentially
  masqueraded control.exe file in the current working

  directory. Misuse of Windows Work Folders could indicate malicious activity.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ad0d2742-9a49-11ec-8d6b-acde48001122.toml
query_type: eql
query_language: eql
indicators:
