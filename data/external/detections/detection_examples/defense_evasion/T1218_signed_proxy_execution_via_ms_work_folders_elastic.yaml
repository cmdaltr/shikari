false_positives:
- description: 'False positive analysis


    - Windows Work Folders are used legitimately by end users and administrators for
    file sharing and syncing but not in the instance where a suspicious control.exe
    is passed as an argument.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - Review the Work Folders synced share to determine if the control.exe was shared
    and if so remove it.

    - If'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/windows-server/storage/work-folders/work-folders-overview
- https://twitter.com/ElliotKillick/status/1449812843772227588
- https://lolbas-project.github.io/lolbas/Binaries/WorkFolders/
