  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Windows Security Event Logs
  confidence: high
- type: data_source
  value: Microsoft Defender for Endpoint
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
