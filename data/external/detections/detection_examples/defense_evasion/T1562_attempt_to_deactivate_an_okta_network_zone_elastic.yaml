technique_id: T1562
technique_name: Attempt to Deactivate an Okta Network Zone
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:okta.system and event.action:zone.deactivate
explanation: 'Detects attempts to deactivate an Okta network zone. Okta network zones
  can be configured to limit or restrict access to

  a network based on IP addresses or geolocations. An adversary may attempt to modify,
  delete, or deactivate an Okta

  network zone in order to remove or weaken an organization''s security controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8a5c1e5f-ad63-481e-b53a-ef959230f7f1.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis


    - Check the `okta.client.user_agent.raw_user_agent` field to understand the device
    and software used by the actor. If these match the actor''s normal behavior, it
    might be a false positive.

    - Check if the actor is a known administrator or part of the IT team who might
    have a legitimate reason to deactivate a network zone.

    - Verify the actor''s actions with any known planned changes or maintenance activities.


    ### Response and remediation


    - If unauthorized access or action'
  mitigation: Review investigation guide for details
references:
- https://help.okta.com/en/prod/Content/Topics/Security/network/network-zones.htm
- https://developer.okta.com/docs/reference/api/system-log/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 47
