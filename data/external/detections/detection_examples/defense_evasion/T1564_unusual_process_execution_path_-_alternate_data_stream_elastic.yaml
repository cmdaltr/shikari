technique_id: T1564
technique_name: Unusual Process Execution Path - Alternate Data Stream
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.args : \"?:\\\\*:*\" and\n  (\n    process.args_count == 1 and\n\n  \
  \  /* Excludes bug where a missing closing quote sets args_count to 1 despite extra\
  \ args */\n    not process.command_line regex~ \"\"\"\\\".*\\.exe[^\\\"].* \"\"\"\
  \  )"
explanation: 'Identifies processes running from an Alternate Data Stream. This is
  uncommon for legitimate processes and sometimes done

  by adversaries to hide malware.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/4bd1c1af-79d4-4d37-9efa-6e0240640242.toml
