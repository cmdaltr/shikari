technique_id: T1218
technique_name: Control Panel Process with Unusual Arguments
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"control.exe\" and\n  process.command_line : (\n    \"*.jpg*\"\
  , \"*.png*\",\n    \"*.gif*\", \"*.bmp*\",\n    \"*.jpeg*\", \"*.TIFF*\",\n    \"\
  *.inf*\", \"*.cpl:*/*\",\n    \"*../../..*\",\n    \"*/AppData/Local/*\",\n    \"\
  *:\\\\Users\\\\Public\\\\*\",\n    \"*\\\\AppData\\\\Local\\\\*\"\n)"
explanation: 'Identifies unusual instances of Control Panel with suspicious keywords
  or paths in the process command line value.

  Adversaries may abuse control.exe to proxy execution of malicious code.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/416697ae-e468-4093-a93d-59661fa619ec.toml
query_type: eql
query_language: eql
