false_positives:
- description: 'False positive analysis


    - Image file paths in command-line arguments may trigger false positives if users
    or applications are legitimately accessing image files through control.exe. To
    mitigate this, create exceptions for known applications or user activities that
    frequently access image files.

    - Paths involving AppData or Users\Public directories might be flagged if legitimate
    software installations or updates use these locations. Review and whitelist specific
    software processes that are known'
  mitigation: Review investigation guide for details
