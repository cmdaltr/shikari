technique_id: T1620
technique_name: Memory Threat - Detected - Elastic Defend
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: 'event.kind : alert and event.code : (memory_signature or shellcode_thread)
  and (event.type : allowed or (event.type: denied and event.outcome: failure))'
explanation: 'Generates a detection alert each time an Elastic Defend alert for memory
  signatures are received. Enabling this rule

  allows you to immediately begin investigating your Endpoint memory signature alerts.
  This rule identifies Elastic Defend

  memory signature detections only, and does not include prevention alerts.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/017de1e4-ea35-11ee-a417-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
false_positives:
- description: "False positive analysis\n\n- False positives may include Yara signature\
    \ matches on generic keywords or some third party softwares performing code injection\
    \ (often all involved files are signed and by the same vendor).\n\n### Response\
    \ and Remediation\n\n- Initiate the incident response process based on the outcome\
    \ of the triage.\n  - If malicious activity is confirmed, perform a broader investigation\
    \ to identify the scope of the compromise and determine the appropriate remediation\
    \ steps.\n- Implement Ela"
  mitigation: Review investigation guide for details
references:
- https://github.com/elastic/protections-artifacts/tree/main/yara
- https://docs.elastic.co/en/integrations/endpoint
has_investigation_guide: true
risk_score: 73
