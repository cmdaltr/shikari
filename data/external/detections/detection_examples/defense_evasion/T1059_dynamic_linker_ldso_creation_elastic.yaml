technique_id: T1059
technique_name: Dynamic Linker (ld.so) Creation
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"linux\" and event.type == \"creation\" and process.executable\
  \ != null and\nfile.path like~ (\"/lib/ld-linux*.so*\", \"/lib64/ld-linux*.so*\"\
  , \"/usr/lib/ld-linux*.so*\", \"/usr/lib64/ld-linux*.so*\") and\nnot process.executable\
  \ in (\n    \"/bin/dpkg\", \"/usr/bin/dpkg\", \"/bin/dockerd\", \"/usr/bin/dockerd\"\
  , \"/usr/sbin/dockerd\", \"/bin/microdnf\",\n    \"/usr/bin/microdnf\", \"/bin/rpm\"\
  , \"/usr/bin/rpm\", \"/bin/snapd\", \"/usr/bin/snapd\", \"/bin/yum\", \"/usr/bin/yum\"\
  ,\n    \"/bin/dnf\", \"/usr/bin/dnf\", \"/bin/podman\", \"/usr/bin/podman\", \"\
  /bin/dnf-automatic\", \"/usr/bin/dnf-automatic\",\n    \"/bin/pacman\", \"/usr/bin/pacman\"\
  , \"/usr/bin/dpkg-divert\", \"/bin/dpkg-divert\", \"/sbin/apk\", \"/usr/sbin/apk\"\
  ,\n    \"/usr/local/sbin/apk\", \"/usr/bin/apt\", \"/usr/sbin/pacman\", \"/bin/podman\"\
  , \"/usr/bin/podman\", \"/usr/bin/puppet\",\n    \"/bin/puppet\", \"/opt/puppetlabs/puppet/bin/puppet\"\
  , \"/usr/bin/chef-client\", \"/bin/chef-client\",\n    \"/bin/autossl_check\", \"\
  /usr/bin/autossl_check\", \"/proc/self/exe\", \"/dev/fd/*\",  \"/usr/bin/pamac-daemon\"\
  ,\n    \"/bin/pamac-daemon\", \"/usr/lib/snapd/snapd\", \"/usr/local/bin/dockerd\"\
  , \"/usr/libexec/platform-python\",\n    \"/usr/lib/snapd/snap-update-ns\", \"./usr/bin/podman\"\
  , \"/usr/bin/crio\", \"/usr/bin/buildah\", \"/bin/dnf5\",\n    \"/usr/bin/dnf5\"\
  , \"/usr/bin/pamac\"\n)"
explanation: 'This rule detects the creation of the dynamic linker (ld.so). The dynamic
  linker is used to load shared libraries

  needed by an executable. Attackers may attempt to replace the dynamic linker with
  a malicious version to execute

  arbitrary code.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/06d555e4-c8ce-4d90-90e1-ec7f66df5a6a.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - Package managers like yum, dnf, microdnf, and pacman can trigger false positives
    when they update or install packages that involve the dynamic linker. These processes
    are already excluded in the rule, but ensure any custom package managers or scripts
    are also considered for exclusion.

    - Container management tools such as dockerd may create or modify ld.so files
    during container operations. If you use other container tools, consider adding
    them to the exclusion list to'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
