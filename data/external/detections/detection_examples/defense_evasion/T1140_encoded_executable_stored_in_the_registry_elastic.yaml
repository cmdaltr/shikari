false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may write encoded executables to
    the registry as part of their normal operation. Users can create exceptions for
    known software by identifying their specific registry paths and excluding them
    from the detection rule.

    - Security tools and system management software might store encoded data in the
    registry for legitimate purposes. Review the registry paths and data associated
    with these tools and exclude them if they are verif'
