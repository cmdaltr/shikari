technique_id: T1140
technique_name: Encoded Executable Stored in the Registry
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.88
validated: true
query: "registry where host.os.type == \"windows\" and\n/* update here with encoding\
  \ combinations */\n registry.data.strings : \"TVqQAAMAAAAEAAAA*\""
explanation: 'Identifies registry write modifications to hide an encoded portable
  executable. This could be indicative of adversary

  defense evasion by avoiding the storing of malicious content directly on disk.'
