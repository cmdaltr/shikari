technique_id: T1562.008
technique_name: AWS S3 Bucket Server Access Logging Disabled
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "info where event.dataset == \"aws.cloudtrail\"\n   and event.provider == \"\
  s3.amazonaws.com\"\n   and event.action == \"PutBucketLogging\"\n   and event.outcome\
  \ == \"success\"\n   and not stringContains(aws.cloudtrail.request_parameters, \"\
  LoggingEnabled\")"
explanation: 'Identifies when server access logging is disabled for an Amazon S3 bucket.
  Server access logs provide a detailed record

  of requests made to an S3 bucket. When server access logging is disabled for a bucket,
  it could indicate an adversary''s

  attempt to impair defenses by disabling logs that contain evidence of malicious
  activity.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a6788d4b-b241-4bf0-8986-a3b4315c5b70.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: Amazon S3
  confidence: high
false_positives:
- description: "False positive analysis\n\n- Storage teams may disable logging temporarily\
    \ during migration or cost-optimisation exercises.  \n- Test or development buckets\
    \ may routinely toggle logging for experimentation—document such buckets and roles.\
    \  \n- Trusted automation (tagged, known user-agent, internal IPs) may adjust\
    \ logging. Consider allow-listing such automation while preserving watch-points\
    \ for changes to high-sensitivity buckets.\n\n### Response and remediation\n\n\
    **1. Contain & restore visibility**"
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketLogging.html
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/enable-server-access-logging.html
has_investigation_guide: true
risk_score: 47
