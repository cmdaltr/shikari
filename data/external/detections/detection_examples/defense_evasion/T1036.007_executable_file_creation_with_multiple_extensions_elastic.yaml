technique_id: T1036.007
technique_name: Executable File Creation with Multiple Extensions
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "file where host.os.type == \"windows\" and event.type == \"creation\" and\
  \ file.extension : \"exe\" and\n  file.name regex~ \"\"\".*\\.(vbs|vbe|bat|js|cmd|wsh|ps1|pdf|docx?|xlsx?|pptx?|txt|rtf|gif|jpg|png|bmp|hta|txt|img|iso)\\\
  .exe\"\"\" and\n  not (\n      process.executable : (\n          \"?:\\\\Windows\\\
  \\System32\\\\msiexec.exe\",\n          \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\
  \\System32\\\\msiexec.exe\",\n          \"*\\\\Users\\\\*\\\\QGIS_SCCM\\\\Files\\\
  \\QGIS-OSGeo4W-*-Setup-x86_64.exe\"\n      ) and\n      file.path : (\"?:\\\\Program\
  \ Files\\\\QGIS *\\\\apps\\\\grass\\\\*.exe\", \"\\\\Device\\\\HarddiskVolume*\\\
  \\Program Files\\\\QGIS *\\\\apps\\\\grass\\\\*.exe\")\n  ) and \n  not process.executable\
  \ : \n                             (\"C:\\\\Program Files\\\\dotnet\\\\dotnet.exe\"\
  , \n                              \"C:\\\\Program Files\\\\Microsoft Visual Studio\\\
  \\*.exe\",\n                              \"\\\\Device\\\\HarddiskVolume*\\\\Program\
  \ Files\\\\dotnet\\\\dotnet.exe\", \n                              \"\\\\Device\\\
  \\HarddiskVolume*\\\\Program Files\\\\Microsoft Visual Studio\\\\*.exe\")"
explanation: 'Masquerading can allow an adversary to evade defenses and better blend
  in with the environment. One way it occurs is

  when the name or location of a file is manipulated as a means of tricking a user
  into executing what they think is a

  benign file type but is actually executable code.'
source: Elastic Detection Rules
