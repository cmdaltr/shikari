false_positives:
- description: 'False positive analysis


    - Legitimate software installations may create executables with multiple extensions
    during setup processes. Users can exclude these by adding exceptions for known
    installer paths, such as "C:\Users\*\QGIS_SCCM\Files\QGIS-OSGeo4W-*-Setup-x86_64.exe".

    - System updates or patches might temporarily create files with multiple extensions.
    Monitor and verify these activities, and if confirmed as legitimate, add exceptions
    for the specific update processes.

    - Development environ'
  mitigation: Review investigation guide for details
has_investigation_guide: true
