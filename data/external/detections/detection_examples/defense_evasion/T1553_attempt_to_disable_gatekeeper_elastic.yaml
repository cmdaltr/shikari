technique_id: T1553
technique_name: Attempt to Disable Gatekeeper
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n process.name == \"spctl\" and\n process.args like~ \"--master-disable\""
explanation: 'Detects attempts to disable Gatekeeper on macOS. Gatekeeper is a security
  feature that''s designed to ensure that only

  trusted software is run. Adversaries may attempt to disable Gatekeeper before executing
  malicious code.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/4da13d6e-904f-4636-81d8-6ab14b4e6ae9.toml
query_type: eql
query_language: eql
indicators:
