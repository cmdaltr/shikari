technique_id: T1140
technique_name: Suspicious CertUtil Commands
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (process.name : \"certutil.exe\" or ?process.pe.original_file_name == \"CertUtil.exe\"\
  ) and\n  process.args : (\"?decode\", \"?encode\", \"?urlcache\", \"?verifyctl\"\
  , \"?encodehex\", \"?decodehex\", \"?exportPFX\")"
explanation: 'Identifies suspicious commands being used with certutil.exe. CertUtil
  is a native Windows component which is part of

  Certificate Services. CertUtil is often abused by attackers to live off the land
  for stealthier command and control or

  data exfiltration.'
source: Elastic Detection Rules
