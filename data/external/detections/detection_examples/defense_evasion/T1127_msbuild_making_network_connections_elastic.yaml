technique_id: T1127
technique_name: MsBuild Making Network Connections
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by process.entity_id with maxspan=30s\n\n  /* Look for MSBuild.exe\
  \ process execution */\n  /* The events for this first sequence may be noisy, consider\
  \ adding exceptions */\n  [process where host.os.type == \"windows\" and event.type\
  \ == \"start\" and\n    (\n      process.pe.original_file_name: \"MSBuild.exe\"\
  \ or\n      process.name: \"MSBuild.exe\"\n    ) and\n    not user.id == \"S-1-5-18\"\
  ]\n\n  /* Followed by a network connection to an external address */\n  /* Exclude\
  \ domains that are known to be benign */\n  [network where host.os.type == \"windows\"\
  \ and\n    event.action: (\"connection_attempted\", \"lookup_requested\") and\n\
  \    (\n      process.pe.original_file_name: \"MSBuild.exe\" or\n      process.name:\
  \ \"MSBuild.exe\"\n    ) and\n    not user.id == \"S-1-5-18\" and\n    not cidrmatch(destination.ip,\
  \ \"127.0.0.1\", \"::1\") and\n    not dns.question.name : (\n      \"localhost\"\
  ,\n      \"dc.services.visualstudio.com\",\n      \"vortex.data.microsoft.com\"\
  ,\n      \"api.nuget.org\")]"
explanation: 'Identifies MsBuild.exe making outbound network connections. This may
  indicate adversarial activity as MsBuild is often

  leveraged by adversaries to execute code and evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/0e79980b-4250-4a50-a509-69294c14e84b.toml
query_type: eql
query_language: eql
