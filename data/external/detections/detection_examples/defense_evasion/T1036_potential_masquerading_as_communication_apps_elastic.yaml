  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may temporarily result in unsigned
    or improperly signed processes. Users can create exceptions for known update processes
    to prevent false positives during these periods.

    - Custom or internally developed communication tools that mimic the names of popular
    apps might trigger alerts. Ensure these tools are properly signed and add them
    to an allowlist if they are trusted.

    - Some third-party security or monitoring tools may inte'
  mitigation: Review investigation guide for details
