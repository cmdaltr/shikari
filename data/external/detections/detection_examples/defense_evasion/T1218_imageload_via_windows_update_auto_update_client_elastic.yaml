technique_id: T1218
technique_name: ImageLoad via Windows Update Auto Update Client
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (?process.pe.original_file_name == \"wuauclt.exe\" or process.name : \"wuauclt.exe\"\
  ) and\n   /* necessary windows update client args to load a dll */\n   process.args\
  \ : \"/RunHandlerComServer\" and process.args : \"/UpdateDeploymentProvider\" and\n\
  \   /* common paths writeable by a standard user where the target DLL can be placed\
  \ */\n   process.args : (\"C:\\\\Users\\\\*.dll\", \"C:\\\\ProgramData\\\\*.dll\"\
  , \"C:\\\\Windows\\\\Temp\\\\*.dll\", \"C:\\\\Windows\\\\Tasks\\\\*.dll\")"
explanation: 'Identifies abuse of the Windows Update Auto Update Client (wuauclt.exe)
  to load an arbitrary DLL. This behavior is used

  as a defense evasion technique to blend-in malicious activity with legitimate Windows
  software.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/edf8ee23-5ea7-4123-ba19-56b41e424ae3.toml
