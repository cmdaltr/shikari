false_positives:
- description: 'False positive analysis


    - System administrators or automated scripts may remount /proc with hidepid=2
    for legitimate privacy or security reasons. To handle this, create exceptions
    for known administrative scripts or users by excluding their specific command
    lines or user IDs.

    - Some security tools or monitoring solutions might use hidepid=2 as part of their
    normal operation to enhance system security. Identify these tools and exclude
    their processes from triggering alerts by adding them to an a'
  mitigation: Review investigation guide for details
