technique_id: T1564
technique_name: Potential Hidden Process via Mount Hidepid
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"executed\", \"process_started\"\
  ) and\n  process.name == \"mount\" and process.args == \"/proc\" and process.args\
  \ == \"-o\" and process.args : \"*hidepid=2*\" and\n  not process.parent.command_line\
  \ like \"/opt/cloudlinux/*\""
explanation: 'Identifies the execution of mount process with hidepid parameter, which
  can make processes invisible to other users from

  the system. Adversaries using Linux kernel version 3.2+ (or RHEL/CentOS v6.5+ above)
  can hide the process from other

  users. When hidepid=2 option is executed to mount the /proc filesystem, only the
  root user can see all processes and the

  logged-in user can only see their own process. This provides a defense evasion mechanism
  for the adversaries to hide

  their process executions from all other commands such as ps, top, pgrep and more.
  With the Linux kernel hardening

  hidepid option all the user has to do is remount the /proc filesystem with the option,
  which can now be monitored and

  detected.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/dc71c186-9fe4-4437-a4d0-85ebb32b8204.toml
