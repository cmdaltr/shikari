technique_id: T1202
technique_name: Windows Subsystem for Linux Distribution Installed
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\
  \ registry.value : \"PackageFamilyName\" and\n registry.path : \"*\\\\SOFTWARE\\\
  \\Microsoft\\\\Windows\\\\CurrentVersion\\\\Lxss\\\\*\\\\PackageFamilyName\""
explanation: 'Detects changes to the registry that indicates the install of a new
  Windows Subsystem for Linux distribution by name.

  Adversaries may enable and use WSL for Linux to avoid detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a1699af0-8e1e-4ed0-8ec1-89783538a061.toml
query_type: eql
query_language: eql
