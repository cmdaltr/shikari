technique_id: T1053
technique_name: Scheduled Tasks AT Command Enabled
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : \"EnableAt\" and\n  registry.data.strings : (\"1\", \"0x00000001\"\
  )"
explanation: 'Identifies attempts to enable the Windows scheduled tasks AT command
  via the registry. Attackers may use this method to

  move laterally or persist locally. The AT command has been deprecated since Windows
  8 and Windows Server 2012, but still

  exists for backwards compatibility.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9aa0e1f6-52ce-42e1-abb3-09657cee2698.toml
