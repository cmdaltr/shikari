technique_id: T1098
technique_name: AWS First Occurrence of STS GetFederationToken Request by User
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset: \"aws.cloudtrail\"\n    and event.provider:sts.amazonaws.com\n\
  \    and event.action:GetFederationToken\n    and event.outcome:success"
explanation: 'Identifies the first occurrence of an AWS Security Token Service (STS)
  GetFederationToken request made by a user. The GetFederationToken API call allows
  users to request temporary security credentials to

  access AWS resources. The maximum expiration period for these tokens is 36 hours
  and they can be used to create a console signin token even for identities that don''t
  already have one. Adversaries may use this API to obtain temporary credentials for
  persistence and to bypass IAM API call limitations by gaining console access.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7a5cc9a8-5ea3-11ef-beec-f661ea17fbce.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: AWS STS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine administrative tasks by cloud administrators may trigger the rule if
    they are using `GetFederationToken` for legitimate purposes. To manage this, create
    exceptions for known administrative accounts that regularly perform these actions.

    - Automated scripts or applications that use `GetFederationToken` for legitimate
    operations might be flagged. Identify these scripts and exclude their associated
    user accounts from the rule to prevent unnecessary alerts.

    - Third-'
  mitigation: Review investigation guide for details
references:
- https://hackingthe.cloud/aws/post_exploitation/survive_access_key_deletion_with_sts_getfederationtoken/
- https://www.crowdstrike.com/en-us/blog/how-adversaries-persist-with-aws-user-federation/
- https://medium.com/@adan.alvarez/how-attackers-persist-in-aws-using-getfederationtoken-a-simple-and-effective-technique-used-in-the-987ec1f0bdfe/
has_investigation_guide: true
risk_score: 47
