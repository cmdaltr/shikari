technique_id: T1036
technique_name: Untrusted Driver Loaded
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "driver where host.os.type == \"windows\" and process.pid == 4 and\n  (dll.code_signature.trusted\
  \ == false or dll.code_signature.exists == false) and\n  not dll.code_signature.status\
  \ : (\"errorExpired\", \"errorRevoked\", \"errorCode_endpoint:*\")"
explanation: 'Identifies attempt to load an untrusted driver. Adversaries may modify
  code signing policies to enable execution of

  unsigned or self-signed code.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d8ab1ec1-feeb-48b9-89e7-c12e189448aa.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
