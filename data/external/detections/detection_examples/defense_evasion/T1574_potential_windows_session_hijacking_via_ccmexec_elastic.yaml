technique_id: T1574
technique_name: Potential Windows Session Hijacking via CcmExec
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "library where host.os.type == \"windows\" and process.name : \"SCNotification.exe\"\
  \ and\n  (dll.Ext.relative_file_creation_time < 86400 or dll.Ext.relative_file_name_modify_time\
  \ <= 500) and dll.code_signature.status != \"trusted\""
explanation: 'This detection rule identifies when ''SCNotification.exe'' loads an
  untrusted DLL, which is a potential indicator of an

  attacker attempt to hijack/impersonate a Windows user session.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e7357fec-6e9c-41b9-b93d-6e4fc40c7d47.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may trigger the rule if they involve
    recent DLL file creation or modification. Users can create exceptions for known
    software update processes to prevent unnecessary alerts.

    - System maintenance activities, such as patch management or configuration changes,
    might cause SCNotification.exe to load new DLLs. Exclude these activities by identifying
    and whitelisting trusted maintenance operations.

    - Custom or in-house application'
  mitigation: Review investigation guide for details
references:
- https://cloud.google.com/blog/topics/threat-intelligence/windows-session-hijacking-via-ccmexec
- https://mayfly277.github.io/posts/SCCM-LAB-part0x3/#impersonate-users---revshell-connected-users
has_investigation_guide: true
risk_score: 47
