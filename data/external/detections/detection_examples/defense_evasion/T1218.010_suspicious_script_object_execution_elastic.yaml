technique_id: T1218.010
technique_name: Suspicious Script Object Execution
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "any where host.os.type == \"windows\" and\n (event.category : (\"library\"\
  , \"driver\") or (event.category == \"process\" and event.action : \"Image loaded*\"\
  )) and\n (?dll.name : \"scrobj.dll\" or ?file.name : \"scrobj.dll\") and\n process.executable\
  \ : (\"?:\\\\Windows\\\\System32\\\\*.exe\", \"?:\\\\Windows\\\\SysWOW64\\\\*.exe\"\
  ) and\n not process.executable : (\n       \"?:\\\\Windows\\\\System32\\\\cscript.exe\"\
  ,\n       \"?:\\\\Windows\\\\SysWOW64\\\\cscript.exe\",\n       \"?:\\\\Windows\\\
  \\system32\\\\msiexec.exe\",\n       \"?:\\\\Windows\\\\SysWOW64\\\\msiexec.exe\"\
  ,\n       \"?:\\\\Windows\\\\System32\\\\smartscreen.exe\",\n       \"?:\\\\Windows\\\
  \\system32\\\\taskhostw.exe\",\n       \"?:\\\\windows\\\\system32\\\\inetsrv\\\\\
  w3wp.exe\",\n       \"?:\\\\windows\\\\SysWOW64\\\\inetsrv\\\\w3wp.exe\",\n    \
  \   \"?:\\\\Windows\\\\system32\\\\wscript.exe\",\n       \"?:\\\\Windows\\\\SysWOW64\\\
  \\wscript.exe\",\n       \"?:\\\\Windows\\\\System32\\\\mshta.exe\",\n       \"\
  ?:\\\\Windows\\\\system32\\\\mobsync.exe\",\n       \"?:\\\\Windows\\\\SysWOW64\\\
  \\mobsync.exe\",\n       \"?:\\\\Windows\\\\System32\\\\cmd.exe\",\n       \"?:\\\
  \\Windows\\\\SysWOW64\\\\cmd.exe\",\n       \"?:\\\\Windows\\\\System32\\\\OpenWith.exe\"\
  ,\n       \"?:\\\\Windows\\\\System32\\\\wbem\\\\WMIADAP.exe\",\n       \"?:\\\\\
  Windows\\\\System32\\\\WindowsPowerShell\\\\v1.0\\\\powershell.exe\")"
explanation: 'Identifies scrobj.dll loaded into unusual Microsoft processes. This
  usually means a malicious scriptlet is being

  executed in the target process.'
