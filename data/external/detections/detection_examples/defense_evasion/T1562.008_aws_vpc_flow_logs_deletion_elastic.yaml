technique_id: T1562.008
technique_name: AWS VPC Flow Logs Deletion
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.dataset:aws.cloudtrail and event.provider:ec2.amazonaws.com and event.action:DeleteFlowLogs
  and event.outcome:success
explanation: Identifies the deletion of one or more flow logs in AWS Elastic Compute
  Cloud (EC2). An adversary may delete flow logs in an attempt to evade defenses.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9395fd2c-9947-4472-86ef-4aceb2f7e872.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS EC2
  confidence: high
false_positives:
- description: 'False positive analysis


    - If this rule is noisy in your environment due to expected activity, consider
    adding exceptions — preferably with a combination of user and IP address conditions.

    - Administrators may rotate these logs after a certain period as part of their
    retention policy or after importing them to a SIEM.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Disable or limit the account during the investigation and response.

    -'
  mitigation: Review investigation guide for details
references:
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/ec2/delete-flow-logs.html
- https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DeleteFlowLogs.html
has_investigation_guide: true
risk_score: 73
