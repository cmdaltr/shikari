technique_id: T1036
technique_name: Renamed Automation Script Interpreter
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n   (process.pe.original_file_name : \"AutoIt*.exe\" and not process.name :\
  \ \"AutoIt*.exe\") or\n   (process.pe.original_file_name == \"AutoHotkey.exe\" and\
  \ not process.name : (\"AutoHotkey*.exe\", \"InternalAHK.exe\")) or\n   (process.pe.original_file_name\
  \ == \"KIX32.EXE\" and not process.name : \"KIX*.exe\" and process.executable :\
  \ (\"?:\\\\Users\\\\*.exe\", \"?:\\\\ProgramData\\\\*.exe\", \"\\\\Device\\\\HarddiskVolume*\\\
  \\Users\\\\*.exe\", \"\\\\Device\\\\HarddiskVolume*\\\\ProgramData\\\\*.exe\"))\n\
  \   )"
explanation: 'Identifies renamed Automation Script Interpreter process. Malware written
  as an AutoIt/AutoHotKey script tends to rename

  the main executable to avoid detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2e1e835d-01e5-48ca-b9fc-7a61f7f11902.toml
