technique_id: T1218
technique_name: Unusual Network Connection via DllHost
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id, process.entity_id with maxspan=1m\n  [process where host.os.type\
  \ == \"windows\" and event.type == \"start\" and process.name : \"dllhost.exe\"\
  \ and process.args_count == 1]\n  [network where host.os.type == \"windows\" and\
  \ process.name : \"dllhost.exe\" and\n   not cidrmatch(destination.ip, \"10.0.0.0/8\"\
  , \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \"192.0.0.0/24\",\n  \
  \  \"192.0.0.0/29\", \"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\", \"192.0.0.170/32\"\
  , \"192.0.0.171/32\", \"192.0.2.0/24\",\n    \"192.31.196.0/24\", \"192.52.193.0/24\"\
  , \"192.168.0.0/16\", \"192.88.99.0/24\", \"224.0.0.0/4\", \"100.64.0.0/10\",\n\
  \    \"192.175.48.0/24\", \"198.18.0.0/15\", \"198.51.100.0/24\", \"203.0.113.0/24\"\
  , \"240.0.0.0/4\", \"::1\", \"FE80::/10\",\n    \"FF00::/8\")]"
explanation: 'Identifies unusual instances of dllhost.exe making outbound network
  connections. This may indicate adversarial Command

  and Control activity.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c7894234-7814-44c2-92a9-f7d851ea246a.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software updates or system maintenance tasks may cause dllhost.exe
    to make outbound connections. Users can monitor and whitelist known update servers
    to prevent these from being flagged.

    - Certain enterprise applications might use dllhost.exe for legitimate network
    communications. Identify and document these applications, then create exceptions
    for their known IP addresses.

    - Automated scripts or administrative tools that leverage dllhost.exe for network
    tas'
  mitigation: Review investigation guide for details
references:
- https://www.microsoft.com/security/blog/2021/05/27/new-sophisticated-email-based-attack-from-nobelium/
- https://www.volexity.com/blog/2021/05/27/suspected-apt29-operation-launches-election-fraud-themed-phishing-campaigns/
- https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry.xhtml
has_investigation_guide: true
risk_score: 47
