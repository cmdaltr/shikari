technique_id: T1562
technique_name: Windows Defender Exclusions Added via PowerShell
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (process.name : (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\") or\
  \ ?process.pe.original_file_name in (\"PowerShell.EXE\", \"pwsh.dll\", \"powershell_ise.EXE\"\
  )) and\n  process.args : (\"*Add-MpPreference*\", \"*Set-MpPreference*\") and\n\
  \  process.args : (\"*-Exclusion*\")"
explanation: 'Identifies modifications to the Windows Defender configuration settings
  using PowerShell to add exclusions at the folder

  directory or process level.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2c17e5d7-08b9-43b2-b58a-0270d65ac85b.toml
