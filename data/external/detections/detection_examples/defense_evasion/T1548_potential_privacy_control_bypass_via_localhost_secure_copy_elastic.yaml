technique_id: T1548
technique_name: Potential Privacy Control Bypass via Localhost Secure Copy
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n process.name == \"scp\" and\n process.args like~ \"StrictHostKeyChecking=no\"\
  \ and\n process.command_line : (\"scp *localhost:/*\", \"scp *127.0.0.1:/*\") and\n\
  \ not process.args : \"vagrant@*127.0.0.1*\""
explanation: 'Identifies use of the Secure Copy Protocol (SCP) to copy files locally
  by abusing the auto addition of the Secure Shell

  Daemon (sshd) to the authorized application list for Full Disk Access. This may
  indicate attempts to bypass macOS

  privacy controls to access sensitive files.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c02c8b9f-5e1d-463c-a1b0-04edcdfe1a3d.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Vagrant usage can trigger false positives due to its legitimate use of SCP for
    local file transfers. To mitigate this, ensure that Vagrant-related SCP commands
    are excluded by refining the detection rule to ignore processes with arguments
    containing "vagrant@*127.0.0.1*".

    - Development and testing environments may frequently use SCP to localhost for
    legitimate purposes. Consider creating exceptions for known development tools
    or scripts that regularly perform these act'
  mitigation: Review investigation guide for details
references:
- https://www.trendmicro.com/en_us/research/20/h/xcsset-mac-malware--infects-xcode-projects--uses-0-days.html
has_investigation_guide: true
risk_score: 73
