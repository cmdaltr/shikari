technique_id: T1112
technique_name: Modification of AmsiEnable Registry Key
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value : \"AmsiEnable\" and registry.data.strings: (\"0\", \"0x00000000\"\
  )\n\n  /*\n    Full registry key path omitted due to data source variations:\n \
  \   HKEY_USERS\\\\*\\\\Software\\\\Microsoft\\\\Windows Script\\\\Settings\\\\AmsiEnable\"\
  \n  */"
explanation: 'Identifies modifications of the AmsiEnable registry key to 0, which
  disables the Antimalware Scan Interface (AMSI). An

  adversary can modify this key to disable AMSI protections.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f874315d-5188-4b4a-8521-d1c73093a7e4.toml
