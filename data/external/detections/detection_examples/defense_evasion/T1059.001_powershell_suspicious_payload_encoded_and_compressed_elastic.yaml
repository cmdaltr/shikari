technique_id: T1059.001
technique_name: PowerShell Suspicious Payload Encoded and Compressed
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    (\n      \"System.IO.Compression.DeflateStream\" or\n      \"System.IO.Compression.GzipStream\"\
  \ or\n      \"IO.Compression.DeflateStream\" or\n      \"IO.Compression.GzipStream\"\
  \n    ) and\n    FromBase64String\n  ) and\n  not user.id : \"S-1-5-18\""
explanation: 'Identifies the use of .NET functionality for decompression and base64
  decoding combined in PowerShell scripts, which

  malware and security tools heavily use to deobfuscate payloads and load them directly
  in memory to bypass defenses.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/81fe9dc6-a2d7-4192-a2d8-eed98afc766a.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This activity is unlikely to happen legitimately outside engineering or IT business
    units. As long as the analyst did not identify malware or suspicious activity
    related to the user or host, this alert can be dismissed.


