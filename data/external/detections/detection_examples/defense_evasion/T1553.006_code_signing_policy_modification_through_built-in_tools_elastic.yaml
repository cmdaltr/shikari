technique_id: T1553.006
technique_name: Code Signing Policy Modification Through Built-in tools
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (process.name: \"bcdedit.exe\" or ?process.pe.original_file_name == \"bcdedit.exe\"\
  ) and process.args: (\"-set\", \"/set\") and \n  process.args: (\"TESTSIGNING\"\
  , \"nointegritychecks\", \"loadoptions\", \"DISABLE_INTEGRITY_CHECKS\")"
explanation: 'Identifies attempts to disable/modify the code signing policy through
  system native utilities. Code signing provides

  authenticity on a program, and grants the user with the ability to check whether
  the program has been tampered with. By

  allowing the execution of unsigned or self-signed code, threat actors can craft
  and execute malicious code.'
source: Elastic Detection Rules
