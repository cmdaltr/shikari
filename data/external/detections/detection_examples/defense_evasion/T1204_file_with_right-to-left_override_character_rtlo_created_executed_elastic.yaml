  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: Microsoft Defender for Endpoint
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may use RTLO characters in file
    names to manage versioning or localization, which can trigger false positives.
    Users can create exceptions for known software vendors or specific installation
    directories to reduce these alerts.

    - Some file management or backup applications might use RTLO characters in temporary
    file names for internal processing. Identifying these applications and excluding
    their specific file paths from moni'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
