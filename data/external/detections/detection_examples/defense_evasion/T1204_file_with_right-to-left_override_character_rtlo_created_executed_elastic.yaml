technique_id: T1204
technique_name: File with Right-to-Left Override Character (RTLO) Created/Executed
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "any where host.os.type == \"windows\" and event.category in (\"file\", \"\
  process\") and\n  (\n    (event.type == \"creation\" and file.path : \"*\\u{202E}*\"\
  ) or \n    (event.type == \"start\" and process.name : \"*\\u{202E}*\")\n  )"
explanation: 'Identifies the creation or execution of files or processes with names
  containing the Right-to-Left Override (RTLO)

  character, which can be used to disguise the file extension and trick users into
  executing malicious files.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7e763fd1-228a-4d43-be88-3ffc14cd7de1.toml
query_type: eql
query_language: eql
