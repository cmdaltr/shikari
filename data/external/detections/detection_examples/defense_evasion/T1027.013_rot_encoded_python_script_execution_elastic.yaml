technique_id: T1027.013
technique_name: ROT Encoded Python Script Execution
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by process.entity_id with maxspan=1m\n [process where host.os.type\
  \ in (\"windows\", \"macos\") and event.type == \"start\" and process.name : \"\
  python*\"]\n [file where host.os.type in (\"windows\", \"macos\") and\n  event.action\
  \ != \"deletion\" and process.name : \"python*\" and file.name : \"rot_??.cpython-*.pyc*\"\
  ]"
explanation: 'Identifies the execution of a Python script that uses the ROT cipher
  for letters substitution. Adversaries may

  use this method to encode and obfuscate part of their malicious code in legit python
  packages.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5ab49127-b1b3-46e6-8a38-9e8512a2a363.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate development activities may trigger the rule if developers use ROT
    encoding for testing or educational purposes. To manage this, create exceptions
    for known development environments or specific user accounts involved in such
    activities.

    - Automated scripts or tools that use ROT encoding for legitimate data processing
    tasks can be flagged. Identify these scripts and whitelist their execution paths
    or associated process names to prevent false alerts.

    - Some sec'
  mitigation: Review investigation guide for details
references:
- https://www.elastic.co/security-labs/dprk-code-of-conduct
- https://www.reversinglabs.com/blog/fake-recruiter-coding-tests-target-devs-with-malicious-python-packages
has_investigation_guide: true
risk_score: 47
