technique_id: T1036
technique_name: Agent Spoofing - Multiple Hosts Using Same Agent
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.agent_id_status:* and not tags:forwarded
explanation: 'Detects when multiple hosts are using the same agent ID. This could
  occur in the event of an agent being taken over and

  used to inject illegitimate documents into an instance as an attempt to spoof events
  in order to masquerade actual

  activity to evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/493834ca-f861-414c-8602-150d5505b777.toml
query_type: threshold
query_language: kuery
false_positives:
- description: 'False positive analysis


    - Legitimate load balancing or failover scenarios where multiple hosts are configured
    to use the same agent ID for redundancy can trigger false positives. Users should
    identify and document these configurations, then create exceptions in the detection
    rule to exclude these known non-threatening behaviors.

    - Virtualized environments where snapshots or clones of a host are created might
    result in multiple instances reporting the same agent ID. Users should ensure
    that each'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
