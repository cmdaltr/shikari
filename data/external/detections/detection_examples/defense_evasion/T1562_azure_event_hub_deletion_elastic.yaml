technique_id: T1562
technique_name: Azure Event Hub Deletion
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:azure.activitylogs and azure.activitylogs.operation_name:"MICROSOFT.EVENTHUB/NAMESPACES/EVENTHUBS/DELETE"
  and event.outcome:(Success or success)
explanation: 'Identifies an Event Hub deletion in Azure. An Event Hub is an event
  processing service that ingests and processes large

  volumes of events and data. An adversary may delete an Event Hub in an attempt to
  evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e0f36de1-0342-453d-95a9-a068b257b053.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance or updates by authorized personnel can trigger deletion
    logs. Verify if the deletion aligns with scheduled maintenance activities and
    exclude these operations from alerts.

    - Automated scripts or tools used for managing Azure resources might delete Event
    Hubs as part of their normal operation. Identify these scripts and whitelist their
    activity to prevent false positives.

    - Test environments often involve frequent creation and deletion of resources,'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/azure/event-hubs/event-hubs-about
- https://azure.microsoft.com/en-in/services/event-hubs/
- https://docs.microsoft.com/en-us/azure/event-hubs/event-hubs-features
has_investigation_guide: true
risk_score: 47
