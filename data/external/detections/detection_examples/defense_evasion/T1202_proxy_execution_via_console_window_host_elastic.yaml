technique_id: T1202
technique_name: Proxy Execution via Console Window Host
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.name : \"conhost.exe\" and process.args : \"--headless\" and\n  process.command_line\
  \ : (\"*powershell*\", \"*cmd *\", \"*cmd.exe *\", \"*script*\", \"*mshta*\", \"\
  *curl *\", \"*curl.exe *\", \"*^*^*^*\", \"*.bat*\", \"*.cmd*\", \"*schtasks*\"\
  , \"*@SSL*\", \"*http*\", \"* \\\\\\\\*\", \"*.vbs*\", \"*.js*\", \"*mhsta*\")"
explanation: 'Identifies abuse of the Console Window Host (conhost.exe) to execute
  commands via proxy. This behavior is used as a defense

  evasion technique to blend-in malicious activity with legitimate Windows software.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/fcd16fe8-eb29-42b3-8aee-6c9ad777a2f6.toml
query_type: eql
query_language: eql
