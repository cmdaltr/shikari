false_positives:
- description: 'False positive analysis


    - This is a dual-use tool, meaning its usage is not inherently malicious. Analysts
    can dismiss the alert if the administrator is aware of the activity, no other
    suspicious activity was identified.


    ### Response and Remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - Run a full antimalware scan. This may reveal additional artifacts left in the
    system, persisten'
  mitigation: Review investigation guide for details
