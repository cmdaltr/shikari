technique_id: T1562
technique_name: Route53 Resolver Query Log Configuration Deleted
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset:aws.cloudtrail and event.provider: route53resolver.amazonaws.com\n\
  \    and event.action: DeleteResolverQueryLogConfig and event.outcome: success"
explanation: 'Identifies when a Route53 Resolver Query Log Configuration is deleted.
  When a Route53 Resolver query log configuration

  is deleted, Resolver stops logging DNS queries and responses for the specified configuration.
  Adversaries may delete

  query log configurations to evade detection or cover their tracks.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/453183fa-f903-11ee-8e88-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: Amazon Route53
  confidence: high
false_positives:
- description: 'False Positive Analysis


    - **Legitimate Administrative Actions**: Confirm that the deletion was part of
    scheduled IT operations or network management activities, possibly linked to maintenance
    or infrastructure updates. Validate this action against change management records
    or through interviews with relevant personnel.


    ### Response and Remediation


    - **Restore Logs if Feasible**: If the deletion was unauthorized, consider restoring
    the configuration from backups to ensure continuous visibility'
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/Route53/latest/APIReference/API_route53resolver_DeleteResolverQueryLogConfig.html
has_investigation_guide: true
risk_score: 47
