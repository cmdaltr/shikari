false_positives:
- description: 'False positive analysis


    - System processes like systemd and cf-agent may invoke chattr for legitimate
    reasons, such as system maintenance or configuration management. To handle these,
    exclude these processes by adding them to the exception list in the detection
    rule.

    - Scheduled tasks or scripts that use chattr to manage file attributes for security
    or operational purposes can trigger false positives. Identify these tasks and
    exclude their parent processes from the rule.

    - Administrative action'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
