    \ legitimate purposes (e.g., moving newsletters).\n- Outlook plugins or automated\
    \ email management tools could create rules that resemble this behavior.\n- Newly\
    \ onboarded employees might configure rules for personal filtering without malicious\
    \ intent.\n\n### Response and remediation\n\n- If the rule is determined to be\
    \ malicious:\n  - Remove the inbox rule immediately.\n  - Review the user’s mailbox\
    \ for signs of data theft or additional ma"
  mitigation: Review investigation guide for details
