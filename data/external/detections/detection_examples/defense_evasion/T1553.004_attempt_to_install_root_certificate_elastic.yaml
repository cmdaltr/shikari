technique_id: T1553.004
technique_name: Attempt to Install Root Certificate
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n  process.name == \"security\" and process.args like \"add-trusted-cert\"\
  \ and\n  (process.parent.name like~ (\"osascript\", \"bash\", \"sh\", \"zsh\", \"\
  Terminal\", \"Python*\") or (process.parent.code_signature.exists == false or process.parent.code_signature.trusted\
  \ == false))"
explanation: 'Adversaries may install a root certificate on a compromised system to
  avoid warnings when connecting to their command

  and control servers. Root certificates are used in public key cryptography to identify
  a root certificate authority

  (CA). When a root certificate is installed, the system or application will trust
  certificates in the root''s chain of

  trust that have been signed by the root certificate.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/bc1eeacf-2972-434f-b782-3a532b100d67.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Security software installations or updates may trigger the rule as they often
    involve legitimate root certificate installations. Users can handle this by adding
    exceptions for known security software paths, such as Bitdefender, to prevent
    unnecessary alerts.

    - System administrators performing routine maintenance or updates might install
    root certificates as part of their tasks. To mitigate this, create exceptions
    for processes executed by trusted admin accounts or duri'
  mitigation: Review investigation guide for details
references:
- https://ss64.com/osx/security-cert.html
has_investigation_guide: true
risk_score: 47
