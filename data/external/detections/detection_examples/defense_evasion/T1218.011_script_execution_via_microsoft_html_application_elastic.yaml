false_positives:
- description: 'False positive analysis


    - Execution of legitimate scripts by enterprise applications like Citrix, Microsoft
    Office, or Quokka.Works GTInstaller can trigger false positives. Users can mitigate
    this by adding these applications to the exclusion list in the detection rule.

    - Scripts executed by mshta.exe that do not involve malicious intent, such as
    internal web applications or administrative scripts, may be flagged. Users should
    review these scripts and, if deemed safe, exclude them based on spec'
  mitigation: Review investigation guide for details
