technique_id: T1202
technique_name: Attempt to Install Kali Linux via WSL
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  (\n  (process.name : \"wsl.exe\" and process.args : (\"-d\", \"--distribution\"\
  , \"-i\", \"--install\") and process.args : \"kali*\") or\n  process.executable\
  \ : (\n    \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\packages\\\\kalilinux*\",\n\
  \    \"?:\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\\WindowsApps\\\\kali.exe\"\
  ,\n    \"?:\\\\Program Files*\\\\WindowsApps\\\\KaliLinux.*\\\\kali.exe\",\n\n \
  \   /* Crowdstrike specific exclusion as it uses NT Object paths */\n    \"\\\\\
  Device\\\\HarddiskVolume*\\\\Users\\\\*\\\\AppData\\\\Local\\\\packages\\\\kalilinux*\"\
  ,\n    \"\\\\Device\\\\HarddiskVolume*\\\\Users\\\\*\\\\AppData\\\\Local\\\\Microsoft\\\
  \\WindowsApps\\\\kali.exe\",\n    \"\\\\Device\\\\HarddiskVolume*\\\\Program Files*\\\
  \\WindowsApps\\\\KaliLinux.*\\\\kali.exe\"\n  )\n)"
explanation: 'Detects attempts to install or use Kali Linux via Windows Subsystem
  for Linux. Adversaries may enable and use WSL for

  Linux to avoid detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/dd34b062-b9e3-4a6b-8c0c-6c8ca6dd450e.toml
query_type: eql
query_language: eql
