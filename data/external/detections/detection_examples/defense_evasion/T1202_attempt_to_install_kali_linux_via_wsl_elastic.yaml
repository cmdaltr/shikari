false_positives:
- description: 'False positive analysis


    - Legitimate use of Kali Linux for development or educational purposes may trigger
    the rule. Users can create exceptions for specific user accounts or groups known
    to use Kali Linux for authorized activities.

    - Automated scripts or deployment tools that install or configure Kali Linux as
    part of a legitimate IT process might be flagged. Consider whitelisting these
    scripts or processes by their hash or path.

    - Security researchers or IT professionals conducting penetratio'
  mitigation: Review investigation guide for details
