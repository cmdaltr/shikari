false_positives:
- description: 'False positive analysis


    - Security tools or scripts that automate tasks may trigger false positives if
    they launch endpoint security processes with unexpected parent processes. To manage
    this, identify and document these tools, then add their parent executable paths
    to the exclusion list.

    - System administrators or IT personnel may use command-line tools like PowerShell
    or cmd.exe for legitimate maintenance tasks. If these tasks frequently trigger
    alerts, consider adding specific command-line a'
  mitigation: Review investigation guide for details
