technique_id: T1070
technique_name: Clearing Windows Console History
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n    process.name : (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\"\
  ) or\n    ?process.pe.original_file_name in (\"PowerShell.EXE\", \"pwsh.dll\", \"\
  powershell_ise.EXE\")\n  ) and\n  (\n    process.args : \"*Clear-History*\" or\n\
  \    (process.args : (\"*Remove-Item*\", \"rm\") and process.args : (\"*ConsoleHost_history.txt*\"\
  , \"*(Get-PSReadlineOption).HistorySavePath*\")) or\n    (process.args : \"*Set-PSReadlineOption*\"\
  \ and process.args : \"*SaveNothing*\")\n  )"
explanation: 'Identifies when a user attempts to clear console history. An adversary
  may clear the command history of a compromised

  account to conceal the actions undertaken during an intrusion.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b5877334-677f-4fb9-86d5-a9721274223b.toml
query_type: eql
query_language: eql
