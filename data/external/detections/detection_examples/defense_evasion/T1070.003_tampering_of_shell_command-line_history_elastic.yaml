technique_id: T1070.003
technique_name: Tampering of Shell Command-Line History
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where event.action in (\"exec\", \"exec_event\", \"executed\", \"\
  process_started\") and event.type == \"start\" and\n (\n  ((process.args : (\"rm\"\
  , \"echo\") or\n    (process.args : \"ln\" and process.args : \"-sf\" and process.args\
  \ : \"/dev/null\") or\n    (process.args : \"truncate\" and process.args : \"-s0\"\
  ))\n    and process.args : (\".bash_history\", \"/root/.bash_history\", \"/home/*/.bash_history\"\
  ,\"/Users/.bash_history\", \"/Users/*/.bash_history\",\n                       \
  \ \".zsh_history\", \"/root/.zsh_history\", \"/home/*/.zsh_history\", \"/Users/.zsh_history\"\
  , \"/Users/*/.zsh_history\")) or\n  (process.args : \"history\" and process.args\
  \ : \"-c\") or\n  (process.args : \"export\" and process.args : (\"HISTFILE=/dev/null\"\
  , \"HISTFILESIZE=0\")) or\n  (process.args : \"unset\" and process.args : \"HISTFILE\"\
  ) or\n  (process.args : \"set\" and process.args : \"history\" and process.args\
  \ : \"+o\")\n )"
explanation: 'Adversaries may attempt to clear or disable the Bash command-line history
  in an attempt to evade detection or forensic

  investigations.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7bcbb3ac-e533-41ad-a612-d6c3bf666aba.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Elastic Endgame
  confidence: high
- type: data_source
  value: Auditd Manager
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - System administrators or automated scripts may clear command-line history as
    part of routine maintenance or privacy measures. To handle this, identify and
    whitelist known scripts or user accounts that perform these actions regularly.

    - Developers or power users might redirect or unset history files to manage disk
    space or for personal preference. Consider excluding specific user accounts or
    directories from monitoring if these actions are verified as non-malicious.

    - S'
  mitigation: Review investigation guide for details
references:
- https://www.elastic.co/security-labs/detecting-log4j2-with-elastic-security
has_investigation_guide: true
risk_score: 47
