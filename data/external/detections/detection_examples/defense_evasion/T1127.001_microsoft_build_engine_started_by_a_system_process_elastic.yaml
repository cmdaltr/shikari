  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may trigger MSBuild.exe to start
    from Explorer or WMI. Monitor these events and verify if they coincide with known
    software changes.

    - Development environments where MSBuild is frequently used might see this behavior
    as part of normal operations. Identify and document these environments to create
    exceptions for known development machines.

    - Automated scripts or administrative tools that leverage MSBuild for legitimate
    tasks'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
