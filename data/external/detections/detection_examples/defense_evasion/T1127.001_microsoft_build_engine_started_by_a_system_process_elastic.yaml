technique_id: T1127.001
technique_name: Microsoft Build Engine Started by a System Process
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.88
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"MSBuild.exe\" and\n  process.parent.name : (\"explorer.exe\"\
  , \"wmiprvse.exe\")"
explanation: 'An instance of MSBuild, the Microsoft Build Engine, was started by Explorer
  or the WMI (Windows Management

  Instrumentation) subsystem. This behavior is unusual and is sometimes used by malicious
  payloads.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/9d110cb3-5f4b-4c9a-b9f5-53f0a1707ae3.toml
query_type: eql
query_language: eql
