false_positives:
- description: 'False positive analysis


    - Routine file operations by legitimate applications using WSL may trigger alerts.
    Identify and whitelist these applications to prevent unnecessary alerts.

    - Development activities involving WSL, such as compiling code or running scripts,
    can generate false positives. Exclude specific development directories or processes
    from monitoring.

    - Automated backup or synchronization tools that interact with WSL might be flagged.
    Configure exceptions for these tools by specifying'
  mitigation: Review investigation guide for details
references:
- https://github.com/microsoft/WSL
has_investigation_guide: true
