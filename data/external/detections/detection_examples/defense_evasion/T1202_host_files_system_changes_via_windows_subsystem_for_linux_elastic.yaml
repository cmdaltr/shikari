technique_id: T1202
technique_name: Host Files System Changes via Windows Subsystem for Linux
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "sequence by process.entity_id with maxspan=5m\n [process where host.os.type\
  \ == \"windows\" and event.type == \"start\" and\n  process.name : \"dllhost.exe\"\
  \ and\n   /* Plan9FileSystem CLSID - WSL Host File System Worker */\n  process.command_line\
  \ : \"*{DFB65C4C-B34F-435D-AFE9-A86218684AA8}*\"]\n [file where host.os.type ==\
  \ \"windows\" and process.name : \"dllhost.exe\" and not file.path : \"?:\\\\Users\\\
  \\*\\\\Downloads\\\\*\"]"
explanation: 'Detects files creation and modification on the host system from the
  the Windows Subsystem for Linux. Adversaries may

  enable and use WSL for Linux to avoid detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e88d1fe9-b2f4-48d4-bace-a026dc745d4b.toml
query_type: eql
query_language: eql
