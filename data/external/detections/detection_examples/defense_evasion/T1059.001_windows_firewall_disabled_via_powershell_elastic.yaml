technique_id: T1059.001
technique_name: Windows Firewall Disabled via PowerShell
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n    process.name : (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\"\
  ) or\n    ?process.pe.original_file_name in (\"PowerShell.EXE\", \"pwsh.dll\", \"\
  powershell_ise.EXE\")\n  ) and\n  process.args : \"*Set-NetFirewallProfile*\" and\n\
  \  process.args : \"*-Enabled*\" and process.args : \"*False*\" and\n  process.args\
  \ : (\"*-All*\", \"*Public*\", \"*Domain*\", \"*Private*\")"
explanation: 'Identifies when the Windows Firewall is disabled using PowerShell cmdlets,
  which can help attackers evade network

  constraints, like internet and network lateral communication restrictions.'
source: Elastic Detection Rules
