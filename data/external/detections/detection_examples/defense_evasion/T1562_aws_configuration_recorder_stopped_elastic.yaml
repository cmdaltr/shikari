technique_id: T1562
technique_name: AWS Configuration Recorder Stopped
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.dataset:aws.cloudtrail and event.provider:config.amazonaws.com and event.action:StopConfigurationRecorder
  and event.outcome:success
explanation: Identifies an AWS configuration change to stop recording a designated
  set of resources.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/fbd44836-0d69-4004-a0b4-03c20370c435.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance activities by authorized personnel can trigger the rule.
    To manage this, create exceptions for specific IAM roles or users known to perform
    these tasks regularly.

    - Automated scripts or tools used for configuration management might stop the
    recorder as part of their operation. Identify these scripts and exclude their
    actions from triggering alerts by using their unique identifiers or tags.

    - Scheduled configuration changes during non-peak hours may'
  mitigation: Review investigation guide for details
references:
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/configservice/stop-configuration-recorder.html
- https://docs.aws.amazon.com/config/latest/APIReference/API_StopConfigurationRecorder.html
has_investigation_guide: true
risk_score: 73
