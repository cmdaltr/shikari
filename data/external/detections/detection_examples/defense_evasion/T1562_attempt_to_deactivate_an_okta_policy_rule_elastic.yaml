technique_id: T1562
technique_name: Attempt to Deactivate an Okta Policy Rule
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:okta.system and event.action:policy.rule.deactivate
explanation: 'Detects attempts to deactivate a rule within an Okta policy. An adversary
  may attempt to deactivate a rule within an

  Okta policy in order to remove or weaken an organization''s security controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/cc92c835-da92-45c9-9f29-b4992ad621a0.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis:


    - Check if there were issues with the Okta system at the time of the deactivation
    attempt. This could indicate a system error rather than a genuine threat activity.

    - Check the geographical location (`okta.request.ip_chain.geographical_context`)
    and time of the deactivation attempt. If these match the actor''s normal behavior,
    it might be a false positive.

    - Verify the actor''s administrative rights to ensure they are correctly configured.


    ### Response and remediation:'
  mitigation: Review investigation guide for details
references:
- https://help.okta.com/en/prod/Content/Topics/Security/Security_Policies.htm
- https://developer.okta.com/docs/reference/api/system-log/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 47
