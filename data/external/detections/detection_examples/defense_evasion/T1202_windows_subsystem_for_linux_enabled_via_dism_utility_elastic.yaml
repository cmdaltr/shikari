false_positives:
- description: 'False positive analysis


    - This is a dual-use tool, meaning its usage is not inherently malicious. Analysts
    can dismiss the alert if the administrator is aware of the activity, no other
    suspicious activity was identified, and WSL is homologated and approved in the
    environment.


