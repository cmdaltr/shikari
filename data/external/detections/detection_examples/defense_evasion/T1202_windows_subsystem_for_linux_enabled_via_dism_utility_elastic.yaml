technique_id: T1202
technique_name: Windows Subsystem for Linux Enabled via Dism Utility
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type : \"start\" and\n\
  \ (process.name : \"Dism.exe\" or ?process.pe.original_file_name == \"DISM.EXE\"\
  ) and \n process.command_line : \"*Microsoft-Windows-Subsystem-Linux*\""
explanation: 'Detects attempts to enable the Windows Subsystem for Linux using Microsoft
  Dism utility. Adversaries may enable and use

  WSL for Linux to avoid detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e2e0537d-7d8f-4910-a11d-559bcf61295a.toml
query_type: eql
query_language: eql
