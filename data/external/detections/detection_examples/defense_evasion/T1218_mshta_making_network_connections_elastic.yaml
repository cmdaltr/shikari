technique_id: T1218
technique_name: Mshta Making Network Connections
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by process.entity_id with maxspan=10m\n  [process where host.os.type\
  \ == \"windows\" and event.type == \"start\" and process.name : \"mshta.exe\" and\n\
  \     not process.parent.name : \"Microsoft.ConfigurationManagement.exe\" and\n\
  \     not (process.parent.executable : \"C:\\\\Amazon\\\\Amazon Assistant\\\\amazonAssistantService.exe\"\
  \ or\n          process.parent.executable : \"C:\\\\TeamViewer\\\\TeamViewer.exe\"\
  ) and\n     not process.args : \"ADSelfService_Enroll.hta\"]\n  [network where host.os.type\
  \ == \"windows\" and process.name : \"mshta.exe\"]"
explanation: 'Identifies Mshta.exe making outbound network connections. This may indicate
  adversarial activity, as Mshta is often

  leveraged by adversaries to execute malicious scripts and evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c2d90150-0133-451c-a783-533e736c12d7.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Mshta.exe may be triggered by legitimate software updates or installations,
    such as those from Microsoft Configuration Management. To handle this, add exceptions
    for processes with parent names like Microsoft.ConfigurationManagement.exe.

    - Certain applications like Amazon Assistant and TeamViewer may use Mshta.exe
    for legitimate purposes. Exclude these by specifying their executable paths, such
    as C:\Amazon\Amazon Assistant\amazonAssistantService.exe and C:\TeamViewer\'
  mitigation: Review investigation guide for details
references:
- https://www.elastic.co/security-labs/elastic-protects-against-data-wiper-malware-targeting-ukraine-hermeticwiper
has_investigation_guide: true
risk_score: 47
