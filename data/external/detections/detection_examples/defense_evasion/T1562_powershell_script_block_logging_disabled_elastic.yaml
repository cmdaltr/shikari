technique_id: T1562
technique_name: PowerShell Script Block Logging Disabled
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \    registry.value : \"EnableScriptBlockLogging\" and\n    registry.data.strings\
  \ : (\"0\", \"0x00000000\") and\n    not process.executable : (\n          \"?:\\\
  \\Windows\\\\System32\\\\svchost.exe\",\n          \"?:\\\\Windows\\\\System32\\\
  \\DeviceEnroller.exe\",\n          \"?:\\\\Windows\\\\system32\\\\omadmclient.exe\"\
  ,\n          \"?:\\\\Program Files (x86)\\\\N-able Technologies\\\\AutomationManagerAgent\\\
  \\AutomationManager.AgentService.exe\",\n          \n          /* Crowdstrike specific\
  \ exclusion as it uses NT Object paths */\n          \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\System32\\\\svchost.exe\",\n          \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\System32\\\\DeviceEnroller.exe\",\n          \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\system32\\\\omadmclient.exe\",\n          \"\\\\Device\\\\HarddiskVolume*\\\
  \\Program Files (x86)\\\\N-able Technologies\\\\AutomationManagerAgent\\\\AutomationManager.AgentService.exe\"\
  \n    )"
explanation: 'Identifies attempts to disable PowerShell Script Block Logging via registry
  modification. Attackers may disable this

  logging to conceal their activities in the host and evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/818e23e6-2094-4f0e-8c01-22d30f3506c6.toml
