technique_id: T1218.005
technique_name: Suspicious Microsoft HTML Application Child Process
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ process.parent.name : \"mshta.exe\" and\n (\n  process.name : (\"cmd.exe\", \"\
  powershell.exe\", \"certutil.exe\", \"bitsadmin.exe\", \"curl.exe\", \"msiexec.exe\"\
  , \"schtasks.exe\", \"reg.exe\", \"wscript.exe\", \"rundll32.exe\") or\n  process.executable\
  \ : (\"C:\\\\Users\\\\*\\\\*.exe\", \"\\\\Device\\\\HarddiskVolume*\\\\Users\\\\\
  *\\\\*.exe\")\n  )"
explanation: 'Identifies Mshta.exe spawning a suspicious child process. This may indicate
  adversarial activity, as Mshta is often

  leveraged by adversaries to execute malicious scripts and evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/48e60a73-08e8-42aa-8f51-4ed92c64dbea.toml
query_type: eql
query_language: eql
