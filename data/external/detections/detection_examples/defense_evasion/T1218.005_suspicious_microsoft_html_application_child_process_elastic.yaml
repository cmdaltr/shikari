false_positives:
- description: 'False positive analysis


    - Mshta.exe may be triggered by legitimate software updates or installations,
    such as those from Microsoft Configuration Management. To handle this, add exceptions
    for processes with parent names like Microsoft.ConfigurationManagement.exe.

    - Certain applications like Amazon Assistant and TeamViewer may use Mshta.exe
    for legitimate purposes. Exclude these by specifying their executable paths, such
    as C:\Amazon\Amazon Assistant\amazonAssistantService.exe and C:\TeamViewer\'
  mitigation: Review investigation guide for details
references:
- https://lolbas-project.github.io/lolbas/Binaries/Mshta/
