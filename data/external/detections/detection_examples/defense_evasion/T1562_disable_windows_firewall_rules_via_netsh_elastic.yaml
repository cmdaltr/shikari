technique_id: T1562
technique_name: Disable Windows Firewall Rules via Netsh
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"netsh.exe\" and\n  (\n    (process.args : \"disable\" and process.args\
  \ : \"firewall\" and process.args : \"set\") or\n    (process.args : \"advfirewall\"\
  \ and process.args : \"off\" and process.args : \"state\")\n  )"
explanation: 'Identifies use of the netsh.exe to disable or weaken the local firewall.
  Attackers will use this command line tool to

  disable the firewall during troubleshooting or to enable network mobility.'
source: Elastic Detection Rules
