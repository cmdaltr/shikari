technique_id: T1562
technique_name: Disabling Lsa Protection via Registry Modification
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.data.strings != null and registry.value : \"RunAsPPL\" and\n  registry.path\
  \ : \"*\\\\SYSTEM\\\\*ControlSet*\\\\Control\\\\Lsa\\\\RunAsPPL\" and\n  not registry.data.strings\
  \ : (\"1\", \"0x00000001\", \"2\", \"0x00000002\")"
explanation: 'LSA protecton is provided to prevent nonprotected processes from reading
  memory and injecting code. This feature provides added security for the credentials
  that LSA stores and manages.

  Adversaries may modify the RunAsPPL registry and wait or initiate a system restart
  to enable Lsass credentials access.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/37cb6756-8892-4af3-a6bd-ddc56db0069d.toml
