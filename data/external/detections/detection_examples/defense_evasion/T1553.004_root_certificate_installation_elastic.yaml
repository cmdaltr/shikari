technique_id: T1553.004
technique_name: Root Certificate Installation
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and event.action\
  \ in (\"exec\", \"exec_event\", \"start\") and\nprocess.name in (\"update-ca-trust\"\
  , \"update-ca-certificates\") and not (\n  process.parent.name like (\n    \"ca-certificates.postinst\"\
  , \"ca-certificates-*.trigger\", \"pacman\", \"pamac-daemon\", \"autofirma.postinst\"\
  ,\n    \"ipa-client-install\", \"su\", \"platform-python\", \"python*\", \"kesl\"\
  , \"execd\", \"systemd\", \"flock\"\n  ) or\n  process.parent.args like \"/var/tmp/rpm*\"\
  \ or\n  (process.parent.name in (\"sh\", \"bash\", \"zsh\") and process.args ==\
  \ \"-e\")\n)"
explanation: 'This rule detects the installation of root certificates on a Linux system.
  Adversaries may install a root certificate on

  a compromised system to avoid warnings when connecting to their command and control
  servers. Root certificates are used

  in public key cryptography to identify a root certificate authority (CA). When a
  root certificate is installed, the

  system or application will trust certificates in the root''s chain of trust that
  have been signed by the root

  certificate.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/6ded0996-7d4b-40f2-bf4a-6913e7591795.toml
