    processes like "update-ca-trust" or "update-ca-certificates" are executed by trusted
    package managers such as "pacman" or "pamac-daemon". To mitigate this, ensure
    these parent processes are included in the exclusion list.

    - Automated scripts or system maintenance tasks that use shell scripts (e.g.,
    "sh", "bash", "zsh") to update certificates might be flagged. If these scripts
    are verified as s'
