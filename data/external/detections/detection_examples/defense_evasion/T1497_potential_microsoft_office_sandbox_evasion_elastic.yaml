technique_id: T1497
technique_name: Potential Microsoft Office Sandbox Evasion
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: file where host.os.type == "macos" and event.action in ("modification", "rename")
  and file.name like~ "~$*.zip"
explanation: 'Identifies the creation of a suspicious zip file prepended with special
  characters. Sandboxed Microsoft Office

  applications on macOS are allowed to write files that start with special characters,
  which can be combined with an

  AutoStart location to achieve sandbox evasion.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/d22a85c6-d2ad-4cc4-bf7b-54787473669a.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Files with special character prefixes created by legitimate applications or
    processes, such as temporary files generated by Microsoft Office during normal
    operations, may trigger the rule. Users can create exceptions for known benign
    applications that frequently generate such files.

    - Automated backup or synchronization tools that compress files into zip archives
    with special character prefixes might be flagged. Identify these tools and exclude
    their file creation even'
  mitigation: Review investigation guide for details
references:
- https://i.blackhat.com/USA-20/Wednesday/us-20-Wardle-Office-Drama-On-macOS.pdf
- https://www.mdsec.co.uk/2018/08/escaping-the-sandbox-microsoft-office-on-macos/
- https://desi-jarvis.medium.com/office365-macos-sandbox-escape-fcce4fa4123c
has_investigation_guide: true
risk_score: 73
