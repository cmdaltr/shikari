    alerts. To manage this, create exceptions for known IP addresses or user accounts
    that regularly perform these tasks.

    - Automated scripts or tools used for infrastructure management might modify firewall
    rules as part of their normal operation. Identify these scripts and exclude their
    actions from triggering alerts by using specific service accounts or tags.

    - Changes made during scheduled ma'
  mitigation: Review investigation guide for details
references:
- https://cloud.google.com/vpc/docs/firewalls
- https://cloud.google.com/appengine/docs/standard/python/understanding-firewalls
has_investigation_guide: true
