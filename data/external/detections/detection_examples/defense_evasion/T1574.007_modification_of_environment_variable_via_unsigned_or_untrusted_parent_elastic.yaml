technique_id: T1574.007
technique_name: Modification of Environment Variable via Unsigned or Untrusted Parent
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"macos\" and event.type in (\"start\", \"process_started\"\
  ) and\n  process.name == \"launchctl\" and\n  (process.parent.code_signature.exists\
  \ == false or process.parent.code_signature.trusted == false) and\n  process.args\
  \ == \"setenv\""
explanation: 'Identifies modifications to an environment variable using the built-in
  launchctl command. Adversaries may execute their

  own malicious payloads by hijacking certain environment variables to load arbitrary
  libraries or bypass certain

  restrictions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7453e19e-3dbf-4e4e-9ae0-33d6c6ed15e1.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Development tools like IntelliJ IDEA may trigger false positives when using
    the jspawnhelper executable. To mitigate this, add the executable path to the
    exclusion list if it is a known and trusted application in your environment.

    - NoMachine software can cause false positives due to its use of nxserver.bin.
    If this software is regularly used and trusted, consider excluding its executable
    path from the detection rule.

    - The kr tool located at /usr/local/bin/kr might be'
  mitigation: Review investigation guide for details
