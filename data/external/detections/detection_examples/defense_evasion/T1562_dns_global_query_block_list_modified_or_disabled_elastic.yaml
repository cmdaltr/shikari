technique_id: T1562
technique_name: DNS Global Query Block List Modified or Disabled
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\
  \ registry.data.strings != null and\n(\n  (registry.value : \"EnableGlobalQueryBlockList\"\
  \ and registry.data.strings : (\"0\", \"0x00000000\")) or\n  (registry.value : \"\
  GlobalQueryBlockList\" and not registry.data.strings : \"wpad\")\n)"
explanation: 'Identifies changes to the DNS Global Query Block List (GQBL), a security
  feature that prevents the resolution of certain

  DNS names often exploited in attacks like WPAD spoofing. Attackers with certain
  privileges, such as DNSAdmins, can

  modify or disable the GQBL, allowing exploitation of hosts running WPAD with default
  settings for privilege escalation

  and lateral movement.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/57bfa0a9-37c0-44d6-b724-54bf16787492.toml
