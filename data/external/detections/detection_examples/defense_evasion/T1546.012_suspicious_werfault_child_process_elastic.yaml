technique_id: T1546.012
technique_name: Suspicious WerFault Child Process
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \n  process.parent.name : \"WerFault.exe\" and\n\n  /* args -s and -t used to execute\
  \ a process via SilentProcessExit mechanism */\n  (process.parent.args : \"-s\"\
  \ and process.parent.args : \"-t\" and process.parent.args : \"-c\") and\n\n  not\
  \ process.executable : (\"?:\\\\Windows\\\\SysWOW64\\\\Initcrypt.exe\", \"?:\\\\\
  Program Files (x86)\\\\Heimdal\\\\Heimdal.Guard.exe\")"
explanation: 'A suspicious WerFault child process was detected, which may indicate
  an attempt to run via the SilentProcessExit

  registry key manipulation. Verify process details such as command line, network
  connections and file writes.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/ac5012b8-8da8-440b-aaaf-aedafdea2dff.toml
query_type: eql
query_language: eql
