false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may trigger WerFault.exe with command-line
    arguments similar to those used in the SilentProcessExit mechanism. Users should
    verify the digital signature of the executable and check if it aligns with known
    update processes.

    - Security software or system management tools might use WerFault.exe for legitimate
    purposes. Users can create exceptions for these known tools by adding their executables
    to the exclusion list in the det'
  mitigation: Review investigation guide for details
