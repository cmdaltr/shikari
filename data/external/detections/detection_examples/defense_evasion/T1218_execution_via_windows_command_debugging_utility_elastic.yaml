technique_id: T1218
technique_name: Execution via Windows Command Debugging Utility
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (?process.pe.original_file_name == \"CDB.Exe\" or process.name : \"cdb.exe\")\
  \ and\n  process.args : (\"-cf\", \"-c\", \"-pd\") and\n  not process.executable\
  \ : (\n        \"?:\\\\Program Files (x86)\\\\*\\\\cdb.exe\",\n        \"?:\\\\\
  Program Files\\\\*\\\\cdb.exe\",\n\n        /* Crowdstrike specific exclusion as\
  \ it uses NT Object paths */\n        \"\\\\Device\\\\HarddiskVolume*\\\\Program\
  \ Files (x86)\\\\*\\\\cdb.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\Program\
  \ Files\\\\*\\\\cdb.exe\"\n  )"
explanation: 'An adversary can use the Windows command line debugging utility cdb.exe
  to execute commands or shellcode. This rule

  looks for those instances and where the cdb.exe binary is outside of the normal
  WindowsKit installation paths.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/bdfaddc4-4438-48b4-bc43-9f5cf8151c46.toml
query_type: eql
query_language: eql
