false_positives:
- description: 'False positive analysis


    - Legitimate debugging activities by developers or IT staff using cdb.exe outside
    standard paths can trigger alerts. To manage this, create exceptions for known
    user accounts or specific machines frequently used for development.

    - Automated testing environments may execute cdb.exe with command-line arguments
    for legitimate purposes. Identify these environments and exclude their processes
    from triggering alerts.

    - Software installations or updates might temporarily use cd'
  mitigation: Review investigation guide for details
