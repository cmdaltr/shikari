technique_id: T1202
technique_name: Execution via Windows Subsystem for Linux
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type : \"start\" and\n\
  \  process.parent.name : (\"wsl.exe\", \"wslhost.exe\") and\n  not process.executable\
  \ : (\n        \"?:\\\\Program Files (x86)\\\\*\",\n        \"?:\\\\Program Files\\\
  \\*\",\n        \"?:\\\\Program Files*\\\\WindowsApps\\\\MicrosoftCorporationII.WindowsSubsystemForLinux_*\\\
  \\wsl*.exe\",\n        \"?:\\\\Windows\\\\System32\\\\conhost.exe\",\n        \"\
  ?:\\\\Windows\\\\System32\\\\lxss\\\\wslhost.exe\",\n        \"?:\\\\Windows\\\\\
  System32\\\\WerFault.exe\",\n        \"?:\\\\Windows\\\\Sys?????\\\\wslconfig.exe\"\
  \n  ) and\n  not (\n    /* Crowdstrike specific exclusion as it uses NT Object paths\
  \ */\n    event.dataset == \"crowdstrike.fdr\" and\n      process.executable : (\n\
  \        \"\\\\Device\\\\HarddiskVolume*\\\\Program Files (x86)\\\\*\",\n      \
  \  \"\\\\Device\\\\HarddiskVolume*\\\\Program Files\\\\*\",\n        \"\\\\Device\\\
  \\HarddiskVolume*\\\\Program Files*\\\\WindowsApps\\\\MicrosoftCorporationII.WindowsSubsystemForLinux_*\\\
  \\wsl*.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\\
  conhost.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\
  \\lxss\\\\wslhost.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\\
  System32\\\\WerFault.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\
  \\Sys?????\\\\wslconfig.exe\"\n      )\n  )"
explanation: 'Detects attempts to execute a program on the host from the Windows Subsystem
  for Linux. Adversaries may enable and use

  WSL for Linux to avoid detection.'
