technique_id: T1562.001
technique_name: Disabling Windows Defender Security Settings via PowerShell
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n    process.name : (\"powershell.exe\", \"pwsh.exe\", \"powershell_ise.exe\"\
  ) or\n    ?process.pe.original_file_name in (\"PowerShell.EXE\", \"pwsh.dll\", \"\
  powershell_ise.EXE\")\n  ) and\n  process.args : \"Set-MpPreference\" and process.args\
  \ : (\"-Disable*\", \"Disabled\", \"NeverSend\", \"-Exclusion*\")"
explanation: Identifies use of the Set-MpPreference PowerShell command to disable
  or weaken certain Windows Defender settings.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c8cccb06-faf2-4cd5-886e-2c9636cfcb87.toml
