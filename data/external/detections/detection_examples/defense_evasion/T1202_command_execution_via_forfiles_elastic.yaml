technique_id: T1202
technique_name: Command Execution via ForFiles
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (process.name : \"forfiles.exe\" or ?process.pe.original_file_name == \"forfiles.exe\"\
  ) and process.args : (\"/c\", \"-c\")"
explanation: 'Detects attempts to execute a command via the forfiles Windows utility.
  Adversaries may use this utility to proxy

  execution via a trusted parent process.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3f7bd5ac-9711-44b4-82c1-fa246d829f15.toml
query_type: eql
query_language: eql
