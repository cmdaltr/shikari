technique_id: T1070
technique_name: WebServer Access Logs Deleted
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "file where event.type == \"deletion\" and\n  file.path : (\"C:\\\\inetpub\\\
  \\logs\\\\LogFiles\\\\*.log\",\n               \"/var/log/apache*/access.log\",\n\
  \               \"/etc/httpd/logs/access_log\",\n               \"/var/log/httpd/access_log\"\
  ,\n               \"/var/www/*/logs/access.log\")"
explanation: 'Identifies the deletion of WebServer access logs. This may indicate
  an attempt to evade detection or destroy forensic

  evidence on a system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/665e7a4f-c58e-4fc6-bc83-87a7572670ac.toml
query_type: eql
query_language: eql
