  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine log rotation or maintenance scripts may delete old web server logs.
    To handle this, identify and exclude these scheduled tasks from triggering alerts
    by specifying their execution times or associated process names.

    - Automated backup processes that move or delete logs after archiving can trigger
    false positives. Exclude these processes by adding exceptions for the backup software
    or scripts used.

    - Development or testing environments where logs are frequently c'
  mitigation: Review investigation guide for details
has_investigation_guide: true
