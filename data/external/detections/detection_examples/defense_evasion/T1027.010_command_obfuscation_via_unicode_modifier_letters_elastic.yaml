    - Legitimate internationalized applications and installers use Unicode (e.g.,
    localized product names, non-Latin scripts).

    - Dev tools or fonts may create commands with combining marks (rare) — check installer/tool
    provenance.

    - Command lines that include user input, file names, or paths with non-ASCII characters
    (e.g., user folders) can trigger the rule.


