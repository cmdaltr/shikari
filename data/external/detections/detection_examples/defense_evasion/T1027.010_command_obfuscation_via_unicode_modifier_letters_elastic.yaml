technique_id: T1027.010
technique_name: Command Obfuscation via Unicode Modifier Letters
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (\n   process.name : (\"reg.exe\", \"net.exe\", \"net1.exe\", \"certutil.exe\"\
  , \"MSHTA.EXE\", \"msiexec.exe\", \"bitsadmin.exe\", \"CertReq.exe\", \"PrintBrm.exe\"\
  , \"MSBuild.exe\", \"wuauclt.exe\", \"curl.exe\", \"wget.exe\", \"ssh.exe\", \"\
  Cmd.Exe\", \"PowerShell.EX\", \"CONHOST.EXE\", \"wscript.exe\", \"cscript.exe\"\
  , \"REGSVR32.EXE\", \"RUNDLL32.EXE\", \"procdump.exe\", \"ntdsutil.exe\", \"diskshadow.exe\"\
  , \"schtasks.exe\", \"sc.exe\", \"wmic.exe\", \"VSSADMIN.EXE\", \"WBADMIN.EXE\"\
  , \"iCACLS.EXE\", \"sftp.exe\", \"scp.exe\", \"esentutl.exe\", \"InstallUtil.exe\"\
  , \"wevtutil.exe\") or\n   ?process.pe.original_file_name in (\"reg.exe\", \"net.exe\"\
  , \"net1.exe\", \"CertUtil.exe\", \"MSHTA.EXE\", \"msiexec.exe\", \"bitsadmin.exe\"\
  , \"CertReq.exe\", \"PrintBrm.exe\", \"MSBuild.exe\", \"wuauclt.exe\", \"curl.exe\"\
  , \"wget.exe\", \"ssh.exe\", \"Cmd.Exe\", \"PowerShell.EX\", \"CONHOST.EXE\", \"\
  wscript.exe\", \"cscript.exe\", \"REGSVR32.EXE\", \"RUNDLL32.EXE\", \"procdump\"\
  , \"ntdsutil.exe\", \"diskshadow.exe\", \"schtasks.exe\", \"sc.exe\", \"wmic.exe\"\
  , \"VSSADMIN.EXE\", \"WBADMIN.EXE\", \"iCACLS.EXE\", \"sftp.exe\", \"scp.exe\",\
  \ \"esentutl.exe\", \"InstallUtil.exe\", \"wevtutil.exe\")\n ) and\n process.command_line\
  \ regex \"\"\".*[ʰ-˿ᴬ-ᶻ]+.* \"\"\""
explanation: 'Identifies the presence of unicode modifier letters in the process command_line.
  Adversaries sometimes replace ASCII characters

  with visually similar Unicode modifier letters or combining marks to evade simple
  string-based detections.'
source: Elastic Detection Rules
