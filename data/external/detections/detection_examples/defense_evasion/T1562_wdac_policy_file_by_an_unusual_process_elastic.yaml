technique_id: T1562
technique_name: WDAC Policy File by an Unusual Process
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.action != \"deletion\" and\n\
  \  file.extension : (\"p7b\", \"cip\") and\n  file.path : (\n    \"?:\\\\Windows\\\
  \\System32\\\\CodeIntegrity\\\\*.p7b\",\n    \"?:\\\\Windows\\\\System32\\\\CodeIntegrity\\\
  \\CiPolicies\\\\Active\\\\*.cip\",\n    \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\
  \\System32\\\\CodeIntegrity\\\\*.p7b\",\n    \"\\\\Device\\\\HarddiskVolume*\\\\\
  Windows\\\\System32\\\\CodeIntegrity\\\\CiPolicies\\\\Active\\\\*.cip\"\n  ) and\n\
  \  not process.executable : (\n    \"C:\\\\Windows\\\\System32\\\\poqexec.exe\"\
  ,\n    \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\poqexec.exe\"\n\
  \  )"
explanation: 'Identifies the creation of a Windows Defender Application Control (WDAC)
  policy file by an unusual process. Adversaries

  may use a secially crafted WDAC policy to restrict the execution of security products.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/3aaf37f3-05a1-40a5-bb6e-e380c4f92c52.toml
query_type: eql
query_language: eql
