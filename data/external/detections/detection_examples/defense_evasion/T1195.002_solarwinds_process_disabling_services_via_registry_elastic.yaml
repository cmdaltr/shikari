technique_id: T1195.002
technique_name: SolarWinds Process Disabling Services via Registry
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\
  \ registry.value : \"Start\" and\n  process.name : (\n      \"SolarWinds.BusinessLayerHost*.exe\"\
  ,\n      \"ConfigurationWizard*.exe\",\n      \"NetflowDatabaseMaintenance*.exe\"\
  ,\n      \"NetFlowService*.exe\",\n      \"SolarWinds.Administration*.exe\",\n \
  \     \"SolarWinds.Collector.Service*.exe\",\n      \"SolarwindsDiagnostics*.exe\"\
  \n  ) and\n  registry.path : \"*\\\\SYSTEM\\\\*ControlSet*\\\\Services\\\\*\\\\\
  Start\" and\n  registry.data.strings : (\"4\", \"0x00000004\")"
explanation: 'Identifies a SolarWinds binary modifying the start type of a service
  to be disabled. An adversary may abuse this

  technique to manipulate relevant security services.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b9960fef-82c6-4816-befa-44745030e917.toml
