technique_id: T1564
technique_name: System Binary Moved or Copied
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"linux\" and event.type == \"change\" and event.action\
  \ == \"rename\" and process.name != null and\nfile.Ext.original.path : (\n  \"/bin/*\"\
  , \"/usr/bin/*\", \"/usr/local/bin/*\", \"/sbin/*\", \"/usr/sbin/*\", \"/usr/local/sbin/*\"\
  \n) and not (\n  process.executable in (\n    \"/bin/dpkg\", \"/usr/bin/dpkg\",\
  \ \"/bin/dockerd\", \"/usr/bin/dockerd\", \"/usr/sbin/dockerd\", \"/bin/microdnf\"\
  ,\n    \"/usr/bin/microdnf\", \"/bin/rpm\", \"/usr/bin/rpm\", \"/bin/snapd\", \"\
  /usr/bin/snapd\", \"/bin/yum\", \"/usr/bin/yum\",\n    \"/bin/dnf\", \"/usr/bin/dnf\"\
  , \"/bin/podman\", \"/usr/bin/podman\", \"/bin/dnf-automatic\", \"/usr/bin/dnf-automatic\"\
  ,\n    \"/bin/pacman\", \"/usr/bin/pacman\", \"/usr/bin/dpkg-divert\", \"/bin/dpkg-divert\"\
  , \"/sbin/apk\", \"/usr/sbin/apk\",\n    \"/usr/local/sbin/apk\", \"/usr/bin/apt\"\
  , \"/usr/sbin/pacman\", \"/bin/podman\", \"/usr/bin/podman\", \"/usr/bin/puppet\"\
  ,\n    \"/bin/puppet\", \"/opt/puppetlabs/puppet/bin/puppet\", \"/usr/bin/chef-client\"\
  , \"/bin/chef-client\",\n    \"/bin/autossl_check\", \"/usr/bin/autossl_check\"\
  , \"/proc/self/exe\", \"/dev/fd/*\",  \"/usr/bin/pamac-daemon\",\n    \"/bin/pamac-daemon\"\
  , \"/usr/lib/snapd/snapd\", \"/usr/local/bin/dockerd\", \"/usr/libexec/netplan/generate\"\
  ,\n    \"/usr/bin/update-alternatives\", \"/bin/update-alternatives\", \"/usr/sbin/update-alternatives\"\
  ,\n    \"/sbin/update-alternatives\", \"/usr/bin/pip3\", \"/bin/pip3\", \"/usr/local/bin/pip3\"\
  , \"/usr/local/bin/node\",\n    \"/bin/node\", \"/usr/bin/node\", \"/sbin/apk\"\
  , \"/usr/sbin/apk\", \"/usr/local/sbin/apk\", \"/usr/bin/pip\", \"/bin/pip\",\n\
  \    \"/usr/local/bin/pip\", \"/usr/libexec/platform-python\", \"/usr/bin/platform-python\"\
  , \"/bin/platform-python\",\n    \"/usr/lib/systemd/systemd\", \"/usr/sbin/sshd\"\
  , \"/sbin/sshd\", \"/usr/local/sbin/sshd\", \"/usr/sbin/crond\", \"/sbin/crond\"\
  ,\n    \"/usr/local/sbin/crond\", \"/usr/sbin/gdm\"\n  ) or\n  process.name like\
  \ (\n    \"python*\", \"packagekitd\", \"systemd\", \"ln\", \"platform-python\"\
  , \"dnf_install\", \"runc\", \"apt-get\", \"ssm-agent-worker\",\n    \"convert-usrmerge\"\
  , \"updatenow.static-cpanelsync\", \"apk\", \"exe\", \"php\", \"containerd-shim-runc-v2\"\
  , \"dpkg\", \"sed\",\n    \"platform-python*\", \"gedit\", \"crond\", \"sshd\",\
  \ \"ruby\", \"sudo\", \"chainctl\", \"update-alternatives\", \"pip*\", \"microdnf\"\
  ,\n    \"rsync\", \"convert2rhel\", \"convert-usr-merge\"\n  ) or\n  file.Ext.original.path\
  \ : (\n    \"/bin/*.tmp\", \"/usr/bin/*.tmp\", \"/usr/local/bin/*.tmp\", \"/sbin/*.tmp\"\
  , \"/usr/sbin/*.tmp\", \"/usr/local/sbin/*.tmp\"\n  ) or\n  file.extension in (\"\
  swp\", \"swpx\", \"swx\", \"dpkg-remove\") or\n  file.Ext.original.extension ==\
  \ \"dpkg-new\" or\n  process.executable : (\"/nix/store/*\", \"/var/lib/dpkg/*\"\
  , \"/tmp/vmis.*\", \"/snap/*\", \"/dev/fd/*\") or\n  process.executable == null\
  \ or\n  (process.name == \"sed\" and file.name : \"sed*\") or\n  (process.name ==\
  \ \"perl\" and file.name : \"e2scrub_all.tmp*\")\n)"
explanation: 'This rule monitors for the copying or moving of a system binary. Adversaries
  may copy/move and rename system binaries to

  evade detection. Copying a system binary to a different location should not occur
  often, so if it does, the activity

  should be investigated.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/fda1d332-5e08-4f27-8a9b-8c802e3292a6.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
false_positives:
- description: 'False positive analysis


    - System updates and package installations often involve legitimate movement or
    copying of binaries. Exclude processes like dpkg, rpm, and apt-get from triggering
    alerts by adding them to the exception list.

    - Development and testing environments may frequently rename or move binaries
    for testing purposes. Consider excluding paths like /tmp or /dev/fd from monitoring
    if they are commonly used for non-malicious activities.

    - Automated scripts or configuration management t'
  mitigation: Review investigation guide for details
references:
- https://intezer.com/blog/research/kaiji-new-chinese-linux-malware-turning-to-golang/
- https://www.elastic.co/security-labs/sequel-on-persistence-mechanisms
