technique_id: T1564
technique_name: Service DACL Modification via sc.exe
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (process.name : \"sc.exe\" or ?process.pe.original_file_name : \"sc.exe\") and\n\
  \  process.args : \"sdset\" and process.args : \"*D;*\" and\n  process.args : (\"\
  *;IU*\", \"*;SU*\", \"*;BA*\", \"*;SY*\", \"*;WD*\")"
explanation: Identifies DACL modifications to deny access to a service, making it
  unstoppable, or hide it from system and users.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/5188c68e-d3de-4e96-994d-9e242269446f.toml
