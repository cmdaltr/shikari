technique_id: T1553
technique_name: Code Signing Policy Modification Through Registry
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \  registry.value: \"BehaviorOnFailedVerify\" and registry.data.strings : (\"0\"\
  , \"0x00000000\", \"1\", \"0x00000001\") and \n  not process.executable : \n   \
  \                   (\"?:\\\\Windows\\\\System32\\\\svchost.exe\", \n          \
  \             \"?:\\\\Windows\\\\CCM\\\\CcmExec.exe\",\n                       \"\
  \\\\Device\\\\HarddiskVolume*\\\\Windows\\\\system32\\\\svchost.exe\", \n      \
  \                 \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\CCM\\\\CcmExec.exe\"\
  )\n  /*\n    Full registry key path omitted due to data source variations:\n   \
  \ \"HKEY_USERS\\\\*\\\\Software\\\\Policies\\\\Microsoft\\\\Windows NT\\\\Driver\
  \ Signing\\\\BehaviorOnFailedVerify\"\n  */"
explanation: 'Identifies attempts to disable the code signing policy through the registry.
  Code signing provides authenticity on a

  program, and grants the user with the ability to check whether the program has been
  tampered with. By allowing the

  execution of unsigned or self-signed code, threat actors can craft and execute malicious
  code.'
source: Elastic Detection Rules
