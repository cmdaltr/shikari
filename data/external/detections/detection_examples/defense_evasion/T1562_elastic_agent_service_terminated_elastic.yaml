false_positives:
- description: 'False positive analysis


    - Routine maintenance activities may trigger the rule if administrators use commands
    like systemctl or service to stop the Elastic Agent for updates or configuration
    changes. To manage this, create exceptions for known maintenance windows or authorized
    personnel.

    - Automated scripts or deployment tools that temporarily disable the Elastic Agent
    during software installations or updates can cause false positives. Identify these
    scripts and whitelist their execution paths o'
  mitigation: Review investigation guide for details
has_investigation_guide: true
