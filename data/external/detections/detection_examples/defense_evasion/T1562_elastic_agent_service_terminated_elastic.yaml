technique_id: T1562
technique_name: Elastic Agent Service Terminated
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where\n/* net, sc or wmic stopping or deleting Elastic Agent on Windows\
  \ */\n(event.type == \"start\" and\n  process.name : (\"net.exe\", \"sc.exe\", \"\
  wmic.exe\",\"powershell.exe\",\"taskkill.exe\",\"PsKill.exe\",\"ProcessHacker.exe\"\
  ) and\n  process.args : (\"stopservice\",\"uninstall\", \"stop\", \"disabled\",\"\
  Stop-Process\",\"terminate\",\"suspend\") and\n  process.args : (\"elasticendpoint\"\
  , \"Elastic Agent\",\"elastic-agent\",\"elastic-endpoint\"))\nor\n/* service or\
  \ systemctl used to stop Elastic Agent on Linux */\n(event.type == \"end\" and\n\
  \  (process.name in (\"systemctl\", \"service\", \"chkconfig\", \"update-rc.d\"\
  ) and\n    process.args : (\"elastic-agent\", \"elastic-agent.service\") and\n \
  \   process.args : (\"stop\", \"disable\", \"remove\", \"off\", \"kill\", \"mask\"\
  ))\n  or\n  /* pkill , killall used to stop Elastic Agent on Linux */\n  ( event.type\
  \ == \"end\" and process.name in (\"pkill\", \"killall\", \"kill\") and process.args:\
  \ \"elastic-agent\")\n  or\n  /* Unload Elastic Agent extension on MacOS */\n  (process.name\
  \ : \"kextunload\" and\n    process.args : \"com.apple.iokit.EndpointSecurity\"\
  \ and\n    event.action : \"end\"))"
explanation: 'Identifies the Elastic endpoint agent has stopped and is no longer running
  on the host. Adversaries may attempt to

  disable security monitoring tools in an attempt to evade detection or prevention
  capabilities during an intrusion. This

  may also indicate an issue with the agent itself and should be addressed to ensure
  defensive measures are back in a

  stable state.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b627cd12-dac4-11ec-9582-f661ea17fbcd.toml
query_type: eql
query_language: eql
