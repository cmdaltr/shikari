technique_id: T1127
technique_name: Microsoft Build Engine Started by an Office Application
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"MSBuild.exe\" and\n  process.parent.name : (\"eqnedt32.exe\"\
  ,\n                         \"excel.exe\",\n                         \"fltldr.exe\"\
  ,\n                         \"msaccess.exe\",\n                         \"mspub.exe\"\
  ,\n                         \"outlook.exe\",\n                         \"powerpnt.exe\"\
  ,\n                         \"winword.exe\" )"
explanation: 'An instance of MSBuild, the Microsoft Build Engine, was started by Excel
  or Word. This is unusual behavior for the Build

  Engine and could have been caused by an Excel or Word document executing a malicious
  script payload.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c5dc3223-13a2-44a2-946c-e9dc0aa0449c.toml
query_type: eql
