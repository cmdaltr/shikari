technique_id: T1562.001
technique_name: AWS CloudTrail Log Suspended
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: "event.dataset: \"aws.cloudtrail\"\n    and event.provider: \"cloudtrail.amazonaws.com\"\
  \ \n    and event.action: \"StopLogging\" \n    and event.outcome: \"success\""
explanation: 'Detects Cloudtrail logging suspension via StopLogging API. Stopping
  CloudTrail eliminates forward audit visibility and

  is a classic defense evasion step before sensitive changes or data theft. Investigate
  immediately and determine what

  occurred during the logging gap.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1aa8fa52-44a7-4dae-b058-f3333b91c8d7.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
- type: data_source
  value: AWS Cloudtrail
  confidence: high
false_positives:
- description: 'False positive analysis

    - **Planned suspensions**: Rare; verify maintenance tickets and ensure post-change
    validation.


    ### Response and remediation

    - Restart logging (`StartLogging`) immediately.

    - Investigate actor’s recent activity; rotate credentials if suspicious.

    - Validate trail configuration, destination bucket/CMK, and event selectors.

    - Hardening: Limit `cloudtrail:StopLogging` to break-glass roles; alert on any
    future stops; enforce via AWS Config/SCPs.


    ### Additional information

    - *'
  mitigation: Review investigation guide for details
references:
- https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_StopLogging.html
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/cloudtrail/stop-logging.html
has_investigation_guide: true
risk_score: 47
