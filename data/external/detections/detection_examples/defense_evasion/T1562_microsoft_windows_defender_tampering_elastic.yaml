technique_id: T1562
technique_name: Microsoft Windows Defender Tampering
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\
  \ process.executable != null and\n  (\n    (\n      registry.value : (\n       \
  \ \"PUAProtection\", \"DisallowExploitProtectionOverride\", \"TamperProtection\"\
  , \"EnableControlledFolderAccess\",\n        \"SpynetReporting\", \"SubmitSamplesConsent\"\
  \n      ) and registry.data.strings : (\"0\", \"0x00000000\")\n    ) or\n    (\n\
  \      registry.value : (\n        \"DisableAntiSpyware\", \"DisableRealtimeMonitoring\"\
  , \"DisableIntrusionPreventionSystem\", \"DisableScriptScanning\",\n        \"DisableIOAVProtection\"\
  , \"DisableEnhancedNotifications\", \"DisableBlockAtFirstSeen\", \"DisableBehaviorMonitoring\"\
  \n      ) and registry.data.strings : (\"1\", \"0x00000001\")\n    )\n  ) and\n\
  \  not process.executable : (\n    \"?:\\\\Windows\\\\system32\\\\svchost.exe\"\
  , \n    \"?:\\\\Windows\\\\CCM\\\\CcmExec.exe\", \n    \"?:\\\\Windows\\\\System32\\\
  \\DeviceEnroller.exe\", \n    \"?:\\\\Program Files (x86)\\\\Trend Micro\\\\Security\
  \ Agent\\\\tmuninst.exe\",\n    \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\system32\\\
  \\svchost.exe\", \n    \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\CCM\\\\CcmExec.exe\"\
  , \n    \"\\\\Device\\\\HarddiskVolume*\\\\Windows\\\\System32\\\\DeviceEnroller.exe\"\
  , \n    \"\\\\Device\\\\HarddiskVolume*\\\\Program Files (x86)\\\\Trend Micro\\\\\
  Security Agent\\\\tmuninst.exe\"\n  )\n\n/*\n    Full registry key paths omitted\
  \ due to data source variations:\n    \"HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\
  \\Windows Defender\\\\DisableAntiSpyware\"\n    \"HKLM\\\\SOFTWARE\\\\Policies\\\
  \\Microsoft\\\\Windows Defender\\\\Real-Time Protection\\\\DisableRealtimeMonitoring\"\
  \n    \"HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows Defender\\\\Real-Time\
  \ Protection\\\\DisableIntrusionPreventionSystem\"\n    \"HKLM\\\\SOFTWARE\\\\Policies\\\
  \\Microsoft\\\\Windows Defender\\\\Real-Time Protection\\\\DisableScriptScanning\"\
  \n    \"HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows Defender\\\\Real-Time\
  \ Protection\\\\DisableIOAVProtection\"\n    \"HKLM\\\\SOFTWARE\\\\Policies\\\\\
  Microsoft\\\\Windows Defender\\\\Reporting\\\\DisableEnhancedNotifications\"\n \
  \   \"HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows Defender\\\\SpyNet\\\\\
  DisableBlockAtFirstSeen\"\n    \"HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\
  \ Defender\\\\Real-Time Protection\\\\DisableBehaviorMonitoring\"\n    \"HKLM\\\\\
  SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows Defender\\\\PUAProtection\"\n    \"\
  HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows Defender Security Center\\\\\
  App and Browser protection\\\\DisallowExploitProtectionOverride\"\n    \"HKLM\\\\\
  SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows Defender\\\\Features\\\\TamperProtection\"\
  \n    \"HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows Defender\\\\Windows\
  \ Defender Exploit Guard\\\\Controlled Folder Access\\\\EnableControlledFolderAccess\"\
  \n    \"HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows Defender\\\\SpyNet\\\
  \\SpynetReporting\"\n    \"HKLM\\\\SOFTWARE\\\\Policies\\\\Microsoft\\\\Windows\
  \ Defender\\\\SpyNet\\\\SubmitSamplesConsent\"\n*/"
explanation: 'Identifies when one or more features on Microsoft Defender are disabled.
  Adversaries may disable or tamper with

  Microsoft Defender features to evade detection and conceal malicious behavior.'
