technique_id: T1562.001
technique_name: Potential Evasion via Filter Manager
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : \"fltMC.exe\" and process.args : \"unload\" and\n  not process.parent.executable\
  \ : \n                   (\"?:\\\\Program Files (x86)\\\\ManageEngine\\\\UEMS_Agent\\\
  \\bin\\\\DCFAService64.exe\", \n                    \"?:\\\\Windows\\\\SysWOW64\\\
  \\msiexec.exe\", \n                    \"?:\\\\Program Files\\\\Bitdefender\\\\\
  Endpoint Security\\\\installer\\\\installer.exe\", \n                    \"?:\\\\\
  Program Files\\\\Bitdefender\\\\Endpoint Security\\\\EPSecurityService.exe\", \n\
  \                    \"?:\\\\Program Files\\\\Bitdefender\\\\Bitdefender Security\\\
  \\productcfg.exe\", \n                    \"?:\\\\Program Files\\\\Bitdefender\\\
  \\Bitdefender Security\\\\bdservicehost.exe\", \n                    \"?:\\\\Program\
  \ Files\\\\Bitdefender\\\\EndpointSetupInformation\\\\{*}\\\\Installer.exe\")"
explanation: 'The Filter Manager Control Program (fltMC.exe) binary may be abused
  by adversaries to unload a filter driver and evade

  defenses.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/06dceabf-adca-48af-ac79-ffdf4c3b1e9a.toml
