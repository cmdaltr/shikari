technique_id: T1562
technique_name: Kernel Module Removal
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \  event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\") and\n\
  \  (\n    process.name == \"rmmod\" or\n    (process.name == \"modprobe\" and process.args\
  \ in (\"--remove\", \"-r\"))\n  ) and\n  process.parent.name in (\"sudo\", \"bash\"\
  , \"dash\", \"ash\", \"sh\", \"tcsh\", \"csh\", \"zsh\", \"ksh\", \"fish\")"
explanation: 'Kernel modules are pieces of code that can be loaded and unloaded into
  the kernel upon demand. They extend the

  functionality of the kernel without the need to reboot the system. This rule identifies
  attempts to remove a kernel

  module.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/cd66a5af-e34b-4bb0-8931-57d0a043f2ef.toml
query_type: eql
query_language: eql
