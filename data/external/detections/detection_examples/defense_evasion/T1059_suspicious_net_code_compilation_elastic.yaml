technique_id: T1059
technique_name: Suspicious .NET Code Compilation
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : (\"csc.exe\", \"vbc.exe\") and\n  process.parent.name : (\"wscript.exe\"\
  , \"mshta.exe\", \"cscript.exe\", \"wmic.exe\", \"svchost.exe\", \"rundll32.exe\"\
  , \"cmstp.exe\", \"regsvr32.exe\")"
explanation: 'Identifies executions of .NET compilers with suspicious parent processes,
  which can indicate an attacker''s attempt to

  compile code after delivery in order to bypass security mechanisms.'
source: Elastic Detection Rules
