technique_id: T1027
technique_name: Potential PowerShell Obfuscated Script
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    \"[string]::join\" or\n    \"-Join\" or\n    \"[convert]::toint16\" or\n\
  \    \"[char][int]$_\" or\n    (\"ConvertTo-SecureString\" and \"PtrToStringAuto\"\
  ) or\n    \".GetNetworkCredential().password\" or\n    \"-BXor\" or\n    (\"replace\"\
  \ and \"char\") or\n    \"[array]::reverse\" or\n    \"-replace\"\n  ) and\n  powershell.file.script_block_text\
  \ : (\n    (\"$pSHoMe[\" and \"+$pSHoMe[\") or\n    (\"$ShellId[\" and \"+$ShellId[\"\
  ) or\n    (\"$env:ComSpec[4\" and \"25]-Join\") or\n    ((\"Set-Variable\" or \"\
  SV\" or \"Set-Item\") and \"OFS\") or\n    (\"*MDR*\" and \"Name[3,11,2]\") or\n\
  \    (\"$VerbosePreference\" and \"[1,3]+'X'-Join''\") or\n    (\"rahc\" or \"ekovin\"\
  \ or \"gnirts\" or \"ecnereferpesobrev\" or \"ecalper\" or \"cepsmoc\" or \"dillehs\"\
  ) or\n    (\"System.Management.Automation.$([cHAr]\" or \"System.$([cHAr]\" or \"\
  )+[cHAR]([byte]\")\n  )"
explanation: 'Identifies scripts that contain patterns and known methods that obfuscate
  PowerShell code. Attackers can use obfuscation

  techniques to bypass PowerShell security protections such as Antimalware Scan Interface
  (AMSI).'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8025db49-c57c-4fc0-bd86-7ccd6d10a35a.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - Legitimate administrative scripts may use string manipulation and encoding techniques
    for benign purposes, such as data processing or configuration management. Review
    the context of the script execution and verify the source and intent before flagging
    it as malicious.

    - Scripts that automate complex tasks might use obfuscation-like patterns to handle
    data securely or efficiently. Consider whitelisting known scripts or trusted sources
    to reduce false positives.

    - Develo'
  mitigation: Review investigation guide for details
references:
- https://github.com/danielbohannon/Invoke-Obfuscation
has_investigation_guide: true
risk_score: 47
