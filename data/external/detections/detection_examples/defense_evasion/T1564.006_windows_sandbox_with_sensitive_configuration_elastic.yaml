technique_id: T1564.006
technique_name: Windows Sandbox with Sensitive Configuration
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.name : (\"wsb.exe\", \"WindowsSandboxClient.exe\") and\n  process.command_line\
  \ : (\"*<Networking>Enable</Networking>*\",\n                          \"*<HostFolder>C:\\\
  \\*<ReadOnly>false*\",\n                          \"*<LogonCommand>*\",\n      \
  \                    \"*<NetworkingEnabled>true*\")"
explanation: 'Identifies Windows sanfbox processes indicating the start of a new container
  with sensitive configurations like write

  access to the host file system, network connection and automatic execution via logon
  command. Malware may abuse the

  sandbox feature to evade detection.'
source: Elastic Detection Rules
