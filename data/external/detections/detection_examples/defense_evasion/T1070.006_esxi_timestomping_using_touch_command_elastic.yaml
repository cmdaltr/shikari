technique_id: T1070.006
technique_name: ESXI Timestomping using Touch Command
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \ event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\", \"executed\"\
  , \"process_started\") and\n process.name == \"touch\" and process.args == \"-r\"\
  \ and process.args : (\"/etc/vmware/*\", \"/usr/lib/vmware/*\", \"/vmfs/*\")"
explanation: 'Identifies instances where the ''touch'' command is executed on a Linux
  system with the "-r" flag, which is used to modify

  the timestamp of a file based on another file''s timestamp. The rule targets specific
  VM-related paths, such as

  "/etc/vmware/", "/usr/lib/vmware/", or "/vmfs/*". These paths are associated with
  VMware virtualization software, and

  their presence in the touch command arguments may indicate that a threat actor is
  attempting to tamper with timestamps

  of VM-related files and configurations on the system.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/30bfddd7-2954-4c9d-bbc6-19a99ca47e23.toml
