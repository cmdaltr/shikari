technique_id: T1140
technique_name: PowerShell Script with Encryption/Decryption Capabilities
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.category:process and host.os.type:windows and\n  powershell.file.script_block_text\
  \ : (\n    (\n      \"Cryptography.AESManaged\" or\n      \"Cryptography.RijndaelManaged\"\
  \ or\n      \"Cryptography.SHA1Managed\" or\n      \"Cryptography.SHA256Managed\"\
  \ or\n      \"Cryptography.SHA384Managed\" or\n      \"Cryptography.SHA512Managed\"\
  \ or\n      \"Cryptography.SymmetricAlgorithm\" or\n      \"PasswordDeriveBytes\"\
  \ or\n      \"Rfc2898DeriveBytes\"\n    ) and\n    (\n      CipherMode and PaddingMode\n\
  \    ) and\n    (\n      \".CreateEncryptor\" or\n      \".CreateDecryptor\"\n \
  \   )\n  ) and\n  not user.id : \"S-1-5-18\" and\n  not (\n    file.name : \"Bootstrap.Octopus.FunctionAppenderContext.ps1\"\
  \ and\n    powershell.file.script_block_text : (\"function Decrypt-Variables\" or\
  \ \"github.com/OctopusDeploy\")\n  )"
explanation: 'Identifies the use of Cmdlets and methods related to encryption/decryption
  of files in PowerShell scripts, which malware

  and offensive security tools can abuse to encrypt data or decrypt payloads to bypass
  security solutions.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/1d9aeb0b-9549-46f6-a32d-05e2a001b7fd.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: PowerShell Logs
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This is a dual-use mechanism, meaning its usage is not inherently malicious.
    Analysts can dismiss the alert if the script doesn''t contain malicious functions
    or potential for abuse, no other suspicious activity was identified, and there
    are justifications for the execution.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved hosts to prevent further post-compromise behavior.

    - Restrict Power'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
