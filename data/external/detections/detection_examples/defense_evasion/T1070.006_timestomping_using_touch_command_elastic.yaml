technique_id: T1070.006
technique_name: Timestomping using Touch Command
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where event.type == \"start\" and\n process.name : \"touch\" and user.id\
  \ != \"0\" and\n process.args : (\"-r\", \"-t\", \"-a*\",\"-m*\") and\n not process.args\
  \ : (\n   \"/usr/lib/go-*/bin/go\", \"/usr/lib/dracut/dracut-functions.sh\", \"\
  /tmp/KSInstallAction.*/m/.patch/*\"\n) and not process.parent.name in (\"pmlogger_daily\"\
  , \"pmlogger_janitor\", \"systemd\")"
explanation: 'Timestomping is an anti-forensics technique which is used to modify
  the timestamps of a file, often to mimic files that

  are in the same folder.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/b0046934-486e-462f-9487-0d4cf9e429c6.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: Linux
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - Non-root users running legitimate scripts or applications that use the touch
    command with similar arguments may trigger false positives. To mitigate this,
    identify and whitelist these specific scripts or applications by adding their
    paths to the exclusion list.

    - Automated system maintenance tasks that involve file timestamp modifications
    can be mistaken for malicious activity. Review and exclude known maintenance processes
    by adding them to the exclusion criteria, ens'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 47
