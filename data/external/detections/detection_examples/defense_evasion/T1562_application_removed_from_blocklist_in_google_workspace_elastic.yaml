technique_id: T1562
technique_name: Application Removed from Blocklist in Google Workspace
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:\"google_workspace.admin\" and event.category:\"iam\" and event.type:\"\
  change\"  and\n  event.action:\"CHANGE_APPLICATION_SETTING\" and\n  google_workspace.admin.application.name:\"\
  Google Workspace Marketplace\" and\n  google_workspace.admin.old_value: *allowed*false*\
  \ and google_workspace.admin.new_value: *allowed*true*"
explanation: 'Google Workspace administrators may be aware of malicious applications
  within the Google marketplace and block these

  applications for user security purposes. An adversary, with administrative privileges,
  may remove this application from

  the explicit block list to allow distribution of the application amongst users.
  This may also indicate the unauthorized

  use of an application that had been previously blocked before by a user with admin
  privileges.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/495e5f2e-2480-11ed-bea8-f661ea17fbce.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Google Workspace
  confidence: high
false_positives:
- description: 'False positive analysis


    - Google Workspace administrators might intentionally remove an application from
    the blocklist due to a re-assessment or a domain-wide required need for the application.

    - Identify the user account associated with this action and assess their administrative
    privileges with Google Workspace Marketplace.

    - Contact the user to verify that they intentionally removed the application from
    the blocklist and their reasoning.


    ### Response and remediation


    - Initiate the incident'
  mitigation: Review investigation guide for details
references:
- https://support.google.com/a/answer/6328701?hl=en#
- https://www.elastic.co/security-labs/google-workspace-attack-surface-part-one
- https://www.elastic.co/security-labs/google-workspace-attack-surface-part-two
has_investigation_guide: true
risk_score: 47
