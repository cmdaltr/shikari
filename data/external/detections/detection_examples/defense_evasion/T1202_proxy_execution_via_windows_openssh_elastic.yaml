technique_id: T1202
technique_name: Proxy Execution via Windows OpenSSH
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\
  \ process.name : (\"ssh.exe\", \"sftp.exe\") and\n process.command_line : (\"*Command=*powershell*\"\
  , \"*schtasks*\", \"*Command=*@echo off*\", \"*Command=*http*\", \"*Command=*mshta*\"\
  ,  \"*Command=*msiexec*\",\n                          \"*Command=*cmd /c*\", \"\
  *Command=*cmd.exe*\", \"*Command=\\\"cmd /c*\", \"*LocalCommand=scp*&&*\", \"*LocalCommand=?scp*&&*\"\
  , \"*Command=*script*\")"
explanation: 'Identifies attempts to execute commands via proxy using the Windows
  OpenSSH client. This may indicate an attempt to bypass

  application control via trusted windows binaries.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8cd49fbc-a35a-4418-8688-133cc3a1e548.toml
query_type: eql
query_language: eql
