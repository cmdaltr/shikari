technique_id: T1562.004
technique_name: Enable Host Network Discovery via Netsh
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: 'process where host.os.type == "windows" and event.type == "start" and

  process.name : "netsh.exe" and

  process.args : ("firewall", "advfirewall") and process.args : "group=Network Discovery"
  and process.args : "enable=Yes"'
explanation: 'Identifies use of the netsh.exe program to enable host discovery via
  the network. Attackers can use this command-line

  tool to weaken the host firewall settings.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8b4f0816-6a65-4630-86a6-c21c179c0d09.toml
