technique_id: T1218
technique_name: Unusual Network Connection via RunDLL32
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "sequence by host.id, process.entity_id with maxspan=1m\n  [process where host.os.type\
  \ == \"windows\" and event.type == \"start\" and process.name : \"rundll32.exe\"\
  \ and\n  (\n    process.args_count == 1 and\n\n    /* Excludes bug where a missing\
  \ closing quote sets args_count to 1 despite extra args */\n    not process.command_line\
  \ regex~ \"\"\"\\\".*\\.exe[^\\\"].* \"\"\"  )]\n  [network where host.os.type ==\
  \ \"windows\" and process.name : \"rundll32.exe\" and\n   not cidrmatch(destination.ip,\
  \ \"10.0.0.0/8\", \"127.0.0.0/8\", \"169.254.0.0/16\", \"172.16.0.0/12\", \"192.0.0.0/24\"\
  ,\n       \"192.0.0.0/29\", \"192.0.0.8/32\", \"192.0.0.9/32\", \"192.0.0.10/32\"\
  , \"192.0.0.170/32\", \"192.0.0.171/32\",\n       \"192.0.2.0/24\", \"192.31.196.0/24\"\
  , \"192.52.193.0/24\", \"192.168.0.0/16\", \"192.88.99.0/24\", \"224.0.0.0/4\",\n\
  \       \"100.64.0.0/10\", \"192.175.48.0/24\",\"198.18.0.0/15\", \"198.51.100.0/24\"\
  , \"203.0.113.0/24\", \"240.0.0.0/4\", \"::1\",\n       \"FE80::/10\", \"FF00::/8\"\
  )]"
explanation: 'Identifies unusual instances of rundll32.exe making outbound network
  connections. This may indicate adversarial Command

  and Control activity.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/52aaab7b-b51c-441a-89ce-4387b3aea886.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: data_source
  value: Sysmon
  confidence: high
- type: data_source
  value: SentinelOne
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This activity is unlikely to happen legitimately. Benign true positives (B-TPs)
    can be added as exceptions if necessary.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved hosts to prevent further post-compromise behavior.

    - Investigate credential exposure on systems compromised or used by the attacker
    to ensure all compromised accounts are identified. Reset passwords for these accounts
    and'
  mitigation: Review investigation guide for details
references:
- https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry.xhtml
- https://redcanary.com/threat-detection-report/techniques/rundll32/
has_investigation_guide: true
risk_score: 47
