technique_id: T1106
technique_name: Suspicious Process Access via Direct System Call
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.code == \"10\" and\n length(winlog.event_data.CallTrace)\
  \ > 0 and\n\n /* Sysmon CallTrace starting with unknown memory module instead of\
  \ ntdll which host Windows NT Syscalls */\n not winlog.event_data.CallTrace :\n\
  \            (\"?:\\\\WINDOWS\\\\SYSTEM32\\\\ntdll.dll*\",\n             \"?:\\\\\
  WINDOWS\\\\SysWOW64\\\\ntdll.dll*\",\n             \"?:\\\\Windows\\\\System32\\\
  \\wow64cpu.dll*\",\n             \"?:\\\\WINDOWS\\\\System32\\\\wow64win.dll*\"\
  ,\n             \"?:\\\\Windows\\\\System32\\\\win32u.dll*\") and\n\n not winlog.event_data.TargetImage\
  \ :\n            (\"?:\\\\Program Files (x86)\\\\Malwarebytes Anti-Exploit\\\\mbae-svc.exe\"\
  ,\n             \"?:\\\\Program Files\\\\Cisco\\\\AMP\\\\*\\\\sfc.exe\",\n     \
  \        \"?:\\\\Program Files (x86)\\\\Microsoft\\\\EdgeWebView\\\\Application\\\
  \\*\\\\msedgewebview2.exe\",\n             \"?:\\\\Program Files\\\\Adobe\\\\Acrobat\
  \ DC\\\\Acrobat\\\\*\\\\AcroCEF.exe\") and\n\n not (process.executable : (\"?:\\\
  \\Program Files\\\\Adobe\\\\Acrobat DC\\\\Acrobat\\\\Acrobat.exe\",\n          \
  \                  \"?:\\\\Program Files (x86)\\\\World of Warcraft\\\\_classic_\\\
  \\WowClassic.exe\") and\n      not winlog.event_data.TargetImage : \"?:\\\\WINDOWS\\\
  \\system32\\\\lsass.exe\")"
explanation: 'Identifies suspicious process access events from an unknown memory region.
  Endpoint security solutions usually hook

  userland Windows APIs in order to decide if the code that is being executed is malicious
  or not. It''s possible to bypass

  hooked functions by writing malicious functions that call syscalls directly.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2dd480be-1263-4d9c-8672-172928f6789a.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Sysmon
  confidence: high
- type: operating_system
  value: Windows
  confidence: high
false_positives:
- description: 'False positive analysis


    - This detection may be triggered by certain applications that install root certificates
    for the purpose of inspecting SSL traffic. Benign true positives (B-TPs) can be
    added as exceptions if necessary.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Isolate the involved host to prevent further post-compromise behavior.

    - If the triage identified malware, search the environment for additional compromised
    hosts'
  mitigation: Review investigation guide for details
references:
- https://twitter.com/SBousseaden/status/1278013896440324096
- https://www.ired.team/offensive-security/defense-evasion/using-syscalls-directly-from-visual-studio-to-bypass-avs-edrs
has_investigation_guide: true
risk_score: 73
