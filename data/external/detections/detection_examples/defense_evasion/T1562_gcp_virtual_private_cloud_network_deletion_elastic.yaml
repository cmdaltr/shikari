technique_id: T1562
technique_name: GCP Virtual Private Cloud Network Deletion
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:gcp.audit and event.action:v*.compute.networks.delete and event.outcome:success
explanation: 'Identifies when a Virtual Private Cloud (VPC) network is deleted in
  Google Cloud Platform (GCP). A VPC network is a

  virtual version of a physical network within a GCP project. Each VPC network has
  its own subnets, routes, and firewall,

  as well as other elements. An adversary may delete a VPC network in order to disrupt
  their target''s network and business

  operations.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/c58c3081-2e1d-4497-8491-e73a45d1a6d6.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: GCP
  confidence: high
- type: data_source
  value: Google Cloud Platform
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance activities may involve the deletion of VPC networks as part
    of infrastructure updates or reconfigurations. To manage this, create exceptions
    for known maintenance windows or specific user accounts responsible for these
    tasks.

    - Automated scripts or tools used for environment cleanup might trigger false
    positives if they delete VPC networks as part of their operation. Identify these
    scripts and exclude their actions from triggering alerts by using sp'
  mitigation: Review investigation guide for details
references:
- https://cloud.google.com/vpc/docs/vpc
has_investigation_guide: true
risk_score: 47
