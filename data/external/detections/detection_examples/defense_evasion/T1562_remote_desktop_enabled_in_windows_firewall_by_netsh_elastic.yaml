technique_id: T1562
technique_name: Remote Desktop Enabled in Windows Firewall by Netsh
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \ (process.name : \"netsh.exe\" or ?process.pe.original_file_name == \"netsh.exe\"\
  ) and\n process.args : (\"localport=3389\", \"RemoteDesktop\", \"group=\\\"remote\
  \ desktop\\\"\") and\n process.args : (\"action=allow\", \"enable=Yes\", \"enable\"\
  )"
explanation: 'Identifies use of the network shell utility (netsh.exe) to enable inbound
  Remote Desktop Protocol (RDP) connections in

  the Windows Firewall.'
source: Elastic Detection Rules
