technique_id: T1055
technique_name: Unusual Child Process from a System Virtual Process
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  process.parent.pid == 4 and process.executable : \"?*\" and\n  not process.executable\
  \ : (\"Registry\", \"MemCompression\", \"?:\\\\Windows\\\\System32\\\\smss.exe\"\
  , \"HotPatch\")"
explanation: Identifies a suspicious child process of the Windows virtual system process,
  which could indicate code injection.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/de9bd7e0-49e9-4e92-a64d-53ade2e66af1.toml
query_type: eql
query_language: eql
