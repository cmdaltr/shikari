false_positives:
- description: 'False positive analysis


    - Legitimate system maintenance tools may occasionally spawn child processes from
    the System process. Users should monitor and verify these tools and add them to
    the exclusion list if they are confirmed to be safe.

    - Some security software might create child processes from the System process
    as part of their normal operation. Identify these processes and configure exceptions
    to prevent unnecessary alerts.

    - Windows updates or system patches can sometimes trigger unexpect'
  mitigation: Review investigation guide for details
has_investigation_guide: true
risk_score: 73
