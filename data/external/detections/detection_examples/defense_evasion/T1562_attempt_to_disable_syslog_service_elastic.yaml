technique_id: T1562
technique_name: Attempt to Disable Syslog Service
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"linux\" and event.action in (\"exec\", \"\
  exec_event\", \"start\", \"ProcessRollup2\") and\n ( (process.name == \"service\"\
  \ and process.args == \"stop\") or\n   (process.name == \"chkconfig\" and process.args\
  \ == \"off\") or\n   (process.name == \"systemctl\" and process.args in (\"disable\"\
  , \"stop\", \"kill\"))\n ) and process.args in (\"syslog\", \"rsyslog\", \"syslog-ng\"\
  , \"syslog.service\", \"rsyslog.service\", \"syslog-ng.service\") and\nnot (\n \
  \ process.parent.name == \"rsyslog-rotate\" or\n  process.args == \"HUP\"\n)"
explanation: 'Adversaries may attempt to disable the syslog service in an attempt
  to an attempt to disrupt event logging and evade

  detection by security controls.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/2f8a1226-5720-437d-9c20-e0029deb6194.toml
query_type: eql
query_language: eql
