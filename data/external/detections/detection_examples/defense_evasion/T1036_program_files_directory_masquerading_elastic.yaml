false_positives:
- description: 'False positive analysis


    - Legitimate software installations or updates may create temporary directories
    resembling Program Files paths. Users can monitor installation logs and exclude
    these specific paths if they are verified as part of a legitimate process.

    - Some enterprise applications may use custom directories that mimic Program Files
    for compatibility reasons. IT administrators should document these paths and add
    them to the exclusion list to prevent false alerts.

    - Development environmen'
  mitigation: Review investigation guide for details
has_investigation_guide: true
