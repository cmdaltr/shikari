technique_id: T1562
technique_name: Quarantine Attrib Removed by Unsigned or Untrusted Process
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where event.action == \"extended_attributes_delete\" and host.os.type\
  \ == \"macos\" and process.executable != null and\n (process.code_signature.trusted\
  \ == false or process.code_signature.exists == false) and \n not process.executable\
  \ like (\"/usr/bin/xattr\",\n                              \"/System/*\",\n    \
  \                          \"/private/tmp/KSInstallAction.*/*/Install Google Software\
  \ Update.app/Contents/Helpers/ksinstall\",\n                              \"/Applications/CEWE\
  \ Fotoschau.app/Contents/MacOS/FotoPlus\",\n                              \"/Applications/.com.bomgar.scc.*/Remote\
  \ Support Customer Client.app/Contents/MacOS/sdcust\") and \n not file.path like\
  \ \"/private/var/folders/*\""
explanation: 'Detects deletion of the quarantine attribute by an unusual process (xattr).
  In macOS, when applications or programs are

  downloaded from the internet, there is a quarantine flag set on the file. This attribute
  is read by Apple''s Gatekeeper

  defense program at execution time. An adversary may disable this attribute to evade
  defenses.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f0b48bbc-549e-4bcf-8ee0-a7a72586c6a7.toml
query_type: eql
query_language: eql
indicators:
- type: data_source
  value: Elastic Defend
  confidence: high
- type: operating_system
  value: macOS
  confidence: high
false_positives:
- description: 'False positive analysis


    - System processes or legitimate applications may occasionally remove the quarantine
    attribute as part of their normal operation. Users can create exceptions for known
    safe processes by adding them to the exclusion list in the detection rule.

    - Software updates or installations from trusted vendors might trigger the rule
    if they are not properly signed. Verify the legitimacy of the software and consider
    adding the specific executable path to the exclusion list if it is d'
  mitigation: Review investigation guide for details
references:
- https://nixhacker.com/security-protection-in-macos-1/
- https://eclecticlight.co/2020/10/29/quarantine-and-the-quarantine-flag/
has_investigation_guide: true
risk_score: 47
