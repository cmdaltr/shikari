technique_id: T1562.001
technique_name: Potential Disabling of SELinux
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"linux\" and event.type == \"start\" and\n\
  \ event.action in (\"exec\", \"exec_event\", \"start\", \"ProcessRollup2\", \"executed\"\
  , \"process_started\") and\n process.name == \"setenforce\" and process.args ==\
  \ \"0\""
explanation: 'Identifies potential attempts to disable Security-Enhanced Linux (SELinux),
  which is a Linux kernel security feature to

  support access control policies. Adversaries may disable security tools to avoid
  possible detection of their tools and

  activities.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/eb9eb8ba-a983-41d9-9c93-a1c05112ca5e.toml
