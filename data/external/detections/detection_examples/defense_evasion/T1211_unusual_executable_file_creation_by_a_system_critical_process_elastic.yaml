technique_id: T1211
technique_name: Unusual Executable File Creation by a System Critical Process
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "file where host.os.type == \"windows\" and event.type != \"deletion\" and\n\
  \  file.extension : (\"exe\", \"dll\") and\n  process.name : (\"smss.exe\",\n  \
  \                \"autochk.exe\",\n                  \"csrss.exe\",\n          \
  \        \"wininit.exe\",\n                  \"services.exe\",\n               \
  \   \"lsass.exe\",\n                  \"winlogon.exe\",\n                  \"userinit.exe\"\
  ,\n                  \"LogonUI.exe\")"
explanation: 'Identifies an unexpected executable file being created or modified by
  a Windows system critical process, which may

  indicate activity related to remote code execution or other forms of exploitation.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e94262f2-c1e9-4d3f-a907-aeab16712e1a.toml
