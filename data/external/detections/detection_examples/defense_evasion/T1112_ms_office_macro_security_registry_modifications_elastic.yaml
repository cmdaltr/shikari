false_positives:
- description: 'False positive analysis


    - This activity should not happen legitimately. The security team should address
    any potential benign true positive (B-TP), as this configuration can put the user
    and the domain at risk.


    ### Response and remediation


    - Initiate the incident response process based on the outcome of the triage.

    - Reset the registry key value.

    - Isolate the involved host to prevent further post-compromise behavior.

    - Investigate credential exposure on systems compromised or used by the att'
  mitigation: Review investigation guide for details
has_investigation_guide: true
