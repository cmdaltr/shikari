technique_id: T1112
technique_name: MS Office Macro Security Registry Modifications
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\n\
  \    registry.value : (\"AccessVBOM\", \"VbaWarnings\") and\n    registry.data.strings\
  \ : (\"0x00000001\", \"1\")\n\n/*\n    Full registry key paths omitted due to data\
  \ source variations:\n    \"HKCU\\\\S-1-*\\\\SOFTWARE\\\\Microsoft\\\\Office\\\\\
  *\\\\Security\\\\AccessVBOM\"\n    \"HKCU\\\\S-1-*\\\\SOFTWARE\\\\Microsoft\\\\\
  Office\\\\*\\\\Security\\\\VbaWarnings\"\n*/"
explanation: 'Microsoft Office Products offer options for users and developers to
  control the security settings for running and using

  Macros. Adversaries may abuse these security settings to modify the default behavior
  of the Office Application to trust

  future macros and/or disable security warnings, which could increase their chances
  of establishing persistence.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/feeed87c-5e95-4339-aef1-47fd79bcfbe3.toml
query_type: eql
query_language: eql
