technique_id: T1222
technique_name: System File Ownership Change
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.91
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n   (process.name : \"icacls.exe\" and process.args : \"/reset\") or\n   (process.name\
  \ : \"takeown.exe\" and process.args : \"/f\") or\n   (process.name : \"icacls.exe\"\
  \ and process.args : \"/grant\" and process.args : \"Everyone:F\")\n   ) and\n \
  \  process.command_line : \"*.exe *C:\\\\Windows\\\\*\""
explanation: Adversaries may modify file or directory ownership to evade access control
  lists (ACLs) and access protected files.
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/7eb54028-ca72-4eb7-8185-b6864572347db.toml
