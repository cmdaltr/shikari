false_positives:
- description: 'False positive analysis


    - Legitimate use of PRoot for cross-distribution development or testing environments
    may trigger alerts. Users can create exceptions for known development teams or
    specific projects that require PRoot for legitimate purposes.

    - System administrators using PRoot for system maintenance or migration tasks
    might be flagged. To mitigate this, document and whitelist these activities by
    correlating them with scheduled maintenance windows or specific administrator
    accounts.

    - Se'
  mitigation: Review investigation guide for details
