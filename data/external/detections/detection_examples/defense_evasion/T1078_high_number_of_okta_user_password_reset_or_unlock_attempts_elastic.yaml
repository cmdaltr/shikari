technique_id: T1078
technique_name: High Number of Okta User Password Reset or Unlock Attempts
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "event.dataset:okta.system and\n  event.action:(system.email.account_unlock.sent_message\
  \ or system.email.password_reset.sent_message or\n                system.sms.send_account_unlock_message\
  \ or system.sms.send_password_reset_message or\n                system.voice.send_account_unlock_call\
  \ or system.voice.send_password_reset_call or\n                user.account.unlock_token)"
explanation: 'Identifies a high number of Okta user password reset or account unlock
  attempts. An adversary may attempt to obtain

  unauthorized access to Okta user accounts using these methods and attempt to blend
  in with normal activity in their

  target''s environment and evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/e90ee3af-45fc-432e-a850-4a58cf14a457.toml
query_type: threshold
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'False positive analysis:

    - This alert might be a false positive if there are legitimate reasons for a high
    number of password reset or unlock attempts. This could be due to the user forgetting
    their password or account lockouts due to too many incorrect attempts.

    - Check the actor''s past behavior. If this is their usual behavior and they have
    a valid reason for it, then it might be a false positive.


    ### Response and remediation:

    - If unauthorized attempts are confirmed, initiate the incident re'
  mitigation: Review investigation guide for details
references:
- https://developer.okta.com/docs/reference/api/system-log/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/testing-okta-visibility-and-detection-dorothy
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 47
