false_positives:
- description: 'False positive analysis


    - Installation or update processes like msiexec.exe may trigger registry changes
    as part of legitimate software installations. Exclude these by adding exceptions
    for msiexec.exe when registry data strings include mso.dll.

    - System maintenance tasks using regsvr32.exe might modify SIP provider-related
    registry entries. Exclude regsvr32.exe when registry data strings match WINTRUST.DLL
    to prevent false alerts.

    - Regular updates or patches from trusted software vendors may'
  mitigation: Review investigation guide for details
references:
- https://github.com/mattifestation/PoCSubjectInterfacePackage
