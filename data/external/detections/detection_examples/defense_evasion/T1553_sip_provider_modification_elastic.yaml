technique_id: T1553
technique_name: SIP Provider Modification
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "registry where host.os.type == \"windows\" and event.type == \"change\" and\
  \ registry.value : (\"Dll\", \"$Dll\") and\n  registry.path: (\n    \"*\\\\SOFTWARE\\\
  \\Microsoft\\\\Cryptography\\\\OID\\\\EncodingType 0\\\\CryptSIPDllPutSignedDataMsg\\\
  \\{*}\\\\Dll\",\n    \"*\\\\SOFTWARE\\\\WOW6432Node\\\\Microsoft\\\\Cryptography\\\
  \\OID\\\\EncodingType 0\\\\CryptSIPDllPutSignedDataMsg\\\\{*}\\\\Dll\",\n    \"\
  *\\\\SOFTWARE\\\\Microsoft\\\\Cryptography\\\\Providers\\\\Trust\\\\FinalPolicy\\\
  \\{*}\\\\$Dll\",\n    \"*\\\\SOFTWARE\\\\WOW6432Node\\\\Microsoft\\\\Cryptography\\\
  \\Providers\\\\Trust\\\\FinalPolicy\\\\{*}\\\\$Dll\"\n    ) and\n  registry.data.strings:\"\
  *.dll\" and\n  not (process.name : \"msiexec.exe\" and registry.data.strings : \"\
  mso.dll\") and\n  not (process.name : \"regsvr32.exe\" and registry.data.strings\
  \ == \"WINTRUST.DLL\")"
explanation: 'Identifies modifications to the registered Subject Interface Package
  (SIP) providers. SIP providers are used by the

  Windows cryptographic system to validate file signatures on the system. This may
  be an attempt to bypass signature

  validation checks or inject code into critical processes.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/f2c7b914-eda3-40c2-96ac-d23ef91776ca.toml
query_type: eql
query_language: eql
