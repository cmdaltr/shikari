technique_id: T1562
technique_name: Potential NetNTLMv1 Downgrade Attack
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.93
validated: true
query: "registry where host.os.type == \"windows\" and event.action != \"deletion\"\
  \ and\n registry.value == \"LmCompatibilityLevel\" and registry.data.strings in\
  \ (\"2\", \"1\", \"0\", \"0x00000002\", \"0x00000001\", \"0x00000000\")"
explanation: 'Identifies registry modification to force the system to fall back to
  NTLMv1 for authentication. This modification is

  possible with local administrator privileges and is commonly referred to as a `NetNTLMv1
  downgrade attack`.'
source: Elastic Detection Rules
