technique_id: T1036.003
technique_name: Renamed Utility Executed with Short Program Name
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.88
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\
  \ length(process.name) > 0 and\n length(process.name) == 5 and length(process.pe.original_file_name)\
  \ > 5"
explanation: 'Identifies the execution of a process with a single character process
  name, differing from the original file name. This

  is often done by adversaries while staging, executing temporary utilities, or trying
  to bypass security detections based

  on the process name.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/17c7f6a5-5bc9-4e1f-92bf-13632d24384d.toml
