false_positives:
- description: 'False positive analysis


    - Legitimate software updates or installations may temporarily execute trusted
    Microsoft programs from non-standard paths. Users can create exceptions for known
    update processes to prevent false alerts.

    - Custom enterprise applications might use renamed instances of trusted Microsoft
    programs for legitimate purposes. Identify and whitelist these specific applications
    to avoid unnecessary alerts.

    - Virtual environments or sandboxed applications may execute trusted program'
