query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (\n    process.name : (\"WinWord.exe\", \"EXPLORER.EXE\", \"w3wp.exe\", \"DISM.EXE\"\
  ) or\n    ?process.pe.original_file_name : (\"WinWord.exe\", \"EXPLORER.EXE\", \"\
  w3wp.exe\", \"DISM.EXE\")\n  ) and\n  not process.executable : (\n          \"\\\
  \\\\\\?\\\\Volume{????????-????-????-????-????????????}\\\\Windows\\\\System32\\\
  \\inetsrv\\\\w3wp.exe\",\n          \"?:\\\\PROGRA~?\\\\MICROS~?\\\\Office??\\\\\
  winword.exe\",\n          \"?:\\\\Program Files\\\\Microsoft Office\\\\*\\\\winword.exe\"\
  ,\n          \"?:\\\\Program Files\\\\Microsoft Office ??\\\\*\\\\winword.exe\"\
  ,\n          \"?:\\\\Program Files\\\\WindowsApps\\\\Microsoft.Office.Desktop.*\\\
  \\Office??\\\\winword.exe\",\n          \"?:\\\\Program Files (x86)\\\\Microsoft\
  \ Office\\\\*\\\\winword.exe\",\n          \"?:\\\\Program Files (x86)\\\\Windows\
  \ Kits\\\\*Assessment and Deployment Kit\\\\Deployment Tools\\\\amd64\\\\DISM\\\\\
  dism.exe\",\n          \"?:\\\\Windows\\\\explorer.exe\",\n          \"?:\\\\Windows\\\
  \\System32\\\\Dism.exe\",\n          \"?:\\\\Windows\\\\System32\\\\inetsrv\\\\\
  w3wp.exe\",\n          \"?:\\\\Windows\\\\SysWOW64\\\\Dism.exe\",\n          \"\
  ?:\\\\Windows\\\\SysWOW64\\\\explorer.exe\",\n          \"?:\\\\Windows\\\\SysWOW64\\\
  \\inetsrv\\\\w3wp.exe\"\n  ) and\n  /* Crowdstrike specific exclusion as it uses\
  \ NT Object paths */\n  not\n  (\n    data_stream.dataset == \"crowdstrike.fdr\"\
  \ and\n    process.executable : (\n        \"\\\\Device\\\\HarddiskVolume*\\\\Program\
  \ Files\\\\Microsoft Office\\\\*\\\\winword.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Program Files\\\\Microsoft Office ??\\\\*\\\\winword.exe\",\n        \"\\\\Device\\\
  \\HarddiskVolume*\\\\Program Files\\\\WindowsApps\\\\Microsoft.Office.Desktop.*\\\
  \\Office??\\\\winword.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\Program\
  \ Files (x86)\\\\Microsoft Office\\\\*\\\\winword.exe\",\n        \"\\\\Device\\\
  \\HarddiskVolume*\\\\Program Files (x86)\\\\Windows Kits\\\\10\\\\Assessment and\
  \ Deployment Kit\\\\Deployment Tools\\\\amd64\\\\DISM\\\\dism.exe\",\n        \"\
  \\\\Device\\\\HarddiskVolume*\\\\Windows\\\\explorer.exe\",\n        \"\\\\Device\\\
  \\HarddiskVolume*\\\\Windows\\\\System32\\\\Dism.exe\",\n        \"\\\\Device\\\\\
  HarddiskVolume*\\\\Windows\\\\System32\\\\inetsrv\\\\w3wp.exe\",\n        \"\\\\\
  Device\\\\HarddiskVolume*\\\\Windows\\\\SysWOW64\\\\Dism.exe\",\n        \"\\\\\
  Device\\\\HarddiskVolume*\\\\Windows\\\\SysWOW64\\\\explorer.exe\",\n        \"\\\
  \\Device\\\\HarddiskVolume*\\\\Windows\\\\SysWOW64\\\\inetsrv\\\\w3wp.exe\"\n  \
  \  )\n  )"
explanation: 'Identifies an instance of a Windows trusted program that is known to
  be vulnerable to DLL Search Order Hijacking

  starting after being renamed or from a non-standard path. This is uncommon behavior
  and may indicate an attempt to evade

  defenses via side loading a malicious DLL within the memory space of one of those
  processes.'
