technique_id: T1562
technique_name: Azure Kubernetes Events Deleted
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: 'event.dataset:azure.activitylogs and azure.activitylogs.operation_name:"MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/EVENTS.K8S.IO/EVENTS/DELETE"
  and

  event.outcome:(Success or success)'
explanation: 'Identifies when events are deleted in Azure Kubernetes. Kubernetes events
  are objects that log any state changes.

  Example events are a container creation, an image pull, or a pod scheduling on a
  node. An adversary may delete events in

  Azure Kubernetes in an attempt to evade detection.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/8b64d36a-1307-4b2e-a77b-a0027e4d27c8.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: Azure
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance activities by authorized personnel may trigger deletion
    events. To manage this, create exceptions for known maintenance windows or specific
    user accounts responsible for these tasks.

    - Automated scripts or tools used for log rotation or cleanup might delete events
    as part of their normal operation. Identify these scripts and exclude their activity
    from triggering alerts by whitelisting their associated service accounts or IP
    addresses.

    - Misconfigur'
  mitigation: Review investigation guide for details
references:
- https://docs.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations#microsoftkubernetes
has_investigation_guide: true
risk_score: 47
