    frequently used for diagnostics.

    - Automated scripts or software updates that utilize MSDT for legitimate purposes
    can cause false positives. Identify these scripts and whitelist their execution
    paths or parent processes.

    - Custom diagnostic tools that leverage MSDT might be flagged. Review these tools
    and ex'
