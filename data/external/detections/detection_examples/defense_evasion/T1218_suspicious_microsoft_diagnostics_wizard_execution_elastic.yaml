technique_id: T1218
technique_name: Suspicious Microsoft Diagnostics Wizard Execution
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "process where host.os.type == \"windows\" and event.type == \"start\" and\n\
  \  (?process.pe.original_file_name == \"msdt.exe\" or process.name : \"msdt.exe\"\
  ) and\n  (\n    process.args : (\"IT_RebrowseForFile=*\", \"*FromBase64*\", \"*/../../../*\"\
  , \"*PCWDiagnostic*\") or\n    (\n      process.args : \"-af\" and process.args\
  \ : \"/skip\" and\n      process.parent.name : (\"explorer.exe\", \"cmd.exe\", \"\
  powershell.exe\", \"cscript.exe\", \"wscript.exe\", \"mshta.exe\", \"rundll32.exe\"\
  , \"regsvr32.exe\") and\n      process.args : (\"?:\\\\WINDOWS\\\\diagnostics\\\\\
  index\\\\PCWDiagnostic.xml\", \"PCWDiagnostic.xml\", \"?:\\\\Users\\\\Public\\\\\
  *\", \"?:\\\\Windows\\\\Temp\\\\*\")\n    ) or\n\n    (process.pe.original_file_name\
  \ == \"msdt.exe\" and not process.name : \"msdt.exe\" and process.name != null)\
  \ or\n\n    (\n      ?process.pe.original_file_name == \"msdt.exe\" and\n      not\
  \ process.executable : (\n        \"?:\\\\Windows\\\\system32\\\\msdt.exe\",\n \
  \       \"?:\\\\Windows\\\\SysWOW64\\\\msdt.exe\",\n        /* Crowdstrike specific\
  \ exclusion as it uses NT Object paths */\n        \"\\\\Device\\\\HarddiskVolume*\\\
  \\Windows\\\\system32\\\\msdt.exe\",\n        \"\\\\Device\\\\HarddiskVolume*\\\\\
  Windows\\\\SysWOW64\\\\msdt.exe\"\n      )\n    )\n  )"
explanation: 'Identifies potential abuse of the Microsoft Diagnostics Troubleshooting
  Wizard (MSDT) to proxy malicious command or

  binary execution via malicious process arguments.'
source: Elastic Detection Rules
