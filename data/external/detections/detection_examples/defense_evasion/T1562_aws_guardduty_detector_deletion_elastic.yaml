technique_id: T1562
technique_name: AWS GuardDuty Detector Deletion
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: event.dataset:aws.cloudtrail and event.provider:guardduty.amazonaws.com and
  event.action:DeleteDetector and event.outcome:success
explanation: 'Identifies the deletion of an Amazon GuardDuty detector. Upon deletion,
  GuardDuty stops monitoring the environment and

  all existing findings are lost.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/523116c0-d89d-4d7c-82c2-39e6845a78ef.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: AWS
  confidence: high
- type: data_source
  value: Amazon Web Services
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance or administrative actions may lead to the deletion of a
    GuardDuty detector. Verify if the deletion aligns with scheduled maintenance or
    administrative tasks.

    - Automated scripts or tools used for environment cleanup might inadvertently
    delete detectors. Review and adjust automation scripts to prevent unintended deletions.

    - Organizational policy changes or restructuring could result in detector deletions.
    Ensure that policy changes are communicated'
  mitigation: Review investigation guide for details
references:
- https://awscli.amazonaws.com/v2/documentation/api/latest/reference/guardduty/delete-detector.html
- https://docs.aws.amazon.com/guardduty/latest/APIReference/API_DeleteDetector.html
has_investigation_guide: true
risk_score: 73
