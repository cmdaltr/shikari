technique_id: T1550
technique_name: Unauthorized Scope for Public App OAuth2 Token Grant with Client Credentials
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.95
validated: true
query: "event.dataset: okta.system\n    and event.action: \"app.oauth2.as.token.grant\"\
  \n    and okta.actor.type: \"PublicClientApp\"\n    and okta.debug_context.debug_data.flattened.grantType:\
  \ \"client_credentials\"\n    and okta.outcome.result: \"FAILURE\"\n    and not\
  \ okta.client.user_agent.raw_user_agent: \"Okta-Integrations\"\n    and not okta.actor.display_name:\
  \ (Okta* or Datadog)\n    and not okta.debug_context.debug_data.flattened.requestedScopes:\
  \ (\"okta.logs.read\" or \"okta.eventHooks.read\" or \"okta.inlineHooks.read\")\n\
  \    and okta.outcome.reason: \"no_matching_scope\""
explanation: 'Identifies a failed OAuth 2.0 token grant attempt for a public client
  app using client credentials. This event is

  generated when a public client app attempts to exchange a client credentials grant
  for an OAuth 2.0 access token, but

  the request is denied due to the lack of required scopes. This could indicate compromised
  client credentials in which an

  adversary is attempting to obtain an access token for unauthorized scopes. This
  is a [New

  Terms](https://www.elastic.co/guide/en/security/current/rules-ui-create.html#create-new-terms-rule)
  rule where the

  `okta.actor.display_name` field value has not been seen in the last 14 days regarding
  this event.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/6649e656-6f85-11ef-8876-f661ea17fbcc.toml
query_type: new_terms
query_language: kuery
indicators:
- type: data_source
  value: Okta
  confidence: high
false_positives:
- description: 'false positives.

    - Correlate the event with other security logs or alerts to identify any patterns
    or additional suspicious activities related to the same client credentials or
    IP address.


    ### False positive analysis


    - Frequent legitimate access attempts by known public client apps may trigger
    false positives. To manage this, consider creating exceptions for specific `okta.actor.display_name`
    values that are known to frequently request scopes without malicious intent.

    - Automated processes or'
  mitigation: Review investigation guide for details
references:
- https://github.blog/news-insights/company-news/security-alert-stolen-oauth-user-tokens/
- https://developer.okta.com/docs/reference/api/event-types/
- https://www.elastic.co/security-labs/monitoring-okta-threats-with-elastic-security
- https://www.elastic.co/security-labs/starter-guide-to-understanding-okta
has_investigation_guide: true
risk_score: 47
