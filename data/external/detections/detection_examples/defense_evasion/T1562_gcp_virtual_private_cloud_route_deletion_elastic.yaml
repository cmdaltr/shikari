technique_id: T1562
technique_name: GCP Virtual Private Cloud Route Deletion
tactic: defense_evasion
platform: Elastic
fidelity_score: 0.9
validated: true
query: event.dataset:gcp.audit and event.action:v*.compute.routes.delete and event.outcome:success
explanation: 'Identifies when a Virtual Private Cloud (VPC) route is deleted in Google
  Cloud Platform (GCP). Google Cloud routes

  define the paths that network traffic takes from a virtual machine (VM) instance
  to other destinations. These

  destinations can be inside a Google VPC network or outside it. An adversary may
  delete a route in order to impact the

  flow of network traffic in their target''s cloud environment.'
source: Elastic Detection Rules
source_url: https://github.com/elastic/detection-rules/tree/main/rules/a17bcc91-297b-459b-b5ce-bc7460d8f82a.toml
query_type: query
query_language: kuery
indicators:
- type: data_source
  value: GCP
  confidence: high
- type: data_source
  value: Google Cloud Platform
  confidence: high
false_positives:
- description: 'False positive analysis


    - Routine maintenance activities by network administrators can trigger route deletions.
    To manage this, create exceptions for known maintenance windows or specific administrator
    accounts.

    - Automated scripts or tools used for network configuration updates may delete
    and recreate routes as part of their normal operation. Identify these scripts
    and exclude their actions from triggering alerts.

    - Cloud infrastructure changes during deployment processes might involve tempora'
  mitigation: Review investigation guide for details
references:
- https://cloud.google.com/vpc/docs/routes
- https://cloud.google.com/vpc/docs/using-routes
has_investigation_guide: true
risk_score: 47
